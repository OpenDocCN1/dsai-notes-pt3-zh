    +   - 本章考虑的学习问题

    +     - 已知

    +       - 一个训练样例集合D，可能包含差错

    +       - 一个领域理论B，可能包含差错

    +       - 候选假设的空间H

    +     - 求解

    +       - 一个最好地拟合训练样例和领域理论的假设

    +   - 最好地拟合训练样例和领域理论的确定定义

    +     arg min_{h∈H} k_D error_D(h) + k_B error_B(h)'
  - '[PAGE 161]


    # 学习的归纳-分析途径（2）


    +   - 确定先验知识和数据权值的一种解决方法是使用贝叶斯观点

    +     - 贝叶斯定律描述了怎样计算给定训练数据D时假设h的后验概率

    +     - 贝叶斯定律基于观察到的数据D以及先验知识计算后验概率，以P(h), P(D)和P(D|h)的形式表示

    +     - 我们可以把P(h), P(D)和P(D|h)看作是某种形式的背景知识

    +     - 贝叶斯理论可看作一种为领域理论加权的方法，它与观察到的数据D一起，赋予h的后验概率为P(h|D)

    +     - 贝叶斯公式提供了为先验知识和观察到数据的贡献加权的方法

    +   - 但是，贝叶斯公式隐含假定了关于P(h), P(D), P(D|h)概率分布的完美知识

    +   - 贝叶斯公式没有提供将这些近似已知的概率分布与观察数据结合起来的方法'
