    +   - 定理7.1（变型空间的ε-详尽化）

    +     - 若假设空间H有限，且D为目标概念c的一系列m>=1个独立随机抽取的样例，那么对于任意0<=ε<=1，变型空间VS_H,D不是ε-详尽的概率小于或等于：|H|e^{-εm}

