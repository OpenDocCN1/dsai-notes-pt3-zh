    # 表10-4 基本的FOIL算法


    FOIL(Target_predicate, Predicates, Examples)


    +   - Pos←Examples中Target_predicate为True的成员

    +   - Neg←Examples中Target_predicate为False的成员

    +   - Learned_rules←{}

    +   - 当Pos不空，学习NewRule

    +     - NewRule←没有前提的谓词Target_predicate规则

    +     - NewRule←Neg

    +     - 当NewRuleNeg不空，增加新文字以特化NewRule

    +       - Candidate_literals←对NewRule生成候选新文字，基于Predicate

    +       - Best_literal← arg max_{L∈Candidate_literals} Foil_Gain(L, NewRule)

    +       - 把Best_literal加入到NewRule的前提

    +       - NewRuleNeg←NewRuleNeg中满足NewRule前提的子集

    +     - Learned_rules←Learned_rules+NewRule

    +     - Pos←Pos-{被NewRule覆盖的Pos成员}

    +   - 返回Learned_rules'
