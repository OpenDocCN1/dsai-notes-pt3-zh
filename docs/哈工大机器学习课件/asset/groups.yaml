    +     - 如何近似地检验多个学习算法？

    +     - 如何确定两个算法之间的差异在统计上是有意义的？

    +   - 假设有L_A和L_B两个算法，要确定为了学习一特定目标函数f，平均来说那个算法更好

    +   - 定义“平均”的一种合理方法是，从一基准实例分布中抽取包含n个样例的训练集合，在所有这样的集合中测量两个算法的平均性能，即 $E_{S\subset
    D}[error_D(L_A(S)) - error_D(L_B(S))]$'
  md: "\n## 估计量、偏差和方差（4）\n\n- 一个例子\n  - n=40个随机样例\n  - r=12个错误\n  - errorₛ(h)的标准差\n\
    \n- 一般地，若在n个随机选取的样本中有r个错误，errorₛ(h)的标准差是：\n\nσ_errorₛ(h) = σ_e / √n = √[p(1-p)/n]\n\
    \n近似地\n\nσ_errorₛ(h) = √[errorₛ(h)(1 - errorₛ(h))/n]\n\n## 置信区间\n\n- 通常描述某估计的不确定性的方法是使用置信区间，真实的值以一定的概率落入该区间中，这样的估计称为置信区间估计\n\
    - 定义：某个参数p的N%置信区间是一个以N%的概率包含p的区间\n- 由于估计量error_S(h)服从二项分布，这一分布的均值为error_D(h)，标准差可由式5.9计算，因此，为计算95%置信区间，只需要找到一个以error_D(h)为中心的区间，它的宽度足以包含该分布全部概率的95%\n\
    - 这提供了一个包围error_D(h)的区间，使error_S(h)有95%机会落入其中，同样它也指定了error_D(h)有95%的机会落入包围error_S(h)的区间大小\n\
    \n## 置信区间（2）\n\n- 对于二项分布，计算置信区间很烦琐，多数情况下，计算它的近似值\n- 对于足够大的样本，二项分布可以由正态分布来近似，而正态分布的置信区间容易得到\n\
    - 如果随机变量Y服从均值为μ，标准差为σ的一个正态分布，那么Y的任一观察值y有N%的机会落入下面的区间 μ±z_N σ\n- 相似地，均值μ有N%的机会落入下面的区间\
    \ y±z_N σ\n\n## 置信区间（3）\n\n- 式子5.1的三步推导过程\n  - errorₛ(h)遵从二项分布，其均值为error_D(h)，标准差如式5.9所示\n\
    \  - 对于足够大的样本n，二项分布非常近似于正态分布\n  - 式5.11告诉我们如何根据正态分布的均值求出N%置信区间\n- 式子5.1的推导中有两个近似\n\
    \  - 估计errorₛ(h)的标准差，我们将error_D(h)近似为errorₛ(h)\n  - 用正态分布近似二项分布\n- 统计学的一般规则表明，这两个近似在n>=30或np(1-p)>=5时工作得很好，对于较小的n值，最好使用列表的形式给出二项分布的具体值\n\
    \n## 双侧和单侧边界\n\n- 上述的置信区间是双侧的，有时用到单侧边界\n- 例如问题 “error_D(h)至多为U的概率”，在只要限定h的最大错误率，而不在乎真实错误率是否小于估计错误率时，很自然提出这种问题\n\
    - 由于正态分布关于其均值对称，因此，任意正态分布上的双侧置信区间能够转换为相应的单侧区间，置信度为原来的两倍（见图5-1b）\n- 由一个有下界L和上界U的100(1-α)%置信区间，可得到一个下界为L且无上界的100(1-α/2)%置信区间，也得到一个有上界U且无下界的100(1-α/2)%置信区间\n\
    \n## 推导置信区间的一般方法\n\n- 前面介绍的是针对一特定情况推导置信区间估计：基于独立抽取的n个样本，估计离散值假设的error_D(h)\n-\
    \ 本节介绍的方法是在许多估计问题中用到的通用的方法\n- 基于大小为n的随机抽取样本的均值，来估计总体均值的问题\n\n## 通用的过程的步骤\n\n-\
    \ 确定基准总体中要估计的参数p，例如error_D(h)\n- 定义一个估计量Y（如error_S(h)），它的选择应为最小方差的无偏估计量\n- 确定控制估计量Y的概率分布D_Y，包括其均值和方差\n\
    - 通过寻找阈值L和U确定N%置信区间，以使这个按D_Y分布的随机变量有N%机会落入L和U之间\n\n## 中心极限定理\n\n- 考虑如下的一般框架\n\
    \  - 在n个独立抽取的且服从同样概率分布的随机变量 Y₁…Yₙ 中观察试验值\n  - 令μ代表每一变量Yᵢ服从的未知分布的均值，并令σ代表标准差，称这些变量Yᵢ为独立同分布随机变量\n\
    \  - 为了估计Yi服从的分布的均值μ，我们计算样本的均值 Ȳₙ = 1/n Σᵢ₌₁ⁿ Yᵢ\n  - 中心极限定理说明在n→∞时，Ȳₙ所服从的概率分布为一正态分布，而不论Yi本身服从什么样的分布\n\
    \  - Ȳₙ服从的分布均值为μ，而标准差为 σ/√n\n\n## 中心极限定理（2）\n\n- 定理5.1（中心极限定理）考虑独立同分布的随机变量Y₁...Yₙ的集合，它们服从一任意的概率分布，均值为μ，有限方差为σ²，定义样本均值为Ȳₙ=1/n\
    \ Σᵢ₌₁ⁿ Yᵢ，当n→∞时，式子 (Ȳₙ - μ)/(σ/√n) 服从正态分布，均值为0且标准差为1\n- 中心极限定理说明在不知道独立的Yi所服从的基准分布的情况下，我们可以得知样本均值的分布形式，说明了怎样使用\
    \ Ȳ 的均值和方差来确定独立的Yi的均值和方差\n- 中心极限定理说明了任意样本均值的估计量服从的分布在n足够大时可以近似为正态分布\n\n## 两个假设错误率间的差异\n\
    \n- 问题：\n  - 考虑某离散目标函数的两个假设h₁和h₂，h₁在一拥有n₁个随机抽取的样例的样本S₁上测试，h₂在一拥有n₂个从相同分布中抽取的样例的样本S₂上测试，要估计这两个假设的真实错误率间的差异\n\
    \    d=error_D(h₁)-error_D(h₂)\n\n## 两个假设错误率间的差异（2）\n\n- 使用5.4节中描述的四个步骤来推导d的置信区间估计\n\
    \  - 确定待估计的参数，如上所述的d\n  - 定义一估计量，\\hat{d}=error_{S1}(h1)-error_{S2}(h2)\n  - \\\
    hat{d}是d的无偏估计量，即E[\\hat{d}]=d。\\hat{d}由于对于较大的n1和n2，error_{S1}(h1)和error_{S2}(h2)都近似遵从正态分布，两个正态分布的差仍为正态分布，方差为两个正态分布的方差的和\n\
    \    \\sigma_{\\hat{d}}^2 \\approx \\frac{error_{S1}(h1)(1-error_{S1}(h1))}{n1}\
    \ + \\frac{error_{S2}(h2)(1-error_{S2}(h2))}{n2}\n  - 现在知道了\\hat{d}服从均值为d、方差为\\\
    sigma2的正态分布，因此d的N%置信区间是 \\hat{d} \\pm z_N \\sigma\n\n## 两个假设错误率间的差异（3）\n\n- 上面分析的是h₁和h₂在相互独立的数据样本上测试的情况，如果在同一个样本上测试h₁和h₂，那么也可以使用公式5.13计算置信区间\n\
    - 这种情况下的方差通常小于式子5.12给出的方差，这是因为单个样本消除了两个样本组合带来的随机差异，这样，由式子5.13给出的置信区间一般来说偏于保守，但结果是正确的\n\
    \n## 假设检验\n\n- 有时感兴趣的是某个特定猜想正确的概率，而不是对某参数的置信区间估计。比如：error_D(h₁)>error_D(h₂)的可能性有多大？\n\
