  - '[PAGE 196]


    # 术语解释


    +   - 来自统计模式识别领域的术语

    +     - 回归：逼近一个实数值的目标函数

    +     - 残差：逼近目标函数时的误差 $\hat{f}(x)-f(x)$

    +     - 核函数：一个距离函数，用来决定每个训练样例的权值，就是使 $w_i = K(d(x_i, x_q))$ 的函数 K'
  - '[PAGE 197]


    # 局部加权回归


    +   - 前面描述的最近邻方法可以被看作在单一的查询点 x=x_q 上逼近目标函数 f(x)

    +   - 局部加权回归是上面方法的推广，它在环绕 x_q 的局部区域内为目标函数 f 建立明确的逼近

    +   - 局部加权回归使用附近的或距离加权的训练样例来形成对的局部逼近

    +   - 例如，使用线性函数、二次函数、多层神经网络在环绕 x_q 的邻域内逼近目标函数

    +   - 局部加权回归的名称解释

    +     - 局部：目标函数的逼近仅仅根据查询点附近的数据

    +     - 加权：每个训练样例的贡献由它与查询点间的距离加权得到

    +     - 回归：表示逼近实数值函数的问题'
  - '[PAGE 198]


