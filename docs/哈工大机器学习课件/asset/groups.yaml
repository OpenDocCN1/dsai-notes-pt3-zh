    \n## 其他概念类别的PAC可学习性\n（3）\n\n- 令人吃惊的是，虽然k项DNF不是PAC可学习的，但存在一个更大的概念类是PAC可学习的\n- 这个更大的概念类是K-CNF，它有每样例的多项式级时间复杂度，又有多项式级的样本复杂度\n\
    - K-CNF：任意长度的合取式T₁∧...∧Tⱼ，其中每个Tᵢ为最多k个布尔变量的析取\n- 容易证明K-CNF包含了K项DNF，因此概念类k项DNF是使用H=K-CNF的一个有效算法可PAC学习的\n\
    \n## 无限假设空间的样本复杂度\n\n- 式子7.2用|H|刻画样本复杂度有两个缺点：\n  - 可能导致非常弱的边界\n  - 对于无限假设空间的情形，无法应用\n\
    - 本节考虑H的复杂度的另一种度量，称为H的Vapnik-Chervonenkis维度（简称VC维或VC(H)）\n- 使用VC维代替|H|也可以得到样本复杂度的边界，基于VC维的样本复杂度比|H|更紧凑，另外还可以刻画无限假设空间的样本复杂度\n\
    \n## 打散一个实例集合\n\n- VC维衡量假设空间复杂度的方法不是用不同假设的数量|H|，而是用X中能被H彻底区分的不同实例的数量\n- S是一个实例集，H中每个h导致S的一个划分，即h将S分割为两个子集{x∈S|h(x)=1}和{x∈S|h(x)=0}\n\
    - 定义：一实例集S被假设空间H打散，当且仅当对S的每个划分，存在H中的某假设与此划分一致\n- 如果一实例集合没有被假设空间打散，那么必然存在某概念可被定义在实例集之上，但不能由假设空间表示\n\
    - H的这种打散实例集合的能力是其表示这些实例上定义的目标概念的能力的度量\n\n## Vapnik-Chervonenkis维度\n\n- 打散一实例集合的能力与假设空间的归纳偏置紧密相关\n\
    - 无偏的假设空间能够打散所有实例组成的集合X\n- 直观上，被打散的X的子集越大，H的表示能力越强\n- 定义：定义在实例空间X上的假设空间H的Vapnik-Chervonenkis维，是可被H打散的X的最大有限子集的大小\n\
    - 如果X的任意有限大的子集可被H打散，则VC(H)=∞\n\n## Vapnik-Chervonenkis维度（2）\n\n- 对于任意有限的H， VC(H)<=log₂|H|\n\
    - VC维举例\n  - 假定实例空间X为实数集合，而且H为实数轴上的区间的集合，问VC(H)是多少？\n    - 只要找到能被H打散的X的最大子集，首先包含2个实例的集合能够被H打散，其次包含3个实例的集合不能被H打散，因此VC(H)=2\n\
    \  - 实例集合S对应x、y平面上的点，令H为此平面内所有线性决策面的集合，问H的VC维是多少？\n    - 能够找到3个点组成的集合，被H打散，但无法找到能够被H打散的4个点组成的集合，因此VC(H)=3\n\
    \    - 更一般地，在r维空间中，线性决策面的VC维为r+1\n\n## Vapnik-Chervonenkis维度（3）\n\n- 假设X上每个实例由恰好3个布尔文字的合取表示，而且假设H中每个假设由至多3个布尔文字描述，问VC(H)是多少？\n\
    \  - 找到下面3个实例的集合\n    - instance₁: 100\n    - instance₂: 010\n    - instance₃:\
    \ 001\n  - 这三个实例的集合可被H打散，可对如下任意所希望的划分建立一假设：如果该划分要排除instanceᵢ，就将文字¬lᵢ加入到假设中\n \
    \ - 此讨论很容易扩展到特征数为n的情况，n个布尔文字合取的VC维至少为n\n  - 实际就是n，但证明比较困难，需要说明n+1个实例的集合不可能被打散\n\
    \n## 样本复杂度和VC维\n\n- 使用VC维作为H复杂度的度量，就有可能推导出该问题的另一种解答，类似于式子7.2的边界，即（Blumer el al.\
    \ 1989）\n  $m \\ge \\frac{1}{\\varepsilon}(4\\log_2(2/\\delta)+8VC(H)\\log_2(13/\\\
    varepsilon))$\n- 定理7.3：样本复杂度的下界（Ehrenfeucht et al. 1989）\n  - 考虑任意概念类C，且VC(C)>=2，任意学习器L，以及任意\
    \ 0<ε<1/8，0<δ<1/100。存在一个分布D以及C中一个目标概念，当L观察到的样例数目小于下式时：\n    $\\max\\left[\\frac{1}{\\\
    varepsilon}\\log(1/\\delta), \\frac{VC(C)-1}{32\\varepsilon}\\right]$\n  L将以至少δ的概率输出一假设h，使error_D(h)>ε\n\
    \n## 神经网络的VC维\n\n- 本节给出一般性的结论，以计算分层无环网络的VC维。这个VC维可用于界定训练样例的数量，该数达到多大才足以按照希望的ε和δ值近似可能正确地学习一个前馈网络\n\
    - 考虑一个由单元组成的网络G，它形成一个分层有向无环图\n  - 分层有向无环图的特点:\n    - 节点可划分成层，即所有第l层出来的有向边进入到第l+1层节点\n\
    \    - 没有有向环，即有向弧形成的回路\n  - 这样网络的VC维的界定可以基于其图的结构和构造该图的基本单元的VC维\n\n## 神经网络的VC维（3）\n\
    \n- 定理7.4 分层有向无环网络的VC维\n  （Kearns & Vazirani 1994）\n  - 令G为一分层有向无环图，有n个输入节点和 s≥2个内部节点，每个至少有r个输入，令C为VC维为d的R^r上的概念类，对应于可由每个内部节点s描述的函数集合，令C_G为C的G合成，对应于可由G表示的函数集合，则\
    \ VC(C_G)<=2d s log(es)\n\n## 神经网络的VC维（4）\n\n- 假设要考虑的分层有向无环网络中单个节点都是感知器，由于单独的r输入感知器VC维为r+1，代入定理7.4和式子7.7，得到\n\
    \n  $VC(C_G^{perceptrons}) \\le 2(r+1)s \\log(es)$\n\n  $m \\ge \\frac{1}{\\varepsilon}\\\
    left(4\\log(2/\\delta)+16(r+1)s\\log(es)\\log(13/\\varepsilon)\\right)$\n- 上面的结果不能直接应用于反向传播的网络，原因有两个：\n\
    \  - 此结果应用于感知器网络，而不是sigmoid单元网络\n  - 不能处理反向传播中的训练过程\n\n## 学习的出错界限模型\n\n- 计算学习理论考虑多种不同的的问题框架\n\
    \  - 训练样例的生成方式（被动观察、主动提出查询）\n  - 数据中的的噪声（有噪声或无噪声）\n  - 成功学习的定义（必须学到正确的目标概念还是有一定的可能性和近似性）\n\
    \  - 学习器所做的假定（实例的分布情况以及是否C⊆H）\n  - 评估学习器的度量标准（训练样例数量、错误数量、计算时间）\n"
