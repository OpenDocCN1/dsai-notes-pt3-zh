    +     - 考查Prolog-EBG的一般特性以及与前面讨论的归纳算法之间的关系

    +     - 描述了应用基于解释的学习以提高大状态空间搜索的性能

    +   - 本章假定生成解释所基于的先验知识是完全正确的，下一章讨论更一般的情况，即先验知识只是近似正确'
  - '[PAGE 89]


    # 归纳和解析学习问题


    +   - 分析和归纳学习问题的重要区别是，它们设想的学习问题的形式不同

    +     - 在归纳学习中，学习器被赋予一个假设空间H和训练数据D，它从H中选择一个输出假设，并且希望这个假设与D一致

    +     - 在解析学习中，学习器的输入除了假设空间H和训练数据D，还有一个领域理论B，由可用于解释训练样例的背景知识组成，学习器中H中选择一个输出假设，并希望这个假设既与D一致，也与B一致

    +   - 分析学习举例

    +     - 学习的目标概念：黑棋将在两步内失去王后的状态

    +     - 实例<xᵢ, f(xᵢ)>: xᵢ描述一特定棋盘状态，当黑棋两步内失去王后，f(xᵢ)值为真，否则为假

    +     - 假设空间：用Horn子句集表示，其中谓词表示棋子的位置'
