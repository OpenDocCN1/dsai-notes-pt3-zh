    +       - 消极方法在决定如何从训练数据D中泛化时考虑查询实例x_q

    +       - 积极方法在见到x_q之前，就完成了泛化

    +     - 核心观点：消极学习可以通过很多局部逼近的组合表示目标函数，积极学习必须在训练时提交单个的全局逼近'
