    +   - 将实验重复多次，每次抽取大小为n的不同的样本Sᵢ，得到不同的errorₛᵢ(h)，取决于Sᵢ的组成中的随机差异

    +   - errorₛ(h)被称为一随机变量，一般情况下，可以将随机变量看成一个有随机输出的实验。随机变量值即为随机实验的观察输出'
  - '[PAGE 325]


    # 错误率估计和二项比例估计（3）


    +   - 设想要运行k个这样的随机实验，得到k个随机变量值，以图表的形式显示观察到的每个错误率值的频率

    +   - 当k不断增长，该图表将呈现如表5-3所示的分布，称为二项分布'
  - '[PAGE 326]


    # 二项分布


    +   - 有一非均质硬币，要估计在抛硬币时出现正面的概率p

    +   - 投掷硬币n次并计算出现正面的次数r，那么p的一个合理估计是r/n

    +   - 如果重新进行一次实验，生成一个新的n次抛硬币的集合，出现正面的次数r可能与前不同，得到对p的另一个估计

    +   - 二项分布描述的是对任一可能的r值，这个正面概率为p的硬币抛掷n次恰好出现r次正面的概率'
  - '[PAGE 327]


    # 二项分布（2）


    +   - 从抛掷硬币的随机样本中估计p与在实例的随机样本上测试h以估计error_D(h)是相同的问题

    +   - 一次硬币抛掷对应于从D中抽取一个实例并测试它是否被h误分类

    +   - 一次随机抛掷出现正面的概率p对应于随机抽取的实例被误分类的概率error_D(h)

    +   - 二项分布给出了一个一般形式的概率分布，无论用于表示n次硬币出现正面的次数还是在n个样例中假设出错的次数

    +   - 二项分布的具体形式依赖于样本大小n以及概率p或error_D(h)'
  - '[PAGE 328]


    # 应用二项分布的条件


    +   - 有一种基本实验，其输出可被描述为一随机变量 Y，随机变量 Y 有两种取值

    +   - 在实验的任一次尝试中Y=1的概率为常数p，它与其它实验尝试无关，因此Y=0的概率为1-p

    +   - p为预先未知，面临的问题是如何估计

    +   - 基本实验的n次独立尝试按序列执行，生成一个独立同分布的随机变量序列

    +   - 随机变量R表示n次实验中出现Y_i=1的次数，它取特定值r的概率由二项分布给出


    Pr(R = r) = \frac{n!}{r!(n-r)!} p^r (1-p)^{n-r}'
  - '[PAGE 329]


    # 均值


    +   - 期望值是重复采样随机变量得到的值的平均

    +   - 定义：考虑随机变量 Y 可能的取值为 y₁...yₙ，Y 的期望值 E[Y] 定义如下：

    +     $$E[Y]=\sum_{i=1}^{n} y_i\Pr(Y=y_i)$$

    +   - 如果随机变量 Y 服从二项分布，那么可得 E[Y]=np'
  - '[PAGE 330]


    # 方差


    +   - 方差描述的是概率分布的宽度或散度，描述了随机变量与其均值之间的差有多大

    +   - 定义：随机变量Y的方差Var[Y]定义如下：

    +     Var[Y] = E[(Y - E(Y))²]

    +     描述了从Y的一个观察值估计其均值E[Y]的误差平方的期望

    +   - 随机变量Y的标准差σ_Y

    +     σ_Y = √E[(Y - E[Y])²]

    +   - 若随机变量Y服从二项分布，则方差和标准差分别为：

    +     Var[Y] = np(1-p)

    +     σ_Y = √np(1-p)'
  - '[PAGE 331]


    # 估计量、偏差和方差


    +   - 回到问题：我们得出了随机变量error_S(h)服从二项分布，那么error_S(h)和error_D(h)之间的可能差异是多少？

    +   - 用5.2式定义的二项分布，可得

    +     error_S(h)=r/n

    +     error_D(h)=p

    +   - 统计学中将error_S(h)称为error_D(h)的一个估计量

    +   - 估计量是用来估计总体的某一参数的随机变量，最关心的是它平均来说是否能产生正确估计'
  - '[PAGE 332]


    # 估计量、偏差和方差（2）


    +   - 估计偏差衡量估计量的期望值同真实参数值之间的差异

    +   - 定义：针对任意参数p的估计量Y的估计偏差是：E[Y]-p

    +   - 如果估计偏差为0，称Y为p的无偏估计量，在此情况下，由多次重复实验生成的Y的多个随机值的平均将收敛于p

    +   - 由于errorₛ(h)服从二项分布，因此errorₛ(h)是error_D(h)的一个无偏估计量'
  - '[PAGE 333]


    # 估计量、偏差和方差（3）


    +   - 对估计偏差的补充说明：

    +     - 要使error_S(h)是error_D(h)的无偏估计，假设h和样本S必须独立选取

    +     - 估计偏差不能与第2章介绍的学习器的归纳偏置相混淆

    +   - 估计量的另一重要属性是它的方差，给定多个无偏估计量，选取其中方差最小的

    +   - 由方差的定义，所选择的应为参数值和估计值之间期望平方误差最小的'
