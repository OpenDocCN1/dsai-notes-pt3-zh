  md: "\n## 递归网络\n\n- 预测y(t+1)时，考虑任意过去的时间窗内的信息，图4-11b\n- 图4-11b那样的递归网络可以使用反向传播算法的简单变体来训练\n\
    - 把递归网络拷贝成几份，用不同拷贝间的连接替换掉反馈环，这个大的网络不再包含回路，所以可以直接使用反向传播算法来训练\n- 实践中，我们仅保留一份递归网络和权值集合的拷贝，在训练了展开的网络后，可以取不同拷贝中权值的平均值作为最终网络的对应的权值\n\
    - 实践中，递归网络比没有反馈环的网络更难以训练，泛化的可靠性也不如后者，然而它们仍因较强的表征力而保持着重要性\n\n## 动态修改网络结构\n\n- 动态增长或压缩网络单元和单元间连接的数量\n\
    - 从一个不包含隐藏单元的网络开始，然后根据需要增加隐藏单元来增长网络，直到训练误差下降到某个可接受的水平\n  - 级联相关算法，每当加入一个新的隐藏单元，它的输入包括所有原始的网络输入和已经存在的隐藏单元的输出，网络以这种方式增长，积累隐藏单元，直到网络的残余误差下降到某个可接受的水平\n\
    \  - 由于每一步仅有一层网络在被训练，级联相关算法显著减少了训练时间\n  - 算法的一个实际困难是，因为算法可以无限制地增加单元，很容易过度拟合训练数据。\n\
    \n## 动态修改网络结构\n\n- 从一个复杂的网络开始修剪掉某些连接\n  - 判断某个权值是否无关紧要的一种方法是看它的值是否接近0\n  - 在实践中更加成功的方法是考虑这个权值的一个小的变化对误差的影响（连接的显著性）\n\
    \  - 最不显著的连接被拆除，重复这个过程，直到遇到某个终止条件为止（最优脑损伤法）\n- 一般而言，动态修改网络结构的方法能否稳定地提高反向传播算法的泛化精度还有待研究\n\
    \n## 小结\n\n- 人工神经网络为学习实数值和向量值函数提供了一种实际的方法，对于连续值和离散值的属性都可以使用，并且对训练数据中的噪声具有很好的健壮性。\n\
    - 反向传播算法是最常见的网络学习算法\n- 反向传播算法考虑的假设空间是固定连接的有权网络所能表示的所有函数的空间\n- 包含3层单元的前馈网络能够以任意精度逼近任意函数，只要每一层有足够数量的单元。即使是一个实际大小的网络也能够表示很大范围的高度非线性函数\n\
    - 反向传播算法使用梯度下降方法搜索可能假设的空间，迭代减小网络的误差以拟合训练数据\n\n## 小结（2）\n\n- 梯度下降收敛到训练误差相对网络权值的局部极小值。只要训练误差是假设参数的可微函数，梯度下降可用来搜索很多连续参数构成的假设空间\n\
    - 反向传播算法能够创造出网络输入中没有明确出现的特征。\n- 交叉验证方法可以用来估计梯度下降搜索的合适终止点，从而最小化过度拟合的风险\n- 其他ANN学习算法，递归网络方法训练包含有向环的网络，级联相关算法改变权值和网络结构\n\
    \n## 补充读物\n\n- 本书其他与ANN学习相关的章节\n  - 第6章给出了选择最小化误差平方和的贝叶斯论证，以及在某些情况下，用最小化交叉熵代替最小化误差平方和的方法\n\
    \  - 第7章讨论了为可靠学习布尔函数所需要的训练实例数量的理论结果，以及某些类型网络的VC维\n  - 第5章讨论了过度拟合和避免过度拟合的方法\n \
    \ - 第12章讨论了使用以前知识来提高泛化精度的方法\n\n## 补充读物（2）\n\n- 发展历程\n  - McCulloch & Pitts\n \
    \ - Widrow & Hoff\n  - Rosenblatt\n  - Minsky & Papert\n  - Rumelhart & McClelland;\
    \ Parker\n- 教科书\n  - Duda & Hart\n  - Widrow & Stearns\n  - Rumelhart & McClelland\n\
    \n## 机器学习\n\n## 第10章 学习规则集合\n\n## 概述\n\n- 对学习到的假设，最具有表征力和最能为人类所理解的表示方法之一是if-then规则的集合\n\
    - 本章探索若干能学习这样的规则集合的算法\n- 其中，最重要的是学习包含变量的规则集合，或称一阶Horn子句集合\n- 由于一阶Horn子句集合可被解释为逻辑编程语言Prolog中的程序，学习的过程常被称为归纳逻辑编程\n\
    - 本章考察了多种学习规则集合的途径，其中一种是基于机器定理证明器中演绎算子的逆转\n\n## 简介\n\n- 在许多情况下，有必要学习一个由若干if-then规则共同定义的目标函数，比如\n\
    \  - 决策树\n  - 遗传算法\n- 本章我们讨论一组不同的算法，它们直接学习规则集合，与前面算法有两点关键的不同\n  - 可学习包含变量的一阶规则集合（一阶子句的表达能力比命题规则要强得多）\n\
    \  - 使用序列覆盖算法，一次学习一个规则，以递增的方式形成最终的规则集合\n\n## 简介（2）\n\n- 一阶规则集合的例子\n  - `if Parent(x,y)\
    \ then Ancestor(x,y)`\n  - `if Parent(x,z) ∧ Ancestor(z,y) then Ancestor(x,y)`\n\
    \  - 这个规则集合很紧凑地描述了一个递归函数，它很难用决策树或其他命题的方法来表示\n- Prolog程序就是一阶规则的集合，因此一个可以学习这种规则集合的通用算法，可被看作是从样例中自动推导出Prolog程序的算法\n\
    - 一阶表示的学习系统在实践中的应用\n  - 在质谱仪中学习哪一个化学药品能粘合碎片\n  - 学习哪一个化学亚结构会产生诱导有机体突变的放射性物质\n\
    \  - 学习有限单元网以分析物理结构中的应力\n\n## 内容安排\n\n- 先介绍能够学习命题规则集的算法（命题规则可看作不含变量的一阶规则），算法搜寻假设空间学习析取规则集合\n\
    - 将上面算法扩展到一阶规则\n- 讨论归纳逻辑的两种通用途径以及归纳和演绎推理的基本关系\n\n## 序列覆盖算法\n\n- 序列覆盖算法：学习一个规则，移去它覆盖的数据，再重复这一过程\n\
    - 假设已有一个子程序Learn-One-Rule，它的输入是一组正例和反例，输出是单个规则，它能够覆盖许多正例而覆盖很少的反例\n- 我们要求输出的规则有较高的精确度，但不必有较高的覆盖度\n\
    \n## 序列覆盖算法（2）\n\n- 序列覆盖算法的过程\n  - 在所有可用训练样例上执行Learn-One-Rule\n  - 再移去由其学到的规则覆盖的正例\n\
    \  - 重复上面的过程，直到规则集覆盖正例达到希望的程度\n- 序列覆盖算法按次序学习到一组规则，它们共同覆盖了全部正例\n- 规则集中的规则可排序，分类新实例时可先应用精度最高的规则\n\
    \n### 表10-1 学习析取规则集的序列覆盖算法（CN2）\n\n```pseudocode\nSequential-Covering(Target_attribute,\
    \ Attributes, Examples, Threshold)\n    Learned_rules ← {}\n    Rule ← Learn-One-Rule(Target_attribute,\
    \ Attributes, Examples)\n    当 Performance(Rule, Examples) > Threshold\n     \
    \   Learned_rules ← Learned_rules + Rule\n        Examples ← Examples - {被Rule正确分类的样例}\n\
    \        Rule ← Learn-One-Rule(Target_attribute, Attributes, Examples)\n    Learned_rules\
    \ ← 按照在Examples上的Performance排序的Learned_rules\n    返回 Learned_rules\n```\n\n##\
    \ 序列覆盖算法（3）\n\n- 序列覆盖算法将问题化简为一系列简单的问题，执行的是一种贪婪搜索，它不能保证找到能覆盖样例的最小或最佳规则集\n- 下面重点讨论Learn-One-Rule的设计，我们希望算法能够得到较高精度的规则集，但不必覆盖所有的正例\n\
    \n## 一般到特殊的柱状搜索\n\n- 一种方法是，将假设空间搜索过程设计为与ID3算法中相似的方式，但在每一步只沿着最有希望的分支进行，即产生最佳性能的属性-值对，而不是用增长子树的办法覆盖所选属性的所有可能值\n\
    - 与ID3类似，可定义最佳分支，它覆盖的样例有最低的熵\n- 与其他贪婪算法一样，上面算法的缺陷是，它的每一步都可能做出次优的选择\n- 用柱状搜索来减小风险，即每一步保留k个最佳候选分支，每一步对k个候选分支进行处理，然后再将结果集削减至k个最可能成员\n\
    \n### 表10-2 Learn-One-Rule的一种实现：一般到特殊柱状搜索\n\n```pseudocode\nLearn-One-Rule(Target_attribute,\
    \ Attributes, Examples, k)\n    初始化 Best_hypothesis 为最一般的假设 φ\n    初始化 Candidate_hypotheses\
    \ 为集合 {Best_hypothesis}\n    当 Candidate_hypotheses 不空，做以下操作：\n        生成下一个更特殊的候选假设\n\
    \            All_constraints ← 所有形式为 (a=v) 的约束集合，其中，a 为 Attributes 的成员，v 为出现在当前\
    \ Examples 集合中的 a 的值\n            New_candidate_hypotheses ←\n               \
    \ 对 Candidate_hypotheses 中每个 h，循环\n                    对 All_constraints 中每个 c，循环\n\
    \                        通过加入约束 c 创建一个 h 的特化式\n            从 New_candidate_hypotheses\
    \ 中移去任意重复的、不一致的或非极大特殊化的假设\n        更新 Best_hypothesis\n            对 New_candidate_hypotheses\
    \ 中所有 h 做以下操作：\n                如果 Performance(h, Examples, Target_attribute)\
    \ > Performance(Best_hypothesis, Examples, Target_attribute)\n               \
    \     则 Best_hypothesis ← h\n        更新 Candidate_hypotheses\n            Candidate_hypotheses\
    \ ← Candidate_hypotheses 中 k 个 Performance 最佳成员\n    返回如下形式的一个规则：\n        “如果\
    \ Best_hypothesis”，则 prediction\n        其中，prediction 为在与 Best_hypothesis 匹配的\
    \ Examples 中最频繁的 Target_attribute 值\n```\n"
