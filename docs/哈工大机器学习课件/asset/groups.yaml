  - '[PAGE 125]


    # 术语定义


    +   - 实例x

    +   - 实例集X

    +   - 概念

    +   - 目标概念c

    +   - 训练样例x

    +   - 训练样例集D

    +   - 正例，目标概念成员

    +   - 反例，非目标概念成员

    +   - 假设h

    +   - 假设集H


    机器学习的目标就是寻找一个假设h，使得对所有的h，都有h(x)=c(x)'
  - '[PAGE 126]


    # 归纳学习假设


    +   - 什么是归纳学习？

    +     - 从特殊的样例得到普遍的规律

    +   - 归纳

    +     - 只能保证输出的假设能与训练样例相拟合

    +   - 归纳假设的一个基本假定

    +     - 对于未见实例最好的假设就是与训练数据最佳拟合的假设

    +   - 归纳学习假设

    +     - 任何假设如果在足够大的训练样例集中很好地逼近目标函数，它也能在未见实例中很好地逼近目标函数。'
  - '[PAGE 127]


    # 作为搜索的概念学习


    +   - 概念学习可以看作一个搜索的过程

    +     - 搜索范围：假设的表示所隐含定义的整个空间

    +     - 搜索目标：能够最好地拟合训练样例的假设

    +   - 当假设的表示形式选定后，那么就隐含地为学习算法确定了所有假设的空间

    +   - 例子EnjoySport的假设空间'
  - '[PAGE 128]


    # 假设的一般到特殊序


    +   - 假设的一般到特殊序关系

    +     - 考虑下面两个假设

    +       - h₁=<sunny, ?, ?, Strong, ?, ?>

    +       - h₂=<Sunny, ?, ?, ?, ?, ?>

    +     - 任何被h₁划分为正例的实例都会被h₂划分为正例，因此h₂比h₁更一般。

    +   - 利用这个关系，无需列举所有假设，就能在无限的假设空间中进行彻底的搜索'
  - '[PAGE 129]


    # 假设的一般到特殊序（2）


    +   - 关系“更一般”的精确定义

    +     - 任给实例x和假设h，说x满足h，当且仅当

    +       h(x)=1

    +     - 令h_j和h_k是在X上定义的布尔函数，称h_j比h_k更一般，当且仅当

    +       (∀x∈X)[(h_k(x)=1)→(h_j(x)=1)]

    +     - 记为h_j more_general_than_or_equal_to h_k，或

    +       h_j ⪰_g h_k'
  - '[PAGE 130]


    # 假设的一般到特殊序（3）


    +   - “更一般”的严格情形

    +     - h_j >g h_k，当且仅当，(h_j ≥g h_k)∧¬(h_k ≥g h_j)

    +   - “更特殊”关系的定义

    +     - h_j ≤g h_k，当且仅当，h_k ≥g h_j

    +   - 以EnjoySport为例说明上面的定义

    +   - 偏序的特点（区别于全序），全序上的搜索可以是二分法，偏序的搜索比无序简单，比全序复杂。

    +   - 这个偏序关系的定义与目标概念无关'
  - '[PAGE 131]


    # Find-S: 寻找极大特殊假设


    +   - 使用more_general_than偏序的搜索算法

    +     - 从H中最特殊假设开始，然后在假设覆盖正例失败时将其一般化


    表2-3 Find-S算法


    +   1. 将h初始化为H中最特殊假设

    +   2. 对每个正例x

    +      - 对h的每个属性约束aᵢ

    +        如果x满足aᵢ

    +        那么不做任何处理

    +        否则将h中aᵢ替换为x满足的另一个更一般约束

    +   3. 输出假设h'
  - '[PAGE 132]


    # Find-S: 寻找极大特殊假设（2）


    +   - Find-S算法在例子EnjoySport上的应用

    +     - h←<φ, φ, φ, φ, φ, φ>

    +     - h←<Sunny, Warm, Normal, Strong, Warm, Same>

    +     - h←<Sunny, Warm, ?, Strong, Warm, Same>

    +     - 遇到反例，h不变（因为h已经能够正确地识别反例）

    +     - h←<Sunny, Warm, ?, Strong, ?, ?>'
  - '[PAGE 133]


    # Find-S: 寻找极大特殊假设（3）


    +   - Find-S算法演示了一种利用more general than偏序来搜索假设空间的方法，沿着偏序链，从较特殊的假设逐渐转移到较一般的假设。因此，每一步得到的假设都是在那一点上与训练样例一致的最特殊的假设。

    +   - Find-S的重要特点：对以属性约束的合取式描述的假设空间H，保证输出为H中与正例一致的最特殊的假设。

    +   - 存在的问题

    +     - 是否收敛到了正确的目标概念？

    +     - 为什么要用最特殊的假设？

    +     - 训练样例是否相互一致？

    +     - 如果有多个极大特殊假设怎么办？'
  - '[PAGE 134]


    # 变型空间和候选消除算法


    +   - 候选消除算法概说

    +     - 概念学习的另一种方法，候选消除算法（candidate-elimination）

    +     - Find-S算法的不足，输出的假设只是H中能够拟合训练样例的多个假设中的一个

    +     - 候选消除算法输出与训练样例一致的所有假设的集合

    +     - 候选消除算法在描述这一集合时不需要明确列举所有成员

    +     - 利用more_general_than偏序结构，可以维护一个一致假设集合的简洁表示

    +     - 候选消除算法的应用，化学质谱分析、启发式搜索的控制规则

    +     - 候选消除算法的缺点，容错性能差'
  - '[PAGE 135]


    # 变型空间和候选消除算法（2）


    +   - “一致”的定义

    +     - 一个假设h与训练样例集合D一致，当且仅当对D中每一个样例<x,c(x)>都有h(x)=c(x)，即 Consistent(h,D)⇔(∀<x,c(x)>∈D)h(x)=c(x)

    +     - “一致”与“满足”的关系

    +   - 变型空间（version space）

    +     - 与训练样例一致的所有假设组成的集合

    +     - 表示了目标概念的所有合理的变型

    +   - 关于H和D的变型空间，记为VS_H,D，是H中与训练样例D一致的所有假设构成的子集 VS_H,D={h∈H|Consistent(h,D)}'
  - '[PAGE 136]


    # 变型空间和候选消除算法（3）


    +   - 列表后消除算法

    +     表示变型空间的一种方法是列出其所有成员

    +     - 变型空间←包含H中所有假设的列表

    +     - 对每个训练样例<x,c(x)>, 从变型空间中移除所有h(x)≠c(x)的假设

    +     - 输出Version Space中的假设列表

    +   - 优点

    +     - 保证得到所有与训练数据一致的假设

    +   - 缺点

    +     - 非常繁琐地列出H中的所有假设，大多数实际的假设空间无法做到'
  - '[PAGE 137]


    # 变形空间和候选消除算法（4）


    +   变形空间的更简洁表示


    +   变形空间被表示为它的极大一般和极大特殊的成员


    +   这些成员形成了一般和特殊边界的集合，这些边界在整个偏序结构中划分出变形空间


    +   以EnjoySport为例'
  - '[PAGE 138]


    # 变型空间和候选消除算法（5）


    +   - 形式化定义

    +     - 极大一般

    +     - 极大特殊

    +     - 关于假设空间H和训练数据D的一般边界G，是在H中与D相一致的极大一般成员的集合

    +     - 关于假设空间H和训练数据D的特殊边界S，是在H中与D相一致的极大特殊成员的集合'
  - '[PAGE 139]


    # 变型空间和候选消除算法（6）


    变型空间表示定理，令X为一任意的实例集合，H为X上定义的布尔假设的集合。令c: X→{0,1}为X上定义的任一目标概念，并令D为任一训练样例集合{<x,c(x)>}。对所有的X,
    H, c, D以及良好定义的S和G：


    VS_{H,D}={h∈H|(∃s∈S)(∃g∈G)(g≥_g h≥_g s)}


    证明：只需证明：1）每一个满足上式右边的h都在VS_{H,D}中，2）VS_{H,D}的每个成员都满足都满足等式右边。...'
  - '[PAGE 140]


    # 变型空间和候选消除算法（7）


    +   - 候选消除算法

    +     - 初始化G和S

    +     - 如果d是一个正例

    +       - 从G中移去所有与d不一致的假设

    +       - 对S中每个与d不一致的假设s

    +         - 从S中移去s

    +         - 把s的所有的极小泛化式h加入到S中，其中h满足

    +           » h与d一致，而且G的某个成员比h更一般

    +     - 如果d是一个反例

    +       - 从S中移去所有与d不一致的假设

    +       - 对G中每个与d不一致的假设g

    +         - 从G中移去g

    +         - 把g的所有的极小特殊化式h加入到G中，其中h满足

    +           » h与d一致，而且S的某个成员比h更特殊'
  - '[PAGE 141]


    # 变型空间和候选消除算法（8）


    +   - 算法举例'
  - '[PAGE 142]


    # 变型空间和候选消除的说明


    +   - 候选消除算法收敛到正确的假设

    +     - 训练样例中没有错误

    +     - H中确实包含描述目标概念的正确假设

    +   - 如果样例中存在错误

    +     - 如果给定足够的训练数据，我们会发现S和G边界收敛得到一个空的变型空间

    +   - 如果目标概念不能由假设表示方式所描述

    +     - 相似情况出现'
