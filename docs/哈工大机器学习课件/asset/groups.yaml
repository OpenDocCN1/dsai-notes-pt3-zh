  md: "\n## MAP假设和一致学习器（2）\n\n- 贝叶斯框架提出了一种刻画学习算法行为的方法，即便该学习算法不进行概率操作，通过确定算法输出最优假设时使用的概率分布P(h)和P(D|h)，可以刻画出算法具有最优行为时的隐含假定\n\
    - 使用贝叶斯方法刻画学习算法，与揭示学习器中的归纳偏置在思想上是类似的\n- 在第2章，将学习算法的归纳偏置定义为断言集合B，通过它可充分地演绎推断出学习器所执行的归纳推理结果，即学习器的输出是由其输入和隐含的归纳偏置所演绎得出的\n\
    \n## MAP假设和一致学习器（3）\n\n- 贝叶斯解释对于描述学习算法中的隐含假定提供了另一种方法，用基于贝叶斯理论的一个等效的概率推理系统来建模\n\
    - 贝叶斯解释隐含的假定形式为：H上的先验概率由P(h)分布给出，数据拒绝或接受假设的强度由P(D|h)给出\n- 在已知这些假定的概率分布后，一个基于贝叶斯理论的概率推理系统将产生等效于Find-S、候选消除等算法的输入-输出行为\n\
    \n## 极大似然和最小误差平方假设\n\n- 前面的分析表明：某些学习算法即使没有显示地使用贝叶斯规则，或以某种形式计算概率，但它们输出的结果符合贝叶斯原理，是一个MAP假设\n\
    - 通过简单的贝叶斯分析，可以表明在特定前提下，任一学习算法如果使输出的假设预测和训练数据之间的误差平方和最小化，它将输出一个极大似然假设\n- 上面结论的意义是，对于许多神经网络和曲线拟合的方法，如果它们试图在训练数据上使误差平方和最小化，此结论提供了基于贝叶斯的理论依据\n\
    \n## 极大似然和最小误差平方假设 (2)\n\n- 问题框架：\n- 学习器L工作在实例空间X和假设空间H上，H中的假设为X上定义的某种实数值函数。\n\
    - L面临的问题是学习一个从H中抽取出的未知目标函数f，给定m个训练样例的集合，每个样例的目标值被某随机噪声干扰，此随机噪声服从正态分布\n- 更精确地讲，每个训练样例是序偶<x_i,d_i>，\
    \ d_i=f(x_i)+e_i， e_i是代表噪声的随机变量，假定e_i的值是独立抽取的，并且它们的分布服从0均值的正态分布\n- 学习器的任务是在所有假设有相等的先验概率前提下，输出极大似然假设（即MAP假设）\n\
    \n## 极大似然和最小误差平方假设（3）\n\n- 用一个简单情况，即线性函数来说明问题。如图6-2所示，实线表示线性目标函数f，实点表示有噪声的训练样例集，虚线对应有最小平方训练误差的假设h_ML，即极大似然假设。\n\
    - 对于e这样的连续变量上的概率，使用概率密度表示概率分布，它在所有值上的积分为1，用小写的p表示。有限概率P有时又称为概率质量\n- 概率密度函数： $p(x_0)=\\\
    lim_{\\varepsilon\\to0}\\frac{1}{\\varepsilon}P(x_0\\le x < x_0+\\varepsilon)$\n\
    \n## 极大似然和最小误差平方假设（4）\n\n- 假定有一固定的训练实例集合，因此只考虑相应的目标值序列 D=<d₁...dₘ>，这里 dᵢ=f(xᵢ)+eᵢ。\n\
    - 假定训练样例是相互独立的，给定h时，可将P(D|h)写成各p(dᵢ|h)的积\n  h_ML = arg max_{h∈H} ∏_{i=1}^m p(dᵢ|h)\n\
    - 如果误差eᵢ服从0均值和未知方差σ²的正态分布，那么每个dᵢ服从均值为f(xᵢ)，方差不变的正态分布。因此，p(dᵢ|h)可写为方差σ²、均值f(xᵢ)的正态分布\n\
    - 使用表5-4中的正态分布公式并将相应的参数代入，由于概率dᵢ的表达式是在h为目标函数f的正确描述条件下的，所以替换μ=f(xᵢ)=h(xᵢ)\n\n##\
    \ 极大似然和最小误差平方假设（5）\n\n- h_ML = arg max_{h∈H} ∏_{i=1}^m 1/√(2πσ²) e^{-1/(2σ²)(d_i\
    \ - μ_i)²}\n  = arg max_{h∈H} ∏_{i=1}^m 1/√(2πσ²) e^{-1/(2σ²)(d_i - h(x_i))²}\n\
    \  = arg max_{h∈H} ∑_{i=1}^m ln 1/√(2πσ²) - 1/(2σ²)(d_i - h(x_i))²\n  = arg max_{h∈H}\
    \ ∑_{i=1}^m -1/(2σ²)(d_i - h(x_i))²\n  = arg min_{h∈H} ∑_{i=1}^m (d_i - h(x_i))²\n\
    - 上式说明了极大似然假设等价于使训练值和假设预测值之间的误差的平方和最小的那个假设\n- 这个结论的前提是：训练值等于真实目标值加上随机噪声，其中随机噪声从一个均值为0的正态分布中独立抽取\n\
    \n## 采用正态分布的合理性\n\n- 数学计算的简洁性\n- 对许多物理系统的噪声都有良好的近似\n- 第5章中心极限定律显示，足够多的独立同分布随机变量的和服从正态分布\n\
    - 由许多独立同分布的因素的和所生成的噪声将成为正态分布（当然，现实中不同的分量对噪声的贡献也许不是同分布的）\n- 使误差平方最小化的方法经常被用于神经网络、曲线拟合及其他许多实函数逼近的算法中\n\
    - 上面的分析只考虑了训练样例的目标值中的噪声，而没有考虑实例属性值的噪声\n\n## 用于预测概率的极大似然假设\n\n- 问题框架：\n  - 学习一个不确定性函数f:\
    \ X→{0,1}，它有两个离散的值输出\n  - 这种不可预测性来源于未能观察到的因素，导致目标函数的输出是输入的概率函数\n- 学习得到的神经网络（或其他实函数学习器）的输出是f(x)=1的概率，表示为\
    \ f′: X→[0,1]，即 f″=P(f(x)=1)\n\n## 用于预测概率的极大似然假设（2）\n\n- Brute-Force法\n  - 首先收集对x的每个可能值观察到的1和0的频率，然后训练神经网络，对每个x输出目标频率\n\
    - 可以直接从f的训练样例中训练神经网络，然后推导出f’的极大似然假设\n  - D={<x₁,d₁>...<xₘ,dₘ>}\n  - P(D|h)=∏ᵢ₌₁ᵐ\
    \ P(xᵢ,dᵢ|h)=∏ᵢ₌₁ᵐ P(dᵢ|h,xᵢ)P(xᵢ)\n\n## 用于预测概率的极大似然假设（3）\n\n- $P(d_i \\mid h,\
    \ x_i) = \\begin{cases} h(x_i) & d_i = 1 \\\\ 1 - h(x_i) & d_i = 0 \\end{cases}\
    \ = h(x_i)^{d_i} (1 - h(x_i))^{1 - d_i}$\n- $P(D \\mid h) = \\prod_{i=1}^{m} h(x_i)^{d_i}\
    \ (1 - h(x_i))^{1 - d_i} P(x_i)$\n- $h_{ML} = \\arg\\max_{h \\in H} \\prod_{i=1}^{m}\
    \ h(x_i)^{d_i} (1 - h(x_i))^{1 - d_i} p(x_i)$\n  $= \\arg\\max_{h \\in H} \\prod_{i=1}^{m}\
    \ h(x_i)^{d_i} (1 - h(x_i))^{1 - d_i}$\n  $= \\arg\\max_{h \\in H} \\sum_{i=1}^{m}\
    \ d_i \\ln h(x_i) + (1 - d_i) \\ln(1 - h(x_i))$\n- 式子6.13与熵函数的一般式相似，因此它的负值常称为交叉熵\n\
    \n## 在神经网络中梯度搜索以达到似然最大化\n\n- 前面讨论了利用式子6.13求极大似然假设，现用G(h,D)表示，为神经网络学习推导一个权值训练法则，使用梯度上升法使G(h,D)最大化\n\
    \  \n  $$\\frac{\\partial G(h,D)}{\\partial w_{jk}} = \\sum_{i=1}^{m} \\frac{\\\
    partial G(h,D)}{\\partial h(x_i)} \\frac{\\partial h(x_i)}{\\partial w_{jk}}$$\n\
    \  \n  $$= \\sum_{i=1}^{m} \\frac{\\partial (d_i \\ln h(x_i) + (1 - d_i) \\ln(1\
    \ - h(x_i)))}{\\partial h(x_i)} \\frac{\\partial h(x_i)}{\\partial w_{jk}}$$\n\
    \  \n  $$= \\sum_{i=1}^{m} \\frac{d_i - h(x_i)}{h(x_i)(1 - h(x_i))} \\frac{\\\
    partial h(x_i)}{\\partial w_{jk}}$$\n- 考虑简单的情况，假定神经网络从一个单层的 sigmoid单元建立，则\n  \n\
    \  $$\\frac{\\partial h(x_i)}{\\partial w_{jk}} = \\sigma'(x_i) x_{ijk} = h(x_i)(1\
    \ - h(x_i)) x_{ijk}$$\n\n## 在神经网络中梯度搜索以达到似然最大化（2）\n\n∂G(h,D)/∂w_jk = Σ_{i=1}^m\
    \ (d_i - h(x_i)) x_{ik}\n\n- 因为要使P(D|h)最大化而不是最小化，因此执行梯度上升搜索，而不是梯度下降搜索。\n  \n \
    \ w_jk ← w_jk + Δw_jk    Δw_jk = η Σ_{i=1}^m (d_i - h(x_i)) x_{jk}\n- 与反向传播更新法则对比\n\
    \  - 使误差平方最小化的法则寻找到极大似然假设的前提是：训练数据可以由目标函数值加上正态分布噪声来模拟\n  - 使交叉熵最小化的法则寻找极大似然假设基于的前提是：观察到的布尔值为输入实例的概率函数\n"
