    - EBNN的输出：一个能逼近目标函数的新的神经网络，学习到的网络能够拟合训练样例以及从领域理论中抽取的的训练导数\n- 图12-7，图的上面部分显示的是目标函数Cup的领域理论，每一方块表示领域理论中一个神经网络，图的下面是要学习的新神经网络，称为目标网络\n\
    \n## EBNN算法（3）\n\n- EBNN通过执行TangentProp算法来学习目标网络\n  - EBNN把接收到的输入训练值<xi, f(xi)>和从领域理论中计算出的导数提供给TangentProp\n\
    - EBNN计算训练导数的方法\n  - ？？？\n\n## EBNN算法的说明\n\n- 概括地说，EBNN算法使用的领域理论被表示为一组预先学习到的神经网络，然后领域理论与训练样例一起训练其输出假设\n\
    - 对每个训练样例，EBNN使用其领域理论来解释它，然后从此解释中抽取训练导数\n- 对实例的每个属性计算出一个训练导数，以描述按照领域理论，目标函数值是怎样被属性值的微小变化影响的\n\
    - Prolog-EBG与EBNN的区别\n  - EBNN能够处理不完美的领域知识，而Prolog-EBG不能\n  - Prolog-EBG学习到逐渐增长的Horn子句集，而EBNN学习到固定大小的神经网络\n\
    \n## 使用先验知识来扩展搜索算子\n\n- FOCL是纯归纳算法FOIL的一个扩展，它们的区别在于：搜索单个Horn子句的一般到特殊过程中候选假设生成的方法\n\
    \  - FOIL生成每个候选特化式是通过加入一个新文字到子句前提中得到的\n  - FOCL使用同样的方法产生候选特化式，但还基于领域理论生成了附加的特化式\n\
    - 操作型文字和非操作型文字\n  - 操作型文字：当一个文字可被用于描述一个输出假设\n  - 非操作型文字：只出现在领域理论中作为中间特征但不是实例的原子属性的文字\n\
    \n## FOCL算法\n\n- FOCL使用下面两种算子扩展当前假设h\n  - 对不是h一部分的每个操作型文字，创建h的一个特化式，方法是加入文字到前件中\n\
    \  - 按照领域理论，创建一个操作型的且是目标概念的逻辑充分条件，将这组文字加入到h的当前前件中，最后修剪h的前件，移去对于训练数据不需要的文字，具体过程如下:\n\
    \    - 首先选择一条领域理论句子，它的头部匹配目标概念，如果有多个这样的子句，选择其中子句体关于训练样例有最高信息增益的\n    - 所选子句的前件形成了目标概念的一个逻辑充分条件，在这些充分条件中，再次使用领域理论，每个非操作型文字被替换掉，将子句前件代入到子句后件中\n\
    \    - 这个展开的过程持续到充分条件被描述为操作型文字，如果有多个可选的展开，那么用贪婪法选择有最大信息增益的一个\n    - 最后，修剪充分条件。对表达式中的每个文字，除非文字的移除会降低训练样例上的分类精度，否则它被移去\n"
