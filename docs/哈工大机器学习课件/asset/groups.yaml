    +   - 贝叶斯框架提出了一种刻画学习算法行为的方法，即便该学习算法不进行概率操作，通过确定算法输出最优假设时使用的概率分布P(h)和P(D|h)，可以刻画出算法具有最优行为时的隐含假定

    +   - 使用贝叶斯方法刻画学习算法，与揭示学习器中的归纳偏置在思想上是类似的

