    - 这个偏序关系的定义与目标概念无关\n\n## Find-S: 寻找极大特殊假设\n\n- 使用more_general_than偏序的搜索算法\n  -\
    \ 从H中最特殊假设开始，然后在假设覆盖正例失败时将其一般化\n\n表2-3 Find-S算法\n\n1. 将h初始化为H中最特殊假设\n2. 对每个正例x\n\
    \   - 对h的每个属性约束aᵢ\n     如果x满足aᵢ\n     那么不做任何处理\n     否则将h中aᵢ替换为x满足的另一个更一般约束\n\
    3. 输出假设h\n\n## Find-S: 寻找极大特殊假设（2）\n\n- Find-S算法在例子EnjoySport上的应用\n  - h←<φ, φ,\
    \ φ, φ, φ, φ>\n  - h←<Sunny, Warm, Normal, Strong, Warm, Same>\n  - h←<Sunny,\
    \ Warm, ?, Strong, Warm, Same>\n  - 遇到反例，h不变（因为h已经能够正确地识别反例）\n  - h←<Sunny, Warm,\
    \ ?, Strong, ?, ?>\n\n## Find-S: 寻找极大特殊假设（3）\n\n- Find-S算法演示了一种利用more general\
    \ than偏序来搜索假设空间的方法，沿着偏序链，从较特殊的假设逐渐转移到较一般的假设。因此，每一步得到的假设都是在那一点上与训练样例一致的最特殊的假设。\n\
    - Find-S的重要特点：对以属性约束的合取式描述的假设空间H，保证输出为H中与正例一致的最特殊的假设。\n- 存在的问题\n  - 是否收敛到了正确的目标概念？\n\
    \  - 为什么要用最特殊的假设？\n  - 训练样例是否相互一致？\n  - 如果有多个极大特殊假设怎么办？\n\n## 变型空间和候选消除算法\n\n\
    - 候选消除算法概说\n  - 概念学习的另一种方法，候选消除算法（candidate-elimination）\n  - Find-S算法的不足，输出的假设只是H中能够拟合训练样例的多个假设中的一个\n\
    \  - 候选消除算法输出与训练样例一致的所有假设的集合\n  - 候选消除算法在描述这一集合时不需要明确列举所有成员\n  - 利用more_general_than偏序结构，可以维护一个一致假设集合的简洁表示\n\
    \  - 候选消除算法的应用，化学质谱分析、启发式搜索的控制规则\n  - 候选消除算法的缺点，容错性能差\n\n## 变型空间和候选消除算法（2）\n\n\
    - “一致”的定义\n  - 一个假设h与训练样例集合D一致，当且仅当对D中每一个样例<x,c(x)>都有h(x)=c(x)，即 Consistent(h,D)⇔(∀<x,c(x)>∈D)h(x)=c(x)\n\
    \  - “一致”与“满足”的关系\n- 变型空间（version space）\n  - 与训练样例一致的所有假设组成的集合\n  - 表示了目标概念的所有合理的变型\n\
    - 关于H和D的变型空间，记为VS_H,D，是H中与训练样例D一致的所有假设构成的子集 VS_H,D={h∈H|Consistent(h,D)}\n\n##\
    \ 变型空间和候选消除算法（3）\n\n- 列表后消除算法\n  表示变型空间的一种方法是列出其所有成员\n  - 变型空间←包含H中所有假设的列表\n \
    \ - 对每个训练样例<x,c(x)>, 从变型空间中移除所有h(x)≠c(x)的假设\n  - 输出Version Space中的假设列表\n- 优点\n\
    \  - 保证得到所有与训练数据一致的假设\n- 缺点\n  - 非常繁琐地列出H中的所有假设，大多数实际的假设空间无法做到\n\n## 变形空间和候选消除算法（4）\n\
    \n变形空间的更简洁表示\n\n变形空间被表示为它的极大一般和极大特殊的成员\n\n这些成员形成了一般和特殊边界的集合，这些边界在整个偏序结构中划分出变形空间\n\
