    +     - 使用一个学习到的ANN以正常的速度在高速公路上驾驶汽车

    +     - ANN的输入是一个30x32像素的网格，输出是车辆行进的方向

    +     - 每个节点对应一个网络单元的输出，而从下方进入节点的实线为其输入

    +     - 隐藏单元，输出仅在网络内部，不是整个网络输出的一部分

    +     - 每个输出单元对应一个特定的驾驶方向，这些单元的输出决定哪一个方向是被最强烈推荐的'
