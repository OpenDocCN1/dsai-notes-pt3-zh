    - 基于案例的推理，这是一种使用符号表示和基于知识的推理的方法\n- 消极学习方法和积极学习方法之间的差异\n\n### k-近邻算法\n\n- k-近邻算法是最基本的基于实例的学习方法\n\
    - k-近邻算法假定所有的实例对应于n维空间\\(R^n\\)中的点，任意的实例表示为一个特征向量 \\(\\langle a_1(x), \\ldots,\
    \ a_n(x)\\rangle\\)\n- 根据欧氏距离定义实例的距离。两个实例\\(x_i\\)和\\(x_j\\)的距离\\(d(x_i,x_j)\\\
    )定义为\n  - \\(d(x_i,x_j)=\\sqrt{\\sum_{i=1}^{n}(a_i(x_i)-a_i(x_j))^2}\\)\n- 在最近邻学习中，目标函数值可以是离散的也可以是连续的，本节先考虑离散的情况。\n\
    - 考虑离散目标函数\\(f: R^n \\rightarrow V\\)，\\(V=\\{v_1, \\ldots, v_s\\}\\)\n- 表8-1\
    \ 逼近离散值函数\\(f: R^n \\rightarrow V\\)的k-近邻算法\n  - 训练算法\n    - 将每个训练样例\\(\\langle\
    \ x, f(x)\\rangle\\)加入到列表training_examples\n  - 分类算法\n    - 给定一个要分类的查询实例\\(x_q\\\
    )\n    - 在training_examples中选出最靠近\\(x_q\\)的k个实例，并用\\(x_1, \\ldots, x_k\\)表示\n\
    \    - 返回 \\(\\hat{f}(x_q) \\leftarrow \\arg\\max_{v \\in V} \\sum_{i=1}^{k} \\\
    delta(v, f(x_i))\\)\n    - 其中 \\(\\delta(a,b)=\\begin{cases}1 & a=b\\\\0 & a\\\
    neq b\\end{cases}\\)\n- 表8-1的算法返回值是对\\(f(x_q)\\)的估计，它是距离\\(x_q\\)最近的k个训练样例中最普遍的f值，结果与k的取值相关。\n\
    - 图8-1图解了一种简单情况下的k-近邻算法，实例是二维空间中的点，目标函数具有布尔值，1-近邻算法把\\(x_q\\)分类为正例，5-近邻算法把\\(x_q\\\
    )分类为反例\n- k-近邻算法不形成关于目标函数f的明确的一般假设，仅在需要时计算每个新查询实例的分类，但依然可以问：k-近邻算法隐含的一般函数是什么？\n\
    - 图8-1中右图画出了1-近邻算法在整个实例空间上导致的决策面形状。这种图称为训练样例集合的Voronoi图\n- 离散的k-近邻算法作简单修改后可用于逼近连续值的目标函数。即计算k个最接近样例的平均值，而不是计算其中的最普遍的值，为逼近\\\
    (f: R^n \\rightarrow R\\)，计算式如下：\n  - \\(\\hat{f}(x_q) \\leftarrow \\frac{\\sum_{i=1}^{k}\
    \ f(x_i)}{k}\\)\n\n### 距离加权最近邻算法\n\n- 对k-近邻算法的一个改进是对k个近邻的贡献加权，越近的距离赋予越大的权值，比如：\n\
    \  - \\(\\tilde{f}(x_q) \\leftarrow \\arg\\max_{v \\in V} \\sum_{i=1}^{k} w_i\
    \ \\delta(v, f(x_i))\\quad w_i = \\frac{1}{d(x_q, x_i)^2}\\)\n- 为了处理查询点\\(x_q\\\
    )恰好匹配某个训练样例\\(x_i\\)，从而导致\\(d(x_q,x_i)^2\\)为0的情况，令这种情况下的\\(\\tilde{f}(x_q)\\)等于\\\
    (f(x_i)\\)，如果有多个这样的训练样例，我们使用它们占多数的分类\n- 也可以用类似的方式对实值目标函数进行距离加权，用下式代替表8-1中的计算式，\\\
    (w_i\\)的定义与前相同\n  - \\(\\tilde{f}(x_q) \\leftarrow \\frac{\\sum_{i=1}^{k} w_i\
    \ f(x_i)}{\\sum_{i=1}^{k} w_i}\\)\n- k-近邻算法的所有变体都只考虑k个近邻用以分类查询点，如果使用按距离加权，那么可以允许所有的训练样例影响\\\
    (x_q\\)的分类，因为非常远的实例的影响很小\n- 考虑所有样例的唯一不足是会使分类运行得更慢\n- 如果分类一个新实例时，考虑所有的训练样例，我们称为全局法；如果仅考虑靠近的训练样例，称为局部法\n\
    - 当式子8.4应用于全局法时，称为Shepard法\n\n### 对k-近邻算法的说明\n\n- 距离加权的k-近邻算法对训练数据中的噪声有很好的健壮性，通过取k个近邻的加权平均，可以消除孤立的噪声样例的影响\n\
    - k-近邻的归纳偏置是：一个实例的分类\\(x_q\\)与在欧氏空间中它附近的实例的分类相似\n- k-近邻方法的一个实践问题：维度灾害\n  - 许多学习方法，比如决策树方法，选择部分属性作出判断，而k-近邻方法中实例间的距离是根据实例的所有属性计算的\n\
    \  - 实例间距离会被大量的不相关属性所支配，可能导致相关属性的值很接近的实例相距很远\n- 维度灾害的解决方法：对属性加权，相当于按比例缩放欧氏空间中的坐标轴，缩短对应不太相关的属性的坐标轴，拉长对应更相关属性的坐标轴\n\
    - 每个坐标轴应伸展的数量可以通过交叉验证的方法自动决定，具体做法如下：\n  - 假定使用因子\\(z_j\\)伸展j个根坐标轴，选择各个\\(z_j\\\
    )的值，使得学习算法的真实分类错误率最小化\n  - 这个真实错误率可以使用交叉验证来估计\n  - 可以多次重复这个处理过程，使得加权因子的估计更加准确\n\
    - 另一种更强有力的方法是从实例空间中完全消除最不相关的属性，等效于设置某个缩放因子为0\n"
  mdcn: "\n## 机器学习\n\n### FOCL的说明\n\n- 图12-9比较了FOCL和纯归纳的FOIL执行的假设空间搜索\n  - FOCL中领域理论推举的特化式对应FOIL搜索中的一个宏步，其中多个文字在一步中被加入\n\
    - FOCL使用语法生成候选特化式的同时，还在搜索中每一步使用领域理论驱动生成候选特化式\n- 领域理论的使用方式是使学习器偏置：优先选择最类似于领域理论涵盖的操作型的逻辑充分条件的Horn子句\n\
    - 结合分析和归纳的方法，还没有一个在大范围的问题领域中被彻底测试或证明，仍是一个很活跃的研究领域\n\n### 小结\n\n- 结合归纳和分析学习的方法可以获得两者（归纳和分析）的优点，减小样本复杂度，并且否决不正确的先验知识\n\
    - 结合的方法通过领域理论影响假设空间的搜索来实现，主要有：1）影响初始假设；2）影响当前假设的搜索算子集合；3）影响搜索目标\n- KBANN影响初始假设，使用领域理论建立初始神经网络，然后使用反向传播算法进行精化\n\
    - TangentProp使用先验知识被表示为目标函数所希望的导数，并改变了目标函数\n- EBNN使用领域理论改变神经网络搜索的假设空间的目标。领域理论由预先学习的神经网络组成，需要的导数信息来自神经网络\n\
    - FOCL使用领域理论来扩展搜索中考虑的候选集，结合了FOIL的贪婪的、一般到特殊的搜索策略以及分析方法中的规则链分析推理\n- 还有很多算法试图结合归纳和分析学习，比如第6章讨论的学习贝叶斯网的方法提供了另一种途径\n\
    \n### 第8章 基于实例的学习\n\n### 概述\n\n- 已知一系列的训练样例，许多学习方法为目标函数建立起明确的一般化描述。\n- 基于实例的学习方法只是简单地把训练样例存储起来，从这些实例中泛化的工作被推迟到必须分类新的实例时\n\
    - 每当学习器遇到一个新的查询实例，它分析这个新实例与以前存储的实例的关系，并据此把一个目标函数值赋给新实例\n- 基于实例的学习方法包括：\n  - 假定实例可以表示成欧氏空间中的点\n\
    \    - 最近邻法\n    - 局部加权回归法\n  - 对实例采用更复杂的符号表示\n    - 基于案例的推理\n- 基于实例的学习方法有时被称为消极学习法，它把处理工作延迟到必须分类新的实例时\n\
    - 这种延迟的学习方法有一个优点：不是在整个实例空间上一次性地估计目标函数，而是针对每个待分类新实例作出局部的和相异的估计\n\n### 简介\n\n- 基于实例的学习方法的学习过程只是简单地存储已知的训练数据，当遇到新的查询实例时，一系列相似的实例从存储器中取出，用来分类新的查询实例\n\
