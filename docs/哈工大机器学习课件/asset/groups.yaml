  - '[PAGE 87]


    # 简介


    +   - 前面章节讨论的各种归纳法，决策树、神经网络、归纳逻辑编程、遗传算法，在实践中的一个关键限制是：在可用数据不足时性能较差，正如第7章分析，给定数目的训练样例，学习的精度存在基本的上下界

    +   - 我们希望开发出这样的学习方法：它们训练精度上的基本限制不受可用训练数据的数量所制约

    +   - 基于解释的学习：

    +     - 使用先验知识来分析或解释每个训练样例，以推理出样例的哪些特征与目标函数相关，哪些不相关

