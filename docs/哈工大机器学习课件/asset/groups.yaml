    \    d=error_D(h₁)-error_D(h₂)\n\n## 两个假设错误率间的差异（2）\n\n- 使用5.4节中描述的四个步骤来推导d的置信区间估计\n\
    \  - 确定待估计的参数，如上所述的d\n  - 定义一估计量，\\hat{d}=error_{S1}(h1)-error_{S2}(h2)\n  - \\\
    hat{d}是d的无偏估计量，即E[\\hat{d}]=d。\\hat{d}由于对于较大的n1和n2，error_{S1}(h1)和error_{S2}(h2)都近似遵从正态分布，两个正态分布的差仍为正态分布，方差为两个正态分布的方差的和\n\
    \    \\sigma_{\\hat{d}}^2 \\approx \\frac{error_{S1}(h1)(1-error_{S1}(h1))}{n1}\
    \ + \\frac{error_{S2}(h2)(1-error_{S2}(h2))}{n2}\n  - 现在知道了\\hat{d}服从均值为d、方差为\\\
    sigma2的正态分布，因此d的N%置信区间是 \\hat{d} \\pm z_N \\sigma\n\n## 两个假设错误率间的差异（3）\n\n- 上面分析的是h₁和h₂在相互独立的数据样本上测试的情况，如果在同一个样本上测试h₁和h₂，那么也可以使用公式5.13计算置信区间\n\
    - 这种情况下的方差通常小于式子5.12给出的方差，这是因为单个样本消除了两个样本组合带来的随机差异，这样，由式子5.13给出的置信区间一般来说偏于保守，但结果是正确的\n\
    \n## 假设检验\n\n- 有时感兴趣的是某个特定猜想正确的概率，而不是对某参数的置信区间估计。比如：error_D(h₁)>error_D(h₂)的可能性有多大？\n\
    \n- 例子，假定分别用大小为100的独立样本S1和S2测量h1和h2的样本错误率为0.30和0.20，给定 d̂=0.10，问error_D(h₁)>error_D(h₂)的概率是多少？d>0的概率是多少？\n\
    \n- 概率Pr(d>0)等于 d̂ 对d的过高估计不大于0.1的概率，也就是这个概率为 d̂ 落入单侧区间 d̂ < d+0.10 = μ_d +0.10\
    \ 的概率\n\n## 假设检验（2）\n\n- 对于 d 落入单侧区间 d < μ_d + 0.10 的概率，可以通过计算分布在该区间的概率质量来确定 d\
    \ 落入这个单侧区间的概率\n- 将区间 d < μ_d + 0.10 用允许偏离均值的标准差的数目来重新表示，根据式5.12可得 σ_d ≈ 0.061，所以这一区间可近似表示为\
    \ d < μ_d + 0.10/σ_d · σ_d = μ_d + 1.64 σ_d\n- 查表5-1知，关于均值的1.64标准差对应置信度90%的双侧区间，因此这个单侧区间具有95%的置信度\n\
    - 因此给定观察 d = 0.1，error_D(h₁) > error_D(h₂) 的概率约为95%。使用统计学术语表述为：接受 error_D(h₁)\
    \ > error_D(h₂) 假设的置信度是95%\n\n## 学习算法比较\n\n- 有时感兴趣的是比较两个学习算法的性能，而不是两个具体的假设本身\n\
    \  - 如何近似地检验多个学习算法？\n  - 如何确定两个算法之间的差异在统计上是有意义的？\n- 假设有L_A和L_B两个算法，要确定为了学习一特定目标函数f，平均来说那个算法更好\n\
    - 定义“平均”的一种合理方法是，从一基准实例分布中抽取包含n个样例的训练集合，在所有这样的集合中测量两个算法的平均性能，即 $E_{S\\subset D}[error_D(L_A(S))\
    \ - error_D(L_B(S))]$\n"
