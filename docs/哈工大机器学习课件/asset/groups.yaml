    # EBNN算法的说明


    +   - 概括地说，EBNN算法使用的领域理论被表示为一组预先学习到的神经网络，然后领域理论与训练样例一起训练其输出假设

    +   - 对每个训练样例，EBNN使用其领域理论来解释它，然后从此解释中抽取训练导数

    +   - 对实例的每个属性计算出一个训练导数，以描述按照领域理论，目标函数值是怎样被属性值的微小变化影响的

    +   - Prolog-EBG与EBNN的区别

