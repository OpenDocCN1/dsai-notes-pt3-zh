    - 可以直接从f的训练样例中训练神经网络，然后推导出f’的极大似然假设\n  - D={<x₁,d₁>...<xₘ,dₘ>}\n  - P(D|h)=∏ᵢ₌₁ᵐ\
    \ P(xᵢ,dᵢ|h)=∏ᵢ₌₁ᵐ P(dᵢ|h,xᵢ)P(xᵢ)\n\n## 用于预测概率的极大似然假设（3）\n\n- $P(d_i \\mid h,\
    \ x_i) = \\begin{cases} h(x_i) & d_i = 1 \\\\ 1 - h(x_i) & d_i = 0 \\end{cases}\
    \ = h(x_i)^{d_i} (1 - h(x_i))^{1 - d_i}$\n- $P(D \\mid h) = \\prod_{i=1}^{m} h(x_i)^{d_i}\
    \ (1 - h(x_i))^{1 - d_i} P(x_i)$\n- $h_{ML} = \\arg\\max_{h \\in H} \\prod_{i=1}^{m}\
    \ h(x_i)^{d_i} (1 - h(x_i))^{1 - d_i} p(x_i)$\n  $= \\arg\\max_{h \\in H} \\prod_{i=1}^{m}\
    \ h(x_i)^{d_i} (1 - h(x_i))^{1 - d_i}$\n  $= \\arg\\max_{h \\in H} \\sum_{i=1}^{m}\
    \ d_i \\ln h(x_i) + (1 - d_i) \\ln(1 - h(x_i))$\n- 式子6.13与熵函数的一般式相似，因此它的负值常称为交叉熵\n\
    \n## 在神经网络中梯度搜索以达到似然最大化\n\n- 前面讨论了利用式子6.13求极大似然假设，现用G(h,D)表示，为神经网络学习推导一个权值训练法则，使用梯度上升法使G(h,D)最大化\n\
    \  \n  $$\\frac{\\partial G(h,D)}{\\partial w_{jk}} = \\sum_{i=1}^{m} \\frac{\\\
    partial G(h,D)}{\\partial h(x_i)} \\frac{\\partial h(x_i)}{\\partial w_{jk}}$$\n\
    \  \n  $$= \\sum_{i=1}^{m} \\frac{\\partial (d_i \\ln h(x_i) + (1 - d_i) \\ln(1\
    \ - h(x_i)))}{\\partial h(x_i)} \\frac{\\partial h(x_i)}{\\partial w_{jk}}$$\n\
    \  \n  $$= \\sum_{i=1}^{m} \\frac{d_i - h(x_i)}{h(x_i)(1 - h(x_i))} \\frac{\\\
    partial h(x_i)}{\\partial w_{jk}}$$\n- 考虑简单的情况，假定神经网络从一个单层的 sigmoid单元建立，则\n  \n\
    \  $$\\frac{\\partial h(x_i)}{\\partial w_{jk}} = \\sigma'(x_i) x_{ijk} = h(x_i)(1\
    \ - h(x_i)) x_{ijk}$$\n\n## 在神经网络中梯度搜索以达到似然最大化（2）\n\n∂G(h,D)/∂w_jk = Σ_{i=1}^m\
    \ (d_i - h(x_i)) x_{ik}\n\n- 因为要使P(D|h)最大化而不是最小化，因此执行梯度上升搜索，而不是梯度下降搜索。\n  \n \
    \ w_jk ← w_jk + Δw_jk    Δw_jk = η Σ_{i=1}^m (d_i - h(x_i)) x_{jk}\n- 与反向传播更新法则对比\n\
    \  - 使误差平方最小化的法则寻找到极大似然假设的前提是：训练数据可以由目标函数值加上正态分布噪声来模拟\n  - 使交叉熵最小化的法则寻找极大似然假设基于的前提是：观察到的布尔值为输入实例的概率函数\n"
