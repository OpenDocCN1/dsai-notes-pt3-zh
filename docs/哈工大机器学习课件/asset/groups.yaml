    - 针对每一个训练样例，梯度下降迭代100次后的网络权值显示在图的下部。\n- 如果一个人的脸是转向他的右面，那么他的亮度高的皮肤会大致与这个隐藏单元中的较大正值对齐，同时他的亮度低的头发会大致与负权值对齐，这导致此单元输出一个较大的值，同样的图像会使第3个隐藏单元输出一个接近0的值。\n\
