    \    - 第二步\n      - 设置结论为上步得到的C=C2\n      - 从背景知识中选择C1=Father(Tom, Bob)\n    \
    \  - 得到GrandChild(y,x)∨¬Father(x,z)∨¬Father(z,y)\n\n## 逆归结小结\n\n- 逆归结提供了一种一般的途径以自动产生满足式子10.2的假设\n\
    - 与FOIL方法的差异\n  - 逆归结是样例驱动，FOIL是生成再测试\n  - 逆归结在每一步只考虑可用数据中的一小部分，FOIL考虑所有的可用数据\n\
    \  - 看起来基于逆归结的搜索更有针对性且更有效，但实际未必如此\n\n## 泛化、θ-包容和涵蕴\n\n- 考虑如下的定义\n  - more_general_than：给定两个布尔值函数\
    \ hj(x) 和 hk(x)，称 hj≥g hk，当且仅当 (∀x)hk(x)→hj(x)（参见第2章）\n  - θ-包容于：考虑两个子句 Cj 和 Ck，称\
    \ Cj θ-包容于 Ck，当且仅当存在一个置换 θ，使得 Cjθ⊆Ck\n  - 涵蕴：考虑两个子句 Cj 和 Ck，子句 Cj 被称为涵蕴 Ck，当且仅当\
    \ Ck 从 Cj 中演绎派生\n\n## 泛化、θ-包容和涵蕴（2）\n\n- 三个定义之间的关系\n  - 泛化和θ-包容于的关系：如果h1≥g h2，则子句C1:c(x)←h1(x)\
    \ θ-包容于子句C2:c(x)←h2(x)\n  - θ-包容于是涵蕴的一种特殊形式，即如果子句A θ-包容于子句 B，则A⇒B，然而反之不一定成立\n\
    \  - 因此，泛化是θ-包容于的一种特殊情况，而θ-包容于又是涵蕴的特殊情况\n\n- 通过泛化和特化假设来搜索假设空间比用一般的逆涵蕴算子来搜索更局限\n\
    \n- 遗憾的是，逆涵蕴这种最一般的形式可产生无法处理的搜索\n\n- 中间的θ-包容于提供了位于泛化和涵蕴之间的一种概念和方法\n\n## Progol\n\
    \n- 在实践中，递归归结容易导致候选假设的组合爆炸\n- 另一种途径（Progol的思想）是：\n  - 只使用逆涵蕴来生成一个最特殊假设，它与背景信息一起涵蕴观察的数据\n\
    \  - 然后，这个最特殊假设可用于确定假设空间的一般到特殊搜索边界，只考虑比此边界更一般的假设\n\n## Progol (2)\n\n- Progol使用的算法概述\n\
    \  - 用户指定使用一个受限的一阶表示语言为假设空间H,\n  - Progol使用序列覆盖法来从H中学习一组覆盖数据的表达式\n  - Progol在这个由最一般假设和第2步中得到的特殊边界hi所界定的假设空间中执行了一般到特殊搜索，在此假设集合中，它寻找有最小描述长度的假设\n\
    \n## 小结\n\n- 序列覆盖算法学习析取的规则集，方法是先学习单个精确的规则，然后移去被此规则覆盖的正例，再在剩余样例上重复这一过程\n- 序列覆盖算法提供了一个学习规则集的有效的贪婪算法，可作为自顶向下的决策树学习算法的替代算法，决策树算法可被看作并行覆盖，与序列覆盖相对应\n\
    - 在序列覆盖算法中，已研究了多种方法以学习单个规则，这些方法的不同在于它们考察规则前提空间的策略不同\n- 一阶规则集提供了一种表征能力很强的表示，学习一阶Horn子句的问题常被称为归纳逻辑编程的问题\n\
    \n## 小结（2）\n\n- 学习一阶规则集的方法是将CN2中的序列覆盖算法由命题形式扩展到一阶表示，体现在FOIL程序中，它可学习包括简单递归规则集在内的一阶规则集\n\
    - 学习一阶规则集的另一个方法是逆归结，通过运用熟知的演绎推理的逆算子来搜索假设\n- Cigol使用的逆归结是归结算子的逆转，而归结是普遍用于机器定理证明的一种推理规则，Progol结合了逆涵蕴策略和一般到特殊策略来搜索假设空间\n\
    \n## 补充读物\n\n- Winston1970，学习如 “arch”这样的概念的网络式描述\n- Banerji1964,1969，将逻辑表示用于学习问题的研究\n\
    - Michalski，AQ算法\n- Plotkin1970，θ-包容于的定义，对归纳和演绎之间的关系进行了形式化\n- Vere1975，研究了学习的逻辑表示问题\n\
    - Buchanan1976，Meta-Dendral程序可学习分子结构中可在质谱仪中被分割的部分的关系描述\n- Mitchell1979，候选消除变型空间算法被用于化学结构的关系描述\n\
    \n## 补充读物（2）\n\n- Horn子句的研究\n  - Shapiro1983， MIS\n  - Sammut & Banerji1986， MARVIN\n\
    \  - Quinlan1990， FOIL\n  - Dzeroski1991， mFOIL\n  - Pazzani et al.1991， FOCL\n\
    \  - De Raedt & Bruynooghe1993， CLAUDIEN\n  - Grobelnik1992， MARKUS\n  - Muggleton\
    \ & Buntine1988， 逆归结\n\n## 补充读物（3）\n\n- 归纳逻辑编程\n  - Lavrac & Dzeroski，一个可读性很强的教材\n\
    \  - Wrobel1996，一个好的综述\n  - Bratko & Muggleton1995，概述了 ILP 在一些重要问题上的应用\n\n## 机器学习\n\
    \n## 第9章 遗传算法\n\n### 概述\n\n- 遗传算法是一种大致基于模拟进化的学习方法\n- 假设通常被描述为二进制位串，也可以是符号表达式或计算机程序\n\
    - 搜索合适的假设从若干初始假设的群体或集合开始\n- 当前群体的成员通过模拟生物进化的方式来产生下一代群体，比如随机变异和交叉\n- 每一步，根据给定的适应度评估当前群体中的假设，而后使用概率方法选出适应度最高的假设作为产生下一代的种子\n\
    - 遗传算法已被成功用于多种学习任务和最优化问题中，比如学习机器人控制的规则集和优化人工神经网络的拓扑结构和学习参数\n- 本章主要介绍了基于位串描述假设的遗传算法和基于计算机程序描述假设的遗传编程\n\
    \n### 动机\n\n- 遗传算法（GA）是一种受生物进化启发的学习方法，它不再是从一般到特殊或从简单到复杂地搜索假设，而是通过变异和重组当前已知的最好假设来生成后续的假设\n\
    - 每一步，更新被称为当前群体的一组假设，方法是使用当前适应度最高的假设的后代替代群体的某个部分\n- 这个过程形成了假设的生成测试的束状搜索，其中若干个最佳当前假设的变体最有可能在下一步被考虑\n"
