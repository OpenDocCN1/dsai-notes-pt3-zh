    - 这一精度估计的可能的误差是多少？\n\n### 样本错误率和真实错误率\n\n- 定义：假设 h 关于目标函数 f 和数据样本 S 的样本错误率（标记为\
    \ $error_S(h)$）\n\n$$error_S(h)=\\frac{1}{n}\\sum_{x\\in S}\\delta(f(x),h(x))$$\n\
