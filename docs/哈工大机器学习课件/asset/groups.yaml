    # 泛化、θ-包容于和涵蕴


    +   - 考虑如下的定义

    +     - more_general_than：给定两布尔值函数 hj(x) 和 hk(x)，称 hj≥g hk，且且仅当 (∀x)hk(x)→hj(x)（参见第2章）

    +     - θ-包容于：考虑两个子句 Cj 和 Ck，称 Cj θ-包容于 Ck，且且仅当存在一个置换 θ，使得 Cjθ⊆Ck

    +     - 涵蕴：考虑两个子句 Cj 和 Ck，子句 Cj 被称为涵蕴 Ck，且且仅当 Ck 从 Cj 中演绎派生'
  - '[PAGE 485]


    # 泛化、θ-包容于和涵蕴（2）


