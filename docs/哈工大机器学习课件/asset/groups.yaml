  - '[PAGE 14]


    # 贝叶斯法则和概念学习


    +   - 贝叶斯法则为计算给定训练数据下任一假设的后验概率提供了原则性方法，因此可以直接将其作为一个基本的学习方法：计算每个假设的概率，再输出其中概率最大的。这个方法称为
    Brute-Force 贝叶斯概念学习算法。

    +   - 将上面方法与第2章介绍的概念学习算法比较，可以看到：在特定条件下，它们学习得到相同的假设，不同的是第2章的方法不明确计算概率，而且效率更高。'
  - '[PAGE 15]


    # Brute-Force 贝叶斯概念学习


    +   - 概念学习问题：有限假设空间H定义在实例空间X上，任务是学习某个目标概念c。

    +   - Brute-Force MAP学习算法

    +     - 对于H中每个假设h，计算后验概率  $P(h|D)=\frac{P(D|h)P(h)}{P(D)}$

    +     - 输出有最高后验概率的假设  $h_{MAP}=\arg\max_{h\in H} P(h|D)$

    +   - 上面算法需要较大计算量，因为它要计算每个假设的后验概率，对于大的假设空间显得不切实际，但是它提供了一个标准以判断其他概念学习算法的性能'
  - '[PAGE 16]


    # 特定情况下的MAP假设


    +   - 假设

    +     - 训练数据D是无噪声的，即 d_i = c(x_i)

    +     - 目标概念c包含在假设空间H中

    +     - 每个假设的概率相同

    +   - 求得

    +     - 由于所有假设的概率之和是1，因此 P(h) = 1/|H|

    +     - 由于训练数据无噪声，那么给定假设h时，与h一致的D的概率为1，不一致的概率为0，因此 P(D|h) = { 1  ∀d_i, d_i = h(x_i)
    ; 0 otherwise }'
  - "[PAGE 17]\n\n# 特定情况下的MAP假设（2）\n\n+   - 考虑Brute-Force MAP算法的第一步\n+     - h与D不一致，\
    \ $P(h|D)=\\frac{0\\cdot P(h)}{P(D)}=0$\n+     - h与D一致， $P(h|D)=\\frac{1\\cdot\\\
    frac{1}{|H|}}{P(D)}=\\frac{\\frac{1}{|H|}}{\\frac{|H|}{|VS_{H,D}|}\\frac{1}{|H|}=\\\
    frac{1}{|VS_{H,D}|}$，\n+   \n+     $VS_{H,D}$是关于D的变型空间（见第2章，即与D一致的假设集）"
  - '[PAGE 18]


    # 特定情况下的MAP假设（3）


    +   - P(D)的推导

    +     P(D) = Σ_{h_i ∈ H} P(D | h_i) P(h_i)

    +     = Σ_{h_i ∈ V S_{H,D}} 1 × 1/|H| + Σ_{h_i ∉ V S_{H,D}} 0 × 1/|H|

    +     = Σ_{h_i ∈ V S_{H,D}} 1 × 1/|H|

    +     = |V S_{H,D}| / |H|

    +   - 假设的概率演化情况如图6-1所示，初始时所有假设具有相同的概率，当训练数据逐步出现后，不一致假设的概率变为0，而整个概率的和为1，它们均匀分布到剩余的一致假设中

    +   - 每个一致的假设都是MAP假设'
  - '[PAGE 19]


    # MAP假设和一致学习器


    +   - 一致学习器：如果某个学习器输出的假设在训练样例上为0错误率，则称为一致学习器

    +   - 如果H上有均匀的先验概率，且训练数据是确定性和无噪声的，任意一致学习器将输出一个MAP假设

    +   - Find-S算法按照特殊到一般的顺序搜索假设空间H，并输出一个极大特殊的一致假设，因此可知在上面定义的P(h)和P(D|h)概率分布下，它输出MAP假设

    +   - 更一般地，对于先验概率偏袒于更特殊假设的任何概率分布，Find-S输出的假设都是MAP假设'
  md: "\n## 机器学习\n\n## 第6章 贝叶斯学习\n\n### 概述\n\n- 贝叶斯推理提供了一种概率手段，基于如下的假定：待考查的量遵循某概率分布，且可根据这些概率及已观察到的数据进行推理，以作出最优的决策。\n\
    - 贝叶斯推理为衡量多个假设的置信度提供了定量的方法。\n- 贝叶斯推理为直接操作概率的学习算法提供了基础，也为其他算法的分析提供了理论框架。\n\n###\
    \ 简介\n\n- 贝叶斯学习算法与机器学习相关的两个原因：\n- 贝叶斯学习算法能够计算显式的假设概率，比如朴素贝叶斯分类。\n- 贝叶斯方法为理解多数学习算法提供了一种有效的手段，而这些算法不一定直接操作概率数据，比如\n\
    \  - Find-S\n  - 候选消除算法\n  - 神经网络学习：选择使误差平方和最小的神经网络\n  - 推导出另一种误差函数：交叉熵\n  - 分析了决策树的归纳偏置\n\
    \  - 考察了最小描述长度原则\n\n### 贝叶斯方法的难度\n\n- 难度之一：需要概率的初始知识，当概率预先未知时，可以基于背景知识、预先准备好的数据以及基准分布的假定来估计这些概率。\n\
    - 难度之二：一般情况下，确定贝叶斯最优假设的计算代价比较大（在某些特定情形下，这种计算代价可以大大降低）。\n\n### 内容安排\n\n- 介绍贝叶斯理论\n\
    - 定义极大似然假设和极大后验概率假设\n- 将此概率框架应用于分析前面章节的相关问题和学习算法\n- 介绍几种直接操作概率的学习算法\n  - 贝叶斯最优分类器\n\
    \  - Gibbs算法\n  - 朴素贝叶斯分类器\n- 讨论贝叶斯信念网，这是存在未知变量时被广泛使用的学习算法\n\n### 先验概率和后验概率\n\n\
    - 用P(h)表示在没有训练数据前假设h拥有的初始概率。P(h)被称为h的先验概率。\n- 先验概率反映了关于h是一正确假设的机会的背景知识。\n- 如果没有这一先验知识，可以简单地将每一候选假设赋予相同的先验概率。\n\
    - 类似地，P(D)表示训练数据D的先验概率，P(D|h)表示假设h成立时D的概率。\n- 机器学习中，我们关心的是P(h|D)，即给定D时h成立的概率，称为h的后验概率。\n\
    \n### 贝叶斯公式\n\n- 贝叶斯公式提供了从先验概率P(h)、P(D)和P(D|h)计算后验概率P(h|D)的方法。\n\n$$P(h|D) = \\\
    frac{P(D|h)P(h)}{P(D)}$$\n\n- P(h|D)随着P(h)和P(D|h)的增长而增长，随着P(D)的增长而减少，即如果D独立于h时被观察到的可能性越大，那么D对h的支持度越小。\n\
    \n### 极大后验假设\n\n- 学习器在候选假设集合H中寻找给定数据D时可能性最大的假设h，h被称为极大后验假设（MAP）。\n- 确定MAP的方法是用贝叶斯公式计算每个候选假设的后验概率，计算式如下：\n\
    \n$$h_{MAP} = \\arg\\max_{h\\in H} P(h|D) = \\arg\\max_{h\\in H} \\frac{P(D|h)P(h)}{P(D)}\
    \ = \\arg\\max_{h\\in H} P(D|h)P(h) \\qquad (6.2)$$\n\n最后一步，去掉了P(D)，因为它是不依赖于h的常量。\n\
    \n### 极大似然假设\n\n- 在某些情况下，可假定H中每个假设有相同的先验概率，这样式子6.2可以进一步简化，只需考虑P(D|h)来寻找极大可能假设。\n\
    - P(D|h)常被称为给定h时数据D的似然度，而使P(D|h)最大的假设被称为极大似然假设。\n\n$$h_{ML}=\\arg\\max_{h\\in\
    \ H}P(D\\mid h)$$\n\n- 假设空间H可扩展为任意的互斥命题集合，只要这些命题的概率之和为1。\n\n### 举例：一个医疗诊断问题\n\n\
    - 有两个可选的假设：病人有癌症、病人无癌症。\n- 可用数据来自化验结果：正（+）和负（-）。\n- 有先验知识：在所有人口中，患病率是0.008。\n\
    - 对确实有病的患者的化验准确率为98%，对确实无病的患者的化验准确率为97%。\n- 总结如下\n  - P(cancer)=0.008，P(¬cancer)=0.992\n\
    \  - P(+|cancer)=0.98，P(-|cancer)=0.02\n  - P(+|¬cancer)=0.03，P(-|¬cancer)=0.97\n\
    \n### 举例：一个医疗诊断问题（2）\n\n- 问题：假定有一个新病人，化验结果为正，是否应将病人断定为有癌症？求后验概率P(cancer|+)和P(¬cancer|+)。\n\
    - 利用式子6.2找到极大后验假设。\n  - P(+|cancer)P(cancer)=0.0078\n  - P(+|¬cancer)P(¬cancer)=0.0298\n\
    \  - $h_{MAP}=\\neg cancer$\n- 确切的后验概率可将上面的结果归一化以使它们的和为1。\n  - P(cancer|+)=0.0078/(0.0078+0.0298)=0.21\n\
    \  - P(¬cancer|+)=0.79\n- 贝叶斯推理的结果很大程度上依赖于先验概率，另外，不是完全接受或拒绝假设，只是在观察到较多数据后增大或减小了假设的可能性。\n\
    \n### 贝叶斯法则和概念学习\n\n- 贝叶斯法则为计算给定训练数据下任一假设的后验概率提供了原则性方法，因此可以直接将其作为一个基本的学习方法：计算每个假设的概率，再输出其中概率最大的。这个方法称为\
    \ Brute-Force 贝叶斯概念学习算法。\n- 将上面方法与第2章介绍的概念学习算法比较，可以看到：在特定条件下，它们学习得到相同的假设，不同的是第2章的方法不明确计算概率，而且效率更高。\n\
    \n### Brute-Force 贝叶斯概念学习\n\n- 概念学习问题：有限假设空间H定义在实例空间X上，任务是学习某个目标概念c。\n- Brute-Force\
    \ MAP学习算法\n  - 对于H中每个假设h，计算后验概率 $P(h|D)=\\frac{P(D|h)P(h)}{P(D)}$。\n  - 输出有最高后验概率的假设\
    \ $h_{MAP}=\\arg\\max_{h\\in H} P(h|D)$。\n- 上面算法需要较大计算量，因为它要计算每个假设的后验概率，对于大的假设空间显得不切实际，但是它提供了一个标准以判断其他概念学习算法的性能。\n\
    \n### 特定情况下的MAP假设\n\n- 假设\n  - 训练数据D是无噪声的，即 $d_i = c(x_i)$。\n  - 目标概念c包含在假设空间H中。\n\
    \  - 每个假设的概率相同。\n- 求得\n  - 由于所有假设的概率之和是1，因此 $P(h) = 1/|H|$。\n  - 由于训练数据无噪声，那么给定假设h时，与h一致的D的概率为1，不一致的概率为0，因此\n\
    \n$$P(D|h)=\\begin{cases}1 & \\forall d_i,\\ d_i = h(x_i)\\\\0 & \\text{otherwise}\\\
    end{cases}$$\n\n### 特定情况下的MAP假设（2）\n\n- 考虑Brute-Force MAP算法的第一步。\n  - h与D不一致，$P(h|D)=\\\
    frac{0\\cdot P(h)}{P(D)}=0$。\n  - h与D一致，\n\n$$P(h|D)=\\frac{1\\cdot\\frac{1}{|H|}}{P(D)}=\\\
    frac{\\frac{1}{|H|}}{\\frac{|VS_{H,D}|}{|H|}}=\\frac{1}{|VS_{H,D}|}$$\n\n其中 $VS_{H,D}$\
    \ 是关于D的变型空间（见第2章，即与D一致的假设集）。\n\n### 特定情况下的MAP假设（3）\n\n- P(D)的推导\n\n$$P(D)=\\sum_{h_i\\\
    in H}P(D|h_i)P(h_i)=\\sum_{h_i\\in VS_{H,D}}1\\times\\frac{1}{|H|}+\\sum_{h_i\\\
    notin VS_{H,D}}0\\times\\frac{1}{|H|}=\\sum_{h_i\\in VS_{H,D}}\\frac{1}{|H|}=\\\
    frac{|VS_{H,D}|}{|H|}$$\n\n- 假设的概率演化情况如图6-1所示，初始时所有假设具有相同的概率，当训练数据逐步出现后，不一致假设的概率变为0，而所有概率的和为1，它们均匀分布到剩余的一致假设中。\n\
    - 每个一致的假设都是MAP假设。\n\n### MAP假设和一致学习器\n\n- 一致学习器：如果某个学习器输出的假设在训练样例上错误率为0，则称为一致学习器。\n\
    - 如果H上有均匀的先验概率，且训练数据是确定性的且无噪声的，任意一致学习器将输出一个MAP假设。\n- Find-S算法按照特殊到一般的顺序搜索假设空间H，并输出一个极大特殊的一致假设，因此可知在上面定义的P(h)和P(D|h)概率分布下，它输出MAP假设。\n\
    - 更一般地，对于先验概率偏袒于更特殊假设的任何概率分布，Find-S输出的假设都是MAP假设。\n"
  mdcn: "\n## 机器学习\n\n## 第6章 贝叶斯学习\n\n### 概述\n\n- 贝叶斯推理提供了一种概率手段，基于如下的假定：待考查的量遵循某概率分布，且可根据这些概率及已观察到的数据进行推理，以作出最优的决策。\n\
    - 贝叶斯推理为衡量多个假设的置信度提供了定量的方法。\n- 贝叶斯推理为直接操作概率的学习算法提供了基础，也为其他算法的分析提供了理论框架。\n\n###\
    \ 简介\n\n- 贝叶斯学习算法与机器学习相关的两个原因：\n- 贝叶斯学习算法能够计算显式的假设概率，比如朴素贝叶斯分类。\n- 贝叶斯方法为理解多数学习算法提供了一种有效的手段，而这些算法不一定直接操作概率数据，比如\n\
    \  - Find-S\n  - 候选消除算法\n  - 神经网络学习：选择使误差平方和最小的神经网络\n  - 推导出另一种误差函数：交叉熵\n  - 分析了决策树的归纳偏置\n\
    \  - 考察了最小描述长度原则\n\n### 贝叶斯方法的难度\n\n- 难度之一：需要概率的初始知识，当概率预先未知时，可以基于背景知识、预先准备好的数据以及基准分布的假定来估计这些概率。\n\
    - 难度之二：一般情况下，确定贝叶斯最优假设的计算代价比较大（在某些特定情形下，这种计算代价可以大大降低）。\n\n### 内容安排\n\n- 介绍贝叶斯理论\n\
    - 定义极大似然假设和极大后验概率假设\n- 将此概率框架应用于分析前面章节的相关问题和学习算法\n- 介绍几种直接操作概率的学习算法\n  - 贝叶斯最优分类器\n\
    \  - Gibbs算法\n  - 朴素贝叶斯分类器\n- 讨论贝叶斯信念网，这是存在未知变量时被广泛使用的学习算法\n\n### 先验概率和后验概率\n\n\
    - 用P(h)表示在没有训练数据前假设h拥有的初始概率。P(h)被称为h的先验概率。\n- 先验概率反映了关于h是一正确假设的机会的背景知识。\n- 如果没有这一先验知识，可以简单地将每一候选假设赋予相同的先验概率。\n\
    - 类似地，P(D)表示训练数据D的先验概率，P(D|h)表示假设h成立时D的概率。\n- 机器学习中，我们关心的是P(h|D)，即给定D时h成立的概率，称为h的后验概率。\n\
    \n### 贝叶斯公式\n\n- 贝叶斯公式提供了从先验概率P(h)、P(D)和P(D|h)计算后验概率P(h|D)的方法。\n\n$$P(h|D) = \\\
    frac{P(D|h)P(h)}{P(D)}$$\n\n- P(h|D)随着P(h)和P(D|h)的增长而增长，随着P(D)的增长而减少，即如果D独立于h时被观察到的可能性越大，那么D对h的支持度越小。\n\
    \n### 极大后验假设\n\n- 学习器在候选假设集合H中寻找给定数据D时可能性最大的假设h，h被称为极大后验假设（MAP）。\n- 确定MAP的方法是用贝叶斯公式计算每个候选假设的后验概率，计算式如下：\n\
    \n$$h_{MAP} = \\arg\\max_{h\\in H} P(h|D) = \\arg\\max_{h\\in H} \\frac{P(D|h)P(h)}{P(D)}\
    \ = \\arg\\max_{h\\in H} P(D|h)P(h) \\qquad (6.2)$$\n\n最后一步，去掉了P(D)，因为它是不依赖于h的常量。\n\
    \n### 极大似然假设\n\n- 在某些情况下，可假定H中每个假设有相同的先验概率，这样式子6.2可以进一步简化，只需考虑P(D|h)来寻找极大可能假设。\n\
    - P(D|h)常被称为给定h时数据D的似然度，而使P(D|h)最大的假设被称为极大似然假设。\n\n$$h_{ML}=\\arg\\max_{h\\in\
    \ H}P(D\\mid h)$$\n\n- 假设空间H可扩展为任意的互斥命题集合，只要这些命题的概率之和为1。\n\n### 举例：一个医疗诊断问题\n\n\
    - 有两个可选的假设：病人有癌症、病人无癌症。\n- 可用数据来自化验结果：正（+）和负（-）。\n- 有先验知识：在所有人口中，患病率是0.008。\n\
    - 对确实有病的患者的化验准确率为98%，对确实无病的患者的化验准确率为97%。\n- 总结如下\n  - P(cancer)=0.008，P(¬cancer)=0.992\n\
    \  - P(+|cancer)=0.98，P(-|cancer)=0.02\n  - P(+|¬cancer)=0.03，P(-|¬cancer)=0.97\n\
    \n### 举例：一个医疗诊断问题（2）\n\n- 问题：假定有一个新病人，化验结果为正，是否应将病人断定为有癌症？求后验概率P(cancer|+)和P(¬cancer|+)。\n\
    - 利用式子6.2找到极大后验假设。\n  - P(+|cancer)P(cancer)=0.0078\n  - P(+|¬cancer)P(¬cancer)=0.0298\n\
    \  - $h_{MAP}=\\neg cancer$\n- 确切的后验概率可将上面的结果归一化以使它们的和为1。\n  - P(cancer|+)=0.0078/(0.0078+0.0298)=0.21\n\
    \  - P(¬cancer|+)=0.79\n- 贝叶斯推理的结果很大程度上依赖于先验概率，另外，不是完全接受或拒绝假设，只是在观察到较多数据后增大或减小了假设的可能性。\n\
    \n### 贝叶斯法则和概念学习\n\n- 贝叶斯法则为计算给定训练数据下任一假设的后验概率提供了原则性方法，因此可以直接将其作为一个基本的学习方法：计算每个假设的概率，再输出其中概率最大的。这个方法称为\
    \ Brute-Force 贝叶斯概念学习算法。\n- 将上面方法与第2章介绍的概念学习算法比较，可以看到：在特定条件下，它们学习得到相同的假设，不同的是第2章的方法不明确计算概率，而且效率更高。\n\
    \n### Brute-Force 贝叶斯概念学习\n\n- 概念学习问题：有限假设空间H定义在实例空间X上，任务是学习某个目标概念c。\n- Brute-Force\
    \ MAP学习算法\n  - 对于H中每个假设h，计算后验概率 $P(h|D)=\\frac{P(D|h)P(h)}{P(D)}$。\n  - 输出有最高后验概率的假设\
    \ $h_{MAP}=\\arg\\max_{h\\in H} P(h|D)$。\n- 上面算法需要较大计算量，因为它要计算每个假设的后验概率，对于大的假设空间显得不切实际，但是它提供了一个标准以判断其他概念学习算法的性能。\n\
    \n### 特定情况下的MAP假设\n\n- 假设\n  - 训练数据D是无噪声的，即 $d_i = c(x_i)$。\n  - 目标概念c包含在假设空间H中。\n\
    \  - 每个假设的概率相同。\n- 求得\n  - 由于所有假设的概率之和是1，因此 $P(h) = 1/|H|$。\n  - 由于训练数据无噪声，那么给定假设h时，与h一致的D的概率为1，不一致的概率为0，因此\n\
    \n$$P(D|h)=\\begin{cases}1 & \\forall d_i,\\ d_i = h(x_i)\\\\0 & \\text{otherwise}\\\
    end{cases}$$\n\n### 特定情况下的MAP假设（2）\n\n- 考虑Brute-Force MAP算法的第一步。\n  - h与D不一致，$P(h|D)=\\\
    frac{0\\cdot P(h)}{P(D)}=0$。\n  - h与D一致，\n\n$$P(h|D)=\\frac{1\\cdot\\frac{1}{|H|}}{P(D)}=\\\
    frac{\\frac{1}{|H|}}{\\frac{|VS_{H,D}|}{|H|}}=\\frac{1}{|VS_{H,D}|}$$\n\n其中 $VS_{H,D}$\
    \ 是关于D的变型空间（见第2章，即与D一致的假设集）。\n\n### 特定情况下的MAP假设（3）\n\n- P(D)的推导\n\n$$P(D)=\\sum_{h_i\\\
    in H}P(D|h_i)P(h_i)=\\sum_{h_i\\in VS_{H,D}}1\\times\\frac{1}{|H|}+\\sum_{h_i\\\
    notin VS_{H,D}}0\\times\\frac{1}{|H|}=\\sum_{h_i\\in VS_{H,D}}\\frac{1}{|H|}=\\\
    frac{|VS_{H,D}|}{|H|}$$\n\n- 假设的概率演化情况如图6-1所示，初始时所有假设具有相同的概率，当训练数据逐步出现后，不一致假设的概率变为0，而所有概率的和为1，它们均匀分布到剩余的一致假设中。\n\
    - 每个一致的假设都是MAP假设。\n\n### MAP假设和一致学习器\n\n- 一致学习器：如果某个学习器输出的假设在训练样例上错误率为0，则称为一致学习器。\n\
    - 如果H上有均匀的先验概率，且训练数据是确定性的且无噪声的，任意一致学习器将输出一个MAP假设。\n- Find-S算法按照特殊到一般的顺序搜索假设空间H，并输出一个极大特殊的一致假设，因此可知在上面定义的P(h)和P(D|h)概率分布下，它输出MAP假设。\n\
    - 更一般地，对于先验概率偏袒于更特殊假设的任何概率分布，Find-S输出的假设都是MAP假设。\n"
