    \  - 能够找到一个B不涵盖h，但B∧D涵盖h的例子，如\n    - B=(∀x) IF ((PlayTennis=Yes)←(Humidity=x))\
    \ THEN ((PlayTennis=Yes)←(Humidity≤x))\n    - D=Humidity=0.3\n    - h=(PlayTennis=Yes)←(Humidity≤0.3)\n\
    - 知识级学习被用来称这类类型的学习：学到的假设涵盖的预测不能被单独的领域理论涵盖\n- 由断言集合Y涵盖的所有预测的集合常称为Y的演绎闭包，知识级学习中B的演绎闭包是B+h演绎闭包的真子集\n\
    \n## 搜索控制知识的基于解释的学习\n\n## 小结\n\n- 纯粹的归纳学习方法寻找一个假设以拟合训练数据，而纯粹的分析学习方法搜寻一个假设拟合学习器的先验知识并覆盖训练样例\n\
    - 基于解释的学习是分析学习的一种形式，其中学习器处理每个新训练样例的方法是：\n  - 按照领域理论解释该样例中观察到的目标值\n  - 分析此解释，确定解释成立的一般条件\n\
    \  - 改进假设，合并这些一般条件\n- Prolog-EBG是基于解释的学习算法，它使用一阶Horn子句来表示其领域理论和学到的假设，在Prolog-EBG中，解释即是Prolog证明，而从解释中抽取的假设是此证明的最弱前像\n\
    \n## 小结（2）\n\n- Prolog-EBG这样的分析学习方法建立游泳的中间特征，它是分析单独训练样例的一个副产品，这种生成特征的分析途径补充了如反向传播这样的归纳方法中基于统计方法的中间特征生成\n\
    - Prolog-EBG不会产生能扩展其领域理论的演绎闭包的假设，但其他演绎学习过程具备这个能力\n- 可应用正确且完整的领域理论的一类重要问题是大的状态空间的搜索问题，如Prodigy和Soar这样的系统已显示了基于解释的学习方法的功效，它们自动获取有效的搜索规则以加速后续的问题求解\n\
    - 纯粹的演绎推理的一个缺点是：它输出的假设的正确性只在领域理论正确时才能保证\n\n## 补充读物\n\n- Fikes et al.1972，通过对Abstrips中的算子的分析学习宏算子\n\
    - Soloway1977，在学习中使用明确的先验知识\n- Dejong1981, Mitchell1981, Winston et al.1983, Silver1983\
    \ 讨论了基于解释的学习\n- Ram & Leake1995，给出了关于目的和鲜艳知识在人类和记起学习中的作用的综述\n- Laird et al.1986提出的Soar系统和Carbonell\
    \ et al.1990描述的Prodigy系统是使用基于解释的学习来学习问题求解的两个最成熟的系统\n\n## 补充读物（2）\n\n- 对人类学习的实验性研究支持了这样一个猜想，即人类的学习是基于解释的\n\
    \  - Ahn et al.1987和Qin et al.1992概述了支持人类应用基于解释的学习过程这一猜想的证据\n  - Wisniewski &\
    \ Medin1995描述了对人类学习的实验性研究，它建议在先验知识和观察数据之间进行丰富的相互作用以影响学习过程\n  - Kotovsky & Baillargeon1994描述的实验说明，即使11个月大的婴儿在学习时也是基于其先验知识的\n\
    - Van Harmelen & Bundy1988提供了基于解释的学习中执行的分析与Prolog程序中使用的几类优化方法的关系\n\n## 机器学习\n\n\
    ## 第2章 概念学习和一般到特殊序\n\n## 提纲\n\n- 概念学习\n  - 给定某一类别的若干正例和反例，从中获得该类别的一般定义。\n- 搜索的观点\n\
    \  - 在预定义的假设空间中搜索假设，使其与训练样例有最佳的拟合。\n  - 利用假设空间的偏序结构\n- 算法收敛到正确假设的条件\n- 归纳学习的本质，从训练数据中泛化的理由\n\
    \n## 简介\n\n- 许多机器学习涉及到从特殊训练样例中得到一般概念。\n- 概念，可被看作一个对象或事件集合，它是从更大的集合中选取的子集，或在这个较大集合中定义的布尔函数。\n\
    - 概念学习问题的定义\n  - 给定一个样例集合以及每个样例是否属于某个概念的标注，怎样推断出该概念的一般定义。又称从样例中逼近布尔函数。\n  - 概念学习是指从有关某个布尔函数的输入输出训练样例中推断出该布尔函数。\n\
    \n## 概念学习任务\n\n- 一个例子\n  - 目标概念，Aldo进行水上运动的日子，表示为布尔函数EnjoySport\n  - 任务目的，基于某天的各属性，预测EnjoySport的值\n\
    \  - 一个样例集，每个样例表示为属性的集合\n\n## 概念学习任务（2）\n\n表2-1 目标概念EnjoySport的训练样例\n\n| Example\
    \ | Sky | AirTemp | Humidity | Wind | Water | Forecast | EnjoySport |\n|---|---|---|---|---|---|---|---|\n\
    | 1 | Sunny | Warm | Normal | Strong | Warm | Same | Yes |\n| 2 | Sunny | Warm\
    \ | High | Strong | Warm | Same | Yes |\n| 3 | Rainy | Cold | High | Strong |\
    \ Warm | Change | Yes |\n| 4 | Sunny | Warm | High | Strong | Cool | Change |\
    \ Yes |\n\n## 概念学习任务（3）\n\n- 表示假设的形式\n  - 一个简单的形式，实例的各属性约束的合取式\n  - 令每个假设为6个约束（或变量）的向量，每个约束对应一个属性可取值范围，为\n\
    \    - ？ 任意本属性可接受的值\n    - 明确指定的属性值\n    - φ 不接受任何值\n  - 假设的例子\n    - <?, Cold,\
    \ High, ?, ?, ?>\n    - <?, ?, ?, ?, ?, ?> // 所有的样例都是正例\n    - <φ, φ, φ, φ, φ,\
    \ φ> // 所有的样例都是反例\n\n## 概念学习任务（4）\n\nEnjoySport概念学习任务\n\n- 已知\n  - 实例集X\n    -\
    \ 每个实例x由6个属性描述，每个属性的取值范围已确定\n  - 假设集H\n    - 每个假设h描述为6个属性的取值约束的合取\n  - 目标概念c\n\
    \    - 一个布尔函数，变量为实例\n  - 训练样例集D\n    - 目标函数（或目标概念）的正例和反例\n- 求解\n  - H中的一假设h，使对于X中任意x，h(x)=c(x)\n"
