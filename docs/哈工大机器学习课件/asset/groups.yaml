    +   - 由许多独立同分布的因素的和所生成的噪声将成为正态分布（当然，现实中不同的分量对噪声的贡献也许不是同分布的）

    +   - 使误差平方最小化的方法经常被用于神经网络、曲线拟合及其他许多实函数逼近的算法中

