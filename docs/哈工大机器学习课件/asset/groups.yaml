    - 训练过程\n  - 从学习器可得到的间接训练经验中导出上面的训练样例\n  - 调整系数wi，最佳拟合这些训练样例\n\n## 选择函数逼近算法（2）\n\
    \n- 估计训练值\n  - 困难处\n  - 一个简单的方法， Vtrain(b)=V’(Successor(b))\n- 调整权值\n  - 最佳拟合的定义，比如误差平方和最小\n\
