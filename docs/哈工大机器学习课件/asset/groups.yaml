    +   - 对于e这样的连续变量上的概率，使用概率密度表示概率分布，它在所有值上的积分为1，用小写的p表示。有限概率P有时又称为概率质量

    +   - 概率密度函数： $p(x_0)=\lim_{\varepsilon\to0}\frac{1}{\varepsilon}P(x_0\le x <
    x_0+\varepsilon)$'
