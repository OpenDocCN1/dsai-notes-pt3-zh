    +   - 如果另外收集40个随机抽取的样例S’，样本错误率 $error_{S''}(h)$ 将与原来的 $error_S(h)$ 存在一些差别

    +   - 如果不断重复这一实验，每次抽取一个包含40样例的样本，将会发现约95%的实验中计算所得的区间包含真实错误率

    +   - 将上面的区间称为 $error_D(h)$ 的95%置信区间估计'
  - '[PAGE 320]


    # 置信区间表达式的推广


    +   - 常数1.96是由95%这一置信度确定的

    +   - 定义z_N为计算N%置信区间的常数（取值见表5-1），计算error_D(h)的N%置信区间一般表达式（公式5.1）为：

    +     error_s(h) ± z_N sqrt( error_s(h)(1 - error_s(h)) / n )

    +   - 可以求得同样情况下的68%置信区间，从直觉上可以看出68%置信区间要小于95%置信区间，因为减小了要求error_D(h)落入的概率'
  - '[PAGE 321]


    # 置信区间表达式的推广（2）


    +   - 公式5.1只能应用于离散值假设，它假定样本S抽取的分布与将来的数据抽取的分布相同，并且假定数据不依赖于所测试的假设

    +   - 公式5.1只提供了近似的置信区间，这一近似在至少包含30个样例，并且 $error_S(h)$ 不太靠近0或1时很接近真实情况

