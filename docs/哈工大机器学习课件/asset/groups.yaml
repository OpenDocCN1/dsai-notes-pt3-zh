    +   - 对于无法知道回报函数和状态转移函数完美知识的情形，我们使用评估函数Q

    +   - 评估函数Q的定义：

    +     $Q(s,a)=r(s,a)+\gamma V^{*}(\delta(s,a))$

    +   - 式子13.3可以重写为：

    +     $\pi^{*}(s)=\arg\max_{a} Q(s,a)$

    +   - 因此只需对当前状态的Q值做出反应，就可以选择到全局最优化的动作序列'
