- raw:
  - '[PAGE 315]


    # 评估假设的问题


    +   - 给定假设h和包含若干按D分布抽取的样例的数据集，如何针对将来按同样分布抽取的实例，得到对h的精度最好估计

    +   - 这一精度估计的可能的误差是多少'
  - '[PAGE 316]


    # 样本错误率和真实错误率


    +   - 定义：假设h关于目标函数f和数据样本S的样本错误率（标记为errorₛ(h)）

    +     $error_s(h)=\frac{1}{n}\sum_{x\in S}\delta(f(x),h(x))$

    +     $n=|S|$

    +     $\delta(f(x),h(x))=\begin{cases}1 & f(x)\neq h(x)\\0 & otherwise\end{cases}$

    +   - 定义：假设h关于目标函数f和分布D的真实错误率（标记为error_D(h)）

    +     $error_D(h)=Pr_{x\in D}[f(x)\neq h(x)]$'
  - '[PAGE 317]


    # 样本错误率和真实错误率（2）


    +   - 我们想知道的是假设的真实误差，因为这是在分类未来样例时可以预料到的误差。

    +   - 我们所能测量的只是样本错误率，因为样本数据是我们知道的。

    +   - 本节要考虑的问题是：样本错误率在何种程度上提供了对真实错误率的估计？'
  - '[PAGE 318]


    # 离散值假设的置信区间


