  - "[PAGE 571]\n\n# 时间差分学习\n\n+   - Q学习算法是时间差分算法中的特例，时间差分算法的学习过程是减小机器人在不同的时间做出估计间的差异\n\
    +   - 基于单步、两步、多步前瞻计算的训练值\n+     \n+     $Q^{(1)}(s_t,a_t)=r_t+\\gamma \\max_a\
    \ \\hat{Q}(s_{t+1},a)$\n+     \n+     $Q^{(2)}(s_t,a_t)=r_t+\\gamma r_{t+1}+\\\
    gamma^2 \\max_a \\hat{Q}(s_{t+2},a)$\n+     \n+     $Q^{(n)}(s_t,a_t)=r_t+\\gamma\
