    +   - K-CNF：任意长度的合取式T₁∧...∧Tⱼ，其中每个Tᵢ为最多k个布尔变量的析取

    +   - 容易证明K-CNF包含了K项DNF，因此概念类k项DNF是使用H=K-CNF的一个有效算法可PAC学习的'
  - '[PAGE 247]


    # 无限假设空间的样本复杂度


    +   - 式子7.2用|H|刻画样本复杂度有两个缺点：

    +     - 可能导致非常弱的边界

    +     - 对于无限假设空间的情形，无法应用

    +   - 本节考虑H的复杂度的另一种度量，称为H的Vapnik-Chervonenkis维度（简称VC维或VC(H)）

    +   - 使用VC维代替|H|也可以得到样本复杂度的边界，基于VC维的样本复杂度比|H|更紧凑，另外还可以刻画无限假设空间的样本复杂度'
  - '[PAGE 248]


    # 打散一个实例集合


    +   - VC维衡量假设空间复杂度的方法不是用不同假设的数量|H|，而是用X中能被H彻底区分的不同实例的数量

    +   - S是一个实例集，H中每个h导致S的一个划分，即h将S分割为两个子集{x∈S|h(x)=1}和{x∈S|h(x)=0}

    +   - 定义：一实例集S被假设空间H打散，当且仅当对S的每个划分，存在H中的某假设与此划分一致

    +   - 如果一实例集合没有被假设空间打散，那么必然存在某概念可被定义在实例集之上，但不能由假设空间表示

    +   - H的这种打散实例集合的能力是其表示这些实例上定义的目标概念的能力的度量'
  - '[PAGE 249]


    # Vapnik-Chervonenkis维度


    +   - 打散一实例集合的能力与假设空间的归纳偏置紧密相关

    +   - 无偏的假设空间能够打散所有实例组成的集合X

    +   - 直观上，被打散的X的子集越大，H的表示能力越强

    +   - 定义：定义在实例空间X上的假设空间H的Vapnik-Chervonenkis维，是可被H打散的X的最大有限子集的大小

    +   - 如果X的任意有限大的子集可被H打散，则VC(H)=∞'
  - '[PAGE 250]


    # Vapnik-Chervonenkis维度（2）


    +   - 对于任意有限的H， VC(H)<=log₂|H|

    +   - VC维举例

    +     - 假定实例空间X为实数集合，而且H为实数轴上的区间的集合，问VC(H)是多少？

    +       - 只要找到能被H打散的X的最大子集，首先包含2个实例的集合能够被H打散，其次包含3个实例的集合不能被H打散，因此VC(H)=2

    +     - 实例集合S对应x、y平面上的点，令H为此平面内所有线性决策面的集合，问H的VC维是多少？

    +       - 能够找到3个点组成的集合，被H打散，但无法找到能够被H打散的4个点组成的集合，因此VC(H)=3

    +       - 更一般地，在r维空间中，线性决策面的VC维为r+1'
