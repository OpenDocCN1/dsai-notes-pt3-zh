  - "[PAGE 569]\n\n# 非确定性回报和动作\n\n+   - 考虑非确定性情况，即回报函数和转换函数有概率的输出，比如西洋双陆棋，输出的动作具有固定的概率性\n\
    +   - 把处理确定性情况的方法扩展到非确定性的情况，一种一般化的方法是引入期望值 $V^*(s) = E[\\sum_{i=0}^{\\infty} \\\
    gamma^i r_{t+i+1}]$\n+   - 把非确定性情况下的Q(s,a)简单地重定义为在确定性情况下定义的量的期望值\n+   \n+   $Q(s,a)\
    \ = E[r(s,a) + \\gamma V^*(\\delta(s,a))]$ \n+   $= E[r(s,a)] + \\gamma E[V^*(\\\
    delta(s,a))]$ \n+   $= E[r(s,a)] + \\gamma \\sum_{s'} P(s'|s,a) V^*(s')$ \n+ \
    \  $= E[r(s,a)] + \\gamma \\sum_{s'} P(s'|s,a) \\max Q(s',a')$"
