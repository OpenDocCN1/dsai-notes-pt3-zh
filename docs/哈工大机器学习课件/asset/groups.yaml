    right)$\n- 按照信息论理论，Foil Gain(L,R)可看作，为了编码R的所有正例约束的分类所需的全部位数由于L带来的减少\n\n## 学习递归规则集\n\
    \n- 如果在表10-4的算法输入参数Predicates 中包含目标谓词（即规则头的谓词），那么FOIL在生成候选文字时必须考虑它，这允许产生递归的规则\n\
    - 递归规则是否能被FOIL发现，取决定于它在FOIL的贪婪搜索中是否比其他候选评分更高\n- 避免在学习规则集中产生无限递归\n\n## FOIL小结\n\
    \n- FOIL扩展了CN2的序列覆盖算法，执行一般到特殊的搜索，每步增加一个新的文字到规则前提中，新文字可是规则前提或后件中已有的变量，或为新变量\n-\
    \ FOIL在每一步使用Foil_Gain函数在候选新文字中进行选择，如果新文字可指向目标谓词，那么FOIL可能学习到递归规则\n- 在训练数据无噪声的情况下，FOIL可持续地增加新文字到规则中，直到不覆盖任何反例\n\
    - 为处理有噪声数据，搜索的终止需要在规则精度、覆盖度和复杂性之间做出折中\n- FOIL使用最小描述长度的方法终止规则增长，新的文字只在它们的描述长度短于它们所解释的数据的描述长度时才被加入\n\
    \n## 作为逆演绎的归纳\n\n- 归纳逻辑编程，基于一个简单的事实：归纳是演绎的逆过程\n- 一般来说，机器学习涉及的是如何建立能解释观察数据的理论，给定某些数据D和一些不完整的背景知识B，学习过程被描述为生成一个假设h，它与B一起解释了D，即\n\
    \  (∀<x_i, f(x_i)><=D)(B ∧ h ∧ x_i) ⇒ f(x_i)\n- 基于背景知识扩展谓词集合的过程，称为建设性归纳\n- 可以利用演绎推理的逆过程，以使归纳泛化的过程自动化\n\
    \n### （2）\n\n- 我们感兴趣的是设计一个逆涵蕴算子 o(B,D)，它使用训练数据 D 和背景知识 B 作为输入，输出一个满足式子 10.2 的假设\
    \ h\n- 满足式子 10.2 的假设很多，一般依赖最小描述长度准则来进行选择\n- 逆演绎的归纳方法有许多有吸引力的特点：\n  - 包含了一种普遍的学习定义方法，即寻找某个一般概念，它与给定的训练样例相拟合\n\
    \  - 通过引入背景知识，可以对一个假设何时可被称作“拟合”训练数据进行更充分的定义\n  - 通过引入背景知识 B，该公式要求学习算法使用这一背景信息来引导的搜索，而不是只搜索语法上合法的假设空间\n\
    \n### （3）\n\n- 不能处理有噪声的数据，不允许在观察到实例xi和其目标值f(xi)中出现差错的可能性，这样的差错可能产生对h的不一致约束，但是多数形式逻辑框架完全没有处理不一致断言的能力\n\
    - 一阶逻辑语言的表征力太强，而且满足式子10.2的假设很多，以至于假设空间的搜索在一般情形下难以执行\n- 尽管直觉上背景知识有助于限制假设的搜索，但在多数ILP系统中，搜索的复杂度随着背景知识的增加而增高\n\
    \n## 递归纳\n\n- 自动演绎的一般方法是Robinson提出的归纳规则，归纳规则是一阶逻辑中一个合理且完备的演绎推理规则\n- 算法Gigiol通过反转归纳规则来形成逆涵蕴算子\n\
    - 命题归纳规则是 P ∨ L\n  ─────\n  ¬L ∨ R\n  ─────\n  P ∨ R\n- 归纳算子\n  - 给定初始子句C1和C2，从子句C1中寻找一个文字L，并且¬L出现在C2中\n\
    \  - 通过合并C1和C2中的除了L和¬L的所有文字，形成归纳式C，即C=(C1-{L})∪(C2-{¬L})\n- 给定两个子句，归纳算子首先确定文字L是否以正文字出现在一个子句中，以负文字出现在另一个子句中，\n\
    \n## 逆归纳（2）\n\n- 归纳算子根据初始子句C1和C2，得到归纳式C，逆涵蕴算子O(C,C1)根据C和C1得到另一个初始子句C2\n- 逆归纳是不确定的，即可能有多个子句C2，使得C1和C2产生C，在其中进行选择的一个启发式方法是偏好更短的子句，即假定C2和C1没有共同的文字\n\
    - 逆归纳算子\n  - 给定初始子句C1和C，寻找一个文字L，它出现在子句C1中但不出现在C中\n  - 通过包含下列的文字，形成第二个子句C2=(C-(C1-{L}))∪{¬L}\n\
    \n## 逆归纳（3）\n\n- 可以基于逆归纳这样的逆演算法子开发出规则学习算法来\n  - 一种策略是使用序列覆盖算法，循环地以这种方法学习Horn子句集\n\
    \  - 每次循环中，算法选择没有被以前学习到的子句覆盖的一个训练样例<xi,f(xi)>，然后应用归纳规则来生成满足(B∧hi∧xi)⇒f(xi)的候选假设hi\n\
    \  - 这是一个样例驱动的搜索，因为每个候选假设的建立是为了覆盖一个特定样例\n  - 如果存在多个候选假设，那么选择的策略是选取在其他样例上也有最高精度的假设\n\
    - Gigo1程序使用了结合这种序列覆盖算法的逆归纳，通过它与用户交互，获得训练样例并引导它在可能的归纳推理步骤的巨大空间中的搜索，\n- Gigo1使用了一阶表示而不是命题表示\n\
    \n## 一阶归纳\n\n- 归纳规则可以很容易地扩展到一阶表示，与命题归纳的关键不同是：这个过程基于合一置换操作\n- 定义置换为变量到项的任意映射，符号Wθ表示应用置换θ到表达式W上的结果\n\
    - 置换的例子\n  - L=Father(x,Bill)\n  - θ={x/Bob, y/z}\n  - Lθ=Father(Bob,Bill)\n-\
    \ 合一置换：如果L1θ=L2θ，则θ为两个文字L1和L2的合一置换\n\n### （2）\n\n- 合一置换的意义在于可用来推广命题的归纳规则，在一阶归纳中，从子句C1中寻找一文字L1和在C2中寻找一文字L2，使得存在L1和¬L2的合一置换，归纳式计算方法如下\n\
    \  \n  C=(C1-{L1})θ∪(C2-{L2})θ\n\n- 表10-7一阶形式的归纳规则\n  - 寻找C1中的文字L1，C2中的文字L2，以及置换θ，使得L1θ=¬L2θ\n\
    \  - 通过包含C1θ和C2θ中，除了L1θ和¬L2θ以外的文字，形成归纳式C，见式子10.3\n"
