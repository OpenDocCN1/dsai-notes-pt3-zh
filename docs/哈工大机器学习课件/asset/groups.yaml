  - '[PAGE 572]


    # 时间差分学习（2）


    +   - Sutton使用的合并从不同前瞻距离中获得的估计的 TD(λ)法

    +     Q^λ(s_t,a_t) = (1-λ)[Q^(1)(s_t,a_t) + λ Q^(2)(s_t,a_t) + λ² Q^(3)(s_t,a_t)
    + ...]

    +   - 一个等价的递归定义

    +     Q^λ(s_t,a_t) = r_t + γ[(1-λ) max_a Q̂(s_{t+1},a) + λ Q^λ(s_{t+1},a_{t+1})]

    +   - 如果选择λ=0，则得到原来的训练估计Q^(1)，它只考虑估计中的单步差异，当λ增大时，算法重点逐渐转移到更远的前瞻步

    +   - TD(λ)方法的动机是，在某些条件下，如果考虑更远的前瞻，训练会更有效

    +     - 如果机器人遵循最优策略选择动作，λ=1时将提供对真实Q值的完美估计，而不能怎么不准确'
  - '[PAGE 573]


    # 从样例中泛化


    +   - Q学习中，只有每个可能的状态-动作被无限频繁的访问，学习过程才会收敛，执行效率很低


    +   - 比较实际的系统通常在Q学习中合并使用其他章讨论的函数逼近方法


    +   - 把反向传播算法结合到Q学习中，方法是用神经网络替代查找表，把每个 更新作为训练样例，例如


    +     - 把状态s和动作a编码为网络输入，并使用式子13.7和13.10训练网络


    +   - 一旦引入了泛化函数逼近器，增强学习将不能收敛'
  - '[PAGE 574]


    # 与动态规划的联系


    +   - 像Q学习这样的增强学习方法，与用于解决马尔科夫决策过程的动态规划方法有紧密的关系

    +   - Q学习的新颖之处在于它假定不具有环境的完美知识，因此不能在内部模拟的状态空间移动中学习，而必须在现实世界的移动中观察后果

    +   - 我们主要考虑机器人为收敛到一个可接受的策略必须执行的真实世界动作的数量，而不是计算迭代次数，这是因为在外部世界中执行动作的时间和费用开销比计算开销更值得关注

    +   - 在真实环境中移动学习并观察结果的系统通常称为在线系统，而主要通过模型模拟动作的学习的被称为离线系统'
  - "[PAGE 575]\n\n# 与动态规划的联系（2）\n\n+   - Bellman等式形成了解决MDP的动态规划方法的基础，形式如下\n+    \
    \ $(\forall s \\in S) V^*(s) = E[r(s,\\pi(s)) + \\gamma V^*(\\delta(s,\\pi(s)))]$\n\
    +   - Bellman证明了最优策略满足上式，且满足上式的任何策略为最优策略\n+   - 动态规划早期的工作包括Bellman-Ford最短路径算法，它基于节点邻居的距离，通过不断更新每个图节点到终点的估计距离来学习图中的路径，图的各边以及目标节点已知的假定，等价于移动函数和回报函数已知的假定"
  - '[PAGE 576]


    # 小结


    +   - 增强学习解决自治机器人学习控制策略的问题，目标是使机器人从任意起始状态收到的总回报最大化

    +   - 本章介绍的增强学习算法适合一类被称为马尔科夫决策过程的问题，即应用任意动作到任意状态上的输出只取决于当前动作和状态

    +   - Q学习是增强学习的一种形式，其中机器人学习的是一组状态和动作上的估计函数，它被定义为最大期望折算累积回报，算法可用在不具备动作怎样影响环境的先验知识情况下

    +   - 在一定假定下，Q学习具备收敛性，实践中需要大量的训练循环

    +   - Q学习是更广泛的时间差分算法中的一种，时间差分算法通过不断减小在不同时间内产生的估计间的差异来学习

    +   - 增强学习与动态规划有密切联系，关键差异是，动态规划假定拥有状态转移函数和回报函数的知识，而Q学习假定缺乏这些知识'
  - '[PAGE 577]


    # 补充读物


    +   - Samuel1959，西洋双陆棋学习程序

    +   - Bellman1958，Ford & Fulkerson1962，最短路径算法

    +   - Holland1986，学习分类系统的组桶式方法

    +   - Barto et al.1983，时间信用分配方法

    +   - Sutton1988，Dayan1992，TD(λ)方法

    +   - Watkin1989，Q学习

    +   - McCallum1995和Littman1996，增强学习的扩展

    +   - ...'
