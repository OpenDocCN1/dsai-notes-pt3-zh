  - '[PAGE 231]


    # PAC可学习性（2）


    +   - PAC可学习性的定义

    +     - 考虑定义在长度为n的实例集合X上的一概念类别C，学习器L使用假设空间H。当对所有c∈C，X上的分布D，ε和δ满足0<ε, δ<1/2，学习器L将以至少1-δ输出一假设h∈H，使error_D(h)≤ε，这时称C是使用H的L可PAC学习的，所使用的时间为1/ε，1/δ，n以及size(c)的多项式函数

    +   - 上面定义要求学习器L满足两个条件

    +     - L必须以任意高的概率（1-δ）输出一个错误率任意低（ε）的假设

    +     - 学习过程必须是高效的，其时间最多以多项式方式增长

    +   - 上面定义的说明

    +     - 1/ε和1/δ表示了对输出假设要求的强度，n和size(c)表示了实例空间X和概念类别C中固有的复杂度

