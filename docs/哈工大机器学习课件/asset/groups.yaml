    - 但是，即使不知道确切的目标概念或训练样例抽取的分布，一种概率方法可在给定数目的训练样例之后界定变型空间为ε-详尽的\n\n## 有限假设空间的样本复杂度（4）\n\
    \n- 定理7.1（变型空间的ε-详尽化）\n  - 若假设空间H有限，且D为目标概念c的一系列m>=1个独立随机抽取的样例，那么对于任意0<=ε<=1，变型空间VS_H,D不是ε-详尽的概率小于或等于：|H|e^{-εm}\n\
    - 证明：\n  - 令h1,...,hk为H中关于c的真实错误率大于ε的所有假设。当且仅当k个假设中至少有一个恰好与所有m个独立随机抽取样例一致时，不能使变型空间ε-详尽化。\n\
    \  - 任一假设真实错误率大于ε，且与一个随机抽取样例一致的可能性最多为1-ε，因此，该假设与m个独立抽取样例一致的概率最多为(1-ε)^m\n  - 由于已知有k个假设错误率大于ε，那么至少有一个与所有m个训练样例都不一致的概率最多为（当0≤ε≤1，则1-ε≤e^ε）\n\
    \    k(1-ε)^m ≤ |H|(1-ε)^m ≤ |H|e^{-εm}\n\n## 有限假设空间的样本复杂度（5）\n\n- 定理7.1基于训练样例的数目m、允许的错误率ε和H的大小，给出了变型空间不是ε-详尽的概率的上界\n\
    - 即它对于使用假设空间H的任意学习器界定了m个训练样例未能将所有“坏”的假设（错误率大于ε的假设）剔除出去的概率\n- 利用上面的结论来确定为了减少此“未剔除”概率到一希望程度δ所需的训练样例数\n\
    \  - 由 |H| e^(-m ε) ≤ δ\n  - 解出 m，得到 m ≥ (1/ε)(ln |H| + ln(1/δ))\n\n## 有限假设空间的样本复杂度（6）\n\
    \n- 式子7.2提供了训练样例数目的一般边界，该数目的样例足以在所期望的值δ和ε程度下，使任何一致学习器成功地学习到H中的任意目标概念\n- 训练样例的数目m足以保证任意一致假设是可能（可能性为1-δ）近似（错误率为ε）正确的\n\
    - m随着1/ε线性增长，随着1/δ和假设空间的规模对数增长\n- 上面的界限可能是过高的估计，主要来源于|H|项，它产生于证明过程中在所有可能假设上计算那些不可接受的假设的概率和\n\
    - 在7.4节讨论一个更紧凑的边界以及能够覆盖无限大的假设空间的边界\n\n## 不可知学习和不一致假设\n\n- 如果学习器不假定目标概念可在H中表示，而只简单地寻找具有最小训练错误率的假设，这样的学习器称为不可知学习器\n\
    - 式7.2基于的假定是学习器输出一零错误率假设，在更一般的情形下学习器考虑到了有非零训练错误率的假设时，仍能找到一个简单的边界\n- 令S代表学习器可观察到的特定训练样例集合，\\\
    (errors(h)\\)表示h的训练错误率，即S中被h误分类的训练样例所占比例\n- 令\\(h_{best}\\)表示H中有最小训练错误率的假设，问题是：多少训练样例才足以保证其真实错误率\\\
    (error_D(h_{best})\\)不会多于\\(\\epsilon+error_S(h_{best})\\)？（上一节问题是这个问题的特例）\n\n\
    ## 不可知学习和不一致假设（2）\n\n- 前面问题的回答使用类似定理7.1的证明方法，这里有必要引入一般的Hoeffding边界\n- Hoeffding边界刻画的是某事件的真实概率及其m个独立试验中观察到的频率之间的差异\n\
    - Hoeffding边界表明，当训练错误率error_S(h)在包含m个随机抽取样例的集合S上测量时，则 Pr[error_D(h) > error_S(h)\
    \ + ε] ≤ e^{-2mε²}\n- 上式给出了一个概率边界，说明任意选择的假设训练错误率不能代表真实情况，为保证L寻找到的最佳的假设的错误率有以上的边界，我们必须考虑这|H|个假设中任一个有较大错误率的概率\
    \ Pr[∃h ∈ H (error_D(h) > error_S(h) + ε)] ≤ |H| e^{-2mε²}\n\n## 不可知学习和不一致假设（3）\n\
    \n- 将上式左边概率称为δ，问多少个训练样本m才足以使δ维持在一定值内，求解得到 $m \\ge \\frac{1}{2\\varepsilon^2}(\\\
    ln |H| + \\ln(1/\\delta))$\n- 式7.3是式7.2的一般化情形，适用于当最佳假设可能有非零训练错误率时，学习器仍能选择到最佳假设h∈H的情形。\n\
    \n## 布尔文字的合取是PAC可学习的\n\n- 我们已经有一个训练样例数目的边界，表示样本数目为多少时才足以可能近似学习到目标概念，现在用它来确定某些特定概念类别的样本复杂度和PAC可学习性\n\
    - 考虑目标概念类C，它由布尔文字的合取表示。布尔文字是任意的布尔变量，或它的否定。问题：C是可PAC学习的吗？\n- 若假设空间H定义为n个布尔文字的合取，则假设空间|H|的大小为3ⁿ，得到关于n布尔文字合取学习问题的样本复杂度\n\
    \nm ≥ 1/(n ln3 + ln(1/δ)) = 1/(0 ln3 ± ln(1/0.05))=140\n"
