    # 表11-3 通过一个Horn子句回归一组文字的算法


    Regress(Frontier, Rule, Literal, θ_hi)


    Frontier: 通过规则被回归的文字集合


    Rule: Horn子句


    Literal: 在Frontier中的文字，它由解释中的Rule推得


    θ_hi: 是Rule的头与解释中的相应文字合一的置换


    返回构成Frontier的关于Rule的最弱前像的文字集合


    +   - head←Rule的头

    +   - body←Rule的体

    +   - θ_hl←head与Literal的最一般合一，使得存在置换θ_li满足：

    +     θ_li(θ_hl(head))=θ_hi(head)

    +   - 返回θ_hl(Frontier-head+body)'
