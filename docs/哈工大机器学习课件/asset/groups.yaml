    |---|---|---|

    | 目标 | 拟合数据的假设 | 拟合领域理论的假设 |

    | 论证 | 统计推理 | 演绎推理 |

    | 优点 | 需要很少先验知识 | 从稀少的数据中学习 |

    | 缺陷 | 稀少的数据，不正确的偏置 | 不完美的领域理论 |'
  - '[PAGE 158]


