    \   » h与d一致，而且G的某个成员比h更一般\n  - 如果d是一个反例\n    - 从S中移去所有与d不一致的假设\n    - 对G中每个与d不一致的假设g\n\
    \      - 从G中移去g\n      - 把g的所有的极小特殊化式h加入到G中，其中h满足\n        » h与d一致，而且S的某个成员比h更特殊\n\
    \n## 变型空间和候选消除算法（8）\n\n- 算法举例\n\n## 变型空间和候选消除的说明\n\n- 候选消除算法收敛到正确的假设\n  - 训练样例中没有错误\n\
