    \n## Q学习\n\n- 机器人在任意的环境中直接学习最优策略很难，因为没有形式为<s,a>的训练样例\n- 训练数据是立即回报函数，容易学习一个定义在状态和动作上的数值评估函数，然后实现最优策略\n\
    - 很明显，可以将V*作为待学习的评估函数，由于状态s下的最优动作是使立即回报r(s,a)加上立即后继状态的V*值最大的动作a，即\n  π*(s) = arg\
    \ maxₐ [r(s,a) + γ V*(δ(s,a))]\n  因此，如果具有回报函数和状态转移函数的完美知识，那么就可以计算出任意状态下的最优动作\n\
    - 但在实际问题中，无法知道回报函数和状态转移函数的完美知识\n\n## Q函数\n\n- 对于无法知道回报函数和状态转移函数完美知识的情形，我们使用评估函数Q\n\
    - 评估函数Q的定义：\n  $Q(s,a)=r(s,a)+\\gamma V^{*}(\\delta(s,a))$\n- 式子13.3可以重写为：\n \
    \ $\\pi^{*}(s)=\\arg\\max_{a} Q(s,a)$\n- 因此只需对当前状态的Q值做出反应，就可以选择到全局最优化的动作序列\n\n\
    ## Q函数（2）\n\n- 注意到 $V^*(s) = \\max_{a'} Q(s,a')$\n- 式子13.4可重写为\n  $Q(s,a) = r(s,a)\
    \ + \\gamma \\max_{a'} Q(\\delta(s,a),a')$\n- 这个Q函数的递归定义提供了迭代逼近Q算法的基础\n- 用 $\\\
    hat{Q}$ 表示实际Q的估计，算法中用一个大表存储所有状态-动作对的 $\\hat{Q}$ 值\n- 一开始所有表项填充为初始的随机值，然后利用下式更新表项，直到这些值收敛\n\
    \  $\\hat{Q}(S,a) \\leftarrow r + \\gamma \\max_{a} \\hat{Q}(s',a') \\quad s'\
    \ = \\delta(s,a)$\n\n## Q算法举例\n\n- 图13-3，单个状态转移的Q学习\n- 吸收目标状态：没有移出的状态\n- 情节：在每个情节中，机器人从某个随机选择的状态开始执行动作直到到达吸收目标状态\n\
    - 训练过程包含一系列情节\n- q̂ 值的演化过程\n  - 因为初始的 q̂ 值都为0，算法不会改变任何 q̂ 表项，直到它恰好到达目标状态并且收到非零回报，这导致通向目标状态的转换的\
    \ q̂ 值被精化\n  - 在下一个情节中，如果经过这些与目标状态相邻的状态，其非0的 q̂ 值会导致与目的相差两步的状态中值的变化，依次类推，最终得到一个\
    \ q̂ 表\n\n## Q算法举例（2）\n\n- 上面的Q学习算法有两个特点：\n  - Q̂值在训练中不会下降\n  - Q̂值保持在0和真实Q值区间内\n\
    - 因此上面的Q学习算法会收敛到正确的Q函数\n- 定理13.1（确定性马尔科夫决策过程中的Q学习的收敛性）\n  - 考虑一个Q学习，在一个有有界回报的确定性MDP中，Q学习使用式子13.7的训练规则，将表Q̂(s,a)初始化为任意有限值，并且使用折算因子，令Q̂ₙ(s,a)表示在第n次更新后的值，如果那么对所有的s和a，当n→∞时Q̂ₙ(s,a)收敛到Q(s,a)\n\
    \n## Q算法举例（3）\n\n- 证明：\n\n- 令 s' = δ(s,a)，则\n  |Q̂_{n+1}(s,a) - Q(s,a)| = |(r\
    \ + γ max_{a'} Q̂_n(s',a')) - (r + γ max_{a'} Q(s',a'))|\n  = γ |max_{a'} Q̂_n(s',a')\
    \ - max_{a'} Q(s',a')|\n  ≤ γ max_{a'} |Q̂_n(s',a') - Q(s',a')|\n  ≤ γ max_{s'',a'}\
    \ |Q̂_n(s'',a') - Q(s'',a')|\n\n- 令 Δ_n = max_{s,a} |Q̂_n(s,a) - Q(s,a)|，则\n \
    \ Δ_{n+1} ≤ γ Δ_n\n  lim_{n→∞} Δ_n = 0\n\n## 实验策略\n\n- 表13-1的算法的一个明显的策略是，对于状态s，选择使\
    \ 最大化的动作\n- 上面策略的风险是过度束缚到在早期训练中有高 值的动作，而不能探索到其它可能有更高值的动作\n- 在Q学习中，通常使用概率的途径来选择动作，有较高\
    \ 值的动作被赋予较高的概率，但所有动作的概率都非0，其中一种方法是\n  $P(a_i|s) = \\frac{k^{\\hat{Q}(s,a_i)}}{\\\
    sum_j k^{Q(s,a_j)}}$\n"
