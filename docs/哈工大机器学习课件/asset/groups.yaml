  - '[PAGE 62]


    # 贝叶斯信念网的推理（2）


    +   - 对任意贝叶斯网络的概率的确切推理已经知道是一个NP难题

    +   - Monte Carlo方法提供了一种近似的结果，通过对未观察到的变量进行随机采样

    +   - 理论上，即使是贝叶斯网络中的近似推理也可能是NP难题

    +   - 实践中许多情况下近似的方法被证明是有效的'
  - '[PAGE 63]


    # 学习贝叶斯信念网


    +   - 从训练数据中学到贝叶斯信念网，有多种讨论的框架：

    +     - 网络结构可以预先给出，或由训练数据中得到

    +     - 所有的网络变量可以直接从每个训练样例中观察到，或某些变量不能观察到

    +   - 如果网络结构已知且变量可以从训练样例中完全获得，那么得到条件概率表就比较简单

    +   - 如果网络结构已知，但只有一部分变量值能在数据中观察到，学习问题就困难多了。这类似于在人工神经网络中学习隐藏单元的权值

    +   - Russll（1995）提出了一个简单的梯度上升过程以学习条件概率表中的项，相当于对表项搜索极大似然假设'
  - '[PAGE 64]


    # 贝叶斯网的梯度上升训练


    +   - 令 w_{ijk} 代表条件概率表的一个表项，即在给定父节点 U_i 取值 u_{ik} 时，网络变量 Y_i 值为 y_{ij} 的概率


    +   - 例如图6-3， w_{ijk} 为最右上方的表项，那么 Y_i 为变量 Campfire， U_i 是其父节点的元组 <Storm, BusTourGroup>，
    y_{ij}=True，且 u_{ik}=<False, False>'
  - '[PAGE 65]


    # 贝叶斯网的梯度上升训练（2）


    +   - lnP(D|h)的梯度由对每个w_ijk求导数得到

    +     ∂lnP(D|h)/∂w_ijk = Σ_{d∈D} P(Y_i = y_j, U_i = u_k | d) / w_ijk

    +   - 例如，为计算图6-3中表左上方的表项的lnP(D|h)的导数，需要对D中每个训练样例d计算P(Campfire=True, Storm=False,
    BusTourGroup=False|d)

    +   - 当训练样例中无法观察到这些变量时，这些概率可用标准的贝叶斯网从d中观察到的变量中推理得到

    +   - 这些量能够很容易地从贝叶斯网推理过程中得到，几乎不需要附加的开销'
  - '[PAGE 66]


    # 贝叶斯网的梯度上升训练（3）


    +   - 式子6.25的推导

    +     - 用Pₕ(D)来表示P(D|h)

    +     - 假定在数据集D中的各样例d都是独立抽取的'
  - '[PAGE 67]


    ∂ ln P_h(D) / ∂ w_{ijk} = ∂ / ∂ w_{ijk} ln ∏_{d∈D} P_h(d)

    = Σ_{d∈D} ∂ ln P_h(d) / ∂ w_{ijk}

    = Σ_{d∈D} 1 / P_h(d) ∂ P_h(d) / ∂ w_{ijk}

    = Σ_{d∈D} 1 / P_h(d) ∂ / ∂ w_{ijk} Σ_{j'',k''} P_h(d | y_{ij''}, u_{ik''}) P_h(y_{ij''},
    u_{ik''})

    = Σ_{d∈D} 1 / P_h(d) ∂ / ∂ w_{ijk} Σ_{j'',k''} P_h(d | y_{ij''}, u_{ik''}) P_h(y_{ij''}
    | u_{ik''}) P_h(u_{ik''})

    = Σ_{d∈D} 1 / P_h(d) ∂ / ∂ w_{ijk} P_h(d | y_{ij}, u_{ik}) P_h(y_{ij} | u_{ik})
    P_h(u_{ik})

    = Σ_{d∈D} 1 / P_h(d) ∂ / ∂ w_{ijk} P_h(d | y_{ij}, u_{ik}) w_{ijk} P_h(u_{ik})

    = Σ_{d∈D} 1 / P_h(d) P_h(d | y_{ij}, u_{ik}) P_h(u_{ik})

    = Σ_{d∈D} 1 / P_h(d) [P_h(y_{ij}, u_{ik} | d) P_h(d) P_h(u_{ik})] / P_h(y_{ij},
    u_{ik})

    = Σ_{d∈D} P_h(y_{ij}, u_{ik} | d) P_h(u_{ik}) / P_h(y_{ij}, u_{ik})

    = Σ_{d∈D} P_h(y_{ij}, u_{ik} | d) / P_h(y_{ij} | u_{ik})

    = Σ_{d∈D} P_h(y_{ij}, u_{ik} | d) / w_{ijk}'
  - '[PAGE 68]


    # 贝叶斯网的梯度上升训练（4）


    +   - 更新权值

    +     $w_{ijk} \leftarrow w_{ijk} + \eta \sum_{d \in D} \frac{P_k(y_j, u_{jk}
    \mid d)}{w_{ijk}}$

    +   - 归一化处理，保持在区间[0,1]之间，且 $\sum_j w_{ijk}$ 对所有 i,k 保持为1

    +     $w_{ijk} \leftarrow \frac{w_{ijk}}{\sum_{i,k} w_{ijk}}$

    +   - 这个算法只保证找到局部最优解，替代梯度上升的一个算法是EM算法'
  - '[PAGE 69]


    # 学习贝叶斯网的结构


    +   - 如果贝叶斯网的结构未知，那么需要学习贝叶斯网的结构

    +   - Cooper & Herskovits提出了一个贝叶斯评分尺度，以便从不同网络中进行选择

    +   - Cooper & Herskovits提出了算法K2，启发式算法，用于在数据完全可观察时学习网络结构

    +   - 基于约束的学习贝叶斯网络结构：从数据中推导出独立和相关的关系，然后用这些关系来构造贝叶斯网'
  - '[PAGE 70]


    # EM算法


    +   - 在许多实际的学习问题框架中，相关实例特征中只有一部分可观察到

    +   - 已有许多方法被提出出来处理存在未观察到变量的问题

    +     - 比如，如果某些变量有时能观察到，有时不能，那么可以用观察到该变量的实例去预测未观察到的实例中的变量的值

    +   - EM算法是存在隐含变量时广泛使用的一种学习方法，可用于变量的值从来没有被直接观察到的情形，只要这些变量所遵循的概率分布的一般形式已知

    +     - 用于贝叶斯网的训练

    +     - 用于马尔可夫模型的训练'
  - '[PAGE 71]


    # 估计k个高斯分布的均值


    +   - 考虑D是一个实例集合，它由k个不同正态分布的混合所得分布生成

    +   - 每个实例使用一个两步骤的过程形成:

    +     - 首先，随机选择k个正态分布中的一个

    +     - 其次，随机变量xᵢ按照此选择的分布生成

    +   - 考虑一个简单情形:

    +     - 单个正态分布的选择基于均匀的概率进行，且k个正态分布有相同的方差

    +     - 学习任务：输出一个假设h=<μ₁...μₖ>，描述k个分布中每个分布的均值，找到极大似然假设，即使得p(D|h)最大化的假设'
  - '[PAGE 72]


    # 估计k个高斯分布的均值（2）


    +   - 当给定从一个正态分布中抽取的数据实例x₁,...,xₘ时，很容易计算该分布的均值的极大似然假设，它是6.4节中式子6.6的一个特例，表示如下

    +     μ_ML = arg min_μ Σ_{i=1}^m (x_i - μ)² = 1/m Σ_{i=1}^m x_i

    +   - 然而，现在的问题涉及k个不同正态分布，而且不知道哪个实例是哪个分布产生的。这是一个涉及隐藏变量的典型例子

    +   - 对于图6-4的例子，每个实例的完整描述是三元组 <x_i, z_i1, z_i2>，其中x_i是第i个实例的观测值，z_i1和z_i2表示哪个正态分布被用来产生x_i，是隐藏变量'
  - '[PAGE 73]


    # 估计k个高斯分布的均值（3）


    +   - 如果zᵢ₁和zᵢ₂的值可知，就可用式子6.27来解决，否则使用EM算法


    +   - EM算法根据当前假设<μ₁...μₖ>，不断地再估计隐藏变量zᵢⱼ的期望值，然后用这些隐藏变量的期望值重新计算极大似然假设


    +   - 以图6-4为例，先将假设初始化为h=<μ₁, μ₂>

    +     - 计算每个隐藏变量zᵢⱼ的期望值E[zᵢⱼ]，假定当前假设h=<μ₁, μ₂>成立

    +     - 计算一个新的极大似然假设h’=<μ’₁, μ’₂>，假定每个隐藏变量zᵢⱼ所取值是第一步得到的期望值E[zᵢⱼ]。将假设替换为h’=<μ’₁,
    μ’₂>，然后循环'
  - "[PAGE 74]\n\n# 两个步骤的计算式\n\n+   - E[z_ij]正是实例x_i由第j个正态分布生成的概率\n+   \n+     $E[z_{ij}]\
    \ = \\frac{p(x = x_i \\mid \\mu = \\mu_j)}{\\sum_{n=1}^{k} p(x = x_i \\mid \\\
    mu = \\mu_n)}$\n+   \n+     $= \\frac{e^{-\\frac{1}{2\\sigma^2}(x_i - \\mu_j)^2}}{\\\
    sum_{n=1}^{k} e^{-\\frac{1}{2\\sigma^2}(x_i - \\mu_n)^2}}$\n\n+   - 第二步，使用第一步得到的E[z_ij]来导出一新的极大似然假设\n\
    +   \n+     $\\mu_j = \\frac{\\sum_{i=1}^{m} E[z_{ij}] x_i}{\\sum_{i=1}^{m} E[z_{ij}]}$"
