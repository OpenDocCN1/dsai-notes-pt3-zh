- raw:
  - '[PAGE 243]


    # 布尔文字的合取是PAC可学习的（2）


    +   - 定理7.2： 布尔合取式的PAC可学习性

    +     - 布尔文字合取的类C是用Find-S算法PAC可学习的

    +   - 证明：

    +     - 式7.4显示了该概念类的样本复杂度是n、1/δ和1/ε的多项式级，而且独立于size(c)。为增量地处理每个训练样例，Find-S算法要求的运算量根据n线性增长，并独立于1/δ、1/ε和size(c)。因此这一概念类别是Find-S算法PAC可学习的。'
  - '[PAGE 244]


    # 其他概念类别的PAC可学习性


    +   • 无偏学习器（无归纳偏置）

    +     – 考虑一无偏概念类C，它包含与X相关的所有可教授概念，X中的实例定义为n个布尔值特征，则有

    +     |H| = |C| = 2^{2^n} = 2^{2^n}

    +     m ≥ (1/ε)(2^n ln 2 + ln(1/δ))

    +     – 无偏的目标概念类在PAC模型下有指数级的样本复杂度'
  - '[PAGE 245]


    # 其他概念类别的PAC可学习性

    （2）


    +   - K项DNF和K-CNF概念

    +     - 某概念类有多项式级的样本复杂度，但不能够在多项式时间内被学习到

    +     - 概念类C为k项析取范式（k项DNF）的形式

    +     - k项DNF： T₁∨...∨Tₖ，其中每一个Tᵢ为n个布尔属性和它们的否定的合取

    +     - 假定H=C，则|H|最多为3ⁿk，代入式7.2，得到 m ≥ 1/ε (nk ln3 + ln(1/δ))

    +     - 因此，k项DNF的样本复杂度为1/δ、1/ε、n和k的多项式级

    +     - 但是计算复杂度不是多项式级，该问题是NP完全问题（等效于其他已知的不能在多项式时间内解决的问题）

    +     - 因此，虽然k项DNF有多项式级的样本复杂度，它对于使用H=C的学习器没有多项式级的计算复杂度'
  - '[PAGE 246]


    # 其他概念类别的PAC可学习性

    （3）


    +   - 令人吃惊的是，虽然k项DNF不是PAC可学习的，但存在一个更大的概念类是PAC可学习的

