  - '[PAGE 313]


    # 动机


    +   - 对学习到的假设进行尽可能准确地性能评估十分重要

    +     - 为了知道是否可以使用该假设

    +     - 是许多学习方法的重要组成部分

    +   - 当给定的数据集有限时，要学习一个概念并估计其将来的精度，存在两个很关键的困难：

    +     - 估计的困难

    +       - 使用与训练样例和假设无关的测试样例

    +     - 估计的方差

    +       - 即使假设精度在独立的无偏测试样例上测量，得到的精度仍可能与真实精度不同。

    +       - 测试样例越少，产生的方差越大

    +   - 本章讨论了对学到的假设的评估、对两个假设精度的比较、两个学习算法精度的比较'
  - '[PAGE 314]


    # 学习问题的框架


    +   - 有一所有可能实例的空间X，其中定义了多个目标函数，我们假设X中不同实例具有不同的出现频率。一种合适的建模方式是，假设存在一未知的概率分布D，它定义了X中每一实例出现的概率。

    +   - 学习任务是在假设空间上学习一个目标概念，训练样例的每一个实例按照分布D独立地抽取，然后连同正确的目标值提供给学习器。'
  md: "\n## 错误率降低修剪\n- 将树上的每一个节点作为修剪的候选对象\n- 修剪步骤\n  - 删除以此节点为根的子树，使它成为叶结点\n  - 把和该节点关联的训练样例的最常见分类赋给它\n\
    \  - 反复修剪节点，每次总是选取那些删除后可以最大提高决策树在验证集合上的精度的节点\n- 继续修剪，直到进一步的修剪是有害的为止\n- 数据分成3个子集\n\
    \  - 训练样例，形成决策树\n  - 验证样例，修剪决策树\n  - 测试样例，精度的无偏估计\n- 如果有大量的数据可供使用，那么使用分离的数据集\n\
    \n## 规则后修剪\n- 从训练集合推导出决策树，增长决策树直到尽可能好地拟合训练数据，允许过度拟合发生\n- 将决策树转化为等价的规则集合，方法是从根节点到叶节点的每一条路径创建一条规则\n\
    - 通过删除任何能导致估计精度提高的前提来修剪每一条规则\n- 按照修剪过的规则的估计精度对它们进行排序，并按这样的顺序应用这些规则来分类后来的实例\n\n\
    ## 规则后修剪（2）\n- 例子\n  - 图3-1的最左一条路径\n  - if (outlook=sunny)^(Humidity=High) then\
    \ PlayTennis=No\n  - 考虑删除先行词(outlook=sunny)和(Humidity=High)\n  - 选择使估计精度有最大提升的步骤\n\
    \  - 考虑修剪第二个前提\n\n## 规则后修剪（3）\n- 规则精度估计方法\n  - 使用与训练集不相交的验证集\n  - 基于训练集合本身\n \
    \   - 被C4.5使用，使用一种保守估计来弥补训练数据有利于当前规则的估计偏置\n    - 过程\n      - 先计算规则在它应用的训练样例上的精度\n\
    \      - 然后假定此估计精度为二项式分布，并计算它的标准差\n      - 对于一个给定的置信区间，采用下界估计作为规则性能的度量\n    -\
    \ 评论\n      - 对于大的数据集，保守预测非常接近观察精度，随着数据集合的减小，离观察精度越来越远\n      - 不是统计有效（此概念第5章介绍），但是实践中发现有效\n\
    \n## 规则后修剪 (4)\n- 把决策树转化成规则集的好处\n  - 可以区分决策节点使用的不同上下文\n  - 消除了根节点附近的属性测试和叶节点附近的属性测试的区别\n\
    \  - 提高了可读性\n\n## 合并连续值属性\n- ID3被限制为取离散值的属性\n  - 学习到的决策树要预测的目标属性必须是离散的\n  - 树的决策节点的属性也必须是离散的\n\
    - 简单删除上面第2个限制的方法\n  - 通过动态地定义新的离散值属性来实现，即先把连续值属性的值域分割为离散的区间集合\n\n## 合并连续值属性（2）\n\
    - 例子，Temperature应该定义什么样的基于阈值的布尔属性\n  - 选择产生最大信息增益的阈值\n  - 按照连续属性排列样例，确定目标分类不同的相邻实例\n\
    \  - 产生一组候选阈值，它们的值是相应的A值之间的中间值\n  - 可以证明产生最大信息增益的c值位于这样的边界中\n    （Fayyad1991）\n\
    \  - 通过计算与每个候选阈值关联的信息增益评估这些候选值\n- 方法的扩展\n  - 连续的属性分割成多个区间，而不是单一阈值的两个空间\n\n## 属性选择的其它度量标准\n\
    - 信息增益度量存在一个内在偏置，偏向具有较多值的属性\n- 避免方法，其他度量，比如增益比率\n- 增益比率通过加入一个被称作分裂信息的项来惩罚多值属性，分裂信息用来衡量属性分裂数据的广度和均匀性\n\
    \  SplitInformation(S,A)= -∑_{i} |S_i|/|S| log₂ |S_i|/|S|\n  GainRatio(S,A)= Gain(S,A)/SplitInformation(S,A)\n\
    - 分裂信息项阻碍选择值为均匀分布的属性\n- 问题，当某个S≈S。解决方法：采用一些启发式规则，比如仅对增益高过平均值的属性应用增益比率测试\n\n##\
    \ 属性选择的其它度量标准（2）\n- 基于距离的度量\n  - 定义了数据划分间的一种距离尺度\n  - 计算每个属性产生的划分与理想划分间的距离\n \
    \ - 选择最接近完美划分的属性\n  - Lopez de Mantaras定义了这个距离度量，证明了它不偏向有大量值的属性\n- 此外\n- Mingers实验，不同的属性选择度量对最终精度的影响小于后修剪的程度和方法的影响\n\
    \n## 缺少属性值的训练样例\n- 例子，医学领域\n- 经常需要根据此属性值已知的实例来估计这个缺少的属性值\n- 为了评估属性A是否是决策节点n的最佳测试属性，要计算决策树在该节点的信息增益\
    \ Gain(S,A)。假定<x,c(x)>是S中的一个训练样例，并且其属性A的值A(x)未知\n\n## 缺少属性值的训练样例（2）\n- 处理缺少属性值的\n\
    \  - 一种策略是赋给它节点n的训练样例中该属性的最常见值\n  - 另一种策略是赋给它节点n的被分类为c(x)的训练样例中该属性的最常见值\n  - 更复杂的策略，为A的每个可能值赋予一个概率，而不是简单地将最常见的值赋给A(x)\n\
    \n## 处理不同代价的属性\n- 实例的属性可能与代价相关\n- 优先选择尽可能使用低代价属性的决策树，仅当需要产生可靠的分类时才依赖高代价属性\n- 通过引入一个代价项到属性选择度量中，可以使ID3算法考虑属性代价\n\
    - Tan和Schlimmer的例子\n\n## 小结和补充读物\n- 决策树学习为概念学习和学习其他离散值的函数提供了一个实用的方法\n- ID3算法\n\
    \  - 贪婪算法\n  - 从根向下推断决策树\n  - 搜索完整的假设空间\n  - 归纳偏置，较小的树\n- 过度拟合问题\n- ID3算法的扩展\n\
    \n## 小结和补充读物（2）\n- Hunt\n- Quinlan\n- Mingers\n\n## 附录\n- C4.5 is a software extension\
    \ of the basic ID3 algorithm designed by Quinlan to address the following issues\
    \ not dealt with by ID3:\n  - Avoiding overfitting the data\n  - Determining how\
    \ deeply to grow a decision tree.\n  - Reduced error pruning.\n  - Rule post-pruning.\n\
    \  - Handling continuous attributes.\n  - e.g., temperature\n  - Choosing an appropriate\
    \ attribute selection measure.\n  - Handling training data with missing attribute\
    \ values.\n  - Handling attributes with differing costs.\n  - Improving computational\
    \ efficiency.\n\n## 机器学习\n## 第5章 评估假设\n\n## 动机\n- 对学习到的假设进行尽可能准确地性能评估十分重要\n  -\
    \ 为了知道是否可以使用该假设\n  - 是许多学习方法的重要组成部分\n- 当给定的数据集有限时，要学习一个概念并估计其将来的精度，存在两个很关键的困难：\n\
    \  - 估计的困难\n    - 使用与训练样例和假设无关的测试样例\n  - 估计的方差\n    - 即使假设精度在独立的无偏测试样例上测量，得到的精度仍可能与真实精度不同。\n\
    \    - 测试样例越少，产生的方差越大\n- 本章讨论了对学到的假设的评估、对两个假设精度的比较、两个学习算法精度的比较\n\n## 学习问题的框架\n\
    - 有一所有可能实例的空间X，其中定义了多个目标函数，我们假设X中不同实例具有不同的出现频率。一种合适的建模方式是，假设存在一未知的概率分布D，它定义了X中每一实例出现的概率。\n\
    - 学习任务是在假设空间上学习一个目标概念，训练样例的每一个实例按照分布D独立地抽取，然后连同正确的目标值提供给学习器。\n"
