    \ 记为h_j more_general_than_or_equal_to h_k，或\n    h_j ⪰_g h_k\n\n## 假设的一般到特殊序（3）\n\
    \n- “更一般”的严格情形\n  - h_j >g h_k，当且仅当，(h_j ≥g h_k)∧¬(h_k ≥g h_j)\n- “更特殊”关系的定义\n\
