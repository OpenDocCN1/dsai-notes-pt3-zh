    +     - 任一假设真实错误率大于ε，且与一个随机抽取样例一致的可能性最多为1-ε，因此，该假设与m个独立抽取样例一致的概率最多为(1-ε)^m

    +     - 由于已知有k个假设错误率大于ε，那么至少有一个与所有m个训练样例都不一致的概率最多为（当0≤ε≤1，则1-ε≤e^ε）

    +       k(1-ε)^m ≤ |H|(1-ε)^m ≤ |H|e^{-εm}'
