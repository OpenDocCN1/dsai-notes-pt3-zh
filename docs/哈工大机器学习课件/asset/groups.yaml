    - Cooper & Herskovits提出了算法K2，启发式算法，用于在数据完全可观察时学习网络结构\n- 基于约束的学习贝叶斯网络结构：从数据中推导出独立和相关的关系，然后用这些关系来构造贝叶斯网\n\
    \n## EM算法\n\n- 在许多实际的学习问题框架中，相关实例特征中只有一部分可观察到\n- 已有许多方法被提出来处理存在未观察到变量的问题\n  -\
    \ 比如，如果某些变量有时能观察到，有时不能，那么可以用观察到该变量的实例去预测未观察到的实例中的变量的值\n- EM算法是存在隐含变量时广泛使用的一种学习方法，可用于变量的值从来没有被直接观察到的情形，只要这些变量所遵循的概率分布的一般形式已知\n\
    \  - 用于贝叶斯网的训练\n  - 用于马尔可夫模型的训练\n\n## 估计k个高斯分布的均值\n\n- 考虑D是一个实例集合，它由k个不同正态分布的混合所得分布生成\n\
    - 每个实例使用一个两步骤的过程形成:\n  - 首先，随机选择k个正态分布中的一个\n  - 其次，随机变量$x_i$按照此选择的分布生成\n- 考虑一个简单情形:\n\
    \  - 单个正态分布的选择基于均匀的概率进行，且k个正态分布有相同的方差\n  - 学习任务：输出一个假设 $h=\\langle \\mu_1 \\ldots\
    \ \\mu_k \\rangle$，描述k个分布中每个分布的均值，找到极大似然假设，即使得 $p(D \\mid h)$ 最大化的假设\n\n## 估计k个高斯分布的均值（2）\n\
    \n- 当给定从一个正态分布中抽取的数据实例 $x_1,\\ldots,x_m$ 时，很容易计算该分布的均值的极大似然假设，它是6.4节中式子6.6的一个特例，表示如下\n\
    \n  $$\\mu_{ML} = \\arg \\min_{\\mu} \\sum_{i=1}^{m} (x_i - \\mu)^2 = \\frac{1}{m}\
    \ \\sum_{i=1}^{m} x_i$$\n\n- 然而，现在的问题涉及k个不同正态分布，而且不知道哪个实例是哪个分布产生的。这是一个涉及隐藏变量的典型例子\n\
    - 对于图6-4的例子，每个实例的完整描述是三元组 $\\langle x_i, z_{i1}, z_{i2} \\rangle$，其中 $x_i$ 是第\
    \ $i$ 个实例的观测值，$z_{i1}$ 和 $z_{i2}$ 表示哪个正态分布被用来产生 $x_i$，是隐藏变量\n\n## 估计k个高斯分布的均值（3）\n\
    \n- 如果 $z_{i1}$ 和 $z_{i2}$ 的值可知，就可用式子6.27来解决，否则使用EM算法\n- EM算法根据当前假设 $\\langle\
    \ \\mu_1 \\ldots \\mu_k \\rangle$，不断地再估计隐藏变量 $z_{ij}$ 的期望值，然后用这些隐藏变量的期望值重新计算极大似然假设\n\
    - 以图6-4为例，先将假设初始化为 $h=\\langle \\mu_1, \\mu_2 \\rangle$\n  - 计算每个隐藏变量 $z_{ij}$\
    \ 的期望值 $E[z_{ij}]$，假定当前假设 $h=\\langle \\mu_1, \\mu_2 \\rangle$ 成立\n  - 计算一个新的极大似然假设\
    \ $h'=\\langle \\mu'_1, \\mu'_2 \\rangle$，假定每个隐藏变量 $z_{ij}$ 所取值是第一步得到的期望值 $E[z_{ij}]$。将假设替换为\
    \ $h'=\\langle \\mu'_1, \\mu'_2 \\rangle$，然后循环\n\n### 两个步骤的计算式\n\n- $E[z_{ij}]$\
    \ 正是实例 $x_i$ 由第 $j$ 个正态分布生成的概率\n\n  $$\n  E[z_{ij}] = \\frac{p(x = x_i \\mid \\\
    mu = \\mu_j)}{\\sum_{n=1}^{k} p(x = x_i \\mid \\mu = \\mu_n)}\n  = \\frac{e^{-\\\
    frac{1}{2\\sigma^2}(x_i - \\mu_j)^2}}{\\sum_{n=1}^{k} e^{-\\frac{1}{2\\sigma^2}(x_i\
    \ - \\mu_n)^2}}\n  $$\n\n- 第二步，使用第一步得到的 $E[z_{ij}]$ 来导出一个新的极大似然假设\n\n  $$\n  \\\
    mu_j = \\frac{\\sum_{i=1}^{m} E[z_{ij}] x_i}{\\sum_{i=1}^{m} E[z_{ij}]}\n  $$\n"
