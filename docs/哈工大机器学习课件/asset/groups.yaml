    \ }\n\n其中每个wᵢ是一个实数常量，或叫做权值，用来决定输入xᵢ对感知器输出的贡献率。特别地，-w0是阈值。\n\n## 感知器（2）\n\n- 两种简化形式，附加一个常量输入\
    \ x₀=1，前面的不等式写成\n  ∑_{i=0}^n w_i x_i > 0\n  或写成向量形式\n  \\vec{w}·\\vec{x} > 0\n\
    \n- 为了简短起见，把感知器函数写为\n  o(\\vec{x}) = sgn(\\vec{w}·\\vec{x})\n  其中， sgn(y) = {\
    \ 1   y > 0\n                   -1  otherwise }\n\n## 感知器（3）\n\n- 学习一个感知器意味着选择权\
    \ w₀, ..., wₙ 的值。所以感知器学习要考虑的候选假设空间 H 就是所有可能的实数值权向量的集合 H = { w⃗ | w⃗ ∈ Rⁿ⁺¹ }\n\
    \n## 感知器的表征能力\n\n- 可以把感知器看作是n维实例空间（即点空间）中的超平面决策面\n- 对于超平面一侧的实例，感知器输出1，对于另一侧的实例，输出-1\n\
    - 这个决策超平面方程是 w·x = 0\n- 可以被某个超平面分割的样例集合，称为线性可分样例集合\n\n## 感知器的表征能力（2）\n\n- 单独的感知器可以用来表示很多布尔函数\n\
    - 表示m-of-n函数\n- 感知器可以表示所有的原子布尔函数：与、或、与非、或非\n- 然而，一些布尔函数无法用单一的感知器表示，例如异或\n\n##\
    \ 感知器的表征能力（3）\n\n- 因为所有的布尔函数都可表示为基于原子函数的互连单元的某个网络，因此感知器网络可以表示所有的布尔函数。事实上，只需要两层深度的网络，比如表示析取范式\n\
    - 注意，要把一个AND感知器的输入求反只要简单地改变相应输入权的符号\n- 因为感知器网络可以表示大量的函数，而单独的单元不能做到这一点，所以我们感兴趣的是学习感知器组成的多层网络\n\
    \n## 感知器训练法则\n\n- 虽然我们的目的是学习由多个单元互连的网络，但我们还是要从如何学习单个感知器的权值开始\n- 单个感知器的学习任务，决定一个权向量，它可以使感知器对于给定的训练样例输出正确的1或-1\n\
    - 我们主要考虑两种算法\n  - 感知器法则\n  - delta法则\n- 这两种算法保证收敛到可接受的假设，在不同的条件下收敛到的假设略有不同\n-\
    \ 这两种算法提供了学习多个单元构成的网络的基础\n\n## 感知器法则\n\n- 算法过程\n  - 从随机的权值开始\n  - 反复应用这个感知器到每个训练样例，只要它误分类样例就修改感知器的权值\n\
    \  - 重复这个过程，直到感知器正确分类所有的训练样例\n- 感知器训练法则\n  $w_i \\leftarrow w_i + \\Delta w_i$\n\
    \  其中\n  $\\Delta w_i = \\eta (t - o) x_i$\n\n## 感知器法则（2）\n\n- 为什么这个更新法则会成功收敛到正确的权值呢？\n\
    \  - 一些例子\n  - 可以证明（Minsky & Papert 1969）\n- 如果训练样例线性可分，并且使用了充分小的η\n- 否则，不能保证\n\
    \n## 梯度下降和delta法则\n\n- delta法则克服感知器法则的不足，在线性不可分的训练样本上，收敛到目标概念的最佳近似\n- delta法则的关键思想是，使用梯度下降来搜索可能的权向量的假设空间，以找到最佳拟合训练样例的权向量\n\
    - delta法则为反向传播算法提供了基础，而反向传播算法能够学习多个单元的互连网络\n- 对于包含多种不同类型的连续参数化假设的假设空间，梯度下降是必须遍历这样的空间的所有算法的基础\n\
    \n## 梯度下降和delta法则（2）\n\n- 把delta训练法则理解为训练一个无阈值的感知器\n  $o(\\vec{x}) = \\vec{w}\
    \ \\cdot \\vec{x}$\n- 指定一个度量标准来衡量假设相对于训练样例的训练误差\n  $E(\\vec{w}) = \\frac{1}{2}\
    \ \\sum_{d \\in D} (t_d - o_d)^2$\n- 第6章给出了选择这种E定义的一种贝叶斯论证，在一定条件下，使E最小化的假设就是H中最可能的假设\n\
    \n## 可视化假设空间\n\n- 图4-4\n  - 根据E的定义，误差曲面是一个抛物面，存在一个单一全局最小值\n- 梯度下降搜索从一个任意的初始权向量开始，然后沿误差曲面最陡峭下降的方向，以很小的步伐反复修改这个向量，直到得到全局的最小误差点\n\
    \n## 梯度下降法则的推导\n\n- 如何发现沿误差曲面最陡峭下降的方向？\n  - 通过计算E相对向量 w 的每个分量的导数，这个向量导数被称为E对于\
    \ w 的梯度，记作 ∇E(w)\n  - 当梯度被解释为权空间的一个向量时，它确定了使 E 最陡峭上升的方向，所以这个向量的反方向给出了最陡峭下降的方向\n\
    - 梯度训练法则\n  w ← w + Δw\n  其中，\n  Δw = -η∇E(w)\n\n## 梯度下降法则的推导（2）\n\n- 需要一个高效的方法在每一步都计算这个梯度\n\
    \n  $$\\frac{\\partial E}{\\partial w_i} = \\sum_{d \\in D} (t_d - o_d)(-x_{id})$$\n\
    \n- 梯度下降权值更新法则\n\n  $$\\Delta w_i = \\eta \\sum_{d \\in D} (t_d - o_d) x_{id}$$\n\
    \n## 梯度下降法则的推导（3）\n\n- 表4-1，训练线性单元的梯度下降算法\n  Gradient-Descent(training_examples,\
    \ η)\n  training_examples中每个训练样例形式为序偶<x,t>，x是输入值向量，t是目标输出值，η是学习速率\n- 初始化每个w_i为某个小的随机值\n\
    - 遇到终止条件之前，做以下操作\n  - 初始化每个Δw_i为0\n  - 对于训练样例training_examples中的每个<x,t>，做\n  \
    \  - 把实例x输入到此单元，计算输出o\n    - 对于线性单元的每个权增量Δw_i，做\n      Δw_i ← Δw_i + η(t-o)x_i\n\
    \  - 对于线性单元的每个权w_i，做\n    w_i ← w_i + Δw_i\n\n## 梯度下降法则的推导（4）\n\n- 梯度下降算法如下\n\
    \  - 选取一个初始的随机权向量\n  - 应用线性单元到所有的训练样例，根据公式4.7计算每个权值的 w 更新权值\n- 因为误差曲面仅包含一个全局的最小值，所以无论训练样例是否线性可分，算法都会收敛到具有最小误差的权向量，条件是使用足够小的学习速率\n\
    - 算法的一种常用改进方法是随着梯度下降步数的增加逐渐减小学习速率\n\n## 梯度下降的随机近似\n\n- 梯度下降是一种重要的通用学习范型，它是搜索庞大假设空间或无限假设空间一种策略\n\
    - 梯度下降应用于满足以下条件的任何情况\n  - 假设空间包含连续参数化的假设\n  - 误差对于这些假设参数可微\n- 梯度下降的主要实践问题\n  -\
    \ 有时收敛过程可能非常慢\n  - 如果在误差曲面上有多個局部极小值，那么不能保证找到全局最小值\n\n## 梯度下降的随机近似（2）\n\n- 随机梯度下降（或称增量梯度下降）\n\
    \  - 根据某个单独样例的误差增量计算权值更新，得到近似的梯度下降搜索（随机取一个样例）\n  - 对表4-1算法的修改\n  - 可以看作为每个单独的训练样例定义不同的误差函数\n\
    \  - 在迭代所有训练样例时，这些权值更新的序列给出了对于原来误差函数的梯度下降的一个合理近似\n  - 通过使下降速率的值足够小，可以使随机梯度下降以任意程度接近于真实梯度下降\n"
