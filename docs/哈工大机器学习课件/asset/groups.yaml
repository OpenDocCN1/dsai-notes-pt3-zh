  - '[PAGE 252]


    # 样本复杂度和VC维


    +   - 使用VC维作为H复杂度的度量，就有可能推导出该问题的另一种解答，类似于式子7.2的边界，即（Blumer el al. 1989）

    +     $m \ge \frac{1}{\varepsilon}(4\log_2(2/\delta)+8VC(H)\log_2(13/\varepsilon))$

    +   - 定理7.3：样本复杂度的下界（Ehrenfeucht et al. 1989）

    +     - 考虑任意概念类C，且VC(C)>=2，任意学习器L，以及任意 0<ε<1/8，0<δ<1/100。存在一个分布D以及C中一个目标概念，当L观察到的样例数目小于下式时：

    +       $\max\left[\frac{1}{\varepsilon}\log(1/\delta), \frac{VC(C)-1}{32\varepsilon}\right]$

