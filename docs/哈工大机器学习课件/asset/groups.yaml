    +   - ANN并未模拟生物神经系统中的很多复杂特征

    +   - ANN的研究分为两个团体

    +     - 使用ANN研究和模拟生物学习过程

    +     - 获得高效的机器学习算法，不管这种算法是否反映了生物过程

    +   - 本书属于后一个研究团体'
