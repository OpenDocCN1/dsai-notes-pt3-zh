    +   \n+     C=(C1-{L1})θ∪(C2-{L2})θ\n\n+   - 表10-7一阶形式的归纳规则\n+     - 寻找C1中的文字L1，C2中的文字L2，以及置换θ，使得L1θ=¬L2θ\n\
    +     - 通过包含C1θ和C2θ中，除了L1θ和¬L2θ以外的文字，形成归纳式C，见式子10.3"
  md: "\n## FOIL中的候选特化式的生成\n\n- FOIL生成多个不同的新文字，每个可被单独地加到规则前件中\n- 更精确地，假定当前规则为：\n \
    \ P(x₁,...,xₖ)←L₁...Lₙ\n  FOIL生成该规则的候选特化式的方法是考虑符合下列形式的新文字Lₙ₊₁\n  - Q(v₁,...,vᵣ)，其中Q为在Predicates中出现的任意谓词名，vᵢ既可为新变量，也可为规则中已有的变量，至少有一个是当前规则中已有的\n\
    \  - Equal(xⱼ,xₖ)，其中xⱼ和xₖ为规则中已有的变量\n  - 以上两种文字的否定\n\n### （2）\n\n- 举例：待学习的规则的目标文字是GrandDaughter(x,y)，即\
    \ GrandDaughter(x,y)←\n  - 生成下列候选文字\n    - Equal(x,y)\n    - Female(x)\n    -\
    \ Female(y)\n    - Father(x,y)\n    - Father(y,x)\n    - Father(x,z)\n    - Father(y,z)\n\
    \    - Father(z,y)\n    - 上面文字的否定\n  - 假定FOIL贪婪地选择了Father(y,z)作为最有希望的文字，得到一个较特殊的规则\n\
    \    GrandDaughter(x,y)←Father(y,z)\n\n### （3）\n\n- 生成进一步特化该规则的候选文字\n  - Female(z)\n\
    \  - Equal(z,x)\n  - Equal(x,z)\n  - Father(z,w)\n  - Father(w,z)\n  - 上面文字的否定\n\
    \n如果FOIL选择了Father(z,x)，然后又选择了Female(y)，将得到下面的规则，它只覆盖正例，因此终止了进一步搜索该规则的特化式的过程\n\n\
    ```\nGrandDaughter(x,y)←Father(y,z)∧Father(z,x)∧Female(y)\n```\n\n- FOIL移去被该规则覆盖的所有样例，如果还有未覆盖的正例，算法将开始搜索下一个规则\n\
    \n## 引导FOIL的搜索（选择文字）\n\n- 要在每一步中从候选文字中选择最有希望的文字，FOIL在训练数据上测量规则的性能\n- 在此过程中，考虑当前规则中每个变量的可能的约束\n\
    - FOIL使用评估函数以估计增加新文字的效用，它基于加入新文字前后的正例和反例的约束数目\n- 考虑某个规则R和一个可能被加到R的规则体的候选文字L，令R’为加入文字L到规则R后生成的规则，则\n\
    \  $Foil\\_Gain(L,R)=\\left(\\log_2\\frac{p_1}{p_1+n_1}-\\log_2\\frac{p_0}{p_0+n_0}\\\
    right)$\n- 按照信息论理论，Foil Gain(L,R)可看作，为了编码R的所有正例约束的分类所需的全部位数由于L带来的减少\n\n## 学习递归规则集\n\
    \n- 如果在表10-4的算法输入参数Predicates 中包含目标谓词（即规则头的谓词），那么FOIL在生成候选文字时必须考虑它，这允许产生递归的规则\n\
