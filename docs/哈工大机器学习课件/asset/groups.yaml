    - 计算一个边界，以描述Find-S在确切学到目标概念c前全部的出错次数\n- Find-S永远不会将一反例错误地划分为正例，因此只需要计算将正例划分为反例的出错次数\n\
    - 遇到第一个正例，初始假设中2n个项式被删去，对后续的被当前假设误分类的正例，至少有一项从假设中删去\n- 出错总数至多为n+1\n\n## Halving算法的出错界限\n\
    \n- 学习器对每个新实例x做出预测的方法是：从当前变型空间的所有假设中取多数票得来\n- 将变型空间学习和用多数票来进行后续预测结合起来的算法称为Halving算法\n\
    - Halving算法只有在当前变型空间的多数假设不能正确分类新样例时出错，此时变型空间至少可减少到它的一半大小，因此出错界线是log₂|H|\n- Halving算法有可能不出任何差错就确切学习到目标概念，因为即使多数票是正确的，算法仍将移去那些不正确、少数票假设\n\
    - Halving算法的一个扩展是允许假设以不同的权值进行投票（如贝叶斯最优分类器和后面讨论的加权多数算法）\n\n## 最优出错界限（2）\n\n- 非形式地说，Opt(C)是C中最难的那个目标概念使用最不利的训练样例序列用最好的算法时的出错次数\n\
    - Littlestone1987证明了\n  VC(C) ≤ Opt(C) ≤ M_Halving(C) ≤ log₂ |C|\n\n## 加权多数算法\n\
    \n- Halving算法的更一般形式称为加权多数算法\n- 加权多数算法通过在一组预测算法中进行加权投票来作出预测，并通过改变每个预测算法的权来学习\n\
    - 加权多数算法可以处理不一致的训练数据，因为它不会消除与样例不一致的假设，只是降低其权\n- 要计算加权多数算法的出错数量边界，可以用预测算法组中最好的那个算法的出错数量\n\
    \n## 加权多数算法（2）\n\n- 加权多数算法一开始将每个预测算法赋予权值1，然后考虑训练样例，只要一个预测算法误分类新训练样例，它的权被乘以某个系数β，0<=β<1。\n\
    \  - 如果β=0，则是Halving算法\n  - 如果β>0，则没有一个预测算法会被完全去掉。如果一算法误分类一个样例，那么它的权值变小\n\n##\
    \ 加权多数算法（3）\n\n- aᵢ 代表算法池 A 中第 i 个预测算法，wᵢ 代表与 aᵢ 相关联的权值\n- 对所有 i，初始化 wᵢ ← 1\n\
    - 对每个训练样例 <x, c(x)> 做：\n  - 初始化 q₀ 和 q₁ 为 0\n  - 对每个预测算法 aᵢ\n    - 如果 aᵢ(x)=0，那么\
    \ q₀ ← q₀ + wᵢ\n    - 如果 aᵢ(x)=1，那么 q₁ ← q₁ + wᵢ\n  - 如果 q₁ > q₀，那么预测 c(x)=1\n\
    \  - 如果 q₀ > q₁，那么预测 c(x)=0\n  - 如果 q₀ = q₁，那么对 c(x) 随机预测为 0 或 1\n  - 对每个预测算法\
    \ aᵢ\n    - 如果 aᵢ(x) ≠ c(x)，那么 wᵢ ← β wᵢ\n\n## 加权多数算法（4）\n\n定理7.5：加权多数算法的相对误差界限\n\
    令D为任意的训练样例序列，令A为任意n个预测算法集合，令k为A中任意算法对样例序列D的出错次数的最小值。那么使用β=1/2的加权多数算法在D上出错次数最多为：2.4(k+log₂n)\n\
    \n证明：\n可通过比较最佳预测算法的最终权和所有算法的权的和来证明。令aⱼ表示A中一算法，并且它出错的次数为最优的k次，则与aⱼ关联的权wⱼ将为(1/2)ᵏ。A中所有n个算法的权的和W=∑wᵢ，W的初始值为n，对加权多数算法的每次出错，W被减小为最多(3/2)W，其原因是加权投票占少数...\
    \ 少数算法最少拥有整数个权W的一半值，而这一部分将被乘以因子1/2。令M代表加权多数算法对训练序列D的总出错次数，那么最终的总权W最多为n(3/4)ᴹ\n\
    由(1/2)ᵏ ≤ n(3/4)ᴹ，得 M ≤ (k + log₂n)/(-log₂(3/4)) ≤ 2.4(k + log₂n)\n\n意义：加权多数算法的出错数量不会大于算法池中最佳算法出错数量，加上一个随着算法池大小对数增长的项，再乘以一常数因子\n\
    \n## 小结\n\n- 可能近似正确模型（PAC）针对的算法从某概念类C中学习目标概念，使用按一个未知但固定的概念分布中随机抽取的训练样例，它要求学习器可能学习到一近似正确的假设，而计算量和训练样例数都只随着1/δ、1/ε、实例长度和目标概念长度的多项式级增长\n\
    - 在PAC学习模型的框架下，任何使用有限假设空间H的一致学习器，将以1-δ的概率输出一个误差在ε内的假设，所需要的训练样例数m满足 m ≥ 1/(ln(1/δ)+ln|H|)\n\
    \n## 小结（2）\n\n- 不可知学习考虑更一般的问题：学习器不假定目标概念所在的类别，学习器从训练数据中输出H中有最小误差率的假设。学习保证以概率1-δ从H中最可能的假设中输出错误率小于ε的假设，需要的随机抽取的训练样例数目m满足\
    \ m ≥ 1/(2ε²) (ln(1/δ) + ln|H|)\n- 学习器考虑的假设空间的复杂度对所需样例的数目影响很大，而衡量假设空间复杂度的一个有用的度量是VC维。VC维是可被H打散的最大实例集的大小\n\
    \n## 小结（4）\n\n- 加权多数算法结合了多个预测算法的加权投票来分类新的实例，它基于这些预测算法在样例序列中的出错来学习每个算法的权值。加权多数算法产生的错误界限可用算法池中最佳预测算法的出错数来计算\n\
    \n## 补充读物\n\n- 计算学习理论中许多早期的工作针对的问题是：学习器能否在极限时确定目标概念\n- Gold1967给出了极限模型下的确定算法\n\
    - Angluin1992给出了一个好的综述\n- Vapnik1982详细考察了一致收敛\n- Valiant1984给出了PAC学习模型\n- Haussler1988讨论了ε-详尽变型空间\n\
    - Bluer et al.1989给出了PAC模型下的一组有用的结论\n- Kearns & Vazirani1994提供了计算学习理论中许多结论的优秀的阐述\n\
    - 会议：计算学习理论年会COLT\n- 杂志：机器学习的特殊栏目\n\n## 机器学习\n\n## 第3章 决策树学习\n\n## 概论\n\n- 决策树学习是应用最广的归纳推理算法之一\n\
    - 是一种逼近离散值函数的方法\n- 很好的健壮性\n- 能够学习析取表达式\n- ID3, Assistant, C4.5\n- 搜索一个完整表示的假设空间\n\
    - 归纳偏置是优先选择较小的树\n- 决策树表示了多个if-then规则\n\n## 提纲\n\n- 决策树定义\n- 适用问题特征\n- 基本ID3算法\n\
    - 决策树学习的归纳偏置\n- 训练数据的过度拟合\n- 更深入的话题\n\n## 决策树表示法\n\n- 决策树\n  - 通过把实例从根节点排列到某个叶子节点来分类实例。\n\
    \  - 叶子节点即为实例所属的分类\n  - 树上每个节点说明了对实例的某个属性的测试\n  - 节点的每个后继分支对应于该属性的一个可能值\n- 图3-1\n\
    - 决策树代表实例属性值约束的合取的析取式。从树根到树叶的每一条路径对应一组属性测试的合取，树本身对应这些合取的析取。\n\n## 决策树学习的适用问题\n\
    \n- 适用问题的特征\n  - 实例由“属性-值”对表示\n  - 目标函数具有离散的输出值\n  - 可能需要析取的描述\n  - 训练数据可以包含错误\n\
    \  - 训练数据可以包含缺少属性值的实例\n- 问题举例\n  - 根据疾病分类患者\n  - 根据起因分类设备故障\n  - 根据拖欠支付的可能性分类贷款申请\n\
    - 分类问题\n  - 核心任务是把样例分类到各可能的离散值对应的类别\n"
