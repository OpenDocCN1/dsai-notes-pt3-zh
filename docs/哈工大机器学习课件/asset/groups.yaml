  - '[PAGE 75]


    # 两个步骤的计算式（2）


    +   - 第二步中的表达式类似于式6.28，只是变成了加权样本均值

    +   - EM算法的要点：当前的假设用于估计未知变量，而这些变量的期望值再被用于改进假设

    +   - 可以证明：算法的每一次循环中，EM算法能使似然P(D|h)增加，除非P(D|h)达到局部最大，因此算法收敛到一个局部最大似然假设'
  - '[PAGE 76]


    <!-- no content -->'
  - '[PAGE 77]


    # EM算法的一般表述（2）


    +   - EM算法通过搜寻使E[lnP(Y|h'')]最大的h''来寻找极大似然假设h''，其合理性是：

    +     - P(Y|h'')是给定假设h''下全部数据Y的似然度，因此找到使得这个值最大的h''是合理的

    +     - 对数lnP(Y|h'')最大化也使P(Y|h'')最大化

    +     - 由于Y是一个随机变量，因此P(Y|h'')无法计算，转而计算它的期望值E[lnP(Y|h'')]

    +   - Y的概率分布由待估计的参数决定，EM算法使用当前假设h代替实际参数，来估计Y的概率分布

    +   - 定义函数Q(h''|h)=E[lnP(Y|h'')|h,X]'
  - '[PAGE 78]


    # EM算法的一般表述（3）


    +   - EM算法的一般形式，重复下面的步骤，直至收敛

    +     - 估计（E）步骤：使用当前假设h和观察到的数据X来估计Y上的概率分布以计算Q(h′|h)

    +       Q(h′|h)←E[lnP(Y|h′)|h,X]

    +     - 最大化（M）步骤：将假设h替换为使Q函数最大化的假设h′

    +       h←argmaxₕ′ Q(h′|h)

    +   - 当函数Q连续时，EM算法收敛到似然函数P(Y|h′)的一个不动点，它保证收敛到一个局部最大值'
  - '[PAGE 79]


    # K均值算法的推导


    +   - 问题框架

    +     - 要估计k个正态分布的均值θ=<μ₁…μₖ>

    +     - 观察到的数据是X={<xᵢ>}

    +     - 隐藏变量Z={<zᵢ₁,…,zᵢₖ>}表示k个正态分布中哪一个生成xᵢ


    +   - 用于K均值问题的表达式Q(h′|h)的推导

    +     - 单个实例的概率

    +     p(yᵢ | h′) = p(xᵢ, zᵢ₁,…,zᵢₖ | h′) = 1/√(2πσ²) e^(-1/(2σ²) Σⱼ zᵢⱼ (xᵢ -
    μⱼ)²)'
  - '[PAGE 80]


    # K均值算法的推导（2）


    — 所有实例的概率的对数


    ln P(Y | h'') = ln ∏_{i=1}^m p(y_i | h'')

    = ∑_{i=1}^m ln p(y_i | h'')

    = ∑_{i=1}^m ( ln 1/√(2πσ²) - 1/(2σ²) ∑_{j=1}^k z_{ij} (x_i - μ_j)² )


    — 计算期望值


    E[ln P(Y | h'')] = E[ ∑_{i=1}^m ( ln 1/√(2πσ²) - 1/(2σ²) ∑_{j=1}^k z_{ij} (x_i
    - μ_j)² ) ]

    = ∑_{i=1}^m ( ln 1/√(2πσ²) - 1/(2σ²) ∑_{j=1}^k E[z_{ij} (x_i - μ_j)²] )'
  - '[PAGE 81]


    # K均值算法的推导（3）


    – 求使Q函数最大的假设


    arg max_{h''} Q(h''|h) = arg max_{h''} Σ_{i=1}^m { ln 1/√(2πσ²) - 1/(2σ²) Σ_{j=1}^k
    E[z_{ij}] [x_i - μ_j]² }

    = arg max_{h''} Σ_{i=1}^m Σ_{j=1}^k E[z_{ij}] [x_i - μ_j]²


    – 解上式得到


    μ_j ← ( Σ_{i=1}^m E[z_{ij}] x_i ) / ( Σ_{i=1}^m E[z_{ij}] )


    – 另外


    E[z_i] ← e^{-1/(2σ²)(x_i - μ_j)²} / Σ_{n=1}^k e^{-1/(2σ²)(x_i - μ_j)²}'
  - '[PAGE 82]


    # 小结


    +   - 概率学习方法利用关于不同假设的先验概率，以及在给定假设时观察到不同数据的概率的知识

    +   - 贝叶斯方法提供了概率学习方法的基础，基于这些先验和数据观察假定，赋予每个假设一个后验概率

    +   - 贝叶斯方法确定的极大后验概率假设是最可能成为最优假设的假设

    +   - 贝叶斯最优分类器将所有假设的预测结合起来，并用后验概率加权，以计算对新实例的最可能分类

    +   - 朴素贝叶斯分类器增加了简化假定：属性值在给定实例的分类时条件独立

    +   - 贝叶斯信念网能够表示属性的子集上的一组条件独立性假定'
  - '[PAGE 83]


    # 小结（2）


    +   - 贝叶斯推理框架可对其他不直接应用贝叶斯公式的学习方法的分析提供理论基础

