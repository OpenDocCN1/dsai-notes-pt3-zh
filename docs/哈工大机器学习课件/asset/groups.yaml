    - 估计偏差衡量估计量的期望值同真实参数值之间的差异。\n- 定义：针对任意参数 p 的估计量 Y 的估计偏差是：\n\n$$E[Y]-p$$\n\n- 如果估计偏差为\
    \ 0，称 Y 为 p 的无偏估计量，在此情况下，由多次重复实验生成的 Y 的多个随机值的平均将收敛于 p。\n- 由于 $error_S(h)$ 服从二项分布，因此\
    \ $error_S(h)$ 是 $error_D(h)$ 的一个无偏估计量。\n- 对估计偏差的补充说明：\n  - 要使 $error_S(h)$ 是\
    \ $error_D(h)$ 的无偏估计，假设 h 和样本 S 必须独立选取。\n  - 估计偏差不能与第 2 章介绍的学习器的归纳偏置相混淆。\n- 估计量的另一重要属性是它的方差，给定多个无偏估计量，选取其中方差最小的。\n\
    - 由方差的定义，所选择的应为参数值和估计值之间期望平方误差最小的。\n"
  mdcn: "\n## 评估假设的问题\n\n- 给定假设 h 和包含若干按分布 D 抽取的样例的数据集，如何针对将来按同样分布抽取的实例，得到对 h 的精度的最好估计？\n\
    - 这一精度估计的可能的误差是多少？\n\n### 样本错误率和真实错误率\n\n- 定义：假设 h 关于目标函数 f 和数据样本 S 的样本错误率（标记为\
    \ $error_S(h)$）\n\n$$error_S(h)=\\frac{1}{n}\\sum_{x\\in S}\\delta(f(x),h(x))$$\n\
    \n其中 $n=|S|$，且\n\n$$\\delta(f(x),h(x))=\\begin{cases}1 & f(x)\\neq h(x)\\\\0 &\
    \ otherwise\\end{cases}$$\n\n- 定义：假设 h 关于目标函数 f 和分布 D 的真实错误率（标记为 $error_D(h)$）\n\
    \n$$error_D(h)=\\Pr_{x\\in D}[f(x)\\neq h(x)]$$\n\n- 我们想知道的是假设的真实误差，因为这是在分类未来样例时可以预料到的误差。\n\
    - 我们所能测量的只是样本错误率，因为样本数据是我们知道的。\n- 本节要考虑的问题是：样本错误率在何种程度上提供了对真实错误率的估计？\n\n### 离散值假设的置信区间\n\
    \n- 先考虑离散值假设的情况，比如：\n  - 样本 S 包含 n 个样例，它们的抽取按照概率分布 D，抽取过程是相互独立的，并且不依赖于假设 h\n \
    \ - $n \\geq 30$\n  - 假设 h 在这 n 个样例上犯了 r 个错误\n- 根据上面的条件，统计理论可以给出以下断言：\n  - 没有其他信息的话，真实错误率\
    \ $error_D(h)$ 最可能的值是样本错误率 $error_S(h)=r/n$\n  - 有大约 95% 的可能性，真实错误率处于下面的区间内：\n\
    \n$$error_S(h)\\pm 1.96\\sqrt{error_S(h)(1-error_S(h))/n}$$\n\n### 举例说明\n\n- 数据样本\
    \ S 包含 $n=40$ 个样例，并且假设 h 在这些数据上产生了 $r=12$ 个错误，这样样本错误率为 $error_S(h)=12/40=0.3$。\n\
    - 如果没有更多的信息，对真实错误率 $error_D(h)$ 的最好的估计即为 0.3。\n- 如果另外收集 40 个随机抽取的样例 S'，样本错误率 $error_{S'}(h)$\
    \ 将与原来的 $error_S(h)$ 存在一些差别。\n- 如果不断重复这一实验，每次抽取一个包含 40 个样例的样本，将会发现约 95% 的实验中计算所得的区间包含真实错误率。\n\
    - 将上面的区间称为 $error_D(h)$ 的 95% 置信区间估计。\n\n### 置信区间表达式的推广\n\n- 常数 1.96 是由 95% 这一置信度确定的。\n\
    - 定义 $z_N$ 为计算 N% 置信区间的常数（取值见表 5-1），计算 $error_D(h)$ 的 N% 置信区间一般表达式（公式 5.1）为：\n\
    \n$$error_S(h) \\pm z_N\\sqrt{error_S(h)(1-error_S(h))/n}$$\n\n- 可以求得同样情况下的 68%\
    \ 置信区间，从直觉上可以看出 68% 置信区间要小于 95% 置信区间，因为要求 $error_D(h)$ 落入其中的概率减小了。\n- 公式 5.1 只能应用于离散值假设，它假定样本\
    \ S 抽取的分布与将来的数据抽取的分布相同，并且假定数据不依赖于所测试的假设。\n- 公式 5.1 只提供了近似的置信区间，当样本至少包含 30 个样例，并且\
    \ $error_S(h)$ 不太靠近 0 或 1 时，这一近似很接近真实情况。\n- 判断这种近似是否接近真实的更精确规则是：\n\n$$n \\cdot\
    \ error_S(h)(1-error_S(h)) \\geq 5$$\n\n### 统计学中的基本定义和概念\n\n- 随机变量\n- 某随机变量 Y\
    \ 的概率分布\n- 随机变量 Y 的期望值或均值\n- 随机变量的方差\n- Y 的标准差\n- 二项分布\n- 正态分布\n- 中心极限定理\n- 估计量\n\
    - Y 的估计偏差\n- N% 置信区间\n\n### 错误率估计和二项比例估计\n\n- 样本错误率和真实错误率之间的差异与数据样本大小的依赖关系如何？\n\
    - 给定从总体中随机抽取的某些样本的观察比例，估计某个属性在总体中的比例。\n- 此处，我们感兴趣的属性是：假设 h 对实例错误分类。\n- 测量样本错误率相当于在做一个有随机输出的实验。\n\
    - 从分布 D 中随机抽取 n 个独立的实例，形成样本 S，然后测量样本错误率 $error_S(h)$。\n- 将实验重复多次，每次抽取大小为 n 的不同的样本\
    \ $S_i$，得到不同的 $error_{S_i}(h)$，取决于 $S_i$ 的组成中的随机差异。\n- $error_S(h)$ 被称为一个随机变量，一般情况下，可以将随机变量看成一个有随机输出的实验。随机变量的值即为随机实验的观察输出。\n\
    - 设想要运行 k 个这样的随机实验，得到 k 个随机变量值，以图表的形式显示观察到的每个错误率值的频率。\n- 当 k 不断增长，该图表将呈现如表 5-3\
    \ 所示的分布，称为二项分布。\n\n### 二项分布\n\n- 有一枚非均匀硬币，要估计在抛硬币时出现正面的概率 p。\n- 投掷硬币 n 次并计算出现正面的次数\
    \ r，那么 p 的一个合理估计是 $r/n$。\n- 如果重新进行一次实验，生成一个新的 n 次抛硬币的集合，出现正面的次数 r 可能与前不同，得到对 p\
    \ 的另一个估计。\n- 二项分布描述的是对任一可能的 r 值，这枚正面概率为 p 的硬币抛掷 n 次恰好出现 r 次正面的概率。\n- 从抛掷硬币的随机样本中估计\
    \ p 与在实例的随机样本上测试 h 以估计 $error_D(h)$ 是相同的问题。\n- 一次硬币抛掷对应于从 D 中抽取一个实例并测试它是否被 h 误分类。\n\
    - 一次随机抛掷出现正面的概率 p 对应于随机抽取的实例被误分类的概率 $error_D(h)$。\n- 二项分布给出了一个一般形式的概率分布，无论用于表示\
    \ n 次硬币出现正面的次数还是在 n 个样例中假设出错的次数。\n- 二项分布的具体形式依赖于样本大小 n 以及概率 p 或 $error_D(h)$。\n\
    \n### 应用二项分布的条件\n\n- 有一种基本实验，其输出可被描述为一随机变量 Y，随机变量 Y 有两种取值。\n- 在实验的任一次尝试中 Y=1 的概率为常数\
    \ p，它与其它实验尝试无关，因此 Y=0 的概率为 $1-p$。\n- p 为预先未知的，面临的问题是如何估计。\n- 基本实验的 n 次独立尝试按序列执行，生成一个独立同分布的随机变量序列。\n\
    - 随机变量 R 表示 n 次实验中出现 $Y_i=1$ 的次数，它取特定值 r 的概率由二项分布给出：\n\n$$\\Pr(R=r)=\\frac{n!}{r!(n-r)!}p^r(1-p)^{n-r}$$\n\
    \n### 均值\n\n- 期望值是对随机变量重复采样所得到的值的平均。\n- 定义：考虑随机变量 Y 可能的取值为 $y_1,\\ldots,y_n$，Y\
    \ 的期望值 $E[Y]$ 定义如下：\n\n$$E[Y]=\\sum_{i=1}^{n} y_i\\Pr(Y=y_i)$$\n\n- 如果随机变量 Y 服从二项分布，那么可得\
    \ $E[Y]=np$。\n\n### 方差\n\n- 方差描述的是概率分布的宽度或散度，描述了随机变量与其均值之间的差有多大。\n- 定义：随机变量 Y\
    \ 的方差 $Var[Y]$ 定义如下：\n\n$$Var[Y]=E[(Y-E[Y])^2]$$\n\n描述了从 Y 的一个观察值估计其均值 $E[Y]$\
    \ 的误差平方的期望。\n\n- 随机变量 Y 的标准差 $\\sigma_Y$：\n\n$$\\sigma_Y=\\sqrt{E[(Y-E[Y])^2]}$$\n\
    \n- 若随机变量 Y 服从二项分布，则方差和标准差分别为：\n\n$$Var[Y]=np(1-p)$$\n\n$$\\sigma_Y=\\sqrt{np(1-p)}$$\n\
    \n### 估计量、偏差和方差\n\n- 回到问题：我们得出了随机变量 $error_S(h)$ 服从二项分布，那么 $error_S(h)$ 和 $error_D(h)$\
    \ 之间的可能差异是多少？\n- 用 5.2 式定义的二项分布，可得\n\n$$error_S(h)=r/n$$\n\n$$error_D(h)=p$$\n\
    \n- 统计学中将 $error_S(h)$ 称为 $error_D(h)$ 的一个估计量。\n- 估计量是用来估计总体的某一参数的随机变量，最关心的是它平均来说是否能产生正确估计。\n\
    - 估计偏差衡量估计量的期望值同真实参数值之间的差异。\n- 定义：针对任意参数 p 的估计量 Y 的估计偏差是：\n\n$$E[Y]-p$$\n\n- 如果估计偏差为\
    \ 0，称 Y 为 p 的无偏估计量，在此情况下，由多次重复实验生成的 Y 的多个随机值的平均将收敛于 p。\n- 由于 $error_S(h)$ 服从二项分布，因此\
    \ $error_S(h)$ 是 $error_D(h)$ 的一个无偏估计量。\n- 对估计偏差的补充说明：\n  - 要使 $error_S(h)$ 是\
    \ $error_D(h)$ 的无偏估计，假设 h 和样本 S 必须独立选取。\n  - 估计偏差不能与第 2 章介绍的学习器的归纳偏置相混淆。\n- 估计量的另一重要属性是它的方差，给定多个无偏估计量，选取其中方差最小的。\n\
    - 由方差的定义，所选择的应为参数值和估计值之间期望平方误差最小的。\n"
