    # 分析解释（3）


    +   - 回归算法的操作过程是，寻找一个置换使Horn子句的头与边缘中的相应文字合一，用规则体替换边缘中的表达式，再应用一个合一置换到整个边缘

    +   - Prolog-EBG输出的最终Horn子句形式如下：子句体被定义为上述过程计算出的最弱前提，子句头为目标概念本身

