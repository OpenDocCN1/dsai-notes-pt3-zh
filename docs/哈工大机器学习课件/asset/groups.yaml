  md: "\n## 过度拟合解决方法（2）\n\n- 一般而言，过度拟合是一个棘手的问题\n- 交叉验证方法在可获得额外的数据提供验证集合时工作得很好，但是小训练集合的过度拟合问题更为严重\n\
    - k-fold交叉方法\n  - 把训练样例分成k份，然后进行k次交叉验证过程，每次使用不同的一份作为验证集合，其余k-1份合并作为训练集合。\n  -\
    \ 每个样例会在一次实验中被用作验证样例，在k-1次实验中被用作训练样例\n  - 每次实验中，使用上面讨论的交叉验证过程来决定在验证集合上取得最佳性能的迭代次数，然后计算这些迭代次数的均值i\n\
    \  - 最后，运行一次反向传播算法，训练所有m个实例并迭代i次\n\n## 举例：人脸识别\n\n- 训练样例\n  - 20个不同人的摄影图像\n  -\
