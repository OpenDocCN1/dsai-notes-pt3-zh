    \ X→{0,1}为X上定义的任一目标概念，并令D为任一训练样例集合{<x,c(x)>}。对所有的X, H, c, D以及良好定义的S和G：\n\nVS_{H,D}={h∈H|(∃s∈S)(∃g∈G)(g≥_g\
    \ h≥_g s)}\n\n证明：只需证明：1）每一个满足上式右边的h都在VS_{H,D}中，2）VS_{H,D}的每个成员都满足都满足等式右边。...\n\
    \n## 变型空间和候选消除算法（7）\n\n- 候选消除算法\n  - 初始化G和S\n  - 如果d是一个正例\n    - 从G中移去所有与d不一致的假设\n\
