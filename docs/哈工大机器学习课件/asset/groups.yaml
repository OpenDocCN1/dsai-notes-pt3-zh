    # 基本的决策树学习算法（2）


    +   - ID3的思想

    +     - 自顶向下构造决策树

    +     - 从“哪一个属性将在树的根节点被测试”开始

    +     - 使用统计测试来确定每一个实例属性单独分类训练样例的能力

