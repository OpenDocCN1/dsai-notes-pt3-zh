    +   - 分析学习使用先验知识和演绎推理来扩大训练样例提供的信息，因此它不受同样的界限制约

    +   - 本章讨论一种称为基于解释的学习（EBL）的分析学习方法

    +   - 基于解释的学习中，先验知识用于分析观察到的学习样例是怎样满足目标概念的

    +   - 然后这个解释用于区分训练样例中哪些是相关的特征，哪些是不相关的

