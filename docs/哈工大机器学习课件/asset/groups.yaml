    +   - 吸收目标状态：没有移出的状态

    +   - 情节：在每个情节中，机器人从某个随机选择的状态开始执行动作直到到达吸收目标状态

    +   - 训练过程包含一系列情节

    +   - q̂ 值的演化过程

    +     - 因为初始的 q̂ 值都为0，算法不会改变任何 q̂ 表项，直到它恰好到达目标状态并且收到非零回报，这导致通向目标状态的转换的 q̂ 值被精化

    +     - 在下一个情节中，如果经过这些与目标状态相邻的状态，其非0的 q̂ 值会导致与目的相差两步的状态中值的变化，依次类推，最终得到一个 q̂ 表'
  - '[PAGE 565]


    # Q算法举例（2）


    +   - 上面的Q学习算法有两个特点：

    +     - Q̂值在训练中不会下降

    +     - Q̂值保持在0和真实Q值区间内

    +   - 因此上面的Q学习算法会收敛到正确的Q函数

    +   - 定理13.1（确定性马尔科夫决策过程中的Q学习的收敛性）

    +     - 考虑一个Q学习，在一个有有界回报的确定性MDP中，Q学习使用式子13.7的训练规则，将表Q̂(s,a)初始化为任意有限值，并且使用折算因子，令Q̂ₙ(s,a)表示在第n次更新后的值，如果那么对所有的s和a，当n→∞时Q̂ₙ(s,a)收敛到Q(s,a)'
  - '[PAGE 566]


    # Q算法举例（3）


    - 证明：


    +   - 令 s'' = δ(s,a)，则

    +   |Q̂_{n+1}(s,a) - Q(s,a)| = |(r + γ max_{a''} Q̂_n(s'',a'')) - (r + γ max_{a''}
    Q(s'',a''))|

    +   = γ |max_{a''} Q̂_n(s'',a'') - max_{a''} Q(s'',a'')|

    +   ≤ γ max_{a''} |Q̂_n(s'',a'') - Q(s'',a'')|

    +   ≤ γ max_{s'''',a''} |Q̂_n(s'''',a'') - Q(s'''',a'')|


    +   - 令 Δ_n = max_{s,a} |Q̂_n(s,a) - Q(s,a)|，则

    +   Δ_{n+1} ≤ γ Δ_n

    +   lim_{n→∞} Δ_n = 0'
  - '[PAGE 567]


    # 实验策略


    +   - 表13-1的算法的一个明显的策略是，对于状态s，选择使 最大化的动作

    +   - 上面策略的风险是过度束缚到在早期训练中有高 值的动作，而不能探索到其它可能有更高值的动作

    +   - 在Q学习中，通常使用概率的途径来选择动作，有较高 值的动作被赋予较高的概率，但所有动作的概率都非0，其中一种方法是

    +     $P(a_i|s) = \frac{k^{\hat{Q}(s,a_i)}}{\sum_j k^{Q(s,a_j)}}$'
