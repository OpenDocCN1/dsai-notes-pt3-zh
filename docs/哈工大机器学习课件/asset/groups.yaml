  - '[PAGE 61]


    # 贝叶斯信念网的推理


    +   - 可以用贝叶斯网在给定其他变量的观察值时推理出某些目标变量的值

    +   - 由于所处理的是随机变量，所以一般不会赋予目标变量一个确切的值

    +   - 真正需要推理的是目标变量的概率分布，它指定了在给予其他变量的观察值条件下，目标变量取每一个可能值的概率

    +   - 在网络中所有其他变量都确切知道的情况下，这一推理步骤很简单

    +   - 一般来说，贝叶斯网络可用于在知道某些变量的值或分布时计算网络中另一部分变量的概率分布'
  md: "\n## 朴素贝叶斯分类器（5）\n\n- 估计概率\n  - 我们通过在全部事件基础上观察某事件出现的比例来估计概率\n  - 当样本很小时，采用平滑技术，m-估计\n\
    \    $\\frac{n_i + m p}{n + m}$\n  - p是将要确定的概率的先验估计，而m是一称为等效样本大小的常量\n  - 在缺少其他信息时，选择p的一种典型的方法是均匀概率，比如某属性有k个可能值，那么p=1/k\n\
    \  - m被称为等效样本大小的原因是：式子6.22可被解释为将n个实际的观察扩大，加上m个按p分布的虚拟样本\n\n## 举例：学习分类文本\n\n- 利用贝叶斯方法学习目标概念，然后用于文本自动过滤，比如\n\
    \  - 我感兴趣的电子新闻稿\n  - 讨论机器学习的万维网页\n- 本节描述一个基于朴素贝叶斯分类器的文本分类的通用算法，它是目前所知的文本分类的最有效方法之一\n\
    - 问题框架：实例空间X包含了所有的文本文档，给定某未知目标函数f(x)的一组训练样例，f(x)的值来自某有限集合V（作为示例，此处令 V={like, dislike}）\n\
    \n## 举例：学习分类文本（3）\n\n- 计算式 $v_{NB} = \\arg\\max_{v_j \\in \\{like, dislike\\}}\
    \ P(v_j) \\prod_{i=1}^{19} P(a_i | v_j) = \\arg\\max_{v_j \\in \\{like, dislike\\\
    }} P(v_j) P(a_1 = \\text{''this''} | v_j)...P(a_{19} = \\text{''sentences''} |\
    \ v_j)$\n- 注意此处贝叶斯分类器隐含的独立性假设并不成立。通常，某个位置上出现某个单词的概率与前后位置上出现的单词是相关的\n- 虽然此处独立性假设不精确，但别无选择，否则要计算的概率项极为庞大。\n\
    - 另外实践中，朴素贝叶斯学习器在许多文本分类问题中性能非常好\n\n## 举例：学习分类文本（4）\n\n- 需要估计概率项P(vᵢ)和P(aᵢ=wₖ|vᵢ)。前一项可基于每一类在训练数据中的比例很容易得到，后一项含三个参数，出现数据稀疏问题\n\
    - 再引入一个假定以减少需要估计的概率项的数量：假定单词wₖ出现的概率独立于单词所在的位置，即 P(aᵢ=wₖ|vᵢ)=P(wₖ|vⱼ)\n- 作此假定的一个主要优点在于：使可用于估计每个所需概率的样例数增加了，因此增加了估计的可靠程度\n\
    - 采纳m-估计方法，即有统一的先验概率并且m等于词汇总表大小，因此 P(wₖ|vⱼ)= (nₖ+1)/(n+|Vocabulary|)\n\n## 表6-2\
    \ 用于学习和分类文本的朴素贝叶斯算法\n\n- Learn_Naive_Bayes_Text( Examples, V )\n  Examples为一组文本文档以及它们的目标值。V为所有可能目标值的集合。此函数作用是学习概率项P(w_k|v_j)和P(v_j)。\n\
    \  - 收集Examples中所有的单词、标点符号以及其他记号\n    - Vocabulary←在Examples中任意文本文档中出现的所有单词及记号的集合\n\
    \  - 计算所需要的概率项P(v_j)和P(w_k|v_j)\n    - 对V中每个目标值v_j\n      - docs_j←Examples中目标值为v_j的文档子集\n\
    \      - P(v_j)←|docs_j| / |Examples|\n      - Text_j←将docs_j中所有成员连接起来建立的单个文档\n\
    \      - n←在Text_j中不同单词位置的总数\n      - 对Vocabulary中每个单词w_k\n        » n_k←单词w_k出现在Text_j中的次数\n\
    \        » P(w_k|v_j)←(n_k+1) / (n+|Vocabulary|)\n\n## 表6-2 用于学习和分类文本的朴素贝叶斯算法（2）\n\
    \n- Classify_Naive_Bayes_Text( Doc )\n  对文档Doc返回其估计的目标值， aᵢ代表在Doc中的第i个位置上出现的单词\n\
    \  - positions ← 在Doc中的所有单词位置，它包含能在Vocabulary中找到的记号\n  - 返回 v_NB， v_NB = arg max_{v_j\
    \ ∈ V} P(v_j) ∏_{i ∈ positions} P(a_i | v_j)\n\n## 实验结果\n\n- Joachims将此算法用于新闻组文章的分类\n\
    \  - 每一篇文章的分类是该文章所属的新闻组名称\n  - 20个新闻组，每个新闻组有1000篇文章，共2万个文档\n  - 2/3作为训练样例，1/3进行性能测量\n\
    \  - 词汇表不包含最常用词（比如the、of）和罕见词（数据集中出现次数少于3）\n- Lang用此算法学习目标概念“ 我感兴趣的新闻组文章 ”\n \
    \ - NewsWeeder系统，让用户阅读新闻组文章并为其评分，然后使用这些评分的文章作为训练样例，来预测后续文章哪些是用户感兴趣的\n  - 每天向用户展示前10%的自动评分文章，它建立的文章序列中包含的用户感兴趣的文章比通常高3~4倍\n\
    \n## 贝叶斯信念网\n\n- 朴素贝叶斯分类器假定各个属性取值在给定目标值v下是条件独立的，从而化简了最优贝叶斯分类的计算复杂度。但在多数情况下，这一条件独立假定过于严厉了。\n\
    - 贝叶斯信念网描述的是一组变量所遵循的概率分布，它通过一组条件概率来指定一组条件独立性假设\n- 贝叶斯信念网中可表述变量的一个子集上的条件独立性假定，因此，贝叶斯信念网提供了一种中间的方法，它比朴素贝叶斯分类器的限制更少，又比在所有变量中计算条件依赖更可行\n\
    \n## 贝叶斯信念网（2）\n\n- 贝叶斯信念网描述了一组变量上的概率分布\n- 考虑一任意的随机变量集合Y₁...Yₙ，其中每个Yᵢ可取的值集合为V(Yᵢ)\n\
    - 变量集合Y的联合空间为叉乘V(Y₁)×...×V(Yₙ)\n- 在此联合空间上的概率分布称为联合概率分布，联合概率分布指定了元组的每个可能的变量约束的概率\n\
    - 贝叶斯信念网则对一组变量描述了联合概率分布\n\n## 条件独立性\n\n- 精确定义条件独立性\n  - 令X, Y和Z为3个离散值随机变量，当给定Z值时X服从的概率分布独立于Y的值，称X在给定Z时条件独立于Y，即\n\
    \    (∀x_i, y_j, z_k) P(X = x_i | Y = y_j, Z = z_k) = P(X = x_i | Z = z_k)\n \
    \ - 上式通常简写成P(X|Y,Z)=P(X|Z)\n- 扩展到变量集合\n  - 下面等式成立时，称变量集合X₁...Xₗ在给定变量集合Z₁...Zₙ时条件独立于变量集合Y₁...Yₘ\n\
    \    P(X₁...Xₗ | Y₁...Yₘ, Z₁...Zₙ) = P(X₁...Xₗ | Z₁...Zₙ)\n- 条件独立性与朴素贝叶斯分类器的之间的关系\n\
    \  P(A₁, A₂ | V) = P(A₁ | A₂, V) P(A₂ | V)\n  = P(A₁ | V) P(A₂ | V)\n\n## 贝叶斯信念网的表示\n\
    \n- 贝叶斯信念网（简称贝叶斯网）表示一组变量的联合概率分布\n- 一般地说，贝叶斯网表示联合概率分布的方法是指定一组条件独立性假定（有向无环图）以及一组局部条件概率集合\n\
