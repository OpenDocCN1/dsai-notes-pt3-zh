    +   - 贝叶斯解释隐含的假定形式为：H上的先验概率由P(h)分布给出，数据拒绝或接受假设的强度由P(D|h)给出

    +   - 在已知这些假定的概率分布后，一个基于贝叶斯理论的概率推理系统将产生等效于Find-S、候选消除等算法的输入-输出行为'
  - '[PAGE 22]


    # 极大似然和最小误差平方假设


    • 前面的分析表明：某些学习算法即使没有显示地使用贝叶斯规则，或以某种形式计算概率，但它们输出的结果符合贝叶斯原理，是一个MAP假设


    • 通过简单的贝叶斯分析，可以表明在特定前提下，任一学习算法如果使输出的假设预测和训练数据之间的误差平方和最小化，它将输出一个极大似然假设


    • 上面结论的意义是，对于许多神经网络和曲线拟合的方法，如果它们试图在训练数据上使误差平方和最小化，此结论提供了基于贝叶斯的理论依据'
  - '[PAGE 23]


    # 极大似然和最小误差平方假设 (2)


    +   问题框架：

    +   - 学习器L工作在实例空间X和假设空间H上，H中的假设为X上定义的某种实数值函数。

    +   - L面临的问题是学习一个从H中抽取出的未知目标函数f，给定m个训练样例的集合，每个样例的目标值被某随机噪声干扰，此随机噪声服从正态分布

    +   - 更精确地讲，每个训练样例是序偶<x_i,d_i>， d_i=f(x_i)+e_i， e_i是代表噪声的随机变量，假定e_i的值是独立抽取的，并且它们的分布服从0均值的正态分布

    +   - 学习器的任务是在所有假设有相等的先验概率前提下，输出极大似然假设（即MAP假设）'
