  - '[PAGE 0]


    # 机器学习


    # 第6章 贝叶斯学习'
  - '[PAGE 1]


    # 概述


    +   • 贝叶斯推理提供了一种概率手段，基于如下的假定：待考查的量遵循某概率分布，且可根据这些概率及已观察到的数据进行推理，以作出最优的决策。


    +   • 贝叶斯推理为衡量多个假设的置信度提供了定量的方法


    +   • 贝叶斯推理为直接操作概率的学习算法提供了基础，也为其他算法的分析提供了理论框架'
  - '[PAGE 2]


    # # 简介


    +   - 贝叶斯学习算法与机器学习相关的两个原因：


    +   - 贝叶斯学习算法能够计算显示的假设概率，比如朴素贝叶斯分类


    +   - 贝叶斯方法为理解多数学习算法提供了一种有效的手段，而这些算法不一定直接操纵概率数据，比如


    +   - Find-S


    +   - 候选消除算法


    +   - 神经网络学习：选择使误差平方和最小的神经网络


    +   - 推导出另一种误差函数：交叉熵


    +   - 分析了决策树的归纳偏置


    +   - 考察了最小描述长度原则'
