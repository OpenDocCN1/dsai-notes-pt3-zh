    # 物流概念产生的经济动因说


    1915年阿奇•萧（Arch Shaw）的《市场流通中的若干问题》（Some Problems In Marketing Distribution，哈佛大学出版社）：


    +   - 将企业的流通活动分为创造需求的活动和物流活动，物流（The Physical Distribution of Goods）是与创造需求不同的一个问题；

    +   - 创造需求和实物供给（物流）之间存在平衡性和相互依赖性两个原则，流通活动中的重大失误都是因为创造需求和物流之间缺乏协调造成的...


    自从阿奇•萧的物流概念提出后，又经过70年左右的时间，物流管理又了明确的定义...


