    \ × | ● | ● | × |\n\n● 主要负责人和决策者　× 业务过程主要参加者　／ 业务过程部分参加者\n\n## 组织机构与业务职能区域、业务过程的对应关系说明\n\
    \n- □ 上述矩阵表可用于确定进行业务过程调查的访问对象，这种访问会帮助建立的业务过程不致有遗漏\n- □ 取得高层管理人员和最终用户的帮助是很重要的，只有他们才知道这个企业是怎样真正工作的\n\
    - □ 要从表中删去重复的业务过程，但不应该为减少业务过程的数目而人为地合并一些业务过程。通常，一个大型组织会有100个或更多的业务过程\n- □ 要认识到通常的企业组织机构图并不能很好地反映出各种业务职能和业务过程，有些人参与的业务过程常常与组织机构图中的业务过程是不一致的\n\
    - □ 对所有业务过程应该按照自顶向下规划的目的来确定，这些业务过程应该是企业最基本的活动和最基本的决策范围，应该是不受具体负责人变动的影响\n\n## 第3部分\
    \ 企业模型\n\n- 职能区域\n- 业务过程\n- 业务活动\n- 企业模型的建立过程\n- 关键成功因素（CSF）\n\n## 业务活动（Activity）\n\
    \n- 在每个业务过程中都存在一定数目的业务活动\n- 例： “采购” 业务过程包含如下业务活动\n  - 提出采购申请单\n  - 选择供应商\n  -\
    \ 提出采购订单\n  - 根据订单监督各项交货\n  - 处理异常情况\n  - 记录供应商执行合同情况\n  - 分析供应商执行合同情况\n- 每个业务过程一般含有\
    \ 5 到 30 个业务活动。在一个小型的公司里可能有几百个业务活动，在一个大型复杂的公司中可能有几千个业务活动\n\n## 业务活动（Activity）\n\
    \n✓业务过程和业务活动之间的差别有些是人为的（如：质量管理既可以是过程，也可以是活动）。最好是把企业的职能区域分解成多个功能，每个功能再被分解成更低层的功能，这样逐级向下分解，直到产生最基本的活动为止。对这些活动的描述应该使用一个动词，以表示该活动所执行的操作。\n\
    \n✓总体规划列出这些业务活动及其所使用的数据时，应具有最小的重复性。画出数据与使用这些数据的活动之间的对应关系图表，可揭示出业务活动的重复性，据此可以提出重新组织业务活动的最好方法。这样，自顶向下规划就由数据处理领域进入业务管理领域，变成考虑企业组织机构的重新组织问题。由此可以看出，企业模型研制的意义\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_706_0.png)\n\n## 业务活动分析方法（1）\n\n- 确定业务活动的工作量比识别与确定业务过程大得多，不能简单罗列，需要做大量的分析、比较、分解、综合工作\n\
    - 功能分解的程度\n- 识别与确定业务活动，首先是自顶向下的分解过程。一个功能是企业中要完成的一项任务，每个功能都可细分为更低一层一些功能，如此细分下去，直到一些基本的活动。\n\
    - 判断功能分解是否到底的一个有效方法，是看是否可以用一句话来说明一个基本活动的内容和目的，如果需要几句话说明，那么这个活动就需要继续细分。这句话中要有一个动词。一般来说，业务活动应该是\
    \ 最基本的、不好再分解的功能。\n\n## 业务活动的分析（2）\n\n## 凝聚性活动\n\n活动模型中每一活动应是凝聚性活动（Coherent Activity）\n\
    \n- 活动应该产生清晰可识别的结果，它的目的就是产生这种结果。这种结果可以是市场上销售的产品或产品的部件，或者是一个想法，一个决策，一次销售，一组可供选择的方案，一份工资单，一个可能的顾客\n\
    - 应该能用一个简单句子来确定这个活动的目的/结果。相比之下，一个粗糙形成的活动，总是产生不可确定的结果，或者几个无关的结果\n- 活动有清楚的边界，活动之间的转换具有清楚的标志。非凝聚性的活动则互相重迭混杂，不能确定在何时何地进行\n\
    - 活动是一个执行单元。它可由一个人或明确规定的一个小组去产生结果，活动的管理职责也有明确规定，由一个人或一组人负责\n- 活动一开始进行就是自封闭的，很大程度上独立于其它活动。如果一个活动按某种方式与另一个活动相互作用十分紧密，就可以把它们作为一个活动。在执行一个活动的同一组人之间的联系，要比不同活动中联系频繁得多。\n\
    \n## 企业模型的建立过程\n\n- 职能区域的划分，业务过程的识别和定义，业务活动的分析确定，都需要规划人员与企业从高层管理人员到基层业务人员的共同努力，由粗到精地加以完成。\n\
    - 当初步的企业模型以图表形式得出以后，要进行认真的复查和审核。复查工作要在核心小组的组织下，除充分发挥用户分析员的作用外，还要有层次地与管理人员对话，请他们进行仔细地审查。\n\
    \n## 企业模型的建立过程\n\n- 复查可以从上向下进行，也可以从下向上进行，或交替进行。\n- 从上向下复查，是指首先看职能区域划分有没有问题，再看业务过程的识别有没有问题，有问题就进行修正。\n\
    - 从下向上复查，是指首先复查业务活动—功能分解是否到基本活动，每一活动是否符合凝聚性特征，有无冗余的活动需要删除，有无类似的活动可以合并。当这些都确定后，再看哪些活动组合在一起作为一个业务过程，和以前确定的过程有何矛盾，如果有就需要调整。最后再由业务过程组成职能区域。经过复查，可以认为所建立的企业模型是一种逻辑模型。\n\
    \n## 企业模型的建立过程\n\n- □ 企业模型的建立过程到此并未停止\n- ■ 因为不论业务活动还是业务过程，都必然地要与数据发生联系。因此，要经过数据实体分析以及数据实体与业务活动的关联分析，才能较完善地建立起企业模型，同时也就建立起数据模型。\n\
    \n## 企业模型的特点\n\n- 完整性\n  - 模型应该是表示组成一个企业的各个职能区域各种职能和活动的完整图表。\n- 适用性\n  - 模型应该是理解一个企业的合理有效方法。在每一个分析层次上，职能和活动的确定，对于参与工作的管理人员来说都应该是觉得自然的和正确的。\n\
    - 永久性\n  - 只要企业目标声明保持不变，这种模型就应该保持是正确的和有效的。有些企业定期对进行改组，有些企业定期地改变管理工作方式。但不论怎样，一些相同的职能必须继续执行。这种企业模型在企业改组时是很有用的，而且与数据的管理方式是无关的，即不管数据是文件、数据库还是纸面上的。\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_714_0.png)\n\n## 企业模型及其计算机表示\n\n- 由于企业模型的建立和图表绘制的工作量很大，而且在多次修改和充实过程中重新绘制图表也繁琐，因而用计算机来处理这些工作是很方便的。\n\
    - 企业模型的计算机表示，实际上是指采用计算机作为辅助工具，来支持整个模型建立的三个阶段工作，以及复查、确认和修改工作。这是一个支持软件，利用它可以大大提高企业模型的建模质量和效率。\n\
    \n"
