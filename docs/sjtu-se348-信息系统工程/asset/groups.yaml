  mdcn: "\n\n## 3.数据元素一致性标准\n\n- 例如，“同义异名”的数据元素\n- “职工姓名”和“员工姓名”的标识分别是**ZGX M**和**YGXM**\n\
    - “单位编码”和“单位号码”的标识分别是**DWBM**和**DWHM**，实际上是对同一个数据元素用了不同的标识\n- 数据元素的创建和使用的规划是信息资源规划的重要内容\n\
    \n## 第四讲 内容大纲\n\n- 信息资源管理概述\n- 信息资源管理基础标准\n  - 数据元素标准\n  - 信息分类编码标准\n  - 用户视图标准\n\
    \  - 概念数据库标准\n  - 逻辑数据库标准\n- 建立和使用数据字典\n- 数据管理工作开展\n\n## 信息分类与信息编码\n\n- 信息分类就是根据信息内容的属性或特征，将信息按一定的原则和方法进行区分和归类，并建立起一定的分类系统和排列顺序，以便管理和使用信息\n\
    - 信息编码就是在信息分类的基础上，将信息对象（编码对象）赋于有一定规律性的、易于计算机和人识别与处理的符号\n- 具有分类编码意义的数据元素是最重要的一类数据元素。应遵照《国家经济信息系统设计与应用标准化规范》和《标准化工作导则：信息分类编码编制的基本原理和方法》关于信息分类编码的规定，按照“国际／国家标准——行业标准——企业标准”的顺序原则，引用或建立企业的信息分类编码标准\n\
    \n## 编码对象的分类——B类\n\n## B类编码对象\n\n- 在信息系统中单独设立编码库表的信息分类编码对象，称之为B类编码对象\n- 这类码表内容具有相对的稳定性，可以组织力量一次编制出来。这类编码表一般都较大，像一些数据库表一样，在应用系统中往往被多个模块所共享，作为一些单独的库表管理是方便的。\n\
    - 如国家行政区划编码、职称编码（国家标准）、生产统计项目编码（行业标准）、设备配件编码（企业标准）等，都是B类编码\n\n## 编码对象的分类——C类\n\
    \n- □ C类编码对象\n\n在应用系统中有一些码表短小而使用频率很大的编码对象，如人的性别代码、文化程度代码和婚姻状况代码等，如果都设立编码库表，不仅系统运行时资源开销大（或内外存交换编码信息频繁），还给系统管理带来一系列的问题，把这类对象统一设一个编码库来管理就可以了\n\
    \n## 信息分类编码标准的建立过程\n\n- 在企业信息系统建设之初，就应该注意信息分类编码工作，应该设置专门的信息分类编码工作小组\n- 在总体数据规划过程中，通过对全企业的信息需求分析，建立起全企业的信息资源管理标准和稳定的数据模型，这是系统建设成功的关键\n\
    - 用户分析员和系统分析员在建立数据元素标准时，就要识别出哪些数据对象具有分类编码意义，按该对象的什么属性或特征进行分类编码，并把这些成果和资料提交给信息分类编码小组\n\
    - 信息分类编码小组首先要调查这些编码对象是否有国际、国家或行业标准，以及在本组织和外单位的应用情况。有上级标准的就要使用上级标准，若没有上级标准，可自行根据编码对象的某些属性或特征，依照信息分类编码原理和方法进行分类编码\n\
    \n## 信息分类编码标准例\n\n| 创建者 | 对象标识 | 对象名称 |\n|---|---|---|\n| 综合查询 | JHBM | 计划分类编码\
