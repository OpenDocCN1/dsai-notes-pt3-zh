    # 霍顿（F.W.Horton）

    信息资源管理（IRM）理论的主要观点


    +   1. 信息资源（Information Resources）与人力、物力、财力和自然资源一样，都是企业的重要资源，应该像管理其他资源那样管理信息资源，IRM是企业管理的必要环节，IRM是企业管理的新职能，应该纳入企业管理的预算


    +   2. 必须将IRM与企业的战略规划联系起来，把信息资源作为战略资产进行管理，在企业的每个层面上识别信息资源和获利机会，并借以构建新的竞争优势


    +   3. IRM的目标是通过增强企业处理动态和静态条件下内外信息需求的能力来提高管理的效益。IRM追求“3E”—Efficient, Effective和Economical，即高效、实效、经济。


    +   4. IRM包括数据资源管理和信息处理管理。前者强调对数据的控制，后者则关心企业管理人员在一定条件下如何获取和处理信息，且强调企业中信息资源的重要性。'
