    实体大组可作为绘制主题数据库部分系统规划矩阵依据\n\n## 客户\n\n## 销售\n\n## 产品\n\n## 仓库\n\n## 生产\n\n## 材料\n\
    \n## 会计\n\n## 加工\n\n## 实体分析应注意的问题\n（1）自顶向下的规划与自底向上的设计相结合问题\n\n![](img/66d4369fd16c75b43d6800360af39d15_821_0.png)\n\
    \n## 实体分析应注意的问题\n（1）自顶向下的规划与自底向上的设计相结合问题\n\n- 自顶向下的规划与自底向上的设计不应该被看成为互不关联和相互矛盾的过程，自底向上的设计是自顶向下规划的延伸，数据模型与实体图性质相同，只不过数据模型往往更加详细。更加详细的设计工作能给自顶向下的规划工作提供进行调整的反馈信息\n\
