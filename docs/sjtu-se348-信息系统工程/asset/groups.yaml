    \ |\n|---|---|---|---|\n| 信息系统工程 | 3 | 48 | 5 |\n| 信息系统分析与设计 | 3 | 48 | 5 |\n\
    | 企业级应用系统体系架构 | 3 | 48 | 6 |\n| 数据仓库与数据挖掘 | 3 | 48 | 6 |\n| 企业信息系统综合设计与实现 | 3\
    \ | 48 | 6 |\n\n## 系统科学\n\n系统科学是从系统的角度去考察和研究整个客观世界，为人类大规模改造世界提供科学理论和方法的一门科学。\n\
    \n系统科学分为三个层次：\n\n- 第一层是基础科学，即系统学。主要研究系统普遍属性、运动规律，系统间复杂关系的形成法则，系统结构和功能的关系，系统有序结构的形成规律以及仿真的基本原理等。\n\
    - 第二层是技术科学。主要研究系统共性问题的技术理论，如最优化理论。当前，系统的技术科学主要是运筹学。\n- 第三层是工程技术。系统的工程技术称为系统工程。它是直接改造客观世界的技术，是大系统的组织管理技术。由于系统的性质不同，相应的系统工程的内容也不完全相同，如信息系统工程、军事系统工程、教育系统工程、经济系统工程等。\n\
    \n## 系统工程\n\n- 系统工程方法论是合理开发系统或改造旧系统的思想、步骤、方法、工具和技术。\n- 系统思想又可称为系统思路或系统方法（System\
    \ Approach），它是人类从不断失败和成功的系统工程实践中总结来的，并用于指导系统开发的思想方法，因此系统工程是一门“解决问题”的应用技术。\n- 系统工程是一种跨学科的方法。\n\
    \n## 系统工程内容\n\n- 开发（Development）\n  - 包括需求分析、系统设计、组件设计和集成。\n- 制造（Manufacturing）\n\
    \  - 包括试制和最终投产。\n- 验证（Verification）\n  - 包括应用论证、试验、审查和分析（仿真）机制，非正式的演示、全面的开发测试和评估，以及产品的验收测试。\n\
    - 部署（Deployment）\n- 运行（Operation）\n- 支持与培训（Support and Training）\n- 处置（Disposal）\n\
    \n## 信息系统工程概念（百度百科）\n\n- 信息系统工程简称“信息工程”，指按照系统工程原理构建信息系统的过程。\n- 信息系统工程包括以下主要阶段：\n\
    \  - 立项\n  - 规划\n  - 建设\n  - 应用\n  - 维护\n\n## 《信息系统工程》课程大纲\n\n- 第一部分：信息系统（开发利用）面临的挑战（问题）\n\
    \  - 第一讲 信息系统工程概述\n- 第二部分：信息系统分类及其描述（基本系统）\n  - 第二讲 信息系统分类描述\n- 第三部分：信息系统工程方法论（方法）\n\
    \  - 第三讲 信息工程与总体数据规划\n  - 第四讲 信息资源管理与基础标准\n  - 第五讲 信息资源规划理论\n  - 第六讲 支撑的方法、标准和工具\n\
    - 第四部分：信息系统工程实践（实践）\n  - 大作业（贯穿课程始终）\n\n## 内容大纲\n\n- 课程简介\n- 教学参考书\n- 信息系统工程概述\n\
    - 信息化/信息系统的本质\n- 信息系统（开发利用）面临的挑战\n- 信息系统工程方法论\n- 课程目标\n\n## 教学参考书\n\n- 詹姆斯·马丁——James\
    \ Martin\n  - 1. 《Information Engineering Book I, II, III》, Prentice Hall, 1990\n\
    \  - 2. 《战略数据规划方法学》, 耿继秀译, 清华大学出版社, 1994\n- 高复先等, 信息工程与总体数据规划, 人民交通出版社, 1989\n\
    - 高复先, 信息资源规划—信息化建设基础工程, 清华大学出版社, 2002\n- 耿继秀, 信息工程——创建企业计算机信息系统的工程, 清华大学出版社,\
    \ 2001\n- 姚乐等, CIO综合修炼, 电子工业出版社, 2009\n- 于海澜, 企业架构, 东方出版社, 2009\n- 李清等, 企业信息化总体设计,\
    \ 清华大学出版社, 2004\n\n## 信息系统的本质有助于我们形成深刻认识：企业信息化\n\n### 企业信息化认识误区\n\n- 面子工程\n- 纸质文件的电子化\n\
    \  - 手工和系统并行，反而增加了工作量\n- 成本项目\n- …\n\n## 什么是企业信息化？\n\n企业信息化是应用信息技术，通过科学的方法利用、配置和优化企业内外资源，使企业的运作管理规范化、科学化和系统化的过程，从而达到提高效率、降低成本、提升客户满意度的目的。\n\
    \n## 企业信息化是\n\n- ERP (Enterprise Resource Planning)\n- CRM (Customer Relationship\
    \ Management)\n- SCM (Supply Chain Management)\n- PDM (Product Data Management)\n\
    - CAD (Computer Aided Design)\n- BI (Business Intelligence)\n- 电子商务 (e-Business)\n\
    - ……等信息系统\n\n在企业中具体应用和实施的过程。\n\n## 体会信息系统\n\n![](img/66d4369fd16c75b43d6800360af39d15_15_0.png)\n\
    \n信息系统不仅仅是计算机软硬件系统的集成，而且是业务流程、基础数据、应用者（角色）与计算机软硬件系统的有机结合。\n\n## 体会信息化的实质\n\n-\
    \ 管理观念变革\n- 业务流程变革\n- 工作方式转变\n- 再创新的过程\n\n信息系统不仅仅是工具和手段\n\n- 信息化与BPR\n- 改变生产与生活方式\n\
    - 支持业务模式的创新\n\n## 管理观念变革\n\n- 信息系统是生产力\n- “过去IT系统是降低成本、提高效率的手段，而现在IT必须是一个系统，要适应战略的发展”，“你能走多远，看与谁同行”（SAP的董事会主席与CEO）\n\
    - 信息系统建设最终是文化建设\n  - （技术—工具—管理—文化）\n\n![](img/66d4369fd16c75b43d6800360af39d15_17_0.png)\n\
    \n## 业务流程变革\n\n炮兵班的故事...\n\n![](img/66d4369fd16c75b43d6800360af39d15_18_0.png)\n\
    \n## 业务流程变革例：POR流程优化\n\n![](img/66d4369fd16c75b43d6800360af39d15_19_0.png)\n\n\
    POR——Purchasing order requirement\n\n现有流程：\n\n- 申请POR（半天）——\n- 协调员释放POR（1天）——\n\
    - 项目经理签字（半天）——\n- 部门经理签字（半天）——\n- 总监签字（半天）\n- 本部门内（3天）\n\n注：POR——采购申请\n\n![](img/66d4369fd16c75b43d6800360af39d15_20_0.png)\n\
    \n财务部门：\n\n- 财务协调签字（1天）——\n- 财务总监签字（4天）\n- 财务部门（5天）\n\n![](img/66d4369fd16c75b43d6800360af39d15_21_0.png)\n\
    \n采购部门：\n\n- 采购协调签字（1天）——\n- 采购经理签字（10天）——\n- 采购经理安排采购员（2天）——\n- 采购员询价（20天）——\n\
    - 采购员发订单（2天）——\n- 货物起运（2天）——\n- 清关/运达工厂（18天）\n- 采购部门（55天）\n\n![](img/66d4369fd16c75b43d6800360af39d15_22_0.png)\n\
    \n总计：63天\n\n## 工作方式变革\n\n### 烟草行业的“一号工程”——“一打两扫”\n\n2010年，我国烟草行业全年实现工商税利6045.52亿元。\n\
    \n2011年上半年，烟草行业生产卷烟2550.5万箱。\n\n![](img/66d4369fd16c75b43d6800360af39d15_24_0.png)\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_24_1.png)\n\n![](img/66d4369fd16c75b43d6800360af39d15_24_2.png)\n\
    \n1箱=5件=250条=2500盒\n\n"
