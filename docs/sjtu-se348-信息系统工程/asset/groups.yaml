    \ - 年度更新改造、大修计划、初审、会审、计划完成情\n    况等\n\n## 概念数据库标准例\n——某港口生产管理信息系统的概念数据库2\n\n-\
    \ 货源信息\n  - 货源基本信息、信息员、船货、外港等信息\n- 气象潮汛\n  - 天气预报及天气、海洋潮讯动态信息（风力、风速、潮位、浪向等）\n\
    - 船舶动态\n  - 船舶资料、预到港、锚地、作业及待离港船舶动态信息\n- 引航计划\n  - 引航计划信息，包括船名、靠离泊位、时间等\n- 库场信息\n\
    \  - 库场构成、运用、盘点等信息\n\n## 概念数据库标准例\n——某港口生产管理信息系统的概念数据库4\n\n- 日装卸作业计划\n  - 船舶靠离泊计划和装卸计划，作业计划\n\
    - 船舶作业计划\n  - 单船作业时间要求、货物配载、作业要求等信息\n- 快速统计\n  - 当日吞吐量、调进量、集装箱、车辆作业、船舶作业等完成情况\n\
    - 船舶停时\n  - 按内外贸、按货类统计的在港船舶停时分析数据\n- 火车动态\n  - 火车装卸货物及在港作业动态信息\n- 火车停时\n  - 调度对火车停时指标的分解统计信息\n\
    \n## 概念数据库标准例\n——某港口生产管理信息系统的概念数据库5\n\n- 安全监督\n  - 劳保用品、特种设备检验、有毒有害作业信息等\n- 安全检查\n\
    \  - 安全检查中查出的问题以及隐患整改信息\n- 货商计费\n  - 货主在港内装卸货物所发生的费用\n- 货物质量\n  - 货物质量鉴定的结果数据\n\
    - 物资信息\n  - 物资计划、采购、入库、保管、出库、调拨、报废、盘点、流向等\n\n## 概念数据库标准的建立不是一件简单工作\n\n- 随便列出一些“主题数据库”，是没有任何标准意义的\n\
    - 经过科学规划建立的概念数据库标准，是企业领导、CIO和系统开发人员共同把握企业数据环境建设，实现系统集成的总纲，在企业信息化建设中有极其重要的意义\n\n\
    ## 第四讲 内容大纲\n\n- 信息资源管理概述\n- 信息资源管理基础标准\n  - 数据元素标准\n  - 信息分类编码标准\n  - 用户视图标准\n\
    \  - 概念数据库标准\n  - 逻辑数据库标准\n- 建立和使用数据字典\n- 数据管理工作开展\n\n## 逻辑数据库（Logical Database）\n\
    \n- 逻辑数据库是系统分析设计人员的观点，是对概念数据库的进一步分解和细化，一个逻辑主题数据库由一组规范化的基本表（Base Table）构成。\n\n\
    - 基本表是按规范化理论与方法建立起来的数据结构，一般要达到“三范式”（3-NF）\n\n- 企业的逻辑数据库标准是指以基本表为基本单元，列出企业全部的逻辑数据库\n\
    \n"
