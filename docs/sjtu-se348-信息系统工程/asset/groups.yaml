    # 软件工程专业信息系统方向专业方向课程


    | 课程名称 | 学分 | 学时 | 开课学期 |

    |---|---|---|---|

    | 信息系统工程 | 3 | 48 | 5 |

    | 信息系统分析与设计 | 3 | 48 | 5 |

    | 企业级应用系统体系架构 | 3 | 48 | 6 |

