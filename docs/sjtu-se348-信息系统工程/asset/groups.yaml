    ## BSP的步骤

    ### 步骤8：整理访问材料


    - 1. 不影响数据处理或信息系统的问题

    - 2. 与当前信息系统有关的问题

    - 3. 与未来的信息系统可能有关的问题


    | 问题（或看法） | 解决方法 | 价值说明 | 信息系统需求 | 受影响的业务过程 | 引起问题的业务过程 |

    |---|---|---|---|---|---|


    ![](img/66d4369fd16c75b43d6800360af39d15_933_0.png)


    ## 访问高级管理人员后材料整理案例


    | 主要问题 | 问题的解决 | 价值说明 | 信息系统需要 | 受到影响的过程 | 引起的过程 |

    |---|---|---|---|---|---|

    | 缺乏有效的生产计划，损失获利性 | 机械化的生产计划制定 | 提高效益，改善顾客关系，改善供应服务 | 生产计划制定 | 生产 | 生产 |

    | 加强董事会职责，要求对财务和管理进行检查 | 更好的信息 | 从外部董事会增加价值 | 成本系统 | 财务 | 财务 |

    | 成本表中缺少“如果…会怎样”的分析能力 | 机械化的联机成本分析表编制能力 | 改善效益，良好的顾客关系 | 成本系统 | 财务 | 经营管理 |

    | 在经营计划制定上没有充分的选择不同方案能力 | 财务模型的建立(“如果…会怎样”的分析能力) | 提高效益，削减亏损，增加产值 | 计划模拟 | 财务/管理
    | 管理 |

    | 缺乏识别和提高人员素质的能力 | 完善的人事资讯信息 | 保留优秀人才，提高积极性 | 技能存贮系统 | 人力资源 | 人力资源 |

    | 市场行情了解不够，使利润和效益受损失 | 更加了解市场行情，需要更多市场行家 | 满足顾客需要 |  | 市场 | 人力资源 |

    | 缺乏有效地调动人员的潜力，生产率低，训练时间长 | 在各个领域建立工作规范 | 称职的管理人员，提高工作质量，增加生产率 | 订货情况 | 人力资源 |
    销售业务 |

    | 顾客关系不好，利润减少，库存积压 | 良好的销售分析和有效成功的计划，更好的买主报告 | 改善顾客关系 | 生产计划 | 市场 | 生产 |

    | 小批量频繁订货，时间要求苛刻，订货处理费用高 | 订货趋势分析/成本分析 | 更好地控制成本 | 区域分析 | 销售业务 | 销售业务 |


