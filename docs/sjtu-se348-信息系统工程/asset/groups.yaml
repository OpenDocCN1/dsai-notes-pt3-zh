    ## 物流典型定义——日本


    1956年，日本“流通技术专业考察团”到美国考察，发现美国的“Physical Distribution(PD)”涉及大量流通技术，能提高流通生产率，将其引入日本，译成日文“物的流通”，1965年简化为“物流”。


    日通综合研究所1981年在《物流手册》上定义：物流是物资资料从供给者向需要者的物理性移动，是创造时间性、场所性价值的经济活动。从物流的范畴来看，包括：包装、装卸、保管、库存管理、流通加工、运输、配送等活动。


    1992年具有22年历史的日本物流管理协议会（JLMA: Japan Logistics Management Association）和日本物流管理协会（JCMA:
    Japanese Council of Logistics Management）合并成立日本后勤系统协会（JILS: The Japan Institute
    of Logistics Systems），将物流改称后勤，其名称中“后勤”几个字并没有翻译成日文文字，而直接用“Logistics”的英文注音。这不仅是词语转换，Logistics已经突破商品流通范围，把物流活动扩大到生产领域。


    ## 物流引入我国


    物流概念引入前，我国一直存在物流活动，主要是储运活动，我国储运业基本相当于国外的物流业。


    - 1979年6月中国物资经济学会派代表团参加在日本举行的第三届国际物流会议，代表团第一次将“物流”概念引入中国。

    - 1987年1月中国物流研究会举行首届大型学术年会，会议对国内物流研究起到较大推动作用。但由于我国经济发展落后，政府和企业对物流的重视程度和力度都不够，中国物流研究进展缓慢，但没有间断。

    - 20世纪90年代后期，随着中国经济的发展和对外开放的深入，尤其是流通体制改革、流通领域连锁经营的发展，以及1997年以来电子商务的发展，国内落后的物流状况引起国内外企业的广泛抱怨，物流研究逐渐引起重视...


    ![](img/66d4369fd16c75b43d6800360af39d15_376_0.png)


    ## 我国对“物流”的定义


    2001年8月正式颁布实施的中国国家标准（《物流术语》GB/T18354-2001）：


    物流是指物品从供应地向需求地的实体流动过程。根据实际需要，将运输、储存、装卸、搬运、包装、流通加工、配送、信息处理等基本功能实现有机结合。


    1996年1月台湾物流管理协会（Taiwan Association of Logistics Management）：


    物流是一种物的实体流通活动的行为，在流通过程中，通过管理程序有效结合运输、仓储、装卸、包装、流通加工、资讯等相关物流机能性活动，以创造价值，满足顾客及社会性需求。


    ![](img/66d4369fd16c75b43d6800360af39d15_377_0.png)


    ## 物流概念剖析——物流与流通


    - 1、流通的作用

    - 2、流通的内容


    ![](img/66d4369fd16c75b43d6800360af39d15_378_0.png)


    商流：对象物所有权转移的活动，或称为贸易或交易。商流中既有贸易决策，又有具体业务和财务的处理，具体包括市场需求预测、计划分配与供应、货源组织、订货、采购调拨、销售等。


    物流：对象物从供应方向需求方的转移活动。不同于加工活动，物流不改变物的形质效用，但能创造时间和空间价值。


    ### 3、商流与物流分离


    进行商品交易活动的地点，往往不是商品实物流通的最佳路线必经之处。


    ![](img/66d4369fd16c75b43d6800360af39d15_379_0.png)


