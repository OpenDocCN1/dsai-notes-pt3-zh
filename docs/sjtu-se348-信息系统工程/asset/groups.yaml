    \n## 应用开发组的基本职责\n\n- 整个企业计算机化的任务十分庞大，需要明确开发与使用的职责，组织多个开发小组，分期分批地进行开发工作\n- 有些项目应该由中心小组来开发，如总帐、预算、采购\n\
    - 有的项目由其它小组来开发，如三个工厂中的一些项目\n- 有些项目要求对业务过程与活动有透彻的了解，必须与最终用户联合进行开发\n\n![](img/66d4369fd16c75b43d6800360af39d15_887_0.png)\n\
    \n## 与主题数据库、实体关系分析结合\n\n- 决定一些实体和实体大组应该放在什么地点\n- 要规划好所使用的数据的分布式类型\n  - 复制数据\n\
    \  - 子集数据\n  - 分区数据\n\n## 确定分布类型的数据使用特征\n\n读取与更新特征影响是否采取复制数据\n\n![](img/66d4369fd16c75b43d6800360af39d15_889_0.png)\n\
    \n| 地点 | 主题数据库和文件 | 分部 DB | 顾客子集 DB | 特殊订单共享 DB | 产品 DB | 顾客 DB | 供应商 DB | 帐目\
