    # 一家银行的21个主题数据库


    一家大银行利用本讲的“信息工程”方法建立了21个主题数据库。


    有了这些数据库后，该银行所有的数 据处理工作都可以在这些数据库的基础 上进行。一旦这些数据库投入使用，并 且利用适当的查询语言和数据分析预测 软件，就可以支持银行的全部业务工作
    （银行业务过程可以分为两类）：


    +   - 一类是日常业务处理和简单查询，它们都是一些相对简单明确的数据库使用操作

    +   - 另一类是更为高级的信息系统，它们需要复杂的数据库应用


