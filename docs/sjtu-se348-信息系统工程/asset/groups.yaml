    - 综合用户需求（用户之间的需求矛盾，用户需求与可行性的矛盾）\n- 科学表达用户需求——规范化的文档、有效的工具支持（源于用户，高于用户，表达用户的真正需求）\n\
    \n## 二、业务分析与业务模型的建立\n\n——按“信息工程”重新认识企业管理工作（P89）\n\n### 梳理业务，建立业务模型（Business Model）\n\
    \n1. 第一步，划分定义职能域（Function Area）\n2. 第二步，识别定义业务过程（Process）\n3. 第三步，识别列出业务活动（Activity）\n\
    \n### 划分定义职能域（Function Area）\n\n——业务范围的概括，不是机构部门的翻版（P90）\n\n- 集团本部职能\n  - 01 集团领导\n\
    \  - 02 办公\n  - 03 政策法规\n  - 04 计划发展\n  - 05 人力资源\n  - 06 生产\n  - 07 财务\n  - 08\
    \ 科技\n  - 09 ..........\n- 分公司职能域\n- 直属单位职能域\n\n涵盖集团公司及所属单位人事部门，统筹各级组织机构及其干部、成员，员工招聘、考核、工资、福利、培训等。\n\
    \n### 识别定义业务过程（Process）\n\n——职能域中的主要业务工作（P91）\n\n**集团本部职能域**\n\n- 01 集团领导\n- 02\
    \ 办公\n- 03 政策法规\n- 04 计划发展\n- 05 人力资源\n- 06 生产\n- 07 财务\n- 08 科技\n- 09 ............\n\
    \n**业务过程**\n\n- 0501 机构管理\n- 0502 员工管理\n- 0503 工资管理\n- 0504 教育培训\n- ...... ......\n\
    \n全体员工的招聘、合同、考核、激励机制等管理。\n\n## “业务模型”是业务梳理的规范化表达\n\n——职能域-业务过程-业务活动\n\n**通常表达：**\n\
    \n- 材料\n  - 采购\n    - 提出采购申请单\n    - 生成采购订单\n  - 供应商\n    - 选择供应商\n    - 记录供应商供货量\n\
    \    - 分析供应商特点\n  - 进货验收\n\n**规范表达（业务模型）：**\n\n| 职能域 | 业务过程 | 业务活动 |\n| --- |\
    \ --- | --- |\n| 材料 | 供应商 | 记录供应商供货量<br>分析供应商特点 |\n| 材料 | 采购 | 提出采购申请单<br>选择供应商<br>生成采购订单\
    \ |\n| 材料 | 进货验收 |  |\n\n## 小结\n\n业务流程分析，建立业务模型\n\n- 划分定义职能域\n  - 短文描述\n- 识别定义业务过程\n\
    \  - 短语界定\n- 识别列出业务活动\n  - 动宾结构\n\n![](img/66d4369fd16c75b43d6800360af39d15_1089_0.png)\n\
    \n### 重点识别定义关键业务过程\n\n## 三、数据分析与用户视图的规范化\n\n——按“信息工程”全面分析用户的信息需求（P100）\n\n###\
    \ 信息需求的基础是分析用户视图（User View）\n\n1. 用户视图的登记与分类\n2. 用户视图组成的规范化\n3. 数据流程图和数据流量化分析\n\
    \n### 什么是“用户视图”？\n\n——用户对数据实体的看法\n\n![](img/66d4369fd16c75b43d6800360af39d15_1091_0.png)\n\
    \n正视图　侧视图　俯视图\n\n- 人事档案：姓名、出生日期、工资、职称、工种、政治面貌、……\n\n### 1. 用户视图的登记与分类（P101）\n\n\
    调研—规范化整理\n\n- 用户视图 1\n  - 登记 1 ……\n- 用户视图 2\n  - 登记 2 ……\n- 用户视图 3\n  - 登记 3 ……\n\
    \n### 用户视图的分类与编码规则\n\n`DXX XXX XX X`\n\n- 族码\n- 序号\n- 小类（类型）编码：1 单证 / 2 帐册 / 3\
    \ 报表 / 4 其它\n- 大类（流向）编码：1 输入 / 2 存储 / 3 输出\n- 职能域编码\n\n> “用户视图登记”例：\n>\n> 用户视图标识：D041309\
    \  \n> 用户视图名称：药材申报单  \n> 生存期：月  \n> 记录数：300\n\n![](img/66d4369fd16c75b43d6800360af39d15_1093_0.png)\n\
    \n### 2. 用户视图组成的规范化（P103）\n\n用户视图组成的规范化表达：\n\n- 组成：序号，数据名称，数据定义\n- 复合数据项组织另表（一范式）\n\
    \n“用户视图组成”续前例：\n\n| 序号 | 数据项/元素名称 | 数据项/元素定义 |\n| --- | --- | --- |\n| 01 | NY\
    \ | 年月 |\n| 02 | DWBM | 单位代码 |\n| 03 | CLBM | 材料编码 |\n| 04 | SL | 数量 |\n| 05 |\
    \ YTDM | 用途代码 |\n\n### 数据结构的规范化过程（示例：工资单）\n\n**“横向冗余”**\n\n| 工号 | 姓名 | 基本工资 |\
    \ 优质奖 | 满勤奖 | 建议奖 | 缺席扣 | 违规扣 | 废品扣 | 实发金额 |\n| --- | --- | --- | --- | --- |\
    \ --- | --- | --- | --- | --- |\n| 0112 | 李小明 | 500 | 200 | 100 | 300 |  |  |\
    \  | 1100 |\n| 0113 | 江华 | 500 |  | 100 | 100 |  | 100 | 100 | 500 |\n| 0116 |\
    \ 孙大光 | 550 | 200 |  |  |  | 100 | 100 | 550 |\n| …… | …… | …… | …… | …… | ……\
    \ | …… | …… | …… | …… |\n\n**“纵向冗余”**\n\n| 工号 | 姓名 | 项目名称 | 项目金额 |\n| --- | ---\
    \ | --- | --- |\n| 0112 | 李小明 | 基本工资 | 500 |\n| 0112 | 李小明 | 优质奖 | 200 |\n| 0112\
    \ | 李小明 | 满勤奖 | 100 |\n| 0112 | 李小明 | 建议奖 | 300 |\n| …… | …… | …… | …… |\n\n###\
    \ 消除复合数据项，重组数据结构\n\n| \\*工号 | 姓名 |\n| --- | --- |\n| 0112 | 李小明 |\n| 0113 | 江华\
    \ |\n| 0116 | 孙大光 |\n| …… | ………… |\n\n| \\*收入代码 | 收入名称 |\n| --- | --- |\n| 01\
    \ | 基本工资 |\n| 02 | 优质奖 |\n| 03 | 满勤奖 |\n| 04 | 建议奖 |\n| … | ………… |\n\n| \\*扣除代码\
    \ | 扣除名称 |\n| --- | --- |\n| 01 | 缺席扣 |\n| 02 | 违规扣 |\n| 03 | 废品扣 |\n| … | ………..\
    \ |\n\n| \\*工号 | \\*收入代码 | 收入金额 |\n| --- | --- | --- |\n| 0112 | 01 | 500 |\n\
    | 0112 | 02 | 200 |\n| 0112 | 03 | 100 |\n| 0112 | 04 | 300 |\n| 0113 | 01 | 500\
    \ |\n| …… | … | …… |\n\n| \\*工号 | \\*扣除代码 | 扣除金额 |\n| --- | --- | --- |\n| 0113\
