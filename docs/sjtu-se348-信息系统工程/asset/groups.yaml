    \n物流宝“可以整合订单的信息、商品的信息、以及物流作业的状态，包括物流结算的功能”，这意味着加盟物流企业自身业务运营的核心数据都需要向淘宝网做相当程度的开放。\n\
    \n可以掌控物流合作伙伴的业务运营数据，物流宝的这一功能，留下无穷的想象空间。物流宝信息平台，将集纳很多对市场更具指标价值的数据，未来有可能直接转化为阿里的另一个获利资源。\n\
    \n### 阿里的“地网”——“中国智能骨干网”(CSN)\n\n- 阿里巴巴集团董事会主席马云、CEO陆兆禧和阿里小微金融服务集团CEO彭蕾同时出现在CSN的发布会现场，足见阿里对此的重视程度。深圳市市长许勤、银泰集团董事长兼总裁沈国军、复兴集团董事长郭广昌、申通董事长陈德军等主要参与方的代表也均到场。沈国军出任“菜鸟网络”CEO，马云出任董事长。\n\
    - CSN的核心目的是依托城镇化的推进，在全国范围内建设物流仓储基地网络，并向所有的制造商、网商、快递物流公司、第三方服务公司开放、与产业链中的各个参与环节共同发展。\n\
    - 希望通过八到十年的建设，为中国物流行业打造出一个前所未有的智能物流骨干网络，使之能支持日均300亿（年度约10万亿，2012年淘宝与天猫的销售额已突破一万亿），让全国任何一个地区做到24小时内送货必达。第一期投资额1000亿人民币。\n\
    \n马云曾在一个非公开场合表示，这个智能物流骨干网，不是电子商务的基础设施，而是未来中国商务的基础设施。今天中国很多成功的企业不能支撑中国未来经济的发展，支撑中国未来经济发展的一定是我们今天没有听过的。未来的新型企业，是基于互联网思考、基于互联网技术、基于对未来判断成长起来的企业，并将支撑整个社会经济发展。打造中国智能物流骨干网就是通过构建一个新型网络物流枢纽，为中国未来商务建立基础设施。\n\
    \n马云感慨的说，“这个项目也许十年后会失败，万一搞成功了，今生无悔，作为民营企业可以参与国家基础设施的投资和建设。”\n\n中国智能骨干网的建设，可依托国家现有公路、铁路、机场等交通基础设施的布局和规划，建设遍布全国的现代化物流仓储网络，提升社会物流效率和基础设施利用率，同时，将带动地方经济的结构转型，推动内外贸型企业多渠道发展，促使更多产业电商化，促进资源优化配置。\n\
    \n2013年1月CSN计划已启动各核心关键网络节点的选址工作，并已和多个省份展开接触和交流。\n\n银泰百货集团董事长、菜鸟网络CEO沈国军在接受记者采访时透露，根据菜鸟网络的规划，其首期将投资1000亿元，希望在5-8年的时间建设一个遍布全国的“开放式、社会化”物流基础设施，支撑日均300亿元(年度约10万亿元)网络零售额。[2]\n\
    \n这些基础设施主要包括两部分：一是在全国几百个城市通过“自建+合作”的方式建设物理层面的仓储设施；二是利用物联网、云计算等技术，建立基于这些仓储设施的数据应用平台，并供给电子商务企业、物流公司、仓储企业、第三方物流服务商以及供应链服务商。\n\
    \n一位电商企业的物流负责人对记者表示，按照如今一个现代化仓库的标准，自建仓储的成本约为2200-2500元/平方米。\n\n据此计算，菜鸟网络首期1000亿元资金如果八成用于仓储自建，可建成的仓储面积约为3200万-3600万平方米。\n\
    \n身为菜鸟网络董事长的马云称，继首期规划投资1000亿元后，菜鸟网络的二期投资为2000亿元，希望用这3000亿元来撬动国家在物流基础设施上业已投入的几十万亿元，让国家的基础设施发挥出更大效应。\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_367_0.png)\n\n## B2C电商都从战略高度布局物流网络，很疯狂！\n\
    \n由于国内社会物流服务已经很难跟上电子商务快速发展的步伐, 各大B2C电子商务纷纷选择自建物流网络\n\n国内若干知名B2C电子商务企业物流网络\n\n\
    - 企业1\n  - 郑州、北京、上海、广州、成都和武汉配送中心\n- 企业2\n  - 北京、苏州、广州物流中心\n- 企业3\n  - 北京、上海、广州、成都、武汉物流中心\n\
