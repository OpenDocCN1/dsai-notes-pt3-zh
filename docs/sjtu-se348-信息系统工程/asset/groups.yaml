    # 图形分析


    阀体的表达方案共五个图形：两个基本视图（全剖主视图“B—B”全剖俯视图“A—A”）、一个局部视图（“D”向）、一个局部剖视图（“C—C”和一个斜剖的全剖视图（“E—E旋转”）。


    ![](img/66d4369fd16c75b43d6800360af39d15_222_0.png)'
  - '[PAGE 223]


    # 各视图的含义分析


    +   主视图“B—B”是采用旋转剖画出的全剖视图，表达阀体的内部结构形状；


    +   俯视图“A—A”是采用阶梯剖画出的全剖视图，着重表达左、右管道；的相对位置，还表达了下连接板的外形及4× φ5小孔的位置。


    +   “C—C”局部剖视图，表达左端管连接板的外形及其上4× φ4孔的大小和相对位置；


    +   “D”向局部视图，相当于俯视图的补充，表达了上连接板的外形及其上4× φ6孔的大小和位置。


    +   斜剖画出“E—E”全剖视图，因右端管与正投影面倾斜45°，所以采用，以表达右连接板的形状。'
