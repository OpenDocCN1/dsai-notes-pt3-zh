    # 对制造业信息化的理解


    +   - 制造业信息化是一项复杂、战略的系统工程。制造业信息化是我国实现新型工业化道路的重要组成部分。

    +   - 我国制造业信息化的指导思想：与时俱进，从十六大提出的“信息化带动工业化”到十七大提出的“工业化和信息化两化融合”及目前提出的“工业化和信息化两化深度融合”。

    +   - 制造业信息化的实现途径：将信息（采集、传递、加工、处理、应用）技术、建模仿真技术、现代制造（设计/生产/管理/试验及其集成）技术、系统工程技术及产品有关专业技术等融合运用于产品研制的全系统、全生命周期过程，实现可持续发展的新模式与新技术手段。

    +   - 制造业信息化的工作内容：通过上述技术手段，使企业（或集团）人/组织、经营管理、技术（三要素）及信息流、物流、资金流、知识流、服务流（五流）集成优化，进而改善产品(P)及其开发时间(T)、质量(Q)、成本(C)、服务(S)、环境清洁(E)和知识含量(K)。

    +   - 制造业信息化的目标：实现数字化、集成化、协同化、网络化、敏捷化、服务化、绿色化、智能化制造，提高企业（或集团）的敏捷性、柔性及健壮性，以达到增强企业（或集团）的市场竞争能力。'
  - '[PAGE 134]


    # 制造业信息化是一个过程


    实现产业升级


    制造技术 自动化技术 现代管理技术 信息技术


    改善企业生产、经营、管理、产品开发'
  - '[PAGE 135]


    # 制造业分类


    +   根据在生产中使用的物质形态，制造业可划分为

    +   - 离散制造业

    +   - 流程制造业


    +   按生产类型不同，制造业可划分为

    +   - 按订单设计（Engineering To Order, 简称ETO）或按项目设计（Engineering To Project）

    +   - 按订单装配（Assemble To Order, 简称ATO）或按订单制造（Make To Order）

    +   - 按库存生产（Make To Stock, 简称MTS）

    +   - 重复生产（Repetitive）

    +   - 批量生产（Batch）

    +   - 连续生产（Continuous）'
  - '[PAGE 136]


    # 离散制造业


    +   - 其主要特征是产品生产以件/次的模式进行的，产品以单件或流水线上成批进行生产。在使用生产线方式的情况下，组成产品的部件在生产线的不同加工设备上依次加工装配完成；在产品加工地点相对静止的情况下，产品的不同处理工序在同一地点完成。

    +   - 机械加工、汽车飞机制造、家电生产过程等'
  - '[PAGE 137]


    # 连续流程制造业


    +   - 原料的物料流及能量流持续进入由一系列生产装置顺序贯组成的固定生产流程后，连续经过反应、换热、分离、流体输送等各类环节，直至生成最后产品。

    +   - 如炼油、化肥、硝酸等。'
  - '[PAGE 138]


    # 离散制造过程与流程生产过程

    生产模式比较


    | 比较因素 | 离散制造过程 | 流程生产过程 |

    |---|---|---|

    | 产品生产 | 大批量/小批量/单件 | 以大批量为主 |

    | 物料流 | 离散 | 连续 |

    | 加工线路 | 灵活、动态可变 | 工艺线路单一，基本不变 |

    | 上下游工序关系 | 松耦合 | 相当强的耦合、关联、制约 |

    | 产品加工种类 | 多变 | 稳定 |

    | 产品设计 | 根据要求经常进行 | 投产后几乎没有 |

    | 产品加工时间 | 可变 | 装置投产后，同样处理量情况下，不变 |

    | 加工过程 | 一般为物理过程 | 伴随着化学、物理变化，机理复杂 |

    | 生产柔性 | 强 | 以刚性系统为主 |

    | 环境问题 | 轻 | 排污问题严重，需要全面治理 |'
