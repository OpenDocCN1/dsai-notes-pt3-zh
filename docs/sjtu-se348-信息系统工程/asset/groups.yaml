    \ B的下面\n    - ✓ 如果J与H的联系比K与H的联系使用得更加频繁，那末H就可在J下面\n  - ■ 遇到形成回路的联系时，回路中最弱的联系必须被暂时断开，以便于绘图\n\
    \    - ✓ 这里假定C 与N是最弱的联系\n  - ■ 如果联系的强度是未知的，或者是相同的，只要进行一个任意的选择，以便能够绘制实体图\n\n##\
    \ 实体图加上名称的联系\n\n右图是一家电话公司的实体图。给连线加上名称，使得实体图更加明了。\n\n有时候连线上必须加名称，因为在相同的实体之间，有多条连线，或者因为联系的意义不确定。\n\
    \n但是通常这些连线的含义是明确的，因此，有些实体图中连线没有标上名称，意义也很明确。\n\n![](img/66d4369fd16c75b43d6800360af39d15_811_0.png)\n\
    \n## 第5部分 实体活动分析\n\n- 实体分析方法\n- 实体图的结构化\n- 实体的组合\n- 实体与活动之间的对应\n- 相关分析与分组算法\n\
    - 主题数据库的调整\n- 企业的改组\n\n## 实体组与实体大组\n\n数据库系统与描述它们的实体图一样需要被划分成若干部分，以便实施。这些部分可称为：\n\
    \n- 主题数据库\n- 数据类\n- 实体大组\n\n![](img/66d4369fd16c75b43d6800360af39d15_813_0.png)\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_813_1.png)\n\n## 实体组与实体大组\n\n- 更高层次上的实体组，就是实体大组，它可包含一个或多个实体组，是在一个主题数据库中实施的实体的集合\n\
    - 实体可以根据实体间的联系及被使用的频繁程度，组合成为大组。在一个大组内的联系，应该具有较高的使用频率。大组之间的联系，应该具有较低的使用频率。要做到这一点，在进行实体分析时，就应该在实体间的联系加上分类标志。\n\
    - 联系的分类标志可有五种，从最强联系或者最常使用的联系，到最弱的联系或者最不常使用的联系：\n  1. **极弱的联系**：必须在不同的大组中\n  2.\
    \ **较弱联系或不常使用的联系**：可以在不同的大组中\n  3. **一般联系**：可以在一个大组中，也可以不在一个大组中\n  4. **较强联系或经常使用的联系**：可以在同一个大组中\n\
    \  5. **极强联系**：必须在一个大组中\n\n## 连线标上联系类别的实体图\n\n![](img/66d4369fd16c75b43d6800360af39d15_815_0.png)\n\
    \n## 根据联系的分类，划分实体大组\n\n- 第一类联系指出这些实体不应该设计在同一个主题数据库之中。因为有两个第一类联系，所以至少应该划分出两个实体大组，实体A和L、实体M和G分别属于两个实体大组\n\
    - 再来看第二类联系。C到F是唯一的一个第二类联系，根据联系的分类原则，C和F可以在不同的大组之中。这样，C和F在上图中属于一个实体组，现在，把它们分开来，放在两个实体大组中\n\
    - 利用第一类联系可以强制计算机算法将某些实体分裂成为不同的大组。利用第五类联系，可以将某些实体划分到同一大组中。有时这些做法会使得实体组分裂。由第二类联系相连接的大组应尽可能画在相邻的位置上\n\
    \n## 根据联系的分类，划分实体大组\n\n- 当一个实体有多个上层实体时，这些联系分类可以被用来决定该实体应该属于哪个实体组\n- 上图中的实体A被画在实体B下面，而不是画实体G或L下面。与此相似，在C、D、N的联系回路上，较弱的联系是联系C到N的联系\n\
    - 同一组中同一层次上与上层实体联系较强的实体被画在与上层实体联系较弱的实体上面。因此，图中A画在J的上面\n\n## 根据联系的分类\n划分实体大组\n\n\
    被组合成三个实体大组\n\n![](img/66d4369fd16c75b43d6800360af39d15_818_0.png)\n\n## 某制造企业的实体图（95实体）\n\
