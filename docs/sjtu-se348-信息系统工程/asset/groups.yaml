    - 绿色能源和原材料的使用与转换\n- 绿色加工制造\n- 绿色包装\n- 产品的绿色再生（维修、拆卸、回用、处置）\n\n### 积极开发节能产品\n\n\
    - 集中供热和热电联产用中、大容量工业锅炉\n- 余热余压利用设备\n- 高效燃煤锅炉和清洁燃烧锅炉\n- 循环流化床锅炉和水煤浆锅炉\n- 使用各种燃料的特种用途锅炉\n\
    - 超临界和超超临界火电机组\n- 新型、高效电热材料\n- 新型、高效保温材料和隔热材料\n- 节能型风机、泵和压缩机\n- 超高效率三相异步电动机\n\
    - 电控、增压车用汽油机\n- 节能环保型内燃机\n\n### 大力推广节能技术\n\n- 整体煤气化联合循环技术\n- 内燃机电控高压燃油喷射技术及系统\n\
    - 电机交流变频调速技术\n- 炉窑自动控制技术和智能监测技术\n- 快速制造（RM）技术\n- 近净成形、净成形技术\n- 热加工工艺模拟及优化技术\n\
    - 等等……\n\n### 绿色制造、节能减排——工业信息化的一个目标\n\n- 绿色制造、节能产品的开发、节能技术的开发推广离不开信息化\n- 绿色制造、节能减排既是中国特色新型工业化的要求，也是信息化的作用点\n\
    - 信息化与工业化融合的一个目标——实施绿色制造、实现节能减排\n\n## 制造业两化融合的重点之五\n\n- 制造业与物流业对接、联动\n\n### 装备制造企业的供应链全景\n\
    \n供应链管理（SCM）——制造业与物流业联动的结合点、切入点\n\n![](img/66d4369fd16c75b43d6800360af39d15_303_0.png)\n\
    \n### 精益供应链物流信息系统体系结构\n\n![](img/66d4369fd16c75b43d6800360af39d15_304_0.png)\n\
    \n## 制造业两化融合的重点之六\n\n- 从生产型制造向服务型制造转变\n\n### 制造业正孕育着根本变革\n\n![](img/66d4369fd16c75b43d6800360af39d15_306_0.png)\n\
    \n### 服务型制造\n\n- 产品的生产，变成大批量定制，利润空间越来越受到挤压；而服务的增值，在制造过程中所占的比重越来越大。\n- 服务型制造是制造与服务相融合的新的产业形态。\n\
    - 服务型制造向客户提供的不仅仅是产品，还包括依托产品的服务，或整体解决方案。\n\n### 现代制造服务业的内容\n\n![](img/66d4369fd16c75b43d6800360af39d15_308_0.png)\n\
    \n## 内容大纲\n\n- 制造业信息化及信息系统\n  - MRP/MRPII/ERP/SCM\n  - CAD/CAPP/CAM\n  - 两化融合的本质\n\
    \  - 面向2030年的中国制造业\n- 物流业信息化及信息系统\n- 其它典型信息系统\n\n## 中国制造业的转型升级\n\n要素投入驱动\n\n创新驱动\n\
    \n传统增长方式\n高消耗\n高污染\n量的扩张\n\n绿色低碳\n智能制造\n服务型制造\n\n出口拉动\n\n内需拉动\n\n要素投入驱动\n\n###\
    \ 我国装备制造业转型升级的路径\n\n创新驱动\n\n转型升级\n\n生产型制造\n\n服务型制造\n\n信息技术应用\n\n两化深度融合\n\n跟随模仿\n\
    \n自主创新\n\n低端产品生产\n\n高端装备制造\n\n产业聚集\n\n产业集群\n\n粗放管理\n\n精益管理\n\n绿色\n\n智能\n\n融合\n\
    \n服务\n\n超常\n\n## 未来我国制造业的发展方向\n\n- 绿色制造——环境友好型制造业\n- 智能制造——高效低耗型制造业\n- 服务型制造——生产与服务融合的制造业\n\
    - 融合型制造——不断拓展和演进的制造业\n- 超常态制造——制造能力无穷尽的制造业\n\n### 绿色制造\n\n- 产品——节能，节水，对环境友好\n\
    - 设计——便于维修、拆解、回收，轻量化\n- 材料——对人体、环境无害，可降解，可回收\n- 制造——制造工艺少、无污染，制造过程少、无废弃物，精确成形\n\
    - 包装——可重复使用，包装材料可降解\n- 循环——废弃物和副产品成为其他产业的原料，再制造\n\n### 智能制造\n\n- 智能制造（Intelligent\
    \ Manufacturing, IM）是由智能机器和人类专家共同组成的人机一体化智能系统来完成产品制造整个过程。\n- 智能制造系统在制造过程中能进行智能活动，诸如分析、推理、判断、构思和决策等。\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_316_0.png)\n\n### 服务型制造\n\n- 随着产品的生产变成大批量定制方式，产品的利润空间越来越受到挤压，而服务的增值，在制造过程中所占的比重越来越大，逐渐形成制造与服务相融合的新的产业形态——服务型制造。\n\
    - 服务型制造向客户提供的不仅仅是产品，还包括依托产品的服务，或整体解决方案，也包括围绕产品生产的各类服务。\n\n### 融合型制造\n\n- 学科——不同学科的交叉\n\
    - 工艺——多种工序、多种工艺的复合\n- 技术——不同技术的融合，与信息技术、激光技术、生物技术、纳米技术的融合\n- 材料——各种新材料的应用\n- 系统——单元、系统、流程的融合集成\n\
    - 文化——智慧、情感需求、文化的融入\n\n### 产品和装备的数字化\n\n产品和装备实现数字化，是向国民经济各部门提供智能化生产工具，从而提高我国社会生产力水平、提高我国装备制造业国际竞争力。\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_320_0.png)\n\n### 超常态制造\n\n- 巨系统制造——极大尺度、超重件和设备\n\
    - 微纳制造——微米和纳米量级的零件和系统制造，MEMS\n- 超常环境制造——极高（低）温、极高压、强能场、强能束\n- 超精密——精度优于亚微米级、粗糙度优于几十纳米的超精密加工\n\
    - 超常成形工艺——无模、增量制造\n\n### 超常态制造是制造业水平的表征\n\n- 超常制造是制造业面对用户所使用的装备朝着大容量、高参数发展，使用的工况条件朝着超常态变化的必然，是对制造业的制造能力和水平的挑战。\n\
    - 超常态制造需向用户提供超乎常态的部件、设备，为此需要超乎常态的制造技术和工艺，以及实现这些技术和工艺的装备。\n- 超常制造是一国制造业能力和水平的表征。\n\
    \n### 3D打印系统改变制造业？\n\n![](img/66d4369fd16c75b43d6800360af39d15_323_0.png)\n\n\
    ### 密切关注对我国制造业未来发展影响较大的领域\n\n- 培育和发展战略性新兴产业——高端装备\n- 加快发展先进制造业——数字化制造技术、增量制造、生物制造、微纳制造\n\
    - 两化深度融合——综合集成、精益企业\n- 新能源和能源结构的改变——风、光、微网\n- 城镇化——基础设施、环境生态\n- 农业现代化——设施农业、微灌、滴灌\n\
    - 医疗卫生与老龄社会——医疗设备、老龄服务\n\n### 智能制造装备发展重点\n\n### 数字化企业\n\n### 数字化工厂\n\n### 数字化车间\n\
    \n### 自动化智能化生产线\n\n- 激光器\n- 电子标签\n- 光电子器件\n- 传感系统\n- 执行系统\n- 伺服系统\n- 控制系统\n- 数控机床\n\
    - 机器视觉系统\n- 工业机器人\n- 激光加工系统\n- 3D打印系统\n- 智能工艺装备\n- 物料运送仓储设备\n- 远程监测监控系统\n\n###\
    \ 未来十年先进制造业发展重点领域\n\n- 1、智能制造\n- 2、增量制造\n- 3、工业机器人\n- 4、激光加工\n- 5、集成电路制造\n- 6、显示器件制造\n\
    - 7、光电子器件制造\n- 8、物联网智能\n  - 终端设备制造\n- 9、生物制造\n- 10、微纳制造\n- 11、新材料\n\n### 从“制造大国”走向“制造强国”\n\
    \n创新驱动\n\n智慧企业\n\n引领新的工业革命\n\n实现“中国梦”\n\n生物制造，微纳制造，新材料，新能源\n\n网络制造，智能制造\n\n大力发展先进制造技术、先进制造业\n\
    \n两化深度融合、转型升级、发展战略性新兴产业\n\n高档数控机床与基础制造装备等科技重大专项\n\n863计划，科技支撑计划\n\n“两用”工程，数字化设计制造\n\
    \n制造业信息化工程\n\nCIMS\n\nCAD应用工程\n\n2005\n\n2010\n\n制造大国\n\n2015\n\n2020\n\n2030\n\
    \n制造强国\n\n2050\n\n"
