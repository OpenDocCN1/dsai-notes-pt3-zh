    # 诺兰的企业信息系统发展阶段模型


    ![](img/66d4369fd16c75b43d6800360af39d15_1043_0.png)'
  - '[PAGE 1044]


    单位购置第一台计算机并初步开发管理应用程序。一般，“初装”阶段大多发生在单位的财务部门。


    机用手算，使用计算机的数据处理而提高效率，计算机技术应用开始大面积推广普及。


    使用计算机，开发信息系统，而且缺乏对其应用的总体规划和管理，既浪费了资源，也没有形成系统。


    人们开始从实际需要出发，总结经验，全面规划开发计算机的各层应用，进行系统的集成和管理。


    在上阶段的基础上，引进计算机网络、数据库和多媒体技术，并充分发挥计算机信息系统的功能。


    人们除了一把计算机应用于日常管理之外，进一步共享资源、优化数据、统一规划、扩展应用。


    ![](img/66d4369fd16c75b43d6800360af39d15_1044_0.png)


    > 由于重新装备大量设备，此阶段预算费用又一次迅速增长。如果进行企业局域网络的建设，实现企业数据的共享。


    > 由以计算机为中心转向以数据为中心。


    > 指具有完备的MIS和DSS，并真正应用于企业管理的各个方面，它是个相对的概念。


    > 人们对计算机还不了解，只是从兴趣出发而接触计算机。


    > 主要的问题：大量的计算机没有真正的用于管理，严格的控制阶段便代替了变革阶段。本阶段将是实现从以计算机管理为主到以数据管理为主转换的关键，一般发展较慢。'
  md: "\n## 问题三\n程序员和分析员一直在进行数据管理，为什么还要进行数据管理？\n\n- 分析员和程序员所管理的，仅是在他个人控制下的系统和程序中的那些数据结构。这种分散的管理，已经导致程序与系统中的冗余数据和不一致数据的激增\n\
    - 随着企业计算机应用的发展，用户需要的是综合的数据处理系统，需要的数据分布在许多应用之中，甚至遍布整个组织\n- 例如，现在人事部门希望存取的数据，正是以前工资部门的专用性数据，工资部门会需要与人事部门相关的职工个人信息\n\
    - 这就需要进行协调和规划，只有采用自顶向下的方法，才能做到这一点。在这项工作中，数据管理员必须是领头者\n- 企业建立数据字典用来存储信息资源管理基础标准的全部内容，以支持各个应用项目的开发，多个项目的互连，全系统的建设、运行、维护和数据信息的使用\n\
    - 概念层的数据字典系统，主要支持总体数据规划，建立概念数据字典——从数据元素定义到概念数据库定义；而逻辑层和物理层的数据字典系统，主要支持应用项目的系统分析设计和实施工作中的数据管理\n\
    \n## 问题三\n程序员和分析员一直在进行数据管理，为什么还要进行数据管理？\n\n- 数据字典的建立和使用，会加强企业内各部门之间关于数据和系统知识的沟通\n\
    \n- 交叉阴影部分，代表了数据字典的通讯涵义，是共享信息的集中存放地。数据字典是一个中心元库，它所存储的资料可以被公司所有部门存取，任何人只要有一台终端，并且具有数据字典方面的知识，就可以存取他所需要的全部资料\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_1028_0.png)\n\n## 问题三\n\n### 程序员和分析员一直在进行数据管理，为什么还要进行数据管理？\n\
    \n- 数据字典的另一作用是作为一个术语汇编，数据字典类似于大词典，其中包含公司所使用的术语词汇\n\n如果说大词典对于准确的语言交流是必不可少的，那么数据字典对于企业内信息资源的了解和相互沟通，同样也是十分重要的。作为各种术语的词汇表，数据字典对于数据处理和用户部门的新来职员，也是非常有价值的培训工具\n\
    \n- 数据字典是支持结构化分析和设计的有效工具\n\n它可用于形成数据存储（Data store），数据流（Data flow）和处理实体类（Process\
    \ entity class）的文档资料，这样，它就成为向用户描绘系统设计细节的有力工具。数据字典还可以用于生成文件、片断和记录的定义，集中控制程序中的数据定义，确保数据使用的一致性，并且抑制数据冗余。数据字典中的文档资料是“活的”资料，数据字典的自动检索和相互参照功能，可包括多个程序、系统、数据库、报表格式定义，以及其他文档的目录\n\
    \n## 问题三\n\n程序员和分析员一直在进行数据管理，为什么还要进行数据管理？\n\n- 数据字典既是利用最终用户的知识与经验，也是利用信息系统人员才干的最有效的工具\n\
    \n- 通过数据的特征、关系和规范的定义，用户可以直接参加系统的设计工作。用户更能直接控制整个系统的设计，而且同时节省出数据处理人员在数据定义上的时间。数据字典是授权给用户部门更多的数据处理工作和职责的工具\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_1031_0.png)\n\n## 第四讲 内容大纲\n\n- 信息资源管理概述\n\
