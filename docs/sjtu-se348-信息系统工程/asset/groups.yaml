    ## 供应链管理的定义


    ## 供应链管理（Supply Chain Management）


    为满足客户需要的服务水准，对从供应商、制造商、分销商、零售商，直到最终用户间的整个渠道进行整体管理和优化。


    ## 供应链管理的发展历程


    ### 第一阶段：萌芽阶段（1980—1989）


    美国管理学家Stevens在1989年提出SCM的概念。认为SCM是一种集成的思想，包括企业内部集成和企业外部集成，供应链成员间合作非常重要。


    ### 第二阶段：初步形成阶段（1990—1995）


    供应链成员间存在利益冲突，导致SCM绩效不高；信息不能在供应链成员间有效共享成为企业提高竞争力的障碍。


    ### 第三阶段：建立合作伙伴关系（1996—至今）


    前一时期提出“协调供应链”，主张各合作公司之间一致“协调对外”。之后又强调与尽可能少的供应商合作，对合作伙伴的选择是分步骤的、考虑多种因素的综合评价过程。


