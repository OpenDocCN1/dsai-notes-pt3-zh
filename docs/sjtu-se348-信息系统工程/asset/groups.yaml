  mdcn: "\n\n## 上升到政治高度认识信息化与信息系统……\n\n## 中国特色现代化道路——“四化同步”\n\n![](img/66d4369fd16c75b43d6800360af39d15_49_0.png)\n\
    \n- 促进工业化、信息化、城镇化、农业现代化同步发展。\n- 坚持走中国特色新型工业化道路，推动信息化和工业化深度融合\n\n——十八大报告\n\n##\
    \ 制造业是我国经济发展的强劲动力\n\n- 改革开放以来的三十多年，制造业一直是我国经济发展的强劲动力。经过近十年的快速发展，就总量和规模而言，我国制造业已位居世界第一，“中国制造”是支撑中国经济和社会发展的原动力\n\
    \n- 未来若干年内制造业的持续健康发展仍是我国经济发展的\n  主要动力\n\n## 利薄如纸的制造业\n\n![](img/66d4369fd16c75b43d6800360af39d15_51_0.png)\n\
    \nSource: CEC-CEDA China Top 500, http://www.cec-ceda.org.cn/c500/chinese/; IBV\
    \ analysis\n\n## 制造业必须转型升级——信息化是引擎\n\n美国加州大学和雪城大学的3位教授合作撰写《捕捉苹果全球供应网络利润》研究报告称，每售出一台iPhone手机，苹果公司就能获得其中利润的58.5%，而作为主要的iPhone组装地，中国大陆相关从业者从中能获得的利润只有1.8%。\n\
    \n2010年，苹果公司每卖出一台iPhone：\n\n- 苹果独占其中58.5%的利润\n- 塑胶、金属等原材料供应商，占去了21.9%\n- 作为屏幕、电子元件主要供应商的韩国，分得利润的4.7%\n\
    - 未归类项目占去4.4%\n- 非中国劳工占去3.5%\n- 苹果公司以外的美国从业者获得2.4%\n- 中国大陆劳工获得1.8%\n- 欧洲获得1.8%\n\
    - 日本和中国台湾各获得0.5%\n\n未来十年是我国制造业转型升级、从“制造大国”走向“制造强国”的关键时期\n\n两化深度融合、发展战略性新兴产业和先进制造业是保持我国制造业竞争优势的重要支撑\n\
    \n## 本课程将重点描述两类代表性信息系统\n\n- 制造业信息化及信息系统\n- 物流业信息化及信息系统\n- 其它典型信息系统\n\n## 计算机集成制造CIMS\n\
    \n- 工程设计分系统\n  - CAD子系统\n  - CAPP子系统\n  - CAM子系统\n- 经营管理分系统\n- 制造自动化分系统\n- 质量保证分系统\n\
    - 支撑系统\n  - 计算机网络\n  - 数据库系统\n\n## 本课程将重点描述两类代表性信息系统\n\n- □ 制造业信息化及信息系统\n- □ 物流业信息化及信息系统\n\
    - □ 其它典型信息系统\n\n## 企业物流供应链\n\n供应商\n\n供应商管理\n\n采购\n\n库存\n\n生产\n\n分销\n\n配送\n\n财务结算\n\
    \n售后\n\n回收\n\n废弃\n\n客户\n\n采购\n\n库存\n\n生产\n\n销售\n\n订单处理\n\n采购下单\n\n供应商备料\n\n运输\n\
    \n来料检验\n\n购料存储\n\n过程等待\n\n加工\n\n检验和返工\n\n成品仓储\n\n成品发运\n\n货款回收\n\n企业生产全过程\n\n##\
    \ 物流信息化与信息系统\n\n### 配送\n- 成品配送\n- X-Docking\n- 集中与分配\n- JIT供货\n- 灵活补货\n- POD\n\
    \n### 仓储\n- 收货\n- 发货\n- 拣配\n- 存储\n- 盘点\n- 监控与调度\n\n### 运输\n- 运输工具\n- 多种方式\n- 一站式\n\
    - 跟踪\n- 国际货代\n- 进出口报关\n- 转运\n\n### 增值服务\n- 仓储增值（包装、标签、装配、加工、退货等）\n- 配送增值（JIT、产品配套、门到门等）\n\
    - 运输增值（合并运输、模式组合、单据服务等）\n- 采购增值（采购代理、协同采购、VMI等）\n- 供应链增值（网络优化、供应链计划等）\n- 金融增值（质押融资等）\n\
    - 信息增值（虚拟企业、物流咨询、信息系统实施等）\n\n### 信息技术\n- EDI\n- WMS\n- TMS\n- GPS/GIS\n- RFID\n\
    - KPI\n- APS\n- BI\n\n![](img/66d4369fd16c75b43d6800360af39d15_58_0.png)\n\n##\
    \ 内容大纲\n\n- 课程简介\n- 教学参考书\n- 信息系统工程概述\n- 信息化/信息系统的本质\n- 信息系统（开发利用）面临的挑战\n- 信息系统工程方法论\n\
    - 课程目标\n\n- 第一类：彻底、全方位实施\n- 第二类：不断升级换代\n- 第三类：根据需求逐步分散实施\n- 第四类：不同部门或企业间信息交互与共享\n\
    \n## 信息系统（开发利用）面临的挑战总结\n\n## 第一类：彻底、全方位实施\n\n## 按企业信息化总体框架全面实施\n\n![](img/66d4369fd16c75b43d6800360af39d15_62_0.png)\n\
    \n## 第一类：彻底、全方位实施\n\n## 联想信息化案例分析\n\n## 联想为何要信息化\n\n联想2000年PC销量260万台，销售额243亿元。2001年联想重新调整和划分业务范围，确立六大业务群组，下设16个事业部，6家投资公司，三个超百万PC制造厂，在国内有16个城市中心站、11个分支机构，海外有17个分支机构，庞大的营销和服务网点。\n\
    \n## 公司总部\n\n竞争力保障体系\n\n- 公共关系\n- 投资关系\n- 财务\n- 人力资源\n- IT战略发展\n\n- 公司级研发\n- 供应链\n\
