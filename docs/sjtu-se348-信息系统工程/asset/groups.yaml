    # # 企业模型图例


    企业模型是一张完整图表，能表示出一个企业的职能和活动。这张图表可能很大，因为一个企业有几百个业务活动，有的甚至有一千多个业务活动。


    为方便使用，可将这张图表分开画在几张分图上，例如每张分图是一个职能区域的过程和活动，也可以每张分图是一个业务过程的分解。


