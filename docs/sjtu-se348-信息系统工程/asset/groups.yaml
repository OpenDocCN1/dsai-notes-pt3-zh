    \n## 内容提要\n\n信息工程的年代所带来的信息工作程序广泛的联系学科，独立建立于计算机信息处理技术和现代化企业所要求的综合的观点。总体数据规划是信息工程的基础，配合企业技术设计和现代化管理工作的需要。\n\
    本书记述了信息规划与设计、与总体的三重作用程序而形成。书中对信息工程的第一阶段即对企业的信息系统规划、数据和信息系统的设计方法、基本方针管理信息系统和计算机系统设计作了说明。\n\
    书中可供人、企事业领导和专业人员、设计了进行企业计算机系统规划和设计的范围和基本系统结构设计的思路，并介绍了一些关于数据处理的思想和概念。\n\n信息工程与总体数据规划\
    \  \n高复先 吴曙光等 编译  \n人民交通出版社出版  \n（北京和平里西街10号）  \n各地新华书店经销  \n人民交通出版社印刷厂印刷  \n\
    开本：850×1168 1/32 印张：10.625 字数：216千字  \n1980年9月 第1版  \n1980年9月 第1次印刷  \n印数：8001—14500\
    \ 定价：8.05元\n\n## 第三讲 内容大纲\n\n- 信息工程的原理、方法和工具\n- 总体数据规划的组织\n- 企业模型\n- 主题数据库\n-\
    \ 实体活动分析\n- 数据分布规划\n- 总体数据规划方法\n\n## “软件危机”引发“软件工程”\n\n软件工程这一概念，主要是20世纪60年代为寻求“软件危机”的解决方法而提出的。它首次出现在1968年\
    \ NATO（北大西洋公约组织）会议上。\n\n## 软件危机\n\n随着计算机工业的发展，在软件开发过程中逐渐形成了某些矛盾。比如：软件开发没有计划性；软件前期需求分析不足；软件开发过程没有规范等等。这些矛盾表现在软件开发中导致了一系列问题，如开发计划无法顺利执行，成本昂贵，开发的软件错误百出等等。\n\
    \n## “软件工程”\n\n软件工程是一类工程，它借鉴了传统工程的原则和方法，以求高效地开发高质量软件。其中应用了计算机科学、数学和管理科学。\n\n-\
    \ 计算机科学和数学用于构造模型与算法\n- 工程科学用于制定规范、设计模型、评估成本\n- 管理科学用于计划、资源、质量和成本的管理\n\n## 概念：满足软件过程管理需求\n\
    \n综观20世纪60年代末至80年代初，其主要特征是，前期着重研究系统实现技术，后期开始强调开发管理和软件质量。\n\n- 围绕软件项目，开展了有关开发模型、方法以及支持工具的研究。其主要成果有：提出了瀑布模型，开发了一些结构化程序设计语言（例如PASCAL语言，Ada语言）、结构化方法等。\n\
    - 围绕项目管理和软件质量提出了费用估算、文档复审等方法和工具。\n\n20世纪70年代初，自“软件工厂”这一概念提出以来，主要围绕软件过程以及软件复用，开展了有关软件生产技术和软件生产管理的科研与实践。\n\
    \n- 主要成果有：提出了面向对象语言以及相关的面向对象方法，开展了计算机辅助软件工程的研究与实践。\n- 近些年来，针对软件复用及软件生产，软件构件技术以及软件质量控制技术、质量保证技术得到了广泛的应用。目前各个软件企业都十分重视资质认证，并想通过这些工作进行企业管理技术的提升。\n\
    \n## 目标：高效率开发高质量软件产品\n\n软件工程的主要目标是：生产具有正确性、可用性以及开销合适的产品。这些目标的实现不论在理论上还是在实践中均存在很多问题有待解决，它们形成了对过程、过程模型及工程方法选取的约束。\n\
    \n- 正确性意指软件产品达到预期功能的程度\n- 可用性指软件基本结构、实现及文档为用户可用的程度\n- 开销合适性是指软件开发、运行的整个开销满足用户要求的程度\n\
    \n"
