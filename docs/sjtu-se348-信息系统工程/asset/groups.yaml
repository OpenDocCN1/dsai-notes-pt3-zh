    # 数据管理人员职务说明


    +   □ 数据管理部门要认真地编写出数据管理岗位的职务说明文件，每个职务说明应包含下述内容：

    +     ■ 资格：包括该职务在教育、训练和经历方面必须具备的条件。

    +     ■ 职责：包括该职务的任务和责任的详细说明。


    +   □ 职务说明文件将具有下述作用：

    +     ① 帮助数据管理部门选拔最能胜任工作的候选人。如果不能准确地规定完成数据管理任务需要哪些技术，选拔工作就不会得到好的结果

    +     ② 提供有关人员需要培训的信息。如果一个员工需要专门的培训，该文件可用来说明培训开支的合理性

    +     ③ 为员工的工作评价提供考核标准。以文件形式规定对员工的管理要求，有利于建立公正合理性

    +     ④ 为企业提供员工的职责保证。重要的是，文件要写清楚要求数据管理人员的工作结果是什么

    +     ⑤ 有助于企业数据管理工作责任制度的建立。每个数据管理人员的责任都写在文件里，我们就能全面地了解数据管理工作应该完成的任务，加强管理'
