    \  - 系统分析中必须有一部分工作，决定数据库中应当包含哪些数据，这项工作有时被称为数据分析\n  - 可以将数据处理的全过程看作是对数据的一系列的变换。如果给系统或组织在任意时刻拍一张快照，那么这一张快照将只显示一种数据结构。从技术上说，一个处理过程是对数据的一系列变换中的一个，这些变换包括对存储空间中的数据和输入输出数据的变换。\n\
    \n"
