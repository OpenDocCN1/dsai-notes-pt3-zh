    # 应用系统开发目标和数据管理目标不同


    +   - 应用开发目标和数据管理目标常常是完全相反的，其原因是数据管理部门持有“数据驱动”的观点，而系统开发部门则持有“处理驱动”或“应用驱动”的观点


    +   - 如果数据管理不属于传统的应用开发权限之内，那么它应该被放在何处？企业的哪一部门能包含数据管理的目标和任务？


    +   - 质量保证（或质量管理）部门

    +   - 内部审计部门


    | 应用系统开发目标 | 数据管理目标 |

    |---|---|

    | • 面向单项应用 | • 独立于应用项目 |

    | • 短期 | • 长期 |

    | • 根据一个项目的投资回报来衡量成功与否 | • 根据所有应用的全部数据有效使用来衡量成功与否 |'
  md: "\n## 从“诺兰模型”可以看出企业信息化的本质\n\n企业信息化的实质就是从简单地处理数据，逐步过渡到加工数据并产生信息，最后做到把信息当成经营资源与战略资源，全面管理与之相关的各种资源（技术、文化、人员等）\n\
    \n## 诺兰模型对企业信息系统建设的指导意义\n\n- 1、诺兰模型总结了发达国家信息系统发展的经验和规律，一般认为诺兰模型中的各个阶段是不可以跳跃的。\n\
    - 2、无论在确定开发信息系统的策略，或者在制定信息系统规划的时候，都应该首先明确本单位处于哪一个生长阶段，根据这个阶段的特征指导信息系统的建设。\n\n\
    ## 第四讲 内容大纲\n\n- 信息资源管理概述\n- 信息资源管理基础标准\n- 建立和使用数据字典\n- 数据管理工作的开展\n  - 数据管理部门的职责\n\
    \  - 数据管理人员职务说明\n  - 面向数据开发方法与数据管理\n  - 开展数据管理工作的困难和最后的成功\n\n## 数据管理工作范围\n\n|\
    \ 数据管理工作 | 工作范围 | 影响范围 |\n|---|---|---|\n| 企业数据模型建立<br>- 定义实体类<br>- 定义主题数据库<br>-\
    \ 制定数据库实现计划 | 所有系统<br>所有数据结构 | 高层管理部门 |\n| 数据结构设计<br>- 逻辑数据库设计<br>- 其他数据结构设计<br>建议/辅助/批准数据结构设计\
    \ | 一个或多个系统<br>数据库(多个)<br>数据存储(多个) | 数据处理<br>数据库管理 |\n| 数据实体设计<br>- 数据实体命名<br>-\
    \ 定义数据实体<br>- 建立数据实体联系 | 个别程序(多个)<br>数据组(多个)<br>实体(多个) | 程序员<br>系统分析员 |\n\n##\
    \ 数据管理部门的职责\n\n### 3. 支持数据设计专业人员的工作\n\n逻辑数据库设计是一项专门化的工作，需要一些专业人员来做。数据分析员的主要职责是完成逻辑数据结构设计，或者向其他与数据结构设计有关的数据处理人员提供培训、建议和帮助。这些数据结构包括参数表（Parameter\
    \ tables）、数据文件（Files）、数据库（Database），记录（Records）和片段（Segments）。数据管理部门要完全支持这些工作。数据管理人员的有关逻辑数据设计知识和规范化技术，是一个企业的宝贵资源。\n\
    \n### 4. 协调数据使用\n\n数据库分析员、应用开发程序员或系统分析员，都要对个别数据结构的设计和/或维护负责责任。但是，数据管理人员通常还要负责包括在较高层次上的数据规划与设计，这是一种更高层的数据观点，一般要看到多项应用或多个数据库，而且有时要看到整个组织的数据资源。数据管理部门要为部门之间、应用项目或各个数据库范围内信息的有效协调和共享提供必要的知识，这就会使整个组织中的数据冗余最小，而大大增加数据的共享程度。\n\
    \n## 数据管理人员职务说明\n\n- □ 数据管理部门要认真地编写出数据管理岗位的职务说明文件，每个职务说明应包含下述内容：\n- ■ 资格：包括该职务在教育、训练和经历方面必须具备的条件。\n\
    - ■ 职责：包括该职务的任务和责任的详细说明。\n\n- □ 职务说明文件将具有下述作用：\n  ① 帮助数据管理部门选拔最能胜任工作的候选人。如果不能准确地规定完成数据管理任务需要哪些技术，选拔工作就不会得到好的结果\n\
    \  ② 提供有关人员需要培训的信息。如果一个员工需要专门的培训，该文件可用来说明培训开支的合理性\n  ③ 为员工的工作评价提供考核标准。以文件形式规定对员工的管理要求，有利于建立公正合理性\n\
    \  ④ 为企业提供员工的职责保证。重要的是，文件要写清楚要求数据管理人员的工作结果是什么\n  ⑤ 有助于企业数据管理工作责任制度的建立。每个数据管理人员的责任都写在文件里，我们就能全面地了解数据管理工作应该完成的任务，加强管理\n\
    \n## 数据管理职务责任矩阵\n\n| 工作任务 | 数据管理员 | 数据分析员 | 数据库管理员 |\n|---|---|---|---|\n| 数据资源规划\
    \ | P | R |  |\n| 培训 | P | A |  |\n| 建立数据管理标准和规程 | P | A | R |\n| 逻辑数据库设计 | R,\
    \ A | P |  |\n| 数据结构设计 | R | P, A |  |\n| 调查和命名数据实体 |  | A, R | P |\n| 数据字典维护\
    \ |  | A, R | P |\n| 数据定义维护 |  | A, R | P |\n\nR = 复查  P = 完成  A = 帮助\n\n## 第四讲\
    \ 内容大纲\n\n- 信息资源管理概述\n- 信息资源管理基础标准\n- 建立和使用数据字典\n- 数据管理工作的开展\n\n- 数据管理部门的职责\n\
    - 数据管理人员职务说明\n- 面向数据开发方法与数据管理\n- 开展数据管理工作的困难和最后的成功\n\n## 数据管理与系统生命周期方法的结合\n\n\
    - □ 数据管理工作会对传统的过程驱动（Process-driven）的系统生命周期方法有很大的冲击\n\n- ■ 数据管理标准、策略和规程的实施，既可能改变传统的系统开发阶段的划分，也可能改变有关活动的顺序。\n\
    \n- ■ 这种冲击的重要意义，取决于从面向处理（Process oriented）的方法上升到面向数据（Data-oriented）的方法\n\n- □\
    \ 数据管理部门应该尽量减少数据标准的执行对完成开发项目进度的影响，目标是改进系统中所使用的数据的设计，又不影响系统开发本身的进度\n\n- □ 重要的是，尽早地发现违反标准的问题，使必须更正违反标准的重新设计工作减至最少。要做到这一点，我们就必须在数据处理系统开发过程中设置一些数据管理检查点。若数据管理标准是有效的，标准的执行或违反情况都应得到检查，一旦出现违反情况，必须能尽快地发现\n\
    \n## 项目开发生命周期中对数据管理活动及文档资料的建议\n\n| 开发阶段 | 数据管理活动 | 数据管理文档 |\n|---|---|---|\n|\
    \ 可行性研究 | 定义包括在本项目范围内的实体类。识别由这些实体类组成的主题数据库。画出这些主题数据库与其他子系统的数据结构之间的联系图。定义本项目内外的数据流和数据存储——新系统的数据边界\
    \ | 列出并描述实体类和主题数据库。画出本项目的整个数据体系结构图 |\n| 初步设计 | 定义所有有关的用户视图。在数据字典中定义包含在这些用户视图里的所有非冗余的数据元素\
    \ | 所有数据元素名称、属性、规则和意义说明的数据字典 |\n| 初步设计结束 | 定义所有预计的用户视图。识别每一用户视图内的所有数据元素之间的联系。规范化每一用户视图，并将每一用户视图集成到逻辑数据库设计之中\
    \ | 批准的数据字典，批准的逻辑数据库设计 |\n\n## 项目开发生命周期中对数据管理活动及文档资料的建议\n\n| 开发阶段 | 数据管理活动 | 数据管理文档\
    \ |\n|---|---|---|\n| 详细设计 | 从逻辑数据库模型研制出物理数据库。核实物理数据库设计是否满足用户视图的要求。定义所有系统数据结构中的所有数据元素组(片段、记录、文件、表)\
    \ | 包含整个系统所有物理数据流和数据存储的数据字典 |\n| 详细设计结束 | 从数据字典中生成所有用于程序设计阶段的数据定义。生成所有由 DBMS 使用的数据语言定义\
    \ | 数据字典生成的程序语言数据定义和数据语言定义 |\n| 程序设计 | 通过数据字典对程序语言数据定义做必要的调整。通过该程序以确保：(1)所有的程序数据定义都来自数据字典；(2)程序员所使用的数据是有效的和一致的；(3)数据操作和变换符合数据管理标准和程序设计标准\
    \ | 定稿的程序语言数据定义部分。程序通过的批准 |\n\n资料译自：William Durrell. DATA ADMINISTRATION: A Practical\
    \ Guide to Successful Management. 1985; 118 ~119\n\n## 第四讲 内容大纲\n\n- 信息资源管理概述\n\
    - 信息资源管理基础标准\n- 建立和使用数据字典\n- 数据管理工作的开展\n  - 数据管理部门的职责\n  - 数据管理人员职务说明\n  - 面向数据开发方法与数据管理\n\
    \  - 开展数据管理工作的困难和最后的成功\n\n## 应用系统开发目标和数据管理目标不同\n\n- 应用开发目标和数据管理目标常常是完全相反的，其原因是数据管理部门持有“数据驱动”的观点，而系统开发部门则持有“处理驱动”或“应用驱动”的观点\n\
    \n- 如果数据管理不属于传统的应用开发权限之内，那么它应该被放在何处？企业的哪一部门能包含数据管理的目标和任务？\n\n- 质量保证（或质量管理）部门\n\
    - 内部审计部门\n\n| 应用系统开发目标 | 数据管理目标 |\n|---|---|\n| • 面向单项应用 | • 独立于应用项目 |\n| • 短期\
    \ | • 长期 |\n| • 根据一个项目的投资回报来衡量成功与否 | • 根据所有应用的全部数据有效使用来衡量成功与否 |\n"
