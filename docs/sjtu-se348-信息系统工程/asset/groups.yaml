  - '[PAGE 979]


    # 信息分类与信息编码


    +   - 信息分类就是根据信息内容的属性或特征，将信息按一定的原则和方法进行区分和归类，并建立起一定的分类系统和排列顺序，以便管理和使用信息


    +   - 信息编码就是在信息分类的基础上，将信息对象（编码对象）赋于有一定规律性的、易于计算机和人识别与处理的符号


    +   - 具有分类编码意义的数据元素是最重要的一类数据元素。应遵照《国家经济信息系统设计与应用标准化规范》和《标准化工作导则：信息分类编码编制的基本原理和方法》关于信息分类编码的规定，按照“国际／国家标准——行业标准——企业标准”的顺序原则，引用或建立企业的信息分类编码标准'
