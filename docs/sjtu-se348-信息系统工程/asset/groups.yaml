    # 敏捷制造——分散网络化制造


    1991年，在美国国会和国防部的支持下，会同美国众多工业界的主要决策人，美国里海大学Iacocca研究所向美国国会提交了“21st Century Manufacturing
    Enterprise Strategy: An Industry-Led View”报告，首次提出敏捷制造（Agile Manufacturing）。


    为了适应动态多变的市场，企业不能仅仅依靠自身的有限资源，而必须合理利用其它企业的资源和技术，通过计算机网络和通信技术迅速地集成产品开发全过程所需的所有资源——人、资金和设备（包括企业内部的和分布在全球各地合作企业的），快速低成本地为客户提供产品和服务。'
