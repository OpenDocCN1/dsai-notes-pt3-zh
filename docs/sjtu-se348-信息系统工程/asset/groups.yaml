    ![](img/66d4369fd16c75b43d6800360af39d15_259_0.png)


    ![](img/66d4369fd16c75b43d6800360af39d15_259_1.png)


    ## 产品生产过程与CAD/CAPP/CAM过程链


    产品生产过程：产品从需求分析开始，经过产品设计、工艺设计和制造等环节，最终形成用户所需要的产品。


    ![](img/66d4369fd16c75b43d6800360af39d15_260_0.png)


    在各阶段、各环节内，计算机都得到了不同程度的应用。


    ## CAD/CAPP/CAM的主要任务


    - 几何建模

    - 工程绘图

    - 计算分析

    - 优化设计

    - 有限元分析

    - 计算机辅助工艺规程设计

    - 数控编程

    - 动态仿真

    - 计算机辅助测试技术

    - 工程数据管理


    ![](img/66d4369fd16c75b43d6800360af39d15_261_0.png)


    ![](img/66d4369fd16c75b43d6800360af39d15_261_1.png)


    ## 几何建模


    描述基本几何实体（如大小）及实体间的关系（如几何信息），进行图形图像的技术处理


    几何建模技术

    是CAD/CAM系统的核心，为产品设计、制造提供基本数据和原始信息


    ![](img/66d4369fd16c75b43d6800360af39d15_262_0.png)


    ![](img/66d4369fd16c75b43d6800360af39d15_262_1.png)


    ![](img/66d4369fd16c75b43d6800360af39d15_262_2.png)


    ## 计算分析


    计算分析对象：


    - 几何特征（如体积、表面积、质量、重心位置、转动惯量…）

    - 物理特征（如应力、温度、位移…）


    CAD/CAM系统对各类计算分析的算法正确、全面，且有较高的计算精度


    ![](img/66d4369fd16c75b43d6800360af39d15_264_0.png)


    低压冷涡轮叶片结构分析


    油井压缩机头部密封盖失效的原因分析


    ![](img/66d4369fd16c75b43d6800360af39d15_264_1.png)


    ![](img/66d4369fd16c75b43d6800360af39d15_264_2.png)


    ## 优化设计


    CAD/CAM 系统应具有优化求解的功能，也就是在某些条件的限制下，使产品或工程设计中的预定指标达到最优


    ![](img/66d4369fd16c75b43d6800360af39d15_265_0.png)


    ![](img/66d4369fd16c75b43d6800360af39d15_265_1.png)


    优化设计包括：


    - 总体方案的优化

    - 产品零件结构的优化

    - 工艺参数的优化

    - ...


    优化设计是现代设计方法学中的重要的组成部分


    ## 有限元分析


    有限元法是一种数值近似解方法，用来解决结构形状比较复杂零件的静态、动态特性计算，强度、振动、热变形、磁场、温度场强度、应力分布状态等计算分析


    ![](img/66d4369fd16c75b43d6800360af39d15_266_0.png)


    ## 计算机辅助工艺规程设计


    设计的目的是为了加工制造，而工艺设计是为产品的加工制造提供指导性的文件，是CAD与CAM的中间环节


    ![](img/66d4369fd16c75b43d6800360af39d15_267_0.png)


    CAPP根据建模生成的产品信息及制造要求，人机交互或自动决策出加工该产品所采用的加工方法、加工步骤、加工设备及加工参数


    CAPP设计结果一方面生成工艺卡片文件被生产实际应用，一方面直接输出信息，为CAM中的NC自动编程系统接收、识别，直接转换为刀位文件


    ## 数控编程


    分析零件图和制订出零件的数控加工方案后，采用专门的数控加工语言（例如APT语言），提供数控机床各种运动和操作的全部信息


    ![](img/66d4369fd16c75b43d6800360af39d15_268_0.png)


    ![](img/66d4369fd16c75b43d6800360af39d15_268_1.png)


    数控编程基本步骤：


    - ✓ 编程 手工或计算机辅助编程，生成源程序

    - ✓ 前处理 编译源程序，求出刀位文件

    - ✓ 后处理 将刀位文件转换成零件的数控加工程序


    ## 计算机辅助测试技术


    ![](img/66d4369fd16c75b43d6800360af39d15_270_0.png)


    计算机辅助测试技术结合计算机技术、测量技术、信号处理及现代控制理论形成了一门新兴综合性学科


    ![](img/66d4369fd16c75b43d6800360af39d15_270_1.png)


    模具检测


    ![](img/66d4369fd16c75b43d6800360af39d15_270_2.png)


    逆向工程


    ![](img/66d4369fd16c75b43d6800360af39d15_270_3.png)


    管件测量


    '
