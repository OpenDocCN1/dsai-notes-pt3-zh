    \n![](img/66d4369fd16c75b43d6800360af39d15_809_0.png)\n\n## 实体图的结构化方法\n\n- □ 如果一个非根实体具有多个上层实体，应该选择哪一个上层实体呢？\n\
    \  - ■ 图中实体A是一个第二层实体，它可以被画在B、G或L这三个第一层实体中的任何一个下面\n  - ■ 图中H是第三层实体，它可以被画在第二层实体J\
