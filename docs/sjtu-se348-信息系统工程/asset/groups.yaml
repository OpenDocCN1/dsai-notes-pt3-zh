    \n- 本部分将介绍一种更加细致的自顶向下规划方法，对企业实体进行分析，能够发现有害的冗余。另外，针对实体层次进行工作，还能够确定使用各个主题数据库的系统的边界。\n\
    \n# 自上而下规划方法的三个层次\n\n- 主题数据库层次\n- 实体层次\n- 实体和活动层次\n\n为了便于数据库实施，实体需要被划分为一些群组，这一划分实体群组的过程，实际上就产生了主题数据库\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_790_0.png)\n\n# 实体概念\n\n- 实体是指某种含有数据特征的事或物，也就是数据实体的简称\n\
    \n- 实体可以是有形的对象，例如：雇员、零件、客户、机床或一间办公室\n\n- 实体也可以是无形的，例如：工作职务、利润中心、协会、财务补贴、采购、估价、或者保险赔偿\n\
    \n- 每个实体应该用一个名词来命名，有时也可以加上一个修饰词。可以认为一个实体具有该名词所确定的性质。一个实体具有各种需要描述的属性，例如：颜色、货币价值、利用率或者名称。\n\
    \n# 实体、实体类、实体实例\n\n- 实体这个术语有概括性，它的意思是实体类或者一类实体\n\n- 记录这个术语也有概括性，含意是记录类，或者一类记录\n\
    \n- 数据项、属性和其它描述数据的词，也有类似情况\n\n- 一个实体类是确定了名称且具有相同属性类集合的一类实体，例如，雇员就是一个实体类\n\n- 一个实体实例是某一实体类中的一个具体实体。例如，吴大海是雇员这个实体类中的一个具体实例。\n\
    \n# 实体类、记录类、主键字\n\n- 每一个实体类至少有一个记录类，有时这一记录类被称为实体记录。例如，雇员记录是一个包含关于雇员这一实体数据的记录\n\
    - 一个实体类往往需要多个记录类来存储有关该实体类的数据。这往往是因为数据经过了规范化处理，规范化处理是将数据分解为独立的记录，使得每一个记录具有清晰的结构\n\
    - 一个实体通常有一个能够唯一确定它的数据项。例如，雇员号码是确定雇员实体的唯一标识。这个数据项被用作该实体记录的主关键字\n- 当一个实体存在着多个有关的记录时，这种唯一的标识由多个主关键字结合而成。例如，雇员历史记录的关键字有两个数据项：雇员号码和日期\n\
    \n# 相交数据、相交实体记录、实体图\n\n- 有些记录包含实体之间关系的信息\n\n- 例如，供应商和零件是两个实体类，它们的唯一标识是供货商号码加上零件号码。可以用包含这两个主关键字的记录来存放由某个供应商所提供的某个零件的详细情况，例如，它的价格和交货时间。\n\
    \n- 这种数据有时被称为相交数据，这种记录可以被称为相交实体记录。\n\n- 实体图描述了多个实体，其中包括含有多个主关键字的实体和实体之间的联系。\n\n\
    # 某制造公司的实体图\n\n实体图是一个概貌图，并不指出这些实体中所包含的具体数据项，因此实体图可以比较迅速地绘出\n\n一个中等规模的企业通常有数百个实体，一个从事多种业务的企业所包含的实体比业务单一的企业要多得多\n\
    \n如果企业不转向另外完全不同类型的业务，那么企业中的实体集合就不会随着时间的推移而发生过大的变化\n\n![](img/66d4369fd16c75b43d6800360af39d15_795_0.png)\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_795_1.png)\n\n# 如何进行实体的识别\n\n- 确定实体的工作通常由用户分析员来完成，因为他们了解有关的业务\n\
    - 用户分析员必须受到培训，从而知道什么是实体\n- 不同的用户分析员常常提出一些相同的实体，却给它们取了不同的名字，例如，顾客和客户。由受过数据库训练的专业数据处理人员所担任的协调分析员，必须在规划小组的帮助下发现这些同义词\n\
    - 每一种实体都必须只有一个名称。这一要求有时可能遇到困难，因为不同的用户部门常常使用自己习惯的名称。这时，通常可以使用一个同义词字典，来把用户所使用的不同的名称与选定为实体模型中所使用的名称联系起来\n\
    - 当对所有的实体达成一致的理解，并且排除了重复的实体之后，关于实体的详细描述可以存放在一个字典之中\n\n# 实体间联系的表示方法（1）\n\n- 如果实体A的一个实例只与实体B的一个实例相联系，称实体A与实体B是一对一联系\n\
    - 如果实体A的一个实例与实体B的多个实例相联系，称实体A与实体B是一对多联系\n- 实体图上，在表示实体的方块之间画上连线，以表明实体之间的联系\n\n\
    ![](img/66d4369fd16c75b43d6800360af39d15_797_0.png)\n\n![](img/66d4369fd16c75b43d6800360af39d15_797_1.png)\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_797_2.png)\n\n![](img/66d4369fd16c75b43d6800360af39d15_797_3.png)\n\
    \n# 一个实体图的例子\n\n![](img/66d4369fd16c75b43d6800360af39d15_798_0.png)\n\n# 实体间联系的表示方法（2）\n\
    \n- 有些联系是相互依赖的，或者说如果A与B相联系，它必须同时也与C相联系，用连线之间的双短线来表示这种联系\n\n![](img/66d4369fd16c75b43d6800360af39d15_799_0.png)\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_799_1.png)\n\n# 实体间联系的表示方法（4）\n\n-\
    \ 在建立数据模型时，有时还使用另外两种表示方法\n  - 一是用端部分叉的连线表示一对多的联系\n  - 另一种在连线的一端加上一条小的短线来表示一对一的联系\n\
    - 有时也用一条没有任何标志的连线来表示我们还不了解的联系或者无关紧要的联系\n\n![](img/66d4369fd16c75b43d6800360af39d15_801_0.png)\n\
    \n# 第5部分 实体活动分析\n\n- 实体分析方法\n- 实体图的结构化\n- 实体的组合\n- 实体与活动之间的对应\n- 相关分析与分组算法\n-\
    \ 主题数据库的调整\n- 企业的改组\n\n## 实体图与数据模型的比较\n\n- **实体图与数据模型是不同的**\n  - 数据模型要精确得多，并且表示出第三范式的数据结构，并仔细确定主关键字，其中有一些可能是复杂的联合关键字\n\
    \  - 数据模型从对最终用户视图的全面综合，以及对综合结果所进行的稳定性分析中产生\n  - 实体图只是对企业实体的一个汇总，它常常省略比较复杂的联合关键字\n\
    \n- **建立全面的详细数据模型的工作，需要的时间比仅仅确定企业实体要长得多**\n  - 建立数据模型的过程所需的时间往往过长，不能使最高领导始终保持兴趣\n\
    \  - 但是最高领导的兴趣对于实体分析却是至关重要的，因为它反映了企业真正的信息需求\n\n- 数据库设计中一种快速但是常见的方法，就是先确定需要存储数据的实体，然后列出与这些实体相关的属性，有时候每一份属性清单还被加以第三范式处理。但是在实际复杂的企业或政府机构中，这种方法效果不好。\n\
    - 建立全面数据模型的工作，没有妥善的捷径可走\n- 曾经有人将用简便实体图方法设计的数据结构，与同一环境中用正规的综合方法所得到的结果加以比较，它们之间的差别相当大\n\
    - 好的数据库设计，既需要进行实体分析，也需要建立详细的数据模型，并将两种方法的结果相互参照\n\n# 一种杂乱的实体图——“蜘蛛图”\n\n“COW chart”\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_805_0.png)\n\n# 实体图的结构化方法\n\n- 首先，除去所有冗余的联系，至少暂时除去以便于重新绘制，它们可以在重新绘制出来的实体图上替换回来\n\
    - 然后可以找出实体图中的根实体。根实体是图上没有单箭头连线离开的实体。通常把根记录、根字段或者根实体画在数据类图的顶部。我们把根实体称之为第一层实体。\n\
    - 接着可以确定第二层实体，即具有一个指向第一层实体的单箭头连线\n- 具有一个指向第二层实体的单箭头连线的实体，可以被定义为第三层实体\n- 第n层实体（n\
    \ > 1）可以被定义为具有一个指向第n-1层实体，但没有指向更低层次实体的单箭头连线的实体\n\n"
