  - '[PAGE 806]


    # 实体图的结构化方法


    +   - 首先，除去所有冗余的联系，至少暂时除去以便于重复绘制，它们可以在重新绘制出来的实体图上替换回来

    +   - 然后可以找出实体图中的根实体。根实体是图上没有单箭头连线离开的实体。通常把根记录、根字段或者根实体画在数据寒图的顶部。我们把根实体称之为第一层实体。

    +   - 接着可以确定第二层实体，即具有一个指向第一层实体的单箭头连线

    +   - 具有一个指向第二层实体的单箭头连线的实体，可以被定义为第三层实体

    +   - 第n层实体（n > 1）可以被定义为具有一个指向第n-1层实体，但没有指向更低层次实体的单箭头连线的实体'
