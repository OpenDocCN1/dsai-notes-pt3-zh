    \n国内11家分支机构\n\n海外17家分支机构（含香港）\n\n跨区域、跨平台、跨国家、多业务的协同运作和高度集成化管理\n\n## 联想为何要信息化\n\
    \n联想集团公司\n\n- 人事\n- 财务\n- 股市\n- 资产\n- 系统\n\n联想电脑公司\n\n神州数码公司\n\n联想在2000年进行联想电脑和神州数码的业务分拆，联想作为一个香港上市公司，200多亿资产、10000多名员工、国内外大量的分支机构，还有财务、人力资源、信息管理等诸多职能机构，要在短短两个月内实现全部分拆，如果没有ERP等信息系统的支撑，是不可能的。\n\
