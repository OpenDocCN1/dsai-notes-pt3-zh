    ## 第7部分 总体数据规划方法


    - - 引言

    - - BSP方法的目标和步骤

    - - 总体数据规划流程

    - - 总体数据规划工作进度控制

    - - 信息工程的方法论


    ## 自顶向下总体数据规划过程（1）


    - 1. 得到最高层管理人员的赞成

    - 2. 选择要采用的方法论，坚持使用这套方法

    - 3. 定义业务职能区域;


    - - 绘制一张表示企业、部门和职能区域的图表

    - - 与最高层管理人员一起复查

    - - 确定研究范围

    - - 准备一张研究进度时间表和交付日期表

    - - 取得批准


    ## 自顶向下总体数据规划过程

    ### 4. 研制一些职能、活动和实体的实例


    - - 成立研究小组（建议由两名数据处理人员，其中包括一名数据库专业人员，和两名有广博的业务知识的用户人员组成。）这个小组必须有一位权威的领导人——一位多谋善断的领导，如有必要，可外请一位咨询专家

    - - 提出各职能区域的负责人

    - - 选择用户分析员

    - - 培训用户分析员


    ### 5. 把每一职能区域分解成一些业务过程，这些业务过程可分别由用户组来审查


    - - 为每一业务过程给出一个定义

    - - 同用户分析员一起复查这些业务过程

    - - 整理业务过程一览表，并由用户分析员对它进行再次核实

    - - 绘制一张矩阵表，表示出各高级管理人员对哪些业务过程负责


    ## 自顶向下总体数据规划过程


    6. 把所有业务过程分配给不同的用户分析员进行复查


    7. 把每个业务过程分解成它的一些功能和活动


    - - 确定每个业务过程需要哪些实体

    - - 为这些实体命名

    - - 一步一步地建立起实体图，该图描述出与当前业务过程、活动、组织机构和地理位置无关，但企业经营中所需要的数据

    - - 按实体联系强度的五种类型对图中每一联系进行标注

    - - 利用算法把实体图分成一些组和大组

    - - 为了建立一些适当的主题数据库，对这些大组作必要的调整

    - - 为每个大组命名


    ## 自顶向下总体数据规划过程


    8. 任选


    - - 建立活动与实体的对应

    - - 使用相关分析算法在实体所支持的活动的基础上进行实体聚集

    - - 发展实体大组，并利用从实体图中产生的大组进行交叉检查

    - - 在大组聚集中心实体作必要的调整


    9.


    - - 建立这些大组与业务过程的对应

    - - 调整对应关系

    - - 研究功能的聚集，形成逻辑职能区域，它们是各个子系统的基础

    - - 确定繁忙的日常事务处理系统

    - - 确定信息检索系统和决策支持系统的需求

