    \ algorithms）\n  - 粒子群算法（Particle Swarm Optimization）\n  - ...\n\n目前，这些算法在理论和实际应用方面得到了较大的发展。无论这些算法是怎样产生的，它们有一个共同的目标就是求NP-hard组合优化问题的全局最优解。\n\
    \n## 神经网络算法原理说明\n\n- 建立误差函数 $E(w,b)=\\frac{1}{2}\\sum_{k=1}^{s}(t_k - a_{2k})^2$\n\
    - 反复修订网络权值得到函数映射 $y = f(x)$\n- 神经网络模式说明\n\n![](img/66d4369fd16c75b43d6800360af39d15_546_0.png)\n\
    \n## 遗传算法原理说明\n\n- 自然选择和遗传中发生的复制、交叉和变异等现象。从任一初始群体出发，通过随机选择、交叉和变异操作，产生一群更适应环境的个体。这样一代一代的不断繁殖进化，最后收敛到一群最适应环境的个体。\n\
    - 遗传算法过程说明：编码方式，评价函数，初始种群，群体个数，遗传算子（选择，交叉，变异），迭代代数。\n\n![](img/66d4369fd16c75b43d6800360af39d15_547_0.png)\n\
    \n## 粒子群算法原理说明\n\n- > 粒子群算法(PSO) 是一种新的进化计算技术，由Kennedy 和 Eberhart 提出，源于对鸟群捕食群体行为的研究。\n\
    - > 假设在一个D维的搜索空间，有n个粒子组成一个群落，其中第i个粒子的位置表示一个D维向量，将 X_i = (x_i1, x_i2, ..., x_iD)\
    \ i = 1,2,...n 带入一个目标函数就可以计算出其评价值。\n\n全局最优值控制（不能保证更新后的粒子群向量最优值是最优的）\n\n最优的粒子\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_548_0.png)\n\n## 三种启发式算法的比较\n\n| 算法\
    \ | 功能和适用性 | 优点 | 缺点 |\n|---|---|---|---|\n| 神经网络 | 有明显的输入输出值的一般性的问题，利于建立专家库，尤其是<br>有大量历史对比数据的问题，如：安全库存设置\
    \ | 自学习，存储 | 收敛速度慢<br>拓扑结构参数难以确定，影响可靠性<br>对大数据集合容易出现训练过度<br>时间、空间复杂度过高 |\n| 粒子群算法\
    \ | 能够将问题建立编码的随机性问题，如：网络优化<br>实数编码 | 算法速度快，解质量高<br>无过多的参数需要调整 | 早熟收敛<br>粒子位置和速度不易表达<br>提出的时间相对较晚，尚不够完善和成熟\
    \ |\n| 遗传算法 | 能够将问题建立二进制编码的随机性问题，如：网络优化<br>二进制编码 | 目标函数不要求连续<br>目标函数不要求可微<br>全局优化算法\
    \ | 早熟收敛<br>编码困难<br>对不完全信息适应性差 |\n\n### I. 设立 3 个 RDC 时\n\n表 3-2：设立 3 个 RDC 时物流网络优化结果\n\
