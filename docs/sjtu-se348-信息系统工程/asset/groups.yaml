    # 企业目标和关键成功因素是完全不同的两个概念


    +   企业目标


    是指企业经营要达到的目标，在叙述上，可能包括这样的语句：“每年增长30%”，“市场份额增加到40%”，“良好的医疗护理”（在医院系统）等等


