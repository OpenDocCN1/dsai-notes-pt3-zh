  - '[PAGE 718]


    # 关键成功因素

    (Critical Success Factors,简称CSF)


    +   - 大多数企业都存在着少数几个（通常有3到6个）对该企业的成功至关重要的因素。企业要想获得成功，这些关键任务必须非常好地完成。

    +   - 向企业最高层管理人员提问这些因素是什么：“在你经营的企业中，有少数几方面的因素是极为重要的，如果你打算使经营获得成功，你就必须把这几方面工作做好。你能说出对你的企业取得成功的最关键的因素吗？”一般来说最高层管理人员会发现这是他感兴趣和关心的问题，经过思考之后，他会给出很好的回答。

    +   - 在进行总体数据规划时，对于企业模型的建立，如果注意到关键成功因素，就会突出重点。抓好与关键成功因素有关的业务过程与活动，从而使企业模型更好地反映企业的实质，也有利于确定开发的优先顺序。


    ![](img/66d4369fd16c75b43d6800360af39d15_718_0.png)'
  - '[PAGE 719]


    # 确定关键成功因素需要注意的问题


    +   - 确保企业具有竞争能力的关键因素

    +   - 不同类型的业务，有不同的关键成功因素

    +   - 在不同的时期内，可能有不同的关键成功因素

    +   - 外部环境变化，可能引起关键成功因素的改变

    +   - 不同的高级管理人员，可能对企业的关键成功因素有不同的看法......'
