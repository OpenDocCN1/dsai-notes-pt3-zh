    - 跨越组的这些箭头画在图的左边，离开各组实体\n- 重新绘制实体图的工作，可以从确定第一层实体（没有单箭头连接离开的实体）开始，然后确定第二层实体，再确定第三层实体，直到所有实体都有了层次数字，再将每一个根实体下面的根实体组绘制出来，最后加上跨越这些实体组的连线\n\
    \n## 实体图的结构化方法\n\n非根实体的选择双亲问题\n\n- □ A(2)与B(1)、G(1)、L(1)\n- □ H(2)与J(2)、K(2)\n\
