    # 四类数据环境


    James Martin在《信息工程》和《总体数据规划方法论》中将计算机的数据环境分为四种类型


    +   - 第一类数据环境：数据文件（Data Files）

    +   - 第二类数据环境：应用数据库（Application Data Bases）

    +   - 第三类数据环境：主题数据库（Subject Data Bases）

    +   - 第四类数据环境：信息检索系统（Information Retrieval System）'
  - '[PAGE 725]


    # 第一类数据环境


    # 数据文件（Data Files）


    +   □ 早期的 数据处理还没有出现数据库管理系统（DBMS实际上是一种操纵数据库的软件）


    +   □ 系统分析员和程序员根据应用的需要，用程序语言分散地设计实现各种数据文件。这是一种数据组织技术简单、相对容易实现的数据环境。


    +   □ 但随着应用程序增加，数据文件数目剧增，会导致很高的维护费用并且一小点应用上的变化都将引起链锁反应，使修改又慢又贵，并很难进行。'
  - '[PAGE 726]


    # 第二类数据环境


    # 应用数据库（Application Data Bases）


    +   后来，虽然出现了数据库管理系统，但系统分析员和程序员根据报表的原样“建库”。


    +   由于没有在数据分析和组织上下功夫，为分散应用设计分散的“数据库”实际并不具备数据库的品质，不能支持数据的共享，因此叫做“应用数据库”。


    +   实际上，这种数据库环境像数据文件环境一样，随着应用的扩充，应用数据库也在剧增。在这种数据环境中的信息系统，其维护费用仍然很高，有时甚至高于第一类数据环境。该类数据环境还没有发挥使用数据库的主要优越性。'
  - '[PAGE 727]


    # 第三类数据环境


    # 主题数据库（Subject Data Bases）


    +   - 这是⼀种真正意义上的数据库，**经过科学的规划与设计，其结构与使用它的处理过程是独立的**。各种面向业务主题的数据，如顾客数据、产品数据或人事数据，通过一些共享数据库被联系和体现出来。


    +   - 这种主题数据库的特点是：**经过严格的数据分析，建立模型需要花费时间，但其后的维护费用很低**。最终（但不是立即）会使应用开发加快，并能使用户直接与这些数据库交互使用数据。


    +   - **建立这种数据环境，需要改变传统的系统分析方法和整个数据处理的管理方法**，如果管理不善，也会蜕变成第二类（或者有可能是第一类）数据环境。'
  - '[PAGE 728]


    # 第四类数据环境


    # 信息检索系统（Information Retrieval System）


    +   - 这种数据环境的目的 是保证信息检索和快速查询的需要，以支持高层管理和辅助决策，而不是大量的事务管理。


    +   - 90年代称这种数据环境为数据仓库（Data Warehouse），它是面向主题的、单一的、完整的和一致的数据存储。数据从多种数据源获取，经过加工成为最终用户在一定程度上可理解的形式。


    +   - 可以说数据仓库是主题数据库的集成，是深加工的信息。'
  - '[PAGE 729]


    # 企业应该具有第三类和第四类的数据环境


    +   以数据文件或应用数据库为主体的数据环境，是低档次的数据环境。


    +   一个现代化管理水平较高的企业，应该具有第三类和第四类的数据环境，这是高档次的数据环境，能保证高效率、高质量利用数据资源。'
  - '[PAGE 730]


    # 数据库的一种“本质”


    +   □ 数据库是为使数据独立于使用数据的程序的数据存储


    +   ■ 有了数据库，数据描述便不再包含在应用程序中。改变数据就不一定也要改变程序，改变程序也不一定要数据跟着变


    +   ■ 数据易于重新组织或添加内容。当数据结构、数据格式或物理存储媒体发生变化时，老的应用程序不必重新编写


    +   □ 在管理良好的数据库环境中，尽管使用和看待数据的方式在迅速地变化，数据结构本身却相对比较稳定'
  - '[PAGE 731]


    <!-- no content -->'
  - '[PAGE 732]


    # 数据开发方法对数据环境的影响


    +   □ 数据开发方法

    +     ■ 面向过程的系统分析方法

    +     ■ 面向数据的系统分析方法

    +   □ 面向过程的系统分析方法

    +     ■ 主要注意事务流和要完成的职能

    +     ■ 数据被当作系统整体的一个部分来处理，常常只是分析过程所设计的一个副产品

    +     ■ 某些关于结构化分析的教科书中也声称：“定义了数据流，也就基本上定义了文件，所需要做的只是添加一些与具体组织有关的信息。例如：按照日期进行排序”'
  - '[PAGE 733]


    # 数据开发方法对数据环境的影响


    +   面向数据的系统分析方法

    +   - 将数据作为一种独立的资源来对待

    +   - 数据是支持所有应用项目的基石。处理过程也是重要的，但是它们必须存取数据库中的数据

    +   - 系统分析中必须有一部分工作，决定数据库中应当包含哪些数据，这项工作有时被称为数据分析

    +   - 可以将数据处理的全过程看作是对数据的一系列的变换。如果给系统或组织在任意时刻拍一张快照，那么这一张快照将只显示一种数据结构。从技术上说，一个处理过程是对数据的一系列变换中的一个，这些变换包括对存储空间中的数据和输入输出数据的变换。'
  md: "\n## 企业模型图例\n\n企业模型是一张完整图表，能表示出一个企业的职能和活动。这张图表可能很大，因为一个企业有几百个业务活动，有的甚至有一千多个业务活动。\n\
    \n为方便使用，可将这张图表分开画在几张分图上，例如每张分图是一个职能区域的过程和活动，也可以每张分图是一个业务过程的分解。\n\n![](img/66d4369fd16c75b43d6800360af39d15_716_0.png)\n\
    \n## 关键成功因素\n(Critical Success Factors,简称CSF)\n\n- 大多数企业都存在着少数几个（通常有3到6个）对该企业的成功至关重要的因素。企业要想获得成功，这些关键任务必须非常好地完成。\n\
    - 向企业最高层管理人员提问这些因素是什么：“在你经营的企业中，有少数几方面的因素是极为重要的，如果你打算使经营获得成功，你就必须把这几方面工作做好。你能说出对你的企业取得成功的最关键的因素吗？”一般来说最高层管理人员会发现这是他感兴趣和关心的问题，经过思考之后，他会给出很好的回答。\n\
    - 在进行总体数据规划时，对于企业模型的建立，如果注意到关键成功因素，就会突出重点。抓好与关键成功因素有关的业务过程与活动，从而使企业模型更好地反映企业的实质，也有利于确定开发的优先顺序。\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_718_0.png)\n\n## 确定关键成功因素需要注意的问题\n\n\
    - 确保企业具有竞争能力的关键因素\n- 不同类型的业务，有不同的关键成功因素\n- 在不同的时期内，可能有不同的关键成功因素\n- 外部环境变化，可能引起关键成功因素的改变\n\
    - 不同的高级管理人员，可能对企业的关键成功因素有不同的看法......\n\n## 关键成功因素的确定\n\n关键成功因素应该成为最高层管理人员管理控制企业系统的基础。\n\
    \n对一个行业来说，某些关键成功因素差不多是共同的\n\n- 汽车工业\n  - 燃料的节约\n  - 式样\n  - 高效的销售组织\n  - 生产成本的严格控制\n\
    - 软件公司\n  - 产品革新\n  - 销售和用户资料的质量\n  - 国际市场和服务\n  - 产品的多用性\n- 微电子公司\n  - 吸引和保存最好设计人员的能力\n\
    \  - 政府对研发的支持\n  - 地区销售力量的支持\n  - 新的市场需求的确定\n- 包装食品公司\n  - 广告效果\n  - 货物分发\n  -\
    \ 产品革新\n- 培训公司\n  - 雇用最好的讲课人\n  - 题目的确定\n  - 通信表的大小和质量\n- 人寿保险公司\n  - 管理人事机构的开发\n\
    \  - 广告效果\n  - 文书工作的效率\n\n## 企业目标和关键成功因素是完全不同的两个概念\n\n- 企业目标\n\n是指企业经营要达到的目标，在叙述上，可能包括这样的语句：“每年增长30%”，“市场份额增加到40%”，“良好的医疗护理”（在医院系统）等等\n\
    \n- 关键成功因素\n\n是与当前经营业务和所需要的高性能关键领域有关。这些关键成功因素为最高层管理人员管理控制企业系统，提供所必要的衡量标准。要想使企业获得成功，就必须对关键成功因素进行认真的和不断的检查与关注。\n\
    \n## 第三讲 内容大纲\n\n- 信息工程的原理、方法和工具\n- 总体数据规划的组织\n- 企业模型\n- 主题数据库\n- 实体活动分析\n- 数据分布规划\n\
    - 总体数据规划方法\n\n总体数据规划的四大部分\n\n## 第4部分 主题数据库\n\n- 四类数据环境\n- 数据库工程与信息工程\n- 主题数据库\n\
    \  - 主题数据库剖析\n  - 主题数据库规划\n  - 信息体系结构设计\n  - 实施的优先顺序\n\n## 四类数据环境\n\nJames Martin在《信息工程》和《总体数据规划方法论》中将计算机的数据环境分为四种类型\n\
    \n- 第一类数据环境：数据文件（Data Files）\n- 第二类数据环境：应用数据库（Application Data Bases）\n- 第三类数据环境：主题数据库（Subject\
    \ Data Bases）\n- 第四类数据环境：信息检索系统（Information Retrieval System）\n\n## 第一类数据环境\n\n\
    ## 数据文件（Data Files）\n\n- □ 早期的 数据处理还没有出现数据库管理系统（DBMS实际上是一种操纵数据库的软件）\n- □ 系统分析员和程序员根据应用的需要，用程序语言分散地设计实现各种数据文件。这是一种数据组织技术简单、相对容易实现的数据环境。\n\
    - □ 但随着应用程序增加，数据文件数目剧增，会导致很高的维护费用并且一小点应用上的变化都将引起链锁反应，使修改又慢又贵，并很难进行。\n\n## 第二类数据环境\n\
    \n## 应用数据库（Application Data Bases）\n\n- 后来，虽然出现了数据库管理系统，但系统分析员和程序员根据报表的原样“建库”。\n\
    - 由于没有在数据分析和组织上下功夫，为分散应用设计分散的“数据库”实际并不具备数据库的品质，不能支持数据的共享，因此叫做“应用数据库”。\n- 实际上，这种数据库环境像数据文件环境一样，随着应用的扩充，应用数据库也在剧增。在这种数据环境中的信息系统，其维护费用仍然很高，有时甚至高于第一类数据环境。该类数据环境还没有发挥使用数据库的主要优越性。\n\
    \n## 第三类数据环境\n\n## 主题数据库（Subject Data Bases）\n\n- 这是一种真正意义上的数据库，经过科学的规划与设计，其结构与使用它的处理过程是独立的。各种面向业务主题的数据，如顾客数据、产品数据或人事数据，通过一些共享数据库被联系和体现出来。\n\
    - 这种主题数据库的特点是：经过严格的数据分析，建立模型需要花费时间，但其后的维护费用很低。最终（但不是立即）会使应用开发加快，并能使用户直接与这些数据库交互使用数据。\n\
    - 建立这种数据环境，需要改变传统的系统分析方法和整个数据处理的管理方法，如果管理不善，也会蜕变成第二类（或者有可能是第一类）数据环境。\n\n## 第四类数据环境\n\
    \n## 信息检索系统（Information Retrieval System）\n\n- 这种数据环境的目的 是保证信息检索和快速查询的需要，以支持高层管理和辅助决策，而不是大量的事务管理。\n\
    - 90年代称这种数据环境为数据仓库（Data Warehouse），它是面向主题的、单一的、完整的和一致的数据存储。数据从多种数据源获取，经过加工成为最终用户在一定程度上可理解的形式。\n\
    - 可以说数据仓库是主题数据库的集成，是深加工的信息。\n\n## 企业应该具有第三类和第四类的数据环境\n\n- 以数据文件或应用数据库为主体的数据环境，是低档次的数据环境。\n\
    - 一个现代化管理水平较高的企业，应该具有第三类和第四类的数据环境，这是高档次的数据环境，能保证高效率、高质量利用数据资源。\n\n## 数据库的一种“本质”\n\
    \n- □ 数据库是为使数据独立于使用数据的程序的数据存储\n- ■ 有了数据库，数据描述便不再包含在应用程序中。改变数据就不一定也要改变程序，改变程序也不一定要数据跟着变\n\
    - ■ 数据易于重新组织或添加内容。当数据结构、数据格式或物理存储媒体发生变化时，老的应用程序不必重新编写\n- □ 在管理良好的数据库环境中，尽管使用和看待数据的方式在迅速地变化，数据结构本身却相对比较稳定\n\
    \n## 数据开发方法对数据环境的影响\n\n- □ 数据开发方法\n  - ■ 面向过程的系统分析方法\n  - ■ 面向数据的系统分析方法\n- □ 面向过程的系统分析方法\n\
    \  - ■ 主要注意事务流和要完成的职能\n  - ■ 数据被当作系统整体的一个部分来处理，常常只是分析过程所设计的一个副产品\n  - ■ 某些关于结构化分析的教科书中也声称：“定义了数据流，也就基本上定义了文件，所需要做的只是添加一些与具体组织有关的信息。例如：按照日期进行排序”\n\
    \n## 数据开发方法对数据环境的影响\n\n- 面向数据的系统分析方法\n  - 将数据作为一种独立的资源来对待\n  - 数据是支持所有应用项目的基石。处理过程也是重要的，但是它们必须存取数据库中的数据\n\
    \  - 系统分析中必须有一部分工作，决定数据库中应当包含哪些数据，这项工作有时被称为数据分析\n  - 可以将数据处理的全过程看作是对数据的一系列的变换。如果给系统或组织在任意时刻拍一张快照，那么这一张快照将只显示一种数据结构。从技术上说，一个处理过程是对数据的一系列变换中的一个，这些变换包括对存储空间中的数据和输入输出数据的变换。\n"
