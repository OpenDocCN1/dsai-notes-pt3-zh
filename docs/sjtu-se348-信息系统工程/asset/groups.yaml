    - □ 内容三：车货配载案例剖析


    ## 运输决策（配送路线优化）模型


    ### 定位—配给问题（Location Allocation Problems，简称LAP）


    最传统的模型，配送中心与每个需求点之间是往复运输，没有路线的优化。


    ### 定位—车辆运输路线安排问题（Location-routing Problems，简称LRP）


    综合考虑选址和运输路线优化，同时解决设施最优数量、规模和最优路线。但前提是每个需求点在每次的需求量均确定且是常量。而市场是动态变化的，每个需求点的需求是时变的。


    未选中地址


    选中地点


    ## 运输决策（配送路线优化）模型


    ### 车辆行程安排问题（Vehicle Routing Problems，简称VRP）


    每个需求点的需求量可以是时变的。


    ![](img/66d4369fd16c75b43d6800360af39d15_563_0.png)


    双级配送


    ![](img/66d4369fd16c75b43d6800360af39d15_563_1.png)


    单级配送


    ## 制造过程中的路线优化问题


    - Drilling holes, fixing rivets on a metal sheet

    - Placement of electronic components

    - Welding, optimization of robot movements

    - Metal Cutting using laser or water


    ## 节约法的基本思想


    ![](img/66d4369fd16c75b43d6800360af39d15_566_0.png)


    ![](img/66d4369fd16c75b43d6800360af39d15_566_1.png)


    ![](img/66d4369fd16c75b43d6800360af39d15_566_2.png)


    | 方案 | 配送路线 | 配送距离 |

    | --- | --- | --- |

    | a) | P0 → Pi → P0 → Pj → P0 | 2d0i + 2d0j |

    | b) | P0 → Pi → Pj → P0 | d0i + dij + d0j |


    里程节约量 S_ij = d0i + d0j - dij


    基本思想：如果一个配送中心P₀分别向N个客户Pⱼ（j=1，2......n）配送货物，在汽车载重能力允许的前提下，每辆汽车的配送线路上经过的客户个数越多，里程节约量越大，配送线路越合理。


