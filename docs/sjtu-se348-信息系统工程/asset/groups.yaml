    \  |  |  |  |  | U U |\n\n# 子系统之间的数据流\n（全部）\n\n![](img/66d4369fd16c75b43d6800360af39d15_773_0.png)\n\
    \n# 子系统及其名称\n\n- 删除所有的字母C和字母U，并给信息子系统加上了临时名称\n- 同时将一些箭头合并起来，以便更清晰地说明子系统之间的数据流动\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_774_0.png)\n\n# 两大类、四小类系统的区别\n\n- □\
    \ 日常和非日常系统的区别\n\n- ■ 日常处理系统执行一些预定的操作: 定货, 帐单, 保险申报等日常处理以及简单的查询。这类处理的活动量往往都很大\n\
    \n- ■ 非日常系统有各种类型\n\n- ✓ 对数据库设计人员尤其重要的是综合信息系统，用户在综合信息系统中搜索信息，提出难以预见的查询，或者进行可以预见，但需要使用辅助关键字的查询操作\n\
    \n- ✓ 其它非日常系统包括优化计算系统和决策支持系统\n\n- □ 上述子系统划分方法过程中没有考虑两大类四小类系统之间的区别，可以对它进行修改，以便考虑这一因素\n\
    \n# （1）日常处理系统\n\n- 预定的任务、决策规则和事务流\n- 处理量往往很大\n- 大批量的传统数据处理\n- 主要效益：事务处理效益提高，周转速度加快，提高简单查询的处理速度，减少库存，节省人员\n\
    - 设计时主要考虑因素：大批量作业的效率\n- 通常从第三类数据库方法中获益\n\n# （2）综合信息系统\n\n- 回答非结构化的和难以预计的查询，或者启动辅助关键字\n\
    - 操作的查询\n- 生成报表\n- 主要效益：为决策者提供更好的信息\n- 设计时主要考虑因素：功能强大的最终用户语言，友好的用户界面和管理操作的有效性\n\
    - 从第四类数据库方法中获益\n\n# （4）优化计算系统\n\n- 为某些类型问题提供解答，这类问题通常是良好结构化的\n- 主要效益：为处理复杂问题提供新的方法\n\
    - 可以使用从数据库中导出的文件\n\n# 繁忙处理过程的区分\n\n- 下图列出繁忙的处理过程，它们进行大量例行的日常事务处理。通常，需要把这些系统的数据库与综合信息系统或决策支持系统的数据库分开。\n\
    \n- 繁忙系统的数据组织和存取方法，要经过仔细地协调，以适应它们对大量日常数据的使用。综合信息系统和决策支持系统中的数据组织往往具有更大的灵活性，存取工作量较小，存取方法更适于检索数据，或者为功能强大的最终用户语言服务。\n\
    \n# 繁忙处理过程的区分\n\n![](img/66d4369fd16c75b43d6800360af39d15_781_0.png)\n\n# 过程对数据系统类型要求\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_782_0.png)\n\n# 日常／非日常事务处理子系统的标注\n\n\
