    编辑部：... 印刷部：... 印装者：... 开本：787×1092 1/16 印张：25 字数：357 千字\n2002 年 4 月第 1 版 2009\
    \ 年 8 月第 1 次印刷\n书号：ISBN 7-302-03507-3/TP·3118\n定价：22.00 元\n\n## 第五讲 内容大纲\n\n-\
    \ 信息资源规划概述\n- 需求分析\n- 系统建模\n- 企业信息化工程整体解决方案\n\n## 两大方法论\n“信息工程”与“信息资源管理”\n\n-\
    \ □ “信息工程”方法论的核心是总体数据规划\n- ■ 詹姆斯.马丁在《信息工程》和《总体数据规划》中提出的实体分析和主题数据库的规划\n- □ “信息资源管理”方法论的是数据管理标准\n\
    - □ 威廉·德雷尔在《数据管理》中详细讨论数据管理标准\n- □ 两大方法论在同一时期（上世纪80年代）对同一个问题（建立集成化的企业信息系统）的研究成果是相通的\n\
    \n## 综合上述两大方法论\n形成“信息资源规划”方法论\n\n进行总体数据规划和建立数据管理标准都是重要的。如何具体组织实施这两项工作呢？从企业信息系统集成的研究中，找到了两者的结合点\n\
    \n- 总体数据规划中的实体分析和主题数据库的建立，必须以数据管理标准的建立与实施为基础，否则，总体数据规划的成果无法在集成化的系统开发中落实\n- 数据管理标准的建立固然可以从某个具体的应用开发项目中启动，但要较快地改造企业低档次的数据环境，重建高档次的数据环境，必须有全局的观点和整体性的行动，这就是进行企业的总体数据规划\n\
    - 将这两方面综合起来，即在进行总体数据规划的过程中进行数据管理标准化工作（不是先搞总体数据规划后搞数据管理标准，也不是先搞数据管理标准后搞总体数据规划），通过数据标准化工作使总体数据规划更为扎实，使总体数据规划成果更能在集成化的信息系统建设中发挥指导作用\n\
    - 这就形成“信息资源规划”方法论\n\n## 综合上述两大方法论\n形成“信息资源规划”方法论\n\n从理论和技术方法角度来看，信息资源规划的要点有：\n\
    \n- （1）在总体数据规划过程中建立信息资源管理基础标准，从而落实企业数据环境的改造或重建工作\n- （2）工程化的信息资源规划实施方案，在需求分析和系统建模两个阶段的规划过程中执行有关标准规范\n\
    - （3）简化需求分析和系统建模方法，确保其科学性和成果的实用性\n- （4）组织业务骨干和系统分析员紧密合作，按周制定规划工作进度计划，确保按期完成规划任务\n\
    \n## 信息资源规划(IRP)的工程化方法\n\n用户需求初步意见\n\n需求分析\n\n业务需求分析\n职能域定义\n业务过程\n业务活动\n\n1-DFD\n\
    2-DFD\n\n数据需求分析\n用户视图分析\n数据元素分析\n数据流分析\n\n系统建模\n\n系统功能建模\n系统目标\n子系统定义\n功能模块定义\n\
    程序模块定义\n\nE-R图\n\n系统数据建模\n业务主题定义\n用户视图分组\n基本表定义\n数据元素规范化\n\n系统体系结构建模(C-U矩阵)\n\n\
    ## 明确信息资源规划(IRP)的定位及作用：\n\n企业规划 → 信息规划 → 信息资源规划\n\n企业发展战略\n界定 IT战略\n\n企业 IT运用战略\n\
    界定 IRP\n\nIRP\n信息资源规划\n系统功能建模\n系统数据建模\n建立IRM基础标准\n\n- 帮助理清并规范表达用户需求，落实“应用主导”；\n\
    - 整合信息资源，消除“信息孤岛”，实现应用系统集成；\n- 指导SCM、ERP、CRM等应用软件的选型并保证成功实施。\n"
  mdcn: "\n\n## 企业数据管理工作成败的要点\n\n| 活动 | 要做 | 不要做 |\n|---|---|---|\n| 规划 | 规划短期和长期数据管理目标，如何开展数据字典的使用，支持企业目标的数据管理环境；使高层管理人员与制定和复查这些规划\
    \ | 不要仓促地或盲目地开始数据管理工作或使用数据字典；未经充分地规划不要开始任何数据管理项目 |\n| 文档 | 制定数据管理图表和数据管理部门每项业务的职责；所有数据管理活动开始之前，要写出成本效益的估计；编写数据管理标准和规则；吸收主管部门和用户参加这些文档的制定和复查工作\
    \ | 不要以为别人了解数据管理的目标或方法；不要以为主管部门了解数据管理的任务和局限性 |\n| 自动化 | 使数据字典完全自动化，使兼容性及符合命名常规的检查工作自动化，使来自数据字典的软件生成自动化\
    \ | 不要使数据字典承担任何过多任务；不要人工检查是否遵守数据管理标准；不要人工做数据定义编码 |\n| 简要 | 宣扬、提供数据管理和数据字典的好处；向数据处理人员和最终用户进行数据管理原则的教育培训；单独或与同行进行适当的教育手段以建立起能够同数据管理人员接触的联系方式\
    \ | 不要命令用户强制执行数据管理标准，不要发布有关数据管理规则和规程的命令或布告；不要期望立即完全符合新的标准 |\n| 适应 | 使标准和数据字典发展与当前环境紧密衔接；使数据管理标准与具有的适用开发规则和方法相结合\
    \ | 不要期望业务需求或公司的政策去适合标准的数据管理规则；记住，搞不通数据管理，公司都必须继续维系业务；在你能够支持应用商家之前，不要一定要坚持严格的控制和完全符合标准\
    \ |\n| 保证 | 得到高层管理部门的赞成和支持；我们自己和其他一些人要努力手成功地实现 | 不能用一小部分时间或无计划的方法来完成；不可低估成功地进行企业数据管理工作所需要的资源或时间的费用\
    \ |\n\n资料译自：William Durrell. DATA ADMINISTRATION; A Practical Guide to Successful\
    \ Management. 1985; 174 - 175\n\n## 数据管理工作的波浪式发展\n\n![](img/66d4369fd16c75b43d6800360af39d15_1061_0.png)\n\
    \n## 数据管理工作的波浪式发展\n\n- 该企业在时间段A 开始实施数据管理工作。这一期间数据管理小组做出了一些起步性的工作，取得一些成绩：数据管理标准编制出来并形成文档，而且数据字典也建立了起来。\n\
    \n- 但是，因为数据管理是一种新的课题，对新的数据管理标准和规程存在一些阻力是自然的。有些分析员和程序员，对于强加给他们的数据设计上的限制感到不满，出现抵制数据管理标准的情况。这会给数据管理人员带来较大的打击，有的摆挑子，有的人员要求到别的部门去。因此，必须聘用新的数据管理人员补充，重新进行培训，这样，工作效率就下降了。时间段B指出了这种下降势头。\n\
    \n- 终于，新工作人员培训出来，工作效率开始上升。在时间段C，数据处理人员变得习惯于遵守数据管理标准了。一些标准慢慢地被接受，但仍存在深藏的抵触。更多的人理解了信息资源管理的好处，更多的人成为数据字典的用户，数据字典中实体的数目不断增加。\n\
    \n## 数据管理工作的波浪式发展\n\n- 突然，该公司在销售上遭受了某些损失而被迫削减费用。在权力变动中，有些高层管理人员被免职而进行了全面的改组。新的管理部门在致力于制定降低费用的紧急措施。有些经理对在公司内搞数据管理的作用和方向是怀疑的。有些数据处理人员和数据管理人员被迫解雇。数据管理部门内士气下降，工作效率降低。时间段D\
    \ 说明了这种情况。\n\n- 在时间段E，企业经营情况好转并有了新的发展。主管部门开始认识到从数据管理可以得到长期效益，他们决定重新雇用数据管理人员，达到以前的水平。工作效率提高了，再次出现发展的势头。\n\
    \n- 这幅曲线说明了任何新的和有争议的课题都可能经历可以预见到的失望、挫折和改进过程。数据管理正是这种新课题之一。然而，这幅图也表明了数据管理的成绩，虽然缓慢，但毕竟是稳步增长的。尽管数据管理多次失去成功机会，它仍然会在这场信息资源管理的斗争中赢得胜利。\n\
