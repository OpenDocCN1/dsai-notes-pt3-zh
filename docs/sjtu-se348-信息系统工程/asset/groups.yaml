    \n供应的时间和距离\n供应商 → 仓库\n交货期=订单确认+生产+运输+等录+检验...\n\n> 库存点的存货应该能够支持补足周期内的需求\n> 周期库存=LT×D\n\
    > 平均库存=LT×D/2\n\n## 需求量的影响\n问题：需求量大，库存水平就一定高吗？\n\n![](img/66d4369fd16c75b43d6800360af39d15_461_0.png)\n\
    \n不同的需求特性，决定了采用不同的策略和政策：\n\n- 供应模式\n- 库存模式\n\n## 供应的批量\n\n- 生产的批量约束\n  —制造费用\n\
    \  —生产换型(密西根ERC)\n  —启动时间内的物料浪费\n  —效率\n\n- 采购的批量约束\n  —批量折扣\n\n- 运输的批量约束\n  —最小订单量\n\
