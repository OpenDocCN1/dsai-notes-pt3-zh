    ## 物流概念剖析——物流与储运


    |  | 物流 | 储运 |

    |---|---|---|

    | 活动内容 | 运输、保管、配送、包装、装卸、流通加工及相关信息 | 运输、保管、包装、装卸、流通加工等 |

    | 活动的基本点 | 内容全面 | 储存和运输 |

    | 侧重点 | 系统化的整体优化 | 达到存货、运货的目的 |

    | 概念 | 物流是一个系统化、集成、学科交叉的概念，它依托相关的学科发展而发展的 | 储运是一个十分古老的、传统的概念 |


    ## 物流基本概念


    - 物流科学产生和发展

    - 物流分类

    - 物流系统组成


    ### 按照物流系统的作用分类


    ![](img/66d4369fd16c75b43d6800360af39d15_386_0.png)


    - 供应物流：包括原材料等一切生产资料的采购、进货、运输、仓储、库存管理和用料管理等。

    - 生产物流：包括生产计划与控制，厂内运输（搬运）、在制品仓储与管理等。

    - 销售物流：包括产成品的库存管理，仓储发货运输、订货处理与顾客服务等。

    - 回收和废弃物流：包括废旧物资、边角余料等的回收利用，各种废弃物的处理（废料、废气、废水等）。


