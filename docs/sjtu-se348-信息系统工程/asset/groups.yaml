    - ✓ 该数据的意义是什么？（说明）\n- ✓ 该数据与其他数据的关系是什么？（注意）\n- ✓ 该数据的有效值有哪些？（有效值）\n- ✓ 该数据存储的格式和长度是什么？（格式）\n\
    \n## 数据字典中\n不同阶段，同一个数据元素定义详细程度不同\n\n- 在总体规划阶段\n  只需要界定数据元素的标识和名称（如“数据元素标准”），称做概念数据字典\n\
    \n- 在系统设计阶段\n  要界定数据元素的数据类型、长度等，称逻辑数据字典\n\n- 在系统建造实现阶段\n  要说明数据元素在具体应用系统内是什么样的，以及如何被使用的（如表2-2中所列），称做物理数据字典\n\
    \n- 基于数据元素的记录、库表等数据实体的元数据，以及与数据实体关联的程序模块等元数据，也将分别存储在概念数据字典、逻辑数据字典和物理数据字典之中\n\n\
    ## 第四讲 内容大纲\n\n- 信息资源管理概述\n- 信息资源管理基础标准\n- 建立和使用数据字典\n  - 数据字典的基本内容\n  - 通过数据字典进行数据管理\n\
    \  - 数据字典的使用：新系统与旧系统\n  - 数据字典的设置\n- 数据管理工作的开展\n\n## 数据管理与数据字典、数据库的关系\n\n- 当问到什么是数据管理时，程序员或分析员会有两种典型的、模糊的回答：\n\
    - 数据管理与数据字典有些关系\n- 数据管理与数据库有些关系\n\n- 这样的回答并不是完全正确的，他们只是说到了数据管理所使用的工具或设施，他们并没有恰当地解释出数据管理的目的\n\
    \n- 数据库和数据字典，是数据管理人员可以使用的资源和工具，但这仅仅是整个目标的一个方面\n\n- 数据管理的整个目标是规划、管理控制全企业的信息资源。数据字典和数据库帮助达到这一目的，但是两者本身并不是最终目的\n\
    \n- 数据管理的任务并不是维护个别的数据库和数据字典。数据管理的任务是通过使用数据字典和设计良好的数据结构，来集中管理全企业范围的信息资源\n\n## 问题一\n\
    已经有了数据字典，为什么还需要数据管理？\n\n为了从数据字典获得最大的投资回报，数据管理人员必须向主管部门提供下述问题的答案：\n\n- （1）建立数据字典要达到的目的是什么？建立数据字典的成本和效益是什么？\n\
    - （2）什么信息应该装到数据字典中去？\n- （3）谁负责数据字典的信息输入工作？\n- （4）这些信息输入字典前谁必须负责检查和批准？\n- （5）输入前确保这些信息质量的步骤是什么？\n\
    - （6）一旦信息输入字典，将如何对它进行维护？\n- （7）谁负责字典中数据一致性的维护？\n- （8）该字典将如何用于新系统的开发或辅助现行系统的维护？\n\
    - （9）该字典将支持哪几种软件语言？\n\n## 问题二\n已经有数据库管理员，为什么还需数据管理员？\n\n- 数据库管理员（Data-Base Administrator，简称\
    \ DBA）负责物理数据库（Physical Database）的设计、实现、安全性和维护工作\n- 数据管理员（Data Administrator，简称\
    \ DA）的职责，在于确定每个数据库的内容和范围\n- 数据管理首先建立数据库的逻辑模型（Logical model），随后由 DBA 来实现\n- 这类似于系统分析员和系统设计员之间的区别。尽管在数据管理之前，DBA\
    \ 就可以设计单个的逻辑的和物理的数据库，而数据管理则应该致力于规划和协调整个组织的所有数据库的建设\n\n## 数据管理应该提供对下述问题的回答\n\n\
    - （1）今后几年计划开发多少新的数据库？\n- （2）这些数据结构的实现能否保证业务系统规划的长期目标，或该企业的其他业务需求？\n- （3）怎样建造这些数据库才能使数据库中信息冗余最少？\n\
    - （4）这些数据库之间需要哪些通讯？\n- （5）这些数据库按什么顺序来实现？\n- 数据管理员应该制定出整个组织对数据使用的业务系统规划\n- 假如物理数据库系统已经建立起来而没有考虑整体规划，这些数据库将会引起相同数据的不相容性、不一致性，以及它们正在替换的数据结构的冗余性\n\
    \n## 数据管理员和数据库管理员的职责区别\n\n| | 数据管理 (DA) | 数据库管理 (DBA) |\n|---|---|---|\n| 主要职责\
    \ | 管理上 | 技术上 |\n| 范围 | 所有数据库 | 特定数据库 |\n| 数据设计 | 逻辑的 | 物理的 |\n| 主要联系人 | 管理人员\
    \ | 程序员，系统分析员 |\n| 关注问题 | 长期数据规划 | 更关心短期数据库的开发和使用 |\n| 主要倾向 | 元数据<br>数据字典<br>数据分析<br>DBMS\
    \ 无关性 | 数据<br>数据库<br>数据设计<br>特定的 DBMS |\n"
