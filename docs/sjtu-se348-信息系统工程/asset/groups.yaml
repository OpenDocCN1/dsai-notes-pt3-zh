    - 制造业信息化的目标：实现数字化、集成化、协同化、网络化、敏捷化、服务化、绿色化、智能化制造，提高企业（或集团）的敏捷性、柔性及健壮性，以达到增强企业（或集团）的市场竞争能力。\n\
    \n## 制造业信息化是一个过程\n\n实现产业升级\n\n制造技术 自动化技术 现代管理技术 信息技术\n\n改善企业生产、经营、管理、产品开发\n\n\
    ## 制造业分类\n\n- 根据在生产中使用的物质形态，制造业可划分为\n  - 离散制造业\n  - 流程制造业\n\n- 按生产类型不同，制造业可划分为\n\
    \  - 按订单设计（Engineering To Order, 简称ETO）或按项目设计（Engineering To Project）\n  - 按订单装配（Assemble\
    \ To Order, 简称ATO）或按订单制造（Make To Order）\n  - 按库存生产（Make To Stock, 简称MTS）\n  -\
    \ 重复生产（Repetitive）\n  - 批量生产（Batch）\n  - 连续生产（Continuous）\n\n## 离散制造业\n\n- 其主要特征是产品生产以件/次的模式进行的，产品以单件或流水线上成批进行生产。在使用生产线方式的情况下，组成产品的部件在生产线的不同加工设备上依次加工装配完成；在产品加工地点相对静止的情况下，产品的不同处理工序在同一地点完成。\n\
    - 机械加工、汽车飞机制造、家电生产过程等\n\n## 连续流程制造业\n\n- 原料的物料流及能量流持续进入由一系列生产装置顺序贯组成的固定生产流程后，连续经过反应、换热、分离、流体输送等各类环节，直至生成最后产品。\n\
    - 如炼油、化肥、硝酸等。\n\n## 离散制造过程与流程生产过程\n生产模式比较\n\n| 比较因素 | 离散制造过程 | 流程生产过程 |\n|---|---|---|\n\
    | 产品生产 | 大批量/小批量/单件 | 以大批量为主 |\n| 物料流 | 离散 | 连续 |\n| 加工线路 | 灵活、动态可变 | 工艺线路单一，基本不变\
    \ |\n| 上下游工序关系 | 松耦合 | 相当强的耦合、关联、制约 |\n| 产品加工种类 | 多变 | 稳定 |\n| 产品设计 | 根据要求经常进行\
    \ | 投产后几乎没有 |\n| 产品加工时间 | 可变 | 装置投产后，同样处理量情况下，不变 |\n| 加工过程 | 一般为物理过程 | 伴随着化学、物理变化，机理复杂\
    \ |\n| 生产柔性 | 强 | 以刚性系统为主 |\n| 环境问题 | 轻 | 排污问题严重，需要全面治理 |\n\n## 离散制造过程与流程生产过程操作模式比较\n\
    \n| 比较因素 | 离散制造过程 | 流程生产过程 |\n|---|---|---|\n| 操作工况 | 常规环境 | 通常在高温、高压、低温、真空、易燃、易爆、有毒的恶劣工况下\
    \ |\n| 缓冲单元 | 生产线存在某些缓冲单元 | 一般没有中间缓冲单元，设备启停、正常操作和紧急处理步骤复杂 |\n| 操作监控要求 | 一般 | 很强的实时性要求\
    \ |\n| 操作参数 | 一般为物理几何参数，状态可以由人工观测 | 以热工参数、组分参数为主，状态不能直接观测，操作参数量很大 |\n| 操作经济目标\
    \ | 缩短供货周期，提高设备利用率 | 强调操作整体性，实现均衡、安全、长周期、高效、低能耗生产，保证产品质量 |\n| 产品设计 | 生产重要环节，通过并行工程，在生产过程中进行\
    \ | 比重很小，通常与生产过程分离，单独进行 |\n| 控制方式 | 遵循分层管理与控制 | 集中管理/分散控制 |\n| 操作干扰 | 强度低 | 随机的、不确定的干扰情况普遍存在\
    \ |\n| 优化手段 | 调整生产计划，分配负荷，优化排序 | 调整工艺参数，达到最优工况 |\n| 柔性操作代价 | 一般通过选择不同的加工设备及夹具进行柔性操作，主要以时间为代价，时间较短代价低\
    \ | 流程切换后需进行设备及管线的清洗、再次开车周期较长，生产在稳定未达标前，原料、能量存在浪费，柔性切换操作时间较长，切换成本大 |\n\n## 离散制造过程与流程生产过程\n\
    自动化技术水平比较\n\n| 比较因素 | 离散制造过程 | 流程生产过程 |\n|---|---|---|\n| 自动化程度 | 普遍实现了单机自动化，中小企业处于机械化阶段，少数大企业处于生产自动化阶段\
    \ | DCS系统普遍应用于生产过程中完成生产过程的监控、管理工作，部分企业完成计算机信息管理系统工作，自动化孤岛现象普遍存在，自动化基础水平好 |\n|\
    \ 自动化基础技术 | CAD、CAM、FMS、数控加工设备 | DCS、PLC、控制仪表、现场总线 |\n| 数据库 | 工程数据库，集中分布式数据库 |\
    \ 实时数据库、发布式数据库、海量存储数据库 |\n| 计算机网络 | 开放异构网络互连，递阶结构 | 开放异构网络互连、实时性、可靠性要求很高 |\n\n\
    ## 离散制造工业与连续流程工业生产过程的自动化技术发展\n\n## 离散制造工业\n\n企业竞争的推动力 成本 市场和销售 产品质量 时间,顾客服务\n\n\
    成组技术 物料需求计划(MRP) 制造资源计划(MRPII) CIMS 精益生产\n\n数控编程系统(APT) CAD CAPP CAD/CAM 软件工程\
    \ PDES/STEP 并行工程 智能制造 敏捷制造\n\n50年代 60年代 70年代 80年代 90年代\n\n电子计算机问世 数控机床 直接数控(DNC)\
    \ 柔性制造系统(FMS) 机电一体化 微型计算机 工业机器人 数据库 局域网 多媒体 工作站 网络系统 开放式平台 光纤网络 信息高速公路\n\n"
