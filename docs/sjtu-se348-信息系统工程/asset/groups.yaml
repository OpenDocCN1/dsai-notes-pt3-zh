    # 自顶向下总体数据规划过程（1）


    +   1. 得到最高层管理人员的赞成

    +   2. 选择要采用的方法论，坚持使用这套方法

    +   3. 定义业务职能区域;


    +   - 绘制一张表示企业、部门和职能区域的图表

    +   - 与最高层管理人员一起复查

    +   - 确定研究范围

    +   - 准备一张研究进度时间表和交付日期表

    +   - 取得批准'
  - '[PAGE 938]


    # 自顶向下总体数据规划过程


    # 4. 研制一些职能、活动和实体的实例


    +   - 成立研究小组（建议由两名数据处理人员，其中包括一名数据库专业人员，和两名有广博的业务知识的用户人员组成。）这个小组必须有一位权威的领导人——一位多谋善断的领导，如有必要，可外请一位咨询专家

    +   - 提出各职能区域的负责人

    +   - 选择用户分析员

    +   - 培训用户分析员


    # 5. 把每一职能区域分解成一些业务过程，这些业务过程可分别由用户组来审查


    +   - 为每一业务过程给出一个定义

    +   - 同用户分析员一起复查这些业务过程

    +   - 整理业务过程一览表，并由用户分析员对它进行再次核实

    +   - 绘制一张矩阵表，表示出各高级管理人员对哪些业务过程负责'
