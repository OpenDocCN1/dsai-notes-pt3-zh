    \  - 分配\n  - 会计\n  - 人事\n\n## 某中型制造厂的职能区域图\n\n![](img/66d4369fd16c75b43d6800360af39d15_691_0.png)\n\
    \n## 如何建立职能区域图表\n\n- 职能区域图表提供了整个企业的一个概貌，即职能模型（Functional Model）\n- 这项工作应该在规划工作一开始就尽快着手进行，可以在一名高级负责人或者一组了解整个企业情况的管理人员的帮助下完成\n\
    - 需要考虑如下问题\n  - 企业的长期目标是什么？\n  - 预计会发生或很可能发生什么样的变化？\n  - 所建立的职能模型是否包括了这些目标和将来的变化？\n\
    \n不仅仅是现在 而且包括未来\n\n## 职能模型的分析案例\n\n## 山东高速集团物流规划咨询竞争性谈判文件\n\n- 1. 掌握宏观环境和产业环境现状与发展趋势，以及国内外相关行业现状与发展趋势，为战略决策提供翔实、全面的数据与资料。\n\
