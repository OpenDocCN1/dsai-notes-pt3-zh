  - '[PAGE 145]


    # CIMS概念的完善


    人们在CIM实践过程中提出了多种不同的定义，表达了不同的认识和看法，CIM的概念也由此不断得到完善和发展


    # 共同点


    覆盖范围实际整个企业的全部活动，分析和设计系统时必须站在企业的高度，全局观点


    # 差异点


    +   - 全盘自动化

    +   - 计算机是集成主体/工具

    +   - 人在CIMS中处于什么地位


    CIM 不等于全盘自动化，计算机只是工具、手段，系统集成包括人的集成'
  - '[PAGE 146]


    # CIMS定义


    CIM是一种概念，一种哲理，它指出了制造业应用计算机技术的更高阶段，在企业中将市场分析、经营决策、产品设计、制造过程各个环节乃至到销售和售后服务，包括原材料、生产和库存管理、财务资源管理等全部运营活动，在一种全局集成规划指导下，在更充分发挥人的集体智慧和合作精神的氛围中，关联起来集合成一个整体，逐步实现全企业的计算机化。'
  - '[PAGE 147]


    # CIMS的功能构成


    ![](img/66d4369fd16c75b43d6800360af39d15_147_0.png)'
  - '[PAGE 148]


    # CIMS的功能构成


    4个功能分系统、2个支撑分系统


    # （1）管理信息系统


    以MRPII为核心，从制造资源出发，考虑企业进行经营决策的战略层、中短生产计划编制的战术层，其功能覆盖市场销售、物料供应、各级生产计划与控制、财务管理、成本、库存和技术管理等部分的活动，是以经营生产计划、主生产计划、物料需求计划、能力需求计划、车间计划、车间调度与控制为主体形成的闭环一体化生产经营和管理信息系统'
  - '[PAGE 149]


    # CIMS的功能构成


    # （2）工程设计自动化系统


    在产品开发过程中引入计算机技术，包括产品的概念设计、过程与结构分析、详细设计、工艺设计与数控编程。CAD、CAPP、CAM。


    # （3）制造自动化系统


    制造现代化系统是在计算机的控制与调度下，按照NC代码将一个毛坯加工成合成的零件，再装配成部件以至产品，并将制造现场信息实时地反馈到相应部门。物流和信息流的结合点，最终产生经济效益的聚集地。


    # （4）质量保证系统


    采集、存储、评价与处理设计、制造过程中与质量有关的大量数据，从而获得一系列控制环，并用这些控制环有效促进质量的提高，以实现产品的高质量、低成本、提高企业的竞争力'
  - '[PAGE 150]


    # CIMS的功能构成


    # （5）计算机通信网络


    支持CIMS各个分系统的开放型网络通信系统，采用国际标准和工业标准规定的网络协议，实现异种机互联、异构局部网络及多种网络互联。


    # （6）数据库系统


    支持CIMS各个分系统并覆盖企业全部信息的数据库系统。在逻辑上是统一的，在物理上是分布的，以实现企业数据共享和信息集成。'
  - '[PAGE 151]


    # CIMS的发展状况

    ——美国


    把保障国家安全，提高其工业在国际上的竞争力作为科技发展的战略方针，国防部、能源部、陆军器材部、航空航天部等政府部门都极为关注和重视CIM的进展状况，指定自身的CIM发展战略计划


    | 时间 | 发展情况 |

    |---|---|

    | 1975年 | 美国空军制定空军计算机辅助制造计划AFCAM |

    | 1976年 | 美国工程师学会制定计算机辅助计划ICAM |

    | 1985年 | 正式形成CIM计划，投资1亿美元 |

    | 1990年 | 道格拉斯飞机制造公司建成CIMS系统 |

    |  | HP、DEC信息网络为基础的开放式结构平台 |

    |  | 波音公司，777制造过程采用并行工程思想实施，组织了238个不同的工作组，采用数字化定义、数字化预装配（可装配）技术，实现无图纸生产，达到了无样机一次制造成功
    |


