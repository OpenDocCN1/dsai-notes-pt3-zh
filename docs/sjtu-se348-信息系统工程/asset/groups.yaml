    \n## 可重构？\n\n![](img/66d4369fd16c75b43d6800360af39d15_464_0.png)\n\n![](img/66d4369fd16c75b43d6800360af39d15_464_1.png)\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_464_2.png)\n\n- 可重构性概念 - 扳手\n- RMS：重新配置产能和功能\n\
    - 可重构与专用与灵活是经济决策\n\n## 简化示例：DML、FMS 与 RMS 比较\n可重构机床（示例）\n\n## RMS 设计原则：\n\n- 机床是围绕零件族设计的\n\
    - 工艺规划和机床设计是同时进行的\n\n拱轴可在重构期间移动\n\n![](img/66d4369fd16c75b43d6800360af39d15_465_0.png)\n\
    \n## 简化示例：DML、FMS 与 RMS 比较\n\n## RMT - Y-Z 双单元（重构后）\n\nRMS 设计原则：\n机床设计\n用于重构\n\
