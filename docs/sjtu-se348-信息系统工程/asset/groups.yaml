    # 阿里的物流战略


    # 阿里的“天网”——“物流宝”


    +   2010年6月，淘宝网对外首推“大物流计划”，核心内容之一就是推出了物流宝平台，即由淘宝网联合国内外的仓储、快递、软件等物流企业组成服务联盟，提供一站式电子商务物流配送外包服务，解决商家货物配备（集货、加工、分货、拣选、配货、包装）和递送难题的物流信息平台。


    +   在2011年的物流战略发布活动中，以物流宝为核心的物流信息管理系统的功能，又进一步被强化。阿里巴巴用“物流宝”汇集所有物流服务商的服务信息，将从生产商到消费者的物流链各环节合作伙伴整合起来，并“从上而下打通”。所谓“打通”，一是指商家完成网店前台和后台对接，一是整个物流宝平台也完成前台数据跟仓库管理系统对接。


    +   “我们自己不会去用卡车运东西、也不会管仓库里边的作业，这些工作全部由合作伙伴完成。”淘宝网CFO张勇表示，阿里巴巴不会介入到硬件和整个作业层面的管理，不会跟物流服务商去抢饭碗，而是要做“信息服务集成商”'
