    # 用户视图（User View）


    +   - 用户视图是一些数据元素的集合，它反映了最终用户对数据实体的看法

    +   - 用户视图是数据在系统外部（而不是内部）的样子，是系统的输入或输出的媒介或手段

    +   - 威廉·德雷尔认为，用户视图与外部数据流是同义词——用户视图是来自某个数据源或流向某个数据接受端的数据流

    +   - 常见的用户视图有：

    +     - 输入的表单

    +     - 打印的报表

    +     - 更新的屏幕数据格式

    +     - 查询的屏幕数据格式

    +     - ...'
