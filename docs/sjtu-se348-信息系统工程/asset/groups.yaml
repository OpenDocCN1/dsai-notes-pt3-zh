    ## 霍顿（F.W.Horton）

    信息资源管理（IRM）理论的主要观点


    +   1. 信息资源（Information Resources）与人力、物力、财力和自然资源一样，都是企业的重要资源，应该像管理其他资源那样管理信息资源，IRM是企业管理的必要环节，IRM是企业管理的新职能，应该纳入企业管理的预算


    +   2. 必须将IRM与企业的战略规划联系起来，把信息资源作为战略资产进行管理，在企业的每个层面上识别信息资源和获利机会，并借以构建新的竞争优势


    +   3. IRM的目标是通过增强企业处理动态和静态条件下内外信息需求的能力来提高管理的效益。IRM追求“3E”—Efficient, Effective和Economical，即高效、实效、经济。


    +   4. IRM包括数据资源管理和信息处理管理。前者强调对数据的控制，后者则关心企业管理人员在一定条件下如何获取和处理信息，且强调企业中信息资源的重要性。


    ## 信息资源管理

    四个阶段


    | 发展阶段 | 推动力量 | 战略目标 | 基本技术 | 管理方法 | 组织状态 |

    |---|---|---|---|---|---|

    | 第一阶段：信息物的物理控制 | 商业与政府组织的增长和多样化远距离管理 | 程序效率和物料控制 | 纸张、打字机、电话、文件柜、制表机、缩微胶卷 | 文书管理，记录/报告管理，通信管理与部件管理，指令管理与指示管理，重要记录的保护、办公室设计与设施
    | 监督和中低水平的分化、分散的协作 |

    | 第二阶段：自动化技术的管理 | 数据处理电子通信和办公系统的独立发展与改进 | 技术效率与控制 | 第2代/第3代计算机、电子复印机、独立的组合式文字处理机、语音通信的改进、“技术使用利用”是操作技术管理的主导状态
    | 集中的数据处理部门的出现，电子通信协作者与通信者的出现，文字处理中心与独立的工作站的出现，复制中心与独立单元的出现 | 中级水平管理，认为手工信息管理不同于自动化管理，信息技术用户与提供者之间存在分歧
    |

    | 第三阶段：信息资源管理 | 数据处理电子通信与办公自动化系统的聚合 | 信息、技术集成的管理视信息为一种战略资源 | 分布式数据处理（诸如/数据）集成通信网络多功能工作站，包括数据处理、文字处理、电子邮件、时间管理、个人计算机等、个人计算机
    | 传统资源管理技术（如规划成本核算等的应 用，信息技术的水平管理，商业规划与信息资源规划的密切联系 | 中高水平的管理 |

    | 第四阶段：知识管理 | 信息技术逐渐渗入公司每一层次的操作与管理决策制定过程中 | 信息资源的物质/技术管理与决策层管理层和操作层的 | 专家系统决策支持系统办公智能系统
    | 价值和价值与信息技术的集成，内部和外部信息处理和集成的，信息规划和商业规划的紧密联系 | 管理知识资源已经成为所有管理层次所采用的管理哲学的基本部分 |


