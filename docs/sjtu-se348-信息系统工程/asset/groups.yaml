    - 应该注意，这种规划的边界不要规定得太大\n- 企业最高层领导班子应认真审核所列出的职能区域是否完善，并明确总体数据规划的范围\n\n## 第3部分 企业模型\n\
    \n- 职能区域\n- 业务过程\n- 业务活动\n- 企业模型的建立过程\n- 关键成功因素（CSF）\n\n## 业务过程（process）\n\n-\
    \ 每个职能区域都要执行一定数目的业务过程（process）\n- 企业模型的二级结构是业务过程的识别、命名和定义\n- 这项工作主要靠用户分析员来完成，当然他应该同其他业务人员商讨，要使命名和定义有一致的理解\n\
    - 业务过程的命名和定义\n  - 应符合它们所起的作用\n  - 可以用简单的定义加以确定。例如，库存管理业务过程可以定义为：“对仓库的原材料、零部件进行接收、保管、发放并核算库存量的过程。”\n\
    \n## 某中型制造厂的业务过程识别、命名\n\n| 职能区域 | 业务过程 |\n|---|---|\n| 总登计划 | 市场分析 |\n|  | 产品需求考察\
    \ |\n|  | 销售预测 |\n|  | 财务计划 |\n| 财务 | 资金获取 |\n|  | 资金管理 |\n| 产品计划 | 产品设计 |\n|\
    \  | 产品定价 |\n|  | 产品规格说明 |\n| 材料 | 材料需求 |\n|  | 采购 |\n|  | 进货 |\n|  | 库存管理 |\n\
    |  | 质量管理 |\n| 生产计划 | 生产能力计划 |\n|  | 工厂调度 |\n|  | 工序安排 |\n| 生产 | 材料控制 |\n|  |\
    \ 检验与下料 |\n|  | 机械加工 |\n|  | 地区管理 |\n| 销售 | 销售 |\n|  | 销售管理 |\n|  | 客户联系 |\n|\
    \ 分配 | 贮品库存管理 |\n|  | 订货服务 |\n|  | 包装 |\n|  | 运输 |\n|  | 地区管理 |\n| 会计 | 借方与贷方\
    \ |\n|  | 现金流动 |\n|  | 工资 |\n|  | 成本会计 |\n|  | 预算计划 |\n|  | 利润分析 |\n| 人事 | 人事计划\
    \ |\n|  | 招募人员 |\n|  | 补偿政策 |\n\n## 某中型制造厂的业务过程定义\n\n| 编号 | 业务过程 | 过程说明 |\n|---|---|---|\n\
    | 4. 材料 | 4-1. 材料需求 | 汇总基层单位材料申报表，对照当前库存，编制材料需求计划 |\n|  | 4-2. 采购 | 根据材料需求计划，向供应商发出订货通知，签订并管理订货合同\
    \ |\n|  | 4-3. 进货 | 根据供应商到货通知单，组织提货运输，登记入库 |\n|  | 4-4. 库存管理 | 根据入库单验收，按放至货位，保管、发放，定期/不定期盘点，ABC分析\
    \ |\n|  | 4-5. 质量管理 | 定期/不定期进行保管质量检查分析，超期存贮处理 |\n| 5. …… | …… | …… |\n\n## 职能区域、业务过程与组织机构的关系\n\
    \n- 职能区域和业务过程的确定，应该是独立于当前的组织机构。企业的组织机构可能变化，但仍然会执行同样的职能和过程。\n- 职能区域与业务过程的确定，主要应该考虑独立于当前组织机的职能，会有这样两种情况\n\
    - 经逻辑分析得出的职能模型中可能包括这样的职能区域，它横跨两个或多个现行系统的业务部门\n- 现行系统的业务过程中可能会有这样的一些过程，它们分别属于不同的职能区域，但功能相同或相近。例如，库存管理过程，可以由一个独立部门也可以由几个部门来完成，尽管仓库职能部门是时而分开，时而合并的，但库存管理的业务过程总是在起作用\n\
    \n## 如何识别业务过程\n——“四阶段生命周期”参考模式\n\n- 识别企业业务过程一般来说缺乏较好的形式化方法，主要靠有经验的业务人员和管理人员进行反复提炼\n\
    - 但是，可以提出一种参考模式（“产品、服务和资源”四阶段生命周期模式），它能帮助你套用在你所面临的企业或组织上，发现并列出其业务过程。\n\n![](img/66d4369fd16c75b43d6800360af39d15_700_0.png)\n\
    \n## 如何识别业务过程\n——“四阶段生命周期”参考模式\n\n- □ “产品、服务和资源”四阶段生命周期模式\n- ■ 计划阶段业务过程\n  - ✓\
