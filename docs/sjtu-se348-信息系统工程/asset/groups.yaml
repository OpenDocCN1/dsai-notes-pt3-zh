    \n数据结构和存储方式都独立于应用数据的各种功能，数据按照客户、产品、人员等业务主题相互联系地存放在可以由众多用户共享的数据库之中，系统开发人员只要描述稳定的数据库中数据的内在性质，建成的数据库与所要编程的功能或数据流无关，这就使数据作为一种独立的资源，成为支持所有应用项目的基石。\n\
    \n## 第4部分 主题数据库\n\n- 四类数据环境\n- 数据库工程与信息工程\n- 主题数据库\n- 主题数据库剖析\n- 主题数据库规划\n- 信息体系结构设计\n\
    - 实施的优先顺序\n\n## 主题数据库的规划方法\n\n- 在规划企业应该建立哪些主题数据库时，必须从企业的全局观点出发。这种在整个组织范围内的规划，需要不仅考虑主题数据库，而且要考虑现有的或新的文件，以及某些应用项目中独立的数据库。这就是所谓自顶向下规划或战略规划的一部分。\n\
    - 为构成主题数据库的数据项和记录，进行详细分析和建立模型的工作是自底向上的设计。\n- 主题数据库有时被称为数据类（Data Class）。在大多数企业中，它们的內容不是用一套形式化的方法确定的，只是将与客户有关的记录归于客户数据库，将与产品有关的记录归于产品数据库，等等。一个相对简单的企业，可以拥有大约20个主题数据库，而一个复杂的大企业，拥有的数据库可以多至80个。\n\
    - 这项工作听起来简单，实际上，关于应该建立哪些主题数据库，数据库中应包含哪些数据，有许多值得探讨的问题。例如，采购定货应该放在供应商数据库中，还是应该放在材料数据库中？\n\
    \n- 主题数据库规划小组在确定主题数据库时，可以用两种方法进行考察和相互参照\n- 第一种方法是列出与企业工作有关的基本事物和组织机构。对每一项目，可以根据“计划—获取—保管—处置”的生命周期顺序来考虑和列出其相关数据。对于材料有：材料计划、材料清单、成本、采购订单、库存清单、领料单、使用统计。对于每一类基本事物或组织机构，都可以列出这样的清单，然后将这些数据分组成为相关的数据类。\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_750_0.png)\n\n- 零件；\n- 材料；\n- 供应商；\n\
    - 零件；\n- 在制品；\n- 产品；\n- 客户；\n等等。\n- 设备；\n- 建筑物；\n- 现金；\n- 帐户；\n- 股票持有者；\n- 人事；\n\
    - 推销员；\n\n- 第二种方法是考察业务过程一览表，并且写下每一过程所用到的输入和输出数据类\n- 这些数据类清单可与第一种方法产生的清单互相参照，形成最后的数据类分组。\n\
    \n| 职能区域 | 业务过程 |\n|---|---|\n| 销售计划 | 销售分析 |\n|  | 产品需求预测 |\n|  | 销售预算 |\n| 财务\
    \ | 财务计划 |\n|  | 资金获取 |\n|  | 资金管理 |\n| 产品计划 | 产品设计 |\n|  | 产品定价 |\n|  | 产品制造说明\
    \ |\n| 材料 | 材料需求 |\n|  | 采购 |\n|  | 进货 |\n|  | 库存管理 |\n|  | 质量管理 |\n| 生产计划 | 生产能力计划\
    \ |\n|  | 工厂配置 |\n|  | 工序安排 |\n|  | 材料控制 |\n| 生产 | 检验与下料 |\n|  | 加工 |\n\n|  |\
    \ |\n|---|---|\n| 销售 | 地区管理 |\n|  | 销售 |\n|  | 销售管理 |\n|  | 客户联系 |\n| 分配 | 库存库存储酒\
