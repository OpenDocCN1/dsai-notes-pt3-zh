    ## ——马云开始当“菜鸟”，学习物流，投入物流行业了！


    ![](img/66d4369fd16c75b43d6800360af39d15_358_0.png)


    - □ 跨界是时尚

    - □ 跨界更重要的是视界不同引起的颠覆和创新


    2013年5月28日，由阿里巴巴集团牵头的物流项目“中国智能骨干网”（简称CSN）在深圳正式启动。阿里本次联合了银泰集团、复星集团、富春集团、顺丰、申通、圆通、中通、韵达组建了一个新公司，名为“菜鸟网络科技有限公司”。


    注册资本50亿元，认缴实收资本15亿元，股东构成：上海圆通蛟龙投资发展（集团）有限公司、顺丰速运（集团）有限公司、申通快递有限公司、上海中通吉速递服务有限公司和上海韵达货运有限公司分别出资5000万元，上海星泓投资有限公司和富春物流有限公司各出资5亿元，北京国俊投资有限公司出资16亿元，浙江天猫技术有限公司出资21.5亿元。


    据称“菜鸟”网络这个公司名由马云选定，寓意做业务时永远保持一种“菜鸟般”的学习心态。这也是继“天猫”之后，马云取的又一个颇具话题性的公司名字。


