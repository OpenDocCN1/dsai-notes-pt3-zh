    | 企业信息系统综合设计与实现 | 3 | 48 | 6 |'
  - '[PAGE 3]


    # 系统科学


    +   系统科学是从系统的角度去考察和研究整个客观世界，为人类大规模改造世界提供科学理论和方法的一门科学。


    +   系统科学分为三个层次：

    +   第一层是基础科学。即系统学。主要研究系统普遍属性、运动规律，系统间复杂关系的形成法则，系统结构和功能的关系，系统有序结构的形成规律以及仿真的基本原理等。

    +   第二层是技术科学。主要研究系统共性问题的技术理论，如最优化理论。当前，系统的技术科学主要是运筹学。

    +   第三层是工程技术。系统的工程技术称为系统工程。它是直接改造客观世界的技術，是大系统的组织管理技术。由于系统的性质不同，相应的系统工程的内容也不完全相同，如信息系统工程、军事系统工程、教育系统工程、经济系统工程等。'
  - '[PAGE 4]


    # 系统工程


    +   - 系统工程方法论是合理开发系统或改造旧系统的思想、步骤、方法、工具和技术。


    +   - 系统思想又可称为系统思路或系统方法（System Approach），它是人类从不断失败和成功的系统工程实践中总结来的，并用于指导系统开发的思想方法，因此系统工程是一门“解决问题”的应用技术。


    +   - 系统工程是一种跨学科的方法。'
  - '[PAGE 5]


    # 系统工程内容


    +   - 开发（Development）

    +     - 包括需求分析、系统设计、组件设计和集成。

    +   - 制造（Manufacturing）

    +     - 包括试制和最终投产。

    +   - 验证（Verfication）

    +     - 包括应用论证、试验、审查和分析（仿真）机制，非正式的演示、全面的开发测试和评估，以及产品的验收测试。

    +   - 部署（Deployment）

    +   - 运行（Operation）

    +   - 支持与培训（Support and Training）

    +   - 处置（Disposal）'
  - '[PAGE 6]


    # 信息系统工程概念（百度百科）


    +   - 信息系统工程简称“信息工程”，指按照系统工程原理构建信息系统的过程。

    +   - 信息系统工程包括以下主要阶段

    +     - 立项

    +     - 规划

    +     - 建设

    +     - 应用

    +     - 维护'
  - '[PAGE 7]


