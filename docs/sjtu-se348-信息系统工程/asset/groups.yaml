  md: "\n## 分布式数据规划步骤\n\n**9.** 将应用程序分类是为了检查应用分布式的效果，在分布式系统中将应用程序分为四类\n\n- **0类程序**是指它与所服务的过程和所使用的数据都在同一地点\n\
    - **1类程序**与它所服务的过程不在同一地点，但与它使用的所有数据在同一地点\n- **2类程序**与它所服务的过程在同一地点，但与它使用的数据部分或全部在不同的地点\n\
    - **3类程序**不论是与它所服务的过程还是与它所使用的一些数据，都有一段距离\n\n| 程序 | 应用地点 | 数据结构 |\n|---|---|---|\n\
    | 0类程序 | 相同地点 | 相同地点 |\n| 1类程序 | 不同地点 | 相同地点 |\n| 2类程序 | 相同地点 | 部分或全部在不同的地点 |\n\
    | 3类程序 | 不同地点 | 部分或全部在不同的地点 |\n\n## 分布式数据规划步骤\n\n- 0 类程序是最理想的一类程序，3类程序应尽量避免，1类程序是集中式系统中常用的。为了避免模块间的相互作用，地理数据结构矩阵应进行调整，使得0类程序占最大的比例，避免3类程序，2\
    \ 类程序尽可能减少\n\n- 设计者可画出一张表，说明每类程序的数目\n\n- 不属0类的程序可以复制所考虑的数据结构，形成0类程序，有利于复制数据的因素如下：\n\
    \  - 事务处理量大\n  - 数据量少\n  - 数据更新不频繁\n  - 数据更新简单，因而容易避免完整性和重启问题\n  - 复制的数据结构简单（尽管它可能是一个复杂的数据库中导出的\n\
    \  - 数据通信有困难\n\n## 分布式数据规划步骤\n\n- □ 设计者可以计算一下复制数据的费用（存储费）和不复制数据的费用（传送费），进行权衡\n\
    \n- □ 设计者不仅要考虑程序的数目，还要考虑程序的使用频率，以及它们之间的传送量\n\n- □ 应该把注意力集中在非0类程序上，计算出使用这些程序每天发生的数据传送量。特别是当应用系统复杂时，重新调整数据结构通常可以大大减少传送量高的类型\n\
    \n## 分布式数据规划步骤\n\n10. 分析程序的分布在程序分类时已经在进行，现在结合对现存的数据库划分进一步组织应用程序。在一些企业中存在着大型集中式数据库，采用分布式策略可以进一步发挥其作用\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_915_0.png)\n\n## 第三讲 内容大纲\n\n- 信息工程的原理、方法和工具\n\
    - 总体数据规划的组织\n- 企业模型\n- 主题数据库\n- 实体活动分析\n- 数据分布规划\n- 总体数据规划方法\n\n总体数据规划的四大部分\n\n\
    ## 第7部分 总体数据规划方法\n\n- □ 引言\n- □ BSP方法的目标和步骤\n- □ 总体数据规划流程\n- □ 总体数据规划工作进度控制\n\
    - □ 信息工程的方法论\n\n## 总体数据规划的深度问题\n\n- □ 总体数据规划的核心是提出全企业的稳定的数据模型\n\n- □ 尽管这种数据模型是企业建立计算机化的信息系统所必需的，但它的提出不是容易的事情，规划工作是有难度的\n\
    \n- □ 根据实际情况，总体数据规划可以有不同深度\n\n- ■ 有些企业因种种条件约束，不宜把这种规划做得过细，可在较短时间内完成企业模型与主题数据库规划工作\n\
    \n- ■ 另一些企业则应将总体数据规划搞得详细一些，这时所进行的实体——活动分析会进一步校正企业模型与主题数据库的划分\n\n- ■ 而经过数据分布分析才可能较为准确地设计出新系统的逻辑结构和网络结构\n\
    \n## 第7部分 总体数据规划方法\n\n- □ 引言\n- □ BSP方法的目标和步骤\n- □ 总体数据规划流程\n- □ 总体数据规划工作进度控制\n\
    - □ 信息工程的方法论\n\n## BSP研究的潜在效益\n——对于高级管理人员\n\n- 评价现行信息系统的效率\n- 用一种确定的、逻辑的方法来帮解决有关企业发展前景的管理控制问题\n\
    - 基于业务关系的影响和优先顺序，来估计未来信息系统的需求\n- 是一种有助于尽早收回公司对信息系统投资的规划方法\n- 所规划的系统是一些相对独立于组织机构的信息系统\n\
    - 把握信息系统的方向，充分管理维护好现行系统，去实现所规划的系统\n\n## BSP研究的潜在效益\n\n## ——对于职能级和操作级的管理人员\n\n\
    - 是一种帮助解决管理控制问题和操作控制问题的确定的逻辑的方法\n- 提供所有用户使用和共享的一致性数据\n- 最高层管理人员参与制定组织机构的目标和方向，并且协调各方面确定系统优先顺序\n\
    - 这些系统是面向管理和用户的，而不是面向数据处理的\n\n## BSP的步骤\n\n职能区域 | 业务过程\n总务计算 | 成本分析\n | 产品总图考察\n\
