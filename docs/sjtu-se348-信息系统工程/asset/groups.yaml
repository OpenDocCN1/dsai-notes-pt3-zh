    - 实体的组合\n- 实体与活动之间的对应\n- 相关分析与分组算法\n- 主题数据库的调整\n- 企业的改组\n\n## 实体分组的人工调整\n\n- 实体分类算法可能会将由于某些别的因素应该分开的实体放在同一实体组中，这些因素包括：\n\
    \  - 可靠性（在某一类数据出现问题时对另一类数据的保护）、分布式系统设计、法律因素等\n  - 为了保存现有的文件或数据库系统进行特殊分组\n\n此时，仍然需要人的判断，对分组结果进行调整，以便开发小组能够进行主题数据库的详细数据模型设计\n\
    \n用户可以选定不同的相关系数分界值，对这一算法进行多次运行，或者强制数据按一定方式分开。可以为所得到的每一个主题数据库绘制一张与分组实体图，以便进一步考察分析\n\
    \n## 实体联系分组和相关分析分组参照\n\n- 相关分析所得到的分组，可以用来与前面所讨论的实体联系进行分类所获得的分组结果，相互参照比较，以用来检查实体大结构的合理性\n\
    - 相关数本身可以代替实体联系分类中的主观分类，作为联系的加权，可以被用来将实体图中的实体划分成为实体大组\n\n![](img/66d4369fd16c75b43d6800360af39d15_842_0.png)\n\
    \n## 第5部分 实体活动分析\n\n- 实体分析方法\n- 实体图的结构化\n- 实体的组合\n- 实体与活动之间的对应\n- 相关分析与分组算法\n\
    - 主题数据库的调整\n- 企业的改组\n\n## IT人员应该从更高的战略高度认识……\n\n我们IT人员切入业务的弧手！\n我们的要永在它！！！\n\n\
    ## （1）企业模型与教据模型引起的思考\n\n- 在许多企业中，考察现行的管理过程的职能分析已经完成。但是，考虑企业的管理过程应该如何，比只注意它们现状如何更有价值。数据库技术为组织中管理过程及信息资源进行重大改革提供了机会\n\
    \n- 第一辆汽车曾经被称为“无马马车”，其形状也与没有马的马车相同，很长时间以后，人们认识到，汽车应该具有不同的外形。与此相似，我们所建立的数据库和管理系统重复了现行的或以前的工作组织方式，我们会逐步认识到，数据库和管理系统应该使我们能够采取不同的和更好的工作组织方式\n\
    \n- 实体和实体活动分析常常导致人们重新考虑一个公司中的职能和方法，这项工作有时被称为职能分析\n\n- 实体活动分析会使人们重新思考管理过程，常常会导致部门的改组和审查委员会的建立。研究小组应该提出的一个问题是：“你认为企业的组织结构应该是怎样的？”必须经常不断地探索使用数据库和计算机终端来改进企业管理过程和组织结构的方法。了解不同的部门或分部使用什么数据，常常使最高领导感到惊讶。这常常揭示出组织中他们还不了解的一些事实，这就使组织机构变动或企业改组的需要变得清晰起来。\n\
    \n## 必须使用户分析员进行创造性的思考\n\n- 用户分析员很容易陷入提供目前的单证报表资料流的老一套作法，而不大容易思考业务的根本要求\n\n- 用户分析员必须摆脱目前各种文件资料的约束，认真考虑：哪些数据对我们是重要的？我们将需要什么数据？愿意对组织的数据需求进行创造性思考和定义的用户分析员，能够考虑将来的需要，而这会使所得到的数据库具有最大的灵活性\n\
    \n- 但是，用户要使自己进入这种状态是很困难的，需要有高级管理人员在一定程度上参与分析工作。高级管理人员知道目前的问题是什么，而且知道他们可能会采取什么行动来解决这些问题。他们需要一种工具来表达这些思想。在有些公司中，这使高级管理人员对实体分析产生了浓厚的兴趣\n\
    \n## 高级管理人员对实体分析产生了浓厚的兴趣\n\n如果在实体分析之后，又进行了BSP研究，那么BSP研究的问题矩阵可以作为确定信息系统中需要哪些改进的依据，并解答这样一些问题：\n\
    \n- 哪些我们目前没有存储的数据应该被存储？\n- 它们应该以什么形式提供给管理人员？\n- 为什么经理人员宁愿向别人打探消息或进行自己的主观判断，而不利用系统？\n\
    - 为什么总是不能按时完成大型的特殊的工程任务？\n\n管理人员参加实体分析时，常常会提出应该进行哪些业务活动的问题，会发现有些目前进行的活动是多余的或不必要的，有些活动由于散布在整个企业之中而不利于进行良好的控制等\n"
  mdcn: "\n\n## 实体分析应注意的问题\n（6）关于最高领导的参与问题\n\n- □ 许多公司中所进行的实体分析经验证明，实体分析和其他各种形式的自顶向下的规划一样，也需要非数据处理的最高领导参加，实体分析结果的质量与最高领导参与分析的质量密切相关\n\
    \n- □ 需要最高领导参与实体分析的原因\n  - ■ 要能够决定对企业信息系统中实体的选择\n  - ■ 实体分析会发现企业中各种各样应该被纠正的反常现象，这种分析的一个副产品常常是公司机构的改组，这是最高领导非常关心的事情\n\
    \n## 第5部分 实体活动分析\n\n- 实体分析方法\n- 实体图的结构化\n- 实体的组合\n- 实体与活动之间的对应\n- 相关分析与分组算法\n\
    - 主题数据库的调整\n- 企业的改组\n\n## 实体与活动之间的对应\n\n- 每一个业务活动都与数据实体相关系，一个典型的活动使用的实体往往多达7个\n\
    \n- 需要将活动图与实体图对照，如果一项职能所需要的实体还不明确，那就表明职能分解工作进行得还不够细致\n\n- 实体图和职能分解都不会是完善的。开始时，需要一个迅速得到的概貌图，可以使用粗略实体。建立详细数据模型和设计过程所需要的时间长得多。当这些详细工作完成之后，职能分解图和实体图以及它们的参照数据库可以得到更新\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_831_0.png)\n\n- □ 当实体与活动之间的对应关系确定之后，可以使用相关分析进行主题数据库的划分\n\
    \n## 实体之间相关性分析\n\n- 有两个实体E1和E2\n  - 如果它们从来没有被同一个活动使用过，那么它们之间的相关系数为0\n  - 如果每一个活动都同时使用这两个实体，那么它们之间的相关系数是1\n\
    \  - 许多实体都只被某些活动同时使用\n\n- 定义\n  - α (E1)=使用实体E1的活动数目\n  - α (E1,E2)= 同时使用E1和E2的活动的数目\n\
    \  - E1对E2的相关系数= α (E1,E2)/ α (E1)\n\n## 不同实体之间相关系数的矩阵\n\n![](img/66d4369fd16c75b43d6800360af39d15_835_0.png)\n\
    \n## 根据实体相关性进行分组的方法\n\n- 如果两个实体具有较高相关系数，它们就应该被放在相同的主题数据库中。如果它们之间相关系数为 **0**，不应该放在一起\n\
    \n- 根据实体相关性进行分组时，如果把相关系数等于 **0** 的实体放在同一个组中，那么将只能得到一个组。如果只把相关系数等于 **1** 的实体放在相同的组中，那么有多少实体，就会有多少个组\n\
    \n- 可以选择一个相关系数，使得所产生的分组数目在 **20 到 30** 之间，或者是设计人员所选定的其它数字，所得的分组可以被用作主题数据库的规划\n\
    \n- 这样分组方法，没有考虑活动的使用量。实践中，考虑活动的使用量后，实体分组会更加准确和合理\n\n## 如何对上述相关系数矩阵中的实体进行分组\n\n\
    - 首先，根据相关系数大小进行实体对的排序，把相关系数最高的实体对放在最上面，每一对具有很高相关系数的实体构成实体组的核心\n\nE1,E4(相关系数=0.92)\n\
    E11,E8(相关系数=0.90)\nE6,E7(相关系数=0.88)\nE10,E12(相关系数=0.87)\n\n- 下一对实体已经在上面出现过，如何办？\n\
    \nE2,E8(相关系数=0.85)\n\n## 如何对上述相关系数矩阵中的实体进行分组\n\n下一对相关性系数最高的是E7和E4(相关系数=0.76)\n\
    \n- E7和E4已分别在一个组中（E1、E4，E6、E7），是否应该把这两组合并？\n- 要计算E7对于现有的E1、E4实体组的复合加权相关系数，和E7对E1、E4、E6这一合并实体组的复合加权相关系数\n\
    - 如果假定这两个相关系数分别为0.55和0.37，这两个数字低于表中下一个相关系数，即E8和E10的相关系数（相关系数=0.74）。因此，需要先来处理这一对实体\n\
    \n- 进行每一个分组决策的顺序要根据相关系数来决定\n\n- 在相关系数序列的末尾，有些实体也许与任何其它实体都很少相关，这些实体可以用文件系统或独立的简单数据库来实施。\n\
    \n- 设计人员应当仔细考察剩余的低相关系数的实体，以确定它们是否属于已有的某个数据库\n\n## 第5部分 实体活动分析\n\n- 实体分析方法\n- 实体图的结构化\n\
