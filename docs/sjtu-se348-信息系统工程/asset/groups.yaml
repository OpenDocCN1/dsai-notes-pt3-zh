    \n## 问题三\n程序员和分析员一直在进行数据管理，为什么还要进行数据管理？\n\n- 数据字典的建立和使用，会加强企业内各部门之间关于数据和系统知识的沟通\n\
    \n- 交叉阴影部分，代表了数据字典的通讯涵义，是共享信息的集中存放地。数据字典是一个中心元库，它所存储的资料可以被公司所有部门存取，任何人只要有一台终端，并且具有数据字典方面的知识，就可以存取他所需要的全部资料\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_1028_0.png)\n\n## 问题三\n\n### 程序员和分析员一直在进行数据管理，为什么还要进行数据管理？\n\
    \n- 数据字典的另一作用是作为一个术语汇编，数据字典类似于大词典，其中包含公司所使用的术语词汇\n\n如果说大词典对于准确的语言交流是必不可少的，那么数据字典对于企业内信息资源的了解和相互沟通，同样也是十分重要的。作为各种术语的词汇表，数据字典对于数据处理和用户部门的新来职员，也是非常有价值的培训工具\n\
    \n- 数据字典是支持结构化分析和设计的有效工具\n\n它可用于形成数据存储（Data store），数据流（Data flow）和处理实体类（Process\
    \ entity class）的文档资料，这样，它就成为向用户描绘系统设计细节的有力工具。数据字典还可以用于生成文件、片断和记录的定义，集中控制程序中的数据定义，确保数据使用的一致性，并且抑制数据冗余。数据字典中的文档资料是“活的”资料，数据字典的自动检索和相互参照功能，可包括多个程序、系统、数据库、报表格式定义，以及其他文档的目录\n\
    \n## 问题三\n\n程序员和分析员一直在进行数据管理，为什么还要进行数据管理？\n\n- 数据字典既是利用最终用户的知识与经验，也是利用信息系统人员才干的最有效的工具\n\
    \n- 通过数据的特征、关系和规范的定义，用户可以直接参加系统的设计工作。用户更能直接控制整个系统的设计，而且同时节省出数据处理人员在数据定义上的时间。数据字典是授权给用户部门更多的数据处理工作和职责的工具\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_1031_0.png)\n\n## 第四讲 内容大纲\n\n- 信息资源管理概述\n\
    - 信息资源管理基础标准\n- 建立和使用数据字典\n  - 数据字典的基本内容\n  - 通过数据字典进行数据管理\n  - 数据字典的使用：新系统与旧系统\n\
    \  - 数据字典的设置\n- 数据管理工作的开展\n\n## 新系统与旧系统并存\n数据字典如何处理案例\n\n- 某公司决定开发一个新的人力资源系统，来取代运行了多年的旧的现行系统。这个现行系统实际上包括三个子系统：\n\
    \  - 人事子系统\n  - 工资子系统\n  - 劳动分布子系统\n\n由于新系统的规模和复杂性，决定分阶段实现。因为大多数修改问题出现在工资子系统，而且该公司预见到上级要求的工资报表要作重大修改，所以工资子系统首先被取代\n\
    \n图2.3 是新工资系统的数据流程图，E1和E2是现行人事系统的两个程序，它们把数据送给新的工资系统。C1和C2是转换程序，它们把旧的人事系统的数据转换成新的工资系统能接受的格式\n\
    \n程序N1到N8代表新的工资系统\n\n转换程序C3和C4将把新工资系统的一些记录转换成旧的劳动分布系统的格式\n\n## 新系统与旧系统并存\n数据字典如何处理案例\n\
    \n- 在新系统设计期间建立的数据流中的数据元素符合数据管理规定的标准，要求用数据字典来编制这些数据流。图中标以星号的数据流就是把新程序连接起来的数据流。\n\
    \n- 新旧程序之间流过的数据元素和数据定义应该如何处理？\n\n![](img/66d4369fd16c75b43d6800360af39d15_1034_0.png)\n\
    \n## 新系统与旧系统并存\n数据字典如何处理案例\n\n- （1）通过减少数据管理工作范围和复杂性，会增加你在该项目中取得成功的机会，如果时间允许，你可以稍后考虑增加项目的范围，将现行系统的一些部分包括在内\n\
    \n- （2）旧系统中使用的大多数数据元素不符合数据管理标准。把这些非标准的、“不像样子的”数据元素输入字典，你就助长和维持了它们在其他数据定义中的使用。把它们排斥在数据字典之外，有助于确保它们的消亡。\n\
    \n- （3）在许多情况下，用于旧系统的一些数据元素将是用于新系统的标准的数据元素的变形或别名。如果把这些数据元素都在字典中加以定义，就会大量地增加数据元素不同版本的总数。\n\
    \n- （4）如果你将这些额外的别名和不同版本的定义装入字典，就会增加未来数据字典维护的工作量。当你再重新设计人事子系统和劳动分布子系统时，你还得从字典中删除这些非标准的别名和版本。你怎样能断定它们全被消除了呢？如果其他一些程序或应用项目已开始使用这些别名和版本，如何处理呢？\n\
    \n## 系统开发期间\n数据字典和数据元素的变化规律\n\n![](img/66d4369fd16c75b43d6800360af39d15_1036_0.png)\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_1036_1.png)\n\n## 第四讲 内容大纲\n\n- 信息资源管理概述\n\
    - 信息资源管理基础标准\n- 建立和使用数据字典\n  - 数据字典的基本内容\n  - 通过数据字典进行数据管理\n  - 数据字典的使用：新系统与旧系统\n\
    \  - 数据字典的设置\n- 数据管理工作的发展\n\n## 数据字典的各种用户\n\n- 当要完成一项企业内的数据管理职能时，数据管理员必然提出这样的问题：为支持该公司需要的信息资源管理，应该建立几个数据字典？\n\
    - A处于初步设计，B接近完成，C刚刚开始\n\n![](img/66d4369fd16c75b43d6800360af39d15_1038_0.png)\n\
    \n## 开展数据管理工作的意义\n\n每年数以亿计的资金投入到全世界各企业、组织的信息系统建设中。但效果却没有那么明显。50%的系统失败了，80%的系统未达到预期效益\n\
    \n如果一个企业的信息系统本身就搭建在不统一、不坚实的基础上，就会像建筑在一堆乱石上的楼房，一旦有哪一块石头松动，整栋楼房就会分崩离析\n\n![](img/66d4369fd16c75b43d6800360af39d15_1040_0.png)\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_1040_1.png)\n\n## 诺兰的企业信息系统发展阶段模型\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_1043_0.png)\n\n单位购置第一台计算机并初步开发管理应用程序。一般，“初装”阶段大多发生在单位的财务部门。\n\
    \n机用手算，使用计算机的数据处理而提高效率，计算机技术应用开始大面积推广普及。\n\n使用计算机，开发信息系统，而且缺乏对其应用的总体规划和管理，既浪费了资源，也没有形成系统。\n\
    \n人们开始从实际需要出发，总结经验，全面规划开发计算机的各层应用，进行系统的集成和管理。\n\n在上阶段的基础上，引进计算机网络、数据库和多媒体技术，并充分发挥计算机信息系统的功能。\n\
    \n人们除了一把计算机应用于日常管理之外，进一步共享资源、优化数据、统一规划、扩展应用。\n\n![](img/66d4369fd16c75b43d6800360af39d15_1044_0.png)\n\
    \n> 由于重新装备大量设备，此阶段预算费用又一次迅速增长。如果进行企业局域网络的建设，实现企业数据的共享。\n\n> 由以计算机为中心转向以数据为中心。\n\
    \n> 指具有完备的MIS和DSS，并真正应用于企业管理的各个方面，它是个相对的概念。\n\n> 人们对计算机还不了解，只是从兴趣出发而接触计算机。\n\n\
    > 主要的问题：大量的计算机没有真正的用于管理，严格的控制阶段便代替了变革阶段。本阶段将是实现从以计算机管理为主到以数据管理为主转换的关键，一般发展较慢。\n\
    \n"
