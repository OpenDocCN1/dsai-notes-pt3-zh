    # 物流系统的功能要素


    物流是指物品从供应地向需求地的实体流动过程。根据实际需要，将运输、储存、装卸、搬运、包装、流通加工、配送、信息处理等基本功能实施有机结合。


    ![](img/66d4369fd16c75b43d6800360af39d15_400_0.png)


