    # 数据元素／数据元的定义


    +   □ 数据元素（Data Elements）是最小的不可再分的信息单位，是一类数据的总称


    +   □ 例如：


    +   ■ 船舶资料中的船名“天河轮”、“冀海轮”等，可以抽象出“船舶名称”这个数据元素


    +   ■ 每一条船都有一个编号，可以概括出“船舶编号”这个数据元素


    +   ■ 通常职工档案中的“简历”、“受奖情况”等，不是数据元素


    +   ✓ “简历”至少包括时间、地点等信息，是可以继续分解的信息


    +   ✓ “受奖情况”也是可以继续分解的信息'
  - '[PAGE 966]


    # 信息系统中所使用的大部分数据名，是少数数据元素的同义词或别名


    +   这些同义词或别名的产生原因，是由于缺少数据元素命名标准，或者缺少考虑数据元素的创建和使用的规划，而由那些只管标记自己拥有的 数据，而不顾及别人（其他的程序员和分析员）已建立并命名数据
    的人所建立的重复数据


    +   例如：


    +   “职工姓名”、“员工姓名”、“职工姓名”等，如不加以统一，在用汉语拼音表示其标识时有 ZGXM、YGXM、ZYXM 等，而其英文标识可能是 EMP—NAME、E—NAME、NAME—OF—EMPLOYEE、EMP—NAME、EMPLOYEE—NM,
    EMP—NM 等


    +   如果采用“职工姓名”这个统一标准，其标识为 ZGXM 或 EMP—N M，这就形成少数的“核心”数据元素


    +   如果开发人员都这样做，就可大幅度减少信息系统中所使用的数据元素的总数，并可以大大简化其结构'
  - '[PAGE 967]


    # # 数据元素标准的重要性


    +   - 数据元素的质量是建立坚实数据结构基础的关键。结构良好的数据元素的重要意义，在于向各种用户提供便捷而准确的信息；数据库建立在清晰、简明、标准化的数据元素的基础上，就能保证用户方便快速地检索到所需要的信息


    +   - 数据元素应该具有化学元素的性质——所有物质都是由100多种化学元素构成的，例如，氢元素（H）和氧元素（O）可以构成水（H₂O）和过氧化氢（H₂O₂）；应该把所有数据建立在有限数目的“核心”数据元素基础之上


    +   - 如果在数据元素的创建和命名上不加以适当考虑，整个数据结构的质量就会受到损害，这就需要建立数据元素标准

    +     - 数据元素命名标准

    +     - 标识标准

    +     - 一致性标准'
  - '[PAGE 968]


    # 1.数据元素命名标准（1）


    +   数据元素命名的原则是用一简明的词组来描述一个数据元素的意义和用途，这个词组的一般结构是：


    修饰词 - 基本词 - 类别词


    +   其中，类别词和基本词都只有一个，修饰词可以有一个或多个；一般类别词居后，修饰词和基本词居前，但按汉语或英语习惯，顺序可以灵活些


    ![](img/66d4369fd16c75b43d6800360af39d15_968_0.png)'
  - '[PAGE 969]


    # # 1. 数据元素命名标准（2）


    +   - **类别词（class word）** 是指能对数据对象作一般性分类的词，例如“时间”、“编号”等

    +   - **基本词（prime word）** 是指能对数据对象作进一步的分类的词，例如“设备”、“保险”等

    +   - **修饰词（modifying word）** 一般是名词，而不是形容词或副词


    ![](img/66d4369fd16c75b43d6800360af39d15_969_0.png)'
  - '[PAGE 970]


    # 1.数据元素命名标准（3）


    +   - 类别词是数据元素命名中的一个最重要的名词，用来识别和描述数据元素的一般用途或功能，一般不具有行业特征，条目比较少

    +   - 常见的类别词有：

    +     - 数量(AMOUNT)

    +     - 名称(NAME)

    +     - 编号(NUMBER)

    +     - 代码(CODE)

    +     - 系数(CONSTANT)

    +     - 百分比(PERCENT)

    +     - 计数(COUNT)

    +     - 正文(TEXT)

    +     - 日期(DATE)

    +     - 时间(TIME)'
  - '[PAGE 971]


    # # 1.数据元素命名标准（5）


    基本词是类别词的重要修饰词，它对一大类数据对象进一步分类（反映一小类数据对象），一般具有行业特征，条目比较多。例如，制造业常用的基本词有：


    +   - 会计（ACCOUNTING）

    +   - 预算（BUDGET）

    +   - 顾客（CUSTOMER）

    +   - 分配（DISTRIBUTION）

    +   - 员工（EMPLOYEE）

    +   - 工程（ENGINEERING）

    +   - 设备（FACILITY）

    +   - 库存（INVENTORY）

    +   - 制造（MANUFACTURING）

    +   - 市场（MARKET）

    +   - 税金（TAX）

    +   - 订单（ORDERS）

    +   - 付款（PAYMENTS）

    +   - 计划（PLANNING）

    +   - 采购（PROCUREMENT）

    +   - 产品（PRODUCT）

    +   - 研究（RESEARCH）

    +   - 销售（SALES）

    +   - 供应商（SUPPLIER）'
  - '[PAGE 972]


    # 1.数据元素命名标准（6）


    需要注意数据元素的命名应赋予其逻辑名称，而不是物理名称，应该根据一个数据元素的用途或功能，而不是根据这个数据元素在何处、何时、由何人如何使用，来创建和命名数据元素


    如果设计一个数据元素考虑了它在何时、何处使用，例如，“三月份发电量”、“四月份发电量”或“一号机组发电量”、“二号机组发电量”等，不仅严重地限制了这个数据元素的灵活性，还会使数据元素的数目无法控制，这些“名称”已不再是数据元素名


    把握类别词与基本词的定义和数目，就能控制数据元素的定义准确性和总体数目。运用类别词表与基本词表分析数据元素集，可进一步标准化数据元素的命名和标识，辅助数据元素的一致性控制，并可大大压缩数据元素的总数'
  - '[PAGE 973]


    # 1.数据元素命名标准（7）


    +   需要注意“数据元素命名”和“数据元素定义”的区别。前者是给一个数据元素起名字，一般来说是一个词组；后者是给一个数据元素下定义，即用一句话确切界定


    +   如果数据元素命名的词组结构和含义清晰，就不必再作定义，否则需要作定义。例如：


    +   “员工总数”、“机组编号”和“合同签定日期”等数据元素名，不需要再作解释，已经很清楚了


    +   “发电设备容量”的定义是“统计期末发电机铭牌额定容量的总和”，“原煤耗用量”的定义是“统计期内用正平衡计算法计算的发电（供热）耗用的原煤数量”等，如果只有数据元素的命名，而无进一步的定义，就不能满足管理上的需要


    +   数据元素的定义常常与专业技术术语解释相结合，甚至包括数据之间的关系或计算方法，这些都是在数据元素创建时应该加以注意的'
  - '[PAGE 974]


    # 2. 数据元素标识标准


    +   - 数据元素标识即数据元素的编码，是计算机和管理人员共同使用的标识

    +   - 数据元素标识用限定长度的大写字母字符串表达，字母字符可按数据元素名称的汉语拼音抽取首音字母，也可按英文词首字母或缩写规则得出

    +   - 例如：


    | 数据元素名称 | 数据元素标识（汉语） | 数据元素标识（英文） |

    |---|---|---|

    | 申报开工日期 | SBKG RQ | APL_ST_DT |

    | 设备数量 | SBSL | EQP_QTY |

    | 概算设备工程量 | GSSBGCL | EST_EQP_QTY |

    |  | GJZBDM | KPI_CD |'
  md: "\n## 企业出现“CIO”\n\n- 政府的成功经验促使一些大型公司将这一新的职位引入到本企业的信息资源管理中，企业CIO由此应运而生\n- 企业CIO最初出现在美国一些最大的公司和企业集团中，由于其成效显著，其他大公司纷纷竞相仿效。80年代中期通过对美国500家大型企业的抽样调查表明，已经有40%的公司设立了CIO职位。进入90年代，美国、英国、法国、加拿大、日本、韩国、新加坡等国家或地区正在筹划和实施各自的“信息高速公路计划”，其中企业CIO体制被视为基础性建设而受到了关注\n\
    - 企业CIO虽源于政府部门CIO，但无论是在数量、职能、活动范围、知名度等各方面，都已超越了政府部门的CIO。能否真正把信息看作企业的宝贵战略资源并有效地加以开发利用，是企业决策者所面临的新的挑战，正是为了迎接这一挑战，CIO才脱颖而出，被推上了信息资源管理新主角的地位\n\
    \n## 第四讲 内容大纲\n\n- 信息资源管理概述\n- 信息资源管理基础标准\n  - 数据元素标准\n  - 信息分类编码标准\n  - 用户视图标准\n\
    \  - 概念数据库标准\n  - 逻辑数据库标准\n- 建立和使用数据字典\n- 数据管理工作开展\n\n## 第四讲 内容大纲\n\n- 信息资源管理概述\n\
    - 信息资源管理基础标准\n  - 数据元素标准\n  - 信息分类编码标准\n  - 用户视图标准\n  - 概念数据库标准\n  - 逻辑数据库标准\n\
    - 建立和使用数据字典\n- 数据管理工作开展\n\n## 数据元素／数据元的定义\n\n- □ 数据元素（Data Elements）是最小的不可再分的信息单位，是一类数据的总称\n\
    - □ 例如：\n- ■ 船舶资料中的船名“天河轮”、“冀海轮”等，可以抽象出“船舶名称”这个数据元素\n- ■ 每一条船都有一个编号，可以概括出“船舶编号”这个数据元素\n\
    - ■ 通常职工档案中的“简历”、“受奖情况”等，不是数据元素\n- ✓ “简历”至少包括时间、地点等信息，是可以继续分解的信息\n- ✓ “受奖情况”也是可以继续分解的信息\n\
    \n## 信息系统中所使用的大部分数据名，是少数数据元素的同义词或别名\n\n- 这些同义词或别名的产生原因，是由于缺少数据元素命名标准，或者缺少考虑数据元素的创建和使用的规划，而由那些只管标记自己拥有的\
    \ 数据，而不顾及别人（其他的程序员和分析员）已建立并命名数据 的人所建立的重复数据\n- 例如：\n- “职工姓名”、“员工姓名”、“职工姓名”等，如不加以统一，在用汉语拼音表示其标识时有\
    \ ZGXM、YGXM、ZYXM 等，而其英文标识可能是 EMP—NAME、E—NAME、NAME—OF—EMPLOYEE、EMP—NAME、EMPLOYEE—NM,\
    \ EMP—NM 等\n- 如果采用“职工姓名”这个统一标准，其标识为 ZGXM 或 EMP—N M，这就形成少数的“核心”数据元素\n- 如果开发人员都这样做，就可大幅度减少信息系统中所使用的数据元素的总数，并可以大大简化其结构\n\
    \n## 数据元素标准的重要性\n\n- 数据元素的质量是建立坚实数据结构基础的关键。结构良好的数据元素的重要意义，在于向各种用户提供便捷而准确的信息；数据库建立在清晰、简明、标准化的数据元素的基础上，就能保证用户方便快速地检索到所需要的信息\n\
    - 数据元素应该具有化学元素的性质——所有物质都是由100多种化学元素构成的，例如，氢元素（H）和氧元素（O）可以构成水（H₂O）和过氧化氢（H₂O₂）；应该把所有数据建立在有限数目的“核心”数据元素基础之上\n\
    - 如果在数据元素的创建和命名上不加以适当考虑，整个数据结构的质量就会受到损害，这就需要建立数据元素标准\n  - 数据元素命名标准\n  - 标识标准\n\
    \  - 一致性标准\n\n## 1.数据元素命名标准（1）\n\n- 数据元素命名的原则是用一简明的词组来描述一个数据元素的意义和用途，这个词组的一般结构是：\n\
    修饰词 - 基本词 - 类别词\n- 其中，类别词和基本词都只有一个，修饰词可以有一个或多个；一般类别词居后，修饰词和基本词居前，但按汉语或英语习惯，顺序可以灵活些\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_968_0.png)\n\n## 1. 数据元素命名标准（2）\n\n\
    - **类别词（class word）** 是指能对数据对象作一般性分类的词，例如“时间”、“编号”等\n- **基本词（prime word）** 是指能对数据对象作进一步的分类的词，例如“设备”、“保险”等\n\
    - **修饰词（modifying word）** 一般是名词，而不是形容词或副词\n\n![](img/66d4369fd16c75b43d6800360af39d15_969_0.png)\n\
    \n## 1.数据元素命名标准（3）\n\n- 类别词是数据元素命名中的一个最重要的名词，用来识别和描述数据元素的一般用途或功能，一般不具有行业特征，条目比较少\n\
    - 常见的类别词有：\n  - 数量(AMOUNT)\n  - 名称(NAME)\n  - 编号(NUMBER)\n  - 代码(CODE)\n  - 系数(CONSTANT)\n\
    \  - 百分比(PERCENT)\n  - 计数(COUNT)\n  - 正文(TEXT)\n  - 日期(DATE)\n  - 时间(TIME)\n\n\
    ## 1.数据元素命名标准（5）\n\n基本词是类别词的重要修饰词，它对一大类数据对象进一步分类（反映一小类数据对象），一般具有行业特征，条目比较多。例如，制造业常用的基本词有：\n\
    \n- 会计（ACCOUNTING）\n- 预算（BUDGET）\n- 顾客（CUSTOMER）\n- 分配（DISTRIBUTION）\n- 员工（EMPLOYEE）\n\
    - 工程（ENGINEERING）\n- 设备（FACILITY）\n- 库存（INVENTORY）\n- 制造（MANUFACTURING）\n- 市场（MARKET）\n\
    - 税金（TAX）\n- 订单（ORDERS）\n- 付款（PAYMENTS）\n- 计划（PLANNING）\n- 采购（PROCUREMENT）\n-\
    \ 产品（PRODUCT）\n- 研究（RESEARCH）\n- 销售（SALES）\n- 供应商（SUPPLIER）\n\n## 1.数据元素命名标准（6）\n\
    \n需要注意数据元素的命名应赋予其逻辑名称，而不是物理名称，应该根据一个数据元素的用途或功能，而不是根据这个数据元素在何处、何时、由何人如何使用，来创建和命名数据元素\n\
    \n如果设计一个数据元素考虑了它在何时、何处使用，例如，“三月份发电量”、“四月份发电量”或“一号机组发电量”、“二号机组发电量”等，不仅严重地限制了这个数据元素的灵活性，还会使数据元素的数目无法控制，这些“名称”已不再是数据元素名\n\
    \n把握类别词与基本词的定义和数目，就能控制数据元素的定义准确性和总体数目。运用类别词表与基本词表分析数据元素集，可进一步标准化数据元素的命名和标识，辅助数据元素的一致性控制，并可大大压缩数据元素的总数\n\
    \n## 1.数据元素命名标准（7）\n\n- 需要注意“数据元素命名”和“数据元素定义”的区别。前者是给一个数据元素起名字，一般来说是一个词组；后者是给一个数据元素下定义，即用一句话确切界定\n\
    - 如果数据元素命名的词组结构和含义清晰，就不必再作定义，否则需要作定义。例如：\n- “员工总数”、“机组编号”和“合同签定日期”等数据元素名，不需要再作解释，已经很清楚了\n\
    - “发电设备容量”的定义是“统计期末发电机铭牌额定容量的总和”，“原煤耗用量”的定义是“统计期内用正平衡计算法计算的发电（供热）耗用的原煤数量”等，如果只有数据元素的命名，而无进一步的定义，就不能满足管理上的需要\n\
    - 数据元素的定义常常与专业技术术语解释相结合，甚至包括数据之间的关系或计算方法，这些都是在数据元素创建时应该加以注意的\n\n## 2. 数据元素标识标准\n\
    \n- 数据元素标识即数据元素的编码，是计算机和管理人员共同使用的标识\n- 数据元素标识用限定长度的大写字母字符串表达，字母字符可按数据元素名称的汉语拼音抽取首音字母，也可按英文词首字母或缩写规则得出\n\
    - 例如：\n\n| 数据元素名称 | 数据元素标识（汉语） | 数据元素标识（英文） |\n|---|---|---|\n| 申报开工日期 | SBKG\
    \ RQ | APL_ST_DT |\n| 设备数量 | SBSL | EQP_QTY |\n| 概算设备工程量 | GSSBGCL | EST_EQP_QTY\
    \ |\n|  | GJZBDM | KPI_CD |\n"
