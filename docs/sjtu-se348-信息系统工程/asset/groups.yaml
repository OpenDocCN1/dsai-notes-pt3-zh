    \  - ✓ 成品入库，库存管理，质量管理，包装等\n- ■ 处置阶段业务过程\n  - □ 交货，销售，订货服务，发运，付款，废品处理等\n"
  mdcn: "\n\n## 总体数据规划的组织\n\n![](img/66d4369fd16c75b43d6800360af39d15_684_0.png)\n\
    \n## 规划工作的时间规定\n\n- 自顶向下规划工作应该在六个月内完成\n  - 根据一些企业实际规划情况考察，只要有明确的方向并采取切实可行的规划方法，大多数总体数据规划工作都可在六个月内完成\n\
    \  - 在六个月内 **90%** 的规划工作可以完成，剩下的 **10%** 一般包括一些细微的枝节问题和一些不好马上解决的不确定问题。最重要的是，即使剩下一些细节问题未被解决，六个月后所得到的结果也是很有用的\n\
    \n## 企业模型（Enterprise Model）\n\n- □ 在自顶向下的规划中，第一步工作是建立一个企业模型或企业业务活动结构图\n- □ 企业模型代表了该企业在经营管理中具有的职能，是对企业结构和业务活动本质的、概括的认识\n\
    - □ 企业模型用“职能区域——业务过程——业务活动”这样的层次结构描述\n- □ 业务活动可以对照实体图中的实体加以引用。当数据需求反映到企业模型上时，实际得到的，是一个以数据为依据的企业模型，也就是企业模型的一个面向数据的版本，可以把它分解成多个需要实现的数据库\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_687_0.png)\n\n## 企业模型（Enterprise Model）\n\
    \n企业模型的设计过程可分为三个阶段\n\n- 设计一个表示企业各职能区域的模型\n- 扩展上述模型，使它能表示出企业的各项业务过程\n- 继续扩展上述模型，使它能表示企业各项业务活动\n\
    \n## 第3部分 企业模型\n\n- 职能区域\n- 业务过程\n- 业务活动\n- 企业模型的建立过程\n- 关键成功因素（CSF）\n\n## 职能区域（Functional\
    \ Area）\n\n- 也称为职能范围、业务范围，是指一个企业或组织中的一些主要业务活动领域，如工程、市场、生产、科研、销售等\n- 企业模型的一级结构是职能区域的识别、命名和定义\n\
