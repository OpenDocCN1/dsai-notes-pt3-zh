  - '[PAGE 981]


    # 编码对象的分类——B类


    # B类编码对象


    +   - 在信息系统中单独设立编码库表的信息分类编码对象，称之为B类编码对象

    +   - 这类码表内容具有相对的稳定性，可以组织力量一次编制出来。这类编码表一般都较大，像一些数据库表一样，在应用系统中往往被多个模块所共享，作为一些单独的库表管理是方便的。

    +   - 如国家行政区划编码、职称编码（国家标准）、生产统计项目编码（行业标准）、设备配件编码（企业标准）等，都是B类编码'
  - '[PAGE 982]


    # 编码对象的分类——C类


    +   □ C类编码对象


    在应用系统中有一些码表短小而使用频率很大的编码对象，如人的性别代码、文化程度代码和婚姻状况代码等，如果都设立编码库表，不仅系统运行时资源开销大（或内外存交换编码信息频繁），还给系统管理带来一系列的问题，把这类对象统一设一个编码库来管理就可以了'
