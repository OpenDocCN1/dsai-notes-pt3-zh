    \  - 分销企业中比较常见的现象\n  - 生产企业的供应商被要求的存货\n- 呆滞货物（包括过期、报废）的延迟处理\n  - 流通企业：过期、报废、退货\n\
    \  - 生产型企业：过期、报废、退货、弃用的材料\n- 超出实际能力的销售计划\n\n## 服务水平的管理\n\n设定服务水平分2个层次，缺一不可！\n\n\
    - ● 订单的完成时间\n  — 如，24小时送到，立等可取\n  金牌服务24小时响应（¥1000）/银牌服务36小时（¥600）\n  — 主要由订单收讫、信用审核、库存检查和确认，执行和交付等一系列的工作流程时间来决定\n\
    \n- ● 规定时间内的订单完成效果（Fill Rate）\n  — 如,98%按时交付,延时2小时的订单为5%(或2张订单)、断货单\n  — 主要由订单的处理时间和库存状况决定\n\
    \n## 库存计划的四个关键模型\n\n- 库存管理的核心思想\n- 库存计划的Q模型\n- 库存计划的P模型\n- 库存计划的(s，S)模型\n- 库存计划的(R，s，S)模型\n\
    - 订货批量计算的五种经典方法\n\n![](img/66d4369fd16c75b43d6800360af39d15_477_0.png)\n\n## 基本术语\n\
    \n- ● 再订货点（ROP）\n- ● 前置时间（LT）\n- ● 订货量（Q）\n- ● 需求量（D）\n\n![](img/66d4369fd16c75b43d6800360af39d15_478_0.png)\n\
    \n## 一种国际通性的分类\n\n|  | 连续性计划 | 定期性计划 |\n|---|---|---|\n| Min Max Model Optional\
    \ Replenishment Model | (s, S) | (R, s, S) |\n| Q model Perpetual Review Fixed\
    \ Order Quantity | (s, Q) | (R, S) |\n\nR model\nPeriodic Review\nRegular Time\
    \ Order\nFixed Interval Order\n\ns: 再订货点    S: 订足目标（Order-up-level）\n\nR: 计划间隔时间\
    \    Q: 订货量\n\nEOQ = √[ (2D × Co) / Ci ]\n\nROP = LT × D + SS（指安全库存）\n\n## 练习：计算ROP/EOQ\n\
    \nM公司是一家巧克力生产商，它需要从国外进口可可脂\n\n- Demand (D): average 11 tons per months（月均需求）\n\
    - Lead time（LT）：6 weeks（前置时间，周）\n- Safety stock: 2.4 tons（安全库存，吨）\n- Inventory\
    \ holding cost: 20% year（年持有成本）\n- Material cost: US$9,000/ton（物料成本）\n- Ordering\
    \ cost: US$1,000/order（订货成本）\n\n## （s，S）库存计划模型\n\n- ● 如果当前库存（OH）≤s，则订货至库存水准S\n\
    \n- ● （s，S）模型其实是一种再订货点模型（s，Q）的变种，也叫最大—最小模型或选择性补货系统\n\n![](img/66d4369fd16c75b43d6800360af39d15_483_0.png)\n\
    \nS=ROP\n\nS=ROP+EOQ\n\n## （R，s，S）库存计划模型\n\n- ● （s,S）又可以发展为（R,s,S）或（R,s,S,C）系统\n\
    \n- ● 每间隔时间R，对库存进行观测和计划，如届时库存（OH）≤s，则订货至库存水准S，否则不订货\n\n- ● （R,s,S）模型是（s,S）和（R,S）模型的融合\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_484_0.png)\n\ns=ROP\n\nS=ROP+EOQ\n\n\
    Q=S-I₀-transit\n\n## 订货批量（Lot Sizing）\n\n- ● **简单算法**\n  - 固定期间需求（Fixed Period\
    \ Demand，FPD）\n  - 周期性订货（Periodic Order Quantity，POQ）\n  - 批量对批量（Lot-for-Lot/Lot-4-Lot）\n\
    \n- ● **启发式算法**\n  - EOQ\n  - SM\n\n- ● **优化算法**\n  - Wagner-Within\n\n## 订货量计算的方法—Lot\
