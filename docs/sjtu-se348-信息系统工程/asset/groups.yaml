    # 物流典型定义——美国物流管理协会


    1963年成立时名称为“National Council of Physical Distribution Management (NCPDM)”。对物流管理（Physical
    Distribution Management）的定义：为计划、执行和控制原材料、在制品库存及制成品从起源地到消费地的有效率的流动而进行的2种或多种活动的集成。这些活动可能包括但不仅限于：顾客服务、需求预测、交通、库存控制、物料搬运、订货处理、零件及服务支持、工厂及仓库选址、采购、包装、退货处理、废弃物回收、运输、仓储管理。（定义了具体的物流活动）


    1985年下半年协会名称改为“The Council of Logistics Management (CLM)”。对物流（Logistics）的定义：是对货物、服务及相关信息从起源地到消费地的有效率、有效益的流动和储存进行计划、执行和控制，以满足顾客要求的過程。该过程包括进向、去向、内部和外部的移动以及以环境保护为目的的物料回收。（定义的表述更加灵活）


    1998年，对物流（Logistics）的定义：物流是供应链过程的一部分，是以满足客户需求为目的的，为提高货物、服务及相关信息从起源地到消费地进行有效率、有效益的流动和存储而对其进行计划、执行和控制。'
  md: "\n## 阿里的物流战略\n### 阿里的“天网”——“物流宝”\n\n2010年6月，淘宝网对外首推“大物流计划”，核心内容之一就是推出了物流宝平台，即由淘宝网联合国内外的仓储、快递、软件等物流企业组成服务联盟，提供一站式电子商务物流配送外包服务，解决商家货物配备（集货、加工、分货、拣选、配货、包装）和递送难题的物流信息平台。\n\
    \n在2011年的物流战略发布活动中，以物流宝为核心的物流信息管理系统的功能，又进一步被强化。阿里巴巴用“物流宝”汇集所有物流服务商的服务信息，将从生产商到消费者的物流链各环节合作伙伴整合起来，并“从上而下打通”。所谓“打通”，一是指商家完成网店前台和后台对接，一是整个物流宝平台也完成前台数据跟仓库管理系统对接。\n\
    \n“我们自己不会去用卡车运东西、也不会管仓库里边的作业，这些工作全部由合作伙伴完成。”淘宝网CFO张勇表示，阿里巴巴不会介入到硬件和整个作业层面的管理，不会跟物流服务商去抢饭碗，而是要做“信息服务集成商”\n\
    \n物流宝“可以整合订单的信息、商品的信息、以及物流作业的状态，包括物流结算的功能”，这意味着加盟物流企业自身业务运营的核心数据都需要向淘宝网做相当程度的开放。\n\
    \n可以掌控物流合作伙伴的业务运营数据，物流宝的这一功能，留下无穷的想象空间。物流宝信息平台，将集纳很多对市场更具指标价值的数据，未来有可能直接转化为阿里的另一个获利资源。\n\
    \n### 阿里的“地网”——“中国智能骨干网”(CSN)\n\n- 阿里巴巴集团董事会主席马云、CEO陆兆禧和阿里小微金融服务集团CEO彭蕾同时出现在CSN的发布会现场，足见阿里对此的重视程度。深圳市市长许勤、银泰集团董事长兼总裁沈国军、复兴集团董事长郭广昌、申通董事长陈德军等主要参与方的代表也均到场。沈国军出任“菜鸟网络”CEO，马云出任董事长。\n\
    - CSN的核心目的是依托城镇化的推进，在全国范围内建设物流仓储基地网络，并向所有的制造商、网商、快递物流公司、第三方服务公司开放、与产业链中的各个参与环节共同发展。\n\
    - 希望通过八到十年的建设，为中国物流行业打造出一个前所未有的智能物流骨干网络，使之能支持日均300亿（年度约10万亿，2012年淘宝与天猫的销售额已突破一万亿），让全国任何一个地区做到24小时内送货必达。第一期投资额1000亿人民币。\n\
    \n马云曾在一个非公开场合表示，这个智能物流骨干网，不是电子商务的基础设施，而是未来中国商务的基础设施。今天中国很多成功的企业不能支撑中国未来经济的发展，支撑中国未来经济发展的一定是我们今天没有听过的。未来的新型企业，是基于互联网思考、基于互联网技术、基于对未来判断成长起来的企业，并将支撑整个社会经济发展。打造中国智能物流骨干网就是通过构建一个新型网络物流枢纽，为中国未来商务建立基础设施。\n\
    \n马云感慨的说，“这个项目也许十年后会失败，万一搞成功了，今生无悔，作为民营企业可以参与国家基础设施的投资和建设。”\n\n中国智能骨干网的建设，可依托国家现有公路、铁路、机场等交通基础设施的布局和规划，建设遍布全国的现代化物流仓储网络，提升社会物流效率和基础设施利用率，同时，将带动地方经济的结构转型，推动内外贸型企业多渠道发展，促使更多产业电商化，促进资源优化配置。\n\
