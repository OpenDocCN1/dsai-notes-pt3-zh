    ![](img/66d4369fd16c75b43d6800360af39d15_612_0.png)


    +   约翰·柯林斯（John Collins）在为世界第一本信息工程专著所写的序言中说


    > “信息工程作为一个学科要比软件工程更为广泛，它包括了为建立基于当代数据库系统的计算机化企业所必需的所有相关的学科。”


