  - '[PAGE 614]


    # “信息工程”基本原理


    # 基本前提2


    数据是稳定的，处理是多变的。一个企业所使用的数据类很少变化。


    +   ✓ 稍具体一点说，数据实体的类型是不变的，除了偶尔少量地加入几个新的实体外，变化的只是这些实体的属性值。对于一些数据项集合，我们可找到一种最好的方法来表达它们的逻辑结构，即稳定的数据模型。这种模型是企业所固有的，问题是如何把它们提取出来，设计出来。这些模型在其后的开发和长远应用中很少变化，而且避免了破坏性的变化。在信息工程中，这些模型成为建立计算机化处理的坚实基础。


    +   ✓ 虽然企业的数据模型是相对稳定的，但是应用这些数据的处理过程却是经常变化的。事实上，最好是系统分析员和最终用户可以经常地改变处理过程。


    +   ✓ 只有建立了稳定的数据结构，才能使行政管理上或业务处理上的变化能被计算机信息系统所适应，这正是面向数据的方法所具有的灵活性，而面向过程的方法往往不能适应管理上的变化需要。'
