    \n- > 物流科学产生和发展\n- > 物流分类\n- > 物流系统组成\n\n## 物流概念产生的经济动因说\n\n1915年阿奇•萧（Arch Shaw）的《市场流通中的若干问题》（Some\
    \ Problems In Marketing Distribution，哈佛大学出版社）：\n\n- 将企业的流通活动分为创造需求的活动和物流活动，物流（The\
    \ Physical Distribution of Goods）是与创造需求不同的一个问题；\n- 创造需求和实物供给（物流）之间存在平衡性和相互依赖性两个原则，流通活动中的重大失误都是因为创造需求和物流之间缺乏协调造成的...\n\
    \n自从阿奇•萧的物流概念提出后，又经过70年左右的时间，物流管理有了明确的定义...\n\n![](img/66d4369fd16c75b43d6800360af39d15_371_0.png)\n\
    \n## Physical Distribution与Logistics\n\n|  | Physical Distribution | Logistics\
    \ |\n|---|---|---|\n| 概念出现最早时间 | 1915年，阿奇·萧《市场流通中的若干问题》 | 1905年，琼西·贝克解释 物流，二战获得大发\
    \ |\n| 最先使用的领域 | 流通领域 | 军事领域 |\n| 概念的外延关系 | 包含在Logistics中 | 包含Physical Distribution\
    \ |\n| 概念的内涵 | 为计划、执行和控制原材料、在制品库存及制成品从起源地到消费地的有效率的流动而进行的2种或多种活动的集成。 | 对货物、服务及相关信息从起源地到消费地的有效率、有效益的流动和储存进行计划、执行和控制，以满足顾客要求的过程。\
    \ |\n| 美国物流管理协会使用的名词 | 1963年成立到1985年下半年使用Physical Distribution；之后使用Logistics代替Physical\
    \ Distribution |  |\n\n## 物流典型定义——美国物流管理协会\n\n1963年成立时名称为“National Council of\
    \ Physical Distribution Management (NCPDM)”。对物流管理（Physical Distribution Management）的定义：为计划、执行和控制原材料、在制品库存及制成品从起源地到消费地的有效率的流动而进行的2种或多种活动的集成。这些活动可能包括但不仅限于：顾客服务、需求预测、交通、库存控制、物料搬运、订货处理、零件及服务支持、工厂及仓库选址、采购、包装、退货处理、废弃物回收、运输、仓储管理。（定义了具体的物流活动）\n\
    \n1985年下半年协会名称改为“The Council of Logistics Management (CLM)”。对物流（Logistics）的定义：是对货物、服务及相关信息从起源地到消费地的有效率、有效益的流动和储存进行计划、执行和控制，以满足顾客要求的過程。该过程包括进向、去向、内部和外部的移动以及以环境保护为目的的物料回收。（定义的表述更加灵活）\n\
    \n1998年，对物流（Logistics）的定义：物流是供应链过程的一部分，是以满足客户需求为目的的，为提高货物、服务及相关信息从起源地到消费地进行有效率、有效益的流动和存储而对其进行计划、执行和控制。\n\
