    \n- 这种将数据分成若干子系统的方法，并没有精确的算法，它需要人的判断力。只要任何一个子系统具有基本独立的职能或数据使用，那么它就应该被分开。只要有可能，就应该将大型复杂的系统分成若干子系统。这样，一个开发小组就能够比较容易地实施这个子系统。\n\
