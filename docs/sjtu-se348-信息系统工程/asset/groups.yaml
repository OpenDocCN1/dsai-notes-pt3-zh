    \ 简单反馈控制 微型计算机 集散控制计算机系统(DCS) 数据库 现代检测技术 先进控制系统 PLC、现场总线、智能仪表 局域网 工作站 多媒体 网络系统\
    \ 开放式平台 光纤网络 信息高速公路\n\n## 大“制造”\n\n“制造”的概念所涉及的范围扩大到了从订单处理、原材料采购、产品设计、工艺设计、调度与加工、产品装配、质量控制直至产品销售与售后服务、仓储管理、财务管理、人事管理等企业的各项活动，形成了大“制造”的概念。\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_143_0.png)\n\n## CIMS概念的完善\n\n人们在CIM实践过程中提出了多种不同的定义，表达了不同的认识和看法，CIM的概念也由此不断得到完善和发展\n\
    \n## 共同点\n\n覆盖范围实际整个企业的全部活动，分析和设计系统时必须站在企业的高度，全局观点\n\n## 差异点\n\n- 全盘自动化\n- 计算机是集成主体/工具\n\
    - 人在CIMS中处于什么地位\n\nCIM 不等于全盘自动化，计算机只是工具、手段，系统集成包括人的集成\n\n## CIMS定义\n\nCIM是一种概念，一种哲理，它指出了制造业应用计算机技术的更高阶段，在企业中将市场分析、经营决策、产品设计、制造过程各个环节乃至到销售和售后服务，包括原材料、生产和库存管理、财务资源管理等全部运营活动，在一种全局集成规划指导下，在更充分发挥人的集体智慧和合作精神的氛围中，关联起来集合成一个整体，逐步实现全企业的计算机化。\n\
    \n## CIMS的功能构成\n\n![](img/66d4369fd16c75b43d6800360af39d15_147_0.png)\n\n## CIMS的功能构成\n\
    \n4个功能分系统、2个支撑分系统\n\n### （1）管理信息系统\n\n以MRPII为核心，从制造资源出发，考虑企业进行经营决策的战略层、中短生产计划编制的战术层，其功能覆盖市场销售、物料供应、各级生产计划与控制、财务管理、成本、库存和技术管理等部分的活动，是以经营生产计划、主生产计划、物料需求计划、能力需求计划、车间计划、车间调度与控制为主体形成的闭环一体化生产经营和管理信息系统\n\
    \n## CIMS的功能构成\n\n### （2）工程设计自动化系统\n\n在产品开发过程中引入计算机技术，包括产品的概念设计、过程与结构分析、详细设计、工艺设计与数控编程。CAD、CAPP、CAM。\n\
    \n### （3）制造自动化系统\n\n制造现代化系统是在计算机的控制与调度下，按照NC代码将一个毛坯加工成合成的零件，再装配成部件以至产品，并将制造现场信息实时地反馈到相应部门。物流和信息流的结合点，最终产生经济效益的聚集地。\n\
    \n### （4）质量保证系统\n\n采集、存储、评价与处理设计、制造过程中与质量有关的大量数据，从而获得一系列控制环，并用这些控制环有效促进质量的提高，以实现产品的高质量、低成本、提高企业的竞争力\n\
    \n## CIMS的功能构成\n\n### （5）计算机通信网络\n\n支持CIMS各个分系统的开放型网络通信系统，采用国际标准和工业标准规定的网络协议，实现异种机互联、异构局部网络及多种网络互联。\n\
    \n### （6）数据库系统\n\n支持CIMS各个分系统并覆盖企业全部信息的数据库系统。在逻辑上是统一的，在物理上是分布的，以实现企业数据共享和信息集成。\n\
    \n## CIMS的发展状况\n——美国\n\n把保障国家安全，提高其工业在国际上的竞争力作为科技发展的战略方针，国防部、能源部、陆军器材部、航空航天部等政府部门都极为关注和重视CIM的进展状况，指定自身的CIM发展战略计划\n\
    \n| 时间 | 发展情况 |\n|---|---|\n| 1975年 | 美国空军制定空军计算机辅助制造计划AFCAM |\n| 1976年 | 美国工程师学会制定计算机辅助计划ICAM\
    \ |\n| 1985年 | 正式形成CIM计划，投资1亿美元 |\n| 1990年 | 道格拉斯飞机制造公司建成CIMS系统 |\n|  | HP、DEC信息网络为基础的开放式结构平台\
    \ |\n|  | 波音公司，777制造过程采用并行工程思想实施，组织了238个不同的工作组，采用数字化定义、数字化预装配（可装配）技术，实现无图纸生产，达到了无样机一次制造成功\
    \ |\n\n![](img/66d4369fd16c75b43d6800360af39d15_151_0.png)\n\n## 案例——波音公司\n\n\
    Boeing777是数字化设计与制造的典范，研发周期缩短研发周期缩短40%，工程返工减少50%\n\n![](img/66d4369fd16c75b43d6800360af39d15_152_0.png)\n\
    \n## CIMS的发展状况\n——美国\n\n美国普渡大学、里海等高校建立计算机智能集成和制造自动化研究中心、先进制造技术研究中心：生产管理模式、理念、总体技术、关键技术\n\
    \n- CIMS\n- 虚拟制造\n- 敏捷制造\n\n## CIMS的发展状况\n——欧盟\n\n1982年初，欧洲信息技术研究和发展计划ESPRIT\n\
    1984年 实施\n\n- 达到共识:\n- (1) CIM不是企业的最终目标，而是实现企业目标的一种手段\n- (2) CIM是人—机系统\n- (3)\
    \ 不断完善的过程，实施CIM没有最优解，只有满意解\n- (4) 集成并不意味着集中，集成是多方位、多层次的集成，分布控制的CIM比集中控制的CIM有更强的生命力和更高的柔性\n\
    \n## CIMS的发展状况\n——日本\n\n柔性制造系统 (FMS)\n工厂自动化 (FA) → 精良生产 (Lean Production)\n\n\
    ## CIMS的组成\n\n涉及人/机构、经营与技术三个方面要素的集成工程：\n\n## 四个方面的集成问题\n\n- (1) 使用技术支持经营\n- (2)\
    \ 使用技术支持人员的工作\n- (3) 协调机构/人员工作以支持经营\n- (4) 经营、人员、技术的集成\n\n![](img/66d4369fd16c75b43d6800360af39d15_157_0.png)\n\
    \n## CIMS四方面的集成\n\n### （1）使用技术支持经营\n\n以计算机技术、自动化技术、生产技术、信息技术等领域的成果为技术手段来支持企业完成预期的经营目标\n\
    \n### （2）使用技术支持人员的工作\n\n利用技术为企业生产、管理与经营过程中各种人员的工作提供支持，使他们能够协调一致地相互配合完成工作\n\n###\
    \ （3）协调机构/人员工作以支持经营\n\n通过调整组织结构，提高人员的综合素质支持企业的经营活动\n\n### （4）经营、人员、技术的集成\n\n统一管理追求经营、人员、技术等方面的集成和整体优化\n\
    \n## CIMS集成工作的三个阶段\n\nCIMS集成不等于各个单项技术简单叠加在一起\n\n全企业内全方位的综合过程被认为应该分为三个阶段\n\n- 物理系统的集成\n\
    - 应用集成\n- 经营集成\n\n![](img/66d4369fd16c75b43d6800360af39d15_159_0.png)\n\n## CIMS集成工作的三个阶段\n\
    \n### （1）物理系统的集成\n\n将制造自动化设备和数据处理设施用通信网络互连起来，将自动化岛沟通起来，使之能够互相交换数据和信息\n\n- 物理系统互连\n\
    - 网络配置与管理\n- 数据交换规则和惯例\n- 系统内部通信\n\n### （2）应用集成\n\n整个系统内各部分的应用软件及其用户之间的集成，包括人和机器之间的控制和信息的集成\n\
    \n- 公共(共享)数据资源\n- 公共服务执行环境\n- 可移动应用与分布系统\n\n## CIMS集成工作的三个阶段\n\n（3）经营和人的集成\n\n\
    从技术上实现包含三个方面：\n\n生产和过程的仿真\n\n对底层的生产过程，能进行物理过程动态调度的仿真和优化，对上层生产计划的安排与调整，能进行仿真统计分析，给决策者提供参考信息。\n\
    \n自动化的经营过程监控\n\n全企业范围内的综合数据采集和统计分析系统，具备数据统计和分析功能，使高层的经营人员能随时掌握整个过程的情况。\n\n基于知识的决策\n\
    \n数据库、模型库、知识库、方法库，帮助高层的决策者科学地完成决策过程。\n\n## CIMS的功能构成\n\n- 工程设计分系统\n  - CAD子系统\n\
    \  - CAPP子系统\n  - CAM子系统\n- 经营管理分系统\n  - MRP/MRPⅡ/ERP/SCM\n- 制造自动化分系统\n- 质量保证分系统\n\
    - 支撑系统\n  - 计算机网络\n  - 数据库系统\n"
