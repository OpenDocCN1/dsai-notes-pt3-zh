    ## ——第三利润源


    > 据美国的一份调查报告表明，产品制造成本已不足总成本的10%；产品的加工时间只占总时间的5%（储存、搬运、运输、销售、包装等作业占95%的时间）。


    ![](img/66d4369fd16c75b43d6800360af39d15_353_0.png)


    ## 各国日益重视物流产业


    ![](img/66d4369fd16c75b43d6800360af39d15_354_0.png)


    欧美国家社会物流总成本一般相当于GDP的12%；随着物流管理的现代化和合理化，这个比例还有下降趋势。以美国为例，1980年物流成本相当于GDP的17.2%，1989年则为12.1%，到1995年则降低到9%。


    我国物流成本占GDP比例高达20%！！！


    ## 物流产业的战略地位


    - 2008年，我国社会物流总额达89.89万亿元，每1个单位的GDP需要3个单位的物流量来支撑。

    - 2008年，我国物流业增加值占全部服务业增加值的比重为16.5%；物流业每增加6.06个百分点，就可以带动服务业增加一个百分点。

    - 2008年，我国社会物流总费用占GDP的比率为18.1%，比发达国家高出一倍左右；这个比率每降低一个百分点，就等于创造3000亿元的经济价值。

    - 目前，我国物流业现有从业人员约2000万人；物流业每增加一个百分点，就可以新增10万个就业岗位。

    - 以上数据表明，物流业是国民经济的重要支撑，是调整结构的重要手段，是提高效益的重要途径，是扩大就业的重要渠道。

    - 物流业纵贯商品生产、流通和消费各个环节，横跨国民经济各个产业，是衡量一个国家现代化水平与综合国力的重要标志。


    ## 黄金白领


    现代物流人才成为“黄金白领”


    上海颁布人才开发专业目录，现代物流人才被列为上海急需引进的紧缺人才之一


    ![](img/66d4369fd16c75b43d6800360af39d15_357_0.png)


