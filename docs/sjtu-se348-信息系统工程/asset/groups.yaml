    商流：对象物所有权转移的活动，或称为贸易或交易。商流中既有贸易决策，又有具体业务和财物的处理，具体包括市场需求预测、计划分配与供应、货源组织、订货、采购调拨、销售等。


    物流：对象物从供应方向需求方的转移活动。不同于加工活动，物流不改变物的形质效用，但能创造时间和空间价值。'
