    # # 重心法


    **重心法**是借用重心数学意义上的技巧，进行供应链结点位置决策的方法。通常其目标是追求最低的运输成本。


    ![](img/66d4369fd16c75b43d6800360af39d15_521_0.png)


    这里的重心并不是严格意义上的重心，因为用这种方法选址，运输成本不仅与结点的相对距离有关，还与运输量、运输费率等因素有关。


    通常并不是将上述所有因素一起考虑的。根据考虑因素的不同，重心法可以分为以下四类问题：


    +   - 运输量—重心法

    +   - 运输距离—重心法

    +   - 运输量—运输距离—重心法

    +   - 运输量—运输距离—运输费率—重心法'
  - '[PAGE 522]


    # 运输量—重心法（单设施选址）


    假设现在要建一座配送中心以向 n 个零售商供货：


    +   - 零售商在平面上坐标 \((x_1,y_1)，(x_2,y_2)，…，(x_n,y_n)\)

    +   - 零售商的装运量分别为 \(q_1，q_2，…，q_n\)


    依下式算出的配送中心位置 \((x,y)\) 使分销运输成本和最小


    ![](img/66d4369fd16c75b43d6800360af39d15_522_0.png)'
  - '[PAGE 523]


    # 运输量—重心法算例


    问题：假设在市区建一配送中心，给位于东、西、南、北、中五区的商场配送，各商场的位置及配送量如表所示。用重心法求出配送中心的位置坐标。


    | 区别 | 位置 | 配送量（吨） |

    | --- | --- | --- |

    | 东 | 10, 4 | 4000 |

    | 西 | 2, 3 | 8000 |

    | 南 | 7, 0 | 10000 |

    | 北 | 5, 8 | 8000 |

    | 中 | 6, 4 | 20000 |'
  - '[PAGE 524]


    # 运输量—重心法算例


    假设在市区建一配送中心，给位于东、西、南、北、中五区的商场配送，各商场的位置及配送量如表所示：


    | 区别 | 位置 | 配送量（吨） |

    | --- | --- | --- |

    | 东 | 10, 4 | 4000 |

    | 西 | 2, 3 | 8000 |

    | 南 | 7, 0 | 10000 |

    | 北 | 5, 8 | 8000 |

    | 中 | 6, 4 | 20000 |


    X̄ = (4,000 × 10 + 8,000 × 2 + 10,000 × 7 + 8,000 × 5 + 20,000 × 6) / (4,000 +
    8,000 + 10,000 + 8,000 + 20,000) = 5.72

    Ȳ = (4,000 × 4 + 8,000 × 3 + 10,000 × 0 + 8,000 × 8 + 20,000 × 4) / (4,000 +
    8,000 + 10,000 + 8,000 + 20,000) = 3.68'
  - '[PAGE 525]


    # 运输量—运输距离—运输费率—重心法


    假设现在要建一座配送中心以向 n 个零售商供货，令 n 个零售商在平面上的坐标为 (X₁,Y₁)，(X₂,Y₂)，…，(Xₙ,Yₙ)，各零售商的装运量分别为
    Q₁,Q₂,…,Qₙ，配送中心到各零售商的运输距离分别为 D₁,D₂,…,Dₙ，配送中心到各零售商的运输费率分别为 R₁,R₂,…,Rₙ，则配送中心的位置坐标
    (X,Y) 可以通过下面一组方程确定


    ```

    MinTC = Σᵢ=1ⁿ Qᵢ Rᵢ Dᵢ

    ```


    ```

    X = Σᵢ Qᵢ Rᵢ Xᵢ / Dᵢ / Σᵢ Qᵢ Rᵢ / Dᵢ

    ```


    ```

    Y = Σᵢ Qᵢ Rᵢ Yᵢ / Dᵢ / Σᵢ Qᵢ Rᵢ / Dᵢ

    ```


    ```

    Dᵢ = [(Xᵢ − X)² + (Yᵢ − Y)²]¹/²

    ```


