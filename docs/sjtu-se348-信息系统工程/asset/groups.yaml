  - '[PAGE 116]


    # 霍顿(F.W.Horton)：

    信息资源管理(IRM)理论


    +   - 企业的信息资源与其它资源有同等地位，IRM是一种新的管理职能；

    +   - 必须将IRM与企业的战略规划联系起来，把信息资源作为战略资产进行管理，在企业的每个层面上识别信息资源和获利机会，并借以构建新的竞争优势；

    +   - 企业IRM的目标是“3E”：Efficient（高效）、Effective（实效）、Economical（经济）。'
  - '[PAGE 117]


    # 威廉·德雷尔(William Durell)：

    数据管理 (DA)理论与实践


    +   - 没有卓有成效的数据管理，就没有成功高效的数据处理，更建立不起来整个企业的计算机信息系统；

    +   - 数据元素是最小的信息单元，数据管理工作必须从数据元素标准化做起；

    +   - 企业数据管理部门的重要职责，是集中控制和管理数据定义，建立全企业数据管理基础标准和规范化的数据结构，协调计算机应用开发人员和用户实施数据管理标准规范；

    +   - 数据管理是企业管理的重要组成部分，是长期复杂的工作，会遇到许多困难，持之以恒才能见到效果。'
