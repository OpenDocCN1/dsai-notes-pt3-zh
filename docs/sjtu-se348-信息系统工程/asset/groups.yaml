    信息资源管理的思想、方法 and 实践，对信息时代的企业管理具有重要意义：


    +   为提高企业管理绩效提供了新的思路。“过去在生产中遇到困难问题，想到的解决办法有三条：一是增加人力，二是增加设备，三是增加资金。信息资源管理，提供了另外一条——通过信息资源的优化配置和运用，改进管理，增加生产力”


    +   确立了信息资源在企业中的战略地位。信息不仅是共享性资源，而且还是企业的战略性资源，对企业生存和发展具有重要意义


    +   支持企业参与市场竞争。企业为了在激烈的市场竞争中求生存、求发展，必须加强信息化建设，通过掌握信息、依靠信息、运用信息而提高企业的竞争力。


    +   成为知识经济时代企业文化建设的重要组成部分。知识管理是信息管理发展的新阶段，它主要通过知识的共享和推广应用，提高企业的应变能力和创新能力。信息资源的有效管理必然使信息和信息技术渗透到企业的各部门，影响到所有员工的工作与生活，使信息文化融入企业文化之中，丰富了企业文化建设的内容，这对提高员工的信息意识和信息技能，增强企业凝聚力和核心竞争力是有重要意义的


    ## 政府部门首先出现“CIO”


    +   信息主管（CIO）的出现，是企业信息资源管理发展到一定阶段的必然产物，CIO是信息获得了战略资源地位所必需的管理岗位。


    +   1980年美国政府颁布了《文书削减法案》，明确提出“信息资源管理”的概念，并对信息管理工作提出了具体要求。该法案的诞生，反映出人们认识到综合应用信息技术、提高信息产品质量的重要性，同时认识到信息管理工作是提供战略信息的关键。


    +   1984年，美国总统负责的委员会收到了一份关于信息差距的调查报告，该报告指出：“政府拥有太多的错误信息，太少的正确信息...”，调查者声称发现一种“结构真空”，即政府中无人去协调管理信息的选择和流通。该委员会提出的解决办法是，在政府的每一级机构中设立一名主管信息资源的高级官员，从比较高的层次上全面负责本部门信息资源的管理、开发与利用，直接参与最高决策管理。


    +   此后，美国、加拿大等国家政府中都增设了“信息部长或“信息大臣”一职，而且还在政府各部门设立了 CIO职务。CIO出现之后，有效地改善和加强了政府部门的信息资源管理。

