  - '[PAGE 984]


    # 信息分类编码标准的建立过程


    +   在企业信息系统建设之初，就应该注意信息分类编码工作，应该设置专门的信息分类编码工作小组


    +   在总体数据规划过程中，通过对全企业的信息需求分析，建立起全企业的信息资源管理标准和稳定的数据模型，这是系统建设成功的关键


    +   用户分析员和系统分析员在建立数据元素标准时，就要识别出哪些数据对象具有分类编码意义，按该对象的什么属性或特征进行分类编码，并把这些成果和资料提交给信息分类编码小组


    +   信息分类编码小组首先要调查这些编码对象是否有国际、国家或行业标准，以及在本组织和外单位的应用情况。有上级标准的就要使用上级标准，入没有上级标准，可自行根据编码对象的某些属性或特征，依照信息分类编码原理和方法进行分类编码'
