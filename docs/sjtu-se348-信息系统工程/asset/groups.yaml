  md: "\n## 工作方式变革\n## 烟草行业的一号工程——“一打两扫”\n\n“一号工程”名称的由来\n\n系统是烟草行业有史以来第一个贯穿整个行业的信息系统。\n\
    \n更为重要的涵义则在于它作为“一把手工程”的地位，这个项目由国家局局长姜成康亲自主抓，副局长李克明任项目领导小组组长，信息中心主任高锦任副组长，各单位负责人是领导小组成员，而且国家局还为这个项目专门抽调有关部门人员成立了项目实施办公室，由计划司综合处处长刘融任主任，信息中心系统处原处长王金亮任副主任。\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_25_0.png)\n\n## 工作方式变革\n## 烟草行业的一号工程——“一打两扫”\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_26_0.png)\n\n图1 一号工程码的构成和具体内容\n\n-\
    \ 1 中国烟草总公司图标\n- 2 \"检验合格\"字样\n- 3 \"检验合格\"边框\n- 4 \"中国烟草\"中文字样\n- 5 \"CHINA TOBACCO\"\
    英文字符\n\n- 6 生产信息字符：位于条码序号上方，共20位数字。1-10表示生产时间，如0910161041代表09年10月16日10:41时；11-13位表示手码；14-15位表示自动打码机或条码打印机设备号；16位表示班次[A-甲班，B-乙班，C-丙班，D-丁班，R-日班]；17-20位表示流水号\n\
    - 7 条码序号\n- 8 供人识别的字符：共30位数字。1-6位引用行业类产品代码对应件号代码的后六位，记录件号烟根号信息；7-14位引用《烟草行业组织机构代码》，记录条烟产地；15-20表示生产日期，如091016代表2009年10月16日；21位代表经营方式(0-自产自销；1-内销；2-海外外销；3-来料加工；4-供出口；5-出口)；22-30位表示随机数，保证件箱的唯一性\n\
    - 9 表示标准字符(91)\n\n## 产品数字跟踪\n\n- 计划取码\n\n按照行业卷烟生产年度计划及各省分解的季度生产计划对每件卷烟统一制定编码和身份标识，由生产企业根据排产计划自动取码\n\
    - 物流跟踪\n\n通过对每件卷烟产品从下线、入库（厂）、商业分公司到货确认等几个关键环节数据的自动采集（一打两扫），保证整个系统基础数据采集的及时、准确\n\
    - 到货确认\n\n通过商业分公司的实物到货确认实现与合同、准运证的实物对应，实现物流和信息流的统一，加强烟草专卖管理\n\n## 工作方式变革\n烟草行业的一号工程——“一打两扫”\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_28_0.png)\n\n## 一号工程延伸——两打三扫\n\n通过“一点两级四员”，搭建了国家局、工商企业之间畅通的信息通道，形成了行业信息基础平台\n\
    \n![](img/66d4369fd16c75b43d6800360af39d15_29_0.png)\n\nwww.echinatobacco.com\
    \ 通过该项信息采集实现全覆盖，掌握并及时采集各类实物数据，构建了行业条码流转系统\n\n## 打码到条——两打三扫\n\n- 32位条烟编码分为上下两行\n\
    - 第一行的16位为数字\n- 码段前16位为配送日期和卷烟代码，\n- 第二行的16位由四个英文字母加12位数字构成。\n- 后16位为烟草公司和卷烟零售户信息。\n\
    - 具体规则\n- 1）分拣日期：前5位，格式为：YMMDD，第1位表示年，第2-3位表示月，第4-5位表示日\n- 2）件码派生号：第6—16位，前9位为卷烟所在件烟的唯一识别码，后2位是从“01-50”的条烟顺序号\n\
    - 3）自定义信息：第17—20位，共4位数字或字母，由商业公司自行定义打码的内容，只能是4位字母或阿拉伯数字。一般为所在地区烟草拼音缩写。如：“DGYC”为“东莞烟草”\n\
    - 4）零售户信息：第21—32位，共12位数字，即零售户国家局编码。零售户国家局编码的前6位为行政区域代码（GB/T2260），第7位为零售户企业性质（“1”代表个体工商户，“2”代表企业、组织或其他），最后5位为流水顺序号\n\
    \n## 打码到条——两打三扫\n\n- □ 条烟32位编码示例\n- ■ “3071046809733201\n- ■ xyy c360502104957”\n\
    - ■ 前五个数字“30710”代表配送日期2013年7月10日；第6至14位一共9个数字“468097332”是该条卷烟所属件烟件码的最后9位，以此可以通过烟草行业“一号工程”确定件烟的相关信息；第15和16位是代表这条烟在所属件烟中的序号，从01至50不等；第17至20位“xyyc”是该地市烟草公司名称“新余烟草”拼音的缩写；第21至26位“360502”是该地市的行政区域国标代码，可以通过国家统计局官网公布的“全国最新行政区划代码表”对照查询；第27至32位“104957”是零售户代码，即该零售户烟草专卖零售许可证号的后6位。\n\
    \n## 再创新的过程\n\n![](img/66d4369fd16c75b43d6800360af39d15_32_0.png)\n\n## 再创新的过程\n\
