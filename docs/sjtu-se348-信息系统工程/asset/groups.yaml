  md: "\n## 目标：高效率开发高质量软件产品\n\n- 软件工程活动是“生产一个最终满足需求且达到工程目标的软件产品所需要的步骤”，包括需求、设计、实现、确认以及支持等活动。\n\
    \  - 需求活动包括问题分析和需求分析\n    - 问题分析获取需求定义，又称软件需求规约\n    - 需求分析生成功能规约\n  - 设计活动一般包括概要设计和详细设计\n\
    \    - 概要设计建立整个软件体系结构，包括子系统、模块以及相关层次的说明、每一模块接口定义\n    - 详细设计产生程序员可用的模块说明，包括每一模块中数据结构说明及加工描述\n\
    \  - 实现活动把设计结果转换为可执行的程序代码\n  - 确认活动贯穿于整个开发过程，实现完成后的确认，保证最终产品满足用户的要求\n  - 支持活动包括修改和完善\n\
    \  - 伴随以上活动，还有管理过程、支持过程、培训过程等\n\n## 框架：开发模型、设计方法、工程支持、过程管理\n\n软件工程围绕工程设计、工程支持以及工程管理，提出了以下四项基本原则：\n\
    \n- 第一，选取适宜开发模型。在系统设计中，软件需求、硬件需求以及其他因素之间是相互制约、相互影响的，经常需要权衡。因此，必须认识需求定义的易变性，采用适宜的开发模型予以控制，以保证软件产品满足用户的要求。\n\
    - 第二，采用合适的设计方法。在软件设计中，通常要考虑软件的模块化、抽象与信息隐藏、局部化、一致性以及适应性等特征。合适的设计方法有助于这些特征的实现，以达到软件工程的目标。\n\
    - 第三，提供高质量的工程支持。“工欲善其事，必先利其器”。在软件工程中，软件工具与环境对软件过程的支持颇为重要。软件工程项目的质量与开销直接取决于对软件工程所提供的支撑质量和效用。\n\
    - 第四，重视开发过程管理。软件工程的管理，直接影响可用资源的有效利用，生产满足目标的软件产品，提高软件组织的生产能力等问题。因此，仅当软件过程得以有效管理时，才能实现有效的软件工程。\n\
    \n## 框架：开发模型、设计方法、工程支持、过程管理\n\n- 这一软件工程框架告诉我们，实施一个软件工程要选取适宜的开发模型，要采用合适的设计方法，要提供高质量的工程支撑，要实行开发过程的有效管理\n\
    \n- 软件工程活动主要包括需求、设计、实现、确认和支持等活动，每一活动可根据特定的软件工程，采用合适的开发模型、设计方法、支持过程以及过程管理\n\n-\
    \ 根据软件工程这一框架，软件工程学科的研究内容主要包括\n  - 软件开发模型\n  - 软件开发方法\n  - 软件过程\n  - 软件工具\n  -\
    \ 软件开发环境\n  - 计算机辅助软件工程(CASE)\n  - 软件经济学等\n\n## “软件工程”的局限性\n\n- “软件工程”是指一套用于计算机软件的规范说明、设计和编程的规则\n\
    - 软件工程方法于20世纪70年代正式形成，它包含着一套软件开发的方法，诸如结构化程序设计，结构化系统设计和结构化系统分析，以及支持这些工作的软件工具。在建立具有复杂逻辑关系的复杂软件中，它们是至关重要的。\n\
    - 然而，在很多数据处理系统中，采用适当的数据库技术，逻辑关系的设计会变得相对简些。但是，要想有效地用软件工程方法建立完善的数据库和数据处理系统，那是非常困难的。\n\
    \n## 第1部分 信息工程的原理、方法和工具\n\n- □ 软件工程\n- □ 信息工程\n- □ 信息工程vs软件工程\n- □ 信息工程的三大部分\n\
    \n## “数据处理危机”引发“信息工程”\n\n传统的 数据处理开发方法所遭到的一些失败，也是这种危机的表现：\n\n- IBM公司为日本的两家报社搞自动化系统，总编辑在终端上如何工作的问题一直搞不清楚，使IBM公司损失200万美元\n\
    - 这些无畏的开发者不懈努力，在几年后使美国的新闻管理工作自动化，设计文档资料竟达2400页\n\n这使人们开始怀疑，从需求分析开始的传统的生命周期开发方法论，是否符合大型复杂信息系统的开发？\n\
    \n在这个背景下，以詹姆斯·马丁（James Martin）为代表的美国学者建立了用于指导信息系统开发的“信息工程”方法论\n\n## “信息工程”\n\n\
    - 信息工程是建立企业级计算机信息系统的工程。它是指在一个大中型企业和政府部门，或一个科技、教育、医疗机构中，为建立计算机化的信息系统，进行规划、分析、设计和构成的一整套的、相互关联的、采用正规化、自动化技术的系统工程\n\
    \n- 它是把大量机构创建成功的信息系统所使用的各种方法、技术和工具汇总到一起，加以提高和规范，进而升华为行之有效的开发企业级综合信息系统的成套工作标准和规范。\n\
    \n- 信息工程是在软件工程基础上发展起来的，它也使用软件工程中使用的一些图表；然而，它又是软件工程在更高层次上的、更综合、更复杂程度上的提升与扩展。\n\n\
    信息工程\n基本内容是由计算机所存放和维护的数据以及由数据所提炼出的信息\n\n软件工程\n基本内容是用在计算机化处理中的逻辑关系\n\n## “信息工程”学科和方法论的创立\n\
    \n- 詹姆斯·马丁(James Martin) 总结了这一时期数据处理发展的正反两方面经验，在有关数据模型理论和数据实体分析方法的基础上，再加上他发现的企业数据处理中的一个基本原理——数据类和数据之间的内在联系是相对稳定的，而对数据的处理过程和步骤则是经常变化的，于1981年出版了《信息工程》一书，提出了信息工程的概念、原理和方法，勾画了一幅建造大型复杂信息系统所需要的一整套方法和工具的宏伟图景。\n\
    \n- 1982年出版了《总体数据规划方法论》一书，对信息工程的基础理论和奠基性工作—总体数据规划方法，从理论上到具体作法上详加阐述。\n\n- 经过几年的实践和深入研究，詹姆斯·马丁于80年代中期又出版了《信息系统宣言》一书，对信息工程的理论与方法加以补充和发展，特别是关于自动化的自动化思想，关于最终用户与信息中心的关系，以及用户在应用开发中应处于恰当位置的思想，都有充分的发挥；同时加强了关于原型法（Prototyping）、第四代语言和应用开发工具的论述；最后，向与信息工程有关的各类人员，从软件公司到计算机制造商，提出了各自的“宣言”(Manifesto)，实际上是一系列关于建设高效率高质量的复杂信息系统的经验总结。\n\
    \n## “信息工程”概念\n\n![](img/66d4369fd16c75b43d6800360af39d15_612_0.png)\n\n- 约翰·柯林斯（John\
    \ Collins）在为世界第一本信息工程专著所写的序言中说\n\n> “信息工程作为一个学科要比软件工程更为广泛，它包括了为建立基于当代数据库系统的计算机化企业所必需的所有相关的学科。”\n\
    \n- 从这一定义中可以看出这样三个基本点\n\n- 信息工程的基础是当代的数据库系统\n\n- 信息工程的目标是建立计算机化的企业管理系统\n\n- 信息工程的范围是广泛的，是多种技术、多种学科的综合\n\
    \n这自然要联系到软件工程，马丁认为，软件工程仅仅是关于计算机软件的规范说明、设计和编制程序的学科，实际上是信息工程的一个组成部分\n\n## “信息工程”基本原理\n\
