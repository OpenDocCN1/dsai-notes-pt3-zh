    \n## 实体分析应注意的问题\n（1）自顶向下的规划与自底向上的设计相结合问题\n\n- 自顶向下的规划应该主要考虑生产率，消除重复的应用程序和维护工作，重新组织公司的业务流程和组织结构，以获得更高的效率\n\
    - 自底向上的设计应该考虑稳定性、第三或第四范式设计、最终用户语言、降低维护成本、灵活性和未来应用程序的快速开发等等\n- 自顶向下的绘制实体图和自底向上的建立详细数据模型，可以起到相互参照的作用。实体分析阶段所确定的属性或所收集的资料能够被用于建立详细数据模型的工作使用\n\
    \n## 实体分析应注意的问题\n（2）关于研究范围的控制问题\n\n- 在开始进行实际分析研究时，必须决定所要研究的组织的范围。对于小的企业应当研究整个企业，对于大型企业，要一部分一部分地进行研究\n\
    - 要求实体分析尽可能简单的一个原因，是为了使得能够对组织中尽可能大的范围进行研究，这样做是为了要能够在尽可能大的范围内发现共同的实体\n\n## 实体分析应注意的问题\n\
    （2）关于研究范围的控制问题\n\n- 在开始进行实际分析研究时，必须决定所要研究的组织的范围。对于小的企业应当研究整个企业，对于大型企业，要一部分一部分地进行研究\n\
    - 要求实体分析尽可能简单的一个原因，是为了使得能够对组织中尽可能大的范围进行研究，这样做是为了要能够在尽可能大的范围内发现共同的实体\n\n## 实体分析应注意的问题\n\
    （3）关于重复处理问题\n\n- 在大多数公司中数据变得非常混乱，当对其进行全面协调的分析时，结果是令人震惊的。而且数据处理逻辑也非常混乱，会有很多不必要的重复。互不联系的系统分析人员，各自开发出自己的处理程序，而没有意识到他们在互相重复着别人的工作\n\
    - 例如，在一家小型纺织公司中，发现有9项独立的活动在处理到货业务，实际上每项活动都进行一系列相同的作业，产生一个到货记录。公司中有好几个地方都接收货物，先后为每一个收货地点都设计了有关的表格和单据，并且开发了不同的应用程序来处理这些单据。因此，产生了9套应用程序。这9项活动粗看起来都有一些细微差别，但是，在仔细研究了单据上的数据之后，可以看出，它们实际上是相同的，实际上一个套系统就够了，这9套应用程序会带来维护成本\n\
    - 实体分析目标之一应该是尽可能消除不必要的重复处理\n\n"
