    # 离散制造过程与流程生产过程操作模式比较


    | 比较因素 | 离散制造过程 | 流程生产过程 |

    |---|---|---|

    | 操作工况 | 常规环境 | 通常在高温、高压、低温、真空、易燃、易爆、有毒的恶劣工况下 |

    | 缓冲单元 | 生产线存在某些缓冲单元 | 一般没有中间缓冲单元，设备启停、正常操作和紧急处理步骤复杂 |

    | 操作监控要求 | 一般 | 很强的实时性要求 |

    | 操作参数 | 一般为物理几何参数，状态可以由人工观测 | 以热工参数、组分参数为主，状态不能直接观测，操作参数量很大 |

    | 操作经济目标 | 缩短供货周期，提高设备利用率 | 强调操作整体性，实现均衡、安全、长周期、高效、低能耗生产，保证产品质量 |

    | 产品设计 | 生产重要环节，通过并行工程，在生产过程中进行 | 比重很小，通常与生产过程分离，单独进行 |

    | 控制方式 | 遵循分层管理与控制 | 集中管理/分散控制 |

    | 操作干扰 | 强度低 | 随机的、不确定的干扰情况普遍存在 |

    | 优化手段 | 调整生产计划，分配负荷，优化排序 | 调整工艺参数，达到最优工况 |

    | 柔性操作代价 | 一般通过选择不同的加工设备及夹具进行柔性操作，主要以时间为代价，时间较短代价低 | 流程切换后需进行设备及管线的清洗、再次开车周期较长，生产在稳定未达标前，原料、能量存在浪费，柔性切换操作时间较长，切换成本大
    |'
