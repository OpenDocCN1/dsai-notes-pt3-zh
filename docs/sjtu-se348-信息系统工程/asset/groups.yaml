    # 工作方式变革


    # 烟草行业的一号工程——“一打两扫”


    “一号工程”名称的由来


    系统是烟草行业有史以来第一个贯穿整个行业的信息系统。


    更为重要的涵义则在于它作为“一把手工程”的地位，这个项目由国家局局长姜成康亲自主抓，副局长李克明任项目领导小组组长，信息中心主任高锦任副组长，各单位负责人是领导小组成员，而且国家局还为这个项目专门抽调有关部门人员成立了项目实施办公室，由计划司综合处处长刘融任主任，信息中心系统处原处长王金亮任副主任。


