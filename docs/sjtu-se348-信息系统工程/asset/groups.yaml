    +   在按规定要求大量制造的零件或部件中，任取一个，不经挑选或修配，就能装配到机器当中，并达到规定的配合要求，零件的这种性质称为零件的互换性。


    ![](img/66d4369fd16c75b43d6800360af39d15_227_0.png)'
  - '[PAGE 228]


    # 机械加工精度定义


    +   - 机械加工精度是指零件加工后的实际几何参数（尺寸、形状和位置）与理想几何参数相符合程度。它们间的差异称为加工误差。加工误差的大小反映了加工精度的高低。误差越大加工精度越低，误差越小加工精度越高。

    +   - 加工精度包括三个方面内容：

    +     - 尺寸精度——指加工后零件的实际尺寸与零件尺寸的公差带中心的相符合程度。用尺寸公差度量。

    +     - 形状精度——指加工后的零件表面的实际几何形状与理想的几何形状的相符合程度。用形状公差度量。

    +     - 位置精度——指加工后零件有关表面之间的实际位置与理想。用位置公差度量。'
  - '[PAGE 229]


    # 尺寸公差


    公差的基本术语


    +   - 基本尺寸 设计给定的尺寸，如Φ50。

    +   - 实际尺寸 通过测量所得的尺寸

    +   - 极限尺寸 允许尺寸变化的两个极限值，它以基本尺寸为基数来确定。

    +   - 最大极限尺寸 两个极限尺寸中较大的一个尺寸称，如轴为Φ50，孔为Φ50.007；

    +   - 最小极限尺寸 较小的一个尺寸称如轴为Φ49.984，孔为Φ49.982'
  - '[PAGE 230]


    # 机械加工精度的标注


    ![](img/66d4369fd16c75b43d6800360af39d15_230_0.png)'
  - '[PAGE 231]


    # 机械加工精度等级与加工方法


    +   - 精度等级分20个等级

    +     - IT01、IT0、IT1~IT18

    +     - 一般加工精度在IT01~IT15，常常应用精度为IT5~IT12


    +   1. 一般车床的加工精度可达 IT8~IT7，表面粗糙度为 Ra25~Ra1.6。

    +   2. 钻床用扩钻的加工精度可达 IT13~IT11，表面粗糙度 Ra80~Ra20；用于扩孔精度达 IT10，表面粗糙度 Ra10~Ra5；用于铰孔精度可达
    IT7，表面粗糙度 Ra5~Ra1.25。

    +   3. 铣床加工精度一般为 IT9~IT8，表面粗糙度为 Ra6.3~Ra1.6。

    +   4. 刨床加工精度为 IT9~IT8，表面粗糙度为 Ra25~Ra1.6。

    +   5. 磨床加工精度一般为 IT6~IT5，表面粗糙度为 Ra0.8~Ra0.1。'
  - '[PAGE 232]


    # 表面粗糙度定义


    评定加工过的材料表面由峰、谷和间距等构成的微观几何形状误差的物理量。常用评定参数可分为高度参数、间距参数和形状参数（综合参数）三个系列。


    ![](img/66d4369fd16c75b43d6800360af39d15_232_0.png)'
  - '[PAGE 233]


    # 表面粗糙度等级


    ![](img/66d4369fd16c75b43d6800360af39d15_233_0.png)


    +   □ Ra是在采样长度内，轮廓偏距绝对值的算术平均值


    +   ■ 0.012、0.025、0.050、0.100、0.20、0.40、0.80、1.6、3.2、6.3、12.5、25、50、100


    +   ■ 1.6表示表面最高点与最低点的平均值差为1.6μm


    +   □ 要正确、合理地选用表面粗糙度数值


    +   ■ （1）工作表面比非工作表面的粗糙度数值小。


    +   ■ （2）摩擦表面比不摩擦表面粗糙度数值小。摩擦表面的摩擦速度越高，所受的单位压力越大，则应越高；滚动摩擦表面比滑动摩擦表面要求粗糙度数值小。


    +   ■ （3）对间隙配合，配合间隙越小，粗糙度数值应越小；对过盈配合，为保证连接强度的牢固可靠，载荷越大，要求粗糙度数值越小。一般间隙配合比过盈配合粗糙度数值要小。


    +   ■ （4）配合表面的粗糙度应与其尺寸精度要求相当。配合性质相同时，零件尺寸越小，则应粗糙度数值越小；同一精度等级，小尺寸比大尺寸要粗糙度数值小，轴比孔要粗糙度数值小（特别是IT8～IT5的精度）。


    +   ■ （5）受周期性载荷的表面及可能会发生应力集中的内圆角、凹稽处粗糙度数值应较小。'
