    # “软件工程”的局限性


    +   - “软件工程”是指一套用于计算机软件的规范说明、设计和编程的规则

    +   - 软件工程方法于20世纪70年代正式形成，它包含着一套软件开发的方法，诸如结构化程序设计，结构化系统设计和结构化系统分析，以及支持这些工作的软件工具。在建立具有复杂逻辑关系的复杂软件中，它们是至关重要的。

    +   - 然而，在很多数据处理系统中，采用适当的数据库技术，逻辑关系的设计会变得相对简些。但是，要想有效地用软件工程方法建立完善的数据库和数据处理系统，那是非常困难的。'
