  md: '

    ## 模拟退火算法描述


    +   4、若 $e^{-\Delta E / kT} \le \xi$ ，则转2。

    +   5、用$V_i + \Delta V$来取代原来的$V_i$，并令$E = E + \Delta E$。

    +   6、在该T下，检验系统是否稳定，若不稳定则转2。

    +   7、以某一方式取$T^* < T$，令$T = T^*$。

    +   8、退火过程是否基本结束，是就停止，不是则转2。


    ## 对模拟退火算法的一些说明


    在上述过程中，模拟退火是否能达到能量E的最小值，取决于T₀是否足够高和T下降得是否充分慢，以及对每个T时系统是否稳定。


    ### T0初始选取


    +   1、均匀地随机抽样V，取E(V)的方差为T₀。

    +   2、在所有可能状态下，选取两个状态Vᵢ和Vⱼ，使差 | ΔE | = | E(Vᵢ)-E(Vⱼ) | 最大，取T₀为该量大值的若干倍。

    +   3、由经验给出。


    ### 检验系统是否稳定的方法


    +   1、检查E的均值是否稳定。

    +   2、检查是否连续若干步中E的变化都比较小。

    +   3、按一固定步数抽样。


    +   ◆ T减小方式

    +   令T=λ T， 0 < λ < 1，常数 λ ∈ [0.8, 0.99]。


    +   ◆ 算法终止方式

    +   1、取t小于某一阈值。

    +   2、检验系统的熵是否已达最小。


    ## 第二节


    Boltzmann机


    ## Boltzmann机简介


    Boltzmann机是由Hinton和Sejnowski提出的一种统计神经网络模型，是在Hopfield网络基础之上引入了随机性机制而形成的。与Hopfield神经网络不同的是Boltzmann机具有学习能力，即其权值通过学习来调整，而不是预先设置。Boltzmann机是一种约束满足神经网络模型。


    ## Boltzmann机的结构


    ![](img/7259427c92d70af6f49d1a73be73a69f_83_0.png)


    ## Boltzmann机的学习


    当样本送入Boltzmann机的可见单元后，Boltzmann机就开始学习。Boltzmann机中的隐含单元是用来形成内部表示，以描述输入样本的规律。由于内部表达的构造过程是在无任何附加信息的状态下完成的，因而这个学习过程也称为无监督学习。设所有的权值初始值都为0。


    ## Boltzmann机的学习过程描述


    ◆ 输入期


    学习样本送入Boltzmann机的可见神经元，并且对每一个输入样本使用当前权值建立平衡。也就是说，从训练集合中随机挑选一样本送入可见神经元，然后让隐藏神经元自由动作，这时，如果两个神经元的状态同时为1，统计它们之间连接的权值活跃的次数L1。


    ### 自由运行期


    这时Boltzmann机中所有的神经元都自由地调整它们的状态，采用模拟退火算法达到一个平衡态，统计神经元之间连接权值活跃的次数L2。


    ◆ 调整连接权值


    按下式进行连接权值调整：


    Δwᵢⱼ = η(L₂ − L₁)


    ## Boltzmann机的应用


