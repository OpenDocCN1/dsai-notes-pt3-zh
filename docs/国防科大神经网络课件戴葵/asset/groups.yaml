    ##### 人工神经元的基本结构\n\n- 处理单元\n- 连接\n  - 输入\n  - 输出\n\n![](img/7259427c92d70af6f49d1a73be73a69f_7_0.png)\n\
    \n#### 神经元的基本功能 (1)\n\n- 输入类型\n- 输入的权值\n  - 抑制性连接权值\n  - 活跃性连接权值\n\n把某类净输入与其连接权值结合起来，使该类输入对目的处理单元产生最终净输入的规则。\n\
    \n![](img/7259427c92d70af6f49d1a73be73a69f_8_0.png)\n\n#### 神经元的基本功能（2）\n\n#####\
