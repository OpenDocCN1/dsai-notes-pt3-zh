  - '[PAGE 38]


    # 神经网络模型结构特点


    神经网络模型是由大量极简单的处理单元所组成


    每一个处理单元仅仅是对输入信号加权求和，然后计算该处理单元新的活跃值和输出信号。每个处理单元要完成的功能非常简单，但是神经网络模型中的处理单元数目是如此之多，传统计算机是远远无法比拟的。'
