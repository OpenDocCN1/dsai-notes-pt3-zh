    \n#### 神经元的基本功能（3）\n\n- 产生输出\n  - 输出值的作用\n  - 输出函数（输出规则）\n    根据某一神经元的当前活跃值产生对其它神经元影响的输出值的规则。\n\
    \  - 输出函数类型\n    硬极限函数、阈值函数、S型单调函数、恒等函数\n\n![](img/7259427c92d70af6f49d1a73be73a69f_10_0.png)\n\
    \n![](img/7259427c92d70af6f49d1a73be73a69f_10_1.png)\n\n#### 神经网络模型的基本组成 之网络\n\
    \n- 神经网络结构\n  - 连接矩阵\n  - 连接模式\n    - 多层、单层\n    - 反馈、前馈\n\nW =\n\n| w_{11} |\
    \ \\cdots | w_{1n} |\n| \\vdots | \\ddots | \\vdots |\n| w_{n1} | \\cdots | w_{nn}\
