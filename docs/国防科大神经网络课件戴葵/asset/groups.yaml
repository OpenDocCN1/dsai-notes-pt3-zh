  md: "\n## 典型的神经网络模型的分类\n\n- 前馈神经网络模型\n  - 自适应线性元模型\n  - 感知机\n- 反馈神经网络模型\n  - Hopfield神经网络模型\n\
    \  - 海明神经网络模型\n  - 双向联想存储器\n- 自组织神经网络模型\n  - 自适应谐振理论（ART）\n  - 自组织映射神经网络模型（SOM）\n\
    \  - 对流神经网络模型（CPN）\n  - 认知机\n- 随机神经网络模型\n  - 模拟退火算法\n  - Boltzmann机\n  - 谐和理论\n\
    \n## 第三节 神经网络结构及神经计算特点\n\n### 神经网络模型结构特点\n\n神经网络模型是由大量极简单的处理单元所组成。每一个处理单元仅仅是对输入信号加权求和，然后计算该处理单元新的活跃值和输出信号。每个处理单元要完成的功能非常简单，但是神经网络模型中的处理单元数目是如此之多，传统计算机是远远无法比拟的。\n\
    \n## 神经计算的本质\n\n### 计算的数学观点\n\n计算就是在满足一定原理、定理的条件下，从一个空间到另一个空间的映射；\n\n### 计算的物理观点\n\
    \n计算是按照一定的自然规则，在某种“硬件”上所发生的一些物理规则。因此计算可以表示为一个动力学系统中状态空间的变换轨迹。\n\n神经网络的计算是一种非编程的信息处理方式。在不确定的条件下，只要我们能准确地描述所要求的计算功能，并能给出体现该功能的大量例子，那么神经网络就可以通过这些例子来进行自我调整，直至达到所要求的计算能力；有时甚至在没有例子可寻时，神经网络也可以根据一些输入信号通过自组织而达到某种计算能力。\n\
    \n## 神经计算的特点\n\n- 大规模并行性、集团运算和容错能力。\n- 信息的分布式表示。\n- 学习和自组织能力。\n- 多层神经网络系统具有强大的解算能力和处理实际问题的能力。\n\
    \n## 神经计算的信息处理能力\n\n### 数学逼近映射\n\n```\nf: A ⊂ R^n → B ⊂ R^n\n```\n\n开发合适的函数，以自组织的方式响应以下的样本集合:(x₁,y₁),(x₂,y₂),…,(xₘ,yₘ)，（这里\
    \ yᵢ = f(xᵢ) 或 yᵢ = f(xᵢ)+N，其中 N 为噪声过程）。这里描述的当然是一般的数学抽象，像识别与分类这些计算都可以抽象为这样的一种近似数学映射。BPN、CPN\
    \ 模型都可以完成这种计算。\n\n### 概率密度函数的估计\n\n通过自组织的方式开发出一组等概率锚点来响应在空间中按照一定确定概率密度函数p选取的一组向量样本X₁,\
    \ X₂, X₃, ...。CPN、SOM模型可以完成这种计算。\n\n### 从二进制数据库中提取相关的知识\n\n将从二进制数据库中提取的相关知识形成一种知识的聚集模型，这些知识依照数据库的自组织在它们之间有某种统计上的共性，并依这些共性来响应输入的数据库。BSB有能力进行这种计算。\n\
    \n### 形成拓扑连续及统计意义上的同构映射\n\n这是对固定概率密度函数选择的输入数据进行自适应的一种自组织映射，最终使得数据空间上的不同项有某种同构。SOM\
    \ 模型最适合计算这类问题。\n\n### ☆ 最近相邻模式分类\n\n通过比较大量的存储数据来进行模式分类，这种能力可应用于暂态或暂稳态模式分类，并且可用层次性的存储模式来表达存储。绝大多数的神经网络模型均能进行这种计算，比如ART、AVA、BAM、BCM、BPN、BSB、CBD、CPN、HOP、LRN、MDL、NEO、PTR。\n\
    \n### 数据聚集\n\n这是采用自组织的方式所选择的颗粒或模式的聚类，以此来响应输入数据。聚类是可变的，但要限制其较点的个数。对于任何新的目标，只要在系统中没有对其提供聚类，都要形成新的聚类。很显然，这种能力可直接应用于雷达的多目标跟踪，ART模型最适于这种计算。\n\
    \n### ✿ 最优化问题的计算\n\n这是用来求解局部甚至是全局最优解的，HOP模型、BCM模型有能力进行这种计算。\n\n## 第四节 神经计算的稳定性\n\
    \n### 稳定性的基本概念\n\n稳定性是指神经网络系统在进行神经计算时，系统最终能收敛到一个稳定状态。只有使整个神经网络系统的状态朝稳定状态发展的神经计算才是有用的，否则，将导致整个系统的振荡或者随机波动，而不能得到一个一致的结果。\n\
    \n### 从计算机的角度看稳定性\n\n计算机具有许多可能的逻辑状态。当计算机系统时钟不断推进时，计算机就从一个逻辑状态转换到另一个逻辑状态。在计算机中，通过设置特定的逻辑初始状态开始计算（指令和数据）。然后计算机的状态就沿着事先确定的逻辑状态空间上的轨迹移动，直到得到答案，整个计算也就结束了。因而在计算机中的计算过程就是其逻辑状态空间中的一条轨迹。\n\
    \n### 从物理的角度看稳定性\n\n从物理的角度来看，计算过程是其相应状态空间上状态变换的一条轨迹，这条轨迹的方向由该系统固有动力学特性控制着，其移动的结果是进入一稳定状态中，然后整个计算便结束了。\n\
    \n由该系统固有动力学特性控制着的各种物理系统可以展示不同的计算能力，\n\n### 离散状态空间下的计算过程解释\n\n![](img/7259427c92d70af6f49d1a73be73a69f_55_0.png)\n\
    \n### 连续状态空间下计算过程的解释\n\n![](img/7259427c92d70af6f49d1a73be73a69f_56_0.png)\n\n\
    ### 吸引子的物理含义图解1\n\n![](img/7259427c92d70af6f49d1a73be73a69f_58_0.png)\n\n### 吸引子的物理含义图解2\n\
    \n局部极小\n\n全局极小\n\n## 第五节 神经网络的研究历史\n\n### 神经网络研究简史\n\n从人脑的生理结构出发来研究人的智能行为，模拟人脑信息处理的功能，即人工神经网络的研究，始于本世纪四十年代，但它的发展却经历了一条曲折的道路，至今经历了兴起、萧条和兴盛三个时期。\n\
    \n## 第六节 神经网络的应用领域\n\n### 神经网络潜在应用领域\n\n- 娱乐。比如下棋、打牌等。\n- 零售分析。 用神经网络来分析各种商品的零售量及价格。\n\
    - 信用分析。\n- 航空与航天。\n- 医用诊断系统。\n\n## 第五章 随机神经网络模型\n\n### 内容提要\n\n- 模拟退火算法\n- Boltzmann机\n\
    \n### 第一节 模拟退火算法\n\n#### 神经计算中面临的问题\n\n利用神经网络进行计算时，我们总是期望能通过系统状态的改变，使系统的能量函数E朝其减小的方向递减，然而这个递减过程最终所达到的一个稳定状态，往往是能量函数E的一个局部极小点，而达不到全局最优。如果利用神经网络计算求解具有多个限制条件的组合优化问题时，这个局部极小点所能满足的只是其中一些限制条件，只是达到了局部最优而不是全局最优，这当然不是我们所期望的结果，但是我们又怎样才能寻求到满足多数限制条件的全局最优点（或次优点）呢？\n\
    \n#### 模拟退火算法的直观解释\n\n能量曲线\n\nA\n\n局部极小\n\nB\n\n全局极小\n\n![](img/7259427c92d70af6f49d1a73be73a69f_70_0.png)\n\
    \n#### 模拟退火算法基本思想\n\n在神经网络系统中，设系统所有可能状态为V={ v₁， v₂， ...， vₙ}，与系统相对应有一能量E，它是系统状态的函数，即\
    \ E(V)。设控制参数为温度T，我们的目的便是找到某一系统状态V*，使：\n\n$$\nE(V^*) = \\min_{v_i \\in V} E(v_i)\n\
    $$\n\n又设：\n\n$$\nf = z(T) e^{-E(v_i)/(kT)}\n$$\n\n其中：\n\n$$\nz(T) = \\frac{1}{\\\
    sum_i e^{-E(v_i)/(kT)}}\n$$\n\n$k$ 为 Boltzmann 常数。\n\n#### 模拟退火算法描述\n\n- 1、初始化。任给一初始状态V₀，Vᵢ=V₀，计算E(V₀)，将参数T置一初始温度值。\n\
    - 2、产生一随机扰动ΔV，按下式计算ΔE：\n  - ΔE=E(Vᵢ+ΔV)−E(Vᵢ)\n- 3、若ΔE<0，则转5，否则在(0,1)区间上产生一个均匀分布的随机数ξ。\n"
