  - '[PAGE 16]


    # # 神经网络分类原则


    +   - 按神经网络模型的拓扑结构可以分为反馈神经网络模型和前向神经网络模型。


    +   - 按神经网络模型的性能可分为连续型与离散型神经网络模型，确定型与随机型神经网络模型。


    +   - 按学习方式可以分为有教师学习神经网络模型和无教师学习神经网络模型。


    +   - 按连接突触性质可以分为一阶线性关联神经网络模型和高阶非线性关联神经网络模型。'
  - '[PAGE 17]


    # 典型的神经网络模型


    # 自适应谐振理论（ART）


    该模型主要包括ART1、ART2和ART3，它们可以对任意多和任意复杂的二维模式进行自组织、自稳定和大规模并行处理。ART1主要用于二值输入，ART2和ART3主要用于连续信号输入。该类模型主要用于模式识别（如雷达、声纳的信号识别）。


    缺点是对转换、失真及规模的变化较为敏感。'
  - '[PAGE 18]


    # 典型的神经网络模型


    # 雪崩模型（Avalanche）


    该类神经网络模型可以学习、记忆和重现随机复杂度的时空模式。主要用于连续的语音识别和教学机器人。缺点是调节困难。'
  - '[PAGE 19]


    # 典型的神经网络模型


    # 🌼 双向相联存储器（BAM）


    该类神经网络模型是由许多相同神经元构成的双向联想式两层网络，主要用作按内容寻址的相联存储。


    缺点是存储容量小而且需很好地进行编码。'
  - '[PAGE 20]


    # 典型的神经网络模型


    # 反传神经网络模型（BP）


    该类神经网络模型是一多层映射神经网络。采用的是最小均方差的学习方式，是目前使用最广泛的神经网络模型之一。主要用于语言综合、语言识别、自适应控制等。缺点是它仅仅是有监督的一种学习方式，而且输入、输出样本都必须是冗余的。'
  - '[PAGE 21]


    # 典型的神经网络模型


    # Boltzmann机 / Cauchy机（BCM）


    该类神经网络模型使用一噪声过程求得整个模型花费函数（cost function）的全局极小值。主要用于模式识别（图像、声纳和雷达信号的识别）。


    缺点是Boltzmann机的训练时间长，Cauchy机会按一定的统计分布产生噪声。'
  - '[PAGE 22]


    <!-- no content -->'
  - '[PAGE 23]


    # 典型的神经网络模型


    # 对流传播模型（CPN）


    该类神经网络模型是一种在功能上作为统计最优化和概率密度函数分析的网络模型。主要用于图像压缩、统计分析、贷款应用打分。


    缺点是对任何类型的问题均需大量的处理单元和连接。'
  - '[PAGE 24]


    # 典型的神经网络模型


    # Hopfield神经网络模型


    它是由相同处理单元构成的单层自联想网络模型。主要用于从片段中进行图像和数据的完全恢复。


    缺点是处理单元间连接权值需预先设置，并且单元之间的连接是要对称的，它没有学习能力。'
  - '[PAGE 25]


    # 典型的神经网络模型


    # 多个自适应线性元模型（MADALINE）


    该类神经网络模型是具有最小方差学习功能的线性网络模型。它的学习能力较强，是自适应线性元ADALINE的扩展。主要用于自适应控制。


    缺点是在输入输出之间设置的是一种线性关系。'
  - '[PAGE 26]


    # 典型的神经网络模型


    # 自组织映射模型（SOM）


    该类神经网络模型主要是形成从一个密集簇到另一个簇的连续拓扑映射，并且映射矩阵密度随第二个簇所给定的概率密度函数不同而不同。主要用于从一个几何区域到另一个几何区域的映射。


    缺点是需要彻底的训练。'
  - '[PAGE 27]


    # 典型的神经网络模型


    # 学习矩阵模型（LRN）


    该类神经网络模型是一种单层单向非递归的相联存储器模型。主要用于相联存储。'
  - '[PAGE 28]


    # 典型的神经网络模型


    # 小脑模型（Cerebellatron）


    该类神经网络模型主要是学习平均时空指令序列模式，并且按线索重现那些平均指令序列。主要用于控制机械手的动作。缺点是需要复杂的控制输入。'
  - '[PAGE 29]


    # 典型的神经网络模型


    # 细胞神经网络模型（CNN）


    该类神经网络模型是一单层连续神经网络。

    主要用于模式识别、文字识别与噪声控制等。'
  - '[PAGE 30]


    # 典型的神经网络模型


    # 交替投影神经网络模型（APNN）


    该类神经网络模型应用凸集投影概念，在向量空间中建立模型，主要用于模式识别。'
  - '[PAGE 31]


    # 典型的神经网络模型


    # 神经认知机（Necognitron）


    该类神经网络模型是一多层结构化字符识别网络模型。主要用于手写体字符识别，但是常常需要极大数目的处理单元和连接，它对大小、平移、旋转不敏感，并且能识别复杂的字符。'
  - '[PAGE 32]


    # 典型的神经网络模型


    # 感知机（Perceptron）


    该类神经网络模型是一组可训练的线性分类单层网络模型，目前较少应用。主要用于打印字符识别，但是不能识别复杂字符（汉字），而且对大小、平移和变形很敏感。'
  md: "\n# 神经网络导论\n\n戴 葵\n\n国防科技大学计算机学院601教研室\n\n## 神经网络的研究内容\n\n- 神经网络基础理论\n- 神经网络实现技术\n\
    - 神经网络应用技术\n\n## 第一章\n\n## 神经网络基本概念\n\n### 内容提要\n\n- 神经网络模型的基本组成\n- 神经网络的分类及典型的神经网络模型\n\
    - 神经网络结构及神经计算特点\n- 神经计算的稳定性\n- 神经网络研究历史\n- 神经网络的应用领域\n\n### 第一节\n\n### 神经网络模型的基本组成\n\
    \n#### 神经网络模型的基本组成 之神经元\n\n##### 生物神经元的基本组成\n\n- 细胞体\n- 突起\n  - 树突\n  - 轴突\n\n\
    ##### 人工神经元的基本结构\n\n- 处理单元\n- 连接\n  - 输入\n  - 输出\n\n![](img/7259427c92d70af6f49d1a73be73a69f_7_0.png)\n\
    \n#### 神经元的基本功能 (1)\n\n- 输入类型\n- 输入的权值\n  - 抑制性连接权值\n  - 活跃性连接权值\n\n把某类净输入与其连接权值结合起来，使该类输入对目的处理单元产生最终净输入的规则。\n\
    \n![](img/7259427c92d70af6f49d1a73be73a69f_8_0.png)\n\n#### 神经元的基本功能（2）\n\n#####\
    \ 处理输入\n\n- ❀ 活跃状态（活跃值）\n- ❀ 活跃值\n- ❀ 活跃函数（活跃规则）\n\n把某一处理单元的各类净输入相互结合起来，再与该处理单元当前活跃状态相结合，以产生一个新的活跃状态的规则。\n\
    \n- ❀ 活跃函数类型\n  恒等函数、阈值函数、S型非调函数\n\n![](img/7259427c92d70af6f49d1a73be73a69f_9_0.png)\n\
    \n#### 神经元的基本功能（3）\n\n- 产生输出\n  - 输出值的作用\n  - 输出函数（输出规则）\n    根据某一神经元的当前活跃值产生对其它神经元影响的输出值的规则。\n\
    \  - 输出函数类型\n    硬极限函数、阈值函数、S型单调函数、恒等函数\n\n![](img/7259427c92d70af6f49d1a73be73a69f_10_0.png)\n\
    \n![](img/7259427c92d70af6f49d1a73be73a69f_10_1.png)\n\n#### 神经网络模型的基本组成 之网络\n\
    \n- 神经网络结构\n  - 连接矩阵\n  - 连接模式\n    - 多层、单层\n    - 反馈、前馈\n\nW =\n\n| w_{11} |\
    \ \\cdots | w_{1n} |\n| \\vdots | \\ddots | \\vdots |\n| w_{n1} | \\cdots | w_{nn}\
    \ |\n\n![](img/7259427c92d70af6f49d1a73be73a69f_11_0.png)\n\n![](img/7259427c92d70af6f49d1a73be73a69f_11_1.png)\n\
    \n#### 神经网络模型的基本组成 之学习规则\n\n根据环境动态修改各个处理单元之间连接权值的规则。\n\n- Hebbian学习规则\n- Delta学习规则\n\
    \n- 联想学习\n  - 自联想\n  - 异联想\n- 规则发现\n\n![](img/7259427c92d70af6f49d1a73be73a69f_12_0.png)\n\
    \n#### 神经网络模型的基本组成 之环境\n\n- 环境内容\n- 输入\n- 输出\n\n![](img/7259427c92d70af6f49d1a73be73a69f_13_0.png)\n\
    \n#### 神经网络模型的基本组成 小结\n\n- 传播规则\n- 活跃规则\n- 输出规则\n\n- 互连模式\n- 学习规则\n- 环境\n\n神经网络模型完整描述的六个要素。\n\
    \n### 第二节\n\n### 神经网络的分类以及典型的神经网络模型\n\n#### 神经网络分类原则\n\n- 按神经网络模型的拓扑结构可以分为反馈神经网络模型和前向神经网络模型。\n\
    - 按神经网络模型的性能可分为连续型与离散型神经网络模型，确定型与随机型神经网络模型。\n- 按学习方式可以分为有教师学习神经网络模型和无教师学习神经网络模型。\n\
    - 按连接突触性质可以分为一阶线性关联神经网络模型和高阶非线性关联神经网络模型。\n\n#### 典型的神经网络模型\n\n##### 自适应谐振理论（ART）\n\
    \n该模型主要包括ART1、ART2和ART3，它们可以对任意多和任意复杂的二维模式进行自组织、自稳定和大规模并行处理。ART1主要用于二值输入，ART2和ART3主要用于连续信号输入。该类模型主要用于模式识别（如雷达、声纳的信号识别）。\n\
    \n缺点是对转换、失真及规模的变化较为敏感。\n\n##### 雪崩模型（Avalanche）\n\n该类神经网络模型可以学习、记忆和重现随机复杂度的时空模式。主要用于连续的语音识别和教学机器人。缺点是调节困难。\n\
    \n##### \U0001F33C 双向相联存储器（BAM）\n\n该类神经网络模型是由许多相同神经元构成的双向联想式两层网络，主要用作按内容寻址的相联存储。\n\
    \n缺点是存储容量小而且需很好地进行编码。\n\n##### 反传神经网络模型（BP）\n\n该类神经网络模型是一多层映射神经网络。采用的是最小均方差的学习方式，是目前使用最广泛的神经网络模型之一。主要用于语言综合、语言识别、自适应控制等。缺点是它仅仅是有监督的一种学习方式，而且输入、输出样本都必须是冗余的。\n\
    \n##### Boltzmann机 / Cauchy机（BCM）\n\n该类神经网络模型使用一噪声过程求得整个模型花费函数（cost function）的全局极小值。主要用于模式识别（图像、声纳和雷达信号的识别）。\n\
    \n缺点是Boltzmann机的训练时间长，Cauchy机会按一定的统计分布产生噪声。\n\n##### 对流传播模型（CPN）\n\n该类神经网络模型是一种在功能上作为统计最优化和概率密度函数分析的网络模型。主要用于图像压缩、统计分析、贷款应用打分。\n\
    \n缺点是对任何类型的问题均需大量的处理单元和连接。\n\n##### Hopfield神经网络模型\n\n它是由相同处理单元构成的单层自联想网络模型。主要用于从片段中进行图像和数据的完全恢复。\n\
    \n缺点是处理单元间连接权值需预先设置，并且单元之间的连接是要对称的，它没有学习能力。\n\n##### 多个自适应线性元模型（MADALINE）\n\n\
    该类神经网络模型是具有最小方差学习功能的线性网络模型。它的学习能力较强，是自适应线性元ADALINE的扩展。主要用于自适应控制。\n\n缺点是在输入输出之间设置的是一种线性关系。\n\
    \n##### 自组织映射模型（SOM）\n\n该类神经网络模型主要是形成从一个密集簇到另一个簇的连续拓扑映射，并且映射矩阵密度随第二个簇所给定的概率密度函数不同而不同。主要用于从一个几何区域到另一个几何区域的映射。\n\
    \n缺点是需要彻底的训练。\n\n##### 学习矩阵模型（LRN）\n\n该类神经网络模型是一种单层单向非递归的相联存储器模型。主要用于相联存储。\n\n\
    ##### 小脑模型（Cerebellatron）\n\n该类神经网络模型主要是学习平均时空指令序列模式，并且按线索重现那些平均指令序列。主要用于控制机械手的动作。缺点是需要复杂的控制输入。\n\
    \n##### 细胞神经网络模型（CNN）\n\n该类神经网络模型是一单层连续神经网络。\n主要用于模式识别、文字识别与噪声控制等。\n\n##### 交替投影神经网络模型（APNN）\n\
    \n该类神经网络模型应用凸集投影概念，在向量空间中建立模型，主要用于模式识别。\n\n##### 神经认知机（Necognitron）\n\n该类神经网络模型是一多层结构化字符识别网络模型。主要用于手写体字符识别，但是常常需要极大数目的处理单元和连接，它对大小、平移、旋转不敏感，并且能识别复杂的字符。\n\
    \n##### 感知机（Perceptron）\n\n该类神经网络模型是一组可训练的线性分类单层网络模型，目前较少应用。主要用于打印字符识别，但是不能识别复杂字符（汉字），而且对大小、平移和变形很敏感。\n"
