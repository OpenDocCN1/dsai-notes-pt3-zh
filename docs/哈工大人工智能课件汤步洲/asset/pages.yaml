- pgno: 559
  md: '# To Normalize


    +   - (Dictionary) To bring or restore to a normal condition


    +   - Procedure:

    +     - Step 1: Compute Z = sum over all entries

    +     - Step 2: Divide every entry by Z


    +   - Example 1


    | W | P |

    |---|---|

    | sun | 0.2 |

    | rain | 0.3 |


    Normalize

    Z = 0.5


    | W | P |

    |---|---|

    | sun | 0.4 |

    | rain | 0.6 |


    +   - Example 2


    | T | W | P |

    |---|---|---|

    | hot | sun | 20 |

    | hot | rain | 5 |

    | cold | sun | 10 |

    | cold | rain | 15 |


    Normalize

    Z = 50


    | T | W | P |

    |---|---|---|

    | hot | sun | 0.4 |

    | hot | rain | 0.1 |

    | cold | sun | 0.2 |

    | cold | rain | 0.3 |


    All entries sum to ONE'
