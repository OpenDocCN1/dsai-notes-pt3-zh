- pgno: 571
  md: "# Inference with Bayes’ Rule\n\n+   - Example: Diagnostic probability from\
    \ causal probability:\n+   \n+     $$P(\\text{cause}\\mid\\text{effect})=\\frac{P(\\\
    text{effect}\\mid\\text{cause})P(\\text{cause})}{P(\\text{effect})}$$\n\n+   -\
    \ Example:\n+     - M: meningitis, S: stiff neck\n\n$$P(+m)=0.0001$$\n\n$$P(+s\\\
    mid +m)=0.8$$\n\n$$P(+s\\mid -m)=0.01$$\n\n![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_571_0.png)\n\
    \n$$P(+m\\mid +s)=\\frac{P(+s\\mid +m)P(+m)}{P(+s)}=\\frac{P(+s\\mid +m)P(+m)}{P(+s\\\
    mid +m)P(+m)+P(+s\\mid -m)P(-m)}=\\frac{0.8\\times0.0001}{0.8\\times0.0001+0.01\\\
    times0.999}$$\n\n+   - Note: posterior probability of meningitis still very small\n\
    +   - Note: you should still get stiff necks checked out! Why?"
