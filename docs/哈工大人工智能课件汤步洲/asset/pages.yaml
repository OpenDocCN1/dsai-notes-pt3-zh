  md: '# 3.4.4 鲁滨逊归结原理


    # 谓词逻辑的归结


    例 设 C₁=P(a) ∨ R(x)， C₂=¬P(y) ∨ Q(b)， 求 C₁₂


    解： 取 L₁= P(a), L₂=¬P(y)， 则 L₁ 和 L₂ 的合一是 σ={a/y}。根据定义可得


    C₁₂ = ( {C₁ σ}-{L₁ σ}) ∪ ({C₂ σ}-{L₂ σ})

    =({P(a), R(x)}-{P(a)}) ∪ ({¬P(a), Q(b)}-{¬P(a)})

    =({R(x)}) ∪ ({Q(b)}) = {R(x), Q(b)}

    = R(x) ∨ Q(b)


    例 设 C₁=P(x) ∨ Q(a)， C₂=¬P(b) ∨ R(x)， 求 C₁₂


    解： 由于 C₁ 和 C₂ 有相同的变元 x，不符合谓词逻辑归结定义的要求。为了进行归结，需要修改 C₂ 中变元 x 的名字为，令 C₂=¬P(b) ∨ R(y)。此时
    L₁= P(x), L₂=¬P(b)， L₁ 和 L₂ 的合一是 σ={b/x}。则有


    C₁₂ = ( {C₁ σ}-{L₁ σ}) ∪ ({C₂ σ}-{L₂ σ})

    =({P(b), Q(a)}-{P(b)}) ∪ ({¬P(b), R(y)}-{¬P(b)})

    =({Q(a)}) ∪ ({R(y)}) = {Q(a), R(y)}

    = Q(a) ∨ R(y)'
