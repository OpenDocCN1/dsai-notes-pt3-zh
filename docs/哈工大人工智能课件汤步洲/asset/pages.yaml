    例 设 C₁ = ¬P ∨ Q，C₂ = ¬Q，C₃ = P，求 C₁、C₂、C₃ 的归结式 C₁₂₃。

    解：若先对 C₁、C₂ 归结，可得到 C₁₂ = ¬P

