- pgno: 166
  md: '# 2. 3. 2产生式系统的基本结构


    综合数据库DB(Data Base)


    +   (1) 存放推理过程的各种当前信息。

    +   如：

    +   问题的初始状态

    +   输入的事实

    +   中间结论及最终结论


    (2) 作为推理过程选择可用规则的依据。推理过程中某条规则是否可用，是通过该规则的前提与DB中的已知事实的匹配来确定的。可匹配的规则称为可用规则。利用可用规则进行推理，将会得到一个结论。该结论若不是目标，将作为新的事实放入DB，成为以后推理的已知事实。


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_166_0.png)


    规则库RB(Rule Base)


    也称知识库KB(Knowledge Base)


    +   (1) 作用

    +   用于存放推理所需的所有规则，是整个产生式系统的知识集。是产生式系统能够进行推理的根本。


    +   (2) 要求

    +   知识的完整性、一致性、准确性、灵活性和可组织性'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# 2. 3. 2产生式系统的基本结构


    控制系统(Control system)


    控制系统的主要作用


    亦称推理机，用于控制整个产生式系统的运行，决定问题求解过程的推理线路。


    控制系统的主要任务


    选择匹配：按一定策略从规则库种选择规则与综合数据库中的已知事实进行匹配。匹配是指把所选规则的前提与综合数据库中的已知事实进行比较，若事实库中存的事实与所选规则前提一致，则称匹配成功，该规则为可用；否则，称匹配失败，该规则不可用。


    冲突消解：对匹配成功的规则，按照某种策略从中选出一条规则执行。


    执行操作：对所执行的规则，若其后件为一个或多个结论，则把这些结论加入综合数据库；若其后件为一个或多个操作时，执行这些操作。


    终止推理：检查综合数据库中是否包含有目标，若有，则停止推理。


    路径解释：在问题求解过程中，记住应用过的规则序列，以便最终能够给出问题的解的路径。


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_167_0.png)'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# 2.3.3 产生式系统的运行过程


    外部输入的初始事实放入综合数据库


    从规则库中取一个条规则，将其前提同当前动态数据库中的事实/数据进行模式匹配


    匹配成功否？


    把该规则的结论放入当前动态数据库，或执行规则所规定的动作'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# 【产生式系统应用举例】


    例1:设有以下两条规则


    ```

    r1: IF 动物有羽毛 THEN 动物是鸟

    r2: IF 动物是鸟 AND 动物善飞 THEN 动物是信天翁

    其中， r1和r2是上述两条规则则在动物识别系统中的规则编号。

    ```


    假设已知以下事实:


    动物有羽毛，动物善飞


    求满足以上事实的动物是何种动物。


    解: 由于已知事实"动物有羽毛", 即 r1的前提条件满足, 因此 r1可用, 承认的 r1结论, 即推出新的事实"动物是鸟"。此时, r2的两个前提条件均满足,
    即 r2的前提条件满足, 因此r2可用, 承认的r2结论, 即推出出新的事实"动物是信天翁"。


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_169_0.png)'
  merge: -1
  img_proc: true
