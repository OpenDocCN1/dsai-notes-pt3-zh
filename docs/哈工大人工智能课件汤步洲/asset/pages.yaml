- pgno: 71
  md: '# 不同学派的理论之争


    # 不同学派的方法之争


    # 符号主义


    智能的基础是知识，其核心是知识表示和知识推理；知识可用符号表示，也可用符号进行推理，因而可以建立基于知识的人类智能和机器智能的统一的理论体系。


    # 符号主义


    功能模拟

    构造能够模拟大脑功能的智能系统。


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_71_0.png)


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_71_1.png)


    # 联结主义


    提出了智能行为的基元是神经元，而不是符号；思维过程是神经元的联结活动过程，而不是符号运算过程；反对符号主义关于物理符号系统的假设。


    # 联结主义


    结构模拟

    构造模拟大脑结构的神经网络系统。


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_71_2.png)


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_71_3.png)


    # 行为主义


    智能取决于感知和行动，“感知—动作”模型；智能不需要知识、不需要表示、不需要推理；人工智能可以像人类智能那样逐步进化


    # 行为主义


    行为模拟

    构造具有进化能力的智能系统。


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_71_4.png)


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_71_5.png)'
