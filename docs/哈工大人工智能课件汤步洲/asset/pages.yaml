- pgno: 402
  md: '# 4.1.4.1 问题的与/或树表示


    # (5) 可解节点与不可解节点


    在与/或树中，满足以下三个条件之一的节点为可解节点：


    +   ①任何终止节点都是可解节点。


    +   ②对“或”节点，当其子节点中至少有一个为可解节点时，则该或节点就是可解节点。


    +   ③对“与”节点，只有当其子节点全部为可解节点时，该与节点才是可解节点。


    同样，可用类似的方法定义不可解节点：


    +   ①不为终止节点的端节点是不可解节点。


    +   ②对“或”节点，若其全部子节点都为不可解节点，则该或节点是不可解节点。


    +   ③对“与”节点，只要其子节点中有一个为不可解节点，则该与节点是不可解节点。'
  merge: -1
