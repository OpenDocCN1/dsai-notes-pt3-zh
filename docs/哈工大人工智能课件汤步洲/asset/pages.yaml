  md: '# 3. 4. 4 鲁滨逊归结原理


    # 谓词逻辑的归结


    在谓词逻辑中，由于子句集中的谓词一般都含有变元，因此不能象命题逻辑那样直接消去互补文字。而需要先用一个合一对变元进行代换，然后才能进行归结。可见，谓词逻辑的归结要比命题逻辑的归结麻烦一些。


    # 谓词逻辑的归结原理


    谓词逻辑中的归结式可用如下定义来描述：


    定义25 设C1和C2是两个没有公共变元的子句，L1和L2分别是C1和C2中的文字。如果L1和¬L2存在一个最一般合一σ，则称

    C12=({C1σ}-{L1σ})∪({C2σ}-{L2σ})

    为C1和C2的二元归结式，而L1和L2为归结式上的文字。'
