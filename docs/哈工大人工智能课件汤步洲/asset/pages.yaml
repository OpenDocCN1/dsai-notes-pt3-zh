  md: '# 3.4.6归结演绎推理的归结策略


    # 3.限制策略


    # d）单文字子句策略


    单文字：如果一个子句只包含一个文字，则称此子句为单文字子句。


    基本思想：要求每次参加归结的两个亲本子句中至少有一个子句是单文字子句。


    单文字子句策略是对支持集策略的进一步改进，单文字子句策略是不完备的，即当子句集为不可满足时，用这种策略不一定能归结出空子句。


    采用单文字子句策略，归结式包含的文字数将少于其亲本子句中的文字数，这将有利于向空子句的方向发展，因此会有较高的归结效率。'
