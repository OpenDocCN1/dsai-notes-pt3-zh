- pgno: 300
  md: '# 3.4.2 子句集及其应用


    # 子句集的化简


    **(7) 消去全称量词**


    $(\forall x)(\neg P(x,f(x))\lor(Q(x,g(x))\land(\neg P(x,f(x))\lor\neg R(x,g(x)))))$


    由于母式中的全部变元均受全称量词约束，并且与全称量词的次序无关，因此可省掉全称量词。但剩下的母式，仍假设其变元是被全称量词量化的。


    例如，上式消去全称量词后为


    $(\neg P(x,f(x))\lor Q(x,g(x)))\land(\neg P(x,f(x))\lor\neg R(x,g(x)))$


    **(8) 消去合取词**


    在母式中消去所有合取词，把母式用子句集的形式表示出来。其中，子句集中的每一个元素都是一个子句。


    例如，上式的子句集中包含以下两个子句


    +   - $\neg P(x,f(x))\lor Q(x,g(x))$

    +   - $\neg P(x,f(x))\lor\neg R(x,g(x))$


    **(9) 更换变量名称**


    对子句集中的某些变量重新命名，使任意两个子句中不出现相同的变量名。由于任意两个不同子句的变量之间实际上不存在任何关系。这样，更换变量名不会影响公式的真值的。


    例如，对前式，可把第一个子句集中的变元 $x$ 更换为 $y$，得到如下子句集


    +   - $\neg P(x,f(x))\lor Q(x,g(x))$

    +   - $\neg P(y,f(y))\lor\neg R(y,g(y))$'
  merge: -1
