- pgno: 325
  md: '# 海伯伦定理（I）


    定理3.5：一个子句集S是不可满足的，当且仅当从S的完全语义树能导出一棵有限的封闭语义树。


    证明：


    必要性：设S是不可满足的，则对任一H-解释否定S的某个基例，而S的完全语义树的每个分支对应一个H-解释，所以，语义树的每个分支中都有失败节点。所以从S的完全语义树能导出一棵封闭语义树。


    充分性：如果从S的完全语义树能导出一棵有限的封闭语义树，那么S的所有H-解释都要至少弄假S的一个子句，从而弄假S。从而所有的海伯伦解释不能满足S。由前面的定理知，S不可满足。'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# 海伯伦定理（II）


    定理3.6：一个子句集S是不可满足的当且仅当存在S的有限基例集合是不可满足的。


    证明：


    必要性：由前面的定理知，一定存在一棵封闭语义树，由其失败节点对应的S的子句的基例构成的集合是有限的，而且是不可满足的。


    充分性：设S的子句集有一个不可满足的基例集S′，因为S的每一个H-解释I_H都包含一个S′的解释I_H′，而I_H′不满足S′，所以I_H也不满足S′，即所以I_H不满足S。换句话说，如果S可满足则有H-解释满足S的任一子句，从而满足S的所有基例，而S′不可满足，所以S不可满足。'
  merge: -1
