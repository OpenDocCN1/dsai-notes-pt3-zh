- pgno: 215
  md: '# 2. 5. 4 框架系统的的问题求解过程


    # 匹配和填槽


    框架的匹配实际上是通过对相应槽的槽名和槽值逐个进行比较，并利用继承关系来实现的。


    例如，假设前面讨论的学生框架系统已建立在知识库中，若要求从知识库中找出一个满足如下条件的硕士生：


    male, Age<25 , Major为Computer , Project为National


    把这些条件用框架表示出来，就可得到如下的初始问题框架


    ```

    Frame <Master-x>

    Name:

    Sex: male

    Age: Years<25

    Major: Computer

    Project: National

    ```


    用此框架和知识库中的框架匹配，显然“Master-2”框架可以匹配。因为Age、Major槽都符合要求，Sex槽和Project槽虽然没有给出，但由继承性可知它们分别取默认值male和National，完全符合初始问题框架Master-x的要求，所以要找的学生有可能是Liu
    Qing。'
  merge: -1
  img_proc: true
