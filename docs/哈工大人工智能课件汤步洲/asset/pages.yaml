- pgno: 236
  md: '# 3.2.1产生式系统的基本结构


    综合数据库DB(Data Base)

    (1) 存放推理过程的各种当前信息。

    如：

    问题的初始状态

    输入的事实

    中间结论及最终结论


    (2) 作为推理过程选择可用规则的依据。

    推理过程中某条规则是否可用，是通过该规则的前提与DB中的已知事实的匹配来确定的。

    可匹配的规则称为可用规则。利用可用规则进行推理，将会得到一个结论。

    该结论若不是目标，将作为新的事实放入DB，成为以后推理的已知事实。


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_236_0.png)


    规则库RB(Rule Base)

    也称知识库KB(Knowledge Base)

    (1) 作用

    用于存放推理所需要的所有规则，是整个产生式系统的知识集。

    是产生式系统能够进行推理的根本。

    (2) 要求

    知识的完整性、一致性、准确性、灵活性和可组织性'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# 3.2.1产生式系统的基本结构


    控制系统(Control system)


    控制系统的主要作用

    亦称推理机，用于控制整个产生式系统的运行，决定问题求解过程的推理线路。


    控制系统的主要任务


    选择匹配：按一定策略从规则库种选择规则与综合数据库中的已知事实进行匹配。

    匹配是指把所选规则的前提与综合数据库中的已知事实进行比较，若事实库中存的事实与所选规则前提一致，则称匹配成功，该规则为可用；否则，称匹配失败，该规则不可用。


    冲突消解：对匹配成功的规则，按照某种策略从中选出一条规则执行。


    执行操作：对所执行的规则，若其后件为一个或多个结论，则把这些结论加入综合数据库；若其后件为一个或多个操作时，执行这些操作。


    终止推理：检查综合数据库中是否包含有目标，若有，则停止推理。


    路径解释：在问题求解过程中，记住应用过的规则序列，以便最终能够给出问题的解的路径。


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_237_0.png)'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# 3.2.2 产生式系统的推理过程


    # 正向推理


    从已知事实出发、正向使用规则，亦称为数据驱动推理或前向链推理。


    # 算法描述


    +   (1) 把用户提供的初始证据放入综合数据库；

    +   (2) 检查综合数据库中是否包含了问题的解，若已包含，则求解结束，并成功推出；否则执行下一步；

    +   (3) 检查知识库中是否有可用知识，若有，形成当前可用知识集，执行下一步；否则转(5)。

    +   (4) 按照某种冲突消解策略，从当前可用知识集中选出一条规则进行推理，并将推出的新事实加入综合数据库种，然后转(2)。

    +   (5) 询问用户是否可以进一步补充新的事实，若可补充，则将补充的新事实加入综合数据库中，然后转(3)；否则表示无解，失败退出。


    至于如何根据综合数据库中的事实到知识库中选取可用知识，当知识库中有多条知识可用时应该先使用那一条知识等。这些问题涉及到了知识的匹配方法和冲突消解策略。


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_238_0.png)'
  merge: -1
  img_proc: true
- pgno: 239
  md: '其流程图如下：


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_239_0.png)'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# 例: 请用正向推理完成以下问题的求解


    假设知识库中包含有以下2条规则:


    +   r1: IF B THEN C

    +   r2: IF A THEN B


    已知初始证据A，求证目标C。


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_240_0.png)


    # 解: 推理过程如下:


    推理开始前，综合数据库为空。


    推理开始后，先把A放入综合数据库，然后检查综合数据库中是否含有该问题的解，回答为“N”。


    接着检查知识库中是否有可用知识，显然r2可用，形成仅含r2的知识集。从该知识集中取出r2，推出新的事实B，将B加入综合数据库，检查综合数据库中是否含有目标C，回答为“N”。


    再检查知识库中是否有可用知识，此时由于B的加入使得r1为可用，形成仅含r1的知识集。从该知识集中取出r1，推出新的事实C，将C加入综合数据库，检查综合数据库中是否含有目标C，回答为“Y”。


    它说明综合数据库中已经含有问题的解，推理成功结束，目标C得证。'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# 3.2.2 产生式系统的推理过程


    # 逆向推理


    从某个假设目标出发，逆向使用规则，亦称为目标驱动推理或逆向链推理。


    # 算法描述：


    +   (1) 将要求证的目标（称为假设）构成一个假设集；

    +   (2) 从假设集中选出一个假设，检查该假设是否在综合数据库中，若在，则该假设成立，此时，若假设集为空，则成功退出，否则仍执行(2)；若该假设不在数据库中，则执行下一步；

    +   (3) 检查该假设是否可由知识库的某个知识导出，若不能由某个知识导出，则询问用户该假设是否为可由用户证实的原始事实，若是，该假设成立，并将其放入综合数据库，再重新寻找新的假设，若不是，则转(5)；若能由某个知识导出，则执行下一步；

    +   (4) 将知识库中可以导出该假设的所有知识构成一个可用知识集；

    +   (5) 检查可用知识集是否为空，若是，失败退出；否则执行下一步；

    +   (6) 按冲突消解策略从可用知识集中取出一个知识，继续；

    +   (7) 将该知识的前提中的每个子条件都作为新的假设放入假设集，然后转(2)。


