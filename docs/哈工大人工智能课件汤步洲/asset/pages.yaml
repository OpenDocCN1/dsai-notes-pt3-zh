- pgno: 301
  md: '# 3.4.2子句集及其应用


    # 子句集的应用


    # 子句集化简过程的唯一性及其对不可满足性的影响


    由于子句集化简过程在消去存在量词时所用的Skolem函数可以不同，因此所得到的标准子句集不唯一。


    当原谓词公式为可满足时，它与其标准子句集不一定等价。但当原谓词公式为不可满足时，其标准子句集则一定是不可满足的，即Skolem化并不影响原谓词公式的不可满足性。


    这个结论很重要，是归结原理的主要依据，可用定理的形式来描述。


    定理3.1 设有谓词公式F，其标准子句集为S，则F为不可满足的充要条件是S为不可满足的。'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# 3.4.2 子句集及其应用


    # 子句集的应用


    由于连词化归律、双重否定律、狄摩根律、量词转化律、变元标准化得到的均为等价式，因此，F化为前束形之后与谓词公式F是等价的。另外，消去存在量词以后的各个步骤也均使用等价式，所以语义不会发生变化。由此可见，**不等价只出现在消去存在量词那个步骤。**


    为证明此定理，先作如下说明：


    为讨论问题方便，设给定的谓词公式F已为前束形


    $(Q_1x_1)\cdots(Q_rx_r)\cdots(Q_nx_n)M(x_1,x_2,\ldots,x_n)$


    其中，$M(x_1,x_2,\ldots,x_n)$已化为合取范式。


    由于将F化为这种前束形是一种很容易实现的等价运算，因此这种假设是可以的。'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# 3.4.2子句集及其应用


    # 子句集的应用


    又设(Qr Xr)是第一个出现的存在量词(∃ Xr)，即F为


    F=(∀ x1)...(∀ xr-1)(∃ xr)(Qr+1 Xr+1)...(Qn Xn)M(x1,...,xr-1,Xr,Xr+1...,Xn)


    为把F化为Skolem形，需要先消去这个(∃ Xr)，并引入Skolem函数，得到


    F1=(∀ x1)...(∀ xr-1)(Qr+1 Xr+1)...(Qn Xn)M(x1,...,xr-1,f(x1,...,xr-1),xr+1...,xn)


    若能证明


    F不可满足 ⇔ F1 不可满足


    则同理可证


    F1 不可满足 ⇔ F2 不可满足


    重复这一过程，直到证明了


    Fm-1 不可满足 ⇔ Fm 不可满足


    为止。


    此时，Fm 已为F的Skolem标准形。而S只不过是Fm的一种集合表示形式。因此有


    Fm 不可满足 ⇔ S不可满足


    下面开始用反证法证明'
