  md: '# Inference by Enumeration


    +   - General case:

    +     - Evidence variables: $E_1 \dots E_k = e_1 \dots e_k$

    +     - Query* variable: $Q$

    +     - Hidden variables: $H_1 \dots H_r$

    +     $\left. \begin{array}{c} X_1, X_2, \dots X_n \\ \text{All variables} \end{array}
    \right\}$


    We want:


    $P(Q|e_1 \dots e_k)$


    * Works fine with multiple query variables, too


    Step 1: Select the entries consistent with the evidence


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_563_0.png)


    Step 2: Sum out H to get joint of Query and evidence


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_563_1.png)


    Step 3: Normalize


    $\times \dfrac{1}{Z}$


    $P(Q, e_1 \dots e_k) = \sum_{h_1 \dots h_r} P(Q, h_1 \dots h_r, e_1 \dots e_k)$

    $\underbrace{X_1, X_2, \dots X_n}$


    $Z = \sum_{q} P(Q, e_1 \dots e_k)$


    $P(Q|e_1 \dots e_k) = \dfrac{1}{Z} P(Q, e_1 \dots e_k)$'
