- pgno: 668
  md: '# Likelihood Weighting


    +   - Likelihood weighting is good

    +     - We have taken evidence into account as we generate the sample

    +     - E.g. here, W’s value will get picked based on the evidence values of S,
    R

    +     - More of our samples will reflect the state of the world suggested by the
    evidence


    +   - Likelihood weighting doesn’t solve all our problems

    +     - Evidence influences the choice of downstream variables, but not upstream
    ones (C isn’t more likely to get a value matching the evidence)

    +   - We would like to consider evidence when we sample every variable

    +     → Gibbs sampling


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_668_0.png)'
  merge: -1
  img_proc: true
