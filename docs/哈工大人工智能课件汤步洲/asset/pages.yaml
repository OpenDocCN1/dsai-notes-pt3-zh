- pgno: 415
  md: '# 4.2 状态空间的盲目搜索


    # 状态空间搜索的基本思想


    先把问题的初始状态作为当前扩展节点对其进行扩展，生成一组子节点，然后检查问题的目标状态是否出现在这些子节点中。若出现，则搜索成功，找到了问题的解；若没出现，则再按照某种搜索策略从已生成的子节点中选择一个节点作为当前扩展节点。


    重复上述过程，直到目标状态出现在子节点中或者没有可供操作的节点为止。所谓对一个节点进行“扩展”是指对该节点用某个可用操作进行作用，生成该节点的一组子节点。


    # 算法的数据结构和符号约定


    +   - **Open表：** 用于存放刚生成的节点，未扩展的节点，Open表称为未扩展的节点表。

    +   - **Closed表：** 用于存放已经扩展或将要扩展的节点，Closed称为已扩展的节点表。

    +   - **S₀：** 用表示问题的初始状态

    +   - **Sg：** 用表示问题的目标状态'
  merge: -1
  img_proc: true
- pgno: 416
  md: '# 4.2 状态空间的盲目搜索


    # 4.2.1 一般图搜索过程


    +   (1) 把初始节点S₀放入Open表，并建立目前仅包S₀的图G，建立一个Closed表，置为空；

    +   (2) 检查Open表是否为空表，若为空，则问题无解，失败退出

    +   (3) 把Open表的第n个节点取出放入Closed表，并标记该节点为n

    +   (4) 考察节点n是否为目标节点，若是则得到问题的解成功退出。

    +   (5) 扩展节点n,生成n个子节点。把这些子节点中不是其父节点的那些分子子节点计入集合M，并把这些子节点作为节点n的子节点加G中。'
  merge: -1
  img_proc: true
- pgno: 417
  md: '# 4.2 状态空间的盲目搜索


    # 4.2.1 一般图搜索过程


    （6）针对M中子节点的不同情况，分别作如下处理：


    +   1. 对那些没有在G中出现过的M成员设置一个指向其父节点（即节点n）的指针，并将它放入Open表。

    +   2. 对那些原来已经在G中出现过，但没有被扩展过的M成员，确定是否需要修改它指向父节点的指针。

    +   3. 对那些原来已经在G中出现过，并已经被扩展过的M成员，确定是否需要修改其后继节点指向父节点的指针。


    （7）按某种策略对Open表中的节点进行排序


    （8）转第（2）步'
  merge: -1
  img_proc: true
- pgno: 418
  md: '# 4.2 状态空间的盲目搜索


    # 4.2.1 一般图搜索过程


    说明：


    +   (1) 上述过程是状态空间的一般图搜索算法，它具有通用性，后面所要讨论的各种状态空间搜索策略都是上述过程的特例。各种搜索策略的主要区别在于对 Open
    表中节点的排序顺序的不同。


    +   (2) 在第（6）步针对 M 中子节点的不同情况进行处理时，如果生第②种情况时，那么，这个 M 中子节点究竟应该作为哪个节点的后继节点呢？


    一般是由原始节点到该节点路径上所付出的代价来决定的，哪条路径付出的代价小，相应的节点就作为它的父节点。所谓由原始节点到该节点路径的代价是指这条路径上所有有向边代价之和。


    如果发生③情况，除了需要确定该子节点指向父节点的指针外，还需要确定其后继节点指向父节点的指针。其依据也是由原始节点到该节点路径上的代价。'
  merge: -1
