- pgno: 478
  md: '# 4. 3. 4. 2 A*算法的最优性


    证明：（用数学归纳法）

    （1）对深度 d(n)=0 的节点，即 n 为初始节点 S₀，如 n 为目标节点，则 A₁* 和 A₂* 都不扩展 n；如果 n 不是目标节点，则 A₁*
    和 A₂* 都要扩展 n。

    （2）假设对 A₂* 中 d(n)=k 的任意节点 n 结论成立，即 A₁* 也扩展了这些节点。

    （3）证明 A₂* 中 d(n)=k+1 的任意节点 n，也要由 A₁* 扩展。（用反证法）

    假设 A₂ 搜索树上有一个满足 d(n)=k+1 的节点 n，A₂* 扩展了该节点，但 A₁* 没有扩展它。根据第(2)条的假设，知道 A₁* 扩展了节点
    n 的父节点。因此，n 必定在 A₁* 的 Open 表中。既然节点 n 没有被 A₁* 扩展，则有

    f₁(n) ≥ f*(S₀)

    即 g₁(n)+h₁(n) ≥ f*(S₀)。但由于 d=k 时，A₂* 扩展的节点 A₁* 也一定扩展，故有

    g₁(n) ≤ g₂(n)

    因此有 h₁(n) ≥ f*(S₀)-g₂(n)

    另一方面，由于 A₂* 扩展了 n，因此有

    f₂(n) ≤ f*(0)

    即 g₂(n)+h2(n) ≤ f*(S₀)，亦即 h2(n) ≤ f*(S₀)-g₂(n)，所以有 h₁(n) ≥ h₂(n)

    这与我们最初假设的 h₁(n)<h₂(n) 矛盾，因此反证法的假设不成立。'
  merge: -1
  img_proc: true
- pgno: 479
  md: '# 4.3.4.3 h(n) 的单调限制


    在A*算法中，每当扩展一个节点 n 时，都需要检查其子节点是否已在 Open 表或 Closed 表中。


    对已在 Open 表中的子节点，需要决定是否调整指向其父节点的指针；对已在 Closed 表中的子节点，除需要决定是否调整其指向父节点的指针外，还需要决定是否调整其子节点的后继节点的父指针。


    如果能够保证，每当扩展一个节点时就已经找到了通往这个节点的最佳路径，就没有必要再去作上述检查。


    为满足这一要求，我们需要对启发函数 h(n) 增加单调性限制。


    定义4.1 如果启发函数满足以下两个条件：


    +   1. h(Sg)=0;

    +   2. 对任意节点 nᵢ 及其任一子节点 nⱼ，都有

    +      0≤h(nᵢ)-h(nⱼ)≤c(nᵢ,nⱼ)


    其中 c(nᵢ,nⱼ) 是 nᵢ 到其子节点 nⱼ 的边代价，则称 h(n) 满足单调限制。'
  merge: -1
  img_proc: true
- pgno: 480
  md: '# 4. 3. 4. 3 h(n)的单调限制


