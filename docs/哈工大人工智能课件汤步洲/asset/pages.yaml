- pgno: 381
  md: '# 4.1 概述


    # 4.1.1 搜索的含义


    概念：


    依靠经验，利用已有知识，根据问题的实际情况，不断寻找可利用知识，从

    而构造一条代价最小的推理路线，使问题得以解决的过程称为搜索


    适用情况：


    不良结构或非结构化问题；难以获得求解所需的全部信息；更没有现成的算法可供求解使用。结构良好，理论上有算法可以的，但问题或算法的复杂性较高


    搜索的分类


    按是否使用启发式信息：


    盲目搜索：按预定的控制策略进行搜索，在搜索过程中获得的中间信息并不改变控制策略。


    启发式搜索：在搜索中加入了与问题有关的启发性信息，用于指导搜索朝着最有希望的方向前进，加速问题的求解过程并找到最优解。


    按问题的表示方式：


    状态空间搜索：用状态空间法来求解问题所进行的搜索


    与或树搜索：用问题归约法来求解问题时所进行的搜索'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# 4.1 概述


    # 4.1.2 问题的概述


    • 问题可以形式化地定义为三个组成部分


    +   （1）初始状态（Initial state）\(s_0\)；


    +   （2）后继函数：


    操作函数（Actions）：\{a_1, a_2, a_3……\}


    路径耗散函数（PathCost）：PathCost（\(s_0 \xrightarrow{a_1} s_1 \cdots \xrightarrow{a_{i-1}}
    s_l\)）


    +   （3）目标测试函数（GoalTest）：GoalTest(s) → T/F


    • 问题的解：初始状态到目标状态的操作的序列。（\(s_0 \xrightarrow{a_1} s_1 \cdots \xrightarrow{a_{n-1}}
    s_n\)）'
  merge: -1
  img_proc: true
- pgno: 383
  md: '# 4.1 概述


    # 4.1.3 状态空间法


    # 状态(State)


    是表示问题求解过程中每一步问题状况的数据结构，它可形式地表示为：


    Sₖ = {Sₖ0, Sₖ1, ...}


    当对每一个分量都给以确定的值时，就得到一个具体的状态。


    # 操作(Operator)


    也称为算符，它是把问题从一种状态变换为另一种状态的手段。操作可以是一个机械步骤，一个运算，一条规则或一个过程。操作可理解为状态集合上的一个函数，它描述了状态之间的关系。


    # 状态空间(State space)


    用来描述一个问题的全部状态以及这些状态之间的相互关系。常用一个三元组表示为：


    (S, F, G)


    其中，S为问题的所有初始状态集合；F为操作的集合；G为目标状态的集合。

    状态空间也可用一个赋值的有向图来表示，该有向图称为状态空间图。在状态空间图中，节点表示问题的状态，有向边表示操作。'
  merge: -1
  img_proc: true
- pgno: 384
  md: '# 4.1 概述


    # 4.1.3 状态空间法


    状态空间法求解问题的基本过程：


    +   首先，为问题选择适当的“状态”及“操作”的形式化描述方法；

    +   然后，从某个初始状态出发，每次使用一个“操作”，递增地建立起操作序列，直到达到目标状态为止；

    +   最后，由初始状态到目标状态所使用的算符序列就是该问题的一个解。


    问题：①最优解问题；②搜索策略问题。


