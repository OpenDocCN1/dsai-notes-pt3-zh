  md: "# 3.4.7 用归结反演求取问题的答案\n\n归结原理除了可用于定理证明外，还可用来求取问题答案，其思想与定理证明相似。\n\n一般步骤为：\n\n\
    +   ① 把已知条件用谓词公式表示，并化成相应的子句集$S_1$；\n+   \n+   ② 把待求解的问题也用谓词公式表示，然后将其否定，并与谓词ANSWER构成析取式$G_1$；\n\
    +   \n+   ③ 把$G_1$化为子句集$S_2$，并把子句集$S_2$与$S_1$合并构成新子句集；\n+   \n+   ④ 对子句集$S$应用谓词归结原理进行归结，在归结过程中通过合一置换，改变ANSWER中的变元；\n\
    +   \n+   ⑤ 如果得到归结式ANSWER，则问题的答案就在ANSWER谓词中。"
