- pgno: 556
  md: '# Normalization Trick


    P(W = s | T = c) = P(W = s, T = c) / P(T = c) = P(W = s, T = c) / [P(W = s, T
    = c) + P(W = r, T = c)] = 0.2 / (0.2 + 0.3) = 0.4


    P(T, W)


    | T | W | P |

    |---|---|---|

    | hot | sun | 0.4 |

    | hot | rain | 0.1 |

    | cold | sun | 0.2 |

    | cold | rain | 0.3 |


    SELECT the joint probabilities matching the evidence


    P(c, W)


    | T | W | P |

    |---|---|---|

    | cold | sun | 0.2 |

    | cold | rain | 0.3 |


    NORMALIZE the selection (make it sum to one)


    P(W | T = c)


    | W | P |

    |---|---|

    | sun | 0.4 |

    | rain | 0.6 |


    P(W = r | T = c) = P(W = r, T = c) / P(T = c) = P(W = r, T = c) / [P(W = s, T
    = c) + P(W = r, T = c)] = 0.3 / (0.2 + 0.3) = 0.6'
