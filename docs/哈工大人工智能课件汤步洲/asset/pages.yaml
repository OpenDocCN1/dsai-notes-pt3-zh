- pgno: 677
  md: '# Particle Filtering


    +   - Particle filtering operates on ensemble of samples

    +     - Performs likelihood weighting for each individual sample to elapse time
    and incorporate evidence


    +   - Resamples from the weighted ensemble of samples to focus computation for
    the next time step where most of the probability mass is estimated to be'
  merge: -1
  img_proc: true
- pgno: 678
  md: "# Markov Chain Monte Carlo*\n\n+   - *Idea*: instead of sampling from scratch,\
    \ create samples that are each like the last one.\n+   - *Procedure*: resample\
    \ one variable at a time, conditioned on all the rest, but keep evidence fixed.\
    \ E.g., for P(b|c):\n+   \n+     +b → +a → +c    ¬b → +a → +c    ¬b → ¬a → +c\n\
    +   - *Properties*: Now samples are not independent (in fact they’re nearly identical),\
    \ but sample averages are still consistent estimators!\n+   - *What’s the point*:\
    \ both upstream and downstream variables condition on evidence."
  merge: -1
  img_proc: true
