  md: "# 4.3.4. 3 h(n) 的单调限制\n\n定理4.6 如果 h(n) 满足单调限制，则 A* 算法扩展的节点序列的 f 值是非递减的，即 f(ni)\
    \ ≤ f(ni+1)。\n证明：假设节点 ni+1 在节点 ni 之后立即扩展，由单调限制条件可知\n h(ni) - h(ni+1) ≤ c(ni, ni+1)\n\
    即 f(ni) - g(ni) - f(ni+1) + g(ni+1) ≤ c(ni, ni+1)\n亦即 f(ni) - g(ni) - f(ni+1)\
    \ + g(ni) + c(ni, ni+1) ≤ c(ni, ni+1)\n所以 f(ni) - f(ni+1) ≤ 0\n即 f(ni) ≤ f(ni+1)\n\
    以上两个定理都是在 h(n) 满足单调性限制的前提下才成立的。如果 h(n) 不满足单调性限制，则它们不一定成立。\n\n在 h(n) 满足单调性限制下的\
    \ A* 算法常被称为改进的 A* 算法。"
