    | +r | +t | 0.08 |

    | +r | -t | 0.02 |

    | -r | +t | 0.09 |

    | -r | -t | 0.81 |


    +   - Computation for each entry: pointwise products


    ∀r, t : P(r, t) = P(r) · P(t|r)'
