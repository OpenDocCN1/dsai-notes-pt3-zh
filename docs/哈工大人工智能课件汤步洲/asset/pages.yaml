- pgno: 29
  md: '# 什么是人工智能？


    # 4. 理性行为方法


    理性行为方法亦称为理性智能体方法，它是一种基于智能体定义智能的方法。典型代表是尼尔森（N.J.Nilsson）于1998年提出的定义：人工智能关心的是人工制品中的智能行为。这里的人工制品主要是指能够感知环境、适应变化、自主操作、执行动作的理性智能体（Agent）。按照这种方法，可以认为人工智能就是研究和建造理性智能体。


    # 理性行为方法与理性思维方法的关系：


    首先，理性行为和理性思维强调的重点不同。理性思维方法强调的是正确思维，而理性行为方法强调的则是合理行动。


    其次，理性行为可以依据理性思维进行。例如，对一些能够通过理性思维做出正确结论的事情，实现理性行为的途径往往是先通过逻辑推理得出该行为能达到的目标和结论，然后再付诸实施。


    再其次，理性行为不一定要依据理性思维进行。例如，对有些事情，即使理性思维无法证明哪些行为是正确的，而其它行为是错误的，理性行为也必须有所行动。'
  merge: -1
  img_proc: true
