- pgno: 361
  md: '# 3. 4. 6归结演绎推理的归结策略


    # 2. 删除策略


    基本思想：归结过程在寻找可归结子句时，子句集中的子句越多，需要付出的代价就会越大。如果在归结时能把子句集中无用的子句删除掉，这就会缩小搜索范围，减少比较次数，从而提高归结效率。


    +   a) 纯文字删除法


    纯文字：如果某文字L在子句集中不存在可与其互补的文字¬L，则称该文字为纯文字。


    在归结过程中，纯文字不可能被消除，用包含纯文字的子句进行归结也不可能得到空子句，因此对包含纯文字的子句进行归结是没有意义的，应该把它从子句集中删除。


    对子句集而言，删除包含纯文字的子句，是不影响其不可满足性的。例如，对子句集


    ```

    S={P∨Q∨R, ¬Q∨R, Q, ¬R}

    ```


    其中P是纯文字，因此可以将子句P∨Q∨R从子句集S中删除。'
  merge: -1
  img_proc: true
- pgno: 362
  md: '# 3.4.6 归结演绎推理的归结策略


    # 2. 删除策略


    b) 重言式删除法


    重言式：如果一个子句中包含有互补的文字对，则称其为重言式。如


    P(x) ∨ ¬P(x), P(x) ∨ Q(x) ∨ ¬P(x)


    都是重言式。


    重言式是真值为真的子句。对一个子句集来说，不管是增加还是删除一个真值为真的子句，都不会影响该子句集的不可满足性。因此，可删去。


    c) 包孕（含）删除法


    包孕：设有子句 C1 和 C2，如果存在一个置换 σ，使得 C1 σ ⊆ C2，则称 C1 包孕于 C2。例如


    P(x) 包孕于 P(a) σ={a/x}


    P(x) 包孕于 P(a) ∨ Q(z) σ={a/x}


    P(x) ∨ Q(a) 包孕于 P(f(a)) ∨ Q(a) ∨ R(y) σ={f(a)/x}


    P(x) ∨ Q(y) 包孕于 P(a) ∨ Q(u) ∨ R(w) σ={a/x, u/y}


    对子句集来说，把其中包孕的子句删去后，不会影响该子句集的不可满足性。因此，可从子句集中删除那些包孕的子句。'
