- pgno: 496
  md: '# 4.4.3 与或树的启发式搜索


    +   > 与/或树的启发式搜索过程实际上是一种利用搜索过程所得到的启发性信息寻找最优解树的过程。

    +   > 算法的每一步都试图找到一个最有希望成为最优解树的子树。

    +   > 最优解树是指代价最小的那棵解树。

    +   > 它涉及到解树的代价与希望树。'
  merge: -1
  img_proc: true
- pgno: 497
  md: '# 4. 4. 3 与或树的启发式搜索


    • 解树的代价


    1.若n为终止节点，则其代价h(n) = 0


    2.若n为或节点，且子节点为n₁, n₂, ⋯, nk，则n的代价为：


    h(n) = min_{1≤i≤k} {c(n, ni) + h(ni)}


    其中，c(n, ni)是节点n到其子节点ni的代价。


    3.若n为与节点，且子节点为n₁, n₂, ⋯, nk，则n的代价可用和代价法或最大代价法求出来：


    若用和代价法，则计算公式为：h(n) = ∑_{i=1}^k [c(n, ni) + h(ni)];


    若用最大代价法，则其计算公式为：h(n) = max_{1≤i≤k} {c(n, ni) + h(ni)}。


    4.若n是端节点，但又不是终止节点，则n不可扩展，其代价定义为h(n) = +∞


    5.根节点的代价即为解树的代价。'
  merge: -1
  img_proc: true
