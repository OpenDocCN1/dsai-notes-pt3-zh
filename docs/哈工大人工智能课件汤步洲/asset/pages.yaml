  md: '# 语义树


    定义21：设S为子句集，A是它的H基，S的一棵语义树是一棵向下生长的二叉树，每一非终节点向下生长的两条边上分别对应A中某个基原子和它的否定。但从根节点到任一节点的路径上不存在这样的互补对。


    定义22：语义树是一棵完全语义树当且仅当从根节点至每一终节点的路径上出现A中每一个基原子所对应的正文字或负文字。


    +   ◆ 基原子代表"真"，基原子之非代表"假"

    +   ◆ 每一分支都代表了一个H解释'
