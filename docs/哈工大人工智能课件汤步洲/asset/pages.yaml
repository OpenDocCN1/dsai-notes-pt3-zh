- pgno: 226
  md: '# 3.1 推理概述


    # 3.1.1 推理的基本概念


    # ➢ 推理的定义


    推理就是按照某种策略从已有事实和知识推出结论的过程。


    心理学对推理有两种解释：


    从结构的角度：


    认为推理由两个以上的判断所组成，把判断定义为对客观事物做出肯定或否定的思维活动；认为判断是在概念的基础上进行的，所揭示的是概念之间联系和关系。例如，若有以下两个判断：


    +   ① 计算机系的学生都会编程序；

    +   ② 程强是计算机系的一名学生；


    则可得出下面第三个判断：


    +   ③ 程强会编程序。


    因此，推理就是对已有判断进行分析和综合，再得出新的判断的过程。'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# 3.1 推理概述


    # 3.1.1 推理的基本概念


    从过程的角度：


    认为推理是在给定信息和已有知识的基础上的一系列加工操作，提出了如下人类推理的公式：


    y=F(x, k)


    其中，x为推理时给出的信息，k为推理时可用的领域知识和特殊事例，F为可用的一系列操作，y为推理过程所得到的结论。


    # 推理的机器实现


    人工智能中的推理是由推理机完成的。所谓推理机，是指系统中用来实现推理的那段程序。


    根据推理所用知识的不同，推理方式和推理方法的不同，推理机的构造也有所不同。'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# 3.1.2 推理的分类


    按推理的逻辑基础分类


    # 1）演绎推理：


    从已知的一般性知识出发，推理出适合于某种个别情况的结论过程。


    即从一般到个别的推理。


    常用形式：三段论法(大前提、小前提、结论)


    +   大前提：是已知的一般性知识或推理过程得到的判断；

    +   小前提：是关于某种具体情况或某个具体实例的判断；

    +   结论：是由大前提推出的，并且适合于小前提的判断。'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# 【演绎推理实例】


    +   1. 音乐系的学生至少会演奏一种乐器；（大前提）

    +   2. 李聪是音乐系的一名学生；（小前提）

    +   3. 李聪至少会演奏一种乐器。（结论）'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# 2）归纳推理：


    从大量特殊事例出发，归纳出一般性结论的推理过程。

    即从个别到一般的推理过程。


    归纳推理

    特殊事例考察范围

    完全归纳推理

    不完全归纳推理

    推理使用方法

    枚举归纳推理

    类比归纳推理'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# 推理的分类


    演绎推理是在已知领域内的一般性知识的前提下，通过演绎求解一个具体问题或者证明一个结论的正确性。它所得出的结论实际上早已蕴含在一般性知识的前提中，演绎推理只不过是将已有事实揭露出来，因此它不能增殖新知识。


    归纳推理所推出的结论是没有包含在前提内容中的。这种由个别事物或现象推出一般性知识的过程，是增殖新知识的过程。


    例如，一位计算机维修员，从书本知识，到通过大量实例积累经验，是一种归纳推理方式。运用这些一般性知识去维修计算机的过程则是演绎推理。'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# 按所用知识的确定性分类


    # 1）确定性推理


    推理时所有用的知识和证据都是确定的，

    推出的结论也是确定的，其真值或者为真或者为假，没有第三种情况出现。


    # 2）不确定性推理


    推理时所用的知识和证据不都是确定的，

    推出的结论也不确定的。'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# 按推理中所用知识是否具有启发性分类


    # 1) 启发式推理


    推理过程中应用与问题有关的启发性知识，即解决问题的的策略、技巧及经验，以加快推理过程，提高搜索效率。


    # 2) 非启发式推理


    在推理过程中，不运用启发性知识，只按照一般的控制逻辑进行推理。这种方法缺乏对求解问题的针对性，所以推理效率较低，容易出现“组合爆炸”问题。'
  merge: -1
  img_proc: true
