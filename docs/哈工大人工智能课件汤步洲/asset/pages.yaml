- pgno: 332
  md: '# 3.4.4 鲁滨逊归结原理


    # 命题逻辑的归结


    定理3.7 归结式 C12 是其亲本子句 C1 和 C2 的逻辑结论。


    证明：（按定义）设 C1 = L ∨ C1''，C2 = ¬L ∨ C2'' 关于解释 I 为真，则只需证明 C12 = C1'' ∨ C2'' 关于解释
    I 也为真。

    对于解释 I，L 和 ¬L 中必有一个为假。


    若 L 为假，则必有 C1'' 为真，不然就会使 C1 为假，这将与前提假设 C1 为真矛盾，因此只能有 C1'' 为真。


    同理，若 ¬L 为假，则必有 C2'' 为真。


    因此，必有 C12 = C1'' ∨ C2'' 关于解释 I 也为真。即 C12 是 C1 和 C2 的逻辑结论。'
