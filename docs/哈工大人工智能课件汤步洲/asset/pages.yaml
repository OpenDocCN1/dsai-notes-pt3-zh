- pgno: 670
  md: '# # Gibbs Sampling


    +   - Procedure: keep track of a full instantiation x₁, x₂, ..., xₙ. Start with
    an arbitrary instantiation consistent with the evidence. Sample one variable at
    a time, conditioned on all the rest, but keep evidence fixed. Keep repeating this
    for a long time.


    +   - Property: in the limit of repeating this infinitely many times the resulting
    sample is coming from the correct distribution


    +   - Rationale: both upstream and downstream variables condition on evidence.


    +   - In contrast: likelihood weighting only conditions on upstream evidence,
    and hence weights obtained in likelihood weighting can sometimes be very small.
    Sum of weights over all samples is indicative of how many "effective" samples
    were obtained, so want high weight.'
  merge: -1
  img_proc: true
- pgno: 671
  md: '# Gibbs Sampling Example: P( S | +r)


    +   - Step 1: Fix evidence

    +     - R = +r


    +   - Step 2: Initialize other variables

    +     - Randomly


    +   - Steps 3: Repeat

    +     - Choose a non-evidence variable X

    +     - Resample X from P( X | all other variables)


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_671_0.png)


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_671_1.png)


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_671_2.png)


    Sample from P(S | + c, −w, +r)


    Sample from P(C | + s, −w, +r)


    Sample from P(W | + s, +c, +r)'
  merge: -1
  img_proc: true
- pgno: 672
  md: '# Gibbs Sampling


    +   - How is this better than sampling from the full joint?

    +     - In a Bayes’ Net, sampling a variable given all the other variables (e.g.
    P(R|S,C,W)) is usually much easier than sampling from the full joint distribution

    +       - Only requires a join on the variable to be sampled (in this case, a
    join on R)

    +       - The resulting factor only depends on the variable’s parents, its children,
    and its children’s parents (this is often referred to as its Markov blanket)'
  merge: -1
  img_proc: true
- pgno: 673
  md: '# Efficient Resampling of One Variable


    +   - Sample from P(S | +c, +r, -w)

    +     $P(S|+c,+r,-w) = \frac{P(S,+c,+r,-w)}{P(+c,+r,-w)}$

    +     $= \frac{P(S,+c,+r,-w)}{\sum_s P(s,+c,+r,-w)}$

    +     $= \frac{P(+c)P(S|+c)P(+r|+c)P(-w|S,+r)}{\sum_s P(+c)P(s|+c)P(+r|+c)P(-w|s,+r)}$

    +     $= \frac{P(+c)P(S|+c)P(+r|+c)P(-w|S,+r)}{P(+c)P(+r|+c)\sum_s P(s|+c)P(-w|s,+r)}$

    +     $= \frac{P(S|+c)P(-w|S,+r)}{\sum_s P(s|+c)P(-w|s,+r)}$

    +   - Many things cancel out – only CPTs with S remain!

    +   - More generally: only CPTs that have resampled variable need to be considered,
    and joined together


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_673_0.png)'
  merge: -1
  img_proc: true
