  md: '# 3.3.1 一阶谓词逻辑基础


    +   (5) 狄摩根定律　¬(P∨Q) ⇔ ¬P∧¬Q， ¬(P∧Q) ⇔ ¬P∨¬Q


    +   (6) 吸收律　P∨(P∧Q) ⇔ P， P∧(P∨Q) ⇔ P


    +   (7) 补余律　P∨¬P ⇔ T，P∧¬P ⇔ F


    +   (8) 连词化归律

    +   P→Q ⇔ ¬P∨Q

    +   P↔Q ⇔ (P→Q)∧(Q→P)

    +   P↔Q ⇔ (P∧Q)∨(¬Q∧¬P)


    +   (9) 量词转换律　¬(∃x)P ⇔ (∀x)(¬P)， ¬(∀x)P ⇔ (∃x)(¬P)


    +   (10) 量词分配律

    +   (∀x)(P∧Q) ⇔ (∀x)P∧(∀x)Q

    +   (∃x)(P∨Q) ⇔ (∃x)P∨(∃x)Q'
