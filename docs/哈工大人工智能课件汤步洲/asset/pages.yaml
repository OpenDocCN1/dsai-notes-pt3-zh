- pgno: 31
  md: '# 什么是人工智能？ -总结


    人工智能的一般解释：


    从能力的角度：人工智能是指用人工的方法在机器（计算机）上实现的智能。是智能机器所执行的通常与人类智能有关的功能，如判断、推理、证明、识别、感知、理解、设计、思考、规划、学习和问题求解等思维活动。


    从学科的角度：人工智能是一门研究如何构造智能机器或智能系统，去模拟、延伸和扩展人类智能的学科。是计算机科学中涉及研究、设计和应用智能机器的一个分支。'
