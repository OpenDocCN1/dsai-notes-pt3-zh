- pgno: 430
  md: '# 4.2.3深度优先搜索（Depth-first search）


    在深度优先搜索中，首先扩展最新产生的(即最深的)节点，是后生成的节点先扩展的策略。


    从初始节点S₀开始扩展，若没有得到目标节点，则选择最新产生的子节点进行扩展，若还是不能到达目标节点，则再对刚才最新产生的子节点进行扩展，一直如此向下搜索。


    当到达某个子节点，且该子节点既不是目标节点又不能继续扩展时，才选择其兄弟节点进行考察。


    Open表是一种栈结构，最先进进入的节点排在最后面，最后进入的节点排最前面。'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# 深度优先搜索的一般算法


    +   （1）把初始节点S₀放入Open表，建立一个CLOSED表，置为空；

    +   （2）检查Open表是否为空表，若为空，则问题无解，失败退出；

    +   （3）把Open表的第一个节点取出放入Closed表，并记该节点为n；

    +   （4）考察节点n是否为目标节点，若是则得到问题的解成功退出；

    +   （5）若节点n不可扩展，则转第（2）步；

    +   （6）扩展节点n，将其子节点放入Open表的首部，并为每个子节点设置指向父节点的指针，转向第（2）步。'
  merge: -1
