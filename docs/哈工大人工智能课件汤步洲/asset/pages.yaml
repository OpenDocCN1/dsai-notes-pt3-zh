- pgno: 593
  md: '# Common Effect


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_593_0.png)


    +   - If neither Z nor any of its descendant are observed, X and Y are independent.

    +   - Information cannot be transmitted through Z among parents of Z. It leaks
    down Z and its descendants.

    +   - If Z or any of its descendant is observed, X and Y are dependent.

    +   - Information can be transmitted through Z among parents of Z if Z or any
    of its descendants are observed. Observing Z or its descendants opens the information
    path.'
