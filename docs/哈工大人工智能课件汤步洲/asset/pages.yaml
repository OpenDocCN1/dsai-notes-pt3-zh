- pgno: 217
  md: '# 2.5.5 框架表示法的特征


    # 主要优点：


    **结构性：**最突出特点是善于表示结构性知识，它能够把知识的内部结构关系以及知识间的特殊联系表示出来。


    **深层性：**框架表示法不仅可以从多个方面、多重属性表示知识，而且还可以通过 ISA、AKO 等槽以嵌套结构分层地对知识进行表示，因此能用来表达事物间复杂的深层联系。


    **继承性：**在框架系统中，下层框架可以继承上层框架的槽值，也可以进行补充和修改，这样既减少知识冗余，又较好地保证了知识的一致性。


    **自然性：**框架能把与某个实体或实体集相关特性都集中在一起，从而高度模拟了人脑对实体多方面、多层次的存储结构，直观、自然、易于理解。


    # 主要缺点


    **缺乏框架的形式理论：**至今，还没有建立框架的形式理论。


    **缺乏过程性知识表示：**框架系统不便于表示过程性知识，缺乏如何使框架中知识的描述能力。


    框架推理过程需要用到一些与领域无关的推理规则，而这些规则在框架系统中又很难表达。


    **清晰性难以保证：**由于各框架本身的数据结构不一定相同，从而框架系统的清晰性很难保证。'
  merge: -1
  img_proc: true
