- pgno: 466
  md: '# 4.3.4.1 A*算法的可纳性


    可纳性的含义：


    定义4.2 对任一状态空间图，当从初始节点到目标节点有路径存在时，如果搜索算法总能在有限步骤内找到一条从初始节点到目标节点的最佳路径，并在此路径上结束，则称该搜索算法是可采纳的。


    A*算法可纳性的证明过程可分以下三步：


    +   第一步，对有限图，A*算法一定能够成功结束。

    +   第二步，对无限图，A*算法也一定能够成功结束。

    +   第三步，A*算法一定能够结束在最佳路径上。'
  merge: -1
  img_proc: true
- pgno: 467
  md: '# 4. 3. 4. 1 A*算法的可纳性


    可纳性的证明：


    定理4.1 对有限图, 如果从初始节点S0到目标节点Sg有路径存在, 则算法A*一定成功结束。


    证明：首先证明算法必然会结束。


    由于搜索图为有限图，如果算法能找到解，则则成功结束；如果算法找不到解，则必然会由于Open表变空而结束。因此，A*算法必然会结束。


    然后证明算法一定会成功结束。


    由于至少存在一条有初始节点点到目标节点点的路径，设此路径为 S0 =n0 , n1 , ... , nk =Sg


    算法开始时，节点n0在Open表中，且路径中任一节点ni离开Open表后，其后继节点ni+1必然进入Open表，这样，在Open表变为空前，目标节点点必然出现在Open表中。因此，算法一定会被成功结束。'
  merge: -1
