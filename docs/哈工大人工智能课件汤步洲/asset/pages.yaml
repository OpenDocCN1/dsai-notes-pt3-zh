- pgno: 185
  md: '# 2.4.2 基本语义关系


    # (1) 实例关系：ISA


    体现的是“具体与抽象”的概念，含义为“是一个”，表示一个事物是另一个事物的一个实例。


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_185_0.png)


    # (2) 分类关系：AKO


    亦称泛化关系，体现的是"子类与超类"的概念，含义为"是一种"，表示一个事物是另一个事物的一种类型。


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_185_1.png)


    # (3) 成员关系：A-Member-of


    体现的是"个体与集体"的关系，含义为"是一员"，表示一个事物是另一个事物的一个成员。


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_185_2.png)


    +   一个最主要的特征是属性的继承性，处在具体层的节点可以继承所有抽象层节点的所有属性。'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# 2.4.2 基本语义关系


    # (4)聚类关系


    亦称包含关系。指具有组织或结构特征的"部分与整体"之间的关系。常用的包含关系是：


    Part-of: 含义为"是一部分", 表示一个事物是另一个事物的一部分


    +   • 聚类关系与实例、分类、成员关系的主要区别聚类关系一般不具备属性的继承性。如上例，手不一定具有人的各种属性


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_186_0.png)


    # (5)属性关系


    指事物和其属性之间的关系。常用的有：


    Have: 含义为"有", 表示一个结点具有另一个结点所描述的属性


    Can: 含义为"能"、"会", 表示一个结点能做另一个结点的事情


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_186_1.png)'
