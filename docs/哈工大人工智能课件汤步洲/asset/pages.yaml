- pgno: 359
  md: '# # 3. 4. 6归结演绎推理的归结策略


    # 1. 排序策略


    广（宽）度优先是一种穷尽子句比较的复杂搜索方法。设初始子句集为S0，广度优先策略的归结过程可描述如下：


    +   (1) 从S0出发，对S0中的全部子句作所有可能的归结，得到第一层归结式，把这些归结式的集合记为S1；

    +   (2) 用S0,S1中的子句与S1中的子句进行所有可能的归结，得到第二层归结式，把这些归结式的集合记为S2；

    +   (3) 用S0,S1和S2中的子句与S2中的子句进行所有可能的归结，得到第三层归结式，把这些归结式的集合记为S3；


    如此继续，知道得出空子句或不能再继续归结为止。'
