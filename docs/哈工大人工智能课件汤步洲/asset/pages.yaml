- pgno: 243
  md: '例: 请用逆向推理完成以下问题的求解


    假设知识库中包含有以下2条规则：


    r1： IF B THEN C


    r2： IF A THEN B


    已知初始证据A，求证目标C。


    解： 推理过程如下：


    推理开始前，综合数据库和假设集均为空。


    推理开始后，先将初始证据A和目标C分别放入综合数据库和假设集，然后从假设集中取出一个假设C，查找C是否为综合数据库中的已知事实，回答为“N”。


    再检查C是否能被知识库中的知识所导出，发现C可由r1导出，于是r1被放入可用知识集。由于知识库中只有r1可用，故可用知识集中仅含r1。


    接着从可用知识集中取出r1，将其前提条件B作为新的假设放入假设集。从假设集中取出B，检查B是否为综合数据库中的实事，回答为“N”。再检查B是否能被知识库中的知识所导出，发现B可由r2导出，于是r2被放入可用知识集。由于知识库中只有r2可用，故可用知识集中仅含r2。


    从可用知识集中取出r2，将其前提条件A作为新的假设放入假设集。然后从假设集中取出A，检查A是否为综合数据库中的实事，回答为“Y”。


    他说明该假设成立，由于无新的假设，故推理过程成功结束，于是目标C得证。


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_243_0.png)'
