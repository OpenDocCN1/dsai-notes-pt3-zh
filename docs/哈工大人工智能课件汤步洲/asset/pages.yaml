- pgno: 77
  md: '# 1.5.2 机器感知


    # 1. 计算机视觉


    概念：用计算机来实现或模拟人类的视觉功能，其主要研究目标是使计算机具有通过二维图像认知三维环境信息的能力。


    重要性：在人类感知到的外界信息中，有80%以上是通过视觉得到的。


    计算机视觉：不仅仅指对光信号的感受，它包括了对视觉信息的获取、传输、处理、存储与理解的全过程。


