- pgno: 269
  md: '# ### 3.3.2 置换与合一


    置换可简单的理解为是在一个谓词公式中用置换项去替换变量。


    定义 置换是形如


    $$\{t_1/x_1, t_2/x_2, \ldots, t_n/x_n\}$$


    的有限集合。其中，$t_1,t_2,\ldots,t_n$ 是项；$x_1,x_2,\ldots,x_n$ 是互不相同的变元；$t_i/x_i$ 表示用 $t_i$
    替换 $x_i$。并且要求 $t_i$ 与 $x_i$ 不能相同，$x_i$ 不能循环地出现在另一个 $t_i$ 中。


    例如，$\{a/x,c/y,f(b)/z\}$ 是一个置换。


    但 $\{g(z)/x,f(x)/z\}$ 不是一个置换。原因是它在 $x$ 与 $z$ 之间出现了循环置换现象。即当用 $g(z)$ 置换 $x$，用 $f(x)$
    置换 $z$ 时，既没有消去 $x$，也没有消去 $z$。


    若改为 $\{g(a)/x,f(x)/z\}$ 即可，原因是用 $g(a)$ 置换 $x$，用 $f(x)$ 置换 $z$，若再用一次置换，用 $g(a)$
    置换 $x$，最终原 $x$ 和 $z$ 被 $g(a)$ 和 $f(g(a))$ 置换，则经过有限次置换消去了 $x$ 和 $z$。


    通常，置换是用希腊字母 $\theta$、$\sigma$、$\alpha$、$\lambda$ 等来表示的。


    定义 设 $\theta=\{t_1/x_1,t_2/x_2,\ldots,t_n/x_n\}$ 是一个置换，$F$ 是一个谓词公式，把公式 $F$ 中出现的所有
    $x_i$ 换成 $t_i$（$i=1,2,\ldots,n$），得到一个新的公式 $G$，称 $G$ 为 $F$ 在置换 $\theta$ 下的例示，记作
    $G=F\theta$。'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# 3.3.2置换与合一


    置换的合成：设


    θ = {t₁/x₁, t₂/x₂, …, tₙ/xₙ}


    λ = {u₁/y₁, u₂/y₂, …, uₙ/yₙ}


    是两个置换，则将集合


    {t₁λ/x₁, t₂λ/x₂, …, tₙλ/xₙ, u₁/y₁, u₂/y₂, …, uₙ/yₙ}


    中符合下列条件的元素删除：


    +   (1) tᵢλ/xᵢ 当 tᵢλ = xᵢ

    +   (2) uᵢ/yᵢ 当 yᵢ ∈ {x₁, x₂, …, xₙ}


    如此得到的集合仍然是一个置换，该置换称为θ与λ的合成，记作θ·λ。'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# 置换合成实例：


    例: 设 θ = {f(y)/x,z/y}, λ = {a/x,b/y,y/z}, 求θ与λ的合成。


    解: 先求出集合


    {f(y)λ / x, zλ / y, a / x,b / y,y / z}


    = {f(b)/x, y/y, a/x,b/y,y/z}


    y/y,a/x,b/y,满足定义中的条件需删除，得:


    θ·λ = {f(b)/x, y/z}


    +   ① 当λ = x_i 时, 删除(i = 1,2,…,n);

    +   ② 当 ∈ {x₁,x₂,…,xₙ} 时, 删除(i=1,2,…,m);'
  merge: -1
