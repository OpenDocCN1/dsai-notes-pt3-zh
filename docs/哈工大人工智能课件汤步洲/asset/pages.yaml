- pgno: 146
  md: '问题的初始状态：

    AT( robot, c )

    EMPTY( robot )

    ON( box, a )

    TABLE( a )

    TABLE( b )


    问题的目标状态：

    AT( robot, c )

    EMPTY( robot )

    ON( box, b )

    TABLE( a )

    TABLE( b )


    机器人行动的目标是把问题的初始状态转换为目标状态，而要实现问题状态的转换需要完成一系列的操作。


    描述操作的谓词

    条件部分：用来说明执行该操作必须具备的先决条件，用谓词公式来表示。

    动作部分：给出了该操作对问题状态的改变情况，通过在执行该操作前的问题状态中删去和增加相应的谓词来实现。


    这些操作包括：


    +   - Goto( x, y )：从x处走到y处。

    +   - Pickup( x )：在x处拿起盒子。

    +   - Setdown( y )：在x处放下盒子。'
