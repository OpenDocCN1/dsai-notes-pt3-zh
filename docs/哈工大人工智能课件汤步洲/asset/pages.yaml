- pgno: 652
  md: '# Sampling


    +   - Sampling is a lot like repeated simulation

    +     - Predicting the weather, basketball games, ...

    +   - Basic idea

    +     - Draw N samples from a sampling distribution S

    +     - Compute an approximate posterior probability

    +     - Show this converges to the true probability P


    +   Why sample?

    +   - Learning: get samples from a distribution you don’t know

    +   - Inference: getting a sample is faster than computing the right answer (e.g.
    with variable elimination)


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_652_0.png)'
  merge: -1
  img_proc: true
- pgno: 653
  md: '# Sampling


    +   - Sampling from given distribution

    +     - Step 1: Get sample $u$ from uniform distribution over [0, 1)

    +       - E.g. random() in python

    +     - Step 2: Convert this sample $u$ into an outcome for the given distribution
    by having each outcome associated with a sub-interval of [0,1) with sub-interval
    size equal to probability of the outcome


    # Example


    | C | P(C) |

    |---|------|

    | red | 0.6 |

    | green | 0.1 |

    | blue | 0.3 |


    0 ≤ u < 0.6, → C = red

    0.6 ≤ u < 0.7, → C = green

    0.7 ≤ u < 1, → C = blue


    +   - If random() returns u = 0.83, then our sample is C = blue

    +   - E.g, after sampling 8 times:


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_653_0.png)'
  merge: -1
  img_proc: true
