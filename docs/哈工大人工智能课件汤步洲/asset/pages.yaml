- pgno: 209
  md: "对那些结构比较复杂的知识，往往需要用多个相互联系的框架来表示。\n例如，对前面硕士生框架“MASTER”可分为：\n\"Student\"框架，描述所有学生的共性，上层框架\n\
    \"Master\"框架，描述硕士生的个性，子框架，继承\"Student\"框架的属性\n\n# 学生框架\n\n```\nFrame <Student>\n\
    \    Name: Unit (Last-name, First-name)\n    Sex: Area (male, female)\n      \
    \  Default: male                //缺省\n    Age: Unit (Years)\n        If-Needed:\
    \ Ask-Age           //询问赋值\n    Address: < S-Address>\n    Telephone: Home Unit\
    \ (Number)\n        Mobile Unit (Number)\n        If-Needed: Ask-Telephone   \
    \  //询问赋值\n```"
  merge: -1
  img_proc: true
- pgno: 210
  md: "# 硕士生框架\n\nFrame <Master>\n  AKO: <Student> //预定义槽名\n  Major: Unit (Major)\
    \ //专业\n    If-Needed: Ask - Major //询问赋值\n    If-Added: Check-Major //后续处理\n\
    \  Field: Unit (Field) //方向\n    If-Needed : Ask - Field //询问赋值\n  Advisor: Unit\
    \ (Last-name, First-name) //导师\n    If-Needed : Ask -Visor //询问赋值\n  Project:\
    \ Area (National, Provincial, Other) //项目\n    Default: National //缺省\n  Paper:\
    \ Area (SCI, EI, Core, General) //论文\n    Default: Core //缺省\n  这里，用到了一个系统预定义槽名AKO，其含义为\"\
    是一种\"。\n  当AKO作为下层框架的槽名时，其槽值为上层框架的框架名，表示该下层框架所描述的事物比其上层框架更具体。并且，由AKO所联系的框架之间具有属性的继承关系。"
  merge: -1
  img_proc: true
- pgno: 211
  md: '# 实例框架


    例如，有杨叶和柳青2个硕士生，

    杨叶，女，计算机专业，参加了导师林海的网络智能研究方向的省部级项目；

