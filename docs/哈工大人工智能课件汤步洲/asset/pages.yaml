- pgno: 658
  md: "# Prior Sampling\n\nThis process generates samples with probability:\n\n$S_{PS}(x_1\
    \ \\dots x_n) = \\prod_{i=1}^n P(x_i|Parents(X_i)) = P(x_1 \\dots x_n)$\n\ni.e.\
    \ the BN's joint probability\n\nLet the number of samples of an event be $N_{PS}(x_1\
    \ \\dots x_n)$\n\nThen \n\n$\\lim_{N \\to \\infty} \\hat{P}(x_1, \\dots, x_n)\
    \ = \\lim_{N \\to \\infty} N_{PS}(x_1, \\dots, x_n)/N$\n\n$ = S_{PS}(x_1, \\dots,\
    \ x_n)$\n\n$ = P(x_1 \\dots x_n)$\n\nI.e., the sampling procedure is consistent"
  merge: -1
  img_proc: true
