- pgno: 482
  md: '# 4. 3. 4. 3 h(n)的单调限制


    定理4.5 如果h满足单调条件，则当A*算法扩展节点n时，该节点就已经找到了通往它的最佳路径，即g(n)=g*(n)。


    证明：设A*正要扩展节点n，而节点序列

    S0=n0, n1, ..., nk=n

    是由初始节点S0到节点n的最佳路径。其中，ni是这个序列中最后一个位于Closed表中的节点，则上述节点序列中的ni+1节点必定在Open表中，则有

    g*(ni)+h(ni)≤g*(ni)+c(ni, ni+1)+h(ni+1)

    由于节点ni和ni+1都在最佳路径上，故有

    g*(ni+1)=g*(ni)+c(ni, ni+1)

    所以

    g*(ni)+h(ni)≤g*(ni+1)+h(ni+1)

    一直推导下去可得g*(ni+1)+h(ni+1)≤g*(nk)+h(nk)

    由于节点ni+1在最佳路径上，故有f(ni+1)≤g*(n)+h(n)

    因为这时A*扩展节点n而不扩展节点ni+1，则有

    f(n)=g(n)+h(n)≤f(ni+1)≤g*(n)+h(n)

    即g(n)≤g*(n)

    但是g*(n)是最小代价值，应当有g(n)≥g*(n)

    所以有g(n)=g*(n)'
