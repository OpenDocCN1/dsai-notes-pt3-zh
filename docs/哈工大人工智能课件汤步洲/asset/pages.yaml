- pgno: 358
  md: '# 3.4.6归结演绎推理的归结策略


    归结策略是指在归结演绎推理过程的每一步如何选择进行归结的子句对，以尽快得到空子句的策略。


    不同的归结策略影响归结过程、归结推理效率和完备性。


    目前，常用的归结策略可分为三大类。


    +   归结策略

    +     排序策略 { 广度优先策略

    +     删除策略 {

    +       纯文字删除策略

    +       重言式删除策略

    +       包孕删除策略

    +     }

    +     限制策略 {

    +       支持集策略

    +       线性输入策略

    +       祖先过滤策略

    +       单文字子句策略

    +     }'
