- pgno: 295
  md: '# 3.4.2子句集及其应用


    # 子句和子句集


    归结演绎推理是在子句集的基础...因此，讨论归结演绎推理之前，需要先讨论子句集的有关概念。


    # 子句和子句集


    定义10 原子谓词公式及其否定统称为文字。

    例如，P(x)、Q(x)、¬P(x)、¬Q(x)等都是文字。


    定义11 任何文字的析取式称为子句。

    例如，P(x)∨Q(x), P(x, f(x))∨Q(x, g(x))都是子句。


    定义12 不含任何文字的子句称为空子句。

    由于空子句不含任何文字，也就不能被任何解释所满足，因此空子句是永假的，不可满足的。

    空子句一般被记为□或NIL。


    定义13 由子句或空子句所构成的集合称为子句集。'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# 3.4.2子句集及其应用


    # 子句集的化简


    在谓词逻辑中，任何一个谓词公式都可以通过应用等价关系及推理规则化成相应的子句集。


    例如公式


    ```

    (∀x)((∀y)P(x,y)→¬(∀y)(Q(x,y)→R(x,y)))

    ```


    其化简步骤如下：


    +   (1) 消去连接词“→”和“↔”


    反复使用如下等价公式：


    ```

    P→Q ⇔ ¬P ∨ Q

    ```


    ```

    P↔Q ⇔ (P ∧ Q) ∨ (¬P ∧ ¬Q)

    ```


    即可消去谓词公式中的连接词“→”和“↔”。


    以上谓词公式经等价变化后为


    ```

    (∀x)(¬(∀y)P(x,y) ∨ ¬(∀y)(¬Q(x,y) ∨ R(x,y)))

    ```'
