- pgno: 503
  md: '# 希望树


    为找到最佳解树，搜索过程的任何时刻都应该选择那些最有希望成为最佳解树一部分的节点进行扩展。由于这些节点及其父节点所构成的与或树最有可能成为最佳解树的一部分，因此称之为希望树。


    与或树的启发式搜索过程就是不断地选择、修正希望树的过程，在该过程中，希望树是不断变化的。'
  merge: -1
  img_proc: true
- pgno: 504
  md: '# 【希望树定义】


    +   1. 初始节点S₀在希望树T中；

    +   2. 如果节点x在希望树T中，则一定有：

    +      (1) 如果x是具有子节点y₁,y₂,…,yₖ的"或"节点，则具有 min{c(x,yᵢ)+h(yᵢ)} (i=1,2,…,k) 值的那个子节点yᵢ也应在T中；

    +      (2) 如果x是"与"节点，则x的全部子节点都在希望树T中。'
  merge: -1
