- pgno: 524
  md: '# 4.5.3 α-β 剪枝


    剪枝的概念


    在极大极小搜索过程中，剪去一些没用的分枝，减少了搜索空间，使得算法在同样时间内可以搜索更深层，这种技术被称为 α-β 剪枝。


    剪枝方法


    +   (1) MAX节点（或节点）的 α 值为当前子节点的最大倒推值；

    +   (2) MIN节点（与节点）的 β 值为当前子节点的最小倒推值；

    +   (3) α-β 剪枝的规则如下：


    β 剪枝


    任何MAX节点n的 α 值大于或等于它先辈节点的 β 值，则n 以下的分枝可停止搜索，并令节点n的倒推值为 α。这种剪枝称为 β 剪枝。


    α 剪枝


    任何MIN节点n的 β 值小于或等于它先辈节点的 α 值，则n 以下的分枝可停止搜索，并令节点n的倒推值为 β。这种剪枝称为 α 剪枝。'
  merge: -1
  img_proc: true
