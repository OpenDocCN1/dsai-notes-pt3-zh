  md: '# 3.4.4 鲁滨逊归结原理


    # 命题逻辑的归结


    归结推理的核心是求两个子句的归结式


    (1) 归结式的定义及性质


    定义23 若P是原子谓词公式，则称P与¬P为互补文字。


    定义24 设C1和C2是子句集中的任意两个子句，如果C1中的文字L1与C2中的文字L2互补，那么可从C1和C2中分别消去L1和L2，并将C1和C2中余下的部分按析取关系构成一个新的子句C12，则称这一过程为归结，称C12为C1和C2的归结式，称C1和C2为C12的亲本子句。


    例 设C1=P∨Q∨R，C2=¬P∨S，求C1和C2的归结式C12。


    例 设C1=¬Q，C2=Q，求C1和C2的归结式C12。'
