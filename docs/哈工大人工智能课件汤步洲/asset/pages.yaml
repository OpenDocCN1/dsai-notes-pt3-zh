- pgno: 263
  md: '# 3.3.1一阶谓词逻辑基础


    定义2 谓词公式的永真性：如果谓词公式P对非空个体域D上的任一解释都取得真值T，则称P在D上是永真的；如果P在任何非空个体域上都是永真的，则称P是永真。


    定义3 谓词公式的可满足性：对于谓词公式P，如果至少存在D上的一个解释，使公式P在此解释下的真值为T，则称公式P在D上是可满足的。


    定义4 谓词公式的永假性：如果谓词公式P对非空个体域D上的任一解释都取真值F，则称P在D上是永假的；如果P在任何非空个体域上均是永假的，则称P永假。'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# 3.3.1一阶谓词逻辑基础


    定义5 谓词公式的等价性：设P与Q是D上的两个谓词公式，若对D上的任意解释，P与Q都有相同的真值，则称P与Q在D上是等价的。如果D是任意非空个体域，则称P与Q是等价的，记作P
    ⇔ Q。


    常用的等价式有：


    +   (1) 双重否定律 ¬¬P ⇔ P

    +   (2) 交换律 (P ∨ Q) ⇔ (Q ∨ P), (P ∧ Q) ⇔ (Q ∧ P)

    +   (3) 结合律 (P ∨ Q) ∨ R ⇔ P ∨ (Q ∨ R)

    +   (P ∧ Q) ∧ R ⇔ P ∧ (Q ∧ R)

    +   (4) 分配律 P ∨ (Q ∧ R) ⇔ (P ∨ Q) ∧ (P ∨ R)

    +   P ∧ (Q ∨ R) ⇔ (P ∧ Q) ∨ (P ∧ R)'
  merge: -1
  img_proc: true
