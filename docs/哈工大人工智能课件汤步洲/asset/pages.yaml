- pgno: 485
  md: '# 4.4.1 与/或树的一般搜索


    与/或树的搜索过程实际上是一个不断寻找解树的过程。其一般搜索过程如下：


    +   (1) 把原始问题作为初始节点S₀，并把它作为当前节点；

    +   (2) 应用分解或等价变换操作对当前节点进行扩展；

    +   (3) 为每个子节点设置指向父节点的指针；

    +   (4) 选择合适的子节点作为当前节点，反复执行第(2)步和第(3)步，在此期间需要多次调用可解标记过程或不可解标记过程，直到初始节点被标记为可解节点或不可解节点为止。


    上述搜索过程将形成一颗与/或树，这种由搜索过程所形成的与/或树称为搜索树。'
  merge: -1
  img_proc: true
- pgno: 486
  md: '# 4.4.2 广度优先搜索


    与/或树的广度优先搜索与状态空间的广度优先搜索的主要差别是，需要在搜索过程中需要多次调用可解标识过程或不可解标识过程。


    其搜索算法如下：


    +   (1) 把初始节点 S₀ 放入 Open 表中；

    +   (2) 把 Open 表的第一个节点取出放入 Closed 表，并记该节点为 n；

    +   (3) 如果节点 n 可扩展，则做下列工作：

    +     ① 扩展节点 n，将其子节点放入 Open 表的尾部，并为每一个子节点设置指向父节点的指针；

    +     ② 考察这些子节点中是否有终止节点。若有，则标记这些终止节点为可解节点，并用可解标记过程对其父节点及先辈节点中的可解节点进行标记。如果初始解节点
    S₀ 能够被标记为可解节点，就得到了解树，搜索成功，退出搜索过程；如果不能确定 S₀ 为可解节点，则从 Open 表中删去具有可解先辈的节点。

    +     ③ 转第(2)步。

    +   (4) 如果节点 n 不可扩展，则作下列工作：

    +     ① 标记节点 n 为不可解节点；

    +     ② 应用不可解标记过程对节点 n 的先辈中不可解解的节点进行标记。如果初始解节点 S₀ 也被标记为不可解节点，则搜索失败，表明原始问题无解，退出搜索过程；如果不能确定
    S₀ 为不可解节点，则从 Open 表中删去具有不可解先辈的节点。

    +     ③ 转第(2)步。'
  merge: -1
  img_proc: true
