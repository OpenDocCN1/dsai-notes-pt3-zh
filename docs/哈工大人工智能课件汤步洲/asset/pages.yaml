- pgno: 272
  md: '# 3.3.2置换与合一


    合一


    可理解为是寻找相对应变量的置换，使两个或多个谓词公式一致。


    定义9 设有公式集F={F₁, F₂, ..., Fₙ}，若存在一个置换θ，可使 F₁θ=F₂θ=...=Fₙθ，则称θ是F的一个合一。称F₁,F₂,...,Fₙ是可合一的。


    例如，设有公式集F={P(x, y, f(y)), P(a, g(x), z)}，则 λ={a/x, g(a)/y, f(g(a))/z} 是它的一个合一。


    一般情况下,一个公式集的合一不是惟一的。'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# 3. 3. 2置换与合一


    # 最一般合一


    设σ是谓词公式集F的一个合一置换，如果对F的任意一个合一置换θ都存在一个置换λ，使得 θ=σ⋅λ，则称σ是一个最一般(或最简单)合一( most general
    unifier，简记为mgu)置换。


    > 一个公式集的最一般合一是一唯一的。'
  merge: -1
