  md: "# 3.4.3 海伯伦（Herbrand）理论\n\n+   ◆ 为了判断子句集的不可满足性，需要对所有可能论域上的所有解释进行判定。只有当子句集对任何非空个体域上的任何一个解释都是不可满足的，才可断定该子句集是不可满足的。\n\
