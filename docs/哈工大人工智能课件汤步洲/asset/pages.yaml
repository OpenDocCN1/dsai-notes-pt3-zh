- pgno: 597
  md: '# Active / Inactive Paths


    +   - Question: Are X and Y conditionally independent given evidence variables
    {Z}?

    +     - Yes, if X and Y “d-separated” by Z

    +     - Consider all (undirected) paths from X to Y

    +     - No active paths = independence!


    +   - A path is active if each triple is active:

    +     - Causal chain A → B → C where B is unobserved (either direction)

    +     - Common cause A ← B → C where B is unobserved

    +     - Common effect (aka v-structure)

    +     - A → B ← C where B or one of its descendents is observed


    All it takes to block a path is a single inactive segment


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_597_0.png)


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_597_1.png)


    | | W ∉ Z | W ∈ Z |

    |---|---|---|

    | X → W → Y | ✓ | ✗ |

    | X ← W ← Y | ✓ | ✗ |

    | X ← W → Y | ✓ | ✗ |

    | X → W ← Y | ✗ | ✓ |


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_597_2.png)'
  merge: -1
  img_proc: true
- pgno: 598
  md: '# D-Separation


    +   - Query: $X_i \perp\!\!\perp X_j | \{X_{k_1}, ..., X_{k_n}\}$ ?

    +   - Check all (undirected!) paths between $X_i$ and $X_j$

    +     - If one or more active, then independence not guaranteed

    +       $X_i \not\!\perp\!\!\perp X_j | \{X_{k_1}, ..., X_{k_n}\}$

    +     - Otherwise (i.e. if all paths are inactive), then independence is guaranteed

    +       $X_i \perp\!\!\perp X_j | \{X_{k_1}, ..., X_{k_n}\}$


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_598_0.png)'
