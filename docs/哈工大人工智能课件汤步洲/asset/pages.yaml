- pgno: 333
  md: '# 3.4.4 鲁滨逊归结原理


    # 命题逻辑的归结


    上述定理是归结原理中的一个重要定理，由它可得到以下两个推论：


    推论1：设C1和C2是子句集S中的两个子句，C12是C1和C2的归结式，若用C12代替C1和C2后得到新的子句集S1，则由S1的不可满足性可以推出原子子句集S的不可满足性。即：


    S1的不可满足性 ⇒ S的不可满足性


    证明：设S={C1，C2，C3，……，Cn}，C12是C1和C2的归结式，则用C12代替C1和C2后可得到一个新的子句集


    S1={C12，C3，…，Cn}


    设S1是不可满足的，则对不满足S1的任一解释I，都可能有以下两种情况：


    +   ①解释I使C12为真，则C3，……，Cn中必有一个为假，即S是不可满足的。


    +   ②解释I使C12为假，即¬C12为真，根据定理3.2有¬(C1∧C2)永真，即¬C1∨¬C2永真，它说明解释I使C1为假，或C2为假。即S也是不可满足的。


    因此可以得出


    S1的不可满足性 ⇒ S的不可满足性'
