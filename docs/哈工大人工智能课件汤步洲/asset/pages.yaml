- pgno: 42
  md: '# 1.1.6 智能模拟的方法和技术研究


    # 2. 学习、行为、系统


    机器学习


    让计算机能够像人那样自动地获取新知识，并在实践中不断地完善自我和增强能力。


    机器学习方法：机械学习、类比学习、归纳学习、发现学习、遗传学习和连接学习等


    机器行为


    让计算机能够具有像人那样地行动和表达能力，如走、跑、拿、说、唱、写画等。


    相当于智能系统的输出部分。


    智能系统与智能机器


    无论是人工智能的近期目标还是远期目标，都需要建立智能系统或构造智能机器。需要开展对系统模型、构造技术、构造工具及语言环境等研究'
