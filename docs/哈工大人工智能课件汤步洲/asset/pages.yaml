- pgno: 441
  md: '# 4.3.4 代价一致搜索（Uniform-cost/Cheapest-first search）


    前面的各种搜索策略中，实际都假设状态空间中各边的代价都相同，且都为∞一个单位量。从而，可用路径长度来替代路径的代价。但实际问题中，这种假设不现实，它们的状态空间中的各个边的代价不可能完全相同。为此，我们需要在搜索树中给每条边标上其代价。这种边上有代价的树称为代价树。


    在代价树中，可以用g(n)表示从初始节点s₀到节点n的代价，用c(n₁, n₂)表示父义节点n₁到n₂的代价。这样，对节点n₂的代价有


    $$g(n_2)=g(n_1)+c(n_1,n_2)$$


    在代价树中，**最小代价的路径和最短路径是有可能不同的**，最短路径不一定是最小代价径，最小代价路径也不一定是路径最短。代价树搜索的目的是为了到最佳解，即找到∞一条代价最小的解路径。'
  merge: -1
  img_proc: true
- pgno: 442
  md: '# 4.3.4代价一致搜索（Uniform-cost/Cheapest-first search）


    搜索树中每条连接线上的有关代价,表示时间、距离等花费。

    代价一致搜索是宽度优先搜索的一种推广，不是沿着等长度路径断层进行扩展，而是沿着等代价路径断层进行扩展。


    代价一致搜索的基本思想是：在代价一致搜索算法中，把从起始节点S₀到任一节点i的路径代价记为g(i)。从初始节点S₀开始扩展，若没有得到目标节点，则优先扩展最少代价g(i)的节点，一直如此向下搜索。'
  merge: -1
  img_proc: true
- pgno: 443
  md: '# 代价一致搜索的一般算法


    +   1. 把初始节点S₀放入Open表,设g（s₀）=0,建立一个CLOSED表，置为空；

    +   2. 检查Open表是否为空表，若为空，则问题无解，失败退出；

    +   3. 把Open表的第∞一个节点取出放入Closed表，并记该节点为n；

    +   4. 考察节点n是否为目标节点，若是则得到问题的解成功退出；

    +   5. 若节点n不可扩展，则转第（2）步；

    +   6. 扩展节点n，生成子节点nᵢ（i=1,2,……），将其子节点放入Open表，并为每个子节点设置指向父节点的指针，计算各个节点的代价g（nᵢ），将Open表内的节点按g（nᵢ）从小到大排序,转向第（2）步。'
  merge: -1
  img_proc: true
