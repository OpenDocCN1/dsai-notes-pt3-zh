  md: '# 一般合一置换的求取算法：


    +   - 差异集


    设 $F=\{F_1,F_2,\cdots,F_n\}$ 是一个非空有限的公式集，从 $F$ 中每个公式的第一个符号同时向右比较，直到发现第一个不相同的符号为止，从
    $F$ 的各个公式中取出那些以第一个不一致符号开始的最大子表达式，并以这些子表达式为元素组成一个集合 $D$，称 $D$ 为 $F$ 的一个差异集，也称分歧集合（Disagreement
    Set）。'
