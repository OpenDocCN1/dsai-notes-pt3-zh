  md: '# 3.4.4 鲁滨逊归结原理


    # 谓词逻辑的归结


    例 设 C₁ = P(x) ∨ ¬Q(b)， C₂ = ¬P(a) ∨ Q(y) ∨ R(z)


    解：对 C₁ 和 C₂ 通过合一 {a/x, b/y} 的作用，可以得到两个互补对。


    注意：求归结式不能同时消去两个互补对，其结果不是二元归结式。如在 σ={a/x, b/y} 下，若同时消去两个互补对所得 R(z) 不是 C₁ 和 C₂ 的二元归结式。


    例 设 C₁ = P(x) ∨ P(f(a)) ∨ Q(x)， C₂ = ¬P(y) ∨ R(b)， 求 C₁₂


    解：对参加归结的某个子句，若其内部有可合一的文字，则在进行归结之前应先进行合一。本例 C₁ 中有 P(x) 与 P(f(a))，若它用们的合一 σ={f(a)/x}
