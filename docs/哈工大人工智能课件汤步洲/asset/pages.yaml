- pgno: 667
  md: "# Likelihood Weighting\n\n+   - Sampling distribution if z sampled and e fixed\
    \ evidence\n+   \n+     $S_{WS}(z, e) = \\prod_{i=1}^{l} P(z_i|Parents(Z_i))$\n\
    +   \n+   - Now, samples have weights\n+   \n+     $w(z, e) = \\prod_{i=1}^{m}\
    \ P(e_i|Parents(E_i))$\n+   \n+   - Together, weighted sampling distribution is\
    \ consistent\n+   \n+     $S_{WS}(z, e) \\cdot w(z, e) = \\prod_{i=1}^{l} P(z_i|Parents(z_i))\
    \ \\prod_{i=1}^{m} P(e_i|Parents(e_i))$\n+   \n+     $= P(z, e)$\n\n![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_667_0.png)"
