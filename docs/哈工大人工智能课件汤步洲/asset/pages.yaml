- pgno: 612
  md: '# Inference


    +   - Inference: calculating some useful quantity from a joint probability distribution


    +   - Examples:

    +     - Posterior probability

    +       $P(Q|E_1 = e_1, \dots E_k = e_k)$

    +     - Most likely explanation:

    +       $\operatorname{argmax}_q P(Q = q|E_1 = e_1 \dots)$


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_612_0.png)'
  merge: -1
  img_proc: true
- pgno: 613
  md: '# Inference by Enumeration


    +   - General case:

    +     - Evidence variables: $E_1 \dots E_k = e_1 \dots e_k$

    +     - Query* variable: $Q$

    +     - Hidden variables: $H_1 \dots H_r$

    +     $\left. \begin{array}{c} X_1, X_2, \dots X_n \\ \text{All variables} \end{array}
    \right\}$


    +   - We want:

    +     $P(Q|e_1 \dots e_k)$

    +     * Works fine with multiple query variables, too


    +   - Step 1: Select the entries consistent with the evidence


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_613_0.png)


    +   - Step 2: Sum out H to get joint of Query and evidence


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_613_1.png)


    +   - Step 3: Normalize


    $\times \frac{1}{Z}$


    $P(Q, e_1 \dots e_k) = \sum_{h_1 \dots h_r} P(Q, h_1 \dots h_r, e_1 \dots e_k)$

    $\underbrace{X_1, X_2, \dots X_n}$


    $Z = \sum_q P(Q, e_1 \dots e_k)$


    $P(Q|e_1 \dots e_k) = \frac{1}{Z} P(Q, e_1 \dots e_k)$'
  merge: -1
  img_proc: true
- pgno: 614
  md: '# Inference by Enumeration in Bayes’ Net


    +   - Given unlimited time, inference in BNs is easy

    +   - Reminder of inference by enumeration by example:


    P(B | + j, +m) ∝_B P(B, +j, +m)

    = Σ_{e,a} P(B, e, a, +j, +m)

    = Σ_{e,a} P(B) P(e) P(a|B, e) P(+j|a) P(+m|a)


    = P(B) P(+e) P(+a|B, +e) P(+j | +a) P(+m | +a) + P(B) P(+e) P(-a|B, +e) P(+j |
    -a) P(+m | -a) P(B) P(-e) P(+a|B, -e) P(+j | +a) P(+m | +a) + P(B) P(-e) P(-a|B,
    -e) P(+j | -a) P(+m | -a)


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_614_0.png)'
  merge: -1
  img_proc: true
