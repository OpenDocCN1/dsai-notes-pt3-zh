- pgno: 471
  md: '# 4. 3. 4. 1 A*算法的可纳性


    定理4.3 A*算法是可采纳的，即若存在从初始节点S0到目标节点Sg的路径，则A*算法必能结束在最佳路径上。


    证明：证明过程分以下两步进行：


    先证明A*算法一定能够终止在某个目标节点上。


    由定理4.1和定理4.2可知，无论是对有限图还是无限图，A*算法都能够找到某个目标节点而结束。


    再证明A*算法只能终止在最佳路径上。（反证法）


    假设A*算法未能终止在最佳路径上，而是终止在某个目标节点t处，则有


    f(t)=g(t)>f*(S0)


    但由引理4.2可知，在A*算法结束前，必有最佳路径上的一个节点n''在Open表中，且有


    f(n'')≤f*(S0)<f(t)


    此时，A*算法一定会选择n''来扩展，而不可能选择t，从而也不会去测试目标节点t，这就与假设A*算法终止在目标节点t相矛盾。因此，A*算法只能终止在最佳路径上。'
