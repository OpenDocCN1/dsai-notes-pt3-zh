    例 设已知的公式集为{P, (P∧Q)→R, (S∨T)→Q, T}，求证结论R


    解：假设结论R为假，将¬R加入公式集，并化为子句集


    S={P, ¬P∨¬Q∨R, ¬S∨Q, ¬T∨Q, T, ¬R}


