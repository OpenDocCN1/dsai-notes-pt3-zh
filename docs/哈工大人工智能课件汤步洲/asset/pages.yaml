  md: '# Factor Zoo I


    +   - Joint distribution: P(X,Y)

    +     - Entries P(x,y) for all x, y

    +     - Sums to 1

    +   - Selected joint: P(x,Y)

    +     - A slice of the joint distribution

    +     - Entries P(x,y) for fixed x, all y

    +     - Sums to P(x)

    +   - Number of capitals = dimensionality of the table


