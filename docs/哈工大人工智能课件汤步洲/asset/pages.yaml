- pgno: 505
  md: '# 4. 6. 4 与或树的启发式搜索


    +   - 计算任一节点x的代价h(x)时，都要求已知其子节点yᵢ的代价h(yᵢ)。但搜索是自上而下进行的，即先有父节点，后有子节点，除非节点x的全部子节点都是不可扩展节点，否则子节点的代价是不知道的。那么如何计算x的代价值h(x)呢？


    +   - 解决的办法是根据问题本身提供的启发式信息定义一个启发函数，由此函数估算出子节点yᵢ的代价h(yᵢ)，然后再按和代价或者最大代价计算出节点x的代价值h(x)。有了h(x)，节点x的父节点、祖父节点以及直到初始节点S₀的各先辈节点的代价h都可自下而上的逐层推算出来。'
  merge: -1
  img_proc: true
- pgno: 506
  md: '# 4. 6. 4 与或树的启发式搜索


    +   - 当节点yᵢ被扩展后，也是先用启发函数估算出其子节点的代价，然后再算出h(yᵢ)。此时算出的h(yᵢ)可能与原先估算出的h(yᵢ)不相同，这时应该用后算出的h(yᵢ)取代原先估算出的h(yᵢ)，并且按此h(yᵢ)自下而上地重新计算各先辈节点的h值。当节点yᵢ的子节点又被扩展时，上述过程又要重新进行一遍。总之，每当有一代新的节点生成时，都要自下而上地重新计算其先辈节点的代价，这是一个自上而下地生成节点，又自下而上地计算代价h的反复进行的过程。'
  merge: -1
  img_proc: true
- pgno: 507
  md: '# 与或树的启发式搜索过程如下：


    +   1. 把初始节点 S₀ 放入 Open 表中，计算 h(S₀)；

    +   2. 计算希望树；

    +   3. 依次在 Open 表中取出的端节点放入 Closed 表，并记该节点为 n；

    +   4. 如果节点 n 为终止节点，则做下列工作：

    +      ① 标记节点 n 为可解节点；

    +      ② 在 T 上应用可解标记过程，对 n 的先辈节点中的所有可解节点进行标记；

    +      ③ 如果初始解节点 S₀ 能够被标记为可解节点，则 T 就是最优解树，成功退出；

    +      ④ 否则，从 Open 表中删去具有可解先辈的所有节点；

    +      ⑤ 转第 (2) 步。'
  merge: -1
  img_proc: true
- pgno: 508
  md: '(5) 如果节点n不是终止节点，但可扩展，则做下列工作：

    ①扩展节点n，生成n的所有子节点；

    ②把这些子节点都放入Open表中，并为每一个子节点设置指向父节点n的指针

    ③计算这些子节点及其先辈节点的h值；

    ④转第(2)步。


    (6) 如果节点n不是终止节点，且不可扩展，则做下列工作：

    ①标记节点n为不可解节点；

    ②在T上应用不可解标记过程，对n的先辈节点中的所有不可解节点进行标记；

    ③如果初始节点S0能够被标记为不可解，则问题无解，失败退出；

    ④否则，从Open表中删去具有不可解先辈的所有节点。

    ⑤转第(2)步。'
  merge: -1
  img_proc: true
