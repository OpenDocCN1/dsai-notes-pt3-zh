  md: '# 3. 3. 1 一阶谓词逻辑基础


    # 定义1 谓词公式的解释


    设D是谓词公式P的非空个体域，若对P中的常量，函数和谓词如下规定赋值：


    +   1 为每个个体常量指派D中的一个元素；

    +   2 为每个n元函数指派一个从D^n到D的一个映射，其中 D^n = \{(x_1, x_2, \cdots, x_n)|x_1, x_2, \cdots,
    x_n \in D\}

    +   3 为每个n元谓词指派一个从D^n到{F,T}的映射，则称这些指派为P在D上的一个解释'
