- pgno: 424
  md: '# 4. 2. 2 广度优先搜索(Breadth-first Search)


    又称为宽度优先搜索，是是一种先生成的节点先扩展的策略。


    宽度优先搜索的基本思想是：从初始节点S₀开始，逐层地对节点进行扩展并考察它是否为目标节点，在第n层的节点没有全部扩展并考察之前，不对第n+1层的节点进行扩展。


    OPEN表中的节点总是按进入的先后顺序排列，先进入的节点排在前面，后进入的排在后面。'
  merge: -1
  img_proc: true
- pgno: 425
  md: '# 广度优先搜索的一般算法


    +   1. 把初始节点 S₀ 放入 Open 表，建立一个 CLOSED 表，置为空；

    +   2. 检查 Open 表是否为空表，若为空，则问题无解，失败退出；

    +   3. 把 Open 表的第一个节点取出放入 Closed 表，并记该节点为 n；

    +   4. 考察节点 n 是否为目标节点，若是则得到问题的解成功退出；

    +   5. 若节点 n 不可扩展，则转第（2）步；

    +   6. 扩展节点 n，将其子节点放入 Open 表的尾部，并为每个子节点设置指向父节点的指针，转向第（2）步。'
  merge: -1
  img_proc: true
