- pgno: 199
  md: '# 2.4.5 基于语义网络的推理


    # 匹配


    匹配的概念


    是指在知识库的语义网络中寻找与待求解问题相符的语义网络模式。


    匹配的过程


    +   (1) 根据待求解问题的要求构造一个网络片断，该网络片断中有些结点或弧的标识是空的，称为询问处，它反映的是待求解的问题。


    +   (2) 根据该语义片断到知识库中去寻找所需要的信息。


    +   (3) 当待求解问题的网络片断与知识库中的某语义网络片断相匹配时，则与询问处相匹配的事实就是问题的解。'
  merge: -1
  img_proc: true
