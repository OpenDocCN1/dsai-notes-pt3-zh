- pgno: 336
  md: '# 3.4.4 鲁滨逊归结原理


    # 命题逻辑的归结


    充分性⇒：假设存在一个从S到空子句的归结过程，归结得到的子句集Sₙ的不可满足性，Sₙ的不可满足性，从而S不可满足。


    必要性⇐：由S不可满足知，它一定有一棵封闭语义树，如果这棵树中只有一个节点，则空子句在S中。否则有三个节点N，N₁，N₂，使得N₁，N₂是失败节点，N是它们的父节点。设


    I(N)={m₁,m₂,⋯,mₙ}

    I(N₁)={m₁,m₂,⋯,mₙ,mₙ₊₁}

    I(N₂)={m₁,m₂,⋯,mₙ,¬mₙ₊₁}

    I(N₁)和I(N₂)分别否定C₁和C₂，

    C₁=C₁′∨¬mₙ₊₁，C₂=C₂′∨mₙ₊₁,I(N)否定C₁₂=C₁∨C₂


    将C₁₂加入到S中得到S₁,于是S₁的封闭语义树比S的封闭语义树的节点数目减少。这一过程持续下去，直到空子句出现在子句集中。'
