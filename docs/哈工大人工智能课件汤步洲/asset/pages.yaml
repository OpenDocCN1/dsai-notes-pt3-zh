- pgno: 137
  md: '# 指导变量、约束变量、自由变量


    +   - 指导变量: 量词后面的变量称为量词的指导变量;

    +   - 约束变量: 在一个量词的辖域中的与该量词的指导变量相同的变量称为约束变量;

    +   - 自由变量: 其它的变量称为自由变量;


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_137_0.png)'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# 【改名规则】


    一个变元在一个谓词公式中既可约束出现，又可自由出现，为了避免混淆，通常通过改名规则，使得一个谓词公式中一个变元仅以一种形式出现。


    # 【换名规则】


    在谓词公式中，将某量词辖域中出现的某个约束变元以及对应的指导变元更改为本辖域中没有出现过的个体变元符号，公式其它部分不变，谓词公式的等价性不变。


    # 【代替规则】


    在谓词公式中，将某量词辖域中出现的某个自由变元的所有出现用本辖域中未曾出现过的某个个体变元符号代替，谓词公式的等价性不变。'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# 【改名规则的应用实例】


    ∃xP(x) ∧ B(x)


    换名规则


    ∃uP(u)∧B(x)


    替换规则


    ∃xP(x)∧B(u)'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 【改名规则的应用实例】


    ∀xP(x, y, z) → ∃yQ(x, y, z)


    > 利用换名规则：

    > = ∀uP(u, y, z) → ∃yQ(x, y, z)

    > = ∀uP(u, y, z) → ∃vQ(x, v, z)


    > 利用代替规则：

    > = ∀xP(x, u, z) → ∃yQ(x, y, z)

    > = ∀xP(x, u, z) → ∃yQ(v, y, z)'
  merge: -1
  img_proc: true
