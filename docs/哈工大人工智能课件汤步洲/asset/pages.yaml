- pgno: 96
  md: '# 1.6.2 人工智能的现状与思考


    # 1. 多学科交叉研究


    人工智能理论基础研究


    应强调与脑科学、认知科学、心理学、信息科学、生物学、逻辑学、物理学和数学等学科的交叉研究。


    # 2. 多学派和多技术融合研究


    多学派融合是一种必然趋势


    +   - 符号主义：高层、宏观

    +   - 联结主义：底层、微观

    +   - 行为主义：感知反应、进化


    三大学派各有所长、各有所短，它们各自经过一段时间的分立研究之后，正逐步开始走向融合。多学派融合是人工智能发展的一种必然趋势。'
  merge: -1
  img_proc: true
