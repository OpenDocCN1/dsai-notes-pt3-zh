- pgno: 277
  md: '# 最一般合一置换的求取算法：


    设S为非空有限公式集合，求S的最一般合一的算法如下：


    +   ① 置k=0, Sₖ=S, σₖ=ε;


    +   ② 若Sₖ只含有一个谓词公式，则算法停止，σₖ就是要求的 最一般合一置换；


    +   ③ 求Sₖ的差异集Dₖ；


    +   ④ 若Dₖ中存在元素xₖ和tₖ，其中xₖ是变元，tₖ是项 且xₖ不在tₖ中出现，则置Sₖ₊₁=Sₖ {tₖ/xₖ}， σₖ₊₁=σₖ·{tₖ/xₖ}，k=k+1，然后转②；


    +   ⑤ 算法停止，S的最一般合一不存在。'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# 【实例1】


    1. 求公式集 S= { P(a, x, f(g(y))), P(z, h(z, u), f(u)) } 的最一般合一及对应的置换。


    解： k=0:


    S₀=S, σ₀=ε, S₀不是单元素集，求得D₀= {a, z}，其中z是变元，且不在a中出现，所以有


    σ₁=σ₀·{a/z}=ε·{a/z}={a/z}


    S₁=S₀{a/z}= {P(a, x, f(g(y))), P(a, h(a, u), f(u))}


    k=1:


    S₁不是单元素集，求得D₁= {x, h(a, u)}，


    σ₂=σ₁·{h(a, u)/x}={a/z}·{h(a, u)/x}={a/z, h(a, u)/x}


    S₂=S₁{h(a, u)/x}={P(a, h(a, u), f(g(y))), P(a, h(a, u), f(u))}'
