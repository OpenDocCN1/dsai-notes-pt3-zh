- pgno: 456
  md: '# 4.3.3 A算法


    估价函数

    用来估计节点重要性，定义为从初始节点S₀出发，经过节点n到达目标节点S₉的所有路径中最小路径代价的估计值。一般形式：

    f(n)=g(n)+h(n)

    其中，g(n)是从初始节点S₀到节点n的实际代价；h(n)是从节点n到目标节点S₉的最优路径的估计代价。'
  merge: -1
  img_proc: true
- pgno: 457
  md: '# 4.3.3 A算法


    概念：


    在状态空间搜索中，如果每一步都利用估价函数f(n)=g(n)+h(n)对Open表中的节点进行排序，则称A算法。它是一种为启发式搜索算法。


    类型：


    +   全局择优：从Open表的所有节点中选择一个估价函数值最小的进行扩展。

    +   局部择优：仅从刚生成的子节点中选择一个估价函数值最小的进行扩展。


    全局择优搜索A算法描述：


    +   (1)把初始节点S0放入Open表中，f(S0)=g(S0)+h(S0);

    +   (2)如果Open表为空，则问题无解，失败退出；

    +   (3)把Open表的第一个节点取出放入Closed表，并记该节点为n；

    +   (4)考察节点n是否为目标节点。若是，则找到了问题的解，成功退出；

    +   (5)若节点n不可扩展，则转第(2)步；

    +   (6)扩展节点n，生成其子节点ni(i=1, 2, ...)，计算每一个子节点的估价值f(ni)(i=1, 2, ...)，并为每一个子节点设置指向父节点的指针，然后将这些子节点放入Open表中；

    +   (7)根据各节点的估价函数值，对Open表中的全部节点按从小到大的顺序重新进行排序；

    +   (8)转第(2)步。'
  merge: -1
  img_proc: true
