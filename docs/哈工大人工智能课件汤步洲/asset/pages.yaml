  md: '# 3.4.4 鲁滨逊归结原理


    # 命题逻辑的归结


    上述两个推论说明，为证明子句集S的不可满足性，只要对其中可进行归结的子句进行归结，并把归结式加入到子句集S中，或者用归结式代替他的亲本子句，然后对新的子句集证明其不可满足性就可以了。

    如果经归结能得到空子句，根据空子句的不可满足性，即可得到原子句集S是不可满足的结论。


    在命题逻辑中，对不可满足的子句集S，其归结原理是完备的。

