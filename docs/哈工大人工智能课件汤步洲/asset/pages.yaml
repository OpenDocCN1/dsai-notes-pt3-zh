- pgno: 98
  md: '# 1.6.2 人工智能的现状与思考


    # 5. 社会智能研究


    面向复杂社会系统、适应新型社会问题特点的智能计算理论。社会科学基础理论模型到计算技术的映射机制。


    它不是侧重于模拟个体的高级认知能力，其智能行为更多的是在由群体构成的社会环境中完成各种社会活动时体现出来的。


    # 6. 集成智能研究


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_98_0.png)


    脑-机接口 (BCI) 的研究进一步证实了集成智能的可能性。


    # 7. 认知计算与情感计算研究


    认知计算就是要赋予计算机类似于人的认识事物、获取知识和应用知识的能力。


    情感计算就是是要赋予计算机类似于人一样的观察、理解和生成各种情感特征的能力


    # 8. 智能系统与智能服务


    利用智能技术 建造智能系统， 推进社会智能化进程


    主要包括： 基于智能网络的智能服务，基于智能机器人的智能服务，基于智能软件的智能服务，基于智能产品的智能服务等。'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# 1.6.2 人工智能的现状与思考


    # 当前，人工智能的发展方向在哪里？


    中国科学院院士、清华大学人工智能研究院院长张钰院士认为，只有从技术上取得突破，才能推进创新应用，因此，综合第一代知识驱动型 AI 与第二代数据驱动型 AI，张钰院士提出了第三代人工智能的四要素：知识、数据、算法、算力。


    南京大学计算机系主任、人工智能学院院长、CCF会士、ACM, AAAI, IEEE, IAPR Fellow周志华教授表示，“现在都知道人工智能技术发挥作用需要数据、算法和算力这三要素，未来需要把知识这个要素也考虑进来。”


    哈尔滨工业大学人工智能研究院院长, IEEE FELLOW刘恂教授, “人工智能有ABCD四个方面, A算法、B数据、C算力，现在还增加了D (Domain领域)
    ，是研究的新范式。”'
  merge: -1
  img_proc: true
