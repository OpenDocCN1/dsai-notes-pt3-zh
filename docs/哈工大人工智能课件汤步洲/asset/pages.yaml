- pgno: 85
  md: '# 1.5.5 计算智能


    # 2. 进化计算


    # 进化计算的概念


    是一种模拟自然界生物进化过程与机制，进行问题求解的自组织、自适应的随机搜索技术。它以达尔文进化论的“物竞天择、适者生存”作为算法的进化规则，并结合孟德尔的遗传变异理论，将生物进化过程中的繁殖、变异、竞争和选择引入到了算法中，是一种对人类智能的演化模拟方法。


    # 进化计算的主要分支


    遗传算法、进化策略、进化规划和遗传规划四大分支。其中，遗传算法是进化计算中最初形成的一种具有普遍影响的模拟进化优化算法。


    ![](img/9a6adc64cdb7c98bcd042d4d38c7b00d_85_0.png)'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# 1.5.5 计算智能


    # 3.模糊计算


    模糊计算：亦称模糊系统，是通过对人类处理模糊现象的认知能力的认识，用模糊集合和模糊逻辑去模拟人类的智能行为的。模糊集合与模糊逻辑是美国加州大学扎德(Zadeh)教授1965年提出出来的一种处理因模糊而引起的不确定性的有效方法。


    模糊概念的定义：通常，人们把那种因没有严格边界划分而无法精确刻画的现象称为模糊现象，并把反映模糊现象的各种概念称为模糊概念。例如，“大”、“小”、“多”、“少”等。


    模糊概念的表示：通常是用模糊集合来表示的，而模糊集合又是用隶属函数来刻画的。一个隶属函数描述一个模糊概念，其函数值为[0, 1]区间的实数，用来描述函数自变量所代表的模糊事件隶属于该模糊概念的程度。'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# 1.5.6 分布智能


    # 分布智能的概念


    分布智能主要研究在逻辑上或物理上分布的智能系统之间如何相互协调各自的智能行为，实现问题的并行求解。


    # 1.5.7 智能系统


    智能系统可以泛指各种具有智能特征和功能的软硬件系统。这里主要介绍除前述研究内容以外的专家系统和智能决策支持系统。


    # 专家系统


    专家系统是一种基于知识的智能系统，它将领域专家的经验用知识表示方法表示出来，并放入知识库中，供推理机使用。


    随着计算网络、多Agent、计算智能等技术的发展，出现了模糊专家系统、神经网络专家系统、基于Web的专家系统、协同式专家系统和分布式专家系统等。


