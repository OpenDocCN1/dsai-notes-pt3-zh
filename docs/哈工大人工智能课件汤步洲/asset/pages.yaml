- pgno: 292
  md: '# 3.4 归结推理方法


    归结演绎推理是一种基于鲁宾逊（Robinson）归结原理的机器推理技术。鲁宾逊归结原理亦称为消解原理，是鲁宾逊于1965年在海伯伦（Herbrand）理论的基础上提出的一种基于逻辑的“反证法”。


    定理证明的实质，就是要对前提P和结论Q，证明P→Q永真。


    要证明P→Q永真，就是要证明P→Q在任何一个非空的个体域上都是永真的。这将是非常困难的，甚至是不可实现的。


    为此，人们进行了大量的探索，后来发现可以采用反证法的思想，把关于永真性的证明转化为关于不可满足性的证明。


    即要证明P→Q永真，只要能够证明P∧¬Q是不可满足的就可以了

    （原因是 ¬(P→Q) ⇔ ¬(¬P∨Q) ⇔ P∧¬Q）


    这方面最有成效的工作就是鲁宾逊归结原理。它使定理证明的机械化成为现实。'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# 3. 4. 1谓词公式的范式


    范式是谓词公式的标准形式。


    前束范式：设F是一个谓词公式，如果其中的所有量词均非否定出现现在公式的最前面，而它们的辖域为整个公式，则称F为前束范式。


    前束范式一般可写成


    ```

    (Q₁x₁)(Q₂x₂)⋯(Qₙxₙ)M(x₁,x₂,⋯,xₙ)

    ```


    其中Q_i ∈ {∀, ∃}, (i=1,2,⋯,n), M(x₁,x₂,⋯,xₙ)中不含任何量词。


    例如，(∀x)(∀y)(∃z)(P(x)∧Q(y,z)∨R(x,z))是前束范式。


    任一谓词公式均可化为与其对应的前束范式，其化简方法将在后面子句集的化简中讨论。'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# 3.4.1谓词公式的范式


    Skolem标准型：从前束型范式中消去全部存在量词所得到的公式，并将谓词公式化为合取范式，这时所得的式子称为原公式的Skolem标准型。


    # Skolem标准型的一般形式为：


    (∀x₁)(∀x₂)…(∀xₙ)M(x₁,x₂,…,xₙ)


    其中M(x₁,x₂,…,xₙ)中不含有任何量词，且为合取范式。'
