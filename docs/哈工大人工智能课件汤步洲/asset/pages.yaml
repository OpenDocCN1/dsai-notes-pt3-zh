  md: '# 3.4.4 鲁滨逊归结原理


    # 谓词逻辑的归结


    对以上讨论做以下两点说明：


    +   (1) 这里之所以使用集合符号和集合的运算，目的是为了说明问题的方便。即先将子句C1σ和Liσ写成集合的形式，在集合表示下做减法和并集运算，然后再写成子句集的形式。


    +   (2) 定义中还要求C1和C2无公共变元，这也是合理的。


    例如C1=P(x)，C2=¬P(f(x))，而S={C1, C2}是不可满足的。但由于C1和C2的变元相同，就无法合一了。没有归结式，就不能用归结法证明S的不可满足性，这就限制了归结法的使用范围。


    如果对C1或C2的变元进行换名，便可通过合一，对C1和C2进行归结。如上例，若先对C2进行换名，即C2=¬P(f(y))，则可对C1和C2进行归结，得到一个空子句，从而证明了S是不可满足的。


    事实上，在由公式集化为子句集的过程中，其最后一步就是做换名处理。因此，定义中假设C1和C2没有相同变元是可以的。'
