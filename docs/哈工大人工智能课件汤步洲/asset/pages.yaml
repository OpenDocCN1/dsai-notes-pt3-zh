- pgno: 204
  md: '# 2.5.1 框架表示法概述


    +   - 1975年，Minsky提出了框架理论。他根据人们在理解情景、故事时提出的心理学模型，认为人的知识以框架结构存在人脑中。


    +   - 认为人们对现实世界中各种事物的认识都是以一种类似于框架的结构存储在记忆中的，当遇到一个新事物时，就从记忆中找出一个合适的框架，并根据新的情况对其细节加以修改、补充，从而形成对这个新事物的认识。例如，对饭店、教室等的认识。'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# 2.5.1 框架表示法概述


    框架：是人们认识事物的一种通用的数据结构形式。即当新情况发生时，人们只要把新的数据加入到该通用数据结构中，便可形成一个具体的实体(类)，这样的通用数据结构就称为框架。


    实例框架：对于一个框架，当人们才把观察或认识到的具体细节填入后，就得到了该框架的一个具体实例，框架的这种具体实例被称为实例框架。


    框架系统：在框架理论中，框架是知识的基本单位，把一组有关的框架连结起来使可形成一个框架系统。


    框架系统推理：由框架之间的协调来完成。'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# 2.5.2 框架的组成


    # 组成


    +   - 一个“框架”由若干个“槽”组成，每个“槽”又划分为若干个“侧面”。


    一个“槽”描述对象的一个方面属性；


    一个“侧面”描述相应属性的一个方面。


    由框架名、槽名、侧面、值组成。'
  merge: -1
  img_proc: true
- pgno: 207
  md: "# 一个框架结构为：\n\n```\nFrame<框架名>\n\n槽名 A: 侧面名 A1 值A11, 值A12, 值A13⋯\n  侧面名 A2 值A21,\
    \ 值A22, 值A23…\n槽名 B: 侧面名 B1 值B11, 值B12, 值B13…\n  侧面名 B2 值B21, 值B22, 值B23…\n槽名\
    \ C: 侧面名 C1 值C11, 值C12, 值C13…\n  侧面名 C2 值C21, 值C22, 值C23 …\n\n: : : : :\n```"
  merge: -1
  img_proc: true
- pgno: 208
  md: '例：一个直接描述硕士生有关情况的框架

    Frame <MASTER>

    Name: Unit (Last-name, First-name)

    Sex: Area (male, female)

    Default: male

    Age: Unit (Years)

    Major: Unit (Major)

    Field: Unit (Field)

