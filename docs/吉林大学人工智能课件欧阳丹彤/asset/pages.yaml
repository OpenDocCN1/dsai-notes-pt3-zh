- pgno: 235
  md: '# 13 恒假公式


    公式G称为恒假的(或不可满足的)，如果G在它的所有解释下都是假的。


    # 14 可满足公式


    公式G称为可满足的，如果它不是恒假的。


    +   - G是恒真的 iff ~ G是恒假的。

    +   - G是可满足的 iff 至少有一个解释I，使G在I下为真。

    +   - 若G是恒真的，则G是可满足的；反之不对。

    +   - 如果公式G在解释I下是真的，则称I满足G；如果G在解释I下是假的，则称I弄假G。'
  merge: -1
  img_proc: true
