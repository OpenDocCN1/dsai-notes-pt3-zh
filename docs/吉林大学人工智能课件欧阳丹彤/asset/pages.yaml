  md: '# 二、谓词逻辑


    # 1 谓词


    +   设D是非空个体名称集合，定义在Dⁿ上取值于{T，F}上的n元函数，称为n元命题函数或n元谓词。其中Dⁿ表示集合D的n次笛卡尔乘积。


    +   一般地，一元谓词描述个体的性质，二元或多元谓词描述两个或多个个体间的关系。0元谓词中无个体，理解为就是命题，这样，谓词逻辑包括命题逻辑。'
