    # ■ 国内情况


    中国学者在归结方法的改进和非经典逻辑推理方法研究方面取得了一系列成果，并应用于智能规划和安全协议验证等领域中。


    2003年提出了一种新的独立于归结和表征演方法的扩展规则方法。国际著名人工智能专家Davis称之为与归结方法“互补”的自动推理方法，Murray教授对基于该方法提出的EPCCL理论给予很高评价。'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# 国外情况


    欧洲,世界领先地位,尤以德国、英国最为突出。英国,将归结方法推广到时态逻辑,在分布式系统设计中得到应用。


    美国,德克萨斯大学,数理逻辑机械化定理证明器ACL2已经成功地应用到许多重要工业和商业硬件校验项目中。美国的IBM、AMD、Intel、Microsoft、Motorola等著名的跨国企业均采用自动推理技术来提升自己的产品质量,并取得了丰厚的商业回报。


    澳大利亚国立大学,将归结方法结合到局部随机搜索中,大幅度地提高了SAT和CSP系统的求解效率。(SAT问题,被已故的著名美籍华人数理逻辑学家王浩喻为“当代数理逻辑和理论计算机科学的第一问题”。现已证明:工程技术、军事、工商管理、交通运输及自然科学研究中的6000余个重要问题,如程控电话的自动交换、大型数据库的维护、大规模集成电路的自动布线、软件自动开发、机器人动作规划等,都可转化成SAT问题。)'
