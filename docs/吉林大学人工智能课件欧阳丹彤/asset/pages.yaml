- pgno: 308
  md: '# 二、合一算法


    定义（差异集合） 设W是非空表达式集合，W的差异集合是如下一个集合：首先找出W的所有表达式中不是都相同的第一个符号，然后从W的每一个表达式中抽出占有这个符号位置的子表达式。所有这些子表达式组成的集合称为这步找到的W的差异集合D。'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# W不可合一的三种情况


    （1）若D中无变量符号为元素，则W是不可合一的。


    例. W={P(f(x)), P(g(x))}

    D={f(x), g(x)}


    （2）若D中有奇异元素和非奇异元素，则W是不可合一的。


    例. W={P(x), P(x, y)}

    D={⊙, y}


    （3）若D中元素有变量符号x和项t，且x出现在t中，则W是不可合一的。


    例. W={P(x), P(f(x))}

    D={x, f(x)}'
  merge: -1
  img_proc: true
