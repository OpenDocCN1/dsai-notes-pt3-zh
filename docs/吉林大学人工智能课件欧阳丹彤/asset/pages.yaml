- pgno: 195
  md: '# 二、极小极大过程


    极小极大过程模拟的就是人的一种思维过程。是考虑双方对弈若干步之后，从可能的走步中选一步相对好棋的着法来走，即在有限的搜索深度范围内进行求解。


    下面的讨论规定：顶节点深度d=0，MAX代表程序方，MIN代表对手方，且MAX先走。'
