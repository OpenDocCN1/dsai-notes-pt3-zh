- pgno: 327
  md: '# 6.5 归结原理的几种改进'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# 一、支架集归结


    定义子句集S的子集T称为S的支架集，如果（S-T）是可满足的。一个支架集归结是一个不同时属于（S-T）的两个子句的归结。


    例. 设S是如下子句集：


    +   (1) P ∨ Q

    +   (2) P ∨ ∼Q

    +   (3) ∼P ∨ Q

    +   (4) ∼P ∨ ∼Q


    令 T = { P ∨ Q }，显然 T 是支架集。如下的演绎是支架集归结演绎：


    +   (5) P        由 (1)、(2)

    +   (6) Q        由(1)、(3)

    +   (7) ∼Q      由(5)、(4)

    +   (8)          由(6)、(7)'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# 二、语义归结


    定义（语义互撞） 设I是子句集S的一个解释，P是S中谓词符号的一个顺序，有限子句序列 E₁, ..., E_q, N (q≥1) 称为关于P和I的语义互撞（简称PI-互撞），当且仅当
    E₁, ..., E_q, N 满足下面条件：


    +   (1) E₁, ..., E_q 在I下为假；

    +   (2) 令 R₁=N，对每个 i=1, ..., q，存在 R_i 和 E_i 的归结式 R_{i+1}。

    +   (3) E_i 中的归结文字是 E_i 中最大谓词符号。

    +   (4) R_{q+1} 在I下为假。


    于是，R_{q+1} 称为此PI-互撞的PI-归结式。'
  merge: -1
  img_proc: true
- pgno: 330
  md: '例. 设S是如下子句集：

    (1) ~P ∨ ~Q ∨ R

    (2) P ∨ R

    (3) Q ∨ R

    (4) ~R

    令 I = {~P, ~Q, ~R}， P > Q > R。于是I下为假的子句只有两个：

    Si = {P ∨ R, Q ∨ R}

    我们可得如下PI-演绎：

