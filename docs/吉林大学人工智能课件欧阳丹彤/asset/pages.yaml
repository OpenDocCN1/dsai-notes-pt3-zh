- pgno: 238
  md: '# 16 公式等价


    称公式G, H是等价的，记以G=H，如果 G, H在其任意解释I下，其真值相同。


    公式G, H等价 iff 公式G↔H恒真。


    基本等价式


    1) (G↔H)=(G→H)∧(H→G);


    2) (G→H)=(~G∨H);


    3) G∨G=G, G∧G=G; (等幂律)


    4) G∨H=H∨G, G∧H=H∧G; (交换律)


    5) G∨(H∨S)=(G∨H)∨S, G∧(H∧S)=(G∧H)∧S; (结合律)'
  merge: -1
  img_proc: true
- pgno: 239
  md: '+   6) G∨(G∧H)=G，G∧(G∨H)=G；（吸收律）

    +   7) G∨(H∧S)=(G∨H)∧(G∨S)，

    +      G∧(H∨S)=(G∧H)∨(G∧S)；（分配律）

    +   8) G∨F=G，G∧T=G；（同一律）

    +   9) G∧F=F，G∨T=T；（零一律）

    +   10) ～(G∨H)=～G∧～H，

    +       ～(G∧H)=～G∨～H。（De Morgan律）

    +   11) G∨～G=T；G∧～G=F（互补律）

    +   12) ～～G=G（双重否定律）'
  merge: -1
  img_proc: true
