  md: '# 3.5 A*算法的可采纳性


    如果一个搜索算法对于任何具有解路径的图都能找到一条最佳路径，则称此算法为可采纳的。


    可以证明： A*算法是可采纳的（如果解路径存在，A*一定终止找到最佳解路径）'
  merge: -1
