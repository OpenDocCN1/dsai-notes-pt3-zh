- pgno: 315
  md: '# 定理 若W是关于表达式的有限非空可合一集合，则合一算法终将结束在步骤2，并且最后的σₖ是W的最一般合一。


    证明：（1）终止性。


    否则将产生一个无穷序列：


    W^{σ₀} W^{σ₁} ..., W^{σₙ} ...


    其中每一个直接后继集合比它的前任都少一个变量符号（注意：W^{σ}包含vₖ，而W^{σ''}不包含vₖ）。


    但这是不可能的，因为W仅含有有限个变量符号。


    （2）σₖ是W的合一。若算法停止在步骤2，则Wₖ=W只含有一个元素，所以σₖ是W的合一。'
  merge: -1
  img_proc: true
- pgno: 316
  md: '（3）用归纳法证明算法必不会停止在步骤3，并且对任意W的一个合一θ，任意k，都存在替换λₖ，使得

    θ=σₖ·λₖ

    亦即σₖ是W的mgu。


    当k=0时，因σ₀=ε，取λ₀=θ，于是θ=ε·θ=σ₀·λ₀。'
  merge: -1
  img_proc: true
- pgno: 317
  md: '假设对0≤k≤n， θ=σₖ·λₖ成立


    往证：存在λₙ₊₁，使得θ=σₙ₊₁·λₙ₊₁。

    若Wσ″只含有一个元素，则合一算法结束在步骤2。因为θ=σₙ·λₙ，且σₙ是W的合一，故σₙ是W的mgu。定理得证。

    若Wσ″不只含有一个元素,按照算法,将找出W的差异集合Dₙ。

    因为θ=σₙ·λₙ是W的合一，所以W中表达式经替换θ作用后都变成同一个相同的表达式。而W中表达式经σₙ作用后，产生了差异集合Dₙ，所以Dₙ必须被λₙ所统一，即λₙ是Dₙ的合一。'
  merge: -1
  img_proc: true
- pgno: 318
  md: '因为Dₙ是可合一的（λₙ就是Dₙ的合一），所以必有变量符号vₙ∈Dₙ；Dₙ中至少有两个不同元素。所以可设tₙ∈Dₙ，且tₙ≠vₙ。显然，变量符号vₙ不出现在tₙ中（否则，vₙ^{λₙ}≠tₙ^{λₙ}，这与λₙ是Dₙ的合一矛盾）。

    因此算法不能停止在步骤3，所以算法必然停止在步骤2。'
  merge: -1
  img_proc: true
- pgno: 319
  md: '令σₙ₊₁=σₙ·{tₙ/vₙ}。因为vₙ^λₙ=tₙ^λₙ,所以tₙ^λₙ/vₙ∈λₙ

    令λₙ₊₁=λₙ-{tₙ^λₙ/vₙ}。因vₙ不出现在tₙ中，所以

    tₙ^λₙ₊₁ = tₙ^λₙ-{tₙ^λₙ/vₙ} = tₙ^λₙ

    于是 {tₙ/vₙ}•λₙ₊₁ = {tₙ^λₙ/vₙ}∪λₙ₊₁ = {tₙ^λₙ/vₙ}∪(λₙ-{tₙ^λₙ/vₙ}) = λₙ

    故 θ=σₙ•λₙ = σₙ•({tₙ/vₙ}•λₙ₊₁) = (σₙ•{tₙ/vₙ})•λₙ₊₁ = σₙ₊₁•λₙ₊₁

    归纳法完成。即对所有k≥0,都存在替换λₖ,使 θ=σₖ•λₖ。所以算法终止步骤2时，σₖ是W的最一般合一。'
  merge: -1
  img_proc: true
