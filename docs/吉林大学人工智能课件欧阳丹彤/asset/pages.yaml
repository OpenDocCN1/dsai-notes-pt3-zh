- pgno: 39
  md: '“深蓝”程序：带有一个收集了20世纪各位著名国际象棋大师所下的数千个棋局的数据库。


    必须克服人工智能领域的一个关键问题：


    在组合剧增的情况下进行全盘搜索。


    棋手每走一步约有30步不同的走法。要看到15步之远，计算机必须算遍30¹⁵种不同走棋过程，并从中作出选择。


    IBM的研究小组使用的技术：


    先进行“浅”搜索，比如深度只有10步，以粗略指出哪些步是有希望的，然后对这些走法进行深度较大的搜索。使“深蓝”要处理的局面数减少到1000亿种左右。'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 一篇古怪的小说


    背板 作者 Brytus1型 1998年3月


    戴夫·斯特赖维尔喜爱这所大学。他喜爱校园里爬满常春藤的钟楼，那古色古香而又坚固的砖块，还有那洒满阳光的碧绿草坪和热情的年轻人。使他感到欣慰的还有这样一件事情，即大学里完全没有商场上那种冷酷无情的考验——但事实恰恰并非如此：做学问也要通过考试，而且有的考试与市场上的考验一样不留情面。最好的例子就是论文答辩：为了取得博士学位，为了成为博士，博士生必须通过论文的口试。爱德华·哈特教授就喜欢主持这样的答辩考试。


    戴夫迫切希望成为一名博士。但他需要让三个人在他论文的第一页上签上他们的名字，这三个千金买的签名能够证明他通过了答辩。其中一个签名是哈特教授的。哈特常常对戴夫本人和其他人说，对于帮助戴夫实现他应该有的梦想，他感到很荣幸。答辩之前，斯特赖维尔早早给哈特送去了他论文的倒数第二稿。哈特阅读后告诉戴夫，论文水平绝一流，答辩时他会很高兴地在论文上签名。在哈特那四壁摆满书籍的办公室里，两人甚至还握了手。戴夫注意到，哈特两眼放光，充满信赖，神情宛如慈父一般。


    在答辩时，戴夫觉得自己利落地概括了论文的第二章。评审者提了两个问题，一个是罗德曼教授的，另一个是蒂尔博士提的。戴夫分别作了回答，并且虽然让每个人都心悦诚服，再没有人提出异议。罗德曼教授签了名。他把论文推给蒂尔，她也签上了名字，接着便把本子推到了哈特跟前。哈特没有动。“爱德？”罗德曼问道。哈特仍然坐在那里，毫无表情。


    戴夫感到有点眩晕。“爱德华你打算签名吗？

    过后，哈特一个人呆在办公室里，坐在那张宽大的皮椅里，他为戴夫未能通过答辩感到难过。他试图想出帮助戴夫实现他梦想的办法。'
