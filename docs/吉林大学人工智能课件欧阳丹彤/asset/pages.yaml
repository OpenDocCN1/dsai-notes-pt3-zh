- pgno: 212
  md: '# 剪枝规则


    （1）α剪枝：如果一个MIN节点的β值小于或等于它的某一个MAX祖先节点的α值，则剪枝发生在该MIN节点之下：中止这个MIN节点以下的搜索过程。这个MIN节点最终的倒推值就确定为这个β值。


    （2）β剪枝：如果一个MAX节点的α值大于或者等于它的某一个MIN祖先节点的β值，则剪枝发生在该MAX节点之下。中止这个MAX节点以下的搜索过程。该MAX节点的最终返回值可以置成它的α值。'
  merge: -1
  img_proc: true
