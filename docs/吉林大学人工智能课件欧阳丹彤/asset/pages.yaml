  md: '对于西洋跳棋、国际象棋大致也如此，博弈树大约有10⁴⁰个节点，象棋博弈树大约有10¹²⁰个节点。假设每1/3毫秒产生一个节点，产生整个跳棋的博弈树也需要10²¹个世纪。


