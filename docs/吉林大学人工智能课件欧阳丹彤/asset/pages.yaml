- pgno: 19
  md: '# 人工智能的历史


    Aristotle（公元前384-322）：古希腊伟大的哲学家、思想家，著名学者Plato的学生。

    主要贡献:为形式逻辑奠定了基础。

    三段论

    Famous syllogism of Aristotle:

    Every man is mortal

    Socrates is a man

    Deduction: Socrates is mortal


    演绎推理特点:

    一般→特殊;前提真，结论一定真'
  merge: -1
