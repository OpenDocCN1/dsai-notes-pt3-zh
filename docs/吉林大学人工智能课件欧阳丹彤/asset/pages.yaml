    D={2,3,4}


    +   - 设P(x)： x大于3，则P(x)为一元谓词。

    +     指定元素--命题： P(2)=F, P(3)=F, P(4)=T

    +   - 设P(x,y)： x大于y,则P(x,y)为二元谓词。

    +     指定元素--命题： P(2,3)=F, P(4,2)=T

    +   - 设P(x,y,z)： 若x+y-1=z，则P(x,y,z)为T，否则为F。则P(x,y,z)为三元谓词。

