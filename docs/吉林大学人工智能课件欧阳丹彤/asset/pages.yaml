- pgno: 233
  md: '# 10 解释


    设G是命题公式,A1,...,An是出现在G中的所有原子。指定 A1,...,An的一组真值,则这组真值称为G的一个解释。


    +   设G是公式，I是G的一个解释，G在I下的真值记为T_I(G)。


    +   例.G=P∧Q，设解释I, I''如下：

    +   I: P Q

    +       T T

    +   则T_I(G)=T，T_I''(G)=F

    +   I'': Q

    +       T F


    注意：该例子中写成G=T或G=F是错误的！'
