    +   (7) ∀x P(x) ⇒ ∃x P(x)

    +   (8) ∀x P(x) ∨ ∀x Q(x) ⇒ ∀x (P(x) ∨ Q(x))

    +   (9) ∃x (P(x) ∧ Q(x)) ⇒ ∃x P(x) ∧ ∃x Q(x)

    +   (10) ∀x (P(x) → Q(x)) ⇒ ∀x P(x) → ∀x Q(x)

    +   (11) ∃x (P(x) → Q(x)) ⇒ ∀x P(x) → ∃x Q(x)'
