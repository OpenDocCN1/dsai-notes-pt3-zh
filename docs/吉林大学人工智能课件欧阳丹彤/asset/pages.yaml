  md: '# （一）应用归结原理进行定理证明


    应用归结原理进行定理证明的步骤：


    设要被证明的定理可用谓词公式表示为如下的形式：

    A₁ ∧ A₂ ∧ ... ∧ Aₙ → B


    +   (1) 首先否定结论 B，并将否定后的公式 ~B 与前提公式集组成如下形式的谓词公式： G = A₁ ∧ A₂ ∧ ... ∧ Aₙ ∧ ~B


    +   (2) 求谓词公式 G 的子句集 S。


    +   (3) 应用归结原理，证明子句集 S 的不可满足性。'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# 应用归结原理进行定理证明-习题1


    例.已知:某些病人喜欢所有的医生，

    没有一个病人喜欢任意一个骗子。

    证明:任意一个医生都不是骗子。


    证明: 知识表示: 令


    P(x): x是病人      D(x): x是医生


    Q(x): x是骗子      L(x, y): x喜欢y


    A1: ∃x (P(x) ∧ ∀y(D(y)→L(x, y)))


    A2: ∀x(P(x) →∀y(Q(y) →∼L(x, y)))


    B: ∀x(D(x) →∼Q(x))


    我们要证明B是A1和A2的逻辑结果，即公式A1∧A2∧∼B是不可满足的。'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'A1=∃x (P(x) ∧ ∀y(~D(y) ∨ L(x, y)))

    =∃x ∀y (P(x) ∧ (~D(y) ∨ L(x, y)))

    ----> ∀y (P(a) ∧ (~D(y) ∨ L(a, y)))

    A2=∀x(P(x) → ∀y(~Q(y) ∨ ~L(x, y)))

    =∀x(~P(x) ∨ ∀y(~Q(y) ∨ ~L(x, y)))

    =∀x∀y (~P(x) ∨ ~Q(y) ∨ ~L(x, y))

    ~B=~(∀x(D(x) → ~Q(x)))

    =∃x (D(x) ∧ Q(x))

    ----> D(b) ∧ Q(b)

    因此，公式A1∧A2∧~B的子句集为

    S= {P(a), ~D(y)∨L(a,y), ~P(x)∨~Q(y)∨~L(x, y), D(b), Q(b)}'
  merge: -1
  img_proc: true
