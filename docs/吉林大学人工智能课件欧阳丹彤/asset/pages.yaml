  md: '# 11 谓词公式的恒真、恒假、可满足


    +   - 公式G称为可满足的，如果存在解释I，使G在I下取1值，简称I满足G。

    +     若I不满足G，则简称I弄假G。

    +   - 公式G称为是恒假的(或不可满足的)，如果不存在解释I满足G。

    +   - 公式G称为恒真的，如果G的所有解释I都满足G。'
