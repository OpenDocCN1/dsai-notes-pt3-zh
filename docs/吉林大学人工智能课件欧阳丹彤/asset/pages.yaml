- pgno: 125
  md: '# 启发能力的度量......渗透度


    定义 渗透度是对一个搜索算法的搜索性能的度量，表示搜索集中指向某个目标的程度，而不是在无关的方向上徘徊。


    定义为：


    ```

    P = L / T

    ```


    其中，L是算法发现的解路径的长度，T是算法在寻找这条解路径期间所产生的节点数（不包括初始节点，包括目标节点）'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# 启发能力的度量......渗透度


    例 图3.9的八数码问题， L=18， T=43，

    渗透度： P = L / T = 18 / 43 = 0.42

    若一个算法每次选取的节点都在解路径上，则 L = T， P =1；

    一般搜索的渗透度P<1；

    无信息的搜索P<<1；

    渗透度大，所产生的搜索树向纵深发展；

    渗透度小，所产生的搜索树沿水平方向发展。'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# 启发能力的度量......渗透度


    搜索算法的渗透度取决于问题的难度和算法的效率。


    当最佳解路短时，可能有较高的渗透度；


    当最佳解路长时，算法产生节点的数目将以更快的速度增加，可能有较低的渗透度。


    渗透度有时并不能很好地反映搜索向目标方向发展的集中程度。'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 启发能力的度量......有效分枝系数


    有效分枝系数就是这样一棵树的平均分枝数。


    设搜索树的深度是L，算法所产生的总节点数为T，有效分枝系数是B，则有


    B + B² + ... + B^L = T


    或


    B（B^L -1）/（B-1）=T'
