- pgno: 92
  md: '# A*算法的可采纳性


    定理1 GRAPHSEARCH对有限图必然终止。


    证明：GRAPHSEARCH算法将在第3步将OPEN表中的节点用光而结束；或在第5步，找到目标节点而结束。


    在算法的每一次循环都要从OPEN表中删除一个节点，并生成有限个后继加到OPEN表中。


    对有限图来说，显然这一循环不能无限进行下去。结论得证。'
  merge: -1
