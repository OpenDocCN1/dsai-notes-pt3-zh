  md: '# 单调限制的性质......定理7


    定理7 如果A*算法的启发函数h满足单调限制，则当算法A*选择节点n扩展时，就已经发现了通向节点n的最佳路径，即g(n)=g*(n).


    证明：设n是算法A*选出扩展的任一节点。


    +   ● 若n=s，则g(n)=g*(n)=0，算法A*已发现通向s的最佳路径。


    +   ● 若n≠s，设序列P=(s=n₀， n₁， ...， nₖ=n)是从s到n的一条最佳路径(不知道是否在A*的搜索树中)。'
  merge: -1
