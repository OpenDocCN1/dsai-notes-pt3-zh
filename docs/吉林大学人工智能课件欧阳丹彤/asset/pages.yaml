- pgno: 200
  md: '# MINIMAX过程


    ①:T:= (s, MAX), OPEN:= (s), CLOSED:= ( ) ; 开始树由初始节点构成，OPEN表只含有s。


    ②LOOP1:IF OPEN = ( ), THEN GO LOOP2;


    ③n:=FIRST (OPEN), REMOVE (n, OPEN), ADD (n, CLOSED) ;


    ④IF n可直接判定为赢、输或平局

    THEN e(n):= ∞ V −∞ V0, GO LOOP1

    ELSE EXPAND (n) →{n_i}, ADD ({n_i}, T)

    IF d (n_i) <L,

    THEN ADD ({n_i}, OPEN), GO LOOP1

    ELSE计算e(n_i), GO LOOP1; n_i达到深度L，计算各端节点e值。'
  merge: -1
  img_proc: true
- pgno: 201
  md: '⑤LOOP2: IF CLOSED=NIL THEN GO LOOP3

    ELSE nₚ:=FIRST (CLOSED) ;

    ⑥IF nₚ∈MAX, 且对nₚ的任意子节点n_ci, e (n_ci) 都有值

    THEN e (nₚ) :=max{e (n_ci) }, REMOVE (nₚ, CLOSED) ;

    若MAX所有子节点均有值，则该MAX取其极大值。

    IF nₚ∈MIN, 且对nₚ的任意子节点n_ci, e (n_ci) 都有值

    THEN e (nₚ) :=min{e (n_ci) }, REMOVE (nₚ, CLOSED) ;

    若MIN所有子节点均有值，则该MIN取其极小值。

    ⑦GO LOOP2;

    ⑧LOOP3: IF e (s) 有值,THEN EXIT (END∨M (Move, T) ) ; 若 s有值，则结束或标记走步。'
  merge: -1
  img_proc: true
