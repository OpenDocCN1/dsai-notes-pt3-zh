- pgno: 207
  md: '# # 极小极大过程的问题


    +   - 把搜索的产生过程与尖端节点的静态估值过程完全分开。在搜索树完全产生之后，才开始对尖端节点的估值。这种分开进行的方式导致博弈树搜索的低效率；节点数将随着搜索深度的增加呈指数增长。这极大地限制了极小极大搜索方法的使用。


    +   - 解决方法：让搜索树的产生过程与静态估值与返回值的过程同时进行，在搜索深度不变的情况下，利用已有的搜索信息减少生成的节点数，从而使搜索效率大幅提高。----α-β过程'
  merge: -1
