- pgno: 302
  md: '# 替换的乘积


    +   - 定义（替换的乘积）设 θ = { t₁/x₁, ..., tₙ/xₙ }, λ = { u₁/y₁, ..., uₘ/yₘ } 是两个替换。将下面集合
    { t₁^λ/x₁, ..., tₙ^λ/xₙ, u₁/y₁, ..., uₘ/yₘ } 中任意符合下面条件的元素删除：

    +     1） uᵢ/yᵢ, 当 yᵢ ∈ {x₁, ..., xₙ} 时；

    +     2） tᵢ^λ/xᵢ, 当 tᵢ^λ = xᵢ 时。

    +     如此得到一个替换，称为 θ 与 λ 的乘积，记为 θ·λ。


    +   - 例. 令 θ = {f(y)/x, z/y}

    +     λ = {a/x, b/y, y/z}

    +     于是得集合

    +     { t₁^λ/x₁, t₂^λ/x₂, u₁/y₁, u₂/y₂, u₃/y₃ }

    +     = {f(b)/x, y/y, a/x, b/y, y/z}

    +     θ 与 λ 的乘积为

    +     θ·λ = {f(b)/x, y/z}'
  merge: -1
  img_proc: true
