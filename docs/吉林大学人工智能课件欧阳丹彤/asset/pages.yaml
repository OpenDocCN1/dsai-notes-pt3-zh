- pgno: 172
  md: '# 4.4 博弈树搜索

    博弈


    +   - 具有竞争或对抗性质的行为称为博弈行为。

    +     比如日常生活中的下棋，打牌等。

    +     在这类行为中，参加斗争或竞争的各方各自具有不同的目标或利益。为了达到各自的目标和利益，各方必须考虑对手的各种可能的行为方案，并力图选取对自己最为有利或最为合理的方案。

    +   - 博弈论 Game Theory

    +     博弈论就是研究博弈行为中斗争各方是否存在着最合理的行为方案，以及如何找到这个合理的行为方案的数学理论和方法。

    +     博弈论亦名“对策论”、“赛局理论”，属应用数学的一个分支，目前在生物学，经济学，国际关系，计算机科学，政治学，军事战略和其他很多学科都有广泛的应用。'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# 博弈论历史


    +   - 博弈论思想古已有之，我国古代的《孙子兵法》就不只是一部军事著作，而且算是最早的一部博弈论专著。博弈论最初主要研究象棋、桥牌、赌博中的胜负问题，人们对博弈局势的把握只停留在经验上，没有向理论化发展。

    +   - 近代对于博弈论的研究，开始于策墨洛（Zermelo），波雷尔（Borel）及冯·诺伊曼（von Neumann）。

    +   - 1928年，冯·诺依曼证明了博弈论的基本原理，从而宣告了博弈论的正式诞生。1944年，冯·诺依曼和摩根斯坦共著的划时代巨著《博弈论与经济行为》将二人博弈推广到n人博弈结构并将博弈论系统的应用于经济领域，从而奠定了这一学科的基础和理论体系。

    +   - 1950～1951年，约翰·福布斯·纳什（John Forbes Nash Jr）利用不动点定理证明了均衡点的存在，为博弈论的一般化奠定了坚实的基础。纳什的开创性论文《n人博弈的均衡点》（1950），《非合作博弈》（1951）等等，给出了纳什均衡的概念和均衡存在定理。此外，塞尔顿、哈桑尼的研究也对博弈论发展起到推动作用。今天博弈论已发展成一门较完善的学科。'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# 博弈分类-根据不同的基准有不同的分类


    +   - 合作博弈和非合作博弈。

    +     它们的区别在于相互发生作用的当事人之间有没有一个具有约束力的协议，如果有，就是合作博弈，如果没有，就是非合作博弈。

    +   - 从行为的时间序列性，分为静态博弈和动态博弈

    +     静态博弈是指在博弈中，参与人同时选择或虽非同时选择但后行动者并不知道先行动者采取了什么具体行动；

    +     动态博弈是指在博弈中，参与人的行动有先后顺序，且后行动者能够观察到先行动者所选择的行为。

    +     “囚徒困境”就是同时决策的，属于静态博弈；而棋牌类游戏等决策或行动有先后次序的，属于动态博弈。

    +   - 按照参与人对其他参与人的了解程度分为完全信息博弈和不完全信息博弈。

    +     完全博弈是指在博弈过程中，每一位参与人对其他参与人的特征、策略空间及收益函数有准确的信息。

    +     如果参与人对其他参与人的特征、策略空间及收益函数信息了解的不够准确、或者不是对所有参与人的特征、策略空间及收益函数都有准确的准确信息，在这种情况下进行的博弈就是不完全信息博弈。'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# 囚徒困境


    警方逮捕甲、乙两名嫌疑犯，但没有足够证据指控二人入罪。于是警方分开囚禁嫌疑犯，分别和二人见面，并向双方提供以下相同的选择：


    +   - 若一人认罪并作证检举对方（称“背叛”对方），而对方保持沉默，此人将即时获释，沉默者将判监10年。

    +   - 若二人都保持沉默（称互相“合作”），则二人同样判监半年。

    +   - 若二人都互相检举（互相“背叛”），则二人同样判监2年。


    假定：每个参与者（即“囚徒”）都是利己的，即都寻求最大自身利益，而不关心另一参与者的利益。参与者某一策略所得利益，如果在任何情况下都比其他策略要低的话，此策略称为“严格劣势”，理性的参与者绝不会选择。没有任何其他力量干预个人决策，参与者可完全按照自己意愿选择策略。'
  merge: -1
  img_proc: true
- pgno: 176
  md: '试设想囚困境中两名理性囚徒会如何作出选择：


    +   - 若对方沉默，背叛会让我获释，所以会选择背叛。

    +   - 若对方背叛指控我，我也要指控对方才能得到较低的刑期，所以也是会选择背叛。


    二人面对此情况一样，所以二人的理性思考都会得出相同的结论——选择背叛，结果二人同样服刑2年。


    这显然不是顾及团体利益的最优解决方案。以全体利益而言，如果两个参与者都合作保持沉默，两人都只会被判刑半年，总体利益更高，结果也比两人背叛对方、判刑2年的情况较佳。但根据以上假设，二人均为理性的人，且只追求自己个人利益。均衡状况会是两个囚徒都选择背叛，结果二人判决均比合作为高，总体利益较合作为低。这就是“囚困”所在。'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# 4.4 博弈树搜索


    对于单人博弈的一些问题，可用一般的搜索技术进行求解，本节着重讨论双人完备信息这一类博弈问题的搜索策略。


    +   双人、具有完备信息博弈问题的特点：

    +   （1）双人对弈，对弈的双方轮流走步。

    +   （2）信息完备，对弈双方所得到的信息是一样的，不存在一方能看到，而另一方看不到的情况。

    +   （3）零和。即对一方有利的棋，对另一方肯定不利，不存在对双方均有利、或均无利的棋。对弈的结果是一方赢，另一方输，或者双方和棋。'
  merge: -1
  img_proc: true
- pgno: 178
  md: '+   - 零和博弈（zero - sum game）：是指博弈的参与者中,一方之所得是它方之所失,总量上看,支付水平不起变化或者为零。

    +   - 非零和博弈是一种非合作下的博弈，博弈中各方的收益或损失的总和不是零值。在经济学研究中很有用。


    在这种状况时，自己的所得并不与他人的所失的大小相等，连自己的幸福也未必建立在他人的痛苦之上，即使伤害他人也可能“损人不利己”，所以博弈双方存在“双赢”的可能，进而合作。譬如，在恋爱中一方受伤的时候，对方并不是一定得到满足。也有可能双方一起能得到精神的满足。也有可能双方一起受伤。通常，彼此精神的损益不是零和的。比如目前的中美关系，就并非“非此即彼”，而是可以合作双赢。'
  merge: -1
  img_proc: true
