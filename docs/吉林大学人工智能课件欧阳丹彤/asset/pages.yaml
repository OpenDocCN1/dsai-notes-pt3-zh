  md: '# A*算法的比较


    讨论：启发函数的启发能力在于它所具有的启发性信息。


    +   1. 当h(n)≡0时，反映了启发函数完全没有启发信息，要扩展较多的节点。


    +   2. 在具有可采纳性的前提下，0≤h≤h*，h*定出了h的上界，当h越接近h*时，它的启发能力就越大。'
