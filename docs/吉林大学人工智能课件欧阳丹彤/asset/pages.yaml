- pgno: 22
  md: '# # George Boole (1815-1864)

    英国数学家、逻辑学家


    ![](img/6bab1e62411b30f795aa6fa92b5fb8cf_22_0.png)


    主要贡献： 初步实现了Leibnitz关于思维符号化和数学化的思想；提出了一种崭新的代数系统，被后世称为布尔代数。


    凡传统逻辑（命题逻辑）能处理的问题，布尔代数都能处理，而某些能用布尔代数处理的问题，用传统逻辑处理却极其困难。'
  merge: -1
  img_proc: true
- pgno: 23
