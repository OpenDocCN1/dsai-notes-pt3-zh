- pgno: 152
  md: '# AO*算法解析：


    +   - 回忆：

    +     普通图搜索中的A算法：对当前搜索图的“前沿”（即在OPEN表中的节点）节点进行评价，选取f值最小的节点进行扩展。

    +     回想一下，f是如何定义的？

    +     f(n) = g(n) + h(n)，其中

    +     g(n)：已经求得的当前搜索图中从初始节点到当前节点n的最优路径费用。

    +     h(n)：从n到目标节点的最优路径费用的估计值。

    +     结论：对节点n的评价，实际上是对"初始节点--节点n--目标节点"这一条路径的评价。'
  merge: -1
  img_proc: true
