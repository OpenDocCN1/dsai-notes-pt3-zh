- pgno: 214
  md: '# 进行α-β剪枝注意的问题：


    （1）比较都是在极小节点和极大节点间进行的，极大节点和极大节点的比较，或者极小节点和极小节点间的比较是无意义的。


    （2）在比较时注意是与“祖先层”节点比较，不只是与父辈节点比较。当然，这里的“祖先层”节点，指的是那些已经有了值的节点。


    （3）当只有一个节点的值“固定”以后，其值才能够向其父节点传递。


    （4）α-β剪枝方法搜索得到的最佳走步与极小极大方法得到的结果是一致的，α-β剪枝并没有因为提高效率，而降低得到最佳走步的可能性。


    （5）在实际搜索时，并不是先生成指定深度的搜索图，再在搜索图上进行剪枝。如果这样，就失去了α-β剪枝方法的意义。在实际程序实现时，首先规定一个搜索深度，然后按照类似于深度优先搜索的方式，生成节点。在节点的生成过程中，如果在某一个节点处发生了剪枝，则该节点其余未生成的节点就不再生成了。'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# α-β剪枝的效率


    若以最理想的情况进行搜索，即对MIN节点先扩展最低估计值的节点（若从左向右顺序进行，则设节点估计值从左向右递增排序），MAX先扩展最高估计值的节点（设估计值从左向右递减排序），则当搜索树深度为D，分枝因子为B时，若不使用α-β剪枝技术，搜索树的端节点数B^P；若使用α-β剪枝技术。可以证明理想条件下生成的端节点数最少，有
    N_D=2B^{D/2}-1（D为偶数）


    N_D=B^{(D+1)/2}+B^{(D-1)/2}-1（D为奇数）


    比较后得出最佳α-β搜索技术所生成深度为D处的端节点数约等于不用α-β搜索技术所生成深度为D / 2处的端节点数。因此，在使用相同存储空间的条件下，α-β过程能把搜索深度扩大一倍。'
  merge: -1
  img_proc: true
