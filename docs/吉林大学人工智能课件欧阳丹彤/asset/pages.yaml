  md: "# AO*算法解析：\n\n+   在与/或图搜索中，由于“与”节点的存在，单纯对一个节点的评价已经不能反映解图的全面情况。\n+   \n+   与/或图中的解图相当于普通图中的解路径。\n\
    +   \n+   从\"对节点n的评价，实际上是对'初始节点--节点n--目标节点'这一条路径的评价\"这一思路出发，可以很容易的想到，能否通过对局部解图进行评价，来达到类似于普通图中A*搜索的目的。AO*算法，正是这样的一种适用于与/或图的搜索算法。"
