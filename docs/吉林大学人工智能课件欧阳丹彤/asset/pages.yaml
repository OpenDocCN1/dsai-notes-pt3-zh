- pgno: 265
  md: '# 13 等价


    +   - 公式G，H称为等价，记以G=H，如果公式G↔H是恒真的。

    +   - 公式G，H等价的充要条件是：对G，H的任意解释I，G，H在I下的真值相同。

    +   - 因为对任意公式G，H，在解释I下，G，H就是两个命题，所以命题逻辑中给出的基本等价式，在谓词逻辑中仍然成立。'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# 14 蕴涵


    +   - 设G，H是公式，称G蕴涵H，或H是G的逻辑结果，如果公式G→H是恒真的，并记以G⇒H。

    +   - 对任意两个公式G，H，G蕴涵H的充要条件是：对任意解释I，若I满足G，则I必满足H。

    +   - 同样，命题逻辑中的基本蕴涵式仍成立。'
