  md: '# 计算机打败国际象棋冠军


    “深蓝”与卡斯帕罗夫的对比—


    身高:卡斯帕罗夫5英尺10英寸,“深蓝”6英尺5英寸;


    体重:卡斯帕罗夫176磅，“深蓝”1.4吨;


