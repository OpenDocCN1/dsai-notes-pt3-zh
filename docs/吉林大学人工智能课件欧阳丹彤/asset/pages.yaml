- pgno: 321
  md: '# 定义（因子）


    如果子句C中，两个或两个以上的文字有一个最一般合一σ，则Cσ称为C的因子；如果Cσ是单元子句，则Cσ称为C的单因子。


    例. C=P(x) ∨ P(f(y)) ∨ ∼Q(x)


    令 σ={f(y)/x}，于是


    Cσ= P(f(y)) ∨ ∼Q(f(y))


    是C的因子。'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# 二元归结式


    定义 设C₁, C₂是两个无公共变量的子句(称为亲本子句), L₁, L₂分别是C₁, C₂中的两个文字。


    如果L₁和~L₂有最一般合一, 则子句


    (C₁^σ - {L₁^σ}) ∪ (C₂^σ - {L₂^σ})


    称为C₁和C₂的二元归结式, L₁和L₂称为归结文字。


    例. 设C₁=P(x) ∨ Q(x), C₂=~P(a) ∨ R(x)


    将C₂中x改名为y。取L₁=P(x), L₂=~P(a), σ={a/x},


    于是(C₁^σ - {L₁^σ}) ∪ (C₂^σ - {L₂^σ})


    ={ {P(a), Q(a)} - {P(a)} } ∪ { {~P(a), R(y)} - {~P(a)} }


    ={Q(a), R(y)}= Q(a) ∨ R(y) ----C₁和C₂的二元归结式.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '在谓词逻辑中，对子句进行归结推理时，要注意以下几个问题：


    +   (1) 若被归结的子句C₁ 和C₂ 中具有相同的变元时，需要将其中一个子句的变元更名，否则可能无法合一，从而没有办法进行归结。

    +   (2) 在求归结式时，不能同时消去两个互补文字对，消去两个互补文字对所得的结果不是两个亲本子句的逻辑推论。

    +   (3) 如果在参加归结的子句内含有可合一的文字，则在进行归结之前，应对这些文字进行合一，以实现这些子句内部的化简。'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# 归结式


    定义子句 C₁, C₂ 的一个归结式是下列二元归结式之一：


    +   (1) C₁ 和 C₂ 的二元归结式。

    +   (2) C₁ 和 C₂ 的因子的二元归结式。

    +   (3) C₁ 的因子和 C₂ 的二元归结式。

    +   (4) C₁ 的因子和 C₂ 的因子的二元归结式。


    例. 设


    C₁ = P(x) ∨ P(f(y)) ∨ R(g(y))


    C₂ = ~P(f(g(a))) ∨ Q(b)


    C₁ 的因子 C₁'' = P(f(y)) ∨ R(g(y))。于是 C₁'' 和 C₂ 的二元归结式，从而也是 C₁ 和 C₂ 的归结式为


    R(g(g(a))) ∨ Q(b)'
  merge: -1
  img_proc: true
