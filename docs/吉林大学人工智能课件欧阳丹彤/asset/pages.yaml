- pgno: 110
  md: '# 单调限制的性质......定理7


    由已知h(n)满足单调限制，对任意i=0,...,k-1,有


    g*(nᵢ)+h(nᵢ) ≤ g*(nᵢ)+c(nᵢ, nᵢ₊₁)+ h(nᵢ₊₁)


    而nᵢ和nᵢ₊₁都在最佳路径上，故


    g*(nᵢ₊₁) = g*(nᵢ)+c(nᵢ, nᵢ₊₁)


    因此


    g*(nᵢ)+h(nᵢ) ≤ g*(nᵢ₊₁)+h(nᵢ₊₁)'
