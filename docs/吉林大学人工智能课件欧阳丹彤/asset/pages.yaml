- pgno: 196
  md: '+   - 静态估值函数e(p)：建立在该棋的各种知识和特征上。对在一定深度处的节点所代表的局面进行评价优劣的估计值。

    +   - 静态估值函数因游戏而异。

    +   如果对自己（MAX）有利，则取正值，越大，表示对我方越有利。等于正无穷大时，表示我方必胜。

    +   如果对自己不利，则取负值。越小，表示对我方越不利。等于负无穷大时，表示对方必胜。'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# 极小极大过程基本思想：


    当轮到我方走棋时，首先按照一定的搜索深度生成出给定深度以内的所有状态，计算所有叶节点的静态估值函数值。然后逆向计算：对于我方要走的节点（MAX节点）取其子节点中的最大值为该节点的值（因为我方总是选择对我方有利的棋）；对于对方要走的节点（MIN节点）取其子节点中的最小值为该节点的值（对方总是选择对我方不利的棋）。一直到计算出根节点的值为止。获得根节点取值的那一分枝，即为所选择的最佳走步。'
  merge: -1
  img_proc: true
- pgno: 198
  md: '+   - **极小极大原则**

    +     MAX节点在其MIN子节点的倒推值中选max；

    +     MIN节点在其MAX子节点的倒推值中选min

    +   - **倒推值**

    +     在极小极大过程中，第i层节点根据第i+1层节点的值使用极小极大原则而获得的值。

    +   - **极小极大过程**

    +     1. 按宽度优先生成0至L层所有节点。

    +     2. 使用静态估值函数计算第L层节点的函数值。

    +     3. 按极小极大原则计算各层节点的倒推值，直到求出初始节点的倒推值为止。实现该倒推值的走步就是相对好的走步。'
  merge: -1
  img_proc: true
