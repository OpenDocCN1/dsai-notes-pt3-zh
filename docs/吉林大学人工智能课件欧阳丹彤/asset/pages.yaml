  md: '# 一、命题逻辑


    # 1 命题


    一句话有真假意义的话。


    用大写英文字母P，Q，...，P₁，P₂，...，表示。


    例：


    上海是中国最大的城市。今天是星期二。


    所有素数都是奇数。

    1+1=2。


    我不会解答这道题。

    别的星球上有生物。


    如果太阳从西方升起，你就可以长生不老。


    严禁吸烟。

    几点了？

    全体起立！


    这个教室好大呀！

    我正在说谎。'
