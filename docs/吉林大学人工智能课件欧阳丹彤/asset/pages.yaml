- pgno: 249
  md: '# 2 量词


    语句“对任意x”称为全称量词，记以∀x；

    语句“存在一个x”称为存在量词，记以∃x。


    +   量词的语义规定


    ∀x G(x) 取T值 ⇔ 对任意 x∈D，G(x) 都取T值；


    ∃x G(x) 取T值 ⇔ 至少有一个 x₀∈D，使 G(x₀) 取T值


    语义上，当 D={x₀,x₁,…} 是可数集合时，


    ∀x G(x) 等价于 G(x₀)∧G(x₁)∧…


    ∃x G(x) 等价于 G(x₀)∨G(x₁)∨…'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# 3 约束变量、自由变量


    在一个由谓词，量词，逻辑联结词，括号组成的有意义的符号串(公式)中，称变量的出现是约束的，当且仅当它出现在使用这个变量的量词范围之内；称变量的出现是自由的，当且仅当这个出现不是约束的。


    称变量是约束的，如果至少有一个它的出现是约束的；称变量是自由的，如果至少有一个它的出现是自由的。


    例如，


    ```

    ∃x(P(x, y)→Q(x, z))∨R(x)

    ```


    从左向右算起，变量x的第一，第二出现是约束的，第三次出现是自由的；变量y，z的出现是自由的。x既是约束变量，又是自由变量；y，z只是自由变量。'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# 4 约束变量的改名规则


    改名规则的理论依据


    +   • ∀xP(x)与∀yP(y)都是表示个体域D中的“每个个体都具有性质P”，所以可以把x改名为y，即把∀xP(x)改成为∀yP(y)。


    +   • ∃xP(x)与∃yP(y)都是表示个体域D中的“某个个体具有性质P”，所以也可以把x改名为y，即把3xP(x)改成为3yP(y)。


    亦即，谓词逻辑中命题的真值，与命题中的约束变量的记法无关。这就引出了谓词逻辑中的改名规则。'
  merge: -1
  img_proc: true
- pgno: 252
  md: '+   • 改名规则： 在由谓词，量词，逻辑联结词，括号组成的有意义的字符串(公式)中，可将其中出现的约束变量改为另一个约束变量，这种改名必须在量词作用区域内各处以及该量词符号中实行，并且改变的新约束变量要与改名区域中的的所有其它变量。


    +   • 显然改名规则不改变原符号串的真值。'
  merge: -1
  img_proc: true
