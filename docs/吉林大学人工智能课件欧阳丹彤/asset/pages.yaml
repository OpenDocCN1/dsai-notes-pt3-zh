- pgno: 311
  md: '# 合一算法（Unification algorithm）


    步骤1：置 k=0，Wₖ=W，σₖ=ε


    步骤2：若 Wₖ 只有一个元素，则停止，σₖ 是 W 的最一般合一；否则，找出 Wₖ 的差异集合。


    步骤3：若 Dₖ 非奇异，Dₖ 中存在元素 vₖ 和 tₖ，其中 vₖ 是变量符号，并且不出现在 tₖ 中，则转步骤4；否则，算法停止，W 是不可合一的。


    步骤4：令 σₖ₊₁=σₖ·{tₖ/vₖ}，Wₖ₊₁=Wₖ^{tₖ/vₖ}（注：Wₖ₊₁=W^{σₖ₊₁}）


    步骤5：置 k=k+1，转步骤2。'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# 例. 令 W={Q(f(a), g(x)), Q(y, y)}, 求W的mgu。


    +   - 步骤1： k=0, W₀=W, σ₀=ε。

    +   - 步骤2： D₀={f(a), y}。

    +   - 步骤3： 有v₀= y ∈D₀, v₀不出现在t₀=f(a)中。

    +   - 步骤4： 令 σ₁=σ₀·{t₀/v₀}={f(a)/y}, W₁={Q(f(a), g(x)), Q(f(a), f(a))}

    +   - 步骤5： k=k+1=1

    +   - 步骤2： D₁={g(x), f(a)}。

    +   - 步骤3： D₁中无变量符号，算法停止，W不可合一。'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# 例 令 W={P(a, x, f(g(y))), P(z, f(z), f(u))}, 求出W的mgu。


    步骤1: k=0, W₀=W, σ₀=ε。


    步骤2: D₀={a, z}。


    步骤3: 有v₀=z∈D₀, v₀不出现在t₀=a中。


    步骤4: 令 σ₁=σ₀·{t₀/v₀}=ε·{a/z}={a/z},


    W₁=W₀{t₀/v₀}={P(a,x,f(g(y))),P(z,f(z),f(u))}{a/z}={P(a,x,f(g(y))),P(a,f(a),f(u))}


    步骤5: k=k+1=1


    步骤2: D₁={x, f(a)}。


    步骤3: 有v₁=x∈D₁, 且v₁不出现在t₁=f(a)中。


    步骤4: 令 σ₂=σ₁·{t₁/v₁}={a/z}·{f(a)/x}={a/z, f(a)/x},


    W₂=W₁{t₁/v₁}={P(a,x,f(g(y))),P(a,f(a),f(u))}{f(a)/x}


    ={P(a,f(a),f(g(y))),P(a,f(a),f(u))}'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# 例。


    步骤5： k=k+1=2


    步骤2： D₂={g(y), u}。


    步骤3： 有v₂=u∈D₂，且v₂不出现在t₂=g(y)中。


    步骤4： 令 σ₃=σ₂·{t₂/v₂}={a/z, f(a)/x}·{ g(y)/u }

    ={a/z, f(a)/x, g(y)/u }，


    W₃=W₂^{t₂/v₂}={P(a, f(a), f(g(y))), P(a, f(a), f(u))}^{g(y)/u}

    ={P(a, f(a), f(g(y)))}


    步骤5:k=k+1=3


    步骤2： W₃只有一个元素。算法停止。


    σ₃={a/z, f(a)/x, g(y)/u }


    是W的最一般合一。'
