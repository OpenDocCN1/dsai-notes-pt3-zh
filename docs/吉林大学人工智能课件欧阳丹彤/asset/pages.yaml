- pgno: 189
  md: '# ？？博弈问题为什么可以用与/或图表示


    可以这样来看待这个问题：当轮到我方走棋时，只需从若干个可以走的棋中，选择一个棋走就可以了。从这个意义上说，若干个可以走的棋是“或”的关系。而对于轮到对方走棋时，对于我方来说，必须能够应付对手的每一种走棋。这就相当于这些棋是“与”的关系。因此，博弈问题可以看成是一个与/或图，但是与一般的与/或图并不一样，是一种特殊的与/或图。'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Grundy博弈


    +   - **Grundy博弈**是一个分钱币的游戏。分钱币问题是一种简单的博弈问题。

    +   - 有一堆数目为N的钱币，由两位选手轮流进行分堆，要求每个选手每次只把其中某一堆分成数目不等的两小堆。例如选手甲把N分成两堆后，轮到选手乙就可以挑其中一堆来分，如此进行下去直到有一位选手先无法把钱币再分成不相等的两堆时就得认输（直到桌子上的每堆硬币都是一个或两个为止，谁先遇到这种情况谁就算输了）。

    +     以下用MIN代表对方，MAX代表我方。'
  merge: -1
  img_proc: true
