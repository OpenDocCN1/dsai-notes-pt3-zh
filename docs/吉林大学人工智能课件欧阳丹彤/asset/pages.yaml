- pgno: 13
  md: '# 2、人工智能


    +   - 人工智能又称为智能模拟，用计算机模拟人脑的智能行为。包括感知、学习、推理、对策、决策、预测、直觉、联想。

    +   - Nilson(Stanford): AI是关于知识的科学，即怎样获取、表示和使用知识的科学

    +   - Feigenbaum(Stanford):AI是知识信息处理系统

    +   - Winston(MIT):AI就是研究如何使计算机去做过去只有人才能做的富有智能的工作'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'It is the science and engineering of making intelligent machines, especially
    intelligent computer programs. It is related to the similar task of using computers
    to understand human intelligence, but AI does not have to confine itself to methods
    that are biologically observable.

    --McCarthy


    人工智能既包含理论研究的内容又包含工程方面的内容。

    人工智能的研究注意智能系统的效果而不是单纯的对人的智能行为的模拟。'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# 3、人工智能的研究目标


    根本目标 要求计算机不仅能模拟而且可以延伸、扩展人的智能,达到甚至超过人类智能的水平。


    附：关于智能本质的争论


    +   - Von Neumann：计算机决不会有智能。

    +   - Turing：计算机是能达到人的智力水平的。

    +   - McCarthy：人工智能的所有主要问题都是难解的。

    +   - Minsky：人工智能是有史以来最难的科学之一;思维的社会无统一的知识表示和理论基础。

    +   - Brooks：无需表示、无需推理的智能。

    +   - 反对派的核心观点：计算机只能解决形式化的问题，而客观世界的问题则是非形式化的，是变化无穷的。'
  merge: -1
  img_proc: true
