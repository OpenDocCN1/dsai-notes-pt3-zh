- pgno: 24
  md: '# Godel（1906-1978）美籍奥地利数理逻辑学家


    主要贡献：研究数理逻辑中一些带有根本性的问题，即形式系统的完备性和可判定性问题。


    1930年证明了一阶谓演算的完备性定理


    1931年证明了：

    第一条不完备性定理--任何包含初等数论的形式系统，如果它是协调的，那么一定是不完备的。

    第二条不完备性定理是：如果这种形式系统是协调的，那么这种协调性一定不能在本系统中得到证明。


    Godel的这两条定理彻底摧毁了Hilbert的建立无矛盾数学体系的纲领，对人工智能研究的意义在于，

    指出了把人的思维形式化和机械化的某种极限，

    在理论上证明了有些事情是做不到的'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# A·M·Turing（图灵）（1912-1954）英国天才数学家


    主要贡献：


    +   ✓ 1936年提出一种理想计算机的数学模型，后世称之为图灵机。

    +   现已公认，所有可计算函数都能用图灵机计算--为电子计算机出现建立了理论根据。


    +   ✓ 在二次大战期间为盟军设计破译密码的机器，为盟军的最后胜利立下了汗马功劳。


    1950年，提出了著名的 “Turing Test”


    如果机器能成功的伪装成人类欺骗观察者,就认为它具有了智能。


    Turing Test的重要意义：


    使实验研究智能行为成为可能


    1980,美国哲学家John searle 在其论文《心、大脑与程序》中提出Chinese Room Experiment


