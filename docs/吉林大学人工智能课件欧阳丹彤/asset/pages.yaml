- pgno: 192
  md: '+   - 实现一种取胜的策略就是搜索一个解图的问题，解图就代表一种完整的博弈策略。


    +   - 问题：对于简单的游戏，采用与寻找 AND / OR图解图相类似的技术是可以解决的。但是，对于复杂的游戏，这种方法是根本行不通的。


    中国象棋，每个势态有40种不同的走法，如果一盘棋双方平均走50步，则总节点数约为10^161个。要考虑完整的搜索策略，就是用亿次机来处理，花的时间也得比宇宙的年龄还长。'
