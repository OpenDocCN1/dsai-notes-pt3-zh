  md: '# 美国战斗机械狗(2008年9月)--由科幻梦想变现实


    这个形似机械狗的四足机器人被命名为“大狗”(Bigdog)，由波士顿动力学工程公司(Boston Dynamics)专门为美国军队研究设计。Boston Dynamics公司曾测试过BigDog，这只机器狗与真狗一般大小，它能够在战场上发挥重要作用:为士兵运送弹药、食物和其他物品。


    ![](img/6bab1e62411b30f795aa6fa92b5fb8cf_67_0.png)


    原理：由汽油机驱动的液压系统能够带动其有关节的四肢运动。陀螺仪和其他传感器帮助机载计算机规划每一步的运动。机器人依靠感觉来保持身体的平衡，如果有一条腿比预期更早地碰到了地面,计算机就会认为它可能踩到了岩石或是山坡,然后BigDog就会相应地调节自己的步伐。


    特点：行动迅速、反应灵敏、动力和智能自动化，且看上去坚固耐用。'
