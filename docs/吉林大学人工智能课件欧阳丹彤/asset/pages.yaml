- pgno: 109
  md: '# 单调限制的性质......定理7


    当算法A*选择n进行扩展时：

    设P中从n₀开始，串n₀，...，nₜ都在CLOSED表中，即nₜ是P中从左向右CLOSED表中的最后一个节点，且 nₜ ≠ n。此时，nₜ的后继节点nₜ₊₁在OPEN表中。


    因为P是从s到nₖ的最佳路，所以：

    g(nₜ₊₁) = g*(nₜ₊₁)'
