  md: '# 9 公式


    # 复合命题的抽象


    公式的形成规则--是如下定义的一个符号串：


    +   (1) 原子是公式；


    +   (2) F、T 是公式；


    +   (3) 若 G，H 是公式，则 (~ G)，(G ∨ H)，(G ∧ H)，(G → H)，(G ↔ H) 是公式；


    +   (4) 所有公式都是有限次使用 (1)，(2)，(3) 得到的符号串。'
