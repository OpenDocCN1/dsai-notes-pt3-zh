- pgno: 111
  md: '# 单调限制的性质......定理7


    因为t≤k−1，所以t<k


    利用传递性，我们得到


    g*(n_{t+1})+h(n_{t+1}) ≤ g*(n_{t+2})+h(n_{t+2}) ≤ ... ≤ g*(n_k)+h(n_k)


    而 g(n_{t+1}) = g*(n_{t+1})


    所以 f(n_{t+1}) ≤ g*(n_k)+h(n_k) = g*(n)+h(n)


    又已知 g*(n) ≤ g(n) （算法A的假设）'
