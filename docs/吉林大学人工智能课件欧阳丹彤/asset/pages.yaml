- pgno: 342
  md: '# 归结原理一般过程：


    +   1) 建立子句集 S。

    +   2) 如果 S 含空子句，则结束。

    +   3) 从子句集 S 出发, 仅对 S 的子句间使用归结推理规则。

    +   4) 如果得出空子句，则结束。

    +   5) 将所得归结式仍放入 S 中。

    +   6) 对新的子句集使用归结推理规则。转 4)。'
  merge: -1
