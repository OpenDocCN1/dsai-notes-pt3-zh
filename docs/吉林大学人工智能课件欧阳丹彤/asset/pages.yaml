- pgno: 263
  md: '# 12 谓词逻辑的判定问题


    +   - 谓词逻辑中公式恒真、恒假性的判断异常困难。

    +   原因：

    +   谓词逻辑中的恒真(恒假)公式，要求所有解释I都满足(矛盾)该公式。

    +   而解释I依赖于一个非空集合D。

    +   由于集合D可以是无穷集合，而集合D的“数目”也可能是无穷多个。

    +   因此，所谓公式的“所有”解释，实际上是无法考虑的。


    +   - 1936年Church和Turing分别独立地证明了：对于谓词逻辑，判定问题是不可解的。'
  merge: -1
  img_proc: true
- pgno: 264
  md: '● 谓词逻辑是半可判定的：

    如果谓词逻辑中的公式是恒真的，则有算法在有限步之内检验出这个公式的恒真性。如果该公式不是恒真的(当然也不是恒假的)，则无法在有限步内判定这个事实。'
  merge: -1
