  md: '思考：对于一个优秀的博弈者来说，应考虑的不只是对方一步的走法，而是若干步的走法。

    而且这一过程一般来说是动态进行的，也就是说，在考虑若干步走法以后，下了一步棋，而在对方走棋之后，还要再次考虑若干步走法，决定下一步的走法，而不是一劳永逸，搜索一次就决定了所有的走法。'
