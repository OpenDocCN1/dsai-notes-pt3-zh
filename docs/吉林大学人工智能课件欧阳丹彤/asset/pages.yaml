- pgno: 227
  md: '# 2 真值


    如果一个命题是真的，就说它的真值是T；


    如果一个命题是假的，就说它的真值是F。


    T和F统称为命题的真值。


    也用T代表一个抽象的真命题，用F代表一个抽象的假命题。'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# 3 联结词 ～、∨、∧、→、↔


    +   - 设P是一个命题，命题“P是不对的”称为P的否定，记以～P，读作非P。

    +     例.Q:张三是好人。～Q：张三不是好人。

    +     语义规定：～P是真的当且仅当P是假的。


    +   - 设P，Q是两个命题，命题“P或者Q”称为P，Q的析取，记以P∨Q，读作P析取Q。

    +     例.

    +       P：今天下雨，Q：今天刮风，

    +       P∨Q：今天下雨或者刮风。

    +     语义规定：P∨Q是真的当且仅当P,Q中至少有一个为真。'
  merge: -1
  img_proc: true
- pgno: 229
  md: '+   • 设P，Q是两个命题，命题 “P并且Q”称为P，Q的合取，记以P∧Q，读作P合取Q。

    +   例. P: 2×2=5，Q: 雪是黑的，

    +   P∧Q: 2×2=5并且雪是黑的。

    +   语义规定： P∧Q是真的当且仅当P和Q都是真的。


    +   • 设P，Q是两个命题，命题 “如果P，则Q”称为P蕴涵Q，记以P→Q。

    +   例. P: f(x)是可微的，

    +   Q: f(x)是连续的，

    +   P→Q: 若f(x)是可微的，则f(x)是连续的。

    +   语义规定： P→Q是假的当且仅当P是真的而Q是假的。'
  merge: -1
  img_proc: true
- pgno: 230
  md: '+   设P，Q是两个命题，命题 “P当且仅当Q”称为P等价Q，记以P↔Q。


    语义规定： P↔Q是真的当且仅当P，Q或者是都是真的，或者都是假的。


    例    P： a²+b²=a²，

    Q： b=0，

    P↔Q： a²+b²=a²当且仅当b=0。


    五种逻辑联结词的优先级按如下次序递增：


    ↔，→，∧，∨，～


    例. 符号串 P∧Q∨R→Q∧～S∨R


    意味着： ((P∧(Q∨R))→(Q∧((～S)∨R)))'
  merge: -1
  img_proc: true
