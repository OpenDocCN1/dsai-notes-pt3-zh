- pgno: 11
  md: '# 1、智能


    ![](img/6bab1e62411b30f795aa6fa92b5fb8cf_11_0.png)


    智能


    人类在认识和改造世界的活动中，由脑力劳动表现出来的能力。


    包括感知、理解、抽象、分析、推理、判断、学习和对变化环境的适应等等


    疑问：


    +   - 仅限于人？一般动物没有吗？

    +   - 为什么说猩猩一类动物比一般动物智力高？

    +   - 若只限于人，那么机器就更不能谈什么智能了，也就无人工智能可言了！


    所以，智能本身现在无法下精确的定义。'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# 1、智能


    +   - 基于计算机的智能

    +     如果一种行为或一系列行为能完成人类所做到的事，就说它是智能的。'
  merge: -1
