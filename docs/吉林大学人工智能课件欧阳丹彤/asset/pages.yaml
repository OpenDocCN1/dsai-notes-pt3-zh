- pgno: 93
  md: '# A*算法的可采纳性


    引理1 若A*不终止，OPEN表中节点的估价函数值可以无限变大。


    证明：设n是OPEN表中的任的一节点，d*(n)是隐含图中从s到n的最短路径的长度，e是图中每条弧的最小费用。


    于是有 g*(n)≥d*(n).e


    又 g(n)≥g*(n)≥d*(n).e ， f(n)= g(n)+h(n)， 且 h(n) ≥0


    因此 f(n)≥ g(n)≥ d*(n).e


    若A*不终止，OPEN表中节点的d*值会不断增大，因此 f值也会不断增大。'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# A*算法的可采纳性


    定理2 若存在s到目标的路，则算法A*终止前的任何时刻，OPEN表中总存在一个节点n’， n’在从s到目标的最佳路径上，且满足f(n’) ≤f*(s)


    证明：设P： n0,n1,……,nk是一条最佳解路径，其中， nk是目标点， n0=s.


    在A*结束之前，从左向右扫描序列P， n’是P中第一个在OPEN表中的节点


    (这样的n’是存在的：因为开始n0在OPEN上，算法结束前，若扩展ni，则ni+1在OPEN上，此时不可能扩展到nk)。


    由A*的定义，有f(n’)= g(n’)+ h(n’)'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# A*算法的可采纳性......定理2


    因为n’处在通往目标的最佳解路径上，设(n₀,n₁,……, n’)是s到n’的最佳解路径。n’的所有祖先都在CLOSED表上，所以(n₀,n₁,……, n’)是A*发现的一条通向n’的最佳解路径，g(n’)=
    g*(n’)


    由A*算法知：h(n’)≤h*(n’)，

    故 f(n’)≤g*(n’)+h*(n’)= f*(n’)

    而对最佳路上任意一点n，有：f*(n’)= f*(s)

    因此，f(n’)≤f*(s) 证毕。'
