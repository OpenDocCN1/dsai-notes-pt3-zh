- pgno: 29
  md: '# 早期发展


    +   机器定理证明


    1956年，Newell和Simon的Logic Theorist证明了《数学原理》第二章的38条定理，1963年全部52条定理。


    1958年，王浩在IBM704上实现了一个定理机器证明程序，以3-5分钟的时间证明了《数学原理》中220条全部命题演算定理和150条一阶逻辑定理中的85%，1959年用了8.4分钟证明了全部定理。


    1959年，Gelerner研制出了平面几何证明程序。


    1965年Robinson提出了归结方法，把人工智能的研究向前推进了一大步。'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 早期发展


    # 机器学习


    1956年，Samuel研制了跳棋程序，该程序具有学习功能，能够从棋谱中学习，也能在实践中总结经验，提高棋艺。1959年打败了设计者Samuel本人，1962年击败了美国一个州的冠军。


    # 模式识别与计算机视觉


    1956年，Selfridge研制出第一个字符识别程序，1959年他又推出了功能更强的模式识别程序。1965年，Roberts编制了可以分辨积木构造的程序，开创了计算机视觉的新领域。'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# 早期发展


    +   - 通用问题求解程序GPS


    1957年始，Newell, Shaw和Simon等人在Logic Theotist基础上，研究一种不依赖于具体领域的通用解题程序，持续了10年，最后版本发表于1969年。


    +   - 符号计算


    1963年，Slagle发表了符号积分程序SAINT，他使用了86个积分问题检查该程序，其中有54个问题是MIT微积分课程的考试题，结果程序解出了84个问题，SAINT的解题能力达到了大学生中优秀者的水平。


    1967年，Mosis又研制了一个符号积分程序SIN，能解更多更复杂的积分题目，效率比SAINT快3倍，解题能力达到同领域专家水平。


    +   - LISP表处理语言等'
  merge: -1
