  md: '# A*算法的比较......定理6


    当p(n)=0时，n=s。若s不是目标节点，这两个算法都必将扩展s。若s是目标节点，这两个算法都不必扩展任意节点（包括s）。


    假设p(n)≤k时，n被算法A₂扩展，n也被算法A₁所扩展。


    设p(n)=k+1，因节点n被A₂扩展，由于n的祖先点被A₂扩展，根据归纳假设，节点n的在A₂搜索树中的所有祖先都被算法A₁所扩展。'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# A*算法的比较 ......定理6


    因此，节点n在A₁的搜索树中，且在A₁的搜索树中存在一条从s到n的路。由于A₂搜索树中点n之前的树是A₁搜索中点n之前的树的子树，


    g₁(n) ≤ g₂(n)


    又因为h₁(n) < h₂(n)，所以f₁(n) < f₂(n).

    由于n被A₂扩展，由定理5知： f₂(n) ≤ f*(s)

    故f₁(n) < f₂(n) ≤ f*(s) .

    由推论知，点n必被A₁扩展，归纳完成。'
