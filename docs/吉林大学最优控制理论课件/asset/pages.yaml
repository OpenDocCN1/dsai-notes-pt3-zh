- pgno: 7
  md: '# §2.3 条件极值的变分问题


    问题：求泛函 $J = \int_{t_0}^{t_f} F(t,x(t),\dot{x}(t))dt$ 在约束条件


    $f(t,x,\dot{x}) = 0,\; f = [f_1,f_2,\cdots f_m]^T$


    求满足边界条件 $x(t_0)=x_0, x(t_f)=x_f$ 的极值。


    求解步骤：


    Step1:作系统 $J_0 = \int_{t_0}^{t_f} [F(t,x(t),\dot{x}(t)) + \lambda^T f(t,x(t),\dot{x}(t))]dt$


    其中向量子 $\lambda^T(t) = [\lambda_1(t),\lambda_2(t),\cdots \lambda_m(t)]$


    Step2: 解欧拉方程


    $H_x - \frac{d}{dt}H_{\dot{x}} = 0$


    其中 $H = F(t,x(t),\dot{x}(t)) + \lambda^T f(t,x(t),\dot{x}(t))$


    将欧拉方程与约束方程联立求解，可得 $x(t)$ 和 $\lambda(t)$，积分常数由边界条件确定。


    # §2.4 在一点处的变分


    积分中值定理：


    $f(x)$ 连续，$\varphi(x)$ 在 $[a,b]$ 上不变号且可积，则有 $\xi$ 满足


    $\int_a^b f(x)\varphi(x)dx = f(\xi)\int_a^b \varphi(x)dx,\; a \le \xi \le b$


    下面建立泛函 $J = \int_{t_0}^{t_f} F(t,x,\dot{x})dt$


    在一点 $\bar{t}$ 处的变分概念如下：


    设 $x = x(t)$ 与 $\bar{x} = \bar{x}(t)$ 都属于 $C^1[t_0,t_1]$，且 $\bar{x}(t) = x(t)
    + \delta x(t)$


    其中这样选取 $\delta(x)$：


    +   (1) $\delta(x) \in C^1[t_0,t_1]$


    +   (2) $\delta(x)$: 非零值 在 $\bar{t}$ 的零域 $(\bar{t}-\delta,\bar{t}+\delta)$ 之内

    +   0 在 $\bar{t}$ 的零域 $(\bar{t}-\delta,\bar{t}+\delta)$ 之外


    且 $\delta(x)$ 保持定号。'
