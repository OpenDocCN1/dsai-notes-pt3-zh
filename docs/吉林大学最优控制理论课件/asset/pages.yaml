  md: '记为


    δJ = L[y(x), δy(x)]


    也称为泛函的微分。


    # 引理 2.1 泛函 J[y(x)] 的变化


    δJ = ∂/∂α J[y(x) + αδy(x)]|α=0


    # 定理 2.1 若可微泛函 J[y(x)] 在 y₀(x) 上达到极小(大)值，则在 y = y₀(x) 上有


    δJ = 0


    例 求泛函


    J = ∫ₓ₀ˣ¹ F(x, y(x), ẏ(x)) dx


    的变分。


    δJ = ∂/∂α J[y(x) + αδy(x)]|α=0 = ∫ₓ₀ˣ¹ ∂/∂α F[x, y + αδy, ẏ + αδẏ]|α=0


    = ∫ₓ₀ˣ¹ [∂F(x,y,ẏ)/∂y δy + ∂F(x,y,ẏ)/∂ẏ δẏ] dx


    在上例中应用了宗量变分的导数等于导数变分的性质，即 (δẏ) = δẏ。


    # § 2.2 欧拉方程


    变分法上研究泛函极值的一种方法，为古典变分法。


    拉格朗日问题：求一容许函数 x(t)，使泛函


    J = ∫ₜ₀ᵗ¹ F(t, x(t), ẋ(t)) dt


    取最小值。


    下面利用泛函 J[x(t)] 达到极值的必要条件：δJ = 0，导出欧拉方程。


    # 引理：设连续函数 x = M(t) 对于任一具有下述性质的函数 η(t)


    (1)


    在 [t₀, t₁] 上，η(t) 连续


    (2)


    η(t₀) = η(t₁) = 0


    总有


    J = ∫ₜ₀ᵗ¹ M(t) η(t) dt ≡ 0


    则对于 t ∈ [t₀, t₁], M(t) = 0。


    # 定理：若最简单的泛函'
