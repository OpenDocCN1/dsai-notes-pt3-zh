    # § 5.2 最优性原理与递推方程


    定义起始段为 0 级（即第一段）第二段为第一级，余此类推，如图。


    最优性原理：一个多级决策问题的最优决策具有选择的性质，不管状态和初始决策如何，其余的决策对于由初始决策所形成的状态来说，必定是一个最优策略。


    问题 5.1　考查代价函数（或性能指标）


    \[

    J=\sum_{k=0}^{N}L(x(k),u(k),k)

    \]\hfill(5.2−1)


    其中过程的起始状态

    \[

    x(0)=x₀

    \]\hfill(5.2−2)


    给定。


    过程的动态方程为

    \[

    x(k+1)=f(x(k),u(k),k)

    \]\hfill(5.2−3)


    求容许决策（或控制）序列 {u(0)，u(1)，⋯，u(N)}

    \[

    u(k)∈U⊂R^r，k=0,1,⋯,N

    \]


    使代价函数（5.2−1）为最小。


    由（5.2−1）可知，代价函数 J 不仅是控制 u 的函数，也是初始状态 x(0) 的函数，

    →代价函数可表示为 J=J[x(0),u]


    始自任意状态 x(k) 的代价函数可记为

    \[

    J[x(k),u] \quad 其中 u={u(k)，u(k+1)，⋯，u(N)}

    \]'
