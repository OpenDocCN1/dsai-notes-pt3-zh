    σ = ∫_{t_i - δ}^{t_i + δ} [\bar{x}(t) - x(t)] dt = ∫_{t_i - δ}^{t_i + δ} δx dt


    设计的泛函增量


    ΔJ = J[\bar{x}(t)] - J[x(t)] = ∫_{t_i - δ}^{t_i + δ} [F(t, \bar{x}, \bar{\dot{x}})
    - F(t, x, \dot{x})] dt


    由二元函数泰勒中值定理可得：


    ΔJ = ∫_{t_i - δ}^{t_i + δ} [\bar{F}_x δx + \bar{F}_{\dot{x}} δ\dot{x}] dt = ∫_{t_i
    - δ}^{t_i + δ} [\bar{F}_x - d/dt \bar{F}_{\dot{x}}] δx dt = [\bar{F}_x - d/dt
    \bar{F}_{\dot{x}}]_{t = t_i} · ∫_{t_i - δ}^{t_i + δ} δx dt


