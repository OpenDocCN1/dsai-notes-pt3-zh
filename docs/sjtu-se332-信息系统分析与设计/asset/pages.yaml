- pgno: 534
  md: '# 在创建 “业务愿景” 视图时，有几个重要因素：


    +   - 公司使命 公司的最高目标。

    +   - 目标 更加具体的目标，并且在时间段内可量化。

    +   - 强项 业务的优势所在。

    +   - 弱点 业务中需要加以改进的方方面面。

    +   - 机会 业务未来的发展领域。

    +   - 威胁 对业务产生负面影响的外部因素(如竞争者、技术变化等)。

    +   - 关键要素 业务成功和发展的必备因素(如较短上市周期、对新技术的快速适应能力等等。

    +   - 策略 如果付诸实施就可以实现目标的行动计划。

    +   - 核心竞争力 业务中最为关键的部分。

    +   - 角色 业务中相关人员的特定功能。

    +   - 组织单元 业务分割而成的各个组群。

    +   - 关键过程 实现目标的关键步骤。'
  merge: -1
  img_proc: true
- pgno: 535
  md: '“业务愿景”视图最终得到的结果就是公司期望的状态定义，以及达到此状态的方法与策略。其结论以一个愿景陈述以及一个或者多个目标/问题模型进行表达。


    +   - **愿景陈述**是一个简短的文本描述，它表述了对公司未来若干年的“愿景”。是高层管理人员的职责。愿景陈述是愿景、目标、问题模型的表达形式，它表达了那些附加于业务之上的具体目标及其子目标的定义。

    +   - **目标/问题模型**作为一个正式的图表，将业务的主体目标划分为若干子目标，并标明为了实现这些目标所需解决的问题。将目标分解并对过程建模是业务架构或者业务过程建模师的职责，而高层管理人员在这里充当了模型支持者的角色，他们不断对雇员强调模型的重要性。'
  merge: -1
  img_proc: true
- pgno: 536
  md: '# （1）SWOT矩阵


    SWOT (SWOT “威胁”、“机遇”、“弱点”和“强项”)矩阵是用来对企业业务状态进行评估的技术。


    +   - 威胁和机遇是业务的外部属性，弱点和强项是业务的内部属性。

    +   - SWOT矩阵用作愿景陈述的编写依据，用文本描述了业务的未来。

    +   - 矩阵内部以各种策略进行填充以描述业务内外部属性之间的交互(如矩阵的一部分展示了如何充分利用内部力量和外部机遇，另一部分描述了如何处理与外部机遇交互的内部弱点)。

    +   - 矩阵中所提议的策略是更加正规化策略的基础。如果一个策略在矩阵中不同的地方反复出现，则表明此策略对于业务有着特别重大的意义，重复次数越多则表明越重要。'
  merge: -1
  img_proc: true
- pgno: 537
  md: '# Sample公司


    Sample公司是一家在Internet上营销并提供金融服务的公司。它使用Internet作为与客户交流的主要渠道。


    客户使用公司网站上提供的公告板自由讨论不同的股票信息并阅读股票市场的一些相关文章。网页上也显示了当前的股票市场价格，提供上市公司的相关简档，同时也提供了一些针对个人投资者的其他服务。


    公司充当在线股票经纪人的角色，使客户能够维护股票信息并通过Internet在市场上买卖股票。经纪人服务与其他的更高级服务一样，仅面向那些每月支付服务费的注册客户。其他的服务，例如公告板，对于访问者都是免费开放的。


    公司同样也将通过销售网页上的广告获取附加利润。广告客户根据网页的访问量支付一定的费用。'
  merge: -1
  img_proc: true
