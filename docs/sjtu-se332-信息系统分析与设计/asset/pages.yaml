- pgno: 49
  md: '针对ERP实施中的问题，荷兰BaaN公司提出了下一代ERP，即动态企业建模（Dynamic Enterprise Modeling, DEM）的思想，并有BAAN
    IV ORGWARE工具将DEM付诸实现


    # DEM在如下几个关键方面区别于通常的ERP：


    +   - DEM能进行高质量的设计（直观方式建模）；

    +   - DEM支持软件结构的重组（预定义的模型框架）；

    +   - DEM支持连续的业务过程改进（模型可自动转化成应用）；

    +   - DEM允许客户选择自己的界面和工作平台，并能很方便地与其他工作平台集成。（支持CORBA等方式集成）'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# DEM中体现了两个思想：


    +   - 一是在生成企业特定的模型时，充分利用最好的实例知识和实践经验，表现在基于企业参考模型来建立特定的企业模型；

    +   - 二是在适应市场而不断进行动态重组的企业中，企业的信息模型能快速适应应用环境、业务流程的变化。这表现在DEM的基于企业模型的快速信息系统实施方式。

    +   - 从软件工程的角度来讲，DEM的本质特征是通过是用动态的管理模型来建立一个具有适应性的企业信息系统。'
  merge: -1
  img_proc: true
