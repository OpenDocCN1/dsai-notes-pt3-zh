- pgno: 436
  md: '# MRP的逐层计算原则


    # MRP中的基本数量概念


    +   - 在MRP运算中，经常用到的基本数量概念包括描述库存信息的数量概念和描述需求信息的数量概念。

    +   - 描述库存信息的数量概念包括现有库存量、计划收到量、已分配量、安全库存量、可用库存量和预计库存量等。

    +   - 描述需求信息的数量概念包括总需求量、毛需求量、净需求量、计划产出量和计划投入量等。

    +   - 逐层计算原则是指MRP在计算物料需求时，应该采用自顶向下按照产品结构层次逐层计算物料需求量的方式。

    +   - 逐层计算原则是MRP工作原理的重要组成部分，它揭示了MRP计算物料需求量的基本过程形式，是理解MRP工作原理的基础。'
  merge: -1
  img_proc: true
- pgno: 437
