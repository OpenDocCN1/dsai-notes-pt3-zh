- pgno: 597
  md: '# 派生规则（2）计算规则


    +   计算规则与推理规则类似，区别在于前者更正式，看起来像一个算法。计算规则也是可以追溯到工作流中的某一活动中，最终表现为业务工作者和业务实体的操作。


    +   计算规则可以描述值的计算：


    +   产品的净价格可以这样计算 The net price of a Product IS COMPUTED AS FOLLOWS


    +   Product Price * (1+tax percentage/100).


    +   当你为订单生成一份帐单时，计算净价格可以成为发送订单的一部分。


    ![](img/9d75eecf8b59f35a7bd6d5d5336e2c43_597_0.png)'
  merge: -1
  img_proc: true
- pgno: 598
  md: '# 约束规则（1）


    # 激励反应规则


    +   - 该类别的规则影响业务用例中的工作流，并可以追溯到它们适用的业务用例中。你可以选择一个条件分支，或者可选分支。如果涉及的动作不明显，你可以将它作为一个活动状态的一部分。


    +   - 在业务对象模型中，该类别的规则可以影响如业务实体的生命周期，或者它可以称为业务工作者操作的描述的一部分。'
  merge: -1
  img_proc: true
