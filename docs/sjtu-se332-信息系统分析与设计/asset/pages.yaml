- pgno: 307
  md: '# 3 基于ARIS的多视图建模


    ARIS体系被分解成4个视图：数据视图、功能视图、组织视图和控制视图。


    +   - 功能视图定义了控制模型中的所有功能以及功能之间的层次关系。

    +   - 数据视图定义了过程中所用到的数据及数据间的关系。

    +   - 组织视图对人员分工、关系、位置和作用以及权限、义务等进行了描述，组织视图包含企业内部所有相关的职责信息。

    +   - 控制视图定义了任务的实现，包含了系统中各功能之间逻辑关系、因果关系、事件关系等。'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# 3.1 组织视图


    组织视图描述了公司任务操作者之间的静态关系,使用组织机构图(organizational chart )的方式描述组织单元、组织的分解关系、层次结构、隶属关系等。


    organizational chart基本元素除了组织单元外，还包括人员、职位、场所等图元，全面描述企业组织结构的各种信息。


    +   - Organizational units links the task performers with human performance of
    work.


    但是，ARIS的组织视图在实施描述阶段仅提供建立企业网络拓扑的信息，和组织建模是有一定的差异的。'
  merge: -1
  img_proc: true
