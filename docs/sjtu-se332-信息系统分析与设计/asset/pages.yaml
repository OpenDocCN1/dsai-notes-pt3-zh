- pgno: 497
  md: '# A1 信息编码方法


    +   - 信息分类编码是利用计算机辅助企业管理必要的条件。

    +   - 信息编码应遵循相应的信息分类方法。一般情况下，信息的分类在先，编码在后。

    +   - 编码的目的

    +     - 唯一化：为事物提供一个概要而不含糊的认定，便于数据的存储和检索。

    +     - 规范化：即编码要有规律，符合某一类事物的聚集，提高处理的效率和精度。

    +     - 系统化：也即标准化，符合国家或行业标准，提高数据全局一致性。'
  merge: -1
  img_proc: true
- pgno: 498
  md: '# 编码的种类


    顺序码


    以某种顺序形式编码。简单，易管理，但可识别性差


    助记码


    也叫混合码。比较常用，易记忆易管理，但不易校对。


    区间码


    以多区间代表多组，位置代表含义。可靠且易操作'
  merge: -1
  img_proc: true
- pgno: 499
  md: '# （一）顺序码


    +   顺序码又称系列码，它是一种用连续数字代表编码对象的码，例如：用1代表厂长，2代表科长，3代表科员，4代表生产工人等。


    +   顺序码的优点是短而简单，记录的定位方法简单，易于管理。但这种码没有逻辑基础，它本身不能说明任何信息的特征。


    +   此外，新加的编码只能列在最后，删除则造成空码。通常，顺序码作为其他码分类中细分类的一种补充手段。'
  merge: -1
  img_proc: true
- pgno: 500
  md: '# （二）助忆码


    助忆码用文字、数字或文字数字结合起来描述，其特点是，可以通过联想帮助记忆。


    例如，


    +   - 用TV-B-20代表20英时黑白电视机

    +   - 用TV-C-25代表25英时彩色电视机。


    +   - 助忆码适用于数据项数目较少的情况（一般少于50个），否则可能引起联想出错。此外，太长的助忆码占用计算机容量太多，也不适宜采用。'
  merge: -1
  img_proc: true
- pgno: 501
  md: '# （二）区间码


    +   区间码把数据项分成若干组，每一区间代表一个组，**码中数字的值和位置**都代表一定意义。典型的例子是邮政编码。


    +   区间码的优点是：信息处理比较可靠，排序、分类、检索等操作易于进行。但这种码的长度与它分类属性的数量有关，有时可能造成很长的码。在许多情况下，码有多余的数。同时，这种码的维护也比较困难。


    +   根据需要，也可在区位中某部分区别不同的块。如100-299表示企业管理人员，300-899表示生产人员，900-999表示专家或临时人员等。


    +   区间码又可分为多面码、上下关联区间码和十进位码三种。'
  merge: -1
  img_proc: true
- pgno: 502
  md: '# 1. 多面码


    一个数据项可能具有多方面的特性。如果在码的结构中，为这些特性各规定一个位置，就形成多面码。


    例如，对于机制螺钉，可作如下表那样的规定。编码2342表示材料为黄铜的Q1.5mm方形头镀铬螺钉。


    多面码示例


    | 材料 | 螺钉直径 | 螺钉头形状 | 表面处理 |

    |---|---|---|---|

    | 1—不锈钢 | 1-Q0.5 | 1—圆头 | 1—未处理 |

    | 2—黄铜 | 2-Q1.0 | 2—平头 | 2—镀铬 |

    | 3—钢 | 3-Q1.5 | 3—六角形状 | 3—镀锌 |

    |  |  | 4—方形头 | 4—上漆 |'
  merge: -1
  img_proc: true
- pgno: 503
  md: '# 2. 上下关联区间码


    上下关联区间码由几个意义上相互有关的区间码组成，其结构一般由左向右排列。


    例如，会计核算方面，用最左位代表核算种类，下一位代表会计核算项目。


    +   资产类——现金（101）

    +   ——人民币10101

    +   ——美元10102

    +   ——欧元10103


