- pgno: 600
  md: '# 约束规则（2）


    行为（操作）约束规则


    +   - 此类业务规则通常转化为工作流程的 “前置条件” 或 “后置条件”，或者转化为工作流程中的条件路径或备选路径。


    +   - 它可以是要达到的性能目标或某个应该追踪到应用该规则的业务用例的其他非行为性规则。'
  merge: -1
