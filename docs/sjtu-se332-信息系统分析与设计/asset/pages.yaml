- pgno: 28
  md: '# 企业建模的8大原则（1）


    +   分离的原则：由于企业模型较复杂，将整个企业考虑为一个整体进行研究显然是不合适的，因此，必须对每个功能逐个进行分析，如产品设计过程、主生产计划、制造系统。


    +   功能分解的原则：根据经营目标的方法，将企业功能逐层分解，逐步细化方法。


    +   分层的原则：在企业模型构筑的不同阶段，有不同的开发人员，在建模的过程中，必须有不同的模型，以不同的抽象程度，反映系统的不同侧面。


    +   一致性原则：需要各组件在语义及语法上保持一致，这是目前企业建模中最重要也最难以满足的要求。'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 企业建模的8大原则（2）


    +   - 模块化原则：有利于管理企业的变化，方便模型的维护。

    +   - 通用性原则：需要提高模型的通用化程度，通过定义构件、通用模块化等方法，将模型中的共性问题统一进行表示。


