- pgno: 219
  md: '# 资源的選択


    工作流中资源的选择过程


    是一个资源与工作项的比对过程；


    # （1）遵循工作流中的约束：


    +   - 任务上一般标记有对资源类别的要求

    +   - 资源被指定为若干类型

    +   - 其它约束: separation issues, case management.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# （2）工作项分配资源的模式：


    +   推模式：工作流引擎将资源“推”倒工作项。

    +   - 引擎把工作项和资源进行匹配，资源自身不能选择，一旦资源执行完一个活动，他就被分给一个新的工作项。


    +   拉模式：资源“拉”动工作项。

    +   - 资源主动考察能够执行的工作项，并从中选择一个。


    一般采取介于推动和拉动之间的方法，采用拉动原则，同时用工作流引擎生成的工作项次序作为辅助手段。'
  merge: -1
  img_proc: true
