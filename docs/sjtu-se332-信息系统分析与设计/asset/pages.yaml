- pgno: 171
  md: '# 2 过程定义


    工作流基本概念主要有：


    +   - 过程（Process）

    +     描述了案例的执行方式

    +   - 案例(Case)

    +     工作流处理的核心内容；

    +   - 任务（Task）

    +     工作的逻辑单元

    +   - 启动（Trigger）

    +     工作项执行的触发条件

    +   - 路由（Router）

    +     根据过程决定的任务执行的分支及次序'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# 2.1 过程 (Process)


    过程定义描述了所需的步骤和它们执行的顺序.


    （路由定义，步骤，工作流脚本）


    （销售订单，报税，保险赔偿申报）


    过程定义有以下组成：


    +   - 任务（步骤，活动，过程元素）

    +     任务是原子的：提交或者回滚.


    +   - 条件（状态，阶段，需求）

    +     条件被用于确定某一任务是否可以被激活.


    +   - 子过程

    +     过程的分解'
  merge: -1
  img_proc: true
- pgno: 173
  md: '+   - 过程可能有多个子过程构成，每个子过程又由其他的任务、条件以及可能更细致的子过程组成。

    +   - 案例的执行方式由相关过程来描述，可以把过程看作是某种案例类型的程序；

    +   - 过程定义了案例的生命周期，因此每个过程都有开始和结束，用来标识案例的出现和完成；'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# 2.2案例


    案例是依据过程定义所需要完成的具体事情


    （被称为：过程实例，工作，项目）


    （例如：销售订单，报税，保险赔偿申报）


    案例的状态由下列方面决定：


    +   - 实例变量（实例的参数）

    +     实例的逻辑参数，被用于实例过程的路由。

    +   - 条件

    +     被满足的需求

    +   - 内容(应用数据)

    +     可能由其它系统管理'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# 案例 (Case)


    +   有限的生命周期，对应一个工作流的开始和结束；


    +   案例在某生命周期内的某个状态，有三个元素：

    +   - 相关属性的值； 可随案例进展而发生变化；

    +   - 已经满足的条件； 说明案例进展；

    +   - 案例的内容； 工作流系统通常不保存案例内容和细节；'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# 2.3 任务


    一般的逻辑工作单元，而不是过程实例的一次执行；


    +   - 工作的逻辑单元，不可分割且必须完整执行；

    +   - 任务被分为：

    +     - 手动的任务 (manual)；

    +     - 自动的任务 (automatic)；

    +     - 半自动的任务 (semi-automatic)


    注意下面的概念的区别：


    +   - 任务 A logical step which may be executed for many cases.

    +   - 工作项 = task + case

    +     A logical step which may be executed for a specific case.

    +   - 活动 = task + case + (resource) + (trigger)

    +     The actual execution of a task for a specific case.

    +     工作项和活动是任务的实例'
  merge: -1
  img_proc: true
