- pgno: 564
  md: '+   - 泳道用于描述活动在业务组织在哪里执行。

    +   - 除了机构组织之外，泳道同样可以展示对象属于哪个活动或者过程。例如，它可以表示哪台机器或者负责特定活动的人员这些过程的执行跨越了多个组织单元。

    +   - 在UML规格说明中泳道应该位于垂直方向，但是在绘制大型过程图时，水平绘制可能更加实际一些。泳道使图表可以表示出过程之间的整合或者过程如何在若干组织之间划分。

    +   - 通过展示过程中的输入和相关对象，可以展现过程的输出对象如何用作另外一个过程的输入对象或者供给对象。

    +   - 结合泳道的过程图可以展示出活动的输入和输出对象以及活动正在由哪个对象所执行。'
