  md: '# 2.3 Rules


    +   • Rule1: An EPC model has to start with an event;

    +   • Rule2: An EPC model has to end with an event;

    +   • Rule3: Functions and Events should be alternated;

    +   • Rule4: When connecting functions and events, such nodes can only have one
    input and one output;

    +   • Rule5: An Event is a passive element that does not have any decision competency!

    +     • This rule primarily affects the usage of logical operators and the connection
