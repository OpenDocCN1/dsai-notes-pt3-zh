- pgno: 19
  md: '# 方法体系


    # （1）基于功能活动的建模方法


    以基于功能的建模方法为主导，SADT，IDEF为代表的功能分解法成为90年代企业建模的主要方法。


    存在的主要问题：


    +   - 由于功能分解法的基本组件仅有一个，因此该方法虽然有非常好的通用性，但缺乏丰富的语言描述能力。\n- 功能分解法的严格的递阶关系很容易导致企业的组织结构，而且在不同的组织单元间造成交流障碍。形成新的自动化孤岛。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# （2）基于过程的建模方法


    过程定义成为一组活动的偏序集，过程与子过程间形成递阶关系。活动间有一定顺序、活动的执行有时时间触发。


    可以将基于过程的控制流、物料流和信息流有效的集成。


    面向过程的建模方法有还可以进一步按照基本要素划分：


    +   （1）基于数据的业务流程建模

    +     - 以数据流图为主，将活动按照数据流向连接。


    +   （2）基于活动的业务流程建模。

    +     - 以活动图为主，将业务活动通过时序关系连接。


    +   （3）基于事件的业务流程建模。

    +     - 以EPC为主，将业务活动通过事件连接。


    +   （4）基于状态的业务流程建模。

    +     - 以PetriNet主，将业务活动通过状态事件连接。'
  merge: -1
  img_proc: true
