- pgno: 168
  md: '# 1 基于Petri网的工作流建模


    工作流从单个案例的动态行为出发，对流程进行控制，工作流即流程的自动化执行，工作流控制是流程自动化运行的关键。


    基于Petri网的工作流建模由以下三部分构成：


    +   - 过程定义：

    +     对过程的描述，建立包括活动执行次序的过程模板。

    +   - 资源分类：

    +     对所使用的资源进行分类，建立信息及人员的结构模型

    +   - 资源分配及管理规则：

    +     实现资源到工作的映射，构造实际工作流'
  merge: -1
  img_proc: true
