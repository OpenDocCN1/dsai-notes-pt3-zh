- pgno: 546
  md: '# 目标


    目标描述了一项或者更多资源期望的某种状态。


    +   - 目标可以针对整个业务，也可以针对独立的业务过程。\n- 目标以标志着某种优化和改进的形式进行规定，如增加产出、提高质量或者缩短产品上市时间，所有这些过程、资源和规则所取得的成效使得目标得以实现。


    业务可以有一个总体的远景规划或目标，目标层次越深入，相应的目标就越具体越量化。目标越具体越量化，就越容易判断目标是否实现。'
  merge: -1
  img_proc: true
- pgno: 547
  md: '+   - 一个目标可以被分解为若干子目标。较高层次目标的实现依赖于各个子目标的实现。

    +   - 子目标同时也可以对其他由于某些原因导致实现失败或未能实现的子目标进行替换或补充。

    +     - 例如，如果高层目标是“增加15%的利润”，并且三个关于利润增加的子目标中有两个得以实现，即使另外一个没能带来任何利润增加，那么高层目标也可以达成。这两个子目标的成功实现弥补了另外一个子目标实现中的失败。

    +   - 将目标分解为子目标的过程称为**目标建模**。目标分解的依据取决于建模者的判断。

    +     - 例如，销售目标可以按不同的过程或者不同的产品线（或者也可以是两者的组合）将其分割为若干个子目标。'
  merge: -1
  img_proc: true
- pgno: 548
  md: '# 目标总是与各种问题紧密相连。


    因为问题就是实现目标途中的障碍。问题可以是目标实现途中的紧急状况，也可以是阻碍目标实现的对象实体。


    因此，通常在目标建模的同时也对其附带的一些问题进行建模。通过目标与问题这两个概念的同时使用，可以更简单地对目标进行描述。


    +   - 例如，当描述一个目标的时候，有人会问"实现这个目标会遇到那些问题或者障碍"，而又有人会问 "如果这个问题得到触决，我们可以实现怎样的目标？"


    通过定义这些问题，子目标也得以确定，同时也将避免这些问题的出现。此时子目标就可应用于业务过程以排除实现过程中的障碍。'
  merge: -1
  img_proc: true
- pgno: 549
  md: '# UML中描述目标和问题：


    +   - Eriksson Penker业务扩展中的解决方案是将目标以对象的形式进行展现，同时使用一个对象图以展示目标和子目标之间的依存关系。

    +   - 目标对象以一个被构造为Goal的目标类的目标对象表示在Eriksson-Penker业务扩展中，有两个预定义的目标类：

    +   - 定性目标(Qualitative Goal)和定量目标（Quantitative Goal），它们都属于构造型Goal。

    +   - 一个定量目标可以用一个指定计量单位的目标值进行描述(定量)，而定性目标则以一个相对宽松的形式描述，并没有一个特定的目标值(定性)。


    +   • 必须有一个过程对目标是否实现进行判定。可是，当使用定性目标的时候，相对一个特定的数值而言，过程更加依赖于人为的判断。'
  merge: -1
  img_proc: true
- pgno: 550
  md: '问题以构造为Problem的注解表示，同时附加文本描述。注解被附加在问题所关联的目标之上。


    # 目标、子目标和问题


    +   - 问题“销售人力不足”进一步指明了一个子目标“加强销售队伍的建设”。

    +   - 当目标及其子目标之间的依赖关系完整无缺时，所有子目标的实现必定保证此目标的实现。

    +   - 如果关系不完整，所有子目标的完成也无法保证高层目标得以实现。


    ![](img/9d75eecf8b59f35a7bd6d5d5336e2c43_550_0.png)'
  merge: -1
  img_proc: true
- pgno: 551
  md: '+   - 规则普遍应用在所有的视图之中，同时也可以与其他规则相连接，因此必须小心避免不同视图中的规则产生冲突。

    +   - 通过定义约束的泛化形式，许多UML图都对规则定义提供了内置的支持。

    +     - 类图中的关系中包含了结构性约束（如关联的多重性）。

    +     - 状态图的状态和状态变换中包含了行为约束（如当一个状态发生变换时执行的相应动作）。

    +     - 派生规则可以被定义为UML图的一个补充约束（如当一个属性的值是由另外一些属性的值通过计算得到）。

    +     - 活动图中的活动流中包含了行为约束（如某个活动必须在某个活动之前执行）。

    +   - UML中的约束是以紧贴被约束模型元素放置的符号所包围的内容表示。'
  merge: -1
  img_proc: true
