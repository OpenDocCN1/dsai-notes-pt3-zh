- pgno: 159
  md: '+   - 其中AGV小车在收到输送请求及空闲AGV的token为1时才触发，并在衔接区取货,且同时向空闲堆垛机输出一个token，在堆垛机取货后,AGV空车返回空闲处等待。

    +   - 同样，堆垛机在载货行走至货位、堆垛后返回原处。

    +   - 在分拣区,可依所需的包装数量进行设置其token、转移的容量。此时设置的转移的容量均为50。

    +   - 空托盘的清理按定量方式进行,例如,其容量定为50个token，即50个托盘作一次处理，处理后在托盘堆放区增加一个token。'
  merge: -1
  img_proc: true
- pgno: 160
  md: '+   - 在仿真运行到20 m in 左右时，入库台的容量达到饱和。入库台不再按设置的延迟时间每隔30s收10个token的货物，而是在相差大约15个token的货物时，自动传递10个token。

    +   - 当仿真运行到25 m in 12 s时，入库台的token数为192个，散放空托盘积累了30个，空托盘堆放区已有9堆（每堆是50个），出库货物为450个token的量；

    +   - 当仿真运行到50 m in36 s的时候，入库台的token数为187个，没有散放的空托盘，空托盘堆放区已有20堆，出库货物为950个托盘的量。'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# 仿真结果


    +   - 基于Petri 网的物流系统仿真能够清楚地展现在逻辑时序下整个仓储系统的工作流程及系统特性。

    +   - 从仿真结果数据来看，入库量与出库量持平，系统运行良好。

    +   - 然而，用Petri 网仿真，只能模拟得出流程关系，而难以模拟出其平面关系，因此，它的直接表现性还很不够。'
  merge: -1
