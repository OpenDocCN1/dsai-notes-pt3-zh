- pgno: 405
  md: '# （4）工作中心/设备


    工作中心（Working Center,简称WC）是生产加工单元的统称，在完成一项加工任务时同时也发生了加工成本。它是由一台或几台功能相同的设备，一个或多个工作人员，一个小组。


    关键工作中心（Critical Work Center），有时也称为瓶颈工序（bottleneck），是运行粗能力计划的计算对象。


    特点：


    +   - （1）经常满负荷，加班加点工作；

    +   - （2）需要技术熟练工人操作，不能任意替代；

    +   - （3）工艺独特的专用设备，不能替代或分包外协；

    +   - （4）价格昂贵的设备，不能随时增加；

    +   - （5）受多种限制，如短期内不能随便增加负荷和产量（通常受场地、成本等约束）'
  merge: -1
  img_proc: true
