- pgno: 581
  md: '# （2）信息建模


    +   - 信息建模为业务中具有战略意义的重要信息建立相应的模型。尽管信息同样也是资源的一种，但将它从其他资源中分离出来并为其建立独立的模型仍然是非常有意义的。

    +   - 信息在信息系统中对业务进行支持，它对业务具有重要的战略价值。

    +   - 信息建模是定义信息系统中存储信息的早期步骤，尽管一些细节如数据库设计问题应该是业务模型的一部分，这样的细节信息将在软件信息系统建模过程中加以定义。

    +   - 业务决定了信息需求，但有时一些有效的信息也会反作用于业务，例如，业务可以为自身创造新的商机、业务可以捕捉到更多的客户信息、业务对其产品和服务的改造和配置可以具有更大的灵活性。'
  merge: -1
  img_proc: true
