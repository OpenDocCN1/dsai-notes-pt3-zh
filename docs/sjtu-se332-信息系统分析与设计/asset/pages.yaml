- pgno: 110
  md: '# Petri网的行为特性小结


    +   - 一个转移点火的规则是，如果一个转移的每个输入库所（input place）都拥有托肯，该转移即为被允许(enable)。点火时，输入库所(input
    place)的托肯被消耗，同时为输出库所(output place)产生托肯。

    +   - 转移的发生是完整的，也就是说，没有一个转移只发生了一半的可能性。

    +   - 如网络中有两个或多个转移都被允许的可能，这种情况下转移发生的顺序没有定义，可认为是并发的。

    +   - 一个转移出现其输入库所的个数与输出库所的个数不相等时，托肯的个数将发生变化，也就是说，托肯数目不守恒。

    +   - Petri网络是静态的，也就是说，网络拓扑结构是静态的，不存在发生了一个转移之后忽然冒出另一个转移或者库所，从而改变Petri网结构可能。

    +   - 两个变迁争夺一个托肯的情形被称之为冲突。当发生冲突的时候，由于Petri网的时序是不确定的，因此具体哪个变迁得以发生也是不确定的。

    +   - Petri网的状态由托肯在库所的分布决定。也就是说，转移发生完毕、下一个转移等待发生的时候才有确定的状态，正在发生转移的时候是没有一个确定的状态的。'
  merge: -1
  img_proc: true
