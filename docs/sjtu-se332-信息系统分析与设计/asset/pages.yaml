- pgno: 237
  md: '# 模型检测


    # 工作流模型的一些常见检测，主要包括：


    +   - 死锁检测（Deadlock）：通过深度/广度优先搜寻算法重复探索未到达的状态，直到发现死锁；

    +   - 活锁检测（Live lock）：检验模型中是否存在一直在某些状态中循环转移而无法到达其他可用状态的情况。

    +   - 确定性检测（Deterministic）：检测模型最后是否会到达一个唯一的最终状态。若进程最终会指向一个唯一的状态，则称该进程是确定的；

    +   - 无终止检测（Nonterminating）：检测过程是否会终止。

    +   - 可达性检测（Reachability）：检测过程是否可以到达某个特定的状态。

    +   - 线性时序逻辑检测（Linear Temporal Logic：LTL）：检测过程是否符合给出的线性时序逻辑的公式。

    +   - 精化检测（Refinement/ Equivalence）：精化检测是两个过程之间的比较，可用于对两个过程模型的一致性检测。'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# 5.3 性能分析


    工作流的性能反映了工作流定量方面的特性。


    工作流不能正常工作的典型征兆：


    +   - 过程中的案例过多；

    +   - 实际处理时间过长；

    +   - 服务水平低'
  merge: -1
