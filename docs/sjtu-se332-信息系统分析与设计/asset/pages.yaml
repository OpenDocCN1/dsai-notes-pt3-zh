- pgno: 73
  md: '# TFD 和 DFD的关系


    +   - TFD 和 DFD 都是描述业务数据处理过程的图形工具。

    +   - TFD 强调业务过程中每一项处理活动和具体业务部门的关系。而 DFD 更注重描述业务内数据间的关系及业务的“系统”特征，标识业务通过外部实体与其环境交换信息。

    +   - 从使用者的角度来看，用 TFD 描述企业各项业务的数据处理过程更容易与用户进行交流。DFD 较 TFD 抽象，描述的是业务处理过程的数据处理模式，但难于描述系统的控制流。'
  merge: -1
  img_proc: true
- pgno: 74
