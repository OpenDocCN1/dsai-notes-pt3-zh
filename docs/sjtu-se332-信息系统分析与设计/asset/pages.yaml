- pgno: 480
  md: '# 5 供应链管理


    供应链是在相互关联的部门或业务伙伴之间所发生的物流、资金流和信息流，覆盖从产品（或服务）设计、原材料采购、到交付给最终消费者的全过程。


    供应链不仅仅面向制造企业，服务性行业也存在供应链。


    供应链管理指借助信息技术和电子商务，将供应链上业务伙伴的业务流程相互集成，从而有效地管理从原材料采购、产品制造、分销、到交付给最终消费者的全过程，在提高客户满意度的同时，降低成本、提高企业的效益。


    +   - 供应链中的信息畸变（长尾效应）

    +   - 基于供应链的存货管理

    +   - 供应链管理的实践举例

    +   - 案例研究：自动补货系统

    +   - 供应链管理的效益'
  merge: -1
  img_proc: true
