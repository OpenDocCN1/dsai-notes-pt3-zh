- pgno: 62
  md: '# 泳道视图


    ![](img/9d75eecf8b59f35a7bd6d5d5336e2c43_62_0.png)


    ![](img/9d75eecf8b59f35a7bd6d5d5336e2c43_62_1.png)


    它将流程图结构化的放置在一系列水平或竖直的泳道中，每个泳道代表活动由某个特定的角色执行。


    比方说，第一个泳道表示活动由客户执行，第二个泳道表示活动由客户服务代表执行，等等。


    改变泳道的模式通常会起到不错的效果。


    我们可能会想用泳道来表示组织而不是角色。


