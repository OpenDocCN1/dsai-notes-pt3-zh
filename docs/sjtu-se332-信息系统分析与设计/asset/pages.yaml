- pgno: 316
  md: "# 3.2 功能视图\n\nARIS功能视图的主要形式是以功能树形式描述企业功能分解的层次关系的配置图。与IDEF0不同的是，ARIS功能视图不描述功能模块间的输入、输出、控制和支撑关系。\n\
