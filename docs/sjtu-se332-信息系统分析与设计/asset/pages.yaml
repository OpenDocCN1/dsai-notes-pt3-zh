- pgno: 412
  md: '# 2 库存管理


    库存管理是企业生产过程的重要组成部分，是企业物料管理的核心，是指企业为了生产、销售等经营管理需要而对计划存储、流通的有关物品进行相应的管理，如对存储的物品进行接收、发放、存储保管等一系列的管理活动。


    库存管理的对象是企业中的所有物料，包括原材料、零部件、在制品、半成品及产品，以及其他辅助物料。


