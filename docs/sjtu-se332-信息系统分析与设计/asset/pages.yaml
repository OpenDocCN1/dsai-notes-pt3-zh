- pgno: 61
  md: "# 端对端视图\n\n+   - 端对端关注客户需求实现的全过程，实现真正的客户导向。\n+   - 需要查看完整意义上的所有基本活动，而不是子流程。\n\
    +   - 需要显示流程端对端的流。  \n+     - 比如：一个流程由7个子流程组成，每个子流程包括6个活动。  \n+     - 因此，端对端视图将显示42个活动。"
