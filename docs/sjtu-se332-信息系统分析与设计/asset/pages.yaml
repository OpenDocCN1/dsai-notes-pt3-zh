- pgno: 26
  md: '# 企业业务建模的基本原则


    企业业务模型具有分层次、多视角、复杂相关性等特点，建模更需要遵循一定原则！


    根据Ross的提法，任何建模技术都具有以下基本原则：


    +   - 定义模型的目的：建模是为了什么。

    +   - 定义模型的范围：说明模型覆盖的领域和范围。

    +   - 定义模型的视角：从现实世界哪些方面的特征，有哪些特性被忽略。

    +   - 定义模型的粒度：模型的精度和模型的细致程度颗粒度。'
  merge: -1
  img_proc: true
