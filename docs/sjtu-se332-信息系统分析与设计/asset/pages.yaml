- pgno: 56
  md: '# 3.1 流程建模基础


    建立流程模型通过多种不同的方式展开，主要可归纳为几大类方法：


    +   - 自顶向下 vs. 自底向上

    +   - 集中式 vs. 分布式

    +   - 自由式的 vs. 结构化的'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# 自顶向下


    自顶向下的发现方法是从大型的流程开始，将它们划分为规模较小的流程。


    +   - 比如说，我们可以从一个 “Order to Cash” 流程开始，将它分解成多个小的流程，比如说管理客户合同，输入订单，处理订单，给客户发送账单，收款。以上的每一个流程依旧是较大的流程，所以我们可以对它们进行进一步的分解。


    # 这样，我们可以获得流程的层次结构


    最终，我们将一个流程分解到活动的层次，去执行简单的不可再分的活动。


    # 优缺点：


    +   - 这个方法的主要好处是它确保了范围的广度。

    +   - 缺点就是我们可能会漏掉一些细节。自顶向下的方法无法考虑到那些不知道其存在性的活动和流程。可能会因此停止在不准确的地方，或者漏掉一些步骤。'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# 自底向上


    自底向上的方法开始于现有流程，将所做的工作的局部信息收集起来，组装到一个流程的上下文中。


    # 优缺点：


    +   - 自底向上方法的一个主要优点是包含丰富的细节。

    +   - 方法缺点在于如何判定了解了足够多的流程，因而完整性是一个问题。

    +   - 另外，如何从所有的局部信息中创建一个流程的上下文，关联性可能丢失，这实际上就是一个把所有细节放进一个可被理解的流程集合的任务。'
  merge: -1
  img_proc: true
