- pgno: 178
  md: '# 2.4 触发条件（Trigger）


    在现实中，系统不能强迫事情发生：


    +   - 为了执行任务，需要EDI消息的到达。

    +   - 执行某一实例的任务所需要的资源。

    +   - 纸面文件的到达。

    +   - 确认购买订单的电话


    是一个响应式系统，也就是说它被环境触发


    某些任务需要触发条件


    Trigger是工作项执行的触发条件；'
  merge: -1
  img_proc: true
