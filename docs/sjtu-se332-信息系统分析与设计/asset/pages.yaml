  md: "+   - 所有这些动作都已经以子目标的形式建模。图中的目标/问题图表仅仅展示了此业务的主要目标之一。其余的目标则拥有各自的图表。\n+   - 业务的各个主要目标可以在一个图表中加以总结，而此图表中也表现了目标之间的冲突(互斥目标)。\n\
    +   - 每个主要目标则可以通过自身的对应图表，结合相应的子目标进行描述。  \n+     - 例如吸引大量客户的目标可能就与从广告中获取利润的目标相冲突，如果网站上的广告内容过多，那么访问者就会产生反感而不访问这些网页。"
  merge: -1
  img_proc: true
- pgno: 557
  md: '# 2.2 业务过程视图


    “业务过程”视图是业务建模的核心内容。


    +   - 过程展示了那些为了达成目的而必须采取的活动及其在过程中涉及的资源之间的关系。

    +   - 资源包括人员、原料、能源、信息和技术，资源可以在过程中被消费、提炼、创建或者使用。


    过程及其资源之间，以及不同的过程之间都存在这相互作用，同时多个过程进行耦合以实现预定目标。各个过程都有目的和特定目标，而所有过程的共同努力达成了业务的总体目标。


    在“业务愿景”视图中所陈述的业务目标是过程建模的基础。现有的过程描述将作为建立新模型的基础。


    过程建模者协助业务架构师创建业务过程模型。'
  merge: -1
  img_proc: true
- pgno: 558
  md: '# 业务过程建模时定义以下内容是很必要的：


    +   - **哪些活动是需要的？** 在过程图中以过程或者活动的形式说明。

    +   - **活动什么时候得以执行、以怎样的顺序执行？** 在过程图中通过控制流进行说明。

    +   - **过程的目标是什么？** 过程图中，通过附加目标对象以及一个将此目标与其他目标相关联的目标图进行说明。

    +   - **活动如何执行？** 在过程图中，常常通过将过程分解为进一步对活动细节进行描述的子过程来进行说明。

    +   - **活动执行过程中涉及到哪些人和物？** 这里引用了参与过程的各种资源。

    +   - **消耗了什么、产出了什么？** 这里引用了过程中的所消耗或者产出的资源。

    +   - **活动必须如何执行？** 通过过程图中的控制流或者通过业务规则进行定义。

    +   - **谁将控制这个过程？** 这里引用了过程所有者，也就是那些运营业务或者负责业务顺利运行的人。

    +   - **过程如何与业务组织相关联？** 在过程图中可以通过泳道的使用进行展示。

    +   - **过程如何与其他业务相关联？** 这可以通过“行为视图”部分中所讲述的交互建模进行展示。'
  merge: -1
  img_proc: true
- pgno: 559
  md: '# （1）过程图


    过程图是附加了一系列构造型的UML活动图，


    +   - 描述了过程中所执行的活动以及这些活动之间的交互关系、输入输出对象、过程中的资源供给和


    ![](img/9d75eecf8b59f35a7bd6d5d5336e2c43_559_0.png)'
  merge: -1
  img_proc: true
- pgno: 560
  md: '# 过程图涉及的资源和目标对象分别是：


    +   - **目标对象** 目标/问题图中被分配给过程的目标对象。目标对象绘制于过程图之上，并通过构造型为<<achieve>>的依赖关系将过程和目标相连，连接方向为由过程到目标(说明过程要努力实现此目标)。

    +   - **输入对象** 过程中消耗的或者加工的各种对象。输入对象是各种资源，同样也可以被构造为<<physical>>、<<abstract>>、<<people>>或者<<information>>。它们以一条虚线连接到过程(即输入对象在活动图中的标记)，输入对象通常放置于过程的左侧。

    +   - **输出对象** 过程产出的对象或者由一个或者多个输入对象经过加工得到的输出对象。输出对象同样也是资源，它们在自过程到输出对象的方向上通过虚线与过程相连接。输出对象被放置于过程的右侧。

    +   - **供给对象** 过程中那些并没有被消耗或者改变的资源。在过程的下方，这些对象以依赖关系(一条虚线)连接到相应的过程。这里的依赖关系被构造为<<supply>>。

    +   - **控制对象** 控制或者运行过程的资源。此类对象通常绘制于过程的上方，通过一条虚线连接到过程。这里的依赖关系的构造型为<<control>>。'
  merge: -1
  img_proc: true
