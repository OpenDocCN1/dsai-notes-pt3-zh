- pgno: 47
  md: '# 理想企业建模框架应该具备的特性：


    +   - 具有“具体化过程”，即模型抽象层次这一维度；

    +   - 业务要素的覆盖性，应包括流程、信息、功能、组织等；

    +   - 框架应划分视图，具有层次结构，满足不同层次的建模需要，覆盖企业中的所有重要业务对象；

    +   - 视图之间具有较强的集成性；

    +   - 业务框架要贯穿企业整个生命周期；

    +   - 具有开放性,能够持续治理；

    +   - 具有建模工具的支持和建模流程模型的指导,具有可操作性'
