- pgno: 513
  md: '# # 1 UML的业务建模扩展


    业务建模的目的就是为了建立企业核心业务功能的描述。从而更好地理解业务的关键机制、改进业务、确定新的业务机会、明确外购需求等。


    对于企业，将所有的信息系统都建立在一个基础业务模型之上，有以下几方面的好处：


    +   - 为了更好地了解现有业务的关键机制。

    +   - 信息系统自然成为总体业务的一个内在组成部分，为企业提供业务支持基础并提高工作的效率。

    +   - 系统之间易于整合，便于信息的交换和共享。

    +   - 系统更易于随着业务模型的变更进行相应的升级及修改，这些变更可能来自周围环境变化、业务目标或者业务的改进和革新。这大大减少了信息系统维护和业务过程持续更新的成本。

    +   - 业务逻辑可以在多个系统之间复用。

    +   - ……'
  merge: -1
  img_proc: true
- pgno: 514
  md: '# 业务模型的风格差距很大...


    +   - 业务模型永远不可能完全精确或完整，对于相同的业务，不同的人有不同看法，没有一个所谓的完全精确的模型能同时得到大家的一致认同。

    +   - 一个试图覆盖所有细节的模型，将会面临自身与所描述业务本身同样复杂和难以理解的风险。

    +   - 由于建模语言以及建模概念本身的局限，也并不是每个细微之处都能够被捕捉到。


    +   - 模型应该主要集中表现业务的核心任务及其关键机制。

    +   - 模型构建者的职责就是洞悉业务核心任务并确定模型内容。'
  merge: -1
  img_proc: true
- pgno: 515
  md: '# 业务模型一般由以下几部分组成：


    视图：一个业务模型由多个不同的视图表示，每个视图专注于表示业务一个或者多个特定属性。视图是一个特定观点的抽象描述，同时忽略与此无关的诸多细节。


    图表（模型）：每个视图都由数个图表组成，每个图表都表达了业务结构的特定部分或者特定的业务状态。引入多个图表对于将业务模型可视化是非常必要的，因为每种类型的图表都有不同的目的，表达了业务模型视图的不同方面或机制。一个图表可以表达一个结构或者一些动态的协作。这些图表包含并表述了业务状态中的对象、过程、规则、目标和愿景。


    对象和过程：通过使用不同的对象和过程，图表中不同概念相互关联起来。


    +   - 对象就是业务中的“事物”；它们可能是物理存在的，如人、机器、产品、原料，或者更加抽象，如债务、指示和服务。对象也可以通过包含业务中其他内容的相关信息来描述其他对象。

    +   - 过程是业务中的活动，这些活动消费、提炼或者使用某些对象去影响或者生产其他对象。'
  merge: -1
  img_proc: true
- pgno: 516
  md: '# 用来定义业务系统的概念有：


    +   - **资源** 业务中的对象，如人、原料、信息和产品，这些业务中使用的或者产出的东西。资源放置在各个结构之中并彼此关联，资源在业务中使用的或者产出。资源可以分类为物理、抽象和信息形式。

    +   - **过程** 业务资源状态变化过程中所执行的活动。过程描述了业务中的操作如何完成，受规则的支配。

    +   - **目标** 业务的目标，或者业务要实现的整体目标。目标可以被分解为子目标并分派给业务的各个部分，如过程和对象。目标表达了资源的期望状态，这些状态通过各个过程的运作实现，可以以一个或者多个规则表达。

    +   - **规则** 对业务的某些方面进行定义或者约束，并表现业务知识。规则决定业务如何运作或者各种资源怎样进行组织并相互联系。'
  merge: -1
  img_proc: true
- pgno: 517
  md: '# 业务建模概念的元模型


    元模型是基本业务概念及其相互间关联的模型。


    ![](img/9d75eecf8b59f35a7bd6d5d5336e2c43_517_0.png)'
  merge: -1
  img_proc: true
- pgno: 518
  md: '元模型展示了过程如何实现目标。


    +   - 目标确定了一个或多个需要解决的问题，并展示了一项或者多项资源所期望的状态。

    +   - 目标可以以过程控制规则进行表达。

    +   - 过程通过产生或者捕获事件与其他过程进行交互。

    +   - 资源可以是物理形式(如人或者机器)、抽象形式(如账号或者发票)，或者是某种信息，这些信息包含了其他资源的相关数据(如信息系统中的数据库记录)。

    +   - 过程与资源通过一个接口相互作用并导致资源的状态发生改变。


    # 业务建模元模型的构成基础是


    过程、目标、资源和规则。'
  merge: -1
  img_proc: true
- pgno: 519
  md: '+   - 业务元模型描述了业务架构，或者说表述了业务建模的组成要素，一个架构捕捉了系统中一系列元素，它们之间通过各种关系相互连接。

    +   - 元模型归纳了业务建模所使用的概念及其关系。这个面向基础概念的元模型演示了模型在描述复杂结构和关系方面的强大功能。

    +   - 元模型将业务概念图形化，而不是仅仅通过阅读文本描述来记忆它们，这使业务更加易于理解和掌握。

    +   - 这个元模型是一个UML类图，其中每个概念都以一个类的形式进行描述，概念之间的关系或是关联或特化。'
  merge: -1
  img_proc: true
- pgno: 520
  md: '# UML的业务建模扩展


    +   - 业务建模与软件建模处于生命周期的不同阶段，对现实中的业务要素和业务思想进行捕捉，并将其直接转化为程序设计语言很危险，它将扰乱业务建模的重点。这里重点关注UML创建高层业务模型，并不是指代码规格说明。

    +   - UML是为软件系统建模而定义的，尽管软件系统和业务系统之间存在许多相似之处，但是它们之间也存在一些差异。

    +   - 标准UML符号和图表已经能满足建模的功能需求。静态图、动态图无论是对于软件系统还是业务系统都同样适用。但业务建模中的一些常用概念却并未包含在标准UML定义中。

    +   - 业务模型可以转变为相应的信息系统模型，但这一步骤是不是业务建模阶段的任务。'
  merge: -1
  img_proc: true
- pgno: 521
  md: 'UML拥有一套内置的扩展机制，通过这些机制可以在UML中引入并定义业务建模的相关概念。


    +   这些扩展机制内容如下：

    +   - 构造型：作为UML词汇表的一个扩充，可以在现有的构件基础上建立新的构件，并可以拥有自己的图标。

    +   - 属性：UML元素属性的扩展使我们可以在原有元素规格说明中增加新的属性。

    +   - 约束：UML元素语义的一个扩展使我们对现有模型元素的规则进行添加或者修改。'
  merge: -1
  img_proc: true
- pgno: 522
  md: '基于现有UML建模元素创建了一系列扩展, 这些扩展被笼统地称为Eriksson-Penker业务扩展，通过在UML的核心建模元素上扩展来满足业务建模的需要。


    +   - Eriksson-Penker业务扩展为业务建模奠定了基础框架，在这个框架之上根据业务需要添加相应的构造型或者属性。

    +   - 扩展后的UML能与许多常见的通用业务模式结合使用。

    +   - 扩展为业务系统的过程、资源、规则和目标建模提供了相应的符号标识。


    ![](img/9d75eecf8b59f35a7bd6d5d5336e2c43_522_0.png)'
  merge: -1
  img_proc: true
- pgno: 523
  md: '# Eriksson-Penker业务扩展将简易性作为最优先的设计原则。


    版型 版型是业务构造型扩展的主要形式，不是给元素增加新的属性或约束，而是直接在已有元素中增加新的语义，这种机制可以看作是已有元素进行专有化。版型的表示方法是在模型元素的旁边添加一个版型的名称，版型名称使用双括号括起来，《Stereotypes》。


    Eriksson-Penker业务扩展扩展中唯一使用到活动图的地方，在这里活动图被命名为装配线图。一个装配线图是一个活动图中所展现的过程模型，过程中所使用的各个对象进行链接。这些对象可以是信息系统中的信息对象，也可以是与过程相关的其他一些资源对象。'
  merge: -1
  img_proc: true
- pgno: 524
  md: '# Eriksson-Penker业务扩展


    +   - 这些扩展为UML业务扩展奠定了基础框架，业务架构可以在这个框架之上根据业务需要添加相应的构造型或者属性。

    +   - 扩展不是业务扩展的最终形式，它们作为开发的基础以满足特定建模情况的需要或者进一步改进UML业务建模。

    +   - 这些扩展以标准UML扩展机制定义并与标准UML完全兼容，将UML和过程建模相结合，使得UML业务建模将更加简单。

    +   - 这些扩展并非是试图创造一种新的建模语言。


    # Eriksson-Penker业务扩展的相关工具支持包括：


    +   - sparxsystems(www.sparxsystems.com)的Enterprise Architect

