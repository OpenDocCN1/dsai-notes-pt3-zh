  md: '# 3 物料需求计划


    物料需求计划（Material Requirement Planning，简称为 MRP）是对主生产计划的各个项目所需的全部制造件和全部采购件的网络支持计划和时间进度计划。


    # 物料需求计划主要解决：


    +   - 要生产什么？生产多少？（来源于MPS）

    +   - 要用到什么？（根据BOM展开）

    +   - 已经有了什么？（根据物品库存信息、即将到货或产出信息）

    +   - 还缺什么？(计算出结果)

    +   - 何时安排？(计算出结果)'
