- pgno: 530
  md: '# 业务愿景视图展示了业务将来发展的策略。


    +   - 愿景陈述由一个概念模型和目标/问题视图作为补充说明。

    +   - 概念模型展示了业务中所有的重要概念及其相互联系。

    +   - 目标/问题视图展示出愿景陈述中高层目标被分割为各个子目标，也指出了阻碍目标达成的问题所在。


    # 业务过程视图是业务建模的核心。


    +   - 过程以过程图描述，它从本质上而言是一个UML活动图，同时结合了一些构造型以将资源和目标与过程相连接。

    +   - 业务中的组织关系可以通过泳道在过程的上下文中加以展示。当业务事件成为过程之间的通信渠道时，对应的过程图也包含了业务事件的发送和接收符号。'
  merge: -1
  img_proc: true
- pgno: 531
  md: '业务结构视图展示了业务中各种资源的不同结构。


    +   - 描绘了产品或者服务是怎样由各种资源组合而成，可以是业务中的信息，或者公司的组织，类图和对象图为这些情况分别定义了各自的结构。


    业务行为视图描述了独立资源的行为、资源或过程之间的交互作用。


    +   - 资源的状态、对资源产生影响的事件、在某个特定状态或是当接收到某个特定事件时资源所执行的动作，通过UML状态图进行相应的模型化。

    +   - 过程内部的交互作用可以由序列图或协作图展示。

    +   - 而过程之间的交互作用可以在装配线图中展示。'
  merge: -1
  img_proc: true
- pgno: 532
  md: '# 2.1 业务愿景视图


    在“业务愿景”视图中使用了以下三种技术：


    +   - **策略定义** 通过对当前以及未来一段时间内周边环境的分析而确立的公司定位，以及业务发展的战略目标和必须进行的变更。

    +     - （1）SWOT矩阵；（2）愿景陈述


    +   - **概念建模** 业务中使用的重要概念定义及其之间的相互联系。

    +     - 概念模型；


    +   - **目标/问题建模** 公司目标的定义，其中包含了各个子目标以及实现所有这些目标可能遇到的潜在问题的定义。

    +     - 目标/问题图表'
