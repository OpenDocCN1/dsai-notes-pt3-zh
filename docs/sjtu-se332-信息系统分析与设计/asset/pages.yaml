- pgno: 258
  md: '# A1 基本排队论方法（M/M/1模型）


    +   - 一个任务构成的过程。单位时间内，有λ个新案例到达，需要被一个资源处理。这个资源单位时间内能够完成μ个案例。（M/M/1模型）

    +   - 那么这个资源的能力利用率ρ：

    +     ρ = λ / μ：

    +   - 假设处理时间和案例到达时间间隔都服从负指数分布，过程中的平均案例数量L：

    +     L = ρ / (1 - ρ)

    +   - 平均等待时间W： W = L / μ = ρ / (μ - λ)

    +   - 平均系统时间S： S = W + 1 / μ = 1 / (μ - λ)'
  merge: -1
  img_proc: true
