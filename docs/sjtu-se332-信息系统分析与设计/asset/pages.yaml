- pgno: 92
  md: '# # 1 Petri网概述


    +   经典的Petri网是由德国 Carl Adam Petri 在 1962 年的博士论文《Kommunikation mit Automaten》中提出的。他发现当时的已有计算机理论如自动机和形式语言不适合描述物理系统，于是就提出了
    Petri 网。


    +   Petri网是完全从过程的角度出发为复杂系统的描述与分析设计提供的一种有效的建模工具，能自然的描述并发、冲突、同步、资源争用等系统特性。


    +   Petri网发展也经历了三个阶段。最先集中在孤立网系统研究；1970年至1985年，开始通用网系统研究，但主要被用于理论界；自从80年中期后，实际的应用越来越多，这主要是由于引入高阶Petri网和许多工具；'
  merge: -1
  img_proc: true
