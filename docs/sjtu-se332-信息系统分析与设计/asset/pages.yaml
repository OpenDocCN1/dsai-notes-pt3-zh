- pgno: 265
  md: '# Scheer教授建立ARIS的目的是：


    +   - 为了寻求一种能够用来缩小企业与信息技术之间差距的应用框架；

    +   - 提供一种能够对业务流程概念进行准确描述和详细分析的方法；

    +   - 为企业信息系统的开发实施提供了一个基础起点。


    # Scheer教授是这样定义ARIS的：


    +   - 一种描述业务流程的**体系结构**；

    +   - 一系列包含有各种元模型的**建模方法**；

    +   - ARIS工具集**软件系统**的理论基础；

    +   - 基于计算机的**业务流程管理**的概念。


    +   - ARIS的成功主要在于

    +     » 强大的**工具支持**和坚实的**理论基础**；'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# ARIS软件工具


    ARIS有一套标准的软件工具集支持ARIS建模及仿真实施。自1990年以来，IDS Prof.Scheer公司一直致力于基于ARIS模型的软件实施及相应工具的发展。


    +   - IDS Scheer 是德国第二大软件公司，并位居前十名 IT 服务商之列。\n- 2004年初，IDS Scheer中国公司正式成立，注册名称爱迪斯（上海）软件有限公司，致力于业务流程管理和
    SAP 系统咨询实施服务，直接为国内广大客户提供支持。\n- 2007年ARIS7.0正式发布并投入使用。


    # ARIS 工具的产品包括：


    +   - ARIS EasyDesign\n- ARIS Toolset\n- ARIS forR/3\n- ABC (Activity Based Costing)\n-
    Weblink和标准界面。\n- 这些产品可互相集成'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# ARIS 理论基础


    四个视图、五个层次、两个阶段


    +   ARIS共有四个视图，即功能视图、数据视图、组织视图和控制视图。其中控制视图起“粘合剂”的作用，其将系统功能、使用数据和参与组织联系在一起。


    +   ARIS采用了五个层次，各建模层次依次为现行系统分析，需求定义、设计说明、实施描述和运行维护。


    +   其中现行系统分析，需求定义、设计说明、实施描述层称为系统建立阶段（Build time）,运行维护层称为系统运行阶段(Run time)。


    +   从技术层次上总结，其特性有三点：

    +   （1）覆盖业务问题解决的生命周期；

    +   （2）过程为核心的集成；

    +   （3）面向对象的建模和关联；'
  merge: -1
  img_proc: true
