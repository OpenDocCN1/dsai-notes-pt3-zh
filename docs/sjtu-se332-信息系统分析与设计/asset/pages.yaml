- pgno: 249
  md: '# 工作流程设计要遵循的三个方针：


    +   - 尽可能并行执行任务；并行处理能缩短处理时间；

    +   - 争取提高资源弹性。确保资源能胜任尽可能多的任务，弹性资源地使用能带来高水平的资源利用率和较短的完成时间；

    +   - 尽可能按照处理时间为顺序来处理案例，通常，最好给处理时间短的案例比处理时间长的案例更高优先级。'
