- pgno: 16
  md: '# Enterprise architecture


    Enterprise architecture provides a comprehensive approach for designing, planning,
    implementing, and governing an enterprise information architecture.


    An architecture framework is a set of tools which can be used for developing a
    broad range of different architectures. It should:


    +   - describe a method for defining an information system in terms of a set of
    building blocks

    +   - show how the building blocks fit together

    +   - contain a set of tools

    +   - provide a common vocabulary

    +   - include a list of recommended standards

    +   - include a list of compliant products that can be used to implement the building
    blocks'
  merge: -1
  img_proc: true
