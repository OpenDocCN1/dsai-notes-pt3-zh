- pgno: 122
  md: '# 2.2 Petri网的形式化表达


    Petri网定义的一般可表达为五元组


    Σ = (P, T, F, K, M0)


    +   其中，P 为位置的集合，用圆圈代表，表示系统的状态；


    +   T 为转移的集合，用空心矩形代表，表示系统中的事件；


    +   F 称为P→T的流关系，其规定资源的输出流；


    +   K 称为T→P的流关系，其规定资源的输入流；


    +   M 称为Petri网Σ的状态，M0为初始状态的标识。


    Token表示工作对象，转移是网络中的控制点。Petri网进行算法扩展，可以使它具有处理模型求解系统运行的能力。'
  merge: -1
  img_proc: true
