- pgno: 574
  md: '# 2.3 业务结构视图


    +   - 业务结构视图展示了业务中的资源、产品和信息的结构，也包括传统的公司组织。

    +   - 业务结构视图的基础是传统的组织图及其描述，以及公司的产品或者服务的相关描述。

    +   - 业务结构视图被看作是过程视图的补充，它描述了那些在过程图中并没有表述但对公司的运作至关重要的信息。

    +   - 来自过程视图的信息也将得到应用，因为它表述了过程所用的资源。

    +   - 模型同样是由业务架构师所构建，同样也可能有一组过程模型构建师对其进行支持和维护。


    注意，一般情况下，这两种视图的建模工作将并行展开，因为它们相互促进并且必须保持一致。很难将这两种视图中的某个完全完成之后再转移到另一个视图的建模工作，因为它们的开发过程是相互作用的。'
  merge: -1
  img_proc: true
- pgno: 575
  md: '# （1）资源


    资源就是参与业务或者为业务所用的对象，是一些被业务过程消耗、产出、转化，或使用的概念。例如，原料、能源、产品、人、信息和服务。在面向对象建模中建模为类的元素通常可看作是业务建模中的资源。


    关于资源的定义有：


    +   - 一个资源即一个实体，此实体在某个类别的任务中扮演某一个角色（Vernadat 1996）。

    +   - 资源是业务中使用的一个概念，表示所有我们选择的作为整体来评估的事物。


    资源类型以类的形式进行描述，资源实例则以对象的形式表示。'
  merge: -1
  img_proc: true
- pgno: 576
  md: '+   - 资源模型展示了各种资源的结构。

    +   - 泛化的模型将以类图的形式描述，而其实际的结构配置信息则在对象图中展示。

    +   - 那些通常是作为公司所提供的产品或服务的资源的内部结构可以通过资源模型加以描绘。

    +   - 资源模型和概念模型之间的差异在于资源模型集中于更加具体的资源结构，如产品或者服务，而概念视图集中于业务定义时所用到的重要概念的含义和联系。'
  merge: -1
  img_proc: true
- pgno: 577
  md: '# 四种具体的资源类型：


    +   - **物理的** 占据一定空间的物质实体。日用品、原材料、零件或者过程中使用的产品都是物理资源的实例。一个物理对象往往是基于其他不同的物理对象所构建的。

    +   - **抽象的** 一种思想或者概念，往往来源于其他对象的合成体(如一份定单是与一系列选购的商品所联系的)。此类事物或者概念并非物理存在，但是对于业务而言却很重要。合同、角色、账户以及能源都是抽象资源的一些例子。

    +   - **人** 业务中参与的人员。这是物理资源的一个特例以突出过程中所涉及的人员。在元模型中用一个专有的类来对人进行描述。人将被看作是一种特殊的物理资源。

    +   - **信息对象** 某个概念、事物或者其他信息对象的表现。它包含了其他资源的相关信息，信息对象保存了业务中其他对象的实际情况或者相关知识。'
  merge: -1
  img_proc: true
