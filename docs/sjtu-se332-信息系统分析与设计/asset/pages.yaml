- pgno: 271
  md: '# 特性（2）以过程为核心的集成


    ARIS结构是从**过程链模型**抽取、发展而来的；


    +   - 根据Gutenberg的生产理论，生产过程不再是物料、人力和生产设备的使用，而是生产过程中数据的交换。

    +   - 从信息过程的角度来看，通过过程链就可以完整地描述企业过程。

    +   - “过程”是由起始事件和终止事件定义的，过程的对象可以是**物质的转变**过程（如生产过程），也可以是**信息的转变**过程（如管理过程）。

    +   - 以过程为核心的控制视图包含了多种过程模型，最主要的是扩展的事件过程链（eEPC）。

    +   - ARIS体系结构实现了多视图、多层次、多关联、全生命周期地描述企业信息系统的各个方面，并提供各个建模信息的关联关系，为多种描述方法之间的自动转换和综合分析提供基础。'
  merge: -1
  img_proc: true
- pgno: 272
  md: '+   - 在ARIS结构中，组织、数据和功能视图的发展过程是相对独立的，它们间的关系由控制视图来描述。

    +   - 由于功能视图、组织视图和数据视图是相对独立的，不仅减少描述问题的复杂性及冗余，还为将来实施基于 Web 的分布式协同建模提供了基础；

    +   - 建模人员可以依据视图描述规则对功能、数据和组织进行独立建模，通过从控制视图演化而来的控制规则来维护模型的一致性和完整性。控制视图是ARIS区别其他结构的重要特征，它用来记录和维护组织视图、数据视图和功能视图间的关系。

    +   - 由于ARIS是面向过程建模的，所以在过程模型的基础上引入工作流管理系统成为可能。'
  merge: -1
  img_proc: true
