- pgno: 429
  md: '# 控制库存的管理策略


    平均库存值：全部库存物品的价值之和的平均值，表示某一时间内库存所占用的资金。


    可供应时间：现有库存能够满足多长时间的需求。平均库存量/单位时间的需求。


    库存周转率：年销售额/年平均库存值


    库存周转率 = 年销售额 / 年平均库存值


    成品库存周转率 = 年销售额 / 成品平均库存值


    在制品库存周转率 = 生产产值 / 在制品平均库存值


    原材料库存周转率 = 原材料消耗额 / 原材料平均库存值'
