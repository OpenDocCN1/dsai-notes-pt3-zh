  md: '# 1 企业资源管理基础


    ERP是从MRP（物料资源计划）发展而来的新一代集成化管理信息系统，是一个整合了企业管理理念、业务流程、基础数据、人力物力、计算机硬件和软件于一体的企业资源管理系统；


    ERP（Enterprise Resource Planning）


    企业    资源    计划


    企业：通常所说的企业，一般是指从事生产、流通或服务等活动，为满足社会需要进行自主经营、自负盈亏、承担风险、实行独立核算，具有法人资格的基本经济单位。以什么为目的？


    资源    有形资源，无形资源


    计划    为实现目标而拟定的具体内容和步骤


    ERP系统主要功能：


    +   - SAP的基础模块：SD,MM,PP，FI&CO

