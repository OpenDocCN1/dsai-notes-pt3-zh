- pgno: 68
  md: '# 事件表


    事件：引起系统执行某项操作的事件。


    来源：引起系统执行的外部实体。


    响应：系统产生的输出结果。


    | 事件 | 触发器 | 来源 | 活动/用例 | 响应 | 目的地 |

    |---|---|---|---|---|---|

    | 客户想确定可用商品信息 | 商品查询 | 客户 | 查询可用商品 | 可用商品细节 | 客户 |


    触发器：系统动作的触发条件。外部事件，就是进入的数据，临时事件就是定义好的时间点。


    活动/用例：事件发生时，系统的操作。


    目的地：得到输出的外部实体'
  merge: -1
  img_proc: true
