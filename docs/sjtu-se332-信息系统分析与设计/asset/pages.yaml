- pgno: 96
  md: '# Petri网主要用途


    主要用途包括：


    +   - 系统仿真：系统分析与评估的系统仿真。

    +   - 数字分析：可通过结构变化描述系统的变化，支持DEDS形式的数学描述与分析；

    +   - 系统性能分析：如制造系统设备使用率、生产率、可靠性等。

    +   - 系统控制：直接从可视化模型中产生DEDS监控编码，进行系统实施控制。

