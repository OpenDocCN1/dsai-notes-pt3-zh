- pgno: 124
  md: '# 基于petri网的工作流构造


    PN = (P, T, F, W, M)


    +   - (P, T, F)是基网，此时F为不区分F，K的统一流关系的表述；

    +   - W是有向弧的权重函数，

    +   - M为状态，是一个多维向量集合，M(p)表示对应库所P中的token数

    +   - 对于t ∈ T，用•t = {p ∈ P|(p, t) ∈ F}来表示转移t所有输入库所的集合；

    +   - 对于t∈T，用t• = {p ∈ P|(t, p) ∈ F}来表示转移t所有输出库所的集合。

    +   - 在PN终止库所o和开始库所i之间插入一个转移t*并添加相应连接弧，构成PN的扩展网络。'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 工作流网


    构成了一个工作流网，用 PN 表示，其形式化表述为：


    PN = (P, T ∪ {t*}, F ∪ {(o, t*), (t*, i)}, W, M)


    辅助转移


    终止库所


    初始库所


    PN 有两种特殊的库所：i 和 o，i 是初始库所：• i = ∅，o 是终止库所：o • = ∅；


    PN 是强连通的；


    Petri 网是自由选择网当且仅当对于每个转移 t1 和 t2，当满足 • t1 ∩ • t2 ≠ ∅，则 • t1 = • t2。'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# MES系统（订单拉动）流程


    +   - MES系统从上游ERP系统接收到订单，提出加工请求申请，

    +   - 在加工请求申请得到批准之后生成一个生产计划，

    +   - 根据生产计划进行相应的工艺流程设计，之后对工艺流程进行审核，如果审核不通过则退回进行重新设计。

    +   - 如果审核通过，流程将分两步走，一方面进行工艺工时定额，另一方面进行物料需求申请、备料。待两方面都准备好之后才能进行生产排产，

    +   - 然后进行生产，生产结束之后将生产出的产品进行相应的质检，如质检通过则进行入库登记管理，否则将进入废品处理阶段，

    +   - 最后将各阶段的生产资料数据进行归档统计生成报表。'
  merge: -1
  img_proc: true
