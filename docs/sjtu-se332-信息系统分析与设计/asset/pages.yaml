- pgno: 413
  md: '# 库存管理


    库存管理是企业资源管理的核心问题，也是企业运营的两难问题：


    +   好处：

    +   - （1）快速满足客户期望，缩短交货期，维持销售产品的稳定

    +   - （2）稳定生产需求，防止发生缺货，

    +   - （3）防止价格上涨


    +   弊端：

    +   - （1）占用大量资金

    +   - （2）增加费用支出

    +   - （3）容易初放管理（计划不周、采购不力、生产不均衡）


    相关方法主要有：


    +   2.1 库存量控制策略：定量库存控制模型，定期库存控制模型

    +   2.2 库存的ABC管理方法

    +   2.3 库存定货点理论'
  merge: -1
  img_proc: true
- pgno: 414
  md: '# 2.1 库存管理策略


    独立需求：


    # 定量库存控制模型


    +   定量库存控制模型是当库存数量下降到某个库存值时，进行补充库存，以此来保证库存供应。这种库存控制方法称为定量库存控制模型。


    # 定期库存控制模型


    +   定期库存控制模型是按一定周期T检查库存，并进行库存补充，补充到规定的库存量S，这种控制方法称为定期库存控制模型。


    相关需求


    # MRP库存控制方法'
