  md: '# 参数


    +   - 其中入库台的容量设为200,AGV 的容量设为2,衔接区的容量为3,货架的容量为60,货架上每个货位的容量为2,分拣区和出库台的容量均为1000,输送带为可积放式,其容量为20。

    +   - 位置的容量可以代表标识数(或token 数)。每条边上的数据均为权数,未加权数的边其权数都默认为1,权数为-1 的边的权数为任意。

    +   - 当每个位置的标识数达到了其输出边的权数,则T 即事件发生。

