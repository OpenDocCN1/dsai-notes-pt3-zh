- pgno: 583
  md: '# （3）组织建模


    +   - 组织建模是资源建模的另一个特例，在组织建模中，资源以特定的规则分配到各个相互关联的组织单元。组织中被分配的资源包括雇员、机器和场所。

    +   - 过程同样也可以被分配到组织中去，而组织中的资源也可以被分配到过程。

    +   - 组织应该尽最大努力优化业务中各种资源的使用，同时努力避免内部的次优化，但是，这在许多组织中都是很普遍的现象。

    +   - 组织的基本功能就是展示资源分配情况、任务分配情况以及公司的管理模式。

    +   - 组织可以包括数个维度，如组织单元、地理位置以及分属的业务过程。'
  merge: -1
