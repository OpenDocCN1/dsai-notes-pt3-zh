- pgno: 101
  md: '# 2.1 经典Petri网


    Petri网观点可简单的归纳到两个基本概念：


    +   - 事件和条件，许多系统均可从事件与条件的观点去建模；

    +   - 系统状态可描述为一组条件，条件就是系统状态的调词或逻辑描述；

    +   - 事件是系统状态改变的原因，事件的出现是由系统状态控制的；

    +   - 前条件：由于事件是动作，所以它可以发生。为了使事件发生，必须使某些条件成立，这种条件称为事件的前条件；

    +   - 后条件：事件的发生可能破坏前条件而使另外的条件成立，这种条件称为事件的后条件。'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Petri网的结构


    经典的Petri网主要是由库所（place）以及转移（transition）构成的网络


    ![](img/9d75eecf8b59f35a7bd6d5d5336e2c43_102_0.png)


    连接（Connection）是库所和转移之间的有向弧，具有方向。


    托肯（Token）•是动态对象。


    Petri网的状态由分布在库所中的托肯决定'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Petri 网的组成元素


    Petri网简称PNG (Petri网 Graph), 它有库所和转移两种结点


    +   - 库所（Place）小圆圈 P

    +   - 转移（Transition）小方块 T

    +   - 连接（Connection）是库所和转移之间的有向边, 流关系 F,K

    +   - 托肯（Token）是库所中的动态对象, 可以从一个库所移动到另一个库所。'
  merge: -1
  img_proc: true
