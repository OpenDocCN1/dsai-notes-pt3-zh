- pgno: 165
  md: '# Petri网建模讨论


    Petri网建模的缺点：


    +   Petri网组成模型的元素数量过多；


    +   Petri网不如基于活动的图形容易理解；


    +   Petri网的建模中不能在网中体现数据流，尽管基于状态建模的Petri网能够精确、方便地对过程的控制逻辑进行定义。


    +   大部分情况下，数据流与控制流完全混合；


    +   当两者不一样的时候，Petri网就无法显式地表示这种独立于控制流之外的控制流；'
  merge: -1
  img_proc: true
