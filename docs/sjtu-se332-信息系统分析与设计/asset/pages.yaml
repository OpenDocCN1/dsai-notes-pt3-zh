- pgno: 462
  md: '# 4 能力需求计划


    能力需求计划(Capacity Requirements Planning, CRP)是对各生产阶段和各工作中心（工序）所需的各种资源进行精确计算，得出人力负荷、设备负荷等资源负荷情况，并做好生产能力与生产负荷的平衡工作，最后制定出能力需求计划。


    能力需求计划旨在通过分析比较MRP的需求和企业现有生产能力，及早发现能力的瓶颈所在，以协调生产能力和生产负荷的差距。


    ![](img/9d75eecf8b59f35a7bd6d5d5336e2c43_462_0.png)'
  merge: -1
  img_proc: true
- pgno: 463
  md: '+   - 物料经过哪些工作中心加工

    +   - 工作中心的可使用能力和负荷是多少

    +   - 工作中心各个时段的可用能力和负荷是多少


    # 能力计划种类


    ![](img/9d75eecf8b59f35a7bd6d5d5336e2c43_463_0.png)'
  merge: -1
  img_proc: true
- pgno: 464
  md: '# RCCP与CRP比较


    | 项目 | RCCP | CRP |

    |---|---|---|

    | 计划阶段 | MPS | MRP |

    | 计划对象 | 关键工作中心 | 全部工作中心 |

    | 负荷计算 | 独立需求物料 | 相关需求物料 |

    | 工作日历 | 工厂日历、关键工作中心日历 | 加工中心日历 |

    | 提前期 | 以计划周期为最小单位 | 物料开始与完工时间 |'
  merge: -1
  img_proc: true
- pgno: 465
  md: '# 有限能力计划


    思路：是在做能力需求计划时暂不考虑能力的限制，对各个工作中心的能力、负荷进行计算，得出工作中心的能力与负荷状况，产生能力需求计划方案，当负荷>能力时，对超负荷的的工作中心进行调整。


    特征：适用于普通物料；按物料完工日期倒排；需要做能力平衡与调整。


    # 无限能力计划


    思路：是在有限可用能力限制下，按照计划的优先级进行安排，先把能力分配给优先级高的物料，当工作中心负荷已满时，优先级低的计划被延迟。按该方法制定的计划方案可以不进行负荷与能力平衡。


    特征：适用于重要物料；按物料开始日期顺排；不需要做能力平衡与调整。'
  merge: -1
  img_proc: true
