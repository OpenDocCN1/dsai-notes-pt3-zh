  md: '+   - RAD可以由传统基于活动的流程图派生而来。从组成元素上看，除活动外，RAD还包括状态和控制等元素，状态表明活动的原因和结果，控制表示路径选择等。


    +   - RAD表示法扩展了基于活动的流程表示，虽然它使角色的交互明晰化，但也增加表示的复杂性，因此不便于表达复杂的流程。


