- pgno: 4
  md: '业务建模的目的是描述出反映企业核心业务功能的复杂现实，构架业务领域到技术领域的桥梁，从而更好地理解业务的关键机制、或者作为信息系统实施的业务基础、开展业务改进、发现新业务机会、明确外购需求等。


    理想情况下，业务模型中所描述的对象可以转变或者映射为信息系统中的对象。通常情况下，这并不是一一映射。


    信息系统中有许多在业务模型中完全没有涉及的对象，反之亦然。


    ![](img/9d75eecf8b59f35a7bd6d5d5336e2c43_4_0.png)'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# 业务模型与系统模型的区别


    # 业务模型


    +   - 面向企业业务分析

    +   - 属于业务层面

    +   - 层次较高：组织、业务概念，流程...

    +   - 支持框架： ARIS, Zachmann, UML业务建模框架


    # 系统模型


    +   - 面向软件系统开发

    +   - 属于技术层面

    +   - 可能比较底层，数据类、功能、进程...

    +   - 支持框架： SSH, RUP'
  merge: -1
  img_proc: true
