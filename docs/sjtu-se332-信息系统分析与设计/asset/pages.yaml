- pgno: 527
  md: "# 2 业务视图\n\n复杂的业务建模需要使用多个视图。但模型定义中需要达到怎样的细化程度？\n\n+   - 如果模型描述了业务在较高层次的全局概览，描述可以非常的概括，只需表达出最主要因素即可。\n\
    +   - 如果模型试图捕获业务中的大量细节，那么它就是一个非常复杂的模型，使用、扩充和阅读也将比较困难。\n+   - 理想方案是介于两个极端之间，模型细节层次取决于目的。\
    \  \n+     - 如果此模型将用于构建相应的信息系统，那么使用的信息及其格式就应该作为重点加以强调。\n+     - 如果此模型将用于业务的改进或者革新，那么就应该突出业务之间的交互作用，同时确定那些可能有助于整体性能提升的改变。"
  merge: -1
  img_proc: true
- pgno: 528
  md: '# UML业务建模的基础是四种业务视图：


    +   - **业务愿景视图**：业务的整体愿景。描述了公司的目标结构和实现目标所必须解决的问题。

    +   - **业务过程视图**：描述了业务中的活动及其创造的价值，同时也展示了为实现过程的目标，过程之间的相互作用以及涉及到的各种资源，也展示了不同过程间的相互作用。

    +   - **业务结构视图**：业务中各种资源之间的结构关系，业务组织关系或者创建的产品结构。

    +   - **业务行为视图**：业务模型中各个重要资源和过程的独立行为。'
  merge: -1
  img_proc: true
- pgno: 529
  md: '# 业务视图


    业务过程（Business Process）视图：描述了业务中的活动及其创造的价值，也展示了实现过程的各个目标，过程之间的相互作用以及涉及到的资源，以及不同过程间的相互作用。


    业务愿景（Business Vision）视图：业务的整体愿景。描述了公司的目标结构和实现目标所必须解决的问题。


    业务行为（Business Behavior）视图：业务模型中各个重要资源和过程的独立行为。


    业务结构（Business Structure）视图：业务中各种资源之间的结构关系，例如业务组织关系、产品结构。


