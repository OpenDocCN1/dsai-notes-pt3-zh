- pgno: 133
  md: '# Petri网特点


    利用Petri网建模具有以下优点。


    +   (1) Petri网建立在严格的数学基础上，精确描述系统中事件的依赖关系和不依赖关系，这是事件之间不依赖于观察的关系，已有了许多成熟的分析方法和工具。

    +   (2) 兼顾了严格语义与图形表示两方面，具有统一的语言描述系统结构和行为，方便建模仿真，从而起到沟通不同子系统间桥梁的作用；

    +   (3) Petri网是一种基于状态的建模方法，与基于事件的过程建模方法不同，Petri网系统比其他图形建模工具更适于确定触发方式、描述同步并发系统，并具有更多的柔性。'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# 2.3 高阶Petri网


    Petri网建模的一些缺点阻碍了其在复杂问题的使用：


    +   - 没有测试库所中零托肯的能力

    +   - 模型容易变得很庞大，建模可能要花太多的时间

    +   - 模型不能反映时间方面的内容，不能处理时间和数据信息

    +   - 不支持构造大规模模型，如自顶向下或自底向上


    在实际应用中，经典的Petri网并不是非常有用：


    +   - Petri网组成模型的元素数量过多；

    +   - Petri网不如基于活动的图形容易理解；

    +   - Petri网的建模中不能在网中体现数据流；'
  merge: -1
  img_proc: true
