- pgno: 374
  md: '# 6 小结


    ARIS 是一种面向过程的模型结构，以面向对象的方法描述了企业各个视图以建立完整的企业模型。


    +   - ARIS方法体系有一些成熟应用工具可以使用，助长了该方法的推广。


    +   - ARIS方法建立的业务流程模板可以作为蓝图重用，这是其在业务流程改进BPR中得以广泛应用的基础。


    +   - ARIS是面向过程建模的，所以在过程模型的基础上引入工作流管理系统成为可能。


    +   - ARIS 上的 Balanced Scorecard， ABC， Knowledge Management都是实际中用途较广的方法工具。


    EPC作为一种基于事件的建模方法，被广泛应用于分析和设计过程，也是实现ERP的基石。外部两种趋势对EPC的进一步发展有重大影响：


    +   - 业务集成的趋势使得EPC成为业务视角和系统视角间的协调者。


    +   - 智能性、知识性的要求使得EPC成为基于过程模型融入本体、知识、业务知识的重要基础。'
  merge: -1
  img_proc: true
- pgno: 375
  md: '# A1 BPMN 建模


    +   - 业务流程建模标注BPMN(Business Process Modeling Notation)，是用流程图形式来描述业务流程的一种方法。

    +   - BPMN从2002年开始制定，2004年5月发布第一个版本，由对象管理组织OMG进行维护管理。目前版本为BPMN 2.0。

    +   - BPMN定义了建立业务流程的图形模式：

    +   - 业务流程图BPD(Business Process Diagram)。BPD由一系列的图形元素组成，所采用的图形化的标注使用一些简单的形状来区分。为了满足对业务流程描述的全面性，BPMN通过对基本元素增加一些额外信息及标注来进行扩展，扩展后的BPD图能够支持相对复杂的业务流程描述。'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# 部分BPMN软件


    # ARIS Express


    +   - ARIS Express是ARIS的免费流程分析和管理工具，提供了对ARIS核心9个模型的支持，其中包括BPMN 2 Collaboration
    Diagrams，EPC，Organizational charts等的支持图。


    # ProcessOn 在线流程设计器


    +   - ProcessOn流程图设计器支持BPMN2.0的三种标准类型建模 - Process, Collaboration和Choreography。用户在画BPMN2.0流程图的同时，还可以设置与特定图形相关的业务属性，ProcessOn内置了BPMN2.0展示层所要求的所有标准业务属性。


    # BPMN 2.0 Modeler for Visio description


    +   - BPMN的2.0建模for Visio是微软Visio附件设计绘制和建模业务流程。这是一个全面的用户友好的软件包。2.0建模的BPMN为Visio支持的BPMN
    2.0元素提出一套完整的对象（流对象，连接对象，泳道，工件和数据）。'
  merge: -1
  img_proc: true
