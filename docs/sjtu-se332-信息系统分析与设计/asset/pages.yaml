- pgno: 509
  md: '# 编码策略


    +   1 编码的精简性

    +     - 如需要编码来识别250个客户，就不需要6位数字编码。

    +   2 编码的可扩充性

    +     - 考虑编码数量的合理增长。

    +   3 编码的稳定性

    +     - 编码的改变可导致一致性问题以及要求数据的更新，因此稳定性较为重要。如转换到新编码时，有时甚至需要新旧共存一段时间。

    +   4 编码的唯一性

    +     - 如系统同时有hardware及Housework，使用HW便没有意义。'
  merge: -1
  img_proc: true
- pgno: 510
  md: '+   5 采用不易出错的代码结构，数字、字母不占用不同的位置，避免混淆编码。

    +      - 如5Z08I,52081,或者S2OB1等。


    +   6 使用分类编码。

    +      - 如100和300是一类产品，200是另一类，可增加指导性位（0，1）保证编码正确分类。


    +   7 编码有意义。

    +      - 便于记忆使用，如EN比XQA或者132更好。


    +   8 合理的代码结构。

    +      - 当代码长于4个字母或5个数字字符时，应分成小段；如注册码：J2MV9-JYYQ6-JM44K-QMYTH-8RB2W'
  merge: -1
  img_proc: true
