- pgno: 385
  md: '# 流对象—判断


    网关用来表示流程的分支和聚合。Gateway在BPMN是个很复杂的概念，不同的网关代表了各自的路径选择和控制方式。在Gateway的组合使用时需要注意流程描述的合理性问题。


    |  |  |  |

    |---|---|---|

    | 异或 -分支\合并 (XOR) | 基于数据 | ◇ or X |

    |  | 基于事件 | ★ |

    | 排他 -分支\合并(OR) |  | ○ |

    | 复杂 -分支\合并(Complex) |  | ✱ |

    | 并行 -分支\合并(AND) |  | + |'
  merge: -1
  img_proc: true
