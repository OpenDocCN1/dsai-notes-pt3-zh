- pgno: 590
  md: '# 3 业务规则


    +   - 业务规则是对业务包括业务工具如何运作的一种需求。

    +     它们可能是法规或者表达成业务的架构和风格。


    +   - 业务规则的表达：严格、形式化，从而使得它们能够成为自动化的基础。


    +   - Object Constraint Language (OCL)


    +   - 其它自然语言


    +     » 结合结构化英语，可以确定一组保留表达式用于定义规则。

    +     » IF

    +     » ONLY IF

    +     » WHEN

    +     » THEN

    +     » ELSE

    +     » IT MUST ALWAYS HOLD THAT 必须总是满足

    +     » IS CORRECTLY COMPLETED 被完全实现'
  merge: -1
  img_proc: true
- pgno: 591
  md: '# 3.1 业务规则


    +   - 一个业务模型包含了各种业务规则，它们定义了业务过程如何运作的相关约束、条件和策略。

    +   - 业务规则可以影响所有其他的概念；它们可以约束业务的执行过程、资源的行为，以及达成特定目标所采用的方法和手段。

    +   - 规则往往会影响到各个概念之间的关联、定义概念相互关联的途径以及特定时刻保证关联有效的前提条件。


    下面是业务规则的一个定义：


    +   - 可以控制或影响业务执行过程以及业务资源结构的语句。此语句指明了必须得到满足的条件，或者此条件决定了下一步哪个活动将得以执行。它可以表达一个业务目标，指明过程执行的方式，可以对一个关联的条件进行具体描述，或者约束某项资源的行为。'
  merge: -1
  img_proc: true
- pgno: 592
  md: '# 三种业务规则：


    +   - **派生** 定义了知识如何从一种形式转化为其他类型的规则，如某些信息是如何从其他信息中推导出来的。推导可以是计算规则，也可以是一个推理规则，此规则意味着如果某个条件为真，那么另外一个推理得到的条件也同样为真。

    +   - **约束** 对对象或者过程可能出现的结构或者行为进行约束的规则。当对象得以创建成其关联发生改变的时候，约束维护了对象的完整性。对象的操作可以用操作预处理和后续处理进行约束。在操作执行之前，预处理操作必须首先执行；当操作执行后，后续处理随后也必须执行。

    +   - **存在性** 定义了事物何时可以出现以及何时应该出现的规则。'
  merge: -1
  img_proc: true
- pgno: 593
  md: '# 业务规则具体类别


    +   - 派生规则：从其它事实推导或计算的条件和策略

    +     - 推理规则

    +     - 计算规则

    +   - 约束规则：对对象的结构和行为进行限定的策略和条件.

    +     - 激励和响应规则：描述何时或者什么条件需要为真，才能触发相应的行为

    +     - 操作约束规则：确定操作的前提和后续条件以保证操作的正确性

    +     - 结构约束规则：有关类，对象及其关系的策略和条件。

    +   - 存在性规则：事物何时出现和消失的规则。

    +     - 存在性规则：一个对象何时创建和销毁。'
  merge: -1
  img_proc: true
- pgno: 594
  md: '# 规则如何体现在模型中


    +   - 业务规则影响了模型。它也影响了在活动图里如何排列你的活动，它甚至影响了业务实体之间的联系。

    +   - 有些规则并不能够很容易地直接翻译成模型的样子，它们可能内含在模型元素中。

    +   - 无论如何，将业务规则作为文本描述总是有用的。'
  merge: -1
  img_proc: true
- pgno: 595
  md: '# 派生规则（1）推理规则


    +   - 推理规则一般看起来像刺激和响应，操作约束或者结构规则。它们的区别在于为了达到结论，需要经过一系列考虑的步骤。

    +   - 规则隐含了工作流中某一活动状态中需要的方法，最终体现为业务工作者或者业务实体的操作。


    ![](img/9d75eecf8b59f35a7bd6d5d5336e2c43_595_0.png)'
