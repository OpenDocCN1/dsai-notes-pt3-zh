  md: "+   • 离散事件动态系统的研究自20世纪80年代后发展较快。针对各层次不同角度的问题提出了多种理论模型和分析技术。它们已开始在许多技术领域得到应用，并被认为是大型复杂信息处理和控制系统分析和设计的重要理论基础。\n\
    +   \n+   • Petri网具有严格的数学基础和规范化语义，作为DEDS的描述工具，可描述异步、同步、并行逻辑关系，是描述、分析和控制DEDS的最有效和应用最广泛的方法；\n\
    +   \n+   • Petri网，有限自动机，形式语言或等模型可以很好地描述这种逻辑层次的分析和综合问题。"
