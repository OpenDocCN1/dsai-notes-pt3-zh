- pgno: 301
  md: '# 2.4 扩展EPC


    eEPC 的四个主要要素：事件(Event)、功能(Function)、组织单元(Organization Unit)、信息(Data)。


    | 元素 | 图例 | 描述 |

    |---|---|---|

    | Event |  | 描述了状态的发生，同时又充当了一个触发器 |

