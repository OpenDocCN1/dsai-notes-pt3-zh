- pgno: 336
  md: '# 4 ARIS业务建模过程及实例


    ARIS业务建模过程就是建立各视图的模型及它们之间的联系的过程：


    +   - 组织建模

    +   - 功能建模

    +   - 数据建模

    +   - 过程建模


    +   - 这个过程是以控制视图为核心的建模过程，然而各视图的创建过程，可能有一定差异。

    +   - 一种最佳实践方式是数据视图，功能视图，组织视图，最后是过程视图。'
  merge: -1
  img_proc: true
