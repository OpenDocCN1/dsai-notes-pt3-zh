- pgno: 241
  md: '# 工作流性能分析主要有以下方法：


    +   马尔科夫链：

    +   - 实际上就是增加了转移概率的可达图；

    +   - 通过成本和时间的引入extended Markov Chain, 可获得性能指标；

    +   - 缺点在于：不是所有各方面的性能都能分析出来；另外应用Markov chain的分析过程非常耗时, 即便是简单的情况下。


    +   排队论：

    +   - 大量相同资源的队列时适用；

    +   - 难以适应并发生路由的情况；一些假设对工作流也不适用。

    +   - 评估整个工作流, 需研究队列网络。


    +   仿真：

    +   - 图示仿真工具应用较为普遍；

    +   - 容易被没有数学背景的人接受, 也可以跟踪执行状态。'
  merge: -1
  img_proc: true
