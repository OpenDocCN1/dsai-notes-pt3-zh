- pgno: 236
  md: '# 合理性分析


    每个合理（Sound）过程都必须满足以下要求：


    +   - 过程不包含不必要的任务；

    +   - 每个提交的案例必须能够完全完成；

    +   - 完成后再没有对案例的引用；'
  merge: -1
