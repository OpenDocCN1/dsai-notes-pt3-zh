- pgno: 321
  md: '# 3.3 过程视图


    过程视图是ARIS集成思想的特色体现，起到粘合剂作用，把功能、数据、组织和输出（产品/服务）视图联系到一起。


    ARIS过程视图有一系列建模方法组成，包括：


    +   - 关联组织和功能视图：功能/组织图

    +   - 关联数据和功能：功能分配图、信息流图、eEPC图

    +   - 关联组织、功能和数据：eEPC、增值链图、规则图、通信图、分类图

    +   - 面向对象建模：类图（Class diagram）

    +   - 过程变量：过程选择矩阵（Process Selection Matrix）

    +   - 物流建模：物流图、带物流的eEPC'
  merge: -1
  img_proc: true
