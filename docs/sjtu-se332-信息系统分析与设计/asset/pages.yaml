- pgno: 9
  md: '# 企业业务模型


    在IT领域，标准而规范的描述手段，就是建模。


    业务模型是描述、开发、实现、优化企业信息系统的方法基础：


    +   - 模型是具有完整语义的一组信息，包括两方面：一方面，对现实的简化或者对实现的化简；另一方面，认知主体的视角和抽象层次。

    +   - 认知活动的主体决定了特定的视角，可以理解为简化的动机（视图差异）

    +   - 认知活动的原则决定了特定的抽象层次，可以理解为简化的水平（粒度差异）


    企业模型具有多层次、多视角、复杂关联、时序相关等特点！'
  merge: -1
  img_proc: true
