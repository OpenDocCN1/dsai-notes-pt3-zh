- pgno: 231
  md: '# 5.2 过程的结构分析


    过程定义中常见的错误：


    +   1. 任务没有输入或输出条件；

    +   2. 存在死任务：任务永远不能被执行；

    +   3. 存在死锁：任务在到达end前发生了诸塞；

    +   4. 存在活锁：把案例带进无休止的循环；

    +   5. 在到达end后，仍有活动执行；

    +   6. 案例完成后，定义的过程 中仍然存在标记；'
  merge: -1
  img_proc: true
