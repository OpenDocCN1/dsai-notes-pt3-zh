- pgno: 349
  md: '# 流程优化方向


    +   - 借助ARIS强大的建模功能，给出了系统分析阶段企业模型的建立方法，并从定性的角度分析减少了旧流程步骤多、数据散引发的数据不统一、收集困难的问题。

    +   - 从定性的角度分析得出，新流程利用ERP产品集成性的特点将旧流程中审核客户订单的价格、交货时间、库存数量、订单产品工艺合并为一个步骤，减少了步骤多、数据散引发的数据不统一、收集困难的问题。

    +   - 实现了对企业现有经营过程的优化、仿真、结果分析和评估，为ERP实施中的业务流程优化或再造提供了定量的说明，从而有效降低企业业务分析的复杂度，达到优化ERP实施过程的目的。'
