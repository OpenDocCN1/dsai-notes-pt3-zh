- pgno: 144
  md: '# 3 基于Petri网的过程建模


    Petri网建立步骤：


    +   根据状态与事件的定义，确定系统的状态集和转移事件集。


    +   确定系统中状态与转移的关系。


    +   将库所和转移对应起来，建立Petri网模型图。


    +   根据系统情况，决定Petri网模型图的初始状态，确定初始状态的下个状态的Token数。


    +   基于初始状态判断那些事件可被激发，当模型激活后，模型状态图将发生变化，又引起一些事件被触发。'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# A simple example


    电子商务的交易流程可用语言描述为：


    +   客户通过浏览信息向商家提交订单意向,商家接到提交的订单意向后,通过查看库存信息形成可供订单；


    +   对可供订单确认后，客户输入用于电子支付的信用卡号和密码；


    +   得到银行的支付确认后,商家将可供订单转为有效订单，同时产生库存信息变更；


    +   商家按有效订单配送货物,并修改库存信息。接着商家进行下次交易的处理。'
  merge: -1
