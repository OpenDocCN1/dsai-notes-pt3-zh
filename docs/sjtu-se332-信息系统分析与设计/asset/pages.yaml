- pgno: 586
  md: '# 2.4 业务行为视图


    业务行为视图展示了业务中相关资源和过程的独立行为，以及资源和过程之间的交互关系。


    +   - 业务过程视图决定了资源对象的单独的行为，展示了业务运作中的整体控制流程。

    +   - 业务行为视图更加细致地观察了业务所涉及的各个对象：它们的状态、每个状态下各自的行为和可能的状态变换。

    +   - 行为视图也展示了不同过程之间的交互作用，如它们以何种方式保持同步。


    通过这种方式，行为视图成为众多活动职责划分以及定义过程中各种资源行为的重要工具。'
  merge: -1
  img_proc: true
- pgno: 587
  md: '# 业务行为视图和业务过程视图的差异：


    +   过程视图通过业务中的资源、目标和规则之间的交互关系展示系统的行为、转变和功能。


    +   行为视图则展示这些活动所涉及的各个动态行为。某些活动在更加细致的层次上得以描述，而同时对过程视图中没有表现出来的交互关系和职责也进行了相应的定义。


    +   这两种视图之间自然必须保持一致。


    +   业务行为视图通常是由过程建模者在业务架构师的协助下创建，这里业务架构师保证了这些模型与业务过程视图相一致。'
  merge: -1
  img_proc: true
