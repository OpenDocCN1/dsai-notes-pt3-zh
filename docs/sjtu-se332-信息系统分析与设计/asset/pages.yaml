- pgno: 572
  md: '# （3）装配线图和用例


    装配线图中所有装配线包都是信息系统对象。


    +   - 此图展示了业务过程与信息系统之间的交互关系。

    +   - 连接到装配线包的引用关系中包含了信息系统的输入输出信息流，同时也表明了业务过程以及信息系统之间的接口。此接口以面向对象建模技术中的用例来描述；

    +   - 装配线图中的一系列引用关系也同时转变为信息系统中必须提供的用例。


    这一点非常重要，因为它将业务过程映射到系统用例，而系统用例描述了信息系统的功能需求；它同时也确定了系统用例中的参与者(由使用装配线的过程扮演的角色)。


    装配线图在业务建模和软件系统需求之间建立了沟通的桥梁。'
  merge: -1
  img_proc: true
