- pgno: 15
  md: '# 2 企业业务建模体系


    企业业务模型是一组具有特定目的的互补模型的一致集合，这些特定模型描述了企业某些用户的特定需求的不同侧面。


    针对不同的需要，国内外开展了许多研究，提出了多种企业级建模框架。然而，到目前为止，现有的建模框架建立的模型与理想情况还有差异。


    ![](img/9d75eecf8b59f35a7bd6d5d5336e2c43_15_0.png)'
