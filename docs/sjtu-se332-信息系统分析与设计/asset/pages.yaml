- pgno: 339
  md: '# ERP 系统建模及优化实例


    +   • 某企业实施ERP系统没有达到预期的效果。


    因此在企业业务流程重组的基础上，优化业务流程，去除企业冗余和一切不增值的环节，以确保企业增值链有效运转。


    +   • 选用了ARIS作为业务建模工具；


    ARIS建模常用模型类型


    | 模型类型 | 模型类型描述方法 | 用途 |

    |---|---|---|

    | 组织视图 | 组织图 | 描述组织结构 |

    | 过程视图 | 价值增值链 | 描述直接给企业带来价值增值 的过程 |

    | 过程视图 | eEPC 扩展事件驱动过程链 | 描述由事件触发业务活动，而活动又产生事件结果，由此完成企业流程的过程描述。 |

    | 功能视图 | 功能树 | 描述企业流程中面向过程的各个业务活动，每个活动可能就是ERP 系统中的一个功能点。 |

    | 数据视图 | eERM 扩展实体关系模型 | 描述企业流程中存在的信息及信息之间的关系 |

    | 数据视图 | 技术术语模型 | 定义企业内部相互交流中用到的术语 |'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# 某印刷设备制造企业在华投资的分厂


    +   - 需要投入较多精力和成本在市场拓展方面，对客户的订单服务要快速反应，提高准时交货率。

    +   - 作为基于订单生产的中小企业，企业希望以较少的库存占用资金顺利完成整个物料供应与生产交货过程；

    +   - 企业质保的服务质量以及服务水平在极大程度上影响了企业的声誉。

    +   - 着力解决销售业务的效率问题、排产计划的灵活性问题、物料低成本控制的问题和质量保证问题，尽可能实现以最低的库存，占用资金最快，实现客户的各种订单需求。'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# 当前问题


    +   - 调研情况：实施ERP系统没有达到预期的效果。

    +   - 原因：企业的管理体制和ERP系统有一定的差距，业务量参差不齐，生产过程当中的基层数据采集不齐全或者不准确，没有形成快速可靠的数据采集系统，不能及时对整个生产过程进行监控，多处（管理）理念处于手工管理阶段。

    +   - 措施：优化业务流程，去除企业冗余和一切不增值的环节，以确保企业的增值链有效运转。

    +   - 难点：在企业进行ERP系统的实施过程中，往往需要对原有的业务流程、组织架构进行调整优化或重组，但是在这个过程中很大程度上依赖于ERP实施顾问的经验，缺少定量的方法和工具来对实施前后的经营过程进行分析、诊断、仿真和评估。'
  merge: -1
  img_proc: true
