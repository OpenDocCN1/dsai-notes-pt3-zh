- pgno: 203
  md: '# 3.2 企业数据资源分类


    从数据使用者不同，企业数据可分为：


    主题域模型、概念模型、逻辑模型、物理模型


    按业务应用及时间稳定性来分，企业数据可分为：


    +   - 主数据

    +   - 事务数据

    +   - 状态数据（面向流程类应用的信息控制）'
  merge: -1
  img_proc: true
- pgno: 204
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Oracle认为：


    +   - 主数据是描述核心业务实体的关键事实(例如客户、产品、员工、地区等)和这些事实之间的数据关系，这些关键事实在多个业务系统中被用到反复用到，在多个IT系统交互时，相同的实体可以有所区别。


    # Microsoft认为：


    +   - 主数据是改变缓慢，并可以跨系统共享的业务关键名词，通常包括人、物、地点和抽象对象等业务实体的信息，企业的数据分为五类：非结构化数据、元数据、交易数据、分级数据和主数据。'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# IBM认为：


    +   - 主数据是用来描述企业核心业务实体的数据，比如客户、合作伙伴、员工、产品、物料单、账户等；它是具有高业务价值的、可以在企业内跨越各个业务部门被重复使用的数据，并且存在于多个异构的应用系统中。

    +   - 主数据定义企业核心业务对象，与交易流水信息不同，主数据一旦被记录到数据库中，需要经常对其进行维护，从而确保其时效性和准确性；

    +   - 主数据还包括关系数据，用以描述主数据之间的关系，如客户与产品的关系、产品与地域的关系、客户与客户的关系、产品与产品的关系等。

    +   - 主数据的特点包括：它是准确的、集成的，其次它是跨业务部门的，再有就是它是在各个业务部门被重复使用的。数据管理的内容及范畴通常包括交易数据、主数据以及元数据。'
  merge: -1
  img_proc: true
