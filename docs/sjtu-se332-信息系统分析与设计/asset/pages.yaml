- pgno: 263
  md: '# 1 ARIS 框架


    ARIS (architecture of integrated information system)是德国 Saarland大学的Scheer教授提出的一个集成化的信息系统模型框架，其本质是一种面向过程的模型结构，提出来在这个框架中开发、优化、集成应用系统。


    +   由于Scheer教授创办的IDS公司在此基础上开发了完整的ARIS工具（ARIS toolsets）,将各个视图信息进行了有效关联，并提供了基本的仿真分析手段，在商业上获得了很大的成功。


    +   SAP公司注资IDS公司，使用ARIS作为其ERP软件实施的企业建模、分析、诊断的工具，指导SAP的实施，使得ARIS得到广泛的应用。


    +   超过60%的ARIS产品是在SAP R/3基础上进行定制和应用的。'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'Gartner Group连续多年将ARIS评为世界公认的业务流程建模（BPM）工具的领导者。


