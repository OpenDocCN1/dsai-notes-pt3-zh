- pgno: 439
  md: '# 低层码


    物料的低层码是系统分配给物料清单上的每个物品一个从0至N的数字码。产品结构中最上层的层级码为0，下一层部件层级码则为1，依此类推。


    **一个物品只能有一个MRP低层码，**当一个物品在多个产品中所处的产品结构层次不同或即使处于同一产品结构中的但却处于不同产品结构层次时，则**取处在最低层的层级码作为该物品的低层码，也既取数字最大的层级码。**


    # 低层码作用


    +   - 低层码是MRP的计算顺序。

    +   - 在展开MPS进行物料需求计算时，计算的顺序按低层码的顺序**从低层码数字小**的物料**往低层码数字大**的顺序进行计算。

    +   - 当计算到该产品的最低层次时，再进行MRP需求计算与原材料（或构成的组件）的库存分配，**保证可用的库存量优先分配给了处于最低层**的物料，时间上最先需求的物料先得到库存分配，避免了需求较晚的物品提前下达计划，并占用库存'
  merge: -1
  img_proc: true
- pgno: 440
  md: '# MRP的计算过程


    MRP中每个项目的计算步骤


    # 计算毛需求量


    +   - 项目毛需求量=项目独立需求+父项的相关需求

    +   - 父项的相关需求=父项的计划订单数量*项目用量因子


    # 计算净需求量


    +   - 预计库存量初值=前期库存+计划接收量-毛需求量-已分配量

    +   - 净需求量=预计库存初值的相反数+安全库存

    +   - 净需求量=毛需求量-前期库存-计划接收量+已分配量+安全库存


    # 生成订单计划和下达订单计划


    计划更低一层相关项目的毛需求量，进入下一循环'
  merge: -1
  img_proc: true
- pgno: 441
  md: '# MRP的编制方法


    +   - 第1步推算物料毛需求。考虑相关需求和低层码推算计划期全部的毛需求。

    +     毛需求量=相关需求量+独立需求量

    +   - 第2步计算当期可用库存量。考虑已分配量计算计划初始时刻当期预计库存。

    +     当期预计可用库存量=现有库存量-已分配量

    +   - 第3步推算PAB初值。考虑毛需求推算特定时段的预计库存量。

    +     PAB初值=上期末预计可用库存量+计划接收量-毛需求量

    +   - 第4步推算净需求。考虑安全库存推算特定时段的净需求。

    +     当PAB初值≥安全库存，净需求=0

    +     当PAB初值<安全库存，净需求=安全库存-PAB初值

    +   - 第5步推算计划产出量。考虑批量推算特定时段的计划产出量。

    +     当净需求>0，计划产出量=N×批量

    +     满足：计划产出量≥净需求>(N-1)×批量

    +   - 第6步推算预计可用库存量。推算特定时段的预计库存量。

    +     预计可用库存量=计划产出量+PAB初值

    +   - 第7步递增一个时段，分别重复进行第三到第六步，循环计算至计划期终止。

    +   - 第8步推算计划投入量。考虑提前期推算计划期全部的计划投入量。'
  merge: -1
  img_proc: true
