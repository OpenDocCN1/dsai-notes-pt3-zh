- pgno: 360
  md: '# (1) 创建模型实体


    # 属性


    +   每个模型类型，对象类型以及关系类型都具有特殊的属性类型。


    +   通过使用属性，模型、对象和关系都可以用属性详细定义其特性


    +   对象属性反映了对象的附加信息，以后可以通过分析功能对这些信息进行评价。


    +   附加信息的例子：


    +   执行一个功能需多长时间？

    +   (时间属性组)


    +   执行一个功能需要多少成本？

    +   (成本属性组)


    +   以什么样的方式执行功能(手工，在线,...)?

    +   (过程类型属性组)'
  merge: -1
  img_proc: true
