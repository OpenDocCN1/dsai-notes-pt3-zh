- pgno: 605
  md: '+   - OCL很强调时间点。任何操作都定义为瞬时完成的，即操作中模型的状态不会改变。

    +   - 基于实现考虑，这么规定有一定的道理，不然在多线程系统中，OCL约束很有可能失效。另外 precondition 和 postcondition
    也明确规定是在方法执行的前后时间点才有约束，时间点不对约束无效。

    +   - OCL是一个声明式（Declarative）的语言。描述了 what to do，没有描述 how to do。

    +     - 如 self.attribute->select( i | i.name = ‘wxb_nudt’ )。

    +   - OCL是基于集合论和谓词逻辑的。这点从它的表达式中可以很轻易的看出来。这是OCL被列为MDA的支柱之一的原因。'
  merge: -1
  img_proc: true
