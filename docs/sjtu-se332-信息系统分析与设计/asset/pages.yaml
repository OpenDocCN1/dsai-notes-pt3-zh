- pgno: 504
  md: '# 3. 十进制码


    此法相当于图书分类中沿用已久的十进位分类码，它是由上下文关联区间码发展而成的。如 610. 736，小数点左边的数字组合代表主要分类，小数点右边的指出子分类。


    子分类划分虽然很方便，但所占位数长短不齐，不适于计算机处理。显然，只要把编码的位数固定下来，仍可利用计算机处理。'
  merge: -1
  img_proc: true
- pgno: 505
  md: '# 编码结构中的校验位


    +   - 保证正确输入，有意识地在编码设计结构中原有编码的基础上，另外加上一个校验位，使它事实上变成编码的一个组成部分。


    # 校验位可以发现以下各种错误：


    +   - 抄写错误，例如1写成7；

    +   - 易位错误，例如1234写成1324；

    +   - 双易错误，例如26913写成21963；

    +   - 随机错误，包括以上两种或三种综合性错误或其他错误。'
  merge: -1
  img_proc: true
- pgno: 506
  md: "# 校验位的确定示例\n\n校验位通过事先规定的数学方法计算出来。\n\n+   ◉ 如果编码设计方法中 共XXXX X，其中第五位为校验位，令A1\
    \ A2 A3 A4表示该编码的1-4位；则不妨取\n+   \n+   ◉ a5=MOD（a1＋2a2＋3a3＋4a4）,9]\n\n例如：\n\n```text\n\
    \      a1  a2  a3  a4  a5\n      5   1   3   2   6\nX)    1   2   3   4\n    \
    \  5＋2＋9＋8=24\n则a5＝（24/9）的余数=6\n```\n\n当编码51326错写为57326时，计算中便可得到a5=0，因此51326、57320为正确情况，可得出57326不能通过校验。"
  merge: -1
  img_proc: true
- pgno: 507
  md: '# 校验的方法


    # 确定校验位值的方法


    1. 算术级数法。

    原代码

    1 2 3 4 5

    各乘以权 6 5 4 3 2

    乘积之和

    6+10+12+12+10=50

    以 11 为模去除乘积之和，把得出的余数作为校验码：

    50 / 11=4…6

    因此代码为 123456。


    2. 几何级数法。

    原代码

    1 2 3 4 5

    各乘以权

    32 16 8 4 2

    乘积之和 32+32+24+16+10=114

    以 11 为模去除乘积之和，把得出的余数作为校验码：

    114 / 11=10…4

    因此代码为 123454。


    3. 质数法。

    原代码 1 2 3 4 5

    各乘以权

    17 13 7 5 3

    乘积之和

    17+26+21+20+15=99

    以 11 为模去除乘积之和，把得出余数作为校验码：

    99 / 11=9…0

    因此代码为 123450

    注意，以 11 为模时，若余数是 10，则按 0 处理。


    还有一种常见的确定方法是

    位数累加法。'
  merge: -1
  img_proc: true
