- pgno: 239
  md: '# 流程的性能指标


    性能指标（performance indicators）包括：


    +   外部性能指标(面向案例)：工作流环境所关注的一些方面，如平均完成时间和平均完成时间未定性指标。


    +   内部性能指标(面向资源)：从内部资源出发，如何提高外部性能，如资源利用率水平，在处理案例数量，周转量和回退的数量。


    +   分配额外资源来提高外部性能的方法往往是最后的选择，重构工作流结构和更好的分配策略来取得费用和性能的平衡更为重要。'
  merge: -1
  img_proc: true
