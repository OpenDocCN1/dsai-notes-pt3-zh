- pgno: 418
  md: '# 固定订货周期法


    按照固定的时间周期（1月或1周等）来订货，而订货数量则是变化的。一般都是事先依据对产品需求量的预测，确定一个比较恰当的最高库存额，在每个周期将要结束时，对存货进行盘点，决定订货量，货物到达后的库存量刚好到达原定的最高库存额


    # 固定订货周期法使用范围：


    +   1. 消费金额高，需要实施严密管理的重要物品；

    +   2. 需要经常调整生产或采购数量的物品；

    +   3. 需求量变动幅度大且变动具有周期性，但可正确判断的物品；

    +   4. 建筑工程、出口等可以确定的物品；

    +   5. 设计变更风险大的物品；

    +   6. 多种商品采购可以节省费用的情况；

    +   7. 需要定期知道的物品；

    +   8. 同品种物品分数保管、同品种物品向多家供货商订购、批量订货分批入库等订货、保管、入库不规则物品等。'
  merge: -1
  img_proc: true
- pgno: 419
  md: '# 固定订购量系统


    固定订购量系统的简化应用被称为分存控制法，有双堆法和三堆法等。双堆法是将订购点数量从库存量中分出，并单独存放或划以明显标志，当库存只剩下订购点一堆(或一箱)时即提出订购请求，每次订购固定数量的商品。三堆法是将安全库存再从订购点一堆中分出。


    双堆法和三堆法简便易行，无需经常盘点，没有持续的库存记录，可以直观地识别订购点以便及时组织订购。这种方法比较适合于价值低、备运时间短、供应充足的商品。


    # 固定订购量系统的优点：


    +   - 管理简便，订购时间和订购量不受人为判断的影响，保证库存管理的准确性；

    +   - 由于订购量一定，便于安排仓库内的作业活动，节约理货费用；

    +   - 便于按经济订购批量订购，节约库存总成本。


    # 缺点


    +   - 不便于对库存进行严格的管理；

    +   - 订购之前的各项计划比较复杂。'
  merge: -1
  img_proc: true
- pgno: 420
  md: '# （1）定量库存控制模型


    年总成本=年产品成本+年采购成本+年库存成本


    T_C = D×P + C×D/Q + H×Q/2    （条件 R=L_T+A）


    +   T_C ----年总成本


    +   D ----库存物料的年需求率（件/年）


    +   P ----单位产品成本（产品价格）


    +   C ----单位订货费用（元/次）


    +   Q ----订货批量


    +   R ----订货点


    +   H ----单位库存保管费用（元/件.年）


    +   L_T ----订货周期内物料的消耗量


    +   A ----安全库存量


    +   L ----订货提前期


    +   F ----单件库存保管费与单件库存购买费之比，即 F=H/P'
  merge: -1
  img_proc: true
- pgno: 421
  md: 'T_C = D × P + C × D/Q + H × Q/2


    Q = 2 × C × D/H = 2 × C × D / (F × P)


