- pgno: 467
  md: '# 计算方法


    +   - 收集数据（任务单、工作中心、工艺路线、工厂生产日历数据）

    +   - 计算负荷

    +   - 分析负荷情况

    +   - 能力/负荷调整

    +   - 确认能力需求计划


    工作中心加工物品的负荷计算如下：


    负荷=该物品产量×占用该工作中心的标准工时（或台时）


    +   - 能力－负荷≥0，则满足加工要求，能力富余（或刚好）。

    +   - 能力－负荷<0，则不能满足加工要求，能力不足。'
  merge: -1
  img_proc: true
