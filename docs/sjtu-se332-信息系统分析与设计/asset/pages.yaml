- pgno: 75
  md: '# 3.2.3 角色行为图RAD


    角色行为图RAD（Role Activity Diagram）是一种常见的流程图形化描述方法，主要用在组织建模中。


    RAD的基本思想是组成流程的活动按角色聚类，以便能从各角色执行的活动集把握它们的责任，而且可以把注意力集中在角色之间的交互活动上。


    它特别擅长强调流程中的角色职责。行为被表示为垂直的一串节点，水平线则表示人的参与。'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# RAD中采用了五种概念作为模型建立的出发点：


    +   角色：按角色划分过程，与角色相关联的是为完成这一角色而必需的资源；


    +   过程目标：表述了试图达到的状态集合；


    +   活动：前置状态和后续状态，确定了各个活动的发生顺序，形成一种时间流序列；


    +   角色间的交互作用:并不表明每个交互作用的物理形式，而是作用的意义，包括同步、对象的传递和互换。


    +   经营规则：企业用什么样的约束条件规定人们能做什么和应该怎么做，RAD包括了顺序、决策和并行等将它们联系在一起的经营规则；'
  merge: -1
  img_proc: true
