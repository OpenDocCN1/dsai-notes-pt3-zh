- pgno: 477
  md: '# 第2步：用倒序排产法计算每道工序的开工日期和完工日期


    所谓倒序排产法，是指将MRP确定的定单完成时间作为起点，然后安排各道工序，找出各工序的开工日期，进而得到MRP定单的最晚开工日期。


    以下仅以零件C为例，说明如何用倒序排产法计算每一批定单每道工序的开工日期和完工日期。


    由表可知，零件C的加工有两道顺序工序：工序10和工序20，这两道工序分别在工作中心15和20上完成。


    根据该题的已知条件：每周工作5天，每天工作6小时，每个工作中心有一位操作工，所有的工 作中心利用率和效率均为95%，可以得到各工作中心每天的可用能力为：8×1×0.95×0.95=22h；一周的最大可用能力为：22×5=36.1h


    根据MRP计划表，第1批C零件应在第3周周1早已在仓库中，因此其完成时间应该是第2周周5下午下班之前完成；由于最后一道工序20完成后，按计划还要安排1天运输时间，所以工序20的完工时间定在第2周周4的下班时间；工序20的生产时间为6.35h（见能力表），工作中心20每天的可用工时为22h，因此在工序20上的生产时间为6.35/22=0.88天（取整为1天）；而在在工作中心20前的排队时间和将工作中心15运输到工作中心20的时间都是1天，所以第2周的第2天和第3天用于运输和排队等待；工序10的完成时间应在第2周的第1天下班时间；工序10的生产时间为2天（12.10/22=1.68，取整为2天）。工序10的的开工时间为第1周第5天，由于还要有1天运输和1天等待，这样，这批定单的开工时间为第1周的第3天。'
  merge: -1
  img_proc: true
