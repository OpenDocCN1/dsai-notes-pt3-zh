- pgno: 562
  md: '# 示例：广告销售过程


    示例展示了销售网页上广告空间的广告销售过程。


    +   它拥有一个特定的定量目标，此目标包含了销售总额、成本总额以及年度预算。


    +   左侧是输入对象：信息资源猜测（Suspect）和预期（Prospect）。猜测是愿意做广告的公司的相关信息。期望则是那些已经表示对广告有购买兴趣的公司的相关信息。


    +   销售过程的成功就是订单（Order）。订单是抽象资源，因为它是客户与Sample业务公司之间的合约。


    +   参与销售过程的是销售人员（SalesPerson）和销售物资（SalesMaterial）。


    +   销售过程由销售经理和销售条款所控制，销售条款通常是一本指导手册，说明在公司中应如何指导销售工作。'
  merge: -1
