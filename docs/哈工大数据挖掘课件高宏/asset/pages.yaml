- pgno: 260
  md: '# 聚类中的属性类型


    +   - **Ordinal Variables 序数型变量**

    +     - 一个序数型变量即可以是离散的、也可以是连续的

    +     - Order is important, e.g., rank

    +     - Can be treated like interval-scaled

    +       - replace $x_{if}$ by their rank $r_{if} \in \{1, ......, M_f\}$

    +       - map the range of each variable onto [0, 1] by replacing $i$-th object
    in the $f$-th variable by $z_{if} = \frac{r_{if} - 1}{M_f - 1}$

    +       - compute the dissimilarity using methods for interval-scaled variables'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# 聚类中的属性类型


    +   - Ratio-Scaled Variables 比例标度

    +     - are continuous attributes of a nonlinear scale

    +     - three possible methods:

    +       - treat them like interval-scaled variables—*not a good choice!*

    +       - perform transformations, then treat them as interval-scaled attributes

    +         - e.g. Logarithmic transformation $y''i= log(xi)$

    +       - treat them as continuous ordinal attributes

    +         - replacing real values by ranks, mapping ranks to [0, 1], and then
    applying Minkowski distance'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# 聚类中的属性类型


    +   Attributes of mixed types

    +     transform the dissimilar measures of different kinds of attributes to a
    same range, e.g. [0, 1], then combine the dissimilar measures

    +     weights can be used to express the relative importance of the attributes

    +     example:

    +       $d(i, j) = \sum_{k} w_k d_{ij}^{A_k}$

    +     where $w_k$ is the weight of attribute $A_k$, $d_{ij}^{A_k}$ is the dissimilarity
    of the $i$-th object and the $j$-th object on attribute $A_k$. $d_{ij}^{A_k}$
    has already been normalized to [0, 1]'
  merge: -1
  img_proc: true
