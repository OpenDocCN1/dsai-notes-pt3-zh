- pgno: 2
  md: '# Potential Applications


    +   - Data analysis and decision support

    +     - Market analysis and management

    +       - Target marketing, customer relationship management (CRM), market basket
    analysis, cross selling, market segmentation

    +     - Risk analysis and management

    +       - Forecasting, customer retention, improved underwriting, quality control,
    competitive analysis

    +       - Fraud detection and detection of unusual patterns (outliers)

    +   - Other Applications

    +     - Text mining (news group, email, documents) and Web mining

    +     - Stream data mining

    +     - DNA and bio-data analysis


    # Evolution of Database Technology


    +   - 1960s:

    +     - Data collection, database creation, IMS and network DBMS

    +   - 1970s:

    +     - Relational data model, relational DBMS implementation

    +   - 1980s:

    +     - RDBMS, advanced data models (extended-relational, OO, deductive,...)

    +     - Application-oriented DBMS (spatial, scientific, engineering, etc.)

    +   - 1990s:

    +     - Data mining, data warehousing, multimedia databases, and Web databases

    +   - 2000s

    +     - Stream data management and mining

    +     - Data mining with a variety of applications

    +     - Web technology and global information systems


    # 1.2 What is data mining?


    Data mining is the non-trivial process of identifying valid, novel, potentially
    useful, and ultimately understandable patterns from huge volume of data


    > *varied from U. Fayyad, et al.''s definition of KDD at KDD''96


    从大量数据中抽取（隐含的、事先未知的、有价值的信息和模式的过程，这些新发现的规律、模式、信息和知识具有潜在的使用价值。


    +   - Why huge volume of data?

    +     - Analyzing small volume of data does not require data mining

    +   - Why non-trivial?

    +     - Data mining is a complex procedure

    +     - Large data volume

    +     - Data complexity

    +     - Different types of data

    +     - Different tasks

    +     - Multiple techniques involved

    +     - Domain knowledge is needed

    +   - Why valid?

    +     - Incorrect patterns are valueless


    +   - Why novel?

    +     - Investment on known-knowledge is wasteful

    +   - Why potentially useful?

    +     - Patterns will be used in decision making for future affairs

    +   - Why ultimately understandable?

    +     - Patterns will be presented to decision makers'
  merge: -1
  img_proc: true
- pgno: 3
  md: '# Data mining


    +   - Alternative names:

    +     Knowledge discovery (mining) in databases (KDD), knowledge extraction, data/pattern
    analysis, data archeology, data dredging, information harvesting, business intelligence,
    etc.


    ![](img/76d573223e44fade1c0950849390a4b3_3_0.png)


    # Data mining as an confluence of multiple disciplines


    # Database Techniques for Data Mining


    Database techniques and tools (SQL) are used for


    +   - Data storage

    +   - Access to data sources

    +   - Data selection and integration

    +   - Data preprocessing

    +   - Data mining and algorithms (Association Rule)

    +   - Deployment environment


    # Statistical Techniques for Data Mining


    Statistical techniques are used for


    +   - Data exploration

    +   - Data pre- and post-processing

    +   - Statistical model building

    +   - Model test and result verification


    # Machine Learning Techniques for Data Mining


    Machine Learning provides useful data mining algorithms such as


    +   - Decision tree induction

    +   - Neural networks

    +   - Conceptual clustering

    +   - Genetic algorithms

    +   - Genetic programming


    # Pattern Recognition Techniques for Data Mining


    Pattern recognition provides well developed techniques and methodologies for


    +   - Classification

    +   - Clustering

    +   - Feature selection

    +   - Result validation'
  merge: -1
  img_proc: true
