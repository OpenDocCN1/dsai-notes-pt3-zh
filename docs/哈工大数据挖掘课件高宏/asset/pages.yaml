  md: '# 3.1 Why preprocess the data?'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Why data preprocessing?


    +   - **Data in the real world is dirty**

    +     - 不完整的

    +       - 存在空值, 缺少感兴趣的属性或仅包含聚集数据

    +       - 例如: occupation=""

    +     - 含有噪声的

    +       - 含有错误或存在偏离期望的孤立点值

    +       - e.g., Salary="-10"

    +     - 不一致的

    +       - 数据值存在偏差

    +         - e.g., Age="42" Birthday="03/07/1997"

    +         - e.g., Was rating "1,2,3", now rating "A, B, C"

    +         - e.g., discrepancy between duplicate records'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Why data is dirty


    +   - **Incomplete data comes from**

    +     - 输入时认为是不重要的，而分析时是需要的

    +     - 人工理解错误、硬件设备故障等

    +   - **Noisy data comes from the process of data**

    +     - 收集数据的设备故障

    +     - 人工输入错误

    +     - 数据传输时

    +   - **Inconsistent data comes from**

    +     - 数据来源于不同的数据源，命名、编码不一致

    +     - 违背了函数依赖关系

    +   - 重复记录也需要清洗'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Why Is Data Preprocessing Important?


    +   - No quality data, no quality mining results!

    +     - How about mining those data directly?

    +       - although most mining routines have some ability of dealing with incomplete
    or noisy data, they are not always robust

    +       - most mining routines cannot deal with inconsistency

    +       - even without incompleteness, noise, and inconsistency, the size of the
    data may be too large to mine


    Data preprocessing usually occupies about 70% workload in a data mining task'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Why Is Data Preprocessing Important?


    +   • Data extraction, cleaning, and transformation comprises the majority of
    the work of building a data warehouse. — Bill Inmon


    > 数据预处理可以改进数据的质量，提高数据挖掘的精度'
  merge: -1
  img_proc: true
