- pgno: 265
  md: "# 聚类的准则函数\n\n+   误差平方和准则（sum-of-squared-error criterion）:\n+   \n+   $J_e =\
    \ \\sum_{i=1}^{k} \\sum_{X \\in C_i} |X - m_i|^2$\n\n+   其中 $X \\in C_i$, $m_i$\
    \ 是 $C_i$ 的质心\n\n+   $J_e$ 即所有样本的平方误差和。\n\n使生成的结果簇尽可能地紧凑和独立"
  merge: -1
