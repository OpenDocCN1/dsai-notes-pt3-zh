- pgno: 120
  md: '# 5.2.1 Apriori算法'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Apriori 算法


    # Main idea


    采用逐层搜索的迭代方法，利用*k*-项集探索*k+1*-项集。


    +   - 首先找出频繁1-项集的集合，记作*L₁*。


    +   - 利用*L₁*搜索、查找频繁2-项集的集合*L₂*，


    +   - 而*L₂*用于找*L₃*，


    +   - ……，如此下去，直到不能找到频繁*k*-项集。


    找每个*L_j*都需要一次数据库扫描'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Apriori 算法


    +   - *a priori knowledge*推理：

    +     - 频繁项集的所有非空子集必须也是频繁的

    +     - 观察

    +       - 若项集不满足最小支持度 *min_sup*，则不是频繁的，即 P(I) < *min_sup*。

    +       - 如果项A添加到I中，则结果项集{A} ∪ I 不可能比I更频繁出现。因此，{A} ∪ I 也不是频繁的。


    | T1 | Milk | bread | apple | eggs |

    | T2 | Milk | bread | sugar | eggs |

    | T3 | milk | bread | butter |  |

    | T4 | sugar | eggs |  |  |

    | T5 | beer | diaper | cigarette |  |

    | T6 | Pen | diaper | chewing gum |  |

    | T8 | milk | diaper | beer | eaa |


    {milk, eggs}是频繁的，{milk}和{eggs}也一定是频繁的


    {milk, eggs,bread}不会比{milk, eggs}更频繁出现'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Apriori 算法


    +   - 如何利用 $L_k$ 计算 $L_{k+1}$

    +     - 产生候选 $k+1$-项集 $C_{k+1}$

    +     - 扫描数据库，确定 $C_{k+1}$ 中每个候选项集的计数，从而得到 $L_{k+1}$。'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Apriori 算法


    +   如何产生候选 k+1-项集 C_{k+1}

    +   （假设事务或项集中的项已经按字典序排序）


    +   连接

    +   通过 L_k 与自己连接，产生候选 k+1-项集 C_{k+1}


    +   对于 L_k 中的任意两个项集 i_r、j_s，若 i 和 j_s 的前 k-1 个项是相同的，则产生新项集 i[1] i[2]... i[k] j_s[k]，并加入到
    C_{k+1} 中。


    +   裁减


    +   根据 Apriori 推理，对 C_{k+1} 进行裁减。'
  merge: -1
  img_proc: true
