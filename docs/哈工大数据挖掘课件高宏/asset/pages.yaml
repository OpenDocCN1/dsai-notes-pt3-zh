- pgno: 160
  md: '# Mining Frequent Patterns With FP-trees


    +   - **Idea: Frequent pattern growth**

    +     - Recursively grow frequent patterns by pattern and database partition

    +   - **Method**

    +     - For each frequent item, construct its conditional pattern-base, and then
    its conditional FP-tree

    +     - Repeat the process on each newly created conditional FP-tree

    +     - Until the resulting FP-tree is empty, or it contains only one path—single
    path will generate all the combinations of its sub-paths, each of which is a frequent
    pattern'
  merge: -1
  img_proc: true
