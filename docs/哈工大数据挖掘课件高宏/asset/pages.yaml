- pgno: 373
  md: '# 相关概念


    +   - **项集：** 一组项的非空集合. 每个项可以映射为一个整数

    +   - **序列：** 项集的一个有序列表.

    +   - **客户序列：** 按照交易时间递增的一个客户交易列表

    +   - **客户支持序列X：** 若在该客户序列中包含序列X

    +   - **序列的支持度：** 支持该序列的客户比例

    +   - **最大序列：** 不包含在任何其它序列中的序列

    +   - **频繁序列：** 满足最小支持度的序列'
  merge: -1
  img_proc: true
