- pgno: 257
  md: '# 聚类中的属性类型


    +   - 二元变量（属性）

    +     - 如果“0”和“1”两个状态是同等价值的，并有相同的权重，则该二元变量是对称的。

    +       - 例如，性别，两个取值“0”和“1”没有优先权。

    +       - 基于对称二元变量的相似度称为恒定的相似度。

    +       - 采用简单匹配系数评价两个对象之间的相异度：

    +         $d(i, j) = \frac{b + c}{a + b + c + d}$

    +     - 否则，则该二元变量是不对称的。

    +       - 通常，出现几率较小的结果编码为1。

    +       - 两个都取值1的情况(正匹配)被认为比两个都取值0的情况(负匹配)更有意义。

    +       - Jaccard coefficient: $d(i, j) = \frac{b + c}{a + b + c}$'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Example


    | Name | Gender | Fever | Cough | Test-1 | Test-2 | Test-3 | Test-4 |

    |------|--------|-------|-------|--------|--------|--------|--------|

    | Jack | M      | Y     | N     | P      | N      | N      | N      |

    | Mary | F      | Y     | N     | P      | N      | P      | N      |

    | Jim  | M      | Y     | P     | N      | N      | N      | N      |


    +   - gender 是一个对称的二元变量

    +   - 其它的都是非对称的二元变量

    +   - 将值 Y 和 P 编码为 1, 值 N 编码为 0, 根据 Jaccard 系数计算得：


    d ( jack , mary ) = (0 + 1) / (2 + 0 + 1) = 0.33


    d ( jack , jim ) = (1 + 1) / (1 + 1 + 1) = 0.67


    d ( jim , mary ) = (1 + 2) / (1 + 1 + 2) = 0.75'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# 聚类中的属性类型


    # Nominal attributes


    +   标称变量是二元变量的推广，它可以具有多于两个的状态，比如变量map_color可以有 red, yellow, blue, green四种状态。


    +   两种计算相异度的方法：


    +   Method 1:简单匹配方法


    +   m: # of matches, p: total # of variables


    d(i, j) = (p - m) / p


    +   Method 2:使用二元变量


