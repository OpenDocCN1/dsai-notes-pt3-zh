- pgno: 135
  md: '# How about the joinable Lₖ are not ordered and constrained?


    +   - for example, without those constraints, {I1, I3, I5} and {I1, I4, I5} will
    be joined to {I1, I3, I4, I5}

    +   - however, in Apriori, if {I1, I3, I4, I5} is a frequent itemset, it will
    be generated from {I1, I3, I4} and {I1, I3, I5}. Otherwise it will not be generated

    +     - therefore those constraints are useful in generating a relatively small
    set of candidate frequent itemsets

    +     - moreover, those constraints can avoid the cost of generating the same
    candidate frequent itemsets for several times'
