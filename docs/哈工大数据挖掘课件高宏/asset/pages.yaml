- pgno: 363
  md: "# 时间数据和序列数据挖掘\n\n# 趋势分析\n\n+   - 时序变量Y可以表示为时间的函数，即 $Y=f(t)$。\n+   - 表示数据随时间变化的情况\n\
    +   - 对Y给定一组值，即 $y_1,y_2,\\ldots$，如何确定数据的趋势？\n\n+   - $n$阶移动平均：\n+   \n+     $\\\
    frac{y_1+y_2+\\cdots+y_n}{n},\\ \\frac{y_2+y_3+\\cdots+y_{n+1}}{n},\\ \\frac{y_3+y_4+\\\
    cdots+y_{n+2}}{n},\\ldots$\n\n+   - 其它方法：$n$阶加权移动平均、徒手法、最小二乘法等等"
  merge: -1
  img_proc: true
