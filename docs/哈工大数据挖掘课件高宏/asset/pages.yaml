- pgno: 291
  md: '+   - AGglomerative NEStingan--agglomerative method 凝聚的层次聚类

    +   - 主要思想：采用自底向上策略：

    +     - 首先将每个样本作为一个簇，

    +     - 然后合并这些原子簇形成越来越大的簇，减少簇的数目，

    +     - 直到所有的样本都在一个簇中，或某个终止条件被满足。'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# 具体步骤


    +   - 初始化： 计算包含每对样本间距离（如欧氏距离）的相似矩阵，把每个样本作为一个簇；

    +   - 选择： 使用相似矩阵查找最相似的两个簇；

    +     - 两个簇间的相似度由这两个不同簇中距离最近的数据点对的相似度来确定——单链接方法 (Single-link)

    +   - 更新： 将两个簇合并为一个簇，簇的个数通过合并被更新；同时更新相似矩阵，将两个簇的两行（两列）距离用1行（1列）距离替换反映合并操作。

    +   - 重复： 执行n-1次步骤2和步骤3；

    +   - 结束： 当所有样本都合并成一个簇或满足某个终止条件时，整个过程结束。'
  merge: -1
  img_proc: true
