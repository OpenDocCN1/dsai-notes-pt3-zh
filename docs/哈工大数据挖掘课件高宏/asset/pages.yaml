- pgno: 303
  md: '# DIANA (Divisive Analysis)


    +   - 分裂的层次聚类

    +   - 主要思想：采用自顶向下策略

    +     - 首先将所有样本置于一个簇中；

    +     - 然后逐渐细分为越来越小的簇，来增加簇的数目；

    +     - 直到每个样本自成一个簇，或者达到某个终结条件。

    +       - 例如达到了某个希望的簇的数目或两个最近的簇之间的距离超过了某个阈值。'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# 7.2.2 Hierarchical methods


    +   - Issues in hierarchical methods

    +     - do not scale well for agglomerative clustering methods

    +     - can never undo what was done previously

    +   - Integration of hierarchical with distance-based clustering

    +     - BIRCH (1996): uses CF-tree and incrementally adjusts the quality of sub-clusters

    +     - CURE (1998): selects well-scattered points from the cluster and then shrinks
    them towards the center of the cluster by a specified fraction

    +     - CHAMELEON (1999): hierarchical clustering using dynamic modeling'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# 7.2.2 Hierarchical methods


    +   - BIRCH

    +     - Balanced Iterative Reducing and Clustering using Hierarchies

    +     - Two concepts

    +       - Clustering Feature

    +       - Clustering Feature Tree'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# 2.2 Hierarchical methods


    +   - **Clustering Feature Tree (CF Tree)**

    +     - A CF tree is a height-balanced tree that stores the clustering features
    for a hierarchical clustering

    +       - A nonleaf node in a tree has descendants or “children”

    +       - The nonleaf nodes store sums of the CFs of their children

    +     - A CF tree has two parameters

    +       - Branching factor: specify the maximum number of children.

    +       - threshold: max diameter of sub-clusters stored at the leaf nodes'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# CF Tree


    B = 7


    # Root


    | CF₁ | CF₂ | CF₃ | ..... | CF₆ |

    | child₁ | child₂ | child₃ |  | child₆ |


    # Non-leaf node


    | CF₁ | CF₂ | CF₃ | ..... | CF₅ |

    | child₁ | child₂ | child₃ |  | child₅ |


    # Leaf node


    # Leaf node


    | prev | CF₁ | CF₂ | ..... | CF₆ | next |


    | prev | CF₁ | CF₂ | ..... | CF₄ | next |'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# 7.2.2 Hierarchical methods


    +   - BIRCH

    +     - Incrementally construct a CF (Clustering Feature) tree

    +     - Phase 1: scan DB to build an initial in-memory CF tree (a multi-level
    compression of the data that tries to preserve the inherent clustering structure
    of the data)

    +       - 一个对象被插入到最近的叶子条目(子聚类)。如果在插入后存储在叶子节点中的子聚类的直径大于阈值，那么该叶子节点及可能有其 它节点被分裂。

    +       - 新对象插入后，关于该对象的信息向根节点传递。

    +       - 通过修改阈值，CF树的 大小可以改变。

    +     - Phase 2: use an arbitrary clustering algorithm to cluster the leaf nodes
    of the CF-tree'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# 7.2.2 Hierarchical methods


    +   - BIRCH


    +   - Advantage


    +   - *Scales linearly:* finds a good clustering with a single scan and improves
    the quality with a few additional scans


    +   - Weakness:


    +   - handles only numeric data, and sensitive to the order of the data record.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# 7.2.2 Hierarchical methods


    +   - CURE

    +     Clustering Using Representatives


    +   - 不用单个质心或对象来代表一个簇，而是选择数据空间中固定数目的具有代表性的点。


    +   - 一个簇的代表点通过如下方式产生：

    +     - 首先选择簇中分散的对象；

    +     - 然后根据一个特定的分数或收缩因子向簇中心“收缩”或移动它们


    +   - 在算法中的每一步，有最近距离的代表点对(每个点来自于不同的簇)的两个簇被合并。'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# 7.2.2 Hierarchical methods


    # CURE


    算法步骤：


    +   从源数据对象中抽取一个随机样本S；

    +   将样本S分割为一组划分；

    +   对每个划分局部地进行聚类；

    +   通过随机取样剔除孤立点。如果一个簇增长太慢就去掉它；

    +   对局部的簇进行聚类。

    +   用相应的簇标签来标记每个簇。'
  merge: -1
  img_proc: true
