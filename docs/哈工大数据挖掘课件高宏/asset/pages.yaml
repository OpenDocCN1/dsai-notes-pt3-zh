- pgno: 129
  md: '# Apriori算法流程


    Input: DB: database of transactions; min_sup: minimum support threshold


    Output: L: frequent itemsets in DB


    Method:


    +   1. C₁ = Itemsets of size one in I;

    +   2. Determine all frequent itemsets of size 1, L₁;

    +   3. i = 1;

    +   4. Repeat

    +   5. i = i + 1;

    +   6. Cᵢ = Apriori-Gen(Lᵢ₋₁);

    +   7. Count Cᵢ to determine Lᵢ;

    +   8. until no more frequent itemsets found;'
  merge: -1
  img_proc: true
- pgno: 130
  md: "# Apriori算法流程（cont.）\n\n生成辅助频繁k+1-项集\n\n```\nprocedure apriori_gen(L_k: frequent\
    \ k-itemsets; min_sup: minimum support)\n  for each itemset l1 ∈ L_k\n    for\
    \ each itemset l2 ∈ L_k\n      if (l1[1] = l2[1]) ∧ (l1[2] = l2[2]) ∧ ... ∧ (l1[k-1]\
    \ = l2[k-1]) ∧ (l1[k] < l2[k]) then {\n        c = l1 ⋈ l2; // join step: generate\
    \ candidates\n        if has_infrequent_subset(c, L_k) then\n          delete\
    \ c; //prune step:remove unfruitful candidate\n        else add c to C_{k+1};\n\
    \      }\n  return C_{k+1};\n```"
  merge: -1
  img_proc: true
- pgno: 131
  md: "# Apriori算法流程 (cont.)\n\n对辅助频繁k+1-项集的裁减\n\n```\nprocedure has_infrequent_subset(c:\
    \ candidate (k+1)-itemset; L_k: frequent k-itemsets)\nfor each k-subset s of c\n\
    \  if s ∉ L_k then\n    return TRUE;\nreturn FALSE;\n```"
  merge: -1
  img_proc: true
- pgno: 132
  md: "# 生成关联规则\n\n```\nInput:\n    D        //Database of transactions\n    I   \
    \     //Items\n    L        //Large itemsets\n    s        //Support\n    α  \
    \      //Confidence\nOutput:\n    R        //Association Rules satisfying s and\
    \ α\nARGen Algorithm:\n    R = ∅;\n    for each l ∈ L do\n        for each x ⊂\
    \ l such that x ≠ ∅ and x ≠ l do\n            if support(l) / support(x) ≥ α then\n\
    \                R = R ∪ {x ⇒ (l − x)};\n```"
  merge: -1
  img_proc: true
