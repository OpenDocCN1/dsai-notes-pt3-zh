  md: "# 簇间的距离度量标准\n\n+   用于簇 $C_i$ 和簇 $C_j$ 之间的距离度量标准是：\n+   - 最小距离：\n+     $D_{\\\
    min}(C_i, C_j) = \\min |X_i - X_j|$ \n+     其中 $X_i \\in C_i$ 和 $X_j \\in C_j$\n\
    +   - 最大距离：\n+     $D_{\\max}(C_i, C_j) = \\max |X_i - X_j|$ \n+     其中 $X_i \\\
