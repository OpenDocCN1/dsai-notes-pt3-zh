- pgno: 206
  md: '# How to construct a decision tree?(cont.)


    +   - Other Attribute Selection Measures

    +     - Gain ratio

    +     - a shortcoming of information gain is its preference to attributes with
    lots of values. In order to overcome this shortcoming, J. R. Quinlan used gain
    ratio in C4.5 instead of information gain


    ```

    Gain_ratio(A) = Gain(A) / IV(A)

    ```


    ```

    IV(A) = - sum_{j=1}^{v} (S''_j / S) log_2 (S''_j / S)

    ```


    where attribute A is selected to partition the instance set into the subsets {S''_1,
    S''_2, ..., S''_v}'
  merge: -1
  img_proc: true
- pgno: 207
  md: "# How to construct a decision tree?(cont.)\n\n# Other Attribute Selection Measures\n\
    \n+   - Gini index (CART, IBM Intelligent Miner)\n\n+   - S: training set\n\n\
    +   - S_i: training instances of class C_i (i= 1, ..., m)\n\n+   - a_j: values\
    \ of attribute A (j= 1, ..., v)\n\n+   - the gini of S is\n+   \n+   Gini(S) =\
    \ 1 - Σ_{i=1}^{m} (S_i / S)^2\n\n+   - suppose attribute A is selected to partition\
    \ the instance set into the subsets {S'_1, S'_2, ..., S'_v}, then the gini of\
    \ A is\n+   \n+   Gini(A) = Σ_{j=1}^{v} (S'_j / S) Gini(S'_j)\n\nthe attribute\
    \ provides the smallest gini is chosen to split the node"
  merge: -1
  img_proc: true
