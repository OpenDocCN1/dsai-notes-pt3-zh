  md: '# Closed Patterns and Max-Patterns


    # Closed pattern


    +   - An itemset X is closed if X is frequent and there exists no super-pattern
    Y ⊃ X, with the same support as X

    +   - proposed by Pasquier, et al. (ICDT’99)

    +   - Example

    +     - ‘acdf’, ‘cef’, ‘ae’,

    +     - ‘cf’, ‘a’, and ‘e’

    +     - are frequent closed itemsets


    A lossless compression of freq. patterns mining!


    Min_sup=2


    | TID | Items |

    | --- | ----- |

    | 10 | a, c, d, e, f |

    | 20 | a, b, e |

    | 30 | c, e, f |

    | 40 | a, c, d, f |

    | 50 | c, e, f |'
