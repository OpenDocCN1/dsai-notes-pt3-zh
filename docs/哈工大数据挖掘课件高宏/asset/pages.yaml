- pgno: 230
  md: '# No Free Lunch


    Generally, there is no algorithm which is consistently better than other algorithms


    The No Free Lunch Theorem states that if an algorithm performs well on a certain
    class of problems then it necessarily pays for that with degraded performance
    on the set of all remaining problems


    +   - D.H. Wl olpert and W.G. Macready. No free lunch theorems for search. IEEE
    TEC, 1997, 1(1): 67-82

    +   - D.H. Wolpert and W.G. Macready. No free lunch theorems for optimization.
    Tech. Rep. SFI-TR-95-02-010, Santa Fe Institute, 1995.


    Different algorithms usually have different pros and cons, therefore, it is important
    to know the real strength (weakness) of an algorithm and when should it be used'
  merge: -1
  img_proc: true
