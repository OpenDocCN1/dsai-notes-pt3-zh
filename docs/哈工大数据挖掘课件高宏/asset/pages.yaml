- pgno: 233
  md: '# Linear regression and multiple regression


    +   - Linear regression

    +   - 数据用直线建模：

    +     Y=α+βX，其中，


    +   - α和β是回归系数，分别表示直线在Y轴的截距和直线的斜率。

    +   - α和β可以用最小二乘法求解。

    +   - 给定s个样本或形如(x₁,y₁),(x₂,y₂),....,(xₛ,yₛ)的数据点，回归系数α和β可以用下式计算：


    β = Σᵢ(xᵢ - x̄)(yᵢ - ȳ) / Σᵢ(xᵢ - x̄)²      α = ȳ - βx̄


    其中，x̄是x₁,x₂,...,xₛ的平均值，ȳ是y₁,y₂,...,yₛ的平均值'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Linear regression and multiple regression


    +   - **Multiple regression**

    +     - 响应变量Y是一个多维特征向量的线性函数。

    +     - Y=α+βX₁+χX₂+δX₃+……

    +     - 其中，可以用最小二乘法求解系数α, β, χ, δ等。'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Nonlinear regression


    +   - **Polynomial regression 多项式回归**

    +     - data are modeled to fit a polynomial function

    +       $Y = \alpha + \beta_1 X + \beta_2 X^2 + \beta_3 X^3 + ......$

    +     - it can be converted to linear regression problem, e.g. $X_1 = X$, $X_2
    = X^2$, $X_3 = X^3$, ......

    +     - there are also nonlinear regression models that cannot be converted to
    a linear model. For such cases, it may be possible to obtain least-square estimates
    through extensive calculations on more complex formulae'
  merge: -1
