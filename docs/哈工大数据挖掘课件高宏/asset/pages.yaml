- pgno: 251
  md: '# 聚类中的属性类型


    +   Interval-valued variables区间标度


    区间标度变量的度量单位直接影响聚类分析的结果。


    +   例如，将高度的度量单位由“米”改为“英寸”，可能产生非常不同的聚类结果


    为避免对度量单位选择的依赖，数据应当标准化。

    给定一个变量f的度量值，可以进行如下变换：


    +   计算平均的绝对偏差：


    s_f = 1/n (|x_1f - m_f| + |x_2f - m_f| + ... + |x_nf - m_f|)


    +   Where m为均值


    +   计算标准化的度量值 (Z-score) m_f = 1/n (x_1f + x_2f + ... + x_nf)


    z_if = (x_if - m_f) / s_f'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# 聚类中的属性类型


    +   - 距离度量

    +     - 两个常用的距离度量方法

    +     - suppose there are n attributes, two tuples (x_i1, ..., x_in) and (x_j1,
    ..., x_jn)

    +     - Euclidean distance 欧几里得距离

    +     - Manhattan distance 曼哈顿距离


    ```

    d(i, j) = sqrt(|x_i1 - x_j1|^2 + |x_i1 - x_j1|^2 + ... + |x_in - x_jn|^2)

    ```


    ```

    d(i, j) = |x_i1 - x_j1| + |x_i1 - x_j1| + ... + |x_in - x_jn|

    ```'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# 距离度量满足如下要求：


    +   d(i, j) ≥0    距离是一个非负的数值

    +   d(i, i) =0    一个对象与自身的距离是 0

    +   d(i, j) = d(j, i)    距离函数具有对称性

    +   d(i, j) ≤ d(i, h) + d(h, j)    三角不等式'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# 其它的距离度量


    +   Minkowski distance(明考斯基距离，欧几里得距离与曼哈坦距离的概括)


    d(i, j) = (|x_{i1} - x_{j1}|^q + |x_{i1} - x_{j1}|^q + … + |x_{in} - x_{jn}|^q)^{1/q}


    +   if the attributes have different importance, *weights* can be used:


    d(i, j) = (w_1|x_{i1} - x_{j1}|^q + w_2|x_{i1} - x_{j1}|^q + … + w_n|x_{in} -
    x_{jn}|^q)^{1/q}'
