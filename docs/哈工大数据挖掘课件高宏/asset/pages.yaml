  md: '# 数据的描述特征


    +   - 度量数据的中心趋势

    +     - 数据集的“中心”最常用、最有效的数值度量是（算术）均值。

    +       $$\bar{x}=\frac{1}{n}\sum_{i=1}^{n}x_i$$

    +     - 加权算术均值

    +       $$\bar{x}=\frac{\sum_{i=1}^{n}w_i x_i}{\sum_{i=1}^{n}w_i}$$


    > 问题：对极端值（如离群点）很敏感。

    > 即使很少量极端值也可能影响均值'
