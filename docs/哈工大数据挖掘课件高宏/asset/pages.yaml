- pgno: 384
  md: "# Algorithm--- Sequence Phase\n\n+   - AprioriAll\n\n```\nL₁ = {large 1-sequences};\
    \ // Result of the phase\nfor ( k=2; Lₖ₋₁ ≠ ∅; k++ ) do\n  begin\n  Cₖ = New candidate\
    \ generate from Lₖ₋₁\n  foreach customer-sequence c in the database do\n    Increment\
    \ the count of all candidates in Cₖ that are contained in c\n  Lₖ = Candidates\
    \ in Cₖ with minimum support.\nEnd\nAnswer=Maximal Sequences in Uₖ Lₖ;\n```"
  merge: -1
  img_proc: true
