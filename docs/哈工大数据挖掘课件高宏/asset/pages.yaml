- pgno: 217
  md: '# Naive Bayesian classifier


    +   - 假定有 $m$ 个类：$C_1, C_2, ……, C_m$

    +   - $n$ 个属性：$A_1, A_2, ……, A_n$

    +   - 每个数据样本用一个 $n$ 维特征向量 $X=(x_1,x_2,…,x_n)$ 表示，其中 $x_k$ 是 $X$ 在属性 $A_k$ 上的取值

    +   - 给定一个未知的数据样本 $X$(即没有类标号)，分类法将预测 $X$ 属于具有最高后验概率(条件 $X$ 下)的类。即，朴素贝叶斯分类将未知的样本分配给类
    $C_i$，当且仅当 $P(C_i|X)>P(C_j|X)$ for $1\leq j\leq m,j\ne i$

    +   - $P(C_i|X)$ 最大的类 $C_i$ 称为最大后验假设。'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Naive Bayesian classifier


    +   - 根据贝叶斯定理

    +     $$P(C_i|X)=\frac{P(X|C_i)P(C_i)}{P(X)}$$


    +   - 由于 P(X) 对所有类是一个常数, 因此只需要 P(X|C_i)P(C_i) 最大即可。

    +     - P(C_i) 可以用 S_i/S 来估计, 其中 S_i 是类 C_i 中的训练样本数, 而 S 是训练样本的总数


    如何计算 P(X|Ci)?'
  merge: -1
  img_proc: true
