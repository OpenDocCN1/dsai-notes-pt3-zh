  md: "\n## Data warehouse Scenario 1\n\nA hotel franchise analytical applications:\n\
    \n- To compile statistics on average occupancy and average room rate to *determine*\
    \ revenue generated per room\n- To gather statistics on market share and data\
    \ from customer surveys from each hotel to *determine* its competitive position\
    \ in various markets\n- Such trends can be analyzed year by year, month by month\
    \ and day by day, giving the corporation a picture of how each individual hotel\
    \ is faring\n\n## Industry Sectors where DW is Heavily Used\n\n## Data intensive\
    \ and service oriented\n\n- Telecommunication\n- Banking\n- Insurance\n- Retail\n\
    - Manufacturing\n- Government\n- ...\n\n## 什么是数据仓库\n\n- 什么是数据仓库\n\n> “A data warehouse\
    \ is a subject-oriented, integrated, time-variant, and nonvolatile collection\
    \ of data in support of management’s decision-making process.”\n> \n> -- W.H.Inmon.\
    \ 1992\n\n## 什么是数据仓库\n\n- 数据仓库的四个主要特征\n\n- 数据仓库是面向主题的(Subject-Oriented)\n\n数据仓库的数据是以分析主题为中心来组织的。主题是一个抽象的概念，是企业决策分析所涉及的分析对象。按照面向主题的方式进行数据组织时，首先确定主题，然后根据主题，确定相应的数据内容\n\
    \n例如，若企业决策人员预分析客户的财务信息，则需要把关于客户的各种财务信息综合在“Customer Financial”这一主题中。\n\n## 什么是数据仓库\n\
    \n- 数据仓库的四个主要特征\n  - 数据仓库是集成的（Integrated）\n    - 数据仓库的数据来自于多个不同的数据源。\n    - 多个数据源经常是异种或异构的，存在数据重复和语义不一致问题\n\
    \    - 不是对这些数据源中某些数据的复制，而是对这些数据源中数据的进一步抽象。\n    - 它需要按照统一的结构、一致的格式、一致的度量单位、一致的语义，从不同的数据源提取数据并进行清洗、转换、综合、抽象，最后集成为面向主题的数据集合，确保数据的综合性、宏观性和一致性。\n\
    \n## 什么是数据仓库\n\n- 数据仓库的四个主要特征\n  - 数据仓库是随时间不断变化的(Time-Variant)\n    - 数据仓库中的数据是历史数据，应该随时间的延长不断增加新的数据内容。（周期性更新）\n\
    \    - 数据仓库中的数据是综合数据，这些综合数据一般都与时间有关，如按照时间段进行综合的数据。这些综合数据要随着时间的延长而不断地变化。\n\n| Time\
    \ | Data |\n|------|------|\n| 01/97 | Data for January |\n| 02/97 | Data for\
    \ February |\n| 03/97 | Data for March |\n\nData Warehouse\n\n![](img/76d573223e44fade1c0950849390a4b3_27_0.png)\n\
    \n## 什么是数据仓库\n\n- **数据仓库的四个主要特征**\n  - 数据仓库是非易失的(Non-Volatile)\n    - 数据仓库的数据主要供企业决策分析之用,很少进行修改,\
    \ 所涉及的数据操作主要有两类:\n      - 数据加载\n      - 数据查询和联机分析\n    - 数据仓库的数据一般都是历史数据，是对多个不同数据源进行统计、综合和重组后导出的数据。只要数据源中与数据仓库相关的数据不发生改变，数据仓库中的数据就不应该被改变。\n\
    \    - 一般来说，无需事务管理、并发控制与恢复等机制\n\n## Business Subject Areas\n\n## 什么是数据仓库\n\n-\
    \ 商业智能(Business Intelligence,BI)\n  - Purpose: Enable decision makers to access,\
    \ analyze and share information\n  - the process of turning business data into\
    \ information and knowledge to support decision making.\n  - an enterprise business\
    \ strategy\n\n## DBMS vs. DWMS\n\n- **OLTP（联机事务处理）**\n  On-Line Transaction Processing\n\
    \  - Major task of traditional relational DBMS\n  - Day-to-day operations: purchasing,\
    \ inventory, banking, manufacturing, payroll, registration, accounting, etc.\n\
    \n## DBMS vs. DWMS\n\n- **OLAP（联机分析处理）**\n  On-Line Analytical Processing\n  -\
    \ Major task of data warehouse system\n  - Data analysis and decision making\n\
    \  - Dr. Ted Codd and OLAP rules\n    - 1993\n    - 1995\n\n## DBMS vs. DWMS\n\
    \n|  | DBMS | DWMS |\n|---|---|---|\n| 具有功能 | OLTP | OLAP |\n| 数据视图 | 当前的 | 历史的\
    \ |\n|  | 细粒度的 | 综合的 |\n|  | 局部的 | 集成的 |\n| 设计目的 | 面向应用 | 面向分析 |\n| 查询 | 90%事先可知道\
    \ | 90%是ad hoc的 |\n|  | update | read-only but complex queries |\n|  | 一次操作所涉及的数据量小\
    \ | 一次操作所涉及的数据量大 |\n| 开发周期 | 需求驱动 | 数据驱动 |\n\n## 2.2 多维数据模型\n\n## 多维数据集合\n\n-\
    \ A data warehouse is based on a **multidimensional data model**\n  - data can\
    \ be modeled and viewed in multiple dimensions\n- 数据仓库由若干多维数据集合组成\n- 一个多维数据集合对应一个分析主题\n\
    \n销售额\n\n地区\n\n## 多维数据集\n\n- 一个多维数据集包含两类数据：\n  - 度量属性\n    - 描述决策者进行分析计算用的数值型数据，是分析、统计的对象，如销售额、销售量。\n\
    \    - 在度量属性上的计算函数一般都是聚集函数，如计算均值、最大值等。\n\n## 维度属性\n\n## 度量属性\n\n| 销售时间 | 生产厂家\
    \ | 产品名 | 销售地点 | 销售量 | 销售额 |\n|---|---|---|---|---|---|\n| 2003 | 一汽 | 轿车 | 哈尔滨\
    \ | 1万 | 20亿 |\n| 2003 | 一汽 | 轿车 | 北京 | 4万 | 80亿 |\n| 2002 | 二汽 | 卡车 | 武汉 | 5千\
    \ | 5亿 |\n| 2002 | 二汽 | 卡车 | 广州 | 1万 | 10亿 |\n\n一个面向汽车销售主题的数据集合\n\n## 多维数据集合\n\
    \n- Sales volume as a function of product, month, and region\n\nDimensions: Product,\
    \ Location, Time\n\nHierarchical summarization paths\n\nRegion\n\nProduct\n\n\
    Month\n\n![](img/76d573223e44fade1c0950849390a4b3_41_0.png)\n\nIndustry\nCategory\n\
    Product\n\nRegion\nCountry\nCity\nOffice\n\nYear\nQuarter\nMonth\nDay\nWeek\n"
