- raw:
  - '[PAGE 273]


    # 由5个点组成的聚类分析二维样本：

    X₁=(0,2),X₂=(0,0),X₃=(1.5,0),X₄=(5,0),X₅=(5,2), k=2。


    ![](img/76d573223e44fade1c0950849390a4b3_273_0.png)


    第1步：由样本的随机分布形成两个簇：

    C₁={X₁,X₂,X₄}和C₂={X₃,X₅}。

    这两个簇的质心M₁和M₂是：

    M₁={(0+0+5)/3,(2+0+0)/3}={1.66, 0.66}；

    M₂={(1.5+5)/2, (0+2)/2}={3.25, 1.00}；'
  - '[PAGE 274]


    M₁={1.66, 0.66};   M₂={3.25, 1.00};


    计算： $J_e = \sum_{i=1}^{k} \sum_{X \in C_i} |X - m_i|^2$


    # 样本初始随机分布之后，方差是：


    +   e₁²=[(0−1.66)²+(2−0.66)²]+[(0−1.66)²+(0−0.66)²]+[(5−1.66)²+(0−0.66)²]=19.36;


    +   e₂²=8.12;


    # 总体误差平方是：


    E²=e₁²+e₂²=19.36+8.12=27.48'
  - '[PAGE 275]


    # 第2步：取距离其中一个质心（M₁或M₂）最小的距离分配所有样本，簇内样本的重新分布如下：


    +   - d(M₁,X₁)=(1.66²+1.34²)¹/²=2.14

    +   - d(M₂,X₁)=3.40 ==> X₁ ∈ C₁;

    +   - d(M₁,X₂)=1.79 和 d(M₂,X₂)=3.40 ==> X₂ ∈ C₁

    +   - d(M₁,X₃)=0.83 和 d(M₂,X₃)=2.01 ==> X₃ ∈ C₁

    +   - d(M₁,X₄)=3.41 和 d(M₂,X₄)=2.01 ==> X₄ ∈ C₂

    +   - d(M₁,X₅)=3.60 和 d(M₂,X₅)=2.01 ==> X₅ ∈ C₂


    新簇 C₁ = { X₁,X₂,X₃ } 和 C₂ = { X₄,X₅ }


    ![](img/76d573223e44fade1c0950849390a4b3_275_0.png)'
  - '[PAGE 276]


    ![](img/76d573223e44fade1c0950849390a4b3_276_0.png)


    # 第3步：计算新的质心：


    +   M₁ = {0.5, 0.67} ; M₂ = {5.0, 1.0} .


    +   相应的方差及总体平方误差分别是：


    +   e₁²=4.17; e₂²=2.00; E=6.17;


    可以看出第一次迭代后，总体误差显著减小（从值27.48到6.17）。在这个简单的例子中，第一次迭代同时也是最后一次迭代，因为如果继续分析新中心和样本间的距离，样本将会全部部分给同样的簇，不将重新分配，算法停止。'
  - '[PAGE 277]


    # Comments on the K-Means Method


    +   - **Comment:** Often terminates at a *local optimum*. The *global optimum*
    may be found using techniques such as: *deterministic annealing* and *genetic
    algorithms*

    +   - **Weakness**

    +     - Applicable only when *mean* is defined, then what about categorical data?

    +     - Need to specify *k*, the *number* of clusters, in advance

    +     - Unable to handle noisy data and *outliers*'
  - '[PAGE 278]


    # Variations of the K-Means Method


    +   - A few variants of the *k-means* which differ in

    +     - Selection of the initial *k* means

    +     - Dissimilarity calculations

    +     - Strategies to calculate cluster means

    +   - Handling categorical data: *k-modes*

    +   - A mixture of categorical and numerical data: *k-prototype* method'
  - '[PAGE 279]


    ▪ The k-means algorithm is **sensitive to outliers** !


    ▫ Since an object with an extremely large value may substantially **distort the
    distribution of the data.**


    ▪ 不适于发现大小很不相同的簇或具有凹状的簇


    ![](img/76d573223e44fade1c0950849390a4b3_279_0.png)'
  - '[PAGE 280]


    # medoids method


    +   - 不采用簇中对象的平均值作为参照点，而选用簇中位置最中心的对象，即中心点。

    +   - That is each cluster is represented by one of the objects near the center
