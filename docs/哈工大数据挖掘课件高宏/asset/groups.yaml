- raw:
  - '[PAGE 3]


    # Data mining


    +   - Alternative names:

    +     Knowledge discovery (mining) in databases (KDD), knowledge extraction, data/pattern
    analysis, data archeology, data dredging, information harvesting, business intelligence,
    etc.


    ![](img/76d573223e44fade1c0950849390a4b3_3_0.png)


    # Data mining as an confluence of multiple disciplines


    # Database Techniques for Data Mining


    Database techniques and tools (SQL) are used for


    +   - Data storage

    +   - Access to data sources

    +   - Data selection and integration

    +   - Data preprocessing

    +   - Data mining and algorithms (Association Rule)

    +   - Deployment environment


    # Statistical Techniques for Data Mining


    Statistical techniques are used for


    +   - Data exploration

    +   - Data pre- and post-processing

    +   - Statistical model building

    +   - Model test and result verification


    # Machine Learning Techniques for Data Mining


    Machine Learning provides useful data mining algorithms such as


    +   - Decision tree induction

    +   - Neural networks

    +   - Conceptual clustering

    +   - Genetic algorithms

    +   - Genetic programming


    # Pattern Recognition Techniques for Data Mining


    Pattern recognition provides well developed techniques and methodologies for


    +   - Classification

    +   - Clustering

    +   - Feature selection

    +   - Result validation'
  - '[PAGE 4]


    # Visualization Techniques for Data Mining


    +   - Visualization is a new technology and very important in data mining.

    +   - Human beings are superior in picking up irregularities from visualized information


    # Data Mining: A KDD Process


    +   - Data mining—core of knowledge discovery process


    # Steps of a KDD Process


    +   - Learning the application domain

    +     - relevant prior knowledge and goals of application

    +   - Creating a target data set: data selection

    +   - Data cleaning and preprocessing: (may take 60% of effort!)

    +   - Data reduction and transformation

    +     - Find useful features, dimensionality/variable reduction, invariant representation.

    +   - Choosing functions of data mining

    +     - summarization, classification, regression, association, clustering.

    +   - Choosing the mining algorithm(s)

    +   - Data mining: search for patterns of interest

    +   - Pattern evaluation and knowledge presentation

    +     - visualization, transformation, removing redundant patterns, etc.

    +   - Use of discovered knowledge


    # Architecture of a typical data mining system


    # 1.3 Data Mining: On what kind of data?


    # Data Mining: On What Kinds of Data?


    +   - Relational database

    +   - Data warehouse

    +   - Transactional database

    +   - Advanced database and information repository

    +     - Object-relational database

    +     - Spatial and temporal data

    +     - Time-series data

    +     - Stream data

    +     - Multimedia database: audio, video, image

    +     - Heterogeneous and legacy database

    +     - Text databases & WWW

    +     - DNA sequence'
  - '[PAGE 5]


    # Examples: Relational Data


    Table: Acme Investors Incorporated

    Customer ID | Account Type | Margin Account | Transaction Type | Transaction Month
    | Sex | Age | Favorite Destination | Annual Income

    12345 | Joint | No | Online | 12.5 | F | 20-29 | Paris | 40-50K

    ...


    +   - Semantics

    +     - This relational table represents a set of objects, i.e., customers.

    +     - Each row/record represents a particular customer

    +     - Each column gives values for an attribute or variable for each of the
    customers

    +     - Attributes are defined in different data types, numeric/categorical.


    +   - Data mining questions

    +     1. Can I find a general profile of different investor types? (CLASSIFICATION)

    +     2. What characteristics distinguish between Online and Broker investors?
    (DISCRIMINATION)

    +     3. Can I develop a model that can predict the average trade/month for a
    new investor? (PREDICTION)


    # Examples: Spatial Data


    ![](img/76d573223e44fade1c0950849390a4b3_5_0.png)


    # Spatial Data Mining Examples


    +   - Find cancer clusters to locate hazardous environments

    +   - Predict habitat suitable for endangered species

    +   - Characterize effects of human activities on environment and ecology(生态学)

    +     - Ex. Predict effect of El Nino (厄尔尼诺现象) on weather


    # Temporal Data: Group Similar Time Series


    ![](img/76d573223e44fade1c0950849390a4b3_5_1.png)


    # Web Log Data


    Typical Data in a Server Access Log


    ```

    128.252.1.1 - - [09/Aug/1998:05:03:02 -0400] "GET /images/ HTTP/1.0" 304 0

    mega.cs.umn.edu - - [09/Aug/1998:05:03:02 -0400] "GET / HTTP/1.0" 200 321

    ...

    ```


    Access Log Format

    IP address userid time method url protocol status size

    mega.cs.umn.edu - - 09-Aug-1998 09:54:31 GET /advisor/sci-faq.html

    Other Server Logs: referrer logs, agent logs


    # Web Log Mining


    ![](img/76d573223e44fade1c0950849390a4b3_5_2.png)'
