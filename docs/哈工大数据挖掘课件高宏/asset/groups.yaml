    \ model building\n- Model test and result verification\n\n## Machine Learning\
    \ Techniques for Data Mining\n\nMachine Learning provides useful data mining algorithms\
    \ such as\n\n- Decision tree induction\n- Neural networks\n- Conceptual clustering\n\
    - Genetic algorithms\n- Genetic programming\n\n## Pattern Recognition Techniques\
    \ for Data Mining\n\nPattern recognition provides well developed techniques and\
    \ methodologies for\n\n- Classification\n- Clustering\n- Feature selection\n-\
    \ Result validation\n\n## Visualization Techniques for Data Mining\n\n- Visualization\
    \ is a new technology and very important in data mining.\n- Human beings are superior\
    \ in picking up irregularities from visualized information\n\n## Data Mining:\
    \ A KDD Process\n\n- Data mining—core of knowledge discovery process\n\n## Steps\
    \ of a KDD Process\n\n- Learning the application domain\n  - relevant prior knowledge\
    \ and goals of application\n- Creating a target data set: data selection\n- Data\
    \ cleaning and preprocessing: (may take 60% of effort!)\n- Data reduction and\
    \ transformation\n  - Find useful features, dimensionality/variable reduction,\
    \ invariant representation.\n- Choosing functions of data mining\n  - summarization,\
    \ classification, regression, association, clustering.\n- Choosing the mining\
    \ algorithm(s)\n- Data mining: search for patterns of interest\n- Pattern evaluation\
    \ and knowledge presentation\n  - visualization, transformation, removing redundant\
    \ patterns, etc.\n- Use of discovered knowledge\n\n## Architecture of a typical\
    \ data mining system\n\n### 1.3 Data Mining: On what kind of data?\n\n## Data\
    \ Mining: On What Kinds of Data?\n\n- Relational database\n- Data warehouse\n\
    - Transactional database\n- Advanced database and information repository\n  -\
    \ Object-relational database\n  - Spatial and temporal data\n  - Time-series data\n\
    \  - Stream data\n  - Multimedia database: audio, video, image\n  - Heterogeneous\
    \ and legacy database\n  - Text databases & WWW\n  - DNA sequence\n\n## Examples:\
    \ Relational Data\n\nTable: Acme Investors Incorporated\n\n| Customer ID | Account\
    \ Type | Margin Account | Transaction Type | Transaction Month | Sex | Age | Favorite\
    \ Destination | Annual Income |\n|---|---|---|---|---|---|---|---|---|\n| 12345\
    \ | Joint | No | Online | 12.5 | F | 20-29 | Paris | 40-50K |\n| ... |  |  | \
    \ |  |  |  |  |  |\n\n- Semantics\n  - This relational table represents a set\
    \ of objects, i.e., customers.\n  - Each row/record represents a particular customer\n\
    \  - Each column gives values for an attribute or variable for each of the customers\n\
    \  - Attributes are defined in different data types, numeric/categorical.\n\n\
    - Data mining questions\n  1. Can I find a general profile of different investor\
    \ types? (CLASSIFICATION)\n  2. What characteristics distinguish between Online\
    \ and Broker investors? (DISCRIMINATION)\n  3. Can I develop a model that can\
    \ predict the average trade/month for a new investor? (PREDICTION)\n\n## Examples:\
    \ Spatial Data\n\n![](img/76d573223e44fade1c0950849390a4b3_5_0.png)\n\n## Spatial\
    \ Data Mining Examples\n\n- Find cancer clusters to locate hazardous environments\n\
    - Predict habitat suitable for endangered species\n- Characterize effects of human\
    \ activities on environment and ecology(生态学)\n  - Ex. Predict effect of El Nino\
    \ (厄尔尼诺现象) on weather\n\n## Temporal Data: Group Similar Time Series\n\n![](img/76d573223e44fade1c0950849390a4b3_5_1.png)\n\
    \n## Web Log Data\n\nTypical Data in a Server Access Log\n\n```\n128.252.1.1 -\
    \ - [09/Aug/1998:05:03:02 -0400] \"GET /images/ HTTP/1.0\" 304 0\nmega.cs.umn.edu\
    \ - - [09/Aug/1998:05:03:02 -0400] \"GET / HTTP/1.0\" 200 321\n...\n```\n\nAccess\
