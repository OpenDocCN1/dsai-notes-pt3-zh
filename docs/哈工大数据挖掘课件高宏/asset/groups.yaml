    \ of frequent patterns\n  - A subset of max-pattern is frequent\n  - A superset\
    \ of max-pattern is infrequent\n- 如果频繁项集F 的所有超集都是非频繁项集，那么称F为最大频繁项集，所有F的集合称为最大频繁项集集合\
    \ (maximum frequent sets).\n- 显然，任何频繁项集都是最大频繁项集的子集。\n- 发现所有频繁项集的问题可以转化为发现所有最大频繁项集的问题.\n\
    - BCDE, ACD are max-patterns\n- BCD is not a max-pattern\n\nMin_sup=2\n\n| Tid\
    \ | Items |\n| --- | ----- |\n| 10 | A,B,C,D,E |\n| 20 | B,C,D,E |\n| 30 | A,C,D,F\
    \ |\n\n![](img/76d573223e44fade1c0950849390a4b3_167_0.png)\n\n### 支持度-置信度框架的局限\n\
    \n- 支持度的缺陷\n  - 很多潜在的有意义的模式由于包含支持度小的项而被删除\n- 置信度问题\n  - 例如：\n    - 产生关联规则：{茶}\
    \ -> {咖啡}\n    - 支持度：15%，置信度75%\n\n| | 咖啡 | 非咖啡 | 合计 |\n|---|---|---|---|\n| 茶\
    \ | 150 | 50 | 200 |\n| 非茶 | 650 | 150 | 800 |\n| 合计 | 800 | 200 | 1000 |\n\n\
    但是，所有人中，不管他是否喝茶，喝咖啡的人的比例为80%，而喝咖啡的饮者却只占75%。\n\n这意味着，一个人如果喝茶，则他喝咖啡的可能性由80%降到75%。\n\
    \n因此，尽管规则{茶} -> {咖啡}有很高的置信度，但是它却是一个误导！\n\n> Strong association rules may not be\
