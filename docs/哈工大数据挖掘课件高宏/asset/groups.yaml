  - '[PAGE 303]


    # DIANA (Divisive Analysis)


    +   - 分裂的层次聚类

    +   - 主要思想：采用自顶向下策略

    +     - 首先将所有样本置于一个簇中；

    +     - 然后逐渐细分为越来越小的簇，来增加簇的数目；

    +     - 直到每个样本自成一个簇，或者达到某个终结条件。

    +       - 例如达到了某个希望的簇的数目或两个最近的簇之间的距离超过了某个阈值。'
  - '[PAGE 304]


    # 7.2.2 Hierarchical methods


    +   - Issues in hierarchical methods

    +     - do not scale well for agglomerative clustering methods

    +     - can never undo what was done previously

    +   - Integration of hierarchical with distance-based clustering

    +     - BIRCH (1996): uses CF-tree and incrementally adjusts the quality of sub-clusters

    +     - CURE (1998): selects well-scattered points from the cluster and then shrinks
    them towards the center of the cluster by a specified fraction

    +     - CHAMELEON (1999): hierarchical clustering using dynamic modeling'
  - '[PAGE 305]


    # 7.2.2 Hierarchical methods


