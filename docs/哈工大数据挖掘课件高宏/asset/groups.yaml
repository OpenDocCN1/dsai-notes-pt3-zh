  md: "\n## 聚类中的属性类型\n\n### Nominal attributes\n\n- 标称变量是二元变量的推广，它可以具有多于两个的状态，比如变量\
    \ map_color 可以有 red, yellow, blue, green 四种状态。\n\n- 两种计算相异度的方法：\n\n  - Method\
    \ 1：简单匹配方法\n\n    - $m$: # of matches, $p$: total # of variables\n\n    $$d(i,\
    \ j) = (p - m) / p$$\n\n  - Method 2：使用二元变量\n\n    - 为每一个状态创建一个新的二元变量，可以用非对称的二元变量来编码标称变量。\n\
    \n### Ordinal Variables 序数型变量\n\n- 一个序数型变量既可以是离散的、也可以是连续的\n- Order is important,\
    \ e.g., rank\n- Can be treated like interval-scaled\n  - replace $x_{if}$ by their\
    \ rank $r_{if} \\in \\{1, \\ldots, M_f\\}$\n  - map the range of each variable\
    \ onto [0, 1] by replacing $i$-th object in the $f$-th variable by $z_{if} = \\\
    frac{r_{if} - 1}{M_f - 1}$\n  - compute the dissimilarity using methods for interval-scaled\
    \ variables\n\n### Ratio-Scaled Variables 比例标度\n\n- are continuous attributes\
    \ of a nonlinear scale\n- three possible methods:\n  - treat them like interval-scaled\
    \ variables—*not a good choice!*\n  - perform transformations, then treat them\
    \ as interval-scaled attributes\n    - e.g. Logarithmic transformation $y_i =\
    \ \\log(x_i)$\n  - treat them as continuous ordinal attributes\n    - replacing\
    \ real values by ranks, mapping ranks to [0, 1], and then applying Minkowski distance\n\
    \n### Attributes of mixed types\n\n- transform the dissimilar measures of different\
    \ kinds of attributes to a same range, e.g. [0, 1], then combine the dissimilar\
    \ measures\n- weights can be used to express the relative importance of the attributes\n\
    - example:\n\n$$d(i, j) = \\sum_{k} w_k d_{ij}^{A_k}$$\n\nwhere $w_k$ is the weight\
    \ of attribute $A_k$, $d_{ij}^{A_k}$ is the dissimilarity of the $i$-th object\
    \ and the $j$-th object on attribute $A_k$. $d_{ij}^{A_k}$ has already been normalized\
    \ to [0, 1].\n\n## 簇间的距离度量标准\n\n用于簇 $C_i$ 和簇 $C_j$ 之间的距离度量标准是：\n\n- 最小距离：\n\n\
    $$D_{\\min}(C_i, C_j) = \\min |X_i - X_j|$$\n\n其中 $X_i \\in C_i$ 和 $X_j \\in C_j$\n\
    \n- 最大距离：\n\n$$D_{\\max}(C_i, C_j) = \\max |X_i - X_j|$$\n\n其中 $X_i \\in C_i$\
    \ 和 $X_j \\in C_j$\n\n- 均值距离：\n\n$$D_{mean}(C_i,C_j) = |m_i - m_j|$$\n\n其中 $m_i$\
    \ 和 $m_j$ 是 $C_i$ 和 $C_j$ 的质心\n\n- 平均距离：\n\n$$D_{avg}(C_i,C_j) = \\frac{1}{n_i\
    \ n_j} \\sum \\sum |X_i - X_j|$$\n\n其中 $X_i \\in C_i$ 和 $X_j \\in C_j$，且 $n_i$\
    \ 和 $n_j$ 是类 $C_i$ 和 $C_j$ 中的样本数。\n\n## 聚类的准则函数\n\n- 误差平方和准则（sum-of-squared-error\
    \ criterion）：\n\n$$J_e = \\sum_{i=1}^{k} \\sum_{X \\in C_i} |X - m_i|^2$$\n\n\
    其中 $X \\in C_i$，$m_i$ 是 $C_i$ 的质心。\n\n$J_e$ 即所有样本的平方误差和。\n\n使生成的结果簇尽可能地紧凑和独立。\n\
    \n## 7.2 聚类挖掘\n\n- 基于划分的算法\n- 层次算法\n- 基于密度的方法\n- 基于网格的方法\n- 基于模型的方法\n\n### 7.2.1\
    \ Partitioning methods\n\n- 划分方法的基本思想是，给定一个 *n* 个样本的数据库和参数 *k*，划分方法将数据划分为 *k*\
    \ 个划分（*k<=n*），每个划分表示一个簇，同时满足：\n  - 每个簇至少包含一个样本；\n  - 每个样本必须属于且仅属于一个簇。\n\n- each\
    \ cluster is represented by the mean value of the data in the cluster\n- each\
    \ cluster is represented by one of the objects near the center of the cluster\n\
    \n- k-means, k-medoids, k-modes\n- PAM (Partition Around Medoids)\n- CLARA (Clustering\
    \ LARGE Applications)\n- CLARANS (Clustering LARGE Applications based upon Randomized\
    \ Search)\n\n### The K-Means Clustering Method\n\n- 以簇中对象的平均值作为参照点\n  - each cluster\
    \ is represented by the mean value of the data in the cluster\n- 最小化所有对象与其参照点之间的相异度之和\n\
    \n- Given *k*, the *k-means* algorithm is implemented in four steps:\n  - 选择一个含有随机选择样本的*k*个簇的初始划分，计算这些簇的质心。\n\
    \  - 根据欧氏距离把剩余的每个样本分配到距离它最近的簇质心的一个划分。\n  - 计算被分配到每个簇的样本的均值向量，作为新的簇的质心。\n  - 重复2,3直到*k*个簇的质心点不再发生变化或平方误差准则最小。\n\
    \n#### Example\n\nK=2\n\nArbitrarily choose K object as initial cluster center\n\
    \nAssign each objects to most similar center\n\nUpdate the cluster means\n\nreassign\n\
    \nreassign\n\nUpdate the cluster means\n\n![](img/76d573223e44fade1c0950849390a4b3_272_0.png)\n\
    \n![](img/76d573223e44fade1c0950849390a4b3_272_1.png)\n\n![](img/76d573223e44fade1c0950849390a4b3_272_2.png)\n\
    \n![](img/76d573223e44fade1c0950849390a4b3_272_3.png)\n\n![](img/76d573223e44fade1c0950849390a4b3_272_4.png)\n"
