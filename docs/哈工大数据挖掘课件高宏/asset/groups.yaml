  mdcn: "\n## How to construct a decision tree?\n\n- a tree is constructed in a top-down\
    \ recursive divide-and-conquer manner\n  - 首先，所有训练实例位于根节点\n  - 所有属性都是可分类的属性（若为连续值，则事先离散化）\n\
    \  - 根据选择的属性，对实例进行划分\n    - a selected attribute is also called a split or a test\n\
