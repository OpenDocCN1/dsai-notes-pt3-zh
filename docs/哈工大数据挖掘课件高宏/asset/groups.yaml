    # 基于多维数组的实现方法


    +   - 使用多维数组来存储多维数据集合。

    +   - 多维数据集合的维属性值被用作数组的维索引，确定多维数据集合中每个点在多维数组中的位置。维属性值不需要被存储。

    +   - 多维数据集合的度量属性值表示点的数据值。

    +   - 例如，使用多维数组存储元组（长虹彩电, 中央百货, 1998, 2030）时，我们只需在数组中存储度量属性 sales 的值 2030。2030
    在数组中的位置则由维属性值（长虹彩电、中央百货、1998）计算得到。'
