    \nTwo parameters:\n\n- ε-邻域：给定对象半径ε内的区域称为该对象的ε-邻域。ε是邻域的最大半径。\n- MinPts: 某个点的ε-邻域内的最少对象个数；\n\
    \nN_ε(p): 对象p的ε-邻域内的所有对象的集合\n\n{q belongs to D | dist(p,q) <=ε}\n\nCore object\
    \ (CO)\n\n- P is called a core object if |N_ε(P)|≥ MinPts, given ε and MinPts.\n\
    \n## Density Concepts\n\n- Directly density reachable (DDR)\n\n给定一个对象集合 D，如果 p\
    \ 是在 q 的 ε -邻域内，而 q 是一个核心对象，则对象 p 从对象 q 出发是直接密度可达的(directly density-reachable)。\n\
    \n![](img/76d573223e44fade1c0950849390a4b3_317_0.png)\n\nMinPts = 5\nEps = 1 cm\n\
    \n## Density Concepts\n\n### Density reachable\n\n如果存在一个对象链 p₁, ..., pₙ, p1=q,\
    \ pₙ=p, pᵢ∈D, (1≤i≤n), pᵢ₊₁ 是从 pᵢ 关于 ε 和 MinPts 直接密度可达的，则对象 p 是从对象 q 关于 ε 和 MinPts\
    \ 密度可达的 (density-reachable)。\n\n![](img/76d573223e44fade1c0950849390a4b3_318_0.png)\n\
    \n## Density Concepts\n\n### Density-connected\n\n如果对象集合 D 中存在一个对象 O，使得对象 p 和\
    \ q 是从 O 关于 ε 和 MinPts 密度可达的，那么对象 p 和 q 是关于 ε 和 MinPts 密度相连的。\n\n![](img/76d573223e44fade1c0950849390a4b3_319_0.png)\n\
    \n## Density Concepts\n\n- 密度可达是直接密度可达的传递闭包，这种关系是非对称的\n- 只有核心对象之间是相互密度可达的。\n-\
    \ 而密度相连性是一个对称的关系。\n\n![](img/76d573223e44fade1c0950849390a4b3_321_0.png)\n\n##\
    \ DBSCAN\n\n### Density-Based Spatial Clustering of Applications with Noise\n\n\
    基于高密度连接区域的聚类方法\n\n- 一个基于密度的簇是：基于密度可达性的最大的密度相连对象的集合。\n- 不包含在任何簇中的对象被认为是“噪声”。\n\
    - Discovers clusters of arbitrary shape in spatial databases with noise\n\n##\
    \ DBSCAN\n\n### 算法步骤\n\n- Arbitrary select a point *p*\n- Retrieve all points\
    \ density-reachable from *p* w.r.t *ε* and *MinPts*.\n- If *p* is a core point,\
    \ a cluster is formed.\n- If *p* is a border point, no points are density-reachable\
    \ from *p* and DBSCAN visits the next point of the database.\n- Continue the process\
    \ until all of the points have been processed.\n\n## DBSCAN\n\nOutlier\n\nBorder\n\
    \nCore\n\nEps = 1cm\nMinPts = 5\n\n## Grid-based method\n\n- Using multi-resolution\
    \ grid data structure\n- 将空间量化为有限数目的单元，这些单元形成网格结构，所有的聚类操作都在网格上进行。\n- 优点：\n  -\
    \ 处理速度快，处理时间独立于数据对象的数目，仅依赖于量化空间中每一维上的单元数目。\n- Several interesting methods\n  -\
    \ STING (a STatistical INformation Grid approach) by Wang, Yang and Muntz (1997)\n\
    \  - WaveCluster by Sheikholeslami, Chatterjee, and Zhang (VLDB’98)\n    - A multi-resolution\
    \ clustering approach using wavelet method\n  - CLIQUE: Agrawal, et al. (SIGMOD’98)\n\
    \n## Model-based method\n\n- a model-based method hypothesizes a model for each\
    \ of the clusters, and finds the best fit of the data to that model\n- representatives:\n\
    \  - COBWEB\n  - CLASSIT\n  - AutoClass\n  - Competitive learning\n  - SOM (Self-Organizing\
    \ Maps)\n\n## 离群点发现\n\n- 什么是离群点?\n  - The set of objects are considerably dissimilar\
    \ from the remainder of the data\n  - Example: Sports: Michael Jordon, Wayne Gretzky,\
    \ ...\n- 问题\n  - Find top n outlier points\n- 应用:\n  - Credit card fraud detection\n\
    \  - Telecom fraud detection\n  - Customer segmentation\n  - Medical analysis\n"
