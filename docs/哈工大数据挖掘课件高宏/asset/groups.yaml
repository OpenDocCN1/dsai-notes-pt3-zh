    ## Apriori算法流程（cont.）\n\n生成辅助频繁k+1-项集\n\n```\nprocedure apriori_gen(L_k: frequent\
    \ k-itemsets; min_sup: minimum support)\n  for each itemset l1 ∈ L_k\n    for\
    \ each itemset l2 ∈ L_k\n      if (l1[1] = l2[1]) ∧ (l1[2] = l2[2]) ∧ ... ∧ (l1[k-1]\
    \ = l2[k-1]) ∧ (l1[k] < l2[k]) then {\n        c = l1 ⋈ l2; // join step: generate\
    \ candidates\n        if has_infrequent_subset(c, L_k) then\n          delete\
    \ c; //prune step:remove unfruitful candidate\n        else add c to C_{k+1};\n\
    \      }\n  return C_{k+1};\n```\n\n## Apriori算法流程 (cont.)\n\n对辅助频繁k+1-项集的裁减\n\
    \n```\nprocedure has_infrequent_subset(c: candidate (k+1)-itemset; L_k: frequent\
    \ k-itemsets)\nfor each k-subset s of c\n  if s ∉ L_k then\n    return TRUE;\n\
    return FALSE;\n```\n\n## 生成关联规则\n\n```\nInput:\n    D        //Database of transactions\n\
    \    I        //Items\n    L        //Large itemsets\n    s        //Support\n\
    \    α        //Confidence\nOutput:\n    R        //Association Rules satisfying\
    \ s and α\nARGen Algorithm:\n    R = ∅;\n    for each l ∈ L do\n        for each\
    \ x ⊂ l such that x ≠ ∅ and x ≠ l do\n            if support(l) / support(x) ≥\
    \ α then\n                R = R ∪ {x ⇒ (l − x)};\n```\n"
