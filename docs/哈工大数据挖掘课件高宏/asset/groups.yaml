    \ | 2500 |\n| Sum(col.) | 6000 | 4000 | 10000 |\n\nlift = P(A ∩ B) / P(A)P(B)\n\
    \nP(video ∩ game)=4000/10000=0.4\n\nP(video)=7500/10000=0.75    P(game)=6000/10000=0.6\n\
