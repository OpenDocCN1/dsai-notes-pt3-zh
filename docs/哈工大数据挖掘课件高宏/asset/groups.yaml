    \  - 聚类方法中使用的相似性度量\n  - 聚类的实现方法\n- 对聚类方法好坏的评价\n  - 发现（一些/所有）隐含模式的能力\n\n## 什么是聚类分析？\n\
    \n- **数据样本X：**\n  由*d*个属性值组成： X = (x₁, x₂, ..., x_d)，其中x_i表示样本中的各属性，*d*是样本或样本空间的维数（或属性个数）\n\
    - **数据样本集：**\n  记为{X₁, X₂, ..., Xₙ}，第i个样本记为X_i = {x_i1, ..., x_id}\n- **簇C_i:\
    \ Cluster C_i**\n  数据样本集分成*k*个簇，每个簇是相应数据样本的集合，相似样本在同一簇中，相异样本在不同簇中。\n\n- 用下面的特征来描述簇：\n\
    \n簇的质心（centroid）：（样本的平均值）是簇的“中间值”（middle），但并不需要是簇中实际点。\n\n令 $n_i$ 表示簇 $C_i$ 中样本的数量，$m_i$\
    \ 表示对应样本的均值：\n\ncentroid = $m_i = \\frac{1}{n_i} \\sum_{X \\in C_i} X$\n\n## 数据结构\n\
    \n- 数据矩阵\n\n许多情况下，聚类的样本集看成是一个n×d的数据矩阵 (n个样本×d个属性)\n\n- 相异矩阵\n\n描述n个样本两两之间的近似性\n\
    \nd(X_i, X_j)是样本X_i和样本X_j间相异性的量化表示\n\nith-instance\n\nf-th attribute\n\nDissimilarity\
    \ between the 2nd and the 3rd instance\n\n## 相似性度量\n\nX_i{x_i1,...,x_in}和X_j{x_j1,...,x_jn}是两个具有n个属性的两个样本。距离度量标准d(X_i,\
    \ X_j)表示第i个样本与第j个样本间的距离。\n\n在聚类分析中，最常用的距离度量标准是d维空间中的欧几里德距离：\n\n$d(i,j)=\\sqrt{|x_{i1}-x_{j1}|^2+|x_{i2}-x_{j2}|^2+\\\
    cdots+|x_{in}-x_{jn}|^2}$\n\n## 类中的属性类型\n\n- 不同类型的属性需要使用不同的相异性度量\n  - Interval-scaled\
    \ variables 区间标度变量\n    - 是一个粗略线性标度的连续度量\n    - 例如：重量和高度、经度和纬度、以及大气温度\n  - Binary\
    \ variables 二元变量\n    - 只有两个值：0、1\n  - Nominal, ordinal, and ratio variables\n\
    \    标称型、序数型和比例标度型变量\n  - Variables of mixed types 混合类型\n\n## 聚类中的属性类型\n\n- Interval-valued\
    \ variables区间标度\n\n区间标度变量的度量单位直接影响聚类分析的结果。\n\n- 例如，将高度的度量单位由“米”改为“英寸”，可能产生非常不同的聚类结果\n\
    \n为避免对度量单位选择的依赖，数据应当标准化。\n给定一个变量f的度量值，可以进行如下变换：\n\n- 计算平均的绝对偏差：\n\ns_f = 1/n (|x_1f\
    \ - m_f| + |x_2f - m_f| + ... + |x_nf - m_f|)\n\n- Where m为均值\n\n- 计算标准化的度量值 (Z-score)\
    \ m_f = 1/n (x_1f + x_2f + ... + x_nf)\n\nz_if = (x_if - m_f) / s_f\n\n## 聚类中的属性类型\n\
    \n- 距离度量\n  - 两个常用的距离度量方法\n  - suppose there are n attributes, two tuples (x_i1,\
    \ ..., x_in) and (x_j1, ..., x_jn)\n  - Euclidean distance 欧几里得距离\n  - Manhattan\
    \ distance 曼哈顿距离\n\n```\nd(i, j) = sqrt(|x_i1 - x_j1|^2 + |x_i2 - x_j2|^2 + ...\
    \ + |x_in - x_jn|^2)\n```\n\n```\nd(i, j) = |x_i1 - x_j1| + |x_i2 - x_j2| + ...\
    \ + |x_in - x_jn|\n```\n\n## 距离度量满足如下要求：\n\n- d(i, j) ≥0    距离是一个非负的数值\n- d(i,\
    \ i) =0    一个对象与自身的距离是 0\n- d(i, j) = d(j, i)    距离函数具有对称性\n- d(i, j) ≤ d(i, h)\
    \ + d(h, j)    三角不等式\n\n## 其它的距离度量\n\n- Minkowski distance(明考斯基距离，欧几里得距离与曼哈坦距离的概括)\n\
    \nd(i, j) = (|x_{i1} - x_{j1}|^q + |x_{i2} - x_{j2}|^q + … + |x_{in} - x_{jn}|^q)^{1/q}\n\
