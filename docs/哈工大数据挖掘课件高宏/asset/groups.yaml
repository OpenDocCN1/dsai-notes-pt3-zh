    \ $A_k$ 上的取值\n- 给定一个未知的数据样本 $X$(即没有类标号)，分类法将预测 $X$ 属于具有最高后验概率(条件 $X$ 下)的类。即，朴素贝叶斯分类将未知的样本分配给类\
    \ $C_i$，当且仅当 $P(C_i|X)>P(C_j|X)$ for $1\\leq j\\leq m,j\\ne i$\n- $P(C_i|X)$ 最大的类\
    \ $C_i$ 称为最大后验假设。\n\n## Naive Bayesian classifier\n\n- 根据贝叶斯定理\n  $$P(C_i|X)=\\\
    frac{P(X|C_i)P(C_i)}{P(X)}$$\n- 由于 P(X) 对所有类是一个常数, 因此只需要 P(X|C_i)P(C_i) 最大即可。\n\
    \  - P(C_i) 可以用 S_i/S 来估计, 其中 S_i 是类 C_i 中的训练样本数, 而 S 是训练样本的总数\n\n如何计算 P(X|Ci)?\n"
  mdcn: "\n## 属性age具有最高信息增益，因此成为判定树根节点的测试属性\n\n| income | student | credit_rating\
    \ | class |\n|---|---|---|---|\n| high | no | fair | no |\n| high | no | excellent\
    \ | no |\n| medium | no | fair | no |\n| low | yes | fair | yes |\n| medium |\
    \ yes | excellent | yes |\n\n| income | student | credit_rating | class |\n|---|---|---|---|\n\
    | medium | no | fair | yes |\n| low | yes | fair | yes |\n| low | yes | excellent\
    \ | no |\n| medium | yes | fair | yes |\n| medium | no | excellent | no |\n\n\
    | income | student | credit_rating | class |\n|---|---|---|---|\n| high | no |\
    \ fair | yes |\n| low | yes | excellent | yes |\n| medium | no | excellent | yes\
    \ |\n| high | yes | fair | yes |\n\n![](img/76d573223e44fade1c0950849390a4b3_205_0.png)\n\
    \n## How to construct a decision tree?(cont.)\n\n- Other Attribute Selection Measures\n\
    \  - Gain ratio\n  - a shortcoming of information gain is its preference to attributes\
    \ with lots of values. In order to overcome this shortcoming, J. R. Quinlan used\
    \ gain ratio in C4.5 instead of information gain\n\n```\nGain_ratio(A) = Gain(A)\
    \ / IV(A)\n```\n\n```\nIV(A) = - sum_{j=1}^{v} (S'_j / S) log_2 (S'_j / S)\n```\n\
    \nwhere attribute A is selected to partition the instance set into the subsets\
    \ {S'_1, S'_2, ..., S'_v}\n\n## How to construct a decision tree?(cont.)\n\n###\
    \ Other Attribute Selection Measures\n\n- Gini index (CART, IBM Intelligent Miner)\n\
    - S: training set\n- S_i: training instances of class C_i (i= 1, ..., m)\n- a_j:\
    \ values of attribute A (j= 1, ..., v)\n- the gini of S is\n\nGini(S) = 1 - Σ_{i=1}^{m}\
    \ (S_i / S)^2\n\n- suppose attribute A is selected to partition the instance set\
    \ into the subsets {S'_1, S'_2, ..., S'_v}, then the gini of A is\n\nGini(A) =\
    \ Σ_{j=1}^{v} (S'_j / S) Gini(S'_j)\n\nthe attribute provides the smallest gini\
    \ is chosen to split the node\n\n## Extracting Classification Rules from Trees\n\
    \n- Represent the knowledge in the form of IF-THEN rules\n- One rule is created\
    \ for each path from the root to a leaf\n- Each attribute-value pair along a path\
    \ forms a conjunction\n- The leaf node holds the class prediction\n- Rules are\
    \ easier for humans to understand\n\nIF age = \"<=30\" AND student = \"no\" THEN\
    \ buys_computer = \"no\"\nIF age = \"<=30\" AND student = \"yes\" THEN buys_computer\
    \ = \"yes\"\nIF age = \"31...40\" THEN buys_computer = \"yes\"\nIF age = \">40\"\
    \ AND credit_rating = \"excellent\" THEN buys_computer = \"yes\"\nIF age = \"\
    <=30\" AND credit_rating = \"fair\" THEN buys_computer = \"no\"\n\n![](img/76d573223e44fade1c0950849390a4b3_209_0.png)\n\
    \n## 6.2.2 Bayesian Classification\n\n- Basic concepts\n- Naive Bayesian classifier\n\
    \n## Basic concepts\n\n- Bayesian classifiers have exhibited high accuracy and\
    \ fast speed when applied to large databases\n- What is Bayesian classification\n\
    \  - based on Bayes theorem\n\n## Basic concepts\n\n- 假设X为一个数据样本，其类标识未知\n- H为一个假设：\
    \ X属于类-C\n- 分类问题可以描述为： 确定 P(H/X):\n  - 在已知样本X的情况下，H成立的概率\n\n## Basic concepts\n\
    \n- P(H|X) is the posterior probability(后验概率), 或条件X下H的后验概率\n  - Example\n  - 假设数据样本由水果组成，用它们的颜色和形状描述。\n\
    \  - 假设X表示红色和圆的，H表示假设X是苹果，则\n  - P(H|X)反映当我们看到X是红色并且是圆的时，我们对X是苹果的确信程度。\n\n## Basic\
    \ concepts\n\n- P(H): prior probability of hypothesis H\n  - Example\n  - 任意给定的数据样本为苹果的概率，而不管数据样本看上去如何。\n\
    - 后验概率P(H|X)比先验概率基于更多的信息(如背景知识)。\n- P(H)独立于X\n\n## Basic concepts\n\n- **P(X|H)是条件H下，X的后验概率**\n\
    \  - X表示红色和圆的，H表示假定X是苹果\n  - P(X|H)是“X是红色的且为圆的”的概率。\n- **P(X)是X的先验概率**\n  - 由水果中取出一个数据样本是“红色的且为圆的”的概率\n\
    \n## Basic concepts\n\n- **Bayes theorem**\n\nP(H|X) = P(X|H)P(H) / P(X)\n\n##\
    \ Naive Bayesian classifier\n\n- 假定有 $m$ 个类：$C_1, C_2, ……, C_m$\n- $n$ 个属性：$A_1,\
    \ A_2, ……, A_n$\n- 每个数据样本用一个 $n$ 维特征向量 $X=(x_1,x_2,…,x_n)$ 表示，其中 $x_k$ 是 $X$ 在属性\
    \ $A_k$ 上的取值\n- 给定一个未知的数据样本 $X$(即没有类标号)，分类法将预测 $X$ 属于具有最高后验概率(条件 $X$ 下)的类。即，朴素贝叶斯分类将未知的样本分配给类\
    \ $C_i$，当且仅当 $P(C_i|X)>P(C_j|X)$ for $1\\leq j\\leq m,j\\ne i$\n- $P(C_i|X)$ 最大的类\
    \ $C_i$ 称为最大后验假设。\n\n## Naive Bayesian classifier\n\n- 根据贝叶斯定理\n  $$P(C_i|X)=\\\
    frac{P(X|C_i)P(C_i)}{P(X)}$$\n- 由于 P(X) 对所有类是一个常数, 因此只需要 P(X|C_i)P(C_i) 最大即可。\n\
    \  - P(C_i) 可以用 S_i/S 来估计, 其中 S_i 是类 C_i 中的训练样本数, 而 S 是训练样本的总数\n\n如何计算 P(X|Ci)?\n"
