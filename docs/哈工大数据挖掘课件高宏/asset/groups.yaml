  - "[PAGE 169]\n\n# 支持度-置信度框架的局限\n\n+   支持度的缺陷\n+   \n+   很多潜在的有意义的模式由于包含支持度小的项而被删除\n\
    \n+   置信度问题\n+   \n+   例如：\n+   产生关联规则：{茶} -> {咖啡}\n+   支持度：15%，置信度75%\n\n| |\
    \ 咖啡 | 非咖啡 | |\n|---|---|---|\n| 茶 | 150 | 50 | 200 |\n| 非茶 | 650 | 150 | 800\
    \ |\n|  | 800 | 200 | 1000 |\n\n但是，所有人中，不管他是否喝茶，喝咖啡的人的比例为80%，而喝咖啡的饮者却只占75%。\n\n\
    这意味着，一个人如果喝茶，则他喝咖啡的可能性由80%降到75%。\n\n因此，尽管规则{茶} -> {咖啡}有很高的置信度，但是它却是一个误导！\n\n>\
    \ Strong association rules may not be interesting"
  - '[PAGE 170]


    # 支持度-置信度框架的局限


    +   - 置信度

    +     - 缺陷：忽略了规则后件中出现的项集的支持度

    +     - 如例中，饮茶者和喝咖啡的人之间存在着一种逆关系

    +   - 需要其它客观度量

    +     - 提升度

    +     - χ²统计

    +     - 全置信度

    +     - 余弦度量

    +     - ……'
  - '[PAGE 171]


    # 其它兴趣度度量


    +   提升度(lift): A和B两个项集的出现之间的提升度


    +   Measure of dependent/correlated events


    +   the lift of the association rule A⇒B is defined as


    lift(A ⇒ B) = P(A and B) / [P(A)P(B)] = P(B|A) / P(B)


    +   lift= 1 A and B are independent


    +   lift> 1 the occurrence of A encourages the occurrence of B(正相关)


    +   lift< 1 the occurrence of A discourages the occurrence of B (负相关)


    the bigger the value of lift,

    the stronger the correlation between A and B'
