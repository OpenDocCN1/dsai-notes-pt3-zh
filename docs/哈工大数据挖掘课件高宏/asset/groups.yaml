  - '[PAGE 98]


    # Data Reduction Strategies


    +   - 数据仓库通常存储T级数据

    +     - Complex data analysis/mining may take a very long time to run on the complete
    data set

    +   - 数据约简的目的

    +     - Obtain a reduced representation of the data set that is much smaller in
    volume but yet produce the same (or almost the same) analytical results'
  - '[PAGE 99]


    # Data Reduction Strategies


    +   - 数据约简策略

    +     - Data cube aggregation

    +     - 维归约：删除不相关的属性

    +     - 数据压缩

    +     - 数值压缩：用替代的较小的数据表示替换或估计数据，如抽样等

    +     - 离散化或概念分层产生


    ![](img/76d573223e44fade1c0950849390a4b3_99_0.png)'
  - '[PAGE 100]


    # 3.6 离散化和概念分层生成'
  - '[PAGE 101]


    # Discretization


    +   - 三类属性

    +     - Nominal — values from an unordered set

    +       - categorical

    +     - Ordinal — values from an ordered set

    +     - Continuous — real numbers

    +   - Discretization:

    +     - divide the range of a continuous attribute into intervals

    +     - Interval labels can then be used to replace actual data values

    +     - 减少给定连续属性值的个数'
  - '[PAGE 102]


    # 分类数据的概念分层


    +   - 由用户或专家造模式级显示地说明属性的部分序

    +   - 通过显示数据分组说明分层结构的一部分

    +   - 说明属性集，但不说明它们的偏序。由系统自动产生属性的序，构造有意义的概念分层。

    +   - 只说明部分属性集：语义密切相关的属性能够捆在一起。'
