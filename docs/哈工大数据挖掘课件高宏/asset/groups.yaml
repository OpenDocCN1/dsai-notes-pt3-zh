  - "[PAGE 130]\n\n# Apriori算法流程（cont.）\n\n生成辅助频繁k+1-项集\n\n```\nprocedure apriori_gen(L_k:\
    \ frequent k-itemsets; min_sup: minimum support)\n  for each itemset l1 ∈ L_k\n\
    \    for each itemset l2 ∈ L_k\n      if (l1[1] = l2[1]) ∧ (l1[2] = l2[2]) ∧ ...\
    \ ∧ (l1[k-1] = l2[k-1]) ∧ (l1[k] < l2[k]) then {\n        c = l1 ⋈ l2; // join\
    \ step: generate candidates\n        if has_infrequent_subset(c, L_k) then\n \
    \         delete c; //prune step:remove unfruitful candidate\n        else add\
    \ c to C_{k+1};\n      }\n  return C_{k+1};\n```"
