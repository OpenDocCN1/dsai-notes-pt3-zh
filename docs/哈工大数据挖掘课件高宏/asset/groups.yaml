    | p₁ | -log p₁ | n p₁ | - n p₁ log p₁ |\n| p₂ | -log p₂ | n p₂ | - n p₂ log p₂\
    \ |\n| p₃ | -log p₃ | n p₃ | - n p₃ log p₃ |\n\n| 消息出现的概率 | 1个消息的信息量 | n中的消息个数\
