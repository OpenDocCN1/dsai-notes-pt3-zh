    +     - Balanced Iterative Reducing and Clustering using Hierarchies

    +     - Two concepts

    +       - Clustering Feature

    +       - Clustering Feature Tree'
  - '[PAGE 306]


    # 2.2 Hierarchical methods


    +   - **Clustering Feature Tree (CF Tree)**

    +     - A CF tree is a height-balanced tree that stores the clustering features
    for a hierarchical clustering

    +       - A nonleaf node in a tree has descendants or “children”

    +       - The nonleaf nodes store sums of the CFs of their children

    +     - A CF tree has two parameters

    +       - Branching factor: specify the maximum number of children.

    +       - threshold: max diameter of sub-clusters stored at the leaf nodes'
  - '[PAGE 307]


    # CF Tree


    B = 7


    # Root


    | CF₁ | CF₂ | CF₃ | ..... | CF₆ |

    | child₁ | child₂ | child₃ |  | child₆ |


    # Non-leaf node


    | CF₁ | CF₂ | CF₃ | ..... | CF₅ |

    | child₁ | child₂ | child₃ |  | child₅ |


    # Leaf node


    # Leaf node


    | prev | CF₁ | CF₂ | ..... | CF₆ | next |


    | prev | CF₁ | CF₂ | ..... | CF₄ | next |'
  - '[PAGE 308]


    # 7.2.2 Hierarchical methods


    +   - BIRCH

    +     - Incrementally construct a CF (Clustering Feature) tree

    +     - Phase 1: scan DB to build an initial in-memory CF tree (a multi-level
    compression of the data that tries to preserve the inherent clustering structure
    of the data)

    +       - 一个对象被插入到最近的叶子条目(子聚类)。如果在插入后存储在叶子节点中的子聚类的直径大于阈值，那么该叶子节点及可能有其 它节点被分裂。

    +       - 新对象插入后，关于该对象的信息向根节点传递。

    +       - 通过修改阈值，CF树的 大小可以改变。

    +     - Phase 2: use an arbitrary clustering algorithm to cluster the leaf nodes
    of the CF-tree'
  - '[PAGE 309]


    # 7.2.2 Hierarchical methods


    +   - BIRCH


    +   - Advantage


    +   - *Scales linearly:* finds a good clustering with a single scan and improves
    the quality with a few additional scans


    +   - Weakness:


    +   - handles only numeric data, and sensitive to the order of the data record.'
  - '[PAGE 310]


    # 7.2.2 Hierarchical methods


    +   - CURE

    +     Clustering Using Representatives


    +   - 不用单个质心或对象来代表一个簇，而是选择数据空间中固定数目的具有代表性的点。


    +   - 一个簇的代表点通过如下方式产生：

    +     - 首先选择簇中分散的对象；

    +     - 然后根据一个特定的分数或收缩因子向簇中心“收缩”或移动它们


    +   - 在算法中的每一步，有最近距离的代表点对(每个点来自于不同的簇)的两个簇被合并。'
