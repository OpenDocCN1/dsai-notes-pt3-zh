    \n- 则全部信息量为：\n  -n p₁ log p₁ - n p₂ log p₂ - n p₃ log p₃\n- 平均信息量(熵)为：\n  (-n\
    \ p₁ log p₁ - n p₂ log p₂ - n p₃ log p₃)/n\n  = -p₁ log p₁ - p₂ log p₂ - p₃ log\
