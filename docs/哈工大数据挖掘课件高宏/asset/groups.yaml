  md: "\n## 文本数据库挖掘\n\n- 文本挖掘：基于关键字的关联和文档分类\n  - 基于关键字的关联分析\n    - 收集经常一起出现的关键字或词汇，找出其关联或相互关系\n\
    \    - 在文档数据库中，每个文档被视为一个transaction，文档中的关键字组可视为事务中的一组数据项，表示为：\n      { document_id,\
    \ a_set_of_keywords }\n    - 关键字挖掘问题可转化为事务数据库中关联规则挖掘问题\n\n## 文本数据库挖掘\n\n- 文本挖掘：基于关键字的关联和文档分类\n\
    \  - 文档分类\n    - 目的：由于现在存在大量的联机文档，自动对其分类组织可以便于对文档的检索和分析\n    - 方法:\n      - 首先，把一组预先分类过的文档作为训练集\n\
    \      - 然后，对训练集进行分析，得到分类模式\n      - 接着，对分类模式进行测试\n      - 最后，应用这个分类模式对其它联机文档加以分类\n\
    \n## 文本数据库挖掘\n\n- 文本挖掘：文档聚类\n  - 是无监督方式的组织文档的最关键技术之一\n  - 当文档用术语向量表示时，可以使用第7章介绍的聚类方法。\n\
    \  - 然而，文档空间的维度总是高，从数百到数千维。降维是有意义的。\n  - 最著名的聚类技术\n    - 光谱聚类\n    - 混合模型聚类\n\
    \    - 使用潜在语义标引聚类，和\n    - 使用保持局部性标引聚类\n\n## Web挖掘\n\n### Why?\n\n面对这样铺天盖地的网络信息，似乎是能够满足大家对信息的需求，但是实际的使用情况是：\n\
    \n- 对99%的用户来说，Web上99%以上的消息是毫无用处的\n- 随着时间的推移，人们越来越感觉到这个数字时代的图书馆并不像真正的图书馆那样支持有组织的信息管理和检索。恰恰相反，它是一个个杂乱无章的信息仓库\n\
    - 在这个仓库中有：文本、书刊、科研资料、图片、广告、录像和录音等，转瞬即逝的信息和具有持久意义的重\n\n如何从这些巨量的Web数据中发现有用的知识是数据挖掘面临的新课题！！\n\
    \n## Web挖掘\n\nWeb包含了丰富和动态的超链接信息，以及web页面的访问和使用信息，为数据挖掘提供了丰富的资源\n\n- Web上的数据特点：\n\
    \  - 从数据库的角度：一个巨大的异构数据库环境\n  - 从数据管理的角度：Web页面散布在世界各地的Web服务器上，形成了分布式数据源。每个服务器自主地管理自己的资源，没有统一的管理机制\n\
    \  - 从数据模型的角度：数据半结构化，没有特定的模型描述，具有自述性和动态可变性\n  - 从数据内容的角度：数据具有多样性，如文本、超文本、图象、音频、视频等\n\
    \  - 从数据更新的角度：Web是一个动态性极强的信息源，不仅增长的速度极快，而且信息也在不断地快速更新。\n  - 从用户的角度：一个庞大的、正在不断扩张的用户群体。每个用户具有不同的背景、兴趣和使用目的。\n\
    \n## Web挖掘\n\n### Web挖掘的任务\n\n- 挖掘web链接结构，识别权威web页面\n- Web文档的自动分类\n- 多层web信息库的构造\n\
    - Web 日志的挖掘\n\n## 流数据挖掘\n\n- 流数据：\n  - 实时检测套用，通信网络、 internet传输信息、电力供应网、工业生产过程等均会产生流数据。\n\
    \  - 与传统的数据集不同，数据流以不同的更新速率连续地流进和流出计算机系统。\n  - 特点：\n    - 按时间顺序的、快速变化的、海量的和潜在无限的\n\
    \  - 由于数据流的数据量太大，因此不可能存储整个数据流或者对其进行多遍的扫描\n\n## 流数据挖掘\n\n- 流数据处理方法和流数据系统\n  - 大纲（synopses）技术\n\
    \    - 随机抽样\n    - 滑动窗口\n    - 直方图\n    - 多分辨率方法\n  - 流查询\n    - 一次性查询\n    -\
    \ 连续查询\n\n## 流数据挖掘\n\n- 流OLAP和流数据立方体\n- 流数据中的频繁模式挖掘\n- 动态数据流的分类\n- 聚类演变数据流\n\n\
    ## 时间数据和序列数据挖掘\n\n- 什么是时序数据库(time-series)?\n  - 是指由随时间变化的序列值或事件组成的数据库\n  - 数据值通常是等时间间隔测得的数据\n\
    \  - 例如，股票市场的每日波动、科学实验等\n- 什么是序列数据库(sequence)?\n  - 是指由有序事件序列组成的数据库，可以有时\n   \
    \ 间标记，也可以没有时间标记\n  - 例如，Web 百万点击序列\n- 时序数据库也是一种序列数据库\n\n## Time-Series and Sequence\
    \ Data\n\n![](img/76d573223e44fade1c0950849390a4b3_361_0.png)\n\nA time series\
    \ can be illustrated as a time-series graph which describes a point moving with\
    \ the passage of time\n\n## 时间数据和序列数据挖掘\n\n四种类型\n\n反映一般变化方向，其时序图是在较长时间间隔上的数据变化\n\
    \n主要指循环环性，即趋势线或曲线在长时间时间内呈摇动迹象，它可以是也可以不是周期性的\n\n反映每年都重复出现的事件\n\n## 时间数据和序列数据挖掘\n\
    \n### 趋势分析\n\n- 时序变量Y可以表示为时间的函数，即 $Y=f(t)$。\n- 表示数据随时间变化的情况\n- 对Y给定一组值，即 $y_1,y_2,\\\
    ldots$，如何确定数据的趋势？\n\n- $n$阶移动平均：\n  \n  $\\frac{y_1+y_2+\\cdots+y_n}{n},\\ \\\
    frac{y_2+y_3+\\cdots+y_{n+1}}{n},\\ \\frac{y_3+y_4+\\cdots+y_{n+2}}{n},\\ldots$\n\
    \n- 其它方法：$n$阶加权移动平均、徒手法、最小二乘法等等\n\n## Example\n\n初始数据： 3 7 2 0 4 5 9 7 2\n\n3阶移动平均：\
    \ 4 3 2 3 6 7 6\n\n## 时间数据和序列数据挖掘\n\n- 时序分析中的相似性搜索\n  - 找出与给定查询序列最接近的数据序列。\n \
    \ - 整体序列匹配(whole sequence matching)\n    - 找出彼此间相似的序列\n  - 子序列匹配\n    - 找出与给定序列相似的所有数据序列\n\
    \n## 时间数据和序列数据挖掘\n\n- 序列模式挖掘\n  - 挖掘频繁出现的模式，时间的或其它序列。\n  - EXP.\n  9个月前购买奔腾PC的客户，很可能在一个月内订购新的CPU芯片\n\
    \n## Customer-sequence\n\n| CustId | Video sequence |\n| --- | --- |\n| 1 | {(C),\
    \ (H)} |\n| 2 | {(AB), (C), (DFG)} |\n| 3 | {(CEG)} |\n| 4 | {(C), (DG), (H)}\
    \ |\n| 5 | {(H)} |\n\n## Map Large Itemsets\n\n| Large Itemsets | MappedID |\n\
    | --- | --- |\n| (C) | 1 |\n| (D) | 2 |\n| (G) | 3 |\n| (DG) | 4 |\n| (H) | 5\
    \ |\n\n## Sequential patterns with support > 0.25\n\n{(C), (H)}\n{(C), (DG)}\n\
    \n## 时间数据和序列数据挖掘\n\n### 周期分析\n\n- 对周期模式的挖掘，即在时序数据库中找出重复出现的模式\n\n- 三种类型\n\n- 挖掘全周期模式：每一时间点都影响着时序上的循环行为。\n\
    \n- 挖掘部分周期模式：部分时间点的时序周期。\n\n- 挖掘循环或周期关联规则：周期出现事件的关联规则\n\n- 例如，基于每天的营业记录，若周末下午茶在3:00\
    \ – 5:00pm，则晚餐最佳营业时间为7:00 – 9:00。\n\n## 图挖掘和社会网络分析\n\n- 图挖掘\n  - 频繁子图挖掘\n  - 挖掘闭频繁子图\n\
    \    - 一个频繁图是闭的当且仅当不存在与G有相同支持度的真超图 G'\n    - 极大频繁图\n  - 挖掘频繁子树\n  - 基于约束的子图挖掘\n\
    \  - 挖掘近似频繁子结构\n  - 挖掘凝聚子结构\n    - 频繁子结构G是凝聚的，如果G和它的每个子图之间的互信息都超过某个阈值\n  - 挖掘稠密子结构\n\
    \    - 频繁高连通\n"
