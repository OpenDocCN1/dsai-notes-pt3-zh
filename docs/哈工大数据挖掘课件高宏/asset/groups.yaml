    \ j) = (w_1|x_{i1} - x_{j1}|^q + w_2|x_{i2} - x_{j2}|^q + … + w_n|x_{in} - x_{jn}|^q)^{1/q}\n\
    \n## 聚类中的属性类型\n\n- 二元变量（属性）\n  - 二元变量只有两个状态：\n    0或1\n  - 0表示该变量为空，1表示该变量存在。\n\
    \n|  | Object j |  |  |\n|---|---|---|---|\n|  | 1 | 0 | sum |\n| Object i | 1\
    \ | a | b | a+b |\n|  | 0 | c | d | c+d |\n|  | sum | a+c | b+d | p |\n\n- 表中\
    \ a 是对于对象 i 和 j 值都为 1 的变量（属性）的数目\n- 每个对象有 p 个变量（属性），p = a + b + c + d\n\nP=6\n\
    \n| Name | Fever | Cough | Test-1 | Test-2 | Test-3 | Test-4 |\n|---|---|---|---|---|---|---|\n\
    | Jack | Y | N | P | N | N | N |\n| Mary | Y | N | P | N | P | N |\n| Jim | Y\
    \ | P | N | N | N | N |\n\nObject Jack\n\n|  | 1 | 0 | sum |\n|---|---|---|---|\n\
    | 1 | a =2 | b =1 | a+b |\n| 0 | c =0 | d =3 | c+d |\n| sum | a+c | b+d | p |\n\
    \nObject Mary\n\n## 聚类中的属性类型\n\n- 二元变量（属性）\n  - 如果“0”和“1”两个状态是同等价值的，并有相同的权重，则该二元变量是对称的。\n\
    \    - 例如，性别，两个取值“0”和“1”没有优先权。\n    - 基于对称二元变量的相似度称为恒定的相似度。\n    - 采用简单匹配系数评价两个对象之间的相异度：\n\
    \      $d(i, j) = \\frac{b + c}{a + b + c + d}$\n  - 否则，则该二元变量是不对称的。\n    - 通常，出现几率较小的结果编码为1。\n\
    \    - 两个都取值1的情况(正匹配)被认为比两个都取值0的情况(负匹配)更有意义。\n    - Jaccard coefficient: $d(i,\
    \ j) = \\frac{b + c}{a + b + c}$\n\n## Example\n\n| Name | Gender | Fever | Cough\
    \ | Test-1 | Test-2 | Test-3 | Test-4 |\n|------|--------|-------|-------|--------|--------|--------|--------|\n\
    | Jack | M      | Y     | N     | P      | N      | N      | N      |\n| Mary\
    \ | F      | Y     | N     | P      | N      | P      | N      |\n| Jim  | M \
    \     | Y     | P     | N      | N      | N      | N      |\n\n- gender 是一个对称的二元变量\n\
    - 其它的都是非对称的二元变量\n- 将值 Y 和 P 编码为 1, 值 N 编码为 0, 根据 Jaccard 系数计算得：\n\nd ( jack ,\
    \ mary ) = (0 + 1) / (2 + 0 + 1) = 0.33\n\nd ( jack , jim ) = (1 + 1) / (1 + 1\
    \ + 1) = 0.67\n\nd ( jim , mary ) = (1 + 2) / (1 + 1 + 2) = 0.75\n"
