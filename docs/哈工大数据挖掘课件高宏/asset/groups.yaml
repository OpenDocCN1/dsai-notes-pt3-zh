    # Apriori 算法


    +   - 如何利用 $L_k$ 计算 $L_{k+1}$

    +     - 产生候选 $k+1$-项集 $C_{k+1}$

    +     - 扫描数据库，确定 $C_{k+1}$ 中每个候选项集的计数，从而得到 $L_{k+1}$。'
  - '[PAGE 124]


    # Apriori 算法


    +   如何产生候选 k+1-项集 C_{k+1}

    +   （假设事务或项集中的项已经按字典序排序）


    +   连接

    +   通过 L_k 与自己连接，产生候选 k+1-项集 C_{k+1}


    +   对于 L_k 中的任意两个项集 i_r、j_s，若 i 和 j_s 的前 k-1 个项是相同的，则产生新项集 i[1] i[2]... i[k] j_s[k]，并加入到
    C_{k+1} 中。


    +   裁减


    +   根据 Apriori 推理，对 C_{k+1} 进行裁减。'
