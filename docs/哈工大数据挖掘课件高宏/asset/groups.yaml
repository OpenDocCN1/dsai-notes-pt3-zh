    I(S₁, S₂) = I(9, 5) = 0.940


    # Compute the entropy for age:


    for age = “< 30”: S₁₁ = 2, S₂₁ = 3

    I(S₁₁, S₂₁) = − 2/5 log₂ 2/5 − 3/5 log₂ 3/5 = 0.971


