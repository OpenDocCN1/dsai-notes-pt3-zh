  - '[PAGE 8]


    # Can We Find All and Only Interesting Patterns?


    +   - Find all the interesting patterns: Completeness

    +     - Can a data mining system find all the interesting patterns?

    +     - Heuristic vs. exhaustive search

    +     - Association vs. classification vs. clustering

    +   - Search for only interesting patterns: An optimization problem

    +     - Can a data mining system find only the interesting patterns?

    +     - Approaches

    +       - First generate all the patterns and then filter out the uninteresting
    ones.

    +       - Generate only the interesting patterns—mining query optimization


    # 1.6 Major issues in data mining


    # Major Issues in Data Mining


    +   - 方法论

    +     - 处理大规模和复杂的数据类型, e.g., No, stream, Web

    +     - 性能: efficiency, effectiveness, and scalability

    +     - 对抗模式的识别: the interestingness problem

    +     - 各种模式的综合

    +     - 模式产生和模式发现的交互

    +     - 模式发现和数据库技术的结合

    +     - 模式发现和其它领域技术的结合

    +   - 用户交互

    +     - Data mining query languages and ad-hoc mining

    +     - Expression and visualization of data mining results

    +     - Interactive mining of knowledge at multiple levels of abstraction

    +   - 应用和社会影响

    +     - Domain-specific data mining & invisible data mining

    +     - Protection of data security(安全), integrity(完整), and privacy(隐私)


