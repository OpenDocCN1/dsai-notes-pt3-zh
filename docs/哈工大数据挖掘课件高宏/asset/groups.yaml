    \ Using Representatives\n- 不用单个质心或对象来代表一个簇，而是选择数据空间中固定数目的具有代表性的点。\n- 一个簇的代表点通过如下方式产生：\n\
    \  - 首先选择簇中分散的对象；\n  - 然后根据一个特定的分数或收缩因子向簇中心“收缩”或移动它们\n- 在算法中的每一步，有最近距离的代表点对(每个点来自于不同的簇)的两个簇被合并。\n"
  mdcn: "\n## How to Define Inter-Cluster Similarity\n\n![](img/76d573223e44fade1c0950849390a4b3_300_0.png)\n\
    \n- MIN\n- MAX\n- Group Average\n- Distance Between Centroids\n- Other methods\
    \ driven by an objective function\n  - Ward’s Method uses squared error\n\n![](img/76d573223e44fade1c0950849390a4b3_300_1.png)\n\
    \nProximity Matrix\n\n|  | p1 | p2 | p3 | p4 | p5 | ... |\n|---|---|---|---|---|---|---|\n\
    | p1 |  |  |  |  |  |  |\n| p2 |  |  |  |  |  |  |\n| p3 |  |  |  |  |  |  |\n\
    | p4 |  |  |  |  |  |  |\n| p5 |  |  |  |  |  |  |\n| ... |  |  |  |  |  |  |\n\
    \n**Proximity Matrix**\n\n- MIN\n- MAX\n- **Group Average**\n- Distance Between\
    \ Centroids\n- Other methods driven by an objective function\n  - Ward’s Method\
    \ uses squared error\n\n## DIANA (Divisive Analysis)\n\n- 分裂的层次聚类\n- 主要思想：采用自顶向下策略\n\
    \  - 首先将所有样本置于一个簇中；\n  - 然后逐渐细分为越来越小的簇，来增加簇的数目；\n  - 直到每个样本自成一个簇，或者达到某个终结条件。\n\
    \    - 例如达到了某个希望的簇的数目或两个最近的簇之间的距离超过了某个阈值。\n\n## 7.2.2 Hierarchical methods\n\n\
    - Issues in hierarchical methods\n  - do not scale well for agglomerative clustering\
    \ methods\n  - can never undo what was done previously\n- Integration of hierarchical\
    \ with distance-based clustering\n  - BIRCH (1996): uses CF-tree and incrementally\
    \ adjusts the quality of sub-clusters\n  - CURE (1998): selects well-scattered\
    \ points from the cluster and then shrinks them towards the center of the cluster\
    \ by a specified fraction\n  - CHAMELEON (1999): hierarchical clustering using\
    \ dynamic modeling\n\n- BIRCH\n  - Balanced Iterative Reducing and Clustering\
    \ using Hierarchies\n  - Two concepts\n    - Clustering Feature\n    - Clustering\
    \ Feature Tree\n\n- **Clustering Feature Tree (CF Tree)**\n  - A CF tree is a\
    \ height-balanced tree that stores the clustering features for a hierarchical\
    \ clustering\n    - A nonleaf node in a tree has descendants or “children”\n \
    \   - The nonleaf nodes store sums of the CFs of their children\n  - A CF tree\
    \ has two parameters\n    - Branching factor: specify the maximum number of children.\n\
    \    - threshold: max diameter of sub-clusters stored at the leaf nodes\n\n##\
    \ CF Tree\n\nB = 7\n\n### Root\n\n| CF₁ | CF₂ | CF₃ | ..... | CF₆ |\n| child₁\
    \ | child₂ | child₃ |  | child₆ |\n\n### Non-leaf node\n\n| CF₁ | CF₂ | CF₃ |\
    \ ..... | CF₅ |\n| child₁ | child₂ | child₃ |  | child₅ |\n\n### Leaf node\n\n\
    ### Leaf node\n\n| prev | CF₁ | CF₂ | ..... | CF₆ | next |\n\n| prev | CF₁ | CF₂\
    \ | ..... | CF₄ | next |\n\n- BIRCH\n  - Incrementally construct a CF (Clustering\
    \ Feature) tree\n  - Phase 1: scan DB to build an initial in-memory CF tree (a\
    \ multi-level compression of the data that tries to preserve the inherent clustering\
    \ structure of the data)\n    - 一个对象被插入到最近的叶子条目(子聚类)。如果在插入后存储在叶子节点中的子聚类的直径大于阈值，那么该叶子节点及可能有其它节点被分裂。\n\
    \    - 新对象插入后，关于该对象的信息向根节点传递。\n    - 通过修改阈值，CF树的大小可以改变。\n  - Phase 2: use an arbitrary\
    \ clustering algorithm to cluster the leaf nodes of the CF-tree\n\n- BIRCH\n-\
    \ Advantage\n- *Scales linearly:* finds a good clustering with a single scan and\
    \ improves the quality with a few additional scans\n- Weakness:\n- handles only\
    \ numeric data, and sensitive to the order of the data record.\n\n- CURE\n  Clustering\
    \ Using Representatives\n- 不用单个质心或对象来代表一个簇，而是选择数据空间中固定数目的具有代表性的点。\n- 一个簇的代表点通过如下方式产生：\n\
    \  - 首先选择簇中分散的对象；\n  - 然后根据一个特定的分数或收缩因子向簇中心“收缩”或移动它们\n- 在算法中的每一步，有最近距离的代表点对(每个点来自于不同的簇)的两个簇被合并。\n"
