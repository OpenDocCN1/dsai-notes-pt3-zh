  - '[PAGE 281]


    # 以簇中位置最中心的对象作为参照点


    ![](img/76d573223e44fade1c0950849390a4b3_281_0.png)'
  - '[PAGE 282]


    # k-medoids method


    +   基本策略(PAM算法)


    +   首先为每个簇随意选择一个代表对象；


    +   Repeat:


    +   剩余的对象根据其与代表对象的距离分配给最近的一个簇；


    +   随机地选择一对非代表对象O_h，和代表对象O_j，计算用O_h交换O_j的总体代价S_hj；


    +   如果S_hj<0，则用O_h替换O_j，形成新的k个代表对象的集合。


    +   Until 聚类效果不发生变化


    +   聚类结果的质量


    +   用一个代价函数来评估；


    +   对象与其参照对象(代表对象)之间的平均相异度'
