  - '[PAGE 287]


    # k-medoids method


    +   - CLARA

    +     - Strength

    +       deals with larger data sets than *PAM*

    +     - Weakness

    +       - Efficiency depends on the sample size

    +       - A good clustering based on samples will not necessarily represent a
    good clustering of the whole data set if the sample is biased'
  - '[PAGE 288]


    # 7.2.2 Hierarchical methods


    +   - a hierarchical method creates a hierarchical decomposition of the given
    set of data objects

    +   - Use distance matrix as clustering criteria.

    +   - This method does not require the number of clusters k as an input, but needs
    a termination condition'
  - '[PAGE 289]


    # 7.7.2.2 Hierarchical methods


    +   - Two schemes:

    +     - agglomerative: bottom-up, starts with each object forming a separate group

    +     - divisive: top-down, starts with all the objects in the same cluster

    +   - Representatives:

    +     - AGNES(AGglomerative NESting)

    +     - DIANA (DIvisive ANAlysis)

    +     - BIRCH (Balanced Iterative Reducing and Clustering using Hierarchies)

    +     - CURE (Clustering Using REpresentatives)

    +     - ROCK (RO bust Clustering using linKs)

    +     - CHAMELEON'
