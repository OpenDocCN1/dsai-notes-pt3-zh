    ![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_95_0.png)'
  - '[PAGE 96]


    # 数据类型和数据结构


    # 数据类型


    +   - 区间标度型：用线性标度描述的连续度量。（如，重量、高度、经纬度坐标、温度等）

    +   - 布尔型：若两个状态同等重要，称为对称的，否则是不对称的。

    +   - 标称型：有若干个离散的取值。

    +   - 序数型：取离散的序数值，序列排序是有意义的。

    +   - 比例标度型：在非线性标度上取正的度量值。


    # 数据结构


    +   - 数据矩阵


    +   - 相异度矩阵


    ![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_96_0.png)


    ![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_96_1.png)'
  - '[PAGE 97]


    # 关于距离函数


    距离函数 ||·|| 应满足的条件是：


    +   (1) || x_i - x_j || = 0, 当且仅当 x_i = x_j

    +   (2) 非负性：|| x_i - x_j || ≥ 0

    +   (3) 对称性：|| x_i - x_j || = || x_j - x_i ||

    +   (4) 三角不等式：

    +   || x_i - x_k || ≤ || x_i - x_j || + || x_j - x_k ||'
  - '[PAGE 98]


    # 对象间距离的计算


    设两个对象的p维向量分别表示为


    x_i = (x_i1, x_i2, ..., x_ip)^T 和 x_j = (x_j1, x_j2, ..., x_jp)^T，


    有多种形式的距离度量可以采用。如，


    +   - 闵可夫斯基（Minkowski）距离

    +   - 曼哈顿（Manhattan）距离

    +   - 欧几里得（Euclidean）距离

    +   - 切比雪夫（Chebyshev）距离

    +   - 马哈拉诺比斯（Mahalanobis）距离'
  - '[PAGE 99]


    # 对象间距离的计算


    ◆ 闵可夫斯基 (Minkowski) 距离：


    d_q(x_i, x_j) = ||x_i - x_j||_q = [ Σ_{k=1}^q |x_{ik} - x_{jk}|^q ]^{1/q}


    其中 q ∈ [1, ∞]。


    ◆ 曼哈顿 (Manhattan) 距离：


    d_1(x_i, x_j) = ||x_i - x_j||_1 = Σ_{k=1}^p |x_{ik} - x_{jk}|'
  - '[PAGE 100]


    # 对象间距离的计算(续)


    +   ◆ 欧几里德（Euclidean）距离：


    d₂(xᵢ, xⱼ) = ||xᵢ - xⱼ||₂ = [ Σₖ₌₁ᵖ |xᵢₖ - xⱼₖ|² ]¹ᐟ²


    +   ◆ 切比雪夫（Chebyshev）距离：


    d_∞(xᵢ, xⱼ) = ||xᵢ - xⱼ||_∞ = maxₖ∈{1,2,…,p} |xᵢₖ - xⱼₖ|'
  - '[PAGE 101]


    # 对象间距离的计算(续)


    在二维空间中考察到原点距离为常数的点构成的形状。


    ![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_101_0.png)


    +   - 菱形：曼哈坦距离；

    +   - 圆形：欧几里德距离；

    +   - 方形：切比雪夫距离。'
  - '[PAGE 102]


    # 基于划分的聚类方法


    +   已知由n个对象(或元组)构成的数据库，对其采用目标函数最小化的策略，通过迭代把数据分成k个划分块，每个划分块为一个簇(cluster)，这就是划分方法。


    +   划分方法满足两个条件:

    +   - 每个簇至少包含一个对象;

    +   - 每个对象必需属于且仅属于某一个簇。


    +   常见的划分方法:

    +   - k-means (k-均值) 方法

    +   - k-medoids (k-中心点) 方法'
  - '[PAGE 103]


    # k-means算法


    k-均值聚类算法的核心思想是通过迭代把数据对象划分到不同的簇中，以求目标函数最小化，从而使生成的簇尽可能地紧凑和独立。


    k-means算法步骤如下：


    +   - 首先，随机选取k个对象作为初始的k个簇的质心；

    +   - 然后，将其余对象根据其与各个簇质心的距离分配到最近的簇；再求新形成的簇的质心。

    +   - 这个迭代重定位过程不断重复，直到目标函数最小化为止。'
  - '[PAGE 104]


    # k-means算法(续)


    # k-means算法


    输入：期望得到的簇的数目k，n个对象的数据库。


    输出：使得平方误差准则函数最小化的k个簇。


    方法：


    +   - 选择k个对象作为初始的簇的质心；

    +   - repeat

    +   - 计算对象与各个簇的质心的距离，

    +   - 将对象划分到距离其最近的簇；

    +   - 重新计算每个新簇的均值；

    +   - Until 簇的质心不再变化。'
  - '[PAGE 105]


    # k-means算法特点


    算法的计算复杂度为O(nkt)，在处理大数据库时也是相对有效的(可扩展性)。


    应用局限性：


    +   - 用户必须事先指定聚类簇的个数

    +   - 常常终止于局部最优

    +   - 只适用于数值属性聚类(计算均值有意义)

    +   - 对噪声和异常数据也很敏感

    +   - 不适合用于发现非凸形状的聚类簇'
  - '[PAGE 106]


    # k-means改进算法


    # 改进工作集中在：


    +   - 参数k的选择

    +   - 差异程度计算

    +   - 聚类均值的计算方法等


    # 例如：


    +   - 先应用自下而上层次算法来获得聚类数目，并发现初始分类，然后再应用循环再定位(k-mean)来帮助改进分类结果。

    +   - k-modes：用新的相异性度量方法处理对象，用基于频率的方法修改簇的modes。

    +   - k-prototype：将k-means扩展到处理符号属性。

    +   - EM(期望最大化)

    +     - 概率权值, 聚类边界不严格

    +     - 可扩展性, 识别数据中存在的三种类型区域


    ![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_106_0.png)'
  - '[PAGE 107]


    # # k-medoids算法


    +   - **k-means**利用簇内点的均值或加权平均值 $c_i$（质心）作为簇 $C_i$ 的代表点。对数值属性数据有较好的几何和统计意义。对孤立点是敏感的，如果具有极大值，就可能大幅度地扭曲数据的分布。


    +   - **k-中心点算法**是为消除这种敏感性提出的，它选择簇中位置最接近簇中心的对象（称为中心点）作为簇的代表点，目标函数仍然可以采用平方误差准则。


    $$E=\sum_{i=1}^{k}\sum_{\mathbf{p}\in C_i}\|\mathbf{p}-\mathbf{c}_i\|^2$$'
  - '[PAGE 108]


    ![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_108_0.png)


    # k-medoids算法(续)


    # k-medoids算法处理过程


    +   - 首先，随机选择k个对象作为初始的k个簇的代表点，将其余对象按与代表点对象的距离分配到最近的簇；

    +   - 然后，反复用非代表点来代替代表点，以改进聚类质量。（用一个代价函数来估计聚类质量，该函数度量对象与代表点对象之间的平均相异度。）'
  - '[PAGE 109]


    # k-medoids算法(续)


    +   输入：n个对象的数据库，期望得到的k个聚类簇


    +   输出：k个簇，使所有对象与其所属簇中心点的偏差总和最小化


    +   方法：

    +   - 选择k个对象作为初始的簇中心

    +   - repeat

    +   - 对每个对象，求离其最近的簇中心点，并将其分配到该中心点代表的簇

    +   - 随机选取非中心点O_random

    +   - 计算用O_random 代替O_j形成新集合的总代价S

    +   - if S<0 then 用O_random代替O_j，形成新的k个中心点的集合

    +   - until 不再发生变化'
  - '[PAGE 110]


    # k-medoids算法特点


    +   优点：

    +   - 对属性类型没有局限性；

    +   - 鲁棒性强：通过簇内主要点的位置来确定选择中心点，对孤立点和噪声数据的敏感性小。


    +   不足：

    +   - 处理时间要比k-mean更长

    +   - 用户事先指定所需聚类簇个数k。'
  - '[PAGE 111]


    # 与k-medoids相关算法


    # PAM(Partitioning Around Medoid)


    +   - 是最早提出的k-中心点算法之一；

    +   - 总在中心点周围试图寻找更好的中心点；

    +   - 针对各种组合计算代价。


    # 不足：


    +   - n和k较大时，时间代价太大。


    ![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_111_0.png)'
  md: "\n## 聚类算法的分类\n\n- 基于划分的方法\n  - k-means算法\n  - 基于密度的算法\n- 基于层次的方法\n  - 汇聚算法\n\
    \  - 分裂算法\n- 基于网格的方法\n- 非数值与数值属性同时出现的方法\n- 基于约束的方法\n- 运用机器学习技术的方法\n  - 梯度下降法和人工神经网络法\n\
    \  - 进化模型\n- 有扩展性的算法\n- 面向高维数据集的算法\n\n![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_95_0.png)\n\
    \n## 数据类型和数据结构\n\n### 数据类型\n\n- 区间标度型：用线性标度描述的连续度量。（如，重量、高度、经纬度坐标、温度等）\n- 布尔型：若两个状态同等重要，称为对称的，否则是不对称的。\n\
    - 标称型：有若干个离散的取值。\n- 序数型：取离散的序数值，序列排序是有意义的。\n- 比例标度型：在非线性标度上取正的度量值。\n\n### 数据结构\n\
    \n- 数据矩阵\n- 相异度矩阵\n\n![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_96_0.png)\n\n![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_96_1.png)\n\
    \n## 关于距离函数\n\n距离函数 ||·|| 应满足的条件是：\n\n1. || x_i - x_j || = 0，当且仅当 x_i = x_j\n\
    2. 非负性：|| x_i - x_j || ≥ 0\n3. 对称性：|| x_i - x_j || = || x_j - x_i ||\n4. 三角不等式：||\
    \ x_i - x_k || ≤ || x_i - x_j || + || x_j - x_k ||\n\n## 对象间距离的计算\n\n设两个对象的p维向量分别表示为\n\
    \nx_i = (x_i1, x_i2, ..., x_ip)^T 和 x_j = (x_j1, x_j2, ..., x_jp)^T，\n\n有多种形式的距离度量可以采用。如：\n\
    \n- 闵可夫斯基（Minkowski）距离\n- 曼哈顿（Manhattan）距离\n- 欧几里得（Euclidean）距离\n- 切比雪夫（Chebyshev）距离\n\
    - 马哈拉诺比斯（Mahalanobis）距离\n\n◆ 闵可夫斯基 (Minkowski) 距离：\n\nd_q(x_i, x_j) = ||x_i -\
    \ x_j||_q = [ Σ_{k=1}^q |x_{ik} - x_{jk}|^q ]^{1/q}\n\n其中 q ∈ [1, ∞]。\n\n◆ 曼哈顿\
    \ (Manhattan) 距离：\n\nd_1(x_i, x_j) = ||x_i - x_j||_1 = Σ_{k=1}^p |x_{ik} - x_{jk}|\n\
    \n◆ 欧几里得（Euclidean）距离：\n\nd₂(xᵢ, xⱼ) = ||xᵢ - xⱼ||₂ = [ Σₖ₌₁ᵖ |xᵢₖ - xⱼₖ|² ]¹ᐟ²\n\
    \n◆ 切比雪夫（Chebyshev）距离：\n\nd_∞(xᵢ, xⱼ) = ||xᵢ - xⱼ||_∞ = maxₖ∈{1,2,…,p} |xᵢₖ -\
    \ xⱼₖ|\n\n在二维空间中考察到原点距离为常数的点构成的形状。\n\n![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_101_0.png)\n\
    \n- 菱形：曼哈顿距离；\n- 圆形：欧几里得距离；\n- 方形：切比雪夫距离。\n\n## 基于划分的聚类方法\n\n已知由n个对象(或元组)构成的数据库，对其采用目标函数最小化的策略，通过迭代把数据分成k个划分块，每个划分块为一个簇(cluster)，这就是划分方法。\n\
    \n划分方法满足两个条件：\n\n- 每个簇至少包含一个对象；\n- 每个对象必须属于且仅属于某一个簇。\n\n常见的划分方法：\n\n- k-means\
    \ (k-均值) 方法\n- k-medoids (k-中心点) 方法\n\n## k-means算法\n\nk-均值聚类算法的核心思想是通过迭代把数据对象划分到不同的簇中，以求目标函数最小化，从而使生成的簇尽可能地紧凑和独立。\n\
    \nk-means算法步骤如下：\n\n- 首先，随机选取k个对象作为初始的k个簇的质心；\n- 然后，将其余对象根据其与各个簇质心的距离分配到最近的簇；再求新形成的簇的质心。\n\
    - 这个迭代重定位过程不断重复，直到目标函数最小化为止。\n\n输入：期望得到的簇的数目k，n个对象的数据库。\n\n输出：使得平方误差准则函数最小化的k个簇。\n\
    \n方法：\n\n- 选择k个对象作为初始的簇的质心；\n- repeat\n- 计算对象与各个簇的质心的距离，\n- 将对象划分到距离其最近的簇；\n-\
    \ 重新计算每个新簇的均值；\n- Until 簇的质心不再变化。\n\n### k-means算法特点\n\n算法的计算复杂度为O(nkt)，在处理大数据库时也是相对有效的(可扩展性)。\n\
    \n应用局限性：\n\n- 用户必须事先指定聚类簇的个数\n- 常常终止于局部最优\n- 只适用于数值属性聚类(计算均值有意义)\n- 对噪声和异常数据也很敏感\n\
    - 不适合用于发现非凸形状的聚类簇\n\n### k-means改进算法\n\n改进工作集中在：\n\n- 参数k的选择\n- 差异程度计算\n- 聚类均值的计算方法等\n\
    \n例如：\n\n- 先应用自下而上层次算法来获得聚类数目，并发现初始分类，然后再应用循环再定位(k-means)来帮助改进分类结果。\n- k-modes：用新的相异性度量方法处理对象，用基于频率的方法修改簇的modes。\n\
    - k-prototype：将k-means扩展到处理符号属性。\n- EM(期望最大化)\n  - 概率权值, 聚类边界不严格\n  - 可扩展性, 识别数据中存在的三种类型区域\n\
    \n![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_106_0.png)\n\n## k-medoids算法\n\n- **k-means**利用簇内点的均值或加权平均值\
    \ \\(c_i\\)（质心）作为簇 \\(C_i\\) 的代表点。对数值属性数据有较好的几何和统计意义。对孤立点是敏感的，如果具有极大值，就可能大幅度地扭曲数据的分布。\n\
    - **k-中心点算法**是为消除这种敏感性提出的，它选择簇中位置最接近簇中心的对象（称为中心点）作为簇的代表点，目标函数仍然可以采用平方误差准则。\n\n\
    \\[\nE=\\sum_{i=1}^{k}\\sum_{\\mathbf{p}\\in C_i}\\|\\mathbf{p}-\\mathbf{c}_i\\\
    |^2\n\\]\n\n![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_108_0.png)\n\n### k-medoids算法处理过程\n\
    \n- 首先，随机选择k个对象作为初始的k个簇的代表点，将其余对象按与代表点对象的距离分配到最近的簇；\n- 然后，反复用非代表点来代替代表点，以改进聚类质量。（用一个代价函数来估计聚类质量，该函数度量对象与代表点对象之间的平均相异度。）\n\
    \n输入：n个对象的数据库，期望得到的k个聚类簇\n\n输出：k个簇，使所有对象与其所属簇中心点的偏差总和最小化\n\n方法：\n\n- 选择k个对象作为初始的簇中心\n\
    - repeat\n- 对每个对象，求离其最近的簇中心点，并将其分配到该中心点代表的簇\n- 随机选取非中心点O_random\n- 计算用O_random\
    \ 代替O_j形成新集合的总代价S\n- if S<0 then 用O_random代替O_j，形成新的k个中心点的集合\n- until 不再发生变化\n\
    \n### k-medoids算法特点\n\n优点：\n\n- 对属性类型没有局限性；\n- 鲁棒性强：通过簇内主要点的位置来确定选择中心点，对孤立点和噪声数据的敏感性小。\n\
    \n不足：\n\n- 处理时间要比k-means更长\n- 用户事先指定所需聚类簇个数k。\n\n### 与k-medoids相关算法\n\n**PAM(Partitioning\
    \ Around Medoid)**\n\n- 是最早提出的k-中心点算法之一；\n- 总在中心点周围试图寻找更好的中心点；\n- 针对各种组合计算代价。\n\
    \n**不足：**\n\n- n和k较大时，时间代价太大。\n\n![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_111_0.png)\n"
