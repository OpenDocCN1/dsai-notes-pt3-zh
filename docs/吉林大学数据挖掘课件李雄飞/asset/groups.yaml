    - 若X是R全不可定义的，则对U中任一元素x，既无法确定x是否属于X，也无法确定x是否属于~X。\n\n## 知识约简\n\n知识库中可能含有冗余的知识。知识约简研究在保持分类能力不变的前提下，删除冗余的知识的方法。它是粗糙集理论的核心内容之一，在数据挖掘领域具有重要的应用意义。\n\
    \n设ℛ是一个等价关系族，R∈ℛ，若有IND(ℛ)=IND(R-{R})，则称R为等价关系族ℛ中可省的，否则称为不可省的。若ℛ中任意一个等价关系R都是不可省的，则称ℛ是独立的，否则称为依赖的。\n\
    \n设Q⊂P，若Q是独立的，且IND(Q)=IND(P)，则称Q是等价关系族P的一个约简(Reduct)。P中所有不可省关系的集合称为等价关系族P的核(Core)，记作CORE(P)。\n\
    \n显然，P可以有多个约简，以RED(P)表示P的所有约简的集合。\n\n定理:等价关系P的核等于P的所有约简的交集，即有：\nCORE(P) = ∩RED(P)\n\
    \n## 知识约简(例)\n\n例3.6 设有知识库K=(U,R)，其中U={x₁, x₂, ..., x₈}，R={R₁, R₂, R₃}，等价关系R₁,\
    \ R₂, R₃的等价类如下：\n\nU/R₁ = {{x₁, x₄, x₅, x₆}, {x₂, x₃}, {x₇, x₈}}\n\nU/R₂ = {{x₁,\
    \ x₂, x₅}, {x₄, x₆, x₇}, {x₃, x₈}}\n\nU/R₃ = {{x₁, x₂, x₅}, {x₄, x₆}, {x₃, x₇},\
    \ {x₈}}\n\n求约简和核。\n\n解 由题意，\n\nU/IND(R) = {{x₁, x₅}, {x₂}, {x₃}, {x₄, x₆}, {x₇},\
    \ {x₈}}\n\nU/IND(R−{R₁}) = U/{R₂, R₃} = {{x₁, x₂, x₅}, {x₃}, {x₄, x₆}, {x₇}, {x₈}}\n\
    \nU/IND(R−{R₂}) = U/{R₁, R₃} = {{x₁, x₅}, {x₂}, {x₃}, {x₄, x₆}, {x₇}, {x₈}}\n\n\
    U/IND(R−{R₃}) = U/{R₁, R₂} = {{x₁, x₅}, {x₂}, {x₃}, {x₄, x₆}, {x₇}, {x₈}}\n\n\
    显然，R₁是R中不可省的，R₂与R₃是R中可省的。故核为R₁，即 CORE(R) = {R₁}。\n\n## 知识约简(例)(续)\n\n上述计算表明，\n\
    (U, {R₁, R₂}), (U, {R₁, R₃})与原有知识库K表示同样的知识(等价)，但{R₁, R₂}或{R₁, R₃}是否为约简，还要看其是否是独立的。\n\
    \nU/{R₁, R₂}≠U/R₁且U/{R₁, R₂}≠U/R₂，故{R₁, R₂}是独立的，所以{R₁, R₂}是R的一个约简。\n\n同理{R₁, R₃}也是R的一个约简。\n\
    \nR有两个约简，分别为{R₁, R₂}和{R₁, R₃}。\n\n核CORE(R)={R₁, R₂}∩{R₁, R₃}={R₁}。\n\n## 相对约简和相对核\n\
    \n相对约简和相对核反映了一个分类与另一个分类的关系。这两个概念是决策表属性约简的基础。\n\n设P和Q为论域U上的等价关系，Q的P正域记作POS_P(Q)，定义为：\
    \ POS_P(Q)= ⋃_{X∈U/Q} P X\n\nQ的P正域是U中所有可以根据分类(知识)U/P的信息准确分类到关系Q的等价类中去的对象构成的集合。\n\
    \n设P和Q为论域U上的等价关系族，R∈P，若 POS_IND(P)(IND(Q))=POS_IND(P-{R})(IND(Q)) 则称R为P中Q可省的，否则称R为P中Q不可省的。\n\
    \n若P中的任一关系R都是Q不可省的，则称P是Q独立的(相对于Q独立)。可以用POS_P(Q)代替POS_IND(P)(IND(Q))。\n\n## 相对约简和相对核(续)\n\
    \n设 S⊆P，称 S 为 P 的 Q 约简，当且仅当 S 是 P 的 Q 独立子族，且 POS_S(Q)=POS_P(Q)。P 中所有 Q 不可省的原始关系构成的集合称为\
    \ P 的 Q 核，记作 CORE_Q(P)。\n\nP 的所有 Q 约简构成的集合记作 RED_Q(P)，P 的 Q 约简称为相对约简，P 的 Q 核称为相对核。\n\
    \n定理 P 的 Q 核等于 P 的所有 Q 约简的交集\n\nCORE_Q(P)=∩RED_Q(P)\n\n- P 的 Q 核是知识的本质部分。\n- 为保证将对象分类到\
    \ Q 的概念中去的分类能力不变，Q 核知识是不可消去的。\n- 知识 P 的 Q 约简是 P 的子集，该子集是 Q 独立的，且与知识 P 相同的分类能力。\n\
    \n## 相对约简和相对核(例)\n\n例3.7 设K=(U,P)为知识库，U={x1, x2, …, x8}，P={R1, R2, R3}。等价关系R1，R2，R3的等价类集合如下：\n\
    U/R1 = {{x1, x2, x3, x4}, {x5, x6}, x7, x8}}\nU/R2 = {{x1, x3, x4, x7}, {x2, x6},\
    \ {x5, x8}}\nU/R3 = {{x1, x5, x8}, {x2, x3, x4}, {x6, x7}}\n由等价关系族Q导出的不可分辨关系的等价类集合为\n\
    U/Q-U/IND(Q) = {{x1, x3, x4}, {x2, x5, x6}, {x7, x8}}，求P的Q约简及P的Q核。\n解 等价关系族P导出的不可分辨关系IND(P)的等价类为：\n\
    U/P-U/IND(P) = {{x1}, {x2}, {x3, x4}, {x5, x8}, {x6}, {x7}}\nQ的P正域为：\nPOS_P(Q)\
    \ = {x1} ∪ {x2} ∪ {x3, x4} ∪ {x6} ∪ {x7} = {x1, x2, x3, x4, x6, x7}\n下面求出P中不可省的关系：\n\
    U/(P−{R1}) = U/{R2, R3} = {{x1}, {x2}, {x3, x4}, {x5, x8}, {x6}, {x7}}\nU/(P−{R2})\
    \ = U/{R1, R3} = {{x1}, {x2, x3, x4}, {x5, x8}, {x6, x7}}\nU/(P−{R3}) = U/{R1,\
    \ R2} = {{x1, x3, x4}, {x2}, {x5, x8}, {x6}, {x7}}\n\n## 相对约简和相对核(例)(续)\n\nPOS_(P-{R1})(Q)\
    \ = {x1} ∪ {x2} ∪ {x3, x4} ∪ {x6} ∪ {x7} = {x1, x2, x3, x4, x6, x7} = POS_P(Q)\n\
    \nPOS_(P-{R2})(Q) = {x1} ≠ POS_P(Q)\n\nPOS_(P-{R3})(Q) = {x1, x3, x4} ∪ {x2} ∪\
    \ {x6} ∪ {x7} = {x1, x2, x3, x4, x6, x7} = POS_P(Q)\n\n可见R2是P中Q不可省的，而R1和R3是P中Q可省的，故CORE_Q(P)\
    \ = (R2)。\n\n{R1, R2}和{R2, R3}若是独立的，则是P的Q约简。\n\n由于POS_{R1,R2}(Q) = {x1, x2, x3,\
    \ x4, x6, x7}， POS_R1(Q) = ∅， POS_R2(Q) = {x2, x6}， 故{R1, R2}是独立的，因此是P的一个Q约简。\n\
    \n同理{R2, R3}也是一个P的Q约简。\n\n一般约简是在不改变对论域中对象的分类能力的前提下消去冗余知识，而相对约简是在不改变将对象划分到另一个分类中去的分类能力的前提下消去冗余知识。\n"
