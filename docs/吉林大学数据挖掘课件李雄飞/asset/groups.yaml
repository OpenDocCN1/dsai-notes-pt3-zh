    # 近似与粗糙集(续)


    设集合 X ⊆ U，R 是一个等价关系，定义：

    _ R X = {x | x ∈ U 且 [x]_R ⊆ X}

    \overline{R} X = {x | x ∈ U 且 [x]_R ∩ X ≠ ∅}


    分别称 _R X 及 \overline{R} X 为 X 的 R 下近似集 (Lower Approximation) 和 R 上近似集 (Upper Approximation)。


    称集合 BNR(X) = \overline{R} X - _R X 为 X 的 R 边界域；POS_R(X) = _R X 为 X 的 R 正域；NEG_R(X)
    = U - \overline{R} X 为 X 的 R 负域。


    在依据知识 R 判断时，_R X 是由必定属于 X 的对象组成的集合；\overline{R} X 是由可能属于 X 的对象组成的集合；BNR(X) 是由既不能明确判断属于
    X，也不能明确判断属于 ~X (即 U - X) 的对象组成的集合；NEG_R(X) 则是由一定不属于 X 的对象组成的集合。'
  - '[PAGE 36]


    # 近似与粗糙集(续)


    下近似和上近似是粗糙集中重要的概念，在标准粗糙集模型(Pawlak粗糙集模型)中亦可定义如下：


    R̲X = ∪{Y | Y ∈ U/R 且 Y ⊆ X}


    R̅X = ∪{Y | Y ∈ U/R 且 Y ∩ X ≠ ∅}


    在例3.2中{x₁, x₂, x₃}的R下近似为{x₂, x₃}，R上近似为{x₁, x₂, x₃, x₅}。


    当BNR(X) = ∅时，即R̲X = R̅X时，称X是R精确集(或R可定义集)。


    当BNR(X) ≠ ∅时，即R̲X ≠ R̅X时，称X为R粗糙集(或R不可定义集)。'
