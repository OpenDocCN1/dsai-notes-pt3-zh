    \ y)∈U×V，都指定它对R的隶属度 μ_R(x, y)\n\nμ_R : U × V → [0, 1]\n\n若U与V都是有限论域，则模糊关系R=(r_ij)可以用一个矩阵来表示，其中矩阵的元素定义为：\n\
    \nr_ij = μ_R(x, y)，0 ≤ r_ij ≤ 1，(1 ≤ i, j ≤ n)\n\n矩阵R称为模糊矩阵。\n\n## 模糊关系(续)\n\n\
    例4.9 设身高的论域为U {140, 150, 160, 170, 180}，单位为厘米，设体重的论域为V {40, 50, 60, 70, 80}，单位为公斤。下表是人的身高与体重之间的模糊关系。\n\
    \n|  | 40 | 50 | 60 | 70 | 80 |\n|---|---|---|---|---|---|\n| 140 | 1 | 0.8 |\
    \ 0.2 | 0.1 | 0 |\n| 150 | 0.8 | 1 | 0.8 | 0.2 | 0.1 |\n| 160 | 0.2 | 0.8 | 1\
    \ | 0.8 | 0.2 |\n| 170 | 0.1 | 0.2 | 0.8 | 1 | 0.8 |\n| 180 | 0 | 0.1 | 0.2 |\
    \ 0.8 | 1 |\n\n模糊矩阵 R =\n\n```\n⎛ 1   0.8  0.2  0.1  0 ⎞\n⎜ 0.8 1    0.8  0.2\
    \  0.1 ⎟\n⎜ 0.2 0.8  1    0.8  0.2 ⎟\n⎜ 0.1 0.2  0.8  1    0.8 ⎟\n⎝ 0   0.1  0.2\
    \  0.8  1   ⎠\n```\n\n![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_84_0.png)\n\n##\
    \ 模糊关系运算与性质\n\n设R, S皆为m行n列的模糊矩阵（模糊关系），R=(r_ij)，S=(s_ij)，则可通过模糊矩阵表示R与S的并、交、补及λ截矩阵（λ截关系）：\n\
    \n- R∪S = (r_ij ∨ s_ij)\n- R∩S = (r_ij ∧ s_ij)\n- R̄ = (1 - r_ij)\n- R_λ = (λ\
    \ r_ij)，其中， λ r_ij = { 1  r_ij ≥ λ ; 0  r_ij ≤ λ }\n\n显然，模糊矩阵的λ截矩阵R_λ是一个布尔矩阵。\n\
    \n## 模糊关系运算与性质(续)\n\n设R为U×V上的模糊关系，S为V×W上的模糊关系，则R对S的合成是一个U到W的模糊关系，记为R∘S，其隶属函数为：\n\
    μ_{R∘S}(u,w)= ∨_{v∈V} (μ_R(u,v) ∧ μ_S(v,w))\n\n当R∈F(U×U)时，R²=R∘R，Rⁿ=R^{n-1}∘R。\n\
    \n设R=(r_{ij})_{l×m}，S=(s_{jk})_{m×n}，则定义T=R∘S的元素为：\nt_{ik}= ∨_{j=1}^m (r_{ij}\
    \ ∧ s_{jk})\n\n称T为R对S的合成，也称T为R对S的模糊乘积。\n\n## 模糊关系性质\n\n(1) 结合律：(Q ∘ R) ∘ S = Q\
    \ ∘ (R ∘ S)\n(2) 关于并的分配律：(Q ∪ R) ∘ S = (Q ∘ S) ∪ (R ∘ S)，\nS ∘ (Q ∪ R) = (S ∘\
    \ Q) ∪ (S ∘ R)\n但关于交的分配律不成立，即：\n(Q ∩ R) ∘ S ≠ (Q ∘ S) ∩ (R ∘ S)，\nS ∘ (Q ∩ R)\
    \ ≠ (S ∘ Q) ∩ (S ∘ R)\n(3) 设 O 为零关系，I 为恒等关系，\n则有：O ∘ R = R ∘ O = O，    I ∘ R =\
    \ R ∘ I = R\n(4) Q ⊆ R ⇒ Q ∘ S ⊆ R ∘ S， Q ⊆ R ⇒ S ∘ Q ⊆ S ∘ R， Q ⊆ R ⇒ Q^T ⊆ R^T\n\
    (5) (Q ∘ R)_λ = Q_λ ∘ R_λ\n\n## 模糊等价关系\n\n设 R = (r_ij)_{n×n} 为论域 U 上的模糊矩阵（模糊关系），\n\
    \n- (1) 若对任意的 i 都有 r_ii = 1，则称 R 满足自反性。\n- (2) 若对任意的 i 都有 r_ij = r_ji，则称 R 满足对称性。\n\
    - (3) 若有 R² ⊆ R，则称 R 满足传递性。\n\n称满足自反性、对称性和传递性的模糊关系为模糊等价关系；称满足自反性和对称性的模糊关系为模糊相似关系。\n\
    \n定理4.5 R 为模糊等价关系的充要条件是对任意的 λ ∈ [0,1]，λ 截矩阵 R_λ 是经典集合论中的等价关系。\n\n在经典集合论中，等价关系对应论域上的一个划分，即等价关系可用于对论域对象进行分类。由定理4.5可知，模糊等价关系确定之后，当给定一个\
    \ λ ∈ [0,1] 时，可得到一个普通的等价关系 R_λ，从而得到一个 λ 水平的分类。\n\n定理4.6 若 0 ≤ α ≤ β ≤ 1，则由 R_β\
    \ 分出的每个类必是由 R_α 分出的某一类的子类（R_β 的分类法是对 R_α 的分类法的“加细”）。\n\n## 模糊集与粗糙集\n\n- 前者着眼于知识的模糊性，后者着眼于知识的粗糙性。两者从不同的侧面反映知识的粒度性。\n\
    - 模糊集强调集合边界的状态，强调集合本身的含混性；粗糙集强调集合对象间的不可分辨性。\n- 模糊集研究的是属于同一类的不同对象对集合的隶属关系，重在隶属程度；粗糙集以不可分辨关系为基础，研究的是不同类中的对象组成的集合之间的关系，重在分类，分类的能力在于论域上的不可分辨关系提供的知识多少。\n\
    - 模糊集是数据挖掘中常用的聚类方法之一；粗糙集是数据挖掘中常用的分类方法之一。\n\n## 课外阅读\n\n![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_90_0.png)\n\
    \n- 1. Fayyad, U., G. Piatetsky-Shapiro, P. Smyth, and R. Uthurusamy. 1996. In\
    \ Advances in Knowledge Discovery and Data Mining. Cambridge, MA:MIT Press.\n\n\
    ## 第五章 聚类分析\n\n——《数据挖掘与知识发现》\n\n吉林大学计算机科学与技术学院 李雄飞\n\n## 引言\n\n## 聚类(Clustering)\n\
    \n- 是对物理的或抽象的对象集合分组的过程\n- 聚类生成的组称为簇（Cluster），簇是数据对象的集合。簇内部的任意两个对象之间具有较高的相似度，而属于不同簇的两个对象间具有较高的相异度。\n\
    - 相异度可以根据描述对象的属性值计算，对象间的距离是最常采用的度量指标。\n- 聚类最初来自数学、统计学和数值分析；机器学习领域把聚类描述成隐含模式，发现簇的过程是无监督学习；聚类是模式识别的重要手段。\n\
    \n## 聚类的特点\n\n- 用少量的簇描述大量数据的特征\n  - 数据简洁\n  - 丢失精细部分\n\n## 聚类在数据挖掘实践中的应用\n\n-\
    \ 数据预处理\n- 科学数据探索\n- 信息获取与文本挖掘\n- 空间数据库应用\n- CRM\n- 市场分析\n- Web分析\n- 医学诊断\n- 计算生物学\n\
    \n## 多角度看聚类\n\n- 从统计学的观点看，聚类分析是通过数据建模简化数据的一种方法。\n- 包括系统聚类法、分解法、加入法、动态聚类法、有序样品聚类、有重叠聚类和模糊聚类等。\n\
    - 从机器学习的角度讲，簇相当于隐藏模式。聚类是搜索簇的无监督学习过程。\n- 与分类不同，无监督学习不依赖预先定义的类或带类标记的训练实例，需要由聚类学习算法自动确定标记，而分类学习的实例或数据对象有类别标记。聚类是观察式学习，而不是示范式的学习。\n\
    - 从实际应用的角度看，聚类分析是数据挖掘的主要任务之一。\n- 就数据挖掘功能而言，聚类能够作为一个独立的工具获得数据的分布状况，观察每一簇数据的特征，集中对特定的聚簇集合作进一步地分析。\n\
    - 聚类分析还可以作为其他数据挖掘任务（如分类、关联规则）的预处理步骤。\n\n## 聚类算法的特征\n\n- 处理不同类型属性的能力\n- 对大型数据集的可扩展性\n\
    - 处理高维数据的能力\n- 发现任意形状簇的能力\n- 处理孤立点或 “噪声” 数据的能力\n  - 对 “噪声” 数据具有较低的敏感性\n  - 合理地发现孤立点\n\
    - 对数据顺序的不敏感性\n- 对先验知识和用户自定义参数的依赖性\n- 聚类结果的可解释性和实用性\n- 基于约束的聚类\n"
