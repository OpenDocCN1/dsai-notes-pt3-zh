  - '[PAGE 66]


    # 引言


    模糊数学是研究和处理模糊现象的数学。有<|message|> 一类概念没有明确外延，称为模糊概念。模糊概念无法用康托集合论来刻画。


    # 1965年，L. A. Zadeh提出模糊集合论


    用隶属程度来描述差异的中介过渡，是一种用精确的数学语言描述模糊性问题的方法。


    # 著名的复杂性与精确性“不相容原理”


    当系统的复杂性不断增长时，对系统特性精确而有效描述的能力将相应降低，直至达到一个阈值，一旦超过该阈值，精确性和有效性将变成互相排斥的两个特性，

    即，系统复杂程度越高，人们对它的认识越模糊。

    不相容原理深刻地揭示了模糊数学产生与发展的必然性。


    # 模糊集理论已经成为数据挖掘研究的有效工具。'
  - '[PAGE 67]


    # 模糊集与隶属函数


    论域U上的一个模糊集合通过一个隶属函数刻画：

    μ_A(x):U→[0,1]，x∈U


    对任意x∈U，都指定一个数 μ_A(x)∈[0,1]与之对应，称为x对A的隶属度(Degree Of Membership)，μ_A称为A的隶属函数(Membership
    Function)。


    +   - 若 μ_A(x)=0，则x完全不属于A;

    +   - 若 μ_A(x)=1，则x完全属于A;

    +   - 若0< μ_A(x)<1，则x属于A的隶属度为 μ_A(x)。


    当 μ_A 的值域为{0,1}时，A退化为经典集合，即经典集合是模糊集合的特例。


    模糊性的根源在于客观事物之间的差异存在中间过渡，存在亦此亦彼的现象。


    隶属函数是模糊集理论的基本概念，它以0、1之间的一个数反映一个元素隶属于集合的程度，进而描述模糊现象。'
  - '[PAGE 68]


    # 常用的隶属函数


    +   1. 三角形隶属函数

    +   $\mu_A(x)=\begin{cases}\dfrac{x-a}{m-a} & x\in[a,m]\dfrac{b-x}{b-m} & x\in[m,b]\0
    & x\le a\ \text{或}\ x\ge b\end{cases}$


    +   2. S隶属函数

    +   $\mu_A(x)=\begin{cases}0 & x\le a\2\left(\dfrac{x-a}{b-a}\right)^2 & x\in[a,m]\1-2\left(\dfrac{x-a}{b-a}\right)^2
    & x\in[m,b]\1 & x>b\end{cases}$


    +   3. 正态隶属函数

    +   $\mu_A(x)=e^{-k(x-a)^2},\ k>0$


    +   4. 梯形隶属函数

    +   $\mu_A(x)=\begin{cases}\dfrac{x-a}{m-a} & x\in[a,m]\1 & x\in[m,n]\dfrac{b-x}{b-n}
    & x\in[n,b]\0 & x<a\ \text{或}\ x>b\end{cases}$'
  - '[PAGE 69]


    # 模糊集的表示方法


    当U为有限个元素时，称为有限论域，设U={x₁, x₂, ..., xₙ}，模糊集就表示为 A = Σ μ_A(x_i)/x_i = μ_A(x₁)/x₁
    + μ_A(x₂)/x₂ + ⋯ + μ_A(xₙ)/xₙ 这只是一种记法，表示每个元素x_i的隶属度为 μ_A(x_i)，而不是通常意义下的分式求和。


    当U是连续论域时，A = ∫ μ_A(x)/x ，这里的积分号不是通常的积分含义，该式表示对每个x都指定了相应的隶属度 μ_A(x)。


    +   用隶属函数的解析式来表示一个模糊集；


    +   当论域为有限集时，可以用序偶的形式或向量的形式表示模糊集。'
