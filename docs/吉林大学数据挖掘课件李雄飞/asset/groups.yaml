    # 粗糙集的基本性质


    +   1. \underline{R}X ⊆ X ⊆ \overline{R}X

    +   2. \underline{R}∅ = \overline{R}∅ = ∅； \underline{R}U = \overline{R}U = U

    +   3. \overline{R}(X ∪ Y) = \overline{R}X ∪ \overline{R}Y； \underline{R}(X ∩
    Y) = \underline{R}X ∩ \underline{R}Y

    +   4. X ⊆ Y ⇒ \underline{R}X ⊆ \underline{R}Y； X ⊆ Y ⇒ \overline{R}X ⊆ \overline{R}Y

    +   5. \underline{R}(X ∪ Y) ⊇ \underline{R}X ∪ \underline{R}Y； \overline{R}(X
    ∩ Y) ⊆ \overline{R}X ∩ \overline{R}Y

    +   6. \underline{R}(~ X) = ~ \overline{R}X； \overline{R}(~ X) = ~ \underline{R}X

    +   7. \underline{R}(\underline{R}X) = \overline{R}(\underline{R}X) = \underline{R}X；
    \overline{R}(\overline{R}X) = \underline{R}(\overline{R}X) = \overline{R}X'
