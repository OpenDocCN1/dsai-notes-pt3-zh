    - $\\mu_A(x)=e^{-k(x-a)^2},\\ k>0$\n\n- 4. 梯形隶属函数\n- $\\mu_A(x)=\\begin{cases}\\\
    dfrac{x-a}{m-a} & x\\in[a,m]\\1 & x\\in[m,n]\\dfrac{b-x}{b-n} & x\\in[n,b]\\0\
    \ & x<a\\ \\text{或}\\ x>b\\end{cases}$\n\n# 模糊集的表示方法\n\n当U为有限个元素时，称为有限论域，设U={x₁,\
    \ x₂, ..., xₙ}，模糊集就表示为 A = Σ μ_A(x_i)/x_i = μ_A(x₁)/x₁ + μ_A(x₂)/x₂ + ⋯ + μ_A(xₙ)/xₙ\
    \ 这只是一种记法，表示每个元素x_i的隶属度为 μ_A(x_i)，而不是通常意义下的分式求和。\n\n当U是连续论域时，A = ∫ μ_A(x)/x ，这里的积分号不是通常的积分含义，该式表示对每个x都指定了相应的隶属度\
    \ μ_A(x)。\n\n- 用隶属函数的解析式来表示一个模糊集；\n- 当论域为有限集时，可以用序偶的形式或向量的形式表示模糊集。\n\n# 隶属函数(例)\n\
    \n例4.1 以年龄为论域, 取U=[0,200], 为定义“年老”O与“年轻”Y这两个模糊集, 扎德给出的隶属函数如下\n\n```\nμ_O(x) =\
    \ { 0, 当0 ≤ x ≤ 50\n          [1 + ((x - 50)/5)^2]^{-1}, 当50 < x ≤ 200 }\n```\n\
    \n```\nμ_Y(x) = { 1, 当0 ≤ x ≤ 25\n          [1 + ((x - 25)/5)^2]^{-1}, 当25 < x\
    \ ≤ 200 }\n```\n\n![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_70_0.png)\n\n# 模糊集表示法(例)\n\
