    # 数据挖掘发展历程


    数据收集和数据库创建（六十年代或更早）

    • 原始的文件系统


    +   数据库管理系统（70年代～80年代早期）

    +   • 层次、网络数据库系统

    +   • 关系数据库系统

    +   • 数据模型工具：实体-关系模型等

