    \ b | d | e |\n|---|---|---|---|\n|X₁|0|1|1|\n|X₂|0|0|1|\n|X₃|2|1|2|\n|X₄|2|1|0|\n\
    |X₅|1|0|2|\n|X₆|1|0|2|\n|X₇|1|1|1|\n\n# 决策规则\n\n设 S = (U, A, V, f) 是决策表，A = C\
    \ ∪ D，C 为条件属性集，D 为决策属性集。令 X_i 和 Y_j 分别表示条件类和决策类。\n\nDes(X_i) 表示条件类 X_i 的描述，\n\
    定义为：Des(X_i) = {(a, v_a) | f(x, a) = v_a, ∀a ∈ C}\n\nDes(Y_j) 表示决策类 Y_j 的描述，定义为：\n\
    Des(Y_j) = {(a, v_a) | f(x, a) = v_a, ∀a ∈ D}\n\n决策规则定义为：\nT_ij : Des(X_i) → Des(Y_j)，当\
    \ X_i ∩ Y_j ≠ ∅\n\n规则 T_ij 的确定性因子 μ(X_i, Y_j) = |Y_j ∩ X_i| / |X_i|，显然 0 < μ ≤\
    \ 1。\n\n- 当 μ(X_i, Y_j) = 1 时，T_ij 是确定的规则；\n- 当 0 < μ < 1 时，T_ij 是不确定的规则，此时 μ(X_i,\
