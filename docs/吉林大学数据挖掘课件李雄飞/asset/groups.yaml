  - '[PAGE 30]


    # 知识与知识库


    粗糙集理论将分类方法看成知识，分类方法的族集是知识库。等价关系对应论域U的一个划分。因此，通过一个等价关系可以形成与之对应的论域知识（即等价类的集合—商集）。从而得到不可分辨关系对应论域U上的知识。


    +   称论域U的子集为U上的概念，约定∅也是一个概念，概念的族集称为U上的知识；U上知识(分类)的族集构成关于U的知识库。也就是说，知识库是分类方法的集合。


    +   近似空间对应U的一个划分，所以，近似空间形成关于论域U的知识。'
  - '[PAGE 31]


    # 知识与知识库(续)


    +   设U为论域，P为等价关系族，P⊂R且P≠∅，则不可分辨关系IND(P)的所有等价类的集合，即商集U/IND(P)称为U的P基本知识，相应等价类称为知识P的基本概念。


    +   若等价关系Q∈R，则称U/Q为U的Q初等知识，相应等价类称为Q初等概念。由于选取R的不同子集可以得到U上的不同知识，故称K=(U, R)为知识库(Knowledge
    Base)。


