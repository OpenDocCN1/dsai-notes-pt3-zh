  - '[PAGE 27]


    # 近似空间


    +   设U为所讨论对象的非空有限集合，称为论域。

    +   R为建立在U上的一个等价关系，称二元有序组AS=(U, R)为近似空间(Approximate Space)。


    +   近似空间构成论域U的一个划分。

    +   若R是U上的一个等价关系，以[x]_R表示x的R等价类，U/R表示R的所有等价类构成的集合，即商集。R的所有等价类构成U的一个划分，划分块与等价类相对应。


    +   令R为等价关系族，设P⊆R，且P≠∅，则P中所有等价关系的交集称为P上的不可分辨关系，记作IND(P)，即有：

    +   [x]_{IND(P)} = ⋂_{R∈P}[x]_R

    +   显然IND(P)也是等价关系。'
  - '[PAGE 28]


    # 近似空间(例)


    例3.1 设论域 U={x₁, x₂, x₃, x₄, x₅}, R={R₁, R₂, R₃}, I是恒等关系, R₁, R₂, R₃定义如下:


    R₁={<x₁, x₂>, <x₂, x₁>, <x₃, x₄>, <x₄, x₃>}∪I


    R₂={<x₁, x₂>, <x₂, x₁>, <x₄, x₅>, <x₅, x₄>}∪I


    R₃={<x₁, x₂>, <x₂, x₁>, <x₁, x₃>, <x₃, x₁>, <x₂, x₃>, <x₃, x₂>, <x₄, x₅>, <x₅,
    x₄>}∪I


    若 P={R₁, R₂}⊆R, 则由定义可知:


    IND(P)=R₁ ∩ R₂={<x₁, x₂>, <x₂, x₁>}∪I


    IND(R)=R₁ ∩ R₂ ∩ R₃={<x₁, x₂>, <x₂, x₁>}∪I


    利用商集来描述不可分辨关系。


    U / R₁={{x₁, x₂}, {x₃, x₄}, {x₅}}


    U / R₂={{x₁, x₂}, {x₃}, {x₄, x₅}}


    U / R₃={{x₁, x₂, x₃}, {x₄, x₅}}


    U / IND(P)=U / {R₁, R₂}={{x₁, x₂}, {x₃}, {x₄}, {x₅}}


    U / IND(R)=U / {R₁, R₂, R₃}={{x₁, x₂}, {x₃}, {x₄}, {x₅}}'
  - '[PAGE 29]


    # 近似空间(续)


    +   ◆ 不可分辨关系是标准粗糙集(Pawlak粗糙集)理论中最基本的概念。


    +   ◆ 若<x, y>∈IND(P)，则称对象x和y是P不可分辨的，即x、y属于由不可分辨关系IND(P)定义的同一个等价类。


    +   ◆ 依据等价关系族P形成的分类知识，无法区分x与y。


    +   ◆ U/IND(P)中的各等价类称为P基本集(或原子集)。


    +   ◆ 基本集是粗糙集理论中构成知识的基本模块。


    +   ◆ 若集合X可以表示成某些基本集的并时，则称X是P可定义集，否则称为P不可定义集。'
