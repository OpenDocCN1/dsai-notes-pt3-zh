  - '[PAGE 83]


    # 模糊关系


    模糊关系也是一种模糊集合，其论域由多个集合的笛卡尔积构成。


    设U、V为两个论域，称U×V上的模糊集R为从U到V的一个模糊关系。


    即，对∀(x, y)∈U×V，都指定它对R的隶属度 μ_R(x, y)


    μ_R : U × V → [0, 1]


    若U与V都是有限论域，则模糊关系R=(r_ij)可以用一个矩阵来表示，其中矩阵的元素定义为：


    r_ij = μ_R(x, y)，0 ≤ r_ij ≤ 1，(1 ≤ i, j ≤ n)


    矩阵R称为模糊矩阵。'
  - '[PAGE 84]


    # 模糊关系(续)


    例4.9 设身高的论域为U {140, 150, 160, 170, 180}，单位为厘米，设体重的论域为V {40, 50, 60, 70, 80}，单位为公斤。下表是人的身高与体重之间的模糊关系。


    | | 40 | 50 | 60 | 70 | 80 |

    |---|---|---|---|---|---|

    | 140 | 1 | 0.8 | 0.2 | 0.1 | 0 |

    | 150 | 0.8 | 1 | 0.8 | 0.2 | 0.1 |

    | 160 | 0.2 | 0.8 | 1 | 0.8 | 0.2 |

    | 170 | 0.1 | 0.2 | 0.8 | 1 | 0.8 |

    | 180 | 0 | 0.1 | 0.2 | 0.8 | 1 |


    模糊矩阵 R =


    ```

    ⎛ 1   0.8  0.2  0.1  0 ⎞

    ⎜ 0.8 1    0.8  0.2  0.1 ⎟

    ⎜ 0.2 0.8  1    0.8  0.2 ⎟

    ⎜ 0.1 0.2  0.8  1    0.8 ⎟

    ⎝ 0   0.1  0.2  0.8  1   ⎠

    ```


