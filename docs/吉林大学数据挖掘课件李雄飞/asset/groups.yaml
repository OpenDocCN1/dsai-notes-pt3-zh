    +   • 事务管理，并发控制、数据恢复等

    +   • 在线事务处理（OLTP）


    +   高级数据库管理系统（80年代中期到现在）

    +   • 高级数据模型：

    +   • 关系扩展：面向对象、面向关系、演绎数据模型等

    +   • 面向应用的数据库系统

    +   • 空间、时态、多媒体、主动、科学、知识库等


    +   基于 Web 的数据库管理系统（90年代到现在）

    +   • 基于 XML 的数据库系统

    +   • Web 挖掘


    +   数据仓库与数据挖掘（80年代后期到现在）

    +   • 数据仓库和 OLAP 技术

