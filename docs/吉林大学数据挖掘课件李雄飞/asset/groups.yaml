    \ 2)\n(b, 1) ∧ (c, 2) → (e, 1)\n```\n\n# 课外阅读\n\n- 1. Komorowski, J., Z.Pawlak,\
    \ L.Polkowski, and A.Skowron, 1999, Rough Sets: a tutorial, In *Rough Fuzzy Hybridization:\
    \ A New Trend in Decision-making*, p3-98\n\n# 第四章 模糊集\n\n----《数据挖掘与知识发现》\n\n吉林大学计算机科学与技术学院\
    \ 李雄飞\n\n# 引言\n\n模糊数学是研究和处理模糊现象的数学。有\n一类概念没有明确外延，称为模糊概念。模糊概念无法用康托集合论来刻画。\n\n#\
    \ 1965年，L. A. Zadeh提出模糊集合论\n\n用隶属程度来描述差异的中介过渡，是一种用精确的数学语言描述模糊性问题的方法。\n\n# 著名的复杂性与精确性“不相容原理”\n\
    \n当系统的复杂性不断增长时，对系统特性精确而有效描述的能力将相应降低，直至达到一个阈值，一旦超过该阈值，精确性和有效性将变成互相排斥的两个特性，\n即，系统复杂程度越高，人们对它的认识越模糊。\n\
    不相容原理深刻地揭示了模糊数学产生与发展的必然性。\n\n# 模糊集理论已经成为数据挖掘研究的有效工具。\n\n# 模糊集与隶属函数\n\n论域U上的一个模糊集合通过一个隶属函数刻画：\n\
    μ_A(x):U→[0,1]，x∈U\n\n对任意x∈U，都指定一个数 μ_A(x)∈[0,1]与之对应，称为x对A的隶属度(Degree Of Membership)，μ_A称为A的隶属函数(Membership\
    \ Function)。\n\n- 若 μ_A(x)=0，则x完全不属于A;\n- 若 μ_A(x)=1，则x完全属于A;\n- 若0< μ_A(x)<1，则x属于A的隶属度为\
    \ μ_A(x)。\n\n当 μ_A 的值域为{0,1}时，A退化为经典集合，即经典集合是模糊集合的特例。\n\n模糊性的根源在于客观事物之间的差异存在中间过渡，存在亦此亦彼的现象。\n\
    \n隶属函数是模糊集理论的基本概念，它以0、1之间的一个数反映一个元素隶属于集合的程度，进而描述模糊现象。\n\n# 常用的隶属函数\n\n- 1. 三角形隶属函数\n\
    - $\\mu_A(x)=\\begin{cases}\\dfrac{x-a}{m-a} & x\\in[a,m]\\dfrac{b-x}{b-m} & x\\\
    in[m,b]\\0 & x\\le a\\ \\text{或}\\ x\\ge b\\end{cases}$\n\n- 2. S隶属函数\n- $\\mu_A(x)=\\\
    begin{cases}0 & x\\le a\\2\\left(\\dfrac{x-a}{b-a}\\right)^2 & x\\in[a,m]\\1-2\\\
