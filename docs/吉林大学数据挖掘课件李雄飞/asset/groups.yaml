    \ A∪(B∩C)=(A∪B)∩(A∪C), A∩(B∪C)=(A∩B)∪(A∩C)\n- 5. 吸收律: (A∩B)∪A=A, (A∪B)∩A=A\n-\
    \ 6. 同一律: A∪∅=U, A∩U=A, A∪∅=A, A∩∅=∅\n- 7. 复原律: \\overline{\\overline{A}} = A\n\
    - 8. 对偶律(德·摩根律): \\overline{A∪B}=\\overline{A}∩\\overline{B}    \\overline{A∩B}=\\\
    overline{A}∪\\overline{B}\n\n## 模糊集运算(例)\n\n例4.3 设论域U={x₁, x₂, ..., x₅}, U上的模糊集A,\
    \ B分别为：\n\nA=0.9/x₁ +0.7/x₂ +1/x₃ +0.2/x₄ +0.3/x₅\n\nB=0.6/x₁ +0.8/x₂ +0.5/x₃\
    \ +0.5/x₄ +0/x₅\n\n求A∪B, A∩B, Ā 及 B̄ 。\n\n解 A∪B= 0.9∨0.6/x₁ + 0.7∨0.8/x₂ + 1∨0.5/x₃\
    \ + 0.2∨0.5/x₄ + 0.3∨0/x₅\n\n= 0.9/x₁ + 0.8/x₂ + 1/x₃ + 0.5/x₄ + 0.3/x₅\n\nA∩B=\
    \ 0.9∧0.6/x₁ + 0.7∧0.8/x₂ + 1∧0.5/x₃ + 0.2∧0.5/x₄ + 0.3∧0/x₅\n\n= 0.6/x₁ + 0.7/x₂\
    \ + 0.5/x₃ + 0.2/x₄ + 0/x₅\n\nĀ = 1-0.9/x₁ + 1-0.7/x₂ + 1-1/x₃ + 1-0.2/x₄ + 1-0.3/x₅\n\
    \n= 0.1/x₁ + 0.3/x₂ + 0/x₃ + 0.8/x₄ + 0.7/x₅\n\nB̄ = 1-0.6/x₁ + 1-0.8/x₂ + 1-0.5/x₃\
    \ + 1-0.5/x₄ + 1/x₅\n\n## 分解定理与扩展原理\n\n在实际应用中，往往需要对模糊现象做出明确判定。因此，需要建立模糊集与经典集合的关系。经典集合中判断一个元素属于某集合的阈值是1，即一个元素相对于集合的特征函数值为1时，该元素属于这个集合，否则不属于这个集合。对于模糊集来说，可以取\
    \ λ∈[0,1] 作为阈值。\n\n设 A 为论域 U 上的模糊集， λ∈[0,1]，\n令 A_λ = {x | μ_A(x) ≥ λ}，称 A_λ 为\
    \ A 的 λ 截集。\n\n令 A_λ^• = {x∈U | μ_A(x) ≥ λ}，称 A_λ^• 为 A 的强 λ 截集。\n\n例 4.4 令 U\
    \ = {x₁, x₂, x₃, x₄, x₅}，\nA = 0.9/x₁ + 0.7/x₂ + 1/x₃ + 0.2/x₄ + 0.3/x₅，求 A₀.₃，A₀.₅，A₀.₇，A₁，A₀。\n\
    解 A₀.₃ = {x₁, x₂, x₃, x₅}，A₀.₅ = {x₁, x₂, x₃}，A₀.₇ = {x₁, x₂, x₃}，\nA₁ = {x₃}，A₀\
    \ = U。\n\n## 分解定理与扩展原理(续)\n\n- ◆ 定理4.1  $(A\\cup B)_\\lambda = A_\\lambda \\cup\
    \ B_\\lambda$, $(A\\cap B)_\\lambda = A_\\lambda \\cap B_\\lambda$\n- ◆ 定理4.2\
    \ 若 $\\lambda \\le \\mu$, 则 $A_\\lambda \\supseteq A_\\mu$。\n- ◆ 对 $U$ 上的模糊集合\
    \ $A$, 称 $A_1$ 为 $A$ 的核, 记作 $core(A)$, 即:\n  $core(A) = \\{x \\in U \\mid \\mu_A(x)=1\\\
    }$\n- ◆ 称 $SuppA = \\{x \\mid \\mu_A(x)>0\\}$ 为 $A$ 的支集, 称 $SuppA - A_1$ 为 $A$\
    \ 的边界。\n- ◆ 核 $core(A)$ 由完全隶属于 $A$ 的成员组成。若 $core(A)$ 不空, 则称 $A$ 为正规模糊集; 否则, 称为非正规模糊集。\n\
    \n![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_76_0.png)\n\n## 分解定理\n\n- 设 λ∈[0, 1],\
    \ A为论域U上的模糊集, λ和A的数乘记为 λA, 定义其隶属函数为: μ_{λA}(x)=λ∧μ_A(x)\n- 定理4.3(分解定理) 设 λ∈[0,\
    \ 1], A为模糊集, A_λ为A的λ截集, 则: A = ⋃_{λ∈[0,1]} λA_λ\n- 定理4.4(隶属函数形式的分解定理) 设 λ∈[0,\
    \ 1], A为模糊集, A_λ为A的λ截集, 是A_λ的特征函数, 则有: μ_A(x)= ∨_{λ∈[0,1]} (λ∧C_{A_λ}(x))\n\n\
    ![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_77_0.png)\n\n## 分解定理(续)\n\n下图用以说明分解定理的直观意义。图中只画出三个水平\
    \ λ，λ′，λ″下的隶属函数的图形。当λ取遍 (0,1) 上的所有值时，对应每一元素x取所有 λA_λ 隶属函数值中的最大值对应的点，再将这些点连成一条曲线即为模糊集A的隶属函数曲线。\n\
    \n![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_78_0.png)\n\nλ截集的概念及分解定理建立了经典集合与模糊集合的联系，是将模糊集合论中的问题转化为经典集合论中的问题的重要工具。\n\
    \n## 扩展原理\n\n扩展原理 X和Y是两个论域，映射f：X→Y\n\nA为X上的模糊集，A在映射f下的像是Y上的一个模糊集 B=f(A)，对∀y∈Y，\
    \ μ_B(y)= sup μ_A(x)，其中x∈X且y=f(x)。\n\n扩展原理使得模糊集A经f映射成模糊集f(A)时，模糊集A和f(A)的对应元素的隶属函数保持不变。\n\
    \n模糊集合允许将一个映射或关系的定义域从论域U上的点扩展到论域U上的模糊集。扩展原理不仅可以用于映射，还可以用于关系或谓词。\n\n![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_79_0.png)\n\
    \n## 模糊集的特征\n\n- 高：隶属函数值的上确界，即 Sup μ_A(x) 称为 A 的高，记作 hgt(A)。显然，模糊集是正规的，等价于其高为1。\n\
    - 单峰性：A 是单峰的，若隶属函数为单峰函数。\n- 凸性：模糊集 A 称为凸模糊集，当其隶属函数满足对 ∀x₁, x₂∈U, λ∈[0,1], μ_A(λ\
    \ x₁ - (1 - λ) x₂) ≥ min{ μ_A(x₁), μ_A(x₂) }\n- 基：给定有限论域 U 上的模糊集 A，A 的基定义为其隶属函数值的和，记作\
    \ Card(A)，即： Card(A) = Σ_{x∈U} μ_A(x) 若 U 是无限的，则定义 Card(A) = ∫_{x∈U} μ_A(x) d\
    \ x\n- 例如，模糊集 A=0.1/x₁+0.3/x₂+0.6/x₃+1.0/x₄+0.4/x₅，则 Card(A)=2.4。\n\n## 模糊集的度量\n\
    \n设映射 d：F(U)→[0,1]，如果满足条件：\n\n- (1) d(A)=0，当且仅当A为经典集合\n- (2) μ_A(x)恒为1/2时，d(A)=1\n\
    - (3) 当∀x∈U，|μ_A(x)-1/2| ≤ |μ_B(x)-1/2| 时，d(A) ≥ d(B)\n  则称 d(A) 为模糊集的模糊度。\n\n\
    U上的模糊度可看作从U到[0,1]的函数。所以，凡是用来度量函数间距离的方法都可以用來度量模糊集间的距离。\n\n若 d(x,y) ≥0，称 d(x,y)\
    \ 为 x 与 y 间的距离。应满足条件：\n\n- (1) d(x,y)=0，当且仅当 x = y\n- (2) d(x,y)=d(y,x)\n- (3)\
    \ d(x,y) ≤ d(x,z)+d(z,y)\n"
