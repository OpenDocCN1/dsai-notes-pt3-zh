  - '[PAGE 3]


    # 数据挖掘发展历程(续)


    面对海量数据库和大量繁杂信息，如何从中提取有价值的知识，提高信息的利用率，引发了一个新的研究方向：基于数据库的知识发现KDD (Knowledge Discovery
    in Database) 以及相应的数据挖掘 (Data Mining) 理论和技术的研究。


    +   1989年第十一届AAAI学术会议上首次出现KDD一词

    +   其后，在VLDB (Very Large Database) 及其他与数据库领域相关的国际学术会议上也举行了KDD专题研讨会。


    +   1995年召开第一届KDD国际学术会议（KDD’ 95）

    +   随后，每年召开一次这样的会议。


    +   1997年《Knowledge Discovery and Data Mining》

    +   该领域的第一本学术刊物，由Kluwers Publishers出版发行。


    +   1999年第三届亚太地区知识发现和数据挖掘国际会议

    +   这次北京会议将国内数据挖掘的研究推向新的高潮。


    +   随后，KDD的研究工作蓬勃展开'
  - '[PAGE 4]


    # KDD的定义


    公认的定义是1996年Fayyad等人提出的。


    +   所谓基于数据库的知识发现（KDD）是指从大量数据中提取有效的、新颖的、潜在有用的、最终可被理解的模式的非平凡过程。


    +   The nontrivial process of identifying valid, novel, useful and ultimately
    understandable patterns in data.'
  - '[PAGE 5]


    # KDD的定义(续)


    数据：指一个有关事实的集合，用以描述事物的基本信息。


    模式：语言L中的表达式E，E描述的数据是集合F的一个子集。表明集合F_E中的数据具有特性E。作为一个模式，E比枚举数据子集F_E简单。


    非平凡过程：指具有一定程度的智能性和自动性，不仅仅是简单地数值统计和计算。


    有效性(可信性)：从数据中发现的模式必须有一定的可信度，函数C将表达式映射到度量空间M_c，c表示模式E的可信度，c = C(E, F)。其中E∈L，E所描述的数据集合F_E
    ⊂ F。


    新颖性：用一个函数来表示模式的新颖程度N(E, F)，函数值是逻辑值或是对模式E的新颖程度的一个判断数值。新颖性从两个方面衡量：


    +   - 当前得到的数据与以前的数据或期望得到的数据之间比较

    +   - 对比发现的模式与已有模式的关系来判断


    潜在作用：指提取出的模式将来会实际运用，通过函数U把L中的表达式映射到测量空间M_U，u表示模式E的有作用程度，u=U(E, F)。


    可理解性：发现的模式应该能够被用户理解，这主要体现在简洁性上。用s表示模式E的简单度(可理解度)，s=S(E, F)。'
  - '[PAGE 6]


    # KDD的过程


    KDD过程主要由三个部分组成，即数据整理、数据挖掘和结果的解释评估。


    ![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_6_0.png)'
  - '[PAGE 7]


    # KDD的过程(续)


    +   ◆ 数据准备

    +   了解KDD应用领域的有关情况。包括熟悉相关的背景知识，搞清用户需求。

    +   ◆ 数据选取

    +   根据用户的需要从原始数据库中选取相关数据或样本。

    +   ◆ 数据预处理

    +   检查数据的完整性及一致性，消除噪声，滤除与数据挖掘无关的冗余数据，填充丢失的数据。

    +   ◆ 数据变换

    +   通过投影或利用数据库的其他操作减少数据量。

    +   ◆ 确定目标

    +   根据用户的要求，确定KDD要发现的知识类型。'
  - '[PAGE 8]


    # KDD的过程(续)


    # 选择算法


    选择合适的知识发现算法，包括选取合适的模型和参数。


    # 数据挖掘


    运用前面选择的算法，从数据库中提取用户感兴趣的知识，并以一定的方式表示出来。


    # 模式解释


    对在数据挖掘步骤中发现的模式（知识）进行解释。经过用户或机器评估后，剔除冗余或无关的模式。


    # 知识评价


    将发现的知识以用户能理解的方式呈现给用户。这期间包含对知识一致性的检查，以确信发现的知识不会与以前发现的知识相抵触。'
  - '[PAGE 9]


    ![](img/fdb7f7c7f235b9e1c41e242d1c6ef1c7_9_0.png)


    # 数据与系统特征


    KDD和数据挖掘可以应用在很多领域，KDD系统及其面临的数据具有一些公共特征：


    +   - 海量数据集。

    +   - 数据利用非常不足。

    +   - 在开发KDD系统时，领域专家对该领域的熟悉程度至关重要。

    +   - 最终用户专门知识缺乏。'
  - '[PAGE 10]


    # 数据结构与类型


    # 数据库中的数据


    +   - 数字实体: 数字、向量、二维矩阵或多维数组等。

    +   - 符号实体: 用来描述定性的量（如黑暗、明亮等）。

    +   - 概念实体: 描述某些概念等级时就会面对复合数据类型。


    # KDD观点的数据


    +   - 更关注对象间的等级差异

    +   - 信息颗粒化 (Granularity)

    +   - 数据分布


