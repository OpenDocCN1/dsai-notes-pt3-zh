- pgno: 1302
  md: '# Probabilistic Model-Based Clustering

    基于概率模型的聚类——一个说明聚类的一般框架


    +   之所以在数据集上进行聚类分析，是因为假定数据集中的对象属于不同的固有类别


    +   可以使用聚类趋势分析〈霍普金斯统计量〉考查数据集是否包含形成有意义的簇的对象。这里，隐藏在数据中的固有类别是潜在的，因为我们不可能直接观测到它们，而必须使用观测数据来推断。


    +   聚类分析的目标是发现隐藏的类别。作为聚类分析主题的数据集可以看做隐藏类别的可能实例的一个样本，但是没有类标号。由聚类分析导出的簇使用数据集推断，并且旨在逼近隐藏的类别。


    +   模糊簇提供了一种灵活性，允许一个对象属于多个簇。有没有一个说明聚类的一般框架，其中对象可以用概率的方法参与多个簇？


    +   基于概率模型的聚类可以回答这一问题


    +   从统计学讲，可以假定隐藏的类别是数据空间上的一个分布，可以使用概率密度函数（或分布函数）精确地表示。


    +   称这种隐藏的类别为概率簇C，它的密度函数f 和数据空间的点o， f(o) 是C的一个实例在o上出现的相对似然。


    +   A hidden category隐藏的类别 (i.e., probabilistic cluster概率簇) is a distribution
    over the data space, which can be mathematically represented using a probability
    density function (概率密度函数)or distribution function(分布函数).'
  merge: -1
  img_proc: true
