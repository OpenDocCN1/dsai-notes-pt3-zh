- pgno: 219
  md: '# 数据挖掘的研究热点


    目前，数据挖掘的研究热点围绕挖掘算法展开。数据挖掘是综合了机器学习、人工智能、数据统计等学科的研究领域。随着数据挖掘工具在实际应用中的迅速增长，相关学科成熟的算法实现不断地加入到数据挖掘中来；挖掘算法的研究还包括对现有挖掘算法的优化和改进，比如使用全局搜索算法优化神经网络学习过程。


    +   除此之外，数据挖掘还有以下研究热点：


    # 1. 数据挖掘原语


    我们把数据挖掘原语可以理解为有效辅助数据挖掘实施知识发现功能的思想和做法，是知识发现的辅助工具。数据挖掘原语的研究是为了支持有效的知识发现，为了让用户更加易于理解挖掘出来的知识。用户能够通过数据挖掘原语与数据挖掘系统通信，从不同的角度和深度审查发现结果，并指导挖掘过程。这组原语包括数据库说明的部分或用户感兴趣的数据集、要挖掘的知识类型、用于指导挖掘过程的背景知识、模式评估以及度量和如何显示所发现的知识等等。


    # 2. 数据挖掘语言及标准


    数据挖掘行业是高度分散的，公司和研究机构独立开发各自的数据挖掘系统和平台，没有形成开放性的标准；同时数据挖掘本身是一门多学科综合跨度非常大的技术，这些造成了数据挖掘在通用性方面存在一系列问题：①各种数据挖掘问题及挖掘方法基于不同的模型和技术，彼此互相孤立，联系很少；②缺少简明精确的问题描述方法，挖掘的语言通常是由实现方法决定；③数据挖掘系统仅提供孤立的知识发现功能，难以嵌入大型应用；④数据挖掘引擎与数据库系统是松散耦合的。数据挖掘语言和标准的开发有望解决上述问题。


    目前，已实现的数据挖掘语言有DMQL、MSQL和MINE RULE等；数据挖掘语言标准有PMML(DMG：数据挖掘组织协会)和OLE DB for Data
    Mining(微软)。'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# 数据挖掘的研究热点


    # 3.数据挖掘系统


    +   - 知识发现是一个有机的整体，各个部分之间有着密切的关系。我们称围绕某一数据挖掘任务的知识发现过程为数据挖掘系统。应该说所有的算法是为某一个挖掘系统服务的。数据挖掘系统的研究是为了建立科学的系统结构，利于挖掘算法的重用、嵌入，利于算法与系统其他模块有机结合。


    # 4.基于数据仓库的数据挖掘


    +   - 把数据挖掘建立在数据仓库之上，一方面能够提高数据仓库系统的决策支持能力，另一方面，由于数据仓库完成了数据的清洗、ETL(抽取，转换，装载)，数据挖掘面对的是经过初步处理的数据，更加有利于数据挖掘功能的发挥。这方面的研究集中在基于数据仓库的数据挖掘系统结构的探讨上。


    # 5.数据挖掘与具体应用的结合


    +   - 数据挖掘目前在医学、电信、零售业等多个应用领域均有成功的应用案例。随着越来越多的业务需求被不断明确，数据挖掘应用的领域和解决的问题会越来越广泛;一些应用系统，如ERP、SCM、HR等系统也逐渐与数据挖掘集成起来，用以提高系统的决策支持能力。这方面的研究热点包括数据挖掘与商业智能(BI)、CRM、WEB应用的结合。'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# 数据挖掘的技术工具

    分类


    +   - 数据挖掘工具根据其适用的范围分为两类：

    +     - **专用挖掘工具**

    +       - 针对某个特定领域的问题提供解决方案，在设计算法的时候充分考虑了数据、需求的特殊性，并作了优化。

    +       - 对任何领域，都可以开发特定的数据挖掘工具。例如，IBM公司的 AdvancedScout 系统针对NBA数据，帮助教练优化战术组合。

    +       - 特定领域的数据挖掘工具针对性强，只能用于一种应用；也正因为针对性强，往往采用特殊的算法，可以处理特殊的数据，实现特殊的目的，发现的知识可靠度也比较高。

    +     - **通用数据挖掘工具**

    +       - 不区分具体数据的含义，采用通用挖掘算法，处理常见数据类型。

    +       - 例如，IBM公司Almaden研究中心的QUEST系统，SGI公司的MineSet系统，加拿大SimonFraser大学的DBMiner系统。

    +       - 通用的数据挖掘工具可以做多种模式的挖掘，挖掘什么、用什么来挖掘都由用户根据自己的应用来选择。'
  merge: -1
  img_proc: true
