  md: '# 小波变换 Wavelet transform（续）

    哈尔函数（Haar小波）


    +   哈尔小波变换系数计算


    [例] 假设有一幅分辨率有4个像素P₀、P₁、P₂、P₃的一维图像，对应的像素值或称图像位置的系数分别为

    [9 7 3 5]

    计算该图像的哈尔小波变换系数


    +   步骤1：求均值(averaging)。计算相邻像素对的平均值，得到一幅分辨率比较低的新图像，它的像素数目变成了2个，即新的图像的分辨率是原来的1/2，相应的像素值为

    +   [8 4]'
