    +   \n+   $r_{A,B} = \\frac{\\sum_{i=1}^{n} (a_i - \\bar{A})(b_i - \\bar{B})}{(n-1)\\\
    sigma_A \\sigma_B} = \\frac{\\sum_{i=1}^{n} (a_i b_i) - n \\bar{A} \\bar{B}}{(n-1)\\\
