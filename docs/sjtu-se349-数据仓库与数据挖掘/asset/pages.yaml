- pgno: 663
  md: '# 模式增长方法的优势


    +   - 把一个大型的数据库压缩到一棵频繁模式树（FP-树）

    +     - 高浓缩，但对频繁项集挖掘是完整的

    +     - 避免了高花费的数据库扫描


    +   - 产生了一个高效的基于FP-树的频繁模式挖掘方法

    +     - 分治策略：把挖掘任务分解成小的任务

    +     - 避免候选集的产生：只检测子数据库'
  merge: -1
  img_proc: true
- pgno: 664
  md: '# 模式增长方法的优势


    +   - 分而治之：

    +     - 根据至今为止获得的频繁模式分解挖掘任务和数据库

    +   - 其他因素

    +     - 没有候选集的生成和测试

    +     - FP-tree structure压缩数据库

    +     - 没有对整个database 的重复扫描

    +     - Basic ops: 计算本地频繁项，构建子树。没有模式的搜索和匹配

    +   - A good open-source implementation and refinement of FPGrowth

    +     - FPGrowth+ (Grahne and J. Zhu, FIMI''03)'
  merge: -1
  img_proc: true
- pgno: 665
  md: '# 通过数据库投影扩展FP-Growth


    +   - 如果内存中FP-tree放不下怎么办？

    +     - 数据库投影

    +       - 将一个数据库分成多个投影

    +       - 为每个投影构造FP-tree并挖掘


    +   - Parallel projection vs. partition projection techniques

    +     - Parallel projection

    +       - Project the DB in parallel for each frequent item

    +       - Parallel projection is space costly

    +       - All the partitions can be processed in parallel

    +     - Partition projection

    +       - Partition the DB based on the ordered frequent items

    +       - Passing the unprocessed parts to the subsequent partitions'
  merge: -1
  img_proc: true
