- pgno: 517
  md: '# 主成分分析的数学模型


    假设我们所讨论的实际问题中，有p个指标，我们把这p个指标看作p个随机变量，记为X₁, X₂, …, Xₚ，主成分分析就是要把这p个指标的问题，转变为讨论m个新的指标F₁,
    F₂, …, Fₘ(m<p)，按照保留主要信息量的原则充分反映原指标的信息，并且相互独立。


    X = [ X₁₁ X₁₂ … X₁ₚ ; X₂₁ X₂₂ … X₂ₚ ; ⋮ ⋮ ⋮ ⋮ ; Xₙ₁ Xₙ₂ … Xₙₚ ] = ( X₁ X₂ … Xₚ
    ) 其中 Xᵢ = ( X₁ᵢ ; X₂ᵢ ; ⋮ ; Xₙᵢ )'
  merge: -1
  img_proc: true
- pgno: 518
  md: '这种由讨论多个指标降为少数几个综合指标的过程在数学上就叫做降维。主成分分析通常的做法是，寻求原指标的线性组合F_i。


    F₁ = a₁₁X₁ + a₂₁X₂ + ⋯ + aₚ₁Xₚ

    F₂ = a₁₂X₁ + a₂₂X₂ + ⋯ + aₚ₂Xₚ

    ⋯⋯

    Fₚ = a₁ₚX₁ + a₂ₚX₂ + ⋯ + aₚₚXₚ


    满足如下的条件：


    +   > 每个主成分的系数平方和为1。即

    +   a₁ᵢ² + a₂ᵢ² + ⋯ + aₚᵢ² = 1


    +   > 主成分之间相互独立，即无重叠的信息。即

    +   Cov(Fᵢ, Fⱼ) = 0, i ≠ j, i, j = 1, 2, ⋯, p

    +   Cov(A, B) = E((A - Ā)(B - B̄)) = Σᵢ₌₁ⁿ (aᵢ - Ā)(bᵢ - B̄) / n


    +   > 主成分的方差依次递减，重要性依次递减，即

    +   Var(F₁) ≥ Var(F₂) ≥ ⋯ ≥ Var(Fₚ)'
  merge: -1
  img_proc: true
- pgno: 519
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 520
  md: '# 主成分的计算


    先讨论二维情形


    $$X = \begin{pmatrix} X_{11} & X_{12} \\ X_{21} & X_{22} \\ \vdots & \vdots \\
    X_{n1} & X_{n2} \end{pmatrix} \triangleq \begin{pmatrix} X_1 & X_2 \end{pmatrix}$$


    求第一主成分**F₁**和**F₂**。


    已经把主成分F1和F2 的坐标原点放在平均值 $(\bar{x}_1, \bar{x}_2)$ 所在处，从而使得F1和F2 成为中心化的变量，即 **F1和F2**
    的样本均值都为零。'
  merge: -1
  img_proc: true
- pgno: 521
  md: '因此 **F₁** 可以表示为


    $$F_1=a_{11}(x_1-\bar{x}_1)+a_{21}(x_2-\bar{x}_2)$$


    **关键**是，寻找合适的单位向量 $(a_{11},a_{21})$，使 **F₁** 的方差最大。


    **问题的答案**是：**X** 的协方差矩阵 **S** 的最大特征根 $\lambda_1$ 所对应的单位特征向量即为 $(a_{11},a_{21})$。并且
    $\lambda_1$ 就是 **F₁** 的方差。'
  merge: -1
  img_proc: true
- pgno: 522
  md: '同样， F₂可以表示为 $F_2 = a_{12}(x_1 - \bar{x}_1) + a_{22}(x_2 - \bar{x}_2)$


    寻找合适的单位向量 $(a_{12}, a_{22})$，使F₂与F₁独立，且使F₂的方差（除F₁之外）最大。


    问题的答案是： X的协方差矩阵S的第二大特征根 $\lambda_2$ 所对应的单位特征向量即为 $(a_{12}, a_{22})$。并且 $\lambda_2$
    就是F₂的方差。'
  merge: -1
  img_proc: true
- pgno: 523
  md: '$F_1 = a_{11}(x_1 - \bar{x}_1) + a_{21}(x_2 - \bar{x}_2)$


    $F_2 = a_{12}(x_1 - \bar{x}_1) + a_{22}(x_2 - \bar{x}_2)$


    其中，$a_{ij}$称为因子载荷量


    因子载荷量：主成分与变量间的相关系数，

    即：因子载荷量的大小和它前面的正负号直接反映了

    主成分与相应变量之间关系的密切程度和方向。从而可以说明各主成分的意义'
  merge: -1
  img_proc: true
