- pgno: 1330
  md: '# Bi-Clustering (I): δ-Bi-Cluster


    # 使用δ-簇算法最优化


    +   - For a submatrix I x J

    +     $e_{iJ} = \frac{1}{|J|} \sum_{j \in J} e_{ij}$

    +     $e_{Ij} = \frac{1}{|I|} \sum_{i \in I} e_{ij}$

    +     - the mean of the i-th row:

    +     - The mean of the j-th column:

    +     - The mean of all elements in the submatrix is

    +     $e_{IJ} = \frac{1}{|I||J|} \sum_{i \in I, j \in J} e_{ij} = \frac{1}{|I|}
    \sum_{i \in I} e_{iJ} = \frac{1}{|J|} \sum_{j \in J} e_{Ij}$

    +     - The quality of the submatrix as a bi-cluster can be measured by the mean
    squared residue value均方残差

    +     $H(I \times J) = \frac{1}{|I||J|} \sum_{i \in I, j \in J} (e_{ij} - e_{iJ}
    - e_{Ij} + e_{IJ})^2$


    +   - A submatrix I x J is δ-bi-cluster if H(I x J) ≤ δ where δ ≥ 0 is a threshold.
    When δ = 0, I x J is a perfect bi-cluster with coherent values. By setting δ >
    0, a user can specify the tolerance of average noise per element against a perfect
    bi-cluster

    +     - 每个元素上的剩余residue(e_ij) = e_ij - e_iJ - e_Ij + e_IJ'
  merge: -1
  img_proc: true
- pgno: 1331
  md: '# Bi-Clustering (I): The δ-Cluster Algorithm


    +   - Maximal δ-bi-cluster 极大δ-双簇 is a δ-bi-cluster I x J such that there does
    not exist another δ-bi-cluster I′ x J′ which contains I x J

    +   - Computing is costly: Use heuristic greedy search贪心搜索 to obtain local optimal
    clusters

    +   - Two phase computation: deletion phase删除阶段 and additional phase增加阶段

    +   - Deletion phase: Start from the whole matrix, iteratively remove rows and
    columns while the mean squared residue of the matrix is over δ

    +     - At each iteration, for each row/column, compute the mean squared residue:

    +       $d(i) = \frac{1}{|J|} \sum_{j \in J} (e_{ij} - e_{iJ} - e_{Ij} + e_{IJ})^2$    $d(j)
    = \frac{1}{|I|} \sum_{i \in I} (e_{ij} - e_{iJ} - e_{Ij} + e_{IJ})^2$

    +     - Remove the row or column of the largest mean squared residue, 得到的子矩阵[I,J]是一个δ双簇

    +   - Addition phase:

    +     - Expand iteratively the δ-bi-cluster I x J obtained in the deletion phase
    as long as the δ-bi-cluster requirement is maintained

    +     - Consider all the rows/columns not involved in the current bi-cluster I
    x J by calculating their mean squared residues

    +     - A row/column of the smallest mean squared residue is added into the current
    δ-bi-cluster

    +   - It finds only one δ-bi-cluster, thus needs to run multiple times: replacing
    the elements in the output bi-cluster by random numbers'
  merge: -1
  img_proc: true
- pgno: 1332
  md: '# Bi-Clustering (II): δ-pCluster


    # 对于基于模式的簇


    +   - Enumerating all bi-clusters (δ-pClusters) [H. Wang, et al., Clustering by
    pattern similarity in large data sets. SIGMOD''02]

    +   - Since a submatrix I x J is a bi-cluster with (perfect) coherent values iff
    e_{i1j1} − e_{i2j1} = e_{i1j2} − e_{i2j2}. For any 2 x 2 submatrix of I x J, define
    p-score

    +     p-score( [[e_{i1j1}, e_{i1j2}], [e_{i2j1}, e_{i2j2}]] ) = |(e_{i1j1} − e_{i2j1})
    − (e_{i1j2} − e_{i2j2})|

    +   - A submatrix I x J is a δ-pCluster (pattern-based cluster) if the p-score
    of every 2 x 2 submatrix of I x J is at most δ, where δ ≥ 0 is a threshold specifying
    a user''s tolerance of noise against a perfect bi-cluster

    +   - The p-score controls the noise on every element in a bi-cluster, while the
    mean squared residue captures the average noise

    +   - Monotonicity单调性: If I x J is a δ-pClusters, every x x y (x,y ≥ 2) submatrix
    of I x J is also a δ-pClusters.

    +   - A δ-pCluster is maximal if no more row or column can be added into the cluster
    and retain δ-pCluster: We only need to compute all maximal δ-pClusters.'
  merge: -1
  img_proc: true
- pgno: 1333
  md: '# MaPle: Efficient Enumeration of δ-pClusters


    +   - Pei et al., MaPle: Efficient enumerating all maximal δ-pClusters. ICDM''03

    +   - Framework: Same as pattern-growth in frequent pattern mining (based on the
    downward closure property)

    +   - For each condition combination J, find the maximal subsets of genes I such
    that I x J is a δ-pClusters

    +     - If I x J is not a submatrix of another δ-pClusters

    +     - then I x J is a maximal δ-pCluster.

    +   - Algorithm is very similar to mining frequent closed itemsets

    +   - Additional advantages of δ-pClusters:

    +     - Due to averaging of δ -cluster, it may contain outliers but still within
    δ -threshold

    +     - Computing bi-clusters for scaling patterns, take logarithmic on

    +       \[ \frac{d_{xa} / d_{ya}}{d_{xb} / d_{yb}} < \delta \]

    +       will lead to the p-score form


