    +   - 自顶向下视图

    +     - 允许我们选择数据仓库所需的相关信息

    +   - 数据源视图

    +     - 揭示被操作数据库系统所捕获、存储和管理的信息

    +   - 数据仓库视图

    +     - 由事实表和维表所组成

