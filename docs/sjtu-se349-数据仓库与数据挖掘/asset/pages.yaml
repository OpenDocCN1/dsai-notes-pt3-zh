- pgno: 474
  md: "# 小波变换 Wavelet transform（续）\n\n# 哈尔函数（Haar小波）\n\n+   用小波对图像进行变换的两种方法\n+   —\
    \ 标准分解(standard decomposition)\n\n+   - 首先使用一维小波对图像每一行的像素值进行变换，产生每一行像素的平均值和细节系数，然后使用一维小波对这个经过行变换的图像的列进行变换，产生这个图像的平均值和细节系数\n\
    \n+   - 分解的过程如下：\n\n```\nprocedure StandardDecomposition(C: array [1...h, 1...w]\
    \ of reals)\n    for row 1 to h do\n        Decomposition(C [row, 1 ... w])\n\
    \    end for\n    for col 1 to w do\n        Decomposition(C [1 ... h, col])\n\
    \    end for\nend procedure\n```"
  merge: -1
  img_proc: true
