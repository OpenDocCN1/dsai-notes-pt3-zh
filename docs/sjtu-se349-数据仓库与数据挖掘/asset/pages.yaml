- pgno: 346
  md: '# 混合类型属性的相异性


    +   - 之前讨论的是如何计算相同类型的属性描述的对象间的相异性

    +   - 一个数据库可能包含所有的属性类型

    +     —标称的，对称二元的，非对称二元的，数值 的，序数的

    +   - 如何计算混合属性类型的对象间的相异性？

    +   - 第一种方法：每种类型的属性分为一组，对每种类型分别进行数据挖掘分析

    +     —大部分情况不能产生兼容的结果

    +   - 第二种方法:一起处理，只做一次分析

    +     —将不同的属性组合在一个相异性矩阵中，所有有意义属性转换到共同的区间[0.0, 1.0]上'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# 混合类型属性的相异性(Cont.)


    假设数据集包含p个混合类型的属性，对象i和j之间的相异性d(i,j)定义为：

    $$d(i,j)=\frac{\sum_{f=1}^{p}\delta_{ij}^{(f)}d_{ij}^{(f)}}{\sum_{f=1}^{p}\delta_{ij}^{(f)}}$$


    针对每一个属性f，对于其对i和j之间的相异性的贡献 $d_{ij}^{(f)}$


    +   - f是二元或者标称的： $d_{ij}^{(f)}=0$ if $x_{if}=x_{jf}$，否则$d_{ij}^{(f)}=1$

    +   - f是序数的：计算排位，映射，并将作为数值属性对待 $z_{if}=\frac{r_{if}-1}{M_f-1}$

    +   - f是数值 的： $d_{ij}^{(f)}=\frac{|x_{if}-x_{jf}|}{\max_h x_{hf}-\min_h x_{hf}}$
    其中h遍取属性f的所有非缺失对象


    对于指示符：


    +   - 如果$x_{if}$或$x_{jf}$缺失，或者$x_{if}=x_{jf}=0$并且f是非对称二元属性 $\delta_{ij}^{(f)}=0$

    +   - 否则，$\delta_{ij}^{(f)}=1$'
  merge: -1
  img_proc: true
