- pgno: 1284
  md: '# CLIQUE (Clustering In QUEst)

    CLIQUE：聚类高维空间 基本原理


    +   - 数据对象通常有数10个属性，其中许多可能不相关。属性的值可能差异很大。这些因素使得很难在整个数据空间找出簇。

    +   - 在数据的不同子空间中搜索簇可能更有意义。例如，考虑健康信息学应用，其中患者记录包含大量属性以描述个人信息、大量症状、身体状况和家族病史。找出在所有，甚至是在大部分属性上非常一致的患者群是不大可能的。

    +   - 例如，在禽流感患者中，age、gender和job属性可能在一个很宽的值域中显著变化。因此，很难在整个数据空间找出这样的簇。然而，通过子空间搜索，我们可能在较低维空间中发现类似患者的簇（例如，高烧、咳嗽但不流鼻涕等症状，年龄在3~16岁的类似的患者簇）。'
  merge: -1
  img_proc: true
- pgno: 1285
  md: '# CLIQUE (Clustering In QUEst)

    CLIQUE：聚类高维空间


    +   通过自动识别高维数据空间的子空间，来达到比在原空间更好聚类的目的


    +   CLIQUE 被看成是基于密度和基于网格的聚类方法


    +   它把每维划分成具有相等数目的等长度区间


    +   它把一个m维的数据空间划分维互不相交的矩形单元


    +   一个单元是密集的，如果包含在这个单元的数据点的总数超过了输入的模型参数


    +   簇定义为相连的密集单元的最大集合


    +   1: 找出对应于每个属性的一维空间中的所有稠密区域。这是稠密的一维单元的集合。

    +   2: k←2。

    +   3: repeat

    +   4: 由稠密的 k-1 维单元产生所有的候选稠密 k 维单元。

    +   5: 删除点数少于 ξ 的单元。

    +   6: k←k+1。

    +   7: until 不存在候选稠密 k 维单元。

    +   8: 通过合并所有邻接的、高密度的单元的并发现簇。

    +   9: 使用一小组描述簇中单元的属性值域的不等式概括每一个簇。'
  merge: -1
  img_proc: true
- pgno: 1286
  md: '# CLIQUE: The Major Steps

    CLIQUE: 主要步骤


    +   • 划分数据空间，找出每个划分单元中的点的数目

    +     — 把每维划分成不重叠的区间


    +   • 使用Apriori 法则识别包含簇的子空间

    +     — 任何一个k 维的单元区域是密集的，那么它在k-1 维空间上的投影也是密集，就从Ck 中去掉了那些有k-1 维的映射，使其没有包含在Ck-1
    中的单元


    +   • 识别簇:

    +     — 在所有的兴趣子空间中确定密度单元

    +     — 在所有的兴趣子空间中确定相连的密度单元


    +   • 为每个簇生成最小化的描述

    +     — 对每个簇，确定覆盖相连的密度单元的最大区域

    +     — 然后为每个簇确定最小覆盖'
  merge: -1
