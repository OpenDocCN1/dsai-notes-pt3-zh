- pgno: 581
  md: '# 概念分层Cont.


    +   概念分层为不同级别上的数据汇总提供了一个良好的基础


    +   综合概念分层和多维数据模型的潜力，可以对数据获得更深入的洞察力


    +   通过在多维数据模型中，在不同的维上定义概念分层，使得用户在不同的维上从不同的层次对数据进行观察成为可能


    +   多维数据模型（数据立方体）使得从不同的角度对数据进行观察成为可能


    +   概念分层则提供了从不同层次对数据进行观察的能力


    +   结合这两者的特征，可以在多维数据模型上定义各种OLAP操作，为用户从不同角度不同层次观察数据提供了灵活性'
  merge: -1
  img_proc: true
- pgno: 582
  md: '# 度量的分类和计算


