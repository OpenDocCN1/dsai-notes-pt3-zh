- pgno: 1101
  md: '# 模糊集合及其运算


    模糊子集通常简称为模糊集，其表示方法有：


    # （1）Zadeh表示法


    $$A = \frac{A(x_1)}{x_1} + \frac{A(x_2)}{x_2} + \cdots + \frac{A(x_n)}{x_n}$$


    这里 $\frac{A(x_i)}{x_i}$ 表示 $x_i$ 对模糊集 $A$ 的隶属度是 $A(x_i)$。


    如“将一1,2,3,4组成一个小数的集合”可表示为


    $$A = \frac{1}{1} + \frac{0.8}{2} + \frac{0.2}{3} + \frac{0}{4}$$


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1101_0.png)'
  merge: -1
