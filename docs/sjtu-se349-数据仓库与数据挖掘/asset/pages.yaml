  md: '# Clustering Graphs and Network Data


    +   Applications

    +   — Bi-partite graphs偶图, e.g., customers and products, authors and conferences

    +   — Web search engines, e.g., click through graphs查询 and Web graphs网页，通过WEB图可以检测权威网页和垃圾网页

    +   — Social networks, friendship/coauthor graphs


