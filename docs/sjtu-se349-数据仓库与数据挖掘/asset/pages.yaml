- pgno: 1455
  md: '# Outlier Discovery: Statistical

    Approaches


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1455_0.png)


    Assume a model underlying distribution that generates data set

    (e.g. normal distribution)


    +   - Use discordancy tests depending on

    +     - data distribution

    +     - distribution parameter (e.g., mean, variance)

    +     - number of expected outliers


    +   - Drawbacks

    +     - most tests are for single attribute

    +     - In many cases, data distribution may not be known'
  merge: -1
  img_proc: true
- pgno: 1456
  md: '# Outlier Discovery: Distance-Based Approach


    +   - Introduced to counter the main limitations imposed by statistical methods

    +     - We need multi-dimensional analysis without knowing data distribution

    +   - Distance-based outlier: A DB(p, D)-outlier is an object O in a dataset T
    such that at least a fraction p of the objects in T lies at a distance greater
    than D from O

    +   - Algorithms for mining distance-based outliers [Knorr & Ng, VLDB’98]

    +     - Index-based algorithm

    +     - Nested-loop algorithm

    +     - Cell-based algorithm'
  merge: -1
  img_proc: true
- pgno: 1457
  md: '# Density-Based Local Outlier Detection


    +   - M. M. Breunig, H.-P. Kriegel, R. Ng, J. Sander. LOF: Identifying Density-Based
    Local Outliers. SIGMOD 2000.

    +   - Distance-based outlier detection is based on global distance distribution

    +   - It encounters difficulties to identify outliers if data is not uniformly
    distributed

    +   - Ex. C₁ contains 400 loosely distributed points, C₂ has 100 tightly condensed
    points, 2 outlier points o₁, o₂

    +   - Distance-based method cannot identify o₂ as an outlier


    +   - Need the concept of local outlier

    +   - Local outlier factor (LOF)

    +     - Assume outlier is not crisp

    +     - Each point has a LOF


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1457_0.png)'
  merge: -1
  img_proc: true
- pgno: 1458
  md: '# Outlier Discovery: Deviation-Based Approach


    +   - Identifies outliers by examining the main characteristics of objects in
    a group

    +   - Objects that “deviate” from this description are considered outliers

    +   - Sequential exception technique

    +     - simulates the way in which humans can distinguish unusual objects from
    among a series of supposedly like objects

    +   - OLAP data cube technique

    +     - uses data cubes to identify regions of anomalies in large multidimensional
    data'
  merge: -1
  img_proc: true
