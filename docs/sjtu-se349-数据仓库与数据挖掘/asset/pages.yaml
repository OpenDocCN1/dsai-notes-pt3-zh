- pgno: 536
  md: '# # What is a Data Warehouse?

    ## 什么是数据仓库？


    +   - **数据仓库的定义很多，但却很难有严格的定义**

    +     - 它是一个提供决策支持功能的数据库，它与公司的操作数据库分开维护

    +     - 为统一的历史数据分析提供坚实的平台，对信息处理提供支持


    +   - **数据仓库区别于其他数据存储系统**

    +     - “A data warehouse is a **subject-oriented, integrated, time-variant, and
    nonvolatile** collection of data in support of management’s decision-making process.”

    +     - “数据仓库是一个**面向主题的、集成的、随时间而变化的、不容易丢失的**数据集合，支持管理部门的决策过程。” —— W. H. Inmon


    +   - **数据仓库的 四个关键特征**

    +     - 面向主题的（Subject-oriented）

    +     - 集成的（Integrated）

    +     - 时变的（Time-variant）

    +     - 非易失的（Nonvolatile）'
  merge: -1
  img_proc: true
