- pgno: 130
  md: '# 大数据在高铁轨道检修中的应用


    +   - **轨道状态检测模型的应用**

    +     - 法国高速铁路为例，它通过车体振动加速度和转向架振动加速度来评价轨道质量状态。

    +     - 其轨道状态检测模型最终按轨道的质量状态分为四级

    +     - 有了轨道质量状态评价和控制，业务人员就可以很方便地按照指示完成任务


    | 轨道质量状态 | 对应质量状态描述 |

    |---|---|

    | 目标值（VO） | 新线铺设、维修作业后应达到的质量标准 |

    | 警告值（VA） | 达到或超过此值的轨道不平顺，要实施重点观测，分析其发展变化情况并做出维修计划 |

    | 干预值（VI） | 达到或超过此值的地点或区段要实施必要的维修作业，一般在15天之内予以实施，并使其达到目标值 |

    | 限速值（VR） | 达到或超过该值的地点或区段列车必须降速行驶，并以任何可能的手段包括手工作业予以整治 |'
