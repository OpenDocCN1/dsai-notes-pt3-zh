- pgno: 794
  md: '# 贝叶斯定理：基础


    +   - 朴素贝叶斯分类算法和贝叶斯信念网络分类算法都是建立在贝叶斯定理基础上

    +   - 基本概念

    +     - 设X是类标签未知的数据样本

    +       - X: 一位35岁、收入4万美元的顾客

    +     - 设H为某种假设，如数据元组X属于某个特定类C

    +       - H: 顾客将购买计算机

    +     - P(H)（先验概率）：假设H的先验概率

    +       - 任意给定顾客将购买计算机的概率，不管年龄、收入或其他任何信息

    +     - P(H|X)（假设H的后验概率）：给定一个观察数据样本X，假设成立的概率

    +       - 反映知道顾客的年龄和收入时，顾客 X 将买计算机的概率

    +     - P(X)（先验概率）:样本数据X的先验概率

    +       - 顾客集合中35岁、收入4万美元的概率

    +     - P(X|H)（样本X的后验概率）:在给定假设H的前提条件下，样本X的后验概率

    +       - 已知顾客购买计算机，那么该顾客35岁且收入4万美元的概率'
  merge: -1
  img_proc: true
