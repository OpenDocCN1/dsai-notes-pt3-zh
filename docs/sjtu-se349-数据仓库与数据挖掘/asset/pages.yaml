- pgno: 154
  md: '# （2）数据仓库


    # 数据仓库


    +   - 是一个从多个数据源收集的信息存储库，存放在一致的模式下，并且通常驻留在单个站点上。

    +   - 通过数据清理、数据变换、数据集成、数据装入和定期数据刷新来构造。

    +   - 数据仓库中的数据是围绕主题（如顾客、商品、供应商和活动）组织。数据存储从历史的角度（如过去的6 ~ 12个月）提供信息，并且通常是汇总的。例如，数据仓库不是存放每个销售事务的细节，而是存放每个商店、每类商品的销售事务的汇总，或汇总到较高层次，即每个销售地区、每类商品的销售事务的汇总。


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_154_0.png)'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# （2）数据仓库


    +   数据仓库用称做数据立方体的多维数据结构建模。其中，每个维对应于模式中的一个或一组属性，而每个单元存放某种聚集度量值。


    +   尽管数据仓库工具对于支持数据分析是有帮助的，但是进行深入分析仍然需要更多的数据挖掘工具


    +   — 多维数据挖掘（又称探索式多维数据挖掘）以 OLAP风格在多维空间进行数据挖掘。


