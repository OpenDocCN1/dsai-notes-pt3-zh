- pgno: 288
  md: '# Basic Statistical Descriptions of Data


    数据的基本统计描述 之 数据散布


    极差、五数概括（基于四分位数）、中间四分位数极差


    —极差（range）


    +   数据集的最大值和最小值之差


    —分位数（quantile）是取自数据分布的每隔一定间隔上的点，把数据划分成基本上大小相等的连贯集合


    +   2-分位数是一个数据点，它把数据分布划分成高低两半，分位数对应于中位数。


    +   4-分位数是3 个数据点，它们把数据分布划分成4 个相等的部分，使得每部分表示数据分布的四分之一。


    +   100-分位数把数据分布划分成100个大小相等的连贯集


    —中间四分位数极差(IQR): IQR = Q3 − Q1


    +   四分位数: Q1 (25th percentile), Q3 (75th percentile)


    —孤立点: 挑出落在至少高于第三个四分位数或低于第一个四分位数 1.5×IQR处的值


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_288_0.png)'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# Basic Statistical Descriptions of Data


    数据的基本统计描述 之 数据散布


    # 五数概括（five-number summary）


    +   - min, Q1, Median, Q3, max

    +   - 用来比较若干个可比较的数据集


    # 盒图


    +   - 数据分布的一种直观表示

    +   - 端点在四分位数上，使得盒图的长度是IQR

    +   - 中位数M用盒内的线标记

    +   - 胡须延伸到最大最小观测值


    +   - 胡须在出现在四分位数 的1.5×IQR 之内的最极编的观测值处终止

    +   - 剩下的情况个别地给出（175和202均大于IQR的1.5倍，这里IQR=40）


    该盒图为在给定时间段在AllElectronics的4个分店销售的商品单价的盒图


    +   - 分店1

    +     - 中位数$80

