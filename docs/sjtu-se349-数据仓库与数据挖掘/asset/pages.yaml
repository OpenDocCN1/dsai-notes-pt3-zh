- pgno: 78
  md: '# 云计算的3类服务之三


    # 云中宾馆——SaaS（软件即服务）


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_78_0.png)


    软件即服务（SaaS）是最成熟、最知名，也是得到最广泛应用的一种云计算。它是指提供商通过互联网为用户提供应用软件服务，用户以按需付费的方式从提供商那里订购并获取应用软件服务，不需要购买软件及相关基础设施，也无需对软件进行升级维护。提供商将应用软件统一部署在自己的服务器上，用户可以根据自己的实际需求，通过互联网向提供商订购所需的应用程序服务，根据并发用户的数量、所用功能类型、数据存储容量、使用时间长短等因素的不同组合按需支付服务费用，并通过互联网获得提供商提供的服务。SaaS改变了操作系统、中间件等作为产品配置在客户端的传统，软件可以租用；用户端可以零安装、零维护、零剩余。


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_78_1.png)'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# SaaS（软件即服务）


    +   - SaaS是指用户获取软件服务的一种新形式

    +     - 不需要用户将软件产品安装在自己的电脑或服务器上，而是按某种服务水平协议（SLA）直接通过网络向专门的提供商获取自己所需要的、带有相应软件功能的服务

    +     - 本质上而言，SaaS就是软件服务提供商为满足用户某种特定需求而提供其消费的软件的计算能力


    +   - SaaS有各种典型的应用

    +     - 工具型服务：在线邮件服务、网络会议、网络传真、在线杀毒等

    +     - 管理型服务：在线CRM、在线HR、在线进销存、在线项目管理等


    +   - SaaS是未来软件业的发展趋势，微软、Salesforce、用友、金蝶等国内外软件巨头都推出了SaaS应用'
