- pgno: 1476
  md: '# Views on Data Mining Foundations (I)


    +   - **Data reduction**

    +     - Basis of data mining: Reduce data representation

    +     - Trades accuracy for speed in response

    +   - **Data compression**

    +     - Basis of data mining: Compress the given data by encoding in terms of
    bits, association rules, decision trees, clusters, etc.

    +   - **Probability and statistical theory**

    +     - Basis of data mining: Discover joint probability distributions of random
    variables'
  merge: -1
  img_proc: true
- pgno: 1477
  md: '# Views on Data Mining Foundations (II)


    +   - **Microeconomic view**

    +     - A view of utility: Finding patterns that are interesting only to the extent
    in that they can be used in the decision-making process of some enterprise

    +   - **Pattern Discovery and Inductive databases**

    +     - Basis of data mining: Discover patterns occurring in the database, such
    as associations, classification models, sequential patterns, etc.

    +     - Data mining is the problem of performing inductive logic on databases

    +     - The task is to query the data and the theory (i.e., patterns) of the database

    +     - Popular among many researchers in database systems'
  merge: -1
  img_proc: true
