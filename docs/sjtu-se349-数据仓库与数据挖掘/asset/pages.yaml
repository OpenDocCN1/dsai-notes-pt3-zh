- pgno: 706
  md: '# 决策树归纳（决策树构建）的关键问题

    （1）分裂属性的选择


    虽然可以采用任何一个属性作为分裂属性对数据集进行划分，但最后形成的决策树会差异很大，有的是非常简化的，有的是很臃肿的


    +   — 对于分类算法，简洁的表示往往意味着性能要好，即对未知的实例分类效果好，需要找到合适的分裂属性选择方法


    分裂属性选择度量原则


    +   — 根据分裂准则，把数据分区 D 划分为较小分区（最好是“纯”的，一个分区是纯的，如果它的所有元组都属于同一类）


    +   — 选择具有最好度量得分的属性作为给定元组的分裂属性


    分裂属性选择度量方法


    +   — 一般是根据某种启发信息或者是统计信息来进行选择，常用属性选择度量方法


    +   • 信息增益（ID3）

    +   • 增益率（C4.5）

    +   • 基尼指数（CART）'
  merge: -1
  img_proc: true
- pgno: 707
  md: '# 决策树归纳（决策树构建）的关键问题

    （2）获得合适的树


    +   理论上，决策树划分可以进行到数据样本集中所有样本都属于同一个类别为止，但这样得到的决策树可能层次太深，甚至每个叶节点上只有一个实例，这样的决策树叶节点由于支持度不够，即规律不具有普遍性，预测能力较弱


    +   决策树归纳的目的是希望生成能够揭示数据集结构并且预测能力很强的树，在树完全生长的时候有可能预测能力反而下降，为此需要获得大小合适的树


    +   一般来说，获取方法有两种


    +   —定义树的停止生长条件


    +   最小划分实例数：当处理节点对应的数据集子集的大小小于指定的最小划分实例数时，即使它们不属于同一类，也不再进一步划分


    +   划分阈值：当使用的划分方法所得的值与父节点的值的差小于指定阈值时，不再进一步划分


    +   最大树深度：当进一步划分将超过最大树深度时，停止划分


    +   —对完全生长的决策树进行剪枝


    +   对决策树的子树进行评估，若去掉该子树后整个决策树表现更好，则该子树将被剪枝'
  merge: -1
  img_proc: true
- pgno: 708
  md: '# 决策树归纳算法


    +   - 在20世纪70年代后期和20世纪80年代初期，机器学习研究人员J.Ross Quinlan开发了决策树算法，称为迭代的二分器（Iterative
    Dichotomiser，ID3）。这项工作扩展了E.B. Hunt，J.Marin和P.T.Stone的概念学习系统。

    +   - Quinlan后来提出了C4.5（ID3的后继），成为了新的监督学习算法的性能比较基准

    +   - 1984年，多位统计学家（L.Breiman、J.Friedman、R.Olshen、C.Stone）出版著作《Classification and
    Regression Trees》（CART），介绍二叉决策树的产生

    +   - ID3和CART大约同时独立地发明，但是从训练元组学习决策树都采用了类似的方法，这两个基础算法引发了决策树归纳研究的旋风'
