- pgno: 1424
  md: '# Parametric Methods II: Detection of Multivariate Outliers

    多元离群点检测


    +   Multivariate data: A data set involving two or more attributes or variables


    +   Transform the multivariate outlier detection task into a univariate outlier
    detection problem


    +   Method 1. Compute Mahalaobis distance 使用马哈拉诺比斯距离识别离群点

    +   — Let õ be the mean vector 均值向量 for a multivariate data set. Mahalaobis distance
    for an object o to õ is MDist(o, õ) = (o − õ)ᵀ S⁻¹(o − õ) where S is the covariance
    matrix 协方差矩阵

    +   — Use the Grubb''s test on this measure to detect outliers


    +   Method 2. Use χ²–statistic 使用 χ²统计量的多元离群点检测

    +   — where Eᵢ is the mean of the i-dimension among all objects, and n is the
    dimensionality 维度

    +   χ² = Σᵢ=1ⁿ (oᵢ − Eᵢ)² / Eᵢ

    +   — If χ²–statistic is large, then object oᵢ is an outlier'
  merge: -1
  img_proc: true
- pgno: 1425
  md: '# Parametric Methods III: Using Mixture of Parametric Distributions 使用混合参数分布


    +   - Assuming data generated by a normal distribution could be sometimes overly
    simplified


    +   - Example (right figure): The objects between the two clusters cannot be captured
    as outliers since they are close to the estimated mean 估计的均值落在这两个簇之间，而小''是任何一个簇的内部。这两个簇之间的对象不可能被检测为离群点，因为它们离均值很近


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1425_0.png)


    To overcome this problem, assume the normal data is generated by two normal distributions.
    For any object o in the data set, the probability that o is generated by the mixture
    of the two distributions is given by


    Pr(o|Θ₁, Θ₂) = f_Θ₁(o) + f_Θ₂(o)


    where f_Θ₁ and f_Θ₂ are the probability density functions of Θ₁ and Θ₂


    +   - Then use EM algorithm to learn the parameters μ₁, σ₁, μ₂, σ₂ from data


    +   - An object o is an outlier if it does not belong to any cluster'
  merge: -1
  img_proc: true
- pgno: 1426
  md: '# Non-Parametric Methods: Detection Using Histogram

    使用直方图检测离群点


    +   - The model of normal data is learned from the input data without any *a priori*
    structure.

    +   - Often makes fewer assumptions about the data, and thus can be applicable
    in more scenarios

    +   - Outlier detection using histogram:


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1426_0.png)


    +   - Figure shows the histogram of **purchase amounts in transactions** 每笔事务的购买量

    +   - A transaction in the amount of $7,500 is an outlier, since only 0.2% transactions
    have an amount higher than $5,000


    +   - **Problem:** Hard to choose an **appropriate bin size** 合适的箱尺寸 for histogram

    +     - Too small bin size → normal objects in empty/rare bins, false positive
    将正常点误识别为离群点，导致高假正率和低精度

    +     - Too big bin size → outliers in some frequent bins, false negative 将离群点当成正常点，导致高假负率和低召回率


    +   - **Solution:** Adopt **kernel density estimation** 核密度估计 to estimate the
    probability density distribution of the data. If the estimated density function
    is high, the object is likely normal. Otherwise, it is likely an outlier.'
  merge: -1
