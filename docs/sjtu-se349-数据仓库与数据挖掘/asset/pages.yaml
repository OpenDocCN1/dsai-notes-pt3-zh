- pgno: 808
  md: '# Using IF-THEN Rules for Classification

    使用 IF-THEN 规则分类（Cont）


    +   - 如果规则被 *X* 满足，则称该规则被 触发。

    +   - 如果规则 R1 是 唯一 满足的规则，则该规则被 激活，返回 *X* 的类预测。


    如果有 多个规则 被触发，则需要解决冲突


    +   - 如果她们指向了不同的类怎么办？

    +     - 规模序：把最高优先权赋予具有最多属性测试（最苛刻）的规则

    +     - 基于类的规则序：优先级按照普遍性降序排序，最普遍（或最频繁）类的所有规则首先出现，次普遍类的规则随后，如此等作为选择。也可以根据每个类的误分类代价排序。每个类中规则是无序的，不存在类冲突。

    +     - 基于规则的规则序：根据准确度、覆盖率等等把规则组织成一个优先权列表（决策表）


    如果不存在 *X* 满足规则的情况？


    根据训练集指定一个默认类（默认类的选择视算法而定），可以建立一个省缺或默认规则，根据训练集指定一个默认类。这个类可以是多数类，或者不被任何规则覆盖的元组多数类。当且仅当没有其他规则覆盖*X*
    时，最后才使用默认规则。默认规则的条件为空。这样，当没有其他规则时该规则被激活。'
  merge: -1
  img_proc: true
- pgno: 809
  md: "# Rule Extraction from a Decision Tree\n\n# 由决策树提取规则\n\n+   - IF-THEN规则更容易理解\n\
    +   - 对每条从根到树叶节点的路径创建一个规则\n+   - E.g., *buys_computer* 决策树\n\n![](img/6d25e92eb0bd56a22c311279c19b06b4_809_0.png)\n\
    \n+   - IF age = young AND student = no  \n+     THEN *buys_computer* = no\n+\
    \   - IF age = young AND student = yes  \n+     THEN *buys_computer* = yes\n+\
    \   - IF age = mid-age  \n+     THEN *buys_computer* = yes\n+   - IF age = old\
    \ AND *credit_rating* = excellent  \n+     THEN *buys_computer* = no\n+   - IF\
    \ age = old AND *credit_rating* = fair  \n+     THEN *buys_computer* = yes\n\n\
    提取的每个规则之间蕴涵着析取（逻辑OR关系）。这些规则是互斥的和穷举的：互斥意味着不可能存在规则冲突，因为没有两个规则被相同的元组触发（每个树叶有一个规则，并且任何元组都只能映射到一个树叶）；穷举意味着对于每种可能的属性-值组合都存在一个规则，使得该规则集不需要默认证则。规则的序不重要，是无序的。"
  merge: -1
  img_proc: true
- pgno: 810
  md: '# Rule Induction: Sequential Covering Method


    使用顺序覆盖算法的规则归纳


    +   顺序覆盖算法： 直接从训练数据提取IF-THEN规则

    +   —不必产生决策树

    +   —规则被顺序地学习，一次一个


    +   典型的顺序覆盖算法： FOIL,AQ,CN2,RIPPER


    为C类学习规则时，希望它能够覆盖C类所有（或许多）的训练元组，并且没有（或很少）覆盖其他类的元组


    +   步骤：

    +   —一次学习一条规则

    +   —每学习一个规则，就把该规则覆盖的元组删除

    +   —在剩下的元组上重复该过程直到满足终止条件 e.g. 没有更多的训练元组或者返回的规则质量低于用户指定的阈值


    +   与决策树归纳做比较： 同时学习一组规则'
  merge: -1
  img_proc: true
- pgno: 811
  md: '# 顺序覆盖算法


    Input:


    +   - **D**, a data set of class-labeled tuples;

    +   - **Att vals**, the set of all attributes and their possible values.


    Output: A set of IF-THEN rules.


    Method:


    ```

    (1) Rule set D fg; // initial set of rules learned is empty

    (2) for each class c do

    (3) repeat

    (4) Rule D Learn One Rule(D, Att vals, c);

    (5) remove tuples covered by Rule from D;

    (6) Rule set D Rule set CRule; // add new rule to rule set

    (7) until terminating condition;

    (8) endfor

    (9) return Rule Set;

    ```'
  merge: -1
  img_proc: true
