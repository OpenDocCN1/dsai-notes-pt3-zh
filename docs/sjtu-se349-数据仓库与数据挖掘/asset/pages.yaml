- pgno: 1218
  md: "# Hierarchical Clustering　层次聚类\n\n+   • **分裂方法的一个挑战是如何把一个大簇划分成几个较小的簇**\n+ \
    \  \n+     — 例如，把 n 个对象的集合划分成两个互斥的子集有 $2^{n-1}-1$ 种可能的方法，其中 n 是对象数。当 n 很大时，考察所有的可能性的计算量是令人望而却步的。\n\
    +   \n+     — **分裂方法通常使用启发式方法进行划分**，但可能导致不精确的结果。\n\n+   • 为了效率，分裂方法通常不对已经做出的划分决策回溯。\n\
    +   \n+     ◦ 一旦一个簇被划分，该簇的任何可供选择其他划分都不再考虑。**由于分裂方法的这一特点，凝聚方法远比分裂方法多。**"
  merge: -1
