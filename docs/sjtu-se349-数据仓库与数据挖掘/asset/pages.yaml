  md: '# 抽样Sampling


    +   - 抽样Sampling: 获得小样本 *s* 表达大数据集 *N*

    +   - 挖掘算法的复杂度可能亚线性（sub-linear）于数据大小

    +   - 主要准则: 选出数据集中有代表性的子集

    +     - 简单随机抽样可能有偏差的存在，表现很差

    +     - 开发自适应采样方法, e.g., 分层抽样

    +   - 注意: 抽样方法可能不会减少数据库的读写'
