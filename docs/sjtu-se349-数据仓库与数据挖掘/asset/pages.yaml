- pgno: 929
  md: '# 机器学习基础


    # VC维（函数的复杂度）的概念


    +   - VC维（Vapnik-Chervonenkis Dimension）

    +     - 对于二值分类问题，其目标函数f只有0和1两种取值，称这类函数为指示函数

    +     - 对一个指示函数集，如果存在h个样本能够被函数集里的函数按照所有可能的2^h种形式分开，则称函数集能够把h个样本打散。函数集的VC维就是它能打散的最大样本数目h。

    +     - VC维代表了机器的学习能力，其值越大表明其学习机器的学习能力越强，但学习机器就越复杂。


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_929_0.png)'
  merge: -1
