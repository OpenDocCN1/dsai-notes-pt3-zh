  md: '# （1）产品质量的有效控制


    +   以T钢铁公司1549mm热连轧生产线板材抗拉强度和延伸率质量控制问题为例


    +   T公司板材成本老是比国外同行‘略高一筹’，致使在国际竞标中屡屡失败。T公司设备并不比国外竞争对手差，原材料来源与竞争对手也没有什么区别


    +   把竞争对手的产品一一进行物理性能测试。结果令人大跌眼镜，国外产品的两个主要性能指标抗拉强度和延伸率竟然比T公司的应标产品低了不少


    +   在满足用户需求的情况下，降低抗拉强度和延伸率必然会降低产品成本，当然会赢得降价空间'
