- pgno: 577
  md: '# 维：概念分层


    +   - 一个概念分层（concept hierarchy）定义一个映射序列，将低层概念映射到更一般的高层概念

    +     - E.g. 表示location的概念：杭州→浙江→中国→亚洲

    +     - 概念分层允许我们在各种抽象级审查和处理数据


    +   - 概念分层可以由系统用户、领域专家、知识工程师人工的提供，也可以根据数据分布的统计分析自动的产生'
  merge: -1
  img_proc: true
