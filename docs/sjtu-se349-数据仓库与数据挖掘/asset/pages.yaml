  md: '# 概念分层产生 Concept Hierarchy Generation


    +   - 概念层次组织概念(i.e., **attribute values**)通常用在数据仓库中的每个维度相关联

    +   - 概念层次结构便于在数据仓库中多粒度查看数据

    +   - 概念层次的形成：递归通过收集和更高层次的概念（如青年，成年，或高级）取代低层次的概念（如年龄数值）减少数据

    +   - 概念分层可以由该领域的专家和/或数据仓库设计人员显式地指定

    +   - 概念分层可以为数值数据和标称数据自动形成，对于数字数据，显示使用离散化方法'
