  md: '# 小波变换 Wavelet transform（续）


    +   - 1980: Morlet

    +     - 20世纪70年代，在法国石油公司工作的年轻地球物理学家Jean Morlet提出小波变换 (wavelet transform, WT)的概念。

    +     - 20世纪80年代, 开发了连续小波变换 (continuous wavelet transform, CWT)

    +   - 1986: Y.Meyer

    +     - 法国科学家Y.Meyer与其同事创造性地构造出具有一定衰减性的光滑函数，用于分析函数

    +     - 用缩放(dilations)与平移(translations)均为2^j (j≥0的整数)的倍数构造了L²(R)空间的规范正交基，使小波分析得到发展'
  merge: -1
