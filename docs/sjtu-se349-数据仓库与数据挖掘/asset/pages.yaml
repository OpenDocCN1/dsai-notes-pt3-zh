- pgno: 1180
  md: '# Boosting


    # 集成分类器 —— 2) 提升


    # Adaboost: 一种流行的提升算法


    +   - 十大算法之一


    由Yoav Freund和Robert Schapire提出的最重要的集成学习方法，具有可靠的理论基础、精确的分类精度、简单实现代码，被广泛成功地应用。


    # Adaboost算法原理


    +   - 假设S表示样本数据集，Y表示类标号集，Y={-1,+1}


    +   - 给定一个基分类器和一个训练集S={(xi,yi)}，其中yi属于Y(i=1,...,N)


    +   - 首先给所有的训练样本(xi,yi)(i=1,...,N)分配相同的权重，并指定第t轮提升的权重为Wt


    +   - 通过调用基分类器，从训练集和Wt中产生一个弱学习器ht:X—Y


    +   - 然后使用训练样本来测试ht，并增加分类错误的样本的权重，获得更新的权重值Wt+1


    +   - 从训练集和Wt+1中通过再次调用基分类器产生另外一个弱学习器


    +   - 反复执行T轮，最终的模型是由T个弱学习器基于权重的投票结果，每个弱学习器的权重是在训练阶段产生的'
  merge: -1
  img_proc: true
- pgno: 1181
  md: '# Boosting


    # 集成分类器 —— 2) 提升


    # Adaboost算法伪代码


    ```

    算法：Adaboost——构建并行算法——创建分类器的组合。每个输出一个加权投票集。


    输入：

    - D：类标记的训练元组集。

    - K：轮数（构造产生一个分类器）。

    - 一个分类学习方案。


    输出：一个复合模型。


    方法：

    (1) 将D中的每个元组的权重初始化为1/d；

    (2) for t = 1 to k do                              // 对于每一轮

    (3)　根据元组的权重从D中有放回抽样，得到Dₜ；

    (4)　使用训练集Dₜ导出模型Mₜ；

    (5)　计算Mₜ的错误率error(Mₜ)（8.34式）

    (6)　if error(Mₜ) > 0.5 then

    (7)　　转步骤(3)重试；

    (8)　endif

    (9)　for D中的每个被正确分类的元组do

    (10)　元组的权重乘以error(Mₜ)/(1-error(Mₜ))　// 更新权重

    (11)　规范化每个元组的权重；

    (12)　endfor


    使用组合分类器对元组分类：


    (1)　将每个实例的权重初始化为0；

    (2)　for t = 1 to k do                         // 对于每个分类器

    (3)　　wₜ=log((1-error(Mₜ))/error(Mₜ))           // 分类器的权重

    (4)　　C=Mₜ(x);                                  // 从Mₜ得到对类的实例

    (5)　　将wₜ加到类C的权重；

    (6)　endfor

    (7)　返回具有最大权重的类；

    ```'
  merge: -1
  img_proc: true
