- pgno: 837
  md: '# Bagging: Boostrap Aggregation

    提高分类准确率的技术 —— 1) 装袋


    +   - 多个分类器，每个分类器有着相同的投票权重

    +     - 多数表决

    +   - d个元组的集合D

    +   - 对于迭代i(i=1,2...k),d个元组的训练集Di采用有放回抽样

    +     - 有些元组不出现

    +     - 有些元组重复多次

    +   - 每个训练集Di学习得到分类模型Mi

    +   - 未知元组X分类

    +     - 每个分类器Mi返回它的类预测

    +     - 得票最高的类赋予X

    +   - 可以用于连续值的预测'
  merge: -1
