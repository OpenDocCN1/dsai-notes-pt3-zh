- pgno: 1059
  md: "# 遗传算法基本原理\n\n遗传算法可定义为一个8元组：\n\n$$GA=(C,E,P_0,M,\\Phi,\\Gamma,\\Psi,T)$$\n\n\
    +   式中，\n+   \n+   - $C$—个体的编码方法；\n+   - $E$—个体适应值评价函数；\n+   - $P_0$—初始种群；\n+\
    \   - $M$—群体大小；\n+   - $\\Phi$—选择算子；\n+   - $\\Gamma$—交叉算子；\n+   - $\\Psi$—变异算子；\n\
    +   - $T$—遗传算法终止条件。"
  merge: -1
