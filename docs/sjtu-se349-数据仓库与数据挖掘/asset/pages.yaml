- pgno: 846
  md: '# 回顾：朴素贝叶斯分类


    +   设D是训练元组和他们相关联的类标号的集合，每个元组用一个n维属性向量X= (x1, x2, ..., xn)，假设有m个类C1, C2, ...,
    Cm


    +   分类法将预测X属于具有 最高后验概率 的类，即 P(Ci|X)的最大值

    +   P(Ci|X)> P(Cj|X)(i!=j , 1<=j<=m )


    +   根据贝叶斯定理，由于P(X)对于所有类为常数，所以只要 P(X|Ci)P(Ci) 最大即可

    +   P(Ci|X)= P(X|Ci)P(Ci)/P(X)= P(X|Ci)×P(Ci)/P(X)


    +   类的先验概率可以用P(Ci)=|Ci,D|/|D|估计，|Ci,D|是D中Ci类的训练元组数


    +   如果P(Ci)未知，那么假设这些类等概率，就只要 P(X|Ci) 最大即可'
  merge: -1
  img_proc: true
- pgno: 847
  md: '# 回顾：朴素贝叶斯分类


    +   - 计算 P(X|Ci) 开销可能非常大

    +   - 为降低计算P(X|Ci) 开销，做简单假设 —— 属性有条件的相互独立（属性之间不存在依赖关系），则：

    +     $P(X|C_i)=\prod_{k=1}^{n}P(x_k|C_i)=P(x_1|C_i)\times P(x_2|C_i)\times...\times
    P(x_n|C_i)$

    +   - 其中 x_k 表示元组 X 在属性 A_k 的值

    +   - 如果 A_k 是分类属性， P(x_k|Ci) 是 D 中属性 A_k 的值为 X_k 的 Ci 类的元组数除以 Ci 类的元组数 |Ci, D|'
  merge: -1
  img_proc: true
- pgno: 848
  md: '# 贝叶斯分类的优缺点


    优点：


    +   - 计算速度最快的演算法

    +   - 规则清楚易懂

    +   - 独立事件的假设，大多数问题上不至于发生太大偏误；


    缺点：


    +   - 仅适用于类别变量

    +   - 仅能应用于分类问题

    +   - 假设变量间为独立互不影响，因此使用时需要谨慎分析变量间的相关性'
  merge: -1
  img_proc: true
- pgno: 849
  md: '# 基于贝叶斯定理的分类器模型


    +   - **朴素贝叶斯（Naïve Bayes, NB）分类器**

    +     — 贝叶斯分类器中最简单有效的，并且在实际使用中较为成功的一种分类器。其性能可以与神经网络、决策树分类器相比，在某些场合优于其他分类器。朴素贝叶斯分类器的特征是假定每个属性的取值对给定类的影响独立于其他属性的取值，即给定类变量的条件下各属性变量之间条件独立

    +   - **树扩展的朴素贝叶斯（Tree-Augmented Naïve Bayes, TANB）**

    +     — 在朴素贝叶斯分类器的基础上，在属性之间添加连接弧，在一定程度上消除朴素贝叶斯分类器的条件独立性假设，这样的弧称为扩展弧，说明树形约束

    +   - **BAN（Bayesian network-Augmented Naïve Bayes）**

    +     — 一种增强的朴素贝叶斯分类器，改进了朴素贝叶斯分类器的条件独立假设，并且取消了TANB分类器中属性变量之间必须符合树状结构的要求，假定属性之间存在贝叶斯网络关系而不是树状关系，从而能够表达属性变量的各种依赖关系

    +   - **贝叶斯多网（Bayesian Muti-Net, BMN）分类器**

    +     — TANB和BAN的一个扩展，TANB和BAN分类器认为对不同的类别，各属性变量之间的关系是不变的，即对于不同的类别具有相同的网络结构。而BMN认为对类变量的不同取值，各属性变量之间的关系可能是不一样的

    +   - **GBN分类器（General Bayesian Network）**

    +     — 如果抛弃条件独立假设，就可以用一般贝叶斯网络作为分类器。GBN是一种无约束的贝叶斯网络分类器，与前面4类贝叶斯分类器不同的，前面4类分类器都将类变量作为一个特殊节点，类节点在网络结构中是各个属性的父节点，而GBN将类节点作为一个普通节点'
  merge: -1
  img_proc: true
- pgno: 850
  md: '# 贝叶斯信念网络


    +   - **朴素贝叶斯分类法假定类条件独立**

    +     - 给定元组的类标号，假定属性的值可以条件地相互独立

    +     - 这一假定简化了计算。当假定成立，与其他所有分类器相比，朴素贝叶斯分类器是最准确的

    +   - 然而，在实践中**变量之间可能存在依赖关系**

    +   - **贝叶斯信念网络**说明联合条件概率分布

    +     - 允许在变量的子集间定义类条件独立性

    +     - 提供一种因果关系的图形模型，可以在其上进行学习

    +     - 训练后的贝叶斯信念网络可以用于分类

    +   - 贝叶斯信念网络也被称做**信念网络、贝叶斯网络和概率网络**。本课程称为信念网络。'
  merge: -1
  img_proc: true
