- pgno: 328
  md: '# 用于度量的两种数据结构

    数据矩阵与相异性矩阵


    # 数据矩阵


    +   - 用于存放数据对象

    +   - 或称对象——属性结构

    +   - 关系表形式或 nxp 矩阵存放 n 个数据对象

    +   - 二模（行代表对象和列代表属性）


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_328_0.png)


    # 相异性矩阵


    +   - 用于存放数据对象对的相异性值

    +     - d(i,j)=0，一个对象自身差别为0

    +   - 或称对象——对象结构

    +   - 存放 n 个对象两两间的邻近度

    +   - 通常用 nxn 的矩阵表示

    +   - 单模（只包括一类实体或事物）

    +   - 许多聚类和最近邻算法都在相异性矩阵上运行


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_328_1.png)


    # 相似性度量和相异性度量的关系


    $sim(i,j)=1-d(i,j)$'
  merge: -1
