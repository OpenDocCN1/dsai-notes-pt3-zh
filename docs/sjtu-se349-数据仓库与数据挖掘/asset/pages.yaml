- pgno: 828
  md: '# Holdout Methods

    模型评估与选择 —— 1) 保持 & 随机二次抽样


    # Holdout Methods 保持方法


    +   —— 给定数据随机地划分为两个独立的集合：训练集(E.g., 2/3) 和 检验集(E.g., 1/3)


    +   —— 使用 训练集 导出模型，使用 检验集 估计其准确率（估计是悲观的）


    # Random sampling 随机二次抽样


    +   —— 保持方法的一种变形


    +   —— 将保持方法重复 k 次，总准确率估计取每次迭代准确率的平均值（avg）'
  merge: -1
  img_proc: true
- pgno: 829
  md: '# Cross-Validation Methods

    模型评估与选择 —— 2) 交叉验证


    +   - K-折交叉验证（K=10最为普遍）


    +   - 初始数据随机的划分成k个互不相交的子集或者“折”

    +     — 每个折的大小大致相等


    +   - 在第i次迭代，使用Di作为测试集，其余的作为训练集


    +   - 对于分类，准确率估计是k次迭代正确分类的元组总数除以初始数据中的元组总数


    +   - 留一： k设置为初始样本数，每次只给检验集留出一个样本'
  merge: -1
  img_proc: true
