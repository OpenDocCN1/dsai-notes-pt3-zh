- pgno: 658
  md: '# FP增长算法的频繁项集产生原理


    +   FP增长采用分治策略将一个问题分解为较小的子问题，从而发现以某个特定后缀结尾的所有频繁项集

    +   —为发现所有以E结尾的频繁项集，必须首先检查项集 {E}本身是否频繁。如果它是频繁的，则考虑发现以 DE、CE、BE、AE结尾的频繁项集子问题


    +   依次，每一个子问题可以进一步划分为更小的子问题


    +   通过合并这些子问题得到的结果，就可以找到所有以E结尾的频繁项集'
  merge: -1
  img_proc: true
- pgno: 659
  md: '# FP增长算法的频繁项集产生

    ——发现以E结尾的频繁项集步骤


    +   （1）收集包含E结点的所有路径，这些初始路径称为前缀路径

    +   （2）由E的前缀路径，把与结点E相关联的支持度计数相加得到E的支持度计数是3，{E}是频繁项集（假定最小支持度为2）


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_659_0.png)


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_659_1.png)


