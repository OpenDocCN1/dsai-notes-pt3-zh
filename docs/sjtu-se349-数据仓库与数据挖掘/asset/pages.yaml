- pgno: 908
  md: '# 源程序


    %以每三个月的销售量经规格化处理后作为输入

    %归一化方法： P=(X-min(X(:)))/(max(X(:))-min(X(:)))


    ```

    P=[0.5152    0.8173    1.0000 ;    123

    0.8173    1.0000    0.7308;    234

    1.0000    0.7308    0.1390;    345

    0.7308    0.1390    0.1087;    456

    0.1390    0.1087    0.3520;    567

    0.1087    0.3520    0.0000;    678

    0.3520    0.0000    0.3761]'';    789

    ```


    %以第四个月的销售量归一化处理后作为目标向量


    ```

    T=[0.7308    0.1390    0.1087];

    ```


    %创建一个BP神经网络，每一个输入向量的取值范围为[0,1]，隐含层有5个神经元，输出层有一个神经元，隐含层的激活函数为tansig，输出层的激活函数为logsig


    ```

    net=newff([0 1;0 1;0 1],[5,1],{''tansig'',''logsig''},''traingd'');

    net.trainParam.epochs=15000;    %设置迭代运行次数

    net.trainParam.goal=0.01;    %预设误差精度

    LP.lr=0.1;                    %设置学习速率为0.1

    net=train(net,P,T);

    Y= sim(net,P);

    plot(1:6,T,''m*'',1:6,Y,''ro'');

    title(''预测销售量效果图，其中o为真实值，*为预测值'')

    ```'
  merge: -1
