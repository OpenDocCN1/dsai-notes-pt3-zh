- pgno: 1203
  md: '# # The K-Means Clustering Method

    ## K-均值算法 — 优劣


    # ## Strength　优点


    — 复杂度：**O(tkn)**


    其中 n 是对象的数目，k 是簇的数目，t 是迭代的次数。通常 k、t << n


    # ## Weakness　缺点


    +   - 需要事先给出 k，簇的数目

    +   - 对初始值选取敏感，常以**局部最优**结束

    +   - 不能处理噪声数据和孤立点，**对离群点敏感！**

    +   - 不适合发现非凸面形状的簇，或具有不同大小或密度的簇

    +     - 所采用的簇的表示及簇间相似性度量不能反映这些自然簇的特征

    +   - 只有在簇的平均值被定义的情况下才能使用，当涉及有分类属性的数据时该怎么办？


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1203_0.png)'
