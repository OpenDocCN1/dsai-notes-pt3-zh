- pgno: 1309
  md: '# The EM (Expectation Maximization) Algorithm

    期望最大化模型


    +   - 推广这一两步过程来处理模糊聚类和基于概率模型的聚类

    +   - The (EM) algorithm: A framework to approach maximum likelihood or maximum
    a posteriori estimates of parameters in statistical models.

    +   - EM是一种算法框架，在模糊或基于概率模型的聚类的情况下，EM算法从初始参数集出发，并且迭代直到不能改善聚类，即直到聚类收敛或改变充分小（小于一个预先设定的阈值）

    +   - 每次迭代也由两步组成:

    +     - E-step assigns objects to clusters according to the current fuzzy clustering
    or parameters of probabilistic clusters

    +     - M-step finds the new clustering or parameters that maximize the sum of
    squared error (SSE) or the expected likelihood'
