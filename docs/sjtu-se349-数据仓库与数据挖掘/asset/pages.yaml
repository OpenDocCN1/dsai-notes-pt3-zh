  md: '# 遗传算法关键技术


    # 交叉或基因重组


    交叉率就是用来确定2个染色体进行局部的位（bit）的互换以产生2个新的子代的概率。实验表明这一数值通常取为0.7左右是理想的，尽管某些问题领域可能需要更高一些或较低一些的值。'
