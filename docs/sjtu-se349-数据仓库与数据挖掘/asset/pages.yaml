  md: '# Geometric projection visualization techniques

    几何投影可视化技术 之 散点图 Cont.


    # 几何投影可视化技术： 平行坐标


    +   — 当维度继续增加时，散点图矩阵变得不太有效

    +   — 另一种流行的技术是平行坐标


    +   - 绘制n个等距离、相互平行的轴，每维一个

    +   - 数据记录用折线表示，与每个轴在对应于相关维值的点上相交

    +   - 不能显示具有很多记录的数据集


