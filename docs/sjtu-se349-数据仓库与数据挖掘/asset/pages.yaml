  md: '# 数据挖掘的技术工具

    2.开源工具（3）R


    +   - **R (http://www.r-project.org)**

    +   - 是用于统计分析和图形化的计算机语言及分析工具，为了保证性能，其核心计算模块是用C、C++和Fortran编写的。

    +   - 为了便于使用，它提供了一种脚本语言，即**R语言**。R语言和贝尔实验室开发的S语言类似。

    +   - **R**支持一系列分析技术，包括统计检验、预测建模、数据可视化等等。

    +   - 在**CRAN(http://cran.r-project.org)**上可以找到众多开源的扩展包。

    +   - **R**软件的首选界面是命令行界面，通过编写脚本来调用分析功能。如果缺乏编程技能，也可使用图形界面，比如使用**R Commander(http://socserv.mcmaster.ca/jfox/Misc/Rcmdr/)**或**Rattle(http://rattle.togaware.com)**。'
