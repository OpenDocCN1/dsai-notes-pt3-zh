- pgno: 654
  md: '# FP-Tree Construction


    通常，FP树的**大小比未压缩的数据小**，因为购物篮数据的事务常常共享一些共同项


    +   - 在**最好情况**下，所有的事务都具有相同的项集，FP树只包含一条节点路径


    +   - 在**最坏情况**下，所有的事务都具有唯一项集，由于事务不包含任何共同项，FP树的**大小实际上与原数据的大小一样**，然而，由于需要附加的空间为每个项存放节点间的指针和计数，FP树的存储需求增大'
  merge: -1
  img_proc: true
- pgno: 655
  md: '# FP-Tree Construction


    # FP树的大小也取决于项的排序方式


    如果颠倒前面例子的序，即项按照支持度由小到大排列，则结果下图右所示的FP树会显得更加茂盛，因为根结点上的分支数由2增加到5，并且包含了高支持度项A和B的结点数由3增加到12。


    尽管如此，支持度计数递减序并非总是导致最小的树。例如，假设加大给定的数据集，增加100个事务包含{E}、80个事务包含{D}、60个事务包含{C}、40个事务包含{B}。现在，项E是最频繁的，接下来依次是D、C、B、A，使用加大的事务数据，支持度计数递减序将导致类似于下图右的树，而基于支持度计数递增序将产生一棵类似于下图左的树。


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_655_0.png)


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_655_1.png)'
