- pgno: 975
  md: '# 核函数构造


    +   - 核函数不要求输入是向量形式，可以是任何对象。只要这个函数在对象集上导出的矩阵是正定的。这个核函数就可以用在任何基于点积的算法中，而没有任何问题。

    +   - 因为核函数是特征空间中的点积，所以核函数构造过程是隐含的特征提取过程。

    +   - 特征提取的原则是，特征向量要反映对象的本质信息。所谓本质，就是对象所以属于不同类别的性质。所以构造核函数的原则也是应该使其反映对象的本质。'
  merge: -1
  img_proc: true
