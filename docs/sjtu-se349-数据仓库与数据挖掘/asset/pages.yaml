- pgno: 388
  md: '# 冗余和相关分析


    # 数值数据的相关系数


    在概率论与统计学中，协方差和方差是两个类似的度量，评估两个属性如何一起变化


    ```

    Cov(A, B) = E((A - Ā)(B - B̄)) = \frac{\sum_{i=1}^{n}(a_i - \bar{A})(b_i - \bar{B})}{n}

    ```


    Correlation coefficient: r_{A,B} = \frac{Cov(A, B)}{\sigma_A \sigma_B}


    n是元组的数量，Ā和B̄是属性A和B的期望，σ_A和σ_B是A和B的标准差


    +   正协方差: If Cov_{A,B} > 0, 如果A大于期望，则B也很有可能大于期望


    +   负协方差: If Cov_{A,B} < 0, 如果A大于期望，则B很有可能小于期望


    +   独立: Cov_{A,B} = 0 但逆命题不成立:

    +   — 某些随机变量可能具有协方差0，但不独立。仅在某种附加的假设下 (e.g., 数据遵守多元正态分布，协方差0蕴含独立性'
  merge: -1
  img_proc: true
- pgno: 389
  md: '# 冗余和相关分析


    # 数值数据的相关系数


    Cov(A, B) = E((A - Ā)(B - B̄)) = (∑_{i=1}^{n} (a_i - Ā)(b_i - B̄)) / n


    +   它可被简化为


    Cov(A, B) = E(A · B) - Ā B̄


    +   Suppose two stocks A and B have the following values in one week: (2, 5),
    (3, 8), (5, 10), (4, 11), (6, 14).


    +   Question: If the stocks are affected by the same industry trends, will their
    prices rise or fall together?


    +   E(A) = (2 + 3 + 5 + 4 + 6) / 5 = 20/5 = 4


    +   E(B) = (5 + 8 + 10 + 11 + 14) /5 = 48/5 = 9.6


    +   Cov(A,B) = (2×5+3×8+5×10+4×11+6×14)/5 − 4 × 9.6 = 4


    +   Thus, A and B rise together since Cov(A, B) > 0.'
  merge: -1
  img_proc: true
