- pgno: 445
  md: '# 小波变换 Wavelet transform（续）


    —1988： Mallat算法


    +   - 法国科学家Stephane Mallat提出多分辨率概念，从空间上形象说明小波的多分辨率的特性，并提出了正交小波的构造方法和快速算法，称为Mallat算法[1]

    +   - 该算法统一了在此之前构造正交小波基的所有方法，其地位相当于快速傅立叶变换在经典傅立叶分析中的地位'
