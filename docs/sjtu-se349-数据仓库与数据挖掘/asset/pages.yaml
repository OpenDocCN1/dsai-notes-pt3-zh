  md: '# Computational Complexity


    Given d unique items:


    +   - Total number of itemsets = 2ᵈ

    +   - Total number of possible association rules:


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_619_0.png)


    R = Σₖ₌₁ᵈ⁻¹ [ C(d, k) × Σⱼ₌₁ᵈ⁻ᵏ C(d−k, j) ]

    = 3ᵈ − 2ᵈ⁺¹ + 1


    If d=6, R = 602 rules'
