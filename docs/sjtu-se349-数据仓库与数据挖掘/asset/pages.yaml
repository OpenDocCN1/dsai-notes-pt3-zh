- pgno: 951
  md: '# 广义线性支持向量机


    对于近似线性可分问题不要求所有训练点都满足约束条件 $y_i((w \cdot x_i)+b) \ge 1$，为此对第 $i$ 个训练点 $(x_i, y_i)$
    引入松弛变量(Slack Variable) $\xi_i \ge 0$，把约束条件放松到 $y_i((w \cdot x_i)+b)+\xi_i \ge
    1$。（即“软化”约束条件）


    $\xi = (\xi_1, \cdots \xi_l)^T$ 体现了训练集被错分的情况，可采用 $\sum_{i=1}^l \xi_i$ 作为一种度量来描述错划程度。


    两个目标：1. 间隔 $\frac{2}{||w||}$ 尽可能大 2. 错划程度 $\sum_{i=1}^l \xi_i$ 尽可能小'
  merge: -1
  img_proc: true
- pgno: 952
  md: "# 广义线性支持向量机\n\n显然，当 ξ_i 足够大时，样本点 (x_i, y_i) 总可以满足以上约束条件。然而事实上应避免 ξ_i 太大，所以需在目标函数对\
    \ ξ 进行惩罚 因此，引入一个惩罚参数 C>0，新的目标函数变为：\n\nmin_{w,b,ξ}  1/2 ||w||² + C Σ_{i=1}^l ξ_i\n\
    s.t.     y_i((w·x_i)+b) ≥ 1 - ξ_i, i = 1,⋯l\n         ξ_i ≥ 0, i = 1,⋯l\n\nΣ_{i=1}^l\
    \ ξ_i 体现了经验风险，而 ||w|| 则体现了表达能力。所以惩罚参数 C 实质是对经验风险和表达能力匹配一个裁决。当 C→∞ 时，近似线性可分 SVC\
    \ 的原始问题退化为线性可分 SVC 的原始问题。"
  merge: -1
  img_proc: true
- pgno: 953
  md: '# 广义线性支持向量机分类算法


    +   1. 设已知训练集 $T = \{(x_1, y_1), \cdots, (x_l, y_l)\} \in (X \times Y)^l$，其中 $x_i
    \in X = R^n, y_i \in Y = \{1, -1\}, i = 1, \cdots, l$

    +   2. 选择适当的惩罚参数 $C > 0$，构造并求解最优化问题

    +   $\min_{\alpha} \frac{1}{2} \sum_{i=1}^{l} \sum_{j=1}^{l} y_i y_j \alpha_i
    \alpha_j (x_i \cdot x_j) - \sum_{j=1}^{l} \alpha_j$

    +   $s.t. \quad \sum_{i=1}^{l} y_i \alpha_i = 0$

    +   $0 \le \alpha_i \le C, i = 1, \cdots l \quad \text{求得 } a^* = (a_1^*, \cdots
    a_l^*)^T$'
  merge: -1
  img_proc: true
