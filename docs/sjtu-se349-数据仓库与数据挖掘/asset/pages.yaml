- pgno: 612
  md: '# Definition: Frequent Itemset


    +   - Itemset

    +     - A collection of one or more items

    +       - Example: {Milk, Bread, Diaper}

    +     - k-itemset

    +       - An itemset that contains k items


    +   - Support count (σ)

    +     - Frequency of occurrence of an itemset

    +     - E.g. σ({Milk, Bread, Diaper}) = 2


    +   - Support

    +     - Fraction of transactions that contain an itemset

    +     - E.g. s({Milk, Bread, Diaper}) = 2/5


    +   - Frequent Itemset

    +     - An itemset whose support is greater than or equal to a minsup threshold


    | TID | Items |

    | --- | --- |

    | 1 | Bread, Milk |

    | 2 | Bread, Diaper, Beer, Eggs |

    | 3 | Milk, Diaper, Beer, Coke |

    | 4 | Bread, Milk, Diaper, Beer |

    | 5 | Bread, Milk, Diaper, Coke |


    Diaper [daɪpɚ] 尿布'
  merge: -1
  img_proc: true
- pgno: 613
  md: '# Definition: Association Rule


    +   - Association Rule

    +     - An implication expression of the form X → Y, where X and Y are itemsets

    +     - Example:

    +       - {Milk, Diaper} → {Beer}


    +   - Rule Evaluation Metrics

    +     - Support (s)

    +       - Fraction of transactions that contain both X and Y

    +     - Confidence (c)

    +       - Measures how often items in Y appear in transactions that contain X


    | TID | Items |

    |---:|---|

    | 1 | Bread, Milk |

    | 2 | Bread, Diaper, Beer, Eggs |

    | 3 | Milk, Diaper, Beer, Coke |

    | 4 | Bread, Milk, Diaper, Beer |

    | 5 | Bread, Milk, Diaper, Coke |


    Example:


    {Milk, Diaper} → Beer


    $s = \frac{\sigma(\mathrm{Milk, Diaper, Beer})}{|T|} = \frac{2}{5} = 0.4$


    $c = \frac{\sigma(\mathrm{Milk, Diaper, Beer})}{\sigma(\mathrm{Milk, Diaper})}
    = \frac{2}{3} = 0.67$'
  merge: -1
  img_proc: true
- pgno: 614
  md: '# Association Rule Mining Task


    +   Given a set of transactions T, the goal of association rule mining is to find
    all rules having

    +   - support ≥ minsup threshold

    +   - confidence ≥ minconf threshold


    +   Brute-force（蛮力、暴力）approach:

    +   - List all possible association rules

    +   - Compute the support and confidence for each rule

    +   - Prune rules that fail the minsup and minconf thresholds

    +   ⇒ Computationally prohibitive（禁止的、过高的）！'
  merge: -1
  img_proc: true
- pgno: 615
  md: '# Mining Association Rules


    | TID | Items |

    | --- | --- |

    | 1 | Bread, Milk |

    | 2 | Bread, Diaper, Beer, Eggs |

    | 3 | Milk, Diaper, Beer, Coke |

    | 4 | Bread, Milk, Diaper, Beer |

    | 5 | Bread, Milk, Diaper, Coke |


    # Example of Rules:


    {Milk,Diaper} → {Beer} (s=0.4, c=0.67)

    {Milk,Beer} → {Diaper} (s=0.4, c=1.0)

    {Diaper,Beer} → {Milk} (s=0.4, c=0.67)

    {Beer} → {Milk,Diaper} (s=0.4, c=0.67)

    {Diaper} → {Milk,Beer} (s=0.4, c=0.5)

    {Milk} → {Diaper,Beer} (s=0.4, c=0.5)


    # Observations:


    +   - All the above rules are binary（双重、二元）partitions of the same itemset: {Milk,
    Diaper, Beer}

    +   - Rules originating from the same itemset have identical support but can have
    different confidence

    +   - Thus, we may decouple（解耦）the support and confidence requirements'
