- pgno: 76
  md: '# PaaS（平台即服务）


    +   - PaaS是指将一个完整的计算机平台，包括应用设计、应用开发、应用测试和应用托管，都作为一种服务提供给客户。

    +   - 这种服务模式中，客户不需要购买硬件和软件，只需要利用PaaS平台，就能够创建、测试和部署应用和服务，与基于数据中心的平台进行软件开发相比，费用要低得多，这是PaaS的最大价值所在。

    +   - 目前PaaS的典型实例有，微软的Windows Azure平台、Facebook的开发平台等。


    +   - Windows Azure是一个操作系统，是资源的管理者、管理云基础设施（各种计算硬件）、计算资源（CPU）、存储资源（磁盘）、各种配置文件、用户的应用程序，能够提供计算能力、存储能力、调度能力，在其上可以运行用户程序。

    +   - 与Windows操作系统不同的是所管理的资源规模巨大，可能由上万的服务器组成，计算和存储也是无数服务器计算和存储能力的抽象，量变到质变


    +   - 不需要安装

    +   - 所用物理资源有微软提供非

    +   - 需要联网使用

    +   - 能够伸缩

    +   - 按用户的用量收费'
  merge: -1
  img_proc: true
