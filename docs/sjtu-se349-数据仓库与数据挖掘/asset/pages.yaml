- pgno: 1414
  md: '# # Outlier Detection I: Supervised Methods


    +   - **Two ways to categorize outlier detection methods:**

    +     - Based on *whether user-labeled examples of outliers can be obtained:*

    +       - Supervised, semi-supervised vs. unsupervised methods

    +     - Based on *assumptions about normal data and outliers 正常对象和离群点的假定:*

    +       - Statistical, proximity-based, and clustering-based methods


    +   - **Outlier Detection I: Supervised Methods**

    +     - Modeling outlier detection as a classification problem

    +       - Samples examined by domain experts used for training & testing

    +     - Methods for Learning a classifier for outlier detection effectively:

    +       - Model normal objects & report those not matching the model as outliers,
    or

    +       - Model outliers and treat those not matching the model as normal

    +     - Challenges

    +       - **Imbalanced classes 两个类（正常对象和离群点）比例，i.e., outliers are rare会限制构建的分类器的能力:
    Boost the outlier class 离群点过抽样（即复制） and make up some artificial outliers**

    +       - Catch as many outliers as possible, i.e., recall is more important than
    accuracy (i.e., not mislabeling normal objects as outliers)'
  merge: -1
  img_proc: true
- pgno: 1415
  md: '# Outlier Detection II: Unsupervised Methods


    +   - **Assume** the normal objects are somewhat ``clustered`` into multiple groups,
    each having some distinct features

    +   - An outlier is expected to be far away from any groups of normal objects

    +   - Weakness: **Cannot detect collective outlier effectively**

    +     - Normal objects may not share any strong patterns, but the collective outliers
    may share high similarity in a small area

    +   - Ex. In some intrusion or virus detection, normal activities are diverse发散

    +     - Unsupervised methods may have a high **false positive rate**假正例率（把正常对象误标记为离群点）
    but still miss many real outliers.

    +     - Supervised methods can be more effective, e.g., identify attacking some
    key resources（入侵或病毒都攻击目标系统的关键资源）

    +   - Many clustering methods can be adapted for unsupervised methods

    +     - 这些方法的核心思想是先Find clusters,然后 then outliers: not belonging to any cluster

    +     - Problem 1: Hard to distinguish noise from outliers

    +     - Problem 2: Costly since first clustering: but far less outliers than normal
    objects在可以触及实际内容（即离群点）之前必须先处理大量非目标数据实体（即正常对象）可能不那么吸引人

    +   - Newer methods: **tackle outliers directly**'
  merge: -1
  img_proc: true
- pgno: 1416
  md: '# Outlier Detection III: Semi-Supervised Methods


    +   - Situation: In many applications, the number of labeled data is often small:
    Labels could be on outliers only, normal objects only, or both

    +   - Semi-supervised outlier detection半监督方法: Regarded as applications of semi-supervised
    learning

    +   - If some labeled normal objects are available

    +     - Use the labeled examples and the proximate unlabeled objects与邻近的非标记对象
    to train a model for normal objects

    +     - Those not fitting the model of normal objects are detected as outliers

    +   - If only some labeled outliers are available, a small number of labeled outliers
    many not cover the possible outliers well

    +     - To improve the quality of outlier detection, one can get help from models
    for normal objects learned from unsupervised methods'
  merge: -1
  img_proc: true
- pgno: 1417
  md: '# Outlier Detection (1): Statistical Methods

    统计学方法（基于模型的方法）


    +   Statistical methods (also known as model-based methods) assume that the normal
    data follow some statistical model (a stochastic model 随机模型)

    +   — The data not following the model are outliers.


    +   Example (right figure): First use Gaussian distribution to model the normal
    data


    +   除区域R外的点都拟合一个高斯分布g_D，其中对于数据空间的每个位置x， g_D(x)给出x上的概率密度


    +   For each object y in region R, estimate g_D(y), the probability of y fits
    the Gaussian distribution


    +   If g_D(y) is very low, y is unlikely generated by the Gaussian model, thus
    an outlier


    +   Effectiveness of statistical methods: highly depends on whether the assumption
    of statistical model holds in the real data


    +   There are rich alternatives to use various statistical models


    +   E.g., parametric vs. non-parametric


