- pgno: 1291
  md: '# 霍普金斯统计量


    霍普金斯统计量（Hopkins Statistic）是一种空间统计量，检验空间分布的变量的空间随机性。给定数据集D，它可以看做随机变量o的一个样本，想要确定o在多大程度上不同于数据空间中的均匀分布。按以下步骤计算霍普金斯统计量：


    +   (1) 均匀地从 D 的空间中抽取 n 个点 p₁, …, pₙ。也就是说，D 的空间中的每个点都以相同的概率包含在这个样本中。对于每个点 pᵢ (1
    ≤ i ≤ n)，我们找出 pᵢ 在 D 中的最近邻，并令 xᵢ 为 pᵢ 与它在 D 中的最近邻之间的距离，即 xᵢ = min_{v ∈ D} |dist(pᵢ,
    v)| (10.25)


    +   (2) 均匀地从 D 中抽取 n 个点 q₁, …, qₙ。对于每个点 qᵢ (1 ≤ i ≤ n)，我们找出 qᵢ 在 D − |qᵢ| 中的最近邻，并令
    yᵢ 为 qᵢ 与它在 D − |qᵢ| 中的最近邻之间的距离，即 yᵢ = min_{v ∈ D, v ≠ qᵢ} |dist(qᵢ, v)| (10.26)


    +   (3) 计算霍普金斯统计量 H H = (∑_{i=1}^n yᵢ) / (∑_{i=1}^n xᵢ + ∑_{i=1}^n yᵢ) (10.27)


    “霍普金斯统计量告诉我们数据集 D 有多大可能遵守数据空间的均匀分布吗？”如果 D 是均匀分布的，则 ∑ yᵢ 和 ∑ xᵢ 将会很接近，因而 H 大约为
    0.5。然而，如果 D 是高度倾斜的，则 ∑ yᵢ 将显著地小于 ∑ xᵢ，因而 H 将接近于 0。


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1291_0.png)'
  merge: -1
  img_proc: true
- pgno: 1292
  md: '# Determine the Number of Clusters


