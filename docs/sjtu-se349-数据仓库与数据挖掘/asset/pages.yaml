- pgno: 1446
  md: '# Challenges for Outlier Detection in High-Dimensional Data


    +   - **Interpretation of outliers** 离群点的解释

    +     - Detecting outliers without saying why they are outliers is not very useful
    in high-D due to many features (or dimensions) are involved in a high-dimensional
    data set

    +     - E.g., which subspaces that manifest the outliers or an assessment regarding
    the “outlier-ness” of the objects


    +   - **Data sparsity** 数据的稀疏性

    +     - Data in high-D spaces are often sparse

    +     - The distance between objects becomes heavily dominated by noise as the
    dimensionality increases


    +   - **Data subspaces** 数据子空间

    +     - Adaptive to the subspaces signifying the outliers

    +     - Capturing the local behavior of data


    +   - **Scalable with respect to dimensionality** 关于维度的可伸缩性

    +     - # of subspaces increases exponentially'
  merge: -1
  img_proc: true
- pgno: 1447
  md: '# Approach I: Extending Conventional Outlier Detection

    扩充的传统离群点检测


    +   - Method 1: Detect outliers in the full space, e.g., HiLOut Algorithm

    +     - Find distance-based outliers, but use the ranks of distance距离秩 instead
    of the absolute distance in outlier detection

    +     - For each object o, find its k-nearest neighbors: nn₁(o) ... nnₖ(o)

    +     - The weight of object o: w(o) = Σᵢ₌₁ᵏ dist(o, nnᵢ(o))

    +     - All objects are ranked in weight-descending order按权重递减序定秩

    +     - Top-l objects in weight are output as outliers (l: user-specified parm)

    +     - Employ space-filling curves空间填充曲线 for approximation: scalable in both
    time and space w.r.t. data size and dimensionality


    +   - Method 2: Dimensionality reduction

    +     - Works only when in lower-dimensionality, normal instances can still be
    distinguished from outliers

    +     - PCA: Heuristically, the principal components with low variance are preferred
    because, on such dimensions, normal objects are likely close to each other and
    outliers often deviate from the majority'
  merge: -1
  img_proc: true
- pgno: 1448
  md: '# Approach II: Finding Outliers in Subspaces

    发现子空间中的离群点


    +   - Extending conventional outlier detection: Hard for outlier interpretation

    +   - **Find outliers in much lower dimensional subspaces: easy to interpret _why_
    and _to what extent_ the object is an outlier**

    +     - E.g., find outlier customers in certain subspace: *average transaction
    amount >> avg. and purchase frequency << avg.*

    +   - Ex. A grid-based subspace outlier detection method

    +     - Project data onto various subspaces to find an area whose density is much
    lower than average

    +     - Discretize the data into a grid with φ 个 equi-depth 等深 regions (why?)

    +     - Search for regions that are significantly sparse 显著稀疏

    +       - Consider a k-d cube k维立方体: k ranges on k dimensions, with n objects

    +       - If objects are independently distributed, the expected number of objects
    falling into a k-dimensional region is (1 / φ)^k n = f^k n, the standard deviation
    is √(f^k(1 − f^k)n)

    +       - The sparsity coefficient 稀疏系数 of cube C: S(C) = (n(C) − f^k n) / √(f^k(1
    − f^k)n)

    +       - If S(C) < 0, C contains less objects than expected

    +       - The more negative, the sparser C is and the more likely the objects
    in C are outliers in the subspace'
  merge: -1
  img_proc: true
- pgno: 1449
  md: '# Approach III: Modeling High-Dimensional Outliers

    高维离群点建模


    +   - Develop new models for high-dimensional outliers directly

    +   - Avoid proximity measures and adopt new heuristics that do not deteriorate
    in high-dimensional data不会在高维数据中退化


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1449_0.png)


    +   - Ex. Angle-based outliers基于角的离群点: Kriegel, Schubert, and Zimek [KSZ08]


    +   - For each point o, examine the angle Δxoy for every pair of points x, y.

    +     - Point in the center (e.g., a), the angles formed differ widely

    +     - An outlier (e.g., c), angle variable is substantially smaller

    +     - Use the variance of angles角度的方差 for a point to determine outlier


    +   - Combine angles and distance to model outliers

    +     - Use the distance-weighted angle variance as the outlier score

    +     - Angle-based outlier factor (ABOF)基于角度的离群点因子

    +     - ABOF(o) = VAR_{x,y∈D, x≠o, y≠o} <overleftarrow{ox}, overleftarrow{oy}>
    / [dist(o,x)^2 dist(o,y)^2]

    +     - Efficient approximation computation method is developed

    +     - It can be generalized to handle arbitrary types of data'
  merge: -1
  img_proc: true
