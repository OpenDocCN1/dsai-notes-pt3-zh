- pgno: 1438
  md: '# Classification-Based Method I: One-Class Model


    +   - Idea: Train a classification model that can distinguish “normal” data from
    outliers

    +   - A brute-force基本的 approach: Consider a training set that contains samples
    labeled as “normal” and others labeled as “outlier”

    +     - But, the training set is typically heavily biased导读有偏的: # of “normal”
    samples likely far exceeds # of outlier samples

    +     - Cannot detect unseen anomaly


    One-class model一类模型: A classifier is built to describe only the normal class.


    +   - Learn the decision boundary of the normal class using classification methods
    such as SVM

    +   - Any samples that do not belong to the normal class (not within the decision
    boundary) are declared as outliers

    +   - Adv: can detect new outliers that may not appear close to any outlier objects
    in the training set

    +   - Extension: Normal objects may belong to multiple classes


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1438_0.png)'
  merge: -1
  img_proc: true
- pgno: 1439
  md: '# Classification-Based Method II: Semi-Supervised Learning


    # Semi-supervised learning: Combining classification-based and clustering-based
    methods


    # Method


    +   Using a clustering-based approach, find a large cluster, C, and a small cluster,
    C₁


    +   Since some objects in C carry the label “normal”, treat all objects in C as
    normal


    +   Use the one-class model of this cluster to identify normal objects in outlier
    detection


    +   Since some objects in cluster C₁ carry the label “outlier”, declare all objects
    in C₁ as outliers


    +   Any object that does not fall into the model for C (such as a) is considered
    an outlier as well


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1439_0.png)


    # Comments on classification-based outlier detection methods


    +   Strength: Outlier detection is fast


    +   Bottleneck: Quality heavily depends on the availability and quality of the
    training set, but often difficult to obtain representative and high-quality training
    data'
  merge: -1
  img_proc: true
