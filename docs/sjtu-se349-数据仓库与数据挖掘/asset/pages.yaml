- pgno: 597
  md: '# Data Warehouse: A Business Analysis Framework

    数据仓库设计：一个商务分析框架


    +   - 为了设计有效地数据仓库，

    +     需要理解和分析商务需求，并构造一个商务分析框架


    +   - 构建一个大型复杂的信息系统就像构建一个大型复杂的建筑

    +     - 业主、设计师、建筑商……各自有不同的视图

    +     - 这些视图结合在一起，形成一个复杂的框架

    +     - E.g.,　业主的视图：自顶向下，商务驱动的视图

    +   　　　　　信息系统实现者的视图：自底向上，建筑商驱动的视图'
  merge: -1
