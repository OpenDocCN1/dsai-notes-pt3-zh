  md: '# 小波变换 Wavelet transform（续）


    +   重构滤波器


    滤波器关系到能否重构出满意的原始信号。在信号的分解期间，降采样会引进畸变，这种畸变叫做混叠(aliasing)。这就需要分解和重构阶段精心选择关系紧密但不一定一致的滤波器才有可能取消这种混叠


    低通分解滤波器(L)和高通分解滤波器(H)以及重构滤波器(L''和H'')构成一个系统，这个系统叫做正交镜像滤波器(quadrature mirror filters,
