- pgno: 1143
  md: '# 模糊聚类分析


    # （1）标准差标准化


    对于第*i*个变量进行标准化，就是将*x*_{ij}换成 *x*''_{ij}，即


    ```

    x''_{ij} = \frac{x_{ij} - \bar{x}_{i}}{S_{j}} \quad (1 \le j \le m)

    ```


    式中：\bar{x}_{j} = \frac{1}{n}\sum_{i=1}^{n} x_{ij}, S_{j} = \sqrt{\frac{1}{n}\sum_{j=1}^{n}(x_{ij}
    - \bar{x}_{j})^{2}}.'
  merge: -1
  img_proc: true
- pgno: 1144
  md: '# 模糊聚类分析


    （2）极差正规化    $x''''_{ij}=\frac{x''_{ij}-\min\{x''_{ij}\}_{1\le i\le n}}{\max\{x''_{ij}\}_{1\le
    i\le n}-\min\{x''_{ij}\}_{1\le i\le n}}$


    （3）极差标准化    $x''_{ij}=\frac{x_{ij}-\bar{x}_{i}}{\max\{x_{ij}\}-\min\{x_{ij}\}}$


    （4）最大值规格化    $x''_{ij}=\frac{x_{ij}}{M_{j}}$    其中：    $M_{j}=\max(x_{1j},x_{2j},\cdots,x_{nj})$'
  merge: -1
