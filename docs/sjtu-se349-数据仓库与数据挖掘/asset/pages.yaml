  md: '# 核函数构造


    +   - 机器学习和模式识别中的很多算法要求输入模式是向量空间中的元素。

    +   - 但是，输入模式可能是非向量的形式，可能是任何对象——串、树，图、蛋白质结构、人...

    +   - 一种做法：把对象表示成向量的形式，传统算法得以应用。

    +   - 问题：在有些情况下，很难把关于事物的直观认识抽象成向量形式。比如，文本分类问题。或者构造的向量维度非常高，以至于无法进行运算。'
