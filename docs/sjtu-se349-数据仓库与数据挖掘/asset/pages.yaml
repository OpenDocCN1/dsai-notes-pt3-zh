- pgno: 1434
  md: '# Clustering-Based Outlier Detection (1 & 2):

    Not belong to any cluster, or far from the closest one


    +   三种基于聚类的离群点检测 An object is an outlier if (1) it does not belong to any cluster,
    (2) there is a large distance between the object and its closest cluster , or
    (3) it belongs to a small or sparse cluster


    +   Case I: Not belong to any cluster


    +   Identify animals not part of a flock群: Using a density-based clustering method
    such as DBSCAN


    +   Case 2: Far from its closest cluster


    +   Using k-means, partition data points of into clusters


    +   For each object o, assign an outlier score based on its distance from its
    closest center


    +   If dist(o, cₒ)/avg_dist(cₒ) is large, likely an outlier


    +   Ex. Intrusion detection: Consider the similarity between data points and the
    clusters in a training data set


    +   Use a training set to find patterns of “normal” data, e.g., frequent itemsets
    in each segment, and cluster similar connections into groups


    +   Compare new data points with the clusters mined—Outliers are possible attacks


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1434_0.png)


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1434_1.png)'
  merge: -1
  img_proc: true
- pgno: 1435
  md: '# Clustering-Based Outlier Detection (3): Detecting Outliers in Small Clusters


    +   FindCBLOF: Detect outliers in small clusters


    +   Find clusters, and sort them in decreasing size 降序


    +   To each data point, assign a cluster-based local outlier factor (CBLOF) 基于簇的局部点因子：


    +   If obj p belongs to a large cluster, CBLOF = cluster_size X similarity between
    p and cluster


    +   If p belongs to a small one, CBLOF = cluster size X similarity betw. p and
    the closest large cluster


    Ex. In the figure, o is outlier since its closest large cluster is C₁, but the
    similarity between o and C₁ is small. For any point in C₃, its closest large cluster
    is C₂ but its similarity from C₂ is low, plus |C₃| = 3 is small


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1435_0.png)'
  merge: -1
  img_proc: true
- pgno: 1436
  md: '# Clustering-Based Method: Strength and Weakness


    +   Strength

    +   — Detect outliers without requiring any labeled data

    +   — Work for many types of data

    +   — Clusters can be regarded as summaries of the data

    +   — Once the cluster are obtained, need only compare any object against the
    clusters to determine whether it is an outlier (fast)


    +   Weakness

    +   — Effectiveness depends highly on the clustering method used—they may not
    be optimized for outlier detection

    +   — High computational cost: Need to first find clusters

    +   — A method to reduce the cost: Fixed-width clustering 固定宽度聚类

    +     • A point is assigned to a cluster if the center of the cluster is within
    a pre-defined distance threshold from the point

    +     • If a point cannot be assigned to any existing cluster, a new cluster is
    created and the distance threshold may be learned from the training data under
    certain conditions'
  merge: -1
  img_proc: true
