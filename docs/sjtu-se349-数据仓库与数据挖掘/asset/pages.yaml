  md: '# Univariate Gaussian Mixture Model

    单变量高斯混合模型


    O = {o₁, ..., oₙ} (n observed objects), Θ = {θ₁, ..., θₖ} (parameters of the k
    distributions), and Pⱼ(oᵢ|θⱼ) is the probability that oᵢ is generated from the
    j-th distribution using parameter θⱼ, we have


    P(oᵢ|Θ) = Σⱼ=1ᵏ ωⱼ Pⱼ(oᵢ|Θⱼ)      P(O|Θ) = ∏ᵢ=1ⁿ Σⱼ=1ᵏ ωⱼ Pⱼ(oᵢ|Θⱼ)


    +   Univariate Gaussian mixture model 单变量高斯混合模型


    +   Assume the probability density function of each cluster follows a 1-d Gaussian
    distribution一维高斯分布. Suppose that there are k clusters.


    +   The probability density function of each cluster are centered at μⱼ 中心 with
    standard deviation标准差 σⱼ, θⱼ = (μⱼ, σⱼ), we have


    P(oᵢ|Θⱼ) = 1/√(2π)σⱼ e^(-(oᵢ-μⱼ)²/(2σ²))      P(oᵢ|Θ) = Σⱼ=1ᵏ 1/√(2π)σⱼ e^(-(oᵢ-μⱼ)²/(2σ²))


    P(O|Θ) = ∏ᵢ=1ⁿ Σⱼ=1ᵏ 1/√(2π)σⱼ e^(-(oᵢ-μⱼ)²/(2σ²))


    使用单变量高斯混合模型的基于概率模型的聚类任务是推断，使最大化'
