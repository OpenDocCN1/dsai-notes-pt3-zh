- pgno: 760
  md: '# Gain Ratio 属性选择度量之增益率


    +   - 信息增益度量偏向具有许多输出的测试（大量值的属性）

    +   - 不希望产生大量输出的测试条件

    +     - 限制测试条件，只能二元划分 e.g.CART

    +     - 修改评估划分标准，把属性测试条件产生输出考虑进去

    +   - 增益率 用 分裂信息 值将信息增益规范化

    +   - 计算方式

    +     - 分裂信息

    +     - 增益率


    SplitInfo_A(D) = -∑_{j=1}^{v} |D_j|/|D| × log₂(|D_j|/|D|)


    GrianRate(A) = Gain(A) / SplitInfo_A(D)'
