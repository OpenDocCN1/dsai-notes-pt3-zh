  md: '# C4.5分类算法概述


    基于ID3算法的不足，Quinlan在1993年对其做出改进，提出了改进的决策树分类算法C4.5


    +   —能够处理连续型属性数据和离散型属性数据（ID3只能处理分类属性数据，无法处理连续型数据）

    +   —能够处理具有缺失值的数据

    +   —使用信息增益率作为决策树的属性选择标准

    +   —对生成的树进行剪枝处理，以获取简略的决策树

    +   —从决策树到规则的自动产生


    C4.5后续发展为商用的C5.0，在C4.5的基础上做了进一步改进


    +   —使用提升技术，生成一系列决策树，然后集体投票决定分类结果

    +   —支持新的数据类型，如日期等

    +   —规则集没有顺序，而是所有匹配规则进行投票，更易解释'
  merge: -1
  img_proc: true
- pgno: 741
  md: '# C4.5分类算法概念描述


    信息熵（entropy）：用于度量一个属性的信息量


    +   假设S为训练集，S的目标属性C具有m个可能的类标号值，C={C1,C2,...,Cm}，假设训练集S中Ci在所有样本中出现的概率为pi(i=1,2,3,...,m)，则该训练集S所包含的信息熵定义为


    ```

    Entropy(S) = Entropy(p1,p2,...,pm) = - Σ_{i=1}^{m} p_i log2(p_i)

    ```


    按属性A划分S后的样本子集的熵定义：


    +   假设属性A为离散型数据，具有K个不同的取值，将S划分为k个样本子集{S1, S2, ..., Sk}，则按属性A划分S后的样本子集的信息熵如下，其中|Si|（i=1,2,...,k）为样本子集Si中包含的样本数，|S|为样本集S中包含的样本数


    ```

    Entropy_A(S) = Σ_{i=1}^{k} |Si|/|S| Entropy(Si)

    ```


    +   假设属性A为连续型数据，则按属性A的取值递增排序，将每对相邻值的中点看做可能的分裂点，对每个可能的分裂点，计算信息熵。SL和SR对应于分裂点划分的左右两部分子集，选择信息熵最小点作为分裂点


    ```

    Entropy_A(S) = |SL|/|S| Entropy(SL) + |SR|/|S| Entropy(SR)

    ```'
  merge: -1
  img_proc: true
- pgno: 742
  md: '# C4.5分类算法概念描述


    信息增益率


    +   ✓ 不仅考虑信息增益的大小程度，还兼顾考虑获得信息增益所付出的“代价”


    +   ✓ 引入属性的分裂信息来调节信息增益，如果某个属性有较多的分类取值，则它的信息熵会偏大，但信息增益率由于考虑了分裂信息而降低，进而消除了属性取值数目所带来的影响


    ```

    SplitE(A) = - Σ_{i=1}^{k} |S_i|/|S| log₂ |S_i|/|S|

    ```


    ```

    GainRatio(A) = Gain(A) / SplitE(A)

    ```


    ```

    Gain(S, A) = Entropy(S) - Entropy_A(S)

    ```'
  merge: -1
  img_proc: true
- pgno: 743
  md: '# C4.5分类算法

    对缺失数据的处理


    +   - ID3算法不允许训练集和测试集存在缺失数据

    +     - ✓ 决策树中节点测试输出决定于单个属性的不同的取值，当训练集和测试集中某个样本数据的测试属性值未知，就无法得到当前节点的测试输出


    +   - 一般处理方法

    +     - ✓ 抛弃数据集中具有缺失值的数据

    +       - 当只有少量数据具有缺失值，可以抛弃，不适合有大量数据具有缺失值的情况

    +     - ✓ 以某种方式填充缺失的数据

    +       - 以该属性中最常见值或平均值替代该缺失值

    +       - 以与缺失值样本所对应的类标号属性值相同的样本中该缺失值属性的最常见值或平均值替代


    +   - C4.5处理方法

    +     - 采用概率的方法，为缺失值的每个可能值赋予一个概率


    Gain(A) = 属性 A 在样本集中不空值的比率 × (Entropy(S) − Entropy_A(S))


    SplitE(A) = - Σ_{i=1}^{k} |S_i|/|S| log₂ |S_i|/|S| - |S_unknown|/|S| log₂ |S_unknown|/|S|'
  merge: -1
  img_proc: true
