  md: '# 模糊集合及其运算


    # 2、模糊集的运算


    定义：设A，B是论域U的两个模糊子集，定义


    相等： A = B ⇔ A(x) = B(x), ∀x ∈ U


    包含： A ⊂ B ⇔ A(x) ≤ B(x), ∀x ∈ U


    并： (A ∪ B)(x) = A(x) ∨ B(x), ∀x ∈ U


    ∨表示取大；


    交： (A ∩ B)(x) = A(x) ∧ B(x), ∀x ∈ U


    ∧表示取小。


    余： A^c(x) = 1 − A(x), ∀x ∈ U'
