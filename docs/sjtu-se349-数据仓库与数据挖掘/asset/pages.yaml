  md: '# （1）铁路票价的制定


    +   - 世界上大多数国家的高铁路，都采取丰富的差异化定价。

    +   - 比如德国提供了复杂的价格优惠制度：

    +     - 不经常乘坐火车的旅客往往都会购买一张火车票打折的年卡，50欧元的年卡在全年任何时候购票都可以享受7.5折优惠，200欧元的年卡则可以享受5折优惠。

    +     - 买往返票会有折扣；如果往返行程中，隔着一个周末，又有优惠；提前24小时、72小时、7天、14天购票的优惠幅度是不同的。

    +   - 比如法国，有一种国家规定的优惠政策

    +     - 家庭成员外出坐火车，三个以上小孩，最少可以减价30%、最多可以减价70%。

    +     - 每天工作往返同一条线路优惠

    +     - 对军人乘车可以优惠，军人自己出的票价25%，铁路部门出24.6%，国家补助50.4%'
  merge: -1
