  md: '# 小波变换 Wavelet transform（续）


    # 小波重构


    —重构概念


    +   - 把分解的系数还原成原始信号的过程叫做小波重构(wavelet reconstruction)或合成(synthesis)，数学上叫做逆离散小波变换(inverse
    discrete wavelet transform， IDWT)


    —两个过程


    +   - 在使用滤波器做小波变换时包含滤波和降采样(downsampling)两个过程，在小波重构时也包含升采样(upsampling)和滤波两个过程，见图7-10


    +   - 升采样是在两个样本数据之间插入“0”，目的是把信号的分量加长，其过程见图7-11'
