  md: '# Google的数据中心


    Google 搜索速度为什么能这么快？这主要因为Google在全球分布着众多的数据中心。根据现有信息，如果包括在建的数据中心，Google共有36个数据中心。其中美国有19个、欧洲12个、俄罗斯1个、南美1个和亚洲3个（北京、香港和东京各1个）。不过，Google也并非完全独享这些数据中心，他们也向其他公司出租空间。


