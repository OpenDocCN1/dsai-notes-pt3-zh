  md: '# 虚拟化技术


    虚拟化将服务器物理资源抽象成逻辑资源，让一台服务器变成几台甚至上百台相互隔离的虚拟服务器，人类“虚拟”构建的未来不再受限于物理上的界限，而是让 CPU、内存、磁盘、I/O
    等硬件变成可以动态管理的“资源池”，从而提高资源的利用率、简化系统的管理、实现服务器的整合，并让 IT 对业务的变化更具适应力。可以说，虚拟化技术确实给我们描绘出了一幅美妙的画卷。'
  merge: -1
