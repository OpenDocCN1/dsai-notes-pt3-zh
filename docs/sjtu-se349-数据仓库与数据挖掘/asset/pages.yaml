  md: '# 大数据的构成


    大数据 = 海量数据 + 复杂类型的数据


    大数据包括：

    交易数据和交互数据集在内的所有数据集


    海量交易数据：

    企业内部的经营交易信息主要包括联机交易数据和联机分析数据，是结构化的、通过关系数据库进行管理和访问的静态、历史数据。通过这些数据，我们能了解过去发生了什么。


    海量交互数据：

    源自各种网络和社交媒体。它包括了呼叫详细记录、设备和传感器信息、GPS和地理定位映射数据、通过管理文件传输协议传送的海量图像文件、Web文本和点击流数据、评价数据、科学信息、电子邮件等等。可以告诉我们未来会发生什么。


