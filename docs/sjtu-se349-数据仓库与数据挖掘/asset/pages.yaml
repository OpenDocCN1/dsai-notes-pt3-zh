  md: '# 大数据在高铁轨道检修中的应用


    +   - 随着高铁的繁忙运行，日客流量的不断增长，高铁线路的几何形位也会产生变化，轨道结构也会产生损坏。

    +   - 现有多采用雷达检测车对路基和轨道进行快速、无损地连续检测，还可以进行多通道载荷、位移测试。其检测速度一般能够达到40km/h，而且排除了各种人为因素的干扰，获得真实信息，这就为轨道设备保持良好状态提供了保障。

    +   - 在检测过程中，收集了图像传感器、超声波探伤、雷达测试、激光光电、其他各种轨道检测设备获取的大量信息，比如仅1公里线路上轨检车最高采样点可达到4100多个


    | 序号 | 轨道质量相关数据 |

    | --- | --- |

    | 1 | 轨道几何尺寸（轨距、水平、轨向、尖轨距离、查照间隔） |

    | 2 | 钢轨（接头轨面、内侧错牙、轨端飞边、轨缝） |

    | 3 | 轨枕（碎石道床轨枕接头岔枕、整体道床轨枕废璃钢套管） |

    | 4 | 联接零件（尖轨、可动心轨与滑床板间缝，弹条中部前端下颚离缝） |

    | 5 | 轨道加强设备（转辙、辙叉部分轨撑离缝，爬行量） |

    | ... | ...... |'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# # 大数据在高铁轨道检修中的应用


    +   - **轨道状态检测模型**

    +     - 对轨道的轨距、方向、高低、水平以及曲线超高、曲率、车体的水平振动加速度、车体垂直振动加速度等历史数据进行清洗、归一化处理后，通过回归等数据挖掘手段建立轨道状态检测模型。

    +     - 根据德国高速铁路的实践经验，直接影响及控制行车速度的主要因素有两个：一是轨道线路平纵断面，另一个是轨道线路的平顺性。所以在建立轨道状态检修模型时，着重选取对线路平纵断面和平顺性的指标，如横向震动加速度、轨向、高低等数据。

    +     - 应用数据挖掘技术，建立回归模型，分析和研究轨道的动力学特性。

    +       - 高速铁路轨道在动态载荷作用下的特性和规律

    +       - 轮轨接触不平顺作用下的垂向受力与变形关系

    +       - 高速动载作用下刚度与阻尼对轨道性能的关系

    +       - 高速动载作用下列车临界速度和路基状况对无砟轨道性能的影响


    +   - **再利用可视化技术可以监测轨道状况**

    +     - 对轨道部件状态可以全面监测，如扣件脱落、螺栓松动、鱼尾板断裂、钢轨磨耗、道床路基下沉、坍落等异常状况。'
  merge: -1
