- pgno: 1327
  md: '# Types of Bi-clusters


    +   - Let A = {a₁, ..., aₙ} be a set of genes, B = {b₁, ..., bₙ} a set of conditions

    +   - E=[eᵢⱼ]是基因表达数据矩阵，i=1,2,...,n，j=1,2,...,m，I、J是A、B的子集

    +   - A bi-cluster: A submatrix where genes and conditions follow some consistent
    patterns

    +   - 4 types of bi-clusters (ideal cases)


    +   - Bi-clusters with constant values 具有常数值的双聚类:

    +     - for any i in I and j in J, eᵢⱼ = c


    +   - Bi-clusters with constant values on rows:

    +     - eᵢⱼ = c + αᵢ

    +     - Also, it can be constant values on columns


    +   - Bi-clusters with coherent values (aka. pattern-based clusters)

    +     - eᵢⱼ = c + αᵢ + βⱼ 行与列以同步的方式改变

    +     - 具有相干值的双簇（基于模式的簇）


    +   - Bi-clusters with coherent evolutions on rows

    +     - eᵢⱼ (eᵢ₁ⱼ₁ - eᵢ₁ⱼ₂)(eᵢ₂ⱼ₁ - eᵢ₂ⱼ₂) ≥ 0

    +     - i.e., only interested in the up- or down- regulated changes across genes
    or conditions without constraining on the exact values

    +     - 具有相干演变的双簇


    |  |  |  |  |  |

    |---|---|---|---|---|

    |10|10|10|10|10|

    |20|20|20|20|20|

    |50|50|50|50|50|

    |0|0|0|0|0|


    |  |  |  |  |  |

    |---|---|---|---|---|

    | |10|50|30|70|20|

    | |20|60|40|80|30|

    | |50|90|70|110|60|

    | |0|40|20|60|10|


    |  |  |  |  |  |

    |---|---|---|---|---|

    | |10|50|30|70|20|

    | |20|100|50|1000|30|

    | |50|100|90|120|80|

    | |0|80|20|100|10|'
  merge: -1
