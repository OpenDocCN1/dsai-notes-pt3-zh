    +   - 数据立方体度量是一个数值函数

    +     - 该函数可以对数据立方体空间的每个点求值

    +     - 通过对给定点的各维-值对聚集数据，计算该点的度量值

    +   - 度量根据其所用的聚集函数可以分成三类：分布的，代数的和整体的'
