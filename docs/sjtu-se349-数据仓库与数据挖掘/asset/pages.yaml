- pgno: 604
  md: '# 数据仓库的实现

    ——数据立方体的有效计算


    +   - 数据仓库中的OLAP查询是一种海量数据计算（想象一下对过去10年各地区的软件产品销售的汇总查询）

    +     - 用户却希望这个计算能在数秒钟内完成

    +     - 解决方法在于给出一种有效的数据立方体的方法


    +   - 数据立方体可以被看成是一个

    +     方体的格

    +     - 最底层的方体是基本方体

    +     - 最顶端的方体（顶点）只包含一个单元的值

    +     - 一个n维的数据立方体，每维L层，可能产生的方体总数是多少？


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_604_0.png)'
  merge: -1
  img_proc: true
- pgno: 605
  md: '# 数据仓库的实现

    —— 方体的操作


    +   - DMQL中的方体定义和计算

    +     - define cube sales[item, city, year]: sum(sales_in_dollars)

    +     - compute cube sales


    +   - 上述的compute cube子句可以转化为一个类似于SQL的语句

    +     - SELECT item, city, year, SUM (amount)

    +     - FROM SALES

    +     - CUBE BY item, city, year


    +   - 这个相当于SQL中以下的group by子句

    +     - (item, city, year) —3D

    +     - (item, city), (item year), (city, year) —2D

    +     - (item), (city), (year) —1D

    +     - () --0D


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_605_0.png)'
  merge: -1
  img_proc: true
- pgno: 606
  md: '# 数据仓库的实现


    # —— 物化，数据立方体的选择计算


    +   - 数据立方体的物化可以有以下三种选择：

    +     - 全物化

    +       - 预先计算所有方体

    +     - 不物化

    +       - 不预先计算任何“非基本”方体

    +     - 部分物化

    +       - 有选择的计算一个所有方体的适当子集

    +       - 考虑因素：(1)确定要物化的方体；(2)在查询时利用物化的方体；(3)在装载和刷新时，有效的更新物化的方体


    +   - 确定物化哪些方体

    +     - 考虑工作负荷下的查询、它们的频率和它们的开销等等'
  merge: -1
  img_proc: true
