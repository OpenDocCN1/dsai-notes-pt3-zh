  md: '# Structure Similarity


    +   The desired features tend to be captured by a measure we call Structural Similarity


    σ(v, w) = |Γ(v) ∩ Γ(w)| / √|Γ(v)||Γ(w)|


    +   Structural similarity is large for members of a clique and small for hubs
    and outliers


