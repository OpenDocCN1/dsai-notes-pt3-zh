- pgno: 720
  md: '# 决策树归纳经典算法

    ID3基本原理


    +   - 由Quinlan在1986年提出

    +   - 使用信息增益作为属性选择标准

    +   - 算法原理

    +     - 首先检测所有属性，选择信息增益值最大属性产生决策树节点

    +     - 由该属性的不同取值建立分支

    +     - 再对各分支的子集递归调用该方法建立决策树节点的分支

    +     - 直到所有子集仅包含同一个类别的数据为止，最后得到一棵决策树，对所有的新样本进行分类'
  merge: -1
  img_proc: true
- pgno: 721
  md: '# Information Gain 属性选择度量 之 信息增益


    +   - 信息增益

    +     - 在树的每个节点上使用信息增益度量选择测试属性

    +     - 根据当前节点对应的训练样本，计算各属性的信息增益，然后选择具有最高信息增益的属性作为分裂属性来做样本划分


    +   - 信息增益计算方式


    信息熵（entropy, εntraρi, 熵, 平均信息量, 负熵）：用于度量一个属性的信息量


    ✓ 假设S为训练集，S的目标属性C具有m个可能的类标号值，C={C₁,C₂,...,Cₘ}，假设训练集S中Cᵢ在所有样本中出现的概率为pᵢ(i=1,2,3,...,m)，则该训练集S所包含的信息熵定义为


    ```

    Entropy(S) = Entropy(p₁, p₂, ..., pₘ) = - Σᵢ₌₁ᵐ pᵢ log₂(pᵢ)

    ```


    ✓ 熵越小，表示样本对目标属性的分布越纯。熵越大，表示样本对目标属性的分布越乱


    +   - 熵为0则意味着所有样本的目标属性取值相同

    +   - 当S中不同类别的记录数相同时，取得最大值log2ᵐ,m为类别的个数，对于两个类别来说，最大值为1'
  merge: -1
  img_proc: true
- pgno: 722
  md: '# Information Gain 属性选择度量 之 信息增益


    +   - 信息增益计算方式

    +   - 信息增益


    用属性A划分样本数据集S，划分前样本数据集的不纯程度（熵）和划分后样本数据集的不纯程度（熵）的差值


    ```

    Gain(S, A) = Entropy(S) − Entropy_A(S)

    ```


    按属性A划分S后的样本子集的熵定义：假设属性A具有K个不同的取值，将S划分为k个样本子集{S₁, S₂, ..., Sₖ}，则按属性A划分S后的样本子集的信息熵如下，其中|Sᵢ|（i=1,2,...,k）为样本子集Sᵢ中包含的样本数，|S|为样本集S中包含的样本数


    ```

    Entropy_A(S) = Σ_{i=1}^{k} |S_i|/|S| Entropy(S_i)

    ```


    信息增益越大，说明使用属性A划分后的样本子集越纯，越有利于分类'
  merge: -1
  img_proc: true
