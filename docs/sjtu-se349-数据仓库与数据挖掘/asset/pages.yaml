    α_i y^{(i)} + Σ_{i=1}^m α_i


    b) -1)


    ，得：


    = -1/2 Σ_{i=1,j=1}^m α_i y^{(i)} (x^{(i)})^T α_j y^{(j)} x^{(j)} - b Σ_{i=1}^m
    α_i y^{(i)} + Σ_{i=1}^m α_i


    = Σ_{i=1}^m α_i - 1/2 Σ_{i=1,j=1}^m y^{(i)} y^{(j)} α_i α_j (x^{(i)})^T x^{(j)}
    - b Σ_{i=1}^m α_i y^{(i)}


    最后得到


    ℒ(w, b, α) = Σ_{i=1}^m α_i - 1/2 Σ_{i,j=1}^m y^{(i)} y^{(j)} α_i α_j (x^{(i)})^T
    x^{(j)} - b Σ_{i=1}^m α_i y^{(i)}.


    由于最后一项是0，因此简化为


    ℒ(w, b, α) = Σ_{i=1}^m α_i - 1/2 Σ_{i,j=1}^m y^{(i)} y^{(j)} α_i α_j (x^{(i)})^T
    x^{(j)}.


    这里我们将向量内积 (x^{(i)})^T x^{(j)} 表示为 ⟨x^{(i)}, x^{(j)}⟩.


