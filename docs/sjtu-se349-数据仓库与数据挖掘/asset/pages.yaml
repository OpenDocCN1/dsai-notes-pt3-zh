- pgno: 599
  md: '# Data Warehouse Design Process

    数据仓库的设计过程


    +   自顶向下法、自底向上法或者两者的混合方法

    +   —自顶向下法：由总体设计和规划开始

    +     - 在技术成熟、商业理解透彻的情况下使用

    +   —自底向上法：以实验和原型开始

    +     - 常用在模型和技术开发的初期，可以有效的对使用的技术和模型进行评估，降低风险

    +   —混合方法：上述两者的结合'
  merge: -1
  img_proc: true
- pgno: 600
  md: '# 数据仓库的设计过程


    # 数据仓库的设计过程包含如下步骤：


    +   - 选取待建模的商务处理（例如，订单、发票、发货、库存、记账管理、销售或一般分类账）。如果一个商务过程是整个组织的，并涉及多个复杂的对象，应当选用数据仓库模型。如果处理是部门的，并关注某一类商务处理的分析，则应选择数据集市。


    +   - 选取商务处理的粒度。对于处理，该粒度是基本的，在事实表中是数据的原子级（例如，单个事务、一天的快照等）


    +   - 选取用于每个事实表记录的维。典型的维是时间、商品、顾客、供应商、仓库、事务类型和状态。


    +   - 选取将安放在每个事实表记录中的度量。典型的度量是可加的数值量，dollars_sold和units_sold。'
  merge: -1
  img_proc: true
