- pgno: 586
  md: '# 度量的分类和计算Cont.


    +   - 分布的：假设数据被划分为n个集合，将函数用于每一部分，得到n个聚集值。如果将函数用于n个聚集值得到的结果与将函数用于整个数据集（不划分）得到的结果一样

    +     —E.g., count(), sum(), min(), max()

    +   - 代数的：一个聚集函数如果能够用一个具有M个参数的函数计算（其中M是有界正整数），而每个参数可以用一个分布聚集函数求得

    +     —E.g., avg(), standard_deviation()

    +   - 整体的：一个聚集函数如果描述它的子聚集所需的存储没有一个常数界（不存在一个具有M个参数的代数函数进行这一运算，其中M是常数）

    +     —E.g., median()'
  merge: -1
  img_proc: true
- pgno: 587
  md: '# 多维数据模型上的OLAP操作


    +   上卷(roll-up，也称上钻drill-up):汇总数据


    通过一个维的概念分层向上攀升或者通过维规约在数据立方体上进行聚集


    当用维归约进行上卷时，一个或多个维由给定的数据立方体删除


    +   下钻(drill-down): 上卷的逆操作


    由不太详细的数据到更详细的数据，可以通过沿维的概念分层向下或引入新的维来实现 (为给定数据添加更多细节)


    +   切片和切块(slice and dice)


    切片操作在给定的数据立方体的一个维上进行选择，导致一个子立方体


    切块操作通过对两个或多个维进行选择，定义个子立方体'
  merge: -1
  img_proc: true
- pgno: 588
  md: '# 多维数据模型上的OLAP操作Cont.


    +   - 转轴(pivot)

    +     - 立方体的重定位，可视化，或将一个3维立方体转化为一个2维平面序列

    +     - 转轴是一种可视化操作，通过转动当前数据的视图来提供一个数据的替代表示

    +   - 其他OLAP操作

    +     - 钻过(drill_across): 执行涉及多个事实表的查询

    +     - 钻透(drill_through): 使用关系SQL机制，钻到数据立方体的底层，到后端关系表

    +     - 其他OLAP操作可能包括列出表中最高或最低的N项，以及计算移动平均值、增长率、利润、统计函数等'
  merge: -1
  img_proc: true
