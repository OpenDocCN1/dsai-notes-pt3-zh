- pgno: 855
  md: 'P(R | W) = \frac{P(W | R) P(R)}{P(W)}


    = \frac{P(W | R) P(R)}{P(W | R) P(R) + P(W | \sim R) P(\sim R)}


    = \frac{0.9 \times 0.4}{0.9 \times 0.4 + 0.2 \times 0.6} = 0.75'
  merge: -1
