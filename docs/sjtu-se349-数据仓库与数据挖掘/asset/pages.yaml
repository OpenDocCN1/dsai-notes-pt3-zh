- pgno: 1066
  md: '# 遗传算法关键技术


    +   - 产生初始种群的方法通常有两种：

    +     （1）对问题的解无任何先验知识的情况，采用随机产生样本的方法；

    +     （2）对于具有某些先验知识的情况，可首先将这些先验知识转变为必须满足的一组要求，然后在满足这些要求的解中随机地选取样本。这样选择初始种群可使遗传算法更快地达到最优解。'
