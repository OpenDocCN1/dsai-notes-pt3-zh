- pgno: 1239
  md: "# Generative Model 概率层次聚类\n\n+   假定用于聚类分析的一维点集 X = {x₁, ..., xₙ}\n+   满足高斯分布\n\
    +   \n+   $\\mathcal{N}(\\mu, \\sigma^2) = \\frac{1}{\\sqrt{2\\pi\\sigma^2}} e^{-\\\
    frac{(x-\\mu)^2}{2\\sigma^2}}$\n\n+   于是，点 xᵢ ∈ X 被该模型生成的概率为\n+   \n+   $P(x_i|\\\
    mu, \\sigma^2) = \\frac{1}{\\sqrt{2\\pi\\sigma^2}} e^{-\\frac{(x_i-\\mu)^2}{2\\\
    sigma^2}}$\n\n+   X 被该模型生成的似然为\n+   \n+   $L(\\mathcal{N}(\\mu, \\sigma^2) : X)\
    \ = P(X|\\mu, \\sigma^2) = \\prod_{i=1}^{n} \\frac{1}{\\sqrt{2\\pi\\sigma^2}}\
    \ e^{-\\frac{(x_i-\\mu)^2}{2\\sigma^2}}$\n\n+   学习该生成模型的任务是找出参数 μ 和 σ²\n+   使得\n\
    +   \n+   $\\mathcal{N}(\\mu_0, \\sigma_0^2) = \\arg\\max\\{L(\\mathcal{N}(\\\
    mu, \\sigma^2) : X)\\}$\n+   the maximum likelihood"
  merge: -1
  img_proc: true
- pgno: 1240
  md: '# Generative Model 概率层次聚类


    那如何度量它的质量呢？

    对于划分成 m 个簇 $C_1, ..., C_m$ 的对象集，质量可以用下式度量

    $$Q(\{C_1, ..., C_m\}) = \prod_{i=1}^{m} P(C_i)$$

    其中，P() 是最大似然


    如果我们把两个簇 $C_{j1}$ 和 $C_{j2}$ 合并成一个簇 $C_{j1} \cup C_{j2}$，则整个聚类质量变化

    $$Q((\{C_1, ..., C_m\} - \{C_{j1}, C_{j2}\}) \cup \{C_{j1} \cup C_{j2}\}) - Q(\{C_1,
    ..., C_m\})$$

    $$= \frac{\prod_{i=1}^{m} P(C_i) \cdot P(C_{j1} \cup C_{j2})}{P(C_{j1}) P(C_{j2})}
    - \prod_{i=1}^{m} P(C_i)$$

    $$= \prod_{i=1}^{m} P(C_i) \left( \frac{P(C_{j1} \cup C_{j2})}{P(C_{j1}) P(C_{j2})}
    - 1 \right)$$


    给定簇 $C_i$ 和 $C_j$，他们之间的距离为

    $$dist(C_i, C_j) = -\log \frac{P(C_1 \cup C_2)}{P(C_1) P(C_2)}$$ 如果 $dist(C_i,
    C_j) < 0$, 则合并 $C_i$ 和 $C_j$'
  merge: -1
  img_proc: true
