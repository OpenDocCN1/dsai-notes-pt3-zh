- pgno: 758
  md: '# C4.5算法分析


    +   优点

    +   - 产生的决策树简单直观

    +   - 产生的分类规则易于解释和应用

    +   - 分类准确率高

    +   缺点

    +   - 在构造决策树过程中，需要对数据集进行多次顺序扫描和排序，导致算法低效'
