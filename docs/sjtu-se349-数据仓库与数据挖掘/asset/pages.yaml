- pgno: 1087
  md: '# 模糊集理论


    作为传统的二值逻辑和概率论的一种替代，它允许处理高层抽象，并且提供了一种处理数据的不精确测量的手段。最重要的是，模糊集理论允许处理模糊或不精确的事实。例如，高收入集成员是不精确的（例如，如果收入50000美元是高收入，则收入49000美元或48000美元如何？不像传统的“明确的”集合，元素或者属于集合或者属于它的补，在模糊集合论中，元素可以属于多个模糊集


    例如，值49000美元属于模糊集medium和high，但具有不同的隶属度。使用模糊集的记号可以表示为：


    +   - m_medium_income($49000)=0.15， m_high_income($49000)=0.96

    +   - 其中，m为隶属度


    在模糊集理论中，给定元素X（如$49000美元）的隶属值之和不必等于1，这与传统的概率论不同，传统的概率论受总和公理的约束。'
  merge: -1
  img_proc: true
