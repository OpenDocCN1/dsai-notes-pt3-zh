- pgno: 1277
  md: '# Grid-Based Clustering Method


    # 基于网格的聚类方法基本算法


    # 3、由稠密网格单元形成簇


    +   —由邻接的稠密单元组形成簇是相对简单


    +   —使用密度之外的信息也可以加强基本的基于网格的聚类算法。在许多情况下，数据具有空间和非空间属性。换言之，某些属性描述对象的时间或空间位置，而另一些属性描述对象的其他方面。一个常见的例子是房子，它具有位置和许多其他特性，如价格或占地面积。由于空间（或时间）的的相关性，一个特定单元中的对象通常在其他属性上也具有类似的值。在这些情况下，有可能基于一个或多个非空间属性的统计性质（如平均房价）对单元进行过滤，然后根据剩下的点的密度形成簇。'
  merge: -1
  img_proc: true
- pgno: 1278
  md: '# Grid-Based Clustering Method

    基于网格的聚类方法优缺点


    +   优点

    +   — 基于网格的聚类可能是非常有效的。给定每个属性的划分，单遍数据扫描就可以确定每个对象的网格单元和每个网格单元的计数

    +   — 尽管潜在的网格单元数最可能很高，但是只需要为非空单元创建网格单元


    +   缺点

    +   — 基于网格的聚类非常依赖于密度阈值的选择。如果阈值太高，则簇可能丢失。如果阈值太低，则本应分开的两个簇可能被合并。此外，如果存在不同密度的簇和噪声，则也许不能找到适用于数据空间所有部分的单个阈值

    +   — 矩形网格单元不能准确地捕获圆形边界区域的密度

    +   — 随着维度的增加，网格单元个数迅速增加随维度指数增加。尽管不必明显地考虑空网格单元，但是大部分网格单元都只包含单个对象的情况很容易发生。换言之，对于高维数据，基于网格的聚类效果将会很差。'
  merge: -1
  img_proc: true
