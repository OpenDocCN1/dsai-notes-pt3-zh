- pgno: 625
  md: '# Apriori Algorithm


    # ⚙ Method:


    +   - Let k=1

    +   - Generate frequent itemsets of length 1

    +   - Repeat until no new frequent itemsets are identified


    +   - Generate length (k+1) candidate itemsets from length k frequent itemsets

    +   - Prune candidate itemsets containing subsets of length k that are infrequent

    +   - Count the support of each candidate by scanning the DB

    +   - Eliminate candidates that are infrequent, leaving only those that are frequent'
  merge: -1
  img_proc: true
- pgno: 626
  md: '# 频繁项集挖掘的计算复杂性


    +   - 潜在地在最坏的情况下会产生多少项集？

    +     - 频繁项集要生成的数与最小支持度阈值相关

    +     - 当最小支持度很小时，存在的频繁项集可能是指数级别的

    +     - 最差情况: M^N where M: # distinct items, and N: max length of transactions


    +   - 最差情况下的复杂性 vs. 预期的概率

    +     - Ex. Suppose Walmart has 10⁴ kinds of products

    +       - The chance to pick up one product 10⁻⁴

    +       - The chance to pick up a particular set of 10 products: ~10⁻⁴⁰

    +       - What is the chance this particular set of 10 products to be frequent
    10³ times in 10⁹ transactions?'
  merge: -1
