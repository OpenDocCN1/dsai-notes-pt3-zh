- pgno: 1376
  md: '# Representing Features


    +   Similarity between tuples $t_1$ and $t_2$ w.r.t. categorical feature $f$

    +   — Cosine similarity between vectors $f(t_1)$ and $f(t_2)$


    ```

    sim_f(t_1,t_2)= \frac{\sum_{k=1}^{L} f(t_1).p_k \cdot f(t_2).p_k}{\sqrt{\sum_{k=1}^{L}
    f(t_1).p_k^2} \cdot \sqrt{\sum_{k=1}^{L} f(t_2).p_k^2}}

    ```


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1376_0.png)


    +   Most important information of a feature $f$ is how $f$ groups tuples into
    clusters


    +   $f$ is represented by similarities between every pair of tuples indicated
    by $f$


    +   The horizontal axes are the tuple indices, and the vertical axis is the similarity


    +   This can be considered as a vector of $N \times N$ dimensions'
  merge: -1
  img_proc: true
