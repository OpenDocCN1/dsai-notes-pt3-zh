- pgno: 1078
  md: '# 遗传算法关键技术


    # 变异


    +   - 变异率（突变率）就是在一个染色体中将位实行翻转（flip，即0变1，1变0）的几率。这对于二进制编码的基因来说通常都是很低的值，比如 0.001。


    +   - 因此，无论从群体中怎样选择染色体，首先是检查是否要杂交，然后再从头到尾检查子代染色体的各个位，并按所规定的几率对其中的某些位实行突变（翻转）。'
  merge: -1
  img_proc: true
- pgno: 1079
  md: '# 遗传算法关键技术


    # 停机条件


    +   - 遗传算法是一种反复迭代的搜索算法，它通过多次进化逐渐逼近最优解，因此需要确定停机条件。

    +   - 最常用的停机条件是规定遗传的代数，即迭代次数。'
  merge: -1
  img_proc: true
- pgno: 1080
  md: '# 遗传算法关键技术


    # 停机条件


    当遗传算法是用来产生新的规则时，停机条件不能简单地用遗传代数确定。一次学习过程结束是当目前工作规则已收敛，停机条件应该定义为：子代种群的规则与其父代完全相同，并且各规则的适应值已连续M次保持不变。也就是说，当前工作种群已不再进化了。其中，M是根据不同的应用情况事先设置的一个参数。'
  merge: -1
  img_proc: true
- pgno: 1081
  md: '# 遗传算法的步骤


    +   - 代数计数器初始化： t←0；

    +   - 产生初始种群；

    +   - 评价群体P(t)的适应值；

    +   - 根据当前群体的每个个体的适应值进行选择生成中间群体 P1(t)；

    +   - 个体交叉(重组)操作： P2(t) ←crossover[P1(t)] ；

    +   - 个体变异操作： P3(t) ←mutation[P2(t)] ；

    +   - 评价群体P3(t)的适应值；

    +   - 终止条件判断，若不满足终止条件，则： t←t+1，

    +   - 转向第3步，继续进行遗传操作过程；

    +   - 若满足终止条件，则： 输出当前最优个体，算法结束。'
  merge: -1
  img_proc: true
- pgno: 1082
  md: '# 遗传算法应用于分类


    +   - 创建一个由随机产生的规则组成的初始群体,每个规则可以用一个二进制串表示。

    +   - 一个简单的例子

    +     - 假设给定的训练集样本用两个布尔属性A1和A2描述，并且有两个类C1和C2

    +     - 规则“IF A1 AND NOT A2 THEN C2”可以用二进制串“100”编码，其中最左边的两个二进制分别代表属性A1和A2，而最右边的二进制代表类。

    +     - 类似地，规则“IF NOT A1 AND NOT A2 THEN C1”可用“001”编码。

    +     - 如果一个属性具有k个值，则可以用k个二进制对该属性的值编码，类可以用类似的方式编码。'
  merge: -1
  img_proc: true
- pgno: 1083
  md: '# 遗传算法应用于分类


    +   - 根据适者生存的原则，形成新的群体，它由当前群体中最适合的规则以及这择规则的后代组成。通常，规则的拟合度（fitness）用它在训练样本集上的分类准确率评估。

    +   - 后代通过使用诸如交叉和变异等遗传操作来创建。在交叉操作中，来自规则对的子串交换，形成新的规则对。在变异操作中，规则串中随机选择的位置被反转。

    +   - 继续基于先前的规则群体产生新的规则群体的过程，直到群体 P“进化”，P 中的每个子规则都满足预先指定的拟合度阈值。

    +   - 遗传算法易于并行，并且业已用于分类和其他优化问题。在数据挖掘中，它们可能用于评估其他算法的拟合度。'
  merge: -1
  img_proc: true
