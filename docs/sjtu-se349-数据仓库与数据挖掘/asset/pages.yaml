- pgno: 1089
  md: '# 基于模糊集理论的分类


    +   - 对于进行基于规则的分类的数据挖掘系统来说，模糊集理论是有用的。它提供了结合模糊度量的操作。

    +   - 假设除income的模糊集之外，还为属性year_employed定义模糊集junior_employee和senior_employee。

    +   - 假设有一个规则，对给定的雇员X检测规则前提(IF部分) high_income和senior_employee。如果这两个模糊度量用AND连接在一起，则取它们的最小度量为该规则的度量。换言之，

    +     - m_high_income AND senior_employee (x)=min(m_high_income(x), m_senior_employee(x))

    +       - 这类似于说：一条链与它的最弱的链接一样结实

    +     - m_high_income OR senior_employee (x)=max(m_high_income(x), m_senior_employee(x))

    +       - 这好像是说绳索与它的最结实的绳股一样结实

    +   - 给定一个待分类的元组，可以使用多个模糊规则。每个可用的规则为类的隶属贡献一票。通常，对每个预测分类的真值进行求和，并组合这些和。有一些过程，将模糊输出结果转换成系统返回的非模糊或明确的值。

    +   - 模糊逻辑系统已用于许多分类领域，包括市场调查、财经、卫生保健和环境工程。'
  merge: -1
