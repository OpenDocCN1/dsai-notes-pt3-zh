- pgno: 1057
  md: '# 生物进化理论和遗传学的基本知识


    +   遗传算法效法基于自然选择的生物进化，是一种摹仿生物进化过程的随机方法。

    +   - 遗传算法从代表问题可能潜在解集的一个种群开始，一个种群由经过基因编码的一定数目的个体组成。

    +   - 按照适者生存和优胜劣汰的原理，迭代演化产生出越来越好的近似解。

    +   - 在每一代，根据问题域中个体适应度大小挑选个体，借助于自然遗传学的遗传算子进行组合交叉和变异，产生出代表新的解集的种群。

    +   - 这个过程将导致种群像自然进化一样,后生代种群比前代更加适应于环境，末代种群中的最优个体经过解码可以作为问题近似最优解。'
  merge: -1
  img_proc: true
- pgno: 1058
  md: '# 生物进化理论和遗传学的基本知识


    +   - 一定数目N个个体随机地初始化，并计算每个个体的适应度函数，初始代产生。

    +   - 按照适应度选择个体，父代要求基因重组（交叉）而产生子代。所有子代按一定概率变异。

    +   - 子代的适应度又被重新计算，子代被插入到种群中将父代取而代之，构成新的一代。直到满足优化准则为止。


