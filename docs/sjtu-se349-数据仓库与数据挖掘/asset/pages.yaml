  md: '# 广义线性支持向量机分类算法


    3. 计算 $w^* = \sum_{i=1}^{l} y_i \alpha_i^* x_i$，选择 $\alpha^*$ 的一个分量 $0 < \alpha_j^*
    < C$，并据此计算出 $b^* = y_j - \sum_{i=1}^{l} y_i \alpha_i^* (x_i \cdot x_j)$


    4. 构造划分超平面 $(w^* \cdot x) + b^* = 0$, 决策函数 $f(x) = \operatorname{sgn}((w^* \cdot
