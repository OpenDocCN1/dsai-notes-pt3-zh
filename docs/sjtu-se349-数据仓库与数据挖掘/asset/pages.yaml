- pgno: 734
  md: '# ID3算法分析


    +   - 优点

    +     - 理论清晰，方法简单，学习能力较强

    +   - 缺点

    +     - 只能处理分类属性数据，无法处理连续型数据

    +     - 对测试属性的每个取值相应产生一个分支，且划分相应的数据样本集，这样的划分会导致产生很多小的子集。随着子集被划分的越来越小，划分过程将会由于子集规模过小造成的统计特征不充分而停止

    +     - 使用信息增益作为决策树节点属性选择的标准。由于信息增益在类别值多的属性上计算结果大于类别值少的属性上计算结果，这将会导致决策树算法偏向选择具有较多分支的属性，因而会造成过度拟合

    +     - 考虑充当唯一标识符的属性，如product_ID，在该属性上划分将导致大量分区（与值一样多），每个只包含一个元组。由于每个分区都是纯的，所以基于该划分对数据集S分类的信息熵为0，通过对该属性的划分得到的信息增益最大。但显然，这种划分对分类没有用。


    ```

    Gain(S, A) = Entropy(S) - Entropy_A(S)

    ```


    ```

    Entropy(S) = Entropy(p1, p2, ..., pm) = - Σ_{i=1}^m p_i log2(p_i)

    ```'
  merge: -1
  img_proc: true
