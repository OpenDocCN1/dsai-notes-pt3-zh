  md: '# 频繁模式挖掘或频繁项集挖掘


    +   频繁模式（frequent pattern）

    +   — 显示频繁地出现在给定数据集中的属性—值对之间的有趣联系

    +   — 把每个属性—值对看做一个项，搜索这种频繁模式称做频繁模式挖掘或频繁项集挖掘

    +   — 见第6章和第7章，如何由频繁模式导出关联规则，那里关联通常用于分析顾客在商店的购买模式

    +   — 这种分析可以用于许多决策过程，如产品布局、分类设计和交叉购物'
