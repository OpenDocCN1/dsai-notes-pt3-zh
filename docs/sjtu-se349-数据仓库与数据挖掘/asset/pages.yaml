- pgno: 823
  md: '# 模型评估与选择


    +   - **正元组**：感兴趣的主要类的元组

    +   - **负元组**：其他元组

    +   - **真阳性TP**

    +     - 被分类器正确分类的正元组

    +   - **真阴性TN**

    +     - 被分类器正确分类的负元组

    +   - **假阳性FP**

    +     - 被错误地标记为正元组的负元组

    +   - **假阴性FN**

    +     - 被错误地标记为负元组的正元组

    +   - **TP和TN**告诉我们分类器何时分类正确

    +   - **FP和FN**告诉我们分类器何时错误'
  merge: -1
  img_proc: true
