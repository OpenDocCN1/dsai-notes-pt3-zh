- pgno: 1324
  md: '# 主成分分析法起源


    主成分概念首先由 Karl Pearson在1901年引进，当时只对非随机变量来讨论的。1933年Hotelling将这个概念推广到随机变量。


    一项十分著名的工作是美国的统计学家斯通(Stone)在1947年关于国民经济的研究。他曾利用美国1929—1938年各年的数据，得到了17个反映国民收入与支出的变量要素，例如雇主补贴、消费资料和生产资料、纯公共支出、净增库存、股息、利息外贸平衡等等。在进行主成分分析后，竟以97.4%的精度，用三新变量就取代了原17个变量。根据经济学知识，斯通给这三个新变量分别命名为总收入F1、总收入变化率F2和经济发展或衰退的趋势F3。'
  merge: -1
  img_proc: true
- pgno: 1325
  md: '这种由讨论多个指标降为少数几个综合指标的过程在数学上就叫做降维。主成分分析通常的做法是，寻求原指标的线性组合$F_i$。


    ```

    $F_1 = a_{11}X_1 + a_{21}X_2 + \cdots + a_{p1}X_p$

    $F_2 = a_{12}X_1 + a_{22}X_2 + \cdots + a_{p2}X_p$

    $\cdots$

    $F_p = a_{1p}X_1 + a_{2p}X_2 + \cdots + a_{pp}X_p$

    ```


    满足如下的条件：


    +   > 每个主成分的系数平方和为1。即

    +   $a_{1i}^2 + a_{2i}^2 + \cdots + a_{pi}^2 = 1$


    +   > 主成分之间相互独立，即无重叠的信息。即

    +   $Cov(F_i, F_j)=0,\ i \neq j,\ i,\ j=1,\ 2,\ \cdots,\ p$

    +   $Cov(A,B)=E((A-\bar{A})(B-\bar{B}))=\frac{\sum_{i=1}^{n}(a_i-\bar{A})(b_i-\bar{B})}{n}$


    +   > 主成分的方差依次递减，重要性依次递减，即

    +   $Var(F_1) \geq Var(F_2) \geq \cdots \geq Var(F_p)$'
  merge: -1
  img_proc: true
