  md: '# Subspace Clustering Method (III):

    Bi-Clustering Methods双聚类方法


    +   - Bi-clustering: Cluster both objects and attributes simultaneously (treat
    objs and attrs in symmetric way用同样的方法处理对象和属性)


    +   - Four requirements:

    +     — Only a small set of objects participate in a cluster

    +     — A cluster only involves a small number of attributes

    +     — An object may participate in multiple clusters, or does not participate
    in any cluster at all

    +     — An attribute may be involved in multiple clusters, or is not involved
    in any cluster at all


    +   - Ex 1. Gene expression 基因表达 or microarray data 微阵列数据: a gene sample/condition
