- pgno: 1204
  md: '# The K-Means Clustering Method


    K-均值算法 – 优劣


    +   “不能处理噪声数据和孤立点，对离群点敏感！”


    +   例


    一维空间7个点{1,2,3,8,9,10,25}


    +   直觉应该分为{1,2,3}、{8,9,10}，25是离群点


    使用k=2，进行k—均值


    +   {1,2,3}、{8,9,10,25}


    簇内变差计算(1-2)² +(2-2)² +(3-2)² + +(8-13)² + (9-13)² + (10-13)² +(25-13)² =196


    +   {1,2,3,8}、{9,10,25}


    簇内变差计算(1-3.5)² +(2-3.5)² +(3-3.5)² +(8-3.5)² +(9-14.67)² +(10-14.67)² +(25-14.67)²
    =189.67


    +   由于离群点25的影响，使8被聚集到与8、10不同的簇


    +   簇中心偏离所有的簇成员'
  merge: -1
