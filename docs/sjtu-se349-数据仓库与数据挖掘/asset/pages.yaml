  md: '# Pixel-Oriented Visualization Techniques


    # 基于像素的可视化技术


    +   - 对于一个m维的数据集，在屏幕上创建m个窗口(每维一个)

    +   - 一条记录的m个维值映射到这些窗口中对应位置的m个像素

    +   - 像素的 颜色 反应对应的值


    +   - E.g., AllElectronics 维护了一张顾客信息表，包含四维：

    +     - Income（收入），credit_limit（信贷额度），transaction_volume（成交量）和 age（年龄）


