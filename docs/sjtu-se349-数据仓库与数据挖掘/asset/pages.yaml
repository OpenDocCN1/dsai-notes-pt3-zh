- pgno: 180
  md: "# 2. Classification and regression analysis\n\n数据挖掘模式之二：分类与回归\n\n+   - **分类**预测类别（离散的、无序的）标号\n\
    +   - **回归**建立连续值函数模型，用来预测缺失的或难以获得的数值数据值，而不是（离散）类标号\n\n(1) 输入：训练数据集\n\n| 姓名 |\
    \ 职称 | 工龄 | 成果计分 | 家庭人口 | 身高 | 体重 | 应住房面积 |\n|---|---|---:|---:|---:|---:|---:|---:|\n\
    | 张三 | 高工 | 25 | 5 | 3 | 1.7 | 80 | 85 |\n| 李四 | 助工 | 20 | 4 | 4 | 1.7 | 85 |\
    \ 75 |\n| 王五 | 助工 | 10 | 1 | 2 | 1.8 | 65 | 50 |\n| 张 C | 高工 | 25 | 3 | 2 | 1.7\
    \ | 80 | 75 |\n| 李 D | 高工 | 30 | 6 | 3 | 1.7 | 85 | 85 |\n| 王 E | 高工 | 20 | 5\
    \ | 5 | 1.8 | 65 | 70 |\n\n+   (2) 输出从训练数据中“发现”一个分房计分公式（知识）\n+   \n+   (3) 调用特征选择过程。比较张三与张\
    \ C，李四与李 D，王五与王 E 发现身高、体重与住房无关，删去\n+   \n+   (4) 交互生成加权机制——Σ PiFi。其中 Fi 为各条件量化值，Pi\
    \ 为加权值，总分为应住房面积\n+   \n+   (5) 根据训练数据，调整加权。张三与张 C 以及类似与张三条件的应住 85 平方米等等，使得在训练集中各记录的\
    \ Σ PiFi，刚好在应住房面积的分数段中\n+   \n+   (6) 用测试数据测试和修改公式 Total = Σ PiFi\n+   \n+   (7)\
    \ 公式 Total = Σ PiFi 就是从数据中“挖”出来的分类知识，可以推广使用"
  merge: -1
  img_proc: true
