- pgno: 796
  md: '# 贝叶斯定理：例


    +   - 一堆水果，其中60%是苹果，剩下的是梨；苹果为黄色的概率为20%，梨为黄色的概率为80%。随机从这堆水果中拿出一个黄色的水果，最有可能是拿到梨还是苹果？

    +     - 假定随机变量X代表水果，X取值范围为{苹果,梨}，随机变量Y代表黄色

    +     - 已知

    +       - 苹果在水果堆中的概率为P(X=苹果)=0.6

    +       - 梨在水果堆中的概率为P(X=梨)=0.4

    +       - 苹果为黄色的概率为P(Y=黄色|X=苹果)=0.2

    +       - 梨为黄色的概率为P(Y=黄色|X=梨)=0.8

    +     - 需要计算P(X=苹果|Y=黄色)和P(X=梨|Y=黄色)


    +   - P(X=苹果|Y=黄色)=(P(Y=黄色|X=苹果)* P(X=苹果)) / P(Y=黄色)

    +     =0.2*0.6/ P(Y=黄色)=0.12 / P(Y=黄色)

    +   - P(X=梨|Y=黄色)=(P(Y=黄色|X=梨)* P(X=梨)) / P(Y=黄色)

    +     =0.8*0.4/ P(Y=黄色)=0.32/P(Y=黄色)

    +   - X=梨的后验概率更大，最有可能拿到梨'
  merge: -1
  img_proc: true
- pgno: 797
  md: '# 基于贝叶斯定理的分类器模型


    # 朴素贝叶斯（Naïve Bayes，NB）分类器


    贝叶斯分类器中最简单有效的，并且在实际使用中较为成功的一种分类器。其性能可以与神经网络、决策树分类器相比，在某些场合优于其他分类器。朴素贝叶斯分类器的特征是假定每个属性的取值对给定类的影响独立于其他属性的取值，即给定类变量的条件下各属性变量之间条件独立


    # 树扩展的朴素贝叶斯（Tree-Augmented Naïve Bayes，TANB）


    在朴素贝叶斯分类器的基础上，在属性之间添加连接弧，在一定程度上消除朴素贝叶斯分类器的条件独立性假设，这样的弧称为扩展弧，说明树形约束


    # BAN（Bayesian network-Augmented Naïve Bayes）


    一种增强的朴素贝叶斯分类器，改进了朴素贝叶斯分类器的条件独立假设，并且取消了TANB分类器中属性变量之间必须符合树状结构的要求，假定属性之间存在贝叶斯网络关系而不是树状关系，从而能够表达属性变量的各种依赖关系


    # 贝叶斯多网（Bayesian Muti-Net，BMN）分类器


    TANB和BAN的一个扩展，TANB和BAN分类器认为对不同的类别，各属性变量之间的关系是不变的，即对于不同的类别具有相同的网络结构。而BMN认为对类变量的不同取值，各属性变量之间的关系可能是不一样的


    # GBN分类器（General Bayesian Network）


    如果抛弃条件独立假设，就可以用一般贝叶斯网络作为分类器。GBN是一种无约束的贝叶斯网络分类器，与前面4类贝叶斯分类器不同的，前4类分类器都将类变量作为一个特殊节点，类节点在网络结构中是各个属性的父节点，而GBN将类节点作为一个普通节点'
  merge: -1
  img_proc: true
- pgno: 798
  md: '# 朴素贝叶斯分类的概念


    设D是训练元组和他们相关联的类标号的集合，每个元组用一个n维属性向量X= (x1, x2, ..., xn)，假设有m个类C1, C2, ..., Cm


    分类法将预测X属于具有 最高后验概率 的类，即 P(Ci|X)的最大值 P(Ci|X)> P(Cj|X)(i!=j , 1<=j<=m )


    根据贝叶斯定理，由于P(X)对于所有类为常数，所以只要P(X|Ci)P(Ci) 最大即可


    P(Ci|X)= P(X|Ci)P(Ci)/P(X) = P(X|Ci)×P(Ci)/P(X)


    类的先验概率可以用P(Ci)=|Ci,D|/|D|估计，|Ci,D|是D中Ci类的训练元组数


    如果P(Ci)未知，那么假设这些类等概率，就只要 P(X|Ci) 最大即可'
  merge: -1
  img_proc: true
- pgno: 799
  md: "# 朴素贝叶斯分类的概念Cont.\n\n+   计算 P(X|Ci) 开销可能非常大\n\n+   为降低计算P(X|Ci) 开销，做简单假设 ——\
    \ 属性有条件的相互独立（属性之间不存在依赖关系），则：\n+   \n+   $P(X|C_i)=\\prod_{k=1}^{n}P(x_k|C_i)=P(x_1|C_i)\\\
    times P(x_2|C_i)\\times...\\times P(x_n|C_i)$\n\n+   其中xₖ表示元组X在属性Aₖ的值\n\n+   如果Aₖ是分类属性，\
    \ P(xₖ|Ci) 是D中属性Aₖ的值为Xₖ的Ci类的元组数除以Ci类的元组数|Ci, D|"
  merge: -1
  img_proc: true
- pgno: 800
  md: '# 朴素贝叶斯分类的概念Cont.


    +   如果Aₖ是连续值属性，可以用两种方法估计连续属性的类条件概率


    +   方法一


    +   — 可以将每个连续的属性离散化，然后用相应的离散区间替换连续属性值。把连续属性转换为序数属性，通过计算类Cᵢ的训练样本中落入xₖ对应区间的比例来估计条件概率P(xₖ|Cᵢ)


    +   — 估计误差由离散策略和离散区间的数目决定：如果离散区间的数目太大，则会因为每个区间中训练样本太少而不能对P(xₖ|Cᵢ)做出可靠的估计；如果区间数目太小，有些区间可能会包含来自不同类的样本，因此会失去正确的决策边界


    +   方法二


    +   — 可以假设连续变量服从某种概率分布，然后使用训练样本估计分布的参数


    +   — 正态分布通常被用来表示连续属性的类条件概率分布，分布有均值和方差（数据集中属于Cᵢ类的样本属性Aₖ的平均值和方差），类别Cᵢ下属性xₖ的类条件概率近似为


    P(X|Cᵢ) ≈ g(xₖ, μ_{Cᵢ}, σ_{Cᵢ})      g(x, μ_{Cᵢ}, σ_{Cᵢ}) = 1/√(2π σ_{Cᵢ}) e^{-(x-μ_{Cᵢ})²
    / (2 σ_{Cᵢ}²)}'
  merge: -1
  img_proc: true
- pgno: 801
  md: '# 朴素贝叶斯分类的算法基本描述


    +   - 函数名： NaïveBayes

    +   - 输入： 类标号未知的样本X={x1,x2,...,xn}

    +   - 输出： 未知样本X所属的类标号

    +   - (1) for j=1 to m

    +   - (2) 计算X属于每个类别Cj的概率

    +     $$P(X|C_j)=\prod_{k=1}^{n}P(x_k|C_j)=P(x_1|C_j)P(x_2|C_j)\times...xP(x_n|C_j)$$

    +   - (3) 计算训练集中每个类别的概率P(Cj)

    +   - (4) 计算概率值 μ = P(X|Cj) * P(Cj)

    +   - End for

    +   - 选择计算概率值 μ 最大的Ci（1<=i<=m）做为类别的输出

    +     $$P(Ci|X)=\frac{P(X|Ci)P(Ci)}{P(X)}=P(X|Ci)\times P(Ci)/P(X)$$'
  merge: -1
  img_proc: true
