- pgno: 425
  md: '# 数据变换Data Transformation


    +   通过变换将整个数据集的给定属性的值映射到新的值，每个老的值都能够通过新的值识别


    +   方法

    +   — 光滑Smoothing: 去除数据中的噪声（数据清理的方法）

    +     • 分箱、回归、聚类

    +   — 属性构造Attribute/feature construction（数据规约方法）

    +     • 由给定的属性构造新的属性并添加到属性集中

    +   — 聚集Aggregation: 对数据进行汇总，构造数据立方体（数据规约方法）

    +   — 规范化Normalization: 把属性数据按比例缩放，使之落入特定大小区间

    +     • min-max normalization

    +     • z-score normalization

    +     • normalization by decimal scaling

    +   — 离散化Discretization: 组织更高层概念


    +   数据预处理的主要任务之间存在许多重叠，上述策略中前三个在前面已经介绍'
  merge: -1
  img_proc: true
- pgno: 426
  md: "# 规范化Normalization\n\n+   最小-最大规范化 Min-max normalization: to [new_min_A, new_max_A]\n\
    +   \n+   v' = (v - min_A)/(max_A - min_A) (new_max_A - new_min_A) + new_min_A\n\
    +   \n+   Ex. Let income range $12,000 to $98,000 normalized to [0.0, 1.0]. Then\
    \ $73,000 is mapped to (73,600-12,000)/(98,000-12,000) (1.0-0)+0 = 0.716\n\n+\
    \   Z分数规范化Z-score normalization ( μ : mean, σ : standard deviation):\n+   \n+\
    \   v' = (v - μ_A)/σ_A\n+   \n+   Ex. Let μ = 54,000, σ = 16,000. Then (73,600-54,000)/16,000\
    \ = 1.225\n\n+   小数定标规范化Normalization by decimal scaling\n+   \n+   v' = v / 10^j\
    \   Where j is the smallest integer such that Max(| v '|) < 1"
  merge: -1
  img_proc: true
- pgno: 427
  md: '# 离散化Discretization


    +   - 属性有三种

    +     - 标称Nominal—values from an unordered set, e.g., color, profession

    +     - 顺序Ordinal—values from an ordered set, e.g., military or academic rank

    +     - 数值Numeric—real numbers, e.g., integer or real numbers


    +   - 离散化Discretization: 将连续的属性分割为有间隔的

    +     - 用间隔标签可以代替实际的数据值

    +     - 通过离散化减少数据大小

    +     - 监督的离散化Supervised vs. 非监督的离散化unsupervised

    +     - 自顶向下离散化Split (top-down) vs. 自底向上离散化merge (bottom-up)

    +     - 在一个属性值上可以递归地进行离散化

    +     - 为进一步的分析做准备（如分类）'
  merge: -1
  img_proc: true
- pgno: 428
  md: '# 数据离散方法


    +   典型方法: 所有方法可以递归使用


    +   ——分箱Binning

    +     - Top-down split, unsupervised


    +   ——直方图Histogram analysis

    +     - Top-down split, unsupervised


    +   ——聚类分析Clustering analysis (unsupervised, top-down split or bottom-up merge)


    +   ——决策树分析Decision-tree analysis (supervised, top-down split)


    +   ——相关分析Correlation (e.g., χ²) analysis (unsupervised, bottom-up merge)'
  merge: -1
  img_proc: true
- pgno: 429
  md: '# 简单离散化: 分箱


    +   - 等宽 Equal-width (distance) partitioning

    +     - Divides the range into *N* intervals of equal size: uniform grid

    +     - if *A* and *B* are the lowest and highest values of the attribute, the
    width of intervals will be: *W = (B − A)/N*.

    +     - 最直观，但易受离群点影响

    +   - 等频 Equal-depth (frequency) partitioning

    +     - Divides the range into *N* intervals, each containing approximately same
    number of samples

    +     - 良好的数据比例

    +     - 管理分类属性可能会非常棘手'
  merge: -1
  img_proc: true
