- pgno: 562
  md: '# Metadata Repository

    元数据存储


    +   - 元数据是关于数据的数据

    +   - 在数据仓库中，元数据是定义数据仓库对象的数据，包括：


    +   - 数据仓库结构的描述

    +     - 仓库模式、视图、维、层次结构、导出数据的定义，以及数据集市的位置和内容


    +   - 操作元数据

    +     - 数据血统（迁移数据的历史和它所使用的变换序列）、数据流通（主动的、档案的或净化的）、管理信息（仓库使用的统计量、错误报告和审计跟踪）


    +   - 汇总用的算法

    +     - 包括度量和维度定义算法，数据所处的粒度、划分、主题领域、聚集、汇总、预定义的查询和报告


    +   - 由操作环境到数据仓库的映射

    +     - 源数据库和它们的内容，信关描述，数据划分，数据提取、清理、转换规则和默认值，数据刷新和净化规则，以及安全性（用户授权和存取控制）


    +   - 关于系统性能的数据

    +     - 除刷新、更新和复制周期的定时和调度的规则外，还包括改善数据存取和检索性能的索引和概要


    +   - 商务元数据

    +     - 商务术语和定义、数据拥有者信息、收费政策等'
  merge: -1
  img_proc: true
