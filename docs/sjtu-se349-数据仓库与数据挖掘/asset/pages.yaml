- pgno: 99
  md: '# 大数据 的4V特性


    体量 Volume


    非结构化数据的超大规模和增长

    总数据量的80~90%

    比结构化数据增长快10倍到50倍

    是传统数据仓库的10倍到50倍


    多样性 Variety


    大数据 的异构和多样性

    很多不同形式（文本、图像、视频、机器数据）

    无模式或者模式不明显

    不连贯的语法或句义


    价值密度 Value


    大量的不相关信息

    对未来趋势与模式的可预测分析

    深度复杂分析（机器学习、人工智能 vs 传统商务智能、数据挖掘）


    速度 Velocity


    实时分析而非批量式分析

    数据输入、处理与丢弃

    立竿见影而非事后见效


    “大量化(Volume)、多样化(Variety)、快速化(Velocity)、价值密度低(Value)”就是“大数据”的显著特征，或者说，只有具备这些特点的数据，才是大数据。'
  merge: -1
  img_proc: true
