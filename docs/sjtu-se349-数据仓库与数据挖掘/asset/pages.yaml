  md: '# 问题一：所有模式都是有趣的吗？


    +   - 数据挖掘可能产生数以千计的模式或规则，但并不是所有的模式或规则都是令人感兴趣的。


    +   - 模式兴趣度的度量：一个模式是有趣的，如果

    +     - （1）它易于被人理解；

    +     - （2）在某种程度上，对于新的或测试数据是有效的；

    +     - （3）具有潜在效用；

    +     - （4）新颖的；

    +     - （5）符合用户确信的某种假设


    +   - 有趣的模式代表知识'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# 问题一：所有模式都是有趣的吗？


    +   模式兴趣度的客观和主观度量

    +   — 客观度量: 基于所发现模式的结构和关于它们的统计，比如：支持度、置信度等等

    +   置信度可以用条件概率表示，即包含X的事务也包含Y的概率

    +   — 主观度量: 基于用户对数据的判断。比如：出乎意料的、新颖的、可行的等等


    support(X⇒Y) = P(X ∪ Y)


    confidence(X⇒Y) = P(Y | X)


    置信度可以用条件概率表示，即包含X的事务也包含Y的概率'
  merge: -1
