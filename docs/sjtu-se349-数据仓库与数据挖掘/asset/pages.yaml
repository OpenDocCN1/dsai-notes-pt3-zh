- pgno: 1010
  md: '# 把频繁模式用于分类


    +   可以把频繁模式用于分类


    # —关联分类


    +   - 关联规则由频繁模式产生并用于分类

    +   - 基本思想是可以搜索频繁模式（属性—值对的合取）与类标号之间的强关联


    # —基于有区别力的频繁模式分类


    +   - 在构建分类模型时，频繁模式充当组合特征，可以看做是对单个特征的补充

    +   - 由于频繁模式考察多个属性之间高置信度关联，因此基于频繁模式的分类可能克服决策树归纳一次只考虑一个属性的限制。研究表明，许多基于频繁模式的分类方法比诸如C4.5等传统的分类方法更准确、更可伸缩。'
  merge: -1
