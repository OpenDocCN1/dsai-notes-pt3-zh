  md: '# Data Matrix 数据矩阵


    +   - If data objects have the same fixed set of numeric attributes, then the
    data objects can be thought of as points in a multi-dimensional space, where each
    dimension represents a distinct attribute

    +   - Such data set can be represented by an m by n matrix, where there are m
    rows, one for each object, and n columns, one for each attribute

