- pgno: 476
  md: "# 小波变换 Wavelet transform（续）\n\n# 哈尔函数（Haar小波）\n\n# 非标准分解(nonstandard decomposition)\n\
    \n+   用一维小波交替地对每一行和每一列像素值进行变换。\n\n+   对每一行计算像素对的均值和差值，然后对每一列计算像素对的均值和差值\n\n+ \
    \  对包含均值的1/4像素计算行和列的均值和差值，依此类推\n\n```\nprocedure NonstandardDecomposition(C: array[1...h,\
    \ 1...h] of reals)\n  C ← C/h    (normalize input coefficients)\n  while h > 1\
    \ do\n    for row 1 to h do\n      DecompositionStep(C[row, 1...h])\n    end for\n\
    \    for col 1 to h do\n      DecompositionStep(C[1...h, col])\n    end for\n\
    \    h ← h/2\n  end while\nend procedure\n```"
  merge: -1
  img_proc: true
