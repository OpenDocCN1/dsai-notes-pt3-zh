- pgno: 233
  md: '# 数据挖掘的技术工具

    2.开源工具（2） KNIME


    +   - KNIME

    +   - (Konstanz InformationMiner, http://www.knime.org)是基于Eclipse开发环境开发的数据挖掘工具，无需安装，方便使用。

    +   - KNIME是用Java开发的，可以扩展使用Weka中的挖掘算法。

    +   - KNIME采用的是类似数据流（data flow）的方式来建立分析挖掘流程。挖掘流程由一系列功能节点（node）组成，每个节点有输入/输出端口（port），用于接收数据或模型、导出结果。

    +   - KNIME中每个节点都带有交通信号灯，用于指示该节点的状态（未连接、未配置、缺乏输入数据时为红灯；准备执行为黄灯；执行完毕后为绿灯）。

    +   - 在KNIME中有个特色功能——HiLite，允许用户在节点结果中标记感兴趣的记录，并进一步展开后续探索。'
  merge: -1
  img_proc: true
