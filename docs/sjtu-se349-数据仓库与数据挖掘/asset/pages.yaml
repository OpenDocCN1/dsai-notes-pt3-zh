- pgno: 1055
  md: '# 生物进化理论和遗传学的基本知识


    +   - 遗传

    +     - 生物的普遍特征，“种瓜得瓜，种豆得豆”，亲代把生物信息交给子代，子代按照所得信息发育、分化，因而子代总是和亲代具有相同或相似的形状。

    +     - 生物有了这个特征，物种才能稳定存在。

    +   - 变异

    +     - 亲代和子代之间以及子代的不同个体之间总有些差异，这种现象称为变异。

    +     - 变异是随机发生的，变异的选择和积累是生命多样性的根源。'
  merge: -1
  img_proc: true
