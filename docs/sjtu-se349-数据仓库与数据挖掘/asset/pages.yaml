- pgno: 237
  md: '# 数据挖掘的技术工具

    选择


    数据挖掘是一个过程，只有将数据挖掘工具提供的技术和实施经验与企业的业务逻辑和需求紧密结合，并在实施的过程中不断的磨合，才能取得成功，因此在选择数据挖掘工具的时候，要全面考虑多方面的因素，主要包括以下几点：


    +   - 可产生的模式种类的数量：分类，聚类，关联等

    +   - 解决复杂问题的能力

    +   - 操作性能

    +   - 数据存取能力

    +   - 和其他产品的接口'
