  md: '# 模糊集合及其运算


    # 四、模糊矩阵


    定义：设 $R = (r_{ij})_{m\times n}, 0 \le r_{ij} \le 1$, 称 $R$ 为模糊矩阵。


    当 $r_{ij}$ 只取 0 或 1 时，称 $R$ 为布尔（Boole）矩阵。


    当模糊方阵 $R = (r_{ij})_{n\times n}$ 的对角线上的元素 $r_{ij}$ 都为 1 时，称 $R$ 为模糊单位矩阵。


    例如：$R = \begin{pmatrix} 1 & 0 & 0.1 \\ 0.5 & 0.7 & 0.3 \end{pmatrix}$ $0 = \begin{pmatrix}
    0 & 0 & \dots & 0 \\ 0 & 0 & \dots & 0 \\ \dots & \dots & \dots & \dots \\ 0 &
    0 & \dots & 0 \end{pmatrix}$'
  merge: -1
  img_proc: true
- pgno: 1123
  md: '# 模糊集合及其运算


    # （1）模糊矩阵间的关系及运算


    定义：设 $A = (a_{ij})_{m\times n}, B = (b_{ij})_{m\times n}$ 都是模糊矩阵，定义


    相等：$A = B \Leftrightarrow a_{ij} = b_{ij}$


    包含：$A \le B \Leftrightarrow a_{ij} \le b_{ij}$


    并：$A \cup B = (a_{ij} \vee b_{ij})_{m\times n}$


    交：$A \cap B = (a_{ij} \wedge b_{ij})_{m\times n}$


    余：$A^{c} = (1 - a_{ij})_{m\times n}$'
  merge: -1
