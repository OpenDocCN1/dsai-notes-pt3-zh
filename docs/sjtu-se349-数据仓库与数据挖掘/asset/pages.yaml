- pgno: 1470
  md: '# Statistical Data Mining (1)


    +   - There are many well-established statistical techniques for data analysis,
    particularly for numeric data

    +     - applied extensively to data from scientific experiments and data from
    economics and the social sciences


    # Regression


    +   - predict the value of a response (dependent) variable from one or more predictor
    (independent) variables where the variables are numeric

    +   - forms of regression: linear, multiple, weighted, polynomial, nonparametric,
    and robust


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1470_0.png)'
  merge: -1
  img_proc: true
- pgno: 1471
  md: '# Scientific and Statistical Data Mining (2)


    +   - Generalized linear models

    +     - allow a categorical response variable (or some transformation of it) to
    be related to a set of predictor variables

    +     - similar to the modeling of a numeric respons variable using linear regression

    +     - include logistic regression and Poisson regression


    +   - Mixed-effect models

    +     - For analyzing grouped data, i.e. data that can be classified according
    to one or more grouping variables

    +     - Typically describe relationships between a response variable and some
    covariates in data grouped according to one or more factors


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1471_0.png)'
  merge: -1
  img_proc: true
- pgno: 1472
  md: '# Scientific and Statistical Data Mining (3)


    +   - Regression trees

    +     - Binary trees used for classification and prediction

    +     - Similar to decision trees: Tests are performed at the internal nodes

    +     - In a regression tree the mean of the objective attribute is computed and
    used as the predicted value

    +   - Analysis of variance

    +     - Analyze experimental data for two or more populations described by a numeric
    response variable and one or more categorical variables (factors)


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1472_0.png)


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1472_1.png)'
  merge: -1
  img_proc: true
- pgno: 1473
  md: '# Statistical Data Mining (4)


    +   - Factor analysis

    +     - determine which variables are combined to generate a given factor

    +     - e.g., for many psychiatric data, one can indirectly measure other quantities
    (such as test scores) that reflect the factor of interest

    +   - Discriminant analysis

    +     - predict a categorical response variable, commonly used in social science

    +     - Attempts to determine several discriminant functions (linear combinations
    of the independent variables) that discriminate among the groups defined by the
    response variable


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1473_0.png)


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1473_1.png)'
  merge: -1
  img_proc: true
