  md: '# A Social Network Model


    +   Cliques小集团/小圈子, hubs and outliers

    +   — Individuals in a tight social group, or clique, know many of the same people,
    regardless of the size of the group

    +   — Individuals who are hubs know many people in different groups but belong
    to no single group. Politicians, for example bridge multiple groups

    +   — Individuals who are outliers reside at the margins of society. Hermits,
    for example, know few people and belong to no group


    +   The Neighborhood of a Vertex


    Define Γ(v) as the immediate neighborhood of a vertex (i.e. the set of people
    that an individual knows )


