- pgno: 1428
  md: '# Proximity-Based Approaches: Distance-Based vs. Density-Based Outlier Detection
    基于距离的vs基于密度的离群点检测


    +   - Intuition: Objects that are far away from the others are outliers

    +   - Assumption of proximity-based approach: The proximity of an outlier deviates
    significantly from that of most of the others in the data set

    +   - Two types of proximity-based outlier detection methods

    +     - Distance-based outlier detection: An object o is an outlier if its neighborhood
    does not have enough other points

    +     - Density-based outlier detection: An object o is an outlier if its density
    is relatively much lower than that of its neighbors'
  merge: -1
  img_proc: true
- pgno: 1429
  md: "# Distance-Based Outlier Detection\n\n+   - For each object, examine the #\
    \ of other objects in the *r*-neighborhood（距离阈值 *r* 定义的合理邻域）of o, where *r* is\
    \ a user-specified distance threshold\n+   - An object o is an outlier if most\
    \ (taking π as a fraction threshold分数阈值) of the objects in D are far away from\
    \ o, i.e., not in the *r*-neighborhood of o\n+   \n+     \\[\n+     \\frac{|\\\
    {o'\\mid dist(o,o')\\le r\\}|}{|D|}\\le \\pi\n+     \\]\n+   \n+   - An object\
    \ o is a DB(*r*, π) outlier if\n+   - Equivalently, one can check the distance\
    \ between o and its *k*-th nearest neighbor \\(o_k\\), 第k个最近邻，其中 \\(k=\\lceil\
    \ \\pi|D|\\rceil\\)\n+   - o is an outlier if \\(dist(o,o_k)>r\\)，在o的r邻域中，除o之外至少有k个对象\n\
    \n+   - **Efficient computation:** Nested loop algorithm 嵌套循环算法\n+     - For any\
    \ object \\(o_i\\), calculate its distance from other objects, and count the #\
    \ of other objects in the *r*-neighborhood.\n+     - If π·n other objects are\
    \ within *r* distance, terminate the inner loop\n+     - Otherwise, \\(o_i\\)\
    \ is a DB(*r*, π) outlier\n+   - **Efficiency:** Actually CPU time is not O(n²)\
    \ but linear to the data set size since for most non-outlier objects, the inner\
    \ loop terminates early"
  merge: -1
  img_proc: true
- pgno: 1430
  md: '# Distance-Based Outlier Detection: A Grid-Based Method

    基于网格的方法


    +   - Why efficiency is still a concern? When the complete set of objects cannot
    be held into main memory, cost I/O swapping


    +   - The major cost: (1) each object tests against the whole data set, why not
    only its close neighbor? (2) check objects one by one, why not group by group?


    +   - Grid-based method (CELL): Data space is partitioned into a multi-D grid
    多维网格. Each cell is a hyper cube 超立方体 with diagonal length 对角线长度 r/2


    其中r是一个距离阈值参数，如果有维，则单元的每个边长为 r / (2√l)


    +   - Pruning 剪支 using the level-1 & level 2 cell properties:


    +   - For any possible point x in cell C and any possible point y in a level-1
    cell, dist(x,y) ≤ r


    +   - For any possible point x in cell C and any point y such that dist(x,y) ≥
    r, y is in a level-2 cell


    +   - Thus we only need to check the objects that cannot be pruned, and even for
    such an object o, only need to compute the distance between o and the objects
    in the level-2 cells (since beyond level-2, the distance from o is more than r)


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1430_0.png)'
  merge: -1
  img_proc: true
- pgno: 1431
  md: '# Density-Based Outlier Detection

    基于密度的离群点检测


    +   - Local outliers: Outliers comparing to their local neighborhoods, instead
    of the global data distribution


    +   - In Fig., o₁ and o2 are local outliers to C₁, o₃ is a global outlier, but
    o₄ is not an outlier.

    +   However, proximity-based clustering cannot find o₁ and o₂ are outlier (o1和o2到稠密簇C1的距离小于C2簇中对象到它的最近邻的平均距离，因此，o1和o2都不是基于距离的离群点


    +   - Intuition (density-based outlier detection): The density around an outlier
    object is significantly different from the density around its neighbors


    +   - Method: Use the relative density of an object against its neighbors as the
    indicator of the degree of the object being outliers


    +   - k-distance of an object o, distₖ(o): distance between o and its k-th NN


    +   - k-distance neighborhood of o, Nₖ(o) = {o'' | o'' in D, dist(o, o'') ≤ distₖ(o)}

    +     - Nₖ(o) could be bigger than k since multiple objects may have identical
    distance to o多个对象到o的距离相等


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1431_0.png)'
  merge: -1
  img_proc: true
- pgno: 1432
  md: '# Local Outlier Factor: LOF


    +   Reachability distance 可达距离 from o'' to o:

    +   reachdist_k(o ← o'') = max{dist_k(o), dist(o, o'')}

    +   — k is a user-specified parameter 控制光滑效果


    +   Local reachability density 局部可达密度 of o:

    +   lrd_k(o) = ||N_k(o)|| / Σ_{o''∈N_k(o)} reachdist_k(o'' ← o)


    +   LOF (Local outlier factor 局部离群点因子) of an object o is the average of the ratio
    of local reachability of o and those of o''s k-nearest neighbors

    +   LOF_k(o) = Σ_{o''∈N_k(o)} lrd_k(o'') / lrd_k(o) / ||N_k(o)|| = Σ_{o''∈N_k(o)}
    lrd_k(o'') · Σ_{o''∈N_k(o)} reachdist_k(o'' ← o)


    +   The lower the local reachability density of o, and the higher the local reachability
    density of the kNN of o, the higher LOF


    +   This captures a local outlier whose local density is relatively low comparing
    to the local densities of its kNN


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1432_0.png)'
  merge: -1
  img_proc: true
