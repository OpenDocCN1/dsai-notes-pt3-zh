- pgno: 1365
  md: '# Categorization of Constraints


    +   聚类分析涉及三个基本方面：作为簇实例的对象、作为对象群的簇和对象之间的相似性。因此，根据约束作用于何处对约束分类，有三种类型：

    +   — 实例上的约束

    +   — 簇上的约束

    +   — 相似性度量上的约束


    +   Constraints on instances: specifies how a pair or a set of instances should
    be grouped in the cluster analysis

    +   — Must-link vs. cannot link constraints

    +     • must-link(x, y): x and y should be grouped into one cluster

    +   — Constraints can be defined using variables, e.g.,

    +     • cannot-link(x, y) if dist(x, y) > d


    +   Constraints on clusters: specifies a requirement on the clusters

    +   — E.g., specify the min # of objects in a cluster, the max diameter of a cluster,
    the shape of a cluster (e.g., a convex凸面的), # of clusters (e.g., k)


    +   Constraints on similarity measurements: specifies a requirement that the similarity
    calculation must respect

    +   — E.g., driving on roads, obstacles (e.g., rivers, lakes)


    +   Issues: Hard vs. soft constraints; conflicting or redundant constraints'
  merge: -1
  img_proc: true
- pgno: 1366
  md: '# Constraint-Based Clustering Methods (I):

    Handling Hard Constraints


    +   - Handling hard constraints: Strictly respect the constraints in cluster assignments

    +   - Example: The COP-k-means algorithm

    +     - Generate super-instances for must-link constraints

    +       - Compute the transitive closure of the must-link constraints

    +       - To represent such a subset, replace all those objects in the subset
    by the mean.

    +       - The super-instance also carries a weight, which is the number of objects
    it represents

    +     - Conduct modified k-means clustering to respect cannot-link constraints

    +       - Modify the center-assignment process in k-means to a *nearest feasible
    center assignment*

    +       - An object is assigned to the nearest center so that the assignment respects
    all cannot-link constraints'
  merge: -1
  img_proc: true
- pgno: 1367
  md: '# Constraint-Based Clustering Methods (II):

    Handling Soft Constraints


    +   - Treated as an optimization problem: When a clustering violates a soft constraint,
    a penalty is imposed on the clustering

    +   - Overall objective: Optimizing the clustering quality, and minimizing the
    constraint violation penalty

    +   - Ex. CVQE (Constrained Vector Quantization Error) algorithm: Conduct k-means
    clustering while enforcing constraint violation penalties

    +   - Objective function: Sum of distance used in k-means, adjusted by the constraint
    violation penalties


    +   - Penalty of a must-link violation

    +     - If objects x and y must-be-linked but they are assigned to two different
    centers, c₁ and c₂, dist(c₁, c₂) is added to the objective function as the penalty


    +   - Penalty of a cannot-link violation

    +     - If objects x and y cannot-be-linked but they are assigned to a common
    center c, dist(c, c′), between c and c′ is added to the objective function as
    the penalty, where c′ is the closest cluster to c that can accommodate x or y'
  merge: -1
  img_proc: true
