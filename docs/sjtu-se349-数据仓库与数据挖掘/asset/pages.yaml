- pgno: 1441
  md: '# Mining Contextual Outliers挖掘情境离群点 I:

    Transform into Conventional Outlier Detection

    转换成传统的离群点检测


    If the contexts can be clearly identified, transform it to conventional outlier
    detection


    +   1. Identify the context of the object using the contextual attributes


    +   2. Calculate the outlier score 离群点得分 for the object in the context using a
    conventional outlier detection method


    Ex. Detect outlier customers in the context of customer groups


    +   — Contextual attributes: age group, postal code


    +   — Behavioral attributes: # of trans/yr每年购买次数, annual total trans. Amount每年购买总量


    Steps: (1) locate 顾客c’s context, (2) compare c with the other customers in the
    same group, and (3) use a conventional outlier detection method


    If the context contains very few customers, generalize contexts情境一般化（如：可以假设居住在相同区域、年龄差不多的顾客具有相似的正常行为）


    +   — Ex. Learn a mixture model U on the contextual attributes, and another mixture
    model V of the data on the behavior attributes


    +   — Learn a mapping p(Vi|Uj): the probability that a data object o belonging
    to cluster Uj on the contextual attributes is generated by cluster Vi on the behavior
    attributes


    +   — Outlier score:


    ```

    S(o) = Σ_{Uj} p(o ∈ Uj) Σ_{Vi} p(o ∈ Vi) p(Vi|Uj)

    ```'
  merge: -1
  img_proc: true
- pgno: 1442
  md: '# Mining Contextual Outliers挖掘情境离群点 II


    # Modeling Normal Behavior with Respect to Contexts


    # 关于情境对正常行为建模


    +   - In some applications, one cannot clearly partition the data into contexts

    +     - Ex. if a customer suddenly purchased a product that is unrelated to those
    she recently browsed, it is unclear how many products browsed earlier should be
    considered as the context


    +   - Model the “normal” behavior with respect to contexts

    +     - Using a training data set, train a model that predicts the expected behavior
    attribute values with respect to the contextual attribute values

    +     - An object is a contextual outlier if its behavior attribute values significantly
    deviate from the values predicted by the model


    +   - Using a prediction model that links the contexts and behavior连接情境和行为的预测模型,
    these methods avoid the explicit identification of specific contexts


    +   - Methods: A number of classification and prediction techniques can be used
    to build such models, such as regression, Markov Models, and Finite State Automaton有穷状态自动机'
  merge: -1
  img_proc: true
- pgno: 1443
  md: '# Mining Collective Outliers挖掘集体离群点 I

    On the Set of “Structured Objects”

    图数据上的集体离群点检测


    +   - Collective outlier if objects as a group deviate significantly from the
    entire data

    +   - Need to examine the structure of the data set, i.e, the relationships between
    multiple data objects


    +   - Each of these structures is inherent to its respective type of data

    +     - For temporal data (such as time series and sequences), we explore the
    structures formed by time, which occur in segments of the time series or subsequences

    +     - For spatial data, explore local areas

    +     - For graph and network data, we explore subgraphs

    +     - Difference from the contextual outlier detection: the structures are often
    not explicitly defined, and have to be discovered as part of the outlier detection
    process.

    +     - Collective outlier detection methods: two categories

    +       - (1) Reduce the problem to conventional outlier detection

    +         - Identify structure units, treat each structure unit (e.g., subsequence,
    time series segment, local area, or subgraph) as a data object, and extract features

    +         - Then outlier detection on the set of “structured objects” constructed
    as such using the extracted features


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1443_0.png)'
  merge: -1
  img_proc: true
- pgno: 1444
  md: '# Mining Collective Outliers II: Direct Modeling of the Expected Behavior of
    Structure Units


    +   - Ex. 1. Detect collective outliers in online social network of customers

    +     - Treat each possible subgraph of the network as a structure unit结构单元

    +     - Collective outlier: An outlier subgraph in the social network

    +       - Small subgraphs that are of very low frequency

    +       - Large subgraphs that are surprisingly frequent


    +   - （2）Models the expected behavior of structure units directly


    +   - 预先定义结构单元是困难的


    +   - Ex. 2. Detect collective outliers in temporal sequences

    +     - Learn a Markov model from the sequences

    +     - A subsequence can then be declared as a collective outlier if it significantly
    deviates from the model


    +   - Collective outlier detection is subtle微妙的 due to the challenge of exploring
    the structures in data

    +     - The exploration typically uses heuristics, and thus may be application
    dependent

    +     - The computational cost is often high due to the sophisticated复杂的 mining
    process'
  merge: -1
  img_proc: true
