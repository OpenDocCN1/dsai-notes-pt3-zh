  md: '# 特征空间与核函数


    命题1.1：

    —映射 C_d 把 x ∈ R^N 映射到向量 C_d(x)，C_d(x) 的项是 x 的项的所有有序 d 阶乘积。则有：

    $k(\mathbf{x},\mathbf{y}) = (C_d(\mathbf{x}) \cdot C_d(\mathbf{y})) = (\mathbf{x}
    \cdot \mathbf{y})^d$


    直到 d 阶的所有乘积项：

    $k(\mathbf{x},\mathbf{y}) = (\mathbf{x} \cdot \mathbf{y} + 1)^d$'
