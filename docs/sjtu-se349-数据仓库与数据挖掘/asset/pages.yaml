  md: '# Techniques to Improve Classification Accuracy

    提高分类准确率的技术


    +   通过组合分类器，基于个体分类器投票，返回最终的类标号预测

    +   常见的组合方法：

    +   — Bagging 装袋

    +   — Boosting 提升

    +   — Random Forest 随机森林


    提高模型的准确率：组合分类方法产生一系列分类模型 M₁、M₂、…、Mₖ。给定一个待分类的新数据元组，每个基分类器对该元组的类标号“投票”。组合分类器组合这些投票返回类预测


