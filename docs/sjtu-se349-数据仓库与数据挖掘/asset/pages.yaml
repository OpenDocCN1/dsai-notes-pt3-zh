- pgno: 967
  md: "# 特征空间与核函数\n\nMercer定理：要保证 $L_2(C)$ 下的对称函数 $K: C \\times C \\to R$ 能以正的系数展开成\n\
    \n$$K(u, v) = \\sum_{k=1}^{\\infty} a_k \\psi_k(u) \\psi_k(v)$$ \n\n（即 $K(u,v)$\
    \ 描述了在某个特征空间中的一个内积），其中紧集 $C \\subset R^N$，充分必要条件是，对使得 $\\int g^2(u) du < \\infty$\
    \ 的所有 $g \\neq 0$，条件\n\n$$\\iint K(u, v) g(u) g(v) du dv > 0$$ 成立。"
  merge: -1
  img_proc: true
