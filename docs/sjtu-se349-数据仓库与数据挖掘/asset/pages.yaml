  md: "# 准确率，错误率，灵敏性和特效性\n\n| A\\\\P | C | ¬C |  |\n|---|---|---|---|\n| C | TP |\
    \ FN | P |\n| ¬C | FP | TN | N |\n|  | P′ | N′ | All |\n\n+   - 分类器准确率：正确分类元组所占的百分比\n\
    +   \n+     **Accuracy = (TP + TN)/All**\n+   - **Error rate: 1 − accuracy, or**\n\
    +   \n+     **Error rate = (FP + FN)/All**\n\n+   - 类不平衡问题：\n+     - 感兴趣的主类是稀少的，e.g.\
    \ 欺诈\n+     - 负类显著地占多数，正类占少数\n+     - 灵敏性：正确识别正元组的百分比\n+       - **Sensitivity\
    \ = TP/P**\n+     - 特效性：正确识别负元组的百分比\n+       - **Specificity = TN/N**"
