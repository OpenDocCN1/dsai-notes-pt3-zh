- pgno: 538
  md: '# Data Warehouse: Integrated

    数据仓库特征 之数据集成


    +   - 数据仓库的四个关键特征

    +     - 面向主题的（Subject-oriented）

    +     - 集成的（Integrated）

    +     - 时变的（Time-variant）

    +     - 非易失的（Nonvolatile）


    +   - 一个数据仓库是通过 集成多个异种数据源 来构造的

    +     - E.g., 关系数据库，一般文件，联机事务处理记录


    +   - 使用 数据清理 和 数据集成 技术

    +     - 当数据被移到数据仓库时，它们要经过转化

    +     - 确保命名约定、编码结构、属性度量等的一致性

    +       - E.g., Hotel price: currency, tax, breakfast covered, etc.'
