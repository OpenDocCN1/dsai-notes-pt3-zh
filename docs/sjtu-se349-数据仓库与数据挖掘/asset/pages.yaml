- pgno: 633
  md: "# Apriori算法(伪代码)\n\nC_k: 长度为k的候选集\n\nL_k: 长度为k的频繁项集\n\n```\nL_1 = {频繁项};\n\
    for (k = 1; L_k != ∅; k++) do begin\n    C_{k+1} = 从L_k生成候选集;\n    for each 数据库中的事务\
    \ t do\n        增加所有C_{k+1} 中t包含的候选集的count\n    L_{k+1} = C_{k+1} 中大于min_support的候选集\n\
    end\nreturn ∪_k L_k;\n```"
  merge: -1
  img_proc: true
- pgno: 634
  md: '# Apriori实现


    +   如何生成候选项集？

    +   —Step 1: 连接步 L_k

    +   —Step 2: 剪枝步


    +   Example of Candidate-generation

    +   —L₃={abc, abd, acd, ace, bcd}

    +   —Self-joining: L₃*L₃

    +     • abcd from abc and abd

    +     • acde from acd and ace

    +   —Pruning:

    +     • acde is removed because ade is not in L₃

    +   —C₄ = {abcd}'
  merge: -1
  img_proc: true
- pgno: 635
  md: '# 候选集生成: An SQL Implementation


    +   - 候选集生成的SQL 实现

    +     - Suppose the items in $L_{k-1}$ are listed in an order

    +     - Step 1: self-joining $L_{k-1}$

    +       ```sql

    +       insert into $C_k$

    +       select p.item$_1$, p.item$_2$, ..., p.item$_{k-1}$, q.item$_{k-1}$

    +       from $L_{k-1}$ p, $L_{k-1}$ q

    +       where p.item$_1$=q.item$_1$, ..., p.item$_{k-2}$=q.item$_{k-2}$, p.item$_{k-1}$
    < q.item$_{k-1}$

    +       ```

    +     - Step 2: pruning

    +       forall itemsets c in $C_k$ do

    +       forall (k-1)-subsets s of c do

    +       if (s is not in $L_{k-1}$) then delete c from $C_k$

    +   - Use object-relational extensions like UDFs, BLOBs, and Table functions for
    efficient implementation [See: S. Sarawagi, S. Thomas, and R. Agrawal. Integrating
    association rule mining with relational database systems: Alternatives and implications.
    SIGMOD’98]'
  merge: -1
  img_proc: true
