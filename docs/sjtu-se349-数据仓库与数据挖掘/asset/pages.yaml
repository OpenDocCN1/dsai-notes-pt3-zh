- pgno: 786
  md: '# 大型数据库的分类挖掘 —— 可伸缩性


    +   - 分类挖掘是一个在统计学和机器学习的领域也被广为研究的问题，并提出了很多算法，但是这些算法都是 **内存驻留** 的


    +   - **可伸缩性问题：**

    +     - 由于训练元组在主存和高速缓存之间换进换出，决策树的构造可能变得效率低下。

    +     - 因此，要求以合理的速度对数以百万计的样本和数以百计的属性的进行分类挖掘。


    +   - **解决方法：** 由大型数据库构造判定树

    +     - 首先将样本划分为子集，每个子集可以放在内存中

    +     - 然后由每个子集构造一颗决策树

    +     - 输出的分类将每个子集的分类法组合在一起

    +     - （其他方法包括SLIQ, SPRINT, RainForest等等）'
  merge: -1
  img_proc: true
