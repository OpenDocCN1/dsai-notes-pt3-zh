- pgno: 1167
  md: '# 一、概述


    +   - 现实生活中有许多含糊现象并不能简单地用真、假值来表示，如何表示和处理这些现象就成为一个研究领域。

    +   - 早在1904年谓词逻辑的创始人G.Frege就提出了含糊(Vague)一词，他把它归结到边界线上，也就是说在全域上存在一些个体既不能在其某个子集上分类，也不能在该子集的补集上分类。'
  merge: -1
  img_proc: true
- pgno: 1168
  md: '# 模糊集


    1965年，Zadeh提出了模糊集，不少理论计算机科学家和逻辑学家试图通过这一理论解决G. Frege的含糊概念，但模糊集理论采用隶属度函数来处理模糊性，而基本的隶属度是凭经验或者由领域专家给出，所以具有相当的主观性。'
  merge: -1
  img_proc: true
- pgno: 1169
  md: '# 粗糙集的提出


    20世纪80年代初，波兰的Pawlak针对 G. Frege的边界线区域思想提出了粗糙集（Rough Set），他把那些无法确认的个体都归属于边界线区域，而这种边界线区域被定义为上近似集和下近似集之差集。由于它有确定的数学公式描述，完全由数据决定，所以更有客观性。'
  merge: -1
  img_proc: true
- pgno: 1170
  md: '# 粗糙集与其他集合论


    +   > 粗糙集理论与传统的集合理论有着相似之处，但是它们的出发点完全不同。

    +   > 传统集合论认为，一个集合完全是由其元素所决定，一个元素要么属于这个集合，要么不属于这个集合，即它的隶属函数 μ_X(x) ∈ {0, 1}。

    +   > 模糊集合对此做了拓广，它给成员赋予一个隶属度，即 μ_X(x) ∈ [0, 1]，使得模糊集合能够处理一定的模糊和不确定数据，但是其模糊隶属度的确定往往具有人为因素，这给其应用带来了一定的不便。而且，传统集合论和模糊集合论都是把隶属关系作为原始概念来处理，集合的并和交就建立在其元素的隶属度
    max 和 min 操作上，因此其隶属度必须事先给定。

    +   > 在粗糙集中，隶属关系不再是一个原始概念，因此无需人为给元素指定一个隶属度，从而避免了主观因素的影响。'
  merge: -1
  img_proc: true
- pgno: 1171
  md: '# 粗糙集理论


    +   - RS 理论是一种处理不精确、不确定与不完全数据的新的数学方法. 由于它在机器学习与知识发现、数据挖掘、决策支持与分析、专家系统、归纳推理、模式识别等方面的广泛应用，现已成为一个热门的研究领域


    +   - RS 理论主要兴趣在于它恰好反映了人们用 RS 方法处理不可分辨问题的常规性，即以不完全信息或知识去处理一些不可分辨现象的能力，或依据观察，度量到的某些不确定的结果而进行分类数据的能力'
  merge: -1
