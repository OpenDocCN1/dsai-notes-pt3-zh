- pgno: 1053
  md: '# 遗传算法


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1053_0.png)


    (John Holland, 1929.2.2 -)


    +   遗传算法（GA, Genetic Algorithms）是由霍兰德（John Holland）与其同事、学生于1975年在Michigan大学发展的


    +   GA是一种借鉴生物界自然选择和进化机制发展起来的高度并行、随机、自适应搜索算法。简单而言，它使用了搜索技术，将种群代表一组问题解，通过对当前种群施加选择、交叉和变异等一系列遗传操作，从而产生新一代的种群，并逐步使种群进化到包含近似最优解的状态。'
  merge: -1
  img_proc: true
