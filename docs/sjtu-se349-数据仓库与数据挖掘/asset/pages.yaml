  md: '# （1）Reducing Number of Candidates


    +   - Apriori 美[''eɪprɪˈɔːrɪ] adj.<拉>由原因推及结果的;演绎的;先验的;推测的

    +   - Apriori principle:

    +     — If an itemset is frequent, then all of its subsets must also be frequent


