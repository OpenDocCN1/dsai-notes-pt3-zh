- pgno: 783
  md: '# CART算法的剪枝


    CART采用预剪枝和后剪枝结合的方式进行剪枝


    # （1）CART的预剪枝


    预剪枝的目标是控制决策树的充分生长，通过事先指定一些控制参数完成


    +   ①决策树最大深度：如果决策树的层数已经达到指定深度，则停止生长


    +   ②树中父节点和子节点所包含的最少样本量或比例：对父节点，是指如果节点所包含的样本量已经低于最少样本量或比例，则不再划分；对子节点，是指如果划分后生成的子节点所包含的样本量已经低于最少样本量或比例，则不再划分


    +   ③树节点中测试输出结果的最小差异减少量：如果划分后所产生的测试输出结果差异性变化量小于一个指定值，则不必进行划分'
  merge: -1
  img_proc: true
- pgno: 784
  md: '# CART算法的剪枝


    CART采用预剪枝和后剪枝结合的方式进行剪枝


    # （2）CART的后剪枝


    后剪枝允许决策树的充分生长，然后在此基础上根据一定规则，剪去决策树中的那些不具有代表性的叶节点或子树，是一个边剪枝边检验的过程


    在剪枝过程中，不断计算当前决策子树对检验样本集中测试输出结果的预测精度或误差，并判断是继续剪枝还是停止剪枝'
  merge: -1
  img_proc: true
- pgno: 785
  md: '# 不同决策树算法的比较

    ID3、C4.5、CART


    +   - 属性选择度量方法不同

    +     - 信息增益

    +     - 信息增益率

    +     - 基尼指数和差异性损失

    +   - 防止过分适应数据 的方法不同

    +     - 先剪枝

    +     - 后剪枝

    +   - 适应的预测变量和目标变量的属性类型不同

    +     - 标称属性

    +     - 数值型数据

