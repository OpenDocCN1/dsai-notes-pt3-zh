  md: '# 模糊集合及其运算


    # 一、经典集合与特征函数


    集合：具有某种特定属性的对象集体。

    通常用大写字母*A*、*B*、*C*等表示。


    论域：对局限于一定范围内进行讨论的对象的全体。

    通常用大写字母*U*、*V*、*X*、*Y*等表示。


    论域*U*中的每个对象*u*称为*U*的元素。'
