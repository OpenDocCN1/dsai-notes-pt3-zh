  md: '# Collaborative Filtering


    +   - Collaborative filtering (CF) is the process of filtering for information
    or patterns using techniques involving collaboration among multiple agents, viewpoints,
    data sources, etc.

    +     - Applications involving very large data sets: sensing and monitoring data,
    financial data, electronic commerce and web 2.0 applications

    +   - Example: a method of making automatic predictions (filtering) about the
    interests of a user by collecting taste information from many users (collaborating)

    +     - Assumption: those who agreed in the past tend to agree again in the future'
  merge: -1
  img_proc: true
- pgno: 1403
  md: '# Framework


    +   - **A general 2-step process**

    +     - Look for users who share the same rating patterns with the active user
    (the one for which the prediction is made)

    +     - Use the ratings of those found in step 1 to calculate a prediction

    +   - **Item-based filtering (used in Amazon.com)**

    +     - Build an item-to-item matrix determining the relationships between each
    pair of items

    +     - Infer the user’s taste (i.e., the prediction) using the matrix'
  merge: -1
  img_proc: true
- pgno: 1404
  md: '# Spectral Clustering


    +   Given a set of data points A, a similarity matrix S may be defined where S_ij
    represents a measure of the similarity between points i and j (i, j ∈ A)


    +   Spectral clustering makes use of the spectrum of the similarity matrix of
    the data to perform dimensionality reduction for clustering in fewer dimensions


    +   In functional analysis, the spectrum of a bounded operator is a generalization
    of eigenvalues for matrices


    +   A complex number λ is said to be in the spectrum of a bounded linear operator
    T if λ I − T is not invertible, where I is the identity operator'
  merge: -1
  img_proc: true
- pgno: 1405
  md: '# Shi-Malik Algorithm


    +   - Given a set S of points, the algorithm partitions the points into two sets
    S₁ and S₂

    +   - Let v be the eigenvector v corresponding to the second-smallest eigenvalue
    of the Laplacian matrix L of S

    +     - L = I − D⁻¹ᐟ² S D⁻¹ᐟ², where D is the diagonal matrix

    +   - Let m be the median of the components in v

    +   - Place all points whose component in v is greater than m in S₁, and the rest
    in S₂'
  merge: -1
  img_proc: true
