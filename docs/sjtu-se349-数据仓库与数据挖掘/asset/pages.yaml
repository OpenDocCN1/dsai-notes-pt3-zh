- pgno: 559
  md: '# # Three Data Warehouse Models

    ## 三种数据仓库模型


    从体系结构的角度去看，数据仓库模型可以有以下三种：


    # —企业仓库（Enterprise warehouse）


    +   - 搜集关于跨越整个组织的主题的所有信息，提供企业范围内的数据集成

    +   - 通常来自一个或多个操作数据库系统或外部信息提供者，并且是多功能的。通常，它包含细节数据和汇总数据，其规模由数兆兆字节，到数百兆兆字节，数千兆兆字节，甚至更多。

    +   - 企业数据仓库可以在传统的大型机、超级计算机服务器或并行结构平台上实现。它需要广泛的商务建模，可能需要多年设计和建设。


    # —数据集市（Data mart）


    +   - 企业范围数据的一个子集，对于特定的客户是有用的。其范围限于选定的主题，如：销售数据集市可限定其主题为顾客、商品和销售。

    +   - 包括在数据集市中的数据通常是汇总的。

    +   - 独立的数据集市 VS. 非独立的数据集市（数据来自于企业数据仓库）


    # —虚拟仓库（Virtual warehouse）


    +   - 操作数据库上的一系列视图

    +   - 只有一些可能的汇总视图被物化'
  merge: -1
  img_proc: true
