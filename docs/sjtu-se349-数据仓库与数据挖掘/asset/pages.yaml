- pgno: 1305
  md: '# Model-Based Clustering


    +   A set C of k probabilistic clusters C₁, ..., Cₖ with probability density functions
    f₁, ..., fₖ respectively, and their probabilities ω₁, ..., ωₖ.


    +   Probability of an object o generated by cluster Cⱼ is

    +   P(o|Cⱼ) = ωⱼ fⱼ(o)


    +   Probability of o generated by the set of cluster C is

    +   — O被簇的集合C产生的概率为

    +   P(o|C) = Σⱼ=1ᵏ ωⱼ fⱼ(o)


    Since objects are assumed to be generated independently, for a data set D = {o₁,
    ..., oₙ}, we have,


    P(D|C) = ∏ᵢ=1ⁿ P(oᵢ|C) = ∏ᵢ=1ⁿ Σⱼ=1ᵏ ωⱼ fⱼ(oᵢ)


    +   Task: Find a set C of k probabilistic clusters s.t. P(D|C) is maximized


    +   数据集D上的基于概率模型的聚类分析的任务是找出k个概率簇的集合C，使得P(D|C)最大


    +   However, maximizing P(D|C) is often intractable since the probability density
    function of a cluster can take an arbitrarily complicated form


    +   To make it computationally feasible (as a compromise), assume the probability
    density functions being some parameterized distributions

    +   参数分布'
  merge: -1
  img_proc: true
