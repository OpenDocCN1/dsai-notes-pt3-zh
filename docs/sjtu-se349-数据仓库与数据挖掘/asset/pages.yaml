  md: '# 数据集成 Data Integration


    # 冗余和相关分析


    — 当多个数据库集成时，容易发生冗余


    +   - **对象标识**：不同数据库中属性或维名不一致

    +   - **衍生数据 Derivable data**：一个属性可能由另一个或一组属性导出，**e.g.**，年收入


    — 冗余属性可以用相关分析（**correlation analysis**）检测


    +   - 给定两个属性，这种分析可以根据可用的数据，度量一个属性在多大程度上蕴涵另一个

    +     - 对于**标称属性**，使用 χ²（卡方）检验

    +     - 对于**数值属性**，使用相关系数和协方差，评估一个属性的值如何随另一个变化'
