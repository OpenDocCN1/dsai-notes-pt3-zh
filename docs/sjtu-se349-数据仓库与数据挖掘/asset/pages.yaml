- pgno: 1114
  md: '# 模糊集合及其运算


    # 三、隶属函数的确定


    # 1、模糊统计法


    模糊统计试验的四个要素：


    +   (1) 论域 $U$；

    +   (2) $U$ 中的一个固定元素 $u_0$；

    +   (3) $U$ 中的一个随机运动集合 $A^*$；

    +   (4) $U$ 中的一个以 $A^*$ 作为弹性边界的模糊子集 $A$，制约着 $A^*$ 的运动。$A^*$ 可以覆盖 $u_0$，也可以不覆盖
    $u_0$，致使 $u_0$ 对 $A$ 的隶属关系是不确定的。'
  merge: -1
  img_proc: true
- pgno: 1115
  md: "# 模糊集合及其运算\n\n特点：在各次试验中，u₀是固定的，而 A* 在随机变动。\n\n模糊统计试验过程：\n\n+   (1) 做 n 次试验，计算出\n\
    +   \n+   u₀ 对 A 的隶属频率 = (u₀ ∈ A* 的次数) / n\n\n+   (2) 随着 n 的增大，频率呈现稳定，此稳定值即为 u₀\
    \ 对 A 的隶属度：\n+   \n+   A(u₀) = limₙ→∞ (u₀ ∈ A* 的次数) / n"
  merge: -1
  img_proc: true
