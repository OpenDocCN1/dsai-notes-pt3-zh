- pgno: 1421
  md: '# Statistical Approaches

    统计学方法


    +   Statistical approaches assume that the objects in a data set are generated
    by a stochastic process随机过程 (a generative model生成模型)


    +   Idea: learn a generative model fitting the given data set, and then identify
    the objects in low probability regions低概率区域 of the model as outliers


    +   学习生成模型的方法 Methods are divided into two categories: parametric vs. non-parametric


    # Parametric method


    +   Assumes that the normal data is generated by a parametric distribution with
    parameter θ


    +   The probability density function概率密度函数 of the parametric distribution f(x,
    θ) gives the probability that object x is generated by the distribution


    +   The smaller this value, the more likely x is an outlier


    # Non-parametric method


    +   Not assume an a-priori statistical model and determine the model from the
    input data不假定先验统计模型，而是试图从输入数据确定模型


    +   Not completely parameter free but consider the number and nature of the parameters
    are flexible and not fixed in advance大多数非参数方法并不假定模型是完全无参的（完全无参假定将使得从数据学习模型是不可能的），相反，非参数方法通常假定参数的个数和性质都是灵活的，不预先确定


    +   Examples: histogram直方图 and kernel density estimation核密度估计'
  merge: -1
  img_proc: true
- pgno: 1422
  md: "# Parametric Methods I: Detection Univariate Outliers Based on Normal Distribution\n\
    \n+   Univariate data 一元数据: A data set involving only one attribute or variable\n\
    \n+   方法原理 Often assume that data are generated from a normal distribution, learn\
    \ the parameters from the input data, and identify the points with low probability\
    \ as outliers\n\n+   Ex: Avg. temp.: {24.0, 28.9, 28.9, 29.0, 29.1, 29.1, 29.2,\
    \ 29.2, 29.3, 29.4}\n+   — 通过假设上述温度数据符合正态分布来检测离群点\n+   — Use the maximum likelihood\
    \ method 最大似然方法, 即最大化对数似然函数 to estimate μ and σ\n+   ln ℒ(μ, σ²) = Σᵢ₌₁ⁿ ln f(xᵢ|(μ,\
    \ σ²)) = -n/2 ln(2π) - n/2 ln σ² - 1/(2σ²) Σᵢ₌₁ⁿ (xᵢ - μ)²\n\n+   Taking derivatives\
    \ 求导 with respect to μ and σ², we derive the following maximum likelihood estimates\
    \ 最大似然估计\n+   \\hat{μ} = \bar{x} = 1/n Σᵢ₌₁ⁿ xᵢ      \\hat{σ}² = 1/n Σᵢ₌₁ⁿ (xᵢ\
    \ - \bar{x})²\n\n+   For the above data with n = 10, we have \\hat{μ} = 28.61\
    \ \\hat{σ} = √2.29 = 1.51\n\n+   最大偏离值 24.0 偏离均值 4.61, 在正态分布中 (24 - 28.61)/1.51\
    \ = -3.04 < -3, 24 is an outlier since μ ± 3σ region contains 99.7% data\n+  \
    \ 24 被该正态分布产生的概率小于 15%, 被识别为离群点"
  merge: -1
  img_proc: true
