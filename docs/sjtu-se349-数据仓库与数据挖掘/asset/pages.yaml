- pgno: 226
  md: '# 数据挖掘的技术工具

    1.通用型工具（4） SAS Enterprise Miner


    +   - SAS Enterprise Miner是一种通用的数据挖掘工具，按照“抽样--探索--转换--建模--评估”的方法进行数据挖掘。可以与SAS数据仓库和OLAP集成，实现从提出数据、抓住数据到得到解答的“端到端”知识发现。

    +   - SAS利用它在统计分析软件上的专业来发展全功能、易于使用、可靠且可管理的系统，有大范围的模式选项和算法、设计良好的使用者接口、利用已存在的资料储存能力，和在统计分析上相当大的市场占有率（允许公司取得SAS新增的组件比增加一套新的工作来得好多了），它在数据挖掘市场上终究还是领导者。

    +   - 在我国企业中得到采用的数据挖掘工具，比较典型的包括上海宝钢配矿系统应用、铁路部门在春运客运研究中的应用。

    +   - SAS Enterprise Miner适用于初学者及专业使用者，它的GUI接口是以资料流为导向，允许分析师藉由使用连结连接资料节点及程序节点的方式建构一视觉数据流程图，接口还允许程序码直接嵌入资料流支持多重模式。'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# 数据挖掘的技术工具

    1.通用型工具（5） Clementine(SPSS)


    +   - **SPSS Clementine是一个开放式数据挖掘工具**，曾两次获得英国政府SMART创新奖，它不仅支持整个数据挖掘流程，从数据获取、转化、建模、评估到最终部署的全部过程，还支持数据挖掘的行业标准--CRISP-DM。

    +   - Clementine的可视化数据挖掘使得"思路"分析成为可能，即将集中精力在要解决的问题本身，而不是局限于完成一些技术性工作（比如编写代码）。提供了多种图形化技术，有助理解数据间的关键性联系，指导用户以最便捷的途径找到问题的最终解决办法。

    +   - 此工具结合了多种图形使用者接口的分析技术，包含neural networks、association rules、及rule-induction
    techniques，这些工具提供容易使用的可视化程序环境来执行这些分析功能。

    +   - Clementine使用图形象征的方法，就是透过拖拉鼠标和连接屏幕上的功能节点，这些节点提供了data access、data manipulation、data
    visualization、machine learning以及model analysis，模式的组成是从一个pallet中选取合适之节点，并放置在屏幕上再连接各节点。

    +   - Clementine有强大的资料存取能力包含flat file及关系型数据库（经由ODBC），Clementine也可让modeling的结果持续的写回一ODBC的DBMS输入资料的操作包含配对合并及衍生新字段的能力。

    +   - Clementine的资料可视化能力包含散布图、平面图及Web分析。'
  merge: -1
  img_proc: true
