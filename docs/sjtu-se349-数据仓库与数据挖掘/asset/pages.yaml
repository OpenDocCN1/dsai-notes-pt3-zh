- pgno: 1500
  md: '# Data Mining for Intrusion Detection and Prevention


    +   - Majority of intrusion detection and prevention systems use

    +     - Signature-based detection: use signatures, attack patterns that are preconfigured
    and predetermined by domain experts

    +     - Anomaly-based detection: build profiles (models of normal behavior) and
    detect those that are substantially deviate from the profiles

    +   - What data mining can help

    +     - New data mining algorithms for intrusion detection

    +     - Association, correlation, and discriminative pattern analysis help select
    and build discriminative classifiers

    +     - Analysis of stream data: outlier detection, clustering, model shifting

    +     - Distributed data mining

    +     - Visualization and querying tools'
  merge: -1
  img_proc: true
- pgno: 1501
  md: '# Data Mining and Recommender Systems


    +   - **Recommender systems:** Personalization, making product recommendations
    that are likely to be of interest to a user

    +   - **Approaches:** Content-based, collaborative, or their hybrid

    +     - Content-based: Recommends items that are similar to items the user preferred
    or queried in the past

    +     - Collaborative filtering: Consider a user''s social environment, opinions
    of other customers who have similar tastes or preferences

    +   - **Data mining and recommender systems**

    +     - Users C × items S: extract from known to unknown ratings to predict user-item
    combinations

    +     - Memory-based method often uses k-nearest neighbor approach

    +     - Model-based method uses a collection of ratings to learn a model (e.g.,
    probabilistic models, clustering, Bayesian networks, etc.)

    +     - Hybrid approaches integrate both to improve performance (e.g., using ensemble)'
  merge: -1
  img_proc: true
