- pgno: 268
  md: '# Important Characteristics of Structured Data


    +   - **Dimensionality维度**

    +     - Curse of dimensionality

    +     - 维度是数据集中的对象具有的属性数目。低维度数据往往与中、高维度数据有质的不同。分析高维数据有时会陷入所谓维灾难。数据预处理的一个重要动机就是减少维度，称为维归约（dimensionality
    reduction）


    +   - **Sparsity稀疏性**

    +     - Only presence counts

    +     - 有些数据集，如具有非对称特征的数据集，一个对象的大部分属性上的值都为0。在许多情况下，非零项还不到1%。稀疏性是一个优点，因为只有非零值才需要存储和处理。这将节省大量的计算时间和存储空间。此外，有些数据挖掘算法仅适合处理稀疏数据。


    +   - **Resolution分辨率**

    +     - Patterns depend on the scale

    +     - 常常可以在不同的分辨率下得到数据，并且在不同的分辨率下数据的性质也不同。例如，在几米的分辨率下，地球表面看上去很不平坦，但在数十公里的分辨率下却相对平坦。数据的模式也依赖于分辨率。如果分辨率太高，模式可能看不出，或者掩埋在噪声中；如果分辨率太低，模式可能不出现。例如，几小时的气压变化可以反映出暴雪等天气系统的移动；而在月的标度下，这些现象就检测不到。


    +   - **Distribution分布**

    +     - Centrality（集中） and dispersion（分散）


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_268_0.png)'
  merge: -1
  img_proc: true
