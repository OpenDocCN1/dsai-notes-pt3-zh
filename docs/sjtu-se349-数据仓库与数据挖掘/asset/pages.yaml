- pgno: 205
  md: '# （2）高铁轨道检修


    +   轨道状态检测模型


    对轨道的轨距、方向、高低、水平以及曲线超高、曲率、车体的水平振动加速度、车体垂直振动加速度等历史数据进行清洗、归一化处理后，通过回归等数据挖掘手段建立轨道状态检测模型。


    根据德国高速铁路的实践经验，直接影响及控制行车速度的主要因素有两个：一是轨道线路平纵断面，另一个是轨道线路的平顺性。所以在建立轨道状态检修模型时，着重选取对线路平纵断面和平顺性的指标，如横向振动加速度、轨向、高低等数据。


    应用数据挖掘技术，建立回归模型，分析和研究轨道的动力学特性


    +   - 高速铁路轨道在动荷载作用下的特性和规律

    +   - 轮轨接触不平顺作用下的垂向受力与变形关系

    +   - 高速动载作用下刚度与阻尼对轨道性能的关系

    +   - 高速动载作用下列车临界速度和路基状况对无砟轨道性能的影响


    +   再利用可视化技术可以监测轨道状况


    对轨道部件状态可以全面监测，如扣件脱落、螺栓松动、鱼尾板断裂、钢轨磨耗、道床路基水浸、坍落等异常状况。'
