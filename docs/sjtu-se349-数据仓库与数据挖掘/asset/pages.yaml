- pgno: 1076
  md: '# 遗传算法关键技术


    +   - 交叉或基因重组

    +     - 每一次，从群体中选择2个染色体，同时生成其值在0到1之间一个随机数，然后根据此数据的

    +       值来确定两个染色体是否要进行杂交。

    +     - 如果数值低于杂交率(0.7)就进行杂交，然后沿着染色体的长度随机选择一个位置，并把此位置后面所有的位进行互换。'
  merge: -1
  img_proc: true
- pgno: 1077
  md: '# 遗传算法关键技术


    交叉或基因重组

    例如，设给定的2个染色体为：

    10001001110010010

    01010001001000011

    沿着它们的长度随机选择一个位置，比如说10，然后互换第10位之后所有位。这样两个染色体就变成了（已在开始互换的位置加了一个空格）：

    100010011 01000011

    010100010 10010010'
  merge: -1
