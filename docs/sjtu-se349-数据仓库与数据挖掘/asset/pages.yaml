  md: '# 各类决策树算法之间的差别


    基本算法对于树的每一层，需要扫描一遍D中的元组。在处理大型数据库时，这可能导致很长的训练时间和内存不足


    基本算法的计算复杂度

    给定训练集 D，算法的计算复杂度为 O(n x |D| x log(|D|))，其中 n 是描述 D 中元组的属性个数，|D| 是 D 中的训练元组数。这意味着以
    |D| 个元组产生一棵树的计算开销最多为 n x |D| x log(|D|)。


    关于决策树归纳的改进算法很多，主要差别体现在


    +   — 在创建树时如何选择属性

    +   — 用于剪枝的机制'
