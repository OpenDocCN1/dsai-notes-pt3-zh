- pgno: 1034
  md: '# CBR问题的求解


    # Similarity Computation


    +   - Assignment of similarities for features values.

    +   - Express degree of similarity by a real number between 0 and 1


    Examples:


    +   - Feature: *Problem*

    +     - Front light doesn’t work ↔ Break light doesn’t work — 0.8

    +     - Front light doesn’t work ↔ Engine doesn’t start — 0.4


    +   - Feature: *Battery voltage* (similarity depends on the difference)

    +     - 12.6 V ↔ 13.6 V — 0.9

    +     - 12.6 V ↔ 6.7 V — 0.1


