- pgno: 873
  md: '# 基本概念


    +   神经网络最早是由心理学家和神经学家提出的，旨在寻求开发和测试神经的计算模拟。


    +   神经网络是模拟人脑思维方式的数学模型，是在现代生物学研究人脑组织成果的基础上提出的，用来模拟人类大脑神经网络的结构和行为，反映了人脑功能的基本特征，如并行信息处理、学习、联想、模式分类、记忆等。


    +   简单地说，神经网络是一组连接的输入/输出单元，其中每个连接都与一个权重相关联。在学习阶段，通过调整这些权重，能够正确预测输入样本的类标号。


