- pgno: 1261
  md: '# DBSCAN算法的缺陷


    +   尽管DBSCAN能够根据给定的输入参数Eps（邻域的最大半径）和MinPts（核心对象的邻域中要求的最多点数）聚类对象，但是它把选择能产生可接受的聚类结果的参数值的责任留给了用户。这是许多其他聚类算法都存在的问题。参数的设置通常依靠经验，难以确定，对于现实世界的高维数据集而言尤其如此。大多数算法都对这些参数值非常敏感：设置的细微不同可能导致差别很大的聚类结果。


    +   此外，现实的高维数据集常常具有非常倾斜的分布，全局密度参数不能很好地刻画其内在的聚类结构。


    +   为了克服在聚类分析中使用一组全局参数的缺点，提出了OPTICS聚类分析方法。'
  merge: -1
  img_proc: true
- pgno: 1262
  md: '# OPTICS: A Cluster-Ordering Method (1999)


    # 通过点排序识别聚类结构， Ordering Points to Identify the Clustering Structure


    +   并不显式地产生数据集聚类，而是输出簇排序（cluster ordering）。这个排序是所有分析对象的线性表，并且代表了数据的基于密度的聚类结构。较稠密族中的对象在簇排序中相互靠近。


    +   这个排序等价于从广泛的参数设置中得到的基于密度的聚类。这样，不要用户提供特定密度阈值。簇排序可以用来提取基本的聚类信息（例如，族中心或任意形状的簇），导出内在的聚类结构，也可以提供聚类的可视化。可以用图形或使用可视化技术表示'
  merge: -1
  img_proc: true
- pgno: 1263
  md: '# OPTICS: Some Extension from DBSCAN

    从DBSCAN的扩充


    +   - 对象p的核心距离是最小的 ε′值，使得p的 ε′-邻域内至少有 MinPts个对象

    +     - ε′是使得p成为核心对象的最小半径阈值

    +     - p不是关于 ε 和MinPts的核心对象，其核心距离无定义

    +   - 从对象q到对象p的可达距离是使p从q密度可达的最小半径值

    +     - Max (core-distance (q), d (q, p))

    +     - 如果q不是核心对象则无定义'
  merge: -1
