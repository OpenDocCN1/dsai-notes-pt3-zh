  md: '# 模型评估与选择 —— ROC 曲线


    # ❶ ROC（Receiver Operating Characteristic）曲线


    +   - 显示了给定模型的真正利率(TPR)和假正利率(FPR)之间的权衡

    +   - ROC 曲线离对角线越近，模型的准确率越低

    +     - 好的模型的 ROC 曲线

    +   - 曲线下方的面积 -> 模型准确率

    +     - 面积越接近0.5，准确率越低


    +   - 横坐标：FPR 假正利率

    +   - 纵坐标：TPR 真正利率


