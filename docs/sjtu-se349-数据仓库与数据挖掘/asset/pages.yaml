- pgno: 224
  md: '# 数据挖掘的技术工具

    1.通用型工具（2） MineSet


    MineSet 是由SGI 公司和美国Standford 大学联合开发的多任务数据挖掘系统。集成多种数据挖掘算法和可视化工具，帮助用户直观地、实时地发掘、理解大量数据背后的知识。


    MineSet 2.6 有如下特点：


    +   - 使用了6种可视化工具来表现数据和知识，包括Splat Visualize、Scatter Visualize、Map Visualize、Tree
    Visualize、Record Viewer、Statistics Visualize、Cluster Visualizer，其中Record Viewer
    是二维表，Statistics Visualize 是二维统计图，其余都是三维图形，用户可以任意放大、旋转、移动图形，从不同的角度观看。对同一个挖掘结果可以用不同的可视化工具以各种形式表示，用户也可以按照个人的喜好调整最终效果，，以便更好地理解。

    +   - 提供多种数据挖掘模式，包括分类器、回归模式、关联规则、聚类等。

    +   - 支持多种关系数据库，可以直接从Oracle、Informix、Sybase 的表读取数据，也可以通过SQL 命令执行查询。

    +   - 多种数据转换功能。在挖掘前，可以去除不必要的数据项，统计、集合、分组数据，转换数据类型，构造表达式由已有数据项生成新的数据项，对数据采样等。

    +   - 操作简单。

    +   - 支持国际字符。

    +   - 可以直接发布到Web。'
  merge: -1
