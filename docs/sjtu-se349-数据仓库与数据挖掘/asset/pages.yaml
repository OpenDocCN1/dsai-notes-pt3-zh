- pgno: 447
  md: '# 小波变换 Wavelet transform（续）


    +   - 小波分析/小波变换

    +     变换目的是获得时间和频率域之间的相互关系


    —小波变换


    +   - 对一个函数在空间和时间上进行局部化的一种数学变换

    +     - 通过平移母小波(mother wavelet)获得信号的时间信息

    +     - 通过缩放母小波的宽度(或称尺度)获得信号的频率特性

    +     - 对母小波的平移和缩放操作是为计算小波的系数，这些系数代表局部信号和小波之间的相互关系


    +   - 对比傅立叶变换

    +     - 提供了频率域的信息，但丢失了时间域的局部化信息


    —小波分析中常用的三个基本概念


    +   - 连续小波变换

    +   - 离散小波变换

    +   - 小波重构'
  merge: -1
  img_proc: true
- pgno: 448
  md: '# 小波变换 Wavelet transform（续）


    +   连续小波变换(continuous wavelet transform, CWT)

    +   —傅立叶分析

    +     • 用一系列不同频率的正弦波表示一个信号

    +     • 一系列不同频率的正弦波是傅立叶变换的基函数

    +   —小波分析

    +     • 用母小波通过移位和缩放后得到的一系列小波表示一个信号

    +     • 一系列小波可用作表示一些函数的基函数

    +   —凡能用傅立叶分析的函数都可用小波分析

    +     • 小波变换可理解为用经过缩放和平移的一系列函数代替傅立叶变换用的正弦波

    +   —用不规则的小波分析变化激烈的信号比用平滑的正弦波更有效，或者说对信号的基本特性描述得更好'
  merge: -1
  img_proc: true
- pgno: 449
  md: "# 小波变换 Wavelet transform（续）\n\n+   — **CWT的变换过程示例见图，可分如下5步**\n+   \n+   1.\
    \ 小波 ψ(t) 和原始信号 f(t) 的开始部分进行比较\n+   2. 计算系数 C——该部分信号与小波的近似程度；C 值越高表示信号与小波相似程度越高\n\
    +   3. 小波右移 k 得到的小波函数为 ψ(t-k)，然后重复步骤1和2，……直到信号结束\n+   4. 扩展小波，如扩展一倍，得到的小波函数为 ψ(t/2)\n\
    +   5. 重复步骤1~4\n\n![](img/6d25e92eb0bd56a22c311279c19b06b4_449_0.png)\n\n图 连续小波变换的过程"
  merge: -1
  img_proc: true
- pgno: 450
  md: '# 小波变换 Wavelet transform（续）


    —连续小波变换用下式表示


    ```

    C(scale, position) = ∫_{-∞}^{+∞} f(t) ψ(scale, position, t) dt

    ```


    +   该式含义：小波变换是信号f(t)与被缩放和平移的小波函数ψ之积在信号存在的整个期间里求和


    +   CWT变换的结果是许多小波系数C，这些系数是缩放因子(scale)和位置(position)的函数


    # 离散小波变换(discrete wavelet transform，DWT)


    —用小波的基函数(basis functions)表示一个函数的方法


    +   小波的基函数序列或称子小波(baby wavelets)函数是由单个小波或称为母小波函数通过缩放和平移得到的


    +   缩放因子和平移参数都选择2^j (j>0的整数)的倍数，这种变换称为双尺度小波变换(dyadic wavelet transform)'
  merge: -1
  img_proc: true
