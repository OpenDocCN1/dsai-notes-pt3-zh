  md: '# Model Evaluation and Selection

    模型评估与选择


    +   - 评估度量：我们如何衡量准确率？其他的度量方法呢？

    +   - 当评估准确率时使用验证测试集而不是训练集中带有类标签的元组

    +   - 用于评估一个分类器的准确性的方法：

    +     - 保持和随机子抽样

    +     - 交叉验证

    +     - 自助方法

    +   - 比较分类器：

    +     - 置信区间

    +     - ROC曲线和成本效益分析'
