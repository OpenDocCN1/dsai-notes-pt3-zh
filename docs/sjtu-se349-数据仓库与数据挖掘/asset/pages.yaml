  md: '# 小波变换 Wavelet transform（续）


    —1945: Gabor


    +   - 开发了STFT (short time Fourier transform)


    ```

    STFT(τ, ω) = ∫ s(t) g(t − τ) e^{-jωt} dt

    ```


    where:  s(t) = signal

    g(t) = windowing function


