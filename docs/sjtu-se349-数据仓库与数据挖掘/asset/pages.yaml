  md: '# Basic Statistical Descriptions of Data

    数据的<|message|> 基本统计描述 之 中心趋势度量


    +   - 我们有某个属性X（例如： salary 工资），共分析N个对象

    +     令 X1, X2, X3, X4, ..., Xn 为 “属性X的N个 观测值”

    +     又称 观测 或 (X的)数据集


    +   - 如果标出Salary的这些观测值(以千美元为单位按递增次序)

    +     30, 31, 47, 50, 52, 52, 56, 60, 63, 70, 70, 110


    +   - 那么大部分值将落在哪处？

    +     —这反应数据的中心趋势

    +     —包括： 均值(Mean)、中位数(Median)、众数(Mode)'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# Basic Statistical Descriptions of Data


    数据的基本统计描述 之 中心趋势度量 Cont.


    +   中心趋势的思想

    +   包括：均值(Mean)、中位数(Median)、众数(Mode)


    +   (算数)均值（Mean）：

    +   \(\bar{x} = \frac{1}{n} \sum_{i=1}^{n} x_i\)


    +   加权平均

    +   \(\bar{x} = \frac{\sum_{i=1}^{n} w_i x_i}{\sum_{i=1}^{n} w_i}\)


    +   截尾均值(trimmed mean)

    +   为了抵消少数极端值的影响，丢弃高低极端值后的均值'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# Basic Statistical Descriptions of Data


    数据的基本统计描述 之 中位数


    +   中心趋势的思想


    包括：均值(Mean)、中位数(Median)、众数(Mode)


    # 中位数（Median）：


    +   — 对于倾斜（非对称）数据，数据中心的更好度量


    +   — 有序数据值的 中间值


    +   — 假设给定某属性X的N个有序观测值


    如果N是奇数，


    中位数即改有序集的中间值


    如果N是偶数，


    中位数不唯一


    | age | frequency |

    |---|---|---|

    | 1–5 | 200 |

    | 6–15 | 450 |

    | 16–20 | 300 |

    | 21–50 | 1500 |

    | 51–80 | 700 |

    | 81–110 | 44 |


    # 中位数近似值计算：

    (根据中位数区间)


    median = L₁ + ( n/2 - (∑ freq)ₗ / freqₘₑdᵢₐₙ ) width'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Basic Statistical Descriptions of Data


    # 数据的基本统计描述 之 众数


    +   - 中心趋势的思想

    +     - 包括：均值(Mean)、中位数(Median)、众数(Mode)


    +   - 众数（Mode）：

    +     - 集合中出现最频繁的值

    +     - 可以对定性和定量属性确定众数

    +     - 可能最高频率对应多个不同值，具有多个众数（单峰、多峰）


    对于适度倾斜(非对称)的单峰数值数据，众数近似值计算：


    $mean - mode = 3 \times (mean - median)$


    +   - 中列数

    +     - 数据集的最大和最小值的平均值'
  merge: -1
