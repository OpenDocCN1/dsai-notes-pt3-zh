- pgno: 525
  md: '# 多指标 求解主成分的步骤


    在一般情况下，设有n个样品，每个样品观测p个指标，将原始数据排成如下矩阵：


    ```

    \begin{pmatrix} x_{11} & x_{12} & \dots & x_{1p} \\ x_{21} & x_{22} & \dots &
    x_{2p} \\ \dots & \dots & \dots & \dots \\ x_{n1} & x_{n2} & \dots & x_{np} \end{pmatrix}

    ```'
  merge: -1
  img_proc: true
- pgno: 526
  md: '+   1. 求样本均值 $\bar{X} = (\bar{x_1}, \bar{x_2}, ..., \bar{x_p})''$ 和样本协方差矩阵
    S;

    +   2. 求解特征方程 $|S - \lambda I| = 0$, 其中 I 是单位矩阵

    +      解得 p 个特征根 $\lambda_1, \lambda_2, ..., \lambda_p$ ($\lambda_1 \ge \lambda_2
    \ge ... \ge \lambda_p$)

    +   3. 求 $\lambda_k$ 所对应的单位特征向量 $\alpha_k$ ($k = 1,2,...,p$)

    +      解得 $\alpha_k = (a_{1k}, a_{2k}, ..., a_{pk})''$

    +   4. 写出主成分的表达式

    +      $F_k = a_{1k}(x_1 - \bar{x_1}) + a_{2k}(x_2 - \bar{x_2}) + ... + a_{pk}(x_p
    - \bar{x_p})$

    +      或 $F_k = a_{1k}x_1 + a_{2k}x_2 + ... + a_{pk}x_p$'
  merge: -1
  img_proc: true
- pgno: 527
  md: '# 主成分个数的选取原则


    根据累积贡献率的大小取前 m 个（m<p）主成分


    选取原则：


    $$\frac{\sum_{i=1}^{m}\lambda_i}{\sum_{i=1}^{p}\lambda_i}\ge 80\sim85\%$$'
  merge: -1
