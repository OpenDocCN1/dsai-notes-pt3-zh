  md: '# 更加学术化的描述：k—近邻法


    k一近邻法是在近邻法的基础上加以改进而来的，这个法则就是在 的 k 个近邻中，按出现最多的样本类别来作为 的类别。前面我们详细讨论了近邻法的错误率的表达式及其上下界。同样，对于k一近邻法则，我们也讨论一下错误率的问题，这里以
    和 二类问题为例。为避免出现 而不能判决的情况，我们取 为奇数。对待识别模式 x 误分类有以下两种情况: k1 + k2


    1  k1 < k2  k1 ≤ (k-1)/2  x ∈ ω1  Σ_{j=0}^{(k-1)/2} C_k^j P(ω1|x)^j P(ω2|x)^{k-j}

    2  k2 < k1  k2 ≤ (k-1)/2  x ∈ ω2  Σ_{j=0}^{(k-1)/2} C_k^j P(ω2|x)^j P(ω1|x)^{k-j}'
  merge: -1
  img_proc: true
- pgno: 1020
  md: '前面我们已经说过，当 $N \to \infty$ ，$x$ 的 $k$ 个已知类别的最近邻样本 $x_1, x_2, \cdots, x_k$ 以概率
    1 收敛于 $x$ ，所以这 $k$ 个样本可以不标出下标，纭记为 $x$ 。对于给定的 $x$ 的条件错误率为


    $P_{N \to \infty}^k(e|x)=P(\omega_1|x)\sum_{j=0}^{(k-1)/2} C_k^j P(\omega_1|x)^j
    P(\omega_2|x)^{k-j}$


    $+P(\omega_2|x)\sum_{j=0}^{(k-1)/2} C_k^j P(\omega_2|x)^j P(\omega_1|x)^{k-j}$


    $=P(\omega_1|x)\sum_{j=0}^{(k-1)/2} C_k^j P(\omega_1|x)^j \left[1-P(\omega_1|x)\right]^{k-j}$


    $+\left[1-P(\omega_1|x)\right]\sum_{j=(k+1)/2}^{k} C_k^j P(\omega_1|x)^j \left[1-P(\omega_1|x)\right]^{k-j}$'
  merge: -1
  img_proc: true
- pgno: 1021
  md: '$P_{N\to\infty}^k(e|\boldsymbol{x}) = P(\omega_1|\boldsymbol{x})\sum_{j=0}^{(k-1)/2}
    C_k^j P(\omega_1|\boldsymbol{x})^j\left[1-P(\omega_1|\boldsymbol{x})\right]^{k-j}$


    $+\left[1-P(\omega_1|\boldsymbol{x})\right]\sum_{j=(k+1)/2}^{k} C_k^j P(\omega_1|\boldsymbol{x})^j\left[1-P(\omega_1|\boldsymbol{x})\right]^{k-j}$


    $=P(\omega_1|\boldsymbol{x})+\left[1-2P(\omega_1|\boldsymbol{x})\right]\sum_{j=(k+1)/2}^{k}
    C_k^j P(\omega_1|\boldsymbol{x})^j\left[1-P(\omega_1|\boldsymbol{x})\right]^{k-j}$


    $P^*(e|\boldsymbol{x}) = \min\left[P(\omega_1|\boldsymbol{x}), P(\omega_2|\boldsymbol{x})\right]
    = \min\left[P(\omega_1|\boldsymbol{x}), 1-P(\omega_1|\boldsymbol{x})\right]$


    $P_{N\to\infty}^k(e|\boldsymbol{x}) = P^*(e|\boldsymbol{x}) + \left[1-2P^*(e|\boldsymbol{x})\right]\sum_{j=(k+1)/2}^{k}
    C_k^j {P^*}^j(e|\boldsymbol{x})\left[1-P^*(e|\boldsymbol{x})\right]^{k-j}$'
  merge: -1
  img_proc: true
- pgno: 1022
  md: "渐近平均错误率 $P = E\\left[ P_{N\\to\\infty}^k(e|x)\\right]$ \n这里定义Bayes条件错误率$P^*(e|x)$的函数$C_k\\\
    left[ P^*(e|x)\\right]$ 为大于$P_{N\\to\\infty}^k(e|x)$的最小凹函数，即对所有的$x$ \n$P_{N\\\
    to\\infty}^k(e|x) \\le C_k\\left[ P^*(e|x)\\right]$ \n$P = E\\left[ P_{N\\to\\\
    infty}^k(e|x)\\right] \\le E\\left\\{ C_k\\left[ P^*(e|x)\\right]\\right\\} \\\
    le C_k\\left\\{ E\\left[ P^*(e|x)\\right]\\right\\} = C_k(P^*)$ \n$k\\quad P_{N\\\
    to\\infty}^k\\quad C_k(P^*)\\quad$ \n$P^* \\le P \\le C_k(P^*) \\le C_{k-1}(P^*)\
    \ \\le \\cdots \\le C_1(P^*) = 2P^*(1-P^*)$ \n$P^* \\le P \\le P^*\\left(2 - \\\
    frac{c}{c-1}P^*\\right)$"
  merge: -1
