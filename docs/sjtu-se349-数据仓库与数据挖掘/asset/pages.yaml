- pgno: 1281
  md: '# The STING Clustering Method


    # STING:统计信息网格方法(2)


    +   高层的每个单元被划分成多个低一层的单元


    +   每个单元属性的统计信息被预先计算和存储


    +   高层单元的统计参数很容易从低层单元的计算得到，这些参数包括：


    +   —Count(计数), mean(平均值), s(标准差), min(最小值), max(最大值)


    +   —分布类型—正态分布，一致分布等等


    +   使用自顶向下的方法回答空间数据的查询


    +   从一个预先选择的层次开始—通常包含少量的单元


    +   为当前层的每个单元计算置信区间'
  merge: -1
  img_proc: true
- pgno: 1282
  md: '# # STING Algorithm and Its Analysis

    ## STING:统计信息网格方法(3)


    +   - 不相关的单元不再考虑 D

    +   - 当检查完当前层，接着检查下一个低层次

    +   - 重复这个过程直到达到底层

    +   - 由于STING采用了一种多分辨率的方法来进行聚类分析，因此聚类质量取决于网格结构的最底层的粒度。如果最底层的粒度很细，则处理的代价会显著增加；然而，如果网格结构最底层的粒度太粗，则会降低聚类分析的质量。


    +   - 优点：

    +     - 独立于查询，易于并行处理和增量更新

    +     - 查询处理时间 O(K)，其中 k 是最低网格单元的数目


    +   - 缺点：

    +     - 此外，STING在构建一个父亲单元时没有考虑子女单元和其相邻单元之间的联系。因此，结果簇的形状是Isothetic，即所有的簇边界不是水平的，就是竖直的，没有斜的分界线。尽管该技术有较快的处理速度，但可能降低簇的质量和精确性。'
  merge: -1
  img_proc: true
