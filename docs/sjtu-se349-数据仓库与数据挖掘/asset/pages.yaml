- pgno: 925
  md: '# 机器学习的基本问题


    +   - 统计学习理论领域里把学习问题看作是利用有限数量的观测来寻找待求的依赖关系的问题。

    +   - 基于数据的机器学习问题，则是根据已知样本估计数据之间的依赖关系，从而对未知或无法测量的数据进行预测和判断。

    +   - 机器学习的一般模型

    +     - 从给定的函数集 Ω 中选择出能够最好地逼近系统响应的函数 ω。


    机器学习本质上就是一种对问题真实模型的逼近，与问题真实解之间的误差，就叫做风险。


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_925_0.png)'
  merge: -1
  img_proc: true
- pgno: 926
  md: '# 机器学习基础


    # 经验风险最小化原则


    +   经验风险Remp(w)

    +   —使用分类器在样本数据上分类的结果与真实结果（因为样本是已经标注过的数据，是准确的数据）之间的差值


    +   经验风险最小化（Structural Risk Minimization, ERM）原则

    +   —在传统的机器学习方法中，通常将经验风险作为期望风险的估计值，学习的目标就是使经验风险Remp最小，强调利用经验风险最小化（ERM）原则进行学习


    R_emp(w) = 1/l Σ_{i=1}^l L(y_i, f(x_i, w))


    L(y,f(x,w))为由于用f(x,w)对y进行预测而造成的损失或误差'
  merge: -1
  img_proc: true
- pgno: 927
  md: '# 机器学习基础


    # 经验风险最小化存在的问题


    以前的机器学习方法都把经验风险最小化作为努力目标，缺点是


    +   经验风险主要反映的是样本数据与真实结果的差距，而样本数据在实际项目中只是总体的一小部分


    +   过度地强调经验风险最小化容易造成过学习问题


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_927_0.png)


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_927_1.png)


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_927_2.png)


