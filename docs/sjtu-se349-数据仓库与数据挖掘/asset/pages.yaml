- pgno: 145
  md: '# 数据挖掘与统计学的关系


    # 数据挖掘与统计学具有天然联系


    统计学研究数据的收集、分析、解释和表示


    # 统计模型可以是数据挖掘任务的结果


    统计模型是一组数学函数，它们用随机变量及其概率分布刻画目标类对象的行为，统计模型广泛用于对数据和数据类建模


    # 数据挖掘任务也可以建立在统计模型之上


    在大数据库中挖掘模式时，数据挖掘过程可使用统计模型来帮助识别数据中的噪声和缺失值


    # 对于从数据中挖掘各种模式，以及理解产生和影响这些模式的潜在机制，统计学是有用的


    推理统计学（或预测统计学）用某种方式对数据建模，解释观测中的随机性和确定性，并用来提取关于所考察的过程或总体的结论


    # 统计学方法也可以用来验证数据挖掘结果


    例如，建立分类或预测模型之后，应该使用统计假设检验来验证模型。统计假设检验（有时称做证实数据分析）使用实验数据进行统计判决。如果结果不大可能随机出现，则称它为统计显著的。如果分类或预测模型有效，则该模型的描述统计址将增强模型的可靠性。


    # 在数据挖掘中使用统计学方法并不简单


    一个巨大的挑战是如何把统计学方法用于大型数据集，许多统计学方法都具有很高的计算复杂度，当这些方法应用于分布在多个逻辑或物理站点上的大型数据集时，应该小心地设计和调整算法，以降低计算开销。'
  merge: -1
  img_proc: true
- pgno: 146
  md: "# 数据挖掘与机器学习的关系\n\n+   机器学习考察计算机如何基于数据学习（或提高它们的性能），其主要研究领域之一是，计算机程序基于数据自动地学习识别复杂的模式，并做出智能的决策。\n\
    +   \n+   例如，一个典型的机器学习问题是为计算机编制程序，使之从一组实例学习之后，能够自动地识别邮件上的手写邮政编码\n\n+   机器学习是一个快速成长的学科，有很多与数据挖掘高度相关的、经典的机器学习问题\n\
    +   \n+   有监督学习\n+   \n+   基本上是分类的同义词。学习中的监督来自训练数据集中标记的实例。例如，在邮政编码识别问题中，一组手写邮政编码图像与其对应的机器可读的转换物用作训练实例，监督分类模型的学习。\n\
    +   \n+   监督学习\n+   \n+   本质上是聚类的同义词。学习过程是无监督的，因为输入实例没有类标记。典型地，我们可以使用聚类发现数据中的类。例如，一个无监督学习方法可以取一个手写数字图像集合作为输入。假设它找出了10个数据簇，这些簇可以分别对应于0\
    \ ~ 9这10个不同的数字。然而，由于训练数据并无标记，因此学习到的模型并不能告诉我们所发现的簇的语义。\n\n+   数据挖掘与机器学习的不同\n+ \
    \  \n+   对于分类和聚类任务，机器学习研究通常关注模型的准确率\n+   \n+   除准确率之外，数据挖掘研究非常强调挖掘方法在大型数据集上的有效性和可伸缩性，以及处理复杂数据类型的方法，开发新的、非传统的方法"
  merge: -1
