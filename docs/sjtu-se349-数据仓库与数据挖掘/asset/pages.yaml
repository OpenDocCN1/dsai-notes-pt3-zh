- pgno: 762
  md: '# CART算法简介


    +   - CART（Classification and Regression Tree，分类与回归树）算法由斯坦福大学和加州大学伯克利分校的Breiman等人与1984年提出

    +   - CART决策树能够处理连续属性数据和标称属性作为预测变量和目标变量下的分类

    +     - 当输出变量是标称属性数据时，所建立的决策树被称为分类树（classification tree），用于分类的预测

    +     - 当输出变量是数值型的数据时，所建立的决策树被称为回归树（regression tree），用于数值的预测

    +   - 分类回归树算法同样包括决策树增长和决策树剪枝两个过程，算法采用二元递归划分方法，将当前的样本集分为两个样本子集，使得生成的决策树的每个非叶节点都有两个分支，CART算法生成的决策树是结构简洁的二叉树'
  merge: -1
  img_proc: true
- pgno: 763
  md: '# CART与C4.5算法比较


    +   - 决策树形式不同

    +     - CART为二叉树

    +     - C4.5是多叉树

    +   - 不纯度量不同

    +     - CART使用Gini系数

    +     - C4.5使用信息增益率

    +   - 输入标量和输出变量类型不同

    +     - CART中输入标量和输出变量可以是分类型或数值型的，而C4.5的输出变量只能是分类型

    +     - 如果目标变量是标称的，并且具有两个以上的类别，CART算法可能考虑将目标类别合并成两个超类别

    +     - 如果目标变量是连续的，CART算法找出基于树的回归方程来预测目标变量

    +   - 对于缺失值的处理方法不同

    +     - CART采用代理测试来估计测试的输出值

    +     - C4.5直接将其分配到该分支中概率最大的分类

    +   - 对决策树的剪枝方法不同

    +     - CART采用的是代价复杂度模型，通过交叉验证来估计对测试样本集的误分类损失，产生最小交叉验证误分类估计的树

    +     - C4.5启发式地调整在训练样本上估计出的误差率，使用调整的误差率，以找到使评分函数最大的树'
  merge: -1
  img_proc: true
- pgno: 764
  md: '# CART算法的基本概念


    +   设训练样本集 S={X1,X2,...,Xm}，其中 Xm 称为属性向量，Y 称为类标号向量

    +   — 当 Y 为连续型数据时，称为回归树

    +   — 当 Y 为离散型数据时，称为分类树


    +   属性选择标准

    +   — 使用 Gini 系数度量对某个属性变量测试输出的两组取值的差异性

    +   — 理想的分组应该尽量使两组中样本输出变量取值的差异性总和达到最小，即“纯度”最大，也就是使两组变量取值的差异性下降最快，“纯度”增加最快'
  merge: -1
  img_proc: true
- pgno: 765
  md: '# Gini Index 属性选择度量之 基尼系数


    +   设t是分类回归树中的某个节点，k为当前属性下测试输出的类别树，p(j|t)为节点t中样本测试输出取类别j的概率


    ```

    Gini(t)=1−∑_{j=1}^{k} p²(j|t)

    ```


    +   对节点t，G(t)越小，意味着该节点中所包含的样本越集中在某一类上，即该节点越纯，否则越不纯，差异性就越大


    +   当节点样本的测试输出均取同一类取值时，输出变量取值的差异性最小，Gini系数为0


    +   当各类别取概率值相同时，测试输出取值的差异性最大，Gini系数也最大，为1-1/k，其中k为目标变量的类别数'
  merge: -1
  img_proc: true
- pgno: 766
  md: '# Gini Index 属性选择度量之基尼系数


    +   设 t 是一个节点， ξ 为该节点的一个属性分支条件，该分支条件将节点 t 中样本分别分到左分支 S_L 和右分支 S_R 右，则称下式为在分支条件
    ξ 下节点 t 的差异性损失，其中， gini(t) 为划分前测试输出的 Gini 系数， |S_R| 和 |S_L| 分别表示划分后左右分支的样本个数


    ```

    Δgini(ξ,t)=gini(t)−|S_R|/(|S_L|+|S_R|) gini(t_R)−|S_L|/(|S_L|+|S_R|) gini(t_L)

    ```


    +   为了使节点 t 尽可能纯，需要选择某个属性分支条件 ξ，使该节点的差异性损失尽可能大，用 ξ(t) 表示所考虑的分支条件 ξ 的全体，则选择分支条件因为


    ```

    ξ_max = arg max_{ξ∈ξ(t)} Δgini(ξ,t)

    ```'
  merge: -1
  img_proc: true
- pgno: 767
  md: '# CART算法的属性选择


    +   - 分类树的属性选择

    +     — 分类型

    +       - CART只能建立二叉树，对于取多个值的属性变量，需要将多类别合并成两个类别，形成“超类”，然后计算两“超类”下样本测试输出取值的差异性

    +     — 数值型

    +       - 将数据按升序排序，然后从小到大依次以相邻数值的中间值作为分隔，将样本分为两组，并计算所得组中样本测试输出取值的差异性


    +   - 回归树的属性选择

    +     — 回归树确定当前最佳分组变量的策略与分类树相同，主要不同在于度量节点测试输出值差异性的指标有所不同

    +       - t为节点，N为节点t所含的样本个数，y_i(t)为节点t中测试输出变量值，\overline{y(t)}为节点t中测试输出变量的平均值，R(t)和N分别为分组前输出变量的方差和样本个数

    +       - R(t_R)、N_R和R(t_L)、N_L分别为分组后右子树<|message|>的方差和样本量以及左子树的方差和样本量

    +       - 差异性损失的度量指标为方差的减少量，使其达到最大的属性变量为当前最佳划分属性变量


    R(t)=\frac{1}{N-1}\sum_{i=1}^{N}(y_i(t)-\overline{y(t)})^2 \quad \Delta R(t)=R(t)-\frac{N_R}{N}R(t_R)-\frac{N_L}{N}R(t_L)'
  merge: -1
  img_proc: true
- pgno: 768
  md: '# CART算法的描述


    +   - 函数名：CART(S,F)

    +   - 输入：样本数据集S，训练集数据属性集合F

    +   - 输出：CART树

    +   - (1)if样本S全部属于同一个类别C，then

    +   - (2)    创建一个叶节点，并标记类标号为C

    +   - (3)    return

    +   - (4}else

    +   - (5)    计算属性集F中每一个属性划分的差异性损失，假定差异性损失最大的属性为A

    +   - (6)    创建节点，取属性A为该节点的决策属性

    +   - (7)    以属性A划分S得到S1和S2两个子集 /*当属性A有多于2个取值时，可能有多个两组划分，此时取差异性损失最大的那个划分S1和S2
    */

    +   - (8)        递归调用CART(S1, F)

    +   - (9)        递归调用CART(S2, F)

    +   - (10)end'
  merge: -1
  img_proc: true
