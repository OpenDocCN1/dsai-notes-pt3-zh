- pgno: 630
  md: '# Apriori: 通过限制候选产生发现频繁项集


    +   Apriori 美[''eɪpri''ɔːrɪ] adj.<拉>由原因推及结果的;演绎的;先验的;推测的


    +   Apriori剪枝原则: If there is any itemset which is infrequent, its superset should
    not be generated/tested! (Agrawal & Srikant @VLDB’94, Mannila, et al. @ KDD’94)


    +   方法:

    +   —最初，一次扫描数据库得到频繁1-项集

    +   —从长度为k的频繁项集中生成长度（k+1）的候选项集

    +   —根据数据测试候选项集

    +   —当没有频繁或候选集生成时，算法结束'
  merge: -1
