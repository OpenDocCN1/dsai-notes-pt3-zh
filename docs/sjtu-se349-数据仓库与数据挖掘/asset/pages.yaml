  md: '# 集成学习法


    Ensemble Learning


    将多个分类方法聚集在一起形成组合分类器，基于每个个体分类器（基分类器）投票，返回最终的类标号预测。通常，一个集成分类器的分类性能会好于单个分类器。


    +   - 使用训练集的不同子集训练得到不同的基分类器

    +   - 用同一训练集的不同属性子集训练得到不同的基分类器


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1174_0.png)


    ```

    集成学习方法的构造过程

    (1) 令 D 表示原始训练数据集，k 表示分类器的个数，Z 表示测试数据集

    (2) for i = 1 to k do

    (3)    由 D 创建训练集 D_i

    (4)    由 D_i 创建非分类器 C_i

    (5) end for

    (6) for 每个测试样本 x ∈ Z do

    (7)    C*(x) = Vote(C_1(x), C_2(x), ..., C_k(x))

    (8) end for

    ```'
