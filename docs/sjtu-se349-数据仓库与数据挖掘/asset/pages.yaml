- pgno: 1229
  md: '# BIRCH算法


    # ① 簇直径


    $$\sqrt{\frac{1}{n(n-1)}\sum (x_i-x_j)^2}$$


    +   - 对于输入的每个点而言

    +   - 找到最为接近的叶子节点

    +   - 将该点加入到叶子节点中并且更新CF

    +   - 如果节点直径 > 最大直径，那么分裂叶子节点，祖先有可能也因此分裂


    +   - 算法复杂度 O(n)

    +   - 对数据点的插入顺序敏感

    +   - CF-树的每个节点由于大小限制只能包含有限的条目，一个CF-树节点并不总是对应于用户认为的一个自然簇

    +   - 使用半径或直径来控制簇边界，簇趋向于球形'
  merge: -1
  img_proc: true
- pgno: 1230
  md: '# CF树的构造过程


    <1> 从根节点开始递归往下，计算当前条目与要插入数据点之间的距离，寻找距离最小的那条路径，直到找到与该数据点最接近的叶节点中的条目。


    <2> 比较计算出的距离是否小于阈值 T。如果小于，则当前条目吸收该数据点；如果距离大于等于阈值 T，则转<3>。


    <3> 判断当前条目所在叶节点的条目个数是否小于 L。如果是，则直接将数据点插入为该数据点的新条目，否则需要分裂该叶节点。分裂的原则是寻找该叶节点中距离最远的两个条目并以这两个条目作为分裂后新的两个叶节点的起始条目。其他剩下的条目根据距离最小原则分配到这两个新的叶节点中，删除原叶节点并更新整个
    CF 树。


    当数据点无法插入时，这个时候需要提升阈值 T 并重建树来吸收更多的叶节点条目，直到把所有数据点全部插入完毕。'
  merge: -1
  img_proc: true
- pgno: 1231
  md: '# BIRCH 算法


    流程


    +   - 阶段1: 扫描数据库，建立一个初始存在内存的CF树，它可以被看作数据的多层压缩，试图保留数据内在的聚类结构

    +   - 阶段2: 使用一个任意的聚类算法对CF树的叶结点进行聚类，把稀疏的簇当做离群点删除，时把稠密的簇合并为更大的簇'
  merge: -1
  img_proc: true
- pgno: 1232
  md: '# BIRCH 算法


    +   - 在阶段一，随着对象被插入，树被动态地构造。这样，该方法支持增量聚类。一个对象被插入到最近的叶条目（子簇）。如果在插入后，存储在叶结点中的子簇的直径大于阈值，则该叶结点和可能的其他结点被分裂。新对象插入后，关于该对象的信息向树根结点传递。

    +   - 通过修改阈值，CF树大小可以改变。如果存储树需要的内存大于主存大小，可以定义较大的阈值，并重建树。

    +   - 重建过程是从旧树叶结点构建一棵新树。这样，重建树的过程不需要重读所有的对象或点。因此，为了建树，只需读一次数据。采用一些启发式方法，通过额外的数据扫描来处理离群点和改进树的质量。CF树建好后，可以在阶段二使用任意聚类算法，例如典型的划分方法。'
  merge: -1
  img_proc: true
- pgno: 1233
  md: '# BIRCH 算法


    +   - 线形伸缩性：

    +     - 单遍扫描找出一个好的聚类，一或多遍的额外扫描产生可以进一步的改进聚类的质量

    +     - 算法的时间复杂度是O(n)，n是被聚类的对象数

    +   - 缺点：

    +     - 树的每个结点由于大小限制只能包含有限的条目，一个树结点并不总是对应于用户认为的一个自然簇。

    +     - 如果簇不是球形的，则BIRCH不能很好地工作，因为它使用半径或直径的概念来控制簇的边界。

    +     - 只能处理数值数据，对数据记录的顺序很敏感'
  merge: -1
  img_proc: true
- pgno: 1234
  md: '# CHAMELEON（变色龙）


    # CHAMELEON


    由G. Karypis, E.H. Han和V.Kumar’99 提出的使用动态建模的层次聚类


    # 在动态模型的基础上度量相似性


    两个簇被合并当且仅当簇间的互联性和近似度与簇内部对象间的互联性和近似度高度相关。


    +   —簇中对象的连接情况

    +   —簇的邻近性


    # 基于图的一个两步算法


    +   1. 使用一个图划分算法: 把对象聚类到相对较小的子聚类

    +   2. 使用一个凝聚的聚类层次算法: 通过反复合并这些子聚类来找到真正的聚类簇'
