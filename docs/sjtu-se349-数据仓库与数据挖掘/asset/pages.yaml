  md: '# 虚拟化云平台关键技术


    虚拟化


    虚拟化实现资源“空分、时分”共享，提升利用率


    分布式计算和存储


    分布式的计算、存储提升系统整网可靠性，降低对单点硬件的可靠性依赖，降低采购成本


    集群化运维管理系统


    基于网络运维管理平台，提高整网的运维效率


    跨域资源管控


    基于的网络的业务部署支撑跨域业务，提升用户体验


    优化的硬件


    高能效比、针对云计算优化的硬件降低整体TCO


    以虚拟化为基础，采用分布式计算和存储，结合优化的硬件，通过集群化运维管理系统，实现计算、存储、网络等资源的动态分配及部署，真正实现“按需取用”。'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# 数据储存技术


    云计算的数据存储系统主要有 Google 公司的 GFS（Google 文件系统，Google File System）和 Hadoop 团队开发的开源系统——Hadoop
    分布式文件系统（HDFS，Hadoop Distributed File System）。


    2003 年 10 月, Google 在美国纽约召开的第 19 届 ACM 操作系统原理研讨会(SOSP, Symposium on Operating
    Systems Principles) 上, 发表了论文《Google 文件系统》, 系统介绍了 Google 面向大规模数据密集型应用的、可伸缩的分布式文件系统——GFS。由于


    2004 年 12 月, Google 在美国旧金山召开的第 6 届操作系统设计与实现研讨会（OSDI, Operating Systems Design
    and Implementation）上, 发表了论文《MapReduce: 超大集群的简单数据处理》, 向全世界介绍了 MapReduce 系统的编程模式、实现、技巧、性能和经验。


    2006 年 11 月, Google 在美国西雅图召开的第 7 届操作系统设计与实现研讨会(OSDI) 上, 发表了论文《BigTable: 结构化数据的分布式存储系统》,
    分析了设计用于处理海量数据的分布式结构化数据存储系统 BigTable 的工作原理。'
