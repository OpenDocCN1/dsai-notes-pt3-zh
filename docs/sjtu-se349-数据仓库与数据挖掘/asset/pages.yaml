- pgno: 509
  md: '# 原始数据标准化


    因为在实际应用中，往往存在指标的量纲不同，所以在计算之前须先消除量纲的影响，而将原始数据标准化。为了实现样本数据的标准化，应求样本数据的平均和方差。对数据矩阵Y作标准化处理，即对每一个指标分量作标准化变换，变换公式为：


    ```

    $X_{ij} = \frac{Y_{ij} - \overline{Y}_j}{S_j} \begin{pmatrix} i = 1,2,\cdots n
    \\ j = 1,2,\cdots p \end{pmatrix}$

    ```


    样本均值


    ```

    $\overline{Y}_i = \frac{1}{n} \sum_{k=1}^{n} Y_{ki}$

    ```


    样本标准差


    ```

    $S_i = \sqrt{\frac{1}{n-1} \sum_{k=1}^{n} (Y_{ki} - \overline{Y}_i)^2}$

    ```'
  merge: -1
  img_proc: true
- pgno: 510
  md: '+   - 原始变量 $Y_{ij}$ 经规格化后变为新变量 $X_{ij}$，其均值为零，方差为1。

    +   - 对二维空间来讲n个标准化后的样本在二维空间的分布大体为一椭圆形，该椭圆有一个长轴和一个短轴。在短轴方向上数据变化很少，极端的情况下，短轴如退化成一点，长轴的方向可以完全解释这些点的变化，由二维到一维的降维就自然完成了。'
  merge: -1
  img_proc: true
