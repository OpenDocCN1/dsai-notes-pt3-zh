  md: '# 小波变换 Wavelet transform（续）


    # —小波分解树与小波包分解树


    +   - 由低通滤波器和高通滤波器组成的树

    +     - 原始信号通过一对滤波器进行的分解叫做一级分解。信号的分解过程可以迭代，即可进行多级分解。


    +   - 小波分解树(wavelet decomposition tree)

    +     - 用下述方法分解形成的树：对信号的高频分量不再继续分解，而对低频分量连续进行分解，得到许多分辨率较低的低频分量，见图7-7


    +   - 小波包分解树(wavelet packet decomposition tree)

    +     - 用下述方法分解形成的树：不仅对信号的低频分量连续进行分解，而且对高频分量也进行连续分解，这样不仅可得到许多分辨率较低的低频分量，而且也可得到许多分辨率较低的高频分量，见图7-8'
  merge: -1
  img_proc: true
