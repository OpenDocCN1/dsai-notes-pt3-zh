- pgno: 856
  md: '现在，假设我们想把喷水器（S）作为草地变湿的另一个原因，如下图所示。


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_856_0.png)


    节点W有两个父节点R和S，因此它的概率是这两个值上的条件概率P(W|R,S)。


    我们可以计算喷水器开着草地会湿的概率。这是一个因果（预测）推理：'
  merge: -1
