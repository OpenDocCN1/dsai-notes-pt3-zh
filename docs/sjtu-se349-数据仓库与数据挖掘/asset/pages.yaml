- pgno: 838
  md: '# Bagging: Boostrap Aggregation

    提高分类准确率的技术 —— 1) 装袋


    Algorithm: Bagging. The bagging algorithm—create an ensemble of classification
    models for a learning scheme where each model gives an equally weighted prediction.


    Input:


    +   - D, a set of d training tuples;

    +   - k, the number of models in the ensemble;

    +   - a classification learning scheme (decision tree algorithm, naïve Bayesian,
    etc.).


    Output: The ensemble—a composite model, M*.


    Method:


    ```

    (1) for i = 1 to k do // create k models:

    (2)    create bootstrap sample, D_i, by sampling D with replacement;

    (3)    use D_i and the learning scheme to derive a model, M_i;

    (4) endfor

    ```


    To use the ensemble to classify a tuple, X:


    let each of the k models classify X and return the majority vote'
  merge: -1
  img_proc: true
- pgno: 839
  md: '# Boosting 提高分类准确率的技术 —— 2) 提升


    +   基本思想：

    +   — 赋予每个训练元组以权重，迭代地学习 k 个分类器 Mᵢ

    +   — 更新每个训练元组的权重，再次生成新的分类器

    +   — 最终根据权重衡量各个子分类器的投票结果，得到最终的类


    +   Adaboost: 一种流行的提升算法

    +   — 1) 给予所有训练元组相同的权重 1/d

    +   — 2) 根据权重，有放回的抽样，导出 k 个分类器 Mᵢ

    +   — 3) 如果元组不正确地分类，则增加它的权重

    +     • 希望能更关注上一轮“误分类”的元组

    +     • 模型的错误率（如果元组被误分类，则 err(Xj) 被置为 1

    +       error (Mᵢ) = Σⱼ wⱼ × err (Xⱼ)

    +   — 4) 各个子分类器的投票权重为

    +       log [1 − error(Mᵢ) / error(Mᵢ)]

    +   — 5) 具有最大权重和的类为“赢家”，并返回作为对元组 X 的类预测'
  merge: -1
  img_proc: true
