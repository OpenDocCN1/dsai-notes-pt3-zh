- pgno: 971
  md: '# # 特征空间与核函数


    ❶ 点积定义了输入空间的几何性质：


    $\|x\|=(x,x)$


    $\cos\theta=\dfrac{(x,y)}{\sqrt{(x,x)\cdot(y,y)}}$


    $\|x-y\|^2=(x,x)+(y,y)-2(x,y)$


    ❷ 核函数定义了特征空间的几何性质，是输入空间上的伪距离：


    $D(x,y)=K(x,x)+K(y,y)-2K(x,y)$'
  merge: -1
  img_proc: true
- pgno: 972
  md: '# 特征空间与核函数


    # 核函数的几个性质


    K(x, z) = a₁ K₁(x, z) + a₂ K₂(x, z)


    K(x, z) = K₁(x, z) K₂(x, z)    K(x, z) = pol⁺(K₁(x, z))


    K(x, z) = exp(K₁(x, z))    K(x, z) = g(x) g(z)


    K(x, z) = K₃(ψ(x), ψ(z))


    ψ is an ℝᵖ-valued function on X and K₃ is a kernel on ℝᵖ × ℝᵖ


    K(x, z) = xᵀ A z


    A is a positive definite matrix of size d × d'
