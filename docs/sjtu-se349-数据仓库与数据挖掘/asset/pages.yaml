- pgno: 1064
  md: '# 遗传算法关键技术


    具体的编码规则如下：


    +   ✓ 若属性为范畴型，定义属性段的宽度等于属性取值个数。对于每个属性段，若第一位为“*”，表示该属性取值可以为任意；否则，各位若取值为1，表示取该属性值，0表示不取该属性值。例如，某条件属性C对应的编码二进制串为011001，表示该属性取第二个属性值或第三个属性值或第六个属性值，即
    $C_i \in \{C_{i2}, C_{i3}, C_{i6}\}$


    +   ✓ 若属性为数值型，定义属性段的宽度 $w = [\log 2(n)] + 2$，其中 $n$ 为该属性的取值个数。对于每个属性段，若第一位为“*”，表示该属性取值可以为任意'
  merge: -1
  img_proc: true
