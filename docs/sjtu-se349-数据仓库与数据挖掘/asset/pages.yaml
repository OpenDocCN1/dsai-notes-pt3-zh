    +   - **噪声Noise**: 被检测的变量的随机误差或方差

    +   - **不正确的属性值** 可能是因为

    +     - 错误的数据收集工具

    +     - 数据输入的问题

    +     - 数据传输问题

    +     - 技术限制

    +     - 不一致的命名惯例

    +   - **这些数据问题** 也需要数据清洗

    +     - 重复记录

    +     - 数据不完整

    +     - 数据不一致'
