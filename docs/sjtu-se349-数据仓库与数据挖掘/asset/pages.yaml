- pgno: 1409
  md: '# What Are Outliers?


    +   - Outlier: A data object that deviates significantly from the normal objects
    as if it were generated by a different mechanism

    +     - Ex.: Unusual credit card purchase, sports: Michael Jordon, ...

    +   - Outliers离群点 are different from the noise data噪声数据

    +     - Noise is random error or variance不同 in a measured variable被测变量的随机误差或方差,
    如: 比往常多买一杯咖啡......

    +     - Noise should be removed before outlier detection一般不是令人感兴趣的

    +   - Outliers are interesting: It violates the mechanism that generates the normal
    data

    +   - Outlier detection离群点 vs. novelty detection新颖性检测: early stage, outlier; but
    later merged into the model

    +   - Applications:

    +     - Credit card fraud detection

    +     - Telecom fraud detection

    +     - Customer segmentation分割

    +     - Medical analysis


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1409_0.png)'
  merge: -1
  img_proc: true
- pgno: 1410
  md: '# Types of Outliers (I)


    +   Three kinds: *global*, *contextual* and *collective* outliers


    +   Global outlier全局离群点(or point anomaly点异常)


    Object is O<sub>g</sub> if it significantly deviates from the rest of the data
    set


    +   一台计算机的通信行为非常不同于正常模式〈例如，在短时间内大量的包被广播则该行为可以看做一个全局离群点，而对应的计算机可能是黑客入侵的受害者


    +   在交易审计系统中，不遵守常规的交易可能被视为全局离群点，并且应该搁置，以便进一步考察


    Issue: Find an appropriate measurement of deviation偏离度量


    +   Contextual outlier情境离群点(or conditional outlier条件离群点)


    Object is O<sub>c</sub> if it deviates significantly based on a selected context特定情境


    Ex. 80° F in Urbana: outlier? (depending on summer or winter?)


    Attributes of data objects should be divided into two groups


    +   Contextual attributes情境属性: defines the context, e.g., time & location


    +   Behavioral attributes行为属性: characteristics of the object, used in outlier
    evaluation, e.g., temperature


    Can be viewed as a generalization of local outliers局部离群点的推广—whose density significantly
    deviates from its local area


    Issue: How to define or formulate meaningful context?


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1410_0.png)'
  merge: -1
  img_proc: true
- pgno: 1411
  md: '# Types of Outliers (II)


    +   Collective Outliers集体离群点

    +   — A subset of data objects collectively deviate significantly from the whole
    data set, even if the individual data objects may not be outliers

    +   — Applications: E.g., intrusion detection:

    +     • When a number of computers keep sending denial-of-service packages to
    each other

    +   — Detection of collective outliers

    +     • Consider not only behavior of individual objects, but also that of groups
    of objects

    +     • Need to have the background knowledge on the relationship among data objects,
    such as a distance or similarity measure on objects.


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1411_0.png)


    +   A data set may have multiple types of outlier

    +   One object may belong to more than one type of outlier'
  merge: -1
  img_proc: true
- pgno: 1412
  md: '# Challenges of Outlier Detection


    +   - **Modeling normal objects and outliers properly**

    +     - Hard to enumerate all possible normal behaviors in an application

    +     - The border between normal and outlier objects is often a gray area

    +   - **Application-specific outlier detection**

    +     - Choice of distance measure among objects and the model of relationship
    among objects are often application-dependent

    +     - E.g., clinic data诊所数据: a small deviation could be an outlier; while in
    marketing analysis, larger fluctuations

    +     - 离群点检测高度依赖于应用类型，使得不可能开发通用的离群点检测方法。相反，必须开发针对具体应用的离群点检测方法

    +   - **Handling noise in outlier detection**

    +     - Noise may distort扭曲 the normal objects and blur模糊 the distinction between
    normal objects and outliers. It may help hide outliers and reduce the effectiveness
    of outlier detection离群点像“伪装的”噪声点，错误地将噪声点识别成离群点

    +   - **Understandability**

    +     - Understand why these are outliers: Justification of the detection

    +     - Specify the degree of an outlier: the unlikelihood似然 of the object being
    generated by a normal mechanism'
  merge: -1
  img_proc: true
