- pgno: 853
  md: "# 一个简单的例子\n\n![](img/6d25e92eb0bd56a22c311279c19b06b4_853_0.png)\n\n+   • 由左图给出，它对下雨(R)引起草地变湿(W)建模。天下雨的可能性为40%，并且下雨时草地变湿的可能性为90%；也许10%的时间雨下得不长，不足以让我们真正认为草地被淋湿了。\n\
    +   \n+   • 在这个例子中，随机变量是二元的：真或假。存在20%的可能性草地变湿而实际上并没有下雨，例如，使用喷水器时。"
