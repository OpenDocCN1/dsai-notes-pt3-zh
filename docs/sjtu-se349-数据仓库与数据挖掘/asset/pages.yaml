  md: '# 智慧城市的构成


    # 智慧产业


    +   - 人的智慧与人工智能相结合，进行研发、创造、生产、管理等活动，形成有形或无形产品以满足社会需要属于产业

    +   - 集成电路研发、软件开发、系统集成、动漫、创意设计等都属于智慧产业范畴。


    # 智慧技术（物联网等）


    +   - 海量信息数据的搜集和存储、数学模型优化分析和高性能计算技术；

    +   - 实现所有系统的感知、互联互通乃至智能化。

    +   - 智化与慧化技术均十分重要


    # 智慧服务


    +   - 为企业、市民提供信息服务；

    +   - 为市民提供其随时、随地、随需可获得的“衣食住行乐财教医”等信息服务；

    +   - 为企业提供方便、快捷的审批、投融资、信用信息等服务。


    # 智慧人文


    +   - 充分的智慧城市专业人才的支撑；

    +   - 全社会对智慧城市广泛的认知；

    +   - 健全的智慧城市建设的体制机制；

    +   - 丰硕的智慧城市建设成果和文化成果。


    # 智慧民生


    +   - 市民在工作、生活中可获得一站式、互动式、高效率的信息服务；

    +   - 家居生活可实现远程化智能化管理。


    # 智慧管理


    +   - 培养一种欢迎和包容“群体智慧”以及广泛社会生态系统的组织文化和流程；

    +   - 更加多元化的、更加社会性的、更迅速的和更多预测性的协作方式。


    # 智慧城市'
