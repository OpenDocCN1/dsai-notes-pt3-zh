- pgno: 202
  md: '# （1）铁路票价的制定


    +   法国铁路部门在不断提高服务质量的同时，制定高铁票价时，尊重价值规律，在不突破国家定价的基础上，依据旅客市场细分结果来制定高铁票价。


    +   首先按照乘车频次初步分了三类旅客：不经常坐火车的、比较经常坐火车的、经常坐火车的。然后根据年龄、乘客身份、乘车档次等信息进行群体聚类再划分。最后针对这些群体，制定并实行差异化的服务策略。当然减价原则并非一成不变的，还要根据具体的情况确定具体的减价幅度，如旅游旺季的变化、运行高峰、低谷的变化，铁路运行线路是否有竞争对手等情况确定价格优惠的幅度。


    +   根据聚类的结果，进行顾客差异化定价，即对同一产品，根据不同的销售对象、不同的消费地点和不同的销售时间、不同产品等方面的需求差异而制定不同的价格。


    +   经常坐火车的A类：优惠的幅度最大，积累一定的里程数，可免费乘坐，而且可以享受其他的优惠待遇。


    +   比较经常坐火车的B类：可以花一定费用来买优惠卡，最大减价幅度可达50%，使他们由比较爱坐火车过渡到经常坐火车。


    +   偶尔乘坐火车的C类：主要是60岁以上老人、25岁以下的年轻人，对他们减价使他们对坐火车逐步感兴趣


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_202_0.png)'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# （1）铁路票价的制定


    票价制定的另外一种方法就是通过回归分析等技术手段对高铁票价进行动态预测。高铁票价预测需要考虑哪些变量呢？


    +   — 高铁运行成本，包括运行距离、运行时间、沿线路网耗费、旅客流量等


    +   — 竞争对手的价格，如航空、公路的优惠情况


    +   — 市场的周期性，比如淡、旺季、节假日等信息。


    不同预测计算中，上述几种因素考察的重点应有所不同。以运行成本为例，可分为平均成本定价法、盈亏平衡定价法、目标收益定价法、变动成本定价法、边际成本定价法等。


    市场中高铁票价是一个动态发展过程，预测出其未来一段时间的变动趋势，实行浮动式的高铁票价制定，才能有助于灵活应对市场不断变化的需求


    +   — 根据不同时段提供的不同折扣


    +   — 往返票、多次票或者月票、年票有不同的折扣，以最大程度地刺激顾客的车票购买欲望


    +   — 可以实行会员制，经常乘坐高铁的旅客可以享受优惠价、积分换里程，或者免费车厢升级服务'
