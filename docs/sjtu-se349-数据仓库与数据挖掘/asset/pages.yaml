  md: "# 由训练元组归纳决策树的基本算法说明（3）\n\n+   节点N用分裂准则标记作为节点上的测试（步骤7）。对分裂准则的每个输出，由节点N生长一个分支。D中的元组据此进行划分（步骤10～11）。有三种可能的情况，如图8.4所示。设A是分裂属性。根据训练数据，A具有v个不同值{a₁,a₂,...,\
    \ aᵥ}。\n\n+   A是离散值的\n+   — 节点N的输出直接对应于A的已知值；对每个已知值aⱼ创建一个分支；分区Dⱼ是D中A上取值为aⱼ的类标记元组的子集\n\
    \n+   A是连续值的\n+   — 节点N有两个可能的输出\n+   — split_point为分裂点，对应两个条件A<=split_point A>split_point\n\
    \n+   A是离散值且必须产生二叉树（由属性选择度量或所使用的算法指出）\n+   — 测试形如 A属于SA？其中SA是A的分裂子集，也就是A已知值的子集\n\
    \n```\n(6) 使用Attribute_selection_method(ID, attribute_list) 找出“最好的”splitting_criterion;\n\
    (7) 用splitting_criterion标记节点;\n(8) if splitting_attribute的值是离散值,并且允许多路分支 then\
    \ // 不限于二叉树\n(9) attribute_list=attribute_list - {splitting_attribute} // 删除分裂属性\n\
    (10) for splitting_criterion的每个输出j\n// 产生分裂对应子分区D的子集\n(11) 设Dⱼ是满足是输出j的训练元组的集合;\
    \ // 一个分区\n(12) if Dⱼ为空 then\n(13) 加一个叶节点标记R,标记为Dⱼ中的多数类;\n(14) else加一个由Generate_decision_tree(Dⱼ,attribute_list)返回的节点到以;\n\
    \ endfor\n(15) 返回节点;\n```"
  merge: -1
