- pgno: 264
  md: '# Ordered Data 有序数据


    # 时间序列数据（time series data）


    —是一种特殊的时序数据，其中每个记录都是一个时间序列（time series），即一段时间以来的测量序列。


    +   - 金融数据集可能包含各种股票每日价格的时间序列对象。

    +   - 明尼阿波利斯从1982年到1994年的月平均气温的时间序列。


    —在分析时间数据时，重要的是要考虑时间自相关（temporal autocorrelation），即如果两个测量的时间很接近，则这些测量的值通常非常相似。


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_264_0.png)'
