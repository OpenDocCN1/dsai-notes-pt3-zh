- pgno: 745
  md: "# C4.5分类算法\n对决策树的剪枝处理\n\n# 先剪枝（prepruning）\n\n+   ✓ 通过提前停止树的构建（例如，通过决定在给定的结点不再分裂或划分训练元组的子集）而对树“剪枝”。一旦停止，结点就成为树叶。该树叶可以持有子集元组中最频繁的类，或这些元组的概率分布。\n\
    +   \n+   ✓ 在构造树时，可以使用诸如统计显著性、信息增益、基尼指数等度量来评估划分的优劣。如果划分一个结点的元组导致低于预定义阈值的划分，则给定子集的进一步划分将停止。然而，选取一个适当的阈值是困难的。高阈值可能导致过分简化的树，而低阈值可能使得树的简化太少。\n\
    \n# 后剪枝\n\n由“完全生长”的树剪去子树。通过删除结点的分枝并用树叶替换它而剪掉给定结点上的子树。该树叶的类标号用子树中最频繁的类标记。\n\n#\
    \ C4.5采用后剪枝\n\n+   ✓ CART使用的代价复杂度剪枝算法是后剪枝方法的一个实例。该方法把树的复杂度看做树中树叶结点的个数和树的错误率的函数（其中，错误率是那棵分类树的无分叶片的百分比）。它从树的底部开始，对于每个内部结点N，计算N的子树的代价复杂度和该子树剪枝后N的子树（即用一个树叶结点替换）的代价复杂度。比较这两个值。如果剪去结点N的子树导致较小的代价复杂度，则剪掉该子树，否则，保留该子树。\n\
    +   \n+   ✓ 使用一个标记类元组的剪枝集来评估代价复杂度。该集合独立于用于建立未剪枝树的训练集和用于准确率评估的检验集。算法产生一个渐进的剪枝树的集合。一般而言，最小化代价复杂度的最小决策树是首选。\n\
    +   \n+   ✓ C4.5使用一种称为悲观剪枝的方法，它类似于代价复杂度方法，因为它也使用错误率评估，对子树剪枝做出决定。然而，悲观剪枝不需要使用剪枝集，而是使用训练集估计错误率。注意，基于训练集评估准确率或错误率过于乐观，因缺乏较大的偏倚。因此，悲观剪枝方法通过加上一个惩罚来调节从训练集得到的错误率，以抵消所出现的偏倚。"
  merge: -1
  img_proc: true
- pgno: 746
  md: '# C4.5分类算法基本描述


    +   <1> 对数据集进行预处理，对连续型属性按照基于信息熵的方法找到数据的最佳分裂点。

    +   <2> 计算每个属性的信息增益率，选取信息增益率最大的属性作为决策节点的划分属性。

    +   <3> 对决策节点属性的每个可能取值所对应的样本子集递归地执行步骤<2>，直到划分的每个子集中的观测数据都属于同一个类标号，最终生成决策树。

    +   <4> 对完全生长的决策树进行剪枝，得到优化后的决策树。

    +   <5> 从剪枝后的决策树中提取分类规则，对新的数据集进行分类。'
  merge: -1
  img_proc: true
- pgno: 747
  md: '# C4.5分类算法

    决策树生长阶段算法伪代码


    函数名：CDT(S,F)

    输入：训练集数据集 S，训练集数据属性集合 F

    输出：一棵未剪枝的 C4.5 决策树


    ```

    (1) if 样本 S 全部属于同一个类别 C then

    (2)   创建一个叶节点，并标记类标号为 C;

    (3)   return;

    (4) else

    (5)   计算属性集 F 中每个属性的信息增益率，假定增益率值最大的属性为 A;

    (6)   创建节点，取属性 A 为该节点的决策属性;

    (7)   for 节点属性 A 的每个可能的取值 V do

    (8)     为该节点添加一个新的分支，假设 S_V 为属性 A 取值为 V 的样本子集;

    (9)     if 样本 S_V 全部属于同一个类别 C then

    (10)      为该分支添加一个叶节点，并标记为类标号为 C;

    (11)    else

    (12)      递归调用 CDT(S_V, F-{A})，为该分支创建子树;

    (13)    end if

    (14)  end for

    (15) end if

    ```'
  merge: -1
  img_proc: true
- pgno: 748
  md: '# C4.5分类算法

    决策树剪枝阶段算法伪代码


    ```

    函数名: Prune(node)

    输入: 待剪枝子树 node

    输出: 剪枝后的子树

    (1) 计算待剪枝 node 中叶节点的加权估计误差 leafError;

    (2) if 待剪枝子树 node 是一个叶节点 then

    (3)    return 叶节点误差;

    (4) else

    (5)    计算 node 的子树误差 subtreeError;

    (6)    计算 node 的分支误差 branchError 为该节点中频率最大一个分支误差

    (7)    if leafError 小于 branchError 和 subtreeError then

    (8)        剪枝, 设置该节点为叶节点;

    (9)        error=leafError;

    (10)   else if branchError 小于 leafError 和 subtreeError then

    (11)       剪枝, 以该节点中频率最大那个分支替换该节点;

    (12)       error=branchError;

    (13)   else

    (14)       不剪枝

    (15)       error=subtreeError;

    (16)       return error;

    (17)   end if

    (18) end if

    ```'
  merge: -1
  img_proc: true
