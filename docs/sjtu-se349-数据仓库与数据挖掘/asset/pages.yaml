  md: "# 4、最佳阈值的确定\n\n+   （1）按实际需要，调整 λ 的值，或者是专家给值。\n+   \n+   （2）用 **F-统计量** 确定最佳\
    \ λ 值。\n\n针对原始矩阵 X，得到\n\n\\[\\bar{x}=(\\bar{x}_1,\\bar{x}_2,\\cdots,\\bar{x}_m)\\\
    ]\n\n其中，\\[x_k=\\frac{1}{n}\\sum_{i=1}^{n}x_{ik}\\quad(k=1,2,\\cdots,m)\\]\n\n\
    设对应于 λ 的分类数为 r，第 j 类的样本数为 n_j，\n\n第 j 类的样本记为：\\[x_1^{(j)},x_2^{(j)},\\cdots,x_{n_j}^{(j)}\\\
    ]"
  merge: -1
  img_proc: true
- pgno: 1164
  md: '# 模糊聚类分析


    则第j类的聚类中心为向量： $\bar{x}^{(j)} = (\bar{x}_1^{(j)}, \bar{x}_2^{(j)}, \cdots, \bar{x}_{n_j}^{(j)})$


    其中，$\bar{x}_k^{(j)}$为第k个特征的平均值


    $\bar{x}_k^{(j)} = \frac{1}{n_j} \sum_{i=1}^{n_j} x_{ik}^{(j)} \quad (k = 1,2,\cdots,m)$


    作$F$ - 统计量


    $F = \frac{\displaystyle \sum_{j=1}^{r} n_j \| \bar{x}^{(j)} - \bar{x} \|^2 /
    (r - 1)}{\displaystyle \sum_{j=1}^{r} \sum_{i=1}^{n_j} \| \bar{x}_i^{(j)} - \bar{x}^{(j)}
    \|^2 / (n - r)}$'
  merge: -1
  img_proc: true
- pgno: 1165
  md: '# 模糊聚类分析


    其中 $\|\bar{x}^{(j)} - \bar{x}\| = \sqrt{\sum_{k=1}^{m} (\bar{x}_k^{(j)} - \bar{x}_k)^2}$


    若是 $F > F_{\alpha}(r-1, n-r)$  $(\alpha = 0.05)$，


    则由数理统计理论知道类与类之间的差异显著


    若满足不等式的 $F$ 值不止一个，则可进一步考察


    差值 $(F - F_{\alpha})$ 的大小，从较大者中选择一个即可。'
  merge: -1
