  md: '# 模糊聚类分析


    # 一、基本概念及定理


    定义：设 $R = (r_{ij})_{n\times n}$ 是 $n$ 阶模糊方阵，$I$ 是 $n$ 阶单位方阵，若 $R$ 满足


    +   （1）自反性：$I \le R (\Leftrightarrow r_{ii}=1)$；

    +   （2）对称性：$R^T = R (\Leftrightarrow r_{ij}=r_{ji})$；

    +   （3）传递性：$R^2 \le R (\Leftrightarrow \max\{(r_{ik} \land r_{kj})\mid 1 \le k
    \le n\} \le r_{ij})$；


    则称 $R$ 为模糊等价矩阵。'
  merge: -1
  img_proc: true
- pgno: 1136
  md: '# 模糊聚类分析


    定理：$R$是$n$阶模糊等价矩阵 $\Leftrightarrow \forall \lambda\in[0,1]$，$R_\lambda$ 是等价的Boolean矩阵。


    意义：将模糊等价矩阵转化为等价的Boolean矩阵，可以得到有限论域上的普通等价关系，而等价关系是可以分类的。因此，当$\lambda$在$[0,1]$上变动时，由$R_\lambda$得到不同的分类。'
  merge: -1
  img_proc: true
- pgno: 1137
  md: "# 模糊聚类分析\n\n定理：设 $R$ 是 $n$ 阶模糊等价矩阵，则 $\forall 0 \\le \\lambda < \\mu \\le 1$,\
    \ $R_{\\mu}$ 所决定的分类中的每一个类是 $R_{\\lambda}$ 所决定的分类中的某个子类。\n\n该定理表明，当 $\\lambda <\
    \ \\mu$ 时，$R_{\\mu}$ 的分类是 $R_{\\lambda}$ 分类的加细，当 $\\lambda$ 由 1 变到 0 时，$R_{\\\
    lambda}$ 的分类由细变粗，形成一个动态的聚类图。"
