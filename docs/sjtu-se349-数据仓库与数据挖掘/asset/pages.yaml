- pgno: 907
  md: '# BP神经网络学习算法的MATLAB实现


    例 下表为某药品的销售情况，现构建一个如下的三层BP神经网络对药品的销售进行预测


    +   - 输入层有3个结点，隐含层5个结点，隐含层的激活函数为 `tansig`；

    +   - 输出层结点数为1个，输出层的激活函数为 `logsig`；

    +   - 预测方法采用滚动预测方式，即用前三个月的销售量来预测第四个月的销售量，如用1、2、3月的销售量为输入预测第4个月的销售量，用2、3、4月的销售量为输入预测第5个月的销售量。如此反复直至满足预测精度要求为止。


    | 月份 | 1 | 2 | 3 | 4 | 5 | 6 |

    |---|---:|---:|---:|---:|---:|---:|

    | 销量 | 2056 | 2395 | 2600 | 2298 | 1634 | 1600 |

    | 月份 | 7 | 8 | 9 | 10 | 11 | 12 |

    |---|---:|---:|---:|---:|---:|---:|

    | 销量 | 1873 | 1478 | 1900 | 1500 | 2046 | 1556 |'
  merge: -1
