- pgno: 815
  md: '# 如何学习规则：规则生成


    +   可以采用一种贪心的深度优先策略

    +   — 选择最能提高规则质量属性的测试

    +   — 质量度量方法：准确率，熵，FOIL中信息增益的度量

    +   — 每一步继续贪心地增长规则，直到结果规则达到可接受的质量水平


    +   为了生成一条规则：

    +   while(true)

    +   find the best predicate p

    +   if foil-gain(p) > threshold then add p to current rule

    +   else break


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_815_0.png)'
