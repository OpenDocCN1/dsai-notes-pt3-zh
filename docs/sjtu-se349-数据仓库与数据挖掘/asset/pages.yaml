- pgno: 481
  md: '# 数据挖掘随堂小作业


    +   - [x0,x1,x2,x3]=[90,70,100,70]

    +   - 为达到压缩 我们可取 (x0+x1)/2   (x0-x1)/2 来代表 x0,x1

    +   - 这样 [90,70] 可表示为 [80,10]

    +     80即平均数 10是小范围波动数

    +   - [90,70]→[80,10]， [100,70]→[85,15]

    +   - 想象80 和85 都是局部的平均值,反映大的总体的状态,是变化相对缓慢的值,可以认为他们是低频部分的值

    +   - 而10、15是小范围波动的值,局部变换较快,可以认为他们是高频部分的值'
  merge: -1
  img_proc: true
- pgno: 482
  md: '# 不严格的小波变换解释


    +   一 把[90,70,100,70] 写成 [80,85,10,15]

    +   即把低频部分写在一起(记频率L) 高频部分写在一起(H)

    +   二 [80,85] 又可经同样的变换→ [82.5, -2.5] 这样 82.5表示更低频的信息(记频率LL) -2.5则表示了频率L上的波动

    +   最后[90,70,100,70] --> [82.5, -2.5, 10, 15] 这样信息就可被压缩了（数字范围小了）

    +   -这就是二级变换 同样的你可以进行更高级的变换'
  merge: -1
  img_proc: true
