- pgno: 384
  md: '# 冗余和相关分析


    # 标称数据的相关检验


    对于标称数据，两个属性 A 和 B 之间的相关联系可以通过 χ²（卡方）检验发现。假设 A 有 c 个不同值 a₁, a₂, …, a_c, B 有 r 个不同值
    b₁, b₂, …, b_r。用 A 和 B 描述的数据元组可以用一个相依表显示，其中 A 的 c 个值构成列，B 的 r 个值构成行。令 (A_i, B_j)
    表示属性 A 取值 a_i、属性 B 取值 b_j 的联合事件，即 (A = a_i, B = b_j)。每个可能的 (A_i, B_j) 联合事件都在表中有自己的单元。χ²
    值（又称 Pearson χ² 统计量）可以用下式计算：


    ```

    χ² = Σ_{i=1}^c Σ_{j=1}^r (o_{ij} - e_{ij})² / e_{ij}

    ```


    o_{ij} 是联合事件 (A_i, B_j) 的观测频度（即实际计数），而 e_{ij} 是 (A_i, B_j) 的期望频度


    ```

    e_{ij} = count(A = a_i) × count(B = b_j) / n

    ```


    χ² 统计检验假设 A 和 B 是独立的。检验基于显著水平，具有自由度 (r - 1) × (c - 1)。'
  merge: -1
  img_proc: true
