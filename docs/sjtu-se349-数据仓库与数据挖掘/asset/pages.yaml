  md: '# Data Warehouse: Time Variant

    数据仓库特征 之数据集成


    +   数据仓库的四个关键特征

    +   — 面向主题的（Subject-oriented）

    +   — 集成的（Integrated）

    +   — 时变的（Time-variant）

    +   — 非易失的（Nonvolatile）


    +   数据仓库是从历史的角度提供信息，时间范围比操作数据库系统要长的多

    +   — 数据仓库:从历史的角度提供信息（比如过去 5-10 年）

    +   — 操作数据库系统: 主要保存当前数据


    +   数据仓库的关键结构

    +   — 数据仓库中每一个关键结构都隐式或显式地包含时间元素

    +   — 操作数据库中的关键结构可能不包括时间元素'
  merge: -1
  img_proc: true
- pgno: 540
  md: '# Data Warehouse: Nonvolatile

    数据仓库特征 之 数据不易丢失


    +   数据仓库的四个关键特征

    +   - 面向主题的（Subject-oriented）

    +   - 集成的（Integrated）

    +   - 时变的（Time-variant）

    +   - 非易失的（Nonvolatile）


    +   尽管数据仓库中的数据来自于操作数据库，但数据仓库总是在物理上分离保存的

    +   - 操作数据库的更新操作不会出现在数据仓库环境下

    +   - 不需要事务处理、恢复和并发控制等机制

    +   - 只需要两种数据访问：

    +     - Initial loading of data 数据的初始转载

    +     - Access of data 数据访问'
