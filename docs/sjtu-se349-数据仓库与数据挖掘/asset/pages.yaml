  md: '# Random Forest

    提高分类准确率的技术 —— 3) 随机森林


    +   - 想象组合分类器中的每个分类器都是一颗决策树

    +     因此分类器的集合就是一个“森林”

    +   - 分类时，每棵树都投票并返回得票最多的类

    +   - 随机森林可以使用 装袋 与 随机属性选择 结合来构建

    +   - 与 Adaboost 相比：

    +     - 对错误和离群点鲁棒性更好'
  merge: -1
