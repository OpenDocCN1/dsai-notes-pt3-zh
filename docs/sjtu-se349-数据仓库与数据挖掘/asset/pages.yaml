- pgno: 610
  md: '# 什么是频繁模式分析？


    +   - 频繁模式 Frequent pattern: 是频繁地出现在数据集中的模式（如项集、子序列或子结构）

    +     - First proposed by Agrawal, Imielinski, and Swami [AIS93] in the context
    of frequent itemsets and association rule mining


    +   - 动机: 寻找数据中的内在规律

    +     - 经常在一起购买什么样的产品- 啤酒和尿布？！

    +     - 什么是购买一台 PC 以后购买的？

