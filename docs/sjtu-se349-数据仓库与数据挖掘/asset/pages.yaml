  md: '# 数据容量单位:从K到Y……


    K—M—G—T—P—E—Z—Y


    +   ◆ K Kilo 1K字节 = 1,024字节

    +   ◆ M Meg 1M字节 = 1,048,576字节

    +   ◆ G Giga 1G字节 = 1,073,741,824字节

    +   ◆ T Tera 1T字节 = 1,099,511,627,776字节

    +   ◆ P Peta 1P字节 = 1,125,899,906,842,624字节

    +   ◆ E Exa 1E字节 = 1,152,921,504,606,846,976字节

    +   ◆ Z Zetta 1Z字节 = 1,180,591,620,717,411,303,424字节

    +   ◆ Y Yotta 1Y字节 = 1208,925,819,614,629,174,706,176字节


