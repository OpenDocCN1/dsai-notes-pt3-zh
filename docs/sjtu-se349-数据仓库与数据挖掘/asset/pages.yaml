  md: '# “啤酒＋尿布”成为大数据时代数据挖掘的经典案例


    +   • 沃尔玛在对消费者购物行为进行分析时发现，男性顾客在购买婴儿尿片时，常常会顺便搭配几瓶啤酒来犒劳自己，于是推出将啤酒和尿布捆绑销售的促销手段


    +   • 最早关于大数据的故事发生在美国第二大超市塔吉特


    —为吸引孕妇这一含金量很高的群体，塔吉特期望尽早把她们确认出来（由于美国出生记录公开，因此孩子出生后，新生儿母亲就会被铺天盖地的产品优惠广告包围，那时塔吉特再行动就晚了）


    —可是怀孕是私密信息，如何准确判断哪位顾客怀孕很难。塔吉特有一个迎婴聚会登记表，对登记表里的顾客消费数据建模分析，发现许多孕妇在第2个妊娠期会买许多大包装的无香味护手霜、怀孕最初的20周会购买大量补充钙、镁、锌的营养片类保健品……最后选出25种典型商品的消费数据构建“怀孕预测指数”，可以在很小的误差范围内预测顾客的怀孕情况，从而提早散发优惠广告


    —塔吉特这种优惠广告间接地令一位父亲意外发现自己还是高中生的女儿怀孕了，此事经被《纽约时报》报道后，塔吉特“大数据”的巨大威力轰动全美，公司的营业额借助大数据稳步上升'
  merge: -1
  img_proc: true
