- pgno: 225
  md: '# 数据挖掘的技术工具

    1.通用型工具（3） DBMiner


    +   - **DBMiner** 是加拿大Simon Fraser大学开发的一个多任务数据挖掘系统，它的前身是**DBLearn**。

    +   - 该系统设计的目的是把关系数据库和数据挖掘集成在一起，以面向属性的多级概念为基础发现各种知识。

    +   - **DBMiner** 系统具有如下特色：

    +     - 能完成多种知识的发现：泛化规则、特性规则、关联规则、分类规则、演化知识、偏离知识等。

    +     - 综合了多种数据挖掘技术：面向属性的归纳、统计分析、逐级深化发现多级规则、无规则引导发现等方法。

    +     - 提出一种交互式的类SQL语言——数据挖掘查询语言DMQL。

    +     - 能与关系数据库平滑集成。

    +     - 实现基于客户/服务器体系结构的Unix和PC（Windows/NT）版本的系统。'
  merge: -1
