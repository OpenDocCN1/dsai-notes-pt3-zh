- pgno: 1062
  md: '# 遗传算法关键技术


    # 编码问题


    +   - 由于遗传算法不能直接处理解空间的解数据，因此必须通过编码将它们表示成遗传空间的基因型串结构数据。

    +   - 编码方法在很大程度上决定了如何进行群体的遗传进化运算以及遗传进化的效率。由于不同的编码方法具有不同的特点，为了提高遗传算法的效率，应根据不同的情况采用不同的编码方式。

    +   - 主要的编码方法有二进制编码、浮点数编码、符号编码、多参数编码、可变长染色体编码等。'
  merge: -1
  img_proc: true
