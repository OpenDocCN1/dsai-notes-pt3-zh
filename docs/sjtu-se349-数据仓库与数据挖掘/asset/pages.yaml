- pgno: 1273
  md: '# Grid-Based Clustering Method


    # 基于网格的聚类方法基本原理


    +   - 网格是一种组织数据集的有效方法，至少在低维空间中如此。


    +   - 基本思想

    +     - 将每个属性的可能值分割成许多相邻的区间，创建网格单元的集合（我们假定属性值是序数的、区间的或连续的）。

    +     - 每个对象落入一个网格单元，网格单元对应的属性区间包含该对象的价值。

    +     - 扫描一遍数据就可以把对象指派到网格单元中，并且还可以同时收集关于每个单元的信息，如单元中的点数。'
  merge: -1
  img_proc: true
