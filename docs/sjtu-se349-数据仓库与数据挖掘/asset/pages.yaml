- pgno: 857
  md: 'P(W|S) = P(W|R,S)P(R|S) + P(W|~R,S)P(~R|S)

    = P(W|R,S)P(R) + P(W|~R,S)P(~R)

    = 0.95 × 0.4 + 0.9 × 0.6 = 0.92


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_857_0.png)'
  merge: -1
  img_proc: true
- pgno: 858
  md: '● 给定草地是湿的，我们能够计算喷水器开着的概率。这是一个诊断推理。


    $$P(S\mid W)=\frac{P(W\mid S)P(S)}{P(W)}=\frac{0.92\times0.2}{0.52}=0.35$$


    其中


    $$\begin{aligned}

    P(W)&=P(W\mid R,S)P(R,S)+P(W\mid\neg R,S)P(\neg R,S)\\

    &\quad+P(W\mid R,\neg S)P(R,\neg S)+P(W\mid\neg R,\neg S)P(\neg R,\neg S)\\

    &=P(W\mid R,S)P(R)P(S)+P(W\mid\neg R,S)P(\neg R)P(S)\\

    &\quad+P(W\mid R,\neg S)P(R)P(\neg S)+P(W\mid\neg R,\neg S)P(\neg R)P(\neg S)\\

    &=0.95\times0.4\times0.2+0.9\times0.6\times0.2+0.9\times0.4\times0.8+0.1\times0.6\times0.8\\

    &=0.52

    \end{aligned}$$'
  merge: -1
  img_proc: true
