  md: '# 挖掘频繁项集的模式增长方法


    +   思想：频繁模式增长

    +   —递归地增长频繁模式

    +   方法

    +   —对于每个频繁项，构造条件模式基和条件FP树

    +   —在每个新建的FP树上重复该过程

    +   —直到最终的FP树为空，或它只有一条路径（该路径将生成所有子路径）'
