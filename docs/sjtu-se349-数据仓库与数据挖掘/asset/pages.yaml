  md: "# 由训练元组归纳决策树的基本算法说明（4）\n\n+   对于D中的每个结果分区Dj上的元组，算法使用同样的过程递归地形成决策树（步骤14）\n\n\
    +   递归划分步骤仅当下列终止条件之一成立时停止：\n\n+   1）分区D（在结点N提供）的所有元组都属同一个类（步骤2和步骤3）\n\n+   2）没有剩余属性可以用来进一步划分元组（步骤4）。在此情况下，使用多数表决（步骤5）。这涉及将N转换成树叶，并用D中的多数类标记它。另外，也可以存放结点元组的类分布。\n\
    \n+   3）给定的分枝没有元组，即分区Dj为空（步骤12）。在这种情况下，用D中的多数类创建一个树叶（步骤13）。\n\n+   返回结果决策树（步骤15）\n\
    \n```\n(1) 创建一个结点N;\n(2) 如果D中的元组都在同一类中then\n(3) 返回N作为叶结点并以该类标记;\n(4) if attribute_list为空then\n\
    (5) 返回N作为叶结点,标记为D中的多数类; //多数表决\n(6) 使用Attribute_selection_method(D, attribute_list)找出“最好的”splitting_criterion;\n\
    (7) 用splitting_criterion标记结点N;\n(8) if splitting_attribute是离散值,并且允许多路分别then //不限于二叉树\n\
    (9) attribute_list=attribute_list-splitting_attribute; //删除分裂属性\n(10) for splitting_criterion的每个值v\n\
    //划分元组并对每个子产生子树\n(11) 设Dj是D中满足v的值的元组的集合; //一个分区\n(12) if Dj为空then\n(13) 加一个叶到N标记为D中的多数类;\n\
    (14) else加一个由Generate_decision_tree(Dj,attribute_list)通过的结点到N;\n endfor\n(15)\
    \ 返回N;\n```"
  merge: -1
