- pgno: 644
  md: '# DHP基于散列的技术（散列项集到对应的桶中）

    减少候选集数量


    +   一个对应的哈希桶中支持度低于阈值的项集不可能频繁


    +   Candidates: a, b, c, d, e


    +   Hash entries

    +     • {ab, ad, ae}

    +     • {bd, be, de}

    +     • ...


    +   Frequent 1-itemset: a, b, d, e


    +   ab is not a candidate 2-itemset if the sum of count of {ab, ad, ae} is below
    support threshold


