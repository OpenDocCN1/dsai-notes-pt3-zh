- pgno: 59
  md: '# 云计算业界几个主流定义


    云计算还没有统一的定义，业界对云计算定义达20多种，云计算领先者如Google、Microsoft 等IT厂商，依据各自利益和各自不同研究视角都给出了云计算的定义和理解


    +   - Google 的理念： 将所有的计算和应用放置在 “云” 中，设备终端不需要安装任何东西，通过互联网来分享程序和服务。

    +   - 微软的理念： 云计算应是 “云+端” 的计算，将计算资源分散分布，部分资源放在云上，部分资源放在用户终端，部分资源放在合作伙伴处，最终由用户选择合理的计算资源分布。

    +   - 市场研究机构IDC： 云计算是一种新型的IT 技术发展、部署及发布模式，能够通过互联网实时的提供产品、服务和解决方案。'
  merge: -1
