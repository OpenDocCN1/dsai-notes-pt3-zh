- pgno: 702
  md: '# 决策树归纳的概念


    +   - 决策树归纳是从有类标号的训练元组中学习决策树

    +   - 决策树是一种类似于流程图的树结构

    +     - 每个内部节点（非树叶节点）表示在一个属性上的测试

    +     - 每个分支代表该测试的一个输出

    +     - 每个树叶节点（或终端节点）存放一个类标号

    +     - 树的最高层节点是根节点

    +   - 内部节点用矩形表示，而叶节点用椭圆表示。

    +   - 有些决策树算法只产生二叉树（其中，每个内部节点正好分支出两个其他节点），另一些决策树算法可能产生非二叉的树。


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_702_0.png)'
  merge: -1
  img_proc: true
- pgno: 703
  md: '# Algorithm for Decision Tree 决策树的算法


    +   - 决策树归纳算法（一个贪心算法）

    +     - 自顶向下的分治方式构造决策树

    +     - 树从代表训练样本的单个根节点开始

    +     - 递归地通过选择相应的分裂属性，来划分样本，一旦一个属性出现在一个节点上，就不在该节点的任何后代上出现


    贪心算法（又称贪婪算法，greedy algorithm）是指，在对问题求解时，总是做出在当前看来是最好的选择。也就是说，不从整体最优上加以考虑，他所做出的是在某种意义上的局部最优解。


    贪心算法不是对所有问题都能得到整体最优解。关键是贪心策略的选择。选择的贪心策略必须具备无后效性，即某个状态以前的过程不会影响以后的状态，只与当前状态有关。'
  merge: -1
  img_proc: true
- pgno: 704
  md: '# 贪心算法的基本思路


    +   1. 建立数学模型来描述问题

    +   2. 把求解的问题分成若干个子问题

    +   3. 对每一子问题求解，得到子问题的局部最优解

    +   4. 把子问题的解局部最优解合成原来解问题的一个解


    # 实现该算法的过程：


    +   从问题的某一初始解出发；

    +   **while** 能朝给定总目标前进一步

    +   **do**

    +   求出可行解的一个解元素；

    +   由所有解元素组合成问题的一个可行解。'
  merge: -1
  img_proc: true
