- pgno: 74
  md: '# 基础设施云（Infrastructure Cloud）


    +   - 基础设施云为用户提供的是底层的、接近于直接操作硬件资源的服务接口。

    +   - 通过调用这些接口，用户可以直接获得计算和存储能力，而且非常自由灵活，几乎不受逻辑上的限制。

    +   - 但是，用户需要进行大量的工作来设计和实现自己的应用，因为基础设施云除了为用户提供计算和存储等基础功能外，不进一步做任何应用类型的假设。'
