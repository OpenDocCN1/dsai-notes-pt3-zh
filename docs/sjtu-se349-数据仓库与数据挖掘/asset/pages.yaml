  md: "# 数据挖掘的技术工具\n1.通用型工具（7）数据库厂商集成的挖掘工具\n\n+   • SQL Server 2000包含Microsoft研究院开发的两种数据挖掘算法：Microsoft决策树和Microsoft聚集\n\
    +   \n+     — **Microsoft决策树算法**：该算法基于分类。算法建立一个决策树，用于按照事实数据表中的一些列来预测其他列的值。该算法可以用于判断最倾向于单击特定标题（banner）或从某电子商务网站购买特定商品的个人。\n\
    +   \n+     — **Microsoft聚集算法**：该算法将记录组合到可以表示类似的、可预测的特征的聚集中。通常这些特征可能是隐含或非直观的。例如，聚集算法可以用于将潜在汽车买主分组，并创建对应于每个汽车购买群体的营销活动。\n\
    +   \n+     — 支持由第三方开发的算法。\n\n+   • SQL Server 2005在数据挖掘方面提供了更为丰富的模型、工具以及扩展空间。包括：可视化的数据挖掘工具与导航、8种数据挖掘算法集成、DMX、XML/A、第三方算法嵌入支持等。"
  merge: -1
  img_proc: true
