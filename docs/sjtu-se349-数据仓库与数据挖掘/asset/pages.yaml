- pgno: 1392
  md: '# More on Conceptual Clustering


    +   - **Limitations of COBWEB**

    +     - The assumption that the attributes are independent of each other is often
    too strong because correlation may exist

    +     - Not suitable for clustering large database data – skewed tree and expensive
    probability distributions

    +   - **CLASSIT**

    +     - an extension of COBWEB for incremental clustering of continuous data

    +     - suffers similar problems as COBWEB

    +   - **AutoClass (Cheeseman and Stutz, 1996)**

    +     - Uses Bayesian statistical analysis to estimate the number of clusters

    +     - Popular in industry'
  merge: -1
  img_proc: true
- pgno: 1393
  md: '# Neural Network Approaches


    +   - Neural network approaches

    +     - Represent each cluster as an exemplar, acting as a “prototype” of the
    cluster

    +     - New objects are distributed to the cluster whose exemplar is the most
    similar according to some distance measure

    +   - Typical methods

    +     - SOM (Soft-Organizing feature Map)

    +     - Competitive learning

    +       - Involves a hierarchical architecture of several units (neurons)

    +       - Neurons compete in a “winner-takes-all” fashion for the object currently
    being presented'
  merge: -1
  img_proc: true
- pgno: 1394
  md: '# Self-Organizing Feature Map (SOM)


    +   - SOMs, also called topological ordered maps, or Kohonen Self-Organizing Feature
    Map (KSOMs)

    +   - It maps all the points in a high-dimensional source space into a 2 to 3-d
    target space, s.t., the distance and proximity relationship (i.e., topology) are
    preserved as much as possible

    +   - Similar to k-means: cluster centers tend to lie in a low-dimensional manifold
    in the feature space

    +   - Clustering is performed by having several units competing for the current
    object

    +     - The unit whose weight vector is closest to the current object wins

    +     - The winner and its neighbors learn by having their weights adjusted

    +   - SOMs are believed to resemble processing that can occur in the brain

    +   - Useful for visualizing high-dimensional data in 2- or 3-D space'
  merge: -1
  img_proc: true
