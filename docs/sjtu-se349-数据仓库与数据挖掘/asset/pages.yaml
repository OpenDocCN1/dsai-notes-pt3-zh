- pgno: 1503
  md: '# Ubiquitous and Invisible Data Mining


    +   - **Ubiquitous Data Mining**

    +     - Data mining is used everywhere, e.g., online shopping

    +     - Ex. Customer relationship management (CRM)

    +   - **Invisible Data Mining**

    +     - Invisible: Data mining functions are built in daily life operations

    +     - Ex. Google search: Users may be unaware that they are examining results
    returned by data

    +     - Invisible data mining is highly desirable

    +     - Invisible mining needs to consider efficiency and scalability, user interaction,
    incorporation of background knowledge and visualization techniques, finding interesting
    patterns, real-time, ...

    +     - Further work: Integration of data mining into existing business and scientific
    technologies to provide domain-specific data mining tools'
  merge: -1
  img_proc: true
- pgno: 1504
  md: '# Privacy, Security and Social Impacts of Data Mining


    +   - **Many data mining applications do not touch personal data**

    +     - E.g., meteorology, astronomy, geography, geology, biology, and other scientific
    and engineering data

    +   - **Many DM studies are on developing scalable algorithms to find general
    or statistically significant patterns, not touching individuals**

    +   - **The real privacy concern: unconstrained access of individual records,
    especially privacy-sensitive information**

    +   - **Method 1: Removing sensitive IDs associated with the data**

    +   - **Method 2: Data security-enhancing methods**

    +     - Multi-level security model: permit to access to only authorized level

    +     - Encryption: e.g., *blind signatures*, *biometric encryption*, and *anonymous
    databases* (personal information is encrypted and stored at different locations)

    +   - **Method 3: Privacy-preserving data mining methods**'
  merge: -1
  img_proc: true
- pgno: 1505
  md: '# Privacy-Preserving Data Mining


    +   - Privacy-preserving (privacy-enhanced or privacy-sensitive) mining:

    +     - Obtaining valid mining results without disclosing the underlying sensitive
    data values

    +     - Often needs trade-off between information loss and privacy

    +   - Privacy-preserving data mining methods:

    +     - Randomization (e.g., perturbation): Add noise to the data in order to
    mask some attribute values of records

    +     - K-anonymity and l-diversity: Alter individual records so that they cannot
    be uniquely identified

    +       - k-anonymity: Any given record maps onto at least k other records

    +       - l-diversity: enforcing intra-group diversity of sensitive values

    +     - Distributed privacy preservation: Data partitioned and distributed either
    horizontally, vertically, or a combination of both

    +     - Downgrading the effectiveness of data mining: The output of data mining
    may violate privacy

    +       - Modify data or mining results, e.g., hiding some association rules or
    slightly distorting some classification models'
  merge: -1
  img_proc: true
