- pgno: 152
  md: '# （1）数据库数据


    # 数据库系统，也称数据库管理系统（DBMS）


    —由一组内部相关的数据（称做数据库）和一组管理和存取数据的软件程序组成。


    —软件程序提供如下机制：定义数据库结构和数据存储，说明和管理并发、共享或分布式数据访问，面对系统瘫痪或未授权的访问，确保存储信息的一致性和安全性。


    # 关系数据库


    —是表的汇集。每个表都被赋予一个唯一的名字，包含一组属性（列或字段），通常存放大量元组（记录或行），每个元组代表一个对象，被唯一的关键字标识，并被一组属性值描述。


    —通常为关系数据库构建语义数据模型，如实体联系（ER）数据模型。数据模型将数据库表示成一组实体和它们之间的联系。


    —关系数据库是数据挖掘的最常见、最丰富的信息源，因此它是数据挖掘研究的一种主要数据形式。'
