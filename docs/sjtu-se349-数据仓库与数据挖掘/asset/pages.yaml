- pgno: 28
  md: '# 集中箱数据中心


    # 绿色数据中心国外实践


    优化网络品质 提升用户体验


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_28_0.png)


    微软亚洲数据中心采用最新的模块化概念产品—集装箱数据中心来搭建，可以降低能耗和成本，每台服务器都可以用来为微软的云计算操作系统Windows Azure收发电子邮件、管理即时通信或运行应用程序。


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_28_1.png)


    Google向美国专利与商标局（USPTO）提交了一份创建“海上数据中心”（water-based data center）的专利申请。Google在申请中提出，政府机构或大型企业可以在船只上建立数据中心，相应地，数据中心将依赖海水和潮汐发电，同时利用海水的流动，对数据中心的核心机器进行冷却。这类数据中心具有易安装、可随时转移等优点，而且使用清洁能源，不会对环境造成任何污染。按照Google的计划，Google将在夏威夷7英里（约11.2公里）处建造船只，部署足够支持其互联网搜索引擎的超级计算机。'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 云计算“炙手可热”


    +   - 国内几十个省市（直辖市/地级市）纷纷制定云计算发展规划，抢占云计算技术和产业制高点

    +   - 2014年4月11日发布《广东省云计算发展规划（2014-2020年）》

    +     - 2015年云服务产业规模达到1000亿元，云终端制造产业规模达到3000亿元，云计算应用达到国内领先水平

    +     - 2017年，云服务产业规模达到1600亿元，云终端制造产业规模达到4000亿元，应用水平力争接近世界先进行列

    +     - 2020年，云计算产业核心竞争力显著提升，云服务产业规模3000亿元，云终端制造产业规模达6000亿元，应用水平力争迈进世界先进行列

    +   - 云计算录像：云计算—“应用时代”来临'
