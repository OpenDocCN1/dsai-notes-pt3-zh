- pgno: 446
  md: '# 小波变换 Wavelet transform（续）


    —小波理论与工程应用


    +   - Inrid Daubechies于1988年最先揭示了小波变换和滤波器组(filter banks)之间的内在关系[2]，使离散小波分析变成现实

    +   - Ronald Coifman和Victor Wickerhauser等著名科学家在把小波理论引入到工程应用方面做出了极其重要贡献

    +   - 在信号处理中，自从Stephane Mallat和Inrid Daubechies发现滤波器组与小波基函数有密切关系之后，小波分析在信号(如声音和图像)处理中得到极其广泛的应用'
