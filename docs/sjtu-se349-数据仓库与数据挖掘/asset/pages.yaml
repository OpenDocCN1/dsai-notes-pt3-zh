- pgno: 1099
  md: '# {0,1}　　[0,1]

    特征函数　　隶属函数


    # 二、模糊子集


    定义：设 U 是论域，称映射


    \[

    \mu_A: U \to [0,1],

    \]

    \[

    x \mapsto \mu_A(x) \in [0,1]

    \]


    确定了一个 U 上的模糊子集 A。映射 \(\mu_A\) 称为 A 的隶属函数，\(\mu_A(x)\) 称为 x 对 A 的隶属程度，简称隶属度。'
  merge: -1
  img_proc: true
- pgno: 1100
  md: '# 模糊集合及其运算


    μ~A~(x) 越接近于0，表示 x 隶属于 A 的程度越小；


    μ~A~(x) 越接近于1，表示 x 隶属于 A 的程度越大；


    μ~A~(x) = 0.5，最具有模糊性，过渡点


    模糊子集 A 由隶属函数 μ~A~ 唯一确定，故认为二者是等同的。为简单见，通常用 A 来表示 A 和 μ~A~。'
  merge: -1
