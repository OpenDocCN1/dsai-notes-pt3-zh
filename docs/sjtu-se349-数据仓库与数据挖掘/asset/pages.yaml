- pgno: 408
  md: '# 回归分析Regression Analysis


    +   - **回归分析Regression analysis**: 建模和分析由一个或多个自变量（亦称解释变量或预测变量）和一个因变量（也称为响应变量或测量）组成的数值数据的技术的总称

    +   - 估计参数，以便提供对数据的“最佳配合”

    +   - 最常见、最合适的是通过使用最小二乘法估计的，但其它标准也被用于预测（包括时间序列数据的预测）、推理、假设测试和因果关系的建模


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_408_0.png)'
  merge: -1
  img_proc: true
- pgno: 409
  md: '# 回归分析和对数线性模型


    +   - **线性回归Linear regression:** $Y = wX + b$

    +     - 回归系数 $w$ and $b$ 根据现有的数据进行估计

    +     - 根据已知 $Y_1, Y_2, \ldots, X_1, X_2, \ldots$ 使用最小二乘法


    +   - **多元回归Multiple regression:** $Y = b_0 + b_1X_1 + b_2X_2$

    +     - 许多非线性函数可转化为上述公式


    +   - **对数线性模型Log-linear models:**

    +     - 近似离散的多维概率分布

    +     - 给定 $n$ 维元组的集合，可以把每个元组看作 $n$ 维空间的点。使用对数线性模型，基于维组合的一个较小子集，估计多维空间中每个点的概率，使得高维空间可以由低维空间来构造

    +     - 可用于维规约和数据光滑'
  merge: -1
  img_proc: true
