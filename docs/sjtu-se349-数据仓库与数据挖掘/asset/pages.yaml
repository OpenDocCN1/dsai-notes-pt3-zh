- pgno: 819
  md: "# 规则质量度量 Cont.\n\n+   - FOIL的基于信息增益的度量\n+   - 在机器学习中，用于学习规则的类的元组称为正元组，其余元组为负元组\n\
    +   - 设pos(neg)为R覆盖的正（负）元组数，pos’(neg’)为R’覆盖的正（负）元组数\n+   - 用下式估计扩展condition’而获得的信息\n\
    +   \n+     FOIL_Gain = pos’ × (log₂ pos’/(pos’+neg’) − log₂ pos/(pos+neg))\n\
    +   - 偏向于具有高准确率并且覆盖许多正元组的规则"
  merge: -1
  img_proc: true
- pgno: 820
  md: '# 规则剪枝


    +   - 上面介绍的规则评估规则使用原训练数据集：

    +     — 乐观的，过分拟合

    +     — 训练数据上性能好，以后的数据上就不那么好

    +   - 为了补偿，通过删除一个属性测试对规则剪枝

    +   - 如果在独立的元组集上评估，R剪枝后的版本有着更高的质量，那么选择对规则R剪枝

    +     — 悲观剪枝

    +   - FOIL中使用的方法

    +   - 剪枝后FOIL_Prune值较高，就对R剪枝

    +   - RIPPER从最近添加的合取项开始


    ```

    FOIL_Prune(R) = (pos - neg) / (pos + neg)

    ```'
