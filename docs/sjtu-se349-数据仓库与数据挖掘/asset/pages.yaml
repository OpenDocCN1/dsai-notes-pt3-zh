- pgno: 362
  md: '# 数据质量: 为什么要对数据预处理？


    # —可信性Believability: 数据有多可信？


    +   假设在某一时刻数据库有一些错误，之后被更正。然而，过去的错误已经给销售部门的用户造成了问题，因此他们不再相信该数据。


    # —可解释性Interpretability: 数据是否容易理解？


    +   数据还使用了许多会计编码，销售部门并不知道如何解释它们


    即使数据库现在是正确的、完整的、一致的、及时的，但是由于很差的可信性和可解释性，有些用户（销售部门）仍然可能把它看成低质量的数据'
  merge: -1
