- pgno: 1045
  md: '# CBR应用案例

    中心渔场预报专家系统


    鱼类的洄游以及中心渔场的形成受到这几个因素的制约：


    +   - 海水温度（包括海洋表面温度，海洋底层温度）

    +   - 台站数据，如海水盐度、盐度梯度、长江径流量、风向、风速等

    +   - 海洋叶绿素浓度


    但是，鱼类的洄游规律受很多因素制约，变化非常复杂，难以用传统的数学方法和模型描述。同时专家关于中心渔场规律的知识是不精确的，不完全的。


    收集了20来年东海的渔况、海况数据，这是非常宝贵的资料，可以从中挖掘出许多有用的信息和知识，根据历年的情况来分析、预测中心渔场的趋势。'
  merge: -1
  img_proc: true
- pgno: 1046
  md: '# CBR应用案例

    中心渔场预报专家系统


    由于大多数海况信息是以周为单位收集的，同时为了便于处理和计算，根据实际情况对需求进行了简化，预测的周期规定为一周。


    问题变成了如果知道本周中心渔产（位置，产量和大小），预报下周（下下周）中心渔场（位置，产量和大小）。


    即使如此，问题也是相当困难的，因为渔场位置、大小是一种空间数据。同时，海况信息涉及600来个空间和非空间属性。'
  merge: -1
  img_proc: true
- pgno: 1047
  md: '# CBR应用案例

    中心渔场预报专家系统


    系统中，对空间条件属性，采用三个相似性度量方法（函数）：


    +   - 基于渔场位置的相似

    +     ```

    +     sim1 = −Σ(wᵢ * distance(pos(goal) − pos(source))) / Σwᵢ

    +     ```


    +   - 基于温度场的相似

    +     ```

    +     sim2 = −Σ(wᵢ * difference(temp(goal) − temp(source))) / Σwᵢ

    +     ```


    +   - 基于温度梯度的相似

    +     ```

    +     sim3 = −Σ(wᵢ * difference(delta(goal) − delta(source))) / Σwᵢ

    +     ```


    其中，wᵢ是权重。如果该温度测试点与样本的中心渔场距离dᵢ越近，权越大。'
  merge: -1
  img_proc: true
