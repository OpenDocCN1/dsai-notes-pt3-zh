- pgno: 576
  md: '# 多维数据模型的模式 Cont.


    +   在建立数据仓库时，数据仓库和数据集市之间是有区别的。


    +   数据仓库收集了关于整个组织的主体（如顾客，商品，销售，资产和员工）信息，因此是企业范围的

    +   通常使用事实星座模式，能对多个相关的主题建模


    +   数据集市是数据仓库的一个部门子集，针对选定的主题，因此是部门范围的

    +   流行采用星形或雪花模式，适合对单个主题建模'
