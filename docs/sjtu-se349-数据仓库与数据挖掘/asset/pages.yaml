    ![](img/6d25e92eb0bd56a22c311279c19b06b4_1311_0.png)


    | Iteration | E-step | M-step |

    |---|---|---|

    | 1 | $M^T=\begin{bmatrix}1&0&0.48&0.42&0.41&0.47\\0&1&0.52&0.58&0.59&0.53\end{bmatrix}$
    | $c_1=(8.47,5.12)$<br>$c_2=(10.42,8.99)$ |

    | 2 | $M^T=\begin{bmatrix}0.73&0.49&0.91&0.26&0.33&0.42\\0.27&0.51&0.09&0.74&0.67&0.58\end{bmatrix}$
    | $c_1=(8.51,6.11)$<br>$c_2=(14.42,8.69)$ |

    | 3 | $M^T=\begin{bmatrix}0.80&0.76&0.99&0.02&0.14&0.23\\0.20&0.24&0.01&0.98&0.86&0.77\end{bmatrix}$
    | $c_1=(6.40,6.24)$<br>$c_2=(16.55,8.64)$ |


    +   - 计算两个模糊聚类，随机选择 $c_1=a$ and $c_2=b$

    +   - **1st E-step期望步**: assign o to $c_1$, w. wt = $\frac{1}{dist(o,c_1)^2}$

    +     - $w_{c,c_1}=\frac{41}{45+41}=0.48$

    +     - $\frac{1/dist(o,c_1)^2}{1/dist(o,c_1)^2+1/dist(o,c_2)^2}=\frac{dist(o,c_2)^2}{dist(o,c_1)^2+dist(o,c_2)^2}$

    +   - **1st M-step最大化步**: recalculate the centroids according to the partition
    matrix, minimizing the sum of squared error (SSE)

