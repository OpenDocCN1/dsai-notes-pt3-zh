- pgno: 263
  md: '# Ordered Data 有序数据


    +   时序数据（sequential data）


    +   — 也称时间数据（temporal data），可以看作记录数据的扩充，其中每个记录包含一个与之相关联的时间。


    +   — 考虑存储事务发生时间的零售事务数据。时间信息可以帮助发现“万圣节前夕糖果销售达到高峰”之类的模式。


    +   — 时间也可以与每个属性相关联，例如，每个记录可以是一位顾客的购物历史，包含不同时间购买的商品列表。使用这些信息就有可能发现“购买DVD播放机的人趋向于在其后不久购买DVD”之类的模式。


    | 时间 | 顾客 | 购买的商品 |

    | --- | --- | --- |

    | t1 | C1 | A, B |

    | t2 | C3 | A, C |

    | t2 | C1 | C, D |

    | t3 | C2 | A, D |

    | t4 | C2 | E |

    | t5 | C1 | A, E |


    | 顾客 | 购买时间与购买商品 |

    | --- | --- |

    | C1 | (t1: A,B) (t2:C,D) (t5:A,E) |

    | C2 | (t3: A, D) (t4: E) |

    | C3 | (t2: A, C) |'
  merge: -1
