  md: '# Outlier Detection (3): Clustering-Based Methods


    # 基于聚类的方法


    假设 Normal data belong to large and dense clusters, whereas outliers belong to
    small or sparse clusters, or do not belong to any clusters


    +   - Example (right figure): two clusters

    +     - All points not in R form a large cluster

    +     - The two points in R form a tiny cluster, thus are outliers


    +   - Since there are many clustering methods, there are many clustering-based
    outlier detection methods as well


    +   - Clustering is expensive: straightforward adaption of a clustering method
    for outlier detection can be costly and does not scale up well for large data
    sets


