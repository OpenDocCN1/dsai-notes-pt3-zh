- pgno: 922
  md: '# 统计学习理论


    +   - **机器学习**

    +     —主要研究从采集样本出发得出目前尚不能通过原理分析得到的规律,并利用这些规律对未来数据或无法观测的数据进行预测。

    +   - **模式识别**

    +     —对表征事务或现象的各种形式(数值、文字及逻辑关系等)信息进行处理和分析,以对事务或现象进行描述、辨认、分类和解释的过程。

    +   - **统计学习理论**

    +     —一种研究有限样本估计和预测的数学理论'
