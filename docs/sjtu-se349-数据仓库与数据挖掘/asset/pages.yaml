- pgno: 992
  md: '# 3、目标函数


    $L_p = -\frac{1}{2} \sum_{i=1}^{m} \sum_{j=1}^{m} \alpha_i \alpha_j d_i d_j k(x_i,
    x_j) + \sum_{i=1}^{m} \alpha_i$


    寻找拉格朗日乘子 {$\alpha_i$} 以最大化目标函数 $L_p$


    +   9α1 − α2 − α3 + α4 = 1

    +   −α1 + 9α2 + α3 − α4 = 1

    +   −α1 + α2 + 9α3 − α4 = 1

    +   α1 − α2 − α3 + 9α4 = 1'
