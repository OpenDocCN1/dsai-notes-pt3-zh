  md: '# Supervised vs. Unsupervised Learning

    监督学习 v.s. 非监督学习


    +   - **Supervised Learning 监督学习（用于分类）**

    +     - 模型的学习在被告知每个训练样本属于哪个类的“指导”下进行

    +     - 新数据使用训练数据集中得到的规则进行分类


    +   - **Unsupervised Learning 非监督学习（用于聚类）**

    +     - 每个训练样本的类编号是未知的，要学习的类集合或数量也可能是事先未知的

    +     - 通过一系列的度量、观察来 建立数据中的类编号 或进行 聚类'
