  md: '# C4.5分类算法

    算例


    # 第二步：计算所有属性的分离信息和信息增益率


    对 outlook 属性，取值为 overcast 的样本有 4 条，取值为 rain 的样本有 5 条，取值为 sunny 的样本有 5 条，则


    SplitE_outlook = -4/14 log₂ 4/14 - 5/14 log₂ 5/14 - 5/14 log₂ 5/14 = 1.576


    GainRatio_outlook = Gain_outlook / SplitE_outlook = 0.44


    对 temperature 属性，取值为 cool 的样本有 4 条，取值为 hot 的样本有 4 条，取值为 mild 的有 6 条，则


    SplitE_temperature = -4/14 log₂ 4/14 - 4/14 log₂ 4/14 - 6/14 log₂ 6/14 = 1.556


    GainRatio_temperature = Gain_temperature / SplitE_temperature = 0.029 / 1.556
    = 0.019


    对 humidity 属性，取值为 high 的样本有 7 条，取值为 normal 的样本有 7 条，则


    SplitE_humidity = -7/14 log₂ 7/14 - 7/14 log₂ 7/14 = 1


    GainRatio_humidity = Gain_humidity / SplitE_humidity = 0.152 / 1 = 0.152


    对 wind 属性，取值为 weak 的样本有 8 条，取值为 strong 的样本有 6 条，则


    SplitE_wind = -8/14 log₂ 8/14 - 6/14 log₂ 6/14 = 0.985


    GainRatio_wind = Gain_wind / SplitE = 0.049 / 0.985 = 0.0497


