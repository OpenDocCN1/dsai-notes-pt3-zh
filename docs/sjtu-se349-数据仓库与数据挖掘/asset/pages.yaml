  md: '# Major Clustering Approaches


    # 主要聚类方法的特性分析


    | 方法 | 一般特点 |

    |---|---|

    | 划分方法 | - 发现聚形互斥的簇<br>- 基于距离<br>- 可以用均值或中心点等代表簇中心<br>- 对中小规模数据集有效 |

    | 层次方法 | - 聚类是一个层次分解（即多层）<br>- 不能纠正错误的合并或划分<br>- 可以集成其他技术，如簇聚类或考虑对象“连按” |

    | 基于密度的方法 | - 可以发现任意形状的簇<br>- 簇足对象空间中其低密度区域分隔的稠密区域<br>- 簇密度：每个点的“邻域”内必须具有最少个数的点<br>-
    可 能过滤离群点 |

    | 基于网格的方法 | - 使用一种多分辨率网格数据结构<br>- 快速处理（典型地，独立于数据对象，但依赖于网格大小） |'
