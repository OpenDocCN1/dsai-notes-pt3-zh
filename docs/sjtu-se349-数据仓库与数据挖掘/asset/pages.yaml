  md: '# 支持向量机的基本原理


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_940_0.png)


    设两类问题训练样本集为 $(x_1, y_1)$, $(x_2, y_2), ..., (x_n, y_n)$, 其中 $x_i \in R^n$, $y_i
    = \{1, -1\}$, $i = 1, ..., n$ 线性可分是指存在着超平面（Hyper-plane）直线 $f(x) = w x + b$, 使得训练样本中的一类输入和另一类输入分别位于该超平面的两侧。


    这种线性分类函数在一维空间里就是一个点，在二维空间里就是一条直线，三维空间里就是一个平面，可以如此想象下去，如果不关注空间的维数，这种线性函数还有一个统一的名称——超平面（Hyper
    Plane）！'
