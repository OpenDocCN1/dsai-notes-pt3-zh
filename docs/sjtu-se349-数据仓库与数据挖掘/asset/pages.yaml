- pgno: 710
  md: '# 由训练元组归纳决策树的基本算法


    Algorithm: Generate_decision_tree. Generate a decision tree from the training
    tuples of data partition, D.


    # Input:


    +   - Data partition, D, which is a set of training tuples and their associated
    class labels;

    +   - attribute_list, the set of candidate attributes;

    +   - Attribute_selection_method, a procedure to determine the splitting criterion
    that "best" partitions the data tuples into individual classes. This criterion
    consists of a splitting_attribute and, possibly, either a split-point or splitting
    subset.


    Output: A decision tree.


    # Method:


    ```

    (1) create a node N;

    (2) if tuples in D are all of the same class, C, then

    (3) return N as a leaf node labeled with the class C;

    (4) if attribute_list is empty then

    (5) return N as a leaf node labeled with the majority class in D; // majority
    voting

    (6) apply Attribute_selection_method(D, attribute_list) to find the "best" splitting_criterion;

    (7) label node N with splitting_criterion;

    (8) if splitting_attribute is discrete-valued and

    multiway splits allowed then // not restricted to binary trees

    (9) attribute_list ← attribute_list − splitting_attribute; // remove splitting_attribute

    (10) for each outcome j of splitting_criterion

    // partition the tuples and grow subtrees for each partition

    (11) let Dj be the set of data tuples in D satisfying outcome j; // a partition

    (12) if Dj is empty then

    (13) attach a leaf labeled with the majority class in D to node N;

    (14) else attach the node returned by Generate_decision_tree(Dj, attribute_list)
    to node N;

    endfor

    (15) return N;

    ```'
  merge: -1
  img_proc: true
- pgno: 711
  md: '# 由训练元组归约决策树的基本算法


    **算法：** `Generate_decision_tree`：由数据分区中的训练元组产生决策树。


    **输入：**


    +   - 数据分区 $D$，训练元组和它们对应类标号的集合。

    +   - `attribute_list`，候选属性的集合。

    +   - `Attribute_selection_method`，一个确定“最好地”划分数据元组为个体类的分裂准则的过程。这个准则的分裂属性（`splitting_attribute`）和分裂点或划分子集组成。


    **输出：** 一棵决策树。


    **方法：**


    ```

    （1）创建一个结点 N；

    （2）if D 中的元组都在同一类 C 中 then

    （3）　返回 N 作为叶结点，标类 C；

    （4）else if attribute_list 为空 then

    （5）　返回 N 作为叶结点，标记为 D 中的多数类；

    （6）使用 Attribute_selection_method(D, attribute_list)，找出“最好”的 splitting_criterion；

    （7）用 splitting_criterion 标记结点 N；

    （8）if splitting_attribute 是离散值的，并且允许多路划分 then

    （9）　attribute_list ← attribute_list − splitting_attribute;

    （10）for splitting_criterion 的每个输出 j

    　　　// 划分元组并对每个分区产生子树

    （11）　设 D_j 是由满足输出 j 的数据元组的集合；

    （12）　if D_j 为空 then

    （13）　　加一个树叶结点，标记为 D 中的多数类；

    （14）　else 加一个由 Generate_decision_tree(D_j, attribute_list) 返回的结点到 N；

    　　　endif

    （15）返回 N；

    ```'
  merge: -1
  img_proc: true
- pgno: 712
  md: '# C4.5分类算法


    # 决策树生长阶段算法伪代码


    函数名：CDT(S,F)


    输入：训练集数据 S，训练集数据属性集合 F


    输出：一棵未剪枝的 C4.5 决策树


    ```

    (1) if 样本 S 全部属于同一个类别 C then

    (2)   创建一个叶节点，并标记类标号为 C;

    (3)   return;

    (4) else

    (5)   计算属性集 F 中每个属性的信息增益率，假定增益率值最大的属性为 A;

    (6)   创建节点，取属性 A 为该节点的决策属性;

    (7)   for 节点属性 A 的每个可能的取值 V do

    (8)     为该节点添加一个新的分支，假设 S_V 为属性 A 取值为 V 的样本子集;

    (9)     if 样本 S_V 全部属于同一个类别 C then

    (10)      为该分支添加一个叶节点，并标记为类标号为 C;

    (11)    else

    (12)      递归调用 CDT(S_V, F-{A})，为该分支创建了树;

    (13)    end if

    (14)  end for

    (15) end if

    ```'
  merge: -1
  img_proc: true
- pgno: 713
  md: '# 由训练元组归纳决策树的基本算法说明（1）


    +   用三个参数D、attribute_list和Attribute_selection_method调用算法Generate_decision_tree

    +   — D称为数据分区，初始它是训练元组和它们相应类标号的完全集

    +   — attribute_list是描述元组属性的列表

    +   — Attribute_selection_method指定选择属性的启发式过程，用来选择可以按类“最好地”区分给定元组的属性（分裂属性）

    +     • 该过程使用一种属性选择度量，如信息增益或基尼指数

    +     • 树是否是严格的二叉树由属性选择度量确定

    +     – 某些属性选择度量，如基尼指数强制结果树是二叉树

    +     – 其他度量，如信息增益并非如此，它允许多路划分（即从一个结点生长两个或多个分枝）'
  merge: -1
  img_proc: true
- pgno: 714
  md: '# 由训练元组归纳决策树的基本算法说明（2）


    +   树从单个节点N开始，N代表D中的训练元组（步骤1）。


    +   如果D中的元组都为同一类，则节点N变成树叶，并用该类标记它（步骤2和步骤3）。注意，步骤4和步骤5是终止条件，所有的终止条件都在算法的最后解释。


    +   否则，算法调用Attribute_selection_method确定分裂准则（splitting criterion）。分裂准则通过确定把D中的元组划分成个体类的“最好”方法，告诉在节点N上对哪个属性进行测试（步骤6）。


    分裂准则还告诉对于选定的测试，从节点N生长哪些分支。更具体地说，分裂准则指定分裂属性，并且也指出分裂点（splitting-point）或分裂子集（splitting
    subset）。理想情况下，分裂准则这样确定，使得每个分支上的输出分区都尽可能“纯”。一个分区是纯的，如果它的所有元组都属于同一类。换言之，如果根据分裂准则的互斥输出划分D中的元组，则希望结果分区尽可能纯。


    ```

    (1) 创建一个节点N;

    (2) if D中的元组都在同一类C中then

    (3)   返回N作为叶节点,以类C标记;

    (4) if attribute_list为空then

    (5)   返回N作为叶节点,标记为D中的多数类;        //多数表决

    (6) 使用Attribute_selection_method(D, attribute_list),找出“最好的”splitting_criterion;

    ```'
  merge: -1
  img_proc: true
