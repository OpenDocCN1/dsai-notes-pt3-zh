- pgno: 932
  md: '# 机器学习基础


    # 结构风险最小化原则的提出


    +   - 学习机器的实际风险由两部分组成

    +     - 训练样本的经验风险

    +     - 置信范围（同置信水平 1 − η 有关，而且同学习机器的VC维和训练样本数有关）


    R(α) ≤ R_emp(α) + Φ( n / h )


    在训练样本有限的情况下，学习机器的VC维越高，则置信范围就越大，导致实际风险与经验风险之间可能的差就越大'
  merge: -1
  img_proc: true
- pgno: 933
  md: '# 机器学习基础

    结构风险的概念


    +   - 结构风险包括两个部分


    # 经验风险


    +   - 代表了分类器在给定样本上的误差


    # 置信风险


    +   - 代表了在多大程度上可以信任分类器在未知样本上分类的结果。显然，这个部分是没有办法精确计算的，因此只能给出一个估计的区间，也使得整个误差只能计算上界，而无法计算准确的值


    +   - 置信风险与两个量有关


    # 样本数量


    +   - 显然给定的样本数量越大，学习结果越有可能正确，此时置信风险越小


    # 分类函数的VC维（分类函数的复杂度）


    +   - VC维越大，推广能力越差，置信风险会变大'
  merge: -1
  img_proc: true
- pgno: 934
  md: '# 机器学习基础


    # 结构风险最小化原则


    +   - 结构风险最小化（Structural Risk Minimization, SRM）原则

    +   - 在小样本的情况下，对于复杂的学习机器，其训练误差过小，但反而造成了置信范围的增大，从而导致泛化性能下降。这往往是由于学习机器的结构不合理造成的。

    +   - ERM原则在样本有限时是不合理的。为此，统计学习理论提出了一种新的策略，在保证ERM原则的基础上，降低学习机器的VC维，能够使得期望风险在整个总体集上得到控制，即在训练误差和置信范围二者之间寻求一个折衷，这种思想就是SRM。'
  merge: -1
  img_proc: true
- pgno: 935
  md: '# 机器学习基础


    # 结构风险最小原则


    最小化经验风险与置信范围之和被称作结构风险最小化原则SRM。


    实现SRM原则可以有两种思路：


    +   1. 对函数集S的每个子集Si求最小经验风险，然后选择使最小经验风险和置信范围之和最小的子集；


    +   2. 设计函数集的某种结构使每个子集中都能取得最小的经验风险，如使训练误差为0，然后只需选择适当的子集使置信范围最小，则这个子集中使经验风险最小的函数就是最优函数。


    ![](img/6d25e92eb0bd56a22c311279c19b06b4_935_0.png)


    函数集子集： S1 ⊂ S2 ⊂ S3

    VC维： h1 ≤ h2 ≤ h3


    图14-4 结构风险最小化原则'
  merge: -1
  img_proc: true
