  md: '# 2. Classification and regression analysis

    数据挖掘模式之二：分类与回归


    # Classification and label prediction 分类和标号预测


    找出描述和区分数据类或概念的模型（或函数），以便能够使用模型预测类标号未知的对象的类标号


    # Construct models (functions) based on some training examples


