  md: "# 小结\n\n+   1、算法是由两部分组成\n+   \t—信息的正向传递\n+   \t—误差的反向传播\n+   2、网络的输入输出关系是各层连接的权因子决定，权因子是通过学习信号调节的，这样学习越多，网络越聪明\n\
    +   3、隐含层越多，网络输出精度越高，且个别权因子的损坏不会对网络输出产生大的影响\n+   4、反向传播网络的结构不完全受所要解决问题的限制\n+ \
    \  \t—网络的输入神经元数目及输出层神经元的数目是由问题的要求所决定\n+   \t—隐含层数以及每层的神经元数是由设计者来决定的"
