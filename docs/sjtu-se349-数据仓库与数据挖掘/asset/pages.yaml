- pgno: 805
  md: '# 朴素贝叶斯分类：避免零概率值问题


    +   如果某个P(x_k|C_i)为零概率值，那么P(X|C_i)的值将返回零

    +   ——一个零概率将消除乘积中涉及的（C_i上）所有其他（后验）概率的影响


    +   解决方法

    +   ——有一个简单的技巧来避免该问题。可以假定训练数据库D很大，以至于对每个计数加1造成的估计概率的变化可以忽略不计，但可以方便地避免概率值为零。这种概率估计技术称为拉普拉斯校准或拉普拉斯估计法，以法国数学家皮埃尔·拉普拉斯（Pierre
    Laplace,1749—1827年）的名字命名

    +   ——如果对q个计数加上1，则必须记住在用于计算概率的对应分母上加上q


    +   例：假设一个数据集有1000个元组

    +   ——income=low(0),income=medium(990),income=high(10)

    +   ——使用拉布拉斯校准

    +     - 假定训练数据库D很大，以至于对每个计数加1造成的估计概率的变化可以忽略不计

    +     - Prob(income = low) = 1/1003

    +     - Prob(income = medium) = 991/1003

    +     - Prob(income = high) = 11/1003

    +   ——校准的概率估计对应未校准的估计很接近'
  merge: -1
  img_proc: true
