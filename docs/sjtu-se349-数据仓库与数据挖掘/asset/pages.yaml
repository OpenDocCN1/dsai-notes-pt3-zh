  md: '# # Univariate Gaussian Mixture Model

    ## 使用EM算法的概率模型的聚类


    O = {o₁, ..., oₙ} (n observed objects), Θ = {θ₁, ..., θₖ} (parameters of the k
    distributions), and Pⱼ(oᵢ | θⱼ) is the probability that oᵢ is generated from the
    j-th distribution using parameter θⱼ, we have


    $P(o_i\mid\Theta)=\sum_{j=1}^{k}\omega_jP_j(o_i\mid\Theta_j)$　　　$P(\mathbf{O}\mid\Theta)=\prod_{i=1}^{n}\sum_{j=1}^{k}\omega_jP_j(o_i\mid\boldsymbol{\omega}_j)$


    +   - **Univariate Gaussian mixture model**

    +     - Assume the probability density function of each cluster follows a 1-d
    Gaussian distribution. Suppose that there are k clusters.

    +     - The probability density function of each cluster are centered at μⱼ with
    standard deviation σⱼ, θⱼ = (μⱼ, σⱼ), we have


    $P(o_i\mid\Theta_j)=\frac{1}{\sqrt{2\pi}\sigma_j}e^{-\frac{(o_i-\mu_j)^2}{2\sigma_j^2}}$　　　$P(o_i\mid\Theta)=\sum_{j=1}^{k}\frac{1}{\sqrt{2\pi}\sigma_j}e^{-\frac{(o_i-\mu_j)^2}{2\sigma_j^2}}$


    $P(\mathbf{O}\mid\Theta)=\prod_{i=1}^{n}\sum_{j=1}^{k}\frac{1}{\sqrt{2\pi}\sigma_j}e^{-\frac{(o_i-\mu_j)^2}{2\sigma_j^2}}$'
  merge: -1
  img_proc: true
- pgno: 1313
  md: '# Computing Mixture Models with EM

    使用EM算法的概率模型的聚类


    +   - Given n objects O = {o₁, ..., oₙ}, we want to mine a set of parameters Θ
    = {θ₁, ..., θₖ} s.t., P(O|Θ) is maximized, where θⱼ = (μⱼ, σⱼ) are the mean and
    standard deviation of the j-th univariate Gaussian distribution

    +   - We initially assign random values to parameters θⱼ, then iteratively conduct
    the E- and M- steps until converge or sufficiently small change

    +   - At the E-step, for each object oᵢ, calculate the probability that oᵢ belongs
    to each distribution,

    +     $$P(Θ_j|o_i, Θ) = \frac{P(o_i|Θ_j)}{\sum_{l=1}^{k} P(o_i|Θ_l)}$$


    +   - At the M-step, adjust the parameters θⱼ = (μⱼ, σⱼ) so that the expected
    likelihood P(O|Θ) is maximized

    +     $$\mu_j = \sum_{i=1}^{n} o_i \frac{P(Θ_j|o_i, Θ)}{\sum_{l=1}^{n} P(Θ_j|o_l,
    Θ)} = \frac{\sum_{i=1}^{n} o_i P(Θ_j|o_i, Θ)}{\sum_{i=1}^{n} P(Θ_j|o_i, Θ)}\quad
    \sigma_j = \sqrt{\frac{\sum_{i=1}^{n} P(Θ_j|o_i, Θ)(o_i - u_j)^2}{\sum_{i=1}^{n}
    P(Θ_j|o_i, Θ)}}$$'
  merge: -1
  img_proc: true
