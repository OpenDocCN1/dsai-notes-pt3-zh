  - '[PAGE 135]


    # Parameters of HMM


    +   - Initial state parameters $P(h_t = \omega_i) = \pi_i, \sum_i \pi_i = 1$

    +   - Transition probabilities $P(h_t = \omega_j | h_{t-1} = \omega_i) = a_{ij},
    \sum_j a_{ij} = 1$. A = [a_{ij}] is transition matrix

    +   - Emission probabilities $p(x_t | h_t)$

    +     - If $x_t$ is a single discrete variable, $x_t = x_i \in \{v_1, ..., v_m\}$,
    $P(x_t = v_k | z_t = \omega_j) = b_{jk}, \sum_k b_{jk} = 1$


    ![](img/a04b187c89c5018c5ef6132980e27196_135_0.png)'
  - "[PAGE 136]\n\n# Parameters of HMM\n\n+   - **Evaluation problem**: determine\
    \ the probability that a particular data sequence x₁, ..., x_T was generated by\
    \ that model,\n+   \n+     P(x₁, ..., x_T)\n+   - **Decoding problem**: given\
    \ a set of observations x₁, ..., x_T, determine the most likely sequence of hidden\
    \ states h₁, ..., h_T that lead to the observations\n+   \n+     (h₁*, ..., h_T*)\
    \ = argmax_{h₁,...,h_T} P(h₁, ..., h_T | x₁, ..., x_T)\n+   - **Learning problem**:\
    \ given a set of training observations of visible variables, without knowing the\
    \ hidden variables, determine the parameters of HMM.\n+   \n+     θ* = P(x₁, ...,\
    \ x_T; θ)"
  - '[PAGE 137]


    # Recurrent neural networks (RNN)


    +   - While HMM is a generative model RNN is a discriminative model

    +   - Model a dynamic system driven by an external signal x_t

    +   - h_t = F_θ(h_{t-1}, x_t)

    +   - h_t contains information about the whole past sequence. The equation above
    implicitly defines a function which maps the whole past sequence (x_1, ..., x_t)
    to the current state h_t = G_θ(x_1, ..., x_t)


    ![](img/a04b187c89c5018c5ef6132980e27196_137_0.png)


    Left: physical implementation of RNN, seen as a circuit. The black square indicates
    a delay of 1 time step. Right: the same seen as an unfolded flow graph, where
    each node is now associated with a particular time instance.'
  - '[PAGE 138]


    # Recurrent neural networks (RNN)


    +   - The summary is lossy, since it maps an arbitrary length sequence (x₁, …,
    xₜ) to a fixed length vector hₜ. Depending on the training criterion, hₜ keeps
    some important aspects of the past sequence.

    +   - Sharing parameters: the same weights are used for different instances of
    the artificial neurons at different time steps

    +   - Share a similar idea with CNN: replacing a fully connected network with
    local connections with parameter sharing

    +   - It allows to apply the network to input sequences of different lengths and
    predict sequences of different lengths


    ![](img/a04b187c89c5018c5ef6132980e27196_138_0.png)'
  - '[PAGE 139]


    <!-- no content -->'
  - '[PAGE 140]


    # A vanilla RNN to predict sequences from input


    P(y₁, ..., y_T | x₁, ..., x_T)


    +   - Forward propagation equations, assuming that hyperbolic tangent non-linearities
    are used in the hidden units and softmax is used for output for classification
    problems


    h_t = tanh(W_in x_t + W_hh h_{t-1} + b_h)


    z_t = softmax(W_hz h_t + b_z)


    p(y_t = c) = z_{t,c}


    ![](img/a04b187c89c5018c5ef6132980e27196_140_0.png)'
  - '[PAGE 141]


    <!-- no content -->'
  - "[PAGE 142]\n\n# Backpropagation on RNN\n\n+   - Review BP on flow graph\n\n![](img/a04b187c89c5018c5ef6132980e27196_142_0.png)\n\
    \n```\n∂loss/∂w ← 1\nfor j = N − 1 down to 1 do\n  ∂u_j/∂w ← Σ_{k∈parents(j)}\
    \ (∂u_k/∂u_j) (∂u_k/∂w) / ∂u_j\nend for\nreturn (∂u_N/∂w)^M_{j=1}\n```\n\n> (Bengio\
    \ et al. Deep Learning 2014)\n\n∂u_j/∂w_i = ∂u_j/∂a_i · ∂a_i/∂net_i · ∂net_i/∂w_i"
  - '[PAGE 143]


    # Gradients on W_hz and b_z


    ∂L/∂z_t = 1,  ∂L/∂z_t = ∂L/∂L_t ∂L_t/∂z_t = ∂L_t/∂z_t


    ∂L/∂W_hz = Σ_t ∂L_t/∂z_t ∂z_t/∂W_hz    ∂L/∂b_z = Σ_t ∂L_t/∂z_t ∂z_t/∂b_z


    ![](img/a04b187c89c5018c5ef6132980e27196_143_0.png)'
  - '[PAGE 144]


    # Gradients on W_hh and W_xh


    ∂L/∂W_hh = Σ_t ∂L/∂h_t ∂h_t/∂W_hh


    ∂L/∂h_t = ∂L/∂h_{t+1} ∂h_{t+1}/∂h_t + ∂L/∂z_t ∂z_t/∂h_t


    ![](img/a04b187c89c5018c5ef6132980e27196_144_0.png)'
