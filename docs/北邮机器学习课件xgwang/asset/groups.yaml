  - '[PAGE 84]


    # Summary


    +   - Stochastic learning

    +     - Estimate of the gradient is noisy, and the weights may not move precisely
    down the gradient at each iteration

    +     - Faster than batch learning, especially when training data has redundancy

    +     - Noise often results in better solutions

    +     - The weights fluctuate and it may not fully converge to a local minimum

    +   - Batch learning

    +     - Conditions of convergence are well understood

    +     - Some acceleration techniques only operate in batch learning

    +     - Theoretical analysis of the weight dynamics and convergence rates are
    simpler'
  - '[PAGE 85]


    <!-- no content -->'
  - '[PAGE 86]


    # Learning curve on the training set


    +   - The average training error typically decreases with the number of epochs
    and reaches an asymptotic value

    +   - This asymptotic value could be high if underfitting happens. The reasons
    could be

    +     - The classification problem is difficult (Bayes error is high) and there
    are a large number of training samples

    +     - The expressive power of the network is not enough (the numbers of weights,
    layers and nodes in each layer)

    +     - Bad initialization and get stuck at local minimum (pre-training for better
    initialization)

    +   - If the learning rate is low, the training error tends to decrease monotonically,
    but converges slowly. If the learning rate is high, the training error may oscillate.'
  - '[PAGE 87]


    # Learning curve on the test and validation set


    +   - The average error on the validation or test set is virtually always higher
    than on the training set. It could increase or oscillate when **overfitting**
    happen. The reasons could be

    +     - Training samples are not enough

    +     - The expressive power of the network is too high

    +     - Bad initialization and get stuck at local minimum (pre-training for better
    initialization)

    +   - Stop training at a minimum of the error on the validation set'
