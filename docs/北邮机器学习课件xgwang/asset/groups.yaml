    frac{\\partial J}{\\partial z_k}\\frac{\\partial z_k}{\\partial net_k} = (t_k\
    \ - z_k)f'(net_k)$$\n\n  描述整体误差如何随单元的网络激活值变化。\n\n- 权重更新规则。由于 \\(\\partial net_k\
    \ / \\partial w_{kj} = y_j\\)，\n\n  $$\\Delta w_{kj} = \\eta \\delta_k y_j = \\\
    eta (t_k - z_k)f'(net_k) y_j.$$\n\n## 激活函数\n\n- \\(f(\\cdot)\\) 的常用选择\n  - Softmax：通常用作输出层的非线性函数，用于预测离散概率\n\
    \n    $$f(s_k) = \\frac{e^{s_k}}{\\sum_{k'=1}^{C} e^{s_{k'}}}$$\n\n  - Maxout：它在假设存在多个网络激活值的情况下推广了整流器\n\
    \n    $$f(s_1, \\dots, s_n) = \\max_i (s_i)$$\n\n## 示例 2\n\n- 选择交叉熵作为训练误差度量，并在输出层使用\
    \ softmax 作为激活函数\n- 灵敏度 \\(\\delta_k = -t_k(z_k - 1)\\)（如何得到？）\n- 如果误差很大，即使 \\\
    (z_k\\) 接近 0，\\(\\delta_k\\) 也很大\n- Softmax 会产生更稀疏的输出\n\n## 输入层到隐藏层的权重\n\n真实值\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_76_0.png)\n\n$$y_j = f(net_j)$$\n\n\
    $$net_j = \\sum_{i=1}^{d} w_{ji} x_i + w_{j0}$$\n\n$$\\frac{\\partial J}{\\partial\
    \ w_{ji}} = \\frac{\\partial J}{\\partial y_j}\\frac{\\partial y_j}{\\partial\
    \ net_j}\\frac{\\partial net_j}{\\partial w_{ji}}$$\n\n- 隐藏单元输出 \\(y_j\\) 如何影响每个输出单元处的误差\n\
    \n  $$\\frac{\\partial J}{\\partial y_j} = \\frac{\\partial}{\\partial y_j}\\\
    left[\\frac{1}{2}\\sum_{k=1}^{c}(t_k - z_k)^2\\right] = -\\sum_{k=1}^{c}(t_k -\
    \ z_k)\\frac{\\partial z_k}{\\partial y_j} = -\\sum_{k=1}^{c}(t_k - z_k)\\frac{\\\
    partial z_k}{\\partial net_k}\\frac{\\partial net_k}{\\partial y_j} = -\\sum_{k=1}^{c}(t_k\
    \ - z_k)f'(net_k)w_{kj} = -\\sum_{k=1}^{c}\\delta_k w_{kj}$$\n\n- 隐藏单元 \\(j\\\
    ) 的灵敏度\n\n  $$\\delta_j = -\\frac{\\partial J}{\\partial net_j} = -\\frac{\\partial\
    \ J}{\\partial y_j}\\frac{\\partial y_j}{\\partial net_j} = f'(net_j)\\sum_{k=1}^{c}w_{kj}\\\
    delta_k$$\n\n  \\(\\sum_{k=1}^{c}w_{kj}\\delta_k\\) 是隐藏单元 \\(j\\) 的有效误差。\n\n-\
    \ 权重更新规则。由于 \\(\\partial net_j/\\partial w_{ji} = x_i\\)，\n\n  $$\\Delta w_{ji}\
    \ = \\eta x_i \\delta_j = \\eta f'(net_j)\\left[\\sum_{k=1}^{c}w_{kj}\\delta_k\\\
    right]x_i$$\n\n## 误差反向传播\n\n![](img/a04b187c89c5018c5ef6132980e27196_79_0.png)\n\
    \n（Duda 等，《模式分类》，2000）隐藏单元的灵敏度与输出单元灵敏度的加权和成正比：\n\n$$\\delta_j = f'(net_j)\\sum_{k=1}^{c}\
    \ w_{kj}\\delta_k$$\n\n因此，输出单元的灵敏度被“反向”传播到隐藏单元。\n\n## 随机梯度下降\n\n- 给定 \\(n\\) 个训练样本，我们的目标函数可以表示为\n\
    \n  $$J(w) = \\sum_{p=1}^{n} J_p(w)$$\n\n- 批量梯度下降\n\n  $$w \\leftarrow w - \\\
    eta \\sum_{p=1}^{n} \\nabla J_p(w)$$\n\n- 在某些情况下，计算求和梯度在计算上可能非常昂贵。随机梯度下降在每一步对部分求和函数进行采样。这在大型机器学习问题中非常有效。在随机梯度下降中，\\\
    (J(w)\\) 的真实梯度由单个样本（或一小批样本）的梯度来近似：\n\n  $$w \\leftarrow w - \\eta \\nabla J_p(w)$$\n\
    \n## 随机反向传播\n\n### 算法 1（随机反向传播）\n\n```text\n1 begin initialize network topology\
    \ (# hidden units), w, criterion θ, η, m ← 0\n2 do m ← m + 1\n3 X^m ← randomly\
    \ chosen pattern\n4 w_ij ← w_ij + ηδ_j x_i; w_jk ← w_jk + ηδ_k y_j\n5 until ΔJ(w)\
    \ < θ\n6 return w\n7 end\n```\n\n> （Duda 等，《模式分类》，2000）\n\n- 在随机训练中，一次权重更新可能会降低当前所呈现的单个样本的误差，但可能会增加整个训练集上的误差。\n\
    \n"
