  - '[PAGE 296]


    # 01 基本概念


    # 数据流图（tf.Graph）


    ![](img/a04b187c89c5018c5ef6132980e27196_296_0.png)


    +   - Tensorflow是基于图（Graph）的计算系统。\n- 图的节点则是由操作（Operation）来构成的，而图的各个节点之间则是由张量（Tensor）作为边来连接在一起的。\n-
    数据流图表示计算指令之间的依赖关系和组合的方式，包含图结构的信息。\n- 在构建数据流图时并不会真的触发计算。\n- 数据流图的好处在于合理安排各个操作之间的并行或顺次执行，协同不同的底层设备，避免冗余操作。'
  - '[PAGE 297]


    # 01 基本概念


    ![](img/a04b187c89c5018c5ef6132980e27196_297_0.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_297_1.png)


    张量（tf.Tensor）


    ![](img/a04b187c89c5018c5ef6132980e27196_297_2.png)


    +   - **dtype**: tf.float32、tf.int8等, 数据类型

    +   - **Shape**: (n1, n2, n3), 数据形状

    +   - **Name**: tensor1, 数据名称

    +   - **Op**: 该tensor的来源操作

    +   - **Graph**: 该tensor属于的图

    +   - ...


    +   ◆ 万物皆张量

    +   ◆ 张量包括常数\变量\占位符等

    +   ◆ 涉及到数据都是张量'
  - '[PAGE 298]


    # 01 基本概念


    操作（tf.Operation）


    tf.add


    tf.subtract


    tf.multiply


    tf.divide


    tf.layer.conv2d


    Image

    Convolved Feature


    接收零个或者多个Tensor对象作为输入，然后产生零个或者多个Tensor对象作为输出。'
  - '[PAGE 299]


    # 01 基本概念


    # 会话（tf.Session）


    ![](img/a04b187c89c5018c5ef6132980e27196_299_0.png)


    +   - 图构建完成后要通过会话实现计算。

    +   - 拥有具体的物理资源(如cpu、gpu)

    +   - 提供了Operation执行和Tensor求值的环境

    +   - 在计算Graph时,并不一定是Graph中的所有节点都被计算了,而是指定的计算节点或者该节点的输出结果被需要时'
