    6, 2000.

    +   - Y. LeCun, L. Bottou, G. B. Orr, and K. Muller, “Efficient BackProp,” Technical
    Report, 1998.

    +   - Y. Bengio, I. J. Goodfellow and A. Courville, “Numerical Computation” in
    “Deep Learning”, Book in preparation for MIT Press

    +   - Y. Bengio, I. J. Goodfellow and A. Courville, “Numerical Optimization” in
