  - '[PAGE 99]


    # Desirable properties of activation functions


    +   - Must be nonlinear: otherwise it is equivalent to a linear classifier

    +   - Its output has maximum and minimum value: keep the weights and activations
    bounded and keep training time limited

    +     - Desirable property when the output is meant to represent a probability

    +     - Desirable property for models of biological neural networks, where the
    output represents a neural firing rate

    +     - May not be desirable in networks for regression, where a wide dynamic
    range may be required

    +   - Continuous and differentiable almost everywhere

    +   - Monotonicity: otherwise it introduces additional local extrema in the error
    surface

    +   - Linearity for a small value of net, which will enable the system to implement
    a linear model if adequate for yielding low error'
  - '[PAGE 100]


    # Desirable properties of activation functions


    +   - The average of the outputs at a node is close to zero because these outputs
    are the inputs to the next layer

    +   - The variance of the outputs at a node is also 1.'
  - '[PAGE 101]


    # Global versus local representations


    +   - Tanh function (shifting the center of sigmoid to 0) has all the properties
    above

    +     - It has large response for input in a large range. Any particular input
    x is likely to yield activity through several hidden units. This affords a distributed
    or global representation of the input.

    +     - If hidden units have activation functions that have significant response
    only for input within a small range, then an input x generally leads to fewer
    hidden units being active - a local representation.

    +   - Distributed representations are superior because more of the data influences
    the posteriors at any given input region.

    +   - The global representation can be better achieved with more layers'
