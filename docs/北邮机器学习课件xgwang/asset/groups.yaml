    \n- Second-order methods or momentum assume quadratic shape around the minimum.\
    \ They increase the size of steps in the low-curvature directions and decrease\
    \ the sizes of steps in the high-curvature directions (the steep sides of the\
    \ valley).\n\n- When training deep models, higher order derivatives introduce\
    \ a lot more non-linearity, which often does not have nice symmetrical shapes\
    \ that the second-order “valley” picture builds in our mind.\n\n![](img/a04b187c89c5018c5ef6132980e27196_212_0.png)\n\
    \n## Gradient clipping\n\n- To address the presence of cliffs, a useful heuristic\
    \ is to clip the magnitude of the gradient, only keeping its direction if its\
    \ magnitude is above a threshold (which is a hyper-parameter). This helps to avoid\
    \ the destructive big moves which would happen when approaching the cliff, either\
    \ from above or below.\n\n![](img/a04b187c89c5018c5ef6132980e27196_213_0.png)\n\
    \n## Vanishing and exploding gradients\n\n梯度消失/爆炸问题\n\n- Training a very deep\
    \ net makes the problem even more serious, since after BP through many layers,\
    \ the gradients become either very small or very large.\n\n- In very deep nets\
    \ and recurrent nets, the final output is composed of a large number of non-linear\
    \ transformations.\n\n- Even though each of these non-linear stages may be relatively\
    \ smooth, their composition is going to be much \"more non-linear\", in the sense\
    \ that the derivatives through the whole composition will tend to be either very\
    \ small or very large, with more ups and downs.\n\n![](img/a04b187c89c5018c5ef6132980e27196_214_0.png)\n\
    \nWhen composing many non-linearities (like the activation non-linearity in a\
    \ deep or recurrent neural network), the result is highly non-linear, typically\
    \ with most of the values associated with a tiny derivative, some values with\
    \ a large derivative, and many ups and downs (not shown here).\n\nThis arises\
    \ because the Jacobian (matrix of derivatives) of a composition is the product\
    \ of the Jacobian of each stage, i.e. if\n\n\\[\nf = f_T \\circ f_{T-1} \\circ\
    \ \\ldots \\circ f_2 \\circ f_1\n\\]\n\nThe Jacobian matrix of derivatives of\
    \ \\(f(x)\\) with respect to its input vector \\(x\\) is\n\n\\[\nf' = f'_T f'_{T-1}\
    \ \\ldots f'_2 f'_1\n\\]\n\nwhere\n\n\\[\nf' = \\frac{\\partial f(x)}{\\partial\
    \ x}\n\\]\n\nand\n\n\\[\nf'_t = \\frac{\\partial f_t(\\alpha_t)}{\\partial \\\
    alpha_t}\n\\]\n\nwhere \\(\\alpha_t = f_{t-1}(f_{t-2}(\\ldots f_2(f_1(x))\\ldots))\\\
    ), i.e. composition has been replaced by matrix multiplication.\n"
  mdcn: "\n\n## 学习率\n\n- 批量模式下训练的线性网络示例。\n\n![](img/a04b187c89c5018c5ef6132980e27196_207_0.png)\n\
    \n- 随机学习，η = 0.2\n\n![](img/a04b187c89c5018c5ef6132980e27196_208_0.png)\n\n![](img/a04b187c89c5018c5ef6132980e27196_208_1.png)\n\
    \n## 动量的引入\n\n- 误差曲面通常存在高原，在那里权重“过多”（尤其当层数很大时），因此误差对其中任何一个权重的依赖都很弱。\n\n- 在随机反向传播中加入前一次权重更新的一部分\
    \ α\n\n  **w(m + 1) = w(m) + (1 − α)Δw_bp(m) + αΔw(m − 1)**\n\n  其中 Δw_bp(m) 是反向传播算法所要求的\
    \ w(m) 的变化\n\n  **Δw(m) = w(m) − w(m − 1)**\n\n- 允许网络在误差曲面存在高原时更快地学习。\n\n![](img/a04b187c89c5018c5ef6132980e27196_210_0.png)\n\
    \n## 高原与悬崖\n\n- 训练深度神经网络的误差曲面包含局部最小值、高原（误差随权重变化仅轻微变化的区域）以及悬崖（梯度急剧上升的区域）。\n\n-\
    \ 高原和悬崖是训练神经网络比局部最小值更重要的障碍\n  - 在高原中有效更新参数非常困难（或很慢）。\n  - 当参数接近悬崖区域时，梯度更新步可能使学习器移动到非常糟糕的配置，破坏最近训练迭代中取得的许多进展。\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_211_0.png)\n\n![](img/a04b187c89c5018c5ef6132980e27196_211_1.png)\n\
    \n## 高阶非线性\n\n- 二阶方法或动量假设最小值周围为二次形状。它们在低曲率方向上增大步长，在高曲率方向上减小步长（山谷的陡峭侧面）。\n\n- 在训练深度模型时，高阶导数引入了大量非线性，这通常不具有二阶“山谷”图像在我们脑海中构建的良好对称形状。\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_212_0.png)\n\n## 梯度裁剪\n\n- 为解决悬崖的存在，一个有用的启发式方法是裁剪梯度的大小，仅在梯度大小超过阈值（即超参数）时保留其方向。这有助于避免接近悬崖时，无论从上方还是下方接近，都会发生的破坏性大步移动。\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_213_0.png)\n\n## 梯度消失与爆炸\n\n梯度消失/爆炸问题\n\
    \n- 训练非常深的网络会使问题变得更加严重，因为经过多层反向传播后，梯度变得非常小或非常大。\n\n- 在非常深的网络和循环网络中，最终输出由大量非线性变换组成。\n\
    \n- 尽管这些非线性阶段中的每一个都可能相对平滑，但它们的组合会变得“更非线性”，其含义是整个组合的导数往往非常小或非常大，并且有更多的起伏。\n\n![](img/a04b187c89c5018c5ef6132980e27196_214_0.png)\n\
    \n当组合许多非线性（如深度或循环神经网络中的激活非线性）时，结果高度非线性，通常大部分值与微小的导数相关联，一些值与大的导数相关联，并且有许多起伏（此处未显示）。\n\
    \n这源于组合的雅可比矩阵（导数矩阵）是每个阶段雅可比矩阵的乘积，即如果\n\n\\[\nf = f_T \\circ f_{T-1} \\circ \\\
    ldots \\circ f_2 \\circ f_1\n\\]\n\n\\(f(x)\\) 关于其输入向量 \\(x\\) 的导数雅可比矩阵为\n\n\\\
    [\nf' = f'_T f'_{T-1} \\ldots f'_2 f'_1\n\\]\n\n其中\n\n\\[\nf' = \\frac{\\partial\
    \ f(x)}{\\partial x}\n\\]\n\n并且\n\n\\[\nf'_t = \\frac{\\partial f_t(\\alpha_t)}{\\\
    partial \\alpha_t}\n\\]\n\n其中 \\(\\alpha_t = f_{t-1}(f_{t-2}(\\ldots f_2(f_1(x))\\\
    ldots))\\)，即组合已被矩阵乘法所取代。\n\n"
