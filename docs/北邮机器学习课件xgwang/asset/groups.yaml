    \n$$z_k = f(net_k)$$\n\n$$net_k = \\sum_{j=1}^{n_H} w_{kj} y_j + w_{k0}$$\n\n\
    ![](img/a04b187c89c5018c5ef6132980e27196_70_1.png)\n\n$$\\frac{\\partial J}{\\\
    partial w_{kj}} = \\frac{\\partial J}{\\partial net_k}\\frac{\\partial net_k}{\\\
    partial w_{kj}} = -\\delta_k \\frac{\\partial net_k}{\\partial w_{kj}}$$\n\n-\
