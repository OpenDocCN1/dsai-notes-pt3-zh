    ## Sequence-to-sequence language translation


    ![](img/a04b187c89c5018c5ef6132980e27196_171_0.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_171_1.png)


    The figure shows a 2-dimensional PCA projection of the LSTM hidden states that
    are obtained after processing the phrases in the figures. The phrases are clustered
