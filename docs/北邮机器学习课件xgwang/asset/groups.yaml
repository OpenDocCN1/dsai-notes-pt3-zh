    \ 长短期记忆网络\n- 4. 应用\n\n## 对序列数据建模\n\n- 从某个分布中对数据序列进行采样\n  $P(x_1,\\dots,x_T)$\n\
    - 生成自然语句来描述图像\n  $P(y_1,\\dots,y_T\\mid I)$\n- 从视频序列中进行活动识别\n  $P(y\\mid x_1,\\\
