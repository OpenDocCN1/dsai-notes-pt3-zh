    \n$$f_t = \\sigma(W_{fx} x_t + W_{fh} h_{t-1} + b_f), \\quad i_t = \\sigma(W_{ix}\
    \ x_t + W_{ih} h_{t-1} + b_i)$$\n\n$$o_t = \\sigma(W_{ox} x_t + W_{oh} h_{t-1}\
    \ + b_o)$$\n\n$$g_t = \\tanh(W_{gx} x_t + W_{gh} h_{t-1} + b_g), \\quad c_t =\
    \ f_t \\odot c_{t-1} + i_t \\odot g_t$$\n\n$$h_t = o_t \\odot \\tanh(c_t), \\\
    quad z_t = \\mathrm{softmax}(W_z h_t + b_z)$$\n\n![](img/a04b187c89c5018c5ef6132980e27196_165_0.png)\n\
    \n- The core of LSTM is a memory cell $c_t$ which encodes, at every time step,\
    \ the knowledge of the inputs that have been observed up to that step.\n- The\
    \ memory cell $c_t$ has the same inputs ($h_{t-1}$ and $x_t$) and outputs ($h_t$)\
    \ as a normal recurrent network, but has more parameters and a system of gating\
    \ units that controls the flow of information.\n- $c_t$ has a linear self-connection\
    \ similar to the leaky units, but the self-connection weight is controlled by\
    \ a forget gate unit $f_t$, that sets this weight to a value between 0 and 1 via\
    \ a sigmoid unit:\n  $$f_t = \\sigma(W_{fx} x_t + W_{fh} h_{t-1} + b_f)$$\n- The\
    \ input gate unit $i_t$ is computed similarly to the forget gate, but with its\
    \ own parameters.\n- The output $h_t$ of the LSTM cell can also be shut off, via\
    \ the output gate $o_t$ ($h_t = o_t \\odot \\tanh(c_t)$), which is also a sigmoid\
    \ unit for gating:\n  $$o_t = \\sigma(W_{ox} x_t + W_{oh} h_{t-1} + b_o)$$\n\n\
    - (c): Depth can also be added in the hidden-to-output transform.\n- (d): A hierarchy\
    \ of RNNs, which can be stacked on top of each other.\n\n![](img/a04b187c89c5018c5ef6132980e27196_168_0.png)\n\
    \n## Sequence-to-sequence language translation\n\n- Sutskever, Vinyals, and Le,\
    \ NIPS 2014.\n- Model $P(Y_1,\\dots,Y_{T'}|X_1,\\dots,X_T)$. The input and output\
    \ sequences have different lengths, are not aligned, and even do not have a monotonic\
    \ relationship.\n- Use one LSTM to read the input sequence $(x_1,\\dots,x_T)$,\
    \ one timestep at a time, to obtain a large fixed-dimensional vector representation\
    \ $v$, which is given by the last hidden state of the LSTM.\n- Then conditioned\
    \ on $v$, a second LSTM generates the output sequence $(y_1,\\dots,y_{T'})$ and\
    \ computes its probability:\n\n$$p(y_1,\\dots,y_{T'}|v)=\\prod_{t=1}^{T'}p(y_t|v,y_1,\\\
    dots,y_{t-1})$$\n\n![](img/a04b187c89c5018c5ef6132980e27196_169_0.png)\n\nThe\
    \ model reads an input sentence \"ABC\" and produces \"WXYZ\" as the output sentence.\
    \ The model stops making predictions after outputting the end-of-sentence token.\n\
    \n- It requires each sentence to end with a special end-of-sequence symbol `\"\
    <EOS>\"`, which enables the model to define a distribution over sequences of all\
    \ possible lengths.\n- It is valuable to reverse the order of the words of the\
    \ input sequence. For example, instead of mapping the sentence a, b, c to the\
    \ sentence α, β, γ, the LSTM is asked to map c, b, a to α, β, γ, where α, β, γ\
    \ is the translation of a, b, c. This way, a is in close proximity to α, b is\
    \ fairly close to β, and so on, a fact that makes it easy for stochastic gradient\
    \ descent to \"establish communication\" between the input and the output. It\
    \ introduces many short-term dependencies in the data that make the optimization\
    \ problem much easier.\n"
  mdcn: "\n\n## 自连接的泄漏单元\n\n$$h_{t+1} = (1 - 1/\\tau) h_t + 1/\\tau \\tanh(W_{xh}\
    \ x_t + W_{hh} h_t + b_h)$$\n\n- 状态 $h_{t+1}$ 的新值是 $h_t$ 的线性和非线性部分的组合。\n- 误差更容易通过红色线条的路径反向传播，这些路径是线性的。\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_162_0.png)\n\n- 当 $\\tau = 1$ 时，没有线性自递归，只有我们在普通循环网络中可以找到的非线性更新。\n\
    - 当 $\\tau > 1$ 时，这种线性递归允许梯度更容易传播。当 $\\tau$ 很大时，状态变化非常缓慢，整合与输入序列相关的过去值。\n- $\\\
    tau$ 控制着遗忘旧状态的速率。它可以被视为先前模型思想的平滑变体。\n- 通过将不同的时间尺度 $\\tau$ 与不同的单元关联，可以得到对应于不同遗忘率的不同路径。\n\
    - 这些时间常数可以手动固定，也可以作为自由参数进行学习。\n\n## 长短期记忆 LSTM 网络\n\n$$f_t = \\sigma(W_{fx} x_t\
    \ + W_{fh} h_{t-1} + b_f), \\quad i_t = \\sigma(W_{ix} x_t + W_{ih} h_{t-1} +\
    \ b_i)$$\n\n$$o_t = \\sigma(W_{ox} x_t + W_{oh} h_{t-1} + b_o)$$\n\n$$g_t = \\\
    tanh(W_{gx} x_t + W_{gh} h_{t-1} + b_g), \\quad c_t = f_t \\odot c_{t-1} + i_t\
    \ \\odot g_t$$\n\n$$h_t = o_t \\odot \\tanh(c_t), \\quad z_t = \\mathrm{softmax}(W_z\
    \ h_t + b_z)$$\n\n![](img/a04b187c89c5018c5ef6132980e27196_165_0.png)\n\n- LSTM\
    \ 的核心是一个记忆单元 $c_t$，它在每个时间步编码到该步为止所观察到的输入的知识。\n- 记忆单元 $c_t$ 与普通循环网络具有相同的输入 $h_{t-1}$\
    \ 和 $x_t$ 以及输出 $h_t$，但具有更多参数和一套门控单元来控制信息流。\n- $c_t$ 具有类似于泄漏单元的线性自连接，但自连接权重由遗忘门单元\
    \ $f_t$ 控制，该单元通过 sigmoid 单元将此权重设置为 0 到 1 之间的值：\n  $$f_t = \\sigma(W_{fx} x_t +\
    \ W_{fh} h_{t-1} + b_f)$$\n- 输入门单元 $i_t$ 与遗忘门类似计算，但使用自己的参数。\n- LSTM 单元的输出 $h_t$\
    \ 也可以通过输出门 $o_t$ 关闭 $h_t = o_t \\odot \\tanh(c_t)$，它也是用于门控的 sigmoid 单元：\n  $$o_t\
    \ = \\sigma(W_{ox} x_t + W_{oh} h_{t-1} + b_o)$$\n\n- (c): 深度也可以添加到隐藏到输出的变换中。\n\
    - (d): RNN 的层次结构，可以彼此堆叠。\n\n![](img/a04b187c89c5018c5ef6132980e27196_168_0.png)\n\
    \n## 序列到序列语言翻译\n\n- Sutskever, Vinyals, and Le, NIPS 2014.\n- 模型 $P(Y_1,\\dots,Y_{T'}|X_1,\\\
    dots,X_T)$。输入和输出序列长度不同，未对齐，甚至没有单调关系。\n- 使用一个 LSTM 按时间步读取输入序列 $(x_1,\\dots,x_T)$，得到一个大型的固定维度向量表示\
    \ $v$，它由 LSTM 的最后一个隐藏状态给出。\n- 然后以 $v$ 为条件，第二個 LSTM 生成输出序列 $(y_1,\\dots,y_{T'})$\
    \ 并计算其概率：\n\n$$p(y_1,\\dots,y_{T'}|v)=\\prod_{t=1}^{T'}p(y_t|v,y_1,\\dots,y_{t-1})$$\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_169_0.png)\n\n模型读取输入句子 \"ABC\" 并生成\
    \ \"WXYZ\" 作为输出句子。模型在输出句末标记后停止预测。\n\n- 它要求每个句子以特殊的结束序列符号 `\"<EOS>\"` 结尾，这使得模型能够定义所有可能长度的序列上的分布。\n\
    - 将输入序列的词序反转是有价值的。例如，不是将句子 a, b, c 映射到句子 α, β, γ，而是要求 LSTM 将 c, b, a 映射到 α, β,\
    \ γ，其中 α, β, γ 是 a, b, c 的翻译。这样，a 与 α 接近，b 与 β 相对接近，等等，这一事实使得随机梯度下降很容易在输入和输出之间“建立通信”。它在数据中引入了许多短期依赖关系，使得优化问题变得容易得多。\n\
    \n"
