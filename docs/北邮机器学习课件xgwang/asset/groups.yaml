  mdcn: "\n\n## 梯度消失与梯度爆炸\n\n- 训练一个非常深的网络会使问题变得更加严重，因为经过多层反向传播后，梯度会变得非常小或非常大\n- 在建模长期依赖时，RNN\
    \ 可以被视为一个深层网络\n\n![](img/a04b187c89c5018c5ef6132980e27196_155_0.png)\n\n- 在非常深的网络和循环网络中，最终输出由大量非线性变换组成\n\
    - 尽管其中每一个非线性阶段可能相对平滑，但它们的组合会变得“更非线性”，其含义是整个组合的导数往往非常小或非常大，且有更多的起伏\n\n![](img/a04b187c89c5018c5ef6132980e27196_156_0.png)\n\
    \n当组合许多非线性函数时（如深度或循环神经网络中的激活非线性），结果高度非线性，通常大部分值对应极小的导数，一些值对应较大的导数，并且有许多起伏（此处未显示）\n\
    \n这源于雅可比矩阵（导数矩阵）的组合是各阶段雅可比矩阵的乘积，即如果\n\nf = f_T ∘ f_{T-1} ∘ ... ∘ f_2 ∘ f_1\n\n\
    f(x) 关于其输入向量 x 的导数雅可比矩阵为\n\nf' = f'_T f'_{T-1} ... f'_1\n\n其中\n\nf' = ∂f(x)/∂x\n\
    \n且\n\nf'_i = ∂f_i(α_i)/∂α_i\n\n其中 α_i = f_{i-1}(f_{i-2}(... f_2(f_1(x))...))，即组合被矩阵乘法所取代\n\
    \n- 在标量情况下，我们可以想象相乘许多数往往会变得非常大或非常小\n- 在所有乘积中的数都具有相同值 α 的特殊情况下，这很明显，因为当 T 增大时，α^T\
    \ 在 α < 1 时趋向于 0，在 α > 1 时趋向于 ∞\n- 非相同数的更一般情况可以通过取这些数的对数，将其视为随机，并计算这些对数之和的方差来理解。尽管可能发生一些抵消，但方差随\
    \ T 增长。如果这些数是独立的，它随 T 线性增长，这意味着乘积大致按 e^T 增长。\n- 该分析可以推广到相乘方阵的情况\n\n## 学习长期依赖的困难\n\
    \n- 考虑时间 T 处的损失 $L_T$ 关于循环函数 $F_\\theta$ 的参数 $\\theta$ 的梯度\n\n  $h_t = F_\\theta(h_{t-1},\
    \ x_t)$\n\n  $\\frac{\\partial L_T}{\\partial \\theta} = \\sum_{t=1}^{T} \\frac{\\\
    partial L_T}{\\partial h_T} \\frac{\\partial h_T}{\\partial h_t} \\frac{\\partial\
    \ F_\\theta(h_{t-1}, x_t)}{\\partial \\theta}$\n\n  $\\frac{\\partial L_T}{\\\
    partial h_T} \\frac{\\partial h_T}{\\partial h_t} \\frac{\\partial F_\\theta(h_{t-1},\
    \ x_t)}{\\partial \\theta}$ 在 $T - t$ 很大时编码长期依赖\n\n![](img/a04b187c89c5018c5ef6132980e27196_159_0.png)\n\
    \n∂h_T/∂h_t = ∂h_T/∂h_{T-1} ∂h_{T-1}/∂h_{T-2} ... ∂h_{t+1}/∂h_t\n\n- 每一层雅可比矩阵\
    \ ∂h_{t+1}/∂h_t 是两个矩阵的乘积：(a) 循环矩阵 W 和 (b) 对角矩阵，其条目为与隐藏单元相关联的非线性函数的导数，根据时间步而变化。这使得连续的雅可比矩阵很可能具有相似的特征向量，从而使这些雅可比矩阵的乘积更快地爆炸或消失\n\
    \n- ∂h_T/∂h_t 是跨度为 T − t 的项的加权和，其权重对于将状态 t 与状态 T 关联的长期依赖而言呈指数级变小（或变大）\n\n- 关于长期依赖的信号往往会被源自短期依赖的最小波动所掩盖\n\
    \n## 在展开流图中结合短路径和长路径\n\n- 更长的延迟连接允许过去状态通过短路径连接到未来状态\n- 梯度会随时间步数呈指数消失\n- 如果我们具有时间延迟为\
    \ D 的循环连接，那么而不是在 T 步上按 O(λ^T) 消失或爆炸（其中 λ 是雅可比矩阵 ∂h_t/∂h_{t-1} 的最大特征值），展开的循环网络现在具有梯度按\
    \ O(λ^{T/D}) 增长的路径，因为有效步数是 T/D\n\n![](img/a04b187c89c5018c5ef6132980e27196_161_0.png)\n\
    \n"
