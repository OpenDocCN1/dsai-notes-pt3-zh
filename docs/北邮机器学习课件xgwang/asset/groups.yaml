- raw:
  - '[PAGE 146]


    # Network with output recurrence


    Memory is from the prediction of the previous target, which limits its expressive
    power but makes it easier to train


    ![](img/a04b187c89c5018c5ef6132980e27196_146_0.png)'
  - '[PAGE 147]


    # Generative RNN modeling P(x₁, ..., x_T)


    +   - It can generate sequences from this distribution

    +   - At the training stage, each x_t of the observed sequence serves both as
    input (for the current time step) and as target (for the previous time step)

    +   - The output z_t encodes the parameters of a conditional distribution P(x_{t+1}|x₁,
    ..., x_t) = P(x_{t+1}|z_t) for x_{t+1} given the past sequence x₁, ..., x_t


    ![](img/a04b187c89c5018c5ef6132980e27196_147_0.png)'
  - '[PAGE 148]


    # Generative RNN modeling P(x₁, ..., x_T)


    Cost function: negative log-likelihood of x, L = Σ_t L_t


    P(x) = P(x₁, ..., x_T) = ∏_{t=1}^T P(x_t | x₁, ..., x_{t-1})


    L_t = - log P(x_t | x₁, ..., x_{t-1})


    In generative mode, x_{t+1} is sampled from the conditional distribution P(x_{t+1}
    | x₁, ..., x_t) = P(x_{t+1} | z_t) (dashed arrows) and then that generated sample
    x_{t+1} is fed back as input for computing the next state h_{t+1}


    ![](img/a04b187c89c5018c5ef6132980e27196_148_0.png)'
  - '[PAGE 149]


    # Generative RNN modeling P(x₁, ..., x_T)


    +   - If RNN is used to generate sequences, one must also incorporate in the output
    information allowing to stochastically decide when to stop generating new output
    elements

    +   - In the case when the output is a symbol taken from a vocabulary, one can
    add a special symbol corresponding to the end of a sequence

    +   - One could also directly directly model the length T of the sequence through
    some parametric distribution. P(x₁, ..., x_T) is decomposed into


    P(x₁...x_T) = P(x₁...x_T | T) P(T)'
  - '[PAGE 150]


    # RCNNs to represent conditional distributions P(y|x)


    +   - If x is a fixed-sized vector, we can simply make it an extra input of the
    RNN that generates the y sequence. Some common ways of providing the extra input

    +     - as an extra input at each time step, or

    +     - as the initial state h₀, or

    +     - both

    +   - Example: generate caption for an image


    ![](img/a04b187c89c5018c5ef6132980e27196_150_0.png)'
  - '[PAGE 151]


    # RCNNs to represent conditional distributions P(y|x)


    +   - The input x is a sequence of the same length as the output sequence y

    +   - Removing the dash lines, it assumes y_i are independent of each other when
    the past input sequence is given, i.e. P(y_i|y_1,...,y_{i-1},x_1,...,x_{i-1})
    = P(y_i|x_i,...,x_{i-1})

    +   - Without the conditional independence assumption, add the dash lines and
    the prediction of y_{t-1} is based on both the past x''s and past y''s


    ![](img/a04b187c89c5018c5ef6132980e27196_151_0.png)'
  - '[PAGE 152]


    # Bidirectional RNNs


    +   - In some applications, we want to output at time t a prediction regarding
    an output which may depend on the whole input sequence

    +     - In speech recognition, the correct interpretation of the current sound
    as a phoneme may depend on the next few phonemes because co-articulation and may
    depend on the next few words because of the linguistic dependencies between words

    +   - Bidirectional recurrent neural network was proposed to address such need

    +   - It combines a forward-going RNN and a backward-going RNN

    +   - The idea can be extended to 2D input with four RNN going in four directions'
  - '[PAGE 153]


    # Bidirectional RNNs


    g_t summaries the information from the past sequence, and h_t summaries the information
    from the future sequence


    ![](img/a04b187c89c5018c5ef6132980e27196_153_0.png)'
  - '[PAGE 154]


    # Plateaus and cliffs


    +   - The error surfaces of training deep neural networks include local minima,
    plateaus (regions where error varies only slightly as a function of weights),
    and cliffs (regions where the gradients rise sharply)

    +   - Plateaus and cliffs are more important barriers to training neural networks
    than local minima

    +     - It is very difficult (or slow) to effectively update the parameters in
    plateaus

    +     - When the parameters approach a cliff region, the gradient update step
    can move the learner towards a very bad configuration, ruining much progress made
    during recent training iterations.


    ![](img/a04b187c89c5018c5ef6132980e27196_154_0.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_154_1.png)'
