    parce qu’ils pourraient potentiellement causer des interférences avec les appareils
    de navigation, mais aussi parce qu’ils pourraient interférer avec les tours de
    téléphone cellulaire lorsqu’ils sont dans l’air », dit UNK. |

    | 真实 | « Les téléphones portables sont véritablement un problème, non seulement
    parce qu’ils pourraient éventuellement créer des interférences avec les instruments
