  - "[PAGE 69]\n\n# Gradient descent\n\n+   - Weights are initialized with random\
    \ values, and then are changed in a direction reducing the error\n+   \n+    \
    \ Δw = -η ∂J/∂W\n+   \n+     or in component form\n+   \n+     Δw_pq = -η ∂J/∂w_pq\n\
    +   \n+     where η is the learning rate.\n\n+   - Iterative update\n+   \n+ \
    \    w(m + 1) = w(m) + Δw(m)"
  - '[PAGE 70]


    # Hidden-to-output weights $w_{kj}$


    ![](img/a04b187c89c5018c5ef6132980e27196_70_0.png)


    Group truth


    $z_k = f(net_k)$


    $net_k = \sum_{j=1}^{n_H} y_j w_{jk} + w_{k0}$


    ![](img/a04b187c89c5018c5ef6132980e27196_70_1.png)'
  - '[PAGE 71]


    # Hidden-to-output weights $w_{kj}$


    $\frac{\partial J}{\partial w_{kj}} = \frac{\partial J}{\partial net_k}\frac{\partial
    net_k}{\partial w_{kj}} = -\delta_k \frac{\partial net_k}{\partial w_{kj}}$


    +   Sensitivity of unit $k$

    +   $\delta_k = -\frac{\partial J}{\partial net_k} = -\frac{\partial J}{\partial
    z_k}\frac{\partial z_k}{\partial net_k} = (t_k - z_k)f''(net_k)$

    +   Describe how the overall error changes with the unit''s net activation.


    +   Weight update rule. Since $\partial net_k / \partial w_{kj} = y_j,$

    +   $\Delta w_{kj} = \eta \delta_k y_j = \eta (t_k - z_k)f''(net_k) y_j.$'
  - '[PAGE 72]


