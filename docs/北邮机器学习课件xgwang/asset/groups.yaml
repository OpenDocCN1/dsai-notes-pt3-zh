- raw:
  - '[PAGE 56]


    # History of neural network


    +   - Unsupervised deep learning from large scale images

    +     - Andrew Ng et al. 2011

    +     - Unsupervised feature learning

    +     - 16000 CPUs

    +   - Large-scale supervised deep learning in ImageNet image classification

    +     - Krizhevsky, Sutskever, and Hinton 2012

    +     - Supervised learning with convolutional neural network

    +     - No unsupervised pre-training'
  - '[PAGE 57]


    # Two-layer neural networks model linear classifiers


    ![](img/a04b187c89c5018c5ef6132980e27196_57_0.png)


    (Duda et al. Pattern Classification 2000)


    g(x) = f(∑_{i=1}^{d} x_i w_i + w_0) = f(w'' x)


    f(s) = { 1, if s ≥ 0 ; -1, if s < 0 }'
  - '[PAGE 58]


    # Two-layer neural networks model linear classifiers


    +   - A linear classifier cannot solve the simple exclusive-OR problem


    ![](img/a04b187c89c5018c5ef6132980e27196_58_0.png)'
  - '[PAGE 59]


    # Add a hidden layer to model nonlinear classifiers


    ![](img/a04b187c89c5018c5ef6132980e27196_59_0.png)


    (Duda et al. Pattern Classification 2000)'
  - '[PAGE 60]


    # Three-layer neural network


    ![](img/a04b187c89c5018c5ef6132980e27196_60_0.png)


    For C-class classification problem, the target vectors are represented as

    (1...0...0)

    ...

    (0...1...0)

    ...

    (0...0...1)'
  - "[PAGE 61]\n\n# Three-layer neural network\n\n+   - Net activation: each hidden\
    \ unit j computes the weighted sum of its inputs\n+   \n+     $net_j = \\sum_{i=1}^{d}\
    \ x_i w_{ij} + w_{j0} = \\sum_{i=0}^{d} x_i w_{ij} = w_j^T x$\n\n+   - Activation\
    \ function: each hidden unit emits an output that is a nonlinear function of its\
    \ activation\n+   \n+     $y_j = f(net_j)$\n+   \n+     $f(net) = Sgn(net) = \\\
    begin{cases} 1, & \\text{if } net \\ge 0 \\\\ -1, & \\text{if } net < 0 \\end{cases}$\n\
    \nThere are multiple choices of the activation function as long as they are continuous\
    \ and differentiable almost everywhere. Activation functions could be different\
    \ for different nodes."
  - '[PAGE 62]


    # Three-layer neural network


    +   Net activation of an output unit k


    net_k = Σ_{i=1}^{n_h} y_i w_{kj} + w_{k0} = Σ_{j=0}^{n_h} y_j w_{kj} = w_k^T y


    +   Output unit emits


    z_k = f(net_k)


    +   The output of the neural network is equivalent to a set of discriminant functions


    g_k(x) = z_k = f( Σ_{j=1}^{n_h} w_{kj} f( Σ_{i=1}^{d} w_{ji} x_i + w_{j0} ) +
    w_{k0} )'
  - '[PAGE 63]


    # Expressive power of a three-layer neural network


    +   - It can represent **any** discriminant function

    +   - However, the number of hidden units required can be very large...

    +   - Most widely used pattern recognition models (such as SVM, boosting, and
    KNN) can be approximated as neural networks with one or two hidden layers. They
    are called models with shallow architectures.

    +   - Shallow models divide the feature space into regions and match templates
    in local regions. O(N) parameters are needed to represent N regions.

    +   - Deep architecture: the number of hidden nodes can be reduced exponentially
    with more layers for certain problems.'
  - '[PAGE 64]


    # Expressive power of a three-layer neural network


    ![](img/a04b187c89c5018c5ef6132980e27196_64_0.png)


    KNN

    input x

    hidden d(x, x_i)

    output g(x)=label

    j = argmin_i d(x, x_i)


    ![](img/a04b187c89c5018c5ef6132980e27196_64_1.png)


    SVM

    input x

    hidden K(x, x_i)

    output g(x)=b + sum_i a_i K(x, x_i)


    ![](img/a04b187c89c5018c5ef6132980e27196_64_2.png)'
  - '[PAGE 65]


    <!-- no content -->'
  - '[PAGE 66]


    # Backpropagation


    +   - The most general method for supervised training of multilayer neural network

    +   - Present an input pattern and change the network parameters to bring the
    actual outputs closer to the target values

    +   - Learn the input-to-hidden and hidden-to-output weights

    +   - However, there is no explicit teacher to state what the hidden unit’s output
    should be. Backpropagation calculates an effective error for each hidden unit,
    and thus derive a learning rule for the input-to-hidden weights.'
  - '[PAGE 67]


    <!-- no content -->'
  - '[PAGE 68]


    # Training error


    J(W) = 1/2 Σ_{k=1}^c (t_k - z_k)^2 = 1/2 ||t - z||^2


    +   - Differentiable

    +   - There are other choices, such as cross entropy


    J(W) = - Σ_{k=1}^c t_k log(z_k)


    Both {z_k} and {t_k} are probability distributions.'
