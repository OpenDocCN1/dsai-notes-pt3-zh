  - '[PAGE 250]


    # Unsupervised DA method: DAN (1.2)


    DAN that matches the shift in marginal distributions across domains by adding
    multiple adaptation layers and exploring multiple kernels, assuming that the conditional
    distributions remain unchanged.


    Adapting a single layer cannot undo the dataset bias between the source and the
    target, since there are other layers that are not transferable. The multiple kernels
    with different bandwidths can match both the low-order moments and high-order
    moments to minimize the domain discrepancy.


    𝒦 = { k = Σ_{u=1}^{m} β_u k_u : Σ_{u=1}^{m} β_u = 1, β_u ≥ 0, ∀u }


    ![](img/a04b187c89c5018c5ef6132980e27196_250_0.png)


    > [5] M. Long , Y. Cao , J. Wang , M. Jordan , Learning transferable features
    with deep adaptation networks, in ICML, 2015, pp. 97–105 .'
  - '[PAGE 251]


    # Unsupervised DA method: RTN (1.3)


    min 1/n Σ_{i=1}^n L(x_i^s, y_i^s, θ)


    Since deep features eventually transition from general to specific along the network:
    (1) fully connected layers fc6–fc8 are tailored to model task-specific structures,
    hence they are not safely transferable and should be adapted with MK-MMD minimization;
    (2) supervised classifiers are not safely transferable, hence they are bridged
    by the residual layers fc9–fc10 such that f_S(x) = f_T(x) + Δf(f_T(x)).


    ![](img/a04b187c89c5018c5ef6132980e27196_251_0.png)


    Instead of using the residual block to model the feature mapping, we use it to
    bridge the source classifier f_S(x) and target classifier f_T(x) by x ≜ f_T(x),
    H(x) ≜ f_S(x), and F(x) ≜ Δf(f_T(x))


    ![](img/a04b187c89c5018c5ef6132980e27196_251_1.png)


    > [6] M. Long , H. Zhu , J. Wang , M.I. Jordan , Unsupervised domain adaptation
    with residual transfer networks, in NIPS, 2016, pp. 136–144 .'
  - '[PAGE 252]


    # Unsupervised DA method: JAN (1.4)


    Transfer learning will become more challenging as domains may change by the joint
    distributions P(X,Y) of input features X and output labels Y. The distribution
    shifts may stem from the marginal distributions P(X), the conditional distributions
    P(Y|X), or both.


    Kernel embeddings can be readily generalized to joint distributions of two or
    more variables using tensor product feature spaces.


    C_{X^{1:m}}(P) \triangleq \mathbb{E}_{X^{1:m}}[\otimes_{\ell=1}^{m}\phi^{\ell}(X^{\ell})]
    = \int_{\times_{\ell=1}^{m}\Omega^{\ell}} (\otimes_{\ell=1}^{m}\phi^{\ell}(x^{\ell}))
    dP(x^{1},...,x^{m})


    D_{\mathcal{L}}(P,Q) \triangleq \|C_{Z^{s,1:|\mathcal{L}|}}(P) - C_{Z^{t,1:|\mathcal{L}|}}(Q)\|_{\otimes_{\ell=1}^{|\mathcal{L}|}\mathcal{H}^{\ell}}^{2}


    ![](img/a04b187c89c5018c5ef6132980e27196_252_0.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_252_1.png)


    (a) Joint Adaptation Network (JAN)


    (b) Adversarial Joint Adaptation Network (JAN-A)


    > [7] M. Long, J. Wang, and M. I. Jordan. Deep transfer learning with joint adaptation
    networks. arXiv preprint arXiv:1605.06636, 2016.'
