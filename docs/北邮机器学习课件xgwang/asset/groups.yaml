  - '[PAGE 255]


    # Unsupervised DA method: RevGrad (2.1)


    The domain-adversarial neural network (DANN) integrated a gradient reversal layer
    (GRL) to train a feature extractor by maximizing the domain classifier loss and
    simultaneously minimizing the label predictor loss.


    ![](img/a04b187c89c5018c5ef6132980e27196_255_0.png)


    [8] Y. Ganin , V. Lempitsky , Unsupervised domain adaptation by backpropagation,
    in ICML, 2015, pp. 1180–1189 .'
  - "[PAGE 256]\n\n# Unsupervised DA method: RevGrad (2.1)\n\n# 1 Max-min optimization\n\
    \nE(θ_f, θ_y, θ_d) = Σ_{i=1..N \\ d_i=0} L_y(G_y(G_f(x_i; θ_f); θ_y), y_i) - λ\
    \ Σ_{i=1..N} L_d(G_d(G_f(x_i; θ_f); θ_d), y_i) = Σ_{i=1..N \\ d_i=0} L_y^i(θ_f,\
    \ θ_y) - λ Σ_{i=1..N} L_d^i(θ_f, θ_d)  (1)\n\n(θ̂_f, θ̂_y) = arg min_{θ_f, θ_y}\
    \ E(θ_f, θ_y, θ̂_d)  (2)\nθ̂_d = arg max_{θ_d} E(θ̂_f, θ̂_y, θ_d).  (3)\n\n# 2\
    \ Gradient reversal layer\n\nÊ(θ_f, θ_y, θ_d) = Σ_{i=1..N \\ d_i=0} L_y(G_y(G_f(x_i;\
    \ θ_f); θ_y), y_i) + Σ_{i=1..N} L_d(G_d(R_λ(G_f(x_i; θ_f)); θ_d), y_i)  (9)\n\n\
    R_λ(x) = x\n dR_λ / dx = -λ I\n\n![](img/a04b187c89c5018c5ef6132980e27196_256_0.png)"
