  mdcn: "\n\n## 无监督域自适应\n\n- 传统深度学习\n\n  $$\\min \\frac{1}{n}\\sum_{i=1}^{n} L(x_i,\
    \ y_i, \\theta)$$\n\n- 特征自适应\n\n  $$\\min \\frac{1}{n}\\sum_{i=1}^{n} L(\\phi(x_i^s),\
    \ y_i^s, \\theta)$$\n\n- 实例自适应\n\n  $$\\min \\frac{1}{n}\\sum_{i=1}^{n} w_i L(x_i^s,\
    \ y_i^s, \\theta)$$\n\n- 模型自适应\n\n  $$\\min \\frac{1}{n}\\sum_{i=1}^{n} L(x_i^s,\
    \ y_i^s, \\theta)$$\n\n- KL 散度：\n\n  $$KL(P,Q)=\\sum_i P(i)\\log\\frac{P(i)}{Q(i)}$$\n\
    \n- MMD：\n\n  $$MMD^2(\\mathcal{D}_s,\\mathcal{D}_t)=\\left\\|\\frac{1}{M}\\sum_{i=1}^{M}\\\
    phi(x_i^s)-\\frac{1}{N}\\sum_{i=1}^{N}\\phi(x_i^t)\\right\\|_{\\mathcal{H}}^2$$\n\
    \n- $\\mathcal{H}$-散度：\n\n  $$\\hat{d}_\\mathcal{A}=2(1-2\\varepsilon)$$\n\n-\
    \ Wasserstein 距离（Earth mover distance）\n\n  $$W(P_1,P_2)=\\inf_{\\gamma\\sim\\\
    prod(P_1,P_2)}\\mathbb{E}_{(x,y)\\sim\\gamma}[||x-y||]$$\n\n## 无监督域自适应方法\n\n大多数深度域自适应方法试图通过将两个域映射到一个域不变的特征空间来学习更具可迁移性的表示，然后直接将仅从源标签学习到的分类器应用于目标域。\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_247_0.png)\n\n一些论文通过最小化域差异的某些度量来探索域不变特征空间，例如统计损失、对抗损失和重构损失\n\
    \n### 无监督域自适应方法：DDC (1.1)\n\n![](img/a04b187c89c5018c5ef6132980e27196_249_0.png)\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_249_1.png)\n\n| 方法 | A → W | D → W\
    \ | W → D | 平均值 |\n|---|---:|---:|---:|---:|\n| GEK(PLS,PCA) [16] | 15.0 ± 0.4\
    \ | 44.6 ± 0.3 | 49.7 ± 0.5 | 36.4 |\n| SA [13] | 15.3 | 50.1 | 56.9 | 40.8 |\n\
    | DA-NBNN [3] | 23.3 ± 2.7 | 67.2 ± 1.9 | 67.4 ± 3.0 | 52.6 |\n| DLID [8] | 26.1\
    \ | 68.9 | 84.9 | 60.0 |\n| DeCAF6 S [11] | 52.2 ± 1.7 | 91.5 ± 1.5 | — | — |\n\
    | DaNN [14] | 35.0 ± 0.2 | 70.5 ± 0.0 | 74.3 ± 0.0 | 59.9 |\n| **Ours** | **59.4\
    \ ± 0.8** | **92.5 ± 0.3** | **91.7 ± 0.8** | **81.2** |\n\n![](img/a04b187c89c5018c5ef6132980e27196_249_2.png)\n\
    \n### 无监督域自适应方法：DAN (1.2)\n\nDAN 通过添加多个自适应层并探索多个核来匹配域间边缘分布的偏移，假设条件分布保持不变。\n\n\
    自适应单个层无法消除源域和目标域之间的数据集偏差，因为存在其他不可迁移的层。具有不同带宽的多个核可以匹配低阶矩和高阶矩以最小化域差异。\n\n$$\\mathcal{K}\
    \ = \\left\\{ k = \\sum_{u=1}^{m} \\beta_u k_u : \\sum_{u=1}^{m} \\beta_u = 1,\
    \ \\beta_u \\ge 0, \\forall u \\right\\}$$\n\n![](img/a04b187c89c5018c5ef6132980e27196_250_0.png)\n\
    \n> [5] M. Long , Y. Cao , J. Wang , M. Jordan , Learning transferable features\
    \ with deep adaptation networks, in ICML, 2015, pp. 97–105 .\n\n### 无监督域自适应方法：RTN\
    \ (1.3)\n\n$$\\min \\frac{1}{n} \\sum_{i=1}^{n} L(x_i^s, y_i^s, \\theta)$$\n\n\
    由于深度特征最终沿网络从通用到特定转变：（1）全连接层 fc6–fc8 专用于建模任务特定结构，因此它们不可安全迁移，应使用 MK-MMD 最小化进行自适应；（2）监督分类器不可安全迁移，因此它们通过残差层\
    \ fc9–fc10 进行桥接，使得 f_S(x) = f_T(x) + Δf(f_T(x))。\n\n![](img/a04b187c89c5018c5ef6132980e27196_251_0.png)\n\
    \n我们不是使用残差块来建模特征映射，而是使用它来桥接源分类器 f_S(x) 和目标分类器 f_T(x)，其中 x ≜ f_T(x)，H(x) ≜ f_S(x)，且\
    \ F(x) ≜ Δf(f_T(x))\n\n![](img/a04b187c89c5018c5ef6132980e27196_251_1.png)\n\n\
    > [6] M. Long , H. Zhu , J. Wang , M.I. Jordan , Unsupervised domain adaptation\
    \ with residual transfer networks, in NIPS, 2016, pp. 136–144 .\n\n### 无监督域自适应方法：JAN\
    \ (1.4)\n\n当域可能通过输入特征 X 和输出标签 Y 的联合分布 P(X,Y) 发生变化时，迁移学习将变得更具挑战性。分布偏移可能源于边缘分布 P(X)、条件分布\
    \ P(Y|X) 或两者。\n\n核嵌入可以很容易地使用张量积特征空间推广到两个或多个变量的联合分布。\n\n$$C_{X^{1:m}}(P) \\triangleq\
    \ \\mathbb{E}_{X^{1:m}}[\\otimes_{\\ell=1}^{m}\\phi^{\\ell}(X^{\\ell})] = \\int_{\\\
    times_{\\ell=1}^{m}\\Omega^{\\ell}} (\\otimes_{\\ell=1}^{m}\\phi^{\\ell}(x^{\\\
    ell})) dP(x^{1},...,x^{m})$$\n\n$$D_{\\mathcal{L}}(P,Q) \\triangleq \\|C_{Z^{s,1:|\\\
    mathcal{L}|}}(P) - C_{Z^{t,1:|\\mathcal{L}|}}(Q)\\|_{\\otimes_{\\ell=1}^{|\\mathcal{L}|}\\\
    mathcal{H}^{\\ell}}^{2}$$\n\n![](img/a04b187c89c5018c5ef6132980e27196_252_0.png)\n\
