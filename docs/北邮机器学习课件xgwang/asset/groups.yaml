    insensitive to the replacement of an active voice with a passive voice.


    ## Sequence-to-sequence language translation


    - LSTM can correctly translate very long sentences


    | Type | Sentence |

    |------|----------|

    | Our model | Ulrich UNK, membre du conseil d’administration du constructeur automobile
    Audi, affirme qu’il y a déjà une pratique courante depuis des années pour que
    les téléphones portables ne soient pas éteints, d’après la FCC. « Si l’innovation
    portait les antennes relais du constructeur automobile était qu’ils ne soient
