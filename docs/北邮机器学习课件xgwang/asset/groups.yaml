  md: '

    ## Racial Faces in-the-Wild (RFW)


    Racial Faces in-the-Wild (RFW) is a large-scale face database for studying racial
    bias in face recognition which has two important uses:


    - **Measure racial bias of FR algorithms**. Four testing subsets, namely Caucasian,
    Asian, Indian and African, are constructed, and each contains about 3000 individuals
    with 6000 image pairs for face verification.


    - **Reduce racial bias by transfer learning**. Four training subsets are offered
    as well. The Caucasian subset consists of about 500K labeled images of 10k identities
    and other-race subsets contain 50K unlabeled images, respectively.


    ![](img/a04b187c89c5018c5ef6132980e27196_276_0.png)


    > [17] Wang M, Deng W, Hu J, et al. Racial Faces in-the-Wild: Reducing Racial
    Bias by Deep Unsupervised Domain Adaptation. arXiv preprint arXiv:1812.00194,
    2018.


    ## Collection process


    We estimate the race of images in MS-Celeb-1M using Face++ API and select about
    625K images of 25K celebrities of different races to construct a new RFW database.
    The collection process is as following:


    ### 1 Race detection


    For each identity in MS-Celeb-1M, it will be selected only if almost all images
    are estimated as the same race by Face++ API.


    ### 2 Data re-cleaning


    We manually remove outlier faces for each identity as well as outlier identities
    for each race manually.


    ![](img/a04b187c89c5018c5ef6132980e27196_277_0.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_277_1.png)


    ### 3 Testing set construction


    For each identity A, we randomly select one positive pair {Ai, Aj} from 50% of
    pairs with smaller cosine similarity; and we randomly select one negative pair
    {Ai, Bj} from 1% of pairs with larger cosine similarity.


    ### 4 Training set construction


    | Subsets | Train #subjects | Train #Images | Test #subjects | Test #Images |

    |---|---|---|---|---|

    | Caucasian | 10000 | 468139 | 2959 | 10196 |

    | Indian | - | 52285 | 2984 | 10308 |

    | Asian | - | 54188 | 2492 | 9688 |

    | African | - | 50588 | 2995 | 10415 |


    Table 1. The number of identities and images in RFW


    ![](img/a04b187c89c5018c5ef6132980e27196_278_0.png)


    > [17] Wang M, Deng W, Hu J, et al. Racial Faces in-the-Wild: Reducing Racial
    Bias by Deep Unsupervised Domain Adaptation. arXiv preprint arXiv:1812.00194,
    2018.


    ## Statistics and analyses


    **We construct our testing set similar to LFW. Besides,**


    - RFW considers both the **large intra-class variance** and the **small inter-class
    variance** simultaneously to get close to more realistic scenarios.

    - Four testing subsets ensure to **exclude other factors (e.g. pose, age and gender)**
    except for race which can cause difference.


    ![](img/a04b187c89c5018c5ef6132980e27196_279_0.png)


    **Figure 1.** The pose (yaw and pitch), age and gender distribution of four testing
    subsets


    ![](img/a04b187c89c5018c5ef6132980e27196_279_1.png)


    **Figure 2.** The pose and age gap distribution of RFW and LFW


    > From Fig. 1, there are no large differences in pose, age and gender distribution
    between Caucasian, Indian and Asian testing sets. African set has a smaller age
    gap and the least females, which makes Africans easier to be recognized.

    >

    > From Fig. 2, compared to LFW, the pose and age gap of positive pairs in RFW
    are larger, which shows we successfully add variations to intra-class.


    ### Difficult positive pairs in RFW


    ### Difficult negative pairs in RFW


    ![](img/a04b187c89c5018c5ef6132980e27196_280_0.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_280_1.png)


    Figure 3. Examples of difficult pairs in RFW dataset, which challenge the recognizer
    by the pose, age, expression and make-up variations of same people and the similar
    appearance of different people.


    > [17] Wang M, Deng W, Hu J, et al. Racial Faces in-the-Wild: Reducing Racial
    Bias by Deep Unsupervised Domain Adaptation. arXiv preprint arXiv:1812.00194,
    2018.

    '
  mdcn: '


    ## 野外种族面孔 (RFW)


    野外种族面孔 (RFW) 是一个用于研究人脸识别中种族偏见的大规模人脸数据库，具有两个重要用途：


    - **衡量 FR 算法的种族偏见**。构建了四个测试子集，即高加索人、亚洲人、印度人和非洲人，每个子集包含约 3000 名个体，共 6000 对图像用于人脸验证。


    - **通过迁移学习减少种族偏见**。同时提供了四个训练子集。高加索人子集由 10k 个身份的约 500K 张标注图像组成，其他种族子集分别包含 50K 张未标注图像。


    ![](img/a04b187c89c5018c5ef6132980e27196_276_0.png)


    > [17] Wang M, Deng W, Hu J, et al. Racial Faces in-the-Wild: Reducing Racial
    Bias by Deep Unsupervised Domain Adaptation. arXiv preprint arXiv:1812.00194,
    2018.


    ## 收集过程


    我们使用 Face++ API 估计 MS-Celeb-1M 中图像的种族，并选择约 625K 张不同种族的 25K 名名人的图像来构建新的 RFW 数据库。收集过程如下：


    ### 1 种族检测


    对于 MS-Celeb-1M 中的每个身份，只有当几乎所有图像都被 Face++ API 估计为同一种族时，才会被选中。


    ### 2 数据重新清洗


    我们手动为每个身份移除异常人脸，并为每个种族手动移除异常身份。


    ![](img/a04b187c89c5018c5ef6132980e27196_277_0.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_277_1.png)


    ### 3 测试集构建


    对于每个身份 A，我们从余弦相似度较小的 50% 的配对中随机选择一个正样本对 {Ai, Aj}；并从余弦相似度较大的 1% 的配对中随机选择一个负样本对
    {Ai, Bj}。


    ### 4 训练集构建


    | 子集 | 训练 #主体 | 训练 #图像 | 测试 #主体 | 测试 #图像 |

    |---|---|---|---|---|

    | Caucasian | 10000 | 468139 | 2959 | 10196 |

    | Indian | - | 52285 | 2984 | 10308 |

    | Asian | - | 54188 | 2492 | 9688 |

    | African | - | 50588 | 2995 | 10415 |


    表 1. RFW 中身份和图像的数量


    ![](img/a04b187c89c5018c5ef6132980e27196_278_0.png)


    > [17] Wang M, Deng W, Hu J, et al. Racial Faces in-the-Wild: Reducing Racial
    Bias by Deep Unsupervised Domain Adaptation. arXiv preprint arXiv:1812.00194,
    2018.


    ## 统计与分析


    **我们构建测试集的方式与 LFW 类似。此外，**


    - RFW 同时考虑了**大的类内方差**和**小的类间方差**，以更接近更真实的场景。

    - 四个测试子集确保排除除种族之外可能导致差异的其他因素（例如姿势、年龄和性别）。


    ![](img/a04b187c89c5018c5ef6132980e27196_279_0.png)


    **图 1.** 四个测试子集的姿势（偏航和俯仰）、年龄和性别分布


    ![](img/a04b187c89c5018c5ef6132980e27196_279_1.png)


    **图 2.** RFW 和 LFW 的姿势和年龄差距分布


    > 从图 1 可以看出，高加索人、印度人和亚洲人测试集在姿势、年龄和性别分布上没有太大差异。非洲集的年龄差距较小，女性最少，这使得非洲人更容易被识别。

    >

    > 从图 2 可以看出，与 LFW 相比，RFW 中正样本对的姿势和年龄差距更大，这表明我们成功地增加了类内的变化。


    ### RFW 中的困难正样本对


    ### RFW 中的困难负样本对


    ![](img/a04b187c89c5018c5ef6132980e27196_280_0.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_280_1.png)


    图 3. RFW 数据集中困难样本对的示例，通过同一个人姿势、年龄、表情和妆容的变化，以及不同人的相似外观来挑战识别器。


    > [17] Wang M, Deng W, Hu J, et al. Racial Faces in-the-Wild: Reducing Racial
    Bias by Deep Unsupervised Domain Adaptation. arXiv preprint arXiv:1812.00194,
    2018.


    '
