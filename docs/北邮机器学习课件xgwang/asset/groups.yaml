    ## 无监督 DA 方法：iCAN (2.2)


    通过神经网络的域协作和域对抗训练的协作与对抗网络 (CAN)。


    - 域信息表征：通过协作学习从较低块获得

    - 域无信息表征：通过对抗学习从较高块获得


    ![](img/a04b187c89c5018c5ef6132980e27196_258_0.png)


    1 min_{θ,w} (1/N) Σ_{i=1}^N L_D(D(F(x_i; θ); w), d_i)

    2 max_θ min_w (1/N) Σ_{i=1}^N L_D(D(F(x_i; θ); w), d_i)

    3 min_{θ_F, λ} L_CAN = Σ_{k=1}^{m-1} λ_k min_{w_k} L_D(θ_k, w_k) + λ_m min_{w_m}
    L_D(θ_m, w_m), s.t. Σ_{k=1}^{m-1} λ_k = λ_0, |λ_k| ≤ λ_0


    > [9] W. Zhang, W. Ouyang, W. Li, and D. Xu. Collaborative and adversarial network
    for unsupervised domain adaptation. In CVPR, pages 3801–3809, 2018.


    ## 无监督 DA 方法：MADA (2.3)


    域适应的困难：


    - 目标标签空间只是源标签空间的子空间。

    - 判别结构可能在域之间混合或错误对齐。


    ![](img/a04b187c89c5018c5ef6132980e27196_259_0.png)


    > [10] Z. Pei, Z. Cao, M. Long, and J. Wang. Multi-adversarial domain adaptation.
    In AAAI Conference on Artificial Intelligence, 2018


    min_θ 1/n Σ_{i=1}^n w_i L(x_i^s, y_i^s, θ)


    一种多对抗域适应 (MADA) 方法捕获多模态结构，使不同数据分布的细粒度对齐基于多个域判别器得以实现。


    ![](img/a04b187c89c5018c5ef6132980e27196_260_0.png)


    使用 ŷ_i 作为概率来指示每个数据点 x_i 应多大程度地关注 K 个域判别器 G_d^k 是一个自然的想法。每个点 x_i 对域判别器 G_d^k 的关注度可以通过用概率
    ŷ_ik 加权其特征 G_f(x_i) 来建模。


    C(θ_f, θ_y, {θ_d^k}_{k=1}^K) = 1/n_s Σ_{x_i∈D_s} L_y(G_y(G_f(x_i)), y_i) - λ/n
    Σ_{k=1}^K Σ_{x_i∈D} L_d^k(G_d^k(ŷ_i^k G_f(x_i)), d_i)


    (θ̂_f, θ̂_y) = arg min_{θ_f, θ_y} C(θ_f, θ_y, {θ_d^k}_{k=1}^K), (θ̂_d^1, ...,
    θ̂_d^K) = arg max_{θ_d^1, ..., θ_d^K} C(θ_f, θ_y, {θ_d^k}_{k=1}^K)


