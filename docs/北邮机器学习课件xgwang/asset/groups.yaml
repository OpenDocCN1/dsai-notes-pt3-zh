    ![](img/a04b187c89c5018c5ef6132980e27196_89_1.png)


    ∂z/∂x = Σ_{i=1}^n ∂z/∂y_i ∂y_i/∂x


    > (Bengio et al. Deep Learning 2014)'
  - "[PAGE 90]\n\n# Flow graph forward computation\n\n+   - $u_1, \\dots, u_N$ are\
    \ the nodes with defined partial orders\n+   - $a_i = (u_j)_{j \\in \\text{parents}(i)}$\
    \ is the set of parents of node $u_i$, and $u_i = f_i(a_i)$\n\n![](img/a04b187c89c5018c5ef6132980e27196_90_0.png)\n\
    \n```\nfor i = 1...M do\n  u_i <- x_i\nend for\nfor i = M + 1...N do\n  a_i <-\
    \ {u_j}_{j \\in parents(i)}\n  u_i <- f_i(a_i)\nend for\nreturn u_N\n```\n\n>\
    \ (Bengio et al. Deep Learning 2014)"
  - "[PAGE 91]\n\n# BP on a flow graph\n\n```\n∂loss/∂x_N ← 1\nfor j = N − 1 down\
    \ to 1 do\n  ∂loss/∂x_j ← Σ_{k ∈ parents(j)} ∂loss/∂x_k · ∂x_k/∂x_j\nend for\n\
    return {∂loss/∂x_i}_{i=1}^M\n```\n\n> (Bengio et al. Deep Learning 2014)\n\n∂u_N/∂w_i\
    \ = ∂u_N/∂u_j · ∂u_j/∂net_j · ∂net_j/∂w_i = ∂u_N/∂u_j · ∂u_j/∂net_j · f'(net_j)\
    \ u_i\n\n+   - BP has optimal computational complexity in the sense that there\
    \ is no algorithm that can compute the gradient faster (in the O(·) sense)\n+\
    \   - It is an application of the principles of dynamic programming"
