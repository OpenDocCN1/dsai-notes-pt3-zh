  - '[PAGE 103]


    # Choosing target values


    +   - Avoid setting the target values as the sigmoid''s asymptotes

    +     - Since the target values can only be achieved asymptotically, it drives
    the output and therefore the weights to be very large, which the sigmoid derivative
    is close to zero. So the weights may become stuck.

    +     - When the outputs saturate, the network gives no indication of confidence
    level. Large weights fore all outputs to the tails of the sigmoid instead of being
    close to decision boundary.

    +   - Insure that the node is not restricted to only the linear part of the sigmoid

    +   - Choose target values at the point of the maximum second derivative on the
    sigmoid so as to avoid saturating the output units'
  md: "\n## Nonlinear feature mapping\n\n![](img/a04b187c89c5018c5ef6132980e27196_95_0.png)\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_95_1.png)\n\n![](img/a04b187c89c5018c5ef6132980e27196_95_2.png)\n\
    \n> (Duda et al. Pattern Classification 2000)\n\n- The expressive power of the\
    \ 2-2-1 network is not high enough to separate all the seven patterns, even after\
    \ the global minimum error is reached by training.\n- These patterns can be separated\
    \ by increasing one more hidden unit to enhance the expressive power.\n\n## Filter\
    \ learning\n\n- The input-to-hidden weights at a single hidden unit describe the\
    \ input patterns that leads to maximum activation of that hidden unit, analogous\
    \ to a \"matched filter\"\n- Hidden units find feature groupings useful for the\
    \ linear classifier implemented by the hidden-to-output layer weights\n\n![](img/a04b187c89c5018c5ef6132980e27196_96_0.png)\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_96_1.png)\n\n(Duda et al. Pattern Classification\
    \ 2000)\n\n## A recommended sigmoid function for activation function\n\n激活函数\n\
    \n```\nf(x) = 1.79159 \\frac{e^{\\frac{3}{2}x} - e^{-\\frac{3}{2}x}}{e^{\\frac{3}{2}x}\
    \ + e^{-\\frac{3}{2}x}}\n```\n\nf(±1) = ±1, linear in the range of -1 < x < 1,\
    \ f'(x) has extrema near x = ±1.\n\n![](img/a04b187c89c5018c5ef6132980e27196_98_0.png)\n\
    \n> Y. LeCun, Generalization and network design strategies. Proc. Int'l Conf.\
    \ on Neural Networks, 1988.\n\n## Desirable properties of activation functions\n\
    \n- Must be nonlinear: otherwise it is equivalent to a linear classifier\n- Its\
    \ output has maximum and minimum value: keep the weights and activations bounded\
    \ and keep training time limited\n  - Desirable property when the output is meant\
    \ to represent a probability\n  - Desirable property for models of biological\
    \ neural networks, where the output represents a neural firing rate\n  - May not\
    \ be desirable in networks for regression, where a wide dynamic range may be required\n\
    - Continuous and differentiable almost everywhere\n- Monotonicity: otherwise it\
    \ introduces additional local extrema in the error surface\n- Linearity for a\
    \ small value of net, which will enable the system to implement a linear model\
    \ if adequate for yielding low error\n\n- The average of the outputs at a node\
    \ is close to zero because these outputs are the inputs to the next layer\n- The\
    \ variance of the outputs at a node is also 1.\n\n## Global versus local representations\n\
    \n- Tanh function (shifting the center of sigmoid to 0) has all the properties\
    \ above\n  - It has large response for input in a large range. Any particular\
    \ input x is likely to yield activity through several hidden units. This affords\
    \ a distributed or global representation of the input.\n  - If hidden units have\
    \ activation functions that have significant response only for input within a\
    \ small range, then an input x generally leads to fewer hidden units being active\
    \ - a local representation.\n- Distributed representations are superior because\
    \ more of the data influences the posteriors at any given input region.\n- The\
    \ global representation can be better achieved with more layers\n\nGlobal representation\n\
    \nLocal representation\n\nOriental face\n\nOccidental face\n\nBig nose? (1/0)\n\
    \nBlue eyes? (1/0)\n\nYellow skin? (1/0)\n\n![](img/a04b187c89c5018c5ef6132980e27196_102_0.png)\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_102_1.png)\n\n![](img/a04b187c89c5018c5ef6132980e27196_102_2.png)\n\
    \n## Choosing target values\n\n- Avoid setting the target values as the sigmoid's\
    \ asymptotes\n  - Since the target values can only be achieved asymptotically,\
    \ it drives the output and therefore the weights to be very large, which the sigmoid\
    \ derivative is close to zero. So the weights may become stuck.\n  - When the\
    \ outputs saturate, the network gives no indication of confidence level. Large\
    \ weights force all outputs to the tails of the sigmoid instead of being close\
    \ to decision boundary.\n- Insure that the node is not restricted to only the\
    \ linear part of the sigmoid\n- Choose target values at the point of the maximum\
    \ second derivative on the sigmoid so as to avoid saturating the output units\n"
  mdcn: "\n\n## 非线性特征映射\n\n![](img/a04b187c89c5018c5ef6132980e27196_95_0.png)\n\n\
    ![](img/a04b187c89c5018c5ef6132980e27196_95_1.png)\n\n![](img/a04b187c89c5018c5ef6132980e27196_95_2.png)\n\
    \n> (Duda et al. Pattern Classification 2000)\n\n- 2-2-1 网络的表达能力不足以分离全部七个模式，即使在训练后达到全局最小误差。\n\
    - 通过增加一个隐藏单元来增强表达能力，这些模式可以被分离。\n\n## 滤波器学习\n\n- 单个隐藏单元的输入到隐藏权重描述了导致该隐藏单元最大激活的输入模式，类似于“匹配滤波器”\n\
    - 隐藏单元找到对隐藏到输出层权重实现的线性分类器有用的特征分组\n\n![](img/a04b187c89c5018c5ef6132980e27196_96_0.png)\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_96_1.png)\n\n(Duda et al. Pattern Classification\
    \ 2000)\n\n## 激活函数推荐的 Sigmoid 函数\n\n激活函数\n\n```\nf(x) = 1.79159 \\frac{e^{\\frac{3}{2}x}\
    \ - e^{-\\frac{3}{2}x}}{e^{\\frac{3}{2}x} + e^{-\\frac{3}{2}x}}\n```\n\nf(±1)\
    \ = ±1, linear in the range of -1 < x < 1, f'(x) has extrema near x = ±1.\n\n\
    ![](img/a04b187c89c5018c5ef6132980e27196_98_0.png)\n\n> Y. LeCun, Generalization\
    \ and network design strategies. Proc. Int'l Conf. on Neural Networks, 1988.\n\
    \n## 激活函数的期望特性\n\n- 必须是非线性的：否则等价于线性分类器\n- 其输出具有最大值和最小值：保持权重和激活有界并限制训练时间\n  - 当输出旨在表示概率时是期望的特性\n\
    \  - 对于生物神经网络模型是期望的特性，其中输出表示神经放电率\n  - 在回归网络中可能不是期望的，因为可能需要宽的动态范围\n- 几乎处处连续且可微\n\
    - 单调性：否则会在误差曲面上引入额外的局部极值\n- 对于较小的 net 值具有线性，这将使系统能够在足够产生低误差时实现线性模型\n\n- 节点输出的平均值接近于零，因为这些输出是下一层的输入\n\
    - 节点输出的方差也为 1。\n\n## 全局与局部表示\n\n- Tanh 函数（将 sigmoid 的中心平移到 0）具有上述所有特性\n  - 它对大范围输入有较大响应。任何特定输入\
    \ x 很可能通过多个隐藏单元产生活动。这提供了输入的分布式或全局表示。\n  - 如果隐藏单元的激活函数仅对小范围内的输入有显著响应，则输入 x 通常导致较少隐藏单元被激活——局部表示。\n\
    - 分布式表示更优越，因为在任何给定输入区域，更多数据会影响后验。\n- 全局表示可以通过更多层更好地实现\n\n全局表示\n\n局部表示\n\n东方面孔\n\
    \n西方面孔\n\n大鼻子？(1/0)\n\n蓝眼睛？(1/0)\n\n黄皮肤？(1/0)\n\n![](img/a04b187c89c5018c5ef6132980e27196_102_0.png)\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_102_1.png)\n\n![](img/a04b187c89c5018c5ef6132980e27196_102_2.png)\n\
    \n## 选择目标值\n\n- 避免将目标值设为 sigmoid 的渐近线\n  - 由于目标值只能渐近达到，它会使输出因此权重变得非常大，而 sigmoid\
    \ 导数接近于零。因此权重可能卡住。\n  - 当输出饱和时，网络无法给出置信度指示。大的权重会迫使所有输出到 sigmoid 的尾部，而不是接近决策边界。\n\
    - 确保节点不被限制在 sigmoid 的线性部分\n- 在 sigmoid 上选择最大二阶导数点作为目标值，以避免饱和输出单元\n\n"
