  - "[PAGE 267]\n\n# Unsupervised DA method: Tri-training (4.1)\n\nTri-training method\
    \ use three networks asymmetrically to generate pseudo labels. By asymmetric,\
    \ two networks are used to label unlabeled target samples and one network is trained\
    \ by the samples to obtain target discriminative representations.\n\n![](img/a04b187c89c5018c5ef6132980e27196_267_0.png)\n\
    \nŷ: Pseudo-label for target sample  \nS: source samples  \nT₁: pseudo-labeled\
    \ target samples  \nY: Label for source sample\n\nF: shared network  \nF₁, F₂:\
    \ Labeling networks  \nFₜ: Target specific network\n\nObjective for category loss\n\
    \nP₁ → L(p₁, y) or L(p₁, ŷ)  \nP₂ → L(p₂, y) or L(p₂, ŷ)  \nPₜ → L(pₜ, ŷ)\n\n\
    [14] Saito K, Ushiku Y, Harada T. Asymmetric tri-training for unsupervised domain\
    \ adaptation. In ICML 2017."
  - '[PAGE 268]


    # # Unsupervised DA method: EHTS+APA (4.2)


    Firstly, an Easy-to-Hard Transfer Strategy (EHTS) progressively selects reliable
    pseudo-labeled target samples with cross-domain similarity measurements.


    ![](img/a04b187c89c5018c5ef6132980e27196_268_0.png)


    The source prototype is a mean vector of the embedded source samples in each class


    $$c_k^S = \frac{1}{N_s^k}\sum_{(x_i^s,y_i^s)\in D_s^k}G(x_i^s).$$


    It uses a similarity measurement to cluster unlabeled target sample to the corresponding
    source prototypes


    $$\psi(x_j^t)=CS(G(x_j^t),c_k^S),\ k=\{1,2,\ldots,C\}$$


    $$\tau=\frac{1}{1+e^{-\mu\cdot(m+1)}}-0.01,$$


    > [15] Chen C, Xie W, Xu T, et al. Progressive Feature Alignment for Unsupervised
    Domain Adaptation. arXiv preprint arXiv:1811.08585, 2018.'
  - '[PAGE 269]


    # Unsupervised DA method: EHTS+APA (4.2)


    Adaptive Prototype Alignment (APA) is proposed to align the source and target
    prototypes for each category. Rather than back-propagating the category loss for
    target samples based on pseudo-labeled samples, our work statistically align the
    cross-domain class distributions based on the source samples and the selected
    pseudo-labeled target samples.


    ![](img/a04b187c89c5018c5ef6132980e27196_269_0.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_269_1.png)


    G-Feature extractor F-Label predictor D-Domain discriminator


    # 1.Initial global prototypes


    c_k^{T}(0) = 1 / D̂_t^k Σ_{(x_j^t, y_j^t) ∈ D̂_t^k} G(x_j^t)


    # 2. Updated prototypes


    ρ_t = CS(c_k^{T}(I), c_k^{T}(I-1)), c_k^{T}(I) ← ρ_t 2^{t/I} c_k^{T}(I) + (1 -
    ρ_t^2) c_k^{T}(I-1)


    # 3. Prototypes align


    L_apa(θ_g) = Σ_{k=1}^{C} d(c_k^{S}(I), c_k^{T}(I))'
