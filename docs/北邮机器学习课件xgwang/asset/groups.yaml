  - '[PAGE 9]


    # Underfitting


    +   - The learner cannot find a solution that fits training examples well

    +     - For example, use linear regression to fit training examples {x_i^(train),
    y_i^(train)} where y_i^(train) is an quadratic function of x_i^(train)

    +   - Underfitting means the learner cannot capture some important aspects of
    the data

    +   - Reasons for underfitting happening

    +     - Model is not rich enough

    +     - Difficult to find the global optimum of the objective function on the
    training set or easy to get stuck at local minimum

    +     - Limitation on the computation resources (not enough training iterations
    of an iterative optimization procedure)

    +   - Underfitting commonly happens in deep learning with large scale training
    data and could be even a more serious problem than overfitting in some cases'
  md: '

    # Machine Learning Basics


    Xiaogang Wang


    xgwang@ee.cuhk.edu.hk


    January 5, 2015


    # Machine Learning


    $x \rightarrow f(x) \rightarrow y$


    Class label (Classification)


    Real-valued vector (Regression)


    ![](img/a04b187c89c5018c5ef6132980e27196_1_0.png)


    Object recognition


    {dog, cat, horse, flower, ...}


    ![](img/a04b187c89c5018c5ef6132980e27196_1_1.png)


    Super resolution


    ![](img/a04b187c89c5018c5ef6132980e27196_1_2.png)


    Low-resolution image


    High-resolution image


    # Classification


    - $f(x)$ predicts the category that $x$ belongs to

    - $f : \mathcal{R}^D \to \{1,\dots,K\}$

    - $f(x)$ is decided by the decision boundary

    - As an variant, $f$ can also predict the probability distribution over classes
    given $x$, $f(x) = P(y|x)$. The category is predicted as $y^* = \arg\max_k P(y
    = k|x)$


    ![](img/a04b187c89c5018c5ef6132980e27196_2_0.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_2_1.png)


    > (Duda et al. Pattern Classification 2000)


    # Regression


    - Predict real-valued output

    - $f : ℝ^D → ℝ^M$

    - Example: linear regression

    - $y = w^T x = Σ_{d=1}^D w_d x_d + w_0$


    ![](img/a04b187c89c5018c5ef6132980e27196_3_0.png)


    > (Bengio et al. Deep Learning 2014)


    # Training


    - Training: estimate the parameters of f from {(x_i^(train), y_i^(train))}

    - Decision boundary, parameters of P(y|x), and w in linear regression

    - Optimize an objective function on the training set. It is a performance measure
    on the training set and could be different from that on the test set.


    均方误差


    - Mean squared error (MSE) for linear regression

    - MSE_train = 1/N Σ_i || w^T x_i^(train) - y_i^(train) ||_2^2


    交叉熵


    - Cross entropy (CE) for classification

    - CE_train = 1/N Σ_i log P(y = y_i^(train) | x_i^(train))


    Why not use classification errors #{ f(x_i^(train)) ≠ y_i^(train) }?


    # Optimization


    - The choice of the objective function should be good for optimization

    - Take linear regression as an example


    ∇_w MSE^(train) = 0

    ⇒ ∇_w || X^(train) w − y^(train) ||_2^2 = 0

    w = (X^(train)ᵀ X^(train))⁻¹ X^(train)ᵀ y^(train)

    where X^(train) = [x₁^(train), …, x_N^(train)] and y^(train) = [y₁^(train), …,
    y_N^(train)].


    # Generalization


    - We care more about the performance of the model on new, previously unseen examples

    - The training examples usually cannot cover all the possible input configurations,
    so the learner has to generalize from the training examples to new cases

    - Generalization error: the expected error over ALL examples

    - To obtain theoretical guarantees about generalization of a machine learning
    algorithm, we assume all the samples are drawn from a distribution p(x, y), and
    calculate generalization error (GE) of a prediction function f by taking expectation
    over p(x, y)


    GE_f = ∫_{x,y} p(x,y) Error(f(x), y)


    # Generalization


    - However, in practice, $p(\mathbf{x}, y)$ is unknown. We assess the generalization
    performance with a test set $\{\mathbf{x}_i^{(\text{test})}, y_i^{(\text{test})}\}$


    $\text{Performance}_{\text{test}} = \frac{1}{M} \sum_{i=1}^{M} \text{Error}(f(\mathbf{x}_i^{(\text{test})}),
    y_i^{(\text{test})})$


    - We hope that both test examples and training examples are drawn from $p(\mathbf{x},
    y)$ of interest, although it is unknown


    # Underfitting


    - The learner cannot find a solution that fits training examples well

    - For example, use linear regression to fit training examples {x_i^(train), y_i^(train)}
    where y_i^(train) is an quadratic function of x_i^(train)

    - Underfitting means the learner cannot capture some important aspects of the
    data

    - Reasons for underfitting happening

    - Model is not rich enough

    - Difficult to find the global optimum of the objective function on the training
    set or easy to get stuck at local minimum

    - Limitation on the computation resources (not enough training iterations of an
    iterative optimization procedure)

    - Underfitting commonly happens in deep learning with large scale training data
    and could be even a more serious problem than overfitting in some cases

    '
