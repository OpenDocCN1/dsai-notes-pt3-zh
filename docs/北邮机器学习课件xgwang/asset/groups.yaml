    \ is not enough (the numbers of weights, layers and nodes in each layer).\n  -\
    \ Bad initialization and get stuck at local minimum (pre-training for better initialization).\n\
    - If the learning rate is low, the training error tends to decrease monotonically,\
    \ but converges slowly. If the learning rate is high, the training error may oscillate.\n\
    \n## Learning curve on the test and validation set\n\nThe average error on the\
    \ validation or test set is virtually always higher than on the training set.\
    \ It could increase or oscillate when **overfitting** happens. The reasons could\
    \ be:\n\n- Training samples are not enough.\n- The expressive power of the network\
    \ is too high.\n- Bad initialization and get stuck at local minimum (pre-training\
    \ for better initialization).\n\nStop training at a minimum of the error on the\
    \ validation set.\n\n## Data augmentation\n\n- If the training set is small, one\
    \ can synthesize some training samples by adding Gaussian noise to real training\
    \ samples.\n- Domain knowledge can be used to synthesize training samples. For\
    \ example, in image classification, more training images can be synthesized by\
    \ translation, scaling, and rotation.\n\n## Normalizing input\n\n- If the dynamic\
    \ range of one input feature is much larger than others, during training, the\
    \ network will mainly adjust weights on this feature while ignoring others.\n\
    - We do not want to prefer one feature over others just because they differ solely\
    \ in measured units.\n- To avoid such difficulty, the input patterns should be\
    \ shifted so that the average over the training set of each feature is zero, and\
    \ then be scaled to have the same variance as 1 in each feature.\n- Input variables\
    \ should be uncorrelated if possible.\n  - If inputs are uncorrelated, then it\
    \ is possible to solve for the value of one weight without any concern for other\
    \ weights.\n  - With correlated inputs, one must solve for multiple weights simultaneously,\
    \ which is a much harder problem.\n  - PCA can be used to remove linear correlations\
    \ in inputs.\n\n## Shuffling the training samples\n\n打乱训练集\n\n- Networks learn\
    \ the fastest from the most unexpected sample.\n- Shuffle the training set so\
    \ that successive training examples never (or rarely) belong to the same class.\n\
    - Present input examples that produce a large error more frequently than examples\
    \ that produce a small error.\n  - This technique, applied to data containing\
    \ outliers, can be disastrous because outliers can produce large errors yet should\
    \ not be presented frequently.\n\n## Error surfaces\n\n- Backpropagation is based\
