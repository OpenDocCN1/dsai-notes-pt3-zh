  - '[PAGE 77]


    # Input-to-hidden weights


    ∂J/∂w_ij = ∂J/∂y_j ∂y_j/∂net_j ∂net_j/∂w_ij


    +   - How the hidden unit output y_j affects the error at each output unit


    ∂J/∂y_j = ∂/∂y_j [ 1/2 Σ_{k=1}^c (t_k - z_k)^2 ]


    = - Σ_{k=1}^c (t_k - z_k) ∂z_k/∂y_j


    = - Σ_{k=1}^c (t_k - z_k) ∂z_k/∂net_k ∂net_k/∂y_j


    = - Σ_{k=1}^c (t_k - z_k) f''(net_k) w_kj = Σ_{k=1}^c δ_k w_kj'
  - "[PAGE 78]\n\n# Input-to-hidden weights\n\n+   - Sensitivity for a hidden unit\
    \ $j$\n+   \n+     $$\\delta_j=-\\frac{\\partial J}{\\partial net_j}=-\\frac{\\\
    partial J}{\\partial y_j}\\frac{\\partial y_j}{\\partial net_j}=f'(net_j)\\sum_{k=1}^{c}w_{kj}\\\
    delta_k$$\n\n+   - $\\sum_{k=1}^{c}w_{kj}\\delta_k$ is the effective error for\
    \ hidden unit $j$\n\n+   - Weight update rule. Since $\\partial net_j/\\partial\
    \ w_{ij}=x_i$,\n+   \n+     $$\\Delta w_{ij}=\\eta x_i\\delta_j=\\eta f'(net_j)\\\
    left[\\sum_{k=1}^{c}w_{kj}\\delta_k\\right]x_i$$"
  - '[PAGE 79]


    # Error backpropagation


    ![](img/a04b187c89c5018c5ef6132980e27196_79_0.png)


    (Duda et al. Pattern Classification 2000) The sensitivity at a hidden unit is
    proportional to the weighted sum of the sensitivities at the output units:


    $\delta_j = f''(net_j)\sum_{k=1}^{c} w_{kj}\delta_k$. The output unit sensitivities
    are thus propagated “back” to the hidden units.'
  - "[PAGE 80]\n\n# Stochastic gradient descent\n\n+   - Given $n$ training samples,\
    \ our target function can be expressed as\n+   \n+   $$J(w) = \\sum_{p=1}^{n}\
    \ J_p(w)$$\n\n+   - Batch gradient descent\n+   \n+   $$w \\leftarrow w - \\eta\
    \ \\sum_{p=1}^{n} \\nabla J_p(w)$$\n\n+   - In some cases, evaluating the sum-gradient\
    \ may be computationally expensive. Stochastic gradient descent samples a subset\
    \ of summand functions at every step. This is very effective in the case of large-scale\
    \ machine learning problems. In stochastic gradient descent, the true gradient\
    \ of $J(w)$ is approximated by a gradient at a single example (or a mini-batch\
    \ of samples):\n+   \n+   $$w \\leftarrow w - \\eta \\nabla J_p(w)$$"
  - '[PAGE 81]


    # Stochastic backpropagation


    # Algorithm 1 (Stochastic backpropagation)


    ```

    1 begin initialize network topology (# hidden units), w, criterion θ, η, m ← 0

    2 do m ← m + 1

    3 X^m ← randomly chosen pattern

    4 w_ij ← w_ij + ηδ_j x_i; w_jk ← w_jk + ηδ_k y_j

    5 until ΔJ(w) < θ

    6 return w

    7 end

    ```


    > (Duda et al. Pattern Classification 2000)


    +   - In stochastic training, a weight update may reduce the error on the single
    pattern being presented, yet increase the error on the full training set.'
