    for unsupervised domain adaptation. In CVPR, pages 3801–3809, 2018.


    ## Unsupervised DA method: MADA (2.3)


    The difficulty of domain adaptation:


    - target label space is only a subspace of the source label space.

    - discriminative structures may be mixed up or falsely aligned across domains.


    ![](img/a04b187c89c5018c5ef6132980e27196_259_0.png)


    > [10] Z. Pei, Z. Cao, M. Long, and J. Wang. Multi-adversarial domain adaptation.
    In AAAI Conference on Artificial Intelligence, 2018


    min_θ 1/n Σ_{i=1}^n w_i L(x_i^s, y_i^s, θ)


    A multi-adversarial domain adaptation (MADA) approach captures multimode structures
    enable fine-grained alignment of different data distributions based on multiple
    domain discriminators.


    ![](img/a04b187c89c5018c5ef6132980e27196_260_0.png)


    It is a natural idea to use ŷ_i as the probability to indicate how much each data
    point x_i should be attended to the K domain discriminators G_d^k. The attention
    of each point x_i to a domain discriminator G_d^k can be modeled by weighting
    its features G_f(x_i) with probability ŷ_ik.


    C(θ_f, θ_y, {θ_d^k}_{k=1}^K) = 1/n_s Σ_{x_i∈D_s} L_y(G_y(G_f(x_i)), y_i) - λ/n
    Σ_{k=1}^K Σ_{x_i∈D} L_d^k(G_d^k(ŷ_i^k G_f(x_i)), d_i)


    (θ̂_f, θ̂_y) = arg min_{θ_f, θ_y} C(θ_f, θ_y, {θ_d^k}_{k=1}^K), (θ̂_d^1, ...,
    θ̂_d^K) = arg max_{θ_d^1, ..., θ_d^K} C(θ_f, θ_y, {θ_d^k}_{k=1}^K)


