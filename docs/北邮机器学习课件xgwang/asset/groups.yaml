- raw:
  - '[PAGE 155]


    # Vanishing and exploding gradients


    +   - Training a very deep net makes the problem even more serious, since after
    BP through many layers, the gradients become either very small or very large

    +   - RNN can be treated as a deep net when modeling long term dependency


    ![](img/a04b187c89c5018c5ef6132980e27196_155_0.png)'
  - '[PAGE 156]


    # Vanishing and exploding gradients


    +   - In very deep nets and recurrent nets, the final output is composed of a
    large number of non-linear transformations

    +   - Even though each of these non-linear stages may be relatively smooth, their
    composition is going to be much “more non-linear”, in the sense that the derivatives
    through the whole composition will tend to be either very small or very large,
    with more ups and downs


    ![](img/a04b187c89c5018c5ef6132980e27196_156_0.png)


    When composing many non-linearities (like the activation non-linearity in a deep
    or recurrent neural network), the result is highly non-linear, typically with
    most of the values associated with a tiny derivative, some values with a large
    derivative, and many ups and downs (not shown here)'
  - '[PAGE 157]


    # Vanishing and exploding gradients


    This arises because the Jacobian (matrix of derivatives) of a composition is the
    product of the Jacobian of each stage, i.e. if


    f = f_T ∘ f_{T-1} ∘ ... ∘ f_2 ∘ f_1


    The Jacobian matrix of derivatives of f(x) with respect to its input vector x
    is


    f'' = f''_T f''_{T-1} ... f''_1


    where


    f'' = ∂f(x)/∂x


    and


    f''_i = ∂f_i(α_i)/∂α_i


    where α_i = f_{i-1}(f_{i-2}(... f_2(f_1(x))...)), i.e. composition has been replaced
    by matrix multiplication'
  - '[PAGE 158]


    # Vanishing and exploding gradients


    +   - In the scalar case, we can imagine that multiplying many numbers together
    tends to be either very large or very small

    +   - In the special case where all the numbers in the product have the same value
    α, this is obvious, since α^T goes to 0 if α < 1 and to ∞ if α > 1 as T increases

    +   - The more general case of non-identical numbers be understood by taking the
    logarithm of these numbers, considering them to be random, and computing the variance
    of the sum of these logarithms. Although some cancellation can happen, the variance
    grows with T. If those numbers are independent, it grows linearly with T, which
    means that the product grows roughly as e^T.

    +   - This analysis can be generalized to the case of multiplying square matrices'
  - "[PAGE 159]\n\n# Difficulty of Learning Long-Term Dependencies\n\n+   - Consider\
    \ the gradient of a loss $L_T$ at time $T$ with respect to the parameter $\theta$\
    \ of the recurrent function $F_\theta$\n+     $h_t = F_\theta(h_{t-1}, x_t)$\n\
    +     $\\frac{\\partial L_T}{\\partial \\theta} = \\sum_{t=1}^{T} \\frac{\\partial\
    \ L_T}{\\partial h_T} \\frac{\\partial h_T}{\\partial h_t} \\frac{\\partial F_\t\
    heta(h_{t-1}, x_t)}{\\partial \\theta}$\n+     $\\frac{\\partial L_T}{\\partial\
    \ h_T} \\frac{\\partial h_T}{\\partial h_t} \\frac{\\partial F_\theta(h_{t-1},\
    \ x_t)}{\\partial \\theta}$ encodes long-term dependency when $T - t$ is large\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_159_0.png)"
  - '[PAGE 160]


    # Difficulty of Learning Long-Term Dependencies


    ∂h_T/∂h_t = ∂h_T/∂h_{T-1} ∂h_{T-1}/∂h_{T-2} ... ∂h_{t+1}/∂h_t


    +   - Each layer-wise Jacobian ∂h_{t+1}/∂h_t is the product of two matrices: (a)
    the recurrent matrix W and (b) the diagonal matrix whose entries are the derivatives
    of the non-linearities associated with the hidden units, which vary depending
    on the time step. This makes it likely that successive Jacobians have similar
    eigenvectors, making the product of these Jacobians explode or vanish even faster


    +   - ∂h_T/∂h_t is a weighted sum of terms over spans T − t, with weights that
    are exponentially smaller (or larger) for long-term dependencies relating the
    state at t to the state at T


    +   - The signal about long term dependencies will tend to be hidden by the smallest
    fluctuations arising from short-term dependencies'
  - '[PAGE 161]


    # Combine short and long paths in unfolded flow graph


    +   - Longer-delay connections allow to connect the past states to future states
    through short paths

    +   - Gradients will vanish exponentially with respect to the number of time steps

    +   - If we have recurrent connections with a time-delay of D, the instead of
    the vanishing or explosion going as O(λ^T) over T steps (where λ is largest eigenvalue
    of the Jacobians ∂h_t/∂h_{t-1}), the unfolded recurrent network now has paths
    through which gradients grow as O(λ^{T/D}) because the number of effective steps
    is T/D


    ![](img/a04b187c89c5018c5ef6132980e27196_161_0.png)'
