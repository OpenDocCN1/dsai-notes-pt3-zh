    \ minimum and plateaus (regions where error varies only slightly as a function\
    \ of weights).\n- Therefore, it is important to find a good initialization for\
    \ backpropagation (through pre-training).\n\n![](img/a04b187c89c5018c5ef6132980e27196_204_0.png)\n\
    \n## Learning rate\n\n- Decrease the learning rate when the weight vector \"oscillates\"\
    \ and increase it when the weight vector follows a steady direction.\n- One can\
    \ choose a different learning rate for each weight, so that all the weights in\
