- raw:
  - '[PAGE 216]


    # Vanishing and exploding gradients


    +   - In the scalar case, we can imagine that multiplying many numbers together
    tends to be either very large or very small

    +   - In the special case where all the numbers in the product have the same value
    \(\alpha\), this is obvious, since \(\alpha^T\) goes to 0 if \(\alpha < 1\) and
    to ∞ if \(\alpha > 1\) as \(T\) increases

    +   - The more general case of non-identical numbers can be understood by taking
    the logarithm of these numbers, considering them to be random, and computing the
    variance of the sum of these logarithms. Although some cancellation can happen,
    the variance grows with \(T\). If those numbers are independent, it grows linearly
    with \(T\), which means that the product grows roughly as \(e^T\).

    +   - This analysis can be generalized to the case of multiplying square matrices'
  - '[PAGE 217]


    # Why need multi-GPU?


    +   - Further speed-up

    +   - The memory size of a single GPU is limited

    +     - GeForce GTX 670: 2GB

    +     - TITAN: 6GB

    +     - TITAN X: 12GB

    +     - Tesla K40: 12GB

    +     - Tesla K80: two K40

    +   - Train bigger model

    +   - Data parallelism

    +   - Model parallelism'
  - '[PAGE 218]


    # Cost of using multi-GPU


    +   - Synchronization

    +   - Communication overhead

    +     - Communication between GPUs in the same server

    +     - Communication between GPU servers'
  - '[PAGE 219]


    # Data parallelism


    +   - The mini-batch is split across several GPUs. Each GPU is responsible computing
    gradients with respect to all model parameters, but does so using a subset of
    the samples in the mini-batch

    +   - The model (parameters) has a complete (same) copy in each GPU

    +   - The gradients computed from multiple GPUs are averaged to update parameters
    in both GPUs


    ![](img/a04b187c89c5018c5ef6132980e27196_219_0.png)'
  - '[PAGE 220]


    # Drawbacks of data parallelism


    +   - Require considerable communication between GPUs, since each GPU must communicate
    both gradients and parameter values on every update step

    +   - Each GPU must use a large number of samples to effectively utilize the highly
    parallel device; thus, the mini-batch size effectively gets multiplied by the
    number of GPUs, hampering convergence'
  - '[PAGE 221]


    # Model parallelism


    +   - Consist of splitting an individual network''s computation across multiple
    GPUs

    +   - For instance, convolutional layer with N filters can be run on two GPUs,
    each of which convolves its input with N/2 filters


    ![](img/a04b187c89c5018c5ef6132980e27196_221_0.png)


    The architecture is split into two columns which make easier to split computation
    across the two GPUs'
  - '[PAGE 222]


    # Model parallelism


    +   - A mini batch has the same copy in each GPU

    +   - GPUs have to be synchronized and communicate at every layer if computing
    gradients in a GPU requires outputs of all the feature maps at the lower layer


    ![](img/a04b187c89c5018c5ef6132980e27196_222_0.png)'
  - '[PAGE 223]


    # Model parallelism


    +   - Krizhevsky et al. customized the architecture of the network to better leverage
    model parallelism: the architecture consists of two "columns" each allocated on
    one GPU

    +   - Columns have cross connections only at one intermediate layer and at the
    very top fully connected layers


    ![](img/a04b187c89c5018c5ef6132980e27196_223_0.png)


    A. Krizhevsky, I. Sutskever, and G. Hinton, "ImageNet classification with deep
    convolutional neural networks," in NIPS, 2012.'
  - '[PAGE 224]


    # Model parallelism


    +   - While model parallelism is more difficult to implement, it has two potential
    advantages relative to data parallelism

    +     - It may require less communication bandwidth when the cross connections
    involve small intermediate feature maps

    +     - It allows the instantiation of models that are too big for a single GPU''s
    memory'
  - '[PAGE 225]


    # Hybrid data and model parallelism


    +   - Data and model parallelism can be hybridized.


    ![](img/a04b187c89c5018c5ef6132980e27196_225_0.png)


    Examples of how model and data parallelism can be combined in order to make effective
    use of 4 GPUs'
  - '[PAGE 226]


    # Hybrid data and model parallelism


    ![](img/a04b187c89c5018c5ef6132980e27196_226_0.png)


    Test error on ImageNet as a function of time using different forms of parallelism.
    All experiments used the same mini-batch size (256) and ran for 100 epochs (here
    showing only the first 10 for clarity of visualization) with the same architecture
    and the same hyper-parameter setting as in Alex net. If plotted against number
    of weight updates, all these curves would almost perfectly coincide.'
