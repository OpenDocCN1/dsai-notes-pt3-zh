- raw:
  - '[PAGE 162]


    # Leaky units with self-connections


    h_{t+1} = (1 - 1/τ) h_t + 1/τ tanh(W_{xh} x_t + W_{hh} h_t + b_h)


    +   - The new value of the state h_{t+1} is a combination of linear and non-linear
    parts of h_t

    +   - The errors are easier to be back propagated through the paths of red lines,
    which are linear


    ![](img/a04b187c89c5018c5ef6132980e27196_162_0.png)'
  - '[PAGE 163]


    # Leaky units with self-connections


    +   - When τ = 1, there is no linear self-recurrence, only the nonlinear update
    which we can find in ordinary recurrent networks

    +   - When τ > 1, this linear recurrence allows gradients to propagate more easily.
    When τ is large, the state changes very slowly, integrating the past values associated
    with the input sequence

    +   - τ controls the rate of forgetting old states. It can be viewed as a smooth
    variant of the idea of the previous model

    +   - By associating different time scales τ with different units, one obtains
    different paths corresponding to different forgetting rates

    +   - Those time constants can be fixed manually or can be learned as free parameters'
  - '[PAGE 164]


    <!-- no content -->'
  - "[PAGE 165]\n\n# Long Short-Term Memory (LSTM) net\n\nf_t = σ(W_fx x_t + W_fh\
    \ h_{t-1} + b_f), i_t = σ(W_ix x_t + W_ih h_{t-1} + b_i),\n o_t = σ(W_ox x_t +\
    \ W_oh h_{t-1} + b_o)\n g_t = tanh(W_gx x_t + W_gh h_{t-1} + b_g), c_t = f_t ⊙\
    \ c_{t-1} + i_t ⊙ g_t\n h_t = o_t ⊙ tanh(c_t), z_t = softmax(W_z h_t + b_z)\n\n\
    ![](img/a04b187c89c5018c5ef6132980e27196_165_0.png)"
  - '[PAGE 166]


    # Long Short-Term Memory (LSTM) net


    +   - The core of LSTM is a memory cell c_t which encodes, at every time step,
    the knowledge of the inputs that have been observed up to that step.

    +   - The memory cell c_t has the same inputs (h_{t-1} and x_t) and outputs (h_t)
    as a normal recurrent network, but has more parameters and a system of gating
    units that controls the flow of information

    +   - c_t has a linear self-connection similar to the leaky units, but the self-connection
    weight is controlled by a forget gate unit f_t, that sets this weight to a value
    between 0 and 1 via a sigmoid unit

    +     f_t = σ(W_f x_t + W_h f_{t-1} h_{t-1} + b_f)

    +   - The input gate unit i_t is computed similarly to the forget gate, but with
    its own parameters

    +   - The output h_t of the LSTM cell can also be shut off, via the output gate
    o_t (h_t = o_t ⊙ tanh(c_t)), which is also a sigmoid unit for gating

    +     o_t = σ(W_o x_t + W_h o_{t-1} h_{t-1} + b_o)'
  - '[PAGE 167]


    <!-- no content -->'
  - '[PAGE 168]


    # Long Short-Term Memory (LSTM) net


    +   - (c): Depth can also be added in the hidden-to-output transform

    +   - (d): A hierarchy of RNNs, which can be stacked on top of each other


    ![](img/a04b187c89c5018c5ef6132980e27196_168_0.png)'
  - '[PAGE 169]


    # Sequence-to-sequence language translation


    +   - Sutskever, Vinyals, and Le NIPS 2014

    +   - Model $P(Y_1,\dots,Y_T|X_1,\dots,X_T)$. The input and output sequences have
    different lengths, are not aligned, and even do not have monotonic relationship

    +   - Use one LSTM to read the input sequence $(x_1,\dots,x_T)$, one timestep
    at a time, to obtain a large fixed-dimensional vector representation $v$, which
    is given by the last hidden state of the LSTM

    +   - Then conditioned on $v$, a second LSTM generates the output sequence $(y_1,\dots,y_T)$
    and computes its probability


    $p(y_1,\dots,y_T|v)=\prod_{t=1}^{T''}p(y_t|v,y_1,\dots,y_{t-1})$


    ![](img/a04b187c89c5018c5ef6132980e27196_169_0.png)


    The model reads an input sentence "ABC" and produces "WXYZ" as the output sentence.
    The model stops making predictions after outputting the end-of-sentence token.'
  - '[PAGE 170]


    # Sequence-to-sequence language translation


    +   It requires each sentence ends with a special end-of-sequence symbol "<EOS>",
    which enables the model to define a distribution over sequences of all possible
    lengths


    +   It is valuable to reverse the order of the words of the input sequence. For
    example, instead of mapping the sentence a, b, c to the sentence α, β, γ, the
    LSTM is asked to map c, b, a to α, β, γ, where α, β, γ is the translation of a,
    b, c. This way, a is in close proximity to α, b is fairly close to β, and so on,
    a fact that makes it easy for stochastic gradient descent to "establish communication"
    between the input and the output. It introduces many short term dependencies in
    the data that make the optimization problem much easier.'
