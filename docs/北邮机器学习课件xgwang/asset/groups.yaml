    \ 2278-2324, 1998.\n- G. E. Hinton, S. Osindero, and Y. W. Teh. A fast learning\
    \ algorithm for deep belief nets. *Neural Computation*, 18:1527-1554, 2006.\n\
    - G. E. Hinton, and R. R. Salakhutdinov. Reducing the dimensionality of data with\
    \ neural networks. *Science*, 313:504-507, 2006.\n- G. E. Hinton. Learning multiple\
    \ layers of representation. *Trends in Cognitive Sciences*, Vol. 11, pp. 428-434,\
    \ 2007.\n\n## 自编码器\n\nXiaogang Wang\n\nxgwang@ee.cuhk.edu.hk\n\nFebruary 14, 2015\n\
    \n## 大纲\n- 1. Autoencoder\n- 2. Regularized autoencoders\n- 3. Multimodal autoencoders\n\
    \n## 深度自编码器\n\nStack multiple encoders (and their corresponding decoders)\n\n\
    ![](img/a04b187c89c5018c5ef6132980e27196_114_0.png)\n\n## 压缩图像的方法比较\n\n![](img/a04b187c89c5018c5ef6132980e27196_116_0.png)\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_116_1.png)\n\n## 预测稀疏分解\n- Sparse coding\n\
    \  - Solving the encoder $f_0$ is non-trivial because of $L_1$ minimization and\
    \ entails an iterative optimization\n  - $y^* = f_0(x) = \\arg\\min_y \\|x - Wy\\\
    |_2^2 + \\lambda\\|y\\|_1$\n  - $J_{SC} = \\sum_n \\|x^{(n)} - Wy^{(n)}\\|_2^2$\n\
    - Predictive sparse decomposition\n  - Approximation to sparse coding\n  - Add\
    \ sparse penalty to auto-encoder\n  - Replace the costly and highly non-linear\
    \ encoding step by a fast non-iterative approximation\n\nThe training criterion\
    \ is simultaneously optimized with respect to the hidden codes (representation)\
    \ $y^{(n)}$ and with respect to the parameters $\\theta$\n\n$J_{PSD} = \\sum_n\
    \ \\lambda\\|y^{(n)}\\|_1 + \\|x^{(n)} - Wy^{(n)}\\|_2^2 + \\|y^{(n)} - f_0(x^{(n)})\\\
    |_2^2$\n\n$f_0(x^{(n)}) = \\sigma(b + W^T x^{(n)})$\n\n## 多模态深度学习\n- Ngiam et\
    \ al. ICML'11 (audio-visual speech recognition)\n- Multimodal fusion: data from\
    \ all modalities is available at all phases\n- Cross modality learning: data from\
    \ multiple modalities is available only during feature learning; during supervised\
    \ training and testing, only data from a single modality is provided. The aim\
    \ is to learn better single modality representations given unlabeled data from\
    \ multiple modalities.\n- Matching across different modalities\n- A direct approach\
    \ is to train a RBM over the concatenated audio and video data. Limited as a shallow\
    \ model, it is hard for a RBM to learn the highly nonlinear correlations and form\
    \ multimodal representations\n- It was found that learning a shallow bimodal RBM\
    \ results in hidden units that have strong connections to variables from individual\
    \ modality but few units that connect across the modalities.\n\n![](img/a04b187c89c5018c5ef6132980e27196_120_0.png)\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_120_1.png)\n\n![](img/a04b187c89c5018c5ef6132980e27196_120_2.png)\n\
    \n"
