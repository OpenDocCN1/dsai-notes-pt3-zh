  mdcn: "\n\n## 梯度消失与梯度爆炸\n\n- 在标量情况下，我们可以想象将许多数字相乘往往会变得非常大或非常小\n- 在所有乘积中的数字都具有相同值\
    \ \\(\\alpha\\) 的特殊情况下，这很明显，因为当 \\(T\\) 增大时，\\(\\alpha^T\\) 在 \\(\\alpha < 1\\\
    ) 时趋向于 0，在 \\(\\alpha > 1\\) 时趋向于 ∞\n- 非相同数字的更一般情况可以通过取这些数字的对数，将它们视为随机，并计算这些对数之和的方差来理解。虽然会发生一些抵消，但方差随着\
    \ \\(T\\) 的增长而增长。如果这些数字是独立的，它随 \\(T\\) 线性增长，这意味着乘积大致按 \\(e^T\\) 增长。\n- 该分析可以推广到相乘方阵的情况\n\
    \n## 为什么需要多 GPU？\n\n- 进一步加速\n- 单个 GPU 的内存大小有限\n  - GeForce GTX 670: 2GB\n  - TITAN:\
    \ 6GB\n  - TITAN X: 12GB\n  - Tesla K40: 12GB\n  - Tesla K80: two K40\n- 训练更大的模型\n\
    - 数据并行\n- 模型并行\n\n## 使用多 GPU 的成本\n\n- 同步\n- 通信开销\n  - 同一服务器内 GPU 之间的通信\n  - GPU\
    \ 服务器之间的通信\n\n## 数据并行\n\n- 小批量被拆分到多个 GPU 上。每个 GPU 负责计算相对于所有模型参数的梯度，但使用的是小批量中样本的子集\n\
    - 模型（参数）在每个 GPU 中都有完整（相同）的副本\n- 从多个 GPU 计算得到的梯度被平均以更新两个 GPU 中的参数\n\n![](img/a04b187c89c5018c5ef6132980e27196_219_0.png)\n\
    \n## 数据并行的缺点\n\n- 需要 GPU 之间相当大的通信，因为每个 GPU 必须在每次更新步骤中通信梯度和参数值\n- 每个 GPU 必须使用大量样本才能有效利用高度并行的设备；因此，小批量大小有效地乘以\
    \ GPU 的数量，阻碍收敛\n\n## 模型并行\n\n- 由将单个网络的计算拆分到多个 GPU 组成\n- 例如，具有 N 个滤波器的卷积层可以在两个\
    \ GPU 上运行，每个 GPU 将其输入与 N/2 个滤波器进行卷积\n\n![](img/a04b187c89c5018c5ef6132980e27196_221_0.png)\n\
    \n架构被拆分为两列，使得在两个 GPU 之间拆分计算变得更容易\n\n## 模型并行\n\n- 一个小批量在每个 GPU 中都有相同的副本\n- 如果在\
    \ GPU 中计算梯度需要较低层的所有特征图的输出，则 GPU 必须在每一层同步并通信\n\n![](img/a04b187c89c5018c5ef6132980e27196_222_0.png)\n\
    \n## 模型并行\n\n- Krizhevsky 等人定制了网络的架构以更好地利用模型并行：架构由两个“列”组成，每个列分配在一个 GPU 上\n- 列仅在一个中间层和最顶层的全连接层有交叉连接\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_223_0.png)\n\nA. Krizhevsky, I. Sutskever,\
    \ and G. Hinton, \"ImageNet classification with deep convolutional neural networks,\"\
    \ in NIPS, 2012.\n\n## 模型并行\n\n- 虽然模型并行更难实现，但相对于数据并行，它有两个潜在优势\n  - 当交叉连接涉及较小的中间特征图时，它可能需要更少的通信带宽\n\
    \  - 它允许实例化对于单个 GPU 内存来说太大的模型\n\n## 混合数据和模型并行\n\n- 数据并行和模型并行可以混合使用。\n\n![](img/a04b187c89c5018c5ef6132980e27196_225_0.png)\n\
    \n模型并行和数据并行如何结合以便有效利用 4 个 GPU 的示例\n\n## 混合数据和模型并行\n\n![](img/a04b187c89c5018c5ef6132980e27196_226_0.png)\n\
    \n使用不同形式的并行时，ImageNet 上的测试误差随时间变化。所有实验均使用相同的小批量大小（256）并运行 100 个 epoch（此处仅显示前 10\
    \ 个以便于可视化），架构和超参数设置与 AlexNet 相同。如果按权重更新次数绘制，所有这些曲线几乎会完全重合。\n\n"
