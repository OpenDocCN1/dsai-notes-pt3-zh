    # 3 Heterogeneous DA


    # 4.2. Heterogeneous domain adaptation


    In heterogeneous DA, the feature spaces of the source and target domains are not
    the same, Xs ≠ Xt, and the feature spaces may also differ. According to the difference
    of feature spaces, heterogeneous DA can be divided into two scenarios. In one
    scenario, the source and target domains contain images, and the divergence of
    feature spaces is caused by different sensory devices (e.g., visual, infrared
    (NIR) or RGB vs. depth) and different sketches vs. photos). In the other scenario,
    the difference is due to the difference of media in source and target domain (e.g.,
    t


    # 2 Multi-step DA


