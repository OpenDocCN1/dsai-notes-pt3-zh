    +   - O. Yadan, K. Adams, Y. Taigman, and M. Ranzato, “Multi-GPU Training of ConvNets”,
    arXiv:1312.583, 2014

    +   - J. Dean, G. S. Corrado, R. Monga, and K. Chen, “Large Scale Distributed
    Deep Networks,” NIPS 2012'
