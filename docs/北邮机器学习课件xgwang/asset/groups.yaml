  - '[PAGE 246]


    # Unsupervised DA


    +   - Traditional deep learning

    +     $$\min \frac{1}{n}\sum_{i=1}^{n} L(x_i, y_i, \theta)$$


    +   - Feature adaptation

    +     $$\min \frac{1}{n}\sum_{i=1}^{n} L(\phi(x_i^s), y_i^s, \theta)$$


    +   - Instance adaptation

    +     $$\min \frac{1}{n}\sum_{i=1}^{n} w_i L(x_i^s, y_i^s, \theta)$$


    +   - Model adaptation

    +     $$\min \frac{1}{n}\sum_{i=1}^{n} L(x_i^s, y_i^s, \theta)$$


    +   - KL divergence:

    +     $$KL(P,Q)=\sum_i P(i)\log\frac{P(i)}{Q(i)}$$


    +   - MMD:

    +     $$MMD^2(\mathcal{D}_s,\mathcal{D}_t)=\left\|\frac{1}{M}\sum_{i=1}^{M}\phi(x_i^s)-\frac{1}{N}\sum_{i=1}^{N}\phi(x_i^t)\right\|_{\mathcal{H}}^2$$


    +   - $\mathcal{H}$-divergence:

    +     $$\hat{d}_\mathcal{A}=2(1-2\varepsilon)$$


    +   - Wasserstein distance (Earth mover distance)

    +     $$W(P_1,P_2)=\inf_{\gamma\sim\prod(P_1,P_2)}\mathbb{E}_{(x,y)\sim\gamma}[||x-y||]$$'
  - '[PAGE 247]


    # Unsupervised DA method


    Most deep DA methods try to learn more transferable representations through mapping
    both domains into a domain-invariant feature space, and then directly apply the
    classifier learned from only source labels to target domain.


    ![](img/a04b187c89c5018c5ef6132980e27196_247_0.png)


    Some papers explore domain-invariant feature spaces by minimizing some measures
    of domain discrepancy such as statistic loss, adversarial loss and reconstruction
    loss'
