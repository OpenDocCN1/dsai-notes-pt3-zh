  - '[PAGE 190]


    # Hessian matrix


    ![](img/a04b187c89c5018c5ef6132980e27196_190_0.png)


    Gradient descent fails to exploit the curvature information contained in Hessian.
    Here we use gradient descent on a quadratic function whose Hessian matrix has
    condition number 5. The red lines indicate the path followed by gradient descent.
    This very elongated quadratic function resembles a long canyon. Gradient descent
    wastes time repeatedly descending canyon walls, because they are the steepest
    feature. Because the step size is somewhat too large, it has a tendency to overshoot
    the bottom of the function and thus needs to descend the opposite canyon wall
    on the next iteration. The large positive eigenvalue of the Hessian corresponding
    to the eigenvector pointed in this direction indicates that this directional derivative
    is rapidly increasing, so an optimization algorithm based on the Hessian could
    predict that the steepest direction is not actually a promising search direction
    in this context.'
  - "[PAGE 191]\n\n# Second-order optimization methods\n\n+   - Gradient descent uses\
    \ only the gradient and is called first-order optimization. Optimization algorithms\
    \ such as Newton's method that also use the Hessian matrix are called second-order\
    \ optimization algorithms.\n\n+   - Update with Newton's method\n+   \n+     $\\\
    mathbf{x}^* = \\mathbf{x}_0 - H(f)(\\mathbf{x}_0)^{-1} \\nabla_x f(\\mathbf{x}_0)$\n\
    \nWhen the function can be locally approximated as quadratic, iteratively updating\
    \ the approximation and jumping to the minimum of the approximation can reach\
    \ the critical point much faster than gradient descent would.\n\n+   - In many\
    \ other fields, the dominant approach to optimization is to design optimization\
    \ algorithms for a limited family of functions.\n\n+   - The family of functions\
    \ used in deep learning is quite complicated and complex"
  - "[PAGE 192]\n\n# Stochastic gradient descent\n\n+   - Given $n$ training samples,\
    \ our target function can be expressed as\n+   \n+     $$J(w) = \\sum_{p=1}^{n}\
    \ J_p(w)$$\n\n+   - Batch gradient descent\n+   \n+     $$w \\leftarrow w - \\\
    eta \\sum_{p=1}^{n} \\nabla J_p(w)$$\n\n+   - In some cases, evaluating the sum-gradient\
    \ may be computationally expensive. Stochastic gradient descent samples a subset\
    \ of summand functions at every step. This is very effective in the case of large-scale\
    \ machine learning problems. In stochastic gradient descent, the true gradient\
    \ of $J(w)$ is approximated by a gradient at a single example (or a mini-batch\
    \ of samples):\n+   \n+     $$w \\leftarrow w - \\eta \\nabla J_p(w)$$"
  - '[PAGE 193]


    # Stochastic backpropagation


    # Algorithm 1 (Stochastic backpropagation)


    ```

    1 begin initialize network topology (# hidden units), w, criterion θ, η, m ← 0

    2 do m ← m + 1

    3 x^m ← randomly chosen pattern

    4 w_ij ← w_ij + η ∂J/∂w_ij; w_jk ← w_jk + η ∂J/∂w_jk

    5 until ∇J(w) < θ

    6 return w

    7 end

    ```


    In stochastic training, a weight update may reduce the error on the single pattern
    being presented, yet increase the error on the full training set.'
  - '[PAGE 194]


    # Mini-batch based stochastic gradient descent


    +   - Divide the training set into mini-batches.

    +   - In each epoch, randomly permute mini-batches and take a mini-batch sequentially
    to approximate the gradient

    +     - One epoch corresponds to a single presentations of all patterns in the
    training set

    +   - The estimated gradient at each iteration is more reliable

    +   - Start with a small batch size and increase the size as training proceeds'
  - '[PAGE 195]


    # Batch backpropagation


    # Algorithm 2 (Batch backpropagation)


    ```

    1 begin initialize network topology (# hidden units), w, criterion θ, η, r ← 0

    2 do r ← r + 1 (increment epoch)

    3 m ← 0; Δwij ← 0; Δwjk ← 0

    4 do m ← m + 1

    5 x^m ← select pattern

    6 Δwij ← Δwij + ηδj x_i; Δwjk ← Δwjk + ηδk y_j

    7 until m = n

    8 wij ← wij + Δwij; wjk ← wjk + Δwjk

    9 until ∇J[w] < θ

    10 return w

    11 end

    ```'
  - '[PAGE 196]


    # Summary


    +   - **Stochastic learning**

    +     - Estimate of the gradient is noisy, and the weights may not move precisely
    down the gradient at each iteration

    +     - Faster than batch learning, especially when training data has redundancy

    +     - Noise often results in better solutions

    +     - The weights fluctuate and it may not fully converge to a local minimum

    +   - **Batch learning**

    +     - Conditions of convergence are well understood

    +     - Some acceleration techniques only operate in batch learning

    +     - Theoretical analysis of the weight dynamics and convergence rates are
    simpler'
