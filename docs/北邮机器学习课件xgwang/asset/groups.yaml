  - '[PAGE 204]


    # Error surfaces


    +   - Backpropagation is based on gradient descent and tries to find the minimum
    point of the error surface **J(w)**

    +   - Generally speaking, it is unlikely to find the global minimum since the
    error surface is usually very complex

    +   - Backpropagation stops at local minimum and plateaus (regions where error
    varies only slightly as a function of weights)

    +   - Therefore, it is important to find a good initialization for backpropagation
    (through pre-training)


    ![](img/a04b187c89c5018c5ef6132980e27196_204_0.png)'
  - '[PAGE 205]


    # Learning rate


    +   - Decrease the learning rate when the weight vector "oscillates" and increase
    it when the weight vector follows a steady direction

    +   - One can choose a different learning rate for each weights, so that all the
    weights in the network converge roughly at the same speed


    ![](img/a04b187c89c5018c5ef6132980e27196_205_0.png)


    Gradient descent in a 1D quadratic criterion with different learning rates. The
    optimal learning rate is found by η_opt = (∂²J / ∂w²)⁻¹.'
  md: "\n## Plot learning curves on the training and validation sets\n\n![](img/a04b187c89c5018c5ef6132980e27196_197_0.png)\n\
    \nPlot the average error per pattern (i.e. 1/n ∑_p J_p) versus the number of epochs.\n\
    \n## Learning curve on the training set\n\n- The average training error typically\
    \ decreases with the number of epochs and reaches an asymptotic value.\n- This\
    \ asymptotic value could be high if underfitting happens. The reasons could be:\n\
