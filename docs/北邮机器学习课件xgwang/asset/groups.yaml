  - "[PAGE 29]\n\n# Discriminative model\n\n+   Parameter θ = {w_k} can be estimated\
    \ from maximizing the data likelihood\n+   \n+   θ̂ = arg max_θ P(D_n|θ) = arg\
    \ max_θ ∏_{i=1}^n P(y_i^{(train)} | x_n^{(train)}, θ)\n\n+   Maximum a posteriori\
    \ (MAP) estimation\n+   \n+   θ = arg max_θ p(θ|D_n) = arg max_θ log P(D_n|θ)\
    \ + log p(θ)\n\n+   According to the Bayes' rule, i.e., p(θ|D_n) = P(D_n|θ)p(θ)/P(D_n).\n\
    +   \n+   θ = arg max_θ log P(D_n|θ) + log p(θ)\n\n+   θ = arg max_θ Σ_{i=1}^n\
    \ log P(y_n^{(train)} | x_n^{(train)}, θ) + log p(θ)\n\n+   prior p(θ) corresponds\
    \ to a regularizer, e.g.\n+   \n+   p(θ) = e^{-λ||θ||^2}"
  - "[PAGE 30]\n\n# Generative model\n\n+   - Estimate the underlying class conditional\
    \ probability densities p(x|y = k) and then construct the classifier using the\
    \ Bayesian decision theory\n+   \n+     $P(y = k|x) = \\frac{p(x|y = k)P(y = k)}{p(x)}\
    \ = \\frac{p(x|y = k)P(y = k)}{\\sum_{k'=1}^{K} p(x|y = k')P(y = k')}$\n+   \n\
    +   - p(x|y) and P(y) are parameterized by θ\n+   \n+   - Prior P(y) can be used\
    \ to model the dependency among predictions, such as the segmentation labels of\
    \ pixels or predictions of speech sequences.\n+   \n+   - It is more difficult\
    \ to model class conditional probability densities. However, it also adds stronger\
    \ regularization to model fitting, since the learned model not only needs to predict\
    \ class labels but also generate the input data.\n+   \n+   - It is easier to\
    \ add domain knowledge when designing the models of p(x|y)"
  - '[PAGE 31]


    # Supervised and unsupervised learning


    +   - Supervised learning: the goal is to use input-label pairs, (x, y) to learn
    a function f that predicts a label (or a distribution over labels) given the input,
    ŷ = f(x)

    +   - Unsupervised learning: no label or other target is provided. The data consists
    of a set of examples x and the objective is to learn about the statistical structure
    of x itself.

    +   - Weakly supervised learning: the training data contains (x, y) pairs as in
    supervised learning, but the labels y are either unreliably present (i.e. with
    missing values) or noisy (i.e. where the label given is not the true label)'
  - '[PAGE 32]


    # Unsupervised learning


    +   - Find the “best” representation of data that reserves as much information
    about **x** as possible while being “simpler” than **x**

    +     Taking linear case as an example


    $$\tilde{x}=a_0+\sum_{i=1}^{d''}a_i e_i$$


    +   - Lower dimensional representation: $d'' < d$

    +   - Sparse representation: the number of non-zero $a_i$ is small

    +   - Independent representation: disentangle the sources of variations underlying
    the data distributions such that the dimensions of the representation are statistically
    independent, i.e. $a_i$ and $a_j$ are statistically independent


    +   - Deep learning is to learn data representation, but in a nonlinear and hierarchical
    way'
  - '[PAGE 33]


    # Principal Component Analysis (PCA)


    +   - There are n d-dimensional samples x₁, ..., xₙ.

    +   - PCA seeks a principal subspace spanned by d′ (d′ < d) orthonormal vectors
    e₁, ..., e_d′, such that

    +     - the projected samples (x̂_k = a₀ + Σ_{i=1}^{d′} a_{ki} e_i) onto this
    subspace has maximum variance; or equivalently

    +     - the mean squared distance between the samples and their projections are
    minimized.

    +   - The projections {a_{ki}} are uncorrelated (i.e. independent if data distribution
    is assumed as Gaussian distribution)


    ![](img/a04b187c89c5018c5ef6132980e27196_33_0.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_33_1.png)'
  - '[PAGE 34]


    # Formulation of PCA


    or


    arg max_{ {e_i} } sum_{k=1}^{n} || x̃_k - x̄ ||^2


    arg min_{ {e_i} } sum_{k=1}^{n} || x_k - x̃_k ||^2


    ( || x_k - x̄ ||^2 = || x_k - x̃_k ||^2 + || x̃_k - x̄ ||^2 )'
  - '[PAGE 35]


    # Zero- and One-Dimensional Representations by PCA


    zero-dimensional representation: use a single vector x₀ to represent all the samples
    and minimize the squared-error function


    J₀(x₀) = Σₖ=1ⁿ ||x₀ − xₖ||²


    The solution is x₀ = x̄ = 1/n Σₖ=1ⁿ xₖ


    One-dimensional representation: project the data to a line running through the
    sample mean, x̃ₖ = x̄ + aₖ₁ e₁ and minimize the squared-error criterion function


    J₁(a₁₁, ..., aₙ₁, e₁) = Σₖ=1ⁿ ||x̃ₖ − xₖ||²'
  md: '

    ## Discriminative model


    - Parameter θ = {w_k} can be estimated from maximizing the data likelihood

    - θ̂ = arg max_θ P(D_n|θ) = arg max_θ ∏_{i=1}^n P(y_i^{(train)} | x_n^{(train)},
    θ)

    - Maximum a posteriori (MAP) estimation

    - θ = arg max_θ p(θ|D_n) = arg max_θ log P(D_n|θ) + log p(θ)

    - According to the Bayes'' rule, i.e., p(θ|D_n) = P(D_n|θ)p(θ)/P(D_n).

    - θ = arg max_θ log P(D_n|θ) + log p(θ)

    - θ = arg max_θ Σ_{i=1}^n log P(y_n^{(train)} | x_n^{(train)}, θ) + log p(θ)

    - prior p(θ) corresponds to a regularizer, e.g.

    - p(θ) = e^{-λ||θ||^2}


    ## Generative model


    - Estimate the underlying class conditional probability densities p(x|y = k) and
    then construct the classifier using the Bayesian decision theory

    - $P(y = k|x) = \frac{p(x|y = k)P(y = k)}{p(x)} = \frac{p(x|y = k)P(y = k)}{\sum_{k''=1}^{K}
    p(x|y = k'')P(y = k'')}$

    - p(x|y) and P(y) are parameterized by θ

    - Prior P(y) can be used to model the dependency among predictions, such as the
    segmentation labels of pixels or predictions of speech sequences.

    - It is more difficult to model class conditional probability densities. However,
    it also adds stronger regularization to model fitting, since the learned model
    not only needs to predict class labels but also generate the input data.

    - It is easier to add domain knowledge when designing the models of p(x|y)


    ## Supervised and unsupervised learning


    - Supervised learning: the goal is to use input-label pairs, (x, y) to learn a
    function f that predicts a label (or a distribution over labels) given the input,
    ŷ = f(x)

    - Unsupervised learning: no label or other target is provided. The data consists
    of a set of examples x and the objective is to learn about the statistical structure
    of x itself.

    - Weakly supervised learning: the training data contains (x, y) pairs as in supervised
    learning, but the labels y are either unreliably present (i.e. with missing values)
    or noisy (i.e. where the label given is not the true label)


    ## Unsupervised learning


    - Find the “best” representation of data that reserves as much information about
    **x** as possible while being “simpler” than **x**

    - Taking linear case as an example


    $$\tilde{x}=a_0+\sum_{i=1}^{d''}a_i e_i$$


    - Lower dimensional representation: $d'' < d$

    - Sparse representation: the number of non-zero $a_i$ is small

    - Independent representation: disentangle the sources of variations underlying
    the data distributions such that the dimensions of the representation are statistically
    independent, i.e. $a_i$ and $a_j$ are statistically independent

    - Deep learning is to learn data representation, but in a nonlinear and hierarchical
    way


    ## Principal Component Analysis (PCA)


    - There are n d-dimensional samples x₁, ..., xₙ.

    - PCA seeks a principal subspace spanned by d′ (d′ < d) orthonormal vectors e₁,
    ..., e_d′, such that

    - the projected samples (x̂_k = a₀ + Σ_{i=1}^{d′} a_{ki} e_i) onto this subspace
    has maximum variance; or equivalently

    - the mean squared distance between the samples and their projections are minimized.

    - The projections {a_{ki}} are uncorrelated (i.e. independent if data distribution
    is assumed as Gaussian distribution)


    ![](img/a04b187c89c5018c5ef6132980e27196_33_0.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_33_1.png)


    ## Formulation of PCA


    or


    arg max_{ {e_i} } sum_{k=1}^{n} || x̃_k - x̄ ||^2


    arg min_{ {e_i} } sum_{k=1}^{n} || x_k - x̃_k ||^2


    ( || x_k - x̄ ||^2 = || x_k - x̃_k ||^2 + || x̃_k - x̄ ||^2 )


    ## Zero- and One-Dimensional Representations by PCA


    zero-dimensional representation: use a single vector x₀ to represent all the samples
    and minimize the squared-error function


    J₀(x₀) = Σₖ=1ⁿ ||x₀ − xₖ||²


    The solution is x₀ = x̄ = 1/n Σₖ=1ⁿ xₖ


    One-dimensional representation: project the data to a line running through the
    sample mean, x̃ₖ = x̄ + aₖ₁ e₁ and minimize the squared-error criterion function


    J₁(a₁₁, ..., aₙ₁, e₁) = Σₖ=1ⁿ ||x̃ₖ − xₖ||²

    '
