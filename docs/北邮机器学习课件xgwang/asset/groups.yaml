- raw:
  - '[PAGE 46]


    # Smoothness Prior


    +   - Shallow models assume smoothness prior on the prediction function to be
    learned, i.e.

    +     $$f^*(\mathbf{x}) \approx f^*(\mathbf{x}+\epsilon)$$

    +     where $\epsilon$ is a small change.


    +   - K-nearest neighbor predictors assume piecewise constant

    +     - For classification and $K = 1$, $f(x)$ is the output class associated
    with the nearest neighbor of $x$ in the training set

    +     - For regression, $f(x)$ is the average of the outputs associated with the
    $K$ nearest neighbors of $x$

    +     - The number of distinguishable regions cannot be more than the number of
    training examples


    ![](img/a04b187c89c5018c5ef6132980e27196_46_0.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_46_1.png)'
  - '[PAGE 47]


    # Interpolation with Kernel


    f(x) = b + Σ_{i=1}^{n} α_i K(x, x_i)


    K is a kernel function, e.g., the Gaussian kernel


    K(u, v) = N(u − v, 0, σ²)


    +   - b and α_i can be learned by SVM

    +   - Treat each x_i is a template and the kernel function as a similarity function
    that matches a template and a test example


    ![](img/a04b187c89c5018c5ef6132980e27196_47_0.png)'
  - '[PAGE 48]


    # Local Representation


    +   - One can think of the training samples as control knots which locally specify
    the shape of the prediction function


    +   - The smoothness prior only allows the learner to generalize locally. If $(\mathbf{x}_i,
    y_i)$ is a supervised training example and $\mathbf{x}_i$ is a near neighbor of
    $\mathbf{x}$, we expect that $f(\mathbf{x}) \approx y_i$. Better generalization
    can be obtained with more neighbors.


    +   - To distinguish $O(N)$ regions in the input space, shallow models require
    $O(N)$ examples (and typically there are $O(N)$ parameters associated with the
    $O(N)$ regions).


    ![](img/a04b187c89c5018c5ef6132980e27196_48_0.png)'
  - '[PAGE 49]


    # Local Representation


    +   - If the function is complex, more regions and more training samples are required.

    +   - The representation learned by deep models can be generalized non-locally


    ![](img/a04b187c89c5018c5ef6132980e27196_49_0.png)'
  - '[PAGE 50]


    Yoshua Bengio, Ian Goodfellow and Aaron Courville, Chapter 1 "Machine Learning
    Basics" in "Deep Learning," Book in preparation for MIT Press, 2014.


    http://www.iro.umontreal.ca/~bengioy/dlbook'
  - '[PAGE 51]


    # MultiLayer Neural Networks


    Xiaogang Wang


    xgwong@ee.cuhk.edu.hk


    January 18, 2015'
  - '[PAGE 52]


    <!-- no content -->'
  - '[PAGE 53]


    # History of neural network


    +   - Pioneering work on the mathematical model of neural networks

    +     - McCulloch and Pitts 1943

    +     - Include recurrent and non-recurrent (with "circles") networks

    +     - Use thresholding function as nonlinear activation

    +     - No learning


    +   - Early works on learning neural networks

    +     - Starting from Rosenblatt 1958

    +     - Using thresholding function as nonlinear activation prevented computing
    derivatives with the chain rule, and so errors could not be propagated back to
    guide the computation of gradients


    +   - Backpropagation was developed in several steps since 1960

    +     - The key idea is to use the chain rule to calculate derivatives

    +     - It was reflected in multiple works, earliest from the field of control'
  - '[PAGE 54]


    # History of neural network


    +   - Standard backpropagation for neural networks

    +     - Rumelhart, Hinton, and Williams, *Nature* 1986. Clearly appreciated the
    power of backpropagation and demonstrated it on key tasks, and applied it to pattern
    recognition generally

    +     - In 1985, Yann LeCun independently developed a learning algorithm for three-layer
    networks in which target values were propagated, rather than derivatives. In 1986,
    he proved that it was equivalent to standard backpropagation


    +   - Prove the universal expressive power of three-layer neural networks

    +     - Hecht-Nielsen 1989


    +   - Convolutional neural network

    +     - Introduced by Kunihiko Fukushima in 1980

    +     - Improved by LeCun, Bottou, Bengio, and Haffner in 1998'
  - '[PAGE 55]


    # History of neural network


    +   Deep belief net (DBN)


    +   Hinton, Osindero, and Tech 2006


    +   Auto encoder


    +   Hinton and Salakhutdinov 2006 (Science)


    +   Deep learning


    +   Hinton. Learning multiple layers of representations. Trends in Cognitive Sciences,
    2007.


    +   Unsupervised multilayer pre-training + supervised fine-tuning (BP)


    +   Large-scale deep learning in speech recognition


    +   Geoff Hinton and Li Deng started this research at Microsoft Research Redmond
    in late 2009


    +   Generative DBN pre-training was not necessary


    +   Success was achieved by large-scale training data + large deep neural network
    (DNN) with large, context-dependent output layers'
