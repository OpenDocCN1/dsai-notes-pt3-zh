  - '[PAGE 75]


    # Example 2


    +   - Choose cross entropy as training error measurement and softmax as activation
    function at the output layer

    +   - Sensitivity \(\delta_k = -t_k(z_k - 1)\) (how to get it?)

    +   - \(\delta_k\) is large if error is large, even if \(z_k\) gets close to 0

    +   - Softmax leads to sparser output'
  - '[PAGE 76]


    # Input-to-hidden weights


    Group truth


    ![](img/a04b187c89c5018c5ef6132980e27196_76_0.png)


    $y_j = f(net_j)$


