    \ is no linear self-recurrence, only the nonlinear update which we can find in\
    \ ordinary recurrent networks.\n- When $\\tau > 1$, this linear recurrence allows\
    \ gradients to propagate more easily. When $\\tau$ is large, the state changes\
    \ very slowly, integrating the past values associated with the input sequence.\n\
    - $\\tau$ controls the rate of forgetting old states. It can be viewed as a smooth\
