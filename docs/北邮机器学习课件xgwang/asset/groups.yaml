  - '[PAGE 20]


    # Regularization


    +   - Equivalent to imposing a preference over the set of functions that a learner
    can obtain as a solution

    +   - In Bayesian learning, it is reflected as a prior probability distribution
    over the space of functions (or equivalently their parameters) that the learn
    can assess

    +   - Regularization prevents overfitting by adding penalty for complexity

    +   - Training a classifier/regressor is to minimize

    +     Prediction error on the training set + regularization

    +   - Examples

