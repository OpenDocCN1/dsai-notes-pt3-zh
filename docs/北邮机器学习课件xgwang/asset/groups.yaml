    \n对于 C 类分类问题，目标向量表示为\n(1...0...0)\n...\n(0...1...0)\n...\n(0...0...1)\n\n## 三层神经网络\n\
    - 网络激活：每个隐藏单元 j 计算其输入的加权和\n  \n  $net_j = \\sum_{i=1}^{d} x_i w_{ij} + w_{j0}\
    \ = \\sum_{i=0}^{d} x_i w_{ij} = w_j^T x$\n\n- 激活函数：每个隐藏单元输出其激活的非线性函数\n  \n  $y_j\
    \ = f(net_j)$\n  \n  $f(net) = Sgn(net) = \\begin{cases} 1, & \\text{if } net\
    \ \\ge 0 \\\\ -1, & \\text{if } net < 0 \\end{cases}$\n\n激活函数有多种选择，只要它们几乎处处连续且可微即可。不同节点的激活函数可以不同。\n\
    \n## 三层神经网络\n输出单元 k 的网络激活\n\nnet_k = Σ_{i=1}^{n_h} y_i w_{kj} + w_{k0} = Σ_{j=0}^{n_h}\
    \ y_j w_{kj} = w_k^T y\n\n输出单元发出\n\nz_k = f(net_k)\n\n神经网络的输出等价于一组判别函数\n\ng_k(x)\
    \ = z_k = f( Σ_{j=1}^{n_h} w_{kj} f( Σ_{i=1}^{d} w_{ji} x_i + w_{j0} ) + w_{k0}\
    \ )\n\n## 三层神经网络的表达能力\n- 它可以表示**任意**判别函数\n- 然而，所需要的隐藏单元数量可能非常大...\n- 大多数广泛使用的模式识别模型（如\
    \ SVM、boosting 和 KNN）可以近似为具有一层或两层隐藏层的神经网络。它们被称为具有浅层架构的模型。\n- 浅层模型将特征空间划分为区域并在局部区域匹配模板。表示\
    \ N 个区域需要 O(N) 个参数。\n- 深度架构：对于某些问题，随着层数的增加，隐藏节点数量可以呈指数级减少。\n\n## 三层神经网络的表达能力\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_64_0.png)\n\nKNN\ninput x\nhidden d(x,\
    \ x_i)\noutput g(x)=label\nj = argmin_i d(x, x_i)\n\n![](img/a04b187c89c5018c5ef6132980e27196_64_1.png)\n\
    \nSVM\ninput x\nhidden K(x, x_i)\noutput g(x)=b + sum_i a_i K(x, x_i)\n\n![](img/a04b187c89c5018c5ef6132980e27196_64_2.png)\n\
    \n## 反向传播\n- 多层神经网络监督训练的最通用方法\n- 呈现一个输入模式并改变网络参数，使实际输出更接近目标值\n- 学习输入到隐藏和隐藏到输出的权重\n\
    - 然而，没有明确的教师来说明隐藏单元的输出应该是什么。反向传播为每个隐藏单元计算一个有效误差，从而推导出输入到隐藏权重的学习规则。\n\n## 训练误差\n\
    \nJ(W) = 1/2 Σ_{k=1}^c (t_k - z_k)^2 = 1/2 ||t - z||^2\n\n- 可微分\n- 还有其他选择，例如交叉熵\n\
    \nJ(W) = - Σ_{k=1}^c t_k log(z_k)\n\n两者 {z_k} 和 {t_k} 都是概率分布。\n\n"
