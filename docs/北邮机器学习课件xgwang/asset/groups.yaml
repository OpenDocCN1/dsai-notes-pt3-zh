  - '[PAGE 240]


    # What is domain adaptation?


    +   - **Supervised DA**, a small amount of labeled target data are present. However,
    the labeled data are commonly not sufficient for tasks.

    +   - **Semi-supervised DA**, both limited labeled data and redundant unlabeled
    data in the target domain are available in the training stage, which allows the
    networks to learn the structure information of the target domain.

    +   - **Unsupervised DA**, no labeled but sufficient unlabeled target domain data
    are observable when training the network.


    ![](img/a04b187c89c5018c5ef6132980e27196_240_0.png)'
