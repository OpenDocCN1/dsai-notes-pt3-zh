    \  - Krizhevsky, Sutskever, and Hinton 2012\n  - Supervised learning with convolutional\
    \ neural network\n  - No unsupervised pre-training\n\n## Two-layer neural networks\
    \ model linear classifiers\n\n![](img/a04b187c89c5018c5ef6132980e27196_57_0.png)\n\
    \n(Duda et al. Pattern Classification 2000)\n\ng(x) = f(∑_{i=1}^{d} x_i w_i +\
    \ w_0) = f(w' x)\n\nf(s) = { 1, if s ≥ 0 ; -1, if s < 0 }\n\n## Two-layer neural\
    \ networks model linear classifiers\n- A linear classifier cannot solve the simple\
    \ exclusive-OR problem\n\n![](img/a04b187c89c5018c5ef6132980e27196_58_0.png)\n\
    \n## Add a hidden layer to model nonlinear classifiers\n\n![](img/a04b187c89c5018c5ef6132980e27196_59_0.png)\n\
    \n(Duda et al. Pattern Classification 2000)\n\n## Three-layer neural network\n\
    \n![](img/a04b187c89c5018c5ef6132980e27196_60_0.png)\n\nFor C-class classification\
    \ problem, the target vectors are represented as\n(1...0...0)\n...\n(0...1...0)\n\
    ...\n(0...0...1)\n\n## Three-layer neural network\n- Net activation: each hidden\
    \ unit j computes the weighted sum of its inputs\n  \n  $net_j = \\sum_{i=1}^{d}\
    \ x_i w_{ij} + w_{j0} = \\sum_{i=0}^{d} x_i w_{ij} = w_j^T x$\n\n- Activation\
    \ function: each hidden unit emits an output that is a nonlinear function of its\
    \ activation\n  \n  $y_j = f(net_j)$\n  \n  $f(net) = Sgn(net) = \\begin{cases}\
    \ 1, & \\text{if } net \\ge 0 \\\\ -1, & \\text{if } net < 0 \\end{cases}$\n\n\
    There are multiple choices of the activation function as long as they are continuous\
    \ and differentiable almost everywhere. Activation functions could be different\
    \ for different nodes.\n\n## Three-layer neural network\nNet activation of an\
    \ output unit k\n\nnet_k = Σ_{i=1}^{n_h} y_i w_{kj} + w_{k0} = Σ_{j=0}^{n_h} y_j\
    \ w_{kj} = w_k^T y\n\nOutput unit emits\n\nz_k = f(net_k)\n\nThe output of the\
    \ neural network is equivalent to a set of discriminant functions\n\ng_k(x) =\
    \ z_k = f( Σ_{j=1}^{n_h} w_{kj} f( Σ_{i=1}^{d} w_{ji} x_i + w_{j0} ) + w_{k0}\
    \ )\n\n## Expressive power of a three-layer neural network\n- It can represent\
    \ **any** discriminant function\n- However, the number of hidden units required\
    \ can be very large...\n- Most widely used pattern recognition models (such as\
    \ SVM, boosting, and KNN) can be approximated as neural networks with one or two\
    \ hidden layers. They are called models with shallow architectures.\n- Shallow\
    \ models divide the feature space into regions and match templates in local regions.\
    \ O(N) parameters are needed to represent N regions.\n- Deep architecture: the\
    \ number of hidden nodes can be reduced exponentially with more layers for certain\
    \ problems.\n\n## Expressive power of a three-layer neural network\n\n![](img/a04b187c89c5018c5ef6132980e27196_64_0.png)\n\
    \nKNN\ninput x\nhidden d(x, x_i)\noutput g(x)=label\nj = argmin_i d(x, x_i)\n\n\
    ![](img/a04b187c89c5018c5ef6132980e27196_64_1.png)\n\nSVM\ninput x\nhidden K(x,\
    \ x_i)\noutput g(x)=b + sum_i a_i K(x, x_i)\n\n![](img/a04b187c89c5018c5ef6132980e27196_64_2.png)\n\
    \n## Backpropagation\n- The most general method for supervised training of multilayer\
    \ neural network\n- Present an input pattern and change the network parameters\
    \ to bring the actual outputs closer to the target values\n- Learn the input-to-hidden\
    \ and hidden-to-output weights\n- However, there is no explicit teacher to state\
    \ what the hidden unit’s output should be. Backpropagation calculates an effective\
    \ error for each hidden unit, and thus derive a learning rule for the input-to-hidden\
    \ weights.\n\n## Training error\n\nJ(W) = 1/2 Σ_{k=1}^c (t_k - z_k)^2 = 1/2 ||t\
    \ - z||^2\n\n- Differentiable\n- There are other choices, such as cross entropy\n\
    \nJ(W) = - Σ_{k=1}^c t_k log(z_k)\n\nBoth {z_k} and {t_k} are probability distributions.\n"
  mdcn: "\n\n## 神经网络的历史\n- 大规模图像的无监督深度学习\n  - Andrew Ng 等人 2011\n  - 无监督特征学习\n  -\
