    | Commercial APIs | **Mean** | **98.11** | **90.27** | **86.28** | **86.82** |
    **81.89** |


    ![](img/a04b187c89c5018c5ef6132980e27196_282_0.png)


    > [17] Wang M, Deng W, Hu J, et al. Racial Faces in-the-Wild: Reducing Racial
