    | Truth | Ulrich Hackenberg, membre du conseil d’administration du constructeur
    automobile Audi, déclare que la collecte des téléphones portables avant les trajets
    du conseil, afin qu’ils ne soient pas utilisés comme appareils d’écoute à distance,
    est une pratique courante depuis des années. |

    | Our model | « Les téléphones cellulaires, qui sont vraiment une question, non
    seulement parce qu’ils pourraient potentiellement causer des interférences avec
    les appareils de navigation, mais aussi parce qu’ils pourraient interférer avec
    les tours de téléphone cellulaire lorsqu’ils sont dans l’air », dit UNK. |

    | Truth | « Les téléphones portables sont véritablement un problème, non seulement
    parce qu’ils pourraient éventuellement créer des interférences avec les instruments
    de navigation, mais aussi parce qu’ils pourraient interférer avec les antennes
    relais de téléphone mobile si ils sont utilisés à bord », a déclaré Rosenber.
    |

    | Our model | Avec la création, il y a un « sentiment de violence contre le corps
    d’un être cher » qui sera réduit à une pile de cendres », en très peu de temps,
    au lieu d’un processus de décomposition, qui accompagnera les phases du deuil.
    |

    | Truth | Il y a, avec la création, « une violence faite au corps aimé » qui va
    être « réduit à un tas de cendres » en très peu de temps, et non après un processus
    de décomposition, qui accompagnera les phases du deuil. |


    ## Generate image caption


    - Vinyals et al. arXiv 2014

    - Use a CNN as an image encoder and transform it to a fixed-length vector

    - It is used as the initial hidden state of a "decoder" RNN that generates the
    target sequence


    ![](img/a04b187c89c5018c5ef6132980e27196_173_0.png)


    ## Generate image caption


    - The learning process is to maximize the probability of the correct description
    given the image


    θ* = arg max Σ_{(I,S)} log P(S|I; θ)


    log P(S|I) = Σ_{t=0}^{N} log P(S_t | S_0, ..., S_{t-1})


    I is an image and S is its correct description


    ![](img/a04b187c89c5018c5ef6132980e27196_174_0.png)


    ## Generate image caption


    - Denote by S₀ a special start work and by S_N a special stop word

    - Both the image and the words are mapped to the same space, the image by using
    CNN, the words by using word embedding W_e

    - The image I is only input once at t = 1 to inform the LSTM about the image contents

    - Sampling: sample the first word according to P₁, then provide the corresponding
    embedding as input and sample P₂, continuing like this until it samples the special
    end-of-sentence token


    x₋₁ = CNN(I)


    x_t = W_e S_t, t ∈ {0, ..., N − 1}


    P_{t+1} = LSTM(x_t), t ∈ {0, ..., N − 1}


    L(I, S) = Σ_{t=1}^{N} log P_t(S_t)


    ## Translate videos to sentences


    - Venugopalan et al. arXiv 2014

    - The challenge is to capture the joint dependencies of a sequence of frames and
    a corresponding sequence of words

    - Previous works simplified the problem by detecting a fixed set of semantic roles,
    such as subject, verb, and object, as an intermediate representation and adopted
    oversimplified rigid sentence templates.


    Input video:


    ![](img/a04b187c89c5018c5ef6132980e27196_176_0.png)


    Machine output: A cat is playing with toy.


    Humans: A Ferret and cat fighting with each other. / A cat and a ferret are playing.
    / A kitten and a ferret are playfully wrestling.

    '
