- pgno: 119
  md: '# Predictive Sparse Decomposition


    +   - Sparse coding

    +     - Solving the encoder $f_0$ is non-trivial because of $L_1$ minimization
    and entails an iterative optimization

    +     - $y^* = f_0(x) = \arg\min_y \|x - Wy\|_2^2 + \lambda\|y\|_1$

    +     - $J_{SC} = \sum_n \|x^{(n)} - Wy^{(n)}\|_2^2$


    +   - Predictive sparse decomposition

    +     - Approximation to sparse coding

    +     - Add sparse penalty to auto-encoder

    +     - Replace the costly and highly non-linear encoding step by a fast non-iterative
    approximation


    The training criterion is simultaneously optimized with respect to the hidden
    codes (representation) $y^{(n)}$ and with respect to the parameters $\theta$


    $J_{PSD} = \sum_n \lambda\|y^{(n)}\|_1 + \|x^{(n)} - Wy^{(n)}\|_2^2 + \|y^{(n)}
    - f_0(x^{(n)})\|_2^2$


    $f_0(x^{(n)}) = \sigma(b + W^T x^{(n)})$'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Multimodal deep learning


    +   - Ngiam et al. ICML''11 (audio-visual speech recognition)

    +   - Multimodal fusion: data from all modalities is available at all phases

    +   - Cross modality learning: data from multiple modalities is available only
    during feature learning; during supervised training and testing, only data from
    a single modality is provided. The aim is to learn better single modality representations
    given unlabeled data from multiple modalities.

    +   - Matching across different modalities

    +   - A direct approach is to train a RBM over the concatenated audio and video
    data. Limited as a shallow model, it is hard for a RBM to learn the highly nonlinear
    correlations and form multimodal representations

    +   - It was found that learning a shallow bimodal RBM results in hidden units
    that have strong connections to variables from individual modality but few units
    that connect across the modalities.


    ![](img/a04b187c89c5018c5ef6132980e27196_120_0.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_120_1.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_120_2.png)'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Multimodal deep learning


    +   - Bimodal DBN: greedily layerwise training a RBM over the pre-trained layers
    for each modality: by representing the data through learned multilayer representations,
    it can be easier for the model to learn higher-order correlations across modalities.
    In (d), the first layer representations correspond to phonemes and visemes and
    the second layer models the relationships between them.


    +   - Problems

    +     - It is possible for the model to find representations such that some hidden
    units are tuned only for audio while others are tuned only for video

    +     - It is not applicable in a cross modality learning setting where only one
    modality is present during supervised training and testing.


    ![](img/a04b187c89c5018c5ef6132980e27196_121_0.png)


    (d) Bimodal DBN'
