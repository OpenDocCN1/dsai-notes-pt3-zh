- pgno: 68
  md: '# Training error


    J(W) = 1/2 Σ_{k=1}^c (t_k - z_k)^2 = 1/2 ||t - z||^2


    +   - Differentiable

    +   - There are other choices, such as cross entropy


    J(W) = - Σ_{k=1}^c t_k log(z_k)


    Both {z_k} and {t_k} are probability distributions.'
  merge: -1
  img_proc: true
- pgno: 69
  md: "# Gradient descent\n\n+   - Weights are initialized with random values, and\
    \ then are changed in a direction reducing the error\n+   \n+     Δw = -η ∂J/∂W\n\
    +   \n+     or in component form\n+   \n+     Δw_pq = -η ∂J/∂w_pq\n+   \n+   \
    \  where η is the learning rate.\n\n+   - Iterative update\n+   \n+     w(m +\
    \ 1) = w(m) + Δw(m)"
  merge: -1
  img_proc: true
