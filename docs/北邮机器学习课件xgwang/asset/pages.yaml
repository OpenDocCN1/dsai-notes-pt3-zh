- pgno: 198
  md: '# Learning curve on the training set


    +   - The average training error typically decreases with the number of epochs
    and reaches an asymptotic value

    +   - This asymptotic value could be high if underfitting happens. The reasons
    could be

    +     - The classification problem is difficult (Bayes error is high) and there
    are a large number of training samples

    +     - The expressive power of the network is not enough (the numbers of weights,
    layers and nodes in each layer)

    +     - Bad initialization and get stuck at local minimum (pre-training for better
    initialization)

    +   - If the learning rate is low, the training error tends to decrease monotonically,
    but converges slowly. If the learning rate is high, the training error may oscillate.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Learning curve on the test and validation set


    The average error on the validation or test set is virtually always higher than
    on the training set. It could increase or oscillate when **overfitting** happen.
    The reasons could be


    +   - Training samples are not enough

    +   - The expressive power of the network is too high

    +   - Bad initialization and get stuck at local minimum (pre-training for better
    initialization)


    Stop training at a minimum of the error on the validation set'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Data augmentation


    +   - If the training set is small, one call synthesize some training samples
    by adding Gaussian noise to real training samples

    +   - Domain knowledge can be used to synthesize training samples. For example,
    in image classification, more training images can be synthesized by translation,
    scaling, and rotation.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Normalizing input


    +   - If the dynamic range of one input feature is much larger than others, during
    training, the network will mainly adjust weights on this feature while ignore
    others

    +   - We do not want to prefer one feature over others just because they differ
    solely measured units

    +   - To avoid such difficulty, the input patterns should be shifted so that the
    average over the training set of each feature is zero, and then be scaled to have
    the same variance as 1 in each feature

    +   - Input variables should be uncorrelated if possible

    +     - If inputs are uncorrelated then it is possible to solve for the value
    of one weight without any concern for other weights

    +     - With correlated inputs, one must solve for multiple weights simultaneously,
    which is a much harder problem

    +     - PCA can be used to remove linear correlations in inputs'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Shuffling the training samples


    打乱训练集


    +   - Networks learn the fastest from the most unexpected sample

    +   - Shuffle the training set so that successive training examples never (rarely)
    belong to the same class

    +   - Present input examples that produce a large error more frequently than examples
    that produce a small error

    +     - This technique applied to data containing outliers can be disastrous because
    outliers can produce large errors yet should not be presented frequently'
  merge: -1
  img_proc: true
