  md: '# Background


    More and more people find that a problematic issue, namely racial bias, has always
    been concealed in the previous studies due to biased benchmarks but explicitly
    degrades the performance in realistic FR systems.


    1 Amazon’s Rekognition Tool incorrectly matched 28 U.S. congressmen with criminals,
    especially non-Caucasian people.


    ![](img/a04b187c89c5018c5ef6132980e27196_274_0.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_274_1.png)


    2 The accuracies of 3 commercial gender classification algorithms drop largely
    on darker female faces.


    ![](img/a04b187c89c5018c5ef6132980e27196_274_2.png)


    3 MIT Technology Reviewer suggested that racial bias in databases will reflect
    in algorithms, hence the performances of FR systems depend on the race.


    ![](img/a04b187c89c5018c5ef6132980e27196_274_3.png)


    > [17]Wang M, Deng W, Hu J, et al. Racial Faces in-the-Wild: Reducing Racial Bias
    by Deep Unsupervised Domain Adaptation. arXiv preprint arXiv:1812.00194, 2018.'
