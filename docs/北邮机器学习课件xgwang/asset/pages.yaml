- pgno: 186
  md: '# Jacobian matrix and Hessian matrix


    +   - Jacobian matrix contains all of the partial derivatives of all the elements
    of a vector-valued function

    +   - Function f : R^m → R^n, then the Jacobian matrix J ∈ R^{n×m} of f is defined
    such that J_{ij} = ∂/∂x_j f(x)_i

    +   - The second derivative ∂²/∂x_i∂x_j f tells us how the first derivative will
    change as we vary the input. It is useful for determining whether a critical point
    is a local maximum, local minimum, or saddle point.

    +     - f''(x) = 0 and f''''(x) > 0: local minimum

    +     - f''(x) = 0 and f''''(x) < 0: local maximum

    +     - f''(x) = 0 and f''''(x) = 0: saddle point or a part of a flat region

    +   - Hessian matrix contains all of the second derivatives of the function

    +     H(f)(x)_{ij} = ∂²/∂x_i∂x_j f(x)'
  merge: -1
  img_proc: true
