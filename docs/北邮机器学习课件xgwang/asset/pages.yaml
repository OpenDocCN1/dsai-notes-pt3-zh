- pgno: 209
  md: "# Incorporation of momentum\n\n+   - Error surfaces often have plateaus where\
    \ there are \"to many\" weights (especially when the number of layers is large)\
    \ and thus the error depends only weakly upon any one of them.\n\n+   - Include\
    \ some fraction α of the previous weight update in stochastic backpropagation\n\
    +   \n+   **w(m + 1) = w(m) + (1 − α)Δw_bp(m) + αΔw(m − 1)**\n+   \n+   where\
    \ Δw_bp(m) is the change in w(m) that would be called for by the backpropagation\
    \ algorithm\n+   \n+   **Δw(m) = w(m) − w(m − 1)**\n\n+   - Allow the network\
    \ to learn more quickly when plateaus in the error surface exists"
  merge: -1
  img_proc: true
