- pgno: 9
  md: '# Underfitting


    +   - The learner cannot find a solution that fits training examples well

    +     - For example, use linear regression to fit training examples {x_i^(train),
    y_i^(train)} where y_i^(train) is an quadratic function of x_i^(train)

    +   - Underfitting means the learner cannot capture some important aspects of
    the data

    +   - Reasons for underfitting happening

    +     - Model is not rich enough

    +     - Difficult to find the global optimum of the objective function on the
    training set or easy to get stuck at local minimum

    +     - Limitation on the computation resources (not enough training iterations
    of an iterative optimization procedure)

    +   - Underfitting commonly happens in deep learning with large scale training
    data and could be even a more serious problem than overfitting in some cases'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Overfitting


    +   - The learner fits the training data well, but loses the ability to generalize
    well, i.e. it has small training error but larger generalization error

    +   - A learner with large capacity tends to overfit

    +     - The family of functions is too large (compared with the size of the training
    data) and it contains many functions which all fit the training data well.

    +     - Without sufficient data, the learner cannot distinguish which one is most
    appropriate and would make an arbitrary choice among these apparently good solutions

    +     - A separate validation set helps to choose a more appropriate one

    +     - In most cases, data is contaminated by noise. The learner with large capacity
    tends to describe random errors or noise instead of the underlying models of data
    (classes).


    在大多数情况下，数据受到噪声的污染。容量大的模型倾向于描述随机误差或噪声，而不是数据（类）的底层模型。'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Overfitting


    ![](img/a04b187c89c5018c5ef6132980e27196_11_0.png)


    Overly complex models lead to complicated decision boundaries. It leads to perfect
    classification on the training examples, but would lead to poor performance on
    new examples.


    ![](img/a04b187c89c5018c5ef6132980e27196_11_1.png)


    The decision boundary might represent the optimal tradeoff between performance
    on the training set and simplicity of classifier, therefore giving highest accuracy
    on new examples.


    > (Duda et al. Pattern Classification 2000)'
  merge: -1
  img_proc: true
- pgno: 12
  md: '机器学习的基本要素是模型容量和泛化之间的权衡。


    +   - The fundamental element of machine learning is the trade-off between capacity
    and generalization

    +   - Occam’s Razor states that among competing functions that could explains
    the training data, one should choose the “simpler” one. Simplicity is the opposite
    of capacity.

    +   - Occam’s Razor suggests us pick the family of functions just enough large
    enough to leave only one choice that fits well the data.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Optimal capacity


    +   - Difference between training error and generalization error increases with
    the capacity of the learner

    +   - Generalization error is a U-shaped function of capacity

    +   - Optimal capacity is associated with the transition from underfitting to
    overfitting

    +     - One can use a validation set to monitor generalization error empirically

    +   - Optimal capacity should increase with the number of training examples'
  merge: -1
  img_proc: true
- pgno: 14
  md: '![](img/a04b187c89c5018c5ef6132980e27196_14_0.png)


    Typical relationship between capacity and both training and generalization (or
    test) error. As capacity increases, training error can be reduced, but the optimism
    (difference between training and generalization error) increases. At some point,
    the increase in optimism is larger than the decrease in training error (typically
    when the training error is low and cannot go much lower), and we enter the overfitting
    regime, where capacity is too large, above the optimal capacity. Before reaching
    optimal capacity, we are in the underfitting regime.


    > (Bengio et al. Deep Learning 2014)'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Optimal capacity


    ![](img/a04b187c89c5018c5ef6132980e27196_15_0.png)


    As the number of training examples increases, optimal capacity (bold black) increases
    (we can afford a bigger and more flexible model), and the associated generalization
    error (green bold) would decrease, eventually reaching the (non-parametric) asymptotic
    error (green dashed line). If capacity was fixed (parametric setting), increasing
    the number of training examples would also decrease generalization error (top
    red curve), but not as fast, and training error would slowly increase (bottom
    red curve), so that both would meet at an asymptotic value (dashed red line) corresponding
    to the best achievable solution in some class of learned functions.


    > (Bengio et al. Deep Learning 2014)'
  merge: -1
  img_proc: true
