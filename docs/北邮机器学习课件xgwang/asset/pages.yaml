- pgno: 228
  md: '# Distributed computation with CPU cores


    +   - Model parallelism: Only those nodes with edges that cross partition boundaries
    will need to have their state transmitted between machines. Even in cases where
    a node has multiple edges crossing a partition boundary, its state is only sent
    to the machine on the other side of that boundary once.

    +   - Within each partition, computation for individual nodes will the be parallelized
    across all available CPU cores

    +   - It requires data synchronization and data transfer between machines during
    both training and inference


    ![](img/a04b187c89c5018c5ef6132980e27196_228_0.png)'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Distributed computation with CPU cores


    +   - Models with local connectivity structures tend to be more amendable to extensive
    distribution than fully-connected structures, given their lower communication
    requirements

    +   - Models with a large number of parameters or high computational demands typically
    benefit from access to more CPUs and memory, up to the point where communication
    costs dominate

    +   - It means that the speedup cannot keep increasing with infinite number of
    machines

    +   - The typical cause of less-than-ideal speedup is variance in processing times
    across the different machines, leading to many machines waiting for the single
    slowest machine to finish a given phase of computation'
  merge: -1
  img_proc: true
