- pgno: 189
  md: "# Hessian matrix\n\n+   Condition number: consider the function f(x) = A⁻¹x.\
    \ When A ∈ Rⁿˣⁿ has an eigenvalue decomposition, its condition number\n+   \n\
    +   maxᵢ,ⱼ |λᵢ / λⱼ|\n+   \n+   i.e. the ratio of the magnitude of the largest\
    \ and smallest eigenvalue. When this number is large, matrix inversion is particularly\
    \ sensitive to error in the input\n\n+   The Hessian can also be useful for understanding\
    \ the performance of gradient descent. When the Hessian has a poor condition number,\
    \ gradient descent performs poorly. This is because in one direction, the derivative\
    \ increases rapidly, while in another direction, it increases slowly. Gradient\
    \ descent is unaware of this change in the derivative so it does not know that\
    \ it needs to explore preferentially in the direction where the derivative remains\
    \ negative for longer."
  merge: -1
