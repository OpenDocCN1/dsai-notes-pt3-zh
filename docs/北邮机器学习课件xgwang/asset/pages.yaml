  md: '# Generative RNN modeling P(x₁, ..., x_T)


    +   - It can generate sequences from this distribution

    +   - At the training stage, each x_t of the observed sequence serves both as
    input (for the current time step) and as target (for the previous time step)

    +   - The output z_t encodes the parameters of a conditional distribution P(x_{t+1}|x₁,
    ..., x_t) = P(x_{t+1}|z_t) for x_{t+1} given the past sequence x₁, ..., x_t


