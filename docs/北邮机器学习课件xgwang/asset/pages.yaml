- pgno: 219
  md: '# Data parallelism


    +   - The mini-batch is split across several GPUs. Each GPU is responsible computing
    gradients with respect to all model parameters, but does so using a subset of
    the samples in the mini-batch

    +   - The model (parameters) has a complete (same) copy in each GPU

    +   - The gradients computed from multiple GPUs are averaged to update parameters
    in both GPUs


    ![](img/a04b187c89c5018c5ef6132980e27196_219_0.png)'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Drawbacks of data parallelism


    +   - Require considerable communication between GPUs, since each GPU must communicate
    both gradients and parameter values on every update step

    +   - Each GPU must use a large number of samples to effectively utilize the highly
    parallel device; thus, the mini-batch size effectively gets multiplied by the
    number of GPUs, hampering convergence'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Model parallelism


    +   - Consist of splitting an individual network''s computation across multiple
    GPUs

    +   - For instance, convolutional layer with N filters can be run on two GPUs,
    each of which convolves its input with N/2 filters


    ![](img/a04b187c89c5018c5ef6132980e27196_221_0.png)


    The architecture is split into two columns which make easier to split computation
    across the two GPUs'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Model parallelism


    +   - A mini batch has the same copy in each GPU

    +   - GPUs have to be synchronized and communicate at every layer if computing
    gradients in a GPU requires outputs of all the feature maps at the lower layer


    ![](img/a04b187c89c5018c5ef6132980e27196_222_0.png)'
