- pgno: 204
  md: '# Error surfaces


    +   - Backpropagation is based on gradient descent and tries to find the minimum
    point of the error surface **J(w)**

    +   - Generally speaking, it is unlikely to find the global minimum since the
    error surface is usually very complex

    +   - Backpropagation stops at local minimum and plateaus (regions where error
    varies only slightly as a function of weights)

    +   - Therefore, it is important to find a good initialization for backpropagation
    (through pre-training)


    ![](img/a04b187c89c5018c5ef6132980e27196_204_0.png)'
  merge: -1
