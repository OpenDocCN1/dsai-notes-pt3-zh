- pgno: 304
  md: "# 02 例程解析\n\n```\n# 准备学习数据\ntrain_X = np.random.normal(1, 5, 200) # 输入特征\n\
    train_Y = 0.5*train_X+2+np.random.normal(0,1,200) # 学习目标\nL = len(train_X) # 样本量\n\
    # 定义学习超参数\nepoch = 200 # 纪元数（使用所有学习数据一次为1纪元）\nlearn_rate = 0.005 # 学习速度\n# 定义数据流图\n\
    temp_graph = tf.Graph()\nwith temp_graph.as_default():\n    X = tf.placeholder(tf.float32)\
    \ # 定义张量占位符\n    Y = tf.placeholder(tf.float32)\n    k = tf.Variable(np.random.randn(),\
    \ dtype=tf.float32)\n    b = tf.Variable(0, dtype=tf.float32) # 定义变量\n    linear_model\
    \ = k*X+b # 线性模型\n    cost = tf.reduce_mean(tf.square(linear_model - Y)) # 代价函数\n\
    \    optimizer = tf.train.GradientDescentOptimizer(learning_rate=learn_rate) #\
    \ 梯度下降算法\n    train_step = optimizer.minimize(cost) # 最小化代价函数\n    init = tf.global_variables_initializer()\
    \ # 使用变量全局初始化选项\n```"
  merge: -1
  img_proc: true
- pgno: 305
  md: "![](img/a04b187c89c5018c5ef6132980e27196_305_0.png)\n\n# 02 例程解析\n\n```\n#\
    \ 定义数据流图\ntemp_graph = tf.Graph()\nwith temp_graph.as_default():\n    X = tf.placeholder(tf.float32)\
    \ # 定义张量占位符\n    Y = tf.placeholder(tf.float32)\n    k = tf.Variable(np.random.randn(),\
    \ dtype=tf.float32)\n    b = tf.Variable(0, dtype=tf.float32) # 定义变量\n    linear_model\
    \ = k*X+b # 线性模型\n    cost = tf.reduce_mean(tf.square(linear_model - Y)) # 代价函数\n\
    \    optimizer = tf.train.GradientDescentOptimizer(learning_rate=learn_rate) #\
    \ 梯度下降算法\n    train_step = optimizer.minimize(cost) # 最小化代价函数\n    init = tf.global_variables_initializer()\
    \ # 使用变量全局初始化选项\n# 创建会话\n```\n\n```\nwith tf.Session(graph=temp_graph) as sess:\n\
    \    sess.run(init) # 变量初始化\n    for i in range(epoch):\n        sess.run(train_step,\
    \ feed_dict={X: train_X, Y: train_Y}) # 运行 “最小化代价函数”\n        temp_cost = sess.run(cost,\
    \ feed_dict={X: train_X, Y: train_Y}) # 代价函数\n```"
