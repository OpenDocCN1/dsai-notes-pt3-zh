- pgno: 4
  md: '# Training


    +   - Training: estimate the parameters of f from {(x_i^(train), y_i^(train))}

    +     - Decision boundary, parameters of P(y|x), and w in linear regression

    +   - Optimize an objective function on the training set. It is a performance
    measure on the training set and could be different from that on the test set.


    均方误差


    +   - Mean squared error (MSE) for linear regression

    +     MSE_train = 1/N Σ_i || w^T x_i^(train) - y_i^(train) ||_2^2


    交叉熵


    +   - Cross entropy (CE) for classification

    +     CE_train = 1/N Σ_i log P(y = y_i^(train) | x_i^(train))


    Why not use classification errors #{ f(x_i^(train)) ≠ y_i^(train) }?'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# Optimization


    +   - The choice of the objective function should be good for optimization

    +   - Take linear regression as an example


    ∇_w MSE^(train) = 0

    ⇒ ∇_w || X^(train) w − y^(train) ||_2^2 = 0

    w = (X^(train)ᵀ X^(train))⁻¹ X^(train)ᵀ y^(train)

    where X^(train) = [x₁^(train), …, x_N^(train)] and y^(train) = [y₁^(train), …,
    y_N^(train)].'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# Generalization


    +   - We care more about the performance of the model on new, previously unseen
    examples

    +   - The training examples usually cannot cover all the possible input configurations,
    so the learner has to generalize from the training examples to new cases

    +   - Generalization error: the expected error over ALL examples

    +   - To obtain theoretical guarantees about generalization of a machine learning
    algorithm, we assume all the samples are drawn from a distribution p(x, y), and
    calculate generalization error (GE) of a prediction function f by taking expectation
    over p(x, y)


    GE_f = ∫_{x,y} p(x,y) Error(f(x), y)'
  merge: -1
  img_proc: true
