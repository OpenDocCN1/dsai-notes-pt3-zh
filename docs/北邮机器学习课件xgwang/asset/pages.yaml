  md: '# Unsupervised DA method: Weighted Adversarial Nets (2.4)


    The importance weighted adversarial nets-based partial domain adaptation method
    can identify the source samples that are potentially from the outlier classes
    and, at the same time, reduce the shift of shared classes between domains.


    ![](img/a04b187c89c5018c5ef6132980e27196_262_0.png)


    The intuition of the weighting scheme is that if the activation of the first domain
    classifier is large, the sample can be almost perfectly discriminated from the
    target domain by the discriminator.


    1

    D(z) = p(y = 1|z) = σ(α(z))

    \tilde{w}(z) = 1 - D^*(z) = 1 / (p_s(z)/p_t(z) + 1)


    2

    min_{F_t} max_{D_0} L_w(D_0, F_s, F_t) = E_{x~p_s(x)}[w(z) log D_0(F_s(x))] +
    E_{x~p_t(x)}[log(1 - D_0(F_t(x)))]


    > [11] Zhang J, Ding Z, Li W, et al. Importance Weighted Adversarial Nets for
    Partial Domain Adaptation. In CVPR. 2018: 8156-8164.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Unsupervised DA method: DRCN (3.1)


    The model is optimized through multitask learning, that is, jointly learns the
    (supervised) source label prediction and the (unsupervised) target data reconstruction
    tasks. The aim is that the encoding shared representation should learn the commonality
    between those tasks that provides useful information for cross-domain object recognition


    ![](img/a04b187c89c5018c5ef6132980e27196_263_0.png)


    ℒ_c^{n_s}({Θ_enc, Θ_lab}) := Σ_{i=1}^{n_s} ℓ_c (f_c(x_i^s; {Θ_enc, Θ_lab}), y_i^s),

    ℒ_r^{n_t}({Θ_enc, Θ_dec}) := Σ_{j=1}^{n_t} ℓ_r (f_r(x_j^t; {Θ_enc, Θ_dec}), x_j^t)


    > [12] M. Ghifary , W.B. Kleijn , M. Zhang , D. Balduzzi , W. Li , Deep reconstruction–classification
    networks for unsupervised domain adaptation, in ECCV, Springer, 2016, pp. 597–613'
