- pgno: 43
  md: '# Variance of Data Captured by the PCA Subspace


    +   - The variance of data projected onto the first $d''$ eigenvectors is $\sum_{i=1}^{d''}
    \lambda_i$

    +   - Measure how much variance has been captured by the first $d''$ eigenvectors:

    +     $$\frac{\sum_{i=1}^{d''} \lambda_i}{\sum_{j=1}^{d} \lambda_j}$$'
  merge: -1
  img_proc: true
- pgno: 44
  md: "# Covariance Matrix of Principal Components\n\n+   - The correlation between\
    \ projections on $e_i$ and $e_j$ $(i \\ne j)$ is\n+   \n+     $$\\sum_{k=1}^{n}\
    \ a_{ki}a_{kj}=\\sum_{k=1}^{n}e_i^T(\\mathbf{x}_k-\\bar{\\mathbf{x}})(\\mathbf{x}_k-\\\
    bar{\\mathbf{x}})^Te_j=e_i^TSe_j=\\lambda_j e_i^Te_j=0$$\n\n+   - The covariance\
    \ matrix of samples in the PCA subspace is\n+   \n+     $\\operatorname{diag}[\\\
    lambda_1,\\ldots,\\lambda_d]$"
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Summary of PCA


    +   - The principal subspace is spanned by $d''$ orthonormal vectors $\mathbf{e}_1,\ldots,\mathbf{e}_{d''}$,
    which are computed as the $d''$ eigenvectors of the scatter matrix $\mathbf{S}$
    with the largest eigenvalues $\lambda_1,\ldots,\lambda_{d''}$.

    +   - The principal components $a_{ki}$ of the samples are computed as $a_{ki}=\mathbf{e}_i^T(\mathbf{x}_k-\bar{\mathbf{x}})$.

    +   - The variance of the projected samples onto this principal subspace is $\sum_{i=1}^{d''}\lambda_i$.

    +   - The mean squared distance between the samples and their projections are
    $\sum_{i=d''+1}^{d}\lambda_i$.

    +   - PCA disentangles the factors of variation underlying the data, assuming
    such variation is a Gaussian distribution.

    +   - We are interested in learning representations that disentangle more complicated
    forms of feature dependencies'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Smoothness Prior


    +   - Shallow models assume smoothness prior on the prediction function to be
    learned, i.e.

    +     $$f^*(\mathbf{x}) \approx f^*(\mathbf{x}+\epsilon)$$

    +     where $\epsilon$ is a small change.


    +   - K-nearest neighbor predictors assume piecewise constant

    +     - For classification and $K = 1$, $f(x)$ is the output class associated
    with the nearest neighbor of $x$ in the training set

    +     - For regression, $f(x)$ is the average of the outputs associated with the
    $K$ nearest neighbors of $x$

    +     - The number of distinguishable regions cannot be more than the number of
    training examples


    ![](img/a04b187c89c5018c5ef6132980e27196_46_0.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_46_1.png)'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Interpolation with Kernel


    f(x) = b + Σ_{i=1}^{n} α_i K(x, x_i)


    K is a kernel function, e.g., the Gaussian kernel


    K(u, v) = N(u − v, 0, σ²)


    +   - b and α_i can be learned by SVM

    +   - Treat each x_i is a template and the kernel function as a similarity function
    that matches a template and a test example


    ![](img/a04b187c89c5018c5ef6132980e27196_47_0.png)'
