- pgno: 66
  md: '# Backpropagation


    +   - The most general method for supervised training of multilayer neural network

    +   - Present an input pattern and change the network parameters to bring the
    actual outputs closer to the target values

    +   - Learn the input-to-hidden and hidden-to-output weights

    +   - However, there is no explicit teacher to state what the hidden unit’s output
    should be. Backpropagation calculates an effective error for each hidden unit,
    and thus derive a learning rule for the input-to-hidden weights.'
  merge: -1
  img_proc: true
- pgno: 67
  md: <!-- no content -->
