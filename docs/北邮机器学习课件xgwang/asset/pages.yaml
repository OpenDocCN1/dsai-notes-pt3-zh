  md: '# 01 基本概念


    # 会话（tf.Session）


    ![](img/a04b187c89c5018c5ef6132980e27196_299_0.png)


    +   - 图构建完成后要通过会话实现计算。

    +   - 拥有具体的物理资源(如cpu、gpu)

    +   - 提供了Operation执行和Tensor求值的环境

    +   - 在计算Graph时,并不一定是Graph中的所有节点都被计算了,而是指定的计算节点或者该节点的输出结果被需要时'
