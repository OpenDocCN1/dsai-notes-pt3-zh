  md: '# Domain gap


    Through experiments on our RFW, we first prove that:


    +   - From results of average faces, T-SNE and distribution discrepancy measured
    by MMD, there is domain gap between Caucasians and other races.

    +   - FR systems indeed work unequally well for different races (racial bias);
    the deep models trained on the current benchmarks do not perform well on non-Caucasian
    faces (other-race effect).


    # 1 Image level


    ![](img/a04b187c89c5018c5ef6132980e27196_281_0.png)


    # 2 Feature level


    ![](img/a04b187c89c5018c5ef6132980e27196_281_1.png)


    (a) The feature space of four testing subsets visualized by t-SNE. Each dot color
    represents an image belong to Caucasian, Indian, Asian or African. (b) The distribution
    discrepancy measured by MMD. ''Ca'', ''As'', ''In'' and ''Af'' represent Caucasian,
    Asian, Indian and African, respectively. ''Ca-As'' represents the distribution
    discrepancy between Caucasian and Asian, and so on'
