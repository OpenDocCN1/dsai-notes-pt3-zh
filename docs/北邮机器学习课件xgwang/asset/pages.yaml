- pgno: 18
  md: '# Curse of dimensionality


    +   Why do we need to reduce the dimensionality of the feature space?


    ![](img/a04b187c89c5018c5ef6132980e27196_18_0.png)


    Scatter plot of the training data of three classes. Two features are used. The
    goal is to classify the new testing point denoted by ''x''.


    ![](img/a04b187c89c5018c5ef6132980e27196_18_1.png)


    The feature space is uniformly divided into cells. A cell is labeled as a class,
    if the majority of training examples in that cell are from that class. The testing
    point is classified according to the label of the cell where it falls in.


    > (Duda et al. Pattern Classification 2000)'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Curse of dimensionality


    +   - The more training samples in each cell, the more robust the classifier

    +   - The number of cells grows exponentially with the dimensionality of the feature
    space. If each dimension is divided into three intervals, the number of cells
    is $N = 3^n$

    +   - Some cells are empty when the number of cells is very large!


    ![](img/a04b187c89c5018c5ef6132980e27196_19_0.png)


    > (Duda et al. Pattern Classification 2000)'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Regularization


    +   - Equivalent to imposing a preference over the set of functions that a learner
    can obtain as a solution

    +   - In Bayesian learning, it is reflected as a prior probability distribution
    over the space of functions (or equivalently their parameters) that the learn
    can assess

    +   - Regularization prevents overfitting by adding penalty for complexity

    +   - Training a classifier/regressor is to minimize

    +     Prediction error on the training set + regularization

    +   - Examples

    +     - The objective function for linear regression becomes

    +       MSE_train + regularization = 1/N Σ_i (w^T x_i^(train) - y_i^(train))^2
    + λ ||w||_2^2

    +   - Multi-task learning, transfer learning, dropout, sparsity, pre-training'
  merge: -1
  img_proc: true
