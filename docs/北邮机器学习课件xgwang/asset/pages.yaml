  md: "# Unsupervised DA method: DSN (3.2)\n\nDSNs explicitly and jointly model both\
    \ private and shared components of the domain representations. The private component\
    \ of the representation is specific to a single domain and the shared component\
    \ of the representation is shared by both domains.\n\n![](img/a04b187c89c5018c5ef6132980e27196_265_0.png)\n\
    \n1  L_task = - sum_{i=0}^{N_s} y_i^s · log ŷ_i^s\n2  L_recon = sum_{i=1}^{N_s}\
    \ L_si_mse(x_i^s, x̂_i^s) + sum_{i=1}^{N_t} L_si_mse(x_i^t, x̂_i^t)\n   L_si_mse(x,\
    \ x̂) = 1/k ||x - x̂||_2^2 - 1/(k^2) ([x - x̂]·1_k)^2\n3  L_difference = ||H_c^T\
