  md: '# # Racial bias


    **Through experiments on our RFW, we first prove that:**


    - From results of average faces, T-SNE and distribution discrepancy measured by
    MMD, there is domain gap between Caucasian and other race.

    - FR systems indeed work unequally well for different races (**racial bias**);
    the deep models trained on the current benchmarks do not perform well on non-Caucasian
    faces (**other-race effect**).


    **Table 2. Face Verification Accuracy (%) on RFW dataset**


    | Category | Model | LFW | Caucasian | Indian | Asian | African |

