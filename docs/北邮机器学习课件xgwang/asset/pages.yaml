- pgno: 77
  md: '# Input-to-hidden weights


    ∂J/∂w_ij = ∂J/∂y_j ∂y_j/∂net_j ∂net_j/∂w_ij


    +   - How the hidden unit output y_j affects the error at each output unit


    ∂J/∂y_j = ∂/∂y_j [ 1/2 Σ_{k=1}^c (t_k - z_k)^2 ]


    = - Σ_{k=1}^c (t_k - z_k) ∂z_k/∂y_j


    = - Σ_{k=1}^c (t_k - z_k) ∂z_k/∂net_k ∂net_k/∂y_j


    = - Σ_{k=1}^c (t_k - z_k) f''(net_k) w_kj = Σ_{k=1}^c δ_k w_kj'
  merge: -1
  img_proc: true
- pgno: 78
  md: "# Input-to-hidden weights\n\n+   - Sensitivity for a hidden unit $j$\n+   \n\
    +     $$\\delta_j=-\\frac{\\partial J}{\\partial net_j}=-\\frac{\\partial J}{\\\
    partial y_j}\\frac{\\partial y_j}{\\partial net_j}=f'(net_j)\\sum_{k=1}^{c}w_{kj}\\\
    delta_k$$\n\n+   - $\\sum_{k=1}^{c}w_{kj}\\delta_k$ is the effective error for\
    \ hidden unit $j$\n\n+   - Weight update rule. Since $\\partial net_j/\\partial\
    \ w_{ij}=x_i$,\n+   \n+     $$\\Delta w_{ij}=\\eta x_i\\delta_j=\\eta f'(net_j)\\\
    left[\\sum_{k=1}^{c}w_{kj}\\delta_k\\right]x_i$$"
  merge: -1
