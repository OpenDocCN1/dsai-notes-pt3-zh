- pgno: 2
  md: '# Classification


    +   - $f(x)$ predicts the category that $x$ belongs to

    +     $f : \mathcal{R}^D \to \{1,\dots,K\}$

    +   - $f(x)$ is decided by the decision boundary

    +   - As an variant, $f$ can also predict the probability distribution over classes
    given $x$, $f(x) = P(y|x)$. The category is predicted as $y^* = \arg\max_k P(y
    = k|x)$


    ![](img/a04b187c89c5018c5ef6132980e27196_2_0.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_2_1.png)


    > (Duda et al. Pattern Classification 2000)'
