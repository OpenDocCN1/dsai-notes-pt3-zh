- pgno: 80
  md: "# Stochastic gradient descent\n\n+   - Given $n$ training samples, our target\
    \ function can be expressed as\n+   \n+   $$J(w) = \\sum_{p=1}^{n} J_p(w)$$\n\n\
    +   - Batch gradient descent\n+   \n+   $$w \\leftarrow w - \\eta \\sum_{p=1}^{n}\
    \ \\nabla J_p(w)$$\n\n+   - In some cases, evaluating the sum-gradient may be\
    \ computationally expensive. Stochastic gradient descent samples a subset of summand\
    \ functions at every step. This is very effective in the case of large-scale machine\
    \ learning problems. In stochastic gradient descent, the true gradient of $J(w)$\
    \ is approximated by a gradient at a single example (or a mini-batch of samples):\n\
    +   \n+   $$w \\leftarrow w - \\eta \\nabla J_p(w)$$"
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Stochastic backpropagation


    # Algorithm 1 (Stochastic backpropagation)


    ```

    1 begin initialize network topology (# hidden units), w, criterion θ, η, m ← 0

    2 do m ← m + 1

    3 X^m ← randomly chosen pattern

    4 w_ij ← w_ij + ηδ_j x_i; w_jk ← w_jk + ηδ_k y_j

    5 until ΔJ(w) < θ

    6 return w

    7 end

    ```


    > (Duda et al. Pattern Classification 2000)


    +   - In stochastic training, a weight update may reduce the error on the single
    pattern being presented, yet increase the error on the full training set.'
  merge: -1
  img_proc: true
