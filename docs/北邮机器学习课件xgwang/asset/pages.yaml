- pgno: 31
  md: '# Supervised and unsupervised learning


    +   - Supervised learning: the goal is to use input-label pairs, (x, y) to learn
    a function f that predicts a label (or a distribution over labels) given the input,
    ŷ = f(x)

    +   - Unsupervised learning: no label or other target is provided. The data consists
    of a set of examples x and the objective is to learn about the statistical structure
    of x itself.

    +   - Weakly supervised learning: the training data contains (x, y) pairs as in
    supervised learning, but the labels y are either unreliably present (i.e. with
    missing values) or noisy (i.e. where the label given is not the true label)'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Unsupervised learning


    +   - Find the “best” representation of data that reserves as much information
    about **x** as possible while being “simpler” than **x**

    +     Taking linear case as an example


    $$\tilde{x}=a_0+\sum_{i=1}^{d''}a_i e_i$$


    +   - Lower dimensional representation: $d'' < d$

    +   - Sparse representation: the number of non-zero $a_i$ is small

    +   - Independent representation: disentangle the sources of variations underlying
    the data distributions such that the dimensions of the representation are statistically
    independent, i.e. $a_i$ and $a_j$ are statistically independent


    +   - Deep learning is to learn data representation, but in a nonlinear and hierarchical
    way'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Principal Component Analysis (PCA)


    +   - There are n d-dimensional samples x₁, ..., xₙ.

    +   - PCA seeks a principal subspace spanned by d′ (d′ < d) orthonormal vectors
    e₁, ..., e_d′, such that

    +     - the projected samples (x̂_k = a₀ + Σ_{i=1}^{d′} a_{ki} e_i) onto this
    subspace has maximum variance; or equivalently

    +     - the mean squared distance between the samples and their projections are
    minimized.

    +   - The projections {a_{ki}} are uncorrelated (i.e. independent if data distribution
    is assumed as Gaussian distribution)


    ![](img/a04b187c89c5018c5ef6132980e27196_33_0.png)


    ![](img/a04b187c89c5018c5ef6132980e27196_33_1.png)'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Formulation of PCA


    or


    arg max_{ {e_i} } sum_{k=1}^{n} || x̃_k - x̄ ||^2


    arg min_{ {e_i} } sum_{k=1}^{n} || x_k - x̃_k ||^2


    ( || x_k - x̄ ||^2 = || x_k - x̃_k ||^2 + || x̃_k - x̄ ||^2 )'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Zero- and One-Dimensional Representations by PCA


    zero-dimensional representation: use a single vector x₀ to represent all the samples
    and minimize the squared-error function


    J₀(x₀) = Σₖ=1ⁿ ||x₀ − xₖ||²


    The solution is x₀ = x̄ = 1/n Σₖ=1ⁿ xₖ


    One-dimensional representation: project the data to a line running through the
    sample mean, x̃ₖ = x̄ + aₖ₁ e₁ and minimize the squared-error criterion function


    J₁(a₁₁, ..., aₙ₁, e₁) = Σₖ=1ⁿ ||x̃ₖ − xₖ||²'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Find the Principal Components $a_{k1}$


    $J_1(a_{11},\dots,a_{n1},\mathbf{e}_1)$

    $= \sum_{k=1}^{n} \|\bar{\mathbf{x}} + a_{k1}\mathbf{e}_1 - \mathbf{x}_k\|^2 =
    \sum_{k=1}^{n} \|a_{k1}\mathbf{e}_1 - (\mathbf{x}_k - \bar{\mathbf{x}})\|^2$

    $= \sum_{k=1}^{n} a_{k1}^2 \|\mathbf{e}_1\|^2 - 2 \sum_{k=1}^{n} a_{k1}\mathbf{e}_1^t(\mathbf{x}_k
    - \bar{\mathbf{x}}) + \sum_{k=1}^{n} \|\mathbf{x}_k - \bar{\mathbf{x}}\|^2$


    Since $\mathbf{e}_1$ is a unit vector, $\|\mathbf{e}_1\| = 1$. To minimize $J_1$,
    set $\frac{\partial J_1}{\partial a_{k1}} = 0$ and we have

    $a_{k1} = \mathbf{e}_1^t(\mathbf{x}_k - \bar{\mathbf{x}})$


    +   - We obtain a least-squares solution by projecting the vector $\mathbf{x}_k$
    onto the line in the direction of $\mathbf{e}_1$ passing through the mean.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Find the Optimal Projection Direction e₁


    J₁(e₁) = ∑_{k=1}^{n} a_{k1}² − 2 ∑_{k=1}^{n} a_{k1}² + ∑_{k=1}^{n} ||x_k − x̄||²

    = − ∑_{k=1}^{n} [e₁ᵀ(x_k − x̄)]² + ∑_{k=1}^{n} ||x_k − x̄||²

    = − ∑_{k=1}^{n} e₁ᵀ(x_k − x̄)(x_k − x̄)ᵀ e₁ + ∑_{k=1}^{n} ||x_k − x̄||²

    = − e₁ᵀ S_e₁ + ∑_{k=1}^{n} ||x_k − x̄||²'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Find the Optimal Projection Direction $e_1$


    +   - $S = \sum_{k=1}^{n}(x_k-\bar{x})(x_k-\bar{x})^t$ is the scatter matrix

    +   - $e_1^t S e_1 = \sum_{k=1}^{n} a_k^2 \left(\sum_{k=1}^{n} a_k = 0\right)$
    is the variance of the projected data

    +   - The vector $e_1$ that minimizes $J_1$ also maximizes $e_1^t S e_1$, subject
    to the constraint that $\|e_1\| = 1$'
  merge: -1
  img_proc: true
- pgno: 39
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Find the Optimal Projection Direction $e_1$


    +   - Use the method of Lagrange multipliers to maximize the $e_1^tSe_1$ subject
    to the constraint that $\|e_1\|=1$,\n\n  $u=e_1^tSe_1-\lambda(e_1^te_1-1)$,\n\n  $\frac{\partial
    u}{\partial e_1}=2Se_1-2\lambda e_1=0$.


    +   - Setting the gradient vector equal to zero, we see that $e_1$ must be an
    eigenvector of the scatter matrix\n\n  $Se_1=\lambda e_1$


    +   - Since $e_1^tSe_1=\lambda e_1^te_1=\lambda$, to maximize $e_1^tSe_1$, we
    select the eigenvector with the largest eigenvalue'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# d''-Dimensional Representation by PCA


    +   - d′–dimensional representation: $\mathbf{\tilde{x}}_k = \mathbf{\bar{x}}
    + \sum_{i=1}^{d''} a_{ki} \mathbf{e}_i$

    +   - Mean-squared criterion function:

    +     $$J_{d''} = \sum_{k=1}^{n} \left\| \left( \mathbf{\bar{x}} + \sum_{i=1}^{d''}
    a_{ki} \mathbf{e}_i \right) - \mathbf{x}_k \right\|^2$$

    +   - Define additional principal components in an incremental fashion by choosing
    each new direction minimizing $J$ amongst all possible directions orthogonal to
    those already considered

    +   - To minimize $J_{d''}$, $\mathbf{e}_1, \dots, \mathbf{e}_{d''}$ are the $d''$
    eigenvectors of the scatter matrix with the largest eigenvalues. $a_{ki}$ are
    the principal components of samples.'
  merge: -1
  img_proc: true
- pgno: 42
  md: "# d'-Dimensional Representation by PCA\n\n+   - Since the scatter matrix is\
    \ real and symmetric, its eigenvectors are orthogonal and its eigenvalues are\
    \ nonnegative.\n\n+   - The squared error:\n+   \n+   $$J_{d'} = -\\sum_{i=1}^{d'}\
    \ \\lambda_i + \\sum_{k=1}^{n} \\|\\mathbf{x}_k - \\bar{\\mathbf{x}}\\|^2$$\n\
    +   \n+   $$J_d = 0 \\Rightarrow \\sum_{k=1}^{n} \\|\\mathbf{x}_k - \\bar{\\mathbf{x}}\\\
    |^2 = \\sum_{i=1}^{d} \\lambda_i$$\n+   \n+   $$J_{d'} = \\sum_{i=d'+1}^{d} \\\
    lambda_i$$"
