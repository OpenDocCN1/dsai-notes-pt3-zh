- pgno: 135
  md: '# Parameters of HMM


    +   - Initial state parameters $P(h_t = \omega_i) = \pi_i, \sum_i \pi_i = 1$

    +   - Transition probabilities $P(h_t = \omega_j | h_{t-1} = \omega_i) = a_{ij},
    \sum_j a_{ij} = 1$. A = [a_{ij}] is transition matrix

    +   - Emission probabilities $p(x_t | h_t)$

    +     - If $x_t$ is a single discrete variable, $x_t = x_i \in \{v_1, ..., v_m\}$,
    $P(x_t = v_k | z_t = \omega_j) = b_{jk}, \sum_k b_{jk} = 1$


    ![](img/a04b187c89c5018c5ef6132980e27196_135_0.png)'
  merge: -1
  img_proc: true
- pgno: 136
  md: "# Parameters of HMM\n\n+   - **Evaluation problem**: determine the probability\
    \ that a particular data sequence x₁, ..., x_T was generated by that model,\n\
    +   \n+     P(x₁, ..., x_T)\n+   - **Decoding problem**: given a set of observations\
    \ x₁, ..., x_T, determine the most likely sequence of hidden states h₁, ..., h_T\
    \ that lead to the observations\n+   \n+     (h₁*, ..., h_T*) = argmax_{h₁,...,h_T}\
    \ P(h₁, ..., h_T | x₁, ..., x_T)\n+   - **Learning problem**: given a set of training\
    \ observations of visible variables, without knowing the hidden variables, determine\
    \ the parameters of HMM.\n+   \n+     θ* = P(x₁, ..., x_T; θ)"
