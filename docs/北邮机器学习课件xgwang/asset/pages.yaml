- pgno: 94
  md: '# Nonlinear feature mapping


    +   - The multilayer neural networks provide nonlinear mapping of the input to
    the feature representation at the hidden units

    +   - With small initial weights, the net activation of each hidden unit is small,
    and thus the linear portion of their activation function is used. Such a linear
    transformation from x to y leaves the patterns linearly inseparable in the XOR
    problem.

    +   - As learning progresses and the input-to-hidden weights increase in magnitude,
    the nonlinearities of the hidden units warp and distort the mapping from input
    to the hidden unit space

    +   - The linear decision boundary at the end of learning found by the hidden-to-output
    weights is shown by the straight dashed line; the nonlinearly separable problem
    at the inputs is transformed into a linearly separable at the hidden units'
  merge: -1
  img_proc: true
