- pgno: 29
  md: "# Discriminative model\n\n+   Parameter θ = {w_k} can be estimated from maximizing\
    \ the data likelihood\n+   \n+   θ̂ = arg max_θ P(D_n|θ) = arg max_θ ∏_{i=1}^n\
    \ P(y_i^{(train)} | x_n^{(train)}, θ)\n\n+   Maximum a posteriori (MAP) estimation\n\
    +   \n+   θ = arg max_θ p(θ|D_n) = arg max_θ log P(D_n|θ) + log p(θ)\n\n+   According\
    \ to the Bayes' rule, i.e., p(θ|D_n) = P(D_n|θ)p(θ)/P(D_n).\n+   \n+   θ = arg\
    \ max_θ log P(D_n|θ) + log p(θ)\n\n+   θ = arg max_θ Σ_{i=1}^n log P(y_n^{(train)}\
    \ | x_n^{(train)}, θ) + log p(θ)\n\n+   prior p(θ) corresponds to a regularizer,\
    \ e.g.\n+   \n+   p(θ) = e^{-λ||θ||^2}"
  merge: -1
  img_proc: true
- pgno: 30
  md: "# Generative model\n\n+   - Estimate the underlying class conditional probability\
    \ densities p(x|y = k) and then construct the classifier using the Bayesian decision\
    \ theory\n+   \n+     $P(y = k|x) = \\frac{p(x|y = k)P(y = k)}{p(x)} = \\frac{p(x|y\
    \ = k)P(y = k)}{\\sum_{k'=1}^{K} p(x|y = k')P(y = k')}$\n+   \n+   - p(x|y) and\
    \ P(y) are parameterized by θ\n+   \n+   - Prior P(y) can be used to model the\
    \ dependency among predictions, such as the segmentation labels of pixels or predictions\
    \ of speech sequences.\n+   \n+   - It is more difficult to model class conditional\
    \ probability densities. However, it also adds stronger regularization to model\
    \ fitting, since the learned model not only needs to predict class labels but\
    \ also generate the input data.\n+   \n+   - It is easier to add domain knowledge\
    \ when designing the models of p(x|y)"
  merge: -1
