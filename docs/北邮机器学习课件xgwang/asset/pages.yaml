- pgno: 236
  md: '# What is transfer learning?


    Given a source domain $D_S$ and learning task $T_S$, a target domain $D_T$ and
    learning task $T_T$, transfer learning aims to help improve the learning of the
    target predictive function $f_T(\cdot)$ in $D_T$ using the knowledge in $D_S$
    and $T_S$, where $D_S \neq D_T$, or $T_S \neq T_T$.


    ![](img/a04b187c89c5018c5ef6132980e27196_236_0.png)'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# # What is domain adaptation?


    +   **Domain adaptation:**

    +   - Source domain: abundant amount of labeled data.

    +   - Target domain: few or no labeled data.

    +   - Same tasks, but different data distribution.


    ![](img/a04b187c89c5018c5ef6132980e27196_237_0.png)


    > [1] Pan S J, Yang Q. A survey on transfer learning[J]. IEEE Transactions on
    knowledge and data engineering, 2010, 22(10): 1345-1359.'
  merge: -1
  img_proc: true
