    partial L_T}{\\partial \\theta} = \\sum_{t=1}^{T} \\frac{\\partial L_T}{\\partial\
    \ h_T} \\frac{\\partial h_T}{\\partial h_t} \\frac{\\partial F_\theta(h_{t-1},\
    \ x_t)}{\\partial \\theta}$\n+     $\\frac{\\partial L_T}{\\partial h_T} \\frac{\\\
    partial h_T}{\\partial h_t} \\frac{\\partial F_\theta(h_{t-1}, x_t)}{\\partial\
    \ \\theta}$ encodes long-term dependency when $T - t$ is large\n\n![](img/a04b187c89c5018c5ef6132980e27196_159_0.png)"
  merge: -1
