- pgno: 184
  md: '# Local minimum, local maximum, and saddle points


    +   - When \(\nabla J(\theta)=0\), the gradient provides no information about
    which direction to move

    +   - Points at \(\nabla J(\theta)=0\) are known as **critical points** or **stationary
    points**

    +   - A local minimum is a point where \(J(\theta)\) is lower than at all neighboring
    points, so it is no longer possible to decrease \(J(\theta)\) by making infinitesimal
    steps

    +   - A local maximum is a point where \(J(\theta)\) is higher than at all neighboring
    points, so it is no longer possible to increase \(J(\theta)\) by making infinitesimal
    steps

    +   - Some critical points are neither maxima nor minima. These are known as **saddle
    points**


    ![](img/a04b187c89c5018c5ef6132980e27196_184_0.png)'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Local minimum, local maximum, and saddle points


    +   - In the context of deep learning, we optimize functions that may have many
    local minima that are not optimal, and many saddle points surrounded by very flat
    regions. All of this makes optimization very difficult, especially when the input
    to the function is multidimensional.

    +   - We therefore usually settle for finding a value of J that is very low, but
    not necessarily minimal in any formal sense.


    ![](img/a04b187c89c5018c5ef6132980e27196_185_0.png)'
