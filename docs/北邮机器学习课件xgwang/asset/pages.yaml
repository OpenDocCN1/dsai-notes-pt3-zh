  md: '# Modeling sequential data


    +   - Use the chain rule to express the joint distribution for a sequence of observations

    +     $p(\mathbf{x}_1,\dots,\mathbf{x}_T)=\prod_{t=1}^{T} p(\mathbf{x}_t|\mathbf{x}_1,\dots,\mathbf{x}_{t-1})$


    +   - Impractical to consider general dependence of future dependence on all previous
    observations $p(\mathbf{x}_t|\mathbf{x}_{t-1},\dots,\mathbf{x}_0)$


    +   - Complexity would grow without limit as the number of observations increases


    +   - It is expected that recent observations are more informative than more historical
    observations in predicting future values'
