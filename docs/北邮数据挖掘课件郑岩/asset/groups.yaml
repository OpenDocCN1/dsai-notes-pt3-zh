    +       - 已标记分类的测试样本与模型的实际分类结果进行比较

    +       - 模型的正确率是指测试集中被正确分类的样本数与样本总数的百分比。测试集与训练集相分离，否则将出现过拟合（ over-fitting ）现象。'
  md: "\n## 3.1.2.1 聚类方法分类\n\n- 上述方法属于传统聚类的范畴。一般地，传统聚类算法对于维度较低的数据集较有效，而当维度较高时，可能就不适合了。\n\
    - 此外，大型数据库的聚类研究受到越来越多的重视。随着数据库技术的普及，积累了大量的数据信息，因此这一分支成为一个研究热点。\n\n### 模式矩阵\n\n\
    一般地，数据对象采用矢量表示法，即通过一个在多维空间中的矢量，来描述一个对象多方面的特征。矢量的每个维度描述对象的一个特征。多个对象的矢量构成一个模式矩阵（Pattern\
    \ Matrix），即 \\((x_{ij})_{m \\times n}\\)，其中每行代表一个对象，每列描述一个特征。\n\n### 相似度\n\n在各种聚类算法中，通常是需要借助量化的指标以表征数据对象之间的特征差异和不同，称之为聚类统计量。聚类统计量包括：距离或相似度。\n\
    \n### 标准化\n\n由于不同的特征采用不同的度量标准或尺度，这将对聚类结果产生不同的影响，为了消除这一差别，常进行标准化变换，使所有的特征能用一个共同的标准度量。\n\
    \n### 距离的计算\n\n标准化处理后，计算对象间距离最常用的方法有：欧氏距离、曼哈顿距离（又称绝对距离）、闵可夫斯基（Minkowski）距离等。\n\
    \n### 相似度的计算\n\nn 个对象彼此之间的相似性或近似性可通过相似度矩阵（Similarity Matrix）表示。它是一个 n 阶、对角线元素为\
    \ 1 的对称矩阵，即 \\((r_{ij})_{n \\times n}\\)。其中，\\(r_{ij}\\) 是对象 i 和 j 之间相似性的量化表示。通常其值是非负的。对象之间关系越亲密，其绝对值越接近\
    \ 1；彼此关系越疏远，其值越接近于 0。\n\n对象间相似度的计算方法包括：夹角余弦法、相关系数法及指数相似系数法等。\n\n### 评价聚类方法的标准\n\
    \n- 聚类分析是一种无监督学习，事先对给定数据集合的结构一无所知，没有利用任何先验知识。无论采用哪种聚类算法，其聚类结果的合理性和有效性都有待评价。\n\
    - 聚类有效性对聚类分析具有重要意义，被认为是聚类分析的一个瓶颈。对于相同的数据集合，采用不同的聚类方法，可能得到不同的聚类结果。\n- 即便是采用同一种聚类方法，若选择不同的初始参数（如聚类数、聚类中心等）也可能会得到不同的聚类结果。\n\
    \n![](img/97ec20d772baf04740a42252ab8f47d8_254_0.png)\n\n例如，采用相同的 k-均值聚类算法对同一个\
    \ wine 测试集进行聚类实验，当预设聚类类别数分别为 1～8 时，则所得到的聚类正确率是不同的，如柱状图所示。\n\n- **可伸缩性**\n\n  即算法中模式数发生变化的情况。有些算法在模式数小的条件下，算法的性能很好，但是模式数增大后，算法性能下降。如\
    \ PAM 算法是一种 k-中心点算法，它对小的数据集合非常有效，但对大的数据集合则没有良好的可伸缩性。\n\n- **高维性**\n\n  即算法中模式属性个数发生变化的情况。同样，有些算法只擅长处理低维数据。在高维空间中聚类是一个挑战，特别是数据有可能非常稀疏和偏斜。\n\
    \n- **发现任意形状的聚类**\n\n  一个簇可能是任意形状的，但一般的聚类算法是基于欧氏距离和曼哈顿距离度量实现聚类，更趋于发现球状簇。在这方面，基于密度的聚类方法较好。\n\
    \n- **处理噪声数据的能力**\n\n  噪声数据可能是数据本身不完整，也可能是孤立点数据（Outlier）。有些算法不擅于处理孤立点数据，因此还专门出现了发现孤立点数据的算法。\n\
    \n- 用于决定输入参数的领域知识最小化和输入记录顺序不敏感性\n\n  一方面要求降低算法对输入参数的敏感程度，另一方面要求输入记录顺序对算法的结果影响小。如经典的\
    \ k-均值算法，需要预先给出簇的数目。在一些知识发现应用中，这一参数对聚类的质量影响很大。这常常是高效率算法的弱点。\n\n- 可解释性和可用性\n\n\
    \  知识发现过程中，聚类结果总是表现为一定的知识，这就要求聚类结果可解释、易理解。这与可视化密切相关，同时也与实际应用有关。如 SOM（Self-Organizing\
    \ Map）算法用于文本聚类可以产生知识地图，表现了良好的可视化性能。\n\n## 3.1.2.2 K均值算法\n\nK均值（k-means）是一种简便、实用的无监督聚类分析算法。这种算法在已知簇的个数时，可很好地实现数据的聚类分析。\n\
    \n### 基本思想\n\n1. 首先，随机选择 k 个数据点作为聚类中心；\n2. 然后，计算其他点到这些聚类中心点的距离，通过对簇中距离平均值的计算，不断改变这些聚类中心的位置，直到这些聚类中心不再变化为止。\n\
    \n### K均值的流程\n\n![](img/97ec20d772baf04740a42252ab8f47d8_261_0.png)\n\n由流程图可知，k-均值算法是一种基于数据划分方法的聚类算法。它是一个不断趋于最优解的试探过程。每一次迭代都试图使簇中心的选择更加接近于数据集的实际簇中心。\n\
    \n### K均值的实现过程\n\n![](img/97ec20d772baf04740a42252ab8f47d8_262_0.png)\n\n### 优势\n\
    \n1. 算法简单；\n2. 执行和收敛过程相对较快，是一种常见的聚类算法。\n\n### 局限性\n\n1. 必须事先知道聚类数；\n2. 算法要求簇是密集的、簇和簇之间的差异比较大；\n\
    3. 数据集的平均值的计算必须有适当的定义；\n4. 不能用于非凸形状的聚类；\n5. 对于某些孤立数据和“噪声”点敏感等。\n\n## 3.1.2.3 K中心点算法\n\
    \nk-中心点算法是对 k-均值的改进。\n\n### 主要的改进\n\n不采用簇中对象的平均值作为参照点，选用簇中位置最中心的对象，即中心点。这样的划分方法依然是基于最小化所有对象与其参照点之间的相异度之和的原则来执行的。\n\
    \n### 基本思想\n\n首先为每个簇随机地赋予一个样本作为中心点，将剩余的点依照距离的远近分配给最近的簇；随后用其他的非中心点数据作为中心点，并查看聚类情况。如果替换后的聚类总代价小于零，那么就执行替换直到中心点不再发生变化，也就是说达到代价最小值时停止算法。\n\
    \n### 算法步骤\n\n输入：簇的个数 k，包含 n 个样本的数据集  \n输出：各样本属于 k 个簇的信息\n\n1. 随机选择 k 个样本作为初始中心点；\n\
    2. repeat\n3. 将非中心点的数据依照与各中心点的距离划分到最近的簇中；\n4. 随机地在非中心点中选择一个样本；\n5. 计算使用该点作为中心点来代替原中心点的代价；\n\
    6. if 代价 < 0 then 用该点替换原中心点，形成新的簇集合；\n7. until 中心点不再发生变化。\n\n## 3.1.2.4 C均值算法\n\
    \n1. 选取聚类块数 \\(k\\)；\n2. 从训练集中任意选定 \\(k\\) 个向量 \\(c_1,c_2,\\cdots,c_k\\) 作为聚类中心；\n\
    3. 将每个样本向量（\\(n\\) 为输入向量维数），按下列欧氏距离公式，归入中心为 \\(c_i\\) 的类中；\n4. 重新调整聚类中心。对于 \\\
    (c_{im}\\)，其中 \\(m=1,2,3,\\cdots,n\\)，由下式计算得出：\n\n   \\[\n   c_{im}=\\frac{\\\
    sum_{x_l\\in \\text{cluster}_i}x_{lm}}{N_i}\n   \\]\n\n   其中 \\(N_i\\) 是第 \\(i\\\
    ) 个聚类块中的向量数，\\(i=1,2,3,\\cdots,k\\)；\n\n5. 如果步骤 4 中的聚类中心不再变化，则终止。否则，转至步骤 3。\n\n\
    ![](img/97ec20d772baf04740a42252ab8f47d8_267_0.png)\n\n## 3.2 分类\n\n- 3.2.1 概述\n\
