  - '[PAGE 305]


    # 神经网络的拓扑结构


    神经网络训练之前，需要设计网络拓扑结构。设计网络拓扑的关键是，确定隐层的神经元个数及各神经元初始权值和阈值（偏差）。理论上讲，隐层的神经元数越多，逼近越精确。但实际上，隐层神经元数不宜过多；否则会极大加长训练时间，并造成网络容错能力下降。经训练后的神经网络若其准确性不能被接受，则必须重新进行拓扑设计或改用不同的初始权值和阈值（偏差）。'
  - '[PAGE 306]


    # 神经网络的训练


    +   - 训练的终止条件

    +     - 获得一组权重值，使得训练集中几乎所有样本都分类正确

    +   - 训练步骤

    +     - 利用随机值对权值进行初始化

    +     - 将训练样本逐一地输入给神经网络，进行训练

    +     - 对于每个神经元

    +       - 将其所有的输入值进行线性求和计算得到总的输入

    +       - 利用激励函数计算其输出值

    +       - 计算误差

    +       - 修正网络权值和阈值（偏差）'
  - '[PAGE 307]


    # BP神经网络


    BP神经网络通过迭代处理一组训练样本，将各样本的网络预测与实际已知类标号进行比较实现学习训练，反向修改网络的权值，使得网络预测与实际类之间的误差平方最小。BP神经网络按照最优训练准则反复迭代，确定并不断调整神经网络结构，通过迭代修改，当误差收敛时学习过程终止。


    因此，具有分类准确、收敛性好、动态性好和鲁棒性强等优点。'
  md: "\n## 3.2.2.2 CLS算法\n\n- **CLS算法的局限性**\n\n分类属性的选择决定了算法的效率与所生成的决策树的繁简程度、预测效果。选择属性是决策树归纳算法的关键。\n\
    \nCLS算法可以产生所有可能的决策树，正确分类训练样本，并能选择最简单的决策树。但是属性选择的不确定性，在实际应用中往往受问题大小的限制。\n\n## 3.2.2.3\
    \ ID3算法\n\nQuinlan提出的ID3算法，对CLS算法做出了改进。它的基本算法仍然来自于CLS，但使用熵来选择属性，效果非常理想。\n\n- 举例\n\
    \n根据天气状况决定某天早上是否合适打高尔夫球，合适的属于正例记为P，不合适的属于反例记为N。天气由四个属性描述，即\n\noutlook(天气形势)取值分别为sunny,\
    \ overcast和rain;\n\ntemperature(温度)取值分别为cool, mild和hot;\n\nhumidity(湿度)取值为normal和high;\n\
    \nwindy(风)取值为false和true\n\n|  | outlook | temperature | humidity | windy | class\
    \ |\n|---|---|---|---|---|---|\n| 1 | sunny | hot | high | false | N |\n| 2 |\
    \ sunny | hot | high | true | N |\n| 3 | overcast | hot | high | false | P |\n\
    | 4 | rain | hot | high | false | P |\n| 5 | rain | cool | normal | false | P\
    \ |\n| 6 | rain | cool | normal | true | N |\n| 7 | overcast | cool | normal |\
    \ true | P |\n| 8 | sunny | mild | high | false | N |\n| 9 | sunny | cool | normal\
    \ | false | P |\n| 10 | rain | mild | normal | false | P |\n| 11 | sunny | mild\
    \ | normal | true | P |\n| 12 | overcast | mild | high | true | P |\n| 13 | overcast\
    \ | hot | normal | false | P |\n| 14 | rain | mild | high | true | N |\n\n表 打高尔夫球天气情况的样本集（14个）\n\
    \n## ID3 算法举例\n\n$I(p,n)=-\\frac{9}{14}\\log_2\\frac{9}{14}-\\frac{5}{14}\\log_2\\\
    frac{5}{14}=0.940$\n\n$E(outlook)=\\frac{5}{14}I(p_1,n_1)+\\frac{4}{14}I(p_2,n_2)+\\\
    frac{5}{14}I(p_3,n_3)$\n\n$=\\frac{5}{14}I(2,3)+\\frac{4}{14}I(4,0)+\\frac{5}{14}I(3,2)$\n\
    \n$=\\frac{5}{14}\\times0.971+\\frac{4}{14}\\times0+\\frac{5}{14}\\times0.971$\n\
    \n$=0.694$\n\n其中 $p=9，n=5$。\n\n$gain(outlook)=I(p,n)-E(outlook)=0.940-0.694=0.246$\n\
    \n## ID3 算法举例\n\n类似地，可得：\ngain(temperature) = 0.029\ngain(humidity) = 0.151\n\
    gain(windy) = 0.048\n\n因此，outlook具有最大的信息增益，因此outlook被选为根结点并向下扩展，通过类似的方法，得到相应的ID3决策树。\n\
    \n![](img/97ec20d772baf04740a42252ab8f47d8_295_0.png)\n\n图　打高尔夫球问题的决策树\n\n## 3.2.2.3\
    \ ID3算法\n\n- 优势\n  - 算法理论清晰\n  - 方法简单\n  - 学习能力较强\n- 不足之处\n  - 对较小的数据集有效\n  -\
    \ 对噪声比较敏感\n  - 当数据集增大时，决策树可能会改变。\n\n## 3.2.2.4 C45算法\n\n- C45算法\n\nID3有很多改进算法，其中Quinlan在1994年开发出的C45算法流行最广。\n\
    \nC45的改进主要体现在两方面：\n\n- （1）解决了连续数据值的学习问题；\n- （2）提供了将学习结果决策树到等价规则集的转换功能。\n\n## 3.2.2.4\
    \ C45算法\n\n- C45算法\n\nC45属于一种归纳学习算法。归纳学习（Inductive Learning）旨在从大量经验数据中归纳抽取一般的判定规则和模式，它是机器学习（Machine\
    \ Learning）中最核心、最成熟的一个分支。\n\n根据有无导师指导，归纳学习又分为有导师学习（Supervised Learning，又称为示例学习）和无导师学习（Unsupervised\
    \ Learning）。\n\nC45属于有导师的学习算法。\n\n## 3.2.2.4 C45算法\n\n- 示例学习算法分为两大类：\n  - 覆盖算法（covering\
    \ algorithms）\n  - 分治算法（divide-and-conquer algorithms）\n\n- 前者归纳生成规则，后者归纳生成决策树。\n\
    \n## 3.2.2.5 Autoclass算法\n\n- Autoclass算法\n  是一个基于Bayesian网络的无监督的分类算法，该算法可以处理连续和离散的属性。对于连续属性值，用户应先验说明属性的概率分布类别（比如正态分布）；而对于离散属性，用户可以说明属性可能的所有取值。\n\
    \nAutoclass算法可以把属性单独考虑，也可以先验说明某些属性的联合分布。该算法根据先验的概率分布类别，探索性地将数据集多次分成不同个数的类，然后比较这些分类，给出较优的几个结果。\n\
    \n## 3.2.2.6 神经网络算法\n\n人工神经网（Artificial Neural Network, ANN）是20世纪80年代后期迅速发展起来的人工智能技术，它对噪声数据具有很高的承受能力，对未经训练的数据具有分类模拟的能力，因此在网站信息、生物信息和基因以及文本的数据挖掘等领域得到了越来越广泛的应用。在多种ANN模型中，反向传播（Back\
    \ Propagation, BP）网络是应用最广的一种。\n\n## 神经元\n\n![](img/97ec20d772baf04740a42252ab8f47d8_302_0.png)\n\
    \n通过非线性函数n维的输入向量 x 被映射为变量 y\n\n## 神经网络的组成\n\n基本的BP网络由输入层、输出层和隐层组成。\n\n输入向量\n\n\
    输出节点\n\n隐层节点\n\n输入节点\n\n输入向量: $x_i$\n\n$Err_j = O_j(1-O_j)\\sum_k Err_k w_{jk}$\n\
    \n$\\theta_j = \\theta_j + (l)Err_j$\n\n$w_{ij} = w_{ij} + (l)Err_j O_i$\n\n$Err_j\
    \ = O_j(1-O_j)(T_j - O_j)$\n\n$w_{ij}$\n\n$O_j = \\frac{1}{1+e^{-I_j}}$\n\n$I_j\
    \ = \\sum_i w_{ij} O_i + \\theta_j$\n\n![](img/97ec20d772baf04740a42252ab8f47d8_303_0.png)\n\
    \n![](img/97ec20d772baf04740a42252ab8f47d8_304_0.png)\n\n## 输入层\n\n## 隐层\n\n##\
    \ 输出层\n\n阈值θk\n\n阈值 θj\n\n输入值\n\n权值W_ij\n\n权值W_jk\n\n输出值\n\n## 神经网络的拓扑结构\n\n神经网络训练之前，需要设计网络拓扑结构。设计网络拓扑的关键是，确定隐层的神经元个数及各神经元初始权值和阈值（偏差）。理论上讲，隐层的神经元数越多，逼近越精确。但实际上，隐层神经元数不宜过多；否则会极大加长训练时间，并造成网络容错能力下降。经训练后的神经网络若其准确性不能被接受，则必须重新进行拓扑设计或改用不同的初始权值和阈值（偏差）。\n\
    \n## 神经网络的训练\n\n- 训练的终止条件\n  - 获得一组权重值，使得训练集中几乎所有样本都分类正确\n- 训练步骤\n  - 利用随机值对权值进行初始化\n\
    \  - 将训练样本逐一地输入给神经网络，进行训练\n  - 对于每个神经元\n    - 将其所有的输入值进行线性求和计算得到总的输入\n    - 利用激励函数计算其输出值\n\
    \    - 计算误差\n    - 修正网络权值和阈值（偏差）\n\n## BP神经网络\n\nBP神经网络通过迭代处理一组训练样本，将各样本的网络预测与实际已知类标号进行比较实现学习训练，反向修改网络的权值，使得网络预测与实际类之间的误差平方最小。BP神经网络按照最优训练准则反复迭代，确定并不断调整神经网络结构，通过迭代修改，当误差收敛时学习过程终止。\n\
    \n因此，具有分类准确、收敛性好、动态性好和鲁棒性强等优点。\n"
