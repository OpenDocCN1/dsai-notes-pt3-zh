    ## 2.3.1 电信领域数据仓库的设计\n\n### （2）数据仓库模型的设计—— ETL过程\n\n数据提取—转换—加载随着应用和系统环境的不同而具有不同的特点。一般而言，总包括下面的处理过程：\n\
    \n- a. 预处理\n\n正式开始作业之前的准备工作，包括清空工作区、检查过渡/准备区。如果需要直接访问操作型数据源系统时，要检查远程数据库服务器状态，并核对目标区数据加载状态，以核算出加载作业的参数，如加载数据的时间间隔和范围（24小时的数据，还是前3天的数据）。\n\
    \n- b. 启动数据加载的批作业\n\n- c. 因为维度表有事实表所参照的主键，所以要先完成对维表的加载，生成维表主键，并作为以后加载事实表所需要的外键。在加载维表中，有时要处理好缓慢变化的维的问题，并可能涉及到版本的处理问题。\n\
    \n- d. 加载事实表\n\n这中间也涉及到键查找的问题，即从有关维表中找到相应的主键，并以此作事实表的外键。\n\n- e. 事实表加载完成后，再对总计方阵体系进行刷新，以保障总计方阵与它的基础数据同步。\n\
    \n- f. 设计具有完善的出错处理机制和作业控制日志系统，用以监测和协调整个加载的过程。\n\n## 2.3.2 电信领域数据仓库的实现\n\n- > 抽取数据到临时数据区\n\
    \n数据仓库的数据源不是来自终端客户每天输入的数据，而是主要来自企业的OLTP系统数据。\n\n## 抽取数据到临时数据区的好处\n\n- - 简单电信数据仓库的数据库工具采用微软公司的SQL\
    \ Server 2000，在将其数据加载到数据仓库前，需先将OLTP系统的数据抽取到一个临时数据区，并在临时数据区进行数据清理和校验工作，待数据正确无误后，再加载到数据仓库，以保证数据质量。这是采用临时数据区的一个好处。\n\
    - - 临时数据区事实上就是一个数据库，此数据库作为数据仓库的数据源，数据仓库直接从临时数据区加载数据，从而避开OLTP系统，这样就避免了OLTP系统和数据仓库系统之间处理上的冲突，避免了OLTP系统因数据抽取而影响其响应时间的问题。这是采用临时数据区的另外一个好处。\n\
    \n临时数据区暂存将要加载到数据仓库的维度数据和事实数据，它利用关系表映射数据仓库的星型和雪花架构。因为系统是建立在SQL Server 2000数据库工具基础上，所以从OLTP系统抽取数据时，必然会用到存储过程以及脚本文件。\n\
    \n## 2.3.1 电信领域数据仓库的实现\n\n### ➢ 加载数据到数据仓库的具体步骤\n\n- 1. 设置数据库和数据源\n- 2. 建立多维数据集\n\
    - 3. 设计存储和处理多维数据集\n- 4. 为多维数据集创建分区\n\n## 2.3.2 电信领域数据仓库的实现\n\n### 企业级数据仓库的实现途径\n\
    \n- > 从建造某个部门特定的数据集市开始，逐步扩充数据仓库所包含的主题和范围，最后形成一个能够完全反映企业全貌的企业级数据仓库；\n- > 从一开始就从企业的整体来考虑数据仓库的主题和实施。\n\
    \n第一种方法类似于软件工程中“自底向上”的方法，投资少、周期短且易于见到成果，但由于该设计开始时是以特定的部门级主题为框架的，向其他的主体和部门扩充往往比较困难；\n\
    \n第二种方法与第一种相反，即“自顶向下”的方法，投资大、周期长。实际中大多采用第一种方法。\n\n“自底向上”地建立数据库，并不意味着不需要在设计阶段的长远规划。采用逐步积累的方式建立数据库，其最大的问题是已有的框架无法把新的业务集成进来。因此在设计阶段就必须充分考虑到这一点。例如，部门级的主题是否有助于形成企业级的主题，数据加载模块是否能够重复等等。数据库的长远规划，并不仅仅是技术部门的事情，应当把数据库的构建作为企业发展战略的一个组成部分。在设计阶段需要不同部门的沟通和协调，技术框架和系统设计必须从整个企业的角度来考虑，即使刚开始实施的时候是面向某个部门的。从这一点来看，建立一个企业级的数据仓库，主要的障碍不是技术，而是不同部门之间组织、协调的问题。\n\
    \n## 2.4 OLAP技术\n\n### 2.4.1　OLAP的定义和特点\n\n### 2.4.2　OLAP的分类\n\n### 2.4.3　OLAP的典型操作\n\
    \n## 2.4.1 OLAP的定义、特点\n\n- - 60年代，关系数据库之父E. F. Codd提出了关系模型，促进了联机事务处理（OLTP）的发展(数据以表格的形式而非文件方式存储)。\n\
    - - 1993年，E. F. Codd提出了OLAP概念，认为OLTP已不能满足终端客户对数据库查询分析的需要，SQL对大型数据库的简单查询也不能满足终端客户分析的要求。客户的决策分析需要对关系数据库进行大量计算才能获得结果，而查询的结果并不能满足决策者提出的需求。因此，E.\
    \ F. Codd提出了多维数据库和多维分析的概念，即OLAP。\n\n- - OLAP (On-Line Analysis Processing) 定义\n\
    \  是数据仓库上的分析展示工具，它建立在数据多维视图的基础上。\n- - OLAP的主要特点\n  一是在线性 (On Line)，体现为对用户请求的快速响应和交互式操作；\n\
