  - '[PAGE 247]


    # 3.1.2.1 聚类方法分类


    +   - 上述方法属于传统聚类的范畴。一般地，传统聚类算法对于维度较低的数据集较有效，而当维度较高时，可能就不适合了。

    +   - 此外，大型数据库的聚类研究受到越来越多的重视。随着数据库技术的普及，积累了大量的数据信息，因此这一分支成为一个研究热点。'
  - '[PAGE 248]


    # 模式矩阵


    一般地，数据对象采用矢量表示法，即通过一个在多维空间中的矢量，来描述一个对象多方面的特征。矢量的每个维度描述对象的一个特征。多个对象的矢量构成一个模式矩阵（Pattern
    Matrix），即（x_ij）_mn 其中每行代表一个对象，每列描述一个特征。'
  - '[PAGE 249]


    # 相似度


    在各种聚类算法中，通常是需要借助量化的指标以表征数据对象之间的特征差异和不同，称之为聚类统计量。聚类统计量包括：距离或相似度。'
  - '[PAGE 250]


    # 标准化


    由于不同的特征采用不同的度量标准或尺度，这将对聚类结果产生不同的影响，为了消除这一差别，常进行标准化变换，使所有的特征能用一个共同的标准度量。'
  - '[PAGE 251]


    # 距离的计算


    标准化处理后，计算对象间的距离最常用：欧氏距离，曼哈顿距离（又称绝对距离）、明考斯基（Minkovski）距离等方法。'
  - '[PAGE 252]


    # 相似度的计算


    n个对象彼此之间的相似性或近似性可通过相似（异）度矩阵（Dissimilarity Matrix）表示。它是一个n维、对角线元素为1的对称矩阵，即（rᵢⱼ）ₙₘ。其中，rᵢⱼ是i对象和j之间相似性的量化表示。通常其值是非负的。对象和关系越亲密，其绝对值越接近1；彼此关系越疏远，其值越接近于0。


    对象间相似度的计算方法包括：夹角余弦法、相关系数法及指数相似系数法等。'
  - '[PAGE 253]


    # 评价聚类方法的标准


    +   - 聚类分析是一种无监督的学习，事先对给定数据集合的结构一无所知，没有利用任何先验知识。无论采用哪种聚类算法，其聚类结果的合理性和有效性都有待评价。

    +   - 聚类有效性对聚类分析具有重要意义，被认为是聚类分析的一个瓶颈。对于相同的数据集合，采用不同的聚类方法，可能得到不同的聚类结果。

    +   - 即便是采用同一种聚类方法，若选择不同的初始参数（如聚类数、聚类中心等）也可能会得到不同的聚类结果。'
  - '[PAGE 254]


    ![](img/97ec20d772baf04740a42252ab8f47d8_254_0.png)


    例如，采用相同的k-均值聚类算法对同一个wine测试集进行聚类实验，当预设聚类类别数分别为1～8时，则所得到的聚类正确率是不同的，如柱状图所示。'
  - "[PAGE 255]\n\n# 评价聚类方法的标准\n\n+   - **可伸缩性**\n+   \n+     即算法中模式数发生变化的情况。有些算法在模式数小的条件下，算法的性能很好，但是模式数增大后，算法性能下降。如PAM算法是一种k-中心点算法，它对小的数据集合非常有效，但对大的数据集合则没有良好的可伸缩性。\n\
    +   - **高维性**\n+   \n+     即算法中模式属性个数发生变化的情况。同样，有些算法只擅长处理低维数据。在高维空间中聚类是一个挑战，特别是数据有可能非常稀疏和偏斜。"
  - '[PAGE 256]


    # 评价聚类方法的标准


    +   - **发现任意形状的聚类**

    +     一个簇可能是任意形状的，但一般的聚类算法是基于欧氏距离和曼哈顿距离度量实现聚类，更趋于发现球状簇。在这方面，基于密度的聚类方法较好。

    +   - **处理噪声数据的能力**

    +     噪声数据可能是数据本身不完整，也可能是孤立点数据（Outlier）。有些算法不擅于处理孤立点数据，因此还专门出现了发现孤立点数据的算法。'
  - '[PAGE 257]


    # 评价聚类方法的标准


    +   - 用于决定输入参数的领域知识最小化和输入记录顺序敏感性


    一方面要求降低算法对输入参数的敏感程度，另一方面要求输入记录顺序对算法的结果影响小。如经典的k-均值算法，需要预先给出簇的数目。在一些知识发现应用中，这一参数非常影响聚类的质量。这常常是高效率算法的弱点。'
  - '[PAGE 258]


    # 评价聚类方法的标准


    +   - 可解释性和可用性


    知识发现过程中，聚类结果总是表现为一定的知识，这就要求聚类结果可解释、易理解。这与可视化密切相关，同时也与实际应用有关。如SOM（Self Organization
    Mapping）算法用于文本聚类可以产生知识地图，表现了良好的可视化性能。'
  - '[PAGE 259]


    # 3.1.2.2 K均值算法


    +   - K均值（k-means）是一种简便、实用的无监督聚类分析算法。这种算法在已知簇的个数时，可很好地实现数据的聚类分析。

