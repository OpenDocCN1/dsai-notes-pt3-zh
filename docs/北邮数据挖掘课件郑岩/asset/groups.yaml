    Infoware。'
  - '[PAGE 454]


    # 5.3.2 典型工具—Amdocs


    Amdocs提供了整个电信运营企业的软件支撑平台。在其Clarify CRM产品组件中，利用数据挖掘技术支持以下应用：


    +   - 客户流失管理（churn management）

    +   - 终身价值分析（lifetime value analysis）

    +   - 产品分析（product analysis）

    +   - 欺诈甄别（fraud detection）。


    Amdocs产品中的数据分析和数据分析应用曾获得三届KDD杯奖。'
  - '[PAGE 455]


    # 5.3.3 典型工具—Predictive CRM


    Slp Infoware开发的Predictive CRM软件是一个面向电信行业的CRM平台软件，其中应用了大量的数据挖掘和统计学技术。其数据挖掘部分实际上是把SAS
    Institute、SPSS和UNICA等公司的数据挖掘产品加以二次开发以适应电信行业的需求。数据挖掘在P-CRM中的应用包括客户保持、交叉销售、客户流失管理、欺诈甄别等方面。'
  - "[PAGE 456]\n\n# 5.3.4 典型工具——SAS/EM\n\n利用SAS软件技术进行数据挖掘可以有三种方式：\n\n+   （1）使用SAS软件模块组合进行数据挖掘\n\
    +   \n+   （2）将若干SAS软件模块联结成一个适合需求的综合应用软件\n+   \n+   （3）使用SAS数据挖掘的集成软件工具SAS/EM"
  - '[PAGE 457]


    # 5.3.4 典型工具—SAS/EM


    SAS/EM是一个图形化界面，菜单驱动的，对用户非常友好且功能强大的数据挖掘集成软件，集成了：


    +   - 数据获取工具

    +   - 数据筛选工具

    +   - 数据挖掘数据库

    +   - 多种形式的回归工具

    +   - 决策树浏览工具

    +   - 数据挖掘的评价工具

    +   - 数据取样工具

    +   - 数据变量转换工具

    +   - 数据挖掘过程

    +   - 建立决策树的数据剖分工具

    +   - 人工神经元网络'
  - '[PAGE 458]


    # 5.3.4 典型工具—SAS/EM


    ![](img/97ec20d772baf04740a42252ab8f47d8_458_0.png)'
  - '[PAGE 459]


    # SAS/EM—数据获取工具


    通过对话框指定要使用的数据集的名称，并指定要在数据挖掘中使用的数据变量。变量分为两类：


    +   区间变量（Interval Variable）


    是指那些要进行统计处理的变量。对于这样一些变量，在数据输入阶段你就可以指定它们是否要作最大值、最小值、平均值、标准差等的处理。还可给出该变量是否有值的缺漏，缺漏的百分比是多少等。利用这些指定可对输入数据在获取伊始就进行了一次检查，并把结果告诉你，你可初步审视其质量如何。'
  - "[PAGE 460]\n\n# SAS/EM—数据获取工具\n\n+   - 分类变量（Class Variable）\n+   \n+     区间变量以外的变量称之为分类变量。\n\
    +     在数据输入阶段将会提供给你每个分类变量共有多少种值可供分类之用。"
  - '[PAGE 461]


    # SAS/EM—数据取样工具


    对获取的数据，可再从中作取样操作。取样的方式是多种多样的。主要包括：


    +   - 随机取样

    +   - 等距取样

    +   - 分层取样

    +   - 从起始顺序取样

    +   - 分类取样

    +   - ……'
  - "[PAGE 462]\n\n# SAS/EM—数据取样工具\n\n+   - 随机取样\n+   \n+     在采用随机取样方式时，数据集中的每一组观测值都有相同的被取样的概率。如按10%的比例对一个数据集进行随机取样，则每一组观测值都有10%的机会被取到。\n\
    \n+   - 等距取样\n+   \n+     如按5%的比例对一个有100组观测值的数据集进行等距取样，则有：100 / 5 = 20，等距取样方式是取第20、40、60、80和第100等五组观测值。"
  - '[PAGE 463]


    # SAS/EM—数据取样工具


    +   - 分层取样

    +     在这种取样操作时，首先将样本总体分成若干层次（或者说分成若干个子集）。在每个层次中的观测值都具有相同的被选用的概率，但对不同的层次你可设定不同的概率。这样的取样结果可能具有更好的代表性，进而使模型具有更好的拟合精度。

    +   - 从起始顺序取样

    +     从输入数据集的起始处开始取样。取样的数量可以给定一个百分比，或者就直接给定选取观测值的组数。'
  - '[PAGE 464]


    # SAS/EM—数据取样工具


    +   - 分类取样


    在前述几种取样方式中，取样的单位都是一组观测值。分类取样的单位是一类观测值。这里的分类是按观测值的某种属性进行区分。如按客户名称分类、按地址区域分类等。显然在同一类中可能会有多组观测值。分类取样的选取方式就是前面所述的几种方式，只是取样以类为单位。'
  - '[PAGE 465]


    # SAS/EM—数据筛选工具


    通过数据筛选工具可从观测值样本中筛选掉不希望包括进来的观测值。对于分类变量可给定某一类的类值说明此类观测值是要排除于取样范围之外的。对于区间变量可指定其值大于或小于某值时的这些组观测值是要排除于取样范围之外的。

    通过数据筛选使样本数据更适合数据挖掘的目标。'
  - '[PAGE 466]


    # SAS/EM—数据变量转换工具


    利用此工具可将某一个数据进行某种转换操作，然后将转换后的值作为新的变量存放在样本数据中。转换的目的是为了使数据和将来要建立的模型拟合的更好。例如，原来的非线性模型线性化、加强变量的稳定性等。可进行取幂、对数、开方...等转换。当然，也可给定一个公式进行转换。'
  - '[PAGE 467]


    # SAS/EM—建立数据库


    在进行数据挖掘分析模型的操作之前，要建立一个数据挖掘的数据库（DMDB），其中放置此次要进行操作的数据。因为此后可能要进行许多复杂的数学运算，在这里建立一个专门的数据集可提高工作效率。在处理之前，可对所选取的各个变量预先进行诸如最大、最小、平均、标准差…等处理。对一些要按其分类的变量的等级也先放入Meta
    Data之中，以利后继操作。

    总之在这个数据库中为数据挖掘建立一个良好的工作环境。'
  - '[PAGE 468]


    # SAS/EM—为建立决策树的数据剖分工具


    对数据集进行聚类、建立决策树，是近来数据处理，进行决策支持常用的方法。在SAS/EM中亦支持这一功能。在建立决策树的过程中可有多种数据聚类、剖分的方法可供选择。'
  - '[PAGE 469]


    # SAS/EM—为建立决策树的数据剖分工具


    图形化界面的交互式操作，可分成六个层：


    +   （1）对数据挖掘数据库中选定数据集的操作

    +   （2）对数据集中的变量的处理

    +   （3）聚类、剖分时的基本选择项

    +   （4）聚类、剖分时的进一步操作选择项

    +   （5）模型的初步确定

    +   （6）结果的评价'
  - '[PAGE 470]


    # SAS/EM—决策树浏览工具


    最后作出满意的决策树可能是个“枝繁叶茂”的架构。SAS/EM提供了可视化的浏览工具。这一点很重要，一个复杂的决策树若难以观察，则会影响实施决策的效率，甚至是有效性。决策树浏览工具包括：


    +   - 决策树基本内容和统计值的汇总表

    +   - 决策树的导航浏览

    +   - 决策树的图形显示

    +   - 决策树的评价图表'
  - '[PAGE 471]


    # SAS/EM—数据挖掘评价工具


    在SAS/EM的评价工具中，提供了一个通用的数据挖掘评价的架构，可以比较不同的模型效果；预报各种不同类型分析工具的结果。

    在进行了各种比较和预报的评价之后，将给出一系列标准的图表，供用户进行定量评价。可能用户会有自己独特的评价准则，在SAS/EM的评价工具中，还可以进行客户化的工作，对那些标准的评价图表按你的具体要求进行更改。因此，评价工作可能会更有意义。'
  - '[PAGE 472]


    # 5.3.5 典型工具—Weka


    +   - Random info

    +     - Weka...

    +       - Waikato Environment for Knowledge Analysis

    +     - Weka – native New Zealand bird

    +     - Developed in Java – multi-platform capability

    +     - Used for research, education, and applications

    +     - http://www.cs.waikato.ac.nz/ml/weka/


    ![](img/97ec20d772baf04740a42252ab8f47d8_472_0.png)'
  - '[PAGE 473]


    # Weka Interfaces


    +   - Command-line

    +   - Explorer

    +     - preprocessing, attribute selection, learning, visualiation

    +   - Knowledge Flow

    +     - visual design of KDD process

    +     - capabilities ~ Explorer

