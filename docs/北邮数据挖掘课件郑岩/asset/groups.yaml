  - '[PAGE 90]


    # 2.1.1 数据仓库的定义


    数据仓库是在企业管理和决策中面向主题的、集成的、与时间相关的、不可修改的数据集合。


    此定义由最为权威的、被称为“数据仓库之父”的William H. Inmon 先生给出。'
  - '[PAGE 91]


    # 2.1.1 数据仓库的定义


    +   - **面向主题的**

    +     是相对于传统数据库的面向应用而言的。所谓面向应用，指的是系统实现过程中主要围绕着一些应用或功能。而面向主题则考虑一个个的问题域，对问题域涉及到的数据和分析数据所采用的功能给予同样的重视。


    +   - **典型的主题领域**

    +     顾客、产品、事务或活动、保险单、索赔和账目。'
  - '[PAGE 92]


    # 2.1.1 数据仓库的定义


    +   - 集成的


    数据仓库中的数据来自各个不同的数据源（操作数据库）。由于历史的原因，各操作数据库的组织结构往往是不同的，在这些异构数据输入到数据仓库之前，必须经历一个集成过程。'
  - '[PAGE 93]


    # 2.1.1 数据仓库的定义


    +   - 集成的


    最重要的特点。应用问题的设计人员制定出不同的设计决策，且表示方法不同。例如编码、命名习惯、实际属性和属性度量等方面不一致。


    数据进入数据仓库时，需要消除各种不一致性。例如，数据仓库中顾客“性别”的编码，可采用“男/女”或“m/f”，采用哪种方式并不重要，重要的是在数据仓库中应该统一编码。如果应用数据编码为“X/Y”，则进入数据仓库时需要进行转换。


    此外，对所有应用所涉及的问题都要考虑一致性。例如命名习惯、键码结构、属性度量以及数据特点等。'
  - '[PAGE 94]


    # 2.1.1 数据仓库的定义


    +   - 与时间相关的


    数据仓库以维的形式对数据进行组织，时间维是数据仓库中很重要的一个维度。并且数据仓库中的数据时间跨度大，从几年甚至到几十年，称为历史数据。'
