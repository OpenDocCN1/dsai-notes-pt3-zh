    \n![](img/97ec20d772baf04740a42252ab8f47d8_361_5.png)\n\n## 3.5 数据挖掘的可视化\n\n以可视化的方式展示数据挖掘获取的相关知识。例如：\n\
    \n- 散点图和盒图 (obtained from descriptive data mining)\n- 决策树\n- 关联规则\n- 聚类\n- 异常点\n\
