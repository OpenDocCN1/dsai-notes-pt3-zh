  md: "\n## 1.4 主要功能\n\n### 3. 分类与估值（Classification and Estimation）\n\n分类指通过分析一个类别已知的数据集的特征来建立一组模型，该模型可用以预测类别未知的数据项的类别。该分类模型可以表现为多种形式：分类规则（IF-THEN），决策树或者数学公式，乃至神经网络。\n\
    \n估值与分类类似，只不过它要预测的不是类别，而是一个连续的数值。\n\n### 4. 聚类分析（Clustering Analysis）\n\n聚类分析又称为“同质分组”或者“无监督的分类”，指把一组数据分成不同的“簇”，每簇中的数据相似而不同簇间的数据则距离较远。相似性可以由用户或者专家定义的距离函数加以度量。\n\
    \n好的聚类方法应保证不同类间数据的相似性尽可能地小，而类内数据的相似性尽可能地大。\n\n### 5. 时间序列分析（Time-Series Analysis）\n\
    \n时间序列分析即预测（Prediction），是指通过对大量时间序列数据的分析找到特定的规则和感兴趣的特性，包括搜索相似序列或者子序列，挖掘序列模式、周期性、趋势和偏差。预测的目的是对未来的情况作出估计。\n\
    \n### 6. 其它功能\n\n包括：偏差分析（Deviation Analysis）、孤立点分析（Outlier Analysis）等。\n\n随着数据挖掘技术的发展，可能还会继续出现新的数据挖掘功能。\n\
    \n## 1.5 数据挖掘模型\n\n为了使数据挖掘技术在产业界得到更好的应用，欧洲委员会联合一些数据挖掘软件厂商开发了CRISP-DM（Cross Industry\
    \ Standard Process for Data Mining）模型，目的是把数据挖掘的过程标准化，使数据挖掘项目的实施速度更快、成本更低、更可靠并且更容易管理。\n\
    \nCRISP-DM模型最先在1996年被提出，当前的白皮书版本是1.0。\n\n### CRISP-DM（Cross Industry Standard\
    \ Process for Data Mining）模型\n\n![](img/97ec20d772baf04740a42252ab8f47d8_56_0.png)\n\
    \nCRISP-DM模型中，数据挖掘包括六个步骤：\n\n### 1. 业务理解（Business Understanding）阶段\n\n具体地，包括：\n\
    \n- 确定业务目标：分析项目的背景，从业务视点分析项目的目标和需求，确定业务角度的成功标准；\n- 项目可行性分析：分析拥有的资源，条件和限制，风险估计，成本和效益估计；\n\
    - 确定数据挖掘目标：明确确定数据挖掘的目标和成功标准，数据挖掘的目标和业务目标是不一样的，前者指技术上的，例如生成一棵决策树等；\n- 提出初步的项目计划：对整个项目做一个计划，初步估计用到的工具和技术。\n\
    \n### 2. 数据理解（Data Understanding）阶段\n\n具体地，包括：\n\n- 收集原始数据：收集本项目所涉及到的数据，如有必要，把数据装入数据处理工具，并作一些初步的数据集成的工作，生成相应报告；\n\
    - 描述数据：对数据做一些大致的描述，例如记录数、属性数等，给出相应报告；\n- 探索数据：对数据做简单的统计分析，例如关键属性的分布等；\n- 检查数据质量：包括数据是否完整、数据是否有错、是否有缺失值等问题。\n\
    \n### 3. 数据准备（Data Preparation）阶段\n\n具体地，包括：\n\n- 数据选择：根据数据挖掘目标和数据质量选择合适的数据，包括表的选择、记录选择和属性选择；\n\
    - 数据清洁：提高选择好的数据的质量，例如去除噪音，估计缺失值等；\n- 数据创建：在原有数据的基础上生成新的属性或记录；\n- 数据合并：利用表连接等方式将几个数据集合并在一起；\n\
    - 数据格式化：把数据转换成适合数据挖掘处理的格式。\n\n### 4. 建立模型（Modeling）阶段\n\n具体地，包括：\n\n- 选择建模技术：确定数据挖掘算法和参数，可能会利用多个算法；\n\
    - 测试方案设计：设计某种测试模型的质量和有效性的机制；\n- 模型训练：在准备好的数据集上运行数据挖掘算法，得出一个或者多个模型；\n- 模型测试评估：根据测试方案进行测试，从数据挖掘技术的角度确定数据挖掘目标是否成功。\n\
    \n### 5. 模型评估（Evaluation）阶段\n\n具体地，包括：\n\n- 结果评估：从商业角度评估得到的模型，甚至实际试用该模型测试其效果；\n\
    - 过程回顾：回顾项目的所有流程，确定每一个阶段都没有失误；\n- 确定下一步工作：根据结果评估和过程回顾得出的结论，确定是部署该挖掘模型还是从某个阶段开始重新开始。\n\
    \n### 6. 部署（Deployment）阶段\n\n具体地，包括：\n\n- 部署计划：对在业务运作中部署模型作出计划；\n- 监控和维护计划：如何监控模型在实际业务中的使用情况，如何维护该模型；\n\
    - 作出最终报告：项目总结，项目经验和项目结果；\n- 项目回顾：回顾项目的实施过程，总结经验教训；对数据挖掘的运行效果做一个预测。\n\n## 1.6 实现流程\n\
    \n各步骤之间互相影响、反复调整，形成一种螺旋式上升过程。\n\n### 数据准备\n\nKDD的处理对象是大量的数据，这些数据一般存储在数据库系统中，是长期积累的结果。但往往不合适直接在这些数据上进行知识挖掘，需要做一些准备工作，也就是数据的预处理。数据预处理包括数据的选择（选择相关数据）、净化（消除噪音、冗余数据）、推测（推算缺值数据）、转换（离散型数据与连续型数据之间的转换）、数据缩减（减少数据量）等。\n\
    \n数据准备是KDD的第一个步骤，也是比较重要的一个步骤。数据准备得好坏将直接影响数据挖掘的效率和准确度以及最终模式的有效性。\n\n### 数据挖掘\n\n\
    数据挖掘是最为关键的步骤，它根据KDD的目标，选取相应算法的参数，分析数据，得到可能形成知识的模式模型。目前采用较多的技术有决策树、分类、聚类、粗糙集、关联规则、神经网络、遗传算法等。\n\
    \n### 模式的评估、解释\n\n通过上面步骤所得到的模式，有可能是没有意义或没有实用价值的，因此需要评估，确定哪些是有效的、有用的模式。此外，大部分模式是用数学手段描述的表达式，很难被人理解，还需要将其解释成可理解的方式以呈现给用户。\n\
    \n### 知识运用\n\n发现知识是为了运用，如何使知识能被运用也是KDD的步骤之一。运用知识有两种方法：一种是只需看知识本身所描述的关系或结果，就可以对决策提供支持；另一种是要求对新的数据运用知识，由此可能产生新的问题，而需要对知识做进一步的优化。\n\
    \nKDD过程可能需要多次的循环反复，每一个步骤一旦与预期目标不符，都要回到前面的步骤，重新调整，重新执行。\n\n数据挖掘过程的分步实现，不同的步骤需要不同的专业人员参与完成，大体分为三类：\n\
    \n- 业务分析人员：要求精通业务，能够解释业务对象，并根据各业务对象确定出用于数据定义和挖掘算法的业务需求。\n- 数据分析人员：精通数据分析技术，并对统计学有较熟练的掌握，有能力把业务需求转化为数据挖掘的各步操作，并为每步操作选择合适的技术。\n\
    - 数据管理人员：精通数据管理技术，并从数据库或数据仓库中收集数据。\n\n从上可见，数据挖掘是一个多领域专家合作的过程，也是一个在资金上和技术上高投入的过程。这一过程要反复进行，在反复过程中，不断地趋近事物的本质，不断地优化问题的解决方案。\n\
    \n## 数据挖掘\n\nIncreasing potential to support business decisions\n\n- Making Decisions\n\
    - Data Presentation\n  - Visualization Techniques\n- Data Mining\n  - Information\
    \ Discovery\n- Data Exploration\n  - Statistical Analysis, Querying and Reporting\n\
    - Data Warehouses / Data Marts\n  - OLAP, MDA\n- Data Sources\n  - Paper, Files,\
    \ Information Providers, Database Systems, OLTP\n- End User\n- Business Analyst\n\
    - Data Analyst\n- DBA\n"
