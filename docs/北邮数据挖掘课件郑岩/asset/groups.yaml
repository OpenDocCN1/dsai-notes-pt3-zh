    # Value of data mining


    +   - Business uses and benefits


    +   - Somerfield Stores used data mining to explore patterns of bread buying to
    make better predictions about sales volumes

    +   - Leeds Building Society used data mining for identifying mortgage accounts
    likely to default on repayments

    +   - Norwich Union Life & Pensions used data mining techniques to develop a knowledge-based
    system to automate underwriting decisions

    +   - Halfords used data mining to develop methods for selecting store locations
    for maximum turnover

    +   - BBC used data mining for scheduling programs in order to maximise audience
    share

    +   - DTI funded projects on security and fraud using data mining'
  - '[PAGE 29]


    # Somerfield Stores


    +   - The initial target problem was the analysis of bread buying patterns using
    large volumes of data captured at the ''basket'' level and stored in their ''data
    warehouse''. Because bread has a short shelf life, it is important that accurate
    store-level purchasing predictions can be made to ensure optimum freshness and
    availability. The situation is complicated by product promotions and the ''domino''
    effect, where one type of bread sells out and sales are transferred to other brands.

    +   - Through the use of data mining, an increased understanding of purchasing
    trends enables better bread availability and greater customer satisfaction.

    +   - Now that the data mining process has been proved in the optimisation of
    bread management, Somerfield Stores are applying data mining in other areas of
    the business.'
  - '[PAGE 30]


    # main points so far


    +   - Simple examples shown – larger, more complex data sets are normal

    +   - All sorts of data can be mined: numerical and/or nominal – or other types

    +   - Noisy or missing data accommodated

    +   - Detailed preparation of data is essential

    +   - Many different data mining algorithms and techniques available

    +   - Essential to understand the data, the problem and the answer'
  - '[PAGE 31]


    # 数据挖掘的演化


    | 进化阶段 | 商业问题 | 支持技术 | 产品厂家 | 产品特点 |

    |---|---|---|---|---|

    | 数据搜集（60年代） | “过去五年中我的总收入是多少？” | 计算机、磁带和磁盘 | IBM,CDC | 提供历史性的、静态的数据信息 |

    | 数据访问（80年代） | “在新英格兰的分部去年三月的销售额是多少？” | 关系数据库（RDBMS），结构化查询语言（SQL），ODBC Oracle、Sybase、Informix、IBM、Microsoft
    | Oracle、Sybase、Informix、IBM、Microsoft | 在记录级提供历史性的、动态数据信息 |

    | 数据仓库；决策支持（90年代） | “在新英格兰的分部去年三月的销售额是多少？波士顿据此可得出什么结论？” | 联机分析处理（OLAP）、多维数据库、数据仓库
    | Pilot、Comshare、Arbor、Cognos、Microstrategy | 在各种层次上提供回溯的、动态的数据信息 |

    | 数据挖掘（正在流行） | “下个月波士顿的销售会怎么样？为什么？” | 高级算法、多处理器计算机、海量数据库 | Pilot、Lockheed、IBM、SGI、其他初创公司
    | 提供预测性的信息 |'
