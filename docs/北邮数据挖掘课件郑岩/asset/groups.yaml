    Because bread has a short shelf life, it is important that accurate store-level
    purchasing predictions can be made to ensure optimum freshness and availability.
    The situation is complicated by product promotions and the ''domino'' effect,
    where one type of bread sells out and sales are transferred to other brands.

    - Through the use of data mining, an increased understanding of purchasing trends
    enables better bread availability and greater customer satisfaction.

    - Now that the data mining process has been proved in the optimisation of bread
    management, Somerfield Stores are applying data mining in other areas of the business.


    ## main points so far

    - Simple examples shown – larger, more complex data sets are normal

    - All sorts of data can be mined: numerical and/or nominal – or other types

    - Noisy or missing data accommodated

    - Detailed preparation of data is essential

    - Many different data mining algorithms and techniques available

    - Essential to understand the data, the problem and the answer


    ## 数据挖掘的演化


    | 进化阶段 | 商业问题 | 支持技术 | 产品厂家 | 产品特点 |

    |---|---|---|---|---|

    | 数据搜集（60年代） | “过去五年中我的总收入是多少？” | 计算机、磁带和磁盘 | IBM,CDC | 提供历史性的、静态的数据信息 |

    | 数据访问（80年代） | “在新英格兰的分部去年三月的销售额是多少？” | 关系数据库（RDBMS），结构化查询语言（SQL），ODBC Oracle、Sybase、Informix、IBM、Microsoft
    | Oracle、Sybase、Informix、IBM、Microsoft | 在记录级提供历史性的、动态数据信息 |

    | 数据仓库；决策支持（90年代） | “在新英格兰的分部去年三月的销售额是多少？波士顿据此可得出什么结论？” | 联机分析处理（OLAP）、多维数据库、数据仓库
    | Pilot、Comshare、Arbor、Cognos、Microstrategy | 在各种层次上提供回溯的、动态的数据信息 |

    | 数据挖掘（正在流行） | “下个月波士顿的销售会怎么样？为什么？” | 高级算法、多处理器计算机、海量数据库 | Pilot、Lockheed、IBM、SGI、其他初创公司
    | 提供预测性的信息 |


    ## 数据挖掘与其他科学的关系


    ![](img/97ec20d772baf04740a42252ab8f47d8_32_0.png)


    Database Technology


    Statistics


    Machine Learning


    Data Mining


    Visualization


    Information Science


    Other Disciplines


    ## 数据挖掘与其他科学的关系


    数据挖掘作为一门新兴的交叉学科，涉及数据库系统、数据仓库、统计学、机器学习、可视化、信息检索和高性能计算等诸多领域。


    此外，还与神经网络、模式识别、空间数据分析、图像处理、信号处理、概率论、图论和归纳逻辑等等领域关系密切。


    ## 数据挖掘与统计学的关系


    近几年，人们逐渐发现数据挖掘中有许多工作都是由统计方法来完成的。甚至有些人（尤其是统计学家）认为数据挖掘是统计学的一个分支，当然大多数人（包括绝大多数数据挖掘研究人员）并不这么认为。


    但是，统计学和数据挖掘的目标非常相似，而且数据挖掘中的许多算法也源于数理统计，统计学对数据挖掘发展的贡献功不可没。

