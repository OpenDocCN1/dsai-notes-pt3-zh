    \ 客户的利润、客户的基本信息和行为分类如时间段、业务类型等的分布表示。类似于客户行为分析。\n- 信用度的相关分析\n  分析影响用户信用度的因素之间的概率依赖关系、强度及其可信度。这一方面用于预测客户信用度的发展趋势，当发生变化时，对其信用等级进行相应的调整。\n\
    \n利用上述分析结果，给出从一个信用度等级到另一个信用度等级变化可能性大的客户。可能决策者主要关心从高等级到低等级（最低等级）和从低等级到最高等级可能性大的用户群。\n\
    \n根据影响用户信用度的主要因素，对用户的账务数据进行分类，建立分类模型，并对用户进行评分，给出用户的信用度级别（类别）。\n\n影响用户信用度的主要因素包括：\n\
    \n- (1) 交费的及时度\n- (2) 用户的社会性质\n- (3) 用户的通话业务量\n- (4) 用户申请的业务数量\n- (5) 用户申请的业务种类和用户的投诉情况\n\
    \n- 用户信用度分析的实现\n  <1> 系统初装时，没有用户的信用度级别信息，这时采用聚类算法，按照用户的帐务行为信息将其分为若干类。在此基础上，依照每类各指标的统计数据和一定的等级评定规则，将各类的信用度赋于高低级别；\n\
    \  <2> 在系统运转过程中，用户（指本系统用户）可能会对用户已有信用度级别提出异议，或加以修改，这样，对做了相应级别修正后的用户数据，采用有监督的分类学习，就会导致更为准确的分类模型，而且这个模型也是不断在更新的。相应的，随着用户信用行为特征的变化，其信用级别也会不断变动。\n\
    \n信用度类别分类依据的用户帐务信息数据包括：\n\n- 开户平均时长\n- 欠费次数\n- 金额(如本月欠费，则为欠费金额，此值为负，如本月不欠费，则为通话费用，此值非负)\n\
    - 欠费时长\n- 帐务人社会性质\n\n### 步骤1　用户信用度初始化\n\n历史帐务信息数据库\n\n![](img/97ec20d772baf04740a42252ab8f47d8_403_0.png)\n\
    \n抽样样本数据\n\n![](img/97ec20d772baf04740a42252ab8f47d8_403_1.png)\n\n![](img/97ec20d772baf04740a42252ab8f47d8_403_2.png)\n\
    \n类别模型1\n\n![](img/97ec20d772baf04740a42252ab8f47d8_403_3.png)\n\n信用度模型\n更新模块\n\
    \n类别统计信息\n\n![](img/97ec20d772baf04740a42252ab8f47d8_403_4.png)\n\n修正的类别模型1\n\n\
    等级评定规则\n\n### 数据抽样\n\n- 抽样的原则\n\n样本尽量具有代表性，且数据量能保证学习耗时不是太多。\n\n例如，可采用一个随机数产生器随机产生要抽取的样本。\n\
    \n历史帐务数据库\n\n抽取\n\n帐务记录ID\n\n抽样\n\n随机数发生器\n\n供学习用样本数据\n\n### 步骤2 信用度模型更新\n\n初始化后的帐务历史数据库\n\
    \n上月帐务数据\n\n用户基本信息库\n\n抽样\n\n信用度人为设定\n\n用户信用更新模块\n\n信用度历史记录\n\n训练样本数据\n\n分类模型\n\
    \n有监督分类学习\n\n### 步骤3 用户信用度级别更新\n\n当月帐务数据库\n\n用户基本信息库\n\n评分\n\n分类模型\n\n信用度历史记录库\n\
    \n营销接口\n\n仓库接口\n\n### 步骤4 新开户信用度设定\n\n用户的信用度级别设定是由用户的帐务信息决定的，而新开户用户没有任何帐务记录，故根据已有的信用度模型没法设置其信用度。考虑到有不同帐务行为的用户有不同的基本信息，即某种信用等级的用户具有相似的基本信息，我们可以分析新开户的基本信息，与各个信用等级的用户基本信息做比较，以确定他属于哪个信用级别，分为以下两步：\n\
    \n- 1. 分类模型确定\n- 2. 新开户信用等级评定\n\n用户基本信息数据\n\n![](img/97ec20d772baf04740a42252ab8f47d8_409_0.png)\n\
    \n训练样本数据\n\n![](img/97ec20d772baf04740a42252ab8f47d8_409_1.png)\n\n![](img/97ec20d772baf04740a42252ab8f47d8_409_2.png)\n\
    \n![](img/97ec20d772baf04740a42252ab8f47d8_409_3.png)\n\n![](img/97ec20d772baf04740a42252ab8f47d8_409_4.png)\n\
    \n分类模型\n\n## 4.2.4 优惠策略分析\n\n优惠策略（包括营销优惠策略和话费优惠策略）主要完成：\n\n- （1）定义优惠规则和优惠方式；\n\
    - （2）用户优惠规则参数化处理；\n- （3）对已有优惠策略的性能分析；\n- （4）优惠套餐的设置；\n- （5）各种优惠和业务、以及其他信息分布关系的展示功能。\n\
    \n优惠规则分为：\n\n- 时段优惠\n\n用户可享受国家规定的时段优惠外，系统还应提供有各个公司制定的适用于本地的时段优惠措施\n- 总量优惠\n\n\
    对用户的业务量达到一定的程度后，给予不同的优惠措施。\n\n### 优惠方式分析\n\n- 对于各种优惠方式（包括优惠套餐），给出其受益客户的类别、信用度类别分布、欺诈情况和投诉类别分布等。例如，优惠策略的行为类别分布及其柱状图和饼状图等。\n\
    - 新优惠套餐设置分析。给出新的优惠套餐的设置与客户群的分析及利润分析。（优惠套餐的设置参数必须在以前的优惠策略中出现过），分析优惠套餐使用者的其他各项属性的概率，从而给出这种优惠（资费）的客户群体。同时可以查找最优化的优惠设置。\n\
    \n- 优惠策略或优惠套餐潜在客户分析。\n- 优惠策略的性能分析。通过分析优惠策略和业务量和收入之间的关系，给出优惠策略的性能。\n\n## 4.2.5\
    \ 甄别欺诈\n\n当前恶意欠费客户给电信运营商造成了巨大的利润损失，如何减少欺诈行为带来的损失是每一家电信企业所必须面对的问题。在识别欺诈客户，降低经营风险方面数据挖掘已经不少有了成功的应用案例。\n\
    \n识别欺诈客户的主要途径：\n\n- 1. 第一个是区分用户的信用度，通过建立用户信用打分模型把用户分成不同的信用度等级，给不同的等级确定不同的月高额限制，超出限额的认为是潜在恶意欠费客户。\n\
    - 2. 第二是建立恶意欠费客户的消费识别模型，如果某一客户的消费模式吻合欺诈消费模式，则认为是潜在恶意欠费客户。\n\n甄别欺诈策略分析类似优惠分析，建立在信用度管理的基础之上。\n\
    \n- 分析防欺诈策略的相关变量：高额话费额度、欠费停机额度和用户具有不同的欠费停机额度等。\n- 指定防欺诈策略\n- 分析信用度、客户的满意程度、高额花费警告额度和停机额度之间的关系。根据分析结果调整用户的基本信息。\n\
    - 分析信用度、客户的满意程度和用户催缴周期、催缴频率之间的关系。\n\n## 4.2.6 预测\n\n预测主要指业务预测，是针对电信量发展的短期预测。它建立在对大量数据（业务资料数据、社会基础资料数据、市场调查资料、其他运营者资料数据）统计分析的基础上，通过模型运算、统计分析等数据处理手段，完成对电信业务的业务发展、用户需求数量、用户分布、市场占有率等几方面的预测分析。\n\
    \n## 数据挖掘的认识误区\n\n- ◆ 挖掘出的结果都是正确的\n\n数据挖掘得出的结果一般都是经验性的，它并不是一条经过严格数学证明的定理（事实上数据挖掘得出的规则绝大多数不可证明）。例如数据挖掘号称能通过历史数据的分析来预测客户的行为，而事实上客户自己可能都不明确自己下一步要做什么。挖掘算法并不保证结果的完全正确，挖掘出的结果只具有概率上的意义，只具有参考价值。\n\
    \n"
