    ## 3.3.1 基本概念

    - 关联

    自然界中某种事物发生时其他事物也会发生，则这种联系称之为关联。反映事件之间依赖或关联的知识称为关联型知识（又称依赖关系）。

    - 关联的类型

    分为简单关联、时序关联、因果关联。

    - 关联规则


    关联是两个或多个变量取值之间存在的一类重要的可被发现的某种规律性。


    ### 关联规则的数学定义


    先设 I={i1，i2，…，im} 是一个以 m 个不同项为元素的集合，T 是针对 I 的交易的集合，每一笔交易包含若干个属于 I 的项。关联规则可表示为
    X⇒Y，其中 X，Y ⊂ I 且 X ∩ Y=Φ


    X 称为规则的前提或前项，Y 称为结果或后项。每一规则有两个度量标准，即支持度（Support）和可信度（Confidence）


    规则的支持度定义为：support（X⇒Y）=support（X ∪ Y）


    规则的可信度定义为：confidence（X⇒Y）=support（X ∪ Y）/support（X）

    - 关联规则的形式


    R: X=> Y

    其中，X及Y是两个不相交的集合，即X,Y⊂I且X∩Y=Φ


    关联规则可以理解为一个命题，即如果一个交易支持项集X，则它也以一定的可能性支持项集Y，这一可能性称之为规则的可信度，记为conf(R)或C(R)

    - 举例

    - 规则形式: Body → Head [support, confidence]

    - buys(x, “diapers”) → buys(x, “beers”) [0.5%, 60%]

    - major(x, “CS”) ^ takes(x, “DB”) → grade(x, “A”) [1%, 75%]

    - 关联规则的性质

    - 规则的非结合性

    - 规则的不可分解性

    - 规则的不可传递性

    - 规则的可扩展性


    ## 关联规则挖掘实例


    通过发现顾客放入其购物篮中不同商品之间的联系，分析顾客的购买习惯。通过了解哪些商品频繁地被顾客同时购买，这种关联的发现可以帮助零售商制定营销策略。例如，在同一次购物中，如果顾客购买牛奶的同时，也购买面包（和什么类型的面包）的可能性有多大？


    这种信息可以引导销售，可以帮助零售商有选择地经销和安排货架。例如，将牛奶和面包尽可能放近一些，可以进一步刺激一次去商店同时购买这些商品。


