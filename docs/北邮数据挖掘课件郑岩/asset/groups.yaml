  - '[PAGE 236]


    # 3.1.2.1 聚类方法分类


    +   - 基于划分的聚类方法


    给定一个由个n对象组成的数据集合，对此数据集合构建k个划分（k≤n），每个划分代表一个簇，即将数据集合分成多个簇的算法。


    要求：①每个簇至少有一个对象；

    ②每个对象必须且仅属于一个簇。


    典型算法k-均值和k-中心点算法等。'
  - '[PAGE 237]


    # 3.1.2.1 聚类方法分类


    +   - 基于层次的聚类方法


    对给定的数据集进行层层分解的聚类过程，具体地主要包括凝聚法和分裂法。


    凝聚法指起初每个对象被认为是一个簇，然后不断合并相似的簇，直到达到一个令人满意的终止条件；分裂法恰恰相反，先把所有的数据归于一个簇，然后不断分裂彼此相似度最小的数据集，使簇被分裂成更小的簇，直到达到一个令人满意的终止条件。


    根据簇间距离度量方法的不同，层次法可分为不同的种类。常用的距离度量方法包括：最小距离、最大距离、平均值距离和平均距离等。


    典型算法：CURE、Chameleon和BIRCH等'
  - '[PAGE 238]


    # 基于层次的聚类方法


