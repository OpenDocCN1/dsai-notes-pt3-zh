    # 2.3.1 电信领域数据仓库的设计


    # （2）数据仓库模型的设计—— ETL过程


    +   b. 启动数据加载的批作业


    +   c. 因为维度表有事实表所参照的主键，所以要先完成对维表的加载，生成维表主键，并作为以后加载事实表所需要的外键。在加载维表中，有时要处理好缓慢变化的维的问题，并可能涉及到版本的处理问题。'
  - '[PAGE 207]


    # 2.3.1 电信领域数据仓库的设计


    # （2）数据仓库模型的设计—— ETL过程


    +   d. 加载事实表


    这中间也涉及到键查找的问题，即从有关维表中找到相应的主键，并以此作事实表的外键。


    +   e. 事实表加载完成后，再对总计方阵体系进行刷新，以保障总计方阵与它的基础数据同步。


    +   f. 设计具有完善的出错处理机制和作业控制日志系统，用以监测和协调整个加载的过程。'
  - '[PAGE 208]


    # 2.3.2 电信领域数据仓库的实现


    +   > 抽取数据到临时数据区


    数据仓库的数据源不是来自终端客户每天输入的数据，而是主要来自企业的OLTP系统数据。'
  - '[PAGE 209]


    # 抽取数据到临时数据区的好处


    +   - 简单电信数据仓库的数据库工具采用微软公司的SQL Server 2000，在将其数据加载到数据仓库前，需先将OLTP系统的数据抽取到一个临时数据区，并在临时数据区进行数据清理和校验工作，待数据正确无误后，再加载到数据仓库，以保证数据质量。这是采用临时数据区的一个好处。

    +   - 临时数据区事实上就是一个数据库，此数据库作为数据仓库的数据源，数据仓库直接从临时数据区加载数据，从而避开OLTP系统，这样就避免了OLTP系统和数据仓库系统之间处理上的冲突，避免了OLTP系统因数据抽取而影响其响应时间的问题。这是采用临时数据区的另外一个好处。'
  - '[PAGE 210]


    # 2.3.2  电信领域数据仓库的实现


    临时数据区暂存将要加载到数据仓库的维度数据和事实数据，它利用关系表映射数据仓库的星型和雪花架构。因为系统是建立在SQL Server 2000数据库工具基础上，所以从OLTP系统抽取数据时，必然会用到存储过程以及脚本文件。'
  - '[PAGE 211]


    # 2.3.1 电信领域数据仓库的实现


    # ➢ 加载数据到数据仓库的具体步骤


    +   1. 设置数据库和数据源

    +   2. 建立多维数据集

    +   3. 设计存储和处理多维数据集

    +   4. 为多维数据集创建分区'
  - '[PAGE 212]


    # 2.3.2 电信领域数据仓库的实现


    # 企业级数据仓库的实现途径


    +   > 从建造某个部门特定的数据集市开始，逐步扩充数据仓库所包含的主题和范围，最后形成一个能够完全反映企业全貌的企业级数据仓库；


    +   > 从一开始就从企业的整体来考虑数据仓库的主题和实施。'
  - '[PAGE 213]


    # 2.3.2 电信领域数据仓库的实现


    第一种方法类似于软件工程中“自底向上”的方法，投资少、周期短且易于见到成果，但由于该设计开始时是以特定的部门级主题为框架的，向其他的主体和部门扩充往往比较困难；


    第二种方法与第一种相反，即“自顶向下”的方法，投资大、周期长。实际中大多采用第一种方法。'
  - '[PAGE 214]


    # 2.3.2  电信领域数据仓库的实现


    “自底向上”地建立数据库，并不意味着不需要在设计阶段的长远规划。采用逐步积累的方式建立数据库，其最大的问题是已有的框架无法把新的业务集成进来。因此在设计阶段就必须充分考虑到这一点。例如，部门级的主题是否有助于形成企业级的主题，数据加载模块是否能够重复等等。数据库的长远规划，并不仅仅是技术部门的事情，应当把数据库的构建作为企业发展战略的一个组成部分。在设计阶段需要不同部门的沟通和协调，技术框架和系统设计必须从整个企业的角度来考虑，即使刚开始实施的时候是面向某个部门的。从这一点来看，建立一个企业级的数据仓库，主要的障碍不是技术，而是不同部门之间组织、协调的问题。'
  - '[PAGE 215]


    # 2.4 OLAP技术


    # 2.4.1　OLAP的定义和特点


    # 2.4.2　OLAP的分类


    # 2.4.3　OLAP的典型操作'
  - '[PAGE 216]


    # 2.4.1 OLAP的定义、特点


    +   - 60年代，关系数据库之父E. F. Codd提出了关系模型，促进了联机事务处理（OLTP）的发展(数据以表格的形式而非文件方式存储)。

    +   - 1993年，E. F. Codd提出了OLAP概念，认为OLTP已不能满足终端客户对数据库查询分析的需要，SQL对大型数据库的简单查询也不能满足终端客户分析的要求。客户的决策分析需要对关系数据库进行大量计算才能获得结果，而查询的结果并不能满足决策者提出的需求。因此，E.
    F. Codd提出了多维数据库和多维分析的概念，即OLAP。'
  - '[PAGE 217]


    # 2.4.1 OLAP的定义、特点


    +   - OLAP (On-Line Analysis Processing) 定义

    +     是数据仓库上的分析展示工具，它建立在数据多维视图的基础上。

    +   - OLAP的主要特点

    +     一是在线性 (On Line)，体现为对用户请求的快速响应和交互式操作；

    +     二是多维分析 (Multi_Analysis)，这是OLAP技术的核心所在。'
  - '[PAGE 218]


    # 2.4.1 OLAP的定义和特点


    整个数据（仓）库系统的工具层大致可以分为三类，或者说三个发展阶段：


    +   (1) 以MIS为代表的查询、报表类工具

    +   (2) 以OLAP为代表的验证型工具

    +   (3) 以及以DM为代表的挖掘型工具'
  - '[PAGE 219]


    # 2.4.1 OLAP的定义和特点


    +   - OLAP与OLTP的区别


    （1）OLTP主要面向公司职员；OLAP则主要面向公司领导者。


    （2）OLTP应用主要是用来完成客户的事务处理，其数据基础是操作型数据库，如民航订票系统、银行储蓄系统等等，通常需要进行大量的更新操作，同时对响应时间要求较高；而OLAP是以数据仓库库或数据多维视图为基础的数据分析处理，是针对特定问题的联机数据访问和分析，它一般不对仓库数据作修改处理，而只是查询，其应用主要是对客户当前及历史数据进行分析，辅助领导决策，其典型的应用有对银行信用卡风险的分析与预测、公司市场营销策略的制定等，主要是进行大量的查询操作，对时间的要求不太严格。'
  - '[PAGE 220]


    # # OLAP与OLTP的不同


    |  | OLTP | OLAP |

    |---|---|---|

    | 使用者 | 职员、IT人员 | 知识工作者 |

    | 功能 | 日常操作 | 决策支持 |

    | 数据库设计 | 面向应用的 | 面向主题的 |

    | 数据特点 | 当前的，更新的；详细的，关系型的；孤立的 | 历史的，汇总的，多维的；集成的，consolidated |

    | 使用 | repetitive | ad-hoc |

    | 存取方式 | 读/写；索引 | 大量的扫描 |

    | unit of work | 简单的事务处理 | 复杂的查询 |

    | 记录访问量 | 几十 | 上百万 |

    | 用户数量 | 数以千计 | 数以百计 |

    | 数据库规模 | 100MB-GB | 100GB-TB |'
  - '[PAGE 221]


    # 2.4.1 OLAP的定义和特点


    # OLAP与数据挖掘的比较


    +   - **相同之处**

    +     - OLAP与DM都是数据库（数据仓库）上的分析工具；


    +   - **不同之处**

    +     - （1）在实际应用中各有侧重。前者是验证型的，后者是挖掘型的；

    +     - （2）前者建立在多维视图的基础之上，强调执行效率和对用户请求命令的及时响应，而且其直接数据源一般是数据仓库；后者建立在各种数据源的基础上，重在发现隐藏在数据深层次的对人们有用的模式，一般并不过多考虑执行效率和响应速度。'
