    \n- Industry / Category / Product\n- Region / Country / City / Office\n- Year\
    \ / Quarter / Month / Week / Day\n\n## Cube Example\n\n![](img/97ec20d772baf04740a42252ab8f47d8_228_0.png)\n\
    \n| Dimension | Member |\n| --- | --- |\n| Product | TV, PC, VCR, sum |\n| Date\
    \ | 1Qtr, 2Qtr, 3Qtr, 4Qtr, sum |\n| Country | U.S.A., Canada, Mexico, sum |\n\
    \n> Total annual sales of TV in U.S.A.\n\nALL, ALL, ALL\n\n## Browsing the Data\
    \ Cube\n\n![](img/97ec20d772baf04740a42252ab8f47d8_229_0.png)\n\n- Visualization\n\
    - OLAP capabilities\n- Interactive manipulation\n\n## Main Contents\n\n1. Overview\n\
    2. Data Warehouse and OLAP Technology\n3. Data Mining Technology\n4. Applications\
