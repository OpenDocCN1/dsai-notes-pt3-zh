    \  - （1）在实际应用中各有侧重。前者是验证型的，后者是挖掘型的；\n  - （2）前者建立在多维视图的基础之上，强调执行效率和对用户请求命令的及时响应，而且其直接数据源一般是数据仓库；后者建立在各种数据源的基础上，重在发现隐藏在数据深层次的对人们有用的模式，一般并不过多考虑执行效率和响应速度。\n"
