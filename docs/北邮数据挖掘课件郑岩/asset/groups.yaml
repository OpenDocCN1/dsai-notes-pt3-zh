    \ itemset）；\n  2. 由频繁项集（frequent itemset）产生强关联规则（strong association rule）。\n\n\
    - **Apriori算法的基本流程**\n\n使用逐层搜索的迭代方法，通过对数据库的多次扫描发现所有的频繁项集。在每一趟扫描中只考虑具有同一长度k(即为项集中所含项目的个数)的所有项集。算法的第一次扫描仅仅计算每个项目的具体支持度，以确定长度为1的频繁项集。在后继的每一次扫描中，首先使用在前一次获得的频繁项集Lk-1和Apriori-gen函数产生的候选项集Ck，接着扫描数据库，计算Ck中候选项的支持度，最后确定候选项集中哪些真正成为频繁项集。重复上述过程直到再也发现不了新的频繁项集为止。\n\
    \n**Apriori算法实例**\n\n**Database D**\n\n| TID | Items |\n|---|---|\n| 100 | 1 3\
    \ 4 |\n| 200 | 2 3 5 |\n| 300 | 1 2 3 5 |\n| 400 | 2 5 |\n\nScan D\n\n**C₁**\n\
    \n| itemset | sup. |\n|---|---:|\n| {1} | 2 |\n| {2} | 3 |\n| {3} | 3 |\n| {4}\
    \ | 1 |\n| {5} | 3 |\n\n**L₁**\n\n| itemset | sup. |\n|---|---:|\n| {1} | 2 |\n\
    | {2} | 3 |\n| {3} | 3 |\n| {5} | 3 |\n\n**C₂**\n\n| itemset |\n|---|\n| {1 2}\
    \ |\n| {1 3} |\n| {1 5} |\n| {2 3} |\n| {2 5} |\n| {3 5} |\n\nScan D\n\n**C₂**\n\
    \n| itemset | sup |\n|---|---:|\n| {1 2} | 1 |\n| {1 3} | 2 |\n| {1 5} | 1 |\n\
    | {2 3} | 2 |\n| {2 5} | 3 |\n| {3 5} | 2 |\n\n**L₂**\n\n| itemset | sup |\n|---|---:|\n\
    | {1 3} | 2 |\n| {2 3} | 2 |\n| {2 5} | 3 |\n| {3 5} | 2 |\n\n**C₃**\n\n| itemset\
    \ |\n|---|\n| {2 3 5} |\n\nScan D\n\n**L₃**\n\n| itemsets | sup |\n|---|---:|\n\
    | {2 3 5} | 2 |\n\n设定最小支持度阈值为2\n\n![](img/97ec20d772baf04740a42252ab8f47d8_332_0.png)\n\
    \n![](img/97ec20d772baf04740a42252ab8f47d8_332_1.png)\n\n| 交易号 | 项集合 |\n| ---\
    \ | --- |\n| T100 | I1, I2, I5 |\n| T200 | I2, I4 |\n| T300 | I2, I3 |\n| T400\
    \ | I1, I2, I4 |\n| T500 | I1, I3 |\n| T600 | I2, I3 |\n| T700 | I1, I3 |\n| T800\
    \ | I1, I2, I3, I5 |\n| T900 | I1, I2, I3 |\n\n设定最小支持度阈值为2\n\n扫描D，对每个候选项计数，生成C₁：\n\
    \n| 项集 | 支持度计数 |\n| --- | --- |\n| {I1} | 6 |\n| {I2} | 7 |\n| {I3} | 6 |\n| {I4}\
    \ | 2 |\n| {I5} | 2 |\n\n比较候选项支持度计数与最小支持度计数，生成L₁：\n\n| 项集 | 支持度计数 |\n|------|------------|\n\
    | {I1} | 6 |\n| {I2} | 7 |\n| {I3} | 6 |\n| {I4} | 2 |\n| {I5} | 2 |\n\n由L₁产生候选集C₂：\n\
    \n| 项集 |\n| --- |\n| {I1, I2} |\n| {I1, I3} |\n| {I1, I4} |\n| {I1, I5} |\n| {I2,\
    \ I3} |\n| {I2, I4} |\n| {I2, I5} |\n| {I3, I4} |\n| {I3, I5} |\n| {I4, I5} |\n\
    \n再次扫描D，对每个候选项计数，产生L₂：\n\n| 项集 | 支持度计数 |\n| --- | --- |\n| {I1, I2} | 4 |\n| {I1,\
    \ I3} | 4 |\n| {I1, I5} | 2 |\n| {I2, I3} | 4 |\n| {I2, I4} | 2 |\n| {I2, I5}\
    \ | 2 |\n\n对L₂进行连接&剪枝，产生C₃，即最终结果。\n\n| 项集 |\n| --- |\n| {I1, I2, I3} |\n| {I1,\
    \ I2, I5} |\n\n### 3.3.2 典型算法\n\n- **Apriori 算法的局限性**\n\n由于依赖于候选项集产生频繁项集的理论（Apriori类算法）所开发的算法具有先天的弱点，使得在基于Apriori算法开发的应用没有实质性突破。\n\
    \nHan等提出的一种新的算法理论，用一种压缩的数据结构(FP-tree)存储关联规则挖掘所需的全部数据信息，通过对源数据的两次扫描，将数据信息存到这种结构里，避开了产生候选项集的步骤，极大地减少了数据交换和频繁匹配的开销。这就是所谓无候选项集产生的算法(Frequent\
    \ Patterns Growth, FP-growth)。\n\n### 3.3.3 算法实现\n\n- **改进的算法——FP-growth**\n\n\
    (1)它构造了一种新颖的、紧凑的数据结构FP-tree。它是一种扩展的前缀树结构，存储了关于频繁模式数量的重要信息。\n\n(2)开发了基于FP-tree的模式片段成长算法，它从长度为1的频繁模式开始，只检查它的条件模式构建它的条件模式树，并且在这个树上递归地进行挖掘。模式的成长通过联合条件模式树新产生的后缀模式实现。\n\
    \n(3)挖掘过程中采用的搜索技术是基于分区的，通过分割再解决的方法，而不是Apriori类算法的自下向上产生频繁模式的集合。\n\n- **FP-growth算法的主要思想**\n\
    \n该算法主要是为了克服类Apriori算法的产生候选项集的缺点，通过采用一种新的数据结构FP-tree来达到目的。\n\n优点：只扫描数据库一次，并且不用产生候选项集，提高了效率。\n\
    \n![](img/97ec20d772baf04740a42252ab8f47d8_341_0.png)\n\n**FP-growth 算法实现**\n\n\
    | 交易编号 | 所有购物项 | （排序后的）频繁项 |\n|---|---|---|\n| 100 | f, a, c, d, g, i, m, p |\
    \ f, c, a, m, p |\n| 200 | a, b, c, f, l, m, o | f, c, a, b, m |\n| 300 | b, f,\
    \ h, j, o | f, b |\n| 400 | b, c, k, s, p | c, b, p |\n| 500 | a, f, c, e, l,\
    \ p, m, n | f, c, a, m, p |\n\n其中，最小支持度阈值为3\n\n**FP-growth算法树的构造**\n\n![](img/97ec20d772baf04740a42252ab8f47d8_343_0.png)\n\
    \n1. `f, c, a, m, p`\n2. `f, c, a, b, m`\n3. `f, b`\n4. `c, b, p`\n5. `f, c, a,\
    \ m, p`\n\n**FP-growth 算法实例**\n\n**头表**\n\n| 项 | 节点的头 |\n|---|---| \n| f |  |\n\
    | c |  |\n| a |  |\n| b |  |\n| m |  |\n| p |  |\n\n节点链性质对任意频繁项 a_i，顺着 a_i 的节点链，从\
    \ a_i 的头开始，可以找到包含 a_i 的所有频繁模式。\n\n生成的FP树\n\n![](img/97ec20d772baf04740a42252ab8f47d8_344_0.png)\n\
    \n**FP-growth 与 Apriori的比较**\n\n![](img/97ec20d772baf04740a42252ab8f47d8_345_0.png)\n\
    \n## 3.4 预测\n\n### 3.4.1 概述\n\n- 一方面，预测与分类相似\n  - 首先，构建模型\n  - 其次，使用模型预测未知值\n\
    - 预测的主要方法是回归\n  - 线性回归和多元回归\n  - 非线性回归\n- 另一方面，预测不同于分类\n  - 分类预测的是类别，而非连续的数值\n\
    \n### 3.4.2 典型算法\n\n### 3.4.3 算法实现\n"
