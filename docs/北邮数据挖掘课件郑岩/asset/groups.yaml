  mdcn: "\n## ETL Process—Data Cleansing\n\nThe data warehouse must store “quality\
    \ data”—data that is consistent, generally accepted or verified as valuable, and\
    \ conforms to metadata definitions. The cleansing function can detect data that\
    \ violates the rules; once detected, such data is either discarded or converted\
    \ into “clean” data that conforms to the rules, and then loaded into the data\
    \ warehouse.\n\nIf data from operational data sources contains unclean components\
    \ and non-standard formats, it will cause many problems and troubles for the establishment\
    \ and maintenance of the data warehouse, especially for the use of Online Analytical\
    \ Processing (OLAP). These must be resolved during the ETL process, typically\
    \ including the following methods:\n\n- a. Design spell checking, classification,\
    \ and cross-checking against standard value tables\n- b. Handle names and addresses\n\
    - c. Build auxiliary tables or online dictionaries for names and addresses, and\
    \ use them for verification and correction\n- d. Data conversion functions and\
    \ subroutine libraries\n\n- “Dirty” Data\n  - Data does not conform to consistency\n\
    \  - Use database design tools to define Checks, Validation Criteria, Integrity\
    \ Constraints\n  - Database designers are not very clear about DBMS\n  - Constraints\
    \ have been removed because they degrade operational performance\n  - Use certain\
    \ special codes, flags, or dummy values\n  - Multiple target fields—a field depends\
    \ on other fields, but inconsistently\n  - ……\n\n- Cleansing “dirty” data includes\
    \ three levels:\n  - Data cleansing at the data source and application layer (difficult\
    \ to implement)\n  - Data cleansing at the integration and transformation layer\n\
    \    - Elementization—parsing into atomic data\n    - Standardizing the representation\
    \ of each element value\n    - Verifying whether the standardized element values\
    \ meet consistency requirements\n  - Data cleansing within the data warehouse\n\
    \nUsually, the above three approaches are used in combination to achieve high\
    \ efficiency.\n\n- Principles to ensure smooth data cleansing\n  - First, analyze\
    \ and systematically design the data cleansing process.\n  - Second, design a\
    \ series of data reference tables and data cleansing program libraries based on\
    \ the main problems and characteristics of the data.\n  - The effective combination\
    \ of the two can address ever-changing and diverse data cleansing problems.\n\n\
    - The data cleansing process\n  - Preprocessing: Pre-diagnose and inspect large\
    \ data load files (especially new files and data sets) rather than loading them\
    \ blind. Sometimes it is necessary to write a small diagnostic program on the\
    \ fly, called a “puppy,” which sniffs this huge object (the unknown file) for\
    \ a hygiene check.\n  - Standardization: Apply standard dictionaries built inside\
    \ the data warehouse to standardize region names, person names, company names,\
    \ product names, and category names.\n  - Duplicate checking: Use various data\
    \ query methods to avoid introducing duplicate data.\n  - Error handling and correction:\
    \ Write erroneous records and data to log files for further processing.\n\n##\
    \ ETL Process—Data Loading\n\n- Use loading tools or data query language (SQL)\n\
    \  - Efficiency issues\n  - Avoid violating constraint relationships; pay attention\
    \ to the loading order\n\nAlthough the transformation work is rather tedious,\
    \ it is the simplest of the three steps.\n\nMany ETL tools provide powerful transformation\
    \ functions. For example, DTS includes: copy field transformation, lowercase string\
    \ transformation, uppercase string transformation, mid-string transformation,\
    \ trim string transformation, date-time string transformation, read file transformation,\
    \ write file transformation, and ActiveX script transformation.\n\nAmong these\
    \ transformation operations, the most commonly used is ActiveX script transformation,\
    \ because it allows you to write VBScript or JScript yourself to convert data\
    \ in the source fields into data in the target fields.\n\nIn fact, if none of\
    \ the aforementioned transformations can meet the requirements, ActiveX script\
    \ transformation is the final choice.\n\n### 2.2.5 ETL Framework\n\n![](img/97ec20d772baf04740a42252ab8f47d8_170_0.png)\n\
    \nDW Populating subsystem reference architecture\nScott Howard (IBM)\n\n### 2.2.6\
    \ Composition of ETL\n\n![](img/97ec20d772baf04740a42252ab8f47d8_171_0.png)\n\n\
    ### 2.2.7 Related Technologies of ETL\n\n- DTS (Microsoft SQL Server)\n- Logically,\
    \ there are three strategies for implementing the ETL process\n  - Remote Extraction\n\
    \  - Push\n  - Pull\n- Parallelism\n- Data Bulk Load\n\n### ETL Technology—DTS\n\
    \nSQL Server’s Data Transformation Services (abbreviated as DTS) provides a set\
    \ of OLE DB-based COM objects. Using VBScript, PerlScript, or Microsoft JScript\
    \ scripting languages to create data transformation programs, it can implement\
    \ data transformation operations between different OLE DB data sources.\n\n###\
    \ 2.2.8 ETL Implementation Methods\n\n- Remote Extraction\n  - The ETL process\
    \ is performed on an independent remote platform.\n  - It is minimally affected\
    \ by the existing systems of data sources or the structure of the target warehouse.\n\
    \  - It hardly affects the CPU and capacity of the source and target systems.\n\
    \  - It may increase costs; it has high requirements on network bandwidth.\n\n\
    - “Push”\n  - The ETL process is carried out in the existing system environment.\n\
    \  - This method is often used when the existing systems have ample capacity and\
    \ will not exceed the CPU processing limit.\n  - This approach is often used when\
    \ the existing systems are homogeneous.\n\n- “Pull” (Collocation)\n  - The ETL\
    \ process is carried out at the “warehouse” end.\n  - It is often adopted when\
    \ the existing systems are heterogeneous.\n  - It can offer certain advantages\
    \ when the “warehouse” platform has the required performance and capacity.\n \
    \ - Since the “warehouse” continues to grow, a long-term strategy may need to\
    \ be developed.\n\n- (1) High-speed loading: in memory; communicate through the\
    \ local file system; limited input/output requests\n- (2) Bandwidth preservation:\
    \ avoids accessing the network, so other network-dependent applications are unaffected.\n\
    \n- Parallelism\n  - Multithreaded server-side software\n  - Multiprocessors (SMP)\n\
    - Data Bulk Load\n  - “Bulk” is the fastest data loading method.\n  - There is\
    \ a bulk loader in the database; ETL also supports this feature.\n  - Avoid using\
    \ “Insert” or “Update” operations and avoid using ODBC.\n\n### 2.2.9 ETL Tools\n\
