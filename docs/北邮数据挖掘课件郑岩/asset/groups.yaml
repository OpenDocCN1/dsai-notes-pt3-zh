    1130.00~1260.00\n\nCamping Chain\n\nGO Outlet\n\nIndependent\n\nMass Marketer\n\
    \nSports Chain\n\n| # | Predictive Name | Value |\n|---|---|---|\n| 1 | Sale_Price\
    \ (-4950.000 ~ 91950.000) |  |\n| 2 | Channel |  |\n| 3 | Cost_of_Goods_Sold (-3900.000\
    \ ~ 85900.000) |  |\n| 4 | Advertising_Cost (0.000 ~ 1715.000) |  |\n| 5 | Average_Sales_Area\
    \ (1130.000 ~ 4230.000) |  |\n\n![](img/97ec20d772baf04740a42252ab8f47d8_361_0.png)\n\
