    \ 分层取样\n- 从起始顺序取样\n- 分类取样\n- ……\n\n- 随机取样\n\n在采用随机取样方式时，数据集中的每一组观测值都有相同的被取样的概率。如按\
    \ 10% 的比例对一个数据集进行随机取样，则每一组观测值都有 10% 的机会被取到。\n\n- 等距取样\n\n如按 5% 的比例对一个有 100 组观测值的数据集进行等距取样，则有：100\
    \ / 5 = 20，等距取样方式是取第 20、40、60、80 和第 100 等五组观测值。\n\n- 分层取样\n\n在这种取样操作时，首先将样本总体分成若干层次（或者说分成若干个子集）。在每个层次中的观测值都具有相同的被选用的概率，但对不同的层次你可设定不同的概率。这样的取样结果可能具有更好的代表性，进而使模型具有更好的拟合精度。\n\
    \n- 从起始顺序取样\n\n从输入数据集的起始处开始取样。取样的数量可以给定一个百分比，或者就直接给定选取观测值的组数。\n\n- 分类取样\n\n在前述几种取样方式中，取样的单位都是一组观测值。分类取样的单位是一类观测值。这里的分类是按观测值的某种属性进行区分，如按客户名称分类、按地址区域分类等。显然在同一类中可能会有多组观测值。分类取样的选取方式就是前面所述的几种方式，只是取样以类为单位。\n\
    \n## SAS/EM—数据筛选工具\n\n通过数据筛选工具可从观测值样本中筛选掉不希望包括进来的观测值。对于分类变量可给定某一类的类值，说明此类观测值是要排除于取样范围之外的。对于区间变量可指定其值大于或小于某值时的这些组观测值是要排除于取样范围之外的。\n\
    \n通过数据筛选使样本数据更适合数据挖掘的目标。\n\n## SAS/EM—数据变量转换工具\n\n利用此工具可将某一个数据进行某种转换操作，然后将转换后的值作为新的变量存放在样本数据中。转换的目的是为了使数据和将来要建立的模型拟合得更好。例如，原来的非线性模型线性化、加强变量的稳定性等。可进行取幂、对数、开方……等转换。当然，也可给定一个公式进行转换。\n\
    \n## SAS/EM—建立数据库\n\n在进行数据挖掘分析模型的操作之前，要建立一个数据挖掘的数据库（DMDB），其中放置此次要进行操作的数据。因为此后可能要进行许多复杂的数学运算，在这里建立一个专门的数据集可提高工作效率。在处理之前，可对所选取的各个变量预先进行诸如最大、最小、平均、标准差……等处理。对一些要按其分类的变量的等级也先放入\
    \ Meta Data 之中，以利后继操作。\n\n总之，在这个数据库中为数据挖掘建立一个良好的工作环境。\n\n## SAS/EM—为建立决策树的数据剖分工具\n\
    \n对数据集进行聚类、建立决策树，是近来数据处理、进行决策支持常用的方法。在 SAS/EM 中亦支持这一功能。在建立决策树的过程中可有多种数据聚类、剖分的方法可供选择。\n\
    \n图形化界面的交互式操作，可分成六个层：\n\n- （1）对数据挖掘数据库中选定数据集的操作\n- （2）对数据集中的变量的处理\n- （3）聚类、剖分时的基本选择项\n\
    - （4）聚类、剖分时的进一步操作选择项\n- （5）模型的初步确定\n- （6）结果的评价\n\n## SAS/EM—决策树浏览工具\n\n最后作出满意的决策树可能是个“枝繁叶茂”的架构。SAS/EM\
    \ 提供了可视化的浏览工具。这一点很重要，一个复杂的决策树若难以观察，则会影响实施决策的效率，甚至是有效性。决策树浏览工具包括：\n\n- 决策树基本内容和统计值的汇总表\n\
    - 决策树的导航浏览\n- 决策树的图形显示\n- 决策树的评价图表\n\n## SAS/EM—数据挖掘评价工具\n\n在 SAS/EM 的评价工具中，提供了一个通用的数据挖掘评价的架构，可以比较不同的模型效果；预报各种不同类型分析工具的结果。\n\
    \n在进行了各种比较和预报的评价之后，将给出一系列标准的图表，供用户进行定量评价。可能用户会有自己独特的评价准则，在 SAS/EM 的评价工具中，还可以进行客户化的工作，对那些标准的评价图表按你的具体要求进行更改。因此，评价工作可能会更有意义。\n\
    \n## 5.3.5 典型工具——Weka\n\n- Random info\n  - Weka...\n    - Waikato Environment\
    \ for Knowledge Analysis\n  - Weka – native New Zealand bird\n  - Developed in\
    \ Java – multi-platform capability\n  - Used for research, education, and applications\n\
    \  - http://www.cs.waikato.ac.nz/ml/weka/\n\n![](img/97ec20d772baf04740a42252ab8f47d8_472_0.png)\n\
    \n## Weka Interfaces\n\n- Command-line\n- Explorer\n  - preprocessing, attribute\
    \ selection, learning, visualization\n- Knowledge Flow\n  - visual design of KDD\
    \ process\n  - capabilities ~ Explorer\n- Experimenter\n  - testing and evaluating\
    \ machine learning algorithms\n"
