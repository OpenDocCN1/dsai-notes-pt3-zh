    # 3.1.2.1 聚类方法分类


    +   - 基于密度的聚类方法


    这类算法的思想是，只要某簇邻近区域的密度超过设定的某一阈值，则扩大簇的范围，继续聚类。这类算法可以获得任意形状的簇。


    典型算法： DBSCAN、 OPTICS和 DENCLUE等'
  - '[PAGE 245]


    # 3.1.2.1 聚类方法分类


    +   - 基于网格的聚类方法


    基于网格的聚类算法首先将问题空间量化为有限数目的单元，形成一个空间网格结构，随后聚类在这些网格之间进行。这类算法速度较快。


    典型算法：STING、WareCluster和CLIQUE等'
  - '[PAGE 246]


    # 3.1.2.1 聚类方法分类


    +   - 基于模型的聚类方法


    基于模型的聚类算法为每个簇假定一个模型，寻找数据对给定模型的最佳拟合。所基于的假设是：数据是根据潜在的概率分布生成的。


    典型算法：COBWEB和神经网络算法等。'
  md: "\n## 2.4.1 OLAP的定义和特点\n\n### OLAP与数据挖掘的比较\n\n（3）数据挖掘与OLAP不同，主要体现在它分析数据的深入和分析过程的自动化，自动化的含义是其分析过程不需要客户的参与，这是它的优点，也正是其不足。因为在实际中，客户也希望参与到挖掘中来，例如只想对数据的某一子集进行挖掘，对不同抽取、集成水平的数据进行挖掘，或者是根据自己的需要动态选择挖掘算法等等。\n\
    \n因此，OLAP与数据挖掘各有所长。\n\n### OLAP与数据挖掘的结合——OLAM\n\n将OLAP与数据挖掘结合起来，发展出一种为数据挖掘服务的具有新型OLAP的数据仓库，将更能适应实际的需求。\n\
    \nOLAM（On-Line Analytical Mining，联机分析挖掘）正是这种结合的产物。\n\n## 2.4.2 OLAP的分类\n\n根据对数据的组织方式的不同，OLAP分为两种：\n\
    \n- 基于多维数据库的OLAP（MD-OLAP）\n- 基于关系数据库的OLAP（ROLAP）\n\n前者响应速度快、执行效率高，但源于结构的局限，灵活性不高。与之相比，后者由于建立在大量现有数据库（数据仓库）的基础上，灵活性、扩展性要高得多，并且支持大数据量和较多维数的能力也要强于前者。因此，虽然在响应速度、执行效率上差一点，仍然得到了广泛应用。现有的OLAP工具大多基于后者。\n\
    \n## 2.4.3 OLAP的典型操作\n\nOLAP对数据仓库中数据的操作是针对多维数据视图（又称为超立方体）进行的。对立方体的典型操作包括：切片、切块以及旋转等。\n\
    \n- 切片：选定多维数组的一个二维子集；\n- 切块：选定多维数组的一个三维子集；\n- 旋转：改变一个立方体显示的维方向，人们可以从不同的角度更加清晰、直观地观察数据。\n\
    \n切片  切块  旋转\n地域  年份  产品  地域\n\n**图2.1 对超立方体的典型操作**\n\n## 多维数据\n\n- Sales volume\
    \ as a function of product, month, and region\n\nDimensions: Product, Location,\
    \ Time\nHierarchical summarization paths\n\n![](img/97ec20d772baf04740a42252ab8f47d8_227_0.png)\n\
    \n- Industry / Category / Product\n- Region / Country / City / Office\n- Year\
    \ / Quarter / Month / Week / Day\n\n## 立方体实例\n\n![](img/97ec20d772baf04740a42252ab8f47d8_228_0.png)\n\
    \n| 维度 | 成员 |\n| --- | --- |\n| Product | TV, PC, VCR, sum |\n| Date | 1Qtr, 2Qtr,\
    \ 3Qtr, 4Qtr, sum |\n| Country | U.S.A., Canada, Mexico, sum |\n\n> Total annual\
    \ sales of TV in U.S.A.\n\nALL, ALL, ALL\n\n## 数据立方体的浏览\n\n![](img/97ec20d772baf04740a42252ab8f47d8_229_0.png)\n\
    \n- Visualization\n- OLAP capabilities\n- Interactive manipulation\n\n## 主要内容\n\
    \n1. 概述\n2. 数据仓库与OLAP技术\n3. 数据挖掘技术\n4. 数据挖掘在电信领域的应用\n5. 数据挖掘工具\n\n## 主要内容\n\n\
    1. 概述\n2. 数据仓库与OLAP技术\n3. 数据挖掘技术\n4. 数据挖掘在电信领域的应用\n5. 数据挖掘工具\n6. 数据挖掘实例\n\n##\
    \ 3 数据挖掘技术\n\n- 3.1 聚类（Clustering）\n- 3.2 分类（Classification）\n- 3.3 关联（Association）\n\
    - 3.4 预测（Prediction）\n- 3.5 数据挖掘的可视化\n- 3.6 数据挖掘的实施\n\n### 3.1 聚类\n\n#### 3.1.1\
    \ 定义\n\n#### 3.1.2 聚类算法\n\n- 3.1.2.1 聚类方法分类\n- 3.1.2.2 K均值算法\n- 3.1.2.3 K中心点算法\n\
    - 3.1.2.4 C均值算法\n\n### 3.1.1 定义\n\n**聚类分析**\n\n从纷繁复杂的数据中，根据最大化类内相似性、最小化类间相似性的原则进行聚类或分组，即使得在一个簇内的对象具有高相似性，而不同簇间的对象具有低相似性的过程。\n\
    \n### 3.1.2.1 聚类方法分类\n\n- 基于划分的聚类方法\n- 基于层次的聚类方法\n- 基于密度的聚类方法\n- 基于网格的聚类方法\n-\
    \ 基于模型的聚类方法\n\n![](img/97ec20d772baf04740a42252ab8f47d8_235_0.png)\n\n#### 基于划分的聚类方法\n\
    \n给定一个由 n 个对象组成的数据集合，对此数据集合构建 k 个划分（k≤n），每个划分代表一个簇，即将数据集合分成多个簇的算法。\n\n要求：\n\n\
    1. 每个簇至少有一个对象；\n2. 每个对象必须且仅属于一个簇。\n\n典型算法：k-均值和k-中心点算法等。\n\n#### 基于层次的聚类方法\n\n\
    对给定的数据集进行层层分解的聚类过程，具体地主要包括凝聚法和分裂法。\n\n凝聚法指起初每个对象被认为是一个簇，然后不断合并相似的簇，直到达到一个令人满意的终止条件；分裂法恰恰相反，先把所有的数据归于一个簇，然后不断分裂彼此相似度最小的数据集，使簇被分裂成更小的簇，直到达到一个令人满意的终止条件。\n\
    \n根据簇间距离度量方法的不同，层次法可分为不同的种类。常用的距离度量方法包括：最小距离、最大距离、平均值距离和平均距离等。\n\n典型算法：CURE、Chameleon和BIRCH等。\n\
    \n#### 基于层次的聚类方法\n\n这类方法不需要预先给定参数（聚类数），但需要终止条件。\n\n![](img/97ec20d772baf04740a42252ab8f47d8_238_0.png)\n\
    \n#### CURE算法描述\n\n- 随机选取 s 个样本；\n- 将所有样本划分为 p 个簇，每个簇的样本数是 s/p；\n- 将每个簇划分为 q 个子集，每个子集样本数是\
    \ s/pq；\n- 删除孤立点数据；\n- 随机取；\n- 如果一个簇变化缓慢，则删除该簇；\n- 合并其中的部分子集。\n\n#### CURE算法—Data\
    \ Partitioning and Clustering\n\n- s = 50\n- p = 2\n- s/p = 25\n- s/pq = 5\n\n\
    #### CURE算法 — Shrinking Representative Points\n\n- Shrink the multiple representative\
    \ points towards the gravity center by a fraction of α.\n- Multiple representatives\
    \ capture the shape of the cluster.\n\n#### CHAMELEON算法\n\n- CHAMELEON算法是由 G.\
    \ Karypis, E.H. Han 和 V. Kumar 在1999年提出的一种动态层次聚类方法。\n- 基于动态模型计算相似性：只有当两个类之间的相似性高于类内对象的相似性时合并两个类。\n\
    - 本质上，是一个两阶段算法：\n  1. 首先，使用图分割算法将数据集划分为多个子集；\n  2. 然后，使用层次聚类中的凝聚方法将这些子集进行反复的合并，直至获得最终的聚类结果。\n\
    \n#### CHAMELEON算法\n\n- Construct Sparse Graph\n- Data Set\n- Partition the Graph\n\
    - Merge Partition\n- Final Clusters\n\n#### 基于密度的聚类方法\n\n这类算法的思想是，只要某簇邻近区域的密度超过设定的某一阈值，则扩大簇的范围，继续聚类。这类算法可以获得任意形状的簇。\n\
    \n典型算法：DBSCAN、OPTICS和DENCLUE等。\n\n#### 基于网格的聚类方法\n\n基于网格的聚类算法首先将问题空间量化为有限数目的单元，形成一个空间网格结构，随后聚类在这些网格之间进行。这类算法速度较快。\n\
    \n典型算法：STING、WaveCluster和CLIQUE等。\n\n#### 基于模型的聚类方法\n\n基于模型的聚类算法为每个簇假定一个模型，寻找数据对给定模型的最佳拟合。所基于的假设是：数据是根据潜在的概率分布生成的。\n\
    \n典型算法：COBWEB和神经网络算法等。\n"
  mdcn: "\n## 2.4.1 Definition and Characteristics of OLAP\n\n### Comparison of OLAP\
    \ and Data Mining\n\n(3) Data mining differs from OLAP, mainly in the depth of\
    \ data analysis and the automation of the analysis process. Automation means that\
    \ the analysis process does not require customer participation. This is its advantage,\
    \ and it is also its shortcoming. In practice, customers also want to participate\
    \ in the mining process, for example, by mining only a certain subset of data,\
    \ mining data at different extraction and integration levels, or dynamically selecting\
    \ mining algorithms according to their own needs.\n\nTherefore, OLAP and data\
    \ mining each have their own strengths.\n\n### Combination of OLAP and Data Mining—OLAM\n\
    \nCombining OLAP with data mining to develop a data warehouse with new OLAP capabilities\
    \ that serves data mining will better meet practical needs.\n\nOLAM (On-Line Analytical\
    \ Mining) is exactly the product of this combination.\n\n## 2.4.2 Classification\
    \ of OLAP\n\nDepending on how data are organized, OLAP is divided into two types:\n\
    \n- OLAP based on multidimensional databases (MD-OLAP)\n- OLAP based on relational\
    \ databases (ROLAP)\n\nThe former has fast response speed and high execution efficiency,\
    \ but due to structural limitations, its flexibility is not high. In contrast,\
    \ the latter, because it is built on a large number of existing databases (data\
    \ warehouses), is much more flexible and scalable, and is also stronger than the\
    \ former in supporting large data volumes and a larger number of dimensions. Therefore,\
    \ although it is somewhat inferior in response speed and execution efficiency,\
    \ it has still been widely used. Most existing OLAP tools are based on the latter.\n\
    \n## 2.4.3 Typical Operations of OLAP\n\nOLAP operations on data in a data warehouse\
    \ are performed on multidimensional data views (also called hypercubes). Typical\
    \ operations on a cube include slicing, dicing, and rotation.\n\n- Slicing: selecting\
    \ a two-dimensional subset of a multidimensional array;\n- Dicing: selecting a\
    \ three-dimensional subset of a multidimensional array;\n- Rotation: changing\
    \ the dimensional orientation in which a cube is displayed, allowing people to\
