    \n## 2 数据仓库与OLAP技术\n- 2.1 数据仓库\n- 2.2 ETL过程\n- 2.3 电信领域数据仓库的设计与实现\n- 2.4 数据仓库的应用—OLAP\n\
    \n### 2.1 数据仓库\n#### 2.1.1 数据仓库的定义\n#### 2.1.2 数据仓库的组成\n#### 2.1.3 数据仓库的数据模型\n\
    #### 2.1.4 数据仓库与数据库的关系\n\n数据仓库是在企业管理和决策中面向主题的、集成的、与时间相关的、不可修改的数据集合。\n\n此定义由最为权威的、被称为“数据仓库之父”的William\
    \ H. Inmon 先生给出。\n\n- **面向主题的**\n  是相对于传统数据库的面向应用而言的。所谓面向应用，指的是系统实现过程中主要围绕着一些应用或功能。而面向主题则考虑一个个的问题域，对问题域涉及到的数据和分析数据所采用的功能给予同样的重视。\n\
    \n- **典型的主题领域**\n  顾客、产品、事务或活动、保险单、索赔和账目。\n\n- 集成的\n\n数据仓库中的数据来自各个不同的数据源（操作数据库）。由于历史的原因，各操作数据库的组织结构往往是不同的，在这些异构数据输入到数据仓库之前，必须经历一个集成过程。\n\
    \n- 集成的\n\n最重要的特点。应用问题的设计人员制定出不同的设计决策，且表示方法不同。例如编码、命名习惯、实际属性和属性度量等方面不一致。\n\n数据进入数据仓库时，需要消除各种不一致性。例如，数据仓库中顾客“性别”的编码，可采用“男/女”或“m/f”，采用哪种方式并不重要，重要的是在数据仓库中应该统一编码。如果应用数据编码为“X/Y”，则进入数据仓库时需要进行转换。\n\
    \n此外，对所有应用所涉及的问题都要考虑一致性。例如命名习惯、键码结构、属性度量以及数据特点等。\n\n- 与时间相关的\n\n数据仓库以维的形式对数据进行组织，时间维是数据仓库中很重要的一个维度。并且数据仓库中的数据时间跨度大，从几年甚至到几十年，称为历史数据。\n"
  mdcn: "\n## 1.7 Applications of Data Mining\n\nThe emergence of data mining technology\
    \ itself has a strong application-driven background; it has been application-oriented\
    \ from the very beginning. Data mining technology has broad applications in market\
    \ analysis, business management, decision support, and other fields, and is one\
    \ of the important technical means for implementing CRM and BI. Specifically,\
    \ business problems involving data mining include market analysis behaviors such\
    \ as database marketing, customer segmentation & classification, profile analysis,\
    \ cross-selling, as well as churn analysis, credit scoring, and fraud detection.\n\
    \nAt present, data mining has successful application cases in commercial fields\
    \ such as banking, telecommunications, insurance, transportation, and retail (e.g.,\
    \ supermarkets). Moreover, with intensifying competition, the demand for data\
    \ mining will become increasingly urgent and strong.\n\nA recent Gartner Group\
    \ high-level technology survey ranked data mining and artificial intelligence\
    \ as the first among the \"five key technologies that will have a profound impact\
    \ on industry in the next three to five years,\" and also listed parallel processing\
    \ and data mining as the top two of the ten emerging technologies that will be\
    \ investment focuses in the next five years. According to Gartner's recent HPC\
    \ research, \"with the rapid development of data capture, transmission, and storage\
    \ technologies, large-system users will increasingly need to adopt new technologies\
    \ to mine value beyond the market, and use more extensive parallel processing\
    \ systems to create new business growth points.\"\n\n## 1.8 Future Trends\n\n\
    - Hot application areas in the future\n  - Web site data mining\n  - Bioinformatics\
    \ or gene data mining\n  - Textual mining\n  - Multimedia mining\n\nCurrently,\
    \ various e-commerce websites on the Internet are emerging rapidly, and competition\
    \ in e-commerce business is more intense than in traditional business. A customer\
    \ can switch from one e-commerce website to a competitor with just a few mouse\
    \ clicks, making customer retention in the e-commerce environment more difficult\
    \ than in traditional business. To survive and win in competition, you must understand\
    \ customers better than your competitors. E-commerce websites may generate millions\
    \ of online transactions every day, producing a large number of log files and\
    \ registration forms. How to analyze and mine these data, promptly understand\
    \ customers' preferences, purchasing patterns, and even momentary impulses, and\
    \ design personalized websites that meet the needs of different customer groups\
    \ to increase competitiveness has become almost imperative.\n\nIn terms of analysis\
    \ and modeling techniques and algorithms, Web site data mining is not particularly\
    \ different from traditional data mining; many methods and analytical ideas can\
    \ be applied. The difference is that a large part of the data format on websites\
    \ comes from clickstreams, which is distinct from traditional database formats.\
    \ Therefore, the main task in data mining for e-commerce websites is data preparation.\
    \ At present, many vendors are committed to developing software specifically for\
    \ Web mining.\n\n- Bioinformatics or gene mining\n\nBioinformatics or gene data\
    \ mining belongs to a completely different field. It is hard to say how much commercial\
    \ value it has, but it is of great benefit to humanity. For example, gene combinations\
    \ are ever-changing. What is the difference between the genes of people with a\
    \ certain disease and those of normal people? Can we identify the differences\
    \ and then modify them to turn them into normal genes? All this requires the support\
    \ of data mining technology.\n\nCompared with ordinary data mining, bioinformatics\
    \ or gene data mining is far more complex in terms of data complexity, data volume,\
    \ and the algorithms used for analysis and model building. In terms of analysis\
    \ algorithms, newer and more efficient algorithms are particularly needed. Many\
    \ vendors are currently researching this area, but both the technology and software\
    \ are still far from mature.\n\n- Textual mining\n\nTextual mining is another\
    \ topic of concern. For example, in a customer service center, converting conversations\
    \ with customers into textual data and then mining these data can reveal customers'\
    \ satisfaction with services, their needs, and relationships among customers.\n\
    \nTextual data mining differs greatly from data mining in both data structure\
    \ and analysis processing methods. Textual mining is not an easy task, especially\
    \ in terms of analysis methods, where many topics still need to be studied. Currently,\
    \ there are some similar software products on the market, but most methods simply\
    \ move text around or calculate the frequency of certain words, without truly\
    \ realizing semantic analysis.\n\n- Multimedia Mining\n\nDescription-based retrieval\
    \ systems\n- Create indexes based on image descriptions and implement object retrieval,\
    \ such as keywords, titles, sizes, and creation times.\n- Manual implementation\
    \ is extremely time-consuming and labor-intensive.\n- Automatic implementation\
    \ often yields unsatisfactory results.\n\nContent-based retrieval systems\n- Support\
    \ retrieval based on image content, such as color, texture, shape, objects, and\
    \ wavelet transforms.\n\n## C-BIRD: Content-Based Image Retrieval from Digital\
    \ Libraries\n\n### Search\n- by image colors\n- by color percentage\n- by color\
    \ layout\n- by texture density\n- by texture layout\n- by object model\n- by illumination\
    \ invariance\n- by keywords\n\n![](img/97ec20d772baf04740a42252ab8f47d8_83_0.png)\n\
    \n- Future research hotspots\n  - Formal description of discovered languages\n\
    \  - Seeking visualization methods in the data mining process\n  - Research on\
    \ data mining technology in a network environment\n  - Strengthening mining of\
    \ various unstructured data\n  - Knowledge maintenance and update\n\n- **Formal\
    \ description of discovered languages**\n  That is, to study data mining languages\
    \ specifically for knowledge discovery, seeking a data mining language similar\
    \ to SQL in databases, so as to formalize and standardize the mining process.\n\
    - **Seeking visualization methods in the data mining process**\n  To enable users\
    \ to understand the knowledge discovery process and facilitate human-computer\
    \ interaction during knowledge discovery.\n- **Research on data mining technology\
    \ in a network environment**\n  Especially to establish a DMKD server on the Internet\
    \ and cooperate with database servers to implement Web mining.\n\n- Strengthening\
    \ mining of various unstructured data\n  Such as mining textual data, graphical\
    \ data, video image data, sound data, and even comprehensive multimedia data.\n\
    - Knowledge maintenance and update\n  The result of data mining—knowledge—is time-sensitive,\
    \ so it is necessary to study knowledge maintenance and update technologies, such\
    \ as incremental knowledge updating and model evolution.\n\n## Main Content\n\
    - 1. Overview\n- 2. Data Warehouse and OLAP Technology\n- 3. Data Mining Technology\n\
    - 4. Application of Data Mining in Telecommunications\n- 5. Data Mining Tools\n\
    - 6. Data Mining Examples\n\n## 2 Data Warehouse and OLAP Technology\n- 2.1 Data\
    \ Warehouse\n- 2.2 ETL Process\n- 2.3 Design and Implementation of Data Warehouse\
    \ in the Telecommunications Domain\n- 2.4 Application of Data Warehouse—OLAP\n\
    \n### 2.1 Data Warehouse\n#### 2.1.1 Definition of Data Warehouse\n#### 2.1.2\
    \ Components of Data Warehouse\n#### 2.1.3 Data Model of Data Warehouse\n####\
    \ 2.1.4 Relationship between Data Warehouse and Database\n\nA data warehouse is\
    \ a subject-oriented, integrated, time-variant, and non-volatile collection of\
    \ data in support of enterprise management and decision-making.\n\nThis definition\
    \ was given by Mr. William H. Inmon, the most authoritative figure known as the\
    \ \"father of data warehouse.\"\n\n- **Subject-oriented**\n  This is relative\
    \ to the application-oriented nature of traditional databases. Application-oriented\
    \ means that during system implementation, the focus is mainly on certain applications\
    \ or functions. Subject-oriented, on the other hand, considers specific problem\
    \ domains and gives equal importance to the data involved in the problem domain\
    \ and the functions used to analyze the data.\n\n- **Typical subject areas**\n\
    \  Customers, products, transactions or activities, insurance policies, claims,\
    \ and accounts.\n\n- Integrated\n\nThe data in the data warehouse comes from various\
    \ different data sources (operational databases). Due to historical reasons, the\
    \ organizational structures of operational databases are often different. Before\
    \ these heterogeneous data enter the data warehouse, an integration process must\
    \ be undergone.\n\n- Integrated\n\nThis is the most important characteristic.\
    \ Application problem designers make different design decisions, and representation\
    \ methods differ. For example, inconsistencies exist in coding, naming conventions,\
    \ actual attributes, and attribute measurements.\n\nWhen data enters the data\
    \ warehouse, various inconsistencies need to be eliminated. For example, the coding\
    \ of customer \"gender\" in the data warehouse can adopt \"male/female\" or \"\
    m/f\"; which method is used is not important, but what is important is that the\
    \ coding should be unified in the data warehouse. If the application data is coded\
    \ as \"X/Y\", then conversion is needed when entering the data warehouse.\n\n\
    In addition, consistency must be considered for all issues involved in applications,\
    \ such as naming conventions, key structure, attribute measurements, and data\
    \ characteristics.\n\n- Time-variant\n\nThe data warehouse organizes data in the\
    \ form of dimensions, and the time dimension is a very important dimension in\
    \ the data warehouse. Moreover, the data in the data warehouse spans a large time\
    \ range, from several years to even decades, and is called historical data.\n"
