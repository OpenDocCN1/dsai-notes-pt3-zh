  - '[PAGE 107]


    # 查询管理器的具体功能


    +   - 将查询引导至正确的表

    +   - 实现客户查询的调度


    查询管理器将把查询统计分析的结果存入查询概述文件，供仓库管理器使用，以决定为哪些项目执行数据集的工作。'
  - '[PAGE 108]


    # 2.1.3 数据仓库的数据模型


    数据模型是对现实世界的一种抽象，根据抽象程度的不同，可形成不同抽象层次上的数据模型。与数据库的数据模型相似，数据仓库的数据模型也分为三个层次：


    +   > 概念模型

    +   > 逻辑模型

    +   > 物理模型'
  - '[PAGE 109]


    # 2.1.3 数据仓库的数据模型


    +   - 概念模型


    客观世界到计算机系统的一个中间层次，它最常用的表示方法是E-R法（实体-关系）。


    目前，数据仓库一般是建立在关系型数据库的基础之上，所以其概念模型与一般关系型数据库采用的概念模型相一致。'
  - "[PAGE 110]\n\n# 2.1.3 数据仓库的数据模型\n\n+   - 逻辑模型\n+   \n+   指数据的逻辑结构，如多维模型、关系模型、层次模型等。数据仓库的逻辑模型描述了数据仓库的主题的逻辑实现，即每个主题对应的模式定义。"
  - '[PAGE 111]


    # 2.1.3 数据仓库的数据模型


    +   - 物理模型


    是逻辑模型的具体实现，如物理存取方式、数据存储结构、数据存放位置以及存储分配等。在设计数据仓库的物理模型时，需要考虑一些提高性能的技术，如表分区，建立索引等。'
  - '[PAGE 112]


    # 2.1.3 数据仓库的数据模型


    目前，对数据仓库模型的讨论大多集中在逻辑模型，其中最常用的是多维模型。


    # ✓ 维


    人们观察数据的特定角度。例如，企业常常关心不同销售数据随时间的变化情况，所以时间就是一个维；


    # ✓ 维的层次


    人们观察数据的某个特定角度还可以存在细节程度不同的多个描述，这就是维的层次。一个维往往有多个层次，比如描述时间维时，可以从年份、季度、月份、天等不同层次来描述，那么年份、季度、月份和天就是时间维的层次；'
  - '[PAGE 113]


    # 2.1.3 数据仓库的数据模型


    ✓ 维成员

    维的一个取值称为该维的一个成员。如果一个维是多层次的，那么该维的成员就是在不同层次取值的组合。例如时间维分为年、月和天三个层次则分别在其上各取一个值组合起来即得到日期维的一个成员，即“某年某月某日”；


    ✓ 度量

    描述了要分析的数值，例如话费、用户数量等；'
  - '[PAGE 114]


    # 2.1.3 数据仓库的数据模型


    # ✓ 粒度


    粒度是指数据仓库的数据单位中保存数据的细化或综合程度的级别。细化程度越高，粒度级就越小；相反，细化程度越低，粒度级就越大。


    粒度深深地影响存放在数据仓库中数据量的大小，同时影响数据仓库所能回答的查询类型。


    在数据仓库中的数据粒度与查询的详细程度之间要做出权衡。'
  - '[PAGE 115]


    # 2.1.3 数据仓库的数据模型


    当提高粒度级别时，数据所能回答查询的能力会随之降低。换言之，在一个很低的粒度级别上，几乎可以回答任何问题，但在高粒度级别上，数据所能处理的问题的数量是有限的。'
  - '[PAGE 116]


    例如：一个顾客一个月的每个电话的细节 每月40000个字节 每月200个记录


    例如：一个顾客一个月的电话综合 200个字节 每月1个记录


    +   活动记录

    +   日期

    +   时间

    +   被叫

    +   是否长途

    +   通话时间

    +   通话费用

    +   ……


    +   活动记录

    +   月

    +   累计时长

    +   累计次数

    +   累计费用

    +   ……


    左图是一个低粒度级，每个活动（在这里是一次电话）被详细记录下来，数据的格式如图所示。到月底每个顾客平均有200条记录（全月中每个电话都记录一次），因而总共需要40000个字节；


    右图的边是一个高粒度级。数据代表一位顾客一个月的综合信息，每位顾客一个月只有一个记录，这样的记录大约只需200个字节。'
  - '[PAGE 117]


    问题： “上星期某某顾客是否给某某人打了电话？”


    在低粒度级别上，完全可以回答这一问题，虽然这种回答将花费大量资源去查询大量的记录，但是问题结果是可以确定的。


    在高粒度级别上，则无法明确地回答这个问题。假如在数据仓库中存放的只是所打电话的总数，那么就无法确定其中是否有一个电话是打给某人的。'
  - '[PAGE 118]


    # 2.1.3 数据仓库的数据模型


    +   - 数据仓库的数据模型

    +     星型结构

    +     雪花型结构

    +     星型雪花型结构

    +   - 数据仓库的数据＝事实数据＋维度数据

    +     不论是星型、雪花型或者是星型雪花型结构都是以事实表为中心。不同点只是在外围维度表相互之间的关系不同而已。'
  md: "\n## 2.1.1 数据仓库的定义\n\n数据仓库中数据随时间变化的特性表现在：\n\n- 数据仓库中的数据时间期限要远远长于操作型数据库中的数据时间期限。操作型数据库的时间期限一般是60～90天，而数据仓库中数据的时间期限通常是5～10年。\n\
    - 操作型数据库含有“当前值”的数据，这些数据的准确性在访问时是有效的，同样当前值的数据能被更新。而数据仓库中的数据仅仅是一系列某一时刻生成的复杂的快照。\n\
    - 操作型数据的键码结构可能包含也可能不包含时间元素，如年、月、日等。而数据仓库的键码结构总是包含某一时间元素。\n\n## 2.1.1 数据仓库的定义\n\
    \n- 不可修改的\n\n面向应用的事务数据库需要对数据进行频繁的插入、更新操作，而对于数据仓库中数据的操作仅限于数据的初始导入和记录查询。\n\n操作型数据是一次访问和处理一个记录，可以对操作型数据库中的数据进行更新。但数据仓库中的数据则不同，通常是一起载入与访问的，在数据仓库环境中并不进行一般意义上的数据更新。\n\
    \n数据仓库是决策支持系统（Decision Support System，DSS，DSS）的基础。\n\n在数据仓库中只有单一集成的数据源，并且数据是可访问的。所以与传统数据库相比，在数据仓库环境中DSS分析员的工作将较为容易。\n\
    \n## 2.1.2 数据仓库的组成\n\n- 一个数据仓库的大小一般都是在100GB以上\n- 通常，数据仓库系统应该包含下列程序：\n  1. 抽取数据与加载数据\n\
    \  2. 整理并转换数据（采用一种数据仓库适用的数据格式）\n  3. 备份与备存数据\n  4. 管理所有查询（即将查询导向适当的数据源）\n\n![](img/97ec20d772baf04740a42252ab8f47d8_99_0.png)\n\
    \n## 数据仓库的管理器\n\n- **加载管理器**\n  执行程序：抽取与加载程序\n  功能：抽取并加载数据、在加载数据之前与进行中执行简单的转换\n\
    \n- **仓库管理器**\n  执行程序：数据整理与转换程序、备份与备存程序\n  功能：转换并管理数据仓库数据、备份与备存数据\n\n- **查询管理器**\n\
    \  执行程序：查询管理程序\n  功能：引导并管理数据仓库的查询\n\n## 加载管理器\n\n- 功能\n  支持数据抽取与加载\n- 实现途径\n \
    \ （1）外购的软件工具\n  （2）针对特殊要求而编写程序、存储过程以及脚本文件\n\n## 加载管理器\n\n### 建议\n\n用户尽量选用合适的软件工具来协助进行整个加载管理的工作；\n\
    但是，因为源数据的特性存在很大的差异，数据仓库中加载管理器的功能无法一致，所以不可能完全使用外购的软件工具，而必须自行设计针对特殊需要而编写的程序、存储过程或是脚本文件。\n\
    \n## 加载管理器的具体功能\n\n- 抽取来自源系统的数据\n- 将抽取的数据快速加载临时保存介质\n- 执行简单的数据转换任务\n- 将转换后数据加载至与数据仓库类似的数据结构之中\n\
    \n## 仓库管理器\n\n- **功能**\n  执行管理一个数据仓库所必需的必要程序\n- **实现途径**\n  （1）外购的系统管理工具\n  （2）针对特殊需要而编写的程序以及脚本文件\n\
    - **复杂度**\n  因自动化的程度而异\n\n## 仓库管理器的具体功能\n\n- 检验各字段相互之间的关系与一致性\n- 将临时保在存储介质中的数据转换与合并，然后加载至数据仓库\n\
    - 对数据仓库数据添加索引、视图、数据分区\n- 根据需要进行数据的标准化\n- 根据需要生成新的集合信息\n- 更新已有的集合信息\n- 备份数据仓库（完整或是递增式）\n\
    - 备存数据仓库中过时的数据（另存至其它存储介质）\n\n## 查询管理器\n\n- 功能\n  执行管理数据仓库系统中所有查询工作的相关处理程序。\n-\
    \ 实现途径\n  （1）外购调度软件\n  （2）使用用户存取工具\n  （3）数据仓库系统所提供的系统监控工具\n  （4）数据库管理系统所提供的管理工具\n\
    \  （5）针对特殊需要而编写程序以及脚本文件\n- 复杂度\n  视数据仓库系统而定。\n\n## 查询管理器的具体功能\n\n- 将查询引导至正确的表\n\
    - 实现客户查询的调度\n\n查询管理器将把查询统计分析的结果存入查询概述文件，供仓库管理器使用，以决定为哪些项目执行数据集的工作。\n\n## 2.1.3\
    \ 数据仓库的数据模型\n\n数据模型是对现实世界的一种抽象，根据抽象程度的不同，可形成不同抽象层次上的数据模型。与数据库的数据模型相似，数据仓库的数据模型也分为三个层次：\n\
    \n- 概念模型\n- 逻辑模型\n- 物理模型\n\n## 2.1.3 数据仓库的数据模型\n\n- 概念模型\n\n客观世界到计算机系统的一个中间层次，它最常用的表示方法是E-R法（实体-关系）。\n\
    \n目前，数据仓库一般是建立在关系型数据库的基础之上，所以其概念模型与一般关系型数据库采用的概念模型相一致。\n\n- 逻辑模型\n\n指数据的逻辑结构，如多维模型、关系模型、层次模型等。数据仓库的逻辑模型描述了数据仓库的主题的逻辑实现，即每个主题对应的模式定义。\n\
    \n- 物理模型\n\n是逻辑模型的具体实现，如物理存取方式、数据存储结构、数据存放位置以及存储分配等。在设计数据仓库的物理模型时，需要考虑一些提高性能的技术，如表分区，建立索引等。\n\
    \n目前，对数据仓库模型的讨论大多集中在逻辑模型，其中最常用的是多维模型。\n\n### ✓ 维\n\n人们观察数据的特定角度。例如，企业常常关心不同销售数据随时间的变化情况，所以时间就是一个维；\n\
    \n### ✓ 维的层次\n\n人们观察数据的某个特定角度还可以存在细节程度不同的多个描述，这就是维的层次。一个维往往有多个层次，比如描述时间维时，可以从年份、季度、月份、天等不同层次来描述，那么年份、季度、月份和天就是时间维的层次；\n\
    \n### ✓ 维成员\n\n维的一个取值称为该维的一个成员。如果一个维是多层次的，那么该维的成员就是在不同层次取值的组合。例如时间维分为年、月和天三个层次则分别在其上各取一个值组合起来即得到日期维的一个成员，即“某年某月某日”；\n\
    \n### ✓ 度量\n\n描述了要分析的数值，例如话费、用户数量等；\n\n### ✓ 粒度\n\n粒度是指数据仓库的数据单位中保存数据的细化或综合程度的级别。细化程度越高，粒度级就越小；相反，细化程度越低，粒度级就越大。\n\
    \n粒度深深地影响存放在数据仓库中数据量的大小，同时影响数据仓库所能回答的查询类型。\n\n在数据仓库中的数据粒度与查询的详细程度之间要做出权衡。\n\n\
    当提高粒度级别时，数据所能回答查询的能力会随之降低。换言之，在一个很低的粒度级别上，几乎可以回答任何问题，但在高粒度级别上，数据所能处理的问题的数量是有限的。\n\
    \n例如：一个顾客一个月的每个电话的细节 每月40000个字节 每月200个记录\n\n例如：一个顾客一个月的电话综合 200个字节 每月1个记录\n\n\
    - 活动记录\n- 日期\n- 时间\n- 被叫\n- 是否长途\n- 通话时间\n- 通话费用\n- ……\n\n- 活动记录\n- 月\n- 累计时长\n\
    - 累计次数\n- 累计费用\n- ……\n\n左图是一个低粒度级，每个活动（在这里是一次电话）被详细记录下来，数据的格式如图所示。到月底每个顾客平均有200条记录（全月中每个电话都记录一次），因而总共需要40000个字节；\n\
    \n右图的边是一个高粒度级。数据代表一位顾客一个月的综合信息，每位顾客一个月只有一个记录，这样的记录大约只需200个字节。\n\n问题： “上星期某某顾客是否给某某人打了电话？”\n\
    \n在低粒度级别上，完全可以回答这一问题，虽然这种回答将花费大量资源去查询大量的记录，但是问题结果是可以确定的。\n\n在高粒度级别上，则无法明确地回答这个问题。假如在数据仓库中存放的只是所打电话的总数，那么就无法确定其中是否有一个电话是打给某人的。\n\
    \n## 2.1.3 数据仓库的数据模型\n\n- 数据仓库的数据模型\n  星型结构\n  雪花型结构\n  星型雪花型结构\n- 数据仓库的数据＝事实数据＋维度数据\n\
    \  不论是星型、雪花型或者是星型雪花型结构都是以事实表为中心。不同点只是在外围维度表相互之间的关系不同而已。\n"
