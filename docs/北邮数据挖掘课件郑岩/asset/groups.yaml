    \ 4 数据挖掘在电信领域的应用\n\n## 4.1 CRM与 ERP\n\n## 4.2 数据挖掘在电信领域的应用\n\n## 4.1 CRM与ERP\n\
    \n- CRM\n\nCRM（Customer Relationship Management，客户关系管理），作为一种旨在改善企业与客户之间关系的新型管理机制。\n\
    \nCRM系统以数据仓库技术为基础，数据挖掘技术为核心。\n\n## 4.1 CRM与ERP\n\n- ERP\n\nERP（Enterprise Resource\
    \ Planning，即企业资源规划），是前几年国内外兴起的一种企业运作管理软件，它的侧重点是对企业内部的业务流程以及企业的资源进行管理。解决的是企业内部各环节的协调问题，如财务、生产、采购和仓储等部门间的协调关系。\n\
    \n## 4.1 CRM与ERP\n\n- ERP与CRM两者的关系\n\n同样作为现代企业的管理软件，ERP与CRM在企业运营过程中，处于不同的位置，担任不同的角色。一个面向后台，一个面向前台。一个保证企业生产出更高质量的产品，而另一个帮助企业理顺与客户的关系，向客户提供最好的服务。这是企业在激烈的市场竞争保证胜利的不可或缺的两个环节。\n\
