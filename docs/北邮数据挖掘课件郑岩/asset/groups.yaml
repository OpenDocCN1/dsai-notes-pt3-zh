  - "[PAGE 290]\n\n# 3.2.2.2 CLS算法\n\n+   - **CLS算法的局限性**\n+   \n+     分类属性的选择决定了算法的效率与所生成的决策树的繁简程度、预测效果。选择属性是决策树归纳算法的关键。\n\
    +   \n+     CLS算法可以产生所有可能的决策树，正确分类训练样本，并能选择最简单的决策树。但是属性选择的不确定性，在实际应用中往往受问题大小的限制。"
  - '[PAGE 291]


    # 3.2.2.3 ID3算法


    Quinlan提出的ID3算法，对CLS算法做出了改进。它的基本算法仍然来自于CLS，但使用熵来选择属性，效果非常理想。


    +   - 举例


    根据天气状况决定某天早上是否合适打高尔夫球，合适的属于正例记为P，不合适的属于反例记为N。天气由四个属性描述，即


    outlook(天气形势)取值分别为sunny, overcast和rain;


    temperature(温度)取值分别为cool, mild和hot;


    humidity(湿度)取值为normal和high;


    windy(风)取值为false和true'
  - '[PAGE 292]


    |  | outlook | temperature | humidity | windy | class |

    |---|---|---|---|---|---|

    | 1 | sunny | hot | high | false | N |

    | 2 | sunny | hot | high | true | N |

    | 3 | overcast | hot | high | false | P |

    | 4 | rain | hot | high | false | P |

    | 5 | rain | cool | normal | false | P |

    | 6 | rain | cool | normal | true | N |

    | 7 | overcast | cool | normal | true | P |

    | 8 | sunny | mild | high | false | N |

    | 9 | sunny | cool | normal | false | P |

    | 10 | rain | mild | normal | false | P |

    | 11 | sunny | mild | normal | true | P |

    | 12 | overcast | mild | high | true | P |

    | 13 | overcast | hot | normal | false | P |

    | 14 | rain | mild | high | true | N |


    表 打高尔夫球天气情况的样本集（14个）'
  - '[PAGE 293]


    # ID3 算法举例


    $I(p,n)=-\frac{9}{14}\log_2\frac{9}{14}-\frac{5}{14}\log_2\frac{5}{14}=0.940$


    $E(outlook)=\frac{5}{14}I(p_1,n_1)+\frac{4}{14}I(p_2,n_2)+\frac{5}{14}I(p_3,n_3)$


    $=\frac{5}{14}I(2,3)+\frac{4}{14}I(4,0)+\frac{5}{14}I(3,2)$


    $=\frac{5}{14}\times0.971+\frac{4}{14}\times0+\frac{5}{14}\times0.971$


    $=0.694$


    其中 $p=9，n=5$。


    $gain(outlook)=I(p,n)-E(outlook)=0.940-0.694=0.246$'
  - "[PAGE 294]\n\n# ID3 算法举例\n\n类似地，可得：\n gain(temperature) = 0.029\n gain(humidity)\
    \ = 0.151\n gain(windy) = 0.048\n\n因此，outlook具有最大的信息增益，因此outlook被选为根结点并向下扩展，通过类似的方法，得到相应的ID3决策树。"
