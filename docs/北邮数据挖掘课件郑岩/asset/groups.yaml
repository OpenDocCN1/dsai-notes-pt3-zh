  - '[PAGE 125]


    # 2.1.4 数据仓库与数据库的关系


    +   - 数据库的应用包括：事务型应用和分析型应用

    +   - 物理数据库实际存储的数据包括：

    +     事务型数据（或称操作数据）和分析型数据（也可称为汇总数据、信息数据）。

    +   - 起初，两类数据放到一起，即分散存储在各底层业务数据库中。

    +   - 后来，随着企业规模的扩展、数据量的增加、以及希望在决策分析时得到更多支持需求的日益迫切，并且考虑保证原有事务数据库的高效性与安全性。因此将分析型数据与事务型数据相分离，单独存放，即形成了所谓的数据仓库。'
  - '[PAGE 126]


    # 2.1.4 数据仓库与数据库的关系


    数据仓库只不过是因为用户需求增加而对某一类数据库应用的一个范围的界定。单就其是数据的存储容器这一点而言，数据仓库与数据库并没有本质的区别。


    而且在更多的时候，我们是将数据仓库作为一个数据库应用系统来看待的。


    因此，不应该说数据库到数据仓库是技术的进步。'
  - '[PAGE 127]


    # 数据库与数据仓库的区别


    | | 业务数据库 | 数据仓库 |

    |---|---|---|

    | 内容 | 与业务相关的数据 | 与决策相关的信息 |

    | 数据模型 | 关系、层次结构的 | 关系的/多维的 |

    | 访问 | 经常是随机的读写操作 | 经常是只读操作 |

    | 负载 | 事务处理量大、但每个事务涉及的记录数较少 | 查询量少，但每次要查询大量的记录 |

    | 事务输出量 | 一般很少 | 可能非常大 |

    | 停机时间 | 可能意味着灾难性错误 | 可能意味着延迟决策 |'
