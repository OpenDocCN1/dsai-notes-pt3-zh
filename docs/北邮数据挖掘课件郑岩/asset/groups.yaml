    # 3.1.1 定义


    +   - 聚类分析


    从纷繁复杂的数据中，根据最大化类内相似性、最小化类间相似性的原则进行聚类或分组。


    即使得在一个簇内的对象具有高相似性，而不同簇间的对象具有低相似性的过程。'
