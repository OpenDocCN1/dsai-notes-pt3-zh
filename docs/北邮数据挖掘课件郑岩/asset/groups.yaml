    +   - 提高数据质量

    +   - 搭建数据仓库 (Warehousing Processes)

    +     - 操作型活动 (Operational Activities)

    +     - 数据获取 (Data Acquisition)

    +     - 仓库存储 (Warehouse Storage)

    +   - EAI的数据集成'
  - '[PAGE 137]


    # ETL功能—提高数据质量


    +   - 数据清洁

    +     - 补充缺失值，平滑噪声数据，识别与删除异常数据以及有效解决数据的一致性问题

    +   - 数据集成

