    \n## 雪花结构的实例\n\n![](img/97ec20d772baf04740a42252ab8f47d8_121_0.png)\n\n## 星型雪花型结构的实例\n\
    \ntime\ntime_key\nday\nday_of_the_week\nmonth\nquarter\nyear\n\nSales Fact Table\n\
    time_key\nitem_key\nbranch_key\nlocation_key\nunits_sold\ndollars_sold\navg_sales\n\
    \nitem\nitem_key\nitem_name\nbrand\ntype\nsupplier_type\n\nShipping Fact Table\n\
    time_key\nitem_key\nshipper_key\nfrom_location\nto_location\ndollars_cost\nunits_shipped\n\
    \nbranch\nbranch_key\nbranch_name\nbranch_type\n\nlocation\nlocation_key\nstreet\n\
    city\nprovince_or_street\ncountry\n\nMeasures\n\nshipper\nshipper_key\nshipper_name\n\
    location_key\nshipper_type\n\n## 2.1.4 数据仓库与数据库的关系\n\n到目前为止，数据仓库在国外已经发展了十几年的时间。在国内，虽然起步较晚，但发展较为迅速。\n\
    \n目前有很多的大公司或企业正在建或计划建设不同规模的数据仓库和数据集市。\n\n## 2.1.4 数据仓库与数据库的关系\n\n数据仓库建立在传统事务型数据库的基础之上，为企业决策支持系统、OLAP及数据挖掘系统提供数据源。\n\
    \n## 2.1.4 数据仓库与数据库的关系\n\n- 数据库的应用包括：事务型应用和分析型应用\n- 物理数据库实际存储的数据包括：\n  事务型数据（或称操作数据）和分析型数据（也可称为汇总数据、信息数据）。\n\
    - 起初，两类数据放到一起，即分散存储在各底层业务数据库中。\n- 后来，随着企业规模的扩展、数据量的增加、以及希望在决策分析时得到更多支持需求的日益迫切，并且考虑保证原有事务数据库的高效性与安全性。因此将分析型数据与事务型数据相分离，单独存放，即形成了所谓的数据仓库。\n\
    \n## 2.1.4 数据仓库与数据库的关系\n\n数据仓库只不过是因为用户需求增加而对某一类数据库应用的一个范围的界定。单就其是数据的存储容器这一点而言，数据仓库与数据库并没有本质的区别。\n\
    \n而且在更多的时候，我们是将数据仓库作为一个数据库应用系统来看待的。\n\n因此，不应该说数据库到数据仓库是技术的进步。\n\n## 数据库与数据仓库的区别\n\
    \n| | 业务数据库 | 数据仓库 |\n|---|---|---|\n| 内容 | 与业务相关的数据 | 与决策相关的信息 |\n| 数据模型 | 关系、层次结构的\
    \ | 关系的/多维的 |\n| 访问 | 经常是随机的读写操作 | 经常是只读操作 |\n| 负载 | 事务处理量大、但每个事务涉及的记录数较少 | 查询量少，但每次要查询大量的记录\
    \ |\n| 事务输出量 | 一般很少 | 可能非常大 |\n| 停机时间 | 可能意味着灾难性错误 | 可能意味着延迟决策 |\n\n## 演变过程\n\n\
    - 60年代\n  - 数据收集、数据库创建、信息管理系统（IMS）和网络数据库管理系统（Network DBMS）\n\n- 70年代\n  - 关系数据模型以及关系型DBMS\n\
    \n## 演变过程\n\n- 80年代至今\n  - 高级数据模型 (具有扩充关系的, 面向对象的, 演绎的等等) 和 面向应用的 DBMS (空间的, 科学的,\
    \ 工程的等等)\n- 90年代至今\n  - 数据挖掘和数据仓库, 多媒体数据库和Web数据库。\n\n## 数据收集和数据库创建\n（20世纪60年代和更早）\n\
    - 原始文件处理\n\n## 数据库管理系统\n（70年代）\n- 层次和网状数据库\n- 数据库管理系统\n- 数据库建模工具；实体-关系模型\n- 索引和数据组织技术；B+树，散列等\n\
    - 查询语言；SQL等\n- 用户界面：表单、报告等\n- 查询处理和优化\n- 事务管理：恢复和并发控制等\n- 联机事务处理（OLTP）\n\n## 高级数据库系统\n\
    （80年代中期—现在）\n- 高级数据模型：\n  扩展关系、面向对象、\n  对象—关系、演绎\n- 面向应用：\n  空间的、时间的、多媒体的、\n \
    \ 主动的、科学的、\n  知识库\n\n## 基于WEB的数据库系统\n（90年代—现在）\n- 基于XML的数据库系统\n- Web挖掘\n\n## 数据仓库和数据挖掘\n\
    （80年代后期—现在）\n- 数据仓库和OLAP技术\n- 数据挖掘和知识发现\n\n## 新一代综合信息系统\n（2000年—...）\n\n## 数据库的局限性\n\
    \n传统数据库所能做到的只是对已有的数据进行存取以及简单的查询统计，即使是一些流行的OLAP工具，也无非是另一种数据展示方式而已。人们仍然无法发现数据中存在的关系和规则，无法根据现有的数据预测未来的发展趋势。这也直接导致了目前“数据爆炸但知识贫乏”的现状。\n\
    \n## 2.2 ETL过程\n\n- 2.2.1 ETL的概念\n- 2.2.2 ETL的功能\n- 2.2.3 ETL的目标\n- 2.2.4 ETL的流程\n\
    - 2.2.5 ETL的框架\n- 2.2.6 ETL的组成\n- 2.2.7 ETL的相关技术\n- 2.2.8 ETL的实现方法\n- 2.2.9 ETL的工具\n\
    - 2.2.10 ETL的应用\n\n## 2.2.1 ETL的概念\n\n将原来业务系统的数据经过抽取、转换、加载到数据仓库所在的中心存储库的过程称为ETL（Extraction，Transformation\
    \ and Loading）过程，制定这个过程的策略称之为ETL策略，而完成ETL过程的工具则是ETL工具。相对于数据仓库中的表而言，业务系统数据库中的表称为源表，业务系统数据库称为源数据库，数据仓库中所有的数据都来自于业务系统数据库。在打造一个数据仓库的过程中，ETL的实施是一项繁琐、冗长而艰巨的任务，因为它关系到数据仓库中数据的质量问题，如果导入的数据漏洞百出，对决策者来说无疑是个噩耗。\n\
    \nETL过程是搭建“数据仓库”时**最重要的和最易误解的**步骤之一。\n\n## 2.2.1 ETL的概念\n\nETL过程不仅仅是数据的迁移(Migration)或净化(Cleansing)，也应该是企业数据管理策略中不可缺少的一部分。\n\
    \nETL过程的功能是：发现数据仓库需要的数据，将其从源系统中抽取出来，并进行一定的处理，然后装载到数据仓库中去。\n\n## 2.2.2 ETL的功能\n\
    \n- 提高数据质量\n- 搭建数据仓库 (Warehousing Processes)\n  - 操作型活动 (Operational Activities)\n\
    \  - 数据获取 (Data Acquisition)\n  - 仓库存储 (Warehouse Storage)\n- EAI的数据集成\n\n## ETL功能—提高数据质量\n\
    \n- 数据清洁\n  - 补充缺失值，平滑噪声数据，识别与删除异常数据以及有效解决数据的一致性问题\n- 数据集成\n  - 多个数据库、数据立方体或文件的数据整合\n\
    - 数据转换\n  - 实现数据的归一化\n- 数据简化\n  - 在不影响分析结果的前提下，缩减数据量\n- 数据离散化\n  - 对于数值型数据可通过取样实现离散化以降低数据量\n\
    \n## ETL功能—提高数据质量\n\nData Cleaning\n\n[water to clean dirty-looking data]\n[show\
    \ soap suds on data]\n['clean' -looking data]\n\nData Integration\n\n![](img/97ec20d772baf04740a42252ab8f47d8_138_0.png)\n\
    \nData Transformation\n\n-2, 32, 100, 59, 48 → -0.02, 0.32, 1.00, 0.59, 0.48\n\
    \nData Reduction\n\n![](img/97ec20d772baf04740a42252ab8f47d8_138_1.png)\n\n##\
    \ ETL功能—搭建数据仓库\n\n## Operational Activities\n\nERP Applications\n\nDatabases\n\
    \nGroupware\n\nLegacy Applications\n\nWeb\n\nDocuments\n\nMultimedia\n\n## Data\
    \ Acquisition\n\nStaging\n\nIntegration\n\nTransformation\n\n## Warehouse Storage\n\
    \nData Warehouse\n\nODS\n\nWarehouse Delivery & Access\n\n"
