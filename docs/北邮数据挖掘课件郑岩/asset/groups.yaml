  md: "\n## ETL流程—数据清洁\n\n数据仓库中必须存放“优质数据”（Quality Data）——符合一致性的、大家公认或经过验证是有价值的，并符合元数据定义的。清洁功能能够检测出那些违反规则的数据，一旦发现要么抛弃，要么将其转换成“清洁”数据，使其符合规则，然后装载到数据仓库中。\n\
    \n来自操作型数据源的数据如果含有不洁的成分和不规范的格式，将对数据仓库的建立维护，特别是对联机分析处理的使用，造成很多问题和麻烦。这时必须在ETL处理过程中加以解决，通常包括以下处理方法：\n\
    \n- a. 设计拼写检查、分类并与标准值表对照检查\n- b. 处理名字和地址\n- c. 为名字和地址建立辅助表格或联机字典，据此进行检查修正\n- d.\
    \ 数据转换函数以及子程序库\n\n- “脏”数据（Dirty Data）\n  - 数据不符合一致性\n  - 用数据库设计工具定义Checks, Validation\
    \ Criteria, Integrity Constraints\n  - 数据库设计者不是很清楚DBMS\n  - 删除了“约束”，因为它们会降低操作性能\n\
    \  - 使用一些特定代码、标志或“哑元”(Dummy values)\n  - 多目标域（Fields）—某域依赖其他域，但不一致\n  - ……\n\n\
    - “脏”数据的清洁包括三个层次：\n  - 数据源、应用层的数据清洁（实现起来困难）\n  - 整合与转换层的数据清洁\n    - 元素化—剖析成原子数据\n\
    \    - 标准化每个元素值的表达\n    - 验证标准化后的元素值是否满足一致性\n  - 数据仓库内部的数据清洁\n\n通常，上述三种方式联合使用，以获得高效性。\n\
    \n- 保障数据清洁顺利进行的原则\n  - 首先，对数据清洁流程进行分析和系统化的设计，\n  - 其次，针对数据的主要问题和特征，设计一系列数据对照表和数据清洗程序库。\n\
    \  - 两者的有效组合，可以面对不断变化的、形形色色的数据清洁问题。\n\n- 数据清洁的过程\n  - 预处理：对于大的数据加载文件（特别是新的文件和数据集）进行预先诊断和检测，不能贸然加载。有时需要临时编写诊断小程序，称作“小狗”，它会用鼻子闻一闻这个庞然大物（不知底细的文件），以进行卫生检查；\n\
    \  - 标准化处理：应用建于数据仓库内部的标准字典，对于地区名、人名、公司名、产品名、品类名进行标准化处理；\n  - 查重：应用各种数据查询手段，避免引入重复数据；\n\
    \  - 出错处理和修正：将出错的记录和数据写入到日志文件，留待进一步处理。\n\n## ETL流程—数据装载\n\n- 使用装载工具或数据查询语言(SQL)\n\
    \  - 效率问题\n  - 避免违反约束关系，注意装载顺序\n\n转换的工作虽然较为繁琐，但却是三个步骤中最简单的。\n\n许多ETL工具都提供了强大的转换功能。例如DTS中有：复制字段转换、小写字符串转换、大写字符串转换、中间字符串转换、剪裁字符串转换、日期时间字符串转换、读取文件转换、写入文件转换和ActiveX\
    \ 脚本转换等。\n\n在这些转换操作中，最常用的是ActiveX 脚本转换，因为它允许自行撰写VBScript或Jscript将原始字段中的数据转换至目标字段中的数据。\n\
    \n实际上，如果前述的各种转换都无法满足需求时，则ActiveX 脚本转换将是最终的选择。\n\n### 2.2.5 ETL的框架\n\n![](img/97ec20d772baf04740a42252ab8f47d8_170_0.png)\n\
    \nDW Populating subsystem reference architecture\nScott Howard (IBM)\n\n### 2.2.6\
    \ ETL的组成\n\n![](img/97ec20d772baf04740a42252ab8f47d8_171_0.png)\n\n### 2.2.7 ETL的相关技术\n\
    \n- DTS (Microsoft SQL Server)\n- 逻辑上，实现ETL过程有3种策略\n  - 远程抽取（Remote Extraction）\n\
    \  - 推（Push）\n  - 拉（Pull）\n- 并行技术（Parallelism）\n- 数据堆装载（Data Bulk Load）\n\n###\
    \ ETL技术—DTS\n\nSQL Server的数据转换服务（Data Transformation Services，简写为DTS）提供了一套基于OLE\
    \ DB的COM对象，使用VBScript、PerlScript 或 Microsoft Jscript 脚本描述语言创建数据转换程序，可以实现不同OLE\
    \ DB数据源之间的数据转换操作。\n\n### 2.2.8 ETL的实现方法\n\n- 远程抽取\n  - ETL过程是在一个独立的远程平台上进行的。\n\
    \  - 受数据源现有系统或目标仓库结构的影响最小。\n  - 几乎不影响源和目标系统的CPU和容量。\n  - 可能会提高成本；对网络带宽要求较高。\n\n\
    - “Push”\n  - 在现有系统环境中开展ETL过程\n  - 当现有系统具有相当充裕的容量，而且不会超过CPU处理限度时，经常采用这种方法\n  -\
    \ 现有系统是同构的，经常采用这种方式\n\n- “Pull”（Collocation）\n  - ETL过程在“仓库”端进行\n  - 当现有系统是异构时，经常采用\n\
    \  - 当“仓库”端平台具有必需的性能和容量时，会体现一定优势。\n  - 由于“仓库”不断增长，可能需要制定长期策略\n\n- （1）高速装载：在内存中；通过本地文件系统通信；有限的输入/输出请求\n\
    - （2）保留带宽：避免了访问网络，使得其它依赖于网络的应用不受任何影响。\n\n- 并行技术（Parallelism）\n  - 多线程服务器端软件\n\
    \  - 多处理器（SMP）\n- 数据堆装载（Data Bulk Load）\n  - “堆”是最快的数据装载方式\n  - 数据库中有堆装载器，ETL也支持该功能\n\
    \  - 避免使用“插入”或“更新”操作，避免采用 ODBC\n\n### 2.2.9 ETL的工具\n\n- 协助完成ETL过程开发的工具称作ETL或ETLM工具。它们可以标准化ETL过程开发，使运行和正在进行的维护过程提高效率。\n\
    - Design Studio（Sagent公司）\n- Decision Stream（Cognos公司）\n- ……\n\n### 2.2.10 ETL的应用\n\
    \n例如： “统一客户资料沉淀子系统”（UCIS-etl）\n\n- UCIS-etl的框架\n- 实施工具 — Sagent\n- 问题及解决办法\n\n\
    ### UCIS—ETL在统一客户资料系统中的位置\n\n接口 / 服务\n\n- 营业接口\n- 帐务接口\n- 缴费接口\n- 其他接口\n\n中间件平台(TUXEDO)\n\
    \n统一客户资料信息模型 / 数据库\n\n- 基本资料\n- 定购资料\n- 帐务资料\n- 其他资料\n\n客户资料沉淀子系统(UCIS-etl)\n\n\
