    \n1. Overview\n2. Data Warehouse and OLAP Technology\n3. Data Mining Technology\n\
    4. Applications of Data Mining in Telecommunications\n5. Data Mining Tools\n6.\
    \ Data Mining Examples\n\n## 3 Data Mining Technology\n\n- 3.1 Clustering\n- 3.2\
    \ Classification\n- 3.3 Association\n- 3.4 Prediction\n- 3.5 Visualization of\
    \ Data Mining\n- 3.6 Implementation of Data Mining\n\n### 3.1 Clustering\n\n####\
    \ 3.1.1 Definition\n\n#### 3.1.2 Clustering Algorithms\n\n- 3.1.2.1 Classification\
    \ of Clustering Methods\n- 3.1.2.2 K-Means Algorithm\n- 3.1.2.3 K-Medoids Algorithm\n\
    - 3.1.2.4 C-Means Algorithm\n\n### 3.1.1 Definition\n\n**Cluster Analysis**\n\n\
    It refers to the process of clustering or grouping complex and multifarious data\
    \ according to the principles of maximizing within-cluster similarity and minimizing\
    \ between-cluster similarity, such that objects in the same cluster are highly\
    \ similar while objects in different clusters have low similarity.\n\n### 3.1.2.1\
    \ Classification of Clustering Methods\n\n- Partitioning-based clustering methods\n\
    - Hierarchical clustering methods\n- Density-based clustering methods\n- Grid-based\
    \ clustering methods\n- Model-based clustering methods\n\n![](img/97ec20d772baf04740a42252ab8f47d8_235_0.png)\n\
    \n#### Partitioning-Based Clustering Methods\n\nGiven a data set consisting of\
    \ n objects, construct k partitions (k≤n) of this data set, with each partition\
    \ representing a cluster; that is, an algorithm that divides the data set into\
    \ multiple clusters.\n\nRequirements:\n\n1. Each cluster must have at least one\
    \ object;\n2. Each object must belong to exactly one cluster.\n\nTypical algorithms:\
    \ the k-means and k-medoids algorithms, etc.\n\n#### Hierarchical Clustering Methods\n\
    \nIt is a clustering process that decomposes a given data set layer by layer.\
    \ Specifically, it mainly includes the agglomerative method and the divisive method.\n\
    \nThe agglomerative method initially regards each object as a cluster, and then\
    \ repeatedly merges similar clusters until a satisfactory termination condition\
    \ is reached. The divisive method is just the opposite: it first places all data\
    \ in one cluster, and then repeatedly splits the data items with the smallest\
    \ similarity to each other, causing clusters to be divided into smaller clusters\
    \ until a satisfactory termination condition is reached.\n\nDepending on the distance\
    \ measure used between clusters, hierarchical methods can be divided into different\
    \ types. Commonly used distance measures include minimum distance, maximum distance,\
    \ mean distance, and average distance.\n\nTypical algorithms: CURE, Chameleon,\
    \ and BIRCH, etc.\n\n#### Hierarchical Clustering Methods\n\nThese methods do\
    \ not need a parameter (the number of clusters) to be specified in advance, but\
    \ they do need a termination condition.\n\n![](img/97ec20d772baf04740a42252ab8f47d8_238_0.png)\n\
    \n#### CURE Algorithm Description\n\n- Randomly select s samples;\n- Partition\
    \ all samples into p clusters, with each cluster containing s/p samples;\n- Divide\
    \ each cluster into q subsets, with each subset containing s/pq samples;\n- Remove\
    \ outlier data;\n- Randomly select;\n- If a cluster changes slowly, remove the\
    \ cluster;\n- Merge some of the subsets.\n\n#### CURE Algorithm—Data Partitioning\
    \ and Clustering\n\n- s = 50\n- p = 2\n- s/p = 25\n- s/pq = 5\n\n#### CURE Algorithm\
    \ — Shrinking Representative Points\n\n- Shrink the multiple representative points\
    \ towards the gravity center by a fraction of α.\n- Multiple representatives capture\
    \ the shape of the cluster.\n\n#### CHAMELEON Algorithm\n\n- The CHAMELEON algorithm\
    \ is a dynamic hierarchical clustering method proposed by G. Karypis, E.H. Han,\
    \ and V. Kumar in 1999.\n- It computes similarity based on a dynamic model: two\
    \ clusters are merged only when their similarity is higher than the similarity\
    \ among objects within the clusters.\n- Essentially, it is a two-stage algorithm:\n\
    \  1. First, use a graph partitioning algorithm to divide the data set into multiple\
    \ subsets;\n  2. Then, repeatedly merge these subsets using the agglomerative\
    \ method in hierarchical clustering until the final clustering result is obtained.\n\
    \n#### CHAMELEON Algorithm\n\n- Construct Sparse Graph\n- Data Set\n- Partition\
    \ the Graph\n- Merge Partition\n- Final Clusters\n\n#### Density-Based Clustering\
    \ Methods\n\nThe idea of these algorithms is that whenever the density in the\
    \ neighborhood of a cluster exceeds a certain threshold, the cluster is expanded\
    \ and clustering continues. Such algorithms can obtain clusters of arbitrary shapes.\n\
    \nTypical algorithms: DBSCAN, OPTICS, and DENCLUE, etc.\n\n#### Grid-Based Clustering\
    \ Methods\n\nGrid-based clustering algorithms first quantize the problem space\
    \ into a finite number of cells, forming a spatial grid structure, and then perform\
    \ clustering among these grids. Such algorithms are relatively fast.\n\nTypical\
    \ algorithms: STING, WaveCluster, and CLIQUE, etc.\n\n#### Model-Based Clustering\
    \ Methods\n\nModel-based clustering algorithms assume a model for each cluster\
    \ and seek the best fit of the data to the given model. The underlying assumption\
    \ is that data are generated according to an underlying probability distribution.\n\
    \nTypical algorithms: COBWEB and neural network algorithms, etc.\n"
