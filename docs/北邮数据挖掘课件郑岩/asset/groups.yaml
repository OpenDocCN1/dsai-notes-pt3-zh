    \n![](img/97ec20d772baf04740a42252ab8f47d8_378_0.png)\n\n图 CRM与ERP有机结合的企业运作模式\n\
    \n## CRM的应用\n\n数据挖掘在CRM中的市场营销，业务分析，客户服务等方面都有广泛的应。\n\n例如：发展客户、提升客户价值、挽留客户等。\n\n\
    ## CRM的应用\n\n- 发展客户\n\n每一个企业都希望能更快地发展新的客户，更多的客户意味着更大的市场占有率和更好的规模效益。数据挖掘技术可以帮助更准确地发现有价值的潜在客户，从而可以显著地降低发展新客户的成本，提高市场拓展的投入产出比（ROI）。\n\
    \n## CRM的应用\n\n例如，假设一个电信业务提供商利用邮寄宣传材料开拓市场，一份宣传材料的成本是¥1.00。如果漫无目的地随机分发10000份，将有150人成为该公司用户，而其中能给公司带来利润的仅有100人。也就是说投入¥10000，得到了100个有价值的客户。现在采用数据挖掘技术，根据以前随机分发的数据或者新取样500人分发获取数据而后建立模型，根据该模型，发现前面的10000人中只有5000人值得投资，对此5000人邮寄宣传材料后有95人成为客户，其中90人可带来利润。结果是投入¥5500，获得了90个有价值的客户，显著地提高了投入产出比。\n\
    \n## CRM的应用\n\n- 挽留客户\n\n据一般经验估计，留住一个老客户地成本是发展一个新客户成本的3-5倍。留住有价值的客户保持利润的有力手段。而在电信行业，客户的频繁换网现象（churn）十分严重，留住客户比其它行业更加困难。数据挖掘在此问题上也有较好的应用。\n\
    \n## CRM的应用\n\n要挽留客户首先要找出可能离网的客户，因此数据挖掘解决该问题的第一步即是建立离网客户预测模型。该模型可以利用已离网客户的历史资料（包括个人信息、消费行为等）来获得。第二步当然还得判断该客户是否值得挽留，这也用到预测模型，因为有些客户虽然目前是有微弱价值的但是最终毫无价值，有些客户则可能恰恰相反。\n\
    \n## CRM的应用\n\n- 提升客户价值\n\n提升现有客户的价值是提高利润的重要手段。在电信行业，客户价值提升包括交叉销售、增值销售和基本业务价值提升。数据挖掘是发现交叉销售/增值销售机会和分析基本业务价值提升可能性的重要手段。\n\
    \n## CRM的应用\n\n发现交叉销售/增值销售机会涉及到两个模型。第一个模型用来确定哪些用户可以进行推销，哪些用户则不希望被打扰。如果多次对第二类用户进行推销，则可能失去该用户。第二个模型则用来发现对特定的用户推销哪些产品。显然，即使不考虑推销成本，多次向客户推销他并不想要的产品肯定会降低他对该企业的满意度。关联规则可能是第二个模型的重要组成部分。\n\
    \n## CRM的应用\n\n基本业务价值提升要考虑的重要问题是预测用户在企业采取某种措施后其利润的变化情况。例如假设某个电信运营商采取某特定用户群亲友电话费减半的优惠策略来刺激消费，则必须要求这些用户的消费额增加或者能增加市场占有率公司才可能获得效益。\n\
    \n## 4.2 电信领域的应用\n\n- 4.2.1 客户行为与潜在客户分析\n- 4.2.2 用户信用度分析\n- 4.2.3 黑名单、红名单\n- 4.2.4\
    \ 优惠策略\n- 4.2.5 甄别欺诈\n- 4.2.6 趋势预测\n\n![](img/97ec20d772baf04740a42252ab8f47d8_387_0.png)\n\
    \n## 4.2 电信领域的应用\n\n- 目的\n利用成熟的数据挖掘工具或算法，对用户帐务数据、行为数据、基本信息数据，以及各营业点的销售记录等进行分析挖掘，找出各种数据之间的潜在关系，为企业经营者制定销售策略提供科学依据。\n\
    \n- 数据源\n用户帐务数据库、用户行为数据库（话单数据）、用户基本信息库等。\n\n## 4.2.1 用户行为分析\n\n对于企业的某一类或几类产品/业务来说，大致可将其用户分为四类：\n\
    \n- （1）潜在用户\n\n目前还不是公司任何一项产品/业务的用户，但有使用该产品/业务的潜在趋势，这是市场竞争初期的重要营销对象。\n\n- （2）增量用户\n\
    \n是公司某项产品或业务的使用者，并且有增加使用量的趋势。\n\n## 4.2.1 用户行为分析\n\n（3）交叉增量用户\n是企业某一产品/业务的使用者，并且有使用本公司另一类产品/业务的可能性。\n\
    \n（4）挽留客户\n目前是公司的某一类或几类产品/业务的使用者，但有终止使用或转向别的产品/业务提供者转移的可能性。\n\n## 客户行为信息数据库\n\n\
    ## 按利润的等级排序规则\n\n抽样\n\n评分\n\n统计分析\n\n类别利润等级信息\n\n抽样样本数据\n\n聚类分析\n\n类别模型\n\n1\n\
    \n2\n\n3\n\n4\n\n5\n\n6\n\n7\n\n7\n\n8\n\n5\n\n## 实现步骤\n\n- 第一步　采用聚类算法对用户行为进行分类，根据得到的类别模型与客户行为信息库对个客户行为进行评分，结果写回客户行为信息库。\n\
    - 衡量用户行为的主要特征指标包括：\n  - 客户ID\n  - 时段\n  - 工作日性质----工作日和非工作日\n  - 消费金额\n  - 业务类型（重要指长话，市话等通话业务），目的（重要指本地，长途，我网他网等信息）\n\
    \n## 实现步骤\n\n- 第二步\n\n统计分析各类别的行为特性，首先按照各行为类别的利润贡献大小对各类别进行排序。\n\n例如：类别利润计算公式\n\
    类别平均利润=Σ（各行为消费金额）/类别行为个数\n\n## 实现步骤\n\n类别行为特性按不同主题有多种考察重点，如某一种业务或业务组合在各类别行为中出现的百分比，各行为的时间段分布情况等；这里得到两类类别统计信息表：按类别组织和按各种主题（如业务类型，业务量）组织。\n"
  mdcn: "\n\n## 聚类的可视化（Intelligent Miner）\n\n![](img/97ec20d772baf04740a42252ab8f47d8_366_0.png)\n\
    \n## 3.6 数据挖掘的实施\n\n一般而言，一个企业实施数据挖掘项目有三种方式可供选择：\n\n- 购买成熟的模型\n- 购买一般性数据挖掘系统软件\n\
    - 构建数据挖掘系统\n\n## 3.6 数据挖掘的实施\n\n- 第一种方式实现简单，可以直接应用，但是要求模型所模拟的环境必须和企业的产品、客户以及市场条件相类似。当模型所涉及的环境条件改变的时候，这种模型不能根据环境的变化作出修改和调整。\n\
    \n## 3.6 数据挖掘的实施\n\n- 第二种方式可以利用数据挖掘系统根据企业自己的数据生成模型。但是，一个通用的数据挖掘系统在对特定行业商业问题的理解上可能需要做很多工作；同时，如何与企业原有系统自动化集成也是一个需要着重考虑的问题。\n\
    - 第三种方式可以较好地解决与原有系统集成的问题，并可以直接面向特定的商业问题的解决。但是这种方式实现较复杂，项目实施周期长，成本较高。\n\n## 3.6\
    \ 数据挖掘的实施\n\n当然企业也可以把上述方式结合起来。\n例如：购买包含模型的数据挖掘软件或购买通用数据挖掘软件系统，然后进行针对本企业特点的二次开发等。\n\
    \n## 数据挖掘系统的典型结构\n\n![](img/97ec20d772baf04740a42252ab8f47d8_371_0.png)\n\n##\
    \ 4 数据挖掘在电信领域的应用\n\n## 4.1 CRM与 ERP\n\n## 4.2 数据挖掘在电信领域的应用\n\n## 4.1 CRM与ERP\n\
    \n- CRM\n\nCRM（Customer Relationship Management，客户关系管理），作为一种旨在改善企业与客户之间关系的新型管理机制。\n\
    \nCRM系统以数据仓库技术为基础，数据挖掘技术为核心。\n\n## 4.1 CRM与ERP\n\n- ERP\n\nERP（Enterprise Resource\
    \ Planning，即企业资源规划），是前几年国内外兴起的一种企业运作管理软件，它的侧重点是对企业内部的业务流程以及企业的资源进行管理。解决的是企业内部各环节的协调问题，如财务、生产、采购和仓储等部门间的协调关系。\n\
    \n## 4.1 CRM与ERP\n\n- ERP与CRM两者的关系\n\n同样作为现代企业的管理软件，ERP与CRM在企业运营过程中，处于不同的位置，担任不同的角色。一个面向后台，一个面向前台。一个保证企业生产出更高质量的产品，而另一个帮助企业理顺与客户的关系，向客户提供最好的服务。这是企业在激烈的市场竞争保证胜利的不可或缺的两个环节。\n\
    \n## 4.1 CRM与ERP\n\n通过ERP与CRM系统的紧密集成，把企业供应商和服务商等都联成一个有机的整体，真正形成一个以客户为核心进行运作的虚拟企业，并最大限度地满足客户需要和最大限度地降低企业成本。\n\
    \n![](img/97ec20d772baf04740a42252ab8f47d8_378_0.png)\n\n图 CRM与ERP有机结合的企业运作模式\n\
    \n## CRM的应用\n\n数据挖掘在CRM中的市场营销，业务分析，客户服务等方面都有广泛的应。\n\n例如：发展客户、提升客户价值、挽留客户等。\n\n\
    ## CRM的应用\n\n- 发展客户\n\n每一个企业都希望能更快地发展新的客户，更多的客户意味着更大的市场占有率和更好的规模效益。数据挖掘技术可以帮助更准确地发现有价值的潜在客户，从而可以显著地降低发展新客户的成本，提高市场拓展的投入产出比（ROI）。\n\
    \n## CRM的应用\n\n例如，假设一个电信业务提供商利用邮寄宣传材料开拓市场，一份宣传材料的成本是¥1.00。如果漫无目的地随机分发10000份，将有150人成为该公司用户，而其中能给公司带来利润的仅有100人。也就是说投入¥10000，得到了100个有价值的客户。现在采用数据挖掘技术，根据以前随机分发的数据或者新取样500人分发获取数据而后建立模型，根据该模型，发现前面的10000人中只有5000人值得投资，对此5000人邮寄宣传材料后有95人成为客户，其中90人可带来利润。结果是投入¥5500，获得了90个有价值的客户，显著地提高了投入产出比。\n\
    \n## CRM的应用\n\n- 挽留客户\n\n据一般经验估计，留住一个老客户地成本是发展一个新客户成本的3-5倍。留住有价值的客户保持利润的有力手段。而在电信行业，客户的频繁换网现象（churn）十分严重，留住客户比其它行业更加困难。数据挖掘在此问题上也有较好的应用。\n\
