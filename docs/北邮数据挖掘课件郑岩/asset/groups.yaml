    1993年，国家自然科学基金首次资助复旦大学对该领域的研究项目。\n\n目前，国内的许多科研单位和高等院校竞相开展知识发现的基础理论及其应用研究。\n\n\
    ## 数据挖掘的发展趋势\n近年来，数据挖掘的研究重点逐渐从发现方法转向系统应用，注重多种发现策略和技术的集成，以及多学科之间的相互渗透。\n\n例如，1998年在美国纽约举行的第四届知识发现与数据挖掘国际学术会议不仅进行了学术讨论，并且有30多家软件公司展示了他们的数据挖掘软件产品，不少软件已在北美、欧洲等国得到应用。\n\
    \n## 实施数据挖掘的目的\n不再是单纯为了研究，更主要是为商业决策提供真正有价值的信息，进而获得利润。\n\n所有企业面临的一个共同问题是：企业数据量非常大，而其中真正有价值的信息却很少，因此需要从大量的数据中经过深层分析，获得有利于商业运作、提高竞争力的信息，就像从矿石中淘金一样，数据挖掘也由此而得名。\n\
    \n## 1.3 基本概念\n- 信息\n  是事物运动的状态和状态变化的方式。\n- 数据\n  指一个有关事实F的集合（如学生档案数据库中有关于学生基本情况的各条记录），用来描述事物有关方面的信息。一般而言，这些数据都是准确无误的。\n\
    \  数据可能存储在数据库、数据仓库和其他信息资料库中。\n- 知识\n\n人们实践经验的结晶且为新的实践所证实的；是关于事物运动的状态和状态变化的规律；是对信息加工提炼所获得的抽象化产物。\n\
    \n知识的形式可能是模式、关联、变化、异常以及其他有意义的结构。\n\n### 模式\n对于集合F中的数据，我们可以用语言L来描述其中数据的特性，得出一个表达式E，E所描述的数据是集合F的一个子集FE。只有当表达式E比列举所有FE中元素的描述方法更为简单时，我们才可称之为模式。如：“如果成绩在81-90之间，则成绩优良”可称为一个模式，而“如果成绩为81、82、83、84、85、86、87、88、89或90，则成绩优良”则不能称之为一个模式。\n\
    \n## 1.4 主要功能\n### 1. 概念/类别描述（Concept/Class Description）\n概念/类别描述是指对数据集做一个简洁的总体性描述并/或描述它与某一对照数据集的差别。\n\
    \n例1：我们收集移动电话费月消费额超出1000元的客户资料，然后利用数据挖掘进行分析，获得这类客户的总体性描述：35—50岁，有工作，月收入5000元以上，拥有良好的信用度…；\n\
    \n例2：对比移动电话费月消费额超出1000元的客户群与移动电话费月消费额低于100元的客户群。\n\n利用数据挖掘可作出如下描述：移动电话月消费额超出1000元的客户80%以上年龄在35—50岁之间，且月收入5000元以上；而移动电话月消费额低于100元的客户60%以上要么年龄过大要么年龄过小，且月收入2000元以下。\n\
    \n### 2. 关联分析（Association Analysis）\n从一个项目集中发现关联规则，该规则显示了给定数据集中经常一起出现的属性—值条件元组。\n\
    \n例如：关联规则X=>Y所表达的含义是满足X的数据库元组很可能满足Y。关联分析在交易数据分析、支持定向市场、商品目录设计和其他业务决策等方面有着广泛的应用。\n"
  mdcn: "\n\n## 数据挖掘与传统数据分析方法区别\n- (1) 数据挖掘的数据源与以前相比有了显著的改变；\n- 数据是海量的；\n- 数据有噪声；\n\
    - 数据可能是非结构化的；\n\n（2）传统的数据分析方法一般都是先给出一个假设然后通过数据验证，在一定意义上是假设驱动的；与之相反，数据挖掘在一定意义上是发现驱动的，模式都是通过大量的搜索工作从数据中自动提取出来。即数据挖掘是要发现那些不能靠直觉发现的信息或知识，甚至是违背直觉的信息或知识，挖掘出的信息越是出乎意料，就可能越有价值。\n\
