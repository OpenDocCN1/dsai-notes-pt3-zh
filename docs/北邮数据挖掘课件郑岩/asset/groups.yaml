  - '[PAGE 17]


    # What do we want to do?


    +   - The `enjoy` attribute has values of either **yes** or **no**

    +   - In the example we want to discover if there are any combinations of conditions
    that lead to some coffee being more enjoyable than others

    +   - Consequently, can I predict whether I will like a particular coffee?'
  - '[PAGE 18]


    # What will data mining try to do?


    +   - Data mining will try to find rules or relationships that link the data with
    instances of either yes or no

    +   - In other words, what is in the data that is common to the yes (or no) instances?'
  - '[PAGE 19]


    # How does it work?


    +   - Data mining algorithms analyse the data

    +   - Numerous types of algorithms for analysis

