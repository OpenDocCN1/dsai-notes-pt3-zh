  - '[PAGE 239]


    # CURE算法描述


    +   - - 随机选取s个样本；


    +   - - 将所有样本划分为p个簇，每个簇的样本数是s/p；


    +   - - 将每个簇划分为q个子集，每个子集样本数是 s/pq


    +   - - 删除孤立点数据


    +   - 随机取


    +   - 如果一个簇变化缓慢，则删除该簇


    +   - - 合并其中的部分子集'
