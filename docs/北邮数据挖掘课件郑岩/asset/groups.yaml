    - 使用相应的工具完成现有应用数据的集成（即数据的抽取、转换和存贮）\n\n![](img/97ec20d772baf04740a42252ab8f47d8_143_0.png)\n\
    \n## 2.2.3 ETL的目标\n\n- 提高数据质量\n- 提供一种统一的、跨平台的存取数据方法\n- 将数据“信息化”，为企业决策者的经营分析提供信息来源\n\
    \n## 2.2.4 ETL的流程\n\n- 抽取 → 转换/清洁 → 装载\n\n![](img/97ec20d772baf04740a42252ab8f47d8_145_0.png)\n\
    \n- All driven by metadata\n\n## 2.2.4 ETL的流程\n\n（1）预处理。这是正式开始作业之前的准备工作，包括清空工作区、检查过渡\
    \ / 准备区。如果需要直接访问操作型数据源系统时，要检查远程数据库服务器状态，并核对目标区数据加载状态，以核算出加载作业的参数，如加载数据的时间间隔和范围（是24小时的数据，还是前3天的数据）。（2）启动数据加载的批作业。\n\
    \n## 2.2.4 ETL的流程\n\n（3）因为维度表有事实表所参照的主键，所以要先完成对维表的加载，生成维表主键，并作为以后加载事实表所需要的外键。在加载维表时，有时要处理好缓慢变化的维的问题，并可能涉及到版本号的处理问题。\n\
    \n（4）加载事实表。这中间也涉及到键查找的问题，即从有关维表中找到相应的主键，并以此作事实表的外键。\n\n## 2.2.4 ETL的流程\n\n（5）事实表加载完成后，再对总计方阵体系进行刷新，以保障总计方阵与它的基础数据同步。\n\
    \n（6）应设计具有完善的出错处理机制和作业控制日志系统，以监测和协调整个加载的过程。\n\n## ETL流程—数据抽取\n\n数据提取是ETL处理的首要部分，解决的主要问题是确定需要提取的数据，并确定适当的提取方式。\n\
    \n指从一个或多个源数据库中通过记录选取进行数据复制的过程。抽取过程将记录写入ODS（Operational Data Store）或者临时区（Staging\
    \ Area）以备进一步处理。\n\n## ETL流程－数据抽取\n\n- 预抽取\n  - 识别数据（Formal;Informal）\n  - 元数据（Metadata）\n\
    \    - 元数据定义（实体、记录、数据项、模型、主键、外键）\n    - 源应用系统（操作系统、DBMS、位置）\n    - 更新的频率\n   \
    \ - 数据（交易）量\n    - 源数据的拥有者（IS管理员、经营部门主管）\n    - 业务含义描述\n    - 可靠性、完整性评估（通过浏览数据）\n\
    \n## ETL流程—数据抽取\n\n- 后台技术结构(Back Room Tech Architecture)\n  - 单文件系统——平面文件、COBOL、VSAM...\n\
    \  - 早期的DBMSs——IMS,IDMS,Adabas,Mark IV,...\n  - 第三方应用软件\n  - ERP系统——一些已经具有数据仓库能力，但很有限\n\
    \  - 企业报表系统——很难回溯到原始数据\n  - ODS——操作型数据存储（Part of DW/not part of DW，最细粒度、面向主题、整合的、经常新增交易数据、企业视点、星型模型）\n\
    \n## ETL流程—数据抽取\n\n- 预抽取（续）\n  - 选择数据源（原则）\n    - 可访问性\n    - 操作型活动的最近阶段\n   \
    \ - 最接近真实的数据（不是派生的）\n    - 与新开发的OLTP系统一致\n  - 注意:任何没有被选中的数据源，应该记录原因\n  - 分析源数据\n\
    \    - 理解源系统的元数据（数据字典）\n    - 业务规则获取（ Business Rule Capture ）\n\n## ETL流程—数据抽取\n\
    \n## Both Data and Metadata\n\nSchema\n\nMetadata\n\nEXTRACT\n\ndescribes\nconforms\
    \ to\n\nDatabase\n\nData Warehouse\n\nEXTRACT\n\ndescribes\nconforms to\n\nCLEANSING\n\
    \n## ETL流程—数据抽取\n\n- 数据抽取策略（从操作型DBs到DW）：\n  - 陈旧的存档数据\n    - 少见;保险公司;危险品公司\n \
    \ - 现存于操作型环境中的全部数据\n  - 只获取与上一次抽取相比更新的数据\n    - 时间戳（time-stamped）\n    - DELTA\
    \ 文件\n    - 日志文件\n    - 触发器\n    - 比较两次数据库快照（Snapshot）\n\n## ETL流程—数据抽取\n\n其中最重要的是变化数据捕获（Change\
    \ Data Capture，CDC）。有几种方法实现CDC：时间戳、读取RDBMS系统的日志文件、使用源系统中的触发器或者自己开发CDC程序来检查日志文件。\n\
    \n使用时间戳是最简单的，也是相当普遍的方法。前提是所有的源表都有时间戳。\n\n例如：超市的业务系统数据库中几乎每个表都保障有“插入记录日期”、“更新记录日期”两个字段。这是规范数据库的一个基本标准。\n\
    \n## 数据抽取的实现\n\n在多数情况下，数据源系统与数据仓库并不处于同一个数据服务器中，它们往往是独立的，并处在远程系统中。数据的提取往往是以远程的、分布式的提取模式进行，并涉及各种各样的方法和手段，其中包括：\n\
    \n- （1）应用SQL*Plus提取到文本文件；\n- （2）应用OCI or Pro*C程序，或者Oracle UTIL_FILE提取到文本文件；\n\
    - （3）应用Oracle Export Utility实用程序提取到 Oracle Export Files文件；\n\n## 数据抽取的实现\n\n-\
    \ （4）远程数据复制\n- （5）信息流\n\n## ETL流程—数据转换\n\n- **数据转换**\n  将抽取出的数据进行过滤、合并、解码、翻译等转换，为数据仓库创建有效数据的过程。\n\
    - 一旦数据抽取或选取过程完成，就要设计并确定转换规则（Business Rules）应用于已抽取出的数据\n- 转换过程需要理解业务侧重点（Business\
    \ Focus）、信息需求（Informational Needs）和目前可用的源数据（Available Sources）。\n\n## ETL流程—数据转换\n\
    \n- 转换规则\n  - 字段级的\n    - 数据类型转换\n    - 增加“上下文”数据 如，时间戳\n    - 解码（Decoding）如，将数值型的地域编码替换成地域名称\n\
    \  - 清洁和净化\n    - 保留字段具有特定值或特定范围的记录\n    - 引用完整性检查\n    - 去除重复记录\n\n## ETL流程—数据转换\n\
    \n- 转换规则(续)\n  - 多数据源整合\n    - 字段映射（Mapping）\n    - 代码变换（Transposing）—将不同数据源中的数据值规范成数据仓库数据值。例如，将原系统非英文编码转换成数据仓库英文编码；将原系统信息编码转换成数据仓库信息编码等。\n\
    \    - 合并（Merging）—将两个或更多个源系统记录合并为一个输出或“目标”记录\n    - 派生（Derivations）—根据源数据，利用数学公式产生数据仓库需要的数据。例如，由身份证号码计算出出生日期、性别、年龄等。\n\
    \  - 聚合(Aggregation)和汇总(Summarization)\n    - Detail > light agg/sum > levels\
    \ of rollups > more agg/sum\n"
