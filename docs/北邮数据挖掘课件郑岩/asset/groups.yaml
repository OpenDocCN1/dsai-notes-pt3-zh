    +   - **仓库管理器**

    +     执行程序：数据整理与转换程序、备份与备存程序

    +     功能：转换并管理数据仓库数据、备份与备存数据


    +   - **查询管理器**

    +     执行程序：查询管理程序

    +     功能：引导并管理数据仓库的查询'
  - '[PAGE 101]


    # 加载管理器


