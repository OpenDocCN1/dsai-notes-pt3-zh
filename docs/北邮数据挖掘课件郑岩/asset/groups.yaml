    \ modelling | Naive Bayes – uses prior probability of class combined with instance\
    \ probability – assumes attributes are independent |\n| Decision trees | ID3 /\
    \ C4.5 decision tree induction – information gain or gain ratio calculated at\
    \ each node to decide which branch to go down – maximise the separation of classes\
    \ |\n| Covering rules | Rules found to cover all instances of each class – attribute-value\
    \ pair to maximise the classification rule – PRISM method |\n| Association rules\
    \ | Looking for item sets with high coverage and specified minimum confidence\
    \ – works for nominal values – Apriori algorithm |\n| Linear models | Numeric\
    \ prediction – linear regression to minimise difference between actual and predicted\
    \ values |\n| Instance-based learning | Euclidean distance of attribute sets found\
    \ to calculate the nearest neighbour algorithm – filtering k-nearest matches |\n\
    \n## Classification\n\n- Predicted attribute is categorical\n- Implemented methods\n\
    \  - Naïve Bayes\n  - Decision trees and rules\n  - Neural networks\n  - Support\
    \ vector machines\n  - Instance-based classifiers ...\n- Demo: iris.arff, mushroom_simple.arff\n\
    - Evaluation\n  - Test set\n  - Cross-validation ...\n\n## Clustering\n\n- Clustering\n\
    \  - Estimation maximisation (EM)\n  - Simple k-means\n  - Cobweb\n  - Farthest\
    \ first\n- Implemented methods\n  - *k*-Means\n  - EM\n  - Cobweb\n  - X-means\n\
    \  - FarthestFirst...\n- Clusters can be visualized and compared to “true” clusters\
    \ (if given)\n\n## Regression\n\n- Predicted attribute is continuous\n- Implemented\
    \ methods\n  - Linear regression\n  - Neural networks\n  - Regression trees ...\n\
    - Demo: goods.arff, cpu.arff\n\n## Association Discovery\n\n- Works only with\
    \ discrete attributes\n- Implemented methods\n  - APRIORI\n  - TERTIUS\n- Limited\
    \ capabilities → GUHA\n- Demo: baskets1n.arff\n\n## Pros\n\n- Extensibility\n\
    - Features\n  - Methods\n  - KDD phases\n- Multimodal use and interface\n  - Scripting\n\
    - Free (GPL)\n\n## Associations\n\n- Associations\n  - Apriori\n  - Tertius\n\n\
    ## Select Attributes\n\n- Attribute evaluator, e.g.\n  - Classifier subset evaluator\n\
    \  - Chi-squared attribute evaluator\n- Search method, e.g.\n  - Best-first\n\
    \  - Random first\n\n## Output\n\n- Output\n  - Depends on what methods are used\n\
    - Rules\n- Classes\n- Trees – visualised\n- Clusters\n- Associations\n- Error\
    \ checks – visualised\n"
  mdcn: "\n\n## Weka的功能\n\n- 预处理\n- 分类\n- 聚类\n- 关联\n- 属性选择\n- 可视化\n\n## 预处理\n\n- 预处理\n\
    \  - 数据检查\n  - 过滤，例如\n    - 基于属性：归一化、离散化\n    - 基于实例：删除、随机化\n  - 选择训练数据\n  - 选择测试数据\n\
    - 从文件导入：ARFF、CSV、C4.5、二进制\n- 从 URL 或 SQL 数据库导入（使用 JDBC）\n- 预处理过滤器\n  - 添加/删除属性\n\
    \  - 属性值替换\n  - 离散化（MDL、Kononenko 等）\n  - 时间序列过滤器（delta、shift）\n  - 采样、随机化\n \
    \ - 缺失值管理\n  - 归一化及其他数值变换\n\n## 属性选择\n\n- 非常灵活：搜索与评估方法的任意组合\n- 过滤方法和包装方法均可\n-\
    \ 搜索方法\n  - 最佳优先\n  - 遗传\n  - 排名 ...\n- 评估度量\n  - ReliefF\n  - 信息增益\n  - 增益率 ...\n\
    - 演示：weather_nominal.arff – PCP + ranker 搜索\n\n## 分类方法\n\n- 分类\n  - 算法\n\n| 分类方法\
    \ | 说明 |\n|---|---|\n| 基础规则 | 1R – 单层决策树 – 仅使用最佳一级规则 |\n| 统计建模 | 朴素贝叶斯 – 使用类先验概率与实例概率相结合\
    \ – 假设属性相互独立 |\n| 决策树 | ID3 / C4.5 决策树归纳 – 在每个节点计算信息增益或增益率，以决定沿哪个分支继续划分 – 最大化类别分离度\
    \ |\n| 覆盖规则 | 发现覆盖每个类别所有实例的规则 – 选择属性-值对以最大化分类规则 – PRISM 方法 |\n| 关联规则 | 寻找具有高覆盖率和指定最小置信度的项集\
    \ – 适用于标称值 – Apriori 算法 |\n| 线性模型 | 数值预测 – 通过线性回归最小化实际值与预测值之间的差异 |\n| 基于实例的学习\
    \ | 计算属性集的欧几里得距离以找到最近邻算法 – 筛选 k 个最近邻匹配 |\n\n## 分类\n\n- 预测属性为类别型\n- 已实现的方法\n  -\
    \ 朴素贝叶斯\n  - 决策树和规则\n  - 神经网络\n  - 支持向量机\n  - 基于实例的分类器 ...\n- 演示：iris.arff、mushroom_simple.arff\n\
    - 评估\n  - 测试集\n  - 交叉验证 ...\n\n## 聚类\n\n- 聚类\n  - 期望最大化（EM）\n  - 简单 k-means\n\
    \  - Cobweb\n  - 最远优先\n- 已实现的方法\n  - *k*-Means\n  - EM\n  - Cobweb\n  - X-means\n\
    \  - FarthestFirst...\n- 聚类结果可以可视化，并与“真实”聚类进行比较（如果提供）\n\n## 回归\n\n- 预测属性为连续值\n\
    - 已实现的方法\n  - 线性回归\n  - 神经网络\n  - 回归树 ...\n- 演示：goods.arff、cpu.arff\n\n## 关联发现\n\
    \n- 仅适用于离散属性\n- 已实现的方法\n  - APRIORI\n  - TERTIUS\n- 能力有限 → GUHA\n- 演示：baskets1n.arff\n\
    \n## 优点\n\n- 可扩展性\n- 特性\n  - 方法\n  - KDD 阶段\n- 多模式使用与接口\n  - 脚本化\n- 免费（GPL）\n\n\
    ## 关联\n\n- 关联\n  - Apriori\n  - Tertius\n\n## 选择属性\n\n- 属性评估器，例如\n  - 分类器子集评估器\n\
    \  - 卡方属性评估器\n- 搜索方法，例如\n  - 最佳优先\n  - 随机优先\n\n## 输出\n\n- 输出\n  - 取决于所使用的具体方法\n\
    - 规则\n- 类\n- 树 – 可视化\n- 聚类\n- 关联\n- 错误检查 – 可视化\n\n"
