  - '[PAGE 142]


    # ETL功能—搭建数据仓库


    本质上，ETL过程完成了将“生数据”(Raw Data)转化为“信息”(Information)的过程，即传递有用的数据至数据仓库（中央数据库）中；


    +   - 首先是从各种操作型数据源中抽取“有用”的数据；

    +   - 然后，将操作型数据转换成“具有战略意义”的信息；

    +   - 最后，将“具有战略意义”的信息装载到数据仓库中，以备决策支持使用。


    ![](img/97ec20d772baf04740a42252ab8f47d8_142_0.png)'
