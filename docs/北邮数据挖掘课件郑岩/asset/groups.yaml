  mdcn: "\n\n## 小结\n\n这六种工具都是非常优秀的数据挖掘工具，但每一种可能适用于不同的环境。IBM的Intelligent Miner在市场上比较领先并有良好的技术支持；SAS的Enterprise\
    \ Miner明显地偏向统计（因此更适用于适合统计的环境）；\n\n在不清楚那种算法更好的情况下Unica的PRW是较好的选择，Cognos的Scenario则是其数据仓库系列产品的重要组件……。\n\
    \n## 如何选择数据挖掘工具\n\n- 商用数据挖掘系统各不相同\n  - 不同的数据挖掘功能和方法\n  - 数据集的类型可能完全不同\n- 多维视图\n\
    - 数据类型\n  关系型的, 事务型的, 文本的, 时间序列, 空间的?\n- 系统问题\n  - 支持一种还是多种操作系统?\n  - C/S 架构?\n\
    \  - 提供Web接口，且允许输入/输出 XML 数据?\n\n## 如何选择数据挖掘工具\n\n- 数据源\n  - ASCII文件、文本文件, 多个关系型数据源\n\
    \  - 支持 ODBC 连接 (OLE DB, JDBC)?\n- 数据挖掘功能与方法\n  - 实现多种数据挖掘功能\n  - 每种功能提供多种实现方法提供更多的数据挖掘功能和实现方法将使用者具有更大的灵活性和更强大的分析能力与数据库或数据仓库的耦合性\n\
    \  - 四种耦合方式: 非耦合, 松散耦合, 半紧密耦合 和 紧密耦合\n    - 理想情况下, 数据挖掘系统应该与数据库是紧密耦合的\n\n## 如何选择数据挖掘工具\n\
    \n- **可伸缩性**\n  - 行或数据库大小可伸缩性\n  - 列或维度可伸缩性\n  - 维度灾难：使系统具备列可伸缩性比行可伸缩性要困难得多\n\n\
    - **可视化工具**\n  - “一图胜千言”\n  - 可视化类别：数据可视化、挖掘结果可视化、挖掘过程可视化以及可视化数据挖掘\n\n- **数据挖掘查询语言与图形用户界面**\n\
    \  - 易于使用且高质量的图形用户界面\n  - 对于用户引导的、高交互性的数据挖掘至关重要\n\n### 5.3.1 典型工具—DBMiner\n\n\
    - DBMiner 的主要功能\n  - 基于发现的、OLAP 的多维分析\n  - 关联和频繁模式分析\n  - 分类（决策树分析）\n  - 聚类分析\n\
    \  - 3-D 立方体查看器和分析器\n- 其他功能\n  - OLAP 服务、立方体探索、统计分析\n  - 序列模式分析（开发中）\n  - 可视化分类（开发中）\n\
