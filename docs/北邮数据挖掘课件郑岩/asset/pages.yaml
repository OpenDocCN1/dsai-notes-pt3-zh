- pgno: 169
  md: '# ETL流程—数据装载


    转换的工作虽然较为繁琐，但却是三个步骤中最简单的。


    许多ETL工具都提供了强大的转换功能。例如DTS中有：复制字段转换、小写字符串转换、大写字符串转换、中间字符串转换、剪裁字符串转换、日期时间字符串转换、读取文件转换、写入文件转换和ActiveX
    脚本转换等。


    在这些转换操作中，最常用的是ActiveX 脚本转换，因为它允许自行撰写VBScript或Jscript将原始字段中的数据转换至目标字段中的数据。


    实际上，如果前述的各种转换都无法满足需求时，则ActiveX 脚本转换将是最终的选择。'
  merge: -1
  img_proc: true
