  md: '# ETL流程—数据抽取


    数据提取是ETL处理的首要部分，解决的主要问题是确定需要提取的数据，并确定适当的提取方式。


    指从一个或多个源数据库中通过记录选取进行数据复制的过程。抽取过程将记录写入ODS（Operational Data Store）或者临时区（Staging
    Area）以备进一步处理。'
