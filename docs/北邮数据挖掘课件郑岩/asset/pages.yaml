- pgno: 134
  md: '# 2.2.1 ETL的概念


    将原来业务系统的数据经过抽取、转换、加载到数据仓库所在的中心存储库的过程称为ETL（Extraction，Transformation and Loading）过程，制定这个过程的策略称之为ETL策略，而完成ETL过程的工具则是ETL工具。相对于数据仓库中的表而言，业务系统数据库中的表称为源表，业务系统数据库称为源数据库，数据仓库中所有的数据都来自于业务系统数据库。在打造一个数据仓库的过程中，ETL的实施是一项繁琐、冗长而艰巨的任务，因为它关系到数据仓库中数据的质量问题，如果导入的数据漏洞百出，对决策者来说无疑是个噩耗。


    ETL过程是搭建“数据仓库”时**最重要的和最易误解的**步骤之一。'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# 2.2.1 ETL的概念


    ETL过程不仅仅是数据的迁移(Migration)或净化(Cleansing)，也应该是企业数据管理策略中不可缺少的一部分。


    ETL过程的功能是：发现数据仓库需要的数据，将其从源系统中抽取出来，并进行一定的处理，然后装载到数据仓库中去。'
  merge: -1
  img_proc: true
