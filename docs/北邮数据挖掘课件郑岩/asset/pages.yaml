- pgno: 34
  md: '# 数据挖掘与统计学的关系


    近几年，人们逐渐发现数据挖掘中有许多工作都是由统计方法来完成的。甚至有些人（尤其是统计学家）认为数据挖掘是统计学的一个分支，当然大多数人（包括绝大多数数据挖掘研究人员）并不这么认为。


    但是，统计学和数据挖掘的目标非常相似，而且数据挖掘中的许多算法也源于数理统计，统计学对数据挖掘发展的贡献功不可没。'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 数据挖掘与传统数据分析方法区别


    +   (1) 数据挖掘的数据源与以前相比有了显著的改变；

    +   数据是海量的；

    +   数据有噪声；

    +   数据可能是非结构化的；


    （2）传统的数据分析方法一般都是先给出一个假设然后通过数据验证，在一定意义上是假设驱动的；与之相反，数据挖掘在一定意义上是发现驱动的，模式都是通过大量的搜索工作从数据中自动提取出来。即数据挖掘是要发现那些不能靠直觉发现的信息或知识，甚至是违背直觉的信息或知识，挖掘出的信息越是出乎意料，就可能越有价值。'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# 数据挖掘与传统数据分析方法区别


    在缺乏强有力的数据分析工具而不能分析这些资源的情况下，历史数据库也就变成了“数据坟墓”一里面的数据几乎不再被访问。也就是说，极有价值的信息被“淹没”在海量数据堆中，领导者决策时还只能凭自己的经验和直觉。因此改进原有的数据分析方法，使之能够智能地处理海量数据，即演化为数据挖掘。'
  merge: -1
  img_proc: true
