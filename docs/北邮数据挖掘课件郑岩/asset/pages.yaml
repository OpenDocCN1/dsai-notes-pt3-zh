  md: '# 如何选择数据挖掘工具


    +   - 商用数据挖掘系统各不相同

    +     - 不同的数据挖掘功能和方法

    +     - 数据集的类型可能完全不同

    +   - 多维视图

    +   - 数据类型

    +     关系型的, 事务型的, 文本的, 时间序列, 空间的?

    +   - 系统问题

    +     - 支持一种还是多种操作系统?

    +     - C/S 架构?

    +     - 提供Web接口，且允许输入/输出 XML 数据?'
  merge: -1
