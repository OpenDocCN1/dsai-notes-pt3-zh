- pgno: 398
  md: '# 4.2.2 用户信用度分析


    +   > 用户信用度等级描述

    +   详细描述用户信用度等级的具体含义。

    +   > 信用等级分布表示

    +   客户的利润、客户的基本信息和行为分类如时间段、业务类型等的分布表示。类似于客户行为分析。

    +   > 信用度的相关分析

    +   分析影响用户信用度的因素之间的概率依赖关系、强度及其可信度。这一方面用于预测客户信用度的发展趋势，当发生变化时，对其信用等级进行相应的调整。'
  merge: -1
  img_proc: true
- pgno: 399
  md: '# 4.2.2 用户信用度分析


    利用上述分析结果，给出从一个信用度等级到另一个信用度等级变化可能性大的客户。可能决策者主要关心从高等级到低等级（最低等级）和从低等级到最高等级可能性大的用户群。'
  merge: -1
  img_proc: true
- pgno: 400
  md: '# 4.2.2 用户信用度分析


    根据影响用户信用度的主要因素，对用户的账务数据进行分类，建立分类模型，并对用户进行评分，给出用户的信用度级别（类别）。


    影响用户信用度的主要因素包括：


    +   (1) 交费的及时度

    +   (2) 用户的社会性质

    +   (3) 用户的通话业务量

    +   (4) 用户申请的业务数量

    +   (5) 用户申请的业务种类和用户的投诉情况'
  merge: -1
  img_proc: true
- pgno: 401
  md: '# 4.2.2 用户信用度分析


    +   - 用户信用度分析的实现

    +     <1> 系统初装时，没有用户的信用度级别信息，这时采用聚类算法，按照用户的帐务行为信息将其分为若干类。在此基础上，依照每类各指标的统计数据和一定的等级评定规则，将各类的信用度赋于高低级别；

    +     <2> 在系统运转过程中，用户（指本系统用户）可能会对用户已有信用度级别提出异议，或加以修改，这样，对做了相应级别修正后的用户数据，采用有监督的分类学习，就会导致更为准确的分类模型，而且这个模型也是不断在更新的。相应的，随着用户信用行为特征的变化，其信用级别也会不断变动。'
  merge: -1
  img_proc: true
- pgno: 402
  md: '# 4.2.2 用户信用度分析


    信用度类别分类依据的用户帐务信息数据包括：


    +   - 开户平均时长

    +   - 欠费次数

    +   - 金额(如本月欠费，则为欠费金额，此值为负，如本月不欠费，则为通话费用，此值非负)

    +   - 欠费时长

    +   - 帐务人社会性质'
  merge: -1
  img_proc: true
