- pgno: 415
  md: '# 4.2.4 优惠策略分析


    # 优惠方式分析


    +   - 对于各种优惠方式（包括优惠套餐），给出其受益客户的类别、信用度类别分布、欺诈情况和投诉类别分布等。例如，优惠策略的行为类别分布及其柱状图和饼状图等。

    +   - 新优惠套餐设置分析。给出新的优惠套餐的设置与客户群的分析及利润分析。（优惠套餐的设置参数必须在以前的优惠策略中出现过），分析优惠套餐使用者的其他各项属性的概率，从而给出这种优惠（资费）的客户群体。同时可以查找最优化的优惠设置。'
  merge: -1
  img_proc: true
