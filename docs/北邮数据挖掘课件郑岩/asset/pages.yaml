- pgno: 417
  md: '# 4.2.5 甄别欺诈


    当前恶意欠费客户给电信运营商造成了巨大的利润损失，如何减少欺诈行为带来的损失是每一家电信企业所必须面对的问题。在识别欺诈客户，降低经营风险方面数据挖掘已经不少有了成功的应用案例。'
  merge: -1
  img_proc: true
- pgno: 418
  md: '# 4.2.5 甄别欺诈


    识别欺诈客户的主要途径：


    +   1. 第一个是区分用户的信用度，通过建立用户信用打分模型把用户分成不同的信用度等级，给不同的等级确定不同的月高额限制，超出限额的认为是潜在恶意欠费客户。

    +   2. 第二是建立恶意欠费客户的消费识别模型，如果某一客户的消费模式吻合欺诈消费模式，则认为是潜在恶意欠费客户。'
  merge: -1
  img_proc: true
- pgno: 419
  md: '# 4.2.5 甄别欺诈


    甄别欺诈策略分析类似优惠分析，建立在信用度管理的基础之上。


    +   - 分析防欺诈策略的相关变量：高额话费额度、欠费停机额度和用户具有不同的欠费停机额度等。


    +   - 指定防欺诈策略


    +   - 分析信用度、客户的满意程度、高额花费警告额度和停机额度之间的关系。根据分析结果调整用户的基本信息。


    +   - 分析信用度、客户的满意程度和用户催缴周期、催缴频率之间的关系。'
  merge: -1
  img_proc: true
- pgno: 420
  md: '# 4.2.6 预测


    预测主要指业务预测，是针对电信量发展的短期预测。它建立在对大量数据（业务资料数据、社会基础资料数据、市场调查资料、其他运营者资料数据）统计分析的基础上，通过模型运算、统计分析等数据处理手段，完成对电信业务的业务发展、用户需求数量、用户分布、市场占有率等几方面的预测分析。'
  merge: -1
  img_proc: true
