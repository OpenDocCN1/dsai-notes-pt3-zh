- pgno: 224
  md: '# 2.4.2 OLAP的分类


    +   - 根据对数据的组织方式的不同，OLAP分为两种：

    +     基于多维数据库的OLAP (MD-OLAP)

    +     基于关系数据库的OLAP (ROLAP)

    +     前者响应速度快、执行效率高，但源于结构的局限，灵活性不高。

    +     与之相比，后者由于建立在大量现有数据库（数据仓库）的基础上，灵活性、扩展性要高的多，并且支持大数据量和较多维数的能力也要强于前者。因此，虽然在响应速度、执行效率上差一点，仍然得到了广泛应用。现有的OLAP工具大多基于后者。'
