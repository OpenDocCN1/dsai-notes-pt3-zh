- pgno: 263
  md: '# 3.1.2.2 K均值算法


    +   - 优势

    +     （1）算法简单；

    +     （2）执行和收敛过程相对较快，是一种常见的聚类算法。

    +   - 局限性

    +     （1）必须事先知道聚类数；

    +     （2）算法要求簇是密集的、簇和簇之间的差异比较大；

    +     （3）数据集的平均值的计算必须有适当的定义；

    +     （4）不能用于非凸面的聚类；

    +     （5）对于某些孤立数据和“噪声”点敏感等。'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# 3.1.2.3 K中心点算法


    +   - k-中心点算法是对k-均值的改进

    +   - 主要的改进


    不采用簇中对象的平均值作为参照点，选用簇中位置最中心的对象，即中心点。这样的划分方法依然是基于最小化所有对象与其参照点之间的相异度之和的原则来执行的。'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# 3.1.2.3 K中心点算法


    +   - 基本思想


    首先为每个簇随机的赋一个样本做中心点，将剩余的点依照距离的远近分配给最近的簇；随后用其它的非中心点数据做中心点，并查看聚类情况。如果替换的聚类总代价小于零，那么就执行替换直到中心点不再发生变化，也就是说达到代价最小值时停止算法。'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# 3.1.2.3 K中心点算法


    输入：簇的个数k，包含n个样本的数据集


    输出：各样本属于k个簇的信息


    算法步骤：


    +   1) 随机选择k个样本作为初始中心点；

    +   2) repeat

    +   3) 将非中心点的数据依照与各中心点的距离划分到最近的簇中；

    +   4) 随机的在非中心点中选择一个样本；

    +   5) 计算使用该点做中心点来代替原中心点的代价；

    +   6) if <0 then 用该点替换原中心点，形成新的簇集合

    +   7) until 中心点不再发生变化'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# 3.1.2.4 C均值算法


    +   1. 选取聚类块数 $k$

    +   2. 从训练集中任意选定 $k$ 个向量 $c_1,c_2,\cdots,c_k$ 作为聚类中心

    +   3. 将每个样本向量（$n$ 为输入向量维数），按下列欧氏距离公式，归入中心为 $c_i$ 的类中。

    +   4. 重新调整聚类中心。对于 $c_{im}$，其中 $m=1,2,3,\cdots,k$，由下式计算得出：

    +      $$c_{im}=\frac{\sum_{x_l\in cluster_i}x_{lm}}{N_i}$$

    +      其中 $N_i$ 是第 $i$ 个聚类块中的向量数，$i=1,2,3,\cdots,k$。

    +   5. 如果步骤4中的聚类中心不再变化，则终止。否则，转至步骤3。


    ![](img/97ec20d772baf04740a42252ab8f47d8_267_0.png)'
  merge: -1
  img_proc: true
