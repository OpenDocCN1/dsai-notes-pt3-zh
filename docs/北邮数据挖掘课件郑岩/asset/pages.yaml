- pgno: 158
  md: '# ETL流程—数据转换


    +   - **数据转换**

    +     将抽取出的数据进行过滤、合并、解码、翻译等转换，为数据仓库创建有效数据的过程。

    +   - 一旦数据抽取或选取过程完成，就要设计并确定转换规则（Business Rules）应用于已抽取出的数据

    +   - 转换过程需要理解业务侧重点（Business Focus）、信息需求（Informational Needs）和目前可用的源数据（Available
    Sources）。'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# ETL流程—数据转换


    +   - 转换规则

    +     - 字段级的

    +       - 数据类型转换

    +       - 增加“上下文”数据 如，时间戳

    +       - 解码（Decoding）如，将数值型的地域编码替换成地域名称

    +     - 清洁和净化

    +       - 保留字段具有特定值或特定范围的记录

    +       - 引用完整性检查

    +       - 去除重复记录'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# ETL流程—数据转换


    +   - 转换规则(续)

    +     - 多数据源整合

    +       - 字段映射（Mapping）

    +       - 代码变换（Transposing）—将不同数据源中的数据值规范成数据仓库数据值。例如，将原系统非英文编码转换成数据仓库英文编码；将原系统信息编码转换成数据仓库信息编码等。

    +       - 合并（Merging）—将两个或更多个源系统记录合并为一个输出或“目标”记录

    +       - 派生（Derivations）—根据源数据，利用数学公式产生数据仓库需要的数据。例如，由身份证号码计算出出生日期、性别、年龄等。

    +     - 聚合(Aggregation)和汇总(Summarization)

    +       - Detail > light agg/sum > levels of rollups > more agg/sum'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# ETL流程—数据清洁


    数据仓库中必须存放“优质数据”（Quality Data）——符合一致性的、大家公认或经过验证是有价值的，并符合元数据定义的。清洁功能能够检测出那些违反规则的数据，一旦发现要么抛弃，要么将其转换成“清洁”数据，使其符合规则，然后装载到数据仓库中。'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# ETL流程—数据清洁


    来自操作型数据源的数据如果含有不洁的成分和不规范的格式，将对数据仓库的建立维护，特别是对联机分析处理的使用，造成很多问题和麻烦。这时必须在ETL处理过程中加以解决，通常包括以下处理方法：


    +   a. 设计拼写检查、分类并与标准值表对照检查

    +   b. 处理名字和地址

    +   c. 为名字和地址建立辅助表格或联机字典，据此进行检查修正

    +   d. 数据转换函数以及子程序库'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# ETL流程—数据清洁


    +   - “脏”数据（Dirty Data）

    +     - 数据不符合一致性

    +     - 用数据库设计工具定义Checks, Validation Criteria, Integrity Constrains

    +     - 数据库设计者不是很清楚DBMS

    +     - 删除了“约束”，因为它们会降低操作性能

    +     - 使用一些特定代码、标志或“哑元”(Dummy values)

    +     - 多目标域（Fields）—某域依赖其他域，但不一致

    +     - ……'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# ETL流程—数据清洁


    +   - “脏”数据的清洁包括三个层次：

    +     - 数据源、应用层的数据清洁（实现起来困难）

    +     - 整合与转换层的数据清洁

    +       - 元素化—剖析成原子数据

    +       - 标准化每个元素值的表达

    +       - 验证标准化后的元素值是否满足一致性

    +     - 数据仓库内部的数据清洁


    通常，上述三种方式联合使用，以获得高效性。'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# ETL流程—数据清洁


    +   - 保障数据清洁顺利进行的原则

    +     首先，对数据清洁流程进行分析和系统化的设计，

    +     其次，针对数据的主要问题和特征，设计一系列数据对照表和数据清洗程序库。

    +     两者的有效组合，可以面对不断变化的、形形色色的数据清洁问题。'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# ETL流程—数据清洁


    +   数据清洁的过程


    +   (1) 预处理：对于大的数据加载文件（特别是新的文件和数据集体）进行预先诊断和检测，不能贸然加载。有时需要临时编写诊断小程序，称作“小狗”，它会用鼻子闻一闻这个庞然大物（不知底细的文件），以进行卫生检查；


    +   (2) 标准化处理：应用建于数据仓库内部的标准字典，对于地区名、人名、公司名、产品名、品类名进行标准化处理；


    +   (3) 查重：应用各种数据查询手段，避免引入重复数据；


    +   (4) 出错处理和修正：将出错的记录和数据写入到日志文件，留待进一步处理。'
  merge: -1
  img_proc: true
