  md: '# 数据仓库模型的设计——粒度的确定


    +   双重粒度


    呼叫／计费数据是电信公司中数据量最大的部分，对于一个客户的一次通话（无论是主叫还是被叫，因为一次通话实际上将生成主叫、被叫两条记录）；在呼叫表中都将出现一个通话记录，因此对于一个大型电信公司，其呼叫／计费数据的数据量非常大，所以采用双重粒度来记载呼叫／计费数据。


