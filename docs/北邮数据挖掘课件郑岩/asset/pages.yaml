- pgno: 70
  md: "# 1.6 实现流程\n\n+   - 知识运用\n+   \n+     发现知识是为了运用，如何使知识能被运用也是KDD的步骤之一。运用知识有两种方法：一种是只需看知识本身所描述的关系或结果，就可以对决策提供支持；另一种是要求对新的数据运用知识，由此可能产生新的问题，而需要对知识做进一步的优化。\n\
    +   \n+     KDD过程可能需要多次的循环反复，每一个步骤一旦与预期目标不符，都要回到前面的步骤，重新调整，重新执行。"
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 1.6 实现流程


    数据挖掘过程的分步实现，不同的步骤需要不同的专业人员参与完成，大体分为三类：


    +   1) 业务分析人员：要求精通业务，能够解释业务对象，并根据各业务对象确定出用于数据定义和挖掘算法的业务需求。

    +   2) 数据分析人员：精通数据分析技术，并对统计学有较熟练的掌握，有能力把业务需求转化为数据挖掘的各步操作，并为每步操作选择合适的技术。

    +   3) 数据管理人员：精通数据管理技术，并从数据库或数据仓库中收集数据。'
