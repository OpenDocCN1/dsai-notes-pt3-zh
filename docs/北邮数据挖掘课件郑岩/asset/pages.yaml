- pgno: 275
  md: '# 3.2.1 概述


    # 常见的分类方法


    +   - 决策树分类


    决策树归纳是一种经典的分类算法。它采用自顶向下、递归的、各个击破的方式构造决策树。树的每一个结点上使用信息增益度量选择属性，可以从所生成的决策树中提取出分类规则。'
  merge: -1
  img_proc: true
- pgno: 276
  md: "# 3.2.1 概述\n\n+   - **KNN分类**\n+   \n+   即K最近邻法，最初由Cover和Hart于1968年提出的，是一个理论上比较成熟的方法。该方法的思路非常简单直观：如果一个样本在特征空间中的k个最相似（即特征空间中最邻近）样本中的大多数属于某一个类别，则该样本也属于这个类别。该方法在分类决策上只依据最邻近的一个或者几个样本的类别来决定待分类样本所属的类别。\n\
    +   \n+   该算法较适用于样本容量比较大的类域的自动分类，而那些样本容量较小的类域采用这种算法比较容易产生误分。"
  merge: -1
  img_proc: true
- pgno: 277
  md: '# 3.2.1 概述


    +   - SVM分类方法


    即支持向量机（Support Vector Machine）法，由Vapnik等人于1995年提出，具有相对优良的性能指标。该方法是建立在统计学习理论基础上的机器学习方法。通过学习，SVM可以自动寻找出那些对分类有较好区分能力的支持向量，由此构造出的分类器可以最大化类与类的间隔，因而有较好的适应能力和较高的分淮率。该方法只需要由各类域的边界样本的类别来决定最后的分类结果。


    SVM法对小样本情况下的自动分类有着较好的分类结果。'
  merge: -1
  img_proc: true
- pgno: 278
  md: "# 3.2.1 概述\n\n+   - VSM分类方法\n+   \n+     即向量空间模型（Vector Space Model）法，由Salton等人于60年代末提出。这是最早也是最著名的信息检索方面的数学模型。其基本思想是将文档表示为加权的特征向量：D=D(T1,\
    \ W1; T2, W2; ...; Tn, Wn)，然后通过计算文本相似度的方法来确定待分类样本的类别。当文本被表示为空间向量模型的时候，文本的相似度就可以借助特征向量之间的内积来表示。\n\
    +   \n+     VSM法相对其他分类方法而言，更适合于专业文献的分类。"
  merge: -1
  img_proc: true
- pgno: 279
  md: '# 3.2.2.1 决策树算法


    决策树分类是用属性值对样本集逐级划分，直到一个节点仅含有同一类的样本为止。


    决策树首先起源于Hunt等人提出的概念学习系统（Concept Learning System, CLS），然后发展到Quinlan的ID3算法，最后演化为能处理连续属性值的C45算法。'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# 3.2.2.1 决策树算法


    +   - 决策树的输入

    +     一组带有类别标记的样本

    +   - 决策树的输出

    +     一棵二叉或多叉树。

    +     二叉树的内部节点（非叶子节点）一般表示为一个逻辑判断，如形式为(ai=vi)的逻辑判断，其中ai是属性，vi是该属性的某个属性值；树的边是逻辑判断的分支结果。

    +     多叉树（ID3）的内部节点是属性，边是该属性的所有取值，有几个属性值，就有几条边。树的叶子节点则是类别标记。'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# 3.2.2.1 决策树算法


    # 决策树的构造


    采用自上而下的递归构造。

    以多叉树为例，其构造思路是：如果训练样本集中所有样本是同类的，则将它作为叶子节点，节点内容即是该类别标记；否则，根据某种策略选择一个属性，按照属性的不同取值，将样本集划分为若干子集，使得每个子集上的所有样本在该属性上具有同样的属性值。然后再依次处理各个子集。实际上就是“分而治之”（divide-and-conquer）的策略。二叉树同理，差别仅在于要选择一个好的逻辑判断。'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# 3.2.2.1 决策树算法


    # 决策树构造的条件


    构造好的决策树的关键是：如何选择好的逻辑判断或属性。对于同样一组样本，可以有很多决策树能符合这组样本。研究表明，一般情况下，树越小则树的预测能力越强。要构造尽可能小的决策树，关键在于选择恰当的逻辑判断或属性。由于构造最小的树是NP问题，因此只能采用启发式策略选择好的逻辑判断或属性。'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# 3.2.2.1 决策树算法


    实际中，用于模型学习的训练数据往往不是完美的，原因是：


    +   ① 某些属性字段上缺值（missing values）；

    +   ② 缺少必需的数据而造成数据不完整；

    +   ③ 数据不准确含有噪声甚至是错误的。


    此时，需要克服噪声和决策树剪枝。'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# 3.2.2.1 决策树算法


    基本的决策树构造算法没有考虑噪声，生成的决策树完全与训练样本拟合。在有噪声的情况下，完全拟合将导致过分拟合（overfitting），即对训练数据的完全拟合反而不具有很好的预测性能。'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# 3.2.2.1 决策树算法


    +   - **剪枝技术**

    +     是一种克服噪声的技术，同时它也能使树得到简化而变得更容易理解。

    +   - **剪枝的类型**

    +     - 向前剪枝（forward pruning）在生成树的同时决定是继续对不纯的训练子集进行划分还是停机。

    +     - 向后剪枝（backward pruning）是一种两阶段法：拟合-化简（fitting-and-simplifying），首先生成与训练数据完全拟合的一棵决策树，然后从树的叶子开始剪枝，逐步向根的方向剪。'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# 3.2.2.1 决策树算法


    +   - **剪枝的局限性**


    剪枝并不是对所有的数据集都好，就像最小树并不是最好（具有最大的预测率）的树。当数据稀疏时，要防止过分剪枝（over-pruning）。从某种意义上而言，剪枝也是一种偏向（bias），对有些数据效果好而有些数据则效果差。'
  merge: -1
  img_proc: true
