- pgno: 221
  md: '# 2.4.1 OLAP的定义和特点


    # OLAP与数据挖掘的比较


    +   - **相同之处**

    +     - OLAP与DM都是数据库（数据仓库）上的分析工具；


    +   - **不同之处**

    +     - （1）在实际应用中各有侧重。前者是验证型的，后者是挖掘型的；

    +     - （2）前者建立在多维视图的基础之上，强调执行效率和对用户请求命令的及时响应，而且其直接数据源一般是数据仓库；后者建立在各种数据源的基础上，重在发现隐藏在数据深层次的对人们有用的模式，一般并不过多考虑执行效率和响应速度。'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# 2.4.1 OLAP的定义和特点


    # OLAP与数据挖掘的比较


    （3）数据挖掘与OLAP不同，主要体现在它分析数据的深入和分析过程的自动化，自动化的含义是其分析过程不需要客户的参与，这是它的优点，也正是其不足。因为在实际中，客户也希望参与到挖掘中来，例如只想对数据的某一子集进行挖掘，对不同抽取、集成水平的数据进行挖掘，或者是根据自己的需要动态选择挖掘算法等等。


    因此，OLAP与数据挖掘各有所长。'
