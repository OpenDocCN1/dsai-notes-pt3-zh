- pgno: 19
  md: '# How does it work?


    +   - Data mining algorithms analyse the data

    +   - Numerous types of algorithms for analysis

    +     - inferring rules from the data

    +     - looking for patterns or associations within the data

    +   - Data for known examples – training data

    +   - Results derived from analysis can be used on new data – test data – to generate...

    +     - decision trees

    +     - classifications

    +     - predictions'
  merge: -1
  img_proc: true
- pgno: 20
  md: "# More than just statistics\n\n+   - Data mining\n+     - mixture of mathematics,\
    \ logic, statistics, artificial intelligence\n+   - For example - algorithm for\
    \ simple classification rules...\n\n```\nfor each attribute,\nfor each value of\
    \ that attribute, make a rule as follows:\n    count how often each class appears\
    \ maths\n    find the most frequent class stats\n    make a rule that assigns\
    \ that class to this attribute-value AI\n    calculate the error rate of the rules\
    \ stats\n    choose the rules with the smallest error rate logic\n```"
  merge: -1
  img_proc: true
