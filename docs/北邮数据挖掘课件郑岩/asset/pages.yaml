- pgno: 375
  md: '# 4.1 CRM与ERP


    +   - ERP


    ERP（Enterprise Resource Planning，即企业资源规划），是前几年国内外兴起的一种企业运作管理软件，它的侧重点是对企业内部的业务流程以及企业的资源进行管理。解决的是企业内部各环节的协调问题，如财务、生产、采购和仓储等部门间的协调关系。'
  merge: -1
  img_proc: true
- pgno: 376
  md: "# 4.1 CRM与ERP\n\n+   - ERP与CRM两者的关系\n+   \n+     同样作为现代企业的管理软件，ERP与CRM在企业运营过程中，处于不同的位置，担任不同的角色。一个面向后台，一个面向前台。一个保证企业生产出更高质量的产品，而另一个帮助企业理顺与客户的关系，向客户提供最好的服务。这是企业在激烈的市场竞争保证胜利的不可或缺的两个环节。"
  merge: -1
  img_proc: true
- pgno: 377
