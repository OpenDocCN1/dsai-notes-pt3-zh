- pgno: 305
  md: '# 神经网络的拓扑结构


    神经网络训练之前，需要设计网络拓扑结构。设计网络拓扑的关键是，确定隐层的神经元个数及各神经元初始权值和阈值（偏差）。理论上讲，隐层的神经元数越多，逼近越精确。但实际上，隐层神经元数不宜过多；否则会极大加长训练时间，并造成网络容错能力下降。经训练后的神经网络若其准确性不能被接受，则必须重新进行拓扑设计或改用不同的初始权值和阈值（偏差）。'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# 神经网络的训练


    +   - 训练的终止条件

    +     - 获得一组权重值，使得训练集中几乎所有样本都分类正确

    +   - 训练步骤

    +     - 利用随机值对权值进行初始化

    +     - 将训练样本逐一地输入给神经网络，进行训练

    +     - 对于每个神经元

    +       - 将其所有的输入值进行线性求和计算得到总的输入

    +       - 利用激励函数计算其输出值

    +       - 计算误差

    +       - 修正网络权值和阈值（偏差）'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# BP神经网络


    BP神经网络通过迭代处理一组训练样本，将各样本的网络预测与实际已知类标号进行比较实现学习训练，反向修改网络的权值，使得网络预测与实际类之间的误差平方最小。BP神经网络按照最优训练准则反复迭代，确定并不断调整神经网络结构，通过迭代修改，当误差收敛时学习过程终止。


    因此，具有分类准确、收敛性好、动态性好和鲁棒性强等优点。'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# BP神经网络存在的问题


    +   - 收敛速度问题

    +     BP分类器最大的弱点是其训练速度非常缓慢，难以收敛。尤其是当网络的训练达到一定程度后，收敛更为缓慢。

    +   - 局部极小点问题

    +     BP算法采用的是梯度下降法，对一个复杂的网络而言，其误差曲面是一个高维空间中的曲面，其中分布着许多局部极小点，一旦陷入了局部极小点则算法很难逃离出来。'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# BP神经网络存在的问题


    +   - 网络瘫痪问题


    在训练过程中，权值可能变得很大，这会使神经元的网络输入变得更大，从而使得其激励函数的一阶导函数在此点上的取值很小。此时的训练步长会变得非常小，最终导致网络停止收敛，这种现象即是所谓的网络瘫痪现象。'
  merge: -1
  img_proc: true
