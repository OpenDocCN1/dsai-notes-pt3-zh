- pgno: 478
  md: '# Classifying


    +   - Classifying

    +     - algorithms


    | 分类方法 | 说明 |

    |---|---|

    | rudimentary rules | 1R – one level decision tree – just using best first-level
    rules |

    | statistical modelling | Naive Bayes - uses prior probability of class combined
    with instance probability – assumes attributes are independent |

    | decision trees | ID3 / C4.5 decision tree induction – information gain or gain
    ratio calculated at each node to decide which branch to go down – maximise the
    separation of classes |

    | covering rules | rules found to cover all instances of each class – attribute-value
    pair to maximise the classification rule – PRISM method |

    | association rules | looking for item sets with high coverage and specified minimum
    confidence – works for nominal values – Apriori algorithm |

    | linear models | numeric prediction – linear regression to minimise difference
    between actual and predicted values |

    | instance-based learning | Euclidean distance of attribute sets found to calculate
    the nearest neighbour algorithm – filtering k-nearest matches |'
  merge: -1
  img_proc: true
