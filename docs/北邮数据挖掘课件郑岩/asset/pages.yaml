- pgno: 45
  md: '# 1.3 基本概念


    +   - 信息

    +     是事物运动的状态和状态变化的方式。

    +   - 数据

    +     指一个有关事实F的集合（如学生档案数据库中有关于学生基本情况的各条记录），用来描述事物有关方面的信息。一般而言，这些数据都是准确无误的。

    +     数据可能存储在数据库、数据仓库和其他信息资料库中。'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 1.3 基本概念


    +   - 知识


    人们实践经验的结晶且为新的实践所证实的；是关于事物运动的状态和状态变化的规律；是对信息加工提炼所获得的抽象化产物。


    知识的形式可能是模式、关联、变化、异常以及其他有意义的结构。'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# 1.3 基本概念


    # 模式


    对于集合F中的数据，我们可以用语言L来描述其中数据的特性，得出一个表达式E，E所描述的数据是集合F的一个子集FE。只有当表达式E比列举所有FE中元素的描述方法更为简单时，我们才可称之为模式。如：“如果成绩在81-90之间，则成绩优良”可称为一个模式，而“如果成绩为81、82、83、84、85、86、87、88、89或90，则成绩优良”则不能称之为一个模式。'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# 1.4 主要功能


    # 1. 概念/类别描述（Concept/Class Description）


    概念/类别描述是指对数据集做一个简洁的总体性描述并/或描述它与某一对照数据集的差别。


    例1：我们收集移动电话费月消费额超出1000元的客户资料，然后利用数据挖掘进行分析，获得这类客户的总体性描述：35—50岁，有工作，月收入5000元以上，拥有良好的信用度…；'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# 1.4 主要功能


    例2：对比移动电话费月消费额超出1000元的客户群与移动电话费月消费额低于100元的客户群。


    利用数据挖掘可作出如下描述：移动电话月消费额超出1000元的客户80%以上年龄在35—50岁之间，且月收入5000元以上；而移动电话月消费额低于100元的客户60%以上要么年龄过大要么年龄过小，且月收入2000元以下。'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# 1.4 主要功能


    # 2. 关联分析（Association Analysis）


    从一个项目集中发现关联规则，该规则显示了给定数据集中经常一起出现的属性—值条件元组。


    例如：关联规则X=>Y所表达的含义是满足X的数据库元组很可能满足Y。关联分析在交易数据分析、支持定向市场、商品目录设计和其他业务决策等方面有着广泛的应用。'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# 1.4 主要功能


    # 3. 分类与估值（Classification and Estimation）


    分类指通过分析一个类别已知的数据集的特征来建立一组模型，该模型可用以预测类别未知的数据项的类别。该分类模型可以表现为多种形式：分类规则（IF-THEN），决策树或者数学公式，乃至神经网络。


    估值与分类类似，只不过它要预测的不是类别，而是一个连续的数值。'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# 1.4 主要功能


    # 4. 聚类分析（Clustering Analysis）


    聚类分析又称为“同质分组”或者“无监督的分类”，指把一组数据分成不同的“簇”，每簇中的数据相似而不同簇间的数据则距离较远。相似性可以由用户或者专家定义的距离函数加以度量。


    好的聚类方法应保证不同类间数据的相似性尽可能地小，而类内数据的相似性尽可能地大。'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# 1.4 主要功能


    # 5. 时间序列分析（Time-Series Analysis）


    时间序列分析即预测（Prediction），是指通过对大量时间序列数据的分析找到特定的规则和感兴趣的特性，包括搜索相似序列或者子序列，挖掘序列模式、周期性、趋势和偏差。预测的目的是对未来的情况作出估计。'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 1.4 主要功能


    # 6. 其它功能


    包括：偏差分析（Deviation Analysis）、孤立点分析（Outlier Analysis）等。


    随着数据挖掘技术的发展，可能还会继续出现新的数据挖掘功能。'
  merge: -1
  img_proc: true
