- pgno: 105
  md: '# 仓库管理器的具体功能


    +   - 检验各字段相互之间的关系与一致性

    +   - 将临时保在存储介质中的数据转换与合并，然后加载至数据仓库

    +   - 对数据仓库数据添加索引、视图、数据分区

    +   - 根据需要进行数据的标准化

    +   - 根据需要生成新的集合信息

