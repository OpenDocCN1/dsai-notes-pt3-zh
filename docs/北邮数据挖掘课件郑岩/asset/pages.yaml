  md: '# 2.3.1 电信领域数据仓库的设计


    # （2）数据仓库模型的设计—— ETL过程


    数据提取—转换—加载随着应用和系统环境的不同而具有不同的特点。一般而言，总包括下面的处理过程：


    +   a. 预处理


    正式开始作业之前的准备工作，包括清空工作区、检查过渡/准备区。如果需要直接访问操作型数据源系统时，要检查远程数据库服务器状态，并核对目标区数据加载状态，以核算出加载作业的参数，如加载数据的时间间隔和范围（24小时的数据，还是前3天的数据）。'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# 2.3.1 电信领域数据仓库的设计


    # （2）数据仓库模型的设计—— ETL过程


    +   b. 启动数据加载的批作业


    +   c. 因为维度表有事实表所参照的主键，所以要先完成对维表的加载，生成维表主键，并作为以后加载事实表所需要的外键。在加载维表中，有时要处理好缓慢变化的维的问题，并可能涉及到版本的处理问题。'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# 2.3.1 电信领域数据仓库的设计


    # （2）数据仓库模型的设计—— ETL过程


    +   d. 加载事实表


    这中间也涉及到键查找的问题，即从有关维表中找到相应的主键，并以此作事实表的外键。


    +   e. 事实表加载完成后，再对总计方阵体系进行刷新，以保障总计方阵与它的基础数据同步。


    +   f. 设计具有完善的出错处理机制和作业控制日志系统，用以监测和协调整个加载的过程。'
  merge: -1
  img_proc: true
