  md: "# CRM的应用\n\n+   - 发展客户\n+   \n+     每一个企业都希望能更快地发展新的客户，更多的客户意味着更大的市场占有率和更好的规模效益。数据挖掘技术可以帮助更准确地发现有价值的潜在客户，从而可以显著地降低发展新客户的成本，提高市场拓展的投入产出比（ROI）。"
