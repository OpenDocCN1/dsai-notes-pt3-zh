- pgno: 496
  md: '# 小结


    目前，虽然已经有了许多成熟的商业数据挖掘工具，但这些工具一般都是一个独立的系统，不容易与电信企业现业务支撑系统集成；而且由于数据挖掘技术本身的特点，一个通用的数据挖掘系统可能并不适用于电信企业。


    切实可行的办法是借鉴成熟的经验，结合自身特点开发专用数据挖掘系统。'
  merge: -1
  img_proc: true
