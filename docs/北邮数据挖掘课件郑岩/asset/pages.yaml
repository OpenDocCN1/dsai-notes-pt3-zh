- pgno: 289
  md: '# 3.2.2.2 CLS算法


    +   - CLS (Concept Learning System) 系统


    以一棵空决策树开始，并通过增加结点逐步求精，直到产生一棵能正确分类训练样本的决策树为止，是一个循环递归过程。设PN为已知训练子集，则：


    +   1 （1）如果PN中的所有样本均为正例，则生成一个YES结点并终止；如果PN中的所有样本均为反例，则生成一个NO结点并终止；否则，根据某种启发策略选择一个属性A，设A取值为
    v1，v2...vr，并生成新结点。


    +   2 （2）将PN中的样本根据其属性A的取值加以划分，生成r个子集记为PN1, PN2...PNr。


    +   （3）递归地应用该算法到每个子集PNi。'
  merge: -1
  img_proc: true
- pgno: 290
  md: "# 3.2.2.2 CLS算法\n\n+   - **CLS算法的局限性**\n+   \n+     分类属性的选择决定了算法的效率与所生成的决策树的繁简程度、预测效果。选择属性是决策树归纳算法的关键。\n\
    +   \n+     CLS算法可以产生所有可能的决策树，正确分类训练样本，并能选择最简单的决策树。但是属性选择的不确定性，在实际应用中往往受问题大小的限制。"
  merge: -1
  img_proc: true
- pgno: 291
  md: '# 3.2.2.3 ID3算法


    Quinlan提出的ID3算法，对CLS算法做出了改进。它的基本算法仍然来自于CLS，但使用熵来选择属性，效果非常理想。


