- pgno: 323
  md: '# 3.3.2 典型算法


    +   - AIS算法的主要思想


    其主要思想是一边扫描数据库，一边产生候选项集并累计支持度。具体地说，在对数据库进行第k次扫描时，候选项集是由第k−1次扫描所产生的边界集（frontier
    set）通过增加当前事务中的项得到，同时计算候选项集中元素的支持数，直到某次扫描所产生的边界集为空。


    缺点：生成的候选项集太大。'
  merge: -1
  img_proc: true
- pgno: 324
  md: "# 3.3.2 典型算法\n\n+   - **Apriori算法的主要思想**\n+   \n+     该算法利用了频繁项集所具有的任意频繁项集的子集都是频繁项集的这一性质对数据库进行多次扫描：第一次扫描得到频繁项集的集合\
    \ L₀，第 k 趟扫描前先利用上次扫描的结果项目集 Lₖ₋₁，产生候选 k 项集的集合 Cₖ，然后再通过扫描数据库确定 C 中每一个候选 k 项集的支持数，最后在该次扫描结束时求出频繁\
    \ k 项集的集合 Lₖ，算法的终止条件是 Cₖ 或 Lₖ 为空。\n+   \n+     优点：所产生的候选项集比 AIS 算法少得多，效率较高。事实上，它被视为关联规则挖掘最经典的算法，其他很多算法都是其变种或改进。"
  merge: -1
  img_proc: true
- pgno: 325
  md: '# 3.3.2 典型算法


    # SETM算法的主要思想


    该算法实际上也是A1S算法的变形。SETM把候选集的产生和累计分开，在一个线性存储结构里存储了所有候选集和相应的交易的标识符（TID）。每次扫描结束后，不再读取数据库，而是对TID进行排序并累计各个候选集的支持度。其思想是扫描候选集的编码（TID）来代替扫描数据库，实质上是把数据库中与支持有关的信息单独提取出来，构成一个较小但充分的TID库。这种做法大大减少了数据库访问的时间。


    缺点：候选项集过大。'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# 3.3.2 典型算法


    # DHP算法的主要思想


    该算法利用散列表（hash table）产生候选集，是对Apriori算法的直接改进。在遍历一次数据库得到候选k−1项集的支持度，得到频繁k−1项集后，DHP算法将每一个事务的可能的(k+1)−项集通过哈希规则形成散列表。散列表的每一栏包括所有通过散列规则映射到该栏中的项集的数目。根据结果的散列表，可以生成一个位向量，当散列表中对应的该栏中的数值大于或者等于最小支持时，对应的位置为1，否则为0。用该向量可以过滤掉下一次生成候选时所不必要的项集：如果候选项在向量中对应位的值为0，则舍弃。这对候选2−项集的产生尤其为有效，可以在第二次就大大减小候选集的规模。'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# DHP算法


    +   - 优点


    在某些场合，DHP算法的效率比 Apriori算法明显提高。'
  merge: -1
  img_proc: true
- pgno: 328
  md: "# 3.3.2 典型算法\n\n# • PARTITION算法的主要思想\n\n该算法主要针对大型数据库，包括两部分：\n\n+   (1) 将目标数据库分为n个互不相交的子数据库D1，…，Dn，每个Di（i=1，2，…，n）的大小都要能容纳在内存中。然后把每个Di，读入内存并按一般算法发现频繁项集Li。再把所有的Li合并为数据库D的潜在频繁项集PL\
    \ = ∪i Li；\n+   \n+   (2) 计算潜在频繁项集PL在D中的支持度，得出频繁项集L。"
  merge: -1
  img_proc: true
- pgno: 329
  md: '# 3.3.2 典型算法


    • Sampling算法的主要思想


    对数据库D进行随机抽样得到抽样事务数据库D′，先以小于指定的支持度（minsup）挖掘D′中的频繁项集L′，再在剩余的数据集D-D′中继续计算L′中各元素的支持数，最后再以minsup求出L。这在大多数情况下就可以求得所有的频繁项集，但是有时会漏掉一些。这时可以对D进行二次扫描以发现漏掉的频繁项集。


    优点：多数情况下只需对数据库扫描一次，最坏情况下也只需扫描两次。'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# 3.3.3 算法实现


    +   - **Apriori 算法的实现**

    +     1. 由候选项集（candidate itemset）产生频繁项集（frequent itemset）；

    +     2. 由频繁项集（frequent itemset）产生强关联规则（strong association rule）。'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# 3.3.3 算法实现


    +   - Apriori算法的基本流程


    使用逐层搜索的迭代方法，通过对数据库的多次扫描发现所有的频繁项集。在每一趟扫描中只考虑具有同一长度k(即为项集中所含项目的个数)的所有项集。算法的第一次扫描仅仅计算每个项目的具体支持度，以确定长度为1的频繁项集。在后继的每一次扫描中，首先使用在前一次获得的频繁项集Lk-1和Apriori-gen函数产生的候选项集q，接着扫描数据库，计算Ck中候选项的支持度，最后确定候选项集中哪些真正成为频繁项集。重复上述过程直到再也发现不了新的频繁项集为止。'
  merge: -1
  img_proc: true
