- pgno: 396
  md: '# 4.2.1 用户行为分析


    主要包括两方面的分析：


    +   - 群体分析

    +     利用聚类或分类算法，将企业客户根据某种规则分为若干群体。

    +   - 行为分析（又称倾向建模）

    +     根据客户以前的消费行为，分析某几类有显著特征的行为模式，并据此对客户未来的行为进行预测。'
