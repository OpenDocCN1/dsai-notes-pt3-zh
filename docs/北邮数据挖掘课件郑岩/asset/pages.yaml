- pgno: 242
  md: '# CHAMELEON算法


    +   - CHAMELEON算法是由G. Karypis, E.H. Han 和 V. Kumar在1999年提出的一种动态层次聚类方法。

    +   - 基于动态模型计算相似性

    +     只有当两个类之间的相似性高于类内对象的相似性时合并两个类。

    +   - 本质上，是一个两阶段算法

    +     1. 首先，使用图分割算法将数据集划分为多个子集；

    +     2. 然后，使用层次聚类中的凝聚方法将这些子集进行反复的合并，直至获得最终的聚类结果。'
  merge: -1
  img_proc: true
