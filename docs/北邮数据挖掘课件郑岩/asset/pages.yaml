- pgno: 492
  md: '# Data format - header


    +   - Data format

    +     - files saved as Filename.arff

    +     - arff = attribute relation file format

    +   - Rows of data seperated by commas

    +   - Header information about attributes


    ```

    @relation weather-1

    @attribute outlook {sunny, overcast, rainy}

    @attribute temperature real

    @attribute humidity real

    @attribute windy {TRUE, FALSE}

    @attribute play {yes, no}

    @data

    ```'
  merge: -1
  img_proc: true
- pgno: 493
  md: '# Data format - data


    # Data format


    ```

    @data

    sunny,85,85,FALSE,no

    sunny,80,90,TRUE,no

    overcast,83,86,FALSE,yes

    rainy,70,96,FALSE,yes

    ...

    sunny,72,95,FALSE,no

    sunny,69,70,FALSE,yes

    rainy,75,80,FALSE,yes

    sunny,75,70,?,yes

    overcast,72,90,TRUE,yes

    overcast,81,75,FALSE,yes

    rainy,71,91,TRUE,no

    ```


    indicates start of data block


    attribute-values separated by commas


    missing values indicated by ''?''


    +   - data can be hundreds or thousands of lines

    +   - any number of attributes accommodated but...

    +   - mining algorithms just as effective on selected attributes...

    +   - so data analysis and preparation essential!'
  merge: -1
  img_proc: true
