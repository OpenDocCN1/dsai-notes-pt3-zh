- pgno: 174
  md: '# 2.2.8 ETL的实现方法


    +   - 远程抽取

    +     - ETL过程是在一个独立的远程平台上进行的。

    +     - 受数据源现有系统或目标仓库结构的影响最小。

    +     - 几乎不影响源和目标系统的CPU和容量。

    +     - 可能会提高成本；对网络带宽要求较高。


    +   - “Push”

    +     - 在现有系统环境中开展ETL过程

    +     - 当现有系统具有相当充裕的容量，而且不会超过CPU处理限度时，经常采用这种方法

    +     - 现有系统是同构的，经常采用这种方式'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# 2.2.8 ETL的实现方法


    +   - “Pull”（Collocation）

    +     - ETL过程在“仓库”端进行

    +     - 当现有系统是异构时，经常采用

    +     - 当“仓库”端平台具有必需的性能和容量时，会体现一定优势。

    +     - 由于“仓库”不断增长，可能需要制定长期策略


    +   - （1）高速装载：在内存中；通过本地文件系统通信；有限的输入/输出请求

    +   - （2）保留带宽：避免了访问网络，使得其它依赖于网络的应用不受任何影响。'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# 2.2.8 ETL的实现方法


    +   - 并行技术（Parallelism）

    +     - 多线程服务器端软件

    +     - 多处理器（SMP）

    +   - 数据堆装载（Data Bulk Load）

    +     - “堆”是最快的数据装载方式

    +     - 数据库中有堆装载器，ETL也支持该功能

    +     - 避免使用“插入”或“更新”操作，避免采用 ODBC'
  merge: -1
