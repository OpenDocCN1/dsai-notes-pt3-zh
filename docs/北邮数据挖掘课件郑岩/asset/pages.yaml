- pgno: 298
  md: '# 3.2.2.4 C45算法


    +   - C45算法


    C45属于一种归纳学习算法。归纳学习（Inductive Learning）旨在从大量经验数据中归纳抽取一般的判定规则和模式，它是机器学习（Machine
    Learning）中最核心、最成熟的一个分支。


    根据有无导师指导，归纳学习又分为有导师学习（Supervised Learning，又称为示例学习）和无导师学习（Unsupervised Learning）。


    C45属于有导师的学习算法。'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# 3.2.2.4 C45算法


    +   - 示例学习算法分为两大类：

    +     - 覆盖算法（covering algorithms）

    +     - 分治算法（divide-and-conquer algorithms）


    +   - 前者归纳生成规则，后者归纳生成决策树。'
  merge: -1
