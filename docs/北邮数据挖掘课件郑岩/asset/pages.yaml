- pgno: 216
  md: '# 2.4.1 OLAP的定义、特点


    +   - 60年代，关系数据库之父E. F. Codd提出了关系模型，促进了联机事务处理（OLTP）的发展(数据以表格的形式而非文件方式存储)。

    +   - 1993年，E. F. Codd提出了OLAP概念，认为OLTP已不能满足终端客户对数据库查询分析的需要，SQL对大型数据库的简单查询也不能满足终端客户分析的要求。客户的决策分析需要对关系数据库进行大量计算才能获得结果，而查询的结果并不能满足决策者提出的需求。因此，E.
    F. Codd提出了多维数据库和多维分析的概念，即OLAP。'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# 2.4.1 OLAP的定义、特点


    +   - OLAP (On-Line Analysis Processing) 定义

    +     是数据仓库上的分析展示工具，它建立在数据多维视图的基础上。

    +   - OLAP的主要特点

    +     一是在线性 (On Line)，体现为对用户请求的快速响应和交互式操作；

    +     二是多维分析 (Multi_Analysis)，这是OLAP技术的核心所在。'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# 2.4.1 OLAP的定义和特点


    整个数据（仓）库系统的工具层大致可以分为三类，或者说三个发展阶段：


    +   (1) 以MIS为代表的查询、报表类工具

    +   (2) 以OLAP为代表的验证型工具

    +   (3) 以及以DM为代表的挖掘型工具'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# 2.4.1 OLAP的定义和特点


    +   - OLAP与OLTP的区别


    （1）OLTP主要面向公司职员；OLAP则主要面向公司领导者。


    （2）OLTP应用主要是用来完成客户的事务处理，其数据基础是操作型数据库，如民航订票系统、银行储蓄系统等等，通常需要进行大量的更新操作，同时对响应时间要求较高；而OLAP是以数据仓库库或数据多维视图为基础的数据分析处理，是针对特定问题的联机数据访问和分析，它一般不对仓库数据作修改处理，而只是查询，其应用主要是对客户当前及历史数据进行分析，辅助领导决策，其典型的应用有对银行信用卡风险的分析与预测、公司市场营销策略的制定等，主要是进行大量的查询操作，对时间的要求不太严格。'
  merge: -1
  img_proc: true
