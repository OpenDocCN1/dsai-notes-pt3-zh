- pgno: 348
  md: '# 3.4.1 概述


    # 传统的预测方法


    +   - 趋势外推法

    +   - 时间序列法

    +   - 回归分析法等


    这些算法的原理简单，理论相对成熟，能用标准的技术来分析模型中的参数。'
  merge: -1
  img_proc: true
- pgno: 349
  md: "# 3.4.1 概述\n\n+   - 趋势外推法\n+   \n+     通常用描散点图的方法定性地确定变化趋势，再按照该变化趋势对未来情况作出预测，特点是不对其中的随机成分作统计处理。"
  merge: -1
  img_proc: true
- pgno: 350
  md: '# 3.4.1 概述


    +   - 时间序列法


    将因变量（预测目标）和自变量（影响预测目标的因素）均看成随机变量。实际问题中，多数预测目标的观测值构成的序列表现为（广义）平稳的随机序列或可以转化为平稳的随机序列。虽然在某一给定时刻预测目标的观测值是随机的，但从整个观测序列看，却呈现出某种随机过程（如平稳随机过程）的特性。随机时间序列方法正是依据这一规律性来建立和估计产生实际序列的随机过程的模型，然后用这些模型进行预测。'
  merge: -1
  img_proc: true
- pgno: 351
  md: "# 3.4.1 概述\n\n+   - 回归分析法\n+   \n+     假设同一个或多个独立变量存在相关关系，寻找相关关系的模型。不同于时间序列法的是：模型的因变量是随机变量，而自变量是可控变量。\n\
    +   \n+     分为线性回归和非线性回归。\n+   \n+     目前多用多元线性回归模型。"
  merge: -1
  img_proc: true
- pgno: 352
  md: '# 3.4.1 概述


    随着科学技术的迅速发展，预测理论也得到了长足的进步，出现了不少新的研究方法，综合起来主要包括：


    +   - 人工神经网络（ANN）预测方法

    +   - 专家系统预测方法

    +   - 模糊预测方法

    +   - 小波分析预测方法

    +   - 优选组合预测方法等'
  merge: -1
  img_proc: true
- pgno: 353
  md: '# 3.4.1 概述


    +   - 人工神经网络（ANN）预测方法


    目前应用最广泛的短期预测方法。它是一种通用的非线性自适应函数估计器，通过对研究目标的历史数据训练，建立起复杂的非线性映射模型。它不依赖于输入变量和预测目标之间明确的表达式，输入变量和预测目标之间的关系通过训练过程来形成，避免了建模过程的困难；另一显著特征是它的自适应算法，在每一时刻都可以选择新的训练样本来估计和调整系统参数，得到预测值。现在多采用误差反向传播（BP）算法和径向基函数（RBF）方法。但是，它的隐层神经元个数不易确定，易陷入局部最优点，需要大量训练样本且训练时间较长。'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# 3.4.1 概述


    +   - 专家系统预测方法


    基于知识建立起来的计算机系统，它拥有某个领域内专家们的知识和经验，能像专家们那样运用这些知识，通过推理作出决策。实践证明，专家系统预测不仅需要新技术的支持，同时也需要融入人类自身的经验和智慧。因此，需要专家系统的相关技术。但是，知识获取的“瓶颈”问题妨碍了专家系统的快速开发。'
  merge: -1
  img_proc: true
- pgno: 355
  md: "# 3.4.1 概述\n\n+   - 模糊预测方法\n+   \n+     建立在模糊数学理论上的一种预测新技术，模糊数学是用数学方法来研究和处理具有“模糊性”的现象。所谓模糊性主要是指有关事物差异的中间过渡中的不分明性，如温度值的“高与低”等，这些模糊现象很难明确划分其界限。"
  merge: -1
  img_proc: true
- pgno: 356
  md: '# 3.4.1 概述


    +   - 小波分析预测方法


    20世纪数学研究成果中最杰出的代表。它是一种时域—频域分析方法，在时域和频域上同时具有良好的局部化性质。'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# 3.4.1 概述


    +   - 优选组合预测方法（两种）

    +     一是指将几种预测方法所得预测结果，选取适当权重进行加权平均；

    +     二是指将几种预测方法进行比较，选择拟合优度最佳或标准离差最小的预测模型作为最优模型进行预测。


    组合预测方法是建立在信息利用最大化的基础上，它集结多种单一模型所包含的信息，进行最优组合。因此，在大多数情况下，通过组合预测可以达到改善预测结果的目的。'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# 3.4.2 典型算法


    +   - 线性回归　　Y = α + β X

    +     - 利用实际数据估计参数 α 和 β

    +     - 对已知值的 Y1, Y2, …, X1, X2, …. 进行最小平方运算

    +   - 多元回归　　Y = b0 + b1 X1 + b2 X2.

    +     - 很多非线性方程均可以转换为上述的形式

    +   - Log-linear 模型

    +     - The multi-way table of joint probabilities is approximated by a product
    of lower-order tables.

    +     - Probability: p(a, b, c, d) = αab βac χad δbcd'
  merge: -1
  img_proc: true
- pgno: 359
  md: '# 3.4.2 典型算法—Polynom


    +   - **Polynom算法**


    一个经典的多元回归算法。其原理如下：

    设 y 为预测目标变量，x₁，x₂，……xₚ 为 p 个影响目标的因素。假定它们满足公式：

    y = a₁x₁ + a₂x₂² + …… + aₚxₚᵖ，则可以根据已有的数据估算出系数 a₁，a₂，……aₚ 的变化，从而作出预测。'
  merge: -1
  img_proc: true
