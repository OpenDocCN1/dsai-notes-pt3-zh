- pgno: 108
  md: '# 2.1.3 数据仓库的数据模型


    数据模型是对现实世界的一种抽象，根据抽象程度的不同，可形成不同抽象层次上的数据模型。与数据库的数据模型相似，数据仓库的数据模型也分为三个层次：


    +   > 概念模型

    +   > 逻辑模型

    +   > 物理模型'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# 2.1.3 数据仓库的数据模型


    +   - 概念模型


    客观世界到计算机系统的一个中间层次，它最常用的表示方法是E-R法（实体-关系）。


    目前，数据仓库一般是建立在关系型数据库的基础之上，所以其概念模型与一般关系型数据库采用的概念模型相一致。'
  merge: -1
  img_proc: true
- pgno: 110
  md: "# 2.1.3 数据仓库的数据模型\n\n+   - 逻辑模型\n+   \n+   指数据的逻辑结构，如多维模型、关系模型、层次模型等。数据仓库的逻辑模型描述了数据仓库的主题的逻辑实现，即每个主题对应的模式定义。"
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 2.1.3 数据仓库的数据模型


    +   - 物理模型


    是逻辑模型的具体实现，如物理存取方式、数据存储结构、数据存放位置以及存储分配等。在设计数据仓库的物理模型时，需要考虑一些提高性能的技术，如表分区，建立索引等。'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# 2.1.3 数据仓库的数据模型


    目前，对数据仓库模型的讨论大多集中在逻辑模型，其中最常用的是多维模型。


    # ✓ 维


    人们观察数据的特定角度。例如，企业常常关心不同销售数据随时间的变化情况，所以时间就是一个维；


    # ✓ 维的层次


    人们观察数据的某个特定角度还可以存在细节程度不同的多个描述，这就是维的层次。一个维往往有多个层次，比如描述时间维时，可以从年份、季度、月份、天等不同层次来描述，那么年份、季度、月份和天就是时间维的层次；'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# 2.1.3 数据仓库的数据模型


    ✓ 维成员

    维的一个取值称为该维的一个成员。如果一个维是多层次的，那么该维的成员就是在不同层次取值的组合。例如时间维分为年、月和天三个层次则分别在其上各取一个值组合起来即得到日期维的一个成员，即“某年某月某日”；


    ✓ 度量

    描述了要分析的数值，例如话费、用户数量等；'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# 2.1.3 数据仓库的数据模型


    # ✓ 粒度


    粒度是指数据仓库的数据单位中保存数据的细化或综合程度的级别。细化程度越高，粒度级就越小；相反，细化程度越低，粒度级就越大。


    粒度深深地影响存放在数据仓库中数据量的大小，同时影响数据仓库所能回答的查询类型。


    在数据仓库中的数据粒度与查询的详细程度之间要做出权衡。'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# 2.1.3 数据仓库的数据模型


    当提高粒度级别时，数据所能回答查询的能力会随之降低。换言之，在一个很低的粒度级别上，几乎可以回答任何问题，但在高粒度级别上，数据所能处理的问题的数量是有限的。'
  merge: -1
  img_proc: true
- pgno: 116
  md: '例如：一个顾客一个月的每个电话的细节 每月40000个字节 每月200个记录


    例如：一个顾客一个月的电话综合 200个字节 每月1个记录


    +   活动记录

    +   日期

    +   时间

    +   被叫

    +   是否长途

    +   通话时间

    +   通话费用

    +   ……


    +   活动记录

    +   月

    +   累计时长

    +   累计次数

    +   累计费用

    +   ……


    左图是一个低粒度级，每个活动（在这里是一次电话）被详细记录下来，数据的格式如图所示。到月底每个顾客平均有200条记录（全月中每个电话都记录一次），因而总共需要40000个字节；


    右图的边是一个高粒度级。数据代表一位顾客一个月的综合信息，每位顾客一个月只有一个记录，这样的记录大约只需200个字节。'
  merge: -1
  img_proc: true
- pgno: 117
  md: '问题： “上星期某某顾客是否给某某人打了电话？”


    在低粒度级别上，完全可以回答这一问题，虽然这种回答将花费大量资源去查询大量的记录，但是问题结果是可以确定的。


    在高粒度级别上，则无法明确地回答这个问题。假如在数据仓库中存放的只是所打电话的总数，那么就无法确定其中是否有一个电话是打给某人的。'
  merge: -1
  img_proc: true
