    # # 第三讲 产生式表示法及应用


    “产生式”的概念由逻辑学家Post 1943年提出，他根据串替代规则提出了一种称为Post机的计算模型，模型中的每一条规则称为一个产生式。所以，产生式表示法又称为产生式规则表示法，但由于缺乏控制策略，不适合开发实际的应用系统。1972年，Newell和Simon在研究人类的认知模型中开发了基于规则的产生式系统。现在，产生式系统已经发展成为人工智能系统中最典型的一种基本结构，是专家系统及其他应用人工智能系统中最自然的知识表示及推理的基本模型。'
