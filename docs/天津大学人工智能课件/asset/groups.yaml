    - R₄: if family_size = small and heavy_pulling = yes then car = pickup\n- R₅:\
    \ if mileage = high or heavy_pulling = yes then workload = high\n- R₆: if mileage\
    \ = moderate and family_size = large then workload = high\n- R₇: if heavy_pulling\
    \ = no and mileage != high and (family_size = small or family_size = medium) then\
    \ workload = normal\n- R₈: if family_member < (4) then family_size = small\n-\
    \ R₉: if family_member < (6) then family_size = medium\n- R₁₀: if family_member\
    \ >= (6) then family_size = large\n\n综合数据库（WM）的初始内容为：\n\nWM = ( family_member\
    \ = (6)， budget = moderate， mileage = moderate， move_often = yes )\n\n## 二、反向推理\n\
    \n基本原理是从目标（作为假设）出发，反向使用规则求得已知事实。\n\n反向推理方式又称为目标驱动方式、自顶向下方式。\n\n例如 规则1：\\( P_1\
    \ \\rightarrow P_2 \\) 规则2：\\( P_2 \\rightarrow P_3 \\)\n\n规则3：\\( P_3 \\rightarrow\
    \ q_3 \\)\n\n应用反向推理方法，从 \\( P_1 \\) 出发推导出 \\( q_3 \\) 的过程如图所示：\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_106_0.png)\n\
    \n## 例 某产生式系统用于桌面出版系统配置咨询。\n\n规则库内容\n\n```\nR₁: if budget_considerations=ok and\
    \ hardware=found\n    then find-rec=ok\n\nR₂: if budget_ceiling=high or budget>1000\n\
    \    then budget_considerations=ok\n\nR₃: if hardware!=found\n    then find-rec!=ok\n\
    \nR₄: if find-rec!=ok\n    then advice=\"There's a problems with your configuration\"\
    \n\nR₅: if budget_considerations !=ok\n    then advice=\"Can't afford desktop\
    \ publishing“\n\nR₆: if printer=known and monitor=known and\n    computer=known\n\
    \    then hardware=found\n```\n\n初始目标是 find-rec\n\n综合数据库（WM）的初始内容：\n\nWM = (printer\
    \ = known， monitor = known， computer = known)\n\n系统进行反向推理。\n\n## 正反向推理策略的简要比较表：\n\
    \n| 正向推理 | 反向推理 |\n|---|---|\n| 数据驱动 | 目标驱动 |\n| 从一组数据出发向前推导结论 | 从可能的解答出发，向后推理验证解答\
    \ |\n| 从一个事件启动 | 由询问关于目标状态的一个问题而启动 |\n| 不能解释其推理过程 | 可解释其推理过程 |\n| 由底向上推理 | 由顶向下推理\
    \ |\n\n## 三、双向推理\n\n双向推理是一种既自顶向下又自底向上的推理。推理从两个方向同时进行，直至某个中间界面上两个方向结果相符便成功结束。\n\
    \n其控制策略比前两种方法都要复杂。\n\n## 第六节 对产生式系统的评价\n\n### 一、特点\n\n1. 具有丰富的知识表示能力，可以简单直观的规则方式表达人类的经验性知识。\n\
    \n2. 知识表达模块化、结构化，每条规则具有相同的格式且相对独立。规则的组合、修改、增、删比较容易，规则的收集、整理比较方便。\n\n3. 容易排除故障，当系统工作异常时，通过跟踪产生式规则的触发序列，就可容易地发现故障，为系统调试和维护提供便利条件。\n\
    \n4. 产生式系统的规则链接推理过程相似于人类求解问题时的逻辑思维过程，因此可把产生式系统用作人类行为的启发式模型，模拟人类的逻辑思维过程。\n\n5.\
    \ 推理方向的可逆性。由于产生式规则的前件和后件结构类似，可同时进行正向和反向推理，即混合推理，当解决复杂问题时，可提供有效的框架结构。\n\n### 二、适合场合\n\
    \n1. 知识结构类似于产生式规则的领域，如医疗诊断系统。其特点是领域知识比较零乱，由大量经验性的独立事实和规则组成。\n\n2. 领域知识中包含一系列相互独立的动作，可以自然地用产生式规则的后件来表达的领域，如医院的病人监护系统。\n\
    \n3. 领域知识可方便地从应用中分离出来的领域，如经典分类学等。\n\n### 三、缺陷\n\n1. 推理效率低\n\n2. 速度慢\n\n3. 实时性能差\n\
    \n4. 容易产生组合爆炸\n\n试验表明，产生式系统在匹配阶段所花费的时间大约为产生式系统工作周期的90%。而冲突消解及执行阶段所花费的时间大约占工作周期的10%。因此，以产生式系统为基础而建造的应用智能系统很难适应实时要求。改进匹配算法和并行处理等措施来提高其性能。\n\
    \n## 专家系统\n\n用户界面 亦称人机接口，完成信息的内部形式和人可接收的形式之间进行转换。\n\n推理机根据动态库的当前状态，利用知识库中的知识进行推理。\n\
    \n动态库是用来记录控制信息、中间假设和中间结果\n\n知识获取负责建立、修改与扩充知识库，对知识库的一致性、完整性等进行维护。\n\n知识库包括两部分内容。\n\
    · 与当前问题有关的数据信息；\n· 一般知识和领域知识。\n规则、网络和过程等形式表示。\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_115_0.png)\n\
    \n## 专家系统的开发过程\n\n专家系统是一个复杂的智能软件，与一般软件类似，但又有不同的特点。一般软件处理的对象是数值、文字、图形等信息，且有固定的算法序列，而专家系统软件处理的对象是以符号表示的知识，在运行过程中常有回溯发生，因此专家系统的开发过程与一般软件的开发有所不同。\n\
    \n专家系统的创始人费根鲍姆教授把开发专家系统的技术称之为知识工程，即以知识获取、知识表示、知识运用（推理）为中心。根据这个思想，可把专家系统的开发过程分为以下几个阶段。\n\
    \n### 1 问题定义与系统分析\n\n在着手开发一个专家系统时，首先应了解清楚用户的需求，确定欲解决的问题的范围（领域），系统所要达到的目标，系统功能，性能指标，输入输出，使用对象，人机接口形式，运行软硬件环境等。在此基础上进行系统可行性论证及经济效益或社会效益分析。最后写出系统工作的数据（信息）流程图，写出分析报告及有关文档。\n\
    \n### 2 知识获取\n\n知识获取阶段的主要工作是根据所确定的系统目标及限定的问题求解范围，收集专家知识。在当前的技术条件下主要是通过走访多个领域专家及现场技术人员，查阅国内外大量文献资料来收集、归纳、整理领域知识。\n\
    \n### 3 知识表示\n\n知识表示阶段的任务是根据领域知识的性质，选择一种或组合数种知识表示方法，如前面介绍过的谓词逻辑表示法，框架表示法，产生式系统表示法等，把获取到的专家知识逻辑地表达出来，并以适当的形式存储到计算机中。\n\
    \n"
