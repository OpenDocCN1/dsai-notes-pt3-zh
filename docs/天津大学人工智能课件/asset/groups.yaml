    \nCF(X|A,B)=CF(X|A)+CF(B)×CF(X,B)-CF(X|A)×CF(B)×CF(X,B)\n=0.46+0.5×0.6-0.46×0.5×0.6=0.622\n\
    \nCF(X|A,B,C)=0.698\n\n(2) CF(Y|X∧D)=CF₀(Y)+CF(X∧D)×CF(Y, X∧D)-CF₀(Y)×CF(X∧D)×CF(Y,\
    \ X∧D)\n=0.32\n\n### 例3　更新法求结论的可信度\n\n已知：规则可信度为\n\n- R1：A₁→B₁，CF(B₁,A₁)=0.8\n\
    - R2：A₂→B₁，CF(B₁,A₂)=0.5\n- R3：B₁∧A₃→B₂，CF(B₂,B₁∧A₃)=0.8\n\n初始证据A₁、A₂、A₃的CF值均设为1，而初始未知证据B₁、结论B₂的CF值均为0。求：(1)\
    \ CF(B₁)；(2) CF(B₂)。\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_197_0.png)\n\n\
    解：由已知可得：CF(A₁)=CF(A₂)=CF(A₃)=1，CF(B₁)=CF(B₂)=0\n\n(1) CF(B₁|A₁)=CF(B₁)+CF(A₁)×CF(B₁,A₁)-CF(B₁)×CF(A₁)×CF(B₁,A₁)\n\
    =0+1×0.8-0×1×0.8=0.8\n\nCF(B₁|A₁,A₂)=CF(B₁|A₁)+CF(A₂)×CF(B₁,A₂)-CF(B₁|A₁)×CF(A₂)×CF(B₁,A₂)\n\
    =0.8+1×0.5-0.8×1×0.5=0.9\n\nCF(B₁)=CF(B₁|A₁,A₂)=0.9\n\n(2) CF(B₂|B₁∧A₃)=CF(B₂)+CF(B₁∧A₃)×CF(B₂,B₁∧A₃)-CF(B₂)×CF(B₁∧A₃)×CF(B₂,B₁∧A₃)\n\
    =0+0.9×0.8-0×0.9×0.8=0.72\n\nCF(B₂)=CF(B₂|B₁∧A₃)=0.72\n\n**另解：**\n\n- $CF_1(B_1)=CF(B_1,A_1)\\\
    times\\max\\{0,CF(A_1)\\}=0.8\\times1=0.8$\n- $CF_2(B_1)=CF(B_1,A_2)\\times\\\
    max\\{0,CF(A_2)\\}=0.5\\times1=0.5$\n- $CF_{12}(B_1)=CF_1(B_1)+CF_2(B_1)-CF_1(B_1)\\\
    times CF_2(B_1)=0.8+0.5-0.8\\times0.5=0.9$\n- $CF(B_2)=CF(B_2,B_1\\land A_3)\\\
    times\\max\\{0,CF(B_1\\land A_3)\\}=CF(B_2,B_1\\land A_3)\\times\\max\\{0,\\min\\\
    {CF(B_1),CF(A_3)\\}\\}=0.8\\times0.9=0.72$\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_198_0.png)\n"
  mdcn: "\n## 二、不确定性的推理计算\n\n### 1 单条知识支持结论时，结论可信度的计算方法\n\n结论H的可信度因子CF(H)不仅取决于证据E的可信度CF(E)，而且还取决于知识的可信度CF(H,\
    \ E)。\n\n计算公式为：\n\n$$CF(H)=CF(H,E)\\times\\max\\{0,\\ CF(E)\\}$$\n\n### 2. 多条知识支持同一结论时，结论不确定性的合成计算\n\
    \n设有如下知识：\n\nIF E₁ THEN H (CF(H, E₁))\nIF E₂ THEN H (CF(H, E₂))\n\n则结论H的综合可信度CF₁₂(H)：\n\
    \n1. 分别计算每一条知识的CF₁(H)和CF₂(H)：\n\nCF₁(H)=CF(H, E₁) × max{0, CF(E₁)}\nCF₂(H)=CF(H,\
    \ E₂) × max{0, CF(E₂)}\n\n2. E₁与E₂对结论H的综合影响所形成的可信度CF₁₂(H)：\n\n$$\nCF_{12}(H)=\n\
    \\begin{cases}\nCF_1(H)+CF_2(H)-CF_1(H)\\times CF_2(H) & \\text{若 } CF_1(H)\\\
    ge 0 \\text{ 且 } CF_2(H)\\ge 0 \\\\\nCF_1(H)+CF_2(H)+CF_1(H)\\times CF_2(H) &\
    \ \\text{若 } CF_1(H)<0 \\text{ 且 } CF_2(H)<0 \\\\\n\\dfrac{CF_1(H)+CF_2(H)}{1-\\\
    min(|CF_1(H)|,|CF_2(H)|)} & \\text{其他}\n\\end{cases}\n$$\n\n### 3. 在已知结论原始可信度的情况下，结论可信度的更新计算\n\
    \n- 当 \\(0<\\mathrm{CF}(E)\\le 1\\) 时：\n\n$$\n\\mathrm{CF}(H\\mid E)=\n\\begin{cases}\n\
    \\mathrm{CF}(H)+\\mathrm{CF}(H,E)\\times\\mathrm{CF}(E)-\\mathrm{CF}(H)\\times\\\
    mathrm{CF}(H,E)\\times\\mathrm{CF}(E) & \\text{若 } \\mathrm{CF}(H)\\ge 0 \\text{\
    \ 且 } \\mathrm{CF}(H,E)\\ge 0 \\\\\n\\mathrm{CF}(H)+\\mathrm{CF}(H,E)\\times\\\
    mathrm{CF}(E)+\\mathrm{CF}(H)\\times\\mathrm{CF}(H,E)\\times\\mathrm{CF}(E) &\
    \ \\text{若 } \\mathrm{CF}(H)<0 \\text{ 且 } \\mathrm{CF}(H,E)<0 \\\\\n\\dfrac{\\\
    mathrm{CF}(H)+\\mathrm{CF}(H,E)\\times\\mathrm{CF}(E)}{1-\\min(|\\mathrm{CF}(H)|,|\\\
    mathrm{CF}(H,E)\\times\\mathrm{CF}(E)|)} & \\text{其他}\n\\end{cases}\n$$\n\n- 当\
    \ \\(\\mathrm{CF}(E)\\le 0\\) 时，规则 IF E THEN H 不可使用，对结论 H 的可信度无影响。\n\n### 例1 合成法求结论的可信度\n\
    \n设知识如下：\n\n- IF E₁ THEN H，CF(H,E₁)=0.9\n- IF E₂ THEN H，CF(H,E₂)=0.7\n- IF E₃\
    \ THEN H，CF(H,E₃)=-0.8\n- IF E₄∧E₅ THEN E₁，CF(E₁, E₄∧E₅)=0.7\n- IF E₆∧(E₇∨E₈)\
    \ THEN E₂，CF(E₂, E₆∧(E₇∨E₈))=1.0\n\n已知：CF(E₃)=0.3，CF(E₄)=0.9，CF(E₅)=0.6，CF(E₆)=0.7，CF(E₇)=0.3，CF(E₈)=0.8。\n\
    \n求：CF(H)\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_193_0.png)\n\nCF(E₃)=0.3，CF(E₄)=0.9，CF(E₅)=0.6，CF(E₆)=0.7，CF(E₇)=0.3，CF(E₈)=0.8。\n\
    \nCF(E₁)=0.7×max{0, CF(E₄∧E₅)}\n=0.7×max{0, min{CF(E₄), CF(E₅)}}\n=0.42\n\nCF₁(H)=0.9×max{0,\
    \ CF(E₁)}\n=0.38\n\nCF(E₂)=1×max{0, CF(E₆∧(E₇∨E₈))}\n=max{0, min{CF(E₆), max{CF(E₇),\
    \ CF(E₈)}}}\n=0.7\n\nCF₂(H)=0.7×max{0, CF(E₂)}\n=0.49\n\nCF₃(H)=-0.8×CF(E₃)=-0.24\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_194_0.png)\n\nCF₁(H)=0.38　CF₂(H)=0.49　CF₃(H)=-0.24\n\
    \n**➤ 合成计算**\n\n- CF₁(H)>0 且 CF₂(H)>0\n- CF₁₂(H)=CF₁(H)+CF₂(H)-CF₁(H)×CF₂(H)\n\
    \  =0.38+0.49-0.38×0.49\n  =0.6838\n\n又：CF₁₂(H)>0，CF₃(H)<0\n\n$$\nCF_{123}(H)=\\\
    frac{CF_{12}(H)+CF_3(H)}{1-\\min(|CF_{12}(H)|,|CF_3(H)|)}=0.58\n$$\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_195_0.png)\n\
    \n### 例2 更新法求结论的可信度\n\n已知：规则可信度为\n\n- R1: A→X，CF(X,A)=0.8\n- R2: B→X，CF(X,B)=0.6\n\
    - R3: C→X，CF(X,C)=0.4\n- R4: X∧D→Y，CF(Y, X∧D)=0.3\n\nCF(A)=CF(B)=CF(C)=CF(D)=0.5。\n\
    \nX、Y的初始可信度CF₀(X)=0.1，CF₀(Y)=0.2。\n\n求：(1) 结论X的可信度CF(X)；(0.698)　(2) 结论Y的可信度CF(Y)；(0.32)\n\
    \n解：\n\n(1) CF(X|A)=CF₀(X)+CF(A)×CF(X,A)-CF₀(X)×CF(A)×CF(X,A)\n=0.1+0.5×0.8-0.1×0.5×0.8=0.46\n\
    \nCF(X|A,B)=CF(X|A)+CF(B)×CF(X,B)-CF(X|A)×CF(B)×CF(X,B)\n=0.46+0.5×0.6-0.46×0.5×0.6=0.622\n\
    \nCF(X|A,B,C)=0.698\n\n(2) CF(Y|X∧D)=CF₀(Y)+CF(X∧D)×CF(Y, X∧D)-CF₀(Y)×CF(X∧D)×CF(Y,\
    \ X∧D)\n=0.32\n\n### 例3　更新法求结论的可信度\n\n已知：规则可信度为\n\n- R1：A₁→B₁，CF(B₁,A₁)=0.8\n\
    - R2：A₂→B₁，CF(B₁,A₂)=0.5\n- R3：B₁∧A₃→B₂，CF(B₂,B₁∧A₃)=0.8\n\n初始证据A₁、A₂、A₃的CF值均设为1，而初始未知证据B₁、结论B₂的CF值均为0。求：(1)\
    \ CF(B₁)；(2) CF(B₂)。\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_197_0.png)\n\n\
    解：由已知可得：CF(A₁)=CF(A₂)=CF(A₃)=1，CF(B₁)=CF(B₂)=0\n\n(1) CF(B₁|A₁)=CF(B₁)+CF(A₁)×CF(B₁,A₁)-CF(B₁)×CF(A₁)×CF(B₁,A₁)\n\
    =0+1×0.8-0×1×0.8=0.8\n\nCF(B₁|A₁,A₂)=CF(B₁|A₁)+CF(A₂)×CF(B₁,A₂)-CF(B₁|A₁)×CF(A₂)×CF(B₁,A₂)\n\
    =0.8+1×0.5-0.8×1×0.5=0.9\n\nCF(B₁)=CF(B₁|A₁,A₂)=0.9\n\n(2) CF(B₂|B₁∧A₃)=CF(B₂)+CF(B₁∧A₃)×CF(B₂,B₁∧A₃)-CF(B₂)×CF(B₁∧A₃)×CF(B₂,B₁∧A₃)\n\
    =0+0.9×0.8-0×0.9×0.8=0.72\n\nCF(B₂)=CF(B₂|B₁∧A₃)=0.72\n\n**另解：**\n\n- $CF_1(B_1)=CF(B_1,A_1)\\\
    times\\max\\{0,CF(A_1)\\}=0.8\\times1=0.8$\n- $CF_2(B_1)=CF(B_1,A_2)\\times\\\
    max\\{0,CF(A_2)\\}=0.5\\times1=0.5$\n- $CF_{12}(B_1)=CF_1(B_1)+CF_2(B_1)-CF_1(B_1)\\\
    times CF_2(B_1)=0.8+0.5-0.8\\times0.5=0.9$\n- $CF(B_2)=CF(B_2,B_1\\land A_3)\\\
    times\\max\\{0,CF(B_1\\land A_3)\\}=CF(B_2,B_1\\land A_3)\\times\\max\\{0,\\min\\\
