    # 七、研究领域及研究方向


    它是控制论、信息论、计算机科学、数理逻辑、神经生理学、心理学、语言学、思维科学、教育学等许多学科相互渗透而产生的；


    推理技术、搜索方法和机器定理证明；自然语言处理和机器翻译；自动程序设计；认知模型；知识获取方法；知识表示技术；感知问题；专家系统；机器人学；智能计算机系统结构和语言环境；博弈、绘画、作曲、智力游戏等。'
