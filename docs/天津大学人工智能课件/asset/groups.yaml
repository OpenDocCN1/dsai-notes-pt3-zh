    \ 302)  \nAt(zhang, 302)  \n\n把目标的否定用谓词公式表示如下：~(∃v)At(li, v)  \n把目标的否定化成子句式，并用重言式~At(li,v)∨At(li,v)替代\
    \  \n子句集：C(zhang, li)、~C(x,y)∨~At(x,u)∨At(y,u)、At(zhang, 302)、~At(li,v)∨At(li,v)\
    \  \n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_61_0.png)\n\n## WFF的基本等价式及推理规则现一并归纳于下：\n\
    \n1. **双重否定律**（否定之否定）  \n   ~(~P) ≡ P  \n\n2. **蕴含等价式**  \n   P(x) → Q(x) ≡ ~P(x)\
    \ ∨ Q(x)  \n\n3. **摩根定律**  \n   - ~(P(x) ∨ Q(x)) ≡ ~P(x) ∧ ~Q(x)  \n   - ~(P(x)\
    \ ∧ Q(x)) ≡ ~P(x) ∨ ~Q(x)  \n\n4. **逆否律**  \n   P(x) → Q(x) ≡ ~Q(x) → ~P(x)  \n\
    \n5. **分配律**  \n   - P(x) ∧ (Q(x) ∨ R(x)) ≡ (P(x) ∧ Q(x)) ∨ (P(x) ∧ R(x))  \n\
    \   - P(x) ∨ (Q(x) ∧ R(x)) ≡ (P(x) ∨ Q(x)) ∧ (P(x) ∨ R(x))  \n\n6. **交换律**  \n\
    \   - P(x) ∧ Q(x) ≡ Q(x) ∧ P(x)  \n   - P(x) ∨ Q(x) ≡ Q(x) ∨ P(x)  \n\n7. **结合律**\
    \  \n   - (P(x) ∧ Q(x)) ∧ R(x) ≡ P(x) ∧ (Q(x) ∧ R(x))  \n   - (P(x) ∨ R(x)) ∨\
    \ R(x) ≡ P(x) ∨ (Q(x) ∨ R(x))  \n\n## WFF的基本等价式及推理规则（续）：\n\n### 8 量词转换律\n\n∼(∀x)P(x)\
    \ ≡ (∃x)[∼P(x)]  \n∼(∃x)Q(x) ≡ (∀x)[∼Q(x)]\n\n### 9 易名规则\n\n(∀x)P(x) ≡ (∀y)P(y)\
    \  \n(∃x)P(x) ≡ (∃y)P(y)\n\n在一个量化的表达式中的约束变量是一类虚元，它可以用任何一个不在表达式中出现过的其它变量符号来代替。\n\
    \n### 10 量词分配律\n\n(∃x)[P(x) ∨ Q(x)] ≡ (∃x)P(x) ∨ (∃x)Q(x)  \n(∀x)[P(x) ∧ Q(x)]\
    \ ≡ (∀x)P(x) ∧ (∀x)Q(x)  \n(∀x)[P → Q(x)] ≡ P → (∀x)Q(x)  \n(∃x)[P → Q(x)] ≡ P\
    \ → (∃x)Q(x)\n\n### 11 量词辖域变换等价式\n\n(∀x)P(x) ∨ Q ≡ (∀x)[P(x) ∨ Q]  \n(∀x)P(x)\
    \ ∧ Q ≡ (∀x)[P(x) ∧ Q]  \n(∃x)P(x) ∨ Q ≡ (∃x)[P(x) ∨ Q]  \n(∃x)P(x) ∧ Q ≡ (∃x)[P(x)\
    \ ∧ Q]  \n（Q中不含变量）\n\n## WFF的基本等价式及推理规则（续）：\n\n### 12 量词消去及引入规则：\n\n- **全称量词消去规则**：\\\
    ( (\\forall x)P(x) \\equiv P(y) \\)  \n  它说明：如果个体域的所有元素具有性质 \\( P \\)，则个体域中的任一个元素具有性质\
