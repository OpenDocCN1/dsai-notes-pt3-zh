    \n- _S_: 状态集合。状态是某种事实的符号或数据。  \n  _S_<sub>0</sub>是问题的初始状态。  \n  _S<sub>k</sub>_={_S_<sub>_k_0</sub>,\
    \ _S_<sub>_k_1</sub>, ...}\n\n- _G_: 表示目标状态集。  \n  它可以是具体的状态，也可以是对某些状态性质的描述\n\n\
    - _O_是操作算子集(operator)，一个状态转化为另一个状态。  \n  状态空间的一个解是一个有限的操作算子序列，它使初始状态转化为目标状态： \
    \ \n  \\( S_0 \\xrightarrow{O_1} S_1 \\xrightarrow{O_2} S_2 \\xrightarrow{O_k}\
    \ \\cdots \\xrightarrow{} G \\)  \n  _O_<sub>1</sub>, ..., _O<sub>k</sub>_即为状态空间的一个解，解不一定是唯一的。\n\
    \n### 2. 状态空间可用有向图表示\n\n其节点表示状态，节点间的弧（有向）表示操作算子。\n\n### 状态空间法求解问题：\n\n- 将所要求的问题表示成状态空间\n\
    - 规定一组操作算子，能使状态从一个状态变为另一个状态\n- 决定一种搜索策略，能在状态空间中沿某条路径达到目标状态 →\n\n**搜索方法的效率将决定问题求解的效率。**\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_126_0.png)\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_127_0.png)\n\
    \n## 例 二阶梵塔问题\n\n要求把这两个金片全部移到另一根钢针上，而且规定每次只能移动一个金片，任何时刻都不能使大片位于小片的上面。\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_128_0.png)\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_128_1.png)\n\n### 二、问题归约法\n\n如果一个问题\\\
    (P\\)可以归约为一组子问题\\(P_1, P_2, \\dots, P_n\\)，并且只有当所有子问题\\(P_i(i=1,2,\\dots,n)\\\
    )都有解时原问题\\(P\\)才有解，任何一个子问题\\(P_i(i=1,2,\\dots,n)\\)无解都会导致原问题\\(P\\)无解，则称此种归约为问题的分解\n\
    \n如果一个问题\\(P\\)可以归约为一组子问题\\(P_1, P_2, \\dots, P_n\\)，并且这些子问题\\(P_i(i=1,2,\\dots,n)\\\
    )中只要有一个有解则原问题\\(P\\)就有解，只有当所有子问题\\(P_i(i=1,2,\\dots,n)\\)都无解时原问题\\(P\\)才无解，则称此种归约为问题的等价变换，简称变换，\n\
    \n- 一组将问题分解或变换成子问题的规则 \\(O\\)。\n- 一组本原问题的描述 \\(P\\)\n\n## 原问题：\n\n[(f_1(x) + f_2(x))dx]\n\
    \n转化\n\n子问题1 [f_1(x)dx]\n\n子问题2 [f_2(x)dx]\n\n转化\n\n子问题1 ...... 子问题2 子问题\n\n解\n\
    \n子问题独立\n\n## 1、问题归约的描述\n\n可用一个三元组（$S_0，O，P$）\n\n### 2、与或图表示\n\n由节点及$K$连接弧组成的图，称为与或图。\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_131_0.png)\n\n这种弧叫$K$连接弧，表示对问题A作用某个操作算子后产生$K$个子问题。$K$对应O，初始问题对应起始节点，原问题对应叶节点。\n\
    \n黑圆点表示可解节点  \n圆圈表示不可解节点\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_132_0.png)\n\
    \n与或图及其解图\n\n## 例 三阶栈塔问题\n\n\\((i, j, k)\\) 表示\\(C, B, A\\)所在的钢针号\n\n\\(S_0=(1,1,1)\\\
    )\n\\(G=(3,3,3)\\)\n\n原问题可分解为以下三个子问题：\n\n- \\((1, 1, 1) \\to (1, 2, 2)\\) 二阶栈塔\n\
    - \\((1, 2, 2) \\to (3, 2, 2)\\) 本原问题\n- \\((3, 2, 2) \\to (3, 3, 3)\\) 二阶栈塔\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_133_0.png)\n\n## 第二节 状态空间的盲目(无信息)搜索法\n\
    \n状态空间的搜索策略可分为盲目按索和启发式搜索两大类。尽管盲目搜索的性能不如启发式搜索，但由于启发式搜索需要抽取与问题本身有关的特征信息，而这种特征信息的抽取往往又比较困难，因此盲目搜索仍不失为一种有用的搜索策略。本节主要讨论状态空间的盲目搜索策略，\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_136_0.png)\n\n| 2 | 8 | 3 |\n|---|---|---|\n\
    | 1 | 6 | 4 |\n| 7 |   | 5 |\n\n### 二、深度优先搜索算法\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_137_0.png)\n\
    \n深度限定要取得适当扩展的节点数\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_137_1.png)\n\n#\
    \ S<sub>0</sub>\n\n| 1 | 2 | 8 | 3 |\n|---|---|---|---|\n| 1 | 6 | 4 |   |\n|\
    \ 7 |   | 5 |   |\n\n# S<sub>g</sub>\n\n2022-11-3\n\n16\n\n### 三、迭代加深\n\n能保证发现一个最小深度的目标节点\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_139_0.png)\n\n扩展的节点数\n\n### 四、代价树搜索\n\
    \n#### 1 代价树的广度优先搜索\n\n又称分枝界限法。它每次从Open表中选择节点或往Closed表中存放节点时，总是选择代价最小的节点。Open表中的节点总是按照其代价从小到大排列的，代价小的节点徘徊在前面，代价大的节点排在后面，与节点在树中的位置无关。\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_140_0.png)\n\n"
