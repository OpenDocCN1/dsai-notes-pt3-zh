    \n# 第六节 非单调推理\n\n## 单调推理\n\n新的命题可以加入系统，新的定理可以被证明，并且这种加入和证明绝不会导致前面已知的命题或已证明的命题变成无效。如谓词逻辑中的推理就是单调推理。\n\
