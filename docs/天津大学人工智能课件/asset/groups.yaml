    2 6 4\n1 7 5\n```\n\n（左、右、下）\n\n⑥ 向左移动：\n\n```\n8   3\n2 6 4\n1 7 5\n```\n\n同④，回溯到③。\n\
    \n⑦\n\n```\n8   3\n2 6 4\n1 7 5\n```\n\n已穷尽了所拥有的规则，回溯到⑥。（左、下）\n\n⑧ 向下移动：\n\n```\n\
    8 6 3\n2   4\n1 7 5\n```\n\n（左、上、右、下）\n\n向左移动：\n\n```\n8   3\n2 6 4\n1 7 5\n```\n\
    \n同⑤，回溯到⑦。\n\n向下移动：\n\n```\n8 3 4\n2 6  \n1 7 5\n```\n\n用了六条规则，未找到解，回到⑦。\n\n向下移动：\n\
    \n```\n8 6 3\n  2 4\n1 7 5\n```\n\n## 3.图搜索方式：\n\n图搜索方式就是用图结构记录下来，一直到得出解为止，也就是从隐含图中搜索出含有解路径的子图来。\n\
    \n## 三、产生式系统的推理\n\n### 1.正向推理\n\n正向推理是从已知事实出发，通过规则库求得结论，称为数据驱动方式，也称为自底向上的方式。\n\
    \n推理过程：\n\n- （1）规则集中的规则的前件与数据库中的事实进行匹配，得到匹配的规则集合；\n- （2）从匹配规则集合中选择一条规则作为使用规则；\n\
    - （3）执行使用规则，将该使用规则的后件送入数据库。重复这个过程直到达到目标。\n\n例如，在动物识别系统IDENTIFIER中，包含如下几个规则：\n\n\
    - 规则I2　如果　该动物能产乳，\n  　　　　那么　它是哺乳动物。\n\n- 规则I8　如果　该动物是哺乳动物，\n  　　　　　　　它反刍，\n  　　　　那么　它是有蹄动物而且是偶蹄动物。\n\
    \n- 规则I11　如果　该动物是有蹄动物，\n  　　　　　　　它有长颈，\n  　　　　　　　它有长腿，\n  　　　　　　　它的颜色是黄褐色，\n \
    \ 　　　　　　　它有深色斑点，\n  　　　　那么　它是长颈鹿。\n\n### 正向推理\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_305_0.png)\n\
    \n### 2.逆向推理\n\n逆向推理是从目标出发，逆向使用规则，求得已知事实。\n\n推理过程：\n\n- （1）规则集中的规则后件与目标事实进行匹配，得到匹配的规则集合；\n\
    - （2）从匹配规则集合中选择一条规则作为使用规则；\n- （3）将使用规则的前件作为子目标。\n\n重复这个过程直至子目标均为已知事实后成功结束。\n\n\
    例如，在动物识别系统中，为了识别一个动物，可以进行以下的逆向推理：\n\n- （1）假设这个动物是长颈鹿的话，为了检验这个假设，根据I11，要求这个动物是长颈，长腿且是有蹄动物；\n\
    - （2）假设全局数据库中已经有该动物是长腿、长颈等事实，还要验证“该动物是有蹄动物”，为此，规则I8要求该动物是“反刍”动物且是“哺乳动物”；\n- （3）要验证“该动物是哺乳动物”，根据规则I2，要求该动物是“产乳动物”；现已知该动物是“产乳”和“反刍”动物，即各个子目标都是已知事实，所以逆向推理成功，即“该动物是长颈鹿”假设成立。\n\
    \n### 3.双向推理\n\n双向推理又称正反向混合推理，即自顶向下，又自底向上，从两个方向作推理，直至某个中间界面上两方向结果相符便成功结束。\n\n\
    ## 四、产生式规则的选取\n\n### 1.匹配\n\n匹配方式：索引匹配、变量匹配、近似匹配、过滤匹配等。\n\n### 2.冲突解决\n\n例如，设在美式足球比赛中有两条规则：\n\
    \n- 规则R1：If 第四次开始进攻（Fourth down）且进攻方前三次进攻前进的距离少于10码（short yardage）then 可以在第四次进攻踢悬空球（punt）\n\
    - 规则R2：If 第四次开始进攻（Fourth down）且进攻方前三次进攻前进的距离少于10码（short yardage）且进攻位置在对方球门线30码之内（within\
    \ 30 yards）then 可以射门（field goal）\n\n### 3.操作\n\n执行规则的操作部分。\n\n## 五、产生式系统的特点\n\n\
    - 1. 表达直观自然，便于推理；\n- 2. 可进行模块化处理，格式清晰；\n- 3. 设计和检测方便，表示灵活；\n- 4. 求解效率低，无法表示结构性知识，不适用于求解复杂系统。\n"
