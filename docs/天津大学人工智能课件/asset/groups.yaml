    \  \n\n有一张木头做的方桌  \n\n2022-11-3 4\n\n### （二）连接词在语义网络中的表示方法\n\n#### 1. 合取\n\n语义网络从本质上讲，只能表示二元关系。因此当要用它表示多元关系时，把多元关系转化为二元关系的合取。\n\
