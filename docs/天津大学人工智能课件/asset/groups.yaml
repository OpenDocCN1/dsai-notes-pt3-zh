  md: "\n\n## 6. 知识表示\n\n知识表示就是把已知的事实、规则等如何存放在计算机里。存放的目的是为了便于使用，并且在必要的时候便于修改和更新。\n\
    \n- 知识的表示的研究：\n  - (1) 设计若干种数据结构，以便在计算机程序中存储信息；\n  - (2) 发展能聪明地操纵这些数据结构的过程，以便实现推理。\n\
    \n- 知识表示的技术：\n  逻辑谓词、语义网络、产生式、状态空间搜索、框架、脚本、语义原语、过程表示\n\n## 7 专家系统\n\n是一种基于知识的智能系统，它将领域专家的经验用知识表示方法表示出来，并放入知识库中，供推理机使用。\n\
    \n- 专家系统的组成包括五个部分：\n  - 知识库、数据库、推理机、解释部分、知识获取部分。\n\n专家系统的目的：\n\n- (1) 为了传播珍贵的成本高的专门知识。\n\
    - (2) 使专家知识形式化。\n- (3) 汇集各种来源的知识。\n\n## 8. 机器人（学）\n\n机器人是一种自动化机器。机器人有工业机器人和智能机器人两种。工业机器人比较简单。智能机器人是机器人发展到高级阶段的产物。\n\
    \n智能机器人有如下3个特点：\n\n1. **感受环境。**\n2. **高级的人机通讯。** 机器人要懂得人用自然语言发出的指令、交代的任务等。\n3.\
    \ **自动问题求解。** 当机器人获得命令后，机器人能根据它拥有的知识自动地找到解决问题完成命令的方法。\n\n智能机器人的水平是人工智能研究水平的标志。智能机器人通常具有控制、操作、运动、感觉和思维五种功能。机器人规划是目前机器人研究中的热门课题。\n\
    \n## 第二讲 基于逻辑的问题求解方法\n\n- 逻辑表示法 用数理逻辑表示知识\n- 经典逻辑（标准逻辑）\n- 命题逻辑和一阶谓词逻辑\n- 非经典逻辑\n\
    - 模态逻辑、时序逻辑、非单调逻辑、多值逻辑\n\n一阶谓词是一种形式语言，其目的在于把数学中的逻辑论证符号化，能够采用数学演绎推理方式解决问题。\n\n\
    ## 第一节 一阶谓词逻辑基础\n\n- 命题 取值为真或假（表示是否成立）的句子\n- 谓词 带有变量（参数）的命题\n- 谓词 P(x₁, x₂, ...,\
    \ xₙ)\n\n- 一元谓词 谓词与一个个体的属性 BLUE(DESK)\n\n谓词用来描述个体（可以独立存在的事物）之间的关系或属性\n\n## 谓词逻辑的符号体系\n\
    \n| 符号类别 | 说明 |\n|---|---|\n| 常量 | 以大写字母组成的符号串 |\n| 变量符号 | 习惯上是小写字母 x，y，z，u，v，w\
    \ |\n| 函数符号 | 通常以小写字母或小写字母串表示 |\n| 谓词符号 | 通常以大写字母或大写字母串表示 |\n| 逗号及括号 | 圆括号、方括号、花括号\
    \ |\n\n将变量符号、函数符号、谓词符号及常量隔开，以表示论域内的关系。\n\n函数与谓词的形式分别为：\n\n谓词 P(x₁, x₂, …, xₙ)\n\
    函数 f(x₁, x₂, …, xₙ)\n\n## 连接词\n\n- `∼`：否定（非）\n- `∧`：合取（与）\n  - `LIKE(HE, MUSIC)\
    \ ∧ LIKE(HE, PAINTING)`\n- `∨`：析取（或）\n  - `PLAYS(LIMING, BASKETBALL) ∨ PLAYS(LIMING,\
    \ FOOTBALL)`\n- `→`：蕴含（IF……THEN）\n  - `OWNS(SHE, BOOK-1) → COLOR(BOOK-1, BLUE)`\n\
    - `≡`：等价（双条件）\n\n## 量词\n\n量词是由量词符号和被量化的变元所组成的表达式\n\n∀：全称量词符号，表示所有的。\n\n例如，对于个体域中所有个体\
    \ x，谓词 F(x) 均成立时，可表示为\n(∀x)(F(x))\n\n∃：存在量词符号，表示存在某一些。\n\n例如，若存在某些个体 x，使谓词 F(x)\
    \ 成立时，可表示为 (∃x)(F(x))\n\n## 谓词逻辑的知识表示\n\n若量词仅对谓词的个体（变量）而不能对谓词自身起限定作用，即把谓词名视为常量，称其为一阶谓词。\n\
    \n一阶谓词逻辑可严密而精确地表达复杂的人类知识，在很多领域可以得到直接的应用。\n\n可以表示：\n\n- ➢ 事物的状态、属性、概念的事实性知识；\n\
    \  否定、析取或合取符号连接起来的谓词公式\n- ➢ 事物的因果关系\n  蕴含式表示 x → y\n\n## 形式化的领域\n\n在某些领域中，知识或信息是用对象和它们的属性，以及它们之间的关系表示的。这些领域称为形式化的领域。关系数据库可以认为是采用了一阶谓词逻辑的形式，每个关系类型对应着一个谓词。\n\
    \n| OCCUPANT | TELEPHONE |\n|---|---|\n| 住户 房间 | 电话号码 房间 |\n| OWEN 301 | 741 301\
    \ |\n| STEEL 301 | 742 301 |\n| SMITH 302 | 751 302 |\n| SIMON 303 | 751 303 |\n\
    \nOCCUPANT(OWEN, 301) TELEPHONE(741, 301)\n\n## 非形式化的领域\n\n例如 所有的整数不是偶数就是奇数\n\n\
    - ➤ 定义 I(x)：x为整数； E(x)：x为偶数； O(x)：x为奇数\n\n谓词表示 (∀x)(I(x) → E(x) ∨ O(x))\n\n设有三个积木块a，b，c，它们之间的位置关系可用下列谓词表示：\n\
    \nON(a, b) ON(b, c) ➔ ON(a, c)\n\nON(a, b) ∧ ON(b, c) → ON(a, c)\n\n在人工智能中常用的是一阶谓词逻辑，因此本章介绍的内容主要针对一阶谓词逻辑。\n\
    \n## 三、谓词演算公式\n\n### 1. 原子公式 不含任何连接词及量词的谓词公式\n\nP(x₁, x₂, ……, xₙ)，x是个体变量\n\n###\
    \ 2. 谓词演算的合式公式(wffs — well-formed formulas)\n\n- a) 原子公式是合式公式。\n- b) 若A是合式公式，则~A也是合式公式。\n\
    - c) 若A，B是合式公式，则A∧B，A∨B，A→B，A≡B，也都是合式公式。\n- d) 若A是合式公式，x是个体变量，则(∀x)A，（∃x)A也是合式公式\n\
    - e) 只有按a)—d)所得的公式才是合式公式。\n\n## 第二节 逻辑推理\n\n- ➢ 如果谓词公式P对非空个体域D上的任一解释都取得真值T，则称P在D上是永真的；如果P在任何非空个体域上均是永真的，则称P永真。\n\
    - ➢ 对于谓词公式P，如果至少存在D上的一个解释，使公式P在此解释下的真值为T，则称公式P在D上是可满足的。谓词公式的可满足性也称为相容性。\n- ➢ 如果谓词公式P对非空个体域D上的任一解释都取真值F，则称P在D上是假假的；如果P在任何非空个体域上均是永假的，则称P永假。谓词公式的永假性又称不可能满足性或不相容性。\n\
    \n## 等价式\n\n- 交换律：P∨Q ⇔ Q∨P；P∧Q ⇔ Q∧P\n- 结合律：(P∨Q)∨R ⇔ P∨(Q∨R)\n  (P∧Q)∧R ⇔ P∧(Q∧R)\n\
    - 分配律：P∨(Q∧R) ⇔ (P∨Q)∧(P∨R)\n  P∧(Q∨R) ⇔ (P∧Q)∨(P∧R)\n- 摩根定理：~(P∨Q) ⇔ ~P∧~Q；~(P∧Q)\
    \ ⇔ ~P∨~Q\n- 否定之否定：~(~P) ⇔ P\n\n- 吸收律\n  P∧(P∧Q) ⇔ P\n  P∧(P∨Q) ⇔ P\n\n- 补余律\n\
    \  P∨~P ⇔ T\n  P∧~P ⇔ F\n\n- 逆否定律\n  P→Q ⇔ ~Q→~P\n  P→Q ⇔ ~P∨Q\n\n- 量词转换律\n  ~(∃x)P(x)\
    \ ⇔ (∀x)(~P(x))\n  ~(∀x)P(x) ⇔ (∃x)(~P(x))\n\n- 量词分配律\n\n| P(B) | P(A) | P(A)∨P(B)\
    \ | P(A) → [P(A)∨P(B)] |\n|---|---|---|---|\n| T | T | T | T |\n| T | F | T |\
    \ T |\n| F | T | T | T |\n| F | F | F | T |\n\nP→Q ⇔ ~P∨Q ~P(A) ∨ [P(A)∨P(B)]\n\
    \n## 一、自然演绎推理\n\n对谓词公式P和Q，如果P→Q永真，则称P永真蕴含Q，且称Q为P的逻辑结论，P为Q的前提，记作P⇒Q。\n\n- ➤ 永真蕴含式\n\
    - 1 析取三段论 ~P, P∨Q ⇒ Q\n- 2 假言推理 P, P→Q ⇒ Q\n- 3 假言三段论 P→Q， Q→R ⇒ P → R\n- 4 拒取三段论\
    \ ~Q, P→Q ⇒ ~P\n\n"
