- raw:
  - '[PAGE 81]


    # 2. “默认”继承


    把具有相当程度的真实性，但又不能十分肯定的值称为“默认”值。表示该节点的“默认”值的方法，是在指向该节点的弧的标注下加上DEFAULT标记。


    ![](img/e134d51e2ca4313e722468ebe37ad4b6_81_0.png)


    “默认”继承的推理过程类似于值继承，不过搜索的是给定弧标注下带有Default标记的弧。'
  - '[PAGE 82]


    # ## 3. “附加过程”继承


    在某些情况下，当对事物的描述不能直接从概念节点或类节点继承而得，可以利用已知的信息来计算。进行计算的程序称为if-needed程序


    ![](img/e134d51e2ca4313e722468ebe37ad4b6_82_0.png)'
  - '[PAGE 83]


    # ## 三、语义网络表示的特点


    +   由节点和弧组成的语义网络表达直观、自然，易于理解，其继承推理方式符合人类的思维习惯。——自然性


    +   语义网络把事物的结构、属性及事物间的联系显式地表达出来，与一个事物相关的事实特征、关系可以通过相应节点的弧推导出来。—— 结构性


    +   基于语义网络表达的系统便于以联想方式实现系统的解释。—— 联想性'
  - '[PAGE 84]


    知识存储和检索过程十分复杂。


    语义网络表示法试图用节点代表世界上的各种事物，用弧代表事物间的任何联系，其形式过于简单。如果节点间的联系只局限于几种典型的关系，则难以表达较复杂的关系；而增加联系又会大大增加网络的复杂度。


    语义网络的管理和维护很复杂。


    语义网络结构的语义解释完全取决于推理过程，不同的推理过程对应于不同的解释。由于语义网络结构本身没有语义上的约定，因此它不具备逻辑系统那样的有效性。'
  - '[PAGE 85]


    # # 过程(Procedure)表示


    语义网络、框架和脚本等知识表示方法，均是对知识和事实的一种静止的表达方法，我们称这类知识表达方式为陈述式知识表达。


    与知识的陈述式表示相对应的是知识的过程式表示。所谓过程式表示就是将有关某一问题领域的知识，连同如何使用这些知识的方法，均隐式地表达为一个求解问题的过程。它所给出的是事物的一些客观规律，表达的是如何求解问题。知识的描述形式就是程序，所有信息均隐含在程序之中。'
