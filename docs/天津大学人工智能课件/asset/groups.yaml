    # 2.逆向推理


    逆向推理是从目标出发，逆向使用规则，求得已知事实。


    推理过程：


    +   （1）规则集中的规则后件与目标事实进行匹配，得到匹配的规则集合；

    +   （2）从匹配规则集合中选择一条规则作为使用规则；

    +   （3）将使用规则的前件作为子目标。

    +   重复这个过程直至子目标均为已知事实后成功结束。'
  - '[PAGE 307]


