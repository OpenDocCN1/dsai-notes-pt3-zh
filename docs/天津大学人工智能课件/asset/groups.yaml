    - 规则R2：If 第四次开始进攻（Fourth down）且进攻方前三次进攻前进的距离少于10码（short yardage）且进攻位置在对方球门线30码之内（within\
    \ 30 yards）then 可以射门（field goal）\n\n### 3.操作\n\n执行规则的操作部分。\n\n## 五、产生式系统的特点\n\n\
    - 1. 表达直观自然，便于推理；\n- 2. 可进行模块化处理，格式清晰；\n- 3. 设计和检测方便，表示灵活；\n- 4. 求解效率低，无法表示结构性知识，不适用于求解复杂系统。\n"
