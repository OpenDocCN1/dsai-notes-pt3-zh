    # 三、基本遗传算子


    # 选择算子(Selection)


    用于模拟生物界去劣存优的自然选择现象。它从旧种群中选择出适应性强的某些染色体，放入匹配集（缓冲区），为染色体交换和变异运算产生新种群作准备。


    适应度越高的染色体被选择的可能性越大，其遗传基因在下一代群体中的分布就越广，其子孙在下一代出现的数量就越多。'
  - '[PAGE 286]


    # 轮盘法


    +   (1) 计算每个染色体\(x_i\)的适应度\(f(x_i)\);


    +   (2) 找出群体的适应度之和; \(SUM = \sum_{i=1}^{pop-size} f(x_i)\)


    +   (3) 计算某染色体\(x_i\)的选择概率\(p_i\); \(p_i = f(x_i)/SUM\)


    +   (4) 生成区间\([0, 1]\)内的随机数 \(r\);


    +   (5) 选择 \(r < p_i\) 的第一个染色体放入缓冲区;


    +   (6) 重复执行(4)(5)直到缓冲区中有足够多的染色体。


    ![](img/e134d51e2ca4313e722468ebe37ad4b6_286_0.png)'
  - '[PAGE 287]


    # # 交叉算子(Crossover)


    # ## 具体做法：


    +   (1) 缓冲区中任选两个染色体(双染色体);


    +   (2) 随机选择交换点位置J，0<J<L(染色体长度);


    +   (3) 交换双亲染色体交换点右边的部分。（单点交叉）


    例 10011110 J=5 10011010 10001110 两点 10110110 10110010 10110110 10110010 10001010'
