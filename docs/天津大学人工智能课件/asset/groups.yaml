    +   1. 只要是需要编程序的课，王程都喜欢。

    +   2. 所有的程序设计语言课都是需要编程序的课。

    +   3. C是一门程序设计语言课。


    求证：王程喜欢C这门课。


    证明： 首先定义谓词


    **Prog(x)**　　x是需要编程序的课。

    **Like(x,y)**　　x喜欢y。

    **Lang(x)**　　x是一门程序设计语言课。


    把已知事实及待求解问题用谓词公式表示如下：'
