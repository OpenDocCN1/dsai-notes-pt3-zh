    - $f(n)=g(n)+h(n)$\n- $g(n)$为$S_0$到$n$点的费用估计\n\n1. 建立一个只含初始节点$S_0$的搜索图$G$，把$S_0$放入Open表，并计算$f(S_0)$值。\n\
    2. 如果Open表是空的，则失败；否则，继续下一步。\n3. 从Open表中取出$f$值为最小的节点（第一个节点），置于Close表中，给这个节点编号为$n$。\n\
    4. 如果$n$是目标节点，则得解，算法成功退出。此解可从目标节点开始直到初始节点的返回指针中得到。否则，继续下一步。\n5. 扩展节点$n$。如果它没有后继节点，则立即转(2)；否则，生成$n$的所有后继节点集$M=\\\
    {m_i\\}$，把$m_i$作为$n$的后继节点添入$G$。并计算$f(m_i)$。\n6. 若$m_i$未曾在$G$中出现过，即未曾在Open或Closed表中出现过，就将它配上刚计算过的$f(m_i)$值和返回到$n$的指针，并把它们放入Open表中。\n\
    7. 若$m_i$已在Open表中，则需要把其原来的$g$值与现在刚计算过的$g$值相比较：若前者不大于后者，则不做任何更改；若前者大于后者，则将Open表中该节点的$f$值更改为刚计算的$f$值，返回指针更改为$n$。\n\
    8. 若$m_i$已在Closed表中，但$g(m_i)$小于原先的$g$值，则将表中该节点的$g$、$f$值及返回指针进行类似第(7)步的修改。并要考虑修改表中通向该节点的后裔节点的$g$、$f$值及返回指针。\n\
    9. 按$f$值自小至大的次序，对Open表中的节点重新排序。\n10. 返回第2)步。\n\n### 说明：\n\n- 7) 步骤：$m_i$在Open表中，说明$m_i$在$n$之前已是某一节点的后继，但自身尚未被考察。\n\
    - 8) 步骤：$m_i$在Close表中，说明$m_i$在$n$之前已是某一节点的后继，自身已被考察（$m_i$的后继节点也在$n$之前已生成）。\n\n\
    ## 2 启发式搜索算法A*\n\n算法A不能保证当图中存在从起始节点到目标节点的最短路径时，一定能找到它。\n\n如何才能确保找到这条最短路径呢？需要定义评估函数$f^*$：\n\
    $f^*(n) = g^*(n) + h^*(n)$\n\n其中$g^*(n)$为起始节点到节点$n$的最短路径值，$h^*(n)$是$n$到目标节点的最短路径。这样，$f^*(n)$就是从起点出发通过$n$到达目标状态的最佳路径的总代价估值。\n\
    \n## h(n)=p(n)\n\n$p(n)$表示节点$n$的每一将牌与其目标位置之间的距离总和\n\n|   |   |   |   |\n|---|---|---|---|\n\
    | 2 | 8 | 3 | h* = 5 |\n| 1 | -6 | 4 | W = 4 |\n| 7 |   | 5 | P = 5 |\n|   | \
    \  |   | s -   |\n|   |   |   | f=5   |\n\nh(n)=P(n)的搜索树\n\n## 过程 A*\n\n1. 把起始节点\
    \ $S_0$ 放到 Open 表中，计算 $f(S_0)$，把它作为 $S_0$ 的估价值。\n   $Open := (S_0)，\\quad f(S_0)=g(S_0)+h(S_0)=h(S_0)，\\\
    quad f_m=f(S_0)$；\n2. 如果 Open 是空表，则失败退出，无解。\n3. 给出 Open 表满足 $f<f_m$ 的节点集合，赋予 NEST，并计算\
    \ $g_i$；如果 NEST 不为空，取其中 $g$ 最小者作为当前节点；否则取 Open 的第一个为当前节点 $n$，计算 $f(n)$，$f_m=f(n)$。\n\
    4. 如果是目标合格，成功退出。\n5. 否则将节点 $n$ 移出至 Close 的扩展节点表中。\n6. 扩展节点$n$，生成其全部后继节点，对于$n$\
    \ 的每个后继节点$m_i$：\n   - 计算$f(n , m_i)$，$f(n , m_i) = g (n , m_i) + h(m_i)$；\n  \
    \ - 如果$m_i$即不在Open表，也不在Close表中，则将$m_i$ 添入Open表，加一指向其父辈节点$n$ 的指针。\n   - 如果$m_i$\
    \ 已在Open表或Closed表上，则比较刚刚对$m_i$ 计算的$f$ 值和前面计算过的该节点在表中的 $f$ 值。\n     a) 如果新的 $f$\
    \ 值较小，则以此新值取代旧值；从$m_i$ 指向$n$。\n     b) 如果节点$m_i$ 在Close表上，新 $f$ 值较小，则把它移回Open表，不必考虑修改到其子节点的指针。\n\
    7. OPEN中的节点按$f$ 值从小到大排序；\n8. GO LOOP;\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_157_0.png)\n\
    \n## 第四节 问题归约法\n\n问题求解过程中，将一个大问题变换成若干子问题，子问题又可分解成更小的子问题，这样一直分解到可以直接求解为止。全部子问题的解即为大的问题的解，这样的过程为问题归约。大的问题为初始问题，可直接求解的问题为本原问题。归约法求解问题需要三大因素：\n\
    \n- 初始问题的描述 \\( S_0 \\)\n- 一组将问题变换成子问题的变换规则 \\( O \\) 。\n- 一组本原问题的描述 \\( P \\\
    )\n\n## 与或图搜索\n\n在与或图上执行的搜索过程，其目的在于表明起始节点是有解的。\n\n1. 与或图中一个可解节点的一般定义可归纳如下：\n\n\
    \   1) 终叶节点是可解节点；\n   2) 如果某节点 $n$ 为非终叶节点，且含有“或”后继节点，那么该节点 $n$ 可解当且仅当至少有一个后继节点为可解节点。\n\
    \   3) 如果某节点 $n$ 为非终叶节点，且含有“与”后继节点，那么该节点 $n$ 可解当且仅当所有后继节点均为可解节点；\n\n2. 不可解节点可递归定义如下：\n\
    \n   1) 没有后继节点的非终叶节点是不可解节点；\n   2) 如果某节点$n$为非终叶节点，且含有“或”后继节点，那么当且仅当它的所有后继节点都是不可解节点；\n\
    \   3) 如果某节点$n$为非终叶节点，且含有“与”后继节点，那么当且仅当它的后继节点中至少有一个是不可解节点。\n"
