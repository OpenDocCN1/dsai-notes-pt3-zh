    ANN有强大的计算能力。首先它有庞大的并行分布式结构，其次它有学习和由此进行归纳的能力。


    ![](img/e134d51e2ca4313e722468ebe37ad4b6_280_0.png)


    ## 第二节　遗传算法


    遗传算法（GA）是一种搜索算法。它的基本思想是使用模拟生物和人类进化的方法来解复杂的优化问题，因而也称为模拟进化优化算法。遗传算法在计算原理上是自适应的，结构上是并行的，而且模仿了人的智能处理特征，因而成为人工智能的一个重要研究领域。


    遗传算法将择优与随机信息交换结合在一起，在每一代中，用上代中最好的（即选择最适应环境的位或个体形成新的人工生物集）。


    虽然遗传算法是随机化方法，但它不是简单的随机搜索，而是有效利用历史信息来推测新的搜索点。所以，遗传算法是计算机与遗传学相结合的产物。


    ### 一、相关概念


    - 染色体（chromosome）或个体（individual）：把每一个可能的解编码为一个向量，用来描述基本的遗传结构。例如，用0，1组成的串可以表示染色体或浮点形式。

    - 基因：向量中的每一个元素。

    - 适应度（fitness）：每个染色体所对应的一个适应值。在优化问题中，适应度来自于一个目标评价函数。

    - 群体（population）：由染色体组成的集合。

    - 遗传操作：作用于群体而产生新的群体。


    ### 二、基本算法


    遗传算法是一个迭代过程，在每次迭代中都保留一组候选解，并按某种优劣指标进行排序，然后从中选出一些解，利用遗传算子，对其进行运算以产生新一代的一组解。重复上述过程，直到满足指定的收敛要求为止。


    | 问题的初始（候选）解 | 编码为染色体（向量） | 种群P(t) | 计算各染色体适应度 | 通过遗传运算存优去劣 | 种群P(t)→种群P(t+1)
    |

    |---|---|---|---|---|---|

    |  |  |  |  | 选择/交换/变异 |  |


    ![](img/e134d51e2ca4313e722468ebe37ad4b6_284_0.png)


    遗传算法工作原理示意图


    2022-11-3


    ### 三、基本遗传算子


    **选择算子（Selection）**


    用于模拟生物界去劣存优的自然选择现象。它从旧种群中选择出适应性强的某些染色体，放入匹配集（缓冲区），为染色体交换和变异运算产生新种群作准备。


    适应度越高的染色体被选择的可能性越大，其遗传基因在下一代群体中的分布就越广，其子孙在下一代出现的数量就越多。


    **轮盘法**


    - (1) 计算每个染色体\(x_i\)的适应度\(f(x_i)\)；

    - (2) 找出群体的适应度之和；\(SUM = \sum_{i=1}^{pop-size} f(x_i)\)

    - (3) 计算某染色体\(x_i\)的选择概率\(p_i\)；\(p_i = f(x_i)/SUM\)

    - (4) 生成区间\([0, 1]\)内的随机数 \(r\)；

    - (5) 选择 \(r < p_i\) 的第一个染色体放入缓冲区；

    - (6) 重复执行(4)(5)直到缓冲区中有足够多的染色体。


    ![](img/e134d51e2ca4313e722468ebe37ad4b6_286_0.png)


    **交叉算子（Crossover）**


    **具体做法：**


    - (1) 缓冲区中任选两个染色体（双染色体）；

    - (2) 随机选择交换点位置J，0<J<L（染色体长度）；

    - (3) 交换双亲染色体交换点右边的部分。（单点交叉）


    例：10011110，J=5，10011010，10001110；两点：10110110，10110010，10110110，10110010，10001010


    **突变算子（Mutation）**


    随机地将某染色体的某个基因 0→1 或 1→0


    第6位突变


    例　10011110　→　10011010


    **选择操作**


    | $CR_i$ | 代码 | $X$（十进制数） | $f(x)$ | $f(x)/\sum f(x)$ |  |

    |---|---:|---:|---:|---:|---|

    | 1 | 01101 | 13 | 169 | 0.14 | $CR_1$ |

    | 2 | 11000 | 24 | 576 | 0.49 | $CR_2$ |

    | 3 | 01000 | 8 | 64 | 0.06 | $CR_2$ |

    | 4 | 10011 | 19 | 361 | 0.31 | $CR_4$ |

    | 总和Σ |  |  | 1170 | 1.00 |  |

    | 最大值 |  |  | 576 |  |  |


    **第二代 $n=2$**


    | $CR_i$ | 代码 | $x$（十进制数） | $f(x)$ | $f(x)/\sum f(x)$ |

    |---|---:|---:|---:|---:|

    | 1 | 01100 | 12 | 144 | 0.08 |

    | 2 | 11001 | 25 | 625 | 0.36 |

    | 3 | 11011 | 27 | 729 | 0.42 |

    | 4 | 10000 | 16 | 256 | 0.14 |

    | 总和Σ |  |  | 1754 | 1.00 |

    | 最大值 |  |  | 729 |  |


    ### 一、什么是产生式系统


    - 产生式系统（production system）是由波斯特（Post）于1943年提出的产生式规则而得名。

    - 产生式系统用来描述若干个不同的以一个基本概念为基础的系统。这个基本概念就是产生式规则或产生式条件和操作对的概念。

    - 在产生式系统中，论域的知识分为两部分：用事实表示静态知识，用产生式规则表示推理过程和行为。

    - 由于这类系统的知识库主要用于存储规则，因此又把此类系统称为基于规则的系统（rule-based system）。


    ### 控制策略主要任务：


    - (1) 按一定策略从规则库中选择与综合数据库中的已知事实相匹配的规则。

    - (2) 当存在多条匹配成功的规则时，控制策略能够按照某种策略从中选出一条适合的规则去执行。

    - (3) 如果要执行规则的右部不是问题的目标，且为一个或多个结论时，则把这些结论加入到综合数据库中；当其为一个或多个操作时，执行这些操作。

    - (4) 如果要执行规则的右部满足问题的结束条件时，则停止推理。

    - (5) 记住问题求解过程应用过的规则序列，以便求解结束时能够给出问题的解答路径。


    ### 控制策略类型：


    **1. 不可撤回方式**


    例：有N=3个传教士和N=3个野人来到河边准备渡河，河岸有一条船，每次至多可以供K=2个乘渡，问传教士为了安全起见，应如何规划摆渡方案，使得任何时刻，河两岸以及船上的野人数目总是不超过传教士的数目。即求解传教士和野人从左岸全部摆渡到右岸的过程中，任何时刻满足M（传教士人数）≥C（野人数）和M+C≤K的摆渡方案。


    给定的问题用下图表示，图中L和R表示左岸和右岸，B=1或0分别表示有船和无船，约束条件是：两岸上M≥C，船上M+C≤2。


    ![](img/e134d51e2ca4313e722468ebe37ad4b6_296_0.png)


    (2) 规则集合：由摆渡操作组成，该问题主要有两种操作：PMC操作(规定为从左岸划向右岸)和QMC操作(规定为从右岸划向左岸)，每次摆渡操作，船上人数有5种组合，因而组成10条规则的集合如下：


    - If (Ml，Cl，Bl=1) then (Ml－1，Cl，Bl－1); (P10操作)

    - If (Ml，Cl，Bl=1) then (Ml，Cl－1，Bl－1); (P01操作)

    - If (Ml，Cl，Bl=1) then (Ml－1，Cl－1，Bl－1); (P11操作)

    - If (Ml，Cl，Bl=1) then (Ml－2，Cl，Bl－1); (P20操作)

    - If (Ml，Cl，Bl=1) then (Ml，Cl－2，Bl－1); (P02操作)

    - If (Ml，Cl，Bl=0) then (Ml+1，Cl，Bl+1); (Q10操作)

    - If (Ml，Cl，Bl=0) then (Ml，Cl+1，Bl+1); (Q01操作)

    - If (Ml，Cl，Bl=0) then (Ml+1，Cl+1，Bl+1); (Q11操作)

    - If (Ml，Cl，Bl=0) then (Ml+2，Cl，Bl+1); (Q20操作)

    - If (Ml，Cl，Bl=0) then (Ml，Cl+2，Bl+1); (Q02操作)

