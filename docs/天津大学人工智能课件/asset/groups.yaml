    # 2 启发式搜索算法A*


    算法A不能保证当图中存在从起始节点到目标节点的最短路径时，一定能找到它。


    如何才能确保找到这条最短路径呢？ 需要定义评估函数\( f^* \)：

    \( f^*(n) = g^*(n) + h^*(n) \)

    其中\( g^*(n) \)为起始节点到节点\( n \)的最短路径值，\( h^*(n) \)是\( n \)到目标节点的最短路径。这样，\( f^*(n)
    \)就是从起点出发通过\( n \)到达目标状态的最佳路径的总代价估值。'
