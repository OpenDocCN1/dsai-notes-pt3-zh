    \n### 一、语义网络的知识表示\n\n#### （一）基本命题的语义网络表示\n\n所谓语义网络就是知识的一种图解表示，它由节点和弧线或链线组成，其中节点表示客体、客体性质、概念、事件和行为等，而弧线表示节点之间的语义联系。\n\
