    作业：\n编成实现，记录算法A和算法A*执行过程中Open表和Close表的内容；\n\n## 第四讲 不确定知识表示及推理\n\n在日常生活和科学研究中，人们一直在追求用某一确定的数学模型或集合理论来解决问题或描述现象。然而，真实世界是不断变化的、不完全的、不精确的，充满着矛盾的、复杂相关的信息世界。这就是说，用确定的概念描述事物往往是有局限性的。\n\
    \n在现实世界中，不精确推理、非单调推理和模糊推理十分重要。\n\n## 第一节 不确定推理概述\n\n### 一、不确定推理\n\n推理\n\n不确定性推理就是从不确定的证据出发，运用不确定性的知识（或规则）库中的知识，最终推出具有一定程度的不确定性，但却是合理的或近乎合理的结论的思维过程。\n\
    \n知识（规则）\n\n是推理得以向前推进，并逐步达到最终目标的根据。\n\n规则的集合——知识库（规则库）\n\n## 二、不确定推理方法的分类\n\n\
    ### 模型方法\n\n把不确定的证据和不确定的知识分别与某种度量标准对应起来，并给出更新结论不确定性的合适的算法，从而构成相应的不确定性推理模型。\n\n\
    - 数值方法 可信度方法、主观Bayes方法、证据理论等\n- 非数值方法 多值逻辑、非单调逻辑\n\n### 控制方法\n\n## 三、不确定推理中的基本问题\n\
    \n### 1 不确定性的表示\n\n- 证据不确定性的表示\n  - 能够比较准确地描述问题本身的不确定性；\n  - 便于推理过程中不确定性的计算。\n\
    \n知识的静态强度表示相应知识的确定性程度\n\n在实际应用中，知识的不确定性是由领域专家给以的。\n\n- 知识不确定性的表示\n  - 来源：(1) 用户在求解问题时所提供的初始证据，如病人的症状、检查结果等；\n\
    \  - (2) 推理中得出的中间结果。\n\n## 三、不确定推理中的基本问题（续）\n\n### 2 推理计算\n\n- 不确定性的传递计算算法\n\n\
    证据E的CF(E)，规则E→H的CF(H, E)，如何得到结论的CF(H)?\n\n- 组合证据不确定性计算算法\n\n支持结论的证据不止一个\n\n- 结论不确定性的更新或合成算法\n\
    \n两个证据分别由两条规则支持结论，如何计算结论的不确定性\n\n## 第二节 确定性理论\n\n不确定性是用可信度来表示的，也称其为可信度方法。\n可信度\
    \ 根据经验或观察对某一事件或现象为真的相信程度\n\n### 一、知识的不确定性\n\n知识是由规则表示的。它的一般形式为：\nIF E THEN H (CF(H,\
    \ E))\n\nCF(H, E)=MB(H, E)-MD(H, E)\n\n在MYCIN系统引入了信任增长度MB(Measure Belief)和不信任增长度MD(Measure\
    \ Disbelief)两个概念，用来描述知识的不确定性。\n\n- **MB(H, E) =** 因而对H信任的增长 / 不信任H的概率\n\nMB(H,\
    \ E)>0时，$P(H|E)>P(H)$，表示因证据E的出现增加了对结论H的信任程度。\n\n- **MD(H, E) =** 因而对H信任的减少 / 信任H的概率\n\
    \nMD(H, E)>0时，$P(H|E)<P(H)$，表示因证据E的出现增加了对结论H的不信任程度。\n\n根据MB、MD和CF的定义，我们可以直接用概率值来表示CF(H,\
    \ E)：\n\n\\(\\text{CF(H,E)}=\\left\\{\\begin{array}{ll} \\text{MB(H,E)-0}=\\frac{P(H|E)-P(H)}{1-P(H)}\
    \ & ;\\text{若}P(H|E)>P(H) \\ 0 & ;\\text{若}P(H|E)=P(H) \\ 0\\text{-MD(H,E)}=\\\
    frac{P(H|E)-P(H)}{P(H)} & ;\\text{若}P(H|E)<P(H) \\end{array}\\right.\\)\n\n###\
    \ 性质1. MB与MD的互斥性\n\n当MB(H, E) > 0 时，MD(H, E)=0\n\n当MD(H, E) > 0 时，MB(H, E)=0\n\
    \nMB与MD的互斥性表明对于同一个证据E，不可能同时既增加对H的信任程度，又增加对H的不信任程度。\n\n### 性质2. MB、MD和CF的值域为：\n\
    \n$0\\leq MB(H,E)\\leq 1$\n\n$0\\leq MD(H,E)\\leq 1$\n\n$-1\\leq CF(H,E)\\leq\
    \ 1$\n\n### 性质3. 典型值\n\n$$CF(H,E)=\\begin{cases}-1;&若\\ P(H\\mid E)=0\\\\0;&若\\\
    \ P(H\\mid E)=P(H)\\\\1;&若\\ P(H\\mid E)=1\\end{cases}$$\n\n### 性质4.\n\n$CF(H,E)+CF(\\\
    sim H,E)=0$\n\n### 性质5.\n\n$$\\sum_{i=1}^{n} CF(H_i,E)\\leq 1$$\n\n## 二、证据的不确定性\n\
    \n### 1 单个证据的不确定性获取方法\n\n- 证据为初始证据——用户直接指定\n- 先前推出的结论作为当前的证据——不确定性推理获得\n\n###\
    \ 2 组合证据的不确定性获取方法\n\n- 证据是合取连接\n  - 若 E=E1∧E2\n  - 则 CF(E)=CF(E1∧E2)=min{CF(E1),\
    \ CF(E2)}\n- 证据是析取连接\n  - 若 E=E1∨E2\n  - 则 CF(E)=CF(E1∨E2) =max{CF(E1), CF(E2)}\n\
    \n"
