    \ \n\n  $$f(x)=\\frac{1}{1+e^{-x}}\\qquad y=f(0.15)=\\frac{1}{1+e^{-0.15}}=0.54$$\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_272_0.png)\n\n## 3 人工神经网络的分类\n\n- 按网络拓扑结构划分\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_273_0.png)\n\n- 按网络学习算法划分  \n  - 有导师学习算法\
    \  \n  - 无导师学习算法\n\n- 按网络的性能划分  \n  - 连续型  \n  - 离散型\n\n## 四、学习过程（网络训练参数的确定）\n\
    \n主要是在网络训练前确定输入输出结点数、层数、隐层结点数、传播函数的类型、学习规则、学习率、步长等参数。\n\n这些参数的确定目前还没有系统化的理论和方法，完全靠开发者的经验来确定，因而被称为“一门不严格的艺术”。\n\
