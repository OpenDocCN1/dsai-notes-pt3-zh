    \ （4）统计分析方法\n\n在数据库字段值之间可能存在着两种关系。一种是函数关系，即若干字段值之间的关系可用函数公式表示；另一种是相关关系，即若干字段值之间的关系虽不能用函数公式表示，但确实存在着某种关系。利用统计方法中的回归分析、相关分析、主成份分析等方法可发现这些关系。\n\
    \n## （5）模糊集合方法\n\n基于模糊集合理论的模糊模式识别、模糊聚类分析和模糊推理方法都可用于数据库中的数据挖掘。\n\n## （6）演化计算与连接计算方法\n\
    \n## （7）可视化方法\n\n将多维数据从各个不同的角度构成各种视图，更易于发现数据的内在本质和规律性。\n\n## 自然演绎推理\n\n对谓词公式P和Q，如果P→Q永真，则称P永真蕴含Q，且称Q为P的逻辑结论，P为Q的前提，记作P⇒Q。\n\
    \n- 永真蕴含式\n- 1 析取三段论 ~P, P∨Q ⇒ Q\n- 2 假言推理 P, P→Q ⇒ Q\n- 3 假言三段论 P→Q , Q→R ⇒ P\
