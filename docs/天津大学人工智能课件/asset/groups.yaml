    \  \n\n析取关系在语义网络中的表示  \n\n如合取关系是嵌套在析取关系之内，这时需要同时标注合取界限CONJ和析取界限DIS。\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_74_0.png)\
