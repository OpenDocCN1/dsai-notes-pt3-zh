  md: "\n## 2. 回溯方式：\n\n例：八数码游戏，在3×3组成的九宫格棋盘上，摆有8个将牌，每一个将牌都刻有1～8中的某个数码，棋盘中留有一个空格，允许周围的某一个将牌向空移动，这样通过移动将牌就可以改变将牌的布局。\n\
    \n这种游戏求解的问题是：给定一种初始的将牌布局或结构（称初始状态）和一个目标的布局（称目标状态），问如何移动将牌，实现目标从初始状态到目标状态的转变。问题的解答其实就是给出一个合法的走步序列。\n\
    \n对八数码游戏，回溯应发生在以下3种情况：\n\n- 1. 新生成的状态在通向初始状态的路线上已出现过；\n- 2. 从初始状态开始，应用的规则数目达到所规定的数目之后还未找到目标状态（这一组规定的数目实际上就是搜索深度范围所规定的）；\n\
    - 3. 对当前状态，再没有可应用的规则。\n\n### 搜索图：\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_301_0.png)\n\
    \n① 初始状态：\n\n```\n2 8 3\n1 6 4\n7   5\n```\n\n（左、上、右）\n\n② 向左移动：\n\n```\n2 8 3\n\
    1   4\n7 6 5\n```\n\n（上、右）\n\n③ 向上移动：\n\n```\n2 8 3\n  6 4\n1 7 5\n```\n\n（上、右、下）\n\
