  md: "\n\n## 4 软件实现\n\n这一阶段的工作与一般软件设计类似，应遵循软件工程的原则，进行系统设计、编码、测试，建立知识库，实现推理机、动态存储器，人机接口，知识获取等专家系统程序模块，构成一个可运行的专家系统原型软件。\n\
    \n## 5 系统测试与评价\n\n专家系统开发是一个长期反馈的过程，对所生成的专家系统原型软件必须反复进行测试，评价，发现并改正其中的错误，才能使之实用。\n\
    \n测试与评价的主要内容包括：\n\n- 知识表示模式的选取是否恰当；\n- 知识库中的知识的正确性，完整性，一致性如何；\n- 知识库维护是否容易；\n\
    - 所采用的推理方法和技术是否正确，推导出的结论是否可信，用户是否满意；\n- 人机接口使用是否方便，实用；\n- 系统的成本与效益情况等。\n\n若欲求解的问题可视为问题空间中一个状态到另一个状态的变换序列，则可用产生式系统求解。诸如\
    \ 8 数码 (8 Puzzle)、旅行商 (traveling salesman)、汉诺塔 (Tower of Hanoi)、传教士与食人魔 (Missionaries\
    \ and cannibals)、符号积分 (Symbolic integration)、猴子与香蕉 (Monkey and bananas) 等经典人工智能问题的求解，以人类专家知识为基础的专家系统的问题求解，从本质上都可以看作是从初始状态到目标状态的推导变换过程，因而都可用产生式系统来求解。\n\
    \n## 第二讲 搜索策略\n\n搜索策略的优劣直接影响到智能系统的性能与推理效率。\n\n**AI 研究的对象**大多是属于结构不良或非结构化的问题。一般很难获得其全部信息，更没有现成的算法可供求解使用。\n\
    \n只能依靠经验，利用已有知识逐步摸索求解。像这种根据问题的实际情况，不断寻找可利用知识，从而构造一条代价最小的推理路线，使问题得以解决。该过程称为**搜索**。\n\
    \n## 搜索类型\n\n- 盲目搜索 没有考虑到问题本身的特性，按预先规定的路线进行。\n- 启发式搜索 加入与问题有关的启发性信息，用于指导搜索朝着最有希望的方向前进。\n\
    - 状态空间搜索 用状态空间法来求解问题所进行的搜索用状态空间法来求解问题所进行的搜索\n- 与 / 或树搜索 用问题归约法来求解问题  \n  状态空间法和问题归约法是人工智能中最基本的两种问题求解方法\n\
    \n## 第一节 状态空间法问题求解\n\n### 一、问题的状态空间(state space)表示\n\n1. 状态空间可用三元组(_S_, _O_, _G_)来描述\n\
    \n- _S_: 状态集合。状态是某种事实的符号或数据。  \n  _S_<sub>0</sub>是问题的初始状态。  \n  _S<sub>k</sub>_={_S_<sub>_k_0</sub>,\
    \ _S_<sub>_k_1</sub>, ...}\n\n- _G_: 表示目标状态集。  \n  它可以是具体的状态，也可以是对某些状态性质的描述\n\n\
    - _O_是操作算子集(operator)，一个状态转化为另一个状态。  \n  状态空间的一个解是一个有限的操作算子序列，它使初始状态转化为目标状态： \
    \ \n  \\( S_0 \\xrightarrow{O_1} S_1 \\xrightarrow{O_2} S_2 \\xrightarrow{O_k}\
    \ \\cdots \\xrightarrow{} G \\)  \n  _O_<sub>1</sub>, ..., _O<sub>k</sub>_即为状态空间的一个解，解不一定是唯一的。\n\
    \n### 2. 状态空间可用有向图表示\n\n其节点表示状态，节点间的弧（有向）表示操作算子。\n\n### 状态空间法求解问题：\n\n- 将所要求的问题表示成状态空间\n\
    - 规定一组操作算子，能使状态从一个状态变为另一个状态\n- 决定一种搜索策略，能在状态空间中沿某条路径达到目标状态 →\n\n**搜索方法的效率将决定问题求解的效率。**\n\
