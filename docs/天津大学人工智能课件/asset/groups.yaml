  - '[PAGE 122]


    若欲求解的问题可视为问题空间中一个状态到另一个状态的变换序列，则可用产生式系统求解。诸如 8 数码 (8 Puzzle)、旅行商 (traveling salesman)、汉诺塔
    (Tower of Hanoi)、传教士与食人魔 (Missionaries and cannibals)、符号积分 (Symbolic integration)、猴子与香蕉
    (Monkey and bananas) 等经典人工智能问题的求解，以人类专家知识为基础的专家系统的问题求解，从本质上都可以看作是从初始状态到目标状态的推导变换过程，因而都可用产生式系统来求解。'
  - '[PAGE 123]


    # 第二讲　搜索策略


    搜索策略的优略直接影响到智能系统的性能与推理效率。


    **AI 研究的对象**大多是属于结构不良或非结构化的问题。一般很难获得其全部信息，更没有现成的算法可供求解使用。


    只能依靠经验，利用已有知识逐步摸索求解。像这种根据问题的实际情况，不断寻找可利用知识，从而构造一条代价最小的推理路线，使问题得以解决。该过程称为**搜索**。'
  - "[PAGE 124]\n\n# # 搜索类型\n\n+   > 盲目搜索 没有考虑到问题本身的特性，按预先规定的路线进行。\n\n+   > 启发式搜索\
