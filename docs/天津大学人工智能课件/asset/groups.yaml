  - '[PAGE 111]


    # # 第六节 对产生式系统的评价


    # ## 一、特点


    +   1. 具有丰富的知识表示能力，可以简单直观的规则方式表达人类的经验性知识。


    +   2. 知识表达模块化、结构化，每条规则具有相同的格式且相对独立。规则的组合、修改、增、删比较容易，规则的收集、整理比较方便。


    +   3. 容易排除故障，当系统工作异常时，通过跟踪产生式规则的触发序列，就可容易地发现故障，为系统调试和维护提供便利条件。'
  - '[PAGE 112]


    # 4. 产生式系统的规则链接推理过程相似于人类求解问题时的逻辑思维过程，因此可把产生式系统用作人类行为的启发式模型，模拟人类的逻辑思维过程。


    # 5. 推理方向的可逆性。由于产生式规则的前件和后件结构类似，可同时进行正向和反向推理，即混合推理，当解决复杂问题时，可提供有效的框架结构。'
