    规则1：\( P_1 \rightarrow P_2 \) 规则2：\( P_2 \rightarrow P_3 \) 规则3：\( P_3 \rightarrow
    q_3 \)


    如果综合数据库中含有事实\( P_1 \)，则应用这三条规则进行正向推理，即从\( P_1 \)出发推导出\( q_3 \)的过程如图所示。


