    leq x_c \\\\ 1 & x > x_c \\end{cases} \\)\n\n- Sigmoid函数  \n  \\( f(x) = \\frac{1}{1\
    \ + e^{-x}} \\)\n\n- 双曲正切型  \n  \\( f(x) = \\frac{e^x - e^{-x}}{e^x + e^{-x}}\
    \ \\)\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_271_0.png)\n\n## 例 已知一个3个输入和1个输出的神经元，相应的输入值和权值以及阈值如图所示，求不同激活函数下的输出值。\n\
