    （2）假设全局数据库中已经有该动物是长腿、长颈等事实，还要验证“该动物是有蹄动物”，为此，规则I8要求该动物是“反刍”动物且是“哺乳动物”；

    （3）要验证“该动物是哺乳动物”，根据规则I2，要求该动物是“产乳动物”；现已知该动物是“产乳”和“反刍”动物，即个子目标都是已知事实，所以逆向推理成功，即“该动物是长颈鹿”假设成立。'
