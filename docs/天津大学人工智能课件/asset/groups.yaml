    **Lang(x)**　　x是一门程序设计语言课。\n\n把已知事实及待求解问题用谓词公式表示如下：\n\nProg(x)→Like(Wang, x) 只要是需要编程序的课，王程都喜欢。\n\
    \n(∀x)(Lang(x)→Prog(x)) 所有的程序设计语言课都是需要编程序的课\n\nLang(C) C是一门程序设计语言课。\n\n应用推理规则进行推理：\n\
