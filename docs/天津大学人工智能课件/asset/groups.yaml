  - '[PAGE 119]


    # 4 软件实现


    这一阶段的工作与一般软件设计类似，应遵循软件工程的原则，进行系统设计、编码、测试，建立知识库，实现推理机、动态存储器，人机接口，知识获取等专家系统程序模块，构成一个可运行的专家系统原型软件。'
  - '[PAGE 120]


    # 5 系统测试与评价


    专家系统开发是一个长期反馈的过程，对所生成的专家系统原型软件必须反复进行测试，评价，发现并改正其中的错误，才能使之实用。


    测试与评价的主要内容包括：


    +   - 知识表示模式的选取是否恰当；

    +   - 知识库中的知识的正确性，完整性，一致性如何；

    +   - 知识库维护是否容易；

    +   - 所采用的推理方法和技术是否正确，推导出的结论是否可信，用户是否满意；

    +   - 人机接口使用是否方便，实用；

    +   - 系统的成本与效益情况等。'
