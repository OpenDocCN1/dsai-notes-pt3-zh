    \n在数据库字段值之间可能存在着两种关系。一种是函数关系，即若干字段值之间的关系可用函数公式表示；另一种是相关关系，即若干字段值之间的关系虽不能用函数公式表示，但确实存在着某种关系。利用统计方法中的回归分析、相关分析、主成份分析等方法可发现这些关系。\n\
    \n## （5）模糊集合方法\n\n基于模糊集合理论的模糊模式识别、模糊聚类分析和模糊推理方法都可用于数据库中的数据挖掘。\n\n## （6）演化计算与连接计算方法\n\
    \n## （7）可视化方法\n\n将多维数据从各个不同的角度构成各种视图，更易于发现数据的内在本质和规律性。\n\n## 自然演绎推理\n\n对谓词公式P和Q，如果P→Q永真，则称P永真蕴含Q，且称Q为P的逻辑结论，P为Q的前提，记作P⇒Q。\n\
    \n- 永真蕴含式\n- 1 析取三段论 ~P, P∨Q ⇒ Q\n- 2 假言推理 P, P→Q ⇒ Q\n- 3 假言三段论 P→Q , Q→R ⇒ P\
    \ → R\n- 4 拒取三段论 ~Q, P→Q ⇒ ~P\n\n例 设已知如下事实：\n\n- 1. 只要是需要编程序的课，王程都喜欢。\n- 2. 所有的程序设计语言课都是需要编程序的课。\n\
    - 3. C是一门程序设计语言课。\n\n求证：王程喜欢C这门课。\n\n证明： 首先定义谓词\n\n**Prog(x)**　　x是需要编程序的课。\n**Like(x,y)**　　x喜欢y。\n\
    **Lang(x)**　　x是一门程序设计语言课。\n\n把已知事实及待求解问题用谓词公式表示如下：\n\nProg(x)→Like(Wang, x) 只要是需要编程序的课，王程都喜欢。\n\
    \n(∀x)(Lang(x)→Prog(x)) 所有的程序设计语言课都是需要编程序的课\n\nLang(C) C是一门程序设计语言课。\n\n应用推理规则进行推理：\n\
    \nLang(y)→Prog(y) 全称固化\n\nLang(C), Lang(y)→Prog(y)⇒Prog(C) 假言推理\n\nProg(C), Prog(x)→Like(wang,\
    \ x)⇒ 假言推理\n\nLike(wang,C) 王程喜欢C这门课。\n\n2022-11-3 归结策略 30\n\n## 归结策略\n\n归结演绎推理实际上就是从子句集中不断寻找可进行归结的子句对，并通过对这些子句对的归结，最终得出一个空子句的过程。\n\
    \n盲目地全面进行归结，产生许多无用的归结式，严重的是会产生组合爆炸问题。\n\n常用的归结策略可分为两大类：\n\n- **删除策略**——通过删除某些无用的子句来缩小归结范围；\n\
    - **限制策略**——通过对参加归结的子句进行某些限制，来减少归结的盲目性，以尽快得到空子句。\n\n## 前束范式\n\n- 设F为一谓词公式，如果其中的所有量词均非否定地出现在公式的最前面，而它们的辖域为整个公式，则称F为前束范式。\n\
    \n$F(x,y,w)=(\\forall x)(\\forall y)(\\exists w)(P(x)\\land Q(y,w)\\lor R(x,w))$\n\
