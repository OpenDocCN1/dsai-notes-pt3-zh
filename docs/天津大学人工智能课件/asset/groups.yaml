    \n## 3. “附加过程”继承\n\n在某些情况下，当对事物的描述不能直接从概念节点或类节点继承而得，可以利用已知的信息来计算。进行计算的程序称为if-needed程序\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_82_0.png)\n\n## 三、语义网络表示的特点\n\n- 由节点和弧组成的语义网络表达直观、自然，易于理解，其继承推理方式符合人类的思维习惯。——自然性\n\
    \n- 语义网络把事物的结构、属性及事物间的联系显式地表达出来，与一个事物相关的事实特征、关系可以通过相应节点的弧推导出来。——结构性\n\n- 基于语义网络表达的系统便于以联想方式实现系统的解释。——联想性\n\
    \n知识存储和检索过程十分复杂。\n\n语义网络表示法试图用节点代表世界上的各种事物，用弧代表事物间的任何联系，其形式过于简单。如果节点间的联系只局限于几种典型的关系，则难以表达较复杂的关系；而增加联系又会大大增加网络的复杂度。\n\
    \n语义网络的管理和维护很复杂。\n\n语义网络结构的语义解释完全取决于推理过程，不同的推理过程对应于不同的解释。由于语义网络结构本身没有语义上的约定，因此它不具备逻辑系统那样的有效性。\n\
    \n## 过程(Procedure)表示\n\n语义网络、框架和脚本等知识表示方法，均是对知识和事实的一种静止的表达方法，我们称这类知识表达方式为陈述式知识表达。\n\
    \n与知识的陈述式表示相对应的是知识的过程式表示。所谓过程式表示就是将有关某一问题领域的知识，连同如何使用这些知识的方法，均隐式地表达为一个求解问题的过程。它所给出的是事物的一些客观规律，表达的是如何求解问题。知识的描述形式就是程序，所有信息均隐含在程序之中。\n\
    \n从程序求解问题的效率上来说，过程式表达要比陈述式表达高得多。但因其知识均隐含在程序中，因而难于添加新知识和扩充功能，适用范围较窄，适用于知识表示与求解结合非常紧密的那类问题。\n\
    \n以八数码问题为例，给出一种求解该问题的过程式描述。当任意给定一初始状态后，求解该问题的过程如下：\n\n(1) 首先移动棋牌，使得棋子1和空格均不在位置c上。\n\
    \n(2) 依次移动棋牌，使得空格位置沿图所示的箭头方向移动，直到棋子1位于a为止。\n\n(3) 依次移动将牌，使得空格位置沿图所示的箭头方向移动，直到数码2位于b为止。若这时刚好数码3在位置c，则转(6)。\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_87_0.png)\n![](img/e134d51e2ca4313e722468ebe37ad4b6_87_1.png)\n\
    ![](img/e134d51e2ca4313e722468ebe37ad4b6_87_2.png)\n![](img/e134d51e2ca4313e722468ebe37ad4b6_87_3.png)\n\
    ![](img/e134d51e2ca4313e722468ebe37ad4b6_87_4.png)\n![](img/e134d51e2ca4313e722468ebe37ad4b6_87_5.png)\n\
    ![](img/e134d51e2ca4313e722468ebe37ad4b6_87_6.png)\n![](img/e134d51e2ca4313e722468ebe37ad4b6_87_7.png)\n\
    \n初始状态 及 目标状态\n\n(a) (b)\n\n**(4)** 依次移动将牌，使得空格位置沿图所示的箭头方向移动，直到数码3位于e为止。这时空格刚好在位置d。\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_88_0.png)\n\n**(5)** 依次移动将牌，使得空格位置沿图所示的箭头方向移动，直到空格又回到了d为止。\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_88_1.png)\n\n**(6)** 依次移动将牌，使得空格位置沿图所示的箭头方向移动，直到数码4在位置f为止。若这时刚好数码5在位置g则转(9)。\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_88_2.png)\n\n**(7)** 依次移动将牌，使得空格位置沿图所示的箭头方向移动，直到数码5位于e为止。这时空格刚好在位置d。\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_88_3.png)\n\n**(8)** 依次移动将牌，使得空格位置沿图所示的箭头方向移动，直到空格又回到位置d为止。\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_88_4.png)\n\n(9) 依次移动将牌，使得空格位置沿图所示的箭头方向移动，直到数码6在位置h为止，若这时数码7、8分别在位置g和d，则问题得解，否则，说明由所给初始状态达不到所要求的目标状态。\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_89_0.png)\n\n## 第三讲 产生式表示法及应用\n\n“产生式”的概念由逻辑学家Post\
    \ 1943年提出，他根据串替代规则提出了一种称为Post机的计算模型，模型中的每一条规则称为一个产生式。所以，产生式表示法又称为产生式规则表示法，但由于缺乏控制策略，不适合开发实际的应用系统。1972年，Newell和Simon在研究人类的认知模型中开发了基于规则的产生式系统。现在，产生式系统已经发展成为人工智能系统中最典型的一种基本结构，是专家系统及其他应用人工智能系统中最自然的知识表示及推理的基本模型。\n\
    \n## 第一节 产生式可表示的知识种类及其基本形式\n\n一、可表示的知识种类\n\n用来描述事实、规则以及它们的不确定性度量\n\n二、产生式的基本形式\n\
    \nP→Q　　或　　IF P THEN Q\n\n三、产生式与逻辑谓词中蕴含的区别\n\n## 第二节 知识的表示方法\n\n- 一、确定性规则知识的表示方法\n\
    \  - P→Q 或 IF P THEN Q\n\n- 二、不确定性规则知识的表示方法\n  - P→Q（置信度） 或 IF P THEN Q（置信度）\n\
    \n- 三、确定性事实性知识的表示方法\n  - （对象，属性，值） 或 （关系，对象1，对象2）\n\n- 四、不确定性事实性知识的表示方法\n  - （对象，属性，值，可信度值）\
    \ 或 （关系，对象1，对象2，可信度值）\n\n## 第三节 产生式系统的组成\n\n一个典型的产生式系统由规则库、综合数据库、推理机三大部分组成。它们之间的关系如图所示。\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_94_0.png)\n\n## 一、规则库(知识库)\n\n- 用于描述某领域内知识的产生式（规则）集合，是某领域知识的存储器。也称知识库。\n\
    - 包含着将问题从初始状态转换成目标状态（或解状态）的那些变换规则。\n- 是专家系统的核心。\n\n## 二、综合数据库\n\n- 存储所求解问题的初始状态及已知事实，推理的中间结果以及结论。\n\
    - 随着产生式系统问题求解(推理)过程的进展，综合数据库的有些内容(如推理的中间结果)动态变化。综合数据库又称为动态数据库、短期数据库缓冲器。\n- 综合数据库是产生式系统中主要的数据结构，可以通过简单的表、数组、带索引的文件结构、关系数据库等来实现。\n\
    \n## 三、推理机\n\n- 是一个或一组程序，用来控制和协调规则库与综合数据库的运行。\n- 包含推理方式和控制策略。\n\n## 第四节 产生式系统的控制策略\n\
    \n### 一、作用\n\n就是确定选用什么规则或如何应用规则。\n\n### 二、组成\n\n由模式匹配、选择（冲突解决）、执行三个阶段组成。\n\n-\
    \ 匹配：将当前综合数据库中的事实与规则中的条件进行比较\n- 冲突解决：根据预先确定的评价准则决定选择被执行规则\n- 执行：把所选择规则的结论添加到综合数据库，作为新的事实。\n\
    \n![](img/e134d51e2ca4313e722468ebe37ad4b6_99_0.png)\n\n索引变量近似过滤\n\n专一性排序\n规则排序\n\
    规模排序\n就近排序\n\n2022-11-3\n\n## 一、正向推理\n\n它从已知事实出发，通过规则库求得结论。正向推理方式又称为数据驱动方式、自底向上方式。\n\
    \n### 推理过程\n\n例如，有规则集如下：\n\n规则1：\\( P_1 \\rightarrow P_2 \\) 规则2：\\( P_2 \\rightarrow\
    \ P_3 \\) 规则3：\\( P_3 \\rightarrow q_3 \\)\n\n如果综合数据库中含有事实\\( P_1 \\)，则应用这三条规则进行正向推理，即从\\\
    ( P_1 \\)出发推导出\\( q_3 \\)的过程如图所示。\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_101_0.png)\n\
    \n"
