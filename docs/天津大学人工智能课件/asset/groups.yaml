    # 一、什么是产生式系统


    +   - 产生式系统（production system）是由波斯特（Post）于1943年提出的产生式规则而得名。

    +   - 产生式系统用来描述若干个不同的以一个基本概念为基础的系统。这个基本概念就是产生式规则或产生式条件和操作对的概念。

    +   - 在产生式系统中，论域的知识分为两部分：用事实表示静态知识，用产生式规则表示推理过程和行为。

    +   - 由于这类系统的知识库主要用于存储规则，因此又把此类系统称为基于规则的系统（rule-based system）。'
