    \ x)⇒ 假言推理\n\nLike(wang,C) 王程喜欢C这门课。\n\n2022-11-3 归结策略 30\n\n## 归结策略\n\n归结演绎推理实际上就是从子句集中不断寻找可进行归结的子句对，并通过对这些子句对的归结，最终得出一个空子句的过程。\n\
    \n盲目地全面进行归结，产生许多无用的归结式，严重的是会产生组合爆炸问题。\n\n常用的归结策略可分为两大类：\n\n- **删除策略**——通过删除某些无用的子句来缩小归结范围；\n\
    - **限制策略**——通过对参加归结的子句进行某些限制，来减少归结的盲目性，以尽快得到空子句。\n\n## 前束范式\n\n- 设F为一谓词公式，如果其中的所有量词均非否定地出现在公式的最前面，而它们的辖域为整个公式，则称F为前束范式。\n\
    \n$F(x,y,w)=(\\forall x)(\\forall y)(\\exists w)(P(x)\\land Q(y,w)\\lor R(x,w))$\n\
    \n- 任何一谓词公式均可化为与其对应的前束范式，其化简方法将在后面子句集的化简中讨论。\n\n- Skolem范式\n\n- 前束范式中所有的存在量词都在全称量词之前的谓词公式形式。\n\
    \n- 状态空间法问题求解\n\n## 第六讲　人工神经网络\n\n广义上讲，神经网络是泛指生物神经网络与人工神经网络两方面。\n\n所谓**生物神经网络**是指由中枢神经系统（脑和脊髓）及周围神经系统（感觉神经、运动神经、交感神经、副交感神经）所构成的错综复杂的神经网络，它负责对动物机体各种活动的管理，其中最重要的是脑神经系统。\n\
    \n所谓**人工神经网络**是指模拟人脑神经系统的结构和功能，运用大量的处理部件，由人工方式建立起来的网络系统。\n\n## 第一节 神经网络的基本概念及组成特征\n\
    \n## 一、生物神经元的结构\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_267_0.png)\n\n## 二、神经元的功能特性\n\
    \n- 1 时空整合功能\n- 2 神经元的动态极化性\n- 3 兴奋与抑郁状态\n- 4 结构的可塑性\n- 5 脉冲与电位信号的转换\n- 6 突触延期和不应期\n\
    - 7 学习、遗忘和疲劳\n\n## 三、人工神经元的组成和分类\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_269_0.png)\n\
    \n## 1 人工神经元的组成\n\n# 神经元的能量函数、作用函数、激活函数\n\n![](img/e134d51e2ca4313e722468ebe37ad4b6_270_0.png)\n\
    \n神经元的内部阈值为 $\\theta$\n\n$y=f\\left(\\sum_{i=1}^{n}w_i x_i-\\theta\\right)$\n\n\
    神经元的输入\n\n权值 $w_i$ 可在 $(-1,+1)$ 区间变化\n\n## 2 激发函数 (activation function)或作用函数 \\\
    ( f \\)\n\n作用是把可能的无限域变换到给定的范围内输出，以模拟生物神经元非线性转移特性，因此，它决定节点输出信号的范围。\n\n- 阈值型  \n\
    \  \\( f(x) = \\begin{cases} 1, & x > 0 \\\\ 0, & x \\leq 0 \\end{cases} \\)\n\
