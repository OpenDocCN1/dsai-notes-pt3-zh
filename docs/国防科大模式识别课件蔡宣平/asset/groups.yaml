    # 在某些实际问题中，可能存在以下几种情况：


    +   (1) 不知道各类的先验概率  P(ω_i)；

    +   (2) 难以确定误判的代价  λ_ij；

    +   (3) 某一种错误较另一种错误更为重要。


    针对(1)，可以采用最小最大损失准则或令各类别概率相等的做法克服；


    针对(2)，如果允许的话，可以避开使用损失函数而采用最小误判概率准则；


    针对(3)，可以采用最小损失准则判决。针对上面的三个问题，更主要的是针对(3)，我们采用 N-P 准则。'
  - '[PAGE 462]


    所谓N-P准则，是严格限制较重要的一类错误概率令其等于某常数而使另一类误判概率最小。


    对两类问题， $d(\vec{x})=0$ 将特征空间 $\Omega$ 分成两个子空间 $\Omega_1$ 和 $\Omega_2$，其中 $\Omega_1
    \cup \Omega_2 = \Omega$， $\Omega_1 \cap \Omega_2 = \Phi$。

    当一模式特征点 $\vec{x} \in \Omega_1$ 时，判决 $\vec{x} \in \omega_1$；当 $\vec{x} \in \Omega_2$
    时，判决 $\vec{x} \in \omega_2$。'
