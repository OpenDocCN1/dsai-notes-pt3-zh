  - '[PAGE 383]


    # “概率论” 有关概念复习


    划分：设S为实验E的样本空间，B₁, B₂, ..., Bₙ为E的一组事件，若 Bᵢ∩Bⱼ=Φ，i≠j，i, j=1, 2, ..., n； B₁ ∪ B₂
    ∪... ∪ Bₙ=S 则称，B₁, B₂, ..., Bₙ是样本空间S的一个划分。对每次实验，B₁, B₂, ..., Bₙ中必有一个且仅有一个发生。


    全概率公式：设实验E的样本空间为S，A为E的事件，B₁, B₂, ..., Bₙ为S的一个划分，且 P(Bᵢ)>0 (i=1, 2, ..., n)，则 P(A)=P(A|B₁)P(B₁)+
    P(A|B₂)P(B₂)+...+ P(A|Bₙ)P(Bₙ)'
  - '[PAGE 384]


    # “概率论” 有关概念复习


    Bayes公式：设实验E的样本空间为S，A为E的事件，


    B₁, B₂, ..., Bₙ为S的一个划分，且P(A)>0，P(Bᵢ)>0，


    (i=1, 2, ..., n)，则：


    $P(B_i \mid A) = \frac{P(A \mid B_i)P(B_i)}{\sum_{j=1}^{n} P(A \mid B_j)P(B_j)}
    = \frac{P(A \mid B_i)P(B_i)}{P(A)}$


    $P(A)P(B_i \mid A) = P(B_i)P(A \mid B_i)$'
