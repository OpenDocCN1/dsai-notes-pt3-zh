    ## 7.7.1 次优搜索法

    ### (二)增添特征法


    该方法也称为顺序前进法(SFS)。这是最简单的自下而上搜索方法，每次从未选入的特征中选择一个特征，使它与已选入的特征组合在一起时J值最大，直到选入特征数目达到指定的维数d为止。


    设已选入了*k*个特征，它们记为*X_k*，把未选入的 *n-k*个特征*x_j* (*j*=1,2,...,*n-k*)逐个与已选入的特征*X_k* 组合计算*J*值，若：


    *J*(*X_k* + *x_1*) ≥ *J*(*X_k* + *x_2*) ≥ … ≥ *J*(*X_k* + *x_{n-k}*)


    则*x_1*选入，下一步的特征组合为*X_{k+1}=X_k+x_1*。开始时，*k*=0，*X_0*=Φ，该过程一直进行到*k=d*为止。


    该方法比“单独最优的特征选择法”要好，但其缺点也是明显的：即某特征一旦选入，即使后边的n-k特征中的某个从组合讲比它好，也无法把它剔除。


    ### (三) 剔减特征法


    该方法也称为顺序后退法(SBS)。这是一种自上而下的搜索方法，从全部特征开始每次剔除一个特征，所剔除的特征应使尚保留的特征组合的值最大。


    设已剔除了k个特征，剩下的特征组记为\(\bar{X}_k\)，将\(\bar{X}_k\)中的各特征\(x_j\ (j=1,2,...,n-k)\)分别逐个剔除，并同时计算\(J(\bar{X}_k
    - x_j)\)值，若：


    \(J(\bar{X}_k - x_1) \ge J(\bar{X}_k - x_2) \ge \cdots \ge J(\bar{X}_k - x_{n-k})\)


    则在这轮中\(x_1\)应该剔除。\(\bar{X}_{k+1} = \bar{X}_k - x_1\)


    这里初值\(k=0, \bar{X}_0 = \{x_1, x_2, \cdots, x_n\}\)，过程直到\(k=n-d\)为止。


    ### （四）增l减r法（l-r法）


    为了克服前面方法（二）、（三）中的一旦某特征选入或剔除就不能再剔除或选入的缺点，可在选择过程中加入局部回溯，例如在第k步可先用方法（二），对已选入的 k个特征再一个个地加入新的特征到k+l个特征，然后用方法（三）一个个地剔除
    r个特征，称这种方法为增 l减r法(l-r法)。


    ## 7.7.2 最优搜索法


    寻求全局最优的特征选择的搜索过程可用一个树结构来描述，称为其为搜索树或解树。


    总的搜索方案是沿着树自上而下、从右至左进行，由于树的每个节点代表一种特征组合，于是所有可能的组合都可以被考虑。


    利用可分性判据的单调性采用分支定界策略和值左小右大的树结构，使得在实际上并不计算某些特征组合而又不影响全局寻优。这种具有上述特点的快速搜索方法，称为分支定界算法。


