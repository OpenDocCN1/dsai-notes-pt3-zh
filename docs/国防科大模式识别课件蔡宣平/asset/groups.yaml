    \n## 第七章 特征提取与选择\n\n### 7.1概述\n\n通常在得到实际对象的若干具体特征之后，再由这些原始特征产生出对分类识别最有效、数目最少的特征，这就是特征提取与选择\
    \ 的任务。从本质上讲，我们的目的是使在最小维数特征空间中异类模式点相距较远（类间距离较大），而同类模式点相距较近（类内距离较小）。\n\n### 7.1概述\n\
    \n特征提取与选择的两个基本途径\n\n（2）变换法，在使判据J 取最大的目标下，对n个原始特征进行变换降维，即对原n 维特征空间进行坐标变换，然后再取子空间。\n\
    \n主要方法有：基于可分性判据的特征选择、基于误判概率的特征选择、离散K-L变换法(DKLT)、基于决策界的特征选择等方法。\n\n## 第七章 特征提取与选择\n\
    \n## 7.2 类别可分性判据\n\n### 7.2 类别可分性判据\n\n构造可分性判据\n\n为确立特征提取和选择的准则：引入类别可分性判据，来刻划特征对分类的贡献。为此希望所构造的可分性判据满足下列要求：\n\
    \n- (1) 与误判概率(或误分概率的上界、下界)有单调关系。\n\n- (2) 当特征相互独立时，判据有可加性，即：\n\n```\nJ_{ij}(x_1,x_2,\\\
    cdots,x_d)=\\sum_{k=1}^{d}J_{ij}(x_k)\n```\n\n式中，x_1,x_2,\\cdots,x_d 是对不同种类特征的测量值，J_{ij}(·)表示使用括号中特征时第i类与第j类可分性判据函数。\n\
    \n### 7.2 类别可分性判据\n\n构造可分性判据\n\n(3) 判据具有“距离”的某些特性，即 ：\nJ_{ij} > 0 ，当 i ≠ j 时；\n\
    J_{ij} = 0 ，当 i = j 时；\nJ_{ij} = J_{ji}\n\n(4) 对特征数目是单调不减，即加入新的特征后，判据值不减。\nJ_{ij}(x_1,x_2,⋯,x_d)\
    \ ≤ J_{ij}(x_1,x_2,⋯,x_d,x_{d+1})\n\n### 7.2 类别可分性判据\n\n构造可分性判据\n\n值得注意的是：上述的构造可分性判据的要求，即\
    \ “单调性”、“叠加性”、“距离性”、“单调不减性”。在实际应用并不一定能同时具备，但并不影响它在实际使用中的价值。\n\n### 7.2 类别可分性判据\n\
    \n### 7.2.1 基于几何距离的可分性判据\n\n一般来讲，不同类的模式可以被区分是由于它们所属类别在特征空间中的类域是不同的区域。\n\n显然，区域重叠的部分越小或完全没有重叠，类别的可分性就越好。\n\
    \n因此可以用距离或离差测度（散度）来构造类别的可分性判据。\n\n### 7.2.1 基于几何距离的可分性判据\n\n（一） 点与点的距离\n\n$d(\\\
    vec{a},\\vec{b})=\\left[(\\vec{a}-\\vec{b})^{\\mathrm{T}}(\\vec{a}-\\vec{b})\\\
    right]^{1/2}=\\left[\\sum_{k=1}^{n}(a_k-b_k)^2\\right]^{1/2}$\n\n（二） 点到点集的距离\n\
    \n用均方欧氏距离表示\n\n$\\bar{d}^{2}\\left(\\vec{x},\\{\\vec{a}_{k}^{(i)}\\}\\right)=\\\
    frac{1}{N_i}\\sum_{k=1}^{N_i}d^{2}\\left(\\vec{x},\\vec{a}_{k}^{(i)}\\right)$\n\
    \n类的均值矢量： $\\tilde{m}^{(i)} = \\frac{1}{N_i} \\sum_{k=1}^{N_i} \\tilde{x}_k^{(i)}$\
    \   i = 1,2,\\cdots,c\n\n各类模式的总体均值矢量 $\\tilde{m} = \\sum_{i=1}^c P_i \\tilde{m}^{(i)}$\n\
    \nP_i为相应类的先验概率率，当用统计量代替先验概率时，总体均值矢量可表示为：\n\n```\n\\tilde{m} = \\sum_{i=1}^c P_i\
    \ \\tilde{m}^{(i)} = \\sum_{i=1}^c \\frac{N_i}{N} \\tilde{m}^{(i)} = \\frac{1}{N}\
    \ \\sum_{i=1}^c \\sum_{k=1}^{N_i} \\tilde{x}_k^{(i)} = \\frac{1}{N} \\sum_{l=1}^N\
    \ \\tilde{x}_l\n```\n\n### 7.2.1 基于几何距离的可分性判据\n\n（五）类内离差矩阵\n\n$$S_{\\omega_i}=\\\
    frac{1}{N_i}\\sum_{k=1}^{N_i}(\\vec{x}_k^{(i)}-\\vec{m}^{(i)})(\\vec{x}_k^{(i)}-\\\
    vec{m}^{(i)})^{\\mathrm{T}}$$\n\n显然 $$\\bar d^2(\\omega_i)=\\operatorname{Tr}[S_{\\\
    omega_i}]$$\n\n（六）两类之间的距离\n\n$$\\bar d^2(\\omega_i,\\omega_j)=\\frac{1}{N_iN_j}\\\
    sum_{k=1}^{N_i}\\sum_{l=1}^{N_j}d^2(\\vec{x}_k^{(i)},\\vec{x}_l^{(j)})$$\n\n$$\\\
    bar d^2(\\omega_i,\\omega_j)=\\frac{1}{N_iN_j}\\sum_{k=1}^{N_i}\\sum_{l=1}^{N_j}(\\\
    vec{x}_k^{(i)}-\\vec{x}_l^{(j)})^{\\mathrm{T}}(\\vec{x}_k^{(i)}-\\vec{x}_l^{(j)})$$\n\
    \n### 7.2.1基于几何距离的可分性判据\n\n（七）各类模式之间的总的均方距离\n\nd̄²(x⃗) = 1/2 Σᵢ₌₁ᶜ Pᵢ Σⱼ₌₁ᶜ Pⱼ\
    \ 1/(Nᵢ Nⱼ) Σₖ₌₁^{Nᵢ} Σₗ₌₁^{Nⱼ} d²(x⃗ₖ^{(i)}, x⃗ₗ^{(j)})\n\n当取欧氏距离时，总的均方距离为\n\n\
    d̄²(x⃗) = 1/2 Σᵢ₌₁ᶜ Pᵢ Σⱼ₌₁ᶜ Pⱼ 1/(Nᵢ Nⱼ) Σₖ₌₁^{Nᵢ} Σₗ₌₁^{Nⱼ} (x⃗ₖ^{(i)} - x⃗ₗ^{(j)})ᵀ\
    \ (x⃗ₖ^{(i)} - x⃗ₗ^{(j)})\n\n### 7.2.1基于几何距离的可分性判据\n\n（八） 多类情况下总的类内、类间及总体离差矩阵\n\
    \n类内离差 $S_W = \\sum_{i=1}^{c} P_i S_{\\omega_i} = \\sum_{i=1}^{c} P_i \\frac{1}{N_i}\
    \ \\sum_{k=1}^{N_i} (\\vec{x}_k^{(i)} - \\vec{m}^{(i)})(\\vec{x}_k^{(i)} - \\\
    vec{m}^{(i)})^T$\n\n类间离差 $S_B = \\sum_{i=1}^{c} P_i (\\vec{m}^{(i)} - \\vec{m})(\\\
    vec{m}^{(i)} - \\vec{m})^T$\n\n总体离差 $S_T = \\frac{1}{N} \\sum_{l=1}^{N} (\\vec{x}_l\
    \ - \\vec{m})(\\vec{x}_l - \\vec{m})^T = S_W + S_B$\n\n易导出 $\\bar{d}^2(\\vec{x})\
    \ = Tr[S_W + S_B] = Tr[S_T]$\n\n### 7.2.1 基于几何距离的可分性判据\n\n可以用 S_W、S_B、S_T 构造不同的可分性判据：\n\
    \n```\nJ₁ = Tr[S_W^{-1} S_B]\nJ₂ = ln[ |S_B| / |S_W| ]\nJ₃ = Tr[S_B] / Tr[S_W]\n\
    J₄ = |S_W + S_B| / |S_W| = |S_T| / |S_W|\n```\n\n可以证明 J₁、J₂ 和 J₄ 在任何非奇异线性变换下是不变的，J₃\
    \ 与坐标系有关。\n"
