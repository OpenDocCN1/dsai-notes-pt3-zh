  - "[PAGE 598]\n\n# 剪辑最近邻方法　　　　　　　　　MULTIEDIT实用算法\n\n+   1. 将样本集 $X^{(N)}$ 随机地划分为\
    \ $s$ 个子集：\n+   \n+      $$X^{(N)}=\\{X_1,X_2,\\cdots,X_s\\}\\qquad(s\\geq 3)$$\n\
    \n+   2. 用最近邻法，以 $X_{(i+1)\\bmod s}$ 为参照集，对 $X_i$ 中的样本进行分类，其中 $i=1,2,\\cdots,s$；\n\
    \n+   3. 去掉（2）中被错误分类的样本；\n\n+   4. 用所留下的样本构成新的样本集 $X^{(NE)}$；\n\n+   5. 如果经过 $k$\
    \ 次迭代再没有样本被剪辑掉则停止；\n+      否则转至（1）。"
