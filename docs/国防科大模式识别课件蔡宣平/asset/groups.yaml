    # 第三章 判别域代数界面方程法


    # 3.2 线性判别函数


    在n维特征空间中, 特征向量 x⃗₀ = (x₁, x₂,....xₙ)′, 线性判别函数的一般形式是：


    d(x⃗) = w₁x₁ + w₂x₂ + ⋯ + wₙxₙ + wₙ₊₁ ≡ w⃗₀′x⃗ + wₙ₊₁


    其中 w⃗₀ = (w₁, w₂,....wₙ)′ 称为权矢量或系数矢量。


    简化为： d(x⃗) ≡ w⃗′x⃗


    x⃗ = (x₁, x₂,...xₙ, 1)′      w⃗ = (w₁, w₂,....wₙ, wₙ₊₁)′


    x⃗和w⃗分别称为增广特征矢量和增广权矢量。'
