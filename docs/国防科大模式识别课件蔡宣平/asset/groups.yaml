    窗口选择是否适当对估计结果有一定影响。\n\np(x) = { 1,      -2.5 < x < -2\n0.25    0 < x < 2\n0  \
    \     其它 }\n\nφ(u) 和 h_N 同上\n\n由图中曲线可以看出，当N较小时，窗函数对估计结果影响较大，其估计结果与真实分布相差较远；当N增大时，估计结果与真实分布较为接近。\n\
    \n![](img/d893b90ad57f036ece52d376593dc2c5_563_0.png)\n\n## 5.4 概密的窗函数估计法\n###\
    \ k_N-近邻估计法\n\n在P—窗法中，把体积 V_N 作为 N 的函数导致 V_N\n\n对估计结果影响很大。例如 V_N = V_1 / √N\n\n\
    当 V_1 选得太小将导致大部分区域是空的，会使 p̂_N (x̄) 不稳定；\n\n当 V_1 选得太大，则 p̂_N (x̄) 较平坦，将丢失 p(x̄)\
    \ 的一些重要空间变化。\n\nk_N —近邻元估计法是克服这个问题的一个可能的方法。\n\n基本思想：把含 x̄ 点的序列区域的体积 V₁,V₂,…,V_N,…\n\
    \n作为落入 R_N 中样本数 k_N 的函数，而不是直接作为实验样本数 N 的函数。我们可以预先确定 k_N 是 N 的某个函数，然后在 x̄ 点附近选择一“紧凑”区域，让它只含\
    \ k_N 个邻近样本。\n\n如果 x̄ 点附近概密较大，则包含 k_N 个样本的区域体积自然就相对的小；\n\n如果 x̄ 点附近概密较小，则区域体积就较大。显然，当区域为含有\
    \ k_N 个邻近样本而扩展到高密度区时，扩展过程必然会停止。\n\n如果满足条件\n\n- ① lim V_N = 0\n  N→∞\n- ② lim k_N\
    \ = ∞\n  N→∞\n- ③ lim k_N / N = 0\n  N→∞\n\n则 $\\hat{p}_N(\\bar{x}) = \\frac{k_N\
