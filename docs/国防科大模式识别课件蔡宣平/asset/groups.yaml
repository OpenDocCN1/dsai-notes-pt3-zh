    \np̂(x⃗|ωᵢ)=∑_{j=1}^{4} C_{ij} φⱼ(x⃗)\n\ni=1,2(类别号); j=1,2,3,4(正交函数项数)\n\nC_{ij}=1/Nᵢ\
    \ ∑_{k=1}^{Nᵢ} φⱼ(x⃗ₖ^{(i)})      N₁=7, N₂=6\n\n## 对于ω₁,N₁=7,系数为\n\nφ₁(x) = 1\
