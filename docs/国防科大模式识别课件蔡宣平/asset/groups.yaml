    \ ≤ a^λ b^{1-λ} (a ≥ 0, b ≥ 0, 0 ≤ λ ≤ 1)，由上式进一步可得：\n\nP₀(e) ≤ P(ω₁)^s P(ω₂)^{1-s}\
