    ## 概念


    - 模式识别 (Pattern Recognition)：确定一个样本的类别属性（模式类）的过程，即把某一样本归属于多个类型中的某个类型。

    - 样本 (Sample)：一个具体的研 究（客观）对象。如患者，某人写的一个汉字，一幅图片等。

    - 模式 (Pattern)：对客体（研究对象）特征的描述（定量的或结构的描述），是取自客观世界的某一样本的测量值的集合（或综合）。


    ## 概念


    - 特征(Features)：能描述模式特性的量（测量值）。在统计模式识别方法中，通常用一个向量 $\vec{x}$ 表示，称之为特征向量，记为 $\vec{x}
    = (x_1, x_2, \cdots, x_n)''$

    - 模式类(Class)：具有某些共同特性的模式的集合。


    ## 模式识别的例子


    计算机自动诊断疾病：


    - 1. 获取情况(信息采集) 测量体温、血压、心率、血液化验、X光透射、B超、心电图、CT等尽可能多的信息，并将这些信息数字化后输入电脑。当然在实际应用中要考虑采集的成本，这就是说特征要进行选择的。


    - 2. 运行在电脑中的专家系统或专用程序可以分析这些数据并进行分类，得出正常或不正常的判断，不正常情况还要指出是什么问题。


    ## 各类空间（Space）的概念


    模式识别三大任务


    对象空间


    模式空间


    特征空间


    类型空间


    模式采集：从客观世界（对象空间）到模式空间的过程称为模式采集。


    特征提取和特征选择：由模式空间到特征空间的变换和选择。


    类型判别：特征空间到类型空间所作的操作。


    ## 1.1 概述—模式识别系统


    待识对象 → 数据采集 特征提取 → 二次特征提取与选择 → 分类识别 → 识别结果


    数字化——比特流

    很广泛，与要解决的具体问题有关，例如，从图像中将汽车车牌的号码识别出来，就需要先将车牌从图像中找出来，再对车牌进行划分，将每个数字分别划分开。做到这一步以后，才能对每个数字进行识别。以上工作都应该在预处理阶段完成。


