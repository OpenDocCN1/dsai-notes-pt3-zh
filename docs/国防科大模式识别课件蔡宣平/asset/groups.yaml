    ## 1.3 随机矢量的描述

    ### (二)随机矢量的数字特征：

    #### (4) 相关系数


    r_ij = σ_ij² / (σ_ii σ_jj)


    由布尼亚科夫斯基不等式知： |σ_ij²| ≤ σ_ii σ_jj


    -1 ≤ r_ij ≤ 1


    相关系数矩阵定义为： r = (r_ij)_{n×n}


    ## 1.3 随机矢量的描述

    ### (二) 随机变量、随机矢量间的统计关系

    #### (1) 不相关


    随机矢量 $\vec{X}$ 的第 i 个分量 $X_i$ 和第 j 个分量 $X_j$，若有


    $\sigma_{ij}^2 = E[(X_i - \bar{X}_i)(X_j - \bar{X}_j)] = 0,\ (i \neq j)$


    则称它们不相关。这等价于


    $E(X_i X_j) = E[X_i]E[X_j]$


    随机矢量 $\vec{X}$ 和 $\vec{Y}$ 不相关的充要条件是互协方差矩阵：

    $$\operatorname{cov}(\vec{X},\vec{Y}) = \phi$$


    亦即

    $$E(\vec{X}\vec{Y}'') = E[\vec{X}]E[\vec{Y}'']$$


    #### (2) 正交


    随机矢量 $\vec{X}$ 和 $\vec{Y}$ 若满足


    E[$\vec{X}\vec{Y}$] = 0


    则称 $\vec{X}$ 和 $\vec{Y}$ 正交。


    #### (3) 独立


    随机矢量 $\vec{X}$ 和 $\vec{Y}$ 的联合概率密度函数


    $p(\vec{x}, \vec{y})$ 若满足


    $p(\vec{x}, \vec{y}) = p(\vec{x}) p(\vec{y})$


    则称 $\vec{X}$ 和 $\vec{Y}$ 独立。


    独立→不相关

    不相关≠独立


    ## 1.4 正态分布

    ### （1）一维随机变量的正态分布


    正态分布的一维随机变量X的概率密度函数


    p(x) = 1 / (√(2π) σ) exp[ - (x - μ)² / (2σ²) ]


    式中，μ 为数学期望，σ² 为方差。


    ![](img/d893b90ad57f036ece52d376593dc2c5_63_0.png)


    正态分布概率密度函数由两个参数 μ 和 σ² 就可以完全确定。


    μ = E[X] = ∫_{-∞}^{∞} x p(x) dx


    σ² = E[(X - μ)²] = ∫_{-∞}^{∞} (x - μ)² p(x) dx


    ### （2）随机矢量的正态分布


    正态分布随机矢量 $\vec{X} = (X_1, X_2, \cdots, X_n)''$ 的概率密度函数定义为：


    $p(x_1, x_2, \cdots, x_n) = p(\vec{x})$

    $= \frac{1}{(2\pi)^{n/2} |\Sigma|^{1/2}} \exp\left[-\frac{1}{2} (\vec{x} - \vec{\mu})''
    \Sigma^{-1} (\vec{x} - \vec{\mu})\right]$


    式中， $\vec{\mu}=E[\vec{X}]=(E[X_1],E[X_2],\cdots,E[X_n])''$ 为 $X$ 的数学期望矢量； $\Sigma$
    为 $X$ 的协方差矩阵，


    $\Sigma = E[(\vec{X}-\vec{\mu})(\vec{X}-\vec{\mu})''] = \begin{pmatrix} \sigma_{11}^2
    & \sigma_{12}^2 & \cdots & \sigma_{1n}^2 \\ \sigma_{21}^2 & \sigma_{22}^2 & \cdots
    & \sigma_{2n}^2 \\ \vdots & \vdots &  & \vdots \\ \sigma_{n1}^2 & \sigma_{n2}^2
    & \cdots & \sigma_{nn}^2 \end{pmatrix}$


    ### (2) 二维随机变量的正态分布


    ![](img/d893b90ad57f036ece52d376593dc2c5_67_0.png)


    (a) 二维正态分布概密函数


    ![](img/d893b90ad57f036ece52d376593dc2c5_67_1.png)


    (b) 二维正态分布等概密点轨迹


    ### （3）正态分布的随机矢量的性质


    - 分布函数完全由 μ 和 Σ 确定

    - 等概率密度点的轨迹为一超椭球面

    - 对正态分布，不相关等价于独立

    - 其边缘密度和条件密度仍然是正态分布

    - 正态分布随机矢量的线性变换仍为正态随机矢量


