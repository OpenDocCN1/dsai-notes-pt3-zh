    正态分布随机矢量 $\vec{X} = (X_1, X_2, \cdots, X_n)''$ 的概率密度函数定义为：


    $p(x_1, x_2, \cdots, x_n) = p(\vec{x})$

    $= \frac{1}{(2\pi)^{n/2} |\Sigma|^{1/2}} \exp\left[-\frac{1}{2} (\vec{x} - \vec{\mu})''
    \Sigma^{-1} (\vec{x} - \vec{\mu})\right]$


    式中， $\vec{\mu}=E[\vec{X}]=(E[X_1],E[X_2],\cdots,E[X_n])''$ 为 $X$ 的数学期望矢量； $\Sigma$
    为 $X$ 的协方差矩阵，


    $\Sigma = E[(\vec{X}-\vec{\mu})(\vec{X}-\vec{\mu})''] = \begin{pmatrix} \sigma_{11}^2
    & \sigma_{12}^2 & \cdots & \sigma_{1n}^2 \\ \sigma_{21}^2 & \sigma_{22}^2 & \cdots
    & \sigma_{2n}^2 \\ \vdots & \vdots &  & \vdots \\ \sigma_{n1}^2 & \sigma_{n2}^2
    & \cdots & \sigma_{nn}^2 \end{pmatrix}$


    ### (2) 二维随机变量的正态分布


    ![](img/d893b90ad57f036ece52d376593dc2c5_67_0.png)


    (a) 二维正态分布概密函数


    ![](img/d893b90ad57f036ece52d376593dc2c5_67_1.png)


    (b) 二维正态分布等概密点轨迹


    ### （3）正态分布的随机矢量的性质


    - 分布函数完全由 μ 和 Σ 确定

    - 等概率密度点的轨迹为一超椭球面

    - 对正态分布，不相关等价于独立

    - 其边缘密度和条件密度仍然是正态分布

    - 正态分布随机矢量的线性变换仍为正态随机矢量


