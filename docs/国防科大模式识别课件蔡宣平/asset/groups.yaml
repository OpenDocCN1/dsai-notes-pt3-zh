  - '[PAGE 422]


    # 将属于 ω_i 类的模式误判为属于 ω_j 类的错误概率为


    P(L_ij < α | ω_i) = ∫_{-∞}^{α} 1/(√(2π) r_ij) exp[ - (L_ij - ½ r_ij²)² / (2 r_ij²)
    ] dL_ij = Φ( (α - r_ij² / 2) / r_ij )


    # 将属于 ω_j 类的模式误判为属于 ω_i 类的错误概率为


    P(L_ij > α | ω_j) = ∫_{α}^{∞} 1/(√(2π) r_ij) exp[ - (L_ij + ½ r_ij²)² / (2 r_ij²)
    ] dL_ij = 1 - Φ( (α + r_ij² / 2) / r_ij )


    式中 Φ(u) = ∫_{-∞}^{u} 1/√(2π) exp(- y² / 2) dy'
