    vec{x}-\\vec{y})p(\\vec{y})d\\vec{y}$\n\n又∵ $\\lim_{N\\to\\infty}V_N=0$, ∴ $\\\
    lim_{N\\to\\infty}\\delta_N(\\vec{x})=\\delta(\\vec{x})$\n\n∴ $\\lim_{N\\to\\\
    infty}E[\\hat{p}_N(\\vec{x})]=\\int\\delta(\\vec{x}-\\vec{y})p(\\vec{y})d\\vec{y}=p(\\\
    vec{x})$\n\n### (2) $\\hat{p}_N(\\vec{x})$ 均方收敛于 $p(\\vec{x})$\n\n∵ $\\vec{x}_j$\
    \ (j=1,2,...,N) 独立抽取，且分布相同以及 lim$_{N\\to\\infty}$ N V_N = ∞\n\n∴ Var[$\\hat{p}_N(\\\
