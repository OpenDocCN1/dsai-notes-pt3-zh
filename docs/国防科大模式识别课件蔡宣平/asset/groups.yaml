  - '[PAGE 351]


    显然，这两类不是线性可分的，因不能用一个分界点将两类分开。但是，对于一条穿过a、b两点的二次曲线，


    d(x) = (x - a)(x - b) = x² - (a + b)x + ab


    当 x ∈ ω₁ 即 x < a 或 x > b 时， d(x) > 0


    当 x ∈ ω₂ 即 a < x < b 时， d(x) < 0


    ![](img/d893b90ad57f036ece52d376593dc2c5_351_0.png)'
  - "[PAGE 352]\n\n如果作非线性变换：\n\n$y_1 = x^2$\n$y_2 = x$\n\n则原来的一维特征空间映射为二维特征空间，二次判别函数\
    \ $d(x)$ 变换后在二维特征空间中映射成一次判别函数： $d(\\vec{y}) = y_1 - (a+b) y_2 + ab$\n\n原来的一维非线性可分的模式在所映射的二维特征空间中是线性可分的，即：\n\
    $\begin{cases} \\vec{y} \\in \\omega_1 & d(\\vec{y}) > 0 \\\\ \\vec{y} \\in \\\
    omega_2 & d(\\vec{y}) < 0 \\end{cases}$\n\n![](img/d893b90ad57f036ece52d376593dc2c5_352_0.png)"
