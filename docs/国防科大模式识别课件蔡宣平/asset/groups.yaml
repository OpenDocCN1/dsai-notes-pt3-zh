    \ \\int_{\\Omega} \\left[ p(\\vec{x}|\\omega_1) p(\\vec{x}|\\omega_2) \\right]^{1/2}\
    \ d\\vec{x}$\n\n$= \\left[ P(\\omega_1) P(\\omega_2) \\right]^{1/2} \\exp\\left[\
