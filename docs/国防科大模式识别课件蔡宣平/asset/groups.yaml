    ## 第二章 聚类分析

    ### 2.1 聚类分析的概念

    #### 一、聚类分析的基本思想


    - 相似的归为一类。

    - 模式相似性的度量和聚类算法。

    - 无监督分类（Unsupervised）。


    #### 二、特征量的类型


    - 物理量——（重量、长度、速度）

    - 次序量——（等级、技能、学识）

    - 名义量——（性别、状态、种类）


    #### 三、方法的有效性


    取决于分类算法和特征点分布情况的匹配。


    ##### 分类无效时的情况


    - 1. 特征选取不当使分类无效。


    ![](img/d893b90ad57f036ece52d376593dc2c5_74_0.png)


    - 2. 特征选取不足可能使不同类别的模式判为一类。


    ![](img/d893b90ad57f036ece52d376593dc2c5_75_0.png)


    - 3. 特征选取过多可能无益反而有害, 增加分析负担并使分析效果变差。


    ![](img/d893b90ad57f036ece52d376593dc2c5_76_0.png)


    - 4. 量纲选取不当。


    ![](img/d893b90ad57f036ece52d376593dc2c5_77_0.png)


    ![](img/d893b90ad57f036ece52d376593dc2c5_78_0.png)


    ![](img/d893b90ad57f036ece52d376593dc2c5_79_0.png)

    '
