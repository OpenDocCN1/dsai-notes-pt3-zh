    \ \\frac{p(\\vec{x}|\\omega_1)}{p(\\vec{x}|\\omega_2)} \\ge \\frac{P(\\omega_2)}{P(\\\
    omega_1)}$ 则判 $\\vec{x} \\in \\begin{cases} \\omega_1 \\\\ \\omega_2 \\end{cases}$\n\
    \n多类时：如果 $P(\\omega_i|\\vec{x}) = \\max_j [P(\\omega_j|\\vec{x})]$ 判 $\\vec{x}\
    \ \\in \\omega_i$\n\n## 2、最小损失准则\n\n两类时：如果 $\\frac{p(\\vec{x}|\\omega_1)}{p(\\\
    vec{x}|\\omega_2)} \\ge \\frac{P(\\omega_2)(\\lambda_{21}-\\lambda_{22})}{P(\\\
    omega_1)(\\lambda_{12}-\\lambda_{11})}$ 则判 $\\vec{x} \\in \\begin{cases} \\omega_1\
    \ \\\\ \\omega_2 \\end{cases}$\n\n多类时：计算 $R(\\alpha_j|\\vec{x}) = \\sum_{i=1}^{c}\
    \ \\lambda_{ij} P(\\omega_i|\\vec{x}) \\quad j = 1,2,\\cdots c$\n\n若 $R(\\alpha_l|\\\
    vec{x}) = \\min_{j} R(\\alpha_j|\\vec{x})$ 则判 $\\vec{x} \\in \\omega_l$\n\n##\
    \ 3、含拒绝判决的最小损失准则\n\n两类时：\n\np(\\vec{x}|\\omega_1) / p(\\vec{x}|\\omega_2) ≥ P(\\\
