    # 2.4.3 动态聚类法——C-均值法


    # 关于C-均值法收敛性的分析


    C-均值法中隐含地运用了准则函数：


    $$J^{(k)} = \sum_{j=1}^{c} \sum_{\vec{x}_i \in \omega_j^{(k)}} \left\| \vec{x}_i
    - \vec{z}_j^{(k)} \right\|^2$$


    随着迭代次数k的增加，$J^{(k)}$ 趋于变小。


    C-均值法算法简单且收敛（已于1974年和1967年分别给出了严格证明）。'
