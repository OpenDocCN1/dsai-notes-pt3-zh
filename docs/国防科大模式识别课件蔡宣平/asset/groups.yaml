    # 3.4 Fisher线性判别


    **思想：** 多维 ⇒ Fisher变换 ⇒ 利于分类的一维


    **方法：** 求权矢量 $\vec{w}$ ⇒ 求满足上述目标的投影轴的方向 $\vec{w}_0$ 和在一维空间中确定判别规则。'
