    - 基于总的类间离差矩阵 $S_B$ 的DKLT进行特征提取选择


    对于 $c$ 类问题，由于 $S_B$ 的秩不大于 $c-1$，故 $S_B$ 最多有 $c-1$ 个非零特征值，而模式的维数 $n$ 通常要大于 $c$，因此依据类间离差矩阵
    $S_B$ 进行特征选择是一个重要途径。具体的方法是：求出 $S_B$ 的非零特征值 $\lambda_i$ 和其相应的特征向量 $u_i$ $(i=1,2,\dots)$，按次序
    $\lambda_1 \ge \lambda_2 \ge \dots \ge \lambda_{c-1}$ 选取前 $d$ 个较大的特征值对应的特征向量构成变换矩阵，可实现特征的选取。


    类间离差矩阵 $S_B$ 反映了各类中心到总体中心的平均平方距离，依据 $S_B$ 进行 DKLT 的目的是使各类的中心在新的坐标系某些轴上的投影相距较远，从而便于选择部分分量。


    - • 基于总的类内离差矩阵 S_W 的DKLT进行特征提取选择


    S_W → λ_i → ū_i (i = 1,2,⋯,n) λ_i = ū_i^T S_W ū_i

    y_i = ū_i^T x̄ i = 1,2,⋯,d ; d ≤ n


    构造准则函数 J(y_i) = \frac{\bar u_i^T S_B \bar u_i}{\bar u_i^T S_W \bar u_i} = \frac{\bar
    u_i^T S_B \bar u_i}{\lambda_i}


    排序: J(y_1) ≥ J(y_2) ≥ ⋯ ≥ J(y_n), 取前面 d 个较大的 J(·) 值对应的 ū_i (i = 1,2,⋯,d)


    适用于各类模式的类域在某些分量轴上的投影不重叠或较少重叠的情况。


    - 依据 $S_W$、$S_B$ 作DKLT以降低特征维数的最优压缩方法


