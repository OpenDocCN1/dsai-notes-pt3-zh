    ## 2·4 聚类的算法——最大最小距离法


    ### 1. 条件及约定


    设待分类的模式为 {x₁, x₂, …, x_N}，选定比例系数 θ。


    ### 2. 算法思想


    在模式特征向量集中以最大距离原则选取新的聚类中心。以最小距离原则进行模式归类。这种方法通常也使用欧氏距离。

