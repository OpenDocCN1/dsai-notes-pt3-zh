    ## 第二章 聚类分析

    ### 2.1 聚类分析的概念

    #### 一、聚类分析的基本思想


    - 相似的归为一类。

    - 模式相似性的度量和聚类算法。

    - 无监督分类（Unsupervised）。


    #### 二、特征量的类型


    - 物理量——（重量、长度、速度）

    - 次序量——（等级、技能、学识）

    - 名义量——（性别、状态、种类）


