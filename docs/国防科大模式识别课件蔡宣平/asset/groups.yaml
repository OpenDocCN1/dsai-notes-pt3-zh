  - '[PAGE 632]


    # 7.2.2基于类的概率密度函数的可分性判据


    实际上 $J_C = -\ln \int_{\Omega} p(\vec{x}|\omega_1)^s \, p(\vec{x}|\omega_2)^{1-s}
    d\vec{x}$ 可以写成：


    $J_C = -\ln\left[\int_{\Omega}\left(\frac{p(\vec{x}|\omega_1)}{p(\vec{x}|\omega_2)}\right)^s
    p(\vec{x}|\omega_2) d\vec{x}\right]$


    这就启发我们运用两个概密的比或差来描述

    两个概密重迭或相似的程度。'
  - '[PAGE 633]


    # 7.2.2基于类的概率密度函数的可分性判据


    # （三）散度J_D（Divergence）


    ω_i类对ω_j类的平均可分性信息为：


    I_{ij}(\vec{x}) = E_i\left[\ln\frac{p(\vec{x}|\omega_i)}{p(\vec{x}|\omega_j)}\right]
    = \int_{\Omega} p(\vec{x}|\omega_i)\ln\frac{p(\vec{x}|\omega_i)}{p(\vec{x}|\omega_j)}
    d\vec{x}


    ω_j对ω_i类的平均可分性信息为：


    I_{ji}(\vec{x}) = E_j\left[\ln\frac{p(\vec{x}|\omega_j)}{p(\vec{x}|\omega_i)}\right]
    = \int_{\Omega} p(\vec{x}|\omega_j)\ln\frac{p(\vec{x}|\omega_j)}{p(\vec{x}|\omega_i)}
    d\vec{x}'
  - '[PAGE 634]


    # 7.2.2基于类的概率密度函数的可分性判据


    # （三）散度JD (Divergence)


    对于 ω_i 和 ω_j 两类总的平均可分性信息称为散度，其定义为两类平均可分性信息之和，即


    J_D = I_{ij}(\vec{x}) + I_{ji}(\vec{x})

    = \int_{\Omega} [p(\vec{x} | \omega_i) - p(\vec{x} | \omega_j)] \ln \frac{p(\vec{x}
    | \omega_i)}{p(\vec{x} | \omega_j)} d \vec{x}

    \triangleq J_D(\omega_i, \omega_j) \triangleq J_D(x_1, \cdots, x_n)'
  - '[PAGE 635]


    # 7.2.2基于类的概率密度函数的可分性判据


    J_D = I_{ij}(\vec{x}) + I_{ji}(\vec{x})

    = \int_{\Omega} [p(\vec{x} | \omega_i) - p(\vec{x} | \omega_j)] \ln \frac{p(\vec{x}
    | \omega_i)}{p(\vec{x} | \omega_j)} d\vec{x}


    \Delta J_D(\omega_i, \omega_j) \triangleq \Delta J_D(x_1, \cdots, x_n)


    当两类都是正态分布时：


    J_D = \frac{1}{2} Tr[C_i^{-1} C_j + C_j^{-1} C_i - 2I] + \frac{1}{2} (\vec{m}^{(i)}
    - \vec{m}^{(j)})^T (C_i^{-1} + C_j^{-1}) (\vec{m}^{(i)} - \vec{m}^{(j)})


    当C_i=C_j=C时


    J_D = (\vec{m}^{(i)} - \vec{m}^{(j)})^T C^{-1} (\vec{m}^{(i)} - \vec{m}^{(j)})
    = 8 J_B'
  - "[PAGE 636]\n\n# 7.2.2基于类的概率密度函数的可分性判据\n\n散度具有如下性质：\n\n+   (1) J_D ≥ 0;\n+   (2)\
    \ 对称性: J_D(ω₁, ω₂)= J_D(ω₂, ω₁);\n+   (3) J_D = 0 ⇔ p(\bar{x}|ω₁) = p(\bar{x}|ω₂)\n\
    +   (4) 当x 各分量x₁,x₂,...,xₙ相互独立时，（具有可加性）\n+   J_D(x₁,x₂,⋯,xₖ)=∑⋅⋅⋅J_D(xⱼ) \n+ \
    \  k ≤ n\n+   (5) 当x各分量x₁,x₂,...,xₙ相互独立时，（对特征数目单调不减）\n+   J_D(x₁,x₂,⋯,x_{k-1})\
    \ ≤ J_D(x₁,x₂,⋯,x_{k-1},x_k) \n+   k ≤ n"
  - '[PAGE 637]


    # 7.2.2 基于类的概率密度函数的可分性判据


    一般情况下，散度与误分概率（或其上下界）之间的直接解析关系很难得到，但实验可以证明它们之间存在着单调关系。例如两类都是正态分布，且有相同的协方差阵时，$P_0(e)$
    是 $J_D$ 的单调减函数。


    当两类先验概率相等且为具有相同协方差的正态分布时，则最小误分概率与 $J_D$ 的关系为：


    $$P_0(e)=\int_{\frac{1}{2}\sqrt{J_D}}^{\infty}\frac{1}{\sqrt{2\pi}}\exp\left(-\frac{y^2}{2}\right)\,dy$$'
  - "[PAGE 638]\n\n# 7.2.2基于类的概率密度函数的可分性判据\n\n# 对于J_C判据的最小误分概率的上界\n\nP_0(e) ≤ P(ω₁)^s\
    \ P(ω₂)^{1-s} exp[-J_c(ω₁,ω₂;s)]   0 < s < 1\n\n为求最佳的s*, 使上界取最小值C_h (称为Chernoff界限)\n\
    \ns*应满足\n\n```\nd{P(ω₁)^s P(ω₂)^{1-s} exp[-J_c(ω₁,ω₂;s)]}/ds |_{s=s^*}=0\n```\n\
    \n即 -d[J_c(s)]/ds |_{s=s^*} = ln P(ω₂)/P(ω₁) = θ\n\n易证，这个最小上界的s*同时也给出了两种误判概率的最小上界：\n\
    \n```\nP_{12}(e) ≤ exp[-J_c(s^*)+(1-s^*)θ] ≤ exp[-J_c(s)+(1-s)θ], \tilde{x} ∈\
    \ ω₁,but \tilde{x} ∉ Ω₂\nP_{21}(e) ≤ exp[-J_c(s^*)-s^*θ] ≤ exp[-J_c(s)-sθ], \t\
    ilde{x} ∈ ω₂,but \tilde{x} ∉ Ω₁\n```"
