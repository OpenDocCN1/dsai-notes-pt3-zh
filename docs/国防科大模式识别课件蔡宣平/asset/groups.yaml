    )\n\n## 若只取线性项，则为\n\n\\(12x_1+12.7x_2=0\\)\n\n![](img/d893b90ad57f036ece52d376593dc2c5_588_0.png)\n\
    \nx₂\n\nω₁\n\nΩ₂\n\nΩ₁\n\nx₁\n\nω₂\n\nΩ₂\n\n12 x₁ + 12.7 x₂ = 0\n\n## 注意：\n\n\
    （1）正交函数集 {φ_j (x→)} 应适应 p(x→) 的变化规律，否则函数项数R会很大；\n\n（2）多维情况下 {φ_j (x→)} 难以选择，计算量大。\n\
