    # 2·3 类的定义与类间距离


    # 2.3.3 聚类的准则函数


    # 一、类间距离准则


    设有待分类的模式集 $\{\vec{x}_1,\vec{x}_2,\ldots,\vec{x}_N\}$ 在某种相似性测度基础上被划分为 $c$ 类，$\{\vec{x}_i^{(j)};\
    j=1,2,\ldots,c;\ i=1,2,\ldots,n_j\}$。类内距离准则函数 $J_W$ 定义为：（$\vec{m}_j$ 表示 $\omega_j$
    类的模式均值矢量。）


    $$J_W=\sum_{j=1}^{c}\sum_{i=1}^{n_j}\left\|\vec{x}_i^{(j)}-\vec{m}_j\right\|^2
    \tag{2-3-20}$$'
  - '[PAGE 141]


    # 2·3 类的定义与类间距离


    $$J_W = \sum_{j=1}^{c} \sum_{i=1}^{n_j} \left\| \vec{x}_i^{(j)} - \vec{m}_j \right\|^2
    \quad (2-3-20)$$


    我们的目标是使 $J_W$ 取最小, 即 $J_W \Rightarrow \min$ , 这种方法也称为误差平方和准则。


    显然, $J_W$ 是模式 $\vec{x}_i$ 和类心 $\vec{m}_j$ 的函数, 在样本集 $\{\vec{x}_i\}$ 给定条件下, $J_W$
    的值取决于类心的选取。'
  - '[PAGE 142]


    # 加权类内距离准则 J_WW:


    J_{WW}=\sum_{j=1}^{c} \frac{n_j}{N} \bar{d}_j^2


    \bar{d}_j^2 = \frac{2}{n_j(n_j-1)} \sum_{\substack{\tilde{x}_i^{(j)} \in \omega_j
    \\ \tilde{x}_k^{(j)} \in \omega_j}} \|\tilde{x}_i^{(j)} - \tilde{x}_k^{(j)}\|^2


    式中，\sum \|\tilde{x}_i^{(j)} - \tilde{x}_k^{(j)}\|^2表示 \omega_j类内任两个模式距离平方和，共有
    \frac{n_j(n_j-1)}{2}个组合数，所以 \bar{d}_j^2表示类内两模式间的均方距离。N为待分类模式总数，\frac{n_j}{N}表示
    \omega_j类先验概率的估计——频率。'
