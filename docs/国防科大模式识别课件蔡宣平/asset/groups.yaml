    \ = E[\\vec{θ}|X^{(N)}]\n\n上式表明，\\vec{θ} 的最小方差贝叶斯估计是在观测 X^{(N)} 条件下的 \\vec{θ}\
    \ 的条件期望。\n\n下面介绍估计θ 所涉及的其它公式或近似算式：\n\n由于各样本是独立抽取的，故它们条件独立，即有\n\n$p(X^{(N)}|\\\
    vec{\\theta}) = p(\\vec{x}_1,\\vec{x}_2,\\dots,\\vec{x}_N|\\vec{\\theta}) = \\\
    prod_{j=1}^{N} p(\\vec{x}_j|\\vec{\\theta})$\n\n由贝叶斯定理知：\n\n$p(\\vec{\\theta}|X^{(N)})\
    \ = p(X^{(N)}|\\vec{\\theta})p(\\vec{\\theta})/p(X^{(N)}) = \\frac{p(X^{(N)}|\\\
    vec{\\theta})p(\\vec{\\theta})}{\\int_{\\Theta} p(X^{(N)}|\\vec{\\theta})p(\\\
    vec{\\theta})d\\vec{\\theta}}$\n\nθ̅ 的后验概率 p(θ̅|X^(N)) 也可以作如下近似计算：\n\n设 p(θ̅)\
    \ 为正态分布 N(θ̅₀, C₀)，可取 θ̅₀ = θ̂，\n\nC₀ 为估计的不确定性度量。由于 p(X^(N)) 只与 X^(N) 有关而与 θ̅\
    \ 无关，可取其为一个关于 X^(N) 的简单函数 α(X^(N))，由于观测是独立的，则上式可近似为：\n\np(θ̅|X^(N)) = p(θ̅|x₁,\
    \ x₂, …, x_N) = α⁻¹(X^(N)) ∏_{j=1}^N p(x_j|θ̅) p(θ̅)\n\n归纳起来贝叶斯估计的步骤是：\n\n- 1.\
    \ 确定未知参数集θ⃗的先验概率密度 p(θ⃗)\n- 2. 由样本集 X^(N) 根据下式(已知模型)求 p(X^(N)|θ⃗)\n  \n  p(X^(N)|θ⃗)\
    \ = p(x⃗₁, x⃗₂, …, x⃗_N|θ⃗) = ∏_{j=1}^{N} p(x⃗_j|θ⃗)\n- 3. 根据下式计算 p(θ⃗|X^(N))\n\
    \  \n  p(θ⃗|X^(N)) = p(θ⃗|x⃗₁, x⃗₂, …, x⃗_N) = α^{-1}(X^(N)) ∏_{j=1}^{N} p(x⃗_j|θ⃗)\
    \ p(θ⃗)\n- 4. 根据下式计算 θ̂\n  \n  θ̂(X^(N)) = ∫_{Θ} θ⃗ p(θ⃗|X^(N)) dθ⃗ = E[θ⃗|X^(N)]\n\
    \n作业：\n\nP170　　5.1，5.2，5.3\n\n## 第五章 统计决策中的训练、学习与错误率测试、估计\n\n## 5.4 概率的窗函数估计法\n\
    \n由于下面只针对 ω_i 类的概率和样本进行讨论，为简洁，下面不再标记类别。记 ω_i 类的概率：\n\n$p(\\vec{x}|\\omega_i) \\\
    triangleq p(\\vec{x})$，是 $\\vec{x}\\in\\omega_i$ 的总体概率\n\n随机矢量 $\\vec{x}$ 落入区域\
    \ $R$ 中的概率为 $P=\\int_R p(\\vec{x})d\\vec{x}$\n\n设 $N$ 个样本 $\\vec{x}_1,\\vec{x}_2,\\\
    ldots,\\vec{x}_N$ 是从上述概率为 $p(\\vec{x})$ 的总体中独立抽取的，$N$ 个样本中有 $k$ 个样本落入区域 $R$ 中的概率\
    \ $P_k$ 服从离散随机变量的二项分布\n\n$P_k=C_N^kP^k(1-P)^{N-k}$\n\n### 5.4 概密的窗函数估计法 概率密度的基本估计式\n\
    \nP_k = C_N^k P^k (1 - P)^{N - k}\n\n在上面的二项分布中使 P_k 取最大的 k 值称为众数。\n\n令 m 为众数，如果\
    \ (N + 1)P 不是整数，则：\n m = [(N + 1)P]    即 m 等于 (N + 1)P 的整数部分；\n\n如果 (N + 1)P 是整数，则：\n\
    \ m = (N + 1)P - 1 和 m = (N + 1)P\n\n```\nP_k = C_N^k P^k (1 - P)^{N - k}\n```\n\
    \n众数定义表明有 m 个样本落入区域 R 的概率最大。由概率论知，k 的数学期望 E[k] = NP。若实际落入域 R 的样本有 k 个，就认为这时的 k\
    \ ≈ m。\n\n由于：(N + 1)P - 1 ≤ m ≤ (N + 1)P\n\n所以： k ≈ NP ≈ N\\hat{P}\n\n这里 \\hat{P}\
    \ 是 P 的估计，当 N 较大 P 较小时上式的近似程度是足够的。\n"
