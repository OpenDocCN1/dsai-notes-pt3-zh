    ## 1.1 概述—模式识别的基本方法


    ## 一、统计模式识别


    模式描述方法：


    特征向量 $\vec{x} = (x_1, x_2, \cdots, x_n)''$


    模式判定：


    模式类用条件概率分布P(X/ωᵢ)表示, m类就有m个分布，然后判定未知模式属于哪一个分布。


    ## 1.1 概述—模式识别的基本方法


    ## 一、统计模式识别


    理论基础：概率论，数理统计


    主要方法：线性、非线性分类、Bayes决策、聚类分析


    主要优点：


    - 1) 比较成熟

    - 2) 能考虑干扰噪声等影响

    - 3) 识别模式基元能力强


    主要缺点：


    - 1) 对结构复杂的模式抽取特征困难

    - 2) 不能反映模式的结构特征，难以描述模式的性质

    - 3) 难以从整体角度考虑识别问题


    ## 1.1 概述—模式识别的基本方法


    ## 二、句法模式识别


    模式描述方法：


    符号串，树，图


    模式判定：


