    vec{w}) 的梯度为 ∇J(\\vec{w}) = 2X'(X\\vec{w} - \\vec{b})\n\n梯度下降算法迭代公式为：\n\n- ① \\\
    vec{w}(0)任取；\n- ② \\vec{w}(k+1) = \\vec{w}(k) - \\rho_k X'(X\\vec{w}(k) - \\vec{b})\n\
    \n可以证明，当\\rho_k = \\rho_1 / k，\\rho_1为任意正的常数，则该算法使权矢量序列\\{\\vec{w}(k)\\} 收敛于 \\\
    vec{w}^*；满足 ∇J(\\vec{w}^*) = 0    \\vec{w}^*也称为MSE解。\n\n为了减少计算量和存储量，可以仿照单样本修正法：\n\
    \n由于： X'(X\\vec{w} - \\vec{b}) = \\sum_{k=1}^{N} (\\vec{w}'\\vec{x}_k - b_k)\\\
