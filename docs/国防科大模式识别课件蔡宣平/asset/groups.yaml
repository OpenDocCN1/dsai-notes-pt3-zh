    \ Fisher解。\n- 2. 令 $\\vec{b} = (1,1,\\cdots,1)'$, 在样本数 $N \\to \\infty$ 时, MSE解以最小均方误差逼近贝叶斯判决函数:\n\
    \  \n  $d_B(\\vec{x}) = P(\\omega_1|\\vec{x}) - P(\\omega_2|\\vec{x})$\n\n# 求解最佳权矢量的方法——\
    \ (3)H-K算法\n\n前述的有关算法中，余量矢量 b⃗ 是取定的常矢量 而这将使所得的解 w⃗ 受 b⃗ 的影响。\n\nH-K (Ho-Kashyap)\
    \ 算法就是针对前面算法不足的一种改进。\n\nH-K算法仍使用平方误差准则函数\nJ(X, w⃗, b⃗) = ||Xw⃗ - b⃗||² = Σ_{i=1}^{N}\
