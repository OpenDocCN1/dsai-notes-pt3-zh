  - '[PAGE 311]


    # (3) 调整增广权矢量，规则是


    +   - 如果 \(\vec{x}_k \in \omega_1\) 和 \(\vec{w}''(k)\vec{x}_k \leq 0\)，则 \(\vec{w}(k+1)=\vec{w}(k)+\rho\vec{x}_k\)

    +   - 如果 \(\vec{x}_k \in \omega_2\) 和 \(\vec{w}''(k)\vec{x}_k \geq 0\)，则 \(\vec{w}(k+1)=\vec{w}(k)-\rho\vec{x}_k\)

    +   - 如果 \(\vec{x}_k \in \omega_1\) 和 \(\vec{w}''(k)\vec{x}_k > 0\)，或 \(\vec{x}_k
    \in \omega_2\) 和 \(\vec{w}''(k)\vec{x}_k \leq 0\)，则 \(\vec{w}(k+1)=\vec{w}(k)\)


    (4) 如果 \(k<N\)，令 \(k=k+1\)，返至(2)。如果 \(k=N\)，检验判别函数 \(\vec{w}''\vec{x}\) 对 \(\vec{x}_1,\vec{x}_2,\ldots,\vec{x}_N\)
    是否都能正确分类。若是，结束；若不是，令 \(k=1\)，返至(2)。'
