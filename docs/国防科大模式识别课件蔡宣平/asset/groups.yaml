  - "[PAGE 548]\n\n# 5.4 概密的窗函数估计法\n\n# Parzen窗法\n\n在 n 维特征空间中，我们取区域 R_N 是一 n 维超立方体，\n\
    \nh_N 为其棱长，则其体积 V_N = h_N^n 。\n\n为能用函数描述区域 R_N 和对落入 R_N 的样本计数，定义窗函数\n\n```\nφ(u⃗)\
    \ = { 1 , 当 |u_i| ≤ 1/2 , i = 1,2,…,n\n          0 , 其它 }\n```\n\nu⃗ = (u₁, u₂,\
    \ …, uₙ)'\n\n这样, φ(u⃗) 以函数值 1 界定了一个以原点为中心、棱长为 1 的 n 维超立方体。"
  - '[PAGE 549]


    # 5.4 概密的窗函数估计法


    # Parzen窗法


    如果一个样本 $\vec{x}_j$ 落入以 $\vec{x}$ 为中心以 $h_N$ 为棱长的超立方体 $R_N$ 内时则计数为 1，否则计数为 0，我们可以利用窗函数
    $\varphi(\vec{x})$ 实现这个约定，即


    $\varphi(\vec{x}) = \varphi\left[ \frac{\vec{x} - \vec{x}_j}{h_N} \right]$


    落入该立方体 $R_N$ 的样本数


    $k_N = \sum_{j=1}^{N} \varphi\left[ \frac{\vec{x} - \vec{x}_j}{h_N} \right]$'
  - '[PAGE 550]


    # 5.4 概密的窗函数估计法


    # Parzen窗法


    # 得到\vec{x}点处概密估计


    ```

    \hat{p}_N(\vec{x}) = \frac{1}{N} \sum_{j=1}^{N} \frac{1}{V_N} \varphi\left[ \frac{\vec{x}
    - \vec{x}_j}{h_N} \right]

    ```


    ![](img/d893b90ad57f036ece52d376593dc2c5_550_0.png)


    上式实际是一个迭加函数，窗函数作迭加基函数，每个样本点处作为迭加节点，使用 $k_N$ 个以样本 $\vec{x}_j$ 为中心的窗函数迭加对 $\vec{x}$
    处的概密进行估计。显然，样本密集的区域上必然概密估计（迭加函数）值较大。这种方法称为 Parzen 窗估计法。'
  - '[PAGE 551]


    # 5.4 概密的窗函数估计法


    # Parzen窗法


    上面所讲的是从构造上导出了估计式，所取的窗函数即迭加基函数为n维方窗(柱)函数。事实上只要窗函数满足下面的两个条件：


    φ(→u) ≥ 0    ∫ φ(→u) d→u = 1


    由式


    p̂_N(→x) = 1/N Σ_{j=1}^N 1/V_N φ[ (→x - →x_j)/h_N ]


    构造的估计式就是概密函数。'
