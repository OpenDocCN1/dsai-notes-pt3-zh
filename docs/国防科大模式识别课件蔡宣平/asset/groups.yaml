    \ Fisher 最佳鉴别失量\n利用二次型关于矢量求导的公式可得：\n\n$$\\frac{\\partial J_F}{\\partial \\vec{u}}=\\\
    frac{\\partial}{\\partial \\vec{u}}\\left[\\frac{\\vec{u}^{\\prime}S_B\\vec{u}}{\\\
    vec{u}^{\\prime}S_W\\vec{u}}\\right]=\\frac{2(\\vec{u}^{\\prime}S_W\\vec{u})S_B\\\
    vec{u}-2(\\vec{u}^{\\prime}S_B\\vec{u})S_W\\vec{u}}{(\\vec{u}^{\\prime}S_W\\vec{u})^2}=\\\
    vec{\\phi}$$\n\n令 $\\lambda=\\frac{\\vec{u}^{\\prime}S_B\\vec{u}}{\\vec{u}^{\\\
    prime}S_W\\vec{u}}$\n\n可得：$S_B\\vec{u}=\\lambda S_W\\vec{u}$\n\n当n较大时，S_W通常是非奇异的，于是有：\n\
    S_W^{-1} S_B \\vec{u} = \\lambda \\vec{u}\n\n上式表明，\\vec{u} 是矩阵 S_W^{-1} S_B 相应于特征值λ的特征向量。对于两类问题，S_B\
    \ 的秩为1，因此，S_W^{-1} S_B 只有一个非零特征值，其所对应的特征向量 \\vec{u} 称为Fisher最佳鉴别向量，由上式可得：\n\n\\\
    lambda \\vec{u} = S_W^{-1} S_B \\vec{u} = S_W^{-1} (\\vec{m}_1 - \\vec{m}_2)(\\\
    vec{m}_1 - \\vec{m}_2)' \\vec{u}\n\n即\n```\n\\(J_F = (\\vec{m}_1 - \\vec{m}_2)'\
    \ S_W^{-1} (\\vec{m}_1 - \\vec{m}_2)\\)\n```\n```\n\\(y = (\\vec{m}_1 - \\vec{m}_2)'\
    \ S_W^{-1} \\vec{x}\\)\n```\n为Fisher变换函数\n\n# (3) 求解Fisher判别函数\n由于变换后的模式是一维的，因此判别界面实际上是各类模式所在轴上的一个点，所以可以根据训练模式确定一个阈值\
    \ y_t ，于是Fisher判别规则为：\n```\nũ'x = y ≥ y_t ⇒ x̃ ∈ {ω1, ω2}\n```\n判别阈值可取两个类心在u方向上轴的投影连线的中点作为阈值，即：\n\
    ```\ny_t = \\frac{\\tilde{m}_1 + \\tilde{m}_2}{2}\n```\n\n# （7）计算 \\(\\tilde{m}_{i_o}\\\
    )。\n\\(\\tilde{m}_i=\\frac{1}{N_i}\\sum_j y_j^{(i)}=\\frac{1}{N_i}\\sum_j \\vec{u}^{\\\
    prime}\\vec{x}_j^{(i)}=\\vec{u}^{\\prime}\\tilde{m}_i\\)\n\n# （8）计算 \\(y_t\\)。\n\
    \\(y_t=\\frac{\\tilde{m}_1+\\tilde{m}_2}{2}\\)\n\n# （9）对未知模式\\(x\\)判定模式类。\n\\\
    (\\vec{u}^{\\prime}\\vec{x}=y\\leq y_t\\Rightarrow \\vec{x}\\in\\begin{cases}\\\
    omega_1\\\\\\omega_2\\end{cases}\\)\n"
