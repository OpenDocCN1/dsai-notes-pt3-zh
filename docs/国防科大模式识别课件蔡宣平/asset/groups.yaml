    ## 聚类应用的四个基本方向


    ### 一、减少数据


    许多时候，当数据量N很大时，会使数据处理变得很费力。因此可使用聚类分析的方法将数据分成几组可判断的聚类m（m<<N）来处理，每一个类可当作独立实体来对待。从这个角度看，数据被压缩了。


    用聚类分析来验证指定假说的有效性。


    例如：考虑这样的假说 “大公司在海外投资”。


    要验证这个假说是否正确，就要对大公司和有代表性的公司按规模、海外活跃度、成功完成项目的能力等进行聚类分析。从而来支持这个假说。


    ### 四、基于分组的预测


    对现有数据进行聚类分析，形成模式的特征，并用特征表示聚类，接下来，对于一个未知模式，就可以用前面的聚类来确定是哪一类？


    例如：考虑被同种疾病感染的病人数据集。先按聚类分析进行分类，然后对新的病人确定他适合的聚类，从而判断他病情。


    ## 2.2 模式相似性测度


    用于描述各模式之间特征的相似程度


    - 距离测度

    - 相似测度

    - 匹配测度


    ### 一、距离测度(差值测度)


    测度基础： 两个矢量矢端的距离


    测度数值： 两矢量各相应分量之差的函数。


    两矢量的距离定义应满足下面的公理：


    设矢量 x⃗ 和 y⃗ 的距离记为 d(x⃗,y⃗),


    - (1) d(x⃗,y⃗) ≥ 0，当且仅当 y⃗ = x⃗ 时，等号成立；

    - (2) d(x⃗,y⃗) = d(y⃗,x⃗)

    - (3) d(x⃗,y⃗) ≤ d(x⃗,z⃗) + d(z⃗,y⃗)


    常用的距离测度有：


    1. 欧氏 (Euclidean) 距离


    d(\vec{x}, \vec{y}) = \|\vec{x} - \vec{y}\| = [\sum_{i=1}^{n} (x_i - y_i)^2]^{1/2}


    \vec{x} = (x_1, x_2, ... x_n)'', \vec{y} = (y_1, y_2, ... y_n)''


    2. 绝对值距离(街坊距离或Manhattan距离)


    d(\bar{x}, \bar{y}) = \sum_{i=1}^{n} |x_i - y_i|


    (2-2-2)


    5. 马氏(Mahalanobis)距离


    设n维向量\(\vec{x}_i\)和\(\vec{x}_j\)是向量集\(\{\vec{x}_1,\vec{x}_2,\cdots,\vec{x}_m\}\)中的两个向量，马氏距离\(d\)定义为


    ```

    d²(\vec{x}_i,\vec{x}_j) = (\vec{x}_i - \vec{x}_j)'' V^{-1} (\vec{x}_i - \vec{x}_j)    (2-2-5)

    ```


    其中


    ```

    V = \frac{1}{m-1} \sum_{i=1}^{m} (\vec{x}_i - \vec{\bar{x}})(\vec{x}_i - \vec{\bar{x}})''    (2-2-6)

    ```


    ```

    \vec{\bar{x}} = \frac{1}{m} \sum_{i=1}^{m} \vec{x}_i    (2-2-7)

    ```


    5. 马氏(Mahalanobis)距离


    ```

    d²(\vec{x}_i, \vec{x}_j) = (\vec{x}_i - \vec{x}_j)'' V^{-1} (\vec{x}_i - \vec{x}_j)

    ```


    注意！马氏距离对一切非奇异线性变换都是不变的，这说明它不受特征量纲选择的影响，并且是平移不变的。上面的V的含义是这个向量集的协方差矩阵的统计量，故马氏距离加入了对特征的相关性的考虑。


    一般地，设 $\vec{x}$、$\vec{y}$ 是从期望矢量为 $\bar{\mu}$、协方差矩阵 $\Sigma$ 的母体 G 中抽取的两个样本，它们间的马氏距离定义：


    ```

    $d^2(\vec{x},\vec{y}) = (\vec{x} - \vec{y})'' \Sigma^{-1} (\vec{x} - \vec{y})$

    ```


    当将 $\vec{x}$ 和 $\vec{y}$ 视作两个数据集中的样本时，设 C 是它们的互协方差阵，这种情况的马氏距离的定义是：


    ```

    $d^2(\vec{x},\vec{y}) = (\vec{x} - \vec{y}) C^{-1} (\vec{x} - \vec{y})$

    ```


    例2.2.1


    已知一个二维正态母体 $G$ 的分布为 $N\left(\begin{pmatrix}0\\0\end{pmatrix},\begin{pmatrix}1&0.9\\0.9&1\end{pmatrix}\right)$。


    求点 $A:\begin{pmatrix}1\\1\end{pmatrix}$ 和 $B:\begin{pmatrix}1\\-1\end{pmatrix}$
    至均值点 $M:\boldsymbol{\mu}=\begin{pmatrix}0\\0\end{pmatrix}$ 的距离。


    解：由题设，可得 $\Sigma=\begin{pmatrix}1&0.9\\0.9&1\end{pmatrix}$，$\Sigma^{-1}=\frac{1}{0.19}\begin{pmatrix}1&-0.9\\-0.9&1\end{pmatrix}$。


    从而马氏距离


    $d_M^2(A,M)=(1\ \ 1)\Sigma^{-1}\begin{pmatrix}1\\1\end{pmatrix}=\frac{0.2}{0.19}$，\quad
    $d_M^2(B,M)=(1\ \ -1)\Sigma^{-1}\begin{pmatrix}1\\-1\end{pmatrix}=\frac{3.8}{0.19}$。


    它们之比为 $\sqrt{19}$ 倍，若用欧氏距离，算得的距离值相同。


    $d_E^2(A,M)=2$　　　　　　　　　$d_E^2(B,M)=2$


