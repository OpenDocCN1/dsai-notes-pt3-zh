    \ 1, 1, 0)ᵀ \n w₃(3)=w₃(2)- x₂=(-1, -1, -2)ᵀ\n\nk=3，$x_k=x_3\\in\\omega_3$，\n\n\
    因为 $d_3(x_3)=-2\\,d_1(x_3)=0$，$d_3(x_3)=d_2(x_3)=0$，错分，\n\n所以 $w_1(4)=w_1(3)-x_3=(0,-2,-1)^T$\n\
