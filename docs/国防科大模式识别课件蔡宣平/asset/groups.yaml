  - '[PAGE 425]


    # 作业


    4.1 设以下两类模式均为正态分布

    ω₁: {(0, 0)ᵀ, (2, 0)ᵀ, (2, 2)ᵀ, (0, 2)ᵀ}

    ω₂: {(4, 4)ᵀ, (6, 4)ᵀ, (6, 6)ᵀ, (4, 6)ᵀ}

    设 P(ω₁) = P(ω₂) = 1/2，求该两类模式之间的 Bayes 判别界面的方程。


    4.2 设两类二维正态分布参数为 u₁ = (-1, 0)ᵀ, u₂ = (1, 0)ᵀ 先验概率相等。


    +   (a) 令 Σ₁ = Σ₂ ≡ I 试给出负对数似然比判决规则

    +   (b) 令


    Σ₁ = [1  1/2; 1/2  1]    Σ₂ = [1  -1/2; -1/2  1]


    试给出负对数似然比判决规则。'
