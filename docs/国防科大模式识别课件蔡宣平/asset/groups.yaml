  - '[PAGE 512]


    # 5.2 参数估计


    # 均值向量和协方差阵的矩法估计


    协方差阵： Σ = E[(\vec{x} - \vec{μ})(\vec{x} - \vec{μ})'']


    # 协方差阵无偏估计：


    \hat{Σ} = C = \frac{1}{N-1} \sum_{j=1}^{N} (\vec{x}_j - \vec{μ})(\vec{x}_j - \vec{μ})''


    或


    = \frac{1}{N-1} \sum_{j=1}^{N} (\vec{x}_j - \vec{m}(N))(\vec{x}_j - \vec{m}(N))'''
  - '[PAGE 513]


    # 5.2 参数估计　均值矢量和协方差阵的递法估计


    设 $\vec m(N)$ 和 $C(N)$ 是由 $N$ 个样本算得的均矢和协方差阵，若再加入一个新的样本 $\vec x_{N+1}$，则可采用递推公式进行估算


    $$\vec m(N+1)=\frac{1}{N+1}\sum_{j=1}^{N+1}\vec x_j=\frac{1}{N+1}\left(\sum_{j=1}^{N}\vec
    x_j+\vec x_{N+1}\right)$$

    $$=\frac{1}{N+1}\left(N\vec m(N)+\vec x_{N+1}\right)$$

    $$=\vec m(N)+\frac{1}{N+1}\left(\vec x_{N+1}-\vec m(N)\right)$$


    初始值：$\vec m(1)=\vec x_1$'
  - '[PAGE 514]


    # 5.2 参数估计


    # 均值向量和协方差阵的矩法估计


    初始值：协方差矩阵的递推估计式：


    C(1) = x⃗₁x⃗₁'' - m⃗(1)m⃗(1)'' = x⃗₁x⃗₁'' - x⃗₁x⃗₁'' = Φ


    C(N+1) = 1/N Σ_{j=1}^{N+1} (x⃗_j - m⃗(N+1))(x⃗_j - m⃗(N+1))''


    = 1/N Σ_{j=1}^{N+1} x⃗_j x⃗_j'' - (N+1)/N m⃗(N+1)m⃗(N+1)''


    = 1/N Σ_{j=1}^{N} x⃗_j x⃗_j'' + 1/N x⃗_{N+1}x⃗_{N+1}'' - (N+1)/N [ 1/(N+1)^2 (N
    m⃗(N) + x⃗_{N+1})(N m⃗(N) + x⃗_{N+1})'' ]


    = 1/N Σ_{j=1}^{N} x⃗_j x⃗_j'' - N/(N+1) m⃗(N)m⃗(N)'' - 2/(N+1) m⃗(N)x⃗_{N+1}''
    + 1/(N+1) x⃗_{N+1}x⃗_{N+1}''


    = (N-1)/N [ 1/(N-1) Σ_{j=1}^{N} x⃗_j x⃗_j'' - N/(N-1) m⃗(N)m⃗(N)'' ] + 1/(N+1)
    (x⃗_{N+1} - m⃗(N))(x⃗_{N+1} - m⃗(N))''


    = (N-1)/N C(N) + 1/(N+1) (x⃗_{N+1} - m⃗(N))(x⃗_{N+1} - m⃗(N))'''
  - '[PAGE 515]


    # 5.2 参数估计 均值向量和协方差阵的矩法估计


    # 注意：


    矩法估计只能用于各阶矩的估计，它对于原点矩 $E(x^r)$ 的估计是无偏的，对中心矩 $E[(x - E(x))^r]$ 的估计是相合估计量。其算法简单但优良性较差，因此宜用于样本容量较大的情况，以保证它的优良性。'
