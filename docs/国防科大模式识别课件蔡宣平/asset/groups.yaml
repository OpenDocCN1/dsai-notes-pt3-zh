    # 3.5.2 一次准则函数及梯度下降法


    # 一、梯度下降法


    设 $f(\vec y)$ 是向量 $\vec y=(y_1,y_2,\cdots,y_n)''$ 的函数，\n则 $f(\vec y)$ 的梯度向量定义为：


    $$\nabla f(\vec y)=\frac{df(\vec y)}{d\vec y}=\left(\frac{\partial f}{\partial
    y_1},\frac{\partial f}{\partial y_2},\cdots,\frac{\partial f}{\partial y_n}\right)''$$


    采用梯度下降法沿负梯度方向，选择适当的步长进行搜索，求解函数的极小值点 $\vec w^*$。'
