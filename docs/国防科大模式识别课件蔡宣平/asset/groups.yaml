    ## 第三章 判别域代数界面方程法


    ### 3.3 判别函数值的鉴别意义、权空间及解空间


    此方程表示一超平面 $\pi$。它有以下三个性质：


    - (1) 系数矢量 $\vec{w}_0=(w_1,w_2,\ldots,w_n)''$ 是该平面的法矢量。

    - (2) 判别函数 $d(\vec{x})$ 的绝对值正比于 $\vec{x}$ 到超平面 $d(\vec{x})=0$ 的距离。

    - (3) 判别函数值的正负表示出特征点位于哪个半空间中。


    #### 证明：系数矢量 $\bar{w}_0=(w_1,w_2,\ldots,w_n)''$ 是该平面的法矢量，即 $\bar{w}_0\perp$ 平面
    $\pi$。


    设点 $\bar{x}_1$、$\bar{x}_2$ 在判别界面中，故它们满足方程，于是有


    $$

    \bar{w}_0''\bar{x}_1+w_{n+1}=0

    $$


    $$

    \bar{w}_0''\bar{x}_2+w_{n+1}=0

    $$


    上面二式相减，可得：


    $$

    \bar{w}_0''(\bar{x}_1-\bar{x}_2)=0

    $$


    这就表明：


    $$

    \bar{w}_0\perp(\bar{x}_1-\bar{x}_2)

    $$


    而差矢量 $(\bar{x}_1-\bar{x}_2)$ 在判别界面中，由于 $\bar{x}_1$、$\bar{x}_2$ 是 $\pi$ 中的任意两点，故
    $\bar{w}_0\perp$ 平面 $\pi$。


    #### 证明：判别函数 $d(\vec{x})$ 的绝对值正比于 $\vec{x}$ 到超平面 $d(\vec{x})=0$ 的距离。


    平面 $\pi$ 的方程可以写成：


    $$

    \frac{\vec{w}_0''}{\|\vec{w}_0\|}\vec{x}=\frac{-w_{n+1}}{\|\vec{w}_0\|}

    $$


    设平面 $\pi$ 的单位法矢量 $\vec{n}\triangleq\frac{\vec{w}_0}{\|\vec{w}_0\|}$，上式可写成


    $$

    \vec{n}''\vec{x}=\frac{-w_{n+1}}{\|\vec{w}_0\|}

    $$


    设 $\vec{p}$ 是平面 $\pi$ 中的任一点，$\vec{x}$ 是特征空间 $X^n$ 中任一点，点 $\vec{x}$ 到平面 $\pi$ 的距离为差矢量
    $(\vec{x}-\vec{p})$ 在 $\vec{n}$ 上的投影的绝对值，即


    $$

    d_x=|\vec{n}''(\vec{x}-\vec{p})|=|\vec{n}''\vec{x}-\vec{n}''\vec{p}|

    $$


    ![](img/d893b90ad57f036ece52d376593dc2c5_265_0.png)


    #### 证明：判别函数值的正负表示出特征点位于哪个半空间中。


    两矢量 $\vec{n}$ 和 $(\vec{x}-\vec{p})$ 的数量积为：


    $$

    \vec{n}''(\vec{x}-\vec{p})=\|\vec{n}\|\|\vec{x}-\vec{p}\|\cos(\vec{n},(\vec{x}-\vec{p}))=\frac{\vec{w}_0''\vec{x}+w_{n+1}}{\|\vec{w}_0\|}

    $$


    当 $\vec{n}$ 和 $(\vec{x}-\vec{p})$ 夹角小于 $90^\circ$ 时，即 $\vec{x}$ 在 $\vec{n}$ 指向的那个半空间中，$\cos(\vec{n},(\vec{x}-\vec{p}))>0$；


    反之，当 $\vec{n}$ 和 $(\vec{x}-\vec{p})$ 夹角大于 $90^\circ$ 时，即 $\vec{x}$ 在 $\vec{n}$
    背向的半空间中，$\cos(\vec{n},(\vec{x}-\vec{p}))<0$。


    由于 $\|\vec{w}_0\|>0$，故 $\vec{n}''(\vec{x}-\vec{p})$ 和 $\vec{w}_0''\vec{x}+w_{n+1}$
    同号。即 $\vec{x}$ 在 $\vec{n}$ 指向的半空间中时，$\vec{w}_0''\vec{x}+w_{n+1}>0$；当 $\vec{x}$
    在 $\vec{n}$ 背向的半空间中时，$\vec{w}_0''\vec{x}+w_{n+1}<0$。


    > 这说明判别函数值的正负表示出特征点位于哪个半空间中，或者换句话说，表示特征点位于界面的哪一侧。


    #### 例3.3.1：利用判别函数的鉴别意义，试分析 $d(x_1,x_2)=x_1+x_2+1$。


    ![](img/d893b90ad57f036ece52d376593dc2c5_269_0.png)


    #### 3.3.2 权空间、解矢量与解空间


    ##### （1）权空间


    增广特征矢量与增广权矢量是对称的，判别函数可以写成


    $$

    d(\vec{x})=\vec{w}''\vec{x}=\vec{x}''\vec{w}=x_1w_1+x_2w_2+\cdots+x_nw_n+w_{n+1}

    $$


    这里 $x_1,x_2,\ldots,x_n,1$ 则应视为相应的 $w_i$ 的“权”。


    $\vec{x}$ 指向平面 $\vec{x}''\vec{w}=0$ 的正侧，即该半空间中的任一点 $\vec{w}$ 都使 $\vec{x}''\vec{w}>0$；而
    $\vec{x}$ 背向的半空间中任一点 $\vec{w}$ 都有 $\vec{x}''\vec{w}<0$。


    ##### （2）解矢量


    当训练模式 $\vec{x}_j\in\omega_1$ 时有


    $$

    \vec{w}''\vec{x}_j>0

    $$


    当训练模式 $\vec{x}_j\in\omega_2$ 时有


    $$

    \vec{w}''\vec{x}_j<0

    $$


    为方便求 $\vec{w}^*$，常需要将已知类别的训练模式符号规范化：当 $\vec{x}$ 属于 $\omega_1$ 类时，不改变其符号；当属于 $\omega_2$
    类时，改变其符号。


    对于一个训练模式 $\vec{x}_j$，界面 $d(\vec{x}_j)=\vec{x}_j''\vec{w}=0$ 过增广权空间原点且将其分成两个子空间，界面
    $d(\vec{x}_j)=0$ 的法矢量 $\vec{x}_j$ 指向正半子空间，所谓正半子空间是指该子空间中任一点 $\vec{w}$ 都使 $\vec{x}_j''\vec{w}>0$。显然，解矢量
    $\vec{w}^*$ 必在正半子空间中。


    ##### （3）解空间


    先看一个简单的情况。设一维数据 $1,2$ 属于 $\omega_1$，$-1,-2$ 属于 $\omega_2$，求将 $\omega_1$ 和 $\omega_2$
    区分开的 $w_0,w_1$。


    ![](img/d893b90ad57f036ece52d376593dc2c5_274_0.png)

    '
