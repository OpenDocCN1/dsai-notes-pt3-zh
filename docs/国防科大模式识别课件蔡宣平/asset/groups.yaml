    \ 应满足：\n\n- (1) J_p ≥ 0；\n- (2) 当两类概密函数完全不重叠时， J_p = max；\n- (3) 当两类概密函数完全重合时，\
    \ J_p = 0；\n- (4) 相对两个概密具有“对称性”。\n\n### （一）Bhattacharyya 判据（J_B）\n\n受相关概念与应用的启发，我们可以构造B-判据，它的计算式为\n\
    \nJ_B = - ln ∫_Ω [p(x|ω₁) p(x|ω₂)]^{1/2} d x\n\n式中Ω表示特征空间。在最小误判概率准则下，误判概率有\n\n\
    P₀(e) ≤ [P(ω₁) P(ω₂)]^{1/2} exp[- J_B]\n\n证明：设 $P(e)$ 为误分概率，则最小误分概率为：\n\n$P_0(e)\
