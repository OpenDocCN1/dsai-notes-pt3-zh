  - '[PAGE 593]


    # 最近邻方法


    # 最近邻决策规则  1-NN


    对于 c 类问题，设类 ωᵢ（i=1,2,…,c）有 Nᵢ 个样本 xⱼ⁽ⁱ⁾（j=1,2,…,Nᵢ）。分类的思想是：


    对于一个待识别模式 x，分别计算它与 N=∑ᵢ₌₁ᶜNᵢ 个已知类别的样本 xⱼ⁽ⁱ⁾ 的距离，将它判为距离最近的那个样本所属的类。即：


    $$d_i(x)=\min_{j=1,2,\ldots,N_i}\|x-x_j^{(i)}\|,\quad i=1,2,\ldots,c$$


    如果 $d_m(x)=\min_{i=1,2,\ldots,c}d_i(x)$，则 $x\in\omega_m$。'
  - '[PAGE 594]


    # 最近邻方法


    # 最近邻决策规则—k-NN


    对于一个待识别模式 x, 分别计算它与 N = ∑_{i=1}^{c} N_i 个已知类别的样本 x_j^{(i)} 的距离, 取 k 个最近邻样本, 这
    k 个样本中哪一类最多, 就判属哪一类。即：


    d_i(x) = k_i          i = 1,2,⋯,c


    显然      ∑_{i=1}^{c} k_i = k


    如果      d_m(x) = max_{i=1,2,⋯,c} d_i(x)      则      x ∈ ω_m'
  - '[PAGE 595]


    # 剪辑最近邻方法


    # 剪辑最近邻方法


    对于两类问题，设将已知类别的样本集 X^(N) 分成参照集 X^(NR) 和测试集 X^(NT) 两部分，这两部分没有公共元素，它们的样本数各为 NR 和
    NT，NR+NT=N。利用参照集 X^(NR) 的样本 y1, y2, …, yN 采用最近邻规则对已知类别的测试集 X^(NT) 中的每个样本 x1, x2,
    …, xN 进行分类，剪辑掉 X^(NT) 中被错误分类的样本。


    若 y^0(x) ∈ X^(NR) 是 x ∈ X^(NT) 的最近邻元，剪辑掉不与 y^0(x) 同类的 x，余下的判决正确的样本组成剪辑样本集 X^(NTE)，这一操作称为剪辑。'
  - '[PAGE 596]


    # 剪辑最近邻方法


    # 剪辑最近邻方法


    获得剪辑样本集 $X^{(NTE)}$ 后，对待识模式 $x$ 采用最近邻规则进行分类。


    $d_i(x) = \min_{j=1,2,\cdots,N_i} \|x - x_j^{(i)}\| \quad i=1,2,\cdots,c$


    如果 $d_m(x) = \min_{i=1,2,\cdots,c} d_i(x)$ 则 $x \in \omega_m$


    这里 $x_j \in X^{(NTE)}$'
