    个非零特征值所对应的特征向量 $\vec{v}_j (j=1,2,\dots,d)$ 作变换矩阵，所得的 $d$ 个分量含有原来 $n$ 维模式的全部信息。


    ## 7.5.2 基于类内、类间离差矩阵，进行特征提取选择


    设


    $V=(\vec{v}_1\ \vec{v}_2\ \cdots\ \vec{v}_d)$


    则不损失信息而又达到最小维数的变换矩阵为：


    $W^T=V^T\Lambda^{-1/2}U^T$


    从而


    $\vec{y}=W^T\vec{x}=V^T\Lambda^{-1/2}U^T\vec{x}$


    当类数 $c$ 远比特征矢量维数 $n$ 小时，该方法的压缩性能是十分明显的。


    ## 例7.5.1


    两类样本的均值向量分别为 $m_1=(4,2)''$ 和 $m_2=(-4,-2)''$，协方差矩阵分别为：


    $C_1 = \begin{pmatrix} 3 & 1 \\ 1 & 3 \end{pmatrix} \quad C_2 = \begin{pmatrix}
    4 & 2 \\ 2 & 4 \end{pmatrix}$


    两类的先验概率相等，试求一维特征提取矩阵。


    解 总的类内离差阵可以算得：


    $S_w = \frac{1}{2}C_1 + \frac{1}{2}C_2 = \begin{pmatrix} 3.5 & 1.5 \\ 1.5 & 3.5
    \end{pmatrix}$


    $S_w = \frac{1}{2} C_1 + \frac{1}{2} C_2 = \begin{pmatrix} 3.5 & 1.5 \\ 1.5 &
    3.5 \end{pmatrix}$


    依据S_W进行DKLT，得到特征值 $\lambda_1 = 5, \lambda_2 = 2$


    对应的特征向量分别为：


    $\mu_1 = (0.707, 0.707)'', \mu_2 = (0.707, -0.707)''$


    因为总的均值向量为：


    $m = \frac{1}{2} m_1 + \frac{1}{2} m_2 = (0, 0)''$


    故类间离差阵S_B为：


    $S_B = \frac{1}{2} m_1 m_1'' + \frac{1}{2} m_2 m_2'' = \begin{pmatrix} 16 & 8
    \\ 8 & 4 \end{pmatrix}$


    计算J(y1)与J(y2)：


    $J(y_1) = \frac{\mu_1'' S_B \mu_1}{\lambda_1} \approx 3.7, \; J(y_2) = \frac{\mu_2''
    S_B \mu_2}{\lambda_2} \approx 1$


    J(y₁)= μ₁'' S_B μ₁ / λ₁ ≈ 3.7, J(y₂)= μ₂'' S_B μ₂ / λ₂ ≈ 1


    因为J(y₁)>J(y₂),所以选最佳变换矩阵为

    W = μ₁ = (0.707,0.707)''


    下面依据S_W和S_B作DKLT进行最优特征提取。


    此时 λ₁⁻¹/² = 0.447    λ₂⁻¹/² = 0.707


    B = U Λ⁻¹/² = (0.707  0.707; 0.707  -0.707) (0.447 0; 0 0.707) = (0.316 0.5; 0.316
    -0.5)


    对S_B进行白化变换：

    Ṡ_B = B'' S_B B = (3.6 1.896; 1.896 1)


    $\widetilde{S}_B = B'' S_B B = \begin{pmatrix} 3.6 & 1.896 \\ 1.896 & 1 \end{pmatrix}$


    $\widetilde{S}_B$的非零特征值只有一个，$\widetilde{\lambda}_1 = 4.6$


    对应的特征向量为 $v_1 = (0.884,0.466)''$


    总的最优变换为：$W = B v_1 = (0.512,0.046)''$


    作业： 7.11


    ## 第七章 特征提取与选择


    ## 7.5  离散K-L变换及其在

    特征提取与选择中的应用


    ## 7.7 特征选择中的直接挑选法


    特征的选择除了我们前面学习的变换法外，也可以在原坐标系中依据某些原则直接选择特征，即我们这节课要学的直接挑选法。


    - 7.7.1 次优搜索法

    - 7.7.2 最优搜索法


    ## 7.7.1 次优搜索法


    ### （一）单独最优的特征选择


    单独选优法的基本思路是：计算各特征单独使用时的判据值并以递减排序，选取前d个分类效果最好的特征。


    一般地讲，即使各特征是统计独立的，这种方法选出的d个特征也不一定是最优的特征组合，只有可分性判据J是可分的时候，即


    ```

    J(\vec{x}) = \sum_{i=1}^{n} J(x_i) 或 J(\vec{x}) = \prod_{i=0}^{n} J(x_i)

    ```


    这种方法才能选出一组最优特征。

