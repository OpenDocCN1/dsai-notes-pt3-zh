    ## 模式识别


    主讲：    蔡宣平    教授

    电话：    73441（O），73442（H）

    E-mail：   xpcai@nudt.edu.cn

    单位：    电子科学与工程学院信息工程系


    ## 关于本课程的有关说明


    - 课程对象

