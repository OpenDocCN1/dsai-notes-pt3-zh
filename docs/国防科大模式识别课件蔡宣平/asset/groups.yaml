    ![](img/d893b90ad57f036ece52d376593dc2c5_318_0.png)


    ## 作业


    1. 设两类样本的类内离差矩阵分别为：


    \[

    S_1=\begin{pmatrix}1 & \frac{1}{2}\\ \frac{1}{2} & 1\end{pmatrix},\qquad S_2=\begin{pmatrix}1
    & \frac{1}{2}\\ \frac{1}{2} & 1\end{pmatrix},

    \]


    \[

    m_1=(2,0)^T,\qquad m_2=(2,2)^T

    \]


    试用 Fisher 准则求其决策面方程。


    2. 用感知器算法求解向量，训练样本为：


    - \(\omega_1:\{(0,0,0)^T,(1,0,0)^T,(1,0,1)^T,(1,1,0)^T\}\)

    - \(\omega_2:\{(0,0,1)^T,(0,1,1)^T,(0,1,0)^T,(1,1,1)^T\}\)


    ## 第三章 判别域代数界面方程法


    ### 3.5.2 一次准则函数及梯度下降法


    ### 一、梯度下降法


    设 \(f(\vec y)\) 是向量 \(\vec y=(y_1,y_2,\cdots,y_n)''\) 的函数，则 \(f(\vec y)\) 的梯度向量定义为：


    \[

    \nabla f(\vec y)=\frac{df(\vec y)}{d\vec y}=\left(\frac{\partial f}{\partial y_1},\frac{\partial
    f}{\partial y_2},\cdots,\frac{\partial f}{\partial y_n}\right)''

    \]


    采用梯度下降法沿负梯度方向，选择适当的步长进行搜索，求解函数的极小值点 \(\vec w^*\)。


    ### 二、一次准则函数


    构造准则函数：


    \[

    J(\vec{w})=k\left(|\vec{w}''\vec{x}|-\vec{w}''\vec{x}\right)\quad(k>0)

    \]


    当 \(\vec{w}''\vec{x}<0\) 时：


    \[

    |\vec{w}''\vec{x}|-\vec{w}''\vec{x}=-2\vec{w}''\vec{x}>0

    \]


    当 \(\vec{w}''\vec{x}\geq 0\) 时：


    \[

    |\vec{w}''\vec{x}|-\vec{w}''\vec{x}=0

    \]


    故有极小值：


    \[

    J_{\min}(\vec{w})=0

    \]


    对于已符号规范化的训练模式，寻求使 \(J(\vec{w})\) 取极小的 \(\vec{w}\)，此时的 \(\vec{w}\) 满足：


    \[

    \vec{w}''\vec{x}\geq 0

    \]


    ### 令 \(k=\frac{1}{2}\)，求得准则函数的梯度


    \[

    \nabla J(\vec w)=\frac{\partial J}{\partial \vec w}=\frac{1}{2}\left[\vec x\operatorname{sgn}(\vec
    w''\vec x)-\vec x\right]

    \]


    其中符号函数：


    \[

    \operatorname{sgn}(\vec w''\vec x)=

    \begin{cases}

    1, & \vec w''\vec x>0\\

    -1, & \vec w''\vec x\leq 0

    \end{cases}

    \]


    增广权矢量的修正迭代公式为：


    \[

    \begin{aligned}

    \vec w(k+1)&=\vec w(k)-\rho_k\nabla J(\vec w(k))\\

    &=\vec w(k)-\frac{\rho_k}{2}\left[\vec x_k\operatorname{sgn}[\vec w''(k)\vec x_k]-\vec
    x_k\right]\\

    &=

    \begin{cases}

    \vec w(k), & \text{若 }\vec w''(k)\vec x_k>0\\

    \vec w(k)+\rho_k\vec x_k, & \text{若 }\vec w''(k)\vec x_k\leq 0,\ \rho_k>0

    \end{cases}

    \end{aligned}

    \]

    '
