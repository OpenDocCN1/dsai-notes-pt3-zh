  - '[PAGE 313]


    # 一、收敛定理：


    如果训练模式是线性可分的，感知器训练算法在有限次迭代后便可以收敛到正确的解矢量 $\vec{w}^{*}$。


    # 证明思路：


    如果第 $k+1$ 次迭代生成的权矢量比第 $k$ 次迭代生成的权矢量更接近解矢量，则收敛，即：


    $\left\|\vec{w}^{*}-\vec{w}(k)\right\|^{2}-\left\|\vec{w}^{*}-\vec{w}(k+1)\right\|^{2}>0$'
