    \ \\bar{x}_i 按最小距离原则分到某一聚类中。这里采用最小误判概率准则下正态分布情况的判决规则，计算模式 \\bar{x} 到 \\omega_j\
    \ 的距离。\n  \n  d(\\bar{x},\\omega_j)=\\ln|\\Sigma_j| + (\\bar{x}-\\bar{\\mu}_j)'\\\
