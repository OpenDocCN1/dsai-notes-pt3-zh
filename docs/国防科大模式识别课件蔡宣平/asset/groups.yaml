  - '[PAGE 469]


    # 于是其中一类错误概率作为控制量而使另一类


    # 错误概率最小的 N-P 判决规则为：


    如果 \( \frac{p(\vec{x}|\omega_1)}{p(\vec{x}|\omega_2)} \ge \lambda \) ， 则判 \( \vec{x}
    \in \begin{cases} \omega_1 \\ \omega_2 \end{cases} \)


    上式中, λ 是判决阈值。


    可以看出， N-P判决规则的形式和最小误判概率准则及最小损失准则的形式相同，只是依然比阈值不同。'
  - '[PAGE 470]


    这里 λ 是由下列关系式确定：

    ε₂₁ = ∫_{Ω₁} p(\vec{x}|ω₂) d\vec{x} = ε₀


    即适当地选取 λ 以保证使 ε₂₁ = ε₀，因此


    λ 的值决定着类域 Ω₁、Ω₂。


    为求 λ，令 l(\vec{x}) = p(\vec{x}|ω₁) / p(\vec{x}|ω₂)


