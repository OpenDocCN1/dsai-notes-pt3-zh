    # 模式识别的三大核心问题：


    +   - 特征数据采集

    +   - 分类识别

    +   - 特征提取与选择


    分类识别的正确率取决于对象的表示、训练学习和分类识别算法，我们在前面各章的介绍中详细讨论了后两方面的内容。本章介绍的特征提取与选择问题则是对象表示的一个关键问题。'
  - '[PAGE 604]


    # 第七章 特征提取与选择


    # 7.1概述


    通常在得到实际对象的若干具体特征之后，再由这些原始特征产生出对分类识别最有效、数目最少的特征，这就是特征提取与选择 的任务。从本质上讲，我们的目的是使在最小维数特征空间中异类模式点相距较远（类间距离较大），而同类模式点相距较近（类内距离较小）。'
  - '[PAGE 605]


