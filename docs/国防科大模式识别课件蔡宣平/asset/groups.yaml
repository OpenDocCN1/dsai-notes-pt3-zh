    有数学手册可查得：


    φ(x) = ∫₀ˣ e^(-t²) dt = x/1 - 1/1! · x³/3 + 1/2! · x⁵/5 - …


    ε₂₁ = 1/2 - φ( (√2/4) ln λ + √2/2 )


    可算得 ε₂₁ 与 λ 的关系如下表所示：


    | λ | 4 | 2 | 1 | 1/2 | 1/4 |

    |---|---|---|---|---|---|

    | ε₂₁ | 0.046 | 0.089 | 0.0159 | 0.258 | 0.378 |'
  - '[PAGE 477]


    由设定的 ε₂₁ = 0.04，查上表可得 λ = 4，对应的 (ln λ)/2 = -0.693，从而得此问题的判决规则为：

    若 x₁ ≦ -0.693，则判 x̄ ∈ { ω₁

    ω₂ }


    ![](img/d893b90ad57f036ece52d376593dc2c5_477_0.png)'
  - '[PAGE 478]


    本章主要介绍了贝叶斯统计决策理论为基础的贝叶斯分类方法，其中包括了最小误判概率、最小损失准则等，依据这些准则设计的分类器，从理论上讲是最优的性能，即分类的错误率或风险在所有可能的分类器中为最小，因此经常被用来作为衡量其他分类器设计方法优劣的标准。


    由于正态分布在物理上的合理性和数学上的计算简便性，我们详细介绍了贝叶斯分类方法在正态分布下的几种特殊情形，导出了其对应的判决函数、决策面方程及相应的几何描述。'
  - '[PAGE 479]


    # 下面我们简单回顾一下本章所学的几种贝叶斯决策准则：


    # 1、最小误判概率准则


    两类时：如果 $l_{12}(\vec{x}) = \frac{p(\vec{x}|\omega_1)}{p(\vec{x}|\omega_2)} \ge
    \frac{P(\omega_2)}{P(\omega_1)}$ 则判 $\vec{x} \in \begin{cases} \omega_1 \\ \omega_2
    \end{cases}$


    多类时：如果 $P(\omega_i|\vec{x}) = \max_j [P(\omega_j|\vec{x})]$ 判 $\vec{x} \in \omega_i$'
  - '[PAGE 480]


    # 2、最小损失准则


    两类时：如果 $\frac{p(\vec{x}|\omega_1)}{p(\vec{x}|\omega_2)} \ge \frac{P(\omega_2)(\lambda_{21}-\lambda_{22})}{P(\omega_1)(\lambda_{12}-\lambda_{11})}$
    则判 $\vec{x} \in \begin{cases} \omega_1 \\ \omega_2 \end{cases}$


    多类时：计算 $R(\alpha_j|\vec{x}) = \sum_{i=1}^{c} \lambda_{ij} P(\omega_i|\vec{x})
    \quad j = 1,2,\cdots c$


    若 $R(\alpha_l|\vec{x}) = \min_{j} R(\alpha_j|\vec{x})$ 则判 $\vec{x} \in \omega_l$'
  - '[PAGE 481]


    # 3、含拒绝判决的最小损失准则


    两类时：


    p(\vec{x}|\omega_1) / p(\vec{x}|\omega_2) ≥ P(\omega_2)(1 - t) / [P(\omega_1)
    t]   \vec{x} ∈ \omega_1


    p(\vec{x}|\omega_1) / p(\vec{x}|\omega_2) ≤ P(\omega_2) t / [P(\omega_1)(1 - t)]   \vec{x}
    ∈ \omega_2


    P(\omega_2) t / [P(\omega_1)(1 - t)] < p(\vec{x}|\omega_1) / p(\vec{x}|\omega_2)
    < P(\omega_2)(1 - t) / [P(\omega_1) t]   拒绝


    其中：


    t = (λ_r - λ_c) / (λ_e - λ_c)


    λ_r —— 拒绝损失


    λ_e —— 误判损失


    λ_c —— 正确判决损失'
  - '[PAGE 482]


    # 3、含拒绝判决的最小损失准则


    多类时：计算 $R(α_j|\vec{x}) = \sum_{i=1}^{c} λ_{ij} P(ω_i|\vec{x}) \quad j = 1,2,\cdots
    c, c+1$


    若 $R(α_l|\vec{x}) = \min_{j} R(α_j|\vec{x})$ 则判 $\vec{x} \in ω_l$


    其中 $α_{c+1}$ 为拒绝判决。'
  - '[PAGE 483]


    # 4、最小最大损失准则


    如果 p(\vec{x}|\omega_1)/p(\vec{x}|\omega_2) ≥ (λ_{21}−λ_{22})(1−P^*(\omega_1))/(λ_{12}−λ_{11})P^*(\omega_1)
    则判 \vec{x} ∈ { ω₁ ω₂ }


    P^*(ω₁) 是如何获得的？


    让P(ω₁)从0逐渐变化到1，按最小损失准则算出最小平均损失，即取各类条件平均损失的最小者。


    由此可得出R—P(ω₁)曲线，最大的R对应的P(ω₁)就是 P^*(ω₁)


    ![](img/d893b90ad57f036ece52d376593dc2c5_483_0.png)'
  - '[PAGE 484]


    # 5、N-P准则


    如果 \(\frac{p(\vec{x}|\omega_1)}{p(\vec{x}|\omega_2)} \ge \lambda\) ， 则判 \(\vec{x}
    \in \begin{cases} \omega_1 \\ \omega_2 \end{cases}\)


    λ是如何获得的？


    由 \(\varepsilon_{21}=\int_{\mu(\lambda)}^{+\infty} p(l|\omega_2) dl = \varepsilon_0\)
    固定\(\varepsilon_0\)反求\(\lambda\)'
  - "[PAGE 485]\n\n例：在军事目标识别中，假定有灌木和坦克两种类型，它们的先验概率分别是0.7和0.3，损失函数如下表所示，其中，类型ω₁和ω₂分别表示灌木和坦克，判决α₁=ω₁，α₂=ω₂，α₃表示拒绝判决。现在做了四次试验，获得四个样本的类条件概率密度如下：\n\
    \n$P(x|\\omega_1):0.1,\\ 0.15,\\ 0.3,\\ 0.6,\\qquad P(x|\\omega_2):0.8,\\ 0.7,\\\
    \ 0.55,\\ 0.3$\n\n+   问：\n+   \n+   1. 用最小误判概率准则，判断四个样本各属于哪一个类型。\n+   2. 假定只考虑前两种情况，试用最小损失准则判断四个样本各属于哪一个类型。\n\
    +   3. 把拒绝判决考虑在内，重新考核四次试验的结果。\n\n| 损失\\判决 | α₁ | α₂ |\n|---|---:|---:|\n| α₁ |\
    \ 2.5 | 2.0 |\n| α₂ | 4.0 | 1.0 |\n| α₃ | 1.5 | 1.5 |"
  - '[PAGE 486]


    # 答：求出四个样本两类的似然比。


    l₁₂ = P(x|ω₁) / P(x|ω₂) = (0.1/0.8, 0.15/0.7, 0.3/0.55, 0.6/0.3) = (0.125, 0.214,
    0.545, 2)


    # 最小误判概率准则时的阈值：


    θ₁₂ = P(ω₂) / P(ω₁) = 0.3 / 0.7 = 0.429


    （1）因此按最小误判概率准则判决时，第一、第二样本属于第二类即坦克，第三、第四属于第一类即灌木丛。'
  - '[PAGE 487]


    # （2）按最小损失准则判决


    $$\ell_{12}=\frac{P(x\mid\omega_1)}{P(x\mid\omega_2)}=\left(\frac{0.1}{0.8},\frac{0.15}{0.7},\frac{0.3}{0.55},\frac{0.6}{0.3}\right)=(0.125,0.214,0.545,2)$$


    # 最小损失准则时的阈值：


    $$\theta_{12}=\frac{P(\omega_2)(\lambda_{21}-\lambda_{22})}{P(\omega_1)(\lambda_{12}-\lambda_{11})}=\frac{0.3(2-1)}{0.7(4-2.5)}=0.286$$


    因此按最小损失准则判决时，第一、第二样本属于第二类即坦克，第三、第四属于第一类即灌木丛。'
  - '[PAGE 488]


    # （3）带拒绝的最小损失准则判决


    R₁(x⃗) = [λ₁₁ p(x⃗|ω₁) P(ω₁) + λ₂₁ p(x⃗|ω₂) P(ω₂)] / p(x⃗)

    R₂(x⃗) = [λ₁₂ p(x⃗|ω₁) P(ω₁) + λ₂₂ p(x⃗|ω₂) P(ω₂)] / p(x⃗)

    R₃(x⃗) = [λ₁₃ p(x⃗|ω₁) P(ω₁) + λ₂₃ p(x⃗|ω₂) P(ω₂)] / p(x⃗)


    由于是比较大小，可忽略p(x)，即只需计算


    R₁(x⃗) = [λ₁₁ p(x⃗|ω₁) P(ω₁) + λ₂₁ p(x⃗|ω₂) P(ω₂)]

    R₂(x⃗) = [λ₁₂ p(x⃗|ω₁) P(ω₁) + λ₂₂ p(x⃗|ω₂) P(ω₂)]

    R₃(x⃗) = [λ₁₃ p(x⃗|ω₁) P(ω₁) + λ₂₃ p(x⃗|ω₂) P(ω₂)]'
