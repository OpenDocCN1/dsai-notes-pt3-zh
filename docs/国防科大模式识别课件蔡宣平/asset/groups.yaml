    # （一）最小错分模式数目准则：


    对线性不可分样本集，求一解矢量使得错分的模式数目最少。


    对于两类问题，设 $n+1$ 维增广训练模式 $\vec{x}_1, \vec{x}_2, \cdots, \vec{x}_N$ 已符号规范化。


    如果训练模式是线性可分的，则存在权矢量 $\vec{w}$ 使不等式组 $\vec{w}''\vec{x}_i > 0 \quad (i=1,2,\cdots,N)$
    成立。


    如果训练模式是线性不可分 ⇒ 不等式组是不一致的，不等式组没解。此时，目标 ⇒ 最少的训练模式被错分。'
