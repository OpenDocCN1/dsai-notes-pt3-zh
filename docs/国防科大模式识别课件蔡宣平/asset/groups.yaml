    $$d(\vec{x})=\vec{w}''\vec{x}\begin{cases}>0\Rightarrow\vec{x}\in\omega_1\\<0\Rightarrow\vec{x}\in\omega_2\\=0\Rightarrow\vec{x}\in\omega_i\text{或拒判}\end{cases}$$


