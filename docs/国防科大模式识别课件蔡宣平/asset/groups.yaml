    Σ₁ = Σ₂ 决策超平面过 x̄₀点，矢量 w⃗_ij 是该超平面的法矢量。w⃗_ij = Σ⁻¹(μ⃗_i − μ⃗_j) 通常不与 (μ⃗_i − μ⃗_j)
    方向相同，所以决策界面不与 (μ⃗_i − μ⃗_j) 正交。'
