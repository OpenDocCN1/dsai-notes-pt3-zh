    \ \\vec{x}_{12} \\vec{x}_{13} \\vec{x}_{14} \\vec{x}_{15} \\vec{x}_{16} \\vec{x}_{17}\
    \ \\vec{x}_{18} \\vec{x}_{19} \\vec{x}_{20}\n\n第四步：因\\vec{Z}_j(3) \\neq \\vec{Z}_j(2),\
    \ j=1,2, 转第二步\n\n第二步：重新计算\\vec{x}_1, \\vec{x}_2, ..., \\vec{x}_{20}到\\vec{Z}_1(3),\
    \ \\vec{Z}_2(3)的距离，分别把\\vec{x}_1, \\vec{x}_2, ..., \\vec{x}_{20}归于最近的那個聚类中心，重新分为二类\
    \ G_1(4) = (\\vec{x}_1, \\vec{x}_2, ..., \\vec{x}_8) G_2(4) = (\\vec{x}_9, \\\
    vec{x}_{10}, ..., \\vec{x}_{20}), N_1 = 8, N_2 = 12\n\n# 第三步：更新聚类中心\n\nZ_1(4)\
    \ = Z_1(3) = (1.25,1.13)^T\nZ_2(4) = Z_2(3) = (7.67,7.33)^T\n计算结束。\n\n# (3) 动态聚类法——改进的C均值法\n\
    \n- 1. 对给定的待分类模式集 \\{\\bar{x}_1,\\bar{x}_2,\\dots,\\bar{x}_N\\} 进行初始划分产生c类；\n\
