    )\n\n例：在军事目标识别中，假定有灌木和坦克两种类型，它们的先验概率分别是0.7和0.3，损失函数如下表所示，其中，类型ω₁和ω₂分别表示灌木和坦克，判决α₁=ω₁，α₂=ω₂，α₃表示拒绝判决。现在做了四次试验，获得四个样本的类条件概率密度如下：\n\
