    \ / p(\\vec{x}|\\omega_2) ≤ P(\\omega_2) t / [P(\\omega_1)(1 - t)]   \\vec{x}\
    \ ∈ \\omega_2\n\nP(\\omega_2) t / [P(\\omega_1)(1 - t)] < p(\\vec{x}|\\omega_1)\
    \ / p(\\vec{x}|\\omega_2) < P(\\omega_2)(1 - t) / [P(\\omega_1) t]   拒绝\n\n其中：\n\
