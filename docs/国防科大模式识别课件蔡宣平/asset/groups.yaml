    # ## 7.2 类别可分性判据'
  - '[PAGE 608]


    # 7.2 类别可分性判据


    # 构造可分性判据


    为确立特征提取和选择的准则：引入类别可分性判据，来刻划特征对分类的贡献。为此希望所构造的可分性判据满足下列要求：


    +   (1) 与误判概率(或误分概率的上界、下界)有单调关系。


    +   (2) 当特征相互独立时，判据有可加性，即：


    ```

    J_{ij}(x_1,x_2,\cdots,x_d)=\sum_{k=1}^{d}J_{ij}(x_k)

    ```


    式中，x_1,x_2,\cdots,x_d 是对不同种类特征的测量值，J_{ij}(·)表示使用括号中特征时第i类与第j类可分性判据函数。'
  - '[PAGE 609]


    # 7.2 类别可分性判据


    # 构造可分性判据


    (3) 判据具有“距离”的某些特性，即 ：

    J_{ij} > 0 ，当 i ≠ j 时；

    J_{ij} = 0 ，当 i = j 时；

    J_{ij} = J_{ji}


    (4) 对特征数目是单调不减，即加入新的特征后，判据值不减。

    J_{ij}(x_1,x_2,⋯,x_d) ≤ J_{ij}(x_1,x_2,⋯,x_d,x_{d+1})'
  - '[PAGE 610]


    # 7.2 类别可分性判据


    # 构造可分性判据


    值得注意的是：上述的构造可分性判据的要求，即 “单调性”、“叠加性”、“距离性”、“单调不减性”。在实际应用并不一定能同时具备，但并不影响它在实际使用中的价值。'
  - '[PAGE 611]


    # 7.2 类别可分性判据


    # 7.2.1 基于几何距离的可分性判据


    一般来讲，不同类的模式可以被区分是由于它们所属类别在特征空间中的类域是不同的区域。


    显然，区域重叠的部分越小或完全没有重叠，类别的可分性就越好。


    因此可以用距离或离差测度（散度）来构造类别的可分性判据。'
  - '[PAGE 612]


    # 7.2.1 基于几何距离的可分性判据


    # （一） 点与点的距离


    $d(\vec{a},\vec{b})=\left[(\vec{a}-\vec{b})^{\mathrm{T}}(\vec{a}-\vec{b})\right]^{1/2}=\left[\sum_{k=1}^{n}(a_k-b_k)^2\right]^{1/2}$


    # （二） 点到点集的距离


    用均方欧氏距离表示


    $\bar{d}^{2}\left(\vec{x},\{\vec{a}_{k}^{(i)}\}\right)=\frac{1}{N_i}\sum_{k=1}^{N_i}d^{2}\left(\vec{x},\vec{a}_{k}^{(i)}\right)$'
  - '[PAGE 613]


    # 7.2.1基于几何距离的可分性判据




    类的均值矢量： $\tilde{m}^{(i)} = \frac{1}{N_i} \sum_{k=1}^{N_i} \tilde{x}_k^{(i)}$   i
    = 1,2,\cdots,c


    各类模式的总体均值矢量 $\tilde{m} = \sum_{i=1}^c P_i \tilde{m}^{(i)}$


    P_i为相应类的先验概率率，当用统计量代替先验概率时，总体均值矢量可表示为：


    ```

    \tilde{m} = \sum_{i=1}^c P_i \tilde{m}^{(i)} = \sum_{i=1}^c \frac{N_i}{N} \tilde{m}^{(i)}
    = \frac{1}{N} \sum_{i=1}^c \sum_{k=1}^{N_i} \tilde{x}_k^{(i)} = \frac{1}{N} \sum_{l=1}^N
    \tilde{x}_l

    ```'
  - '[PAGE 614]


    <!-- no content -->'
  - '[PAGE 615]


    # 7.2.1 基于几何距离的可分性判据


    # （五）类内离差矩阵


    $$S_{\omega_i}=\frac{1}{N_i}\sum_{k=1}^{N_i}(\vec{x}_k^{(i)}-\vec{m}^{(i)})(\vec{x}_k^{(i)}-\vec{m}^{(i)})^{\mathrm{T}}$$


    显然 $$\bar d^2(\omega_i)=\operatorname{Tr}[S_{\omega_i}]$$


    # （六）两类之间的距离


    $$\bar d^2(\omega_i,\omega_j)=\frac{1}{N_iN_j}\sum_{k=1}^{N_i}\sum_{l=1}^{N_j}d^2(\vec{x}_k^{(i)},\vec{x}_l^{(j)})$$


    $$\bar d^2(\omega_i,\omega_j)=\frac{1}{N_iN_j}\sum_{k=1}^{N_i}\sum_{l=1}^{N_j}(\vec{x}_k^{(i)}-\vec{x}_l^{(j)})^{\mathrm{T}}(\vec{x}_k^{(i)}-\vec{x}_l^{(j)})$$'
  - '[PAGE 616]


    # 7.2.1基于几何距离的可分性判据


    # （七）各类模式之间的总的均方距离


    d̄²(x⃗) = 1/2 Σᵢ₌₁ᶜ Pᵢ Σⱼ₌₁ᶜ Pⱼ 1/(Nᵢ Nⱼ) Σₖ₌₁^{Nᵢ} Σₗ₌₁^{Nⱼ} d²(x⃗ₖ^{(i)}, x⃗ₗ^{(j)})


    # 当取欧氏距离时，总的均方距离为


    d̄²(x⃗) = 1/2 Σᵢ₌₁ᶜ Pᵢ Σⱼ₌₁ᶜ Pⱼ 1/(Nᵢ Nⱼ) Σₖ₌₁^{Nᵢ} Σₗ₌₁^{Nⱼ} (x⃗ₖ^{(i)} - x⃗ₗ^{(j)})ᵀ
    (x⃗ₖ^{(i)} - x⃗ₗ^{(j)})'
  - '[PAGE 617]


    # 7.2.1基于几何距离的可分性判据


    # （八） 多类情况下总的类内、类间及总体离差矩阵


    类内离差 $S_W = \sum_{i=1}^{c} P_i S_{\omega_i} = \sum_{i=1}^{c} P_i \frac{1}{N_i}
    \sum_{k=1}^{N_i} (\vec{x}_k^{(i)} - \vec{m}^{(i)})(\vec{x}_k^{(i)} - \vec{m}^{(i)})^T$


    类间离差 $S_B = \sum_{i=1}^{c} P_i (\vec{m}^{(i)} - \vec{m})(\vec{m}^{(i)} - \vec{m})^T$


    总体离差 $S_T = \frac{1}{N} \sum_{l=1}^{N} (\vec{x}_l - \vec{m})(\vec{x}_l - \vec{m})^T
    = S_W + S_B$


    易导出 $\bar{d}^2(\vec{x}) = Tr[S_W + S_B] = Tr[S_T]$'
  - '[PAGE 618]


    # 7.2.1 基于几何距离的可分性判据


    可以用 S_W、S_B、S_T 构造不同的可分性判据：


    ```

    J₁ = Tr[S_W^{-1} S_B]

    J₂ = ln[ |S_B| / |S_W| ]

    J₃ = Tr[S_B] / Tr[S_W]

    J₄ = |S_W + S_B| / |S_W| = |S_T| / |S_W|

    ```


    可以证明 J₁、J₂ 和 J₄ 在任何非奇异线性变换下是不变的，J₃ 与坐标系有关。'
