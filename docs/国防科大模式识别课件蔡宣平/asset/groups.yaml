    $d^2(\vec{x},\vec{y}) = (\vec{x} - \vec{y})'' \Sigma^{-1} (\vec{x} - \vec{y})$

    ```


    当将 $\vec{x}$ 和 $\vec{y}$ 视作两个数据集中的样本时，设 C 是它们的互协方差阵，这种情况的马氏距离的定义是：


