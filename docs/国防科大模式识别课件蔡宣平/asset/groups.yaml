    \  0          其它 } ，  p(x|ω₂) = { 0.5x - 0.5   1 ≤ x ≤ 3\n            0      \
    \    其它 }\n\n先验概率 P(ω₁) = P(ω₂) = 0.5 。\n\n- (1) 求Bayes判决函数（用0-1损失函数）；\n- (2)\
    \ 求总误判概率 P(e) 。\n\nP126: 4.8\n\n## 模式识别\n\n主讲：    蔡宣平    教授\n电话：    73441（O），73442（H）\n\
    E-mail：   xpcai@nudt.edu.cn\n单位：    电子科学与工程学院信息工程系\n\n## 第五章 统计决策中的训练、学习与错误率测试、估计\n\
    \n- - 统计推断概述\n- - 参数估计\n- - 概密的窗函数估计法\n- - 有限项正交函数级数逼近法\n\n## 5.1 统计推断概述\n\n在上一章的学习中，我们一直假设类的条件概率密度函数是已知的，然后去设计贝叶斯分类器。但在实际中，这些知识往往是不知道的，这就需要用已知的样本进行学习或训练。也就是说利用统计推断理论中的估计方法，从样本集数据中估计这些参数。\n\
    \n本章目的：已知类别的样本（训练样本）→\n学习或训练→获得类概密  p(x|ω_i)\n\n## 5.1 统计推断概述\n\n### 非参数估计\n\n\
    当不知道类的模型时，就要采用非参数估计的方法，这种方法也称为总体推断，这类方法有：\n\n- 1. p-窗法\n- 2. 有限项正交函数级数逼近法\n- 3.\
    \ 随机逼近法\n\n## 5.1 统计推断概述\n\n### 基本概念\n\n设模式空间 Ω 是 n 维的。\n\n母体（总体）：一个模式类称为一个总体或母体\n\
    \n母体的子样：一个模式类中某些模式(即母体中的一些元素)的集合称为这个母体的子样。母体的子样含有母体的某些信息，可以通过构造样本的函数来获得。\n\n统计量：一般来说，每一个样本都包含着母体的某些信息，为了估计未知参数就要把有用的信息从样本中抽取出来。为此，要构造训练样本的某种函数，这种函数在统计学中称为统计量。\n\
    \n## 5.1 统计推断概述\n\n### 基本概念\n\n理论量（或理论分布）：$p(\\vec{x}|\\omega_i)$  $P(\\omega_i)$\
    \  $P(\\omega_i|\\vec{x})$\n\n数学期望、方差等\n\n经验分布：由样本推断的分布称为经验分布。\n\n参数空间：在统计学中，把未知参数θ的可能值的集合称为参数空间，记为Θ。\n\
    \n点估计、估计量：针对某未知参数θ构造一个统计量作为θ的估计$\\hat{\\theta}$，这种估计称为点估计。$\\hat{\\theta}$称为θ的估计量。\n\
    \n## 5.1 统计推断概述\n\n### 基本概念\n\n区间估计：在一定置信度条件下估计某一未知参数 θ 的取值范围，称之为置信区间，这类估计成为区间估计。\n\
    \n为了准确地对某一类的分布进行参数估计或总体推断，应只使用该类的样本。\n\n就是说在进行参数估计时，应对各类进行独立的参数估计或总体推断。因此在以后的论述中，如无必要，不特别言明类别。\n\
    \n## 5.1 统计推断概述\n\n### 基本概念\n\n估计：所谓估计就是由样本 \\vec{x}_j (j = 1,2,···,N) 按某种规则构造的一个统计量\
    \ \\hat{\\vec{\\theta}}_N = \\theta(\\vec{x}_1, \\vec{x}_2, ···, \\vec{x}_N) 用以代替被估参数集\
    \ \\vec{\\theta}。估计量 \\hat{\\vec{\\theta}}_N 作为随机样本的函数，显然也是随机量。\n\n无偏估计：估计量 \\\
    hat{\\theta}_N 的数学期望等于被估量 \\vec{\\theta} 的数学期望，即对任意的 N，有 E[\\hat{\\theta}_N] =\
    \ E[\\vec{\\theta}]。估计无偏性的意义在于可以用多个估计的平均近似真值。\n\n## 5.1 统计推断概述\n\n### 基本概念\n\n\
    **渐近无偏估计：** 即 $\\lim_{N\\to\\infty}E\\left[\\hat{\\theta}_N\\right]=E[\\vec{\\\
    theta}]$。当不能对所有有 $N$ 的都有 $E\\left[\\hat{\\theta}_N\\right]=E[\\vec{\\theta}]$\
    \ 时，希望估计量 $\\hat{\\theta}_N$ 是渐近无偏估计。\n\n**最小方差无偏估计量：** 在无偏估计条件下，对任意的 $N$，$Var\\\
    left[\\hat{\\theta}_N^*\\right]\\leq Var\\left[\\hat{\\theta}_N\\right]$，则称 $\\\
    hat{\\theta}_N^*$ 是最小方差无偏估计量。我们希望在无偏的基础上，估计量随机摆幅越小越好，即估计量的方差越小越好。\n\n## 第五章 统计决策中的训练、学习与错误率测试、估计\n\
    \n### 5·2 参数估计\n"
