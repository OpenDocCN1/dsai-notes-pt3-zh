    \ ⇒ 不等式组是不一致的，不等式组没解。此时，目标 ⇒ 最少的训练模式被错分。\n\n将上面的不等式组写成矩阵方程形式，并引入 $N$ 维余量矢量 $\\\
    vec{b} > \\vec{\\phi}$，于是不等式方程组变为：\n\n$X\\vec{w} \\ge \\vec{b} > \\vec{\\phi}$\n\
    \n式中 $X$ 是 $N \\times (n+1)$ 矩阵。\n\n$X = \\begin{pmatrix} \\vec{x}_1' \\\\ \\\
    vec{x}_2' \\\\ \\vdots \\\\ \\vec{x}_N' \\end{pmatrix} = (\\vec{x}_1, \\vec{x}_2,\
    \ \\cdots, \\vec{x}_N)'$\n\n(二) 最小方差准则及W-H算法\n\n针对方程组 Xw = b, 构造方差准则函数\n\n```\n\
    J(\\bar{w}) = (X\\bar{w} - \\bar{b})'(X\\bar{w} - \\bar{b})\n= \\sum_{i=1}^N (\\\
    bar{w}'\\bar{x}_i - \\bar{b}_i)^2 \\Rightarrow \\min\n```\n\n对于 \\bar{w}'\\bar{x}_i\
    \ = b_i (i=1,2,...,N), 此时的 J = min J(\\bar{w}) =0, 而对于 \\bar{w}'\\bar{x}_i \n\
    eq b_i , 此时的 J(\\bar{w})>0 .\n\n如果方程组有唯一解, 说明训练模式集是线性可分的, 如果方程组无解, 极小点值是最小二乘解.\
    \ 一般情况下使 J 极小等价于误分模式数目最少。\n"
