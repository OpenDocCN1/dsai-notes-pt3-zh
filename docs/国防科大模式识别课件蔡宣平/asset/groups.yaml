    \n## 1.1 概述—模式识别的基本方法\n\n### 五、逻辑推理法（人工智能法）\n\n模式描述方法：\n\n字符串表示的事实\n\n模式判定：\n\n\
    是一种布尔运算。从事实出发运用一系列规则，推理得到不同结果，m个类就有m个结果。\n\n## 1.1 概述—模式识别的基本方法\n\n理论基础：演绎逻辑，布尔代数\n\
    \n主要方法：产生式推理、语义网推理、框架推理\n\n主要优点：\n\n已建立了关于知识表示及组织，目标搜索及匹配的完整体系。对需要众多规则的推理达到识别目标确认的问题，有很好的效果。\n\
    \n主要缺点：\n\n当样本有缺损，背景不清晰，规则不明确甚至有歧义时，效果不好。\n\n## 1.1 概述—模式识别的发展简史\n\n- 1929年 G.\
    \ Tauschek发明阅读机，能够阅读0-9的数字。\n\n- 30年代 Fisher提出统计分类理论，奠定了统计模式识别的基础。\n\n- 50年代 Noam\
    \ Chomsky 提出形式语言理论——傅京荪提出句法/结构模式识别。\n\n- 60年代 L. A. Zadeh提出了模糊集理论，模糊模式识别方法得以发展和应用。\n\
    \n## 1.1 概述—模式识别的发展简史\n\n80年代 以Hopfield网、BP网为代表的神经网络模型导致人工神经元网络复活，并在模式识别得到较广泛的应用。\n\
    \n90年代 小样本学习理论，支持向量机也受到了很大的重视。\n\n## 1.1 概述—模式识别的应用 (举例)\n\n- **生物学**\n  - 自动细胞学、染色体特性研究、遗传研究\n\
    - **天文学**\n  - 天文望远镜图像分析、自动光谱学\n- **经济学**\n  - 股票交易预测、企业行为分析\n- **医学**\n  - 心电图分析、脑电图分析、医学图像分析\n\
    \n## 1.1 概述—主要实用系统举例\n\n- 文字识别（Character Recognition）\n  - OCR（Optical Character\
    \ Recognition）\n- 智能交通（Intelligent Traffic）\n  - 车牌、车型。\n- 语音识别（Speech recognition）\n\
    \  - 翻译机，身份识别等\n- 目标识别\n  - ATR（Automai c Target Recognition）\n\n## 1.2 特征向量和特征空间\n\
    \n特征向量：\n\n设一个研究对象的n个特征量测量值分别为 x₁, x₂, ..., xₙ, 我们将它们作为一个整体来考虑, 让它们构成一个n维特征向量x。\n\
    \n特征空间：\n\n各种不同取值的特征向量的全体构成了n维特征空间。\n\n注： 特征向量就是特征空间中的一个点。\n\n## 1.3 随机矢量的描述\n\
    \n随机矢量：\n\n在模式识别过程中，要对许多具体对象进行测量，以获得许多次观测值。每次观测值不一定相同，所以对许多对象而言，每个特征分量都是随机变量，即许多对象的特征向量在n维空间中呈随机性分布，称为随机矢量。\n\
    \n### (一)随机矢量的分布函数：\n\n设 $\\vec{X} = (X_1, X_2, \\cdots, X_n)'$ 为随机矢量，\n\n$\\\
    vec{x} = (x_1, x_2, \\cdots, x_n)'$ 为确定性矢量。\n\n随机矢量的联合概率分布函数定义为：\n\n$F(x_1, x_2,\
    \ \\cdots; x_n) = P(X_1 \\le x_1, X_2 \\le x_2, \\cdots; X_n \\le x_n)$\n\n$F(\\\
    vec{x}) = P(\\vec{X} \\le \\vec{x})$\n\n式中 $P(\\cdot)$ 表示括号中事件同时发生的概率。\n\n###\
    \ （一）随机矢量的分布函数：\n\n随机矢量 $\\vec{X}$ 的联合概率密度函数定义为：\n\n```\np(x₁, x₂, …, xₙ) \\triangleq\
    \ p(\\vec{x}) \n= ∂ⁿF(x₁, x₂, …, xₙ)/∂x₁∂x₂⋯∂xₙ\n```\n\n### (一) 随机矢量的分布函数：\n\n\
    设集合由c类模式组成，第i类为 ω_i，\n\nω_i 类模式特征向量有其自己的分布函数和密度函数。\n\nω_i 类的模式特征向量的分布函数及密度函数分别定义为\n\
    \nF(\\vec{x}|ω_i) = P(\\vec{X} ≤ \\vec{x}|ω_i)\n\np(\\vec{x}|ω_i) = ∂ⁿF(x₁, x₂,\
    \ …, xₙ | ω_i) / ∂x₁ ∂x₂ … ∂xₙ\n\n![](img/d893b90ad57f036ece52d376593dc2c5_50_0.png)\n\
    \n### (二) 随机矢量的数字特征：\n\n#### (1) 均值矢量(期望矢量)\n\nn 维随机矢量 $\\vec{X}$ 的数学期望 $\\vec{\\\
    mu}$ 定义为：\n\n$\\vec{\\mu} = E[\\vec{X}] = \\vec{\\bar{X}} = \\begin{pmatrix} E[X_1]\
    \ \\\\ E[X_2] \\\\ \\dots \\\\ E[X_n] \\end{pmatrix} = \\int_{X^n} \\vec{x} p(\\\
    vec{x}) d\\vec{x}$\n\n### (二)随机矢量的数字特征：\n\n其中， μ⃗ 的分量：\n\nμ_i = E[X_i] = ∫_{-∞}^{+∞}\
    \ x_i p(x_i) dx_i =\n\n∫_{-∞}^{+∞} ... ∫ x_i p(x_1, x_2, ..., x_n) dx_1 dx_2 ...\
    \ dx_n = X̄_i\n\n式中，p(x_i)是 X⃗ 的第 i 个分量的边缘密度。随机矢量 X⃗ 的均值矢量 μ⃗ 的各分量是相应的各随机分量的均值。\n\
    \n### (二) 随机矢量的数字特征：\n\n#### (2) 条件期望\n\n在模式识别中，经常以类别 ω_i 作为条件，在这种情况下随机矢量 X⃗ 的条件期望矢量定义为\n\
    \nμ⃗_ω_i = E[ X⃗ | ω_i ] = ∫_{X^n} x⃗ p( x⃗ | ω_i ) d x⃗\n\n### (二)随机矢量的数字特征：\n\
    \n#### (3) 协方差矩阵\n\n随机矢量 X⃗ 的自协方差矩阵表征各分量围绕其均值的散布情况及各分量间的相关关系，其定义为：\n\n```\nΣ =\
    \ E[(X⃗ − X̄)(X⃗ − X̄)′]\n= ∫_{X^n} (x⃗ − μ⃗)(x⃗ − μ⃗)′ p(x⃗) d x⃗ = (σ²_{ij})_{n×n}\n\
    ```\n\n### (二) 随机矢量的数字特征：\n\n#### (3) 协方差矩阵\n\n式中σ²ᵢⱼ是X⃗的第i个分量与第j个分量的协方差，当 i=j\
    \ 时，σ²ᵢⱼ便是Xᵢ的方差。\n\nσ²ᵢⱼ = E[(Xᵢ - X̄ᵢ)(Xⱼ - X̄ⱼ)]\n= ∫∫₋∞⁺∞ (xᵢ - μᵢ)(xⱼ - μⱼ)\
    \ p(xᵢ, xⱼ) dxᵢ dxⱼ\n\n### （二）随机矢量的数字特征：\n\n#### （4）自相关矩阵\n\n随机矢量 X 的自相关矩阵定义为\n\
    \nR = E[ X X' ]\n\n由定义可知，X 的协方差矩阵和自相关矩阵间的关系是\n\nΣ = R − X X' = R − μ μ'\n"
