    \n由此得到三个解矢量： w₁* = w₁(5)， w₂* = w₂(5)， w₃* = w₃(5)\n\n同时可得三个判别函数：\n\nd₁(x) = -2\
    \ x₂\nd₂(x) = 2 x₁ - 2\nd₃(x) = -2 x₁ - 2\n\n## 第三章 判别域代数界面方程法\n\n### 3.6 二次准则函数及其解法\n\
    \n问题：\n\n一次准则函数及其算法（如感知器算法）只适用于线性可分的情况，如果是线性不可分的，分类过程将不收敛！\n\n能否找到一种算法，使之能够测试出模式样本集是否线性可分，并且对线性不可分的情况也能给出“次最优”的解？\n\
    \n（一）最小错分模式数目准则：\n\n对线性不可分样本集，求一解矢量使得错分的模式数目最少。\n\n对于两类问题，设 $n+1$ 维增广训练模式 $\\\
    vec{x}_1, \\vec{x}_2, \\cdots, \\vec{x}_N$ 已符号规范化。\n\n如果训练模式是线性可分的，则存在权矢量 $\\\
