    \ < ‖\\vec{x}_1 - \\vec{Z}_2(1)‖\n所以 \\vec{x}_1 ∈ \\vec{Z}_1(1)\n\n‖\\vec{x}_2\
    \ - \\vec{Z}_1(1)‖ = ‖(1\\n0) - (0\\n0)‖ = 1\n\n![](img/d893b90ad57f036ece52d376593dc2c5_192_0.png)\n\
    \n# 第三步：根据新分割的两类建立新的聚类中心\n\n\\(\n\\vec{z}_1(2) = \\frac{1}{N_1} \\sum_{i: \\vec{x}_i\
    \ \\in G_1(1)} \\vec{x}_i = \\frac{1}{2}(\\vec{x}_1 + \\vec{x}_3) = \\frac{1}{2}\
    \ \\begin{bmatrix} 0 \\ 0 \\end{bmatrix} + \\begin{bmatrix} 0 \\ 1 \\end{bmatrix}\
    \ = (0,0.5)^T\n\\)\n\n\\(\n\\vec{z}_2(2)= \\frac{1}{N_2} \\sum_{i: \\vec{x}_i\
    \ \\in G_2(1)} \\vec{x}_i = \\frac{1}{18}(\\vec{x}_2 + \\vec{x}_4 + \\vec{x}_5\
    \ + ... + \\vec{x}_{20} )\n = (5.67,5.33)^T\n\\)\n\n# 第四步：\n\n因为 \\(\\vec{z}_j(2)\
    \ \\neq \\vec{z}_j(1), j = 1,2\\) (新旧聚类中心不等)\n转第二步。\n\n# 第二步：重新计算 \\(\\vec{x}_1,\
    \ \\vec{x}_2, ..., \\vec{x}_{20}\\) 到 \\(\\vec{z}_1(2), \\vec{z}_2(2)\\) 的距离，把它们归为最近聚类中心，重新分为两类，\n\
