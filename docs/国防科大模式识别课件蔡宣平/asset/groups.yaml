  - "[PAGE 291]\n\n# 类内离差度 \\(\tilde{S}_{W_i}^2\\) 和总的类内离差度 \\(\tilde{S}_W^2\\) 为：\n\
    \n```\n\\(\\tilde{S}_{W_i}^2 = \\sum_j (y_j^{(i)} - \\tilde{m}_i)^2 = \\sum_j\
    \ (\\tilde{u}^T \\tilde{x}_j - \\tilde{u}^T \\tilde{m}_i)^2 = \\tilde{u}^T S_{W_i}\
    \ \\tilde{u}\\)\n```\n\n```\n\\(\\tilde{S}_W^2 = \\tilde{S}_{W_1}^2 + \\tilde{S}_{W_2}^2\
    \ = \\tilde{u}^T (S_{W_1} + S_{W_2}) \\tilde{u} = \\tilde{u}^T S_W \\tilde{u}\\\
    )\n```\n\n# 类间离差度为：\n\n```\n\\(\\tilde{S}_B^2 = (\\tilde{m}_1 - \\tilde{m}_2)^2\
    \ = (\\tilde{u}^T \\tilde{m}_1 - \\tilde{u}^T \\tilde{m}_2)(\\tilde{u}^T \\tilde{m}_1\
    \ - \\tilde{u}^T \\tilde{m}_2)^T = \\tilde{u}^T S_B \\tilde{u}\\)\n```"
  - '[PAGE 292]


    希望经投影后，类内离差度 \tilde{S}_W^2 越小越好，类间离差度 \tilde{S}_R^2 越大越好，根据这个目标作准则函数


    J_F(\tilde{u}) = \frac{(\tilde{m}_1 - \tilde{m}_2)^2}{\tilde{S}_{W1}^2 + \tilde{S}_{W2}^2}
    = \frac{\tilde{u}'' S_B \tilde{u}}{\tilde{u}'' S_W \tilde{u}}


    并使其最大,上式称为Fisher准则函数。'
  - '[PAGE 293]


    # （2）求解 Fisher 最佳鉴别失量


    利用二次型关于矢量求导的公式可得：


    $$\frac{\partial J_F}{\partial \vec{u}}=\frac{\partial}{\partial \vec{u}}\left[\frac{\vec{u}^{\prime}S_B\vec{u}}{\vec{u}^{\prime}S_W\vec{u}}\right]=\frac{2(\vec{u}^{\prime}S_W\vec{u})S_B\vec{u}-2(\vec{u}^{\prime}S_B\vec{u})S_W\vec{u}}{(\vec{u}^{\prime}S_W\vec{u})^2}=\vec{\phi}$$


    令 $\lambda=\frac{\vec{u}^{\prime}S_B\vec{u}}{\vec{u}^{\prime}S_W\vec{u}}$


    可得：$S_B\vec{u}=\lambda S_W\vec{u}$'
  - '[PAGE 294]


    当n较大时，S_W通常是非奇异的，于是有：

    S_W^{-1} S_B \vec{u} = \lambda \vec{u}


    上式表明，\vec{u} 是矩阵 S_W^{-1} S_B 相应于特征值λ的特征向量。对于两类问题，S_B 的秩为1，因此，S_W^{-1} S_B 只有一个非零特征值，其所对应的特征向量
    \vec{u} 称为Fisher最佳鉴别向量，由上式可得：


    \lambda \vec{u} = S_W^{-1} S_B \vec{u} = S_W^{-1} (\vec{m}_1 - \vec{m}_2)(\vec{m}_1
    - \vec{m}_2)'' \vec{u}'
