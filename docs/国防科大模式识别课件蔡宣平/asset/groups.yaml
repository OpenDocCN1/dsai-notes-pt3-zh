    (2) $H(p_1,\cdots,p_c) \le \log c$ ，即 $H(\vec p)$ 有上界。当且仅当 $p_i = \frac{1}{c}
    (i=1,2,\cdots,c)$ 时等号成立，即等概率场熵最大。识别最困难。


    (3) $H(\vec p)$ 是 $\vec p$ 的连续上凸函数。


    设 $\Omega_s$ 在是某一降维的特征空间，如果 $H(\vec x)(\vec x \in \Omega_s)$ 较大，则说明 $p(\omega_i
