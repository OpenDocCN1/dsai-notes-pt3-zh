    vec{z}_2(2)\\) 的距离，把它们归为最近聚类中心，重新分为两类，\n\nG₁(2) = (\\vec{x}_1, \\vec{x}_2, ...,\
    \ \\vec{x}_8), N₁ = 8\n\nG₂(2) = (\\vec{x}_9, \\vec{x}_{10}, ..., \\vec{x}_{20}),\
