    # 5.2 参数估计


    # 均值向量和协方差阵的矩法估计


    矩法估计是用样本(的统计)矩作为总体(理论)矩的估计。若类的模型为正态分布，我们用矩法估计出类的均值向量和协方差阵后，类的概密也就完全确定了。


    # 均值向量:


    μ⃗ = E[x⃗] = ∫Ω x⃗ p(x⃗) dx⃗ ≜ (μ₁, μ₂, ⋯, μₙ)′


    # 均值无偏估计:


    μ̂ = 1/N ∑_{j=1}^{N} x⃗_j'
