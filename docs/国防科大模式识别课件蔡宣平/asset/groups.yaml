    ## 2·4 聚类的算法——简单聚类方法


    ### 3. 算法原理步骤


    - (1) 取任意的一个模式特征矢量作为第一个聚类中心。例如，令 ω₁ 类的中心 z⃗₁ = x⃗₁。


    - (2) 计算下一个模式特征矢量 x⃗₂ 到 z⃗₁ 的距离 d₂₁。若 d₂₁ > T，则建立新的一类 ω₂，其中中心 z⃗₂ = x⃗₂。若 d₂₁
    ≤ T，则 x⃗₂ ∈ ω₁。


    ## 2·4 聚类的算法——简单聚类方法


    ### 3. 算法原理步骤


    (3) 假设已有聚类中心 \vec{z}_1, \vec{z}_2, \cdots, \vec{z}_k，计算尚未确定类别的模式特征向量 \vec{x}_i
    到各聚类中心 \vec{z}_j (j = 1,2,\cdots,k) 的距离 d_{ij}。如果 d_{ij} > T (j = 1,2,\cdots,k)，则
    \vec{x}_i 作为新的一类 \omega_{k+1} 的中心，\vec{z}_{k+1} = \vec{x}_i；

    否则，如果 d_{il} = min_j [d_{ij}]，则判定 \vec{x}_i \in \omega_l。检查是否所有的模式都划分完类别，如果都划分完了则结束；否则回到(3)。


    ## 2·4 聚类的算法——简单聚类方法


    这类算法的突出优点是算法简单。但聚类过程中，类的中心一旦确定将不会改变，模式一旦指定类后也不再改变。


    从算法的过程可以看出，该算法结果很大程度上依赖于距离门限T的选取及模式参与分类的次序。如果能有先验知识指导门限T的选取，通常可获得较合理的效果。也可考虑设置不同的T和选择不同的次序，最后选择较好的结果进行比较。


