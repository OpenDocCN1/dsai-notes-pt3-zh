    在 $n$ 维特征空间中，二次判别函数的一般表示式为：


    $$d(\vec{x}) = \vec{x}''W\vec{x} + \vec{w}''\vec{x} + w_{n+1}$$


    $$= \sum_{k=1}^{n} w_{kk} x_k^2 + 2 \sum_{j=1}^{n-1} \sum_{k=j+1}^{n} w_{jk} x_j
    x_k + \sum_{j=1}^{n} w_j x_j + w_{n+1}$$


    二次判别函数图例


    ![](img/d893b90ad57f036ece52d376593dc2c5_363_0.png)


    一般的判别规则是：


    计算训练模式 $\vec{x}_j \in \omega_1$（$j = 1,2,\cdots,N_1$）


    $$\widehat{m}_1 = \frac{1}{N_1} \sum_{j=1}^{N_1} \vec{x}_j \quad \widehat{C}_1
    = \frac{1}{N_1 -1} \sum_{j=1}^{N_1} (\vec{x}_j - \widehat{m}_1)(\vec{x}_j - \widehat{m}_1)''$$


    构造判别函数：


    $$d(\vec{x}) = K^2 - (\vec{x} - \widehat{m}_1)'' \widehat{C}_1^{-1} (\vec{x} -
    \widehat{m}_1)$$


    对未知模式：


    - $d(x) > 0$ 当 $x \in \omega_1$

    - $d(x) < 0$ 当 $x \in \omega_2$


    ## 3.12 位势函数分类法


    特点：


    - （1）可直接确定判决函数

    - （2）适用于非线性和线性可分的情况


    位势函数的概念：


    位势为0的等位线——判决界面（判别函数）


    对于两类问题 $\omega_1$，$\omega_2$，认为


    - 如果 $x \in \omega_1$，则 $x$ 带正电荷

    - 如果 $x \in \omega_2$，则 $x$ 带负电荷


    为了将上述分类思想数学化，我们需定义点 $\vec{x}_j$ 处的位势函数 $K(\vec{x}, \vec{x}_j)$，它应满足：


    - (1) $K(\vec{x}, \vec{x}_j) = K(\vec{x}_j, \vec{x})$

    - (2) $K(\vec{x}, \vec{x}_j)$ 是连续光滑函数；

    - (3) $K(\vec{x}, \vec{x}_j)$ 是 $\vec{x}$ 与 $\vec{x}_j$ 间距离的单值单调下降函数。当且仅当 $\vec{x}
    = \vec{x}_j$ 时，$K(\vec{x}, \vec{x}_j)$ 达其最大值。当 $\vec{x}$ 与 $\vec{x}_j$ 之间的距离趋于无穷大时，$K(\vec{x},
    \vec{x}_j)$ 趋于零。

    '
