    $\Lambda^{-\frac{1}{2}} U^{T} S_W U \Lambda^{-\frac{1}{2}} = I$


    易知，存在正交阵 $\tilde{V}$ 可使


    $\tilde{V}^{T} \Lambda^{-\frac{1}{2}} U^{T} S_B U \Lambda^{-\frac{1}{2}} \tilde{V}
    = \tilde{\Lambda}$


    式中 $\tilde{\Lambda}$ 是白化变换后的总的类间离差矩阵的特征值对角阵。 $\tilde{S}_B = \Lambda^{-\frac{1}{2}}
    U^{T} S_B U \Lambda^{-\frac{1}{2}}$


    由于 $S_B$ 的秩不大于 $c-1$，所以 $\tilde{S}_B$ 最多只有 $c-1$ 个非零特征值，设非零特征值共有 $d$ 个，用这 $d$
    个非零特征值所对应的特征向量 $\vec{v}_j (j=1,2,\dots,d)$ 作变换矩阵，所得的 $d$ 个分量含有原来 $n$ 维模式的全部信息。


