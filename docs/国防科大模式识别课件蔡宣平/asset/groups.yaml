    \ 矩阵，一般是非奇异的。当 (X'X)^-1 不存在时，可用广义逆法解 w→ = (X'X)^+ X'b→，这里 (X'X)^+ 为 X'X 的广义逆矩阵。\n\
    \n（X′X）⁻¹存在时，  w⃗ = X⁺ b⃗        X⁺ = (X′X)⁻¹X′\n（X′X）⁻¹不存在， w⃗ = (X′X)⁺ X′b⃗\n\
