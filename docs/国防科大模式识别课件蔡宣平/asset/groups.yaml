    \ x2, …, xN 进行分类，剪辑掉 X^(NT) 中被错误分类的样本。\n\n若 y^0(x) ∈ X^(NR) 是 x ∈ X^(NT) 的最近邻元，剪辑掉不与\
    \ y^0(x) 同类的 x，余下的判决正确的样本组成剪辑样本集 X^(NTE)，这一操作称为剪辑。\n\n## 剪辑最近邻方法\n\n## 剪辑最近邻方法\n\
    \n获得剪辑样本集 $X^{(NTE)}$ 后，对待识模式 $x$ 采用最近邻规则进行分类。\n\n$d_i(x) = \\min_{j=1,2,\\cdots,N_i}\
    \ \\|x - x_j^{(i)}\\| \\quad i=1,2,\\cdots,c$\n\n如果 $d_m(x) = \\min_{i=1,2,\\\
    cdots,c} d_i(x)$ 则 $x \\in \\omega_m$\n\n这里 $x_j \\in X^{(NTE)}$\n"
  mdcn: "\n## 5·5 有限项正交函数级数逼近法——最小积分平方逼近法\n\n对于 $c$ 类问题，设类概密和类概率分别为 $p(\\vec{x}|\\\
    omega_i)$ 和 $P(\\omega_i)$（$i=1,2,\\cdots,c$），则混合概密为\n\n$$p(\\vec{x})=\\sum_{i=1}^{c}P(\\\
    omega_i)p(\\vec{x}|\\omega_i)$$\n\n设对每类的概密 $p(\\vec{x}|\\omega_i)$ 的估计 $\\hat{p}(\\\
    vec{x}|\\omega_i)$ 用正交函数有限项表示为\n\n$$\\hat{p}(\\vec{x}|\\omega_i)=\\sum_{j=1}^{R}C_j^{(i)}\\\
    varphi_j(\\vec{x})$$\n\n## 5.5 有限项正交函数级数逼近法—最小积分平方逼近方法\n\n∑_{j=1}^{R} C_j^{(i)}\
    \ a_{jl} = b_l^{(i)}   (l = 1,2,⋯,R)\n\n其中：\n a_{jl} = ∑_{s=1}^{N} φ_j(\\vec{x}_s)\
