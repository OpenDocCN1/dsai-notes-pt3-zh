    \ (2+3+3+3+3+4) = -6\n\nC₂₃ = 1/6 Σₖ₌₁⁶ φ₃( x⃗ₖ⁽²⁾ ) = 1/6 Σₖ₌₁⁶ 2xₖ₂⁽²⁾ = -2/6\
