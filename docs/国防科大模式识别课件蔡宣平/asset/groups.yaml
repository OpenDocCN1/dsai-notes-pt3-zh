    \ 的样本 $\\vec{x}_1, \\vec{x}_2, \\cdots, \\vec{x}_N$ 用于估计总体概密 $p(\\vec{x})$，我们将概密\
    \ $p(\\vec{x})$ 的估计 $\\hat{p}(\\vec{x})$ 表示成有限项正交级数\n\n$\\hat{p}(\\vec{x}) = \\\
