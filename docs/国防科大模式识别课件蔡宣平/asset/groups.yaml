    \ 0 , 当 \\vec{x}_s ∉ ω_i }   (i = 1,2,⋯,c)\n\n## 5.5 有限项正交函数数级数逼近法—最小积分平方逼近方法\n\
    \n```\n\\sum_{j=1}^{R} C_j^{(i)} a_{jl} = b_l^{(i)} \\quad (l = 1,2,\\cdots,R)\n\
    ```\n\n求得 $C_j^{(i)}$ $(i=1,2,\\cdots,c ; j=1,2,\\cdots,R)$ 后就能构造各类的概率逼近式：\n\n\
    ```\n\\hat{p}(\\bar{x}|\\omega_i) = \\sum_{j=1}^{R} C_j^{(i)} \\varphi_j(\\bar{x})\
    \ \\quad (i=1,2,\\cdots,c)\n```\n\n例：用逼近法求如下模式类别的 $p(\\vec{x}|\\omega_1)$ 和 $p(\\\
    vec{x}|\\omega_2)$ 的估计。\n\n解：用正交的二维Hermite多项式来构成正交函数集。\n\nφ₁(x⃗)=φ₁(x₁,x₂)=H₀(x₁)H₀(x₂)=1\n\
