    \ \\in G_1(2)} \\vec{x}_i = \\frac{1}{8} (\\vec{x}_1 + \\vec{x}_2 + \\vec{x}_3\
    \ + ... + \\vec{x}_8)\n\n= (1.25, 1.13)^T\n\n\\vec{Z}_2(3) = \\frac{1}{N_2} \\\
    sum_{\\vec{x}_i \\in G_2(2)} \\vec{x}_i = \\frac{1}{12} (\\vec{x}_9 + \\vec{x}_{10}\
    \ + ... + \\vec{x}_{20})\n\n= (7.67, 7.33)^T\n\n![](img/d893b90ad57f036ece52d376593dc2c5_195_0.png)\n\
    \nX₂\n\nX₁\n\nZ₁^(2)\n\nZ₂^(2)\n\n\\vec{x}_1 \\vec{x}_2 \\vec{x}_3 \\vec{x}_4\
