    ```\n\n### (二) 随机矢量的数字特征：\n\n#### (3) 协方差矩阵\n\n式中σ²ᵢⱼ是X⃗的第i个分量与第j个分量的协方差，当 i=j\
    \ 时，σ²ᵢⱼ便是Xᵢ的方差。\n\nσ²ᵢⱼ = E[(Xᵢ - X̄ᵢ)(Xⱼ - X̄ⱼ)]\n= ∫∫₋∞⁺∞ (xᵢ - μᵢ)(xⱼ - μⱼ)\
    \ p(xᵢ, xⱼ) dxᵢ dxⱼ\n\n### （二）随机矢量的数字特征：\n\n#### （4）自相关矩阵\n\n随机矢量 X 的自相关矩阵定义为\n\
    \nR = E[ X X' ]\n\n由定义可知，X 的协方差矩阵和自相关矩阵间的关系是\n\nΣ = R − X X' = R − μ μ'\n"
