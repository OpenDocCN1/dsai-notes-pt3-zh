    vec{x} - \\vec{x}_j)$ 幅度很大，宽度很小，近似于以 $\\vec{x}_j$ 为中心的 $\\delta$—函数，此时 $\\hat{p}_N(\\\
    vec{x})$ 是 $N$ 个以 $\\vec{x}_j$ 为中心的尖脉冲在 $x$ 点处迭加，使之波动太大，不稳定，可能失去连续性。\n\n$h_N(\\\
    vec{x})$ 的选取对 $\\hat{p}_N(\\vec{x})$ 的影响很大。\n\n估计量 $\\hat{p}_N(\\vec{x})$ 是一随机变量，它依赖于随机的训练样本，所以估计量的性能只能用统计性质表示。\n\
    \n在满足下列条件下 $\\hat{p}_N(\\vec{x})$ 是渐近无偏估计、均方收敛、均方逼近($\\vec{x}$)、且是渐近正态分布。\n\n\
    - (1) 概密 $p(x)$ 在 $x$ 处连续\n- (2) 窗函数满足下列条件\n  - ① $\\varphi(\\vec{u}) \\ge 0$\n\
    \  - ② $\\int \\varphi(\\vec{u}) d\\vec{u} = 1$\n  - ③ $\\sup_{\\vec{u}} \\varphi(\\\
