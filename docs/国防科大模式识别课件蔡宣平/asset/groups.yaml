    # 对于ω₁,N₁=7,系数为


    φ₁(x) = 1    φ₃(x) = 2x₂

    φ₂(x) = 2x₁    φ₄(x) = 4x₁x₂


    C₁₁ = 1/7 ∑_{k=1}^7 φ₁(x̄_k^{(1)}) = 1

    C₁₂ = 1/7 ∑_{k=1}^7 2x_{k1}^{(1)} = 2/7 (2 + 2 + 3 + 3 + 3 + 4 + 4) = 6

    C₁₃ = 1/7 ∑_{k=1}^7 2x_{k2}^{(1)} = 2/7 (2 + 3 + 2 + 3 + 4 + 3 + 4) = 6

    C₁₄ = 1/7 ∑_{k=1}^7 4x_{k1}^{(1)}x_{k2}^{(1)} = 4/7 (2×3 + 2×3 + 3×2 + 3×3 + 3×4
    + 4×3 + 4×4) = 37.1


    ∴ ˆp_{N₁}(x | ω₁) = ∑_{j=1}^4 C_{1j}φ_j(x) = 1 + 6×(2x₁) + 6×(2x₂) + 37.1×(4x₁x₂)

    = 1 + 12x₁ + 12x₂ + 148.4x₁x₂'
  - '[PAGE 587]


