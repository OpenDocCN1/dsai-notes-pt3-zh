  - '[PAGE 419]


    # 4.1.3 正态模式分类的误判概率


    考虑两类问题，设两类模式为协方差阵相等的多变量正态分布，它们的密度函数分别为：


    p(x⃗|ω_i) ∼ N(μ⃗_i, Σ)


    p(x⃗|ω_j) ∼ N(μ⃗_j, Σ)


    对数似然比 L_ij(x⃗) ≜ ln l_ij(x⃗) = ln p(x⃗|ω_i) − ln p(x⃗|ω_j)

    = −1/2 (x⃗−μ⃗_i)′ Σ⁻¹ (x⃗−μ⃗_i) + 1/2 (x⃗−μ⃗_j)′ Σ⁻¹ (x⃗−μ⃗_j)

    = x⃗′ Σ⁻¹ (μ⃗_i − μ⃗_j) − 1/2 (μ⃗_i + μ⃗_j)′ Σ⁻¹ (μ⃗_i − μ⃗_j)'
  - "[PAGE 420]\n\nL_{ij}(x) 是 x 的线性函数，而 x 的各分量是正态分布的，故 L_{ij} 是正态分布的随机变量。\n\nE_i[L_{ij}]\
    \ = \\bar{\\mu}_i \\Sigma^{-1} (\\bar{\\mu}_i - \\bar{\\mu}_j) - \\frac{1}{2}\
    \ (\\bar{\\mu}_i + \\bar{\\mu}_j)' \\Sigma^{-1} (\\bar{\\mu}_i - \\bar{\\mu}_j)\
    \ = \\frac{1}{2} (\\bar{\\mu}_i - \\bar{\\mu}_j)' \\Sigma^{-1} (\\bar{\\mu}_i\
    \ - \\bar{\\mu}_j)\n\n令 r_{ij}^2 = (\\bar{\\mu}_i - \\bar{\\mu}_j)' \\Sigma^{-1}\
    \ (\\bar{\\mu}_i - \\bar{\\mu}_j)\n\nE_i[L_{ij}] \\triangleq \\bar L_{ij} = \\\
    frac{1}{2} r_{ij}^2 \nL_{ij}(x) = x' \\Sigma^{-1} (\\bar{\\mu}_i - \\bar{\\mu}_j)\
    \ - \\frac{1}{2} (\\bar{\\mu}_i + \\bar{\\mu}_j)' \\Sigma^{-1} (\\bar{\\mu}_i\
    \ - \\bar{\\mu}_j)\n\nVar_i[L_{ij}] = E_i[(L_{ij} - \\bar L_{ij})^2]\n= E_i[((x\
    \ - \\bar{\\mu}_i)' \\Sigma^{-1} (\\bar{\\mu}_i - \\bar{\\mu}_j))^2]\n= E_i[(\\\
    bar{\\mu}_i - \\bar{\\mu}_j)' \\Sigma^{-1} (x - \\bar{\\mu}_i)(x - \\bar{\\mu}_i)'\
    \ \\Sigma^{-1} (\\bar{\\mu}_i - \\bar{\\mu}_j)]\n= (\\bar{\\mu}_i - \\bar{\\mu}_j)'\
    \ \\Sigma^{-1} (\\bar{\\mu}_i - \\bar{\\mu}_j)\n= r_{ij}^2"
