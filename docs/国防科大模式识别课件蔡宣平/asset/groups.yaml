    \ = (y₁, y₂, …, y_d)', d ≤ n\n\n变换 y⃗ = W' x⃗\n\n原始特征\n\n二次特征\n\nW = W_{n×d} 为特征提取矩阵或变换矩阵"
  - '[PAGE 653]


    # # 7.3.1 基于离差矩阵判据的变换法


    设 $s_w$ 和 $s_B$ 分别为原始特征空间中的类内和类间离差矩阵， $s_w^*$ 和 $s_B^*$ 分别为变换特征空间中的类内和类间离差矩阵，可知


    ```

    $s_w^* = W^T s_w W$

    $s_B^* = W^T s_B W$

    ```


    根据 $J_1=\mathrm{Tr} [S_w^{-1}S_B] \to \max$ 或 $J_4=|S_w+S_B| / |S_B| = |S_T| /
    |S_B| \to \max$ 求变换矩阵 $W$。'
  - '[PAGE 654]


    # （一）对于矩阵迹形式的判据


    在变换域中 $J_1$ 为


    ```

    $J_1^*(W) = Tr\left[\left(S_W^\ast\right)^{-1} S_B^\ast\right] = Tr\left[\left(W^T
    S_W W\right)^{-1}\left(W^T S_B W\right)\right]$

    ```


    由线性代数可知，对矩阵作相似变换其迹不变，一个方阵的迹等于它的所有特征值之和。设 $W_e$ 为正交阵，用 $W_e$ 对对称阵 $S_W^{-1} S_B$
    作相似变换使其成为对角阵，


    ```

    $W_e^{-1} S_W^{-1} S_B W_e = W_e^T S_W^{-1} S_B W_e = \begin{pmatrix} \lambda_1
    & & 0 \\ & \lambda_2 & \\ & \ddots & \\ 0 & & \lambda_n \end{pmatrix} \triangleq
    diag(\lambda_1, \lambda_2, \cdots, \lambda_n)$

    ```


    其中，$\lambda_i\ (i=1,2,\cdots,n)$ 为 $S_W^{-1} S_B$ 的特征值，$W_e$ 的列矢量 $w_i$ 为 $S_W^{-1}
    S_B$ 相应于 $\lambda_i$ 的特征向量。由上式可得


    ```

    $J_1 = Tr\left[S_W^{-1} S_B\right] = Tr\left[W_e^T S_W^{-1} S_B W_e\right] = \sum_{i=1}^{n}
    \lambda_i$

    ```'
  - '[PAGE 655]


    # 7.3.1 基于离差矩阵判据的变换法


    假设 $W_e$ 的列矢量的排列已作适当调整，使 $S_W^{-1}S_B$ 的特征值 $\lambda_1 \ge \lambda_2 \ge ... \ge
    \lambda_n$ 。由此可得，在 $d$ 给定后，取前 $d$ 个较大的特征值所对应的特征向量 $w_i (i=1,2,...,d)$ 构造特征提取矩阵
    $W$，即：


    ```

    $W = (\vec{w}_1 \quad \vec{w}_2 \quad \dots \quad \vec{w}_d)$

    ```


    作变换 $\vec{y}=W^T\vec{x}$，这时对于给定的 $d$ 所得到的


    ```

    $J_1^*(W)=\sum_{i=1}^{d}\lambda_i$

    ```


    达最大值。此方法对 $J_3 = Tr[S_B]/Tr[S_W]$ 也适用。'
