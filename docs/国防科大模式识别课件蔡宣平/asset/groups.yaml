    ## 2·4 聚类的算法


    ### 2.4.1 聚类的技术方案


    聚类分析有很多具体的算法,有的比较简单,有的相对复杂和完善,但归纳起来就是三大类:


    - 1、按最小距离原则简单聚类方法

    - 2、按最小距离原则进行两类合并的方法

    - 3、依据准则函数动态聚类方法


    ## 2·4 聚类的算法


    ### (1) 简单聚类方法


    针对具体问题确定相似性阈值，将模式到各聚类中心间的距离与阈值比较，当大于阈值时该模式就作为另一类的类心，小于阈值时按最小距离原则将其划分到某一类中。


    这类算法运行中模式的类别及类的中心一旦确定将不会改变。


    ## 2·4 聚类的算法


    ### (2) 按最小距离原则进行两类合并的方法


    首先视各模式自成一类,然后将距离最小的两类合并成一类,不断地重复这个过程,直到成为两类为止。


    这类算法运行中,类心不断地修正,但模式类别一旦指定后就不再改变,就是模式一旦划为一类后就不再被划分开,这类算法也称为谱系聚类法。


    ## 2·4 聚类的算法


    ### (3) 依据准则函数动态聚类法


    设定一些分类的控制参数，定义一个能表征聚类结果优劣的准则函数，聚类过程就是使准则函数取极值的优化过程。


    算法运行中，类心不断地修正，各模式的类别的指定也不断地更改。这类方法有 K-C均值法、ISODATA法等。


    ## 2·4 聚类的算法--简单聚类方法


    ### 2.4.2 根据相似性阈值和最小距离原则的简单聚类方法


    - 1. 条件及约定

    - 设待分类的模式为 {x₁, x₂, …, x_N}，选定类内距离门限 T。


    - 2. 算法思想

    - 计算模式特征向量到聚类中心的距离并和门限 T 比较，决定归属该类或作为新的一类中心。这种算法通常选择欧氏距离。


    ## 2·4 聚类的算法——简单聚类方法


    ### 3. 算法原理步骤


    - (1) 取任意的一个模式特征矢量作为第一个聚类中心。例如，令 ω₁ 类的中心 z⃗₁ = x⃗₁。


    - (2) 计算下一个模式特征矢量 x⃗₂ 到 z⃗₁ 的距离 d₂₁。若 d₂₁ > T，则建立新的一类 ω₂，其中中心 z⃗₂ = x⃗₂。若 d₂₁
    ≤ T，则 x⃗₂ ∈ ω₁。


    ## 2·4 聚类的算法——简单聚类方法


    ### 3. 算法原理步骤


    (3) 假设已有聚类中心 \vec{z}_1, \vec{z}_2, \cdots, \vec{z}_k，计算尚未确定类别的模式特征向量 \vec{x}_i
    到各聚类中心 \vec{z}_j (j = 1,2,\cdots,k) 的距离 d_{ij}。如果 d_{ij} > T (j = 1,2,\cdots,k)，则
    \vec{x}_i 作为新的一类 \omega_{k+1} 的中心，\vec{z}_{k+1} = \vec{x}_i；

    否则，如果 d_{il} = min_j [d_{ij}]，则判定 \vec{x}_i \in \omega_l。检查是否所有的模式都划分完类别，如果都划分完了则结束；否则回到(3)。


    ## 2·4 聚类的算法——简单聚类方法


    这类算法的突出优点是算法简单。但聚类过程中，类的中心一旦确定将不会改变，模式一旦指定类后也不再改变。


    从算法的过程可以看出，该算法结果很大程度上依赖于距离门限T的选取及模式参与分类的次序。如果能有先验知识指导门限T的选取，通常可获得较合理的效果。也可考虑设置不同的T和选择不同的次序，最后选择较好的结果进行比较。


