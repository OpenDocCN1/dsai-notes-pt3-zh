    \ 的计算式可写成迭代形式。\n\n令 ρ(x)=1，若 C_i^*(N) 表示用前 N 个样本所求得的系数\n\n当加入第 N+1 个样本后，\n\nC_i^*(N+1)=\
    \ 1/(N+1)[ N C_i^*(N)+ φ_i(x_{N+1}) ]      (i=1,2,…,R)\n\n初始系数: C_i^*(0)=0，显然\
    \ C_i^*(1)= φ_i(x_1)。\n\n#### 5·5 有限项正交函数级数逼近法——最小积分平方逼近方法\n\n同理可得到 $\\hat{p}_{N+1}(\\\
    vec{x})$ 的迭代形式。\n\n$\\hat{p}_{N}(\\vec{x}) = \\sum_{i=1}^{R} C_{i}^{*}(N)\\varphi_{i}(\\\
    vec{x}) \\qquad \\hat{p}_{N+1}(\\vec{x}) = \\sum_{i=1}^{R} C_{i}^{*}(N+1)\\varphi_{i}(\\\
    vec{x})$\n\n$C_{i}^{*}(N+1) = \\frac{1}{N+1}\\left[ N C_{i}^{*}(N) + \\varphi_{i}(\\\
    vec{x}_{N+1}) \\right]$\n\n$\\hat{p}_{N+1}(\\vec{x}) = \\frac{N}{N+1}\\hat{p}_{N}(\\\
    vec{x}) + \\frac{1}{N+1}\\sum_{i=1}^{R} \\varphi_{i}(\\vec{x}_{N+1})\\varphi_{i}(\\\
    vec{x})$\n\n$= \\hat{p}_{N}(\\vec{x}) + \\frac{1}{N+1}\\left[ \\sum_{i=1}^{R}\
    \ \\varphi_{i}(\\vec{x}_{N+1})\\varphi_{i}(\\vec{x}) - \\hat{p}_{N}(\\vec{x})\
    \ \\right]$\n\n初始值：$\\hat{p}_{0}(\\vec{x}) = 0$\n\n#### 5·5 有限项正交函数级数逼近法—最小积分平方逼近方法\n\
    \n前面介绍的方法中被逼近的函数是概密，对于这种幅值大小变化较剧烈的函数，须用较多的项才可能在整个空间中有较好的逼近。\n\n为减少计算量，在样本出现较密集的区域（即概密取值较大的区域）中，应要求逼近精度高些；而在样本出现稀疏的区域（即概密取值较小的区域）中，可以让逼近精度低一些。\n\
    \n这样分别对待会使在相同的训练样本下总的误判概率较小。因此应考虑加权的最小均方差逼近。\n"
