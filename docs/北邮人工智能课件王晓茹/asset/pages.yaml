  md: '# 2、k-中心点算法（k-medoids）


    +   - 也称PAM算法（Partitioning Around Medoids）\n  基于有代表性的数据（中心点），而不是均值代表每个簇。\n- 思路\n  1.
    为每个簇随机选择一个代表对象（中心点）；\n  2. 剩余的对象根据其与代表对象的距离分配给与其最近的一个簇；\n  3. 反复使用非代表对象来替换代表对象，以提高聚类的质量，直至找到最合适的中心点。


    ![](img/806dfb586cd1a39120c0a828715591b9_72_0.png)


    一个数据的替代代价 Cᵢₕ：用 h 代替 i 后，到中心点距离的变化。计算用非代表对象替换代表对象的总代价：Cᵢₕ = ∑ Cᵢₕ。


    为了判定一个非代表对象 Oₕ 是否是当前一个代表对象 Oᵢ 的好的替代，对于每一个非中心点对象 Oⱼ，下面的四种情况被考虑：\n✓ 第一种情况：Oⱼ 当前隶属于中心点对象
    Oᵢ。如果 Oₕ 被 Oᵢ 代替作为中心点，且 Oⱼ 离另一个最近的中心点 Oₘ，那么 Oⱼ 被重新分配给 Oₘ。\n✓ 第二种情况：Oⱼ 当前属于一个非代表对象
    Oₕ。如果 Oₕ 代替作为一个中心点，且 Oⱼ 离 Oₕ 最近，那么 Oⱼ 被重新分配给 Oₕ。\n✓ 第三种情况：Oⱼ 当前隶属于 Oₘ，m≠i。如果 Oₕ
    被 Oᵢ 代替作为一个中心点，而 Oⱼ 离 Oₕ 最近，那么 Oⱼ 被重新分配给 Oₕ。\n✓ 第四种情况：Oⱼ 当前隶属于 Oₘ，m≠i。如果 Oₕ 被
    Oᵢ 代替作为一个中心点，且 Oⱼ 离 Oᵢ 最近，那么 Oⱼ 被重新分配给 Oₘ。


    ```

    算法 PAM（k-中心点算法）\n输入：簇的数目 k 和包含 n 个对象的数据集。\n输出：k 个簇，使得所有对象与其最近的中心点的相异度总和最小。\n(1)
    任意选择 k 个对象作为初始中心点。\n(2) REPEAT\n(3) 指派每个剩余的对象给离它最近的中心点所代表的簇；\n(4) REPEAT\n(5)
    选择一个未被选择的中心点 Oₕ；\n(6) REPEAT\n(7) 选择一个未被选择的非中心点对象 Oₕ；\n(8) 计算 Oₕ 代替 Oᵢ 的总代价并记录在
    S；\n(9) UNTIL 所有的非中心点都被选择经过；\n(10) UNTIL 所有的中心点都被选择经过。\n(11) 在步骤(6)中每个中心点代替所有非中心点所计算出的代价中，选取代价最小的中心点，并用它代替
    Oᵢ。然后在簇的中心点代表的对象中，形成一个新的中心点集合。\n(12) UNTIL 没有再发生簇的重新分配，即所有的 S 都大于 0。

    ```


    # 2、k-中心点算法（k-medoids）


    +   - PAM作为最早提出的k-中心点算法之一，它选用簇的中心点作为对象作为代表对象，试图不对对象给出k个划分。\n- 代表对象也被称为是中心点，其他对象则被称为非代表对象。\n-
    最初随机选择k个对象作为中心点，该算法反复地用非代表对象来代替代表对象，试图找出更好的中心点，以改进聚类的质量。\n- 在每次迭代中，所有可能的对象都被分析，每个对象中的一个对象是中心点，而另一个是非代表对象。\n-
    对可能的各种组合，估算聚类结果的质量。一个对象 Oᵢ 可被产生最小平方误差的对象代替。在一次迭代中产生的最佳对象集合成为下次迭代中的中心点。


    ![](img/806dfb586cd1a39120c0a828715591b9_72_1.png)


    每当重新分配发生时，平方-误差所产生的差别对象被重新分配。因此，如果一个对象的中心点被另一个对象代替，代价函数计算平方-误差值所产生的差别。\n- 如果总代价是负的，那么实际的平方-误差将会减小，可以被改动。\n-
    如果总代价是正的，则当前的中心点 Oᵢ 被认为是可接受的，在本次迭代中没有变化。\n总代价定义如下：


