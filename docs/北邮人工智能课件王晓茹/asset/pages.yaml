    # 3.0 引言


    # [03-最小二乘学习法]


    +   - 本章将以X作为输入，以实数值Y作为输出的函数 y = f(X) 的学习问题进行介绍。

    +   - 这里的真实函数关系尚未明确，通过学习过程中作为训练集的输入输出样本集{(Xi,Yi)}来估计进行学习。

    +   - 在一般情况下，输出样本集的真实函数f(X)中经常会出现噪声。


    # 3.1 最小二乘学习法


    # 3.1 最小二乘学习法


    +   - 最小二乘学习法是对模型的参数fθ(X)和训练集的输出{y_i}_{i=1}^n 的平方误差

    +   - J_LS(θ)=1/2∑_{i=1}^n (f_θ(X_i)-y_i)^2 (3.1)

    +   - 为最小化时参数θ进行作用 θ_LS = arg min_θ J_LS(θ)

    +   - 因此，最小二乘学习法也称为L2损失最小化学习法。


    如果使用线性模型 f_θ(X)=1/n∑_{j=1}^p θ_j φ_j(X)=θ^T Φ(X) (3.1) 则训练样本的平方误差J_LS能表示为下述形式。
    ∂_LS(θ)=1/2||Φθ - y||^2'
