- pgno: 13
  md: '# Data Warehouse and Data Mining

    第二章 认识数据、描述数据


    # 主要内容


    +   1.1 数据对象与属性类型

    +   1.2 数据的基本统计描述

    +   1.3 数据可视化

    +   1.4 度量数据的相似性和相异性


    # 1.1 数据对象与属性类型


    +   1. 数据对象与属性

    +   2. 属性类型

    +      - 标称属性

    +      - 二元属性

    +      - 序数属性

    +      - 数值属性

    +   3. 离散属性与连续属性


    # 1. 数据对象


    +   - 数据集由数据对象组成

    +   - 一个数据对象代表一个实体

    +   - 例子：

    +     - 销售数据库 sales database: 客户/顾客、商店/商品、sales

    +     - 医学数据库: patients, treatments

    +     - 大学数据库: students, professors, courses

    +   - 又称为 样本、事例、实例、数据点、对象、元组 tuples。

    +   - 数据对象由属性来描述

    +   - Database rows -> data objects; columns ->attributes.


    # 属性


    +   - 属性(Attribute)（or维度、特征、变量）：一个数据字段，表示一个数据对象的某个特征。

    +     - E.g., customer_ID, name, address

    +   - 类型：

    +     - 标称属性，或名词性属性，Nominal attribute

    +     - 二元属性，Binary attribute

    +     - 数字属性，Numeric attribute

    +       - 区间属性，Interval-scaled

    +       - 比率标度属性，Ratio-scaled

    +     - 序数属性，Ordinal attribute


    # 2. 属性类型——名词属性


    +   - 标称属性，名词属性，Nominal：

    +     - 属性的值是一些符号或事物的名称。每个值代表某种类别、编码或状态，因此标称属性有着看作是分类的（categorical）。

    +     - 属性的值不具有有意义的序，因为是无序的，或是枚举的（enumeration）。

    +     - 属性的值没有数学运算的意义，即均值、中位数等没有意义。

    +   - 举例：类别、状态，or“名目”

    +     - Hair color = {auburn, black, blond, brown, grey, red, white}

    +     - 婚姻状态 = {单身、结婚、离异、丧偶}

    +     - Customer_ID = {0001, 0001, ……}

    +     - zip codes


    # 2. 属性类型——二元属性


    +   - 二元属性，Binary attribute

    +     - 有亦属性的名词性属性：

    +       - 只有2个状态的名词属性（0 and 1）

    +     - 对称二元，Symmetric binary

    +       - 同样重要的两种状态

    +       - e.g., gender

    +     - 非对称，Asymmetric binary

    +       - 非同等重要的状态

    +       - e.g., 医疗检查（positive vs. negative）

    +       - 惯例Convention: assign 1 to most important outcome (e.g., HIV positive)


    # 2. 属性类型——序数属性


    +   - 序数属性，Ordinal attribute

    +     - 属性值之间具有有意义的序或级别（ranking），但相继值之间的差是未知的

    +       - e.g., drink_size: 大、中、小

    +       - e.g., grade: A+, A-, A, B+, B+

    +     - 对于记录不能具有有意义的主观质量评估，使用序数属性，如等级评定调查

    +       - e.g., 顾客满意度

    +     - 数值属性的离散化：

    +       - 将某种属性的数值量划分成有限个有序类别。

    +       - 称称，二元和序数属性都是定性的，他们描述数据对象的特征，而不将给出实际的大小或数量，是一种代表类别的词。


    # 属性类型——数值属性


    +   - 数值属性（Numeric attribute）

    +     - 是定量的，是可度量的量，通常数或实数值表示；

    +     - 分别区间标度或比率标度

    +   - 区间（Interval-scaled）

    +     - 用相等的单位度量

    +     - 属性值有序，可以为正、零、负。

    +     - 没有真正的零点，无法计算倍数

    +     - e.g., temperature in ℃ or ℉；calendar dates

    +   - 比率标度属性（Ratio-scaled）

    +     - 有真正的零点，被测量单位一个数量级（10 K is twice as high as 5 K）。

    +     - e.g., 温度在开尔文；长度；计数；货币等

    +     - 工作年限，字数，重量，高度，速度，盛度，所量等'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# 3. 离散 vs. 连续属性


    +   - 离散属性, Discrete Attribute

    +     - 一个有限的或可数数据集合值

    +     - E.g, zip codes, the set of words in a collection of documents

    +     - 有时,表示为整数变量

    +     - 注: 二元属性是离散属性的一个特殊情况

    +   - 连续属性, Continuous Attribute

    +     - 属性值为实数

    +     - E.g., temperature, height, or weight

    +     - 实际上, 变量只能拥有有限数据进行测量和代表

    +     - 连续属性通常表示为连续变量


    # 1.2 数据描述


    对于成功的数据预处理而言，把握数据的全貌是至关重要的，基本统计描述可以用来识别数据的性质，凸显那些数据值应该视为噪声或离群点；选择何种适用的数据挖掘算法等。


    +   1. 数据的计量和类型

    +   2. 中心趋势度量：均值、中位数和众数

    +   3. 数据散布度量：极差、四分位数、方差、标准差和四分位数极差

    +   4. 数据的基本统计图图形显示


    # 1.数据描述——数据的计量与类型


    +   - 数据的计量尺度

    +   - 数据的类型

    +   - 数据的表现形式


    # 数据的计量尺度


    +   - 数据的计量尺度（Levels of Measurement）

    +     - 一般认为，数据是对客观现象计量的结果。

    +     - 按照对事物计量的精确程度，可将所采用的计量尺度由低级到高级分为四个层次：

    +       - 定类尺度(Nominal Level)

    +       - 定序尺度(Ordinal Level)

    +       - 定距尺度(Interval Level)

    +       - 定比尺度(Ratio Level)


    # （1）定类尺度


    +   - 定类尺度（列名尺度）：

    +     - 按照事物的某种属性对其进行平行的分类或分组。

    +     - 例：人口的性别（男、女）；企业的所有制性质（国有、集体、私营等）

    +     - 计量层次最低

    +     - 对事物进行平行的分类

    +     - 各类别可以指定数字代码表示

    +     - 具有=或≠的数学特性

    +     - 数据表现为“类别”


    # 定类尺度


    定类尺度只测量了事物之间的类别差，而对各类之间的其他差别却无法从中得知，因此各类别地位相同，顺序可以任意改变。


    对定类尺度的计量结果，可以且只能计算每一类中各元素个体出现的频数（frequency）。

    对事物进行分类时，必须符合穷尽(exhaustive)和互斥(mutually exclusive)要求。


    # （2）定序尺度


    +   - 定序尺度（顺序尺度）：

    +     - 是对事物之间等级或顺序差别的一种测度。

    +     - 例：产品等级（一等品、二等品…）；考试成绩（优、良、中、可、差）

    +     - 对事物分类的同时给出各类别的顺序

    +     - 比定类尺度精确

    +     - 不仅可以测量类别差别（分类），还可以测度次序差（比较优劣或排序）

    +     - 数据表现为“类别”，但有序


    # 定序尺度


    无法测出类别之间的准确差值

    该尺度的计量结果只能排序，不能进行算术运算。

    具有>或<的数学特性'
  merge: -1
  img_proc: true
