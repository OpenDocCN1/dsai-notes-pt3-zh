  md: '# 贝叶斯法则


    +   - 贝叶斯公式 P(h|D) = P(D|h)P(h)/P(D)

    +   - 极大后验(maximum a posteriori, MAP) 假设

    +     给定数据D可能最大似然的假设h∈H

    +     计算公式 h_MAP = argmax_{h∈H} P(h|D) = argmax_{h∈H} P(D|h)P(h)/P(D) = argmax_{h∈H}
    P(D|h)P(h)

    +   - 极大似然(maximum likelihood, ML) 假设

    +     依据P(D|h) (给定特定数据D的似然) 最大的假设

    +     计算公式 h_ML = argmax_{h} P(D|h)


    # 贝叶斯法则


    +   举例：一个天气估计问题

    +   - 两个假设H: h1={晴天}, h2={非晴天}

    +   - 可观察到的数数据：温度高+和温度低-

    +   - 先验知识p(h)

    +     - 北京晴天的概率: 0.99, P(h1)=0.99

    +     - 非晴天: 0.01, P(h2)=0.01

    +   - 观察到的概率P(D|h):

    +     - P(温度高 | 晴天) = 0.85

    +     - P(温度低 | 非晴天) = 0.93

    +   - 问题：现在观察到温度低，判断是否非晴天？


    # 贝叶斯法则


    +   极大后验计算

    +   - P(非晴天 | 温度低) ∝ P(温度低|非晴天)*P(非晴天) = 0.93*0.01 = 0.0093

    +   - P(晴天 | 温度低) ∝ P(温度低|晴天)*P(温度高) = 0.15*0.99 = 0.1485

    +   - 答案：晴天


    # 贝叶斯法则


    +   极大似然计算

    +   - P(非晴天 | 温度低) ∝ P(温度低|非晴天) = 0.93

    +   - P(晴天 | 温度低) ∝ P(温度低|晴天) = 0.15

    +   - 答案：非晴天


    # 贝叶斯法则


    +   另一个例子：医疗诊断问题

    +   - 两个假设H: h1={病人有癌症} h2={病人无癌症}

    +   - 可观察数据为化验结果：⊕(正)和⊖(负)

    +   - 先验知识: P(cancer)=0.008

    +   - 现象数据: P(⊕|cancer)=0.98 P(⊖|-cancer)=0.97

    +   - 问题: 新来的病人的检查结果为⊕, 应如何诊断？


    # 贝叶斯法则—示例


    已知假设, 病人有癌症, 病人无癌症 P(cancer)=0.008 P(-cancer)=0.992 P(⊕|cancer)=0.98 P(⊕|-cancer)=0.02
    P(⊖|cancer)=0.02 P(⊖|-cancer)=0.97 假设有一病人, 化验结果为⊕, 该病人有癌症吗？ P(⊕|cancer)P(cancer)=(0.98)(0.008)=0.00784
    h_MAP = argmax P(D|h)P(h)/P(D) P(⊕|-cancer)P(-cancer)=(0.02)(0.992)=0.01984 因此,
    h_MAP = -cancer 注: (1)贝叶斯推理的结论很大程度上依赖于先验概率; (2)并没有完全地接受检测结果的确定性, 而只是在观察到较多的证据后使得可能性增大或减小了。


    # 基本概率公式表


    +   乘法规则: P(A∧B)=P(A|B)P(B)=P(B|A)P(A)

    +   加法规则: P(A∨B)=P(A)+P(B)-P(A∧B)

    +   贝叶斯法则: P(h|D)=P(D|h)P(h)/P(D)

    +   全概率法则: 如果事件A1...An互斥, 且满足 ΣP(Ai)=1, 则 P(B)=ΣP(B|A_i)P(A_i)


