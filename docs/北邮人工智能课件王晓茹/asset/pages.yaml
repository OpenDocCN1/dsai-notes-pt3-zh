  md: 'DBSCAN通过检查数据集中每个对象的ε-领域来寻找聚类。如果一个点的ε-领域包含多于MinPts个对象，则创建一个作为核心点对象的簇。然后，DBSCAN反复地寻找从这些核心点对象直接或间接可达的对象。这个过程可递归地一直进行下去直到簇内所有的点都可以被添加到任何簇时，该过程结束。具体如下：


    # DBSCAN算法描述


    输入：包含对象的数据集，半径ε，最少数目MinPts。输出：所有生成的簇，达到密度要求。1. REPEAT 2. 从数据集中选择一个未被处理的对象 3. IF
    输出的是核心点，TDBSCAN输出所有从该点可达的对象，形成一个簇 4. ELSE 输出的是从边缘点（非核心对象），跳出本次循环，寻找下一个 5. UNTIL
    所有点都被处理；


    # 算法执行过程


    | 序号 | 属性1 | 属性2 | 密度可达性 | 在中心点附近 | 统计结果的聚类结果 |

    |---|---|---|---|---|---|

    | 1 | 1 | 1 | 无 |  | 无 |

    | 2 | 4 | 0 | 无 |  | 无 |

    | 3 | 0 | 1 | 无 |  | 无 |

    | 4 | 1 | 1 | 簇{C1, 3, 4, 5, 9, 10, 12} |  | 已有一个簇中，

    | 5 | 2 | 1 |  |  |  |

    | 6 | 3 | 1 |  |  |  |

    | 7 | 4 | 1 | 簇{C2, 6, 7, 8, 11} |  |  |

    | 8 | 5 | 1 |  |  |  |

    | 9 | 0 | 2 |  |  | 已有一个簇中，

    | 10 | 1 | 2 |  |  | 已有一个簇中，

    | 11 | 4 | 2 |  |  | 已有一个簇中，

    | 12 | 1 | 3 |  |  |  |


    第1步：在数据集中选择一点1，由于它以它为中心的，以1为半径的圆内包含2个点（小于2），因此它不是核心点，丢弃下一点。第2步：在数据集中选择一点2，它可以以它为圆心，以1为半径的圆内包含2个点，因此它不是核心点，丢弃下一点。第3步：在数据集中选择一点3，它可以以它为圆心，以1为半径的圆内包含2个点，因此它不是核心点，丢弃下一点。第4步：在数据集中选择一点4，它可以以它为圆心，以1为半径的圆内包含6个点，因此它是核心点，输出一个簇，簇{C1,
    3, 4, 5, 9, 10, 12}。第5步：在数据集中选择一点5，它可以以它为圆心，以1为半径的圆内包含6个点，因此它是核心点，输出一个簇，簇{C1,
    3, 4, 5, 9, 10, 12}。第6步：在数据集中选择一点6，它可以以它为圆心，以1为半径的圆内包含4个点，因此它是核心点，输出一个簇，簇{C2,
    6, 7, 8, 11}。第7步：在数据集中选择一点7，它可以以它为圆心，以1为半径的圆内包含4个点，因此它是核心点，输出一个簇，簇{C2, 6, 7, 8,
    11}。第8步：在数据集中选择一点8，它可以以它为圆心，以1为半径的圆内包含4个点，因此它是核心点，输出一个簇，簇{C2, 6, 7, 8, 11}。第9步：在数据集中选择一点9，它可以以它为圆心，以1为半径的圆内包含4个点，因此它是核心点，输出一个簇，簇{C1,
    3, 4, 5, 9, 10, 12}。第10步：在数据集中选择一点10，它可以以它为圆心，以1为半径的圆内包含4个点，因此它是核心点，输出一个簇，簇{C1,
    3, 4, 5, 9, 10, 12}。第11步：在数据集中选择一点11，它可以以它为圆心，以1为半径的圆内包含4个点，因此它是核心点，输出一个簇，簇{C2,
    6, 7, 8, 11}。第12步：选择点12，已经检验完，由此已是所有点都已处理，程序结束。


    # DBSCAN算法的应用


    +   - 在交通事故多发点排查问题

    +   - 在一条公路上，已知交通事故发生车辆的次数及每次车辆发生地点的里程数，如何找到事故多发点？

    +   - 交通事故多发点可以理解为一条交通道路上发生交通事故频率或密度最大的地方，DBSCAN算法是基于密度的聚类分析算法

    +   - DBSCAN算法在道路交通事故多发点的排查上就可以理解为，排查在半径为eps公里内发生Minpts以上交通事故的地点或者路段


    # 在交通事故多发点排查问题


    2001年公安部交通管理局发布了《全面排查交通事故多发地点排查工作方案》，其中对公路交通事故多发地点的鉴别标准，做了明确规定（1）多发点，约500m范围内，一年之中发生3次以上交通事故的路段。（2）多发路段，为2000m范围内连续的，涵盖的全部，一年之中发生3次以上交通事故的路段。根据上述分析，我们可以利用DBSCAN算法进行聚类分析


    # 得到结论如下：


    +   - 基于密度可达性的最大的密度相连对象集合称为交通事黑点，这些点必须重点关注

    +   - 不属于任何黑点中的事故对象被认为是“噪声”，这些点事故的发生是偶然因素


    # DBSCAN算法的缺点


    对参数EPS和Minpts非常敏感，但是这两个参数都是通过主观判断取主要依赖于观察判断 如果数据库比较大的时候要进行大量的I/O开销


