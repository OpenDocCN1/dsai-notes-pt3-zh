  md: '# （3）定序数据：四分位数（quartile）


    +   - 排序后处于25%和75%位置上的值

    +   - 用Q_L和Q_U表示

    +   - 不受极端值的影响

    +   - 主要用于定序数据，也可用于数值型数据，但不能用于定类数据


    # 四分位数


    方法1：定义算法

    Q_L位置 = n/4

    Q_U位置 = 3n/4


    方法2：线性插算法

    Q_L位置 = (n+1)/4

    Q_U位置 = 3(n+1)/4


    # 四分位数


    方法3：Q位置 = [ (n+1)/2 ] +1 /2


    其中[ ]中位数的位取整。这样计算出的四分位数的位置，要么是整数，要么在两个数之间0.5的位置上。


    # 四分位数的例子（定序数据）


    | 甲市家庭居住状况满意度分析的频数分布 甲城市 | | |

    | 回答类别 | 户数(户) | 累计频数 |

    | 非常不满意 | 24 | 24 |

    | 不满意 | 108 | 132 |

    | 一般 | 93 | 225 |

    | 满意 | 45 | 270 |

    | 非常满意 | 30 | 300 |

    | 合计 | 300 | — |


    解：Q_L位置 = (300×4)/4 =75

    Q_U位置 = (3×300)/4 =225

    从累积频数看，Q_L在“不满意”这一组当中，Q_U在“一般”这一组当中

    四分位数为

    Q_L = 不满意

    Q_U = 一般


    # 四分位数的例子（数值型数据）


    +   - 9个家庭的人均收入数据

    +   - 原始数据：1500 750 780 1080 850 960 2000 1250 1630

    +   - 排序：750 780 850 960 1080 1250 1500 1630 2000

    +   - 位 置：1 2 3 4 5 6 7 8 9


    方法1

    Q_L位置 = 9/4 =2.25

    Q_U位置 = 3×9/4 =6.75

    Q_L =780+(850-780)×0.25 =797.5

    Q_U =1250+(1500-1250)×0.75 =1437.5


    # 四分位数的例子（数值型数据）


    +   - 9个家庭的人均收入数据

    +   - 原始数据：1500 750 780 1080 850 960 2000 1250 1630

    +   - 排序：750 780 850 960 1080 1250 1500 1630 2000

    +   - 位 置：1 2 3 4 5 6 7 8 9


    方法2

    Q_L位置 = (9+1)/4 =2.5

    Q_U位置 = 3(9+1)/4 =7.5

    Q_L = (780+850)/2 =815

    Q_U = (1500+1630)/2 =1565


    # 四分位数的例子（数值型数据）


    +   - 9个家庭的人均收入数据

    +   - 原始数据：1500 750 780 1080 850 960 2000 1250 1630

    +   - 排序：750 780 850 960 1080 1250 1500 1630 2000

    +   - 位 置：1 2 3 4 5 6 7 8 9


    方法3

    Q位置 = [ (9+1)/2 ] +1 /2 =3

    Q_L =850

    Q_U =1500


    # （4）数值型数据：平均数（mean）


    +   - 一组数据相加后除以数据的个数而得到的结果，也称为均值

    +   - 集中趋势的最常用测度值

    +   - 易受极端值的影响

    +   - 根据总体数据计算的，称为平均数，记为μ；根据样本数据计算的，称为样本平均数，记为x̄'
