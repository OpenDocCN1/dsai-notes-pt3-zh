    # AdaBoost & Its Applications


    AdaBoost for Face Detection


    # Challenges


    +   - Slide a window across image and evaluate a face model at every location

    +   - Sliding window detector must evaluate tens of thousands of location/scale
    combinations

    +   - Faces are rare: 0-10 per image

    +     - For computational efficiency, we should try to spend as little time as
    possible on the non-face windows

    +     - A megapixel image has ~10^6 pixels and a comparable number of candidate
    face locations

    +     - To avoid having a false positive in every image image, our false positive
    rate has to be less than 10^-6


    # The Viola/Jones Face Detector


    +   - A seminal approach to real-time object detection

    +   - Training is slow, but detection is very fast

    +   - Key ideas

    +     - Integral images for fast feature evaluation

    +     - Boosting for feature selection

    +     - Attentional cascade for fast rejection of non-face windows'
