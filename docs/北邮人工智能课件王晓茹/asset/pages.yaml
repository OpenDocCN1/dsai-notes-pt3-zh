  md: '# ROC Curve for 200-Feature Classifier


    A 200-feature classifier can yield 95% detection rate and a false positive rate
    of 1 in 1408.


    ![](img/806dfb586cd1a39120c0a828715591b9_52_0.png)


    # Attentional Cascade


    +   - We start with simple classifiers which reject many of the negative sub-windows
    while detecting almost all positive sub-windows.

    +   - Positive response from the first classifier triggers the evaluation of a
    second (more complex) classifier and so on.

    +   - A negative outcome at any point leads to the immediate rejection of the
    sub-window.


    ![](img/806dfb586cd1a39120c0a828715591b9_52_1.png)


    # Attentional Cascade


    +   - Chain classifiers that are progressively more complex and have lower false
    positive rates


    ![](img/806dfb586cd1a39120c0a828715591b9_52_2.png)


    # Detection Rate and False Positive Rate for Chained Classifiers


    ![](img/806dfb586cd1a39120c0a828715591b9_52_3.png)


    +   - The detection rate and false positive rate of the cascade are found by multiplying
    the respective rates of the individual stages.

    +   - A detection rate of 0.99 and a false positive rate on the order of 10^-6
    can be achieved by a 10-stage cascade if each stage has a detection rate of 0.99
    and a false positive rate of about 0.30.


    ![](img/806dfb586cd1a39120c0a828715591b9_52_4.png)


    # Training the Cascade


    +   - Set target detection and false positive rates for each stage

    +   - Keep adding features to the current stage until its target rates have been
    met

    +     - Need to lower AdaBoost threshold to maximize detection (as opposed to
    minimizing total classification error)

    +     - Test on a validation sequence

    +   - If the overall false positive rate is not low enough, then add another stage

    +   - Use false positives from current stage as the negative training examples
    for the next stage


    Table 2. The training algorithm for building a cascaded detector.


    1. User selects values for the minimum acceptable false positive rate and detection
    rate.

    2. Set the target detection rate for the current stage.

    3. Set the target false positive rate.

    4. If the target false positive rate is not met, add features and retrain.

    5. Repeat until the desired cascade performance is reached.


    # ROC Curves Cascaded Classifier to Monolithic Classifier


    ![](img/806dfb586cd1a39120c0a828715591b9_52_5.png)


    # ROC Curves Cascaded Classifier to Monolithic Classifier


    ![](img/806dfb586cd1a39120c0a828715591b9_52_6.png)


    +   - There is little difference between the two in terms of accuracy.

    +   - There’s a big difference in terms of speed.

    +     - The cascaded classifier is nearly 10 times faster since its first stage
    throws out most non-faces so that they are never evaluated by subsequent stages.'
