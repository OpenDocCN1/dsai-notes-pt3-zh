  md: '# ### 1.3.1 生成的分类和识别的分类


    **判别式的分类：**在已知模式 x 的时候，如果能求得使分类类别 y 的条件概率 p(y|x) 达到最大值的类别 y 的话，就可以进行模式识别了。


    ŷ = argmaxᵧ p(y|x)


    “argmax”是取得最大值时参数的意思。所以，maxᵧ p(y|x) 是指当 y 取值使 p(y|x) 的最大值，而 argmaxᵧ p(y|x) 是指当
    y 取值时对应的 y 的值。在模式识别里，条件概率 p(y|x) 通常也被称为后验概率。


    # ### 1.3.1 生成的分类和识别的分类


    **生成式的分类：**在模式识别里，联合概率 p(x,y) 也称为数据生成概率。通过预测模型生成概率 p(x,y) 来进行模式识别的分类方法，称为生成的分类。


    p(y|x) = p(x,y) / p(x)


    通过上述，我们可以发现生成的分类和判别的分类各有优缺点。生成式分类是生成概率模型，判别式分类直接对条件概率进行建模。


    ![](img/806dfb586cd1a39120c0a828715591b9_2_0.png)


    # ### 判别式 VS 生成式


    **Vladimir Naumovich Vapnik，俄罗斯统计学家、数学家：**在实际问题中，信息往往是有限的。在解决一个信息量的问题时，不要把解决一个更一般的问题作为一个中间步骤。要试图得到所有需要的答案，而不是更一般的答案。很可能拥有足够的信息来很好地解决一个感兴趣的特定问题，但却没有足够的信息来解决一个一般性的问题。


    p(y|x) = p(x,y) / p(x) = p(x,y) / Σᵧ p(x,y)


    即使手头的信息量不足以解决一般性问题，但对于解决特定问题，深可能是足够的。


    # ### 判别式 VS 生成式


    如果数据生成概率 p(x,y) 是已知的，那么，从下面就可以推出后验概率 p(y|x)。然而，如果后验概率 p(y|x) 是已知的，却不能由此推导出数据生成概率
    p(x,y)。


    p(y|x) = p(x,y) / p(x) = p(x,y) / Σᵧ p(x,y)


    ![](img/806dfb586cd1a39120c0a828715591b9_2_1.png)


    # ### 1.3.2 统计概率和布尔贝叶斯


    统计概率：以包含全局的概率 p(x,y) 为例，将模式 x 作为决定的变量，使用手头的训练样本 D={(xᵢ,yᵢ)}ₙᵢ₌₁ 对模式进行学习。例如，在最大似然估计中，一般对函数训练集
    D 的概率分布进行学习。


    maxθ ∏ⁿᵢ₌₁ q(xᵢ,yᵢ;θ)


    在统计概率方法中，如何对训练集 D 得到高精度的模式是主要的研究课题。


    # ### 1.3.2 统计概率和布尔贝叶斯


    朴素贝叶斯：以包含全局的概率 p(x,y) 为例，将模式 x 作为概率变量，对其先验概率 p(θ) 加以考虑，计算与训练集 D 相关的生成概率 p(D|θ)。在朴素贝叶斯判断定理，可以从使用先验概率
    p(θ) 来求解后验概率 p(θ|D)。


    p(θ|D) = p(D|θ)p(θ) / p(D) = [∏ⁿᵢ₌₁ q(xᵢ,yᵢ;θ)]p(θ) / ∫[∏ⁿᵢ₌₁ q(xᵢ,yᵢ;θ)]p(θ)dθ


    在朴素贝叶斯算法中，如何精确地计算后验概率是一个主要的研究课题。


    # ### 02-学习模型


    如何使待定函数与数据集相近似


    # ### 主要的学习模型


    +   - 线性模型：线性回归模型

    +   - 核模型：高斯核函数

    +   - 层次模型：逻辑回归


    ![](img/806dfb586cd1a39120c0a828715591b9_2_2.png)'
