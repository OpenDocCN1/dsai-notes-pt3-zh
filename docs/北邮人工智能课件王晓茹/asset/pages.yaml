  md: '# 2.4 产生式规则表示法


    # 一 概念


    1 产生式规则也称基于规则的表示法。1943年由Post提出，为目前应用最为“远”的方法之一。


    # 2 结构：


    产生式规则的基本结构为：

    前提状态 → 结论动作

    IF 前提 THEN 动作结论


    例：R

    IF 动物是鸟 AND 会游泳 AND 不会飞

    AND 有黑白色

    THEN 该动物是企鹅


    # 三 特点


    # 1 优点：


    +   (1) 善于表达领域知识

    +   (2) 控制和知识分离

    +   (3) 知识的模块化

    +   (4) 便于实现推理

    +   (5) 便于使用自身知识


    # 2 缺点：


    +   (1) 单条规则容易解释，但规则之间的依赖关系难以确定

    +   (2) 规则数太大(万条级)，知识库的一致性难以维护

    +   (3) 某些类型的知识难以表示，如结构性的知识。


    (1) P：所有的研究生都很努力；

    Q：张红是一名研究生；

    张红学习很努力？


    (2) P1：张红是一名研究生；

    P2：王东是一名研究生；

    。。。。。。


    两个谓词公式等价：

    P、Q 两个个体谓词公式，D 为共同个体域。对 D 上的任何一个个体，P、Q 都有相同的值。两者为等价。


    谓词公式表示知识：

    (1) 设定谓词，指出每个谓词的精确含义。

    (2) 用连接词将相关谓词连接起来，用公式表达完整意义。


    # 二 例：


    +   (1) 我喜欢音乐和绘画：

    +   LIKE(x, y)

    +   LIKE(I, music) ∧ LIKE(I, painting)

    +   (2) 李明打篮球或踢足球。

    +   PLAY(x, y)

    +   PLAY(李明, basketball) ∨ PLAY(李明, football)

    +   (3) 所有机器猫人都是灰色的；

    +   ∀X[ROBOTS(x) → COLOR(x, GRAY)]


    # 二 基于规则的系统


    基于规则的系统的三个主要模块：

    1 知识库：存储大量规则

    2 数据库：问题的事实和从规则推出发生的事实，中间结果

    3 推理机：将关于问题的事实与知识库中的规则匹配，求解。


    ![](img/806dfb586cd1a39120c0a828715591b9_88_0.png)


    # 2.5 谓词表示法


    命题逻辑、谓词逻辑，人工智能应用中的两种逻辑。


    # 一 概念


    1 命题：具有真假意义的语句。写大写英文字母表示。

    无法表达复杂物体的结构、逻辑关系、不表示物体的共同特征。


    2 谓词：由谓词名和个体常量或变量元组构成；

    个体常量表示个体存在的特征或构成的概念。

    谓词可由两个个体变量构成，表示这两个个体间的关系。

    P(x1,x2,...,xn) 元组

    一阶谓词、二阶谓词


    # 二 谓词公式


    连接词：将命题逻辑连接起来构成一个复合命题，表示复杂的含义。

    ¬ ∧ ∨ → ↔ ∃x ∀x


    谓词公式：谓词逻辑的合式公式。

    (1) 单个命题是合式公式，原子谓词公式。

    (2) 加上连接词后仍是合式公式。

    (3) 加上连接词 ∧ ∨ → ↔ 后仍是合式公式。

    (4) 加上连接词 ∃x ∀x 后仍是合式公式。

    P(x) ∧ Q(y) A(P)(W)


    谓词逻辑中的蕴涵式和产生式规则的基本形式相同，是其特殊情况：

    (1) 谓词逻辑表示精确的知识，而产生式规则不仅可以表示精确知识，也可以表示不精确的，例后跟可信度；

    (2) 在推理匹配过程中，产生式规则可进行不精确匹配。'
