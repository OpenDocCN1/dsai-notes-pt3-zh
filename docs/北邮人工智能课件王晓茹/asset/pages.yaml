    | 107 | 1 | 119 | 1 | 128 | 2 |

    | 108 | 2 | 120 | 2 | 129 | 1 |

    | 110 | 1 | 121 | 1 | 130 | 1 |

    | 112 | 2 | 122 | 4 | 131 | 1 |

    | 113 | 1 | 123 | 4 | 133 | 2 |

    | 114 | 1 | 124 | 3 | 134 | 2 |

    | 115 | 1 | 125 | 2 | 135 | 1 |

    | 117 | 3 | 126 | 2 | 137 | 1 |

    | 118 | 3 | 127 | 3 | 139 | 2 |


    # 组距分组


    +   - 组距分组方法分为：

    +     - 等距分组

    +     - 异距分组

    +   - 特点：

    +     - 将变量值的一个区间作为一组

    +     - 适合于连续变量

    +     - 适合于变量值较多的情况

    +     - 必须遵循“不重不漏”的原则

    +     - 可采用等距分组，也可采用不等距分组'
