  md: '# 第二章 知识表示和组织


    +   - 知识基本内容

    +   - 知识表达方法

    +   - 知识的组织与管理


    ![](img/806dfb586cd1a39120c0a828715591b9_85_0.png)


    # 二 知识的层次


    对不同的知识学习和理解的难易程度不同；


    +   1 事实：知识的最底层，对事、符号事件之间的各种关系。

    +   2 概念：关于具有相同属性的、对象、事件和符号的知识。

    +   3 规则：一组操作步骤，用于完成某一个目标、解决某一问题或产生某种结果；

    +   4 启发式知识：

    +   是知识的最高层，是基于规则的知识，是事实、概念和规则的综合


    # 四 知识的表示方法


    # 2.1 知识及其特性


    # 数据和信息、知识


    数据：包括事实和数字，未经加工的事件和符号。


    信息：从数据中提取出来的有关信息，经过各种处理的数据形成信息。数据是信息的载体和表示，信息是数据在特定条件下的具体表现。


    知识：


    > Fischer(1987)：知识是可被存储的信息，被人用于解释、预测和控制。

    > Pasaye, Chignell(1988)：允许人们进行决策的，有关那部信息。

    > 对：

    > 是有关系关联到一起形成的信息集合，或某些或某种事件中事物之间的关系。


    # 知识的特性


    +   客观性：

    +   相对正确性：

    +   一定条件、时间、环境。

    +   进化性：

    +   依赖性：或个体体的知识是没有的。

    +   不确定性：

    +   信息和知识的模糊性、模糊性、不完全性。

    +   经验性：

    +   可表示性；

    +   可利用性；

    +   可重用性；

    +   共享性。


    # 三 知识的分类


    +   1 作用范围：常规性和领域性知识；

    +   2 作用及表现：

    +   静态性知识

    +   动态性知识

    +   控制性知识

    +   3 确定性、确定性知识、不确定性知识

    +   4 结构和表现形式：逻辑性知识、形象性知识

    +   5 其他：领域知识、元知识


    # 总之：


    知识表示是如何将已获得的有关知识以计算机内部代码形式加以合理地描述、存储、有效地利用。


    # 1 知识表示的定义：


    知识表示研究用机器表示知识的可行性、有效性的一类方法。

    知识表示是智能推理的部分理论；

    知识表示是有效计算的数据体。

    知识表示是交流的媒介（如计算机网络）；

    知识表示是对知识的一种描述，是一种机器可以接受的用于描述知识的数据结构；'
