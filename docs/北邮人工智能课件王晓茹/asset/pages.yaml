- pgno: 57
  md: "# 核函数\n\n+   - 线性分类器，只能对线性可分的样本做处理。\n+   - 如果提供的样本线性不可分，结果很简单，线性分类器的求解程序会无限循环，永远也解不出来。\n\
    +   - 这使得它的适用范围大大缩小，而它的很多优点我们实在不愿意放弃，怎么办呢？\n+   - 是否有某种方法，让线性不可分的数据变得线性可分呢？\n\n\
    # 一个线性不可分的例子\n\n+   - 横轴上端点a和b之间红色部分里的所有点定为正类，两边的黑色部分里的点定为负类，试问能否找到一个线性函数把两类数据重新分开？\n\
    +   - 不能，因为二维空间里的线性函数就是指直线，显然找不到符合条件的直线。\n\n# 核函数：升维后的线性可分\n\n通过点在这条曲线的上方还是下方就可以判断点所属的类别，即一条二次曲线：\
    \ g(x)=c0+c1x+c2x²\n\n# 核函数：升维后的线性可分\n\n解决线性不可分问题的根本思路——\n- 向高维空间转化，使其变得线性可分。\n\
    - 找到映射到高维的方法\n\ng(x)=<w,x>+b f(x)=<w,x> g(x)=f(y)=a y\n\n# 核函数：升维后的线性可分\n\ng(x)=c0+c1x+c2x²\
    \ f(y)=<a,y> g(x)=f(y)=a y\n\n+   - 一个文本分类的例子来看这种高维空间映射从而分类的方法：\n+     - 文本与类别间的原始空间是1000维的（即你要分类的文档被表示为一个1000维的向量），在这1000维空间上线性是不可分的。现在我们有一个2000维空间的映射函数。\n\
    +   - 它能够把原向量变换得可以分。假设其中w是R2000维的向量，w是定值，而x是变量。\n+   - 现在输入是一个1000维的向量x，分类的过程是先把x变换到2000维的向量，然后求这个变换后的向量与向量w的内积，再把这个内积的恒值b相加，就得到了结果，若结果大于阈值还是小于阈值就得到了分类结果。\n\
    \n我们其实关心那个高维空间里内积的值，那个值算出来——分类结果就算出来了\n\n+   - 是否能有这样一种函数K(w,x),他接受低维空间的输入值，却能算出高维空间的内积值<w,x>?\
    \ \n+   - g(x)=K(w,x)+b \n+     - 低维空间下将x输入到K核函数中，得得到与f(x)一样的值 f(x)=<w,x>+b\n\n\
    原始的经拉格朗日分解的线性分类器 f(x')=∑_{i=1}^{n} α_i y_i <x_i', x'> + b\n\n利用核函数，求向量内积 g(x)=∑_{i=1}^{n}\
    \ α_i y_i K(x_i, x) + b\n\n# 核函数:核函数的基本作用就是接受两个低维空间里的向量，能够计算出经过某个变换后在高维空间里的向量内积值\n\
    \n# 两个问题：\n\n+   1. 既然有很多的核函数，针对具体问题该怎么选择？\n+   2. 如果使用核函数向高维空间映射后，问题仍然是线性不可分的，那怎么办？"
