  md: "# 梯度法的收敛速度\n\n梯度法的收敛速度，虽然依赖于梯度下降的步幅（上例中 η=0.1）以及收敛结果的判断方法（上例中 norm(t−t0)<0.000001），但一般都会合理地逐渐逼近最优解，这意味着梯度法能够得到一定程度的提高。\n\
