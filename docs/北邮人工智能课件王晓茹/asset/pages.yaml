  md: '# 4 α-β 剪枝技术


    基本思想：根据倒推值的计算方法，或取中大、与中取小，在扩展和计算过程中，能剪掉不必要的分枝，提高效率。


    定义：

    α值：有或后继节点，取当前节点中子节点中的最大倒推值为其下界，称α为上界，节点倒推值：αi；

    β值：有与后继节点，取当前节点中子节点中的最小倒推值为其上界，称β为下界，节点倒推值：βi；


    # α-β 剪枝：


    +   (1) β剪枝：节点x的倒推值不能低于其父节点的β值，x以下的分支可常理剪掉，倒推值可直接返回；

    +   (2) α 剪枝：节点x的倒推值不能高于其父节点的α值，x以下的分支可常理剪掉，x的倒推值可返回；


    ![](img/806dfb586cd1a39120c0a828715591b9_96_0.png)


    ![](img/806dfb586cd1a39120c0a828715591b9_96_1.png)


    # 3.4 归结/消解演绎推理


    # 一 逻辑推理


    # 1 方式：


    +   (1) 演绎推理：从一般到个别；

    +   最典型，三段论；

    +   (2) 归纳推理：从个别到一般，从多个特例中归纳出一般性结论；

    +   (3) 假设推理：如知不完全的情况下，默认某一条件/事实成立，使之推理；


    # 2 控制策略：


    +   (1) 正向推理；

    +   (2) 反向推理


    混合推理；

    双向推理；


    # 3 模式匹配：再如“知识”模式则调用公式、规则、语义网络”比较、完全一致或部分一致，将可匹配；

    是推理中的重要过程。


    # 二 置换与合一


    # 1 置换：


    项对元素的替换，用变量，常量或函数来替换变量。目的是使两个公式一致。


    例：

    P (x, f(y), B)  S1≡{z/x, w/y}

    P (x, f(y), B) S1= P (z, f(w), B)


    # 2 合一：


    +   (1) 完备：公式F={F1, F2, ..., Fn}，若存在一个置换θ使得：

    +   F1θ=F2θ=...=Fnθ，称找到的一个θ，F1, F2, ..., Fn可合一。

    +   例：F={P(x,y), f(y), P(a, g(x), z)}

    +   λ={g(a)/y, a/x, f(g(x))/z}

    +   (2) 最一般合一：

    +   S为F的合一，若为其合一，若存在一置换S''，存在一置换S''，有：

    +   S = S''θ FS = (Fg) S''，

    +   称S为其最一般合一。

    +   (3) 失败：从公式各中取对应的一对不一致符号构成的集合D。

    +   例：F={P(x,y,z), P(x,z, h(b))}

    +   {y, f(x), (z, h(b))}


    置换复合：

    θ={u1/x1, u2/x2, ..., un/xn}

    λ={v1/y1, v2/y2, ..., vm/ym}

    θ λ={t1/x1, t2/x2, ..., tn/xn, u1/y1, u2/y2, ..., um/ym}

    其中

    制法如下两条公式：

    t1 λ/xi  当t1 λ xi

    ui/y i  当yi∈{x1,x2...xn}

    置换复合，而不满足：

    (PS1) S2 = P S1 S2

    (S1 S2) S3 = S1 (S2 S3)

    S1 S2≠S2 S1

    例：θ={f(y)/x, x/z}

    λ={a/x, b/y, c/z}

    θ λ={f(b)/x, y/z, a/z, b/y, c/z}


    # (4)求最一般合一算法：


    思想：从一个对应差异集合开始，寻求求对变量的置换。


    +   (a) k=0, Fk= Gk, θk={};

    +   (b) 若各公式表示式一致，则算法停止，θk为最一般合一；

    +   (c) 找出其差异集合Dk；

    +   (d) 若Dk中存在变量a1, t1, 其中t1为项，a1为变量，且a1不在t1中出现，则：

    +   θk+1 = θk, {t1/a1}, Fk+1 = Fk{θk/a1}

    +   k=k+1,转(b)；

    +   (e) 递归终止，F最一般合一不存在。'
