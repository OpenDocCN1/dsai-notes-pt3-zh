    # 2.1.1 Attribute Values 属性值


    +   - 属性值是分配给属性的数字或符号

    +   - 属性和属性值之间的区别

    +   - 同一属性可以映射到不同的属性值

    +   - 示例：高度可以用英尺或米为单位测量


    # Measurement scale 测量标度


    测量标度是将数值或符号值与对象的属性相关联的规则（函数）

    测量过程是使用测量标度将一个值（符号值或数值）与一个特定对象的特定属性相关联的过程。


