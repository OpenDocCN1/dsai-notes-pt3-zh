    $$g''(z)=\frac{d}{dz}\frac{1}{1+e^{-z}}=\frac{1}{(1+e^{-z})^2}(e^{-z})=\frac{1}{1+e^{-z}}\left(1-\frac{1}{1+e^{-z}}\right)=g(z)(1-g(z)).$$


    # 分类问题


    ![](img/806dfb586cd1a39120c0a828715591b9_6_0.png)


    # 线性决策边界


    对于硬性边界的情况，边界形式如下：

    $$\theta_0+\theta_1x_1+\cdots+\theta_nx_n=\sum_{i=0}^{n}\theta_ix_i$$

    构造预测函数：

    $$h_\theta(x)=g(\theta^Tx)=\frac{1}{1+e^{-\theta^Tx}}$$

    函数 $h_\theta(x)$ 的值有两种含义，它表示给定观测的概率。因此对于输入的分类情况分别为：

    $$P(y=1|x;\theta)=h_\theta(x)$$

    $$P(y=0|x;\theta)=1-h_\theta(x)$$


    ![](img/806dfb586cd1a39120c0a828715591b9_6_1.png)


    Logit函数与标签如下，它们是基于最大似然估计得到的。

    $$Cost(h_\theta(x),y)=\begin{cases}-\log(h_\theta(x)),&y=1\\-\log(1-h_\theta(x)),&y=0\end{cases}$$

    $$J(\theta)=-\frac{1}{m}\sum_{i=1}^{m}\left[y^{(i)}\log h_\theta(x^{(i)})+(1-y^{(i)})\log(1-h_\theta(x^{(i)}))\right]$$


    ![](img/806dfb586cd1a39120c0a828715591b9_6_2.png)


    # 梯度下降


    梯度下降算法：

    同时更新

    $$\theta_j:=\theta_j-\alpha\frac{\partial}{\partial\theta_j}J(\theta)$$


    ![](img/806dfb586cd1a39120c0a828715591b9_6_3.png)


    # 正则化Regularization


    过拟合问题

    对于线性回归问题，可能会有拟合程度过高，导致模型复杂度过高，容易过拟合。正则化可以通过惩罚模型复杂度来降低过拟合风险。


    ![](img/806dfb586cd1a39120c0a828715591b9_6_4.png)


    # 正则化Regularization


    +   - 问题的主要：过拟合问题特征过多的特征。

    +   - 解决方法

    +     - 1）减少特征数量（减少特征会失去一些信息，即使特征选择的很好）

    +       - 可用人工选择保留的特征；

    +       - 模型选择算法；

    +     - 2）正则化（特征较多时比较有效）

    +       - 保留所有特征，但减小参数的大小。


    # 正则化方法


    正则化是通过惩罚模型复杂度的实现，是在经验风险上加一个正则化项或惩罚项，让模型更加简单。常用的正则化方法包括岭回归、Lasso回归等。


    ![](img/806dfb586cd1a39120c0a828715591b9_6_5.png)'
