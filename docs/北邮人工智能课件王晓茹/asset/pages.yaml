    \   - 本章将介绍能够控制模型复杂程度的、带有约束条件的最小二乘学习方法。\n\n![](img/806dfb586cd1a39120c0a828715591b9_10_0.png)\n\
    \n# 4.1 部分空间约束的最小二乘学习法\n\n在有参数的线性模型\n\nf(x)=∑ᵢ₌₁ᵈ θᵢφᵢ(x)=θᵀφ(x)\n\n的一般最小二乘学习中，因为参数{θᵢ}ᵢ₌₁ᵈ可以自由设定，所以使用的是完全参数空间，如上图4.2a。本节将介绍的部分空间约束的最小二乘法，则是通过把参数空间限制在一定范围内，防止过拟合现象。\n\
    \n# 4.1 部分空间约束的最小二乘学习法\n\n在这里，是满足Pθ=Pθᵀ=Pθ的约束条件，表示的是矩阵P的值域R(P)的正交投影矩阵。通过对θ作这样的约束条件，来限制θ不会被限制在值域R(P)的范围外。\n\
    \n带分空间约束的最小二乘学习法的解，一般是通过求解一个二次学习法的对偶问题得到。其解为：\n\nθ̂=(ΦP)†y\n\n# 4.1 部分空间约束的最小二乘学习法\n\
    \n![](img/806dfb586cd1a39120c0a828715591b9_10_1.png)\n\n线性模型的最小二乘学习法的精确实例（降噪参数的例子），使用了三条参数式φᵢ(x)（i=1,\
