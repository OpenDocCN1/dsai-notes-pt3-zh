  md: '# 误分次数与几何间隔


    +   - 误分次数：代表分类器的误差。误分次数的上界由几何间隔决定！

    +   - 几何间隔越大时，它的误差上界越小。

    +   - 因此最大化几何间隔成为了我们训练阶段的目标。


    误分次数 ≤ (2R / δ)²


    - δ是样本集到分类面的间隔；

    - R=max{||x_i||} i=1...n,即R是所有样本中|x_i|是以原点为中心的样本不...而样本的分布有多么广


    # 线性分类器的求解——问题的描述 Part2


    +   - 一般地，一个求最小值的问题就是一个优化问题（也叫最小问题，或规划——Programming），它同样由两部分组成，目标函数和约束条件（函数C），可以用下面的式子表示：


    min f(x)

    subject to c_i(x) ≤ 0 i=1,2,...p

    c_j(x)=0 j=p+1,p+2,...p+q


    基于可行域的寻最优解


    # 线性分类器的求解


    # 更严格的SVM中的求解定义


    # 最大化集合间隔：寻找最小的||w||


    δ_{M} = 1/||w|| |g(x)|


    min ||w||    min 1/2 ||w||²


    min 1/2 ||w||²

    subject to y_i(w·x_i)+b-1 ≥0 i=1,2,...D Q是样本数


    基于可行域的寻最优解


    # 支持向量


    +   - 支持向量：可行域上的边界点

    +   - 凸集：一个点的集合，其中任意两个点连一条直线，这条线上的点仍然在这个集合内部。

    +   - 二次规划：能够找到最优解的规划

    +   - 变量是w，而目标函数是w的二次式，所有的约束条件都是w的线性函数和这个是一个二次规划的例子。

    +   - 由它的可行域是一个凸集，所以它是一个二次规划。


    min 1/2 ||w||²

    subject to y_i[(w·x_i)+b]-1 ≥0 i=1,2,...D Q是样本数


    # 求解W


    +   - 样本确定了w。用数学的语言描述，就是w可以表示为样本的某种组合：

    +   - w=α₁x₁+α₂x₂+...+αₙxₙ

    +   - α被称作拉格朗日乘子

    +   - α_i x_i 表示系数和向量的乘积

    +   - g(x)的表达式严格的形式应该是 g(x)=<w,x>+b


    g(x)=<w,x>+b

    ≤ Σ_i (α_i y_i x_i),x>+b


    - x是变量，即待分类的文档，而x_i是已知的样本。

    - 注意到式子中只有w和x是向量，因此，得到g(x)的式子为：


    g(x)= Σ_i α_i y_i <x_i,x> + b （式2）


    ![](img/806dfb586cd1a39120c0a828715591b9_56_0.png)


    ![](img/806dfb586cd1a39120c0a828715591b9_56_1.png)'
