  md: '# 定序数据的整理与显示


    +   - 主要指标：

    +     - 累计频数：对各类别的频数逐级累加

    +     - 累计频率：将各类别的频率自下而上逐级累加


    例如，在某城市住房调查中，调查人员对居民住房满意度的三个等级分别调查了300户，其中一个问题是："你对家庭住房是否满意？"，其答案是满意的在居民中是如何分布的？

