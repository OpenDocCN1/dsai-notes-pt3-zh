    +   - 如何由两类分类器得到多类分类器，就是一个值得研究的问题。


    多个超平面把空间划分为多个区域，每个区域划分为一个类，给出文本，若它落在某区域就知道它的类。


    ？只是这种方法就很难普及在现实上，因为一次性的算法计算量实在太大，大到无法使用地步。


