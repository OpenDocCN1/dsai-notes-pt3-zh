  md: "# Weaker Classifiers\n\n$h_1(x)\\in\\{-1,+1\\}$  \n$h_2(x)\\in\\{-1,+1\\}$\
    \  \n$\\cdots$  \n$h_T(x)\\in\\{-1,+1\\}$\n\nweak classifiers\n\nslightly better\
    \ than random\n\n+   - Each weak classifier learns by considering one simple feature.\n\
    +   - Most beneficial features for classification should be selected.\n+   - How\
    \ to:\n+     - define features?\n+     - select beneficial features?\n+     -\
    \ train weak classifiers?\n+     - manage (weight) training samples?\n+     -\
    \ associate weight to each weak classifier?\n\n# The Strong Classifiers\n\n$h_1(x)\\\
    in\\{-1,+1\\}$  \n$h_2(x)\\in\\{-1,+1\\}$  \n$\\cdots$  \n$h_T(x)\\in\\{-1,+1\\\
    }$\n\nweak classifiers\n\nslightly better than random\n\nHow good the strong one\
    \ will be?\n\n$H_T(x)=\\operatorname{sign}\\left[\\sum_{t=1}^{T}\\alpha_t h_t(x)\\\
    right]$\n\nstrong classifier\n\n# AdaBoost & Its Applications\n\nThe AdaBoost\n\
    Algorithm\n\n1995年Freund提出AdaBoost算法，1999年Schapire在一篇会议论文上对Freund的AdaBoost重新表述，基本原理不变但更易理解，下面以Schapire的版本介绍AdaBoost。\n\
    \n# The AdaBoost Algorithm\n\nGiven: $(x_1,y_1),\\ldots,(x_m,y_m)$ where $x_i\\\
    in X,y_i\\in\\{-1,+1\\}$\n\nInitialization: $D_1(i)=1/m,\\ i=1,\\ldots,m$\n\n\
    For $t=1,\\ldots,T$:\n\n- Find classifier $h_t:X\\rightarrow\\{-1,+1\\}$ which\
    \ minimizes error with respect to $D_t$, i.e. $h_t=\\arg\\min_h\\sum_iD_t(i)\\\
    mathbb{I}[h(x_i)\\ne y_i]$.\n- Weight classifier: $\\alpha_t=\\frac{1}{2}\\ln\\\
    frac{1-\\epsilon_t}{\\epsilon_t}$\n- Update distribution: $D_{t+1}(i)=\\frac{D_t(i)\\\
    exp(-\\alpha_t y_i h_t(x_i))}{Z_t}$, where $Z_t$ is for normalization.\n\nOutput\
    \ final classifier: $\\operatorname{sign}[\\sum_{t=1}^{T}\\alpha_t h_t(x)]$\n\n\
    Freund 等在 1995 年提出了 Discrete AdaBoost 算法，其具体算法如下：\n1. 对于训练样本 $(x_i,y_i)$，初始化权重\
    \ $D_1(i)=1/m$。\n2. 初始化弱分类器 $h_t(x)$。\n3. 对于 $t=1,\\ldots,T$：\n   - 训练弱分类器 $h_t$，使其在当前权重分布下的分类误差最小。\n\
    \   - 计算分类器权重 $\\alpha_t=\\frac{1}{2}\\ln\\frac{1-\\epsilon_t}{\\epsilon_t}$。\n\
    \   - 更新样本权重 $D_{t+1}(i)=\\frac{D_t(i)\\exp(-\\alpha_t y_i h_t(x_i))}{Z_t}$。\n\
    4. 最终得到分类器 $H(x)=\\operatorname{sign}[\\sum_{t=1}^{T}\\alpha_t h_t(x)]$。\n\n#\
    \ Schapire AdaBoost Algorithm\n\n```\nGiven: m examples $(x_1,y_1),\\ldots,(x_m,y_m)$\
    \ where $x_i\\in X,y_i\\in\\{-1,+1\\}$\nInitialize $D_1(i)=1/m$\nFor $t=1$ to\
    \ $T$\n  1. Train learner $h_t$ with error $\\epsilon_t=\\Pr_{x\\sim D_t}[h_t(x)\\\
    ne y]$\n  2. Compute the hypothesis weight $\\alpha_t=\\frac{1}{2}\\ln\\left(\\\
    frac{1-\\epsilon_t}{\\epsilon_t}\\right)$\n  3. For each example $(x_i,y_i)$:\n\
    \     $D_{t+1}(i)=\\frac{D_t(i)}{Z_t}\\exp(-\\alpha_t y_i h_t(x_i))$\nOutput:\
    \ $H(x)=\\operatorname{sign}\\left(\\sum_t\\alpha_t h_t(x)\\right)$\n```\n\n#\
    \ The AdaBoost Algorithm\n\nGiven: $(x_1,y_1),\\ldots,(x_m,y_m)$ where $x_i\\\
    in X,y_i\\in\\{-1,+1\\}$\n\nInitialization: $D_1(i)=1/m,\\ i=1,\\ldots,m$\n\n\
    For $t=1,\\ldots,T$:\n\n- Find classifier $h_t:X\\rightarrow\\{-1,+1\\}$ which\
    \ minimizes error with respect to $D_t$.\n- Weight classifier: $\\alpha_t=\\frac{1}{2}\\\
    ln\\frac{1-\\epsilon_t}{\\epsilon_t}$\n- Update distribution: $D_{t+1}(i)=\\frac{D_t(i)\\\
    exp(-\\alpha_t y_i h_t(x_i))}{Z_t}$\n\nOutput final classifier: $\\operatorname{sign}[\\\
    sum_{t=1}^{T}\\alpha_t h_t(x)]$"
