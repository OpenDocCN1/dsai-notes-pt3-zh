- pgno: 24
  md: "# ## 组距分组的步骤\n\n+   1. 确定组数：组数的确定可以根据数据的分布特点和规律为目的。在实际分组时，可以按 Sturges 提出的经验公式来确定组数：\n\
    +   \n+   $$K=1+\\frac{\\lg(n)}{\\lg(2)}$$\n+   \n+   2. 确定各组的组距：组距（Class Width）是一个组的上限与下限之差，可根据全部数据的最大值和最小值及所分的组数来确定，即\n\
    +   \n+   **组距 =（最大值－最小值）÷ 组数**\n+   \n+   3. 根据分组整理成频数分布表\n\n# ## 组距分组的几个概念\n\
    \n+   - 下限：一个组的最小值\n+   - 上限：一个组的最大值\n+   - 组距：上限与下限之差\n+   - 组中值：下限与上限之间的中点\n\
    \n$$\\text{组中值}=\\frac{\\text{下限值}+\\text{上限值}}{2}$$\n\n# ## 等距分组表（上下组限重叠）\n\n\
    | 某年间50名工人日加工零件数分组表 |  |  |\n|---|---:|---:|\n| 接零件数分组 | 频数（人） | 频率（%） |\n| 105~110\
    \ | 3 | 6 |\n| 110~115 | 5 | 10 |\n| 115~120 | 8 | 16 |\n| 120~125 | 14 | 28 |\n\
    | 125~130 | 10 | 20 |\n| 130~135 | 6 | 12 |\n| 135~140 | 4 | 8 |\n| 合计 | 50 |\
    \ 100 |\n\n# ## 等距分组表（上下组限间断）\n\n| 某年间50名工人日加工零件数分组表 |  |  |\n|---|---:|---:|\n\
    | 接零件数分组 | 频数（人） | 频率（%） |\n| 105~109 | 3 | 6 |\n| 110~114 | 5 | 10 |\n| 115~119\
    \ | 8 | 16 |\n| 120~124 | 14 | 28 |\n| 125~129 | 10 | 20 |\n| 130~134 | 6 | 12\
    \ |\n| 135~139 | 4 | 8 |\n| 合计 | 50 | 100 |\n\n# ## 等距分组表（使用开口组）\n\n| 某年间50名工人日加工零件数分组表\
    \ |  |  |\n|---|---:|---:|\n| 接零件数分组 | 频数（人） | 频率（%） |\n| 110以下 | 3 | 6 |\n| 110~114\
    \ | 5 | 10 |\n| 115~119 | 8 | 16 |\n| 120~124 | 14 | 28 |\n| 125~129 | 10 | 20\
    \ |\n| 130~134 | 6 | 12 |\n| 135以上 | 4 | 8 |\n| 合计 | 50 | 100 |\n\n# ## 组距分组与异距分组\n\
    \n+   - **等距分组**\n+     - 由于各组组距相同，各组频数的分布不受组距大小的影响\n+     - 可直接根据绝对频数来观察频数分布的特征和规律\n\
    +   - **异距分组**\n+     - 各组组数的分布受组距大小不同的影响\n+     - 各组绝对频数的多少不能反映频数分布的实际状况\n+ \
    \    - 需要用频数密度（频数密度=频数/组距）反映频数分布的实际状况\n\n# ## 数值型数据的显示\n\n+   - 分组数据的显示\n+   -\
    \ 原始数据的显示\n+   - 时间序列数据的显示\n+   - 多变量数据的显示\n\n# ## 分组数据的显示——直方图\n\n+   - 用矩形的宽度和高度来表示频数分布的图形，实际上是用矩形的“面积”来表示各组的频数分布\n\
    +   - 在直角坐标中，用横轴表示数据分组，纵轴表示频数或频率，各组与相应的频数就形成了一个矩形，即直方图（Histogram）\n+   - 直方图下的总面积等于1"
