  md: '# 四 特点


    # 1. 优长：


    联想性，体现联想思维结构；

    自然性，表现问题直观，利于理解；

    结构性，结构化的知识表示方式。


    # 2. 缺点：


    非严格性，无统一公认的形式表示体系；

    处理复杂性；

    对时间相关知识、深层知识或与时间相关动态知识不善于表达。


    # 2 框架网络


    +   (1) 框架间联系：

    +   框架中值域和槽值是另一个框架的名字，例如教师框架、

    +   作业框架、工作框架等之间的调用。

    +   (2) 纵向联系：

    +   用继承来建立纵向联系，下层框架可以继承上层框架的值。

    +   例如教授工作框架和数学教师框架之间。


    如果咳嗽、发烧目流涕/或鼻塞是感冒。

    需要服用感冒清，一日三次，每次2~3粒，多喝开水。


    # 2.7 框架表示法


    # 一 构成


    +   1. 框架提供一种结构和组织，描述一种格式相对固定的语义网络的节点和槽。

    +   以框架作为基本单位，语义网络可看作框架集合。

    +   2 构成：

    +   框架名

    +   槽

