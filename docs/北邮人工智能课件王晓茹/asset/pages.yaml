    # **#结构派**：（神经计算、 生理学派、 连接主义）


    网络连接为主的联结主义；


    主要观点：

    智能活动的基元是神经细胞；

    智能活动过程是神经网络的状态演化过程；

    智能活动的基础是神经细胞的突触联结机制；

    智能系统的工作模式是模仿人脑模式。


    +   主要特征：

    +   1、通过神经元之间的并行协同作用实现信息处理，具有并行性、动态性、全局性。

    +   2、通过神经元间分布式的物理联接存储信息。联想记忆、容错性。

    +   3、通过神经元间连接强度的动态调整实现自学习和自适应功能。

