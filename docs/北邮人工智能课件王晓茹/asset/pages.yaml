    # 2.3.1 Aggregation 聚集


    也许是多，聚集将两个或多个对象合并成单个对象


    +   Purpose

    +   - Data reduction

    +     - Reduce the number of attributes or objects

    +   - Change of scale

    +     - Cities aggregated into regions, states, countries, etc

    +   - More "stable" data

    +     - Aggregated data tends to have less variability

    +   Drawback

    +   - Missing valuale information


    # Aggregation


    Variation of Precipitation in Australia


    ![](img/806dfb586cd1a39120c0a828715591b9_36_0.png)


    # 2.3.2 Sampling 抽样


    Sampling 是一种选择数据对象子集进行分析的常用方法。


    Statisticians sample because obtaining the entire set of data of interest is too
    expensive or time consuming.


    Sampling is used in data mining because processing the entire set of data of interest
    is too expensive or time consuming.


    # Sampling ...


    The key principle for effective sampling is the following:


    +   - 如果样本具有代表性，则使用样本与使用整个数据集的效果几乎相同。

    +   - 样本具有代表性，前提是它似乎具有与原有数据集相同的（感兴趣）的性质。


    # 1. Types of Sampling


    +   Simple Random Sampling 简单随机抽样

    +   - 选取任何特定项的概率相同

    +   Sampling without replacement 无放回抽样

    +   - As each item is selected, it is removed from the population

    +   Sampling with replacement 有放回抽样

    +   - Objects are not removed from the population as they are selected for the
    sample.

    +     - In sampling with replacement, the same object can be picked up more than
    once

    +   Stratified sampling 分层抽样

    +   - 当总体由不同的对象组成，某些类型的对象稀缺或极其重要时，简单随机抽样就不能充分代表无放回抽样的相关类别。

    +   - Split the data into several partitions; then draw random samples from each
    partition


