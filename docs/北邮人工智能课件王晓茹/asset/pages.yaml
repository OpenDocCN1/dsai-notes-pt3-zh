    # 2.2 Data Quality


    数据被收集用的数据常常为其相互追踪收集，或是在收集时未同时收集的，因此，数据被收集不完全。

    “数据质量”是指数据收集、统计学的实际设计或潜在在各种数据收集过程。

    由于无法重新收集数据，因此数据收集局限于两个方面：

    (1) 识别和纠正错误的数据和通常称作数据清理 (data cleaning)。

    (2) 使用可以容忍数据错误的方法。'
