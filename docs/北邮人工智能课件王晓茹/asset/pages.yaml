  md: '# 3.7 与或形演绎推理


    已知事实、规则，求取目标；

    正向推理：从事实状况向目标动作进行操作；

    逆向推理：从目标向事实状况进行操作。


    # 一 与或形式问推理


    +   1. 事实表达式与或形式变换

    +      在系统中，将事实转化为与或形。

    +      步骤：

    +      （1）消去蕴涵；

    +      （2）减少否定连域；

    +      （3）量词变换，存在量词；

    +      （4）主要含取或的变量不同名；

    +      （5）删去全称量词。


    ![](img/806dfb586cd1a39120c0a828715591b9_100_0.png)


    读假子句：

    Q(z,a)

    ¬S(x,y) ∨ ¬R(y)

    ¬S(x,y) ∨ ¬P(y)


    # 5 推理过程


    +   （1）将事实转换成与或树的形式；

    +   （2）将F规则运用到与或树上：将L与其能合一的叶节点相匹配，扩展与或树，将L作为新的节点扩展；

    +   （3）重复（2），直到产生一个含有以目标节点为叶节点的一致解图。


    例：

    已知事实：~P(a) ∨ (Q(a) ∧ R(a))

    F规则：r1: ~P(x) → ~S(x)

    　　　r2: Q(y) → N(y)

    求证：~S(a) ∨ N(a)


    例：公司招聘

    （1）P(A) ∨ P(B) ∨ P(C)

    （2）P(A) ∧ ¬P(B) → P(C)　　 P(A) → P(B) ∨ P(C)

    （3）P(B) → P(C)


    ![](img/806dfb586cd1a39120c0a828715591b9_100_1.png)


    例：

    ∃x ∀y { Q(y,x) ∧ ¬ [ (R(y) ∨ P(y)) ∧ S(x,y) ] }

    变换为：

    Q(z,a) ∧ { ¬R(y) ∨ ¬P(y) ∨ ¬S(a,y) }


    # 2 与或图表示事实表达式


    # （1）方法


    +   析取：用K线连接符来分解析取式，连接到父节点；

    +   合取：单线连接符连接到父节点上；

    +   性质：读取叶节点上的析取，可以构成表达式的子句集。


    # 3 与或图的F规则变换


    在正向推理中，把允许作用规则推理的公式类型限制为：　　　　L → W

    其中L是单文字，W为与或形的公式，而且规则中都为全称量化了整个蕴涵式。


    +   F规则变换步骤：

    +   （1）消去蕴涵；

    +   （2）减少否定连域；

    +   （3）量词变换，存在量词；

    +   （4）删去全称量词；

    +   （5）再转换为蕴涵的形式。


    # 4 目标公式：


    转换为子句的形式。


    读假子句：

    ~S(a) ∨ N(a)

    ~S(a) ∨ R(a)


    ![](img/806dfb586cd1a39120c0a828715591b9_100_2.png)


    r1: ~P(x) → ~S(x)

    r2: Q(y) → N(y)


    # 一 与或形逆向推理


    # 1 目标表达式的与或形


    与正向推理的事实变换类似，有一点区别：

    用斯柯林函数消去存在量词中的全称量词，并使各主要析取式具有不同元。

    例：∃y∀x { Q(y,x) ∨ ¬ [ (R(y) ∧ P(y)) ∨ S(x,y) ] }

    变换为：

    Q(z,f(z)) ∨ { ¬R(y) ∨ ¬P(y) ∨ ¬S(f(y), y) }


    # 2 目标表达式与或图表示


    +   合取：用K线连接符来分解合取式，连接到父节点；

    +   析取：单线连接符连接到父节点上。'
