- pgno: 22
  md: '# 3. 定类数据的整理与显示


    +   - 基本过程：

    +     - 列出各类别

    +     - 计算各类别的频数

    +     - 制作频数分布表

    +     - 用图形显示数据

    +   - 主要指标：

    +     - 频数：落在各类别中的数据个数

    +     - 比例：某一类别数据占全部数据的比值

    +     - 比率：不同类别数值的比值

    +     - 百分比：将对比的基数作为100而计算的比值


    # 定类数据的显示——频数分布表


    +   - 例：为研究广告市场的状况，一家广告公司在某城市随机抽取200人就广告问题做了邮寄问卷调查，其中的一个问题是“您比较关心下列哪一类广告？”

    +   - 1. 商品广告；2. 服务广告；3. 金融广告；4. 房地产广告；5. 招生招聘广告；6. 其他广告。


    | 广告类型 | 人数（人） | 比例 | 频率（%） |

    |---|---:|---:|---:|

    | 商品广告 | 112 | 0.560 | 56.0 |

    | 服务广告 | 51 | 0.255 | 25.5 |

    | 金融广告 | 9 | 0.045 | 4.5 |

    | 房地产广告 | 16 | 0.080 | 8.0 |

    | 招生招聘广告 | 10 | 0.050 | 5.0 |

    | 其他广告 | 2 | 0.010 | 1.0 |

    | 合计 | 200 | 1 | 100 |


    # 定类数据的显示——条形图


    +   - 条形图是用宽度相同的条形的高度或长短来表示数据变动的图形

    +   - 在表示定类数据的分布时，是用条形图的高度来表示各类类别数据的频数或频率

    +   - 绘制时，各类别可以放在纵轴，称为条形图，也可以放在横轴，称为柱形图


    # 定类数据的显示——条形图


    ![](img/806dfb586cd1a39120c0a828715591b9_22_0.png)


    # 定类数据的显示——柱形图（略）


    # 定类数据的显示——对比柱形图


    +   - 分类变量在不同时间或不同空间上有多个取值

    +   - 对比分类变量的取值在不同时间或不同空间上的差异或变化趋势


    ![](img/806dfb586cd1a39120c0a828715591b9_22_1.png)


    # 定类数据的显示——Pareto图


    按各类别数据出现的频数多少排序后绘制的柱形图


    ![](img/806dfb586cd1a39120c0a828715591b9_22_2.png)


    # 定类数据的显示——圆形图


    +   - 也称饼图，是用圆形及圆内扇形的面积来表示数值大小的图形

    +   - 主要用于表示总体中各组成部分所占的比例，对于研究结构性问题十分有用

    +   - 在绘制圆形图时，总体中各部分所占的百分比用圆内的各个扇形面积表示，这些扇形的中心角度，是按各部分百分比占360°的相应比例确定的

    +   - 例如，关注服务广告的人数占总人数的百分比为25.5%，那么其扇形的中心角度就应为360°×25.5%=91.8°，其余类推。'
