    甲城市家庭对住房状况评价的累计频数分布


    # 定序数据的显示—环形图


    +   - 环形图中间有一个“空洞”，总体中的每一部分数据用环中的一段表示

    +   - 环形图与圆形图类似，但又有区别

    +     - 圆形图只能显示一个总体各部分所占的比例

    +     - 环形图则可以同时绘制多个总体的数系系列，每一个总体的数系系列为一个环

    +   - 环形图可用于进行比较研究

    +   - 环形图可用于展示定类和定序的数据


    # 定序数据的显示—环形图


    ![](img/806dfb586cd1a39120c0a828715591b9_23_1.png)


    # 数值型数据的整理与显示


    +   - 按照研究需要，将原始经济数据按照某种标准划分成不同的组别，称为数据分组

    +   - 数据分组的方法：

    +     - 单变量值分组；将每一个变量值作为一组

    +     - 组距分组；将全部变量值依次划分为若干区间，并将这一区间的变量值作为一组


    # 单变量值分组


    +   - 将一个变量值作为一组

    +   - 适合于离散变量

    +   - 适合于变量值较少的情况

    +   - 例：某生产车间50名工人日加工零件数如下（单位：个）。试求用变量值对数据进行分组。

    +   117 122 124 129 107 139 117 130 122 125

    +   108 131 125 117 122 136 126 122 118 108

    +   110 118 123 126 133 134 127 123 118 112

    +   112 134 127 123 119 113 120 123 127 135

    +   137 114 120 128 124 115 139 128 124 121


    # 单变量值分组


    某车间50名工人日加工零件数分组表

