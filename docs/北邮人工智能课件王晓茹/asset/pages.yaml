    +       - (e.g., people decline to give their age and weight)

    +     - Attributes may not be applicable to all cases

    +       - (e.g., annual income is not applicable to children)

    +   - **Handling missing values**

    +     - Eliminate Data Objects

    +     - Estimate Missing Values

    +     - Ignore the Missing Value During Analysis

    +     - Replace with all possible values (weighted by their probabilities)


    # 如何处理缺失数据？


    为属性填上丢失的值：


    +   - 忽略元组

    +   - 人工填写缺失值

    +   - 使用一个全局常量填充缺失值

    +   - 使用属性的均值填充缺失值

    +   - 使用与给定元组属同一类的所有样本体属性均值

    +   - 使用最可能的值填充缺失值


    # 如何处理缺失数据？


    +   - **忽略元组**

    +     - 当缺失类标号时，通常这样做（假定挖掘任务涉及分类）。除非元组有多个属性缺少值，否则该方法不是很有效；

    +   - **人工填写缺失值**

    +     - 巫味费时费力且不可行


    # 如何处理缺失数据？


    +   - **自动填充**

    +     - 使用一个全局常量填充缺失值

    +       - 将缺失的属性值用同一个常数，如unknown, -∞, ∞。

    +       - 可能会形成一个新的class，这个新class具有相同的填充常数值。

    +     - 使用属性的均值填充缺失值

    +       - 例如用平均薪水值填写某个已知缺失的salary属性值；

    +     - 使用与给定元组属同一类的所有样本体属性均值

    +       - 先给元组分类，用不同类别的均值填充缺失的本类属性值；

    +     - 使用最可能的值填充缺失值

    +       - 基于推理的方法，如Bayes，回归，决策树等推理预测。


