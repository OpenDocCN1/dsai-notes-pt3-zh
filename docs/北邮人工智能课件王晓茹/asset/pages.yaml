  md: "# 问题引入\n\n假设有一个房屋销售的数据如下：\n\n| 面积(m²) | 销售价 | \n| 133 | 250 | \n| 150 | 520\
    \ | \n| 80 | 160 | \n| 102 | 220 |\n\n如果录入了一个新的面积值，很难在销售记录的记录表没有的情况下，如何处理？\n\n\
    解决方法：用一条直线去尽量地拟合这些数据，然后将有新的面积值进入表，我们可以在将拟合线上一个点对应的值返回。如果用一条直线去拟合，可能是下面的样子：\n\n\
    # 2.1 线性模型\n\n在上图中，θ1是截距项，θ2是斜率，f(x)=θ0+θ1x，...，θn是参数的个数。假设我们有m个训练样本，(x(i), y(i))，i=1,...,m。最小二乘法是求使代价函数J(θ)=1/(2m)∑(hθ(x(i))-y(i))²最小的θ。代价函数是凸函数。\n\
    \n# 2.1 线性模型\n\n在上述建模中，增加一个线性项的一般形式为：\n\nf(x)=∑θiφi(x)=Φ(x)\n\n解释说明：特征函数作为基函数，图示十个圆圈为多项式基函数的方法\n\
    \n# 乘法模型 VS 加法模型\n\n![](img/806dfb586cd1a39120c0a828715591b9_3_0.png)\n\n# 2.1\
    \ 线性模型-回归模型\n\n回归：属于监督学习中的一种方法。该方法的核心思想是从连续型统计数据中得到数学模型，然后将该数学模型用于预测或者分类。\n\n\
    回归最早出现在表及Francis Galton发明的。Galton在1877年完成了一次二次回归研究，目的是从高上代遗传的种（双亲）的尺寸来预测下一代豆荚种子的尺寸（身高）。Galton在大量数据上应用了回归，基于后继人的身高，他做出了结论：如双亲的身高比平均身高高，他们的子女也倾向于高于平均身高但相对双亲，这里面可以被称为：孩子的身高平均身高回归。Galton多项研究上都注意到了这一点，并将此种研究方法称为回归。\n\
    \n# 常用概念和符号\n\n+   - 房屋销售记录表：训练集(training set)或者训练数据(training data)，是我们流程中的输入数据，一般称为x\n\
    +   - 房屋销售价格：输出数据，一般称为y\n+   - 拟合的函数（或者称为假设或者模型）：一般写做 y = h(x)\n+   - 训练数据的条目数(training\
    \ set)，一条训练数据是由一对输入数据和输出数据组成的输入数据的维度（特征的个数，#features）\n+   这个例子中的特征是两维的，结果是一维的。然而回归方法能够解决特征多维，结果是一维多高维值或一维连续值的问题。\n\
    \n# 学习过程\n\n首先给出一个输入数据，然后通过一系列的过程得到一个估计的函数，这个函数有能力对没有见过的新数据给出一个新的估计，也就被称为构造一个模型。就像上面的线性回归函数。\n\
    \n![](img/806dfb586cd1a39120c0a828715591b9_3_1.png)\n\n# 线性回归\n\n+   - 线性回归 (Linear\
    \ regression) 是利用称为线性回归方程的最小平方函数对一个或多个自变量和因变量之间关系进行建模的一种回归分析。\n+   - 线性回归属于监督学习，因此方法和监督学习应该是一样的，先选定一个训练集，根据这个训练集学出一个假设函数，然后测试这个函数训练的好不好（比如函数是否够好地拟合训练数据），挑选出最好的函数\
    \ (cost function最小) 即可。"
