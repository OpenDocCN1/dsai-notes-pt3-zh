  md: "# 4.3 模型的选取\n\n# 4.3 模型的选取\n\n![](img/806dfb586cd1a39120c0a828715591b9_12_0.png)\n\
    \n![](img/806dfb586cd1a39120c0a828715591b9_12_1.png)\n\n当模型与正则化参数的组合变化合适时，拟合曲线与学习数据的拟合程度会随着学习数据的学习参数的改变而改变。为了更好地观察拟合曲线与学习数据的拟合程度，学习参数的改变和正则化参数的变化是非常必要的。\n\
    \n# 4.3 模型的选取\n\n# 4.3 模型的选取\n\n模型选择：通过采用不同的输入样本来决定被拟合学习数据中各个参数值的大小。模型选择的一致流程：\n\
    \n+   1. 准备候选的模型 M1...Mm。\n+   2. 对各候选模型 M1...Mm 拟合学习数据 D 得到 f1...fm。\n+   3.\
    \ 对各学习数据 f1...fm 的泛化误差 G1...Gm 进行评估。\n+   4. 选择泛化误差 G1...Gm 最小的模型作为模型。\n\n+  \
    \ ✓ 监督学习的目的是不是能够输入的样本集，而是未知和测试样本输入样本本可能正确地被预测出；\n+   ✓ 泛化误差学习对未知和测试样本输入样本的预测能力；\n\
    +   ✓ 泛化误差是相对未知和测试样本输入样本的预测所做出的预测的误差。\n\n![](img/806dfb586cd1a39120c0a828715591b9_12_2.png)\n\
    \n# 4.3 模型的选取——交叉验证\n\n# 4.3 模型的选取——交叉验证\n\n当 λ 取 (0.03, 0.3, 3) 中取值，正则化系数 λ 取\
    \ (0.0001, 0.1, 100) 选取，分别会含 m 为 5。\n把分训练集 m 个训练样本的交叉验证方法，称作 k 个样本进行学习，将其分为 k\
    \ 个部分作为测试样本，称为每一次交叉验证。\n每一交叉验证将包含 m 个训练样本，如果和成块，变量较多时同时进行。\n\n![](img/806dfb586cd1a39120c0a828715591b9_12_3.png)\n\
    \n![](img/806dfb586cd1a39120c0a828715591b9_12_4.png)\n\n# 留一交叉验证的简化方法\n\nG = 1/m\
