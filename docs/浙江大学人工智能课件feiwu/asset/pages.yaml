- pgno: 671
  md: '# # Probability Theory


    Figure 1.10 We can derive the sum and product rules of probability by considering
    two random variables, X, which takes the values {x<sub>i</sub>} where i = 1, ...,
    M, and Y, which takes the values {y<sub>j</sub>} where j = 1, ..., L. In this
    illustration we have M = 5 and L = 3. If we consider a total number N of instances
    of these variables, then we denote the number of instances where X = x<sub>i</sub>
    and Y = y<sub>j</sub> by n<sub>ij</sub>, which is the number of points in the
    corresponding cell of the array. The number of points in column i, corresponding
    to X = x<sub>i</sub>, is denoted by c<sub>i</sub>, and the number of points in
    row j, corresponding to Y = y<sub>j</sub>, is denoted by r<sub>j</sub>.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_671_0.png)


    # ## •Sum Rule


    \(p(X=x_i)=\frac{c_i}{N}=\frac{1}{N}\sum_{j=1}^Ln_{ij}\)


    \(=\sum_{j=1}^Lp(X=x_i,Y=y_j)\)


    # ## Product Rule


    \(p(X=x_i,Y=y_j)=\frac{n_{ij}}{N}=\frac{n_{ij}}{c_i}\cdot\frac{c_i}{N}\)


    \(=p(Y=y_j|X=x_i)p(X=x_i)\)'
