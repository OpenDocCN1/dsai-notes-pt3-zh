- pgno: 737
  md: '# # Some assumptions


    +   - observable: the environment is observable, so the agent always knows the
    current state.

    +   - discrete :the environment is discrete, so at any given state there are only
    finitely many actions to choose from.

    +   - Known: the agent knows which states are reached by each action, i.e., having
    an accurate map suffices to meet this condition for navigation problems.

    +   - deterministic: each action has exactly one outcome.


    Under these assumptions, the **solution** to any problem is a fixed sequence of
    actions. The process of looking for a sequence of actions that reaches the goal
    is called **search**.'
