- pgno: 792
  md: '# # Informed (Heuristic) Search Strategies


    How an informed search strategy—one that uses problem-specific knowledge beyond
    the definition of the problem itself—can find solutions more efficiently than
    can an uninformed strategy.


    +   - Greedy best-first search

    +   - A* search: Minimizing the total estimated solution cost


    The general approach we consider is called best-first search. Best-first search
    is an instance of the general TREE-SEARCH or GRAPH-SEARCH algorithm in which a
    node is selected for expansion based on an evaluation function, f(n). The evaluation
    function is construed as a cost estimate, so the node with the lowest evaluation
    is expanded first. The implementation of best-first graph search is identical
    to that for uniform-cost search (Figure 3.14), except for the use of f instead
    of g to order the priority queue.


    The choice of f determines the search strategy. (For example, as Exercise 3.21
    shows, best-first tree search includes depth-first search as a special case.)
    Most best-first algorithms include as a component of f a heuristic function, denoted
    h(n):


    h(n) = estimated cost of the cheapest path from the state at node n to a goal
    state.


    (Notice that h(n) takes a node as input, but, unlike g(n), it depends only on
    the state at that node.) For example, in Romania, one might estimate the cost
    of the cheapest path from Arad to Bucharest via the straight-line distance from
    Arad to Bucharest.'
  merge: -1
  img_proc: true
