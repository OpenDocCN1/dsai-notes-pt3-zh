  md: '# # Example: Polynomial curve fitting


    +   - Suppose we are given a training set comprising \( N \) observations of \(
    x \), written \( \mathbf{x} = (x_1, \dots, x_N)^T \), together with corresponding
    observations of the values of \( t \), denoted \( \mathbf{t} = (t_1, \dots, t_N)^T
    \), \( x_i, t_i \in \mathbb{R} \).


    +   - **Regression problem**: estimate \( y(x) \) from these data


    +   - What form is, \( y(x) \)?


    +     – Linear model: polynomials of degree M


    +   \( y(x, \mathbf{w}) = w_0 + w_1 x + w_2 x^2 + \dots + w_M x^M = \sum_{j=0}^{M}
    w_j x^j \)


    +   - How do we measure success?


    +     – Error functions: SSE, RMS


    +   \( E(\mathbf{w}) = \frac{1}{2} \sum_{n=1}^{N} \{ y(x_n, \mathbf{w}) - t_n
    \}^2 \)


    +   - **Our goal**: minimize error function


