- pgno: 78
  md: '# # Regret Bound of Upper Confidence Bound Strategies


    **Theorem:** Suppose that UCB1 is run on the bandit game with \( K \) actions,
    each of whose reward distribution \( X_{i,t} \) has values in [0,1]. Then its
    expected cumulative regret after \( T \) rounds is at most \( O(\sqrt{KT \log
    T}) \).


    Actually, we''ll prove a more specific theorem. Let \( \Delta_i \) be the difference
    \( \mu^* - \mu_i \), where \( \mu^* \) is the expected payoff of the best action,
    and let \( \Delta \) be the minimal nonzero \( \Delta_i \). That is, \( \Delta_i
    \) represents how suboptimal an action is and \( \Delta \) is the suboptimality
    of the second best action. These constants are called _problem-dependent constants_.
    The theorem we''ll actually prove is:


    **Theorem:** Suppose UCB1 is run as above. Then its expected cumulative regret
    \( \mathbb{E}(R_{\text{UCB1}}(T)) \) is at most


    \( 8 \sum_{i: \mu_i < \mu^*} \frac{\log T}{\Delta_i} + \left(1 + \frac{\pi^2}{3}\right)
    \left( \sum_{j=1}^K \Delta_j \right) \)'
