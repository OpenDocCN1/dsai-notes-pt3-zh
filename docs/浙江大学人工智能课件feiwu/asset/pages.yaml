- pgno: 450
  md: '# # The EM Algorithm in General


    +   • We have known, for the incomplete data set {X}, direct optimization of the
    log likelihood function is difficult:


    \[ \ln p(\mathbf{X}|\theta) = \ln \left\{ \sum_{\mathbf{Z}} p(\mathbf{X}, \mathbf{Z}|\theta)
    \right\} \]


    +   • Introduce a distribution \( q(\mathbf{Z}) \) defined over the latent variables,
    and we observe that, for any choice of \( q(\mathbf{Z}) \), the following decomposition
    holds:


    \[ \ln p(\mathbf{X}|\theta) = \mathcal{L}(q, \theta) + \text{KL}(q\|p) \]


    \[ \mathcal{L}(q, \theta) = \sum_{\mathbf{Z}} q(\mathbf{Z}) \ln \left\{ \frac{p(\mathbf{X},
    \mathbf{Z}|\theta)}{q(\mathbf{Z})} \right\} \]


    \[ \text{KL}(q\|p) = - \sum_{\mathbf{Z}} q(\mathbf{Z}) \ln \left\{ \frac{p(\mathbf{Z}|\mathbf{X},
    \theta)}{q(\mathbf{Z})} \right\} \]


    \[ \ln p(\mathbf{X}, \mathbf{Z}|\theta) = \ln p(\mathbf{Z}|\mathbf{X}, \theta)
    + \ln p(\mathbf{X}|\theta) \]


    KL(q||p) is the Kullback-Leibler divergence between q(Z) and the posterior distribution
    p(Z|X,θ). Recall that the Kullback-Leibler divergence satisfies KL(q||p)≥0, with
    equality if, and only if, q(Z) = p(Z|X,θ). See Section 1.6.1 to see proof (Jenson’s
    inequality). It therefore follows from (9.70) that L(q,θ)≤ln p(X|θ), in other
    words that L(q,θ) is a lower bound on ln p(X|θ).


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_450_0.png)'
  merge: -1
  img_proc: true
- pgno: 451
  md: '# # The EM Algorithm in General


    +   - The connection between the decomposition and EM algorithm:


    ln p(X|θ) = L(q, θ) + KL(q||p)


    L(q, θ) = Σ_Z q(Z) ln { p(X, Z|θ) / q(Z) }


    KL(q||p) = - Σ_Z q(Z) ln { p(Z|X, θ) / q(Z) }


    L(q, θ) = Σ_Z p(Z|X, θ^old) ln p(X, Z|θ) - Σ_Z p(Z|X, θ^old) ln p(Z|X, θ^old)
    = Q(θ, θ^old) + const


    # ## E step


    q(Z) = p(Z|X, θ^old)


    Illustration of the E step of the EM algorithm. The q distribution is set equal
    to the posterior distribution for the current parameter values θ^old, causing
    the lower bound to move up to the same value as the log likelihood function, with
    the KL divergence vanishing.


    # ## M step


    Illustration of the M step of the EM algorithm. The distribution q(Z) is held
    fixed and the lower bound L(q, θ) is maximized with respect to the parameter vector
    θ to give a revised value θ^new. Because the KL divergence is non-negative, this
    causes the log likelihood ln p(X|θ) to increase by at least as much as the lower
    bound does.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_451_0.png)


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_451_1.png)'
  merge: -1
  img_proc: true
