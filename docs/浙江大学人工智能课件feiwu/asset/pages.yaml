    \ problem**\n> > _Known parameters_: number of arms \\(K\\) and (possibly) number\
    \ of rounds \\(n \\ge K\\).\n> > _Unknown parameters_: \\(K\\) probability distributions\
    \ \\(\\nu_1, \\dots, \\nu_K\\) on \\([0, 1]\\).\n> > For each round \\(t = 1,\
    \ 2, \\dots\\)\n> > \n> > (1) the forecaster chooses \\(I_t \\in \\{1, \\dots,\
    \ K\\}\\);\n> > (2) given \\(I_t\\), the environment draws the reward \\(X_{I_t,\
    \ t} \\sim \\nu_{I_t}\\) independently from the past and reveals it to the forecaster.\n\
    \n[146] H. Robbins, Some aspects of the sequential design of experiments, Bulletin\
    \ of the American Mathematics Society, vol. 58, pp. 527–535, 1952"
