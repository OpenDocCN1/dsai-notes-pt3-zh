- pgno: 683
  md: '# # Bayesian Probabilities


    Bayes’ theorem now acquires a new significance. Recall that in the boxes of fruit
    example, the observation of the identity of the fruit provided relevant information
    that altered the probability that the chosen box was the red one. In that example,
    Bayes’ theorem was used to convert a prior probability into a posterior probability
    by incorporating the evidence provided by the observed data. As we shall see in
    detail later, we can adopt a similar approach when making inferences about quantities
    such as the parameters **w** in the polynomial curve fitting example. We capture
    our assumptions about **w**, before observing the data, in the form of a prior
    probability distribution _p_(**w**). The effect of the observed data D = {_t_<sub>1</sub>,
    ..., _t<sub>N</sub>_} is expressed through the conditional probability _p_(D|**w**),
    and we shall see later, in Section 1.2.5, how this can be represented explicitly.
    Bayes’ theorem, which takes the form


    \(p(\mathbf{w}|\mathcal{D})=\frac{p(\mathcal{D}|\mathbf{w})p(\mathbf{w})}{p(\mathcal{D})}\)
    (1.43)


    then allows us to evaluate the uncertainty in **w** after we have observed D in
    the form of the posterior probability _p_(**w**|D).


    The quantity _p_(D|**w**) on the right-hand side of Bayes’ theorem is evaluated
    for the observed data set D and can be viewed as a function of the parameter vector
    **w**, in which case it is called the _likelihood function_. It expresses how
    probable the observed data set is for different settings of the parameter vector
    **w**. Note that the likelihood is not a probability distribution over **w**,
    and its integral with respect to **w** does not (necessarily) equal one.


    Given this definition of likelihood, we can state Bayes’ theorem in words


    \(\text{posterior}\propto\text{likelihood}\times\text{prior}\) (1.44)


    where all of these quantities are viewed as functions of **w**. The denominator
    in (1.43) is the normalization constant, which ensures that the posterior distribution
    on the left-hand side is a valid probability density and integrates to one. Indeed,
    integrating both sides of (1.43) with respect to **w**, we can express the denominator
    in Bayes’ theorem in terms of the prior distribution and the likelihood function


    \(p(\mathcal{D})=\int p(\mathcal{D}|\mathbf{w})p(\mathbf{w})\text{d}\mathbf{w}.\)
    (1.45)'
  merge: -1
  img_proc: true
- pgno: 684
  md: '# # Bayesian Probabilities


    A widely used frequentist estimator is _maximum likelihood_, in which w is set
    to the value that maximizes the likelihood function _p_(_D_|**w**). This corresponds
    to choosing the value of w for which the probability of the observed data set
    is maximized. In the machine learning literature, the negative log of the likelihood
    function is called an _error function_. Because the negative logarithm is a monotonically
    decreasing function, maximizing the likelihood is equivalent to minimizing the
    error.'
  merge: -1
  img_proc: true
- pgno: 685
  md: '# # The Gaussian Distribution


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_685_0.png)


    For the case of a single real-valued variable \(x\), the Gaussian distribution
    is defined by


    \(\mathcal{N}(x|\mu, \sigma^2) = \frac{1}{(2\pi\sigma^2)^{1/2}} \exp \left\{ -\frac{1}{2\sigma^2}(x
    - \mu)^2 \right\}\) (1.46)


    which is governed by two parameters: \(\mu\), called the **mean**, and \(\sigma^2\),
    called the **variance**. The square root of the variance, given by \(\sigma\),
    is called the **standard deviation**, and the reciprocal of the variance, written
    as \(\beta = 1/\sigma^2\), is called the **precision**. We shall see the motivation
    for these terms shortly. Figure 1.13 shows a plot of the Gaussian distribution.


    From the form of (1.46) we see that the Gaussian distribution satisfies


    \(\mathcal{N}(x|\mu, \sigma^2) > 0.\) (1.47)


    Also it is straightforward to show that the Gaussian is normalized, so that


    \(\int_{-\infty}^{\infty} \mathcal{N}(x|\mu, \sigma^2) \, dx = 1.\) (1.48)


    Thus (1.46) satisfies the two requirements for a valid probability density.


    \(\beta = 1/\sigma^2\) (precision – the bigger \(\beta\) is, the smaller \(\sigma\)
    is, thus the more “precise” the distribution is.)'
  merge: -1
  img_proc: true
- pgno: 686
  md: '# # The Gaussian Distribution


    We can readily find expectations of functions of _x_ under the Gaussian distribution.
    In particular, the average value of _x_ is given by


    \(\mathbb{E}[x] = \int_{-\infty}^{\infty} \mathcal{N}\left(x|\mu,\sigma^2\right)
    x \, \mathrm{d}x = \mu.\) (1.49)


    Because the parameter \(\mu\) represents the average value of _x_ under the distribution,
    it is referred to as the mean. Similarly, for the second order moment


    \(\mathbb{E}[x^2] = \int_{-\infty}^{\infty} \mathcal{N}\left(x|\mu,\sigma^2\right)
    x^2 \, \mathrm{d}x = \mu^2 + \sigma^2.\) (1.50)


    From (1.49) and (1.50), it follows that the variance of _x_ is given by


    \(\text{var}[x] = \mathbb{E}[x^2] - \mathbb{E}[x]^2 = \sigma^2\) (1.51)


    and hence \(\sigma^2\) is referred to as the variance parameter. The maximum of
    a distribution is known as its mode. For a Gaussian, the mode coincides with the
    mean.


    We are also interested in the Gaussian distribution defined over a _D_-dimensional
    vector x of continuous variables, which is given by


    \(\mathcal{N}(\mathbf{x}|\mu,\Sigma) = \frac{1}{(2\pi)^{D/2}} \frac{1}{|\Sigma|^{1/2}}
    \exp \left\{ -\frac{1}{2}(\mathbf{x}-\mu)^\mathrm{T}\Sigma^{-1}(\mathbf{x}-\mu)
    \right\}\) (1.52)


    where the _D_-dimensional vector \(\mu\) is called the mean, the \(D \times D\)
    matrix \(\Sigma\) is called the covariance, and \(|\Sigma|\) denotes the determinant
    of \(\Sigma\). We shall make use of the multivariate Gaussian distribution briefly
    in this chapter, although its properties will be studied in detail in Section
    2.3.'
  merge: -1
  img_proc: true
- pgno: 687
  md: '# Figure 1.14 Illustration of the likelihood function for a Gaussian distribution,
    shown by the red curve. Here the black points denote a data set of values {_x<sub>n</sub>_},
    and the likelihood function given by (1.53) corresponds to the product of the
    blue values. Maximizing the likelihood involves adjusting the mean and variance
    of the Gaussian so as to maximize this product.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_687_0.png)


    Now suppose that we have a data set of observations **x** = (_x_<sub>1</sub>_,...,x<sub>N</sub>_)<sup>T</sup>,
    representing _N_ observations of the scalar variable _x_. Note that we are using
    the typeface **x** to distinguish this from a single observation of the vector-valued
    variable (_x_<sub>1</sub>_,...,x<sub>D</sub>_)<sup>T</sup>, which we denote by
    **x**. We shall suppose that the observations are drawn independently from a Gaussian
    distribution whose mean μ and variance σ<sup>2</sup> are unknown, and we would
    like to determine these parameters from the data set. Data points that are drawn
    independently from the same distribution are said to be _independent_ and _identically
    distributed_, which is often abbreviated to i.i.d. We have seen that the joint
    probability of two independent events is given by the product of the marginal
    probabilities for each event separately. Because our data set **x** is i.i.d.,
    we can therefore write the probability of the data set, given μ and σ<sup>2</sup>,
    in the form


    \(p(\mathbf{x}|\mu,\sigma^2)=\prod_{n=1}^N\mathcal{N}\left(x_n|\mu,\sigma^2\right).\)
    (1.53)


    When viewed as a function of μ and σ<sup>2</sup>, this is the likelihood function
    for the Gaussian and is interpreted diagrammatically in Figure 1.14.'
  merge: -1
  img_proc: true
- pgno: 688
  md: 'One common criterion for determining the parameters in a probability distribution
    using an observed data set is to find the parameter values that maximize the likelihood
    function. This might seem like a strange criterion because, from our foregoing
    discussion of probability theory, it would seem more natural to maximize the probability
    of the parameters given the data, not the probability of the data given the parameters.
    In fact, these two criteria are related, as we shall discuss in the context of
    curve fitting.


    For the moment, however, we shall determine values for the unknown parameters
    \(\mu\) and \(\sigma^2\) in the Gaussian by maximizing the likelihood function
    (1.53). In practice, it is more convenient to maximize the log of the likelihood
    function. Because the logarithm is a monotonically increasing function of its
    argument, maximization of the log of a function is equivalent to maximization
    of the function itself. Taking the log not only simplifies the subsequent mathematical
    analysis, but it also helps numerically because the product of a large number
    of small probabilities can easily underflow the numerical precision of the computer,
    and this is resolved by computing instead the sum of the log probabilities. From
    (1.46) and (1.53), the log likelihood function can be written in the form


    \(ln p(\mathbf{x}|\mu, \sigma^2) = -\frac{1}{2\sigma^2} \sum_{n=1}^N (x_n - \mu)^2
    - \frac{N}{2} \ln \sigma^2 - \frac{N}{2} \ln(2\pi).\) (1.54)


    Maximizing (1.54) with respect to \(\mu\), we obtain the maximum likelihood solution
    given by


    \(\mu_{ML} = \frac{1}{N} \sum_{n=1}^N x_n\) (1.55)


    which is the *sample mean*, i.e., the mean of the observed values \(\{x_n\}\).
    Similarly, maximizing (1.54) with respect to \(\sigma^2\), we obtain the maximum
    likelihood solution for the variance in the form


    \(\sigma_{ML}^2 = \frac{1}{N} \sum_{n=1}^N (x_n - \mu_{ML})^2\) (1.56)


    which is the *sample variance* measured with respect to the sample mean \(\mu_{ML}\).
    Note that we are performing a joint maximization of (1.54) with respect to \(\mu\)
    and \(\sigma^2\), but in the case of the Gaussian distribution the solution for
    \(\mu\) decouples from that for \(\sigma^2\) so that we can first evaluate (1.55)
    and then subsequently use this result to evaluate (1.56).


    ```

    \(\mathcal{N}(x|\mu, \sigma^2) = \frac{1}{(2\pi\sigma^2)^{1/2}} \exp \left\{ -\frac{1}{2\sigma^2}(x
    - \mu)^2 \right\}\) (1.46)

    ```


    ```

    \(p(\mathbf{X}|\mu, \sigma^2) = \prod_{n=1}^N \mathcal{N}(x_n|\mu, \sigma^2).\)
    (1.53)

    ```'
