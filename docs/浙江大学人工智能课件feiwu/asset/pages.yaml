    $$\Rightarrow \sum_{n=1}^{N}(x_n-\mu)=0$$


    $$\Rightarrow \sum_{n=1}^{N}x_n-N\mu=0$$


    $$\Rightarrow \mu=\frac{\sum_{n=1}^{N}x_n}{N}=\bar{x}$$'
