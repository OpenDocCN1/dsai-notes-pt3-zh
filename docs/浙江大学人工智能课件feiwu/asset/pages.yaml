- pgno: 145
  md: '![](img/c69bfdf1f6addd09d49cae0440fcc5c7_145_0.png)


    Left: Sigmoid non-linearity squashes real numbers to range between [0,1] Right:
    The tanh non-linearity squashes real numbers to range between [-1,1].


    **Sigmoid.** The sigmoid non-linearity has the mathematical form $\sigma(x) =
    1/(1 + e^{-x})$ and is shown in the image above on the left. As alluded to in
    the previous section, it takes a real-valued number and “squashes” it into range
    between 0 and 1. In particular, large negative numbers become 0 and large positive
    numbers become 1.


    **Tanh.** The tanh non-linearity is shown on the image above on the right. It
    squashes a real-valued number to the range [-1, 1]. Like the sigmoid neuron, its
    activations saturate, but unlike the sigmoid neuron its output is zero-centered.
    Therefore, in practice the *tanh non-linearity is always preferred to the sigmoid
    nonlinearity*. Also note that the tanh neuron is simply a scaled sigmoid neuron,
    in particular the following holds: $\tanh(x) = 2\sigma(2x) - 1$.'
  merge: -1
  img_proc: true
