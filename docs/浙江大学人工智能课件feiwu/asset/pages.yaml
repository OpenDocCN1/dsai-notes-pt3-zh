    The distance from any point \(\mathbf{y}\) to a plane given a normal vector \(\mathbf{w}\)
    to the plane and any point \(\mathbf{x}\) on the plane is \(d = \frac{\mathbf{w}^{\mathrm{T}}(\mathbf{y}-\mathbf{x})}{\|\mathbf{w}\|}\).
    \(\mathbf{y}\) is the origin, hence \(\mathbf{y}-\mathbf{x}=-\mathbf{x}\). Therefore,
    here, \(d = \frac{|\mathbf{w}^{\mathrm{T}}\mathbf{x}|}{\|\mathbf{w}\|}\).


