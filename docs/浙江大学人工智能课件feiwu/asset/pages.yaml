- pgno: 229
  md: '# # Backward Propagation


    # ## Update of W₅₋₈


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_229_0.png)


    # 1. Gradient Computation


    $$\delta_5 = \frac{\partial Error}{\partial w_5} = \frac{\partial Error}{\partial
    o_1} * \frac{\partial o_1}{\partial In_{o_1}} * \frac{\partial In_{o_1}}{\partial
    w_5}$$


    where,


    $$\frac{\partial Error}{\partial o_1} = z_1 - o_1$$


    $$\frac{\partial o_1}{\partial In_{o_1}} = o_1 * (1 - o_1)$$


    $$\frac{\partial In_{o_1}}{\partial w_5} = h_1$$


    # 2. Update weight


    $$w''_5 = w_5 - \eta * \delta_5$$'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# # Update of W<sub>1~4</sub>


    # ## 1. Gradient Computation


    \(\delta_1 = \frac{\partial Error}{\partial w_1} = \frac{\partial Error}{\partial
    o_1} * \frac{\partial o_1}{\partial w_1} + \frac{\partial Error}{\partial o_2}
    * \frac{\partial o_2}{\partial w_1}\)


    \(= \frac{\partial Error}{\partial o_1} * \frac{\partial o_1}{\partial ln_{o_1}}
    * \frac{\partial ln_{o_1}}{\partial h_1} * \frac{\partial h_1}{\partial ln_{h_1}}
    * \frac{\partial ln_{h_1}}{\partial w_1} + \frac{\partial Error}{\partial o_2}
    * \frac{\partial o_2}{\partial ln_{o_2}} * \frac{\partial ln_{o_2}}{\partial h_1}
    * \frac{\partial h_1}{\partial ln_{h_1}} * \frac{\partial ln_{h_1}}{\partial w_1}\)


    where,


    \(\frac{\partial Error}{\partial o_1} = z_1 - o_1\)


    \(\frac{\partial o_1}{\partial ln_{o_1}} = o_1 * (1 - o_1) \quad \frac{\partial
    ln_{o_1}}{\partial h_1} = w_5\)


    \(\frac{\partial h_1}{\partial ln_{h_1}} = h_1 * (1 - h_1)\)


    \(\frac{\partial ln_{h_1}}{\partial w_1} = x_1\)


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_230_0.png)'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Update of $W_{1\sim4}$


    # 1. Gradient Computation


    $\delta_1 = \frac{\partial Error}{\partial w_1} = \frac{\partial Error}{\partial
    o_1} * \frac{\partial o_1}{\partial w_1} + \frac{\partial Error}{\partial o_2}
    * \frac{\partial o_2}{\partial w_1}$


    $= \frac{\partial Error}{\partial o_1} * \frac{\partial o_1}{\partial In_{o_1}}
    * \frac{\partial In_{o_1}}{\partial h_1} * \frac{\partial h_1}{\partial In_{h_1}}
    * \frac{\partial In_{h_1}}{\partial w_1} + \frac{\partial Error}{\partial o_2}
    * \frac{\partial o_2}{\partial In_{o_2}} * \frac{\partial In_{o_2}}{\partial h_1}
    * \frac{\partial h_1}{\partial In_{h_1}} * \frac{\partial In_{h_1}}{\partial w_1}$


    where,


    $\frac{\partial Error}{\partial o_2} = z_2 - o_2$


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_231_0.png)


    $\frac{\partial o_2}{\partial In_{o_2}} = o_2 * (1 - o_2)$


    $\frac{\partial In_{o_2}}{\partial h_1} = w_6$


    $\frac{\partial h_1}{\partial In_{h_1}} = h_1 * (1 - h_1)$


    $\frac{\partial In_{h_1}}{\partial w_1} = x_1$'
  merge: -1
  img_proc: true
