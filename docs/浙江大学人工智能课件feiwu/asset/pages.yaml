- pgno: 904
  md: '# # A* search: Minimizing the total estimated solution cost


    +   - Conditions for optimality: **Admissibility** and Consistency

    +     - \( f(n) = g(n) + h(n) \)

    +     - \( g(n) \) is the actual cost to reach \( n \) along the current path

    +     - \( h(n) \) is an admissible heuristic function: it never overestimates
    the cost to reach the goal

    +     - So, \( f(n) \) never overestimates the true cost of a solution along the
    current path through \( n \)

    +     - E.g. \( h_{SLD} \) is admissible because the shortest path between any
    two points is a straight line.'
  merge: -1
  img_proc: true
- pgno: 905
  md: '# A* search: Minimizing the total estimated solution cost


    +   - **Conditions for optimality: Admissibility and Consistency**

    +     - $h(n) \le c(n, a, n'') + h(n'')$

    +     - for every node $n$ and every successor $n''$ of $n$ generated by any action
    $a$, the estimated cost of reaching the goal from $n$ is no greater than the step
    cost of getting to $n''$ plus the estimated cost of reaching the goal from $n''$

    +     - It is fairly easy to show (Exercise 3.29) that **every consistent heuristic
    is also admissible**.

    +     - E.g. $h_{SLD}$ is consistent because the general triangle inequality is
    satisfied when each side is measured by the straight-line distance and that the
    straight-line distance between $n$ and $n''$ is no greater than $c(n, a, n'')$.'
  merge: -1
  img_proc: true
- pgno: 906
  md: '# # A* search: Minimizing the total estimated solution cost


    +   - Properties of A* search:

    +     - The tree-search version of A* is optimal if _h(n)_ is admissible

    +     - The graph-search version of A* is optimal if _h(n)_ is consistent'
