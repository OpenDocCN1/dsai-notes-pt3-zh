  md: '# # Monte Carlo Method


    +   - In principle, Monte Carlo methods can be used to solve any problem having
    a probabilistic interpretation. By the law of large numbers, integrals described
    by the expected value of some random variable can be approximated by taking the
    empirical mean (a.k.a. the sample mean) of independent samples of the variable.
    When the probability distribution of the variable is parametrized, mathematicians
    often use a Markov Chain Monte Carlo (MCMC) sampler.


    +   - The central idea is to design a judicious Markov chain model with a prescribed
    stationary probability distribution. That is, in the limit, the samples being
    generated by the MCMC method will be samples from the desired (target) distribution.'
  merge: -1
  img_proc: true
