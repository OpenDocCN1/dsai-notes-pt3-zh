- pgno: 90
  md: '# # Upper Confidence Bounds on Trees (UCT)


    +   • An extremely desirable property of any game-tree search algorithm is **consistency**,
    i.e., given enough time, the search algorithm will find the optimal values for
    all nodes of the tree, and can therefore select the optimal action at the root
    state. The UCT algorithm is a consistent version of Monte-Carlo tree search.


    +   • If all leaf value estimates were truly the optimal values, one could achieve
    consistency at the parent nodes by applying greedy action selection, which simply
    chooses the action with the highest value in each node. If all descendants of
    a given node have optimal value estimates, then greedy action selection produces
    optimal play from that node onwards, and therefore simulation will produce an
    optimal value estimate for that node. By induction, the value estimate for all
    nodes will eventually become optimal, and ultimately this procedure will select
    an optimal action at the root.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Upper Confidence Bounds on Trees (UCT)


    +   - However, the value estimates are not usually optimal for two reasons:

    +     1. the policy is stochastic, so there is some inherent randomness in the
    values

    +     2. the policy is imperfect. Thus, going with the action that has the highest
    value estimate can lead to suboptimal play, e.g., if the value of the optimal
    action was initially underestimated. Therefore, occasionally at least, one must
    choose actions that look suboptimal according to the current value estimates.


    ● The problem of when and how to select optimal or suboptimal actions has been
    extensively studied in the simplest of all stochastic action selection problems.
    These problems are known as **multi-armed bandit problems**.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Upper Confidence Bounds on Trees (UCT)


    +   - Each game ends after the very first action, with the player receiving a
    stochastic reward that depends only on the selected action. The challenge is to
    maximize the player''s total expected reward, i.e., quickly find the action with
    the highest expected reward, without losing too much reward along the way.


    +   - One simple, yet effective, strategy is to always select the action whose
    value estimate is the largest, with an optimistic adjustment that takes account
    of the uncertainty of the value estimate. This way, each action either results
    in an optimal action or in a reduction of the uncertainty associated with the
    value estimate of the chosen action. Thus, suboptimal actions cannot be chosen
    indefinitely.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# # Upper Confidence Bounds on Trees (UCT)


    +   - The principle of always choosing the action with the highest optimistic
    value estimate is known as the "principle of optimism in the face of uncertainty"
    and was first proposed and studied by Lai and Robbins [1].A simple implementation
    of this idea, due to Auer et al. [2], is to compute an upper confidence bound
    (UCB) for each value estimate, using Hoeffding''s tail inequality.


    +   - Applying this idea in an MCTS algorithm gives the **Upper Confidence Bounds
    on Trees** (UCT) algorithm due to Kocsis and Szepesvari [3].


    +   - [1]T. L. Lai and H. Robbins. Asymptotically efficient adaptive allocation
    rules. Advances in Applied Mathematics, 6:4-22, 1985

    +   - [2]P. Auer, N. Cesa-Bianchi, and P. Fischer. Finite time analysis of the
    multiarmed bandit problem. Machine Learning, 47(2-3):235-256, 2002

    +   - [3]L. Kocsis and C. Szepesvari. Bandit based Monte-Carlo planning. In 15th
    European Conference on Machine Learning (ECML), 282-293, 2006.'
  merge: -1
