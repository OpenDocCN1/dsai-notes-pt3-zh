- pgno: 930
  md: "# # Alpha-Beta Pruning\n\n+   - The problem of Minimax search\n+     - The\
    \ number of game states it has to examine is exponential in the depth of the tree\n\
    +   \n+     - Can we eliminate the exponent? No, but we can cut it in half!\n\
    +   \n+     - How to do?\n+       - The trick is that it is possible to compute\
    \ the correct minimax decision without looking at every node in the game tree\n\
    +       - That is we can borrow the idea of pruning to eliminate large parts of\
    \ the tree from consideration, it's called alpha-beta pruning.\n+       - When\
    \ applied to a standard minimax tree, it returns the same move as minimax would."
