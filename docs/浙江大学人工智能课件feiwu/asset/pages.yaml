- pgno: 1004
  md: '# # Information theory: entropy


    We begin by considering a discrete random variable _x_ and we ask how much information
    is received when we observe a specific value for this variable. The amount of
    information can be viewed as the ‘degree of surprise’ on learning the value of
    _x_. If we are told that a highly improbable event has just occurred, we will
    have received more information than if we were told that some very likely event
    has just occurred, and if we knew that the event was certain to happen we would
    receive no information. Our measure of information content will therefore depend
    on the probabilistic distribution _p_(_x_), and we therefore look for a quantity
    _h_(_x_) that is a monotonic function of the probability _p_(_x_) and that expresses
    the information content. The form of \(h(\cdot)\) can be found by noting that
    if we have two events _x_ and _y_ that are unrelated, then the information gain
    from observing both of them should be the sum of the information gained from each
    of them separately, so that _h_(_x,y_) = _h_(_x_) + _h_(_y_). Two unrelated events
    will be statistically independent and so _p_(_x,y_) = _p_(_x_)_p_(_y_). From these
    two relationships, it is easily shown that _h_(_x_) must be given by the logarithm
    of _p_(_x_) and so we have


    ```

    \(h(x) = -\log_2 p(x)\) (1.92)

    ```


    where the negative sign ensures that information is positive or zero. Note that
    low probability events _x_ correspond to high information content. The choice
    of basis for the logarithm is arbitrary, and for the moment we shall adopt the
    convention prevalent in information theory using logarithms to the base of 2.
    In this case, as we shall see shortly, the units of _h_(_x_) are bits (‘binary
    digits’).


    Now suppose that a sender wishes to transmit the value of a random variable to
    a receiver. The average amount of information that they transmit in the process
    is obtained by taking the expectation of (1.92) with respect to the distribution
    _p_(_x_) and is given by


    ```

    \(\text{H}[x] = -\sum_x p(x) \log_2 p(x).\) (1.93)

    ```


    This important quantity is called the **entropy** of the random variable _x_.
    Note that \(lim_{p \to 0} p \ln p = 0\) and so we shall take _p_(_x_)ln_p_(_x_)
    = 0 whenever we encounter a value for _x_ such that _p_(_x_) = 0.'
  merge: -1
  img_proc: true
- pgno: 1005
  md: 'tion (1.92) and the corresponding entropy (1.93). We now show that these definitions
    indeed possess useful properties. Consider a random variable _x_ having 8 possible
    states, each of which is equally likely. In order to communicate the value of
    _x_ to a receiver, we would need to transmit a message of length 3 bits. Notice
    that the entropy of this variable is given by


    \(\text{H}[x] = -8 \times \frac{1}{8} \log_2 \frac{1}{8} = 3 \text{ bits}.\)


    Now consider an example (Cover and Thomas, 1991) of a variable having 8 possible
    states \(\{a,b,c,d,e,f,g,h\}\) for which the respective probabilities are given
    by \((\frac{1}{2}, \frac{1}{4}, \frac{1}{8}, \frac{1}{16}, \frac{1}{64}, \frac{1}{64},
    \frac{1}{64}, \frac{1}{64})\). The entropy in this case is given by


    \(\text{H}[x] = -\frac{1}{2} \log_2 \frac{1}{2} - \frac{1}{4} \log_2 \frac{1}{4}
    - \frac{1}{8} \log_2 \frac{1}{8} - \frac{1}{16} \log_2 \frac{1}{16} - \frac{4}{64}
    \log_2 \frac{1}{64} = 2 \text{ bits}.\)


    We see that the nonuniform distribution has a smaller entropy than the uniform
    one, and we shall gain some insight into this shortly when we discuss the interpretation
    of entropy in terms of disorder. For the moment, let us consider how we would
    transmit the identity of the variable’s state to a receiver. We could do this,
    as before, using a 3-bit number. However, we can take advantage of the nonuniform
    distribution by using shorter codes for the more probable events, at the expense
    of longer codes for the less probable events, in the hope of getting a shorter
    average code length. This can be done by representing the states \(\{a,b,c,d,e,f,g,h\}\)
    using, for instance, the following set of code strings: 0, 10, 110, 1110, 111100,
    111101, 111110, 111111. The average length of the code that has to be transmitted
    is then


    \(\text{average code length} = \frac{1}{2} \times 1 + \frac{1}{4} \times 2 + \frac{1}{8}
    \times 3 + \frac{1}{16} \times 4 + 4 \times \frac{1}{64} \times 6 = 2 \text{ bits}\)


    which again is the same as the entropy of the random variable. Note that shorter
    code strings cannot be used because it must be possible to disambiguate a concatenation
    of such strings into its component parts. For instance, 11001110 decodes uniquely
    into the state sequence _c,a,d_.


    This relation between entropy and shortest coding length is a general one. The
    _source coding theorem_ of Shannon, 1948 states that the entropy is a lower bound
    on the number of bits required to transmit the state of a random variable.'
  merge: -1
  img_proc: true
- pgno: 1006
  md: '# Claude Shannon


    1916–2001


    After graduating from Michigan and MIT, Shannon joined the AT&T Bell Telephone
    Laboratories in 1941. His paper “A Mathematical Theory of Communication” published
    in the Bell System Technical Journal in 1948 laid the foundation for modern information
    theory. This paper introduced the word “bit”, and his concept that information
    could be sent as a stream of 1s and 0s paved the way for the communications revolution.
    It is said that von Neumann recommended to Shannon that he use the term entropy,
    not only because of its similarity to the quantity used in physics, but also because
    “nobody knows what entropy really is, so in any discussion you will always have
    an advantage”.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1006_0.png)


    Shannon entropy provides an absolute limit

    on the best possible average length of

    lossless encoding or compression of an

    information source.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1006_1.png)'
  merge: -1
  img_proc: true
- pgno: 1007
  md: '# # Information theory: entropy


    We can interpret the bins as the states \(x_i\) of a discrete random variable
    \(X\), where \(p(X=x_i)=p_i\). The entropy of the random variable \(X\) is then


    \(\mathrm{H}[p]=-\sum_i p(x_i)\ln p(x_i).\) (1.98)


    Distributions \(p(x_i)\) that are sharply peaked around a few values will have
    a relatively low entropy, whereas those that are spread more evenly across many
    values will have higher entropy, as illustrated in Figure 1.30. Because \(0 \leqslant
    p_i \leqslant 1\), the entropy is nonnegative, and it will equal its minimum value
    of 0 when one of the \(p_i=1\) and all other \(p_{j \neq i}=0\). The maximum entropy
    configuration can be found by maximizing \(\mathrm{H}\) using a Lagrange multiplier
    to enforce the normalization constraint on the probabilities. Thus we maximize


    \(\widetilde{\mathrm{H}}=-\sum_i p(x_i)\ln p(x_i)+\lambda\left(\sum_i p(x_i)-1\right)\)
    (1.99)


    from which we find that all of the \(p(x_i)\) are equal and are given by \(p(x_i)=1/M\)
    where \(M\) is the total number of states \(x_i\). The corresponding value of
    the entropy is then \(\mathrm{H}=\ln M\). This result can also be derived from
    Jensen''s inequality (to be discussed shortly). To verify that the stationary
    point is indeed a maximum, we can


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1007_0.png)


    Figure 1.30 Histograms of two probability distributions over 30 bins illustrating
    the higher value of the entropy H for the broader distribution. The largest entropy
    would arise from a uniform distribution that would give H = −ln(1/30) = 3.40.'
  merge: -1
  img_proc: true
- pgno: 1008
  md: '# # Relative entropy and mutual information


    So far in this section, we have introduced a number of concepts from information
    theory, including the key notion of entropy. We now start to relate these ideas
    to pattern recognition. Consider some unknown distribution _p_(x), and suppose
    that we have modelled this using an approximating distribution _q_(x). If we use
    _q_(x) to construct a coding scheme for the purpose of transmitting values of
    x to a receiver, then the average _additional_ amount of information (in nats)
    required to specify the value of x (assuming we choose an efficient coding scheme)
    as a result of using _q_(x) instead of the true distribution _p_(x) is given by


    ```

    \(\mathrm{KL}(p\|q)=-\int p(x)\ln q(x)\mathrm{d}x-\left(-\int p(x)\ln p(x)\mathrm{d}x\right)\)

    \(=-\int p(x)\ln\left\{\frac{q(x)}{p(x)}\right\}\mathrm{d}x.\) (1.113)

    ```


    This is known as the _relative entropy_ or _Kullback-Leibler divergence_, or _KL
    divergence_ (Kullback and Leibler, 1951), between the distributions _p_(x) and
    _q_(x). Note that it is not a symmetrical quantity, that is to say \(\mathrm{KL}(p\|q)\neq\mathrm{KL}(q\|p)\).'
  merge: -1
  img_proc: true
