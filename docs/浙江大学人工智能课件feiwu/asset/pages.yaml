- pgno: 727
  md: '# # Information theory: entropy


    We can interpret the bins as the states \( x_i \) of a discrete random variable
    \( X \), where \( p(X = x_i) = p_i \). The entropy of the random variable \( X
    \) is then


    \( H[p] = -\sum_i p(x_i) \ln p(x_i). \) (1.98)


    Distributions \( p(x_i) \) that are sharply peaked around a few values will have
    a relatively low entropy, whereas those that are spread more evenly across many
    values will have higher entropy, as illustrated in Figure 1.30. Because \( 0 \leqslant
    p_i \leqslant 1 \), the entropy is nonnegative, and it will equal its minimum
    value of 0 when one of the \( p_i = 1 \) and all other \( p_{j \neq i} = 0 \).
    The maximum entropy configuration can be found by maximizing \( H \) using a Lagrange
    multiplier to enforce the normalization constraint on the probabilities. Thus
    we maximize


    \( \tilde{H} = -\sum_i p(x_i) \ln p(x_i) + \lambda \left( \sum_i p(x_i) - 1 \right)
    \) (1.99)


    from which we find that all of the \( p(x_i) \) are equal and are given by \(
    p(x_i) = 1/M \) where \( M \) is the total number of states \( x_i \). The corresponding
    value of the entropy is then \( H = \ln M \). This result can also be derived
    from Jensen’s inequality (to be discussed shortly). To verify that the stationary
    point is indeed a maximum, we can


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_727_0.png)


    Figure 1.30 Histograms of two probability distributions over 30 bins illustrating
    the higher value of the entropy H for the broader distribution. The largest entropy
    would arise from a uniform distribution that would give H = −ln(1/30) = 3.40.'
  merge: -1
  img_proc: true
- pgno: 728
  md: '# # Relative entropy and mutual information


    So far in this section, we have introduced a number of concepts from information
    theory, including the key notion of entropy. We now start to relate these ideas
    to pattern recognition. Consider some unknown distribution _p_(x), and suppose
    that we have modelled this using an approximating distribution _q_(x). If we use
    _q_(x) to construct a coding scheme for the purpose of transmitting values of
    x to a receiver, then the average _additional_ amount of information (in nats)
    required to specify the value of x (assuming we choose an efficient coding scheme)
    as a result of using _q_(x) instead of the true distribution _p_(x) is given by


    ```

    \(\mathrm{KL}(p\|q)=-\int p(x)\ln q(x)\mathrm{d}x-\left(-\int p(x)\ln p(x)\mathrm{d}x\right)\)

    \(=-\int p(x)\ln\left\{\frac{q(x)}{p(x)}\right\}\mathrm{d}x.\) (1.113)

    ```


    This is known as the _relative entropy_ or _Kullback-Leibler divergence_, or _KL
    divergence_ (Kullback and Leibler, 1951), between the distributions _p_(x) and
    _q_(x). Note that it is not a symmetrical quantity, that is to say \(\mathrm{KL}(p\|q)\neq\mathrm{KL}(q\|p)\).'
  merge: -1
  img_proc: true
