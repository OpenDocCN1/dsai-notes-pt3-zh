    +   - Two classes (K=2):

    +     - Target variable t ∈ {0, 1}, t=1 represents class C₁, else class C₂

    +   - K-classes (K>2):

    +     - 1-of-K coding scheme: t = (0, 1, 0, 0, 0)ᵀ

