- pgno: 746
  md: "# # Example problem: 8-puzzle\n\n+   ## The standard formulation of 8-puzzle\
    \ problem\n+   \n+   * **States**: A state description specifies the location\
    \ of each of the eight tiles and the blank in one of the nine squares.\n+   *\
    \ **Initial state**: Any state can be designated as the initial state. Note that\
    \ any given goal can be reached from exactly half of the possible initial states\
    \ (Exercise 3.4).\n+   * **Actions**: The simplest formulation defines the actions\
    \ as movements of the blank space Left, Right, Up, or Down. Different subsets\
    \ of these are possible depending on where the blank is.\n+   * **Transition model**:\
    \ Given a state and action, this returns the resulting state; for example, if\
    \ we apply Left to the start state in Figure 3.4, the resulting state has the\
    \ 5 and the blank switched.\n+   * **Goal test**: This checks whether the state\
    \ matches the goal configuration shown in Figure 3.4. (Other goal configurations\
    \ are possible.)\n+   * **Path cost**: Each step costs 1, so the path cost is\
    \ the number of steps in the path."
  merge: -1
  img_proc: true
- pgno: 747
  md: '# # Example problem: 8-puzzle


    # ## The sizes of states


    States: configurations of tiles


    Operators: move one tile Up/Down/Left/Right


    +   - There are \( 9! = 362,880 \) possible states (all permutations of \( [\square,
    1, 2, 3, 4, 5, 6, 7, 8] \)).

    +   - There are \( 16! \) possible states for 15-puzzle.

    +   - Not all states are directly reachable from a given state. (In fact, exactly
    half of them are reachable from a given state.)


    The 8-puzzle belongs to the family of **sliding-block puzzles**, which are often
    used as test problems for new search algorithms in AI. This family is known to
    be NP-complete, so one does not expect to find methods significantly better in
    the worst case than the search algorithms described in this chapter and the next.
    The 8-puzzle has \( 9!/2 = 181,440 \) reachable states and is easily solved. The
    15-puzzle (on a \( 4 \times 4 \) board) has around 1.3 trillion states, and random
    instances can be solved optimally in a few milliseconds by the best search algorithms.
    The 24-puzzle (on a \( 5 \times 5 \) board) has around \( 10^{25} \) states, and
    random instances take several hours to solve optimally.'
  merge: -1
  img_proc: true
