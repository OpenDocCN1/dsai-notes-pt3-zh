- pgno: 1046
  md: '# # Maximum likelihood and least squares


    +   • Assume:


    \( t = y(x, \mathbf{w}) + \epsilon \qquad y(x, \mathbf{w}) = \sum_{j=0}^{M-1}
    w_j \phi_j(x) = \mathbf{w}^T \phi(x) \)


    +   • Thus:


    \( p(t|x, \mathbf{w}, \beta) = \mathcal{N}(t|y(x, \mathbf{w}), \beta^{-1}) \implies
    \mathbb{E}[t|x] = \int tp(t|x) \, dt = y(x, \mathbf{w}) \)


    +   • For data set \(\mathbf{X} = \{\mathbf{x}_1, \dots, \mathbf{x}_N\}\) and
    target vector \(\mathbf{t} = (t_1, \dots, t_N)^T\), the likelihood function:


    \( p(\mathbf{t}|\mathbf{X}, \mathbf{w}, \beta) = \prod_{n=1}^N \mathcal{N}(t_n|\mathbf{w}^T
    \phi(\mathbf{x}_n), \beta^{-1}) \)


    \( \ln p(\mathbf{t}|\mathbf{w}, \beta) = \sum_{n=1}^N \ln \mathcal{N}(t_n|\mathbf{w}^T
    \phi(\mathbf{x}_n), \beta^{-1}) = \frac{N}{2} \ln \beta - \frac{N}{2} \ln(2\pi)
    - \beta E_D(\mathbf{w}) \)


    SSE: sum-of-squares error function


    \( E_D(\mathbf{w}) = \frac{1}{2} \sum_{n=1}^N \{t_n - \mathbf{w}^T \phi(\mathbf{x}_n)\}^2
    = \frac{1}{2} \|\mathbf{t} - \Phi \mathbf{w}\|^2 \)'
