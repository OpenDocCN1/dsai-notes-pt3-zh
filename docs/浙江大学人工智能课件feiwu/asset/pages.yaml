- pgno: 828
  md: '# # Problem-Solving by Search


    +   - In this part, we show how an agent can act by establishing goals and considering
    sequences of actions that might achieve those goals.

    +     - **Goal** is a set of world states, in which the goal is satisfied.

    +     - **Goal formulation** is the 1<sup>st</sup> step in problem-solving, based
    on the current situation and the agent''s performance measure.

    +     - **Problem formulation** is the process of deciding what actions and states
    to consider, given a goal.

    +     - **Search** is the process of looking for a sequence of actions that reaches
    the goal. A search algorithm takes a problem as input and returns a solution in
    the form of an action sequence.

    +     - **Execution** phase: once a solution is found, the actions it recommends
    can be carried out.

    +     - E.g. PSA with the design of “_formulate—search—execution_”'
  merge: -1
  img_proc: true
- pgno: 829
  md: "# Problem-Solving by Search\n\n+   - PSA with **“formulate—search—execution”**\n\
    \n```\nfunction SIMPLE-PROBLEM-SOLVING-AGENT(percept) returns an action\npersistent:\
    \ seq, an action sequence, initially empty\n           state, some description\
    \ of the current world state\n           goal, a goal, initially null\n      \
    \     problem, a problem formulation\n\nstate ← UPDATE-STATE(state, percept)\n\
    if seq is empty then\n    goal ← FORMULATE-GOAL(state)\n    problem ← FORMULATE-PROBLEM(state,\
    \ goal)\n    seq ← SEARCH(problem)\n    if seq = failure then return a null action\n\
    action ← FIRST(seq)\nseq ← REST(seq)\nreturn action\n```\n\n> **Figure 3.1** A\
    \ simple problem-solving agent. It first formulates a goal and a problem, searches\
    \ for a sequence of actions that would solve the problem, and then executes the\
    \ actions one at a time. When this is complete, it formulates another goal and\
    \ starts over."
