    **Fig. 1** Overview of backpropagation. (a) Training pattern is fed forward, generating
    corresponding output. (b) Error between actual and desired output is computed.
    (c) The error propagates back, through updates where a ratio of the gradient \(\frac{\partial
    E}{\partial w_i}\) is subtracted from each weight. \(x_i\), \(w_i\), \(\phi\)
    are the inputs, input weights, and activation function of a neuron. Error _E_
    is computed from output _y_ and desired output _t_. \(\eta\) is the learning rate.'
