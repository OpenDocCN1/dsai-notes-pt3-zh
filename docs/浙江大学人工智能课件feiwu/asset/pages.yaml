  md: '# # Curve fitting re-visited


    +   - More Bayesian approach:


    \(p(\mathbf{t}|\mathbf{x}, \mathbf{w}, \beta) = \prod_{n=1}^N \mathcal{N} \left(t_n|y(x_n,
    \mathbf{w}), \beta^{-1}\right)\)


    \(p(\mathbf{w}|\mathbf{x}, \mathbf{t}, \alpha, \beta) \propto p(\mathbf{t}|\mathbf{x},
    \mathbf{w}, \beta)p(\mathbf{w}|\alpha)\)


    \(p(\mathbf{w}|\alpha) = \mathcal{N}(\mathbf{w}|\mathbf{0}, \alpha^{-1}\mathbf{I})
    = \left(\frac{\alpha}{2\pi}\right)^{(M+1)/2} \exp \left\{-\frac{\alpha}{2}\mathbf{w}^\mathrm{T}\mathbf{w}\right\}\)


    \(\ln p(\mathbf{t}|\mathbf{x}, \mathbf{w}, \beta) = -\frac{\beta}{2} \sum_{n=1}^N
    \{y(x_n, \mathbf{w}) - t_n\}^2 + \frac{N}{2} \ln \beta - \frac{N}{2} \ln(2\pi)\)


    \(\frac{\beta}{2} \sum_{n=1}^N \{y(x_n, \mathbf{w}) - t_n\}^2 + \frac{\alpha}{2}\mathbf{w}^\mathrm{T}\mathbf{w}\)


    maximizing the posterior distribution is equivalent to minimizing the regularized
    sum-of-squares error function encountered earlier in the form (1.4), with a regularization
    parameter given by \(\lambda = \alpha/\beta\).


