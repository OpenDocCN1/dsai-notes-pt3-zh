- pgno: 1072
  md: '# Three classification approaches


    +   - **Generative approach:**

    +     - Model the class-conditional densities and the class priors

    +     - Compute posterior probabilities through Bayes’s theorem


    Compare the probability of the input under separate, class-specific, generative
    models


    Model both the class conditional densities $p(x|C_k)$, and the prior class probabilities
    $p(C_k)$


    Compute posterior using Bayes’ theorem


    $$p(C_k|x)=\frac{p(x|C_k)p(C_k)}{p(x)}=\frac{p(x|C_k)p(C_k)}{\sum_j p(x|C_j)p(C_j)}$$


    +   - **Discriminative approach:**

    +     - Directly training posterior probabilities.


    Discriminative Approach: Model $p(C_k|x)$, directly, for example by representing
    them as parametric models, and optimize for parameters using the training set
    (e.g. logistic regression).'
