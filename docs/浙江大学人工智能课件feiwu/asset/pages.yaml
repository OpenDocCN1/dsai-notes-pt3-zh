- pgno: 973
  md: '# # The Gaussian Distribution


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_973_0.png)


    For the case of a single real-valued variable _x_, the Gaussian distribution is
    defined by


    \(\mathcal{N}\left(x|\mu, \sigma^2\right) = \frac{1}{(2\pi\sigma^2)^{1/2}} \exp
    \left\{-\frac{1}{2\sigma^2}(x-\mu)^2\right\}\) (1.46)


    which is governed by two parameters: \(\mu\), called the **mean**, and \(\sigma^2\),
    called the **variance**. The square root of the variance, given by \(\sigma\),
    is called the **standard deviation**, and the reciprocal of the variance, written
    as \(\beta = 1/\sigma^2\), is called the **precision**. We shall see the motivation
    for these terms shortly. Figure 1.13 shows a plot of the Gaussian distribution.


    From the form of (1.46) we see that the Gaussian distribution satisfies


    \(\mathcal{N}(\mu|\mu, \sigma^2) > 0.\) (1.47)


    Also it is straightforward to show that the Gaussian is normalized, so that


    \(\int_{-\infty}^{\infty} \mathcal{N}\left(x|\mu, \sigma^2\right) dx = 1.\) (1.48)


    Thus (1.46) satisfies the two requirements for a valid probability density.


    \(\beta = 1/\sigma^2\) (precision – the bigger \(\beta\) is, the smaller \(\sigma\)
    is, thus the more “precise” the distribution is.)'
  merge: -1
  img_proc: true
- pgno: 974
  md: '# # The Gaussian Distribution


    We can readily find expectations of functions of $x$ under the Gaussian distribution.
    In particular, the average value of $x$ is given by


    $$\mathbb{E}[x] = \int_{-\infty}^{\infty} \mathcal{N}(x\mid\mu,\sigma^2)\,x\,dx
    = \mu. \tag{1.49}$$


    Because the parameter $\mu$ represents the average value of $x$ under the distribution,
    it is referred to as the mean. Similarly, for the second order moment


    $$\mathbb{E}[x^2] = \int_{-\infty}^{\infty} \mathcal{N}(x\mid\mu,\sigma^2)\,x^2\,dx
    = \mu^2 + \sigma^2. \tag{1.50}$$


    From (1.49) and (1.50), it follows that the variance of $x$ is given by


    $$\operatorname{var}[x] = \mathbb{E}[x^2] - \mathbb{E}[x]^2 = \sigma^2. \tag{1.51}$$


    and hence $\sigma^2$ is referred to as the variance parameter. The maximum of
    a distribution is known as its mode. For a Gaussian, the mode coincides with the
    mean.


    We are also interested in the Gaussian distribution defined over a $D$-dimensional
    vector $x$ of continuous variables, which is given by


    $$\mathcal{N}(x\mid\mu,\Sigma) = \frac{1}{(2\pi)^{D/2}|\Sigma|^{1/2}}\exp\left\{-\frac{1}{2}(x-\mu)^\mathrm{T}\Sigma^{-1}(x-\mu)\right\}.
    \tag{1.52}$$


    where the $D$-dimensional vector $\mu$ is called the mean, the $D\times D$ matrix
    $\Sigma$ is called the covariance, and $|\Sigma|$ denotes the determinant of $\Sigma$.
    We shall make use of the multivariate Gaussian distribution briefly in this chapter,
    although its properties will be studied in detail in Section 2.3.'
