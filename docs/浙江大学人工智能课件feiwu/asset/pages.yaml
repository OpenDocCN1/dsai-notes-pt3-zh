- pgno: 763
  md: "# # Breadth-first search\n\n**Breadth-first search** is a simple strategy in\
    \ which the root node is expanded first, then all the successors of the root node\
    \ are expanded next, then _their_ successors, and so on. In general, all the nodes\
    \ are expanded at a given depth in the search tree before any nodes at the next\
    \ level are expanded.\n\n```\n```\nfunction BREADTH-FIRST-SEARCH(problem) returns\
    \ a solution, or failure\n  node ← a node with STATE = problem.INITIAL-STATE,\
    \ PATH-COST = 0\n  if problem.GOAL-TEST(node.STATE) then return SOLUTION(node)\n\
    \  frontier ← a FIFO queue with node as the only element\n  explored ← an empty\
    \ set\n  loop do\n    if EMPTY?(frontier) then return failure\n    node ← POP(frontier)\
    \ /* chooses the shallowest node in frontier */\n    add node.STATE to explored\n\
    \    for each action in problem.ACTIONS(node.STATE) do\n      child ← CHILD-NODE(problem,\
    \ node, action)\n      if child.STATE is not in explored or frontier then\n  \
    \      if problem.GOAL-TEST(child.STATE) then return SOLUTION(child)\n       \
    \ frontier ← INSERT(child, frontier)\n```\n```\n\nFigure 3.11 Breadth-first search\
    \ on a graph."
  merge: -1
  img_proc: true
