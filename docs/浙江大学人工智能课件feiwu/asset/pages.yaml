- pgno: 1017
  md: '# Jacobian factor or matrix


    Under a nonlinear change of variable, a probability density transforms differently
    from a simple function, due to the Jacobian factor. For instance, if we consider
    a change of variables $x = g(y)$, then a function $f(x)$ becomes $\tilde{f}(y)
    = f(g(y))$. Now consider a probability density $p_x(x)$ that corresponds to a
    density $p_y(y)$ with respect to the new variable $y$, where the suffices denote
    the fact that $p_x(x)$ and $p_y(y)$ are different densities. Observations falling
    in the range $(x, x + \delta x)$ will, for small values of $\delta x$, be transformed
    into the range $(y, y + \delta y)$ where $p_x(x)\delta x \simeq p_y(y)\delta y$,
    and hence


    $$p_y(y)=p_x(x)\left|\frac{dx}{dy}\right|=p_x(g(y))\left|g''(y)\right|.$$


    $$\Delta^2=\sum_{i=1}^{D}\frac{y_i^2}{\lambda_i},\qquad y_i=\mathbf{u}_i^\mathsf{T}(\mathbf{x}-\boldsymbol{\mu}),\qquad
    \mathbf{y}=\mathbf{U}(\mathbf{x}-\boldsymbol{\mu})\Rightarrow\mathbf{x}=\mathbf{U}^\mathsf{T}\mathbf{y}+\boldsymbol{\mu}\Rightarrow
    J_{ij}=\frac{\partial x_i}{\partial y_j}=U_{ji}.$$


    $$\Rightarrow\mathbf{J}=\mathbf{U}^\mathsf{T}\Rightarrow |\mathbf{J}|^2=|\mathbf{U}^\mathsf{T}|^2=|\mathbf{U}^\mathsf{T}|\,|\mathbf{U}|=|\mathbf{U}^\mathsf{T}\mathbf{U}|=|\mathbf{I}|=1\Rightarrow
    |\mathbf{J}|=1.$$


    $$|\boldsymbol{\Sigma}|^{1/2}=\prod_{j=1}^{D}\lambda_j^{1/2}\Rightarrow p(\mathbf{y})=p(\mathbf{x})|\mathbf{J}|=\prod_{j=1}^{D}\frac{1}{(2\pi\lambda_j)^{1/2}}\exp\left\{-\frac{y_j^2}{2\lambda_j}\right\}.$$'
  merge: -1
  img_proc: true
