- pgno: 676
  md: '# # Intuitive interpretation of Bayes’ theorem


    We can provide an important interpretation of Bayes’ theorem as follows. If we
    had been asked which box had been chosen before being told the identity of the
    selected item of fruit, then the most complete information we have available is
    provided by the probability _p_(_B_). We call this the _prior probability_ because
    it is the probability available _before_ we observe the identity of the fruit.
    Once we are told that the fruit is an orange, we can then use Bayes’ theorem to
    compute the probability _p_(_B_|_F_), which we shall call the _posterior probability_
    because it is the probability obtained _after_ we have observed _F_. Note that
    in this example, the prior probability of selecting the red box was 4/10, so that
    we were more likely to select the blue box than the red one. However, once we
    have observed that the piece of selected fruit is an orange, we find that the
    posterior probability of the red box is now 2/3, so that it is now more likely
    that the box we selected was in fact the red one. This result accords with our
    intuition, as the proportion of oranges is much higher in the red box than it
    is in the blue box, and so the observation that the fruit was an orange provides
    significant evidence favouring the red box. In fact, the evidence is sufficiently
    strong that it outweighs the prior and makes it more likely that the red box was
    chosen rather than the blue one.


    Finally, we note that if the joint distribution of two variables factorizes into
    the product of the marginals, so that _p_(_X,Y_)=_p_(_X_)_p_(_Y_), then _X_ and
    _Y_ are said to be _independent_. From the product rule, we see that _p_(_Y_|_X_)=_p_(_Y_),
    and so the conditional distribution of _Y_ given _X_ is indeed independent of
    the value of _X_. For instance, in our boxes of fruit example, if each box contained
    the same fraction of apples and oranges, then _p_(_F_|_B_)=_P_(_F_), so that the
    probability of selecting, say, an apple is independent of which box is chosen.'
  merge: -1
  img_proc: true
