- pgno: 1032
  md: '# Bayesian Inference for the Gaussian


    2. Know the mean, to infer the variance: \(\lambda \equiv 1/\sigma^2\)


    Likelihood: \(p(\mathbf{X}\mid\lambda)=\prod_{n=1}^{N}\mathcal{N}(x_n\mid\mu,\lambda^{-1})\propto
    \lambda^{N/2}\exp\left\{-\frac{\lambda}{2}\sum_{n=1}^{N}(x_n-\mu)^2\right\}\)


    Prior: \(\mathrm{Gam}(\lambda\mid a_0,b_0)\)  *gamma distribution*


    Posterior: \(p(\lambda\mid\mathbf{X})\propto p(\mathbf{X}\mid\lambda)\,\mathrm{Gam}(\lambda\mid
    a_0,b_0)\)


    \(p(\lambda\mid\mathbf{X})\propto \lambda^{a_0-1+N/2}\exp\left\{-b_0\lambda-\frac{\lambda}{2}\sum_{n=1}^{N}(x_n-\mu)^2\right\}\
    \rightarrow\ \mathrm{Gam}(\lambda\mid a_N,b_N)\)


    \(a_N=a_0+\frac{N}{2}\)


    \(b_N=b_0+\frac{1}{2}\sum_{n=1}^{N}(x_n-\mu)^2=b_0+\frac{N}{2}\sigma^2_{\mathrm{ML}}\)


    \(\mathrm{Gam}(\lambda\mid a,b)=\frac{1}{\Gamma(a)}b^a\lambda^{a-1}\exp(-b\lambda)\)'
  merge: -1
  img_proc: true
- pgno: 1033
  md: '# # Bayesian Inference for the Gaussian


    # ## 3. Both unknown, to infer the mean and the variance: \(\lambda \equiv 1/\sigma^2\)


    Likelihood: \(p(\mathbf{X}|\mu, \lambda) = \prod_{n=1}^N \left(\frac{\lambda}{2\pi}\right)^{1/2}
    \exp \left\{-\frac{\lambda}{2}(x_n - \mu)^2\right\}\)


    \(\propto \left[\lambda^{1/2} \exp \left(-\frac{\lambda\mu^2}{2}\right)\right]^N
    \exp \left\{\lambda\mu \sum_{n=1}^N x_n - \frac{\lambda}{2} \sum_{n=1}^N x_n^2\right\}\)


    Conjugate Prior: \(p(\mu, \lambda) \propto \left[\lambda^{1/2} \exp \left(-\frac{\lambda\mu^2}{2}\right)\right]^\beta
    \exp \{c\lambda\mu - d\lambda\}\)


    \(\mu_0 = c/\beta\)

    \(a = 1 + \beta/2\)

    \(b = d - c^2/2\beta\)


    \(= \exp \left\{-\frac{\beta\lambda}{2}(\mu - c/\beta)^2\right\} \lambda^{\beta/2}
    \exp \left\{-\left(d - \frac{c^2}{2\beta}\right)\lambda\right\}\)

    \(= \mathcal{N}(\mu|\mu_0, (\beta\lambda)^{-1}) \text{Gam}(\lambda|a, b) \quad
    \text{normal-gamma or Gaussian-gamma}\)


    Posterior: \(p(\mu, \lambda|\mathbf{X}) \propto p(\mathbf{X}|\mu, \lambda)p(\mu,
    \lambda)\)'
