  md: '# Two classes


    +   - **Linear discriminant function:** \(y(\mathbf{x}) = \mathbf{w}^{\mathrm{T}}\mathbf{x}
    + w_0\)

    +     - if \(y(\mathbf{x}) \ge 0\), assign \(\mathbf{x}\) to class \(C_1\), else
    class \(C_2\)

    +     - decision surface \(\Omega\): \(y(\mathbf{x}) = 0\)

