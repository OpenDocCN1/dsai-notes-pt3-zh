  md: "# Biological inspiration: Modeling one neuron\n\n![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1105_0.png)\n\
    \n**Figure 18.19** A simple mathematical model for a neuron. The unit’s output\
    \ activation is $a_j = g(\\sum_{i=0}^{n} w_{i,j}a_i)$, where $a_i$ is the output\
    \ activation of unit $i$ and $w_{i,j}$ is the weight on the link from unit $i$\
    \ to this unit.\n\n![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1105_1.png)\n\n$in_j\
    \ = \\sum_{i=0}^{n} w_{i,j}a_i$\n\n+   - $a_j$: Activation value of unit $j$ \
    \ \n+   - $w_{i,j}$: Weight on link from unit $i$ to unit $j$  \n+   - $in_j$:\
    \ Weighted sum of inputs to unit $j$  \n+   - $a_i$: Activation value of unit\
    \ $i$  \n+   - $g$: Activation function"
