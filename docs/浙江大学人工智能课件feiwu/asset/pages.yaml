  md: '# # Three AI winters (setbacks)


    +   - The third AI winter: **the fall of expert system and Knowledge Engineering**


    +   - Expert system is a computer system that emulates the decision-making ability
    of a human expert. Expert systems are designed to solve complex problems by reasoning
    depending on one well-defined existing knowledge.


    +   - Cyc is an artificial intelligence project started in 1984 that attempts
    to assemble a comprehensive ontology and knowledge base of everyday common sense
    knowledge, with the goal of enabling AI applications to perform human-like reasoning
    ( [http://www.cyc.com/](http://www.cyc.com/) )'
