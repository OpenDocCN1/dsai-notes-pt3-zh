- pgno: 1257
  md: '# ConvNet Architecture


    +   - **Normalization Layer**

    +     - Many types of normalization layers have been proposed for use in ConvNet
    architectures, sometimes with the intentions of implementing inhibition schemes
    observed in the biological brain. However, these layers have recently fallen out
    of favor because in practice their contribution has been shown to be minimal,
    if any.


    +   - **Fully-connected layer**

    +     - Neurons in a fully connected layer have full connections to all activations
    in the previous layer, as seen in regular Neural Networks. Their activations can
    hence be computed with a matrix multiplication followed by a bias offset.'
  merge: -1
  img_proc: true
- pgno: 1258
  md: '# ConvNet Architecture


    +   - Any FC layer can be converted to a CONV layer

    +     - For example, an FC layer with K=4096 that is looking at some input volume
    of size 7×7×512 can be equivalently expressed as a CONV layer with F=7,P=0,S=1,K=4096.

    +     - In other words, we are setting the filter size to be exactly the size
    of the input volume, and hence the output will simply be 1×1×4096 since only a
    single depth column "fits" across the input volume, giving identical result as
    the initial FC layer

    +     - By converting FC layers to CONV layers, we can build a *Fully Convolutional
    Networks*'
  merge: -1
  img_proc: true
