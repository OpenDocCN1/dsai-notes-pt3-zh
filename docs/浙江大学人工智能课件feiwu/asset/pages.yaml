  md: "# # Iterative deepening depth-first search\n\n# ## Iterative deepening search\
    \ (IDS)\n\n```\n```\nfunction ITERATIVE-DEEPENING-SEARCH(problem) returns a solution,\
    \ or failure\n  for depth = 0 to ∞ do\n    result ← DEPTH-LIMITED-SEARCH(problem,\
    \ depth)\n    if result ≠ cutoff then return result\n```\n```\n\n**Figure 3.18**\
    \ The iterative deepening search algorithm, which repeatedly applies depth-limited\
    \ search with increasing limits. It terminates when a solution is found or if\
    \ the depth-limited search returns failure, meaning that no solution exists.\n\
    \n+   - the total number of nodes generated in the worst case is:\n+     \n+ \
    \    N(IDS) = (d)b + (d − 1)b² + ⋯ + (1)bᵈ\n\n+   - E.g. b=10, d=5\n+     - N(IDS)\
    \ = 50 + 400 + 3,000 + 20,000 + 100,000 = 123,450\n+     - N(BFS) = 10 + 100 +\
