- pgno: 673
  md: '# # Bayes’ Theorem


    From the product rule, together with the symmetry property \(p(X, Y) = p(Y, X)\),
    we immediately obtain the following relationship between conditional probabilities


    \(p(Y \mid X) = \frac{p(X \mid Y)p(Y)}{p(X)}\) (1.12)


    which is called _Bayes’ theorem_ and which plays a central role in pattern recognition
    and machine learning. Using the sum rule, the denominator in Bayes’ theorem can
    be expressed in terms of the quantities appearing in the numerator


    \(p(X) = \sum_Y p(X \mid Y)p(Y).\) (1.13)


    We can view the denominator in Bayes’ theorem as being the normalization constant
    required to ensure that the sum of the conditional probability on the left-hand
    side of (1.12) over all values of _Y_ equals one.


    Given this definition of likelihood, we can state Bayes’ theorem in words


    posterior \(\propto\) likelihood \(\times\) prior (1.44)


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_673_0.png)


    Thomas Bayes 1701–1761 Thomas Bayes was born in Tunbridge Wells and was a clergyman
    as well as an amateur scientist and a mathematician. He studied logic and theology
    at Edinburgh University Royal Society in 1742. and was elected Fellow of the Royal
    Society in 1742. During the 18th century, issues regarding probability arose in
    connection with gambling and with the new concept of insurance. One particularly
    important problem concerned so-called inverse probability. A solution was proposed
    by Thomas Bayes in his paper ‘Essay towards solving a problem in the doctrine
    of chances’, which was published in 1764, some three years after his death, in
    the _Philosophical Transactions of the Royal Society_. In fact, Bayes only formulated
    his theory for the case of a uniform prior, and it was Pierre-Simon Laplace who
    independently rediscovered the theory in general form and who demonstrated its
    broad applicability.'
  merge: -1
