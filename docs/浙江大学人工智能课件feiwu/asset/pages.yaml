- pgno: 62
  md: '# # Monte-Carlo Planning


    For each simulation :


    +   - Traverse the tree using a _tree policy_ (trading off _exploration_ and _exploitation_)
    until a leaf node is reached


    +   - Run a _rollout_ using a _default policy_ (e.g., random moves) until a terminal
    state is reached


    +   - Update the value estimates of nodes along the path to reflect the win percentage
    of simulations passing through that node


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_62_0.png)


    a rollout-based algorithm builds its lookahead tree by repeatedly sampling episodes
    from the initial state. An episode is a sequence of state-action-reward triplets
    that are obtained using the domains generative model. The tree is built by adding
    the information gathered during an episode to it in an incremental manner.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Monte-Carlo Planning


    +   - **Selection:**

    +     - starting at the root node, a child selection policy is recursively applied
    to descend through the tree until the most urgent expandable node is reached.
    A node is expandable if it represents a nonterminal state and has unvisited (i.e.
    unexpanded) children.


    +   - **Expansion:**

    +     - one (or more) child nodes are added to expand the tree, according to the
    available actions.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# # Monte-Carlo Planning


    +   - **Simulation**:

    +     - A simulation is run from the new node(s). This step is sometimes also
    called playout or rollout.


    +   - **Backpropagation**:

    +     - The simulation result is “backed up” (i.e. backpropagated) through the
    selected nodes to update their statistics.'
  merge: -1
