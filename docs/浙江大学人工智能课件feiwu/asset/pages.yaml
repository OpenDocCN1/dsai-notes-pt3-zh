  md: '# # Calculation of Pi Using the Monte Carlo Method


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_55_0.png)


    +   - The blue circle square has an area of πr².

    +   - The gray square has an area of (2 × r)² = 4r².

    +   - The ratio of the circle area to square area is \(p = \frac{\pi r^2}{4r^2}
    = \frac{\pi}{4}\).

    +   - Therefore the value of π is 4×p.

    +   - The red square contains ¼ of blue and gray points so the ratio of points
    is the same (p).


    The implementation takes a random point inside the unit square of size 1×1 and
    checks if that point lies within the blue circle. The ratio of points inside the
    circle to all generated points is p. Multiplying p by 4 gives the approximate
    value of π.'
