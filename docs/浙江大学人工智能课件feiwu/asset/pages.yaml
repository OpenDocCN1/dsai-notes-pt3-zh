    \(\sigma(a) = \frac{1}{1 + \exp(-a)}\) (4.59)


    \(\sigma(-a) = 1 - \sigma(a)\) (4.60)


    as is easily verified. The inverse of the logistic sigmoid is given by


    \(a = \ln \left( \frac{\sigma}{1 - \sigma} \right)\) (4.61)


    and is known as the _logit_ function. It represents the log of the ratio of probabilities
    \(\ln \left[ p(C_1|\mathbf{x}) / p(C_2|\mathbf{x}) \right]\) for the two classes,
    also known as the _log odds_.'
