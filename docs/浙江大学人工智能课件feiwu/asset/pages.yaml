    Figure 4.9 Plot of the logistic sigmoid function \(\sigma(a)\) defined by (4.59),
    shown in red, together with the scaled probit function \(\Phi(\lambda a)\), for
    \(\lambda^2 = \pi/8\), shown in dashed blue, where \(\Phi(a)\) is defined by (4.114).
    The scaling factor \(\tau/8\) is chosen so that the derivatives of the two curves
