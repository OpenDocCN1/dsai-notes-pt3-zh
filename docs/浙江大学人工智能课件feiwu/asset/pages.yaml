  md: '# # Bayesian Inference for the Gaussian


    # ## 1. Known the variance, to infer the mean:


    Likelihood: \( p(\mathbf{X}|\mu) = \prod_{n=1}^N p(x_n|\mu) = \frac{1}{(2\pi\sigma^2)^{N/2}}
    \exp \left\{ - \frac{1}{2\sigma^2} \sum_{n=1}^N (x_n - \mu)^2 \right\} \)


    Prior: \( p(\mu) = \mathcal{N} \left( \mu | \mu_0, \sigma_0^2 \right) \)


    Posterior: \( p(\mu|\mathbf{X}) \propto p(\mathbf{X}|\mu)p(\mu) \)


    \( p(\mu|\mathbf{X}) = \mathcal{N} \left( \mu | \mu_N, \sigma_N^2 \right) \)


    \(\begin{aligned} \mu_N &= \frac{\sigma^2}{N\sigma_0^2 + \sigma^2}\mu_0 + \frac{N\sigma_0^2}{N\sigma_0^2
    + \sigma^2}\mu^\text{ML} \\ \frac{1}{\sigma_N^2} &= \frac{1}{\sigma_0^2} + \frac{N}{\sigma^2}
    \end{aligned}\)


