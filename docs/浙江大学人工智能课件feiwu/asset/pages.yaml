- pgno: 505
  md: "# # TAC Knowledge Base Population (KBP) 2016\n\nEvaluation: February-November,\
    \ 2016  \nWorkshop: November 14-15, 2016\n\nConducted by:  \nU.S. National Institute\
    \ of Standards and Technology (NIST)\n\nWith support from:  \nU.S. Department\
    \ of Defense\n\n# ## Overview\n\nThe Text Analysis Conference (TAC) is a series\
    \ of evaluation workshops organized to encourage research in Natural Language\
    \ Processing and related applications, by providing a large test collection, common\
    \ evaluation procedures, and a forum for organizations to share their results.\
    \ TAC comprises sets of tasks known as \"tracks,\" each of which focuses on a\
    \ particular subproblem of NLP. TAC tracks focus on end-user tasks, but also include\
    \ component evaluations situated within the context of end-user tasks.\n\nThe\
    \ goal of TAC Knowledge Base Population (KBP) is to develop and evaluate technologies\
    \ for populating knowledge bases (KBs) from unstructured text.\n\nThe end-to-end\
    \ Cold Start KBP task is to build a KB from scratch, using a predefined KB schema\
    \ and a collection of unstructured text. The current KB schema consists of entities\
    \ that can be a specific individual person (PER), organization (ORG), geopolitical\
    \ entity (GPE), location (LOC), or facility (FAC), and predefined attributes (a.k.a\
    \ \"slots\") for those entities. The submitted Cold Start KBs are evaluated by\
    \ applying a set of slot filling evaluation queries to each KB and assessing the\
    \ correctness of the relations found.\n\nIn addition to end-to-end Cold Start\
    \ KB construction, two diagnostic tasks and evaluations are offered:\n\n+   1.\
    \ Entity Discovery and Linking (EDL): The EDL task is to extract name and nominal\
    \ mentions of specific individual PER, ORG, GPE, LOC, and FAC entities mentioned\
    \ in the Cold Start document collection, and to link each mention to its KB node\
    \ (either a node in the TAC reference KB, or a newly created NIL node if it doesn't\
    \ have a corresponding KB entry).\n\n+   2. Slot Filling (SF): The slot filling\
    \ task is to search the Cold Start document collection to fill in values for specific\
    \ slots for specific entities.\n\nThe slot filler validation task in the validation-ensemble\
    \ track focuses on the refinement of output from slot filling systems by either\
    \ combining information from multiple slot filling systems, or applying more intensive\
    \ linguistic processing to validate candidate slot fillers."
  merge: -1
  img_proc: true
