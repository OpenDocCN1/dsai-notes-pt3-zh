    \ all players\n\nOnce the simulated reward of the newly expanded node is obtained,\
    \ it is backpropagated through the selected nodes in the selection step. The visit\
    \ counts are updated at the same time.\n\n```\n```\nfunction BACKUP(v, Δ)\nwhile\
    \ v is not null do\n    N(v) ← N(v) + 1\n    Q(v) ← Q(v) + Δ(v, p)\n    v ← parent\
    \ of v\n```\n```\n\nRecall the board game example, assume that the rewards of\
    \ winning and losing a game are 1 and 0, respectively. After applying the MCTS\
    \ algorithm, for each node v in the tree, Q(v) would be the number of wins that\
    \ is accumulated from N(v) visits of this node, and thus \\(\\frac{Q(v)}{N(v)}\\\
    ) would be the winning rate. This is exactly the information we could rely on\
    \ to choose the best action to take in the current state."
