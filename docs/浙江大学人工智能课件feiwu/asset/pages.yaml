    in two dimensions. The decision surface, shown in red, is perpendicular to **w**,
    and its displacement from the origin is controlled by the bias parameter \( w_0
    \). Also, the signed orthogonal distance of a general point **x** from the decision
    surface is given by \( y(x)/\|w\| \).


    \( \Omega \)


    \( \widetilde{w} = (w_0, \mathbf{w}) \quad \widetilde{x} = (x_0, \mathbf{x}) \)


