  md: "# Monte-Carlo Tree Search\n\n# UCT Algorithm\n\n**S**: The set of states.\n\
    \n**A(s)**: The set of valid and unvisited actions for state *s*.\n\n**s(v)**:\
    \ The state that *v* represents.\n\n**a(v)**: The action that leading to *v*.\n\
    \n**f**: S × A → S, the state transition function.\n\n**N(v)**: The number of\
    \ times node *v* has been visited.\n\n**Q(v)**: The total reward for the action\
    \ leading to *v*.\n\n**Δ(v,p)**: The reward for the player *p* to move at node\
    \ *v*.\n\n```\nfunction UCTSEARCH(s₀)\n    create root node v₀ with state s₀\n\
    \    while within computational budget do\n        vₗ ← TREEPOLICY(v₀)\n     \
    \   Δ ← DEFAULTPOLICY(s(vₗ))\n        BACKUP(vₗ, Δ)\n    return a(BESTCHILD(v₀,\
    \ 0))\n```\n\n```\nfunction TREEPOLICY(v)\n    while v is not terminal do\n  \
    \      if v not fully expanded then\n            return EXPAND(v)\n        else\n\
    \            v ← BESTCHILD(v, Cₚ)\n    return v\n```\n\n```\nfunction DEFAULTPOLICY(s)\n\
    \    while s is non-terminal do\n        choose a ∈ A(s) uniformly at random\n\
    \        s ← f(s, a)\n    return reward for state s\n```\n\n```\nfunction BACKUP(v,\
    \ Δ)\n    while v is not null do\n        N(v) ← N(v) + 1\n        Q(v) ← Q(v)\
    \ + Δ(v, p)\n        v ← parent of v\n```\n\n```\nfunction EXPAND(v)\n    choose\
    \ a ∈ untried actions from A(s(v))\n    add a new child v′ to v\n        with\
    \ s(v′) = f(s(v), a)\n        and a(v′) = a\n    return v′\n```\n\n```\nfunction\
    \ BESTCHILD(v, c)\n    return arg max over v′ ∈ children of v [ Q(v′) / N(v′)\
    \ + c √(2 ln N(v) / N(v′)) ]\n```\n\n![](img/c69bfdf1f6addd09d49cae0440fcc5c7_116_0.png)"
