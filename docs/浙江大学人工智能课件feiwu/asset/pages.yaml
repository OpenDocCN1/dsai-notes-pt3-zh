    \(p(\mathbf{x}) = p(\mathbf{x}_a, \mathbf{x}_b) = p(\mathbf{x}_a|\mathbf{x}_b)p(\mathbf{x}_b)\)


    +   - If two sets of variables are jointly Gaussian, then the conditional distribution
    of one set conditioned on the other is again Gaussian.


    \(\mathbf{x} = \begin{pmatrix} \mathbf{x}_a \\ \mathbf{x}_b \end{pmatrix} \quad
    \boldsymbol{\mu} = \begin{pmatrix} \boldsymbol{\mu}_a \\ \boldsymbol{\mu}_b \end{pmatrix}
    \quad \boldsymbol{\Sigma} = \begin{pmatrix} \boldsymbol{\Sigma}_{aa} & \boldsymbol{\Sigma}_{ab}
    \\ \boldsymbol{\Sigma}_{ba} & \boldsymbol{\Sigma}_{bb} \end{pmatrix} \quad \boldsymbol{\Lambda}
    \equiv \boldsymbol{\Sigma}^{-1} \quad \boldsymbol{\Lambda} = \begin{pmatrix} \boldsymbol{\Lambda}_{aa}
    & \boldsymbol{\Lambda}_{ab} \\ \boldsymbol{\Lambda}_{ba} & \boldsymbol{\Lambda}_{bb}
    \end{pmatrix}\)


    covariance matrix


    precision matrix


    Both of \(\boldsymbol{\Sigma}\) and \(\boldsymbol{\Lambda}\) can be taken to be
    symmetric, without loss of generality.


    \(p(\mathbf{x}_a|\mathbf{x}_b) \longrightarrow -\frac{1}{2}(\mathbf{x} - \boldsymbol{\mu})^\mathrm{T}
    \boldsymbol{\Sigma}^{-1}(\mathbf{x} - \boldsymbol{\mu}) = -\frac{1}{2}\mathbf{x}^\mathrm{T}
    \boldsymbol{\Sigma}^{-1}\mathbf{x} + \mathbf{x}^\mathrm{T} \boldsymbol{\Sigma}^{-1}\boldsymbol{\mu}
    + \text{const}\)


    \(= -\frac{1}{2}(\mathbf{x}_a - \boldsymbol{\mu}_a)^\mathrm{T} \boldsymbol{\Lambda}_{aa}(\mathbf{x}_a
    - \boldsymbol{\mu}_a) - \frac{1}{2}(\mathbf{x}_a - \boldsymbol{\mu}_a)^\mathrm{T}
    \boldsymbol{\Lambda}_{ab}(\mathbf{x}_b - \boldsymbol{\mu}_b)\)


    completing the square


