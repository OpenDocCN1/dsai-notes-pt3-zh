- pgno: 922
  md: '# # Optimal Decisions in Games


    +   - In a normal search problem, the optimal solution would be a sequence of
    actions leading to a goal state—a terminal state that is a win.


    +   - In adversarial search, MIN has something to say about it. MAX therefore
    must find a contingent strategy, which specifies MAX’s move in the initial state,
    then MAX’s moves in the states resulting from every possible response by MIN,
    then MAX’s moves in the states resulting from every possible response by MIN to
    those moves, and so on. This is exactly analogous to the AND–OR search algorithm
    (Figure 4.11) with MAX playing the role of OR and MIN equivalent to AND. Roughly
    speaking, an optimal strategy leads to outcomes at least as good as any other
    strategy when one is playing an infallible opponent. We begin by showing how to
    find this optimal strategy.'
  merge: -1
  img_proc: true
- pgno: 923
  md: '# # Optimal Decisions in Games


    +   - Given a game tree, the optimal strategy can be determined from the **minimax
    value** of each node, which we write as MINIMAX(n). The minimax value of a node
    is the utility (**for MAX**) of being in the corresponding state, **_assuming
    that both players play optimally_** from there to the end of the game. Obviously,
    the minimax value of a terminal state is just its utility. Furthermore, given
    a choice, MAX prefers to move to a state of maximum value, whereas MIN prefers
    a state of minimum value. So we have the following:


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_923_0.png)


    **Figure 5.2** A two-ply game tree. The △ nodes are “MAX nodes,” in which it is
    MAX’s turn to move, and the ∇ nodes are “MIN nodes.” The terminal nodes show the
    utility values for MAX; the other nodes are labeled with their minimax values.
    MAX’s best move at the root is _a_<sub>1</sub>, because it leads to the state
    with the highest minimax value, and MIN’s best reply is _b_<sub>1</sub>, because
    it leads to the state with the lowest minimax value.'
