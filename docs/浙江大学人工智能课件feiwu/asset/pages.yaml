- pgno: 1045
  md: '# # Typical basis functions


    \(y(\mathbf{x}, \mathbf{w}) = \sum_{j=0}^{M-1} w_j \phi_j(\mathbf{x}) = \mathbf{w}^T
    \phi(\mathbf{x}) \quad \mathbf{w} = (w_0, \dots, w_{M-1})^T \quad \phi = (\phi_0,
    \dots, \phi_{M-1})^T\)


    \(\phi_0(\mathbf{x}) = 1\)


    +   - Polynomial basis function: \(\phi_j(x) = x^j\)


    +   - ‘Gaussian’ basis function: \(\phi_j(x) = \exp \left\{ -\frac{(x - \mu_j)^2}{2s^2}
    \right\}\)


    +   - sigmoid basis function: \(\phi_j(x) = \sigma \left( \frac{x - \mu_j}{s}
    \right) \quad \sigma(a) = \frac{1}{1 + \exp(-a)}\)


    +   - Fourier basis / wavelets basis


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1045_0.png)'
