  md: '# # Forward/backward computation


    +   - Once a graph is constructed, we can easily perform forward and backward
    computation to calculate derivatives


    +   - **Forward computation:**

    +     - Traverse the graph in a *topological order*, and fill a value of every
    node (compute the loss)


    +   - **Backward computation (backpropagation):**

    +     - Traverse the graph in a reverse order, and calculate derivatives at each
    node

    +     - automatically done if we know the derivative of the function at each node
    (auto differentiation)'
