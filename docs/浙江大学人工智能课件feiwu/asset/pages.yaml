    +   • Validation set: split train data into two part, one for training set, another
    for validation set


    +   • Choose model (e.g. order of polynomial) with minimum error on validation
    set


    +   • Use S-fold cross-validation when data are limited.


    +   – Leave-one-out cross-validation (LOO-CV)


    +   – E.g. 4-fold CV


    The technique of S-fold cross-validation, illustrated here for the case of S =
    4, involves taking the available data and partitioning it into S groups (in the
    simplest case these are of equal size). Then S − 1 of the groups are used to train
    a set of models that are then evaluated on the remaining group. This procedure
    is then repeated for all S possible choices for the held-out group, indicated
    here by the red blocks, and the performance scores from the S runs are then averaged.


