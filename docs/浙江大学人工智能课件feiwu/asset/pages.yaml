- pgno: 722
  md: '# # three distinct approaches to solving decision problems


    Let us consider the relative merits of these three alternatives. Approach (a)
    is the most demanding because it involves finding the joint distribution over
    both **x** and C<sub>k</sub>. For many applications, **x** will have high dimensionality,
    and consequently we may need a large training set in order to be able to determine
    the class-conditional densities to reasonable accuracy. Note that the class priors
    p(C<sub>k</sub>) can often be estimated simply from the fractions of the training
    set data points in each of the classes. One advantage of approach (a), however,
    is that it also allows the marginal density of data p(**x**) to be determined
    from (1.83). This can be useful for detecting new data points that have low probability
    under the model and for which the predictions may be of low accuracy, which is
    known as **outlier detection** or **novelty detection** (Bishop, 1994; Tarassenko,
    1995).


    However, if we only wish to make classification decisions, then it can be wasteful
    of computational resources, and excessively demanding of data, to find the joint
    distribution p(**x**, C<sub>k</sub>) when in fact we only really need the posterior
    probabilities p(C<sub>k</sub>|**x**), which can be obtained directly through approach
    (b). Indeed, the class- conditional densities may contain a lot of structure that
    has little effect on the posterior probabilities, as illustrated in Figure 1.27.
    There has been much interest in exploring the relative merits of generative and
    discriminative approaches to machine learning, and in finding ways to combine
    them (Jebara, 2004; Lasserre _et al._, 2006).


    An even simpler approach is (c) in which we use the training data to find a discriminant
    function f(**x**) that maps each **x** directly onto a class label, thereby combining
    the inference and decision stages into a single learning problem. In the example
    of Figure 1.27, this would correspond to finding the value of _x_ shown by the
    vertical green line, because this is the decision boundary giving the minimum
    probability of misclassification.'
  merge: -1
  img_proc: true
