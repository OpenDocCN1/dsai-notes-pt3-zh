  md: "# # Gaussian mixtures revisited\n\n\\(\\ln p(\\mathbf{X}|\\theta)=\\ln \\left\\\
    {\\sum_{\\mathbf{Z}} p(\\mathbf{X}, \\mathbf{Z}|\\theta) \\right\\} \\Longrightarrow\
    \ \\ln p(\\mathbf{X}|\\pi, \\mu, \\Sigma)=\\sum_{n=1}^N \\ln \\left\\{\\sum_{k=1}^K\
    \ \\pi_k \\mathcal{N}(\\mathbf{x}_n|\\mu_k, \\Sigma_k) \\right\\}\\)\n\n+   -\
    \ *For the incomplete data set {X}, the posterior distribution of the latent variables:*\n\
    +   \n+   \\(p(\\mathbf{x}|\\mathbf{z})=\\prod_{k=1}^K \\mathcal{N}(\\mathbf{x}|\\\
    mu_k, \\Sigma_k)^{z_k} \\quad p(\\mathbf{z})=\\prod_{k=1}^K \\pi_k^{z_k} \\Longrightarrow\
    \ p(\\mathbf{z}|\\mathbf{x}) \\propto p(\\mathbf{x}|\\mathbf{z})p(\\mathbf{z})=\\\
    prod_{k=1}^K \\left(\\pi_k \\mathcal{N}(\\mathbf{x}|\\mu_k, \\Sigma_k)\\right)^{z_k}\\\
    )\n+   \n+   \\(\\Longrightarrow p(\\mathbf{Z}|\\mathbf{X}, \\mu, \\Sigma, \\\
    pi) \\propto \\prod_{n=1}^N \\prod_{k=1}^K \\left[\\pi_k \\mathcal{N}(\\mathbf{x}_n|\\\
    mu_k, \\Sigma_k)\\right]^{z_{nk}}\\)\n\n+   - *Expectation:*\n+   \n+   \\(\\\
    mathbb{E}[z_{nk}] = \\frac{\\sum_{z_n} z_{nk} \\prod_{k'} \\left[\\pi_{k'} \\\
    mathcal{N}(\\mathbf{x}_n|\\mu_{k'}, \\Sigma_{k'})\\right]^{z_{nk'}}}{\\sum_{z_n}\
    \ \\prod_j \\left[\\pi_j \\mathcal{N}(\\mathbf{x}_n|\\mu_j, \\Sigma_j)\\right]^{z_{nj}}}\
    \ = \\frac{\\pi_k \\mathcal{N}(\\mathbf{x}_n|\\mu_k, \\Sigma_k)}{\\sum_{j=1}^K\
    \ \\pi_j \\mathcal{N}(\\mathbf{x}_n|\\mu_j, \\Sigma_j)} = \\gamma(z_{nk})\\)\n\
    +   \n+   - *We have:* \\(\\ln p(\\mathbf{X}, \\mathbf{Z}|\\mu, \\Sigma, \\pi)\
    \ = \\sum_{n=1}^N \\sum_{k=1}^K z_{nk} \\left\\{\\ln \\pi_k + \\ln \\mathcal{N}(\\\
    mathbf{x}_n|\\mu_k, \\Sigma_k) \\right\\}\\)\n+   \n+   \\(\\mathbb{E}_\\mathbf{Z}[\\\
    ln p(\\mathbf{X}, \\mathbf{Z}|\\mu, \\Sigma, \\pi)] = \\sum_{n=1}^N \\sum_{k=1}^K\
    \ \\gamma(z_{nk}) \\left\\{\\ln \\pi_k + \\ln \\mathcal{N}(\\mathbf{x}_n|\\mu_k,\
    \ \\Sigma_k) \\right\\}\\)\n\n\\(\\mu^\\text{old}, \\Sigma^\\text{old} \\text{and\
    \ } \\pi^\\text{old} \\Longrightarrow \\gamma(z_{nk}) \\Longrightarrow \\arg \\\
    max_{\\mu, \\Sigma, \\pi} \\mathbb{E}_\\mathbf{Z}[\\ln p(\\mathbf{X}, \\mathbf{Z}|\\\
    mu, \\Sigma, \\pi)] \\Longrightarrow \\mu^\\text{new}, \\Sigma^\\text{new} \\\
    text{and } \\pi^\\text{new}\\)"
