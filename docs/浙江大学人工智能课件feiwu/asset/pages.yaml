- pgno: 34
  md: '# Alpha-Beta Pruning: Move ordering


    The effectiveness of alpha–beta pruning is highly dependent on the order in which
    the states are examined. For example, in Figure 5.5(e) and (f), we could not prune
    any successors of D at all because the worst successors (from the point of view
    of MIN) were generated first. If the third successor of D had been generated first,
    we would have been able to prune the other two. This suggests that it might be
    worthwhile to try to examine first the successors that are likely to be best.


    If this can be done, then it turns out that alpha–beta needs to examine only O(b^(m/2))
    nodes to pick the best move, instead of O(b^m) for minimax. This means that the
    effective branching factor becomes √b instead of b—for chess, about 6 instead
    of 35. Put another way, alpha–beta can solve a tree roughly twice as deep as minimax
    in the same amount of time. If successors are examined in random order rather
    than best-first, the total number of nodes examined will be roughly O(b^(3m/4))
    for moderate b. For chess, a fairly simple ordering function (such as trying captures
    first, then threats, then forward moves, and then backward moves) gets you to
    within about a factor of 2 of the best-case O(b^(m/2)) result.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_34_0.png)


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_34_1.png)


    m is the maximum depth of the tree and b are legal moves at each point'
  merge: -1
  img_proc: true
