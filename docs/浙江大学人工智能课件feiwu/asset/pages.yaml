- pgno: 619
  md: '# # The Gaussian distribution in the new coordinate system


    Thus in the \( y_j \) coordinate system, the Gaussian distribution takes the form


    \( p(\mathbf{y}) = p(\mathbf{x})|\mathbf{J}| = \prod_{j=1}^D \frac{1}{(2\pi \lambda_j)^{1/2}}
    \exp \left\{ -\frac{y_j^2}{2\lambda_j} \right\} \tag{2.56} \)


    which is the product of \( D \) independent univariate Gaussian distributions.
    The eigenvectors therefore define a new set of shifted and rotated coordinates
    with respect to which the joint probability distribution factorizes into a product
    of independent distributions. The integral of the distribution in the \( y \)
    coordinate system is then


    \( \int p(\mathbf{y}) \, d\mathbf{y} = \prod_{j=1}^D \int_{-\infty}^\infty \frac{1}{(2\pi
    \lambda_j)^{1/2}} \exp \left\{ -\frac{y_j^2}{2\lambda_j} \right\} \, dy_j = 1
    \tag{2.57} \)


    where we have used the result (1.48) for the normalization of the univariate Gaussian.
    This confirms that the multivariate Gaussian (2.43) is indeed normalized.'
  merge: -1
