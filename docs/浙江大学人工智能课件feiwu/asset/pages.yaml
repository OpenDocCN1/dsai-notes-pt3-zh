  md: '# Training a RNN with Gradient Flow


    let’s try it out for W with the chain rule


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_388_0.png)


    $$\frac{\partial J}{\partial W}=\sum_t\frac{\partial J_t}{\partial W}$$


    so let’s take a single timestep $t$:


    $$\frac{\partial J_2}{\partial W}=\frac{\partial J_2}{\partial y_2}\frac{\partial
    y_2}{\partial s_2}\frac{\partial s_2}{\partial W}$$


    but wait...


    $$s_2=\tanh(Us_1+Wx_2)$$


    $s_1$ also depends on $W$ so we can’t just treat $\frac{\partial s_2}{\partial
