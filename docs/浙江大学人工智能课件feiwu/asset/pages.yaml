- pgno: 1107
  md: "# Biological inspiration: Modeling one neuron\n\nAn example code for forward-propagating\
    \ a single neuron might look as follows:\n\n```\n```python\nclass Neuron(object):\n\
    \    # ...\n\n    def forward(inputs):\n        \"\"\" assume inputs and weights\
    \ are 1-D numpy arrays and bias is a number \"\"\"\n        cell_body_sum = np.sum(inputs\
    \ * self.weights) + self.bias\n        firing_rate = 1.0 / (1.0 + math.exp(-cell_body_sum))\
    \ # sigmoid activation function\n        return firing_rate\n```\n```\n\nIn other\
    \ words, each neuron performs a dot product with the input and its weights, adds\
    \ the bias and applies the non-linearity (or activation function), in this case\
    \ the sigmoid, i.e., $\\sigma(x)=1/(1+e^{-x})$"
  merge: -1
  img_proc: true
