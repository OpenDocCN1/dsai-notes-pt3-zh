- pgno: 712
  md: '# # Minimizing the misclassification rate


    Suppose that our goal is simply to make as few misclassifications as possible.
    We need a rule that assigns each value of x to one of the available classes. Such
    a rule will divide the input space into regions R<sub>k</sub> called decision
    regions, one for each class, such that all points in R<sub>k</sub> are assigned
    to class C<sub>k</sub>. The boundaries between decision regions are called decision
    boundaries or decision surfaces. Note that each decision region need not be contiguous
    but could comprise some number of disjoint regions. We shall encounter examples
    of decision boundaries and decision regions in later chapters. In order to find
    the optimal decision rule, consider first of all the case of two classes, as in
    the cancer problem for instance. A mistake occurs when an input vector belonging
    to class C<sub>1</sub> is assigned to class C<sub>2</sub> or vice versa. The probability
    of this occurring is given by


    ```

    ```

    p(mistake) = p(x ∈ R<sub>1</sub>, C<sub>2</sub>) + p(x ∈ R<sub>2</sub>, C<sub>1</sub>)


    = ∫<sub>R<sub>1</sub></sub> p(x, C<sub>2</sub>) dx + ∫<sub>R<sub>2</sub></sub>
    p(x, C<sub>1</sub>) dx.   (1.78)

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 713
  md: '# # Minimizing the misclassification rate


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_713_0.png)


    **Figure 1.24** Schematic illustration of the joint probabilities _p_(_x,_C_<sub>k</sub>_)
    for each of two classes plotted against _x_, together with the decision boundary
    _x_ = x̃. Values of _x_ ≥ x̃ are classified as class C<sub>2</sub> and hence belong
    to decision region R<sub>2</sub>, whereas points _x_ < x̃ are classified as C<sub>1</sub>
    and belong to R<sub>1</sub>. Errors arise from the blue, green, and red regions,
    so that for _x_ < x̃ the errors are due to points from class C<sub>2</sub> being
    misclassified as C<sub>1</sub> (represented by the sum of the red and green regions),
    and conversely for points in the region _x_ ≥ x̃ the errors are due to points
    from class C<sub>1</sub> being misclassified as C<sub>2</sub> (represented by
    the blue region). As we vary the location x̃ of the decision boundary, the combined
    areas of the blue and green regions remain constant, whereas the size of the red
    region varies. The optimal choice for x̃ is where the curves for _p_(_x,_C<sub>1</sub>)
    and _p_(_x,_C<sub>2</sub>) cross, corresponding to x̃ = _x_<sub>0</sub>, because
    in this case the red region disappears. This is equivalent to the minimum misclassification
    rate decision rule, which assigns each value of _x_ to the class having the higher
    posterior probability _p_(C<sub>_k_</sub>|_x_).'
  merge: -1
