- pgno: 895
  md: '# # Informed (Heuristic) Search Strategies


    +   - **Best-first search**

    +     - Best-first search is an instance of the general TREE-SEARCH or GRAPH-SEARCH
    algorithm in which a node is selected for expansion based on an **evaluation function**,
    _f_(_n_).

    +     - The evaluation function is construed as a cost estimate, so the node with
    the lowest evaluation is expanded first.

    +     - The implementation of best-first graph search is identical to that for
    uniform-cost search (Figure 3.14), except for the use of _f_ instead of _g_ to
    order the priority queue.

    +     - The choice of _f_ determines the search strategy.'
  merge: -1
  img_proc: true
- pgno: 896
  md: '# # Informed (Heuristic) Search Strategies


    +   - How to choose a **evaluation function** _f_ ?


    +   - Most best-first algorithms include as a component of _f_ a **heuristic function**,
    denoted _h_(_n_): **estimated cost of the cheapest path from the state at node**
    _n_ **to a goal state**.


    +   - _(Notice that h_(_n_) _takes a node as input, but, unlike g_(_n_)_, it depends
    only on the state at that node.)_ For example, in Romania, one might estimate
    the cost of the cheapest path from Arad to Bucharest via the **straight-line distance**
    from Arad to Bucharest.


    +   - Heuristic functions are the most common form in which additional knowledge
    of the problem is imparted to the search algorithm.


    +   - For now, we consider _h_(_n_) to be **arbitrary**, **nonnegative**, **problem-specific**
    functions, with one constraint: if _n_ is a goal node, then _h_(_n_)=0.


    +   - **Greedy best-first search**: _f_(_n_) = _h_(_n_)'
  merge: -1
  img_proc: true
- pgno: 897
  md: '# # Greedy best-first search


    +   • Greedy best-first search tries to expand the node that is closest to the
    goal, on the grounds that this is likely to lead to a solution quickly


    Let us see how this works for route-finding problems in Romania; we use the **straight-line
    distance** heuristic, which we will call _h<sub>SLD</sub>_. If the goal is Bucharest,
    we need to know the straight-line distances to Bucharest, which are shown in Figure
    3.22. For example, _h<sub>SLD</sub>_(_In_(_Arad_)) = 366. Notice that the values
    of _h<sub>SLD</sub>_ cannot be computed from the problem description itself. Moreover,
    it takes a certain amount of experience to know that _h<sub>SLD</sub>_ is correlated
    with actual road distances and is, therefore, a useful heuristic.


