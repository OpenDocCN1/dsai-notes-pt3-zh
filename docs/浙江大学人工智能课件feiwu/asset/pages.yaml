- pgno: 575
  md: "# # Relation to least squares\n\n+   - The Fisher criterion can be obtained\
    \ as a special case of least squares if we consider following target coding scheme:\n\
    +     - The target for class _C_<sub>1</sub> to be _N/N_<sub>1</sub>, for class\
    \ _C_<sub>2</sub> to be -_N/N_<sub>2</sub>\n+     - The sum-of-squares error function:\n\
    +   \n+     $$E = \\frac{1}{2} \\sum_{n=1}^N \\left( \\mathbf{w}^T \\mathbf{x}_n\
    \ + w_0 - t_n \\right)^2$$\n\n\\(\\frac{\\partial E}{\\partial w_0} = \\sum_{n=1}^N\
    \ \\left( \\mathbf{w}^T \\mathbf{x}_n + w_0 - t_n \\right) = 0\\)\n\n\\(\\sum_{n=1}^N\
    \ t_n = N_1 \\frac{N}{N_1} - N_2 \\frac{N}{N_2} = 0\\)\n\n\\(\\Rightarrow w_0\
    \ = -\\mathbf{w}^T \\mathbf{m}\\)\n\n\\(\\mathbf{m} = \\frac{1}{N} \\sum_{n=1}^N\
    \ \\mathbf{x}_n = \\frac{1}{N} \\left( N_1 \\mathbf{m}_1 + N_2 \\mathbf{m}_2 \\\
    right)\\)\n\n\\(\\frac{\\partial E}{\\partial \\mathbf{w}} = \\sum_{n=1}^N \\\
    left( \\mathbf{w}^T \\mathbf{x}_n + w_0 - t_n \\right) \\mathbf{x}_n = 0\\)\n\n\
    \\(\\Rightarrow \\left( \\mathbf{S}_W + \\frac{N_1 N_2}{N} \\mathbf{S}_B \\right)\
    \ \\mathbf{w} = N \\left( \\mathbf{m}_1 - \\mathbf{m}_2 \\right)\\)\n\n\\(\\mathbf{S}_B\
    \ = \\left( \\mathbf{m}_2 - \\mathbf{m}_1 \\right) \\left( \\mathbf{m}_2 - \\\
    mathbf{m}_1 \\right)^T\\)\n\n\\(\\mathbf{w} \\propto \\mathbf{S}_W^{-1} \\left(\
    \ \\mathbf{m}_2 - \\mathbf{m}_1 \\right)\\)"
