- pgno: 94
  md: '# # Upper Confidence Bounds on Trees (UCT)


    +   • Applying this idea in an MCTS algorithm gives the Upper Confidence Bounds
    on Trees (UCT) algorithm due to Kocsis and Szepesvari [3], where Black''s UCB
    score Z(s; a) of an action a in state s is obtained by as following


    \(Z(s,a)=\frac{W(s,a)}{N(s,a)}+B(s,a),\)


    \(B(s,a)=C\sqrt{\frac{\log N(s)}{N(s,a)}},\)


    where \(C>0\) is a tuning constant, \(N(s,a)\) is the number of simulations in
    which move \(a\) was selected from state \(s\), \(W(s,a)\) is the total reward
    collected at terminal states during these simulations, \(N(s)=\sum_a N(s,a)\)
    is the number of simulations from state \(s\), and \(B(s,a)\) is the *exploration
    bonus*. Each move is scored by optimistically biasing the sample mean, by adding
    an exploration bonus. This bonus is largest for the actions that have been tried
    the least number of times, and are therefore the most uncertain. This encourages
    rarely explored moves to be tried more frequently.


    [3]L. Kocsis and C. Szepesvari, Bandit based Monte-Carlo planning, In 15th European
    Conference on Machine Learning (ECML), 282-293, 2006.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# # Upper Confidence Bounds on Trees (UCT)


    +   • Another view of UCT


    bandit problem. A child node \( j \) is selected to maximise:


    \( UCT = \overline{X}_j + 2C_p \sqrt{\frac{2 \ln n}{n_j}} \)


    where \( n \) is the number of times the current (parent) node has been visited,
    \( n_j \) the number of times child \( j \) has been visited and \( C_p > 0 \)
    is a constant. If more than one child node has the same maximal value, the tie
    is usually broken randomly [120]. The values of \( X_{i,t} \) and thus of \( \overline{X}_j
    \) are understood to be within \( [0, 1] \) (this holds true for both the UCB1
    and the UCT proofs). It is generally understood that \( n_j = 0 \) yields a UCT
    value of \( \infty \), so that previously unvisited children are assigned the
    largest possible value, to ensure that all children of a node are considered at
    least once before any child is expanded further. This results in a powerful form
    of **iterated local search**.


    There is an essential balance between the first (exploitation) and second (exploration)
    terms of the UCB equation. As each node is visited, the denominator of the exploration
    term increases, which decreases its contribution. On the other hand, if another
    child of the parent node is visited, the numerator increases and hence the exploration
    values of unvisited siblings increase. The exploration term ensures that each
    child has a non-zero probability of selection, which is essential given the random
    nature of the playouts. This also imparts an inherent **restart** property to
    the algorithm, as even low-reward children are guaranteed to be chosen eventually
    (given sufficient time), and hence different lines of play explored.


    The constant in the exploration term \( C_p \) can be adjusted to lower or increase
    the amount of exploration performed. The value \( C_p = 1/\sqrt{2} \) was shown
    by Kocsis and Szepesvári [120] to satisfy the Hoeffding inequality with rewards
    in the range \( [0, 1] \). With rewards outside this range, a different value
    of \( C_p \) may be needed and also certain enhancements<sup>9</sup> work better
    with a different value for \( C_p \) (7.1.3).'
  merge: -1
  img_proc: true
