- pgno: 6
  md: "# Our Agenda in Adversarial Search\n\n+   - **Minimax Search**: How to compute\
    \ an optimal strategy? Minimax is the canonical (and easiest to understand) algorithm\
    \ for solving games, i.e., computing an optimal strategy.\n+   - **Evaluation\
    \ Functions**: But what if we don’t have the time/memory to solve the entire game?\
    \ Given limited time, the best we can do is look ahead as far as we can. Evaluation\
    \ functions tell us how to evaluate the leaf states at the cut-off.\n+   - **Alpha-Beta\
    \ Pruning Search**: How to prune unnecessary parts of the tree? An essential improvement\
    \ over Minimax.\n+   - **Monte-Carlo Tree Search** (MCTS): An alternative form\
    \ of game search, based on sampling rather than exhaustive enumeration. The main\
    \ alternative to Alpha-Beta Search.\n\n**Alpha-Beta = state of the art in Chess**\
    \  \n**MCTS = state of the art in Go**"
  merge: -1
  img_proc: true
- pgno: 7
  md: '# # The definition of a game


    We first consider games with two players, whom we call MAX and MIN for reasons
    that will soon become obvious. MAX moves first, and then they take turns moving
    until the game is over. At the end of the game, points are awarded to the winning
    player and penalties are given to the loser. A game can be formally defined as
    a kind of search problem with the following elements:


    +   - S0: The initial state, which specifies how the game is set up at the start.

    +   - PLAYER(s): Defines which player has the move in a state.

    +   - ACTIONS(s): Returns the set of legal moves in a state.

    +   - RESULT(s, a): The transition model, which defines the result of a move.

    +   - TERMINAL-TEST(s): A terminal test, which is true when the game is over and
    false otherwise. States where the game has ended are called terminal states.

    +   - UTILITY(s, p): A utility function (also called an objective function or
    payoff function), defines the final numeric value for a game that ends in terminal
    state s for a player p. In chess, the outcome is a win, loss, or draw, with values
    +1, 0, or 1/2. Some games have a wider variety of possible outcomes; the payoffs
    in backgammon range from 0 to +192. A zero-sum game is (confusingly) defined as
    one where the total payoff to all players is the same for every instance of the
    game. Chess is zero-sum because every game has payoff of either 0 + 1, 1 + 0 or
    1/2 + 1/2. “Constant-sum” would have been a better term, but zero-sum is traditional
    and makes sense if you imagine each player is charged an entry fee of 1/2.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# # The definition of a game (tic-tac-toe)


    The initial state. ACTIONS function, and RESULT function define the game tree
    for the game—a tree where the nodes are game states and the edges are moves. Figure
    5.1 shows part of the game tree for tic-tac-toe (noughts and crosses). From the
    initial state, MAX has nine possible moves. Play alternates between MAX’s placing
    an X and MIN’s placing an O until we reach leaf nodes corresponding to terminal
    states such that one player has three in a row or all the squares are filled.
    The number on each leaf node indicates the utility value of the terminal state
    from the point of view of MAX; high values are assumed to be good for MAX and
    bad for MIN (which is how the players get their names).

    For tic-tac-toe the game tree is relatively small—fewer than 9! = 362,880 terminal
    nodes. But for chess there are over 10^40 nodes, so the game tree is best thought
    of as a theoretical construct that we cannot realize in the physical world. But
    regardless of the size of the game tree, it is MAX’s job to search for a good
    move. We use the term search tree for a tree that is superimposed on the full
    game tree, and examines enough nodes to allow a player to determine what move
    to make.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_8_0.png)


    Figure 5.1 A (partial) game tree for the game of tic-tac-toe. The top node is
    the initial state, and MAX moves first, placing an X in an empty square. We show
    part of the tree, giving alternating moves by MIN (O) and MAX (X), until we eventually
    reach terminal states, which can be assigned utilities according to the rules
    of the game.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# # Optimal Decisions in Games


    +   - In a normal search problem, the optimal solution would be a sequence of
    actions leading to a goal state—a terminal state that is a win.


    +   - In adversarial search, MIN has something to say about it. MAX therefore
    must find a contingent strategy, which specifies MAX’s move in the initial state,
    then MAX’s moves in the states resulting from every possible response by MIN,
    then MAX’s moves in the states resulting from every possible response by MIN to
    those moves, and so on. This is exactly analogous to the AND–OR search algorithm
    (Figure 4.11) with MAX playing the role of OR and MIN equivalent to AND. Roughly
    speaking, an optimal strategy leads to outcomes at least as good as any other
    strategy when one is playing an infallible opponent. We begin by showing how to
    find this optimal strategy.'
  merge: -1
  img_proc: true
- pgno: 10
  md: "# # Optimal Decisions in Games\n\nEven a simple game like tic-tac-toe is too\
    \ complex for us to draw the entire game tree on one page, so we will switch to\
    \ the trivial game in Figure 5.2. The possible moves for MAX at the root node\
    \ are labeled _a_<sub>1</sub>, _a_<sub>2</sub>, and _a_<sub>3</sub>. The possible\
    \ replies to _a_<sub>1</sub> for MIN are _b_<sub>1</sub>, _b_<sub>2</sub>, _b_<sub>3</sub>,\
    \ and so on. This particular game ends after one move each by MAX and MIN. (In\
    \ game parlance, we say that this tree is one move deep, consisting of two half-moves,\
    \ each of which is called a ply.) The utilities of the terminal states in this\
    \ game range from 2 to 14.\n\nGiven a game tree, the optimal strategy can be determined\
    \ from the **minimax value** of each node, which we write as MINIMAX(_n_). The\
    \ minimax value of a node is the utility (for MAX) of being in the corresponding\
    \ state, _assuming that both players play optimally_ from there to the end of\
    \ the game. Obviously, the minimax value of a terminal state is just its utility.\
    \ Furthermore, given a choice, MAX prefers to move to a state of maximum value,\
    \ whereas MIN prefers a state of minimum value. So we have the following:\n\n\
    MINIMAX(_s_) = \n\\(\\left\\{\\begin{array}{ c c }\nUTILITY(s) & \\text{if TERMINAL-TEST}(s)\
    \ \\\\\nmax_{a \\in Actions(s)} MINIMAX(RESULT(s,a)) & \\text{if PLAYER}(s) =\
    \ MAX \\\\\nmin_{a \\in Actions(s)} MINIMAX(RESULT(s,a)) & \\text{if PLAYER}(s)\
    \ = MIN\n\\end{array}\\right.\\)\n\nLet us apply these definitions to the game\
    \ tree in Figure 5.2. The terminal nodes on the bottom level get their utility\
    \ values from the game’s UTILITY function. The first MIN node, labeled _B_, has\
    \ three successor states with values 3, 12, and 8, so its minimax value is 3.\
    \ Similarly, the other two MIN nodes have minimax value 2. The root node is a\
    \ MAX node; its successor states have minimax values 3, 2, and 2; so it has a\
    \ minimax value of 3. We can also identify the **minimax decision** at the root:\
    \ action _a_<sub>1</sub> is the optimal choice for MAX because it leads to the\
    \ state with the highest minimax value.\n\n![](img/c69bfdf1f6addd09d49cae0440fcc5c7_10_0.png)\n\
    \nFigure 5.2 A two-ply game tree. The \\(\\Delta\\) nodes are “MAX nodes,” in\
    \ which it is MAX’s turn to move, and the \\(\\nabla\\) nodes are “MIN nodes.”\
    \ The terminal nodes show the utility values for MAX; the other nodes are labeled\
    \ with their minimax values. MAX’s best move at the root is _a_<sub>1</sub>, because\
    \ it leads to the state with the highest minimax value, and MIN’s best reply is\
    \ _b_<sub>1</sub>, because it leads to the state with the lowest minimax value."
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Minimax


    We want to compute an optimal move for player “Max”. In other words: “We are Max,
    and our opponent is Min.”


    # Remember:


    +   - Max attempts to *maximize* the utility \(u(s)\) of the terminal state that
    will be reached during play.

    +   - Min attempts to *minimize* \(u(s)\).


    # So what?


    +   - The computation alternates between minimization and maximization

    +     ⇒ hence “Minimax”.'
  merge: -1
  img_proc: true
- pgno: 12
  md: "# # The minimax algorithm\n\nThe **minimax algorithm** (Figure 5.3) computes\
    \ the minimax decision from the current state. It uses a simple recursive computation\
    \ of the minimax values of each successor state, directly implementing the defining\
    \ equations. The recursion proceeds all the way down to the leaves of the tree,\
    \ and then the minimax values are **backed up** through the tree as the recursion\
    \ unwinds. For example, in Figure 5.2, the algorithm first recurses down to the\
    \ three bottom- left nodes and uses the UTILITY function on them to discover that\
    \ their values are 3, 12, and 8, respectively. Then it takes the minimum of these\
    \ values, 3, and returns it as the backed- up value of node _B_. A similar process\
    \ gives the backed-up values of 2 for _C_ and 2 for _D_. Finally, we take the\
    \ maximum of 3, 2, and 2 to get the backed-up value of 3 for the root node.\n\n\
    The minimax algorithm performs a complete depth-first exploration of the game\
    \ tree. If the maximum depth of the tree is _m_ and there are _b_ legal moves\
    \ at each point, then the time complexity of the minimax algorithm is _O_(_b<sup>m</sup>_).\
    \ The space complexity is _O_(_bm_) for an algorithm that generates all actions\
    \ at once, or _O_(_m_) for an algorithm that generates actions one at a time (see\
    \ page 87). For real games, of course, the time cost is totally impractical, but\
    \ this algorithm serves as the basis for the mathematical analysis of games and\
    \ for more practical algorithms.\n\n![](img/c69bfdf1f6addd09d49cae0440fcc5c7_12_0.png)\n\
    \n```\n```\nfunction MINIMAX-DECISION(state) returns an action\n  return argmax\
    \ a∈ACTIONS(s) MIN-VALUE(RESULT(state, a))\n\nfunction MAX-VALUE(state) returns\
    \ a utility value\n  if TERMINAL-TEST(state) then return UTILITY(state)\n  v ←\
    \ −∞\n  for each a in ACTIONS(state) do\n    v ← MAX(v, MIN-VALUE(RESULT(s, a)))\n\
    \  return v\n\nfunction MIN-VALUE(state) returns a utility value\n  if TERMINAL-TEST(state)\
    \ then return UTILITY(state)\n  v ← ∞\n  for each a in ACTIONS(state) do\n   \
    \ v ← MIN(v, MAX-VALUE(RESULT(s, a)))\n  return v\n```\n```\n\n**Figure 5.3**\
    \ An algorithm for calculating minimax decisions. It returns the action corresponding\
    \ to the best possible move, that is, the move that leads to the outcome with\
    \ the best utility, under the assumption that the opponent plays to minimize utility.\
    \ The functions MAX-VALUE and MIN-VALUE go through the whole game tree, all the\
    \ way to the leaves, to determine the backed-up value of a state. The notation\
    \ argmaxa∈S f(a) computes the element of set S that has the maximum value of f(a)."
  merge: -1
  img_proc: true
