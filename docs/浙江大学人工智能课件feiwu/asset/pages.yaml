- pgno: 171
  md: '# What is a computational graph?


    +   - Computational graph is a kind of descriptive language,

    +     - Can represent an arbitrary mathematical computation as a graph,

    +     - usually is a directed acyclic graph (DAG).

    +     - Each node represents an operator or a variable/input

    +     - E.g. e = (a + b) * (b + 1)


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_171_0.png)


    http://colah.github.io/posts/2015-08-Backprop/'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Why use a computational graph in DL?


    +   - Two key strengths of computational graphs:

    +     - Allow simple functions to be combined to form quite complex models

    +       - A wide range of neural network models can be created by defining computational
    graphs consisting of simple, primitive operations.

    +     - Enable **automatic differentiation**

    +       - Automatic differentiation is a technique for calculating derivatives
    in computational graphs: once the graph has been defined using underlying primitive
    operations, derivatives are calculated automatically based on “local” derivatives
    of these operations.

    +       - Gradient-based learning algorithms can be used to train NN, providing
    that the gradient of the loss function with respect to the parameters can be calculated
    efficiently.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# # Computational Graphs: A Formal Definition


    **Definition (Computational Graphs)** _A computational graph is a_ 6 _- tuple_
    \(\langle n, l, E, u^1 \dots u^n, d^1 \dots d^n, f^{l+1} \dots f^n \rangle\)


    _where:_


    +   - _n is an integer specifying the number of vertices in the graph._

    +   - _l is an integer such that_ \(1 \leq l \leq n\) _that pecifies the number
    of leaves in the graph._


    +   - _E_: The set of edges in the computational graph. For each \((j, i) \in
    E\) we have _j < i_ (the graph is topologically ordered), \(j \in \{1 \dots (n-1)\}\),
    and \(i \in \{(l+1) \dots n\}\).

    +   - _u<sup>i</sup>_ for \(i \in \{1 \dots n\}\) is the variable associated with
    vertex _i_ in the graph.

    +   - _d<sup>i</sup>_ for \(i \in \{1 \dots n\}\) is the dimensionality for each
    variable, that is, \(u^i \in \mathbb{R}^{d^i}\).

    +   - _f<sup>i</sup>_ for \(i \in \{(l+1) \dots n\}\) is the local function for
    vertex _i_ in the graph

    +   - \(\alpha^i\) for \(i \in \{(l+1) \dots n\}\) is defined as \(\alpha^i =
    \langle u^j | (j, i) \in E\rangle\), i.e., \(\alpha^i\) contains all input values
    for vertex _i_.'
