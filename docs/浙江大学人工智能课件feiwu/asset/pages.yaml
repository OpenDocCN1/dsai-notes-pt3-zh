- pgno: 834
  md: '# # Well-defined problems and solutions


    +   - Problem definition:


    +   1. **Initial state**: The initial state that the agent starts in. For example,
    the initial state for our agent in Romania might be described as _In(Arad)_.


    +   2. **Actions**: A description of the possible actions available to the agent.
    Given a particular state _s_, _ACTIONS(s)_ returns the set of actions that can
    be executed in _s_. We say that each of these actions is applicable in _s_. For
    example, from the state _In(Arad)_, the applicable actions are {_Go(Sibiu), Go(Timisoara),
    Go(Zerind)_}.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_834_0.png)'
  merge: -1
  img_proc: true
- pgno: 835
  md: '# # Well-defined problems and solutions


    # ## Problem definition:


    +   Transition model: A description of what each action does; the formal name
    for this is the transition model, specified by a function RESULT(s, a) that returns
    the state that results from doing action a in state s. We also use the term successor
    to refer to any state reachable from a given state by a single action. For example,
    we have RESULT(In(Arad), Go(Zerind)) = In(Zerind)


    State Space, Directed network (Graph) and Path: The initial state, actions, and
    transition model implicitly define the state space of the problem—the set of all
    states reachable from the initial state by any sequence of actions. The state
    space forms a directed network or graph in which the nodes are states and the
    links between nodes are actions. (The map of Romania can be interpreted as a state-space
    graph if we view each road as standing for two driving actions, one in each direction.)
    A path in the state space is a sequence of states connected by a sequence of actions.'
  merge: -1
  img_proc: true
- pgno: 836
  md: '# # Well-defined problems and solutions


    # ## Problem definition:


    +   ④ **Goal test**: The goal test, which determines whether a given state is
    a goal state. Sometimes there is an explicit set of possible goal states, and
    the test simply checks whether the given state is one of them. The agent''s goal
    in Romania is the singleton set {_In_(_Bucharest_)}. Sometimes the goal is specified
    by an abstract property rather than an explicitly enumerated set of states. E.g.
    8-queens problem, or reach a state called “checkmate” in chess game


    +   ⑤ **Path cost**: a function that assigns a numeric cost to each path. The
    problem-solving agent chooses a cost function that reflects its own performance
    measure. E.g. the cost of a path might be its length in kilometers in Romania
    problem, described as the sum of the costs of the individual actions along the
    path. The **step cost** of taking action _a_ in state _s_ to reach state _s_’
    is denoted by _c_(_s_,_a_,_s_’).'
  merge: -1
  img_proc: true
