- pgno: 758
  md: "# Infrastructure for search algorithms\n\nSearch algorithms require a data\
    \ structure to keep track of the search tree that is being constructed. For each\
    \ node *n* of the tree, we have a structure that contains four components:\n\n\
    +   - **n.STATE**: the state in the state space to which the node corresponds;\n\
    +   - **n.PARENT**: the node in the search tree that generated this node;\n+ \
    \  - **n.ACTION**: the action that was applied to the parent to generate the node;\n\
    +   - **n.PATH-COST**: the cost, traditionally denoted by *g(n)*, of the path\
    \ from the initial state to the node, as indicated by the parent pointers.\n\n\
    Given the components for a parent node, it is easy to see how to compute the necessary\
    \ components for a child node. The function CHILD-NODE takes a parent node and\
    \ an action and returns the resulting child node:\n\n```\nfunction CHILD-NODE(problem,\
    \ parent, action) returns a node\n    return a node with\n        STATE = problem.RESULT(parent.STATE,\
    \ action),\n        PARENT = parent, ACTION = action,\n        PATH-COST = parent.PATH-COST\
    \ + problem.STEP-COST(parent.STATE, action)\n```"
  merge: -1
  img_proc: true
- pgno: 759
  md: '# # Infrastructure for search algorithms


    +   • The node data structure is depicted in Figure 3.10. Notice how the PARENT
    pointers string the nodes together into a tree structure. These pointers also
    allow the solution path to be extracted when a goal node is found; we use the
    SOLUTION function to return the sequence of actions obtained by following parent
    pointers back to the root.


    +   • Up to now, we have not been very careful to distinguish between nodes and
    states, but in writing detailed algorithms it''s important to make that distinction.
    A node is a bookkeeping data structure used to represent the search tree. A state
    corresponds to a configuration of the world. Thus, nodes are on particular paths,
    as defined by PARENT pointers, whereas states are not.


    +   • Furthermore, two different nodes can contain the same world state if that
    state is generated via two different search paths.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_759_0.png)'
  merge: -1
  img_proc: true
- pgno: 760
  md: '# # Infrastructure for search algorithms


    Now that we have nodes, we need somewhere to put them. The frontier needs to be

    stored in such a way that the search algorithm can easily choose the next node
    to expand

    according to its preferred strategy. The appropriate data structure for this is
    a **queue**. The

    operations on a queue are as follows:


    +   - EMPTY?(queue) returns true only if there are no more elements in the queue.

    +   - Pop(queue) removes the first element of the queue and returns it.

    +   - INSERT(element, queue) inserts an element and returns the resulting queue.


    Queues are characterized by the **order** in which they store the inserted nodes.
    Three common

    variants are the first-in, first-out or **FIFO queue**, which pops the _oldest_
    element of the queue;

    the last-in, first-out or **LIFO queue** (also known as a **stack**), which pops
    the _newest_ element

    of the queue; and the **priority queue**, which pops the element of the queue
    with the highest

    priority according to some ordering function.


    The explored set can be implemented with a hash table to allow efficient checking
    for

    repeated states. With a good implementation, insertion and lookup can be done
    in roughly

    constant time no matter how many states are stored. One must take care to implement
    the

    hash table with the right notion of equality between states. For example, in the
    traveling

    salesperson problem (page 74), the hash table needs to know that the set of visited
    cities

    {Bucharest,Urziceni,Vaslui} is the same as {Urziceni,Vaslui,Bucharest}. Sometimes
    this can

    be achieved most easily by insisting that the data structures for states be in
    some **canonical

    form**; that is, logically equivalent states should map to the same data structure.
    In the case

    of states described by sets, for example, a bit-vector representation or a sorted
    list without

    repetition would be canonical, whereas an unsorted list would not.'
  merge: -1
  img_proc: true
