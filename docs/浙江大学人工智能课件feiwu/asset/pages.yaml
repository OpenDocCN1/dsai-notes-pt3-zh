- pgno: 1094
  md: '# # The general EM algorithm


    +   - The log likelihood of a discrete latent variables model:


    \[ \ln p(\mathbf{X}|\theta) = \ln \left\{ \sum_{\mathbf{Z}} p(\mathbf{X}, \mathbf{Z}|\theta)
    \right\} \]


    > Direct optimization of this log likelihood function is difficult!


    +   - The goal of EM algorithm is to find maximum likelihood solution for models
    having latent variables.


    +   - For the complete data set {**X**, **Z**}, the log likelihood function:


    \[ \ln p(\mathbf{X}|\theta) \longrightarrow \ln p(\mathbf{X}, \mathbf{Z}|\theta)
    \]


    > Suppose that maximization of this complete-data log likelihood function is very
    easier!


    +   - For the incomplete data set {**X**}, we adopt the following steps to find
    maximum likelihood solution:


    \[ \theta^{old} \longleftarrow \theta^{new} = \arg \max_{\theta} Q(\theta, \theta^{old})
    \]


    > Expectation of this complete-data log likelihood function


    \[ p(\mathbf{Z}|\mathbf{X}, \theta^{old}) \longrightarrow \mathbb{E}_{\mathbf{Z}}[\ln
    p(\mathbf{X}, \mathbf{Z}|\theta)] = \sum_{\mathbf{Z}} p(\mathbf{Z}|\mathbf{X},
    \theta^{old}) \ln p(\mathbf{X}, \mathbf{Z}|\theta) = Q(\theta, \theta^{old}) \]'
  merge: -1
  img_proc: true
- pgno: 1095
  md: "# The general EM algorithm\n\n# The General EM Algorithm\n\nGiven a joint distribution\
    \ $p(X,Z|\\theta)$ over observed variables $X$ and latent variables $Z$, governed\
    \ by parameters $\\theta$, the goal is to maximize the likelihood function $p(X|\\\
    theta)$ with respect to $\\theta$.\n\n+   1. Choose an initial setting for the\
    \ parameters $\\theta^{\\mathrm{old}}$.\n+   \n+   2. **E step** Evaluate $p(Z|X,\\\
    theta^{\\mathrm{old}})$.\n+   \n+   3. **M step** Evaluate $\\theta^{\\mathrm{new}}$\
    \ given by\n+      $$\\theta^{\\mathrm{new}} = \\arg\\max_{\\theta} Q(\\theta,\\\
    theta^{\\mathrm{old}})$$\n+      where\n+      $$Q(\\theta,\\theta^{\\mathrm{old}})=\\\
    sum_Z p(Z|X,\\theta^{\\mathrm{old}})\\ln p(X,Z|\\theta).$$\n+   \n+   4. Check\
    \ for convergence of either the log likelihood or the parameter values. If the\
    \ convergence criterion is not satisfied, then let\n+      $$\\theta^{\\mathrm{old}}\
    \ \\leftarrow \\theta^{\\mathrm{new}}$$\n+      and return to step 2.\n\n![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1095_0.png)\n\
    \n> EM algorithm can be used to find MAP solution"
  merge: -1
  img_proc: true
- pgno: 1096
  md: '# Gaussian mixtures revisited


    ```

    $$\ln p(\mathbf{X}|\theta)=\ln\left\{\sum_{\mathbf{Z}}p(\mathbf{X},\mathbf{Z}|\theta)\right\}\;\Rightarrow\;\ln
    p(\mathbf{X}|\pi,\mu,\Sigma)=\sum_{n=1}^{N}\ln\left\{\sum_{k=1}^{K}\pi_k\mathcal{N}(x_n|\mu_k,\Sigma_k)\right\}$$

    ```


    +   - *For the complete data set {X, Z}, the log likelihood function:*


    ```

    $$p(\mathbf{X},\mathbf{Z}|\mu,\Sigma,\pi)=\prod_{n=1}^{N}\prod_{k=1}^{K}\pi_k^{z_{nk}}\mathcal{N}(x_n|\mu_k,\Sigma_k)^{z_{nk}},\qquad
    \sum_{k=1}^{K}\pi_k=1,\quad 0\leq\pi_k\leq1$$

    ```


    ```

    $$\ln p(\mathbf{X},\mathbf{Z}|\mu,\Sigma,\pi)=\sum_{n=1}^{N}\sum_{k=1}^{K}z_{nk}\{\ln\pi_k+\ln\mathcal{N}(x_n|\mu_k,\Sigma_k)\}$$

    ```


    ```

    $$\frac{\partial}{\partial\pi_k}\left\{\ln p(\mathbf{X},\mathbf{Z}|\mu,\Sigma,\pi)+\lambda\left(\sum_{k=1}^{K}\pi_k-1\right)\right\}=0\;\Rightarrow\;\pi_k=\frac{1}{N}\sum_{n=1}^{N}z_{nk}$$

    ```'
