- pgno: 1061
  md: '# The Bias-Variance Decomposition


    *When we discuss prediction models, prediction errors can be decomposed into two
    main subcomponents we care about: error due to "bias" and error due to "variance".
    There is a tradeoff between a model''s ability to minimize bias and variance.
    Understanding these two types of error can help us diagnose model results and
    avoid the mistake of **over-fitting** or **under-fitting**.*


    If we denote the variable we are trying to predict as $Y$ and our covariates as
    $X$, we may assume that there is a relationship relating one to the other such
    as $Y = f(X) + \epsilon$ where the error term $\epsilon$ is normally distributed
    with a mean of zero like so $\epsilon \sim N(0, \sigma_\epsilon^2)$.


    We may estimate a model $\hat{f}(X)$ of $f(X)$ using linear regressions or another
    modeling technique. In this case, the expected squared prediction error at a point
    $x$ is:


    $$Err(x) = E\left[(Y - \hat{f}(x))^2\right]$$


    This error may then be decomposed into bias and variance components:


    $$Err(x) = \left(E[\hat{f}(x)] - f(x)\right)^2 + E\left[\left(\hat{f}(x) - E[\hat{f}(x)]\right)^2\right]
    + \sigma_\epsilon^2$$


    $$Err(x) = \mathrm{Bias}^2 + \mathrm{Variance} + \mathrm{Irreducible\ Error}$$


    That third term, irreducible error, is the noise term in the true relationship
    that cannot fundamentally be reduced by any model. Given the true model and infinite
    data to calibrate it, we should be able to reduce both the bias and variance terms
    to 0. However, in a world with imperfect models and finite data, there is a tradeoff
    between minimizing the bias and minimizing the variance.'
  merge: -1
  img_proc: true
- pgno: 1062
  md: '# # The Bias-Variance Decomposition


    +   - We have: \(\mathbb{E}[L] = \iint L(t, y(x))p(x, t) \, \mathrm{d}x \, \mathrm{d}t
    = \iint \{y(x) - t\}^2 p(x, t) \, \mathrm{d}x \, \mathrm{d}t\)

    +     \(\{y(x) - t\}^2 = \{y(x) - \mathbb{E}[t|x] + \mathbb{E}[t|x] - t\}^2\)

    +     \(= \{y(x) - \mathbb{E}[t|x]\}^2 + 2\{y(x) - \mathbb{E}[t|x]\}\{\mathbb{E}[t|x]
    - t\} + \{\mathbb{E}[t|x] - t\}^2\)

    +     \(\Rightarrow \mathbb{E}[L] = \int \{y(x) - \mathbb{E}[t | x]\}^2 p(x) \,
    \mathrm{d}x + \int \text{var}[t | x] p(x) \, \mathrm{d}x\)


    +   - Let : \(h(x) = \mathbb{E}[t|x] = \int t p(t|x) \, \mathrm{d}t\)

    +     \(\Rightarrow \mathbb{E}[L] = \int \{y(x) - h(x)\}^2 p(x) \, \mathrm{d}x
    + \int \{h(x) - t\}^2 p(x, t) \, \mathrm{d}x \, \mathrm{d}t\)


    +   - For data set \(\mathcal{D}\): \(\{y(x; \mathcal{D}) - \mathbb{E}_\mathcal{D}[y(x;
    \mathcal{D})] + \mathbb{E}_\mathcal{D}[y(x; \mathcal{D})] - h(x)\}^2\)

    +     \(= \{y(x; \mathcal{D}) - \mathbb{E}_\mathcal{D}[y(x; \mathcal{D})]\}^2
    + \{\mathbb{E}_\mathcal{D}[y(x; \mathcal{D})] - h(x)\}^2\)

    +     \(+2\{y(x; \mathcal{D}) - \mathbb{E}_\mathcal{D}[y(x; \mathcal{D})]\}\{\mathbb{E}_\mathcal{D}[y(x;
    \mathcal{D})] - h(x)\}\)

    +     \(\Rightarrow \mathbb{E}_\mathcal{D} \left[ \{y(x; \mathcal{D}) - h(x)\}^2
    \right]\)

    +     \(= \underbrace{\{\mathbb{E}_\mathcal{D}[y(x; \mathcal{D})] - h(x)\}^2}_{(\text{bias})^2}
    + \underbrace{\mathbb{E}_\mathcal{D} \left[ \{y(x; \mathcal{D}) - \mathbb{E}_\mathcal{D}[y(x;
    \mathcal{D})]\}^2 \right]}_{\text{variance}}\)'
