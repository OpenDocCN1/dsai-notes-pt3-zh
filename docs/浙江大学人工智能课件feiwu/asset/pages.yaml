  md: '# # Probabilistic Generative Models: softmax function


    +   • For case of K>2 classes, we have the following multi-class generalization:


    \(p(C_k|\mathbf{x}) = \frac{p(\mathbf{x}|C_k)p(C_k)}{\sum_j p(\mathbf{x}|C_j)p(C_j)}
    = \frac{\exp(a_k)}{\sum_j \exp(a_j)}, \quad a_k = \ln[p(\mathbf{x}|C_k)p(C_k)].\)


