    \frac{y_k^2}{2\lambda_k} \right\} y_i y_j \, d\mathbf{y} = \sum_{i=1}^D \mathbf{u}_i
    \mathbf{u}_i^\mathrm{T} \lambda_i = \boldsymbol{\Sigma}\)


