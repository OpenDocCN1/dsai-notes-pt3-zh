- pgno: 733
  md: '# # The types of Problem-solving by Search


    +   - **Deterministic, fully observable** ⇒ *single-state problem*

    +     - Agent knows exactly which state it will be in

    +     - solution is a sequence


    +   - **Non-observable** ⇒ *conformant planning problem (i.e., non-observable
    non-deterministic domains)*

    +     - The problem of conformant planning is that of deciding whether there exists
    a linear sequence of actions that will achieve the goal from any initial state
    and any resolution of the non-determinism in the problem

    +     - Agent may have no idea where it is

    +     - solution (if any) is a sequence'
  merge: -1
