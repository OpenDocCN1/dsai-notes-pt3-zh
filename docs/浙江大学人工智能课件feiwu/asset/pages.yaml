- pgno: 580
  md: '# # The perceptron algorithm


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_580_0.png)


    # ## Frank Rosenblatt


    # ### 1928–1969


    Rosenblatt’s perceptron played an important role in the history of machine learning.
    Initially, Rosenblatt simulated the perceptron on an IBM 704 computer at Cornell
    in 1957, but by the early 1960s he had built special-purpose hardware that provided
    a direct, parallel implementation of perceptron learning. Many of his ideas were
    encapsulated in “Principles of Neurodynamics: Perceptrons and the Theory of Brain
    Mechanisms” published in 1962. Rosenblatt’s work was criticized by Marvin Minsky,
    whose objections were published in the book “Perceptrons”, co-authored with Seymour
    Papert. This book was widely misinterpreted at the time as showing that neural
    networks were fatally flawed and could only learn solutions for linearly separable
    problems. In fact, it only proved such limitations in the case of single-layer
    networks such as the perceptron and merely conjectured (incorrectly) that they
    applied to more general network models. Unfortunately, however, this book contributed
    to the substantial decline in research funding for neural computing, a situation
    that was not reversed until the mid-1980s. Today, there are many hundreds, if
    not thousands, of applications of neural networks in widespread use, with examples
    in areas such as handwriting recognition and information retrieval being used
    routinely by millions of people.'
  merge: -1
  img_proc: true
