- pgno: 1098
  md: '# # Relation to K-means


    - Consider a Gaussian mixture model in which the covariance matrices of the mixture
    components are given by \(\epsilon\mathbf{I}\), where \(\epsilon\) is a variance
    parameter that is shared by all of the components, and **I** is the identity matrix,
    so that


    \(p(\mathbf{x}|\mu_k,\Sigma_k)=\frac{1}{(2\pi\epsilon)^{1/2}}\exp\left\{-\frac{1}{2\epsilon}\|\mathbf{x}-\mu_k\|^2\right\}\)


    \(\gamma(z_{nk})=\frac{\pi_k\mathcal{N}(\mathbf{x}_n|\mu_k,\Sigma_k)}{\sum_j\pi_j\mathcal{N}(\mathbf{x}_n|\mu_j,\Sigma_j)}\)
    \(\xrightarrow{\text{treat }\epsilon\text{ as a fixed constant}}\) \(\gamma(z_{nk})=\frac{\pi_k\exp\{-\|\mathbf{x}_n-\mu_k\|^2/2\epsilon\}}{\sum_j\pi_j\exp\{-\|\mathbf{x}_n-\mu_j\|^2/2\epsilon\}}\)


    - If we consider the limit \(\epsilon \rightarrow 0\), we see that in the denominator
    the term for which \(\|\mathbf{x}_n-\mu_j\|^2\) is smallest will go to zero most
    slowly, and hence the responsibilities \(\gamma(z_{nk})\) for the data point \(\mathbf{x}_n\)
    all go to zero except for term *j*, for which the responsibility \(\gamma(z_{nj})\)
    will go to unity.


    \(\mathbb{E}_\mathbf{Z}[\ln p(\mathbf{X},\mathbf{Z}|\mu,\Sigma,\pi)] \rightarrow
    -\frac{1}{2}\sum_{n=1}^N\sum_{k=1}^K r_{nk}\|\mathbf{x}_n-\mu_k\|^2 + \text{const}\)


    \(J=\sum_{n=1}^N\sum_{k=1}^K r_{nk}\|\mathbf{x}_n-\mu_k\|^2\qquad r_{nk}=\left\{\begin{array}{ll}
    1 & \text{if } k=\arg\min_j\|\mathbf{x}_n-\mu_j\|^2 \\ 0 & \text{otherwise.} \end{array}\right.\)'
  merge: -1
  img_proc: true
