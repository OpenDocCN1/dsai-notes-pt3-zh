- pgno: 16
  md: '# Alpha-Beta Pruning


    The problem with minimax search is that the number of game states it has to examine
    is exponential in the depth of the tree. Unfortunately, we can’t eliminate the
    exponent, but it turns out we can effectively cut it in half. The trick is that
    it is possible to compute the correct minimax decision without looking at every
    node in the game tree. That is, we can borrow the idea of pruning from Chapter
    3 to eliminate large parts of the tree from consideration. The particular technique
    we examine is called **alpha-beta pruning**. When applied to a standard minimax
    tree, it returns the same move as minimax would, but prunes away branches that
    cannot possibly influence the final decision.


    Consider again the two-ply game tree from Figure 5.2. Let’s go through the calculation
    of the optimal decision once more, this time paying careful attention to what
    we know at each point in the process. The steps are explained in Figure 5.5. The
    outcome is that we can identify the minimax decision without ever evaluating two
    of the leaf nodes.


    Another way to look at this is as a simplification of the formula for MINIMAX.
    Let the two unevaluated successors of node C in Figure 5.5 have values \(x\) and
    \(y\). Then the value of the root node is given by


    \[\begin{aligned}

    \operatorname{MINIMAX}(root) &= \max(\min(3,12,8),\min(2,x,y),\min(14,5,2))\\

    &= \max(3,\min(2,x,y),2)\\

    &= \max(3,2,2) \qquad \text{where } \min(2,x,y) \leq 2\\

    &= 3.

    \end{aligned}\]


    In other words, the value of the root and hence the minimax decision are *independent
    of the values of the pruned leaves* \(x\) and \(y\).


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_16_0.png)


    **Figure 5.5** Stages in the calculation of the optimal decision for the game
    tree in Figure 5.2. At each point, we show the range of possible values for each
    node. (a) The first leaf below B has the value 3. Hence, B, which is a MIN node,
    has a value of at most 3. (b) The second leaf below B has a value of 12; MIN would
    avoid this move, so the value of B is still at most 3. (c) The third leaf below
    B has a value of 8; we have seen all B’s successor states, so the value of B is
    exactly 3. Now, we can infer that the value of the root is at least 3, because
    MAX has a choice worth 3 at the root. (d) The first leaf below C has the value
    2. Hence, C, which is a MIN node, has a value of at most 2. But we know that B
    is worth 3, so MAX would never choose C. Therefore, there is no point in looking
    at the other successor states of C. This is an example of alpha-beta pruning.
    (e) The first leaf below D has the value 14, so D is worth at most 14. This is
    still higher than MAX’s best alternative (i.e., 3), so we need to keep exploring
    D’s successor states. Notice also that we now have bounds on all of the successors
    of the root, so the root’s value is also at most 14. (f) The second successor
    of D is worth 5, so again we need to keep exploring. The third successor is worth
    2, so now D is worth exactly 2. MAX’s decision at the root is to move to B, giving
    a value of 3.'
  merge: -1
  img_proc: true
