- pgno: 854
  md: '# # Infrastructure for search algorithms


    +   - The node data structure


    +   – Search algorithms require a data structure to keep track of the search tree
    that is being constructed. For each node n of the tree, we have a structure that
    contains four components:


    +   – n.STATE: the state in the state space to which the node corresponds;


    +   – n.PARENT: the node in the search tree that generated this node;


    +   – n.ACTION: the action that was applied to the parent to generate the node;


    +   – n.PATH-COST: the cost, traditionally denoted by _g_(_n_), of the path **from
    the initial state to the node**, as indicated by the parent pointers.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_854_0.png)'
  merge: -1
  img_proc: true
- pgno: 855
  md: "# Infrastructure for search algorithms\n\n+   - How to compute the necessary\
    \ components for a child node?\n+     - The function **CHILD-NODE** takes a parent\
    \ node and an action and returns the resulting child node:\n\n```\nfunction CHILD-NODE(problem,\
    \ parent, action) returns a node\n    return a node with\n        STATE = problem.RESULT(parent.STATE,\
    \ action),\n        PARENT = parent, ACTION = action,\n        PATH-COST = parent.PATH-COST\
    \ + problem.STEP-COST(parent.STATE, action)\n```\n\nThe **PARENT** pointers string\
    \ the nodes together into a tree structure. These pointers also allow the solution\
    \ path to be extracted when a goal node is found; we use the **SOLUTION** function\
    \ to return the sequence of actions obtained by following parent pointers back\
    \ to the root.\n\n![](img/c69bfdf1f6addd09d49cae0440fcc5c7_855_0.png)"
  merge: -1
  img_proc: true
- pgno: 856
  md: '# # Infrastructure for search algorithms


    +   - Distinction between nodes and states

    +     - **Node**: a bookkeeping data structure used to represent the search tree.

    +     - **State**: corresponds to a configuration of the world.

    +     - Thus, nodes are on particular paths, as defined by PARENT pointers, whereas
    states are not.

    +     - Furthermore, two different nodes can contain the same world state if that
    state is generated via two different search paths.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_856_0.png)'
  merge: -1
  img_proc: true
- pgno: 857
  md: '# # Infrastructure for search algorithms


    +   - How to store the nodes?


    +   – The frontier needs to be stored in such a way that the search algorithm
    can easily choose the next node to expand QUEUE according to its preferred strategy.


    +   – The appropriate data structure for this is a queue. The operations on a
    queue are as follows:


    +   • EMPTY?(queue) returns true only if there are no more elements in the queue.


    +   • POP(queue) removes the first element of the queue and returns it.


    +   • INSERT(element, queue) inserts an element and returns the resulting queue.


    +   – Three common queues: FIFO queue, LIFO queue (stack), priority queue


    +   – The explored set can be implemented with a hash table to allow efficient
    checking for repeated states'
  merge: -1
  img_proc: true
- pgno: 858
  md: '# # Measuring problem-solving performance


    +   - **Completeness**: Is the algorithm guaranteed to find a solution when there
    is one?

    +   - **Optimality**: Does the strategy find the optimal solution?

    +   - **Time complexity**: How long does it take to find a solution?

    +   - **Space complexity**: How much memory is needed to perform the search?'
  merge: -1
  img_proc: true
- pgno: 859
  md: '# # Uninformed Search Strategies


    +   - The **uninformed search** (also called **blind search**) means that the
    strategies have no additional information about states beyond that provided in
    the problem definition.

    +   - All they can do is generate successors and distinguish a goal state from
    a non-goal state.

    +   - All search strategies are distinguished by the order in which nodes are
    expanded.

    +     1. **Breadth-first search**

    +     2. **Depth-first search**

    +   - Strategies that know whether one non-goal state is “more promising” than
    another are called **informed search** or **heuristic search** strategies.'
  merge: -1
  img_proc: true
- pgno: 860
  md: "# # Breadth-first search\n\n**Breadth-first search (BFS)** is a simple strategy\
    \ in which the root node is expanded first, then all the successors of the root\
    \ node are expanded next, then _their_ successors, and so on. In general, all\
    \ the nodes are expanded at a given depth in the search tree before any nodes\
    \ at the next level are expanded.\n\n```\nfunction BREADTH-FIRST-SEARCH(problem)\
    \ returns a solution, or failure\n  node ← a node with STATE = problem.INITIAL-STATE,\
    \ PATH-COST = 0\n  if problem.GOAL-TEST(node.STATE) then return SOLUTION(node)\n\
    \  frontier ← a FIFO queue with node as the only element\n  explored ← an empty\
    \ set\n  loop do\n    if EMPTY?(frontier) then return failure\n    node ← POP(frontier)\
    \ /* chooses the shallowest node in frontier */\n    add node.STATE to explored\n\
    \    for each action in problem.ACTIONS(node.STATE) do\n      child ← CHILD-NODE(problem,\
    \ node, action)\n      if child.STATE is not in explored or frontier then\n  \
    \      if problem.GOAL-TEST(child.STATE) then return SOLUTION(child)\n       \
    \ frontier ← INSERT(child, frontier)\n```\n\n> > Problem definition:\n> > • Initial\
    \ state\n> > • Actions\n> > • Transition model\n> > • Goal test\n> > • Path cost\n\
    \n![](img/c69bfdf1f6addd09d49cae0440fcc5c7_860_0.png)\n\n**Figure 3.11** Breadth-first\
    \ search on a graph."
  merge: -1
  img_proc: true
