  md: '# # Upper Confidence Bounds on Trees (UCT)


    Each node _v_ has four pieces of data associated with it: the associated state
    _s_(_v_), the incoming action _a_(_v_), the total simulation reward _Q_(_v_) (a
    vector of real values), and the visit count _N_(_v_) (a nonnegative integer).
    Instead of storing _s_(_v_) for each node, it is often more efficient in terms
    of memory usage to recalculate it as TREEPOLICY descends the tree. The term \(\Delta(v,p)\)
    denotes the component of the reward vector \(\Delta\) associated with the current
    player _p_ at node _v_.


    The return value of the overall search in this case is _a_(BESTCHILD(_v_<sub>0</sub>_,_0))
    which will give the action _a_ that leads to the child with the highest reward,\(^\text{10}\)
    since the exploration parameter _c_ is set to 0 for this final call on the root
    node _v_<sub>0</sub>. The algorithm could instead return the action that leads
    to the most visited child; these two options will usually – but not always! –
    describe the same action. This potential discrepancy is addressed in the Go program
    ERICA by continuing the search if the most visited root action is not also the
    one with the highest reward. This improved ERICA’s winning rate against GNU Go
    from 47% to 55% [107].'
