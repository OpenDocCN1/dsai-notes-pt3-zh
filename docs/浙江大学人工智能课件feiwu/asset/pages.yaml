- pgno: 672
  md: '# # The Rules of Probability


    # ## The Rules of Probability


    sum rule

    \( p(X) = \sum_Y p(X,Y) \) (1.10)


    product rule

    \( p(X,Y) = p(Y|X)p(X). \) (1.11)


    Here \( p(X,Y) \) is a joint probability and is verbalized as "the probability
    of _X_ and _Y_". Similarly, the quantity \( p(Y|X) \) is a conditional probability
    and is verbalized as "the probability of _Y_ given _X_", whereas the quantity
    \( p(X) \) is a marginal probability and is simply "the probability of _X_". These
    two simple rules form the basis for all of the probabilistic machinery that we
    use throughout this book.'
