- pgno: 749
  md: '# Example problem: 8-queens problem


    +   - Although efficient special-purpose algorithms exist for this problem and
    for the whole n-queens family, it remains a useful test problem for search algorithms.
    There are two main kinds of formulation. An **incremental formulation** involves
    operators that augment the state description, starting with an empty state; for
    the 8-queens problem, this means that each action adds a queen to the state. A
    **complete-state formulation** starts with all 8 queens on the board and moves
    them around. In either case, the path cost is of no interest because only the
    final state counts.'
  merge: -1
  img_proc: true
- pgno: 750
  md: '# # Example problem: 8-queens problem


    +   - The first incremental formulation one might try is the following:


    +   - States: Any arrangement of 0 to 8 queens on the board is a state.

    +   - Initial state: No queens on the board.

    +   - Actions: Add a queen to any empty square.

    +   - Transition model: Returns the board with a queen added to the specified
    square.

    +   - Goal test: 8 queens are on the board, none attacked.


    In this formulation, we have \(64 \cdot 63 \cdots 57 \approx 1.8 \times 10^{14}\)
    possible sequences to investigate. A better formulation would prohibit placing
    a queen in any square that is already attacked:


    +   - States: All possible arrangements of \(n\) queens (\(0 \leq n \leq 8\)),
    one per column in the leftmost \(n\) columns, with no queen attacking another.

    +   - Actions: Add a queen to any square in the leftmost empty column such that
    it is not attacked by any other queen.


    This formulation reduces the 8-queens state space from \(1.8 \times 10^{14}\)
    to just 2,057, and solutions are easy to find. On the other hand, for 100 queens
    the reduction is from roughly \(10^{400}\) states to about \(10^{52}\) states
    (Exercise 3.5)—a big improvement, but not enough to make the problem tractable.
    Section 4.1 describes the complete-state formulation, and Chapter 6 gives a simple
    algorithm that solves even the million-queens problem with ease.'
  merge: -1
  img_proc: true
- pgno: 751
  md: '# # Real-world problems: route-finding problem


    +   - Consider the airline travel problems that must be solved by a travel-planning
    Web site:


    +   - States: Each state obviously includes a location (e.g., an airport) and
    the current time. Furthermore, because the cost of an action (a flight segment)
    may depend on previous segments, their fare bases, and their status as domestic
    or international, the state must record extra information about these “historical”
    aspects.

    +   - Initial state: This is specified by the user’s query.

    +   - Actions: Take any flight from the current location, in any seat class, leaving
    after the current time, leaving enough time for within-airport transfer if needed.

    +   - Transition model: The state resulting from taking a flight will have the
    flight’s destination as the current location and the flight’s arrival time as
    the current time.

    +   - Goal test: Are we at the final destination specified by the user?

    +   - Path cost: This depends on monetary cost, waiting time, flight time, customs
    and immigration procedures, seat quality, time of day, type of airplane, frequent-flyer
    mileage awards, and so on.'
  merge: -1
  img_proc: true
