  md: '# # K-means clustering


    +   - Suppose we have a data set { x<sub>1</sub>, x<sub>2</sub>, ..., x<sub>N</sub>
    } in D-dimensional space and these data points have an intrinsic structure of
    K clusters.


    +   - We use \(\mu_k\) as a prototype associated with the \(k^{th}\) cluster.


    +   - Goal: find an assignment of data points to clusters such that some objective
    function is achieved.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_424_0.png)


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_424_1.png)'
