- pgno: 1197
  md: '# Backpropagation in Neural Network


    Paul J. Werbos (born 1947) is a scientist best known for his 1974 Harvard University
    Ph.D. thesis, which first described the process of training artificial neural
    networks through backpropagation of errors. The thesis, and some supplementary
    information, can be found in his book, The Roots of Backpropagation (ISBN 0-471-59897-6).
    He also was a pioneer of recurrent neural networks.


    Werbos was one of the original three two-year Presidents of the International
    Neural Network Society (INNS). He was awarded the IEEE Neural Network Pioneer
    Award for the discovery of backpropagation and other basic neural network learning
    frameworks such as Adaptive Dynamic Programming.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1197_0.png)


    > Paul J. Werbos, Backpropagation Through Time: What It Does and How to Do It,
    *Proceedings of the IEEE*, 78(10):1550-1560, 1990'
  merge: -1
  img_proc: true
- pgno: 1198
  md: '# # Backpropagation in Neural Network


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1198_0.png)


    Repeatedly adjusts the weights of the connections in the network so as to minimize
    the measure of the difference between the actual output vector of the net and
    the desired output vector. As a result of the weight adjustments, internal “hidden”
    units which are not part of the input or output come to represent important features
    of the task domain, and the regularities in the task are captured by the interactions
    of these units.


    Rumelhart, David E.; Hinton, Geoffrey E.; Williams, Ronald J., Learning representations
    by back-propagating errors, *Nature*, 323 (6088): 533–536,1986'
  merge: -1
  img_proc: true
