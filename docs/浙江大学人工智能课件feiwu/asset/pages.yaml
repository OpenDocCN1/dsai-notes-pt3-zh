  md: '# # Multi-armed bandit


    +   • In order to analyze the behavior of a player or forecaster (i.e., the agent
    implementing a bandit strategy), we may compare its performance with that of an
    optimal strategy that, for any horizon of n time steps, consistently plays the
    arm that is best in the first n steps. In other terms, we may study the **regret**
