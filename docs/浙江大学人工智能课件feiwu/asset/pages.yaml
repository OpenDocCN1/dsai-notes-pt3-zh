- pgno: 50
  md: '# # Partially Observable Games: Cards


    Card games provide many examples of stochastic partial observability, where the
    missing information is generated randomly. For example, in many games, cards are
    dealt randomly at the beginning of the game, with each player receiving a hand
    that is not visible to the other players. Such games include bridge, whist, hearts,
    and some forms of poker.


    At first sight, it might seem that these card games are just like dice games:
    the cards are dealt randomly and determine the moves available to each player,
    but all the “dice” are rolled at the beginning! Even though this analogy turns
    out to be incorrect, it suggests an effective algorithm: consider all possible
    deals of the invisible cards; solve each one as if it were a fully observable
    game; and then choose the move that has the best outcome averaged over all the
    deals. Suppose that each deal s occurs with probability P(s); then the move we
    want is


    ```

    \(\operatorname{argmax}_a \sum_s P(s) \text{MINIMAX}(\text{RESULT}(s, a)) .\)

    ```


    Here, we run exact MINIMAX if computationally feasible; otherwise, we run H-MINIMAX.


    Now, in most card games, the number of possible deals is rather large. For example,
    in bridge play, each player sees just two of the four hands; there are two unseen
    hands of 13 cards each, so the number of deals is \(\binom{26}{13} = 10,400,600\).
    Solving even one deal is quite difficult, so solving ten million is out of the
    question. Instead, we resort to a Monte Carlo'
