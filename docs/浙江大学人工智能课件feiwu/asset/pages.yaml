- pgno: 845
  md: '# # Example problem: 8-queens problem


    +   - Two main kinds of formulation

    +     - Incremental formulation: involves operators that augment the state description,
    starting with an empty state; for the 8-queens problem, this means that each action
    adds a queen to the state.

    +     - Complete-state formulation: starts with all 8 queens on the board and
    moves them around. In either case, the path cost is of no interest because only
    the final state counts.

    +   - In either case, no path cost!


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_845_0.png)'
  merge: -1
  img_proc: true
- pgno: 846
  md: '# # Example problem: 8-queens problem


    +   - **Incremental formulation:**

    +     - **States**: Any arrangement of 0 to 8 queens on the board is a state.

    +     - **Initial state**: No queens on the board.

    +     - **Actions**: Add a queen to any empty square.

    +     - **Transition model**: Returns the board with a queen added to the specified
    square.

    +     - **Goal test**: 8 queens are on the board, none attacked.

    +   - **In this formulation, we have** \(64 \times 63 \times \dots \times 57 \approx
    1.8 \times 10^{14}\) **possible sequences to investigate. A better formulation
    would prohibit placing a queen in any square that is already attacked:**

    +     - **States**: All possible arrangements of n queens (\(0 \le n \le 8\)),
    one per column in the leftmost n columns, with no queen attacking another.

    +     - **Actions**: Add a queen to any square in the leftmost empty column such
    that it is not attacked by any other queen.

    +   - **Reduces the 8-queens state space from** \(1.8 \times 10^{14}\) **to just
    2,057**'
  merge: -1
  img_proc: true
- pgno: 847
  md: '# Searching for solution


    +   - A solution is an **action sequence**, so search algorithms work by considering
    various possible action sequences. The possible action sequences starting at the
    initial state form a **search tree** with the initial state at the root; the branches
    are actions and the **nodes** correspond to states in the state space of the problem.


    +   - Figure 3.6 shows the first few steps in growing the search tree for finding
    a route from *Arad* to *Bucharest*.


    +   - The root node of the tree corresponds to the initial state, *In(Arad)*.'
