  md: '# Polynomial Coefficients : *regularization*


    may wish to use relatively complex and flexible models. One technique that is
    often used to control the over-fitting phenomenon in such cases is that of regularization,
    which involves adding a penalty term to the error function (1.2) in order to discourage
    the coefficients from reaching large values. The simplest such penalty term takes
    the form of a sum of squares of all of the coefficients, leading to a modified
    error function of the form


    where \(\|\mathbf{w}\|^2 = \mathbf{w}^T\mathbf{w} = w_0^2 + w_1^2 + \cdots + w_M^2\),
    and the coefficient \(\lambda\) governs the relative importance of the regularization
    term compared with the sum-of-squares error term. Note that often the coefficient
    \(w_0\) is omitted from the regularizer because its inclusion causes the results
    to depend on the choice of origin for the target variable (Hastie et al., 2001),
    or it may be included but with its own regularization coefficient (we shall discuss
    this topic in more detail in Section 5.5.1). Again, the error function in (1.4)
    can be minimized exactly in closed form. Techniques such as this are known in
    the statistics literature as *shrinkage* methods because they reduce the value
    of the coefficients. The particular case of a quadratic regularizer is called
    *ridge regression* (Hoerl and Kennard, 1970). In the context of neural networks,
    this approach is known as *weight decay*.


