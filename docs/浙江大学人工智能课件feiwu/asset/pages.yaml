    \(\Delta^2 = (x - \mu)^T\Sigma^{-1}(x - \mu) = (x - \mu)^TU\Lambda^{-1}U^T(x -
    \mu) = (U^T(x - \mu))^T\Lambda^{-1}(U^T(x - \mu)) = y^T\Lambda^{-1}y\)


    _The matrix_ \(\Sigma\) _can be taken to be symmetric, without loss of generality._


    _the eigenvector equation for the covariance matrix: (Exercise 2.18. 2.19)_


    \(\Sigma u_i = \lambda_i u_i \text{ where } i = 1, ..., D \Rightarrow \Sigma U
    = \Sigma(u_1, ..., u_D) = (u_1, ..., u_D)\begin{pmatrix} \lambda_1 & \cdots &
    0 \\ \vdots & \ddots & \vdots \\ 0 & \cdots & \lambda_D \end{pmatrix} = U\Lambda\)


    \(\forall i, j \in \{1, ..., D\}, u_i^T u_j = I_{ij} = \begin{cases} 1, \text{if
    } i = j \\ 0, \text{otherwise} \end{cases} \Rightarrow U^T U = \begin{pmatrix}
    u_1^T u_1 & \cdots & u_1^T u_D \\ \vdots & \ddots & \vdots \\ u_D^T u_1 & \cdots
    & u_D^T u_D \end{pmatrix} = \mathbf{I}\)


    So U is orthonormal, \(U^{-1} = U^T \Rightarrow UU^T = \mathbf{I} \Rightarrow
    \Sigma UU^T = U\Lambda U^T\)


    \(\Rightarrow \Sigma = U\Lambda U^T = \sum_{i=1}^D \lambda_i u_i u_i^T \Rightarrow
    \Sigma^{-1} = (U\Lambda U^T)^{-1} = U\Lambda^{-1}U^T = \sum_{i=1}^D \frac{1}{\lambda_i}
    u_i u_i^T\)


    \(\Delta^2 = (x - \mu)^T\Sigma^{-1}(x - \mu) \quad y = U^T(x - \mu) \Rightarrow
    \Delta^2 = y^T\Lambda^{-1}y \quad y_i = u_i^T(x - \mu) \quad \Delta^2 = \sum_{i=1}^D
    \frac{y_i^2}{\lambda_i}\)'
