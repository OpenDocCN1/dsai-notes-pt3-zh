- pgno: 911
  md: '# # Summary


    We have introduced methods that an agent can use to select actions in environments
    that are **deterministic**, **observable**, **static**, and **completely known**.
    In such cases, the agent can construct sequences of actions that achieve its goals;
    this process is called **search**


    +   - Before an agent can start searching for solutions, a **goal** must be identified
    and a well defined **problem** must be formulated.


    +   - A problem consists of five parts: the **initial state**, a set of **actions**,
    a **transition model** describing the results of those actions, a **goal test**
    function, and a **path cost** function.


    +   - The environment of the problem is represented by a **state space**. A **path**
    through the state space from the initial state to a goal state is a **solution**.


    +   - Search algorithms treat states and actions as **atomic**: they do not consider
    any internal structure they might possess.'
  merge: -1
