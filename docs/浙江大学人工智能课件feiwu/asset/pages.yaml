  md: '# # Problem-Solving by Search


    +   - In this part, we show how an agent can act by establishing _goals_ and considering
    sequences of actions that might achieve those goals.


    +   - A goal and a set of means for achieving the goal is called a _problem_,
    and the process of exploring what the means can do is called _search_.'
