- pgno: 455
  md: '# # Boosting (ensemble learning)


    +   - Boosting is a powerful technique for combining multiple ‘base’ classifiers
    to produce a form of committee whose performance can be significantly better than
    that of any of the base classifiers.

    +     - AdaBoost: adaptive boosting

    +     - E.g. Combining many weak classifiers to form a strong classifier


    +   - Boosting vs. Committee

    +     - The base classifiers are trained in sequence

    +     - Each base classifier is trained using a weighed form of the data set in
    which the weighing coefficient associated with each data point depends on the
    performance of the previous classifiers

    +       - Misclassified points get greater weight in next training'
  merge: -1
  img_proc: true
- pgno: 456
  md: '# Boosting


    +   - Combining the predictions of all classifiers through a weighted majority
    voting scheme:


    Schematic illustration of the boosting framework. Each base classifier $y_m(x)$
    is trained on a weighted form of the training set (blue arrows) in which the weights
    $w_n^{(m)}$ depend on the performance of the previous base classifier $y_{m-1}(x)$
    (green arrows). Once all base classifiers have been trained, they are combined
    to give the final classifier $Y_M(x)$ (red arrows).


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_456_0.png)'
  merge: -1
  img_proc: true
- pgno: 457
  md: '# # Boosting


    +   - **Algorithm:**


    +   1. Initialize the data weighting coefficients \(\{w_n\}\) by setting \(w_n^{(1)}
    = 1/N\) for \(n = 1, \dots, N\).


    +   2. For \(m = 1, \dots, M\):


    +   (a) Fit a classifier \(y_m(\mathbf{x})\) to the training data by minimizing
    the weighted error function


    +   \(J_m = \sum_{n=1}^N w_n^{(m)} I(y_m(\mathbf{x}_n) \neq t_n)\) where \(I(y_m(\mathbf{x}_n)
    \neq t_n)\) is the indicator function and equals 1 when \(y_m(\mathbf{x}_n) \neq
    t_n\) and 0 otherwise.


    +   (b) Evaluate the quantities


    +   \(\epsilon_m = \frac{\sum_{n=1}^N w_n^{(m)} I(y_m(\mathbf{x}_n) \neq t_n)}{\sum_{n=1}^N
    w_n^{(m)}}\)


    +   and then use these to evaluate


    +   \(\alpha_m = \ln \left\{ \frac{1 - \epsilon_m}{\epsilon_m} \right\}.\)


    +   (c) Update the data weighting coefficients


    +   \(w_n^{(m+1)} = w_n^{(m)} \exp \left\{ \alpha_m I(y_m(\mathbf{x}_n) \neq t_n)
    \right\}\)


    +   3. Make predictions using the final model, which is given by


    +   \(Y_M(\mathbf{x}) = \text{sign} \left( \sum_{m=1}^M \alpha_m y_m(\mathbf{x})
    \right).\)'
  merge: -1
  img_proc: true
