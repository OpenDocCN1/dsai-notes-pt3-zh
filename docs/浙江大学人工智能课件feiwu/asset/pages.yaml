  md: '# # An example: boxes of fruit


    \(p(B=r)=4/10\) (1.14)


    \(p(B=b)=6/10\) (1.15)


    respectively. Note that these satisfy \(p(B=r)+p(B=b)=1\).


    Now suppose that we pick a box at random, and it turns out to be the blue box.

    Then the probability of selecting an apple is just the fraction of apples in the
    blue

    box which is 3/4, and so \(p(F=a|B=b)=3/4\). In fact, we can write out all four

    conditional probabilities for the type of fruit, given the selected box


    \(p(F=a|B=r)=1/4\) (1.16)


    \(p(F=a|B=r)=3/4\) (1.17)


    \(p(F=a|B=b)=3/4\) (1.18)


    \(p(F=a|B=b)=1/4.\) (1.19)


    Again, note that these probabilities are normalized so that


    \(p(F=a|B=r)+p(F=o|B=r)=1\) (1.20)


    and similarly


    \(p(F=a|B=b)+p(F=o|B=b)=1.\) (1.21)


    We can now use the sum and product rules of probability to evaluate the overall

    probability of choosing an apple


    \(p(F=a)=p(F=a|B=r)p(B=r)+p(F=a|B=b)p(B=b)\)


    \(=\frac{1}{4}\times\frac{4}{10}+\frac{3}{4}\times\frac{6}{10}=\frac{11}{20}\)
    (1.22)


    from which it follows, using the sum rule, that \(p(F=o)=1-11/20=9/20\).


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_675_0.png)


    Suppose instead we are told that a piece of fruit has been selected and it is
    an

    orange, and we would like to know which box it came from. This requires that

    e we evaluate the probability distribution over boxes conditioned on the identity

    of the fruit, whereas the probabilities in (1.16)-(1.19) give the probability
    distribution

    over the fruit conditioned on the identity of the box. We can solve the problem
    of

    reversing the conditional probability by using Bayes’ theorem to give


    \(p(B=r|F=o)=\frac{p(F=o|B=r)p(B=r)}{p(F=o)}=\frac{3}{4}\times\frac{4}{10}\times\frac{20}{9}\times\frac{2}{3}.\)
    (1.23)


    From the sum rule, it then follows that \(p(B=b|F=o)=1-2/3=1/3\).'
