- pgno: 1059
  md: '# The Bias-Variance Decomposition


    When we discuss prediction models, prediction errors can be decomposed into two
    main subcomponents we care about: error due to "bias" and error due to "variance".
    There is a tradeoff between a model''s ability to minimize bias and variance.
    Understanding these two types of error can help us diagnose model results and
    avoid the mistake of **over-fitting** or **under-fitting**.


    **Error due to Bias:** The error due to bias is taken as the difference between
    the expected (or average) prediction of our model and the correct value which
    we are trying to predict. Of course you only have one model so talking about expected
    or average prediction values might seem a little strange. However, imagine you
    could repeat the whole model building process more than once; each time you gather
    new data and run a new analysis creating a new model. Due to randomness in the
    underlying data sets, the resulting models will have a range of predictions. Bias
    measures how far off in general these models'' predictions are from the correct
    value.


    **Error due to Variance:** The error due to variance is taken as the variability
    of a model prediction for a given data point. Again, imagine you can repeat the
    entire model building process multiple times. The variance is how much the predictions
    for a given point vary between different realizations of the model.'
