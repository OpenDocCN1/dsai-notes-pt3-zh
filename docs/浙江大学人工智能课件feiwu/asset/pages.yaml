  md: '# IBM Response to - Request for Information:


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_513_0.png)


    # Preparing for the Future of Artificial Intelligence


    +   - **Machine learning and reasoning:** Most current AI systems use supervised
    learning, using massive amounts of labeled data for training. Fundamental research
    is needed for AI systems that learn as humans do: through instruction, interaction
    (by discussing, debating, watching other people learn), by doing things (utilizing
    motor skills), generalizing from very little data, and by transferring skills
    across many tasks.

    +   - **Decision techniques:** For AI-based systems to succeed broadly, new techniques
    must be developed for modeling systemic risks, analyzing tradeoffs, detecting
    anomalies in context, analyzing data while preserving privacy, and making decisions
    under uncertainty.

    +   - **Domain-specific AI systems:** Deeply understanding the domains of human
    expertise, such as medicine, engineering, law and thousands more, poses particularly
    difficult issues of knowledge acquisition, representation, and reasoning. AI systems
    must ultimately perform professional-level tasks, such as managing contradictions,
    designing experiments, and negotiating.'
  merge: -1
  img_proc: true
- pgno: 514
  md: '# # IBM Response to - Request for Information:

    # Preparing for the Future of Artificial Intelligence


    +   - **Data assurance and trust**: Training and test data can be biased, incomplete,
    or maliciously compromised. Significant effort should be devoted to techniques
    for measuring entropy of datasets, validating the quality and integrity of data,
    and for making AI systems more objective, resilient, and accurate. People will
    trust AI systems when systems know users’ intents and priorities, explain their
    reasoning, learn from mistakes, and can be independently certified.

    +   - **Radically efficient computing infrastructure**: When deployed at scale,
    AI systems will need to handle unprecedented workloads that will require the development
    of high-performance distributed cloud systems, new computing architectures such
    as neuromorphic and approximate computing, and new devices such as quantum and
    new types of memory devices.

    +   - **Social AI**: AI systems will not work in isolation. They will be tightly
    connected to humans, in their professional and personal life. Thus they will need
    to have significant social capabilities, because their presence in our lives has
    a profound impact on our emotions and on our decision making capabilities. As
    an example, companion robots for elder care need to know how to relate to an elder
    person in order to reach the desired goals (such as making them take a pill) optimally.
    Sophisticated natural language capabilities will be needed for this purpose, to
    allow a natural interaction and dialog between humans and machines.'
  merge: -1
  img_proc: true
