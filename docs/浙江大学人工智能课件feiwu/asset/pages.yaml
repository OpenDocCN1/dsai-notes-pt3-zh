- pgno: 58
  md: '# # Monte-Carlo Simulation


    +   • The potential benefit of randomization is twofold: it can reduce the influence
    of systematic errors and it also allows one to make a distinction between states
    where it is "easy to win" (i.e., from where most reasonable policy pairs lead
    to a high reward terminal state) and states where it is "hard to win".


    +   • This distinction pays off because real-world opponents are also imperfect,
    and therefore it is worthwhile to bias the game towards states with many available
    winning strategies. Note that the concepts of "easy" and "hard" do not make sense
    against a perfect opponent.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# # Monte-Carlo Simulation


    +   • When the policy is randomized, computing the exact expected value of a state
    under the policy can be as hard as (or even harder than) computing its optimal
    value. Luckily, Monte-Carlo methods can give a good approximation to the expected
    value of a state. The idea is simply to run a number of simulations by sampling
    the actions according to the randomized policy. The rewards from these simulations
    are then averaged to give the Monte-Carlo value estimate of the initial state.


    In detail, the value of action \(a\) in position \(s_0\) (the root of the game
    tree) is estimated as follows. Run \(N\) simulations from state \(s_0\) until
    the end of the game, using a fixed randomized policy for both players. Let \(N(a)\)
    be the number of these simulations in which \(a\) is the first action taken in
    state \(s_0\). Let \(W(a)\) be the total reward collected by Black in these games.
    Then, the value of action \(a\) is estimated by \(\frac{W(a)}{N(a)}\).'
  merge: -1
  img_proc: true
