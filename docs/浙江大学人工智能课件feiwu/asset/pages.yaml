- pgno: 948
  md: '# Types of learning problems


    +   - **Supervised learning problems**: applications in which the training data
    comprises examples of the input vectors along with their corresponding target
    vectors are known.

    +     - Classification and Regression


    +   - **Unsupervised learning problems**: the training data consists of a set
    of input vectors **x** without any corresponding target values.

    +     - Density estimation

    +     - Clustering: k-means, mixture models, hierarchical clustering

    +     - Hidden Markov models


    +   - **Reinforcement learning problem**: finding suitable actions to take in
    a given situation in order to maximize a reward. Here the learning algorithm is
    not given examples of optimal outputs, in contrast to supervised learning, but
    must instead discover them by a process of trial and error. A general feature
    of reinforcement learning is the trade-off between exploration and exploitation.'
  merge: -1
  img_proc: true
