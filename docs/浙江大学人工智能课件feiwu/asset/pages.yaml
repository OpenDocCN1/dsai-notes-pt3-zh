- pgno: 842
  md: '# # Example problem: 8-puzzle


    +   - The standard formulation of 8-puzzle problem

    +     - States: A state description specifies the location of each of the eight
    tiles and

    +   the blank in one of the nine squares.

    +     - Initial state: Any state can be designated as the initial state. Note
    that any

    +   given goal can be reached from exactly half of the possible initial states

    +   (Exercise 3.4).

    +     - Actions: The simplest formulation defines the actions as movements of
    the

    +   blank space Left, Right, Up, or Down. Different subsets of these are possible

    +   depending on where the blank is.

    +     - Transition model: Given a state and action, this returns the resulting
    state;

    +   for example, if we apply Left to the start state in Figure 3.4, the resulting
    state

    +   has the 5 and the blank switched.

    +     - Goal test: This checks whether the state matches the goal configuration

    +   shown in Figure 3.4. (Other goal configurations are possible.)

    +     - Path cost: Each step costs 1, so the path cost is the number of steps
    in the

    +   path.'
  merge: -1
  img_proc: true
- pgno: 843
  md: '# # Example problem: 8-puzzle


    +   • The sizes of states

    +     – The 8-puzzle belongs to the family of sliding-block puzzles, which are
    often used as test problems for new search algorithms in AI. This family is known
    to be NP-complete.

    +     – The 8-puzzle has 9!/2=181,440 reachable states and is easily solved. The
    15-puzzle (on a 4×4 board) has around 1.3 trillion states, and random instances
    can be solved optimally in a few milliseconds by the best search algorithms. The
    24-puzzle (on a 5 × 5 board) has around 10^25 states, and random instances take
    several hours to solve optimally.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_843_0.png)'
  merge: -1
  img_proc: true
