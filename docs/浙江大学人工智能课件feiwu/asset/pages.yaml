- pgno: 912
  md: '# # Summary


    We have introduced methods that an agent can use to select actions in environments
    that are **deterministic**, **observable**, **static**, and **completely known**.
    In such cases, the agent can construct sequences of actions that achieve its goals;
    this process is called **search**


    +   - A general TREE-SEARCH algorithm considers all possible paths to find a solution,
    whereas a GRAPH-SEARCH algorithm avoids consideration of redundant paths.


    +   - Search algorithms are judged on the basis of **completeness**, **optimality**,
    **time complexity**, and **space complexity**. Complexity depends on b, the branching
    factor in the state space, and d, the depth of the shallowest solution.'
