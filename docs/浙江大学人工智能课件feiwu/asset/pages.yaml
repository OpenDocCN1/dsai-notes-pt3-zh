- pgno: 536
  md: '# # Linear model for Regression


    +   - The goal of regression is to predict the value of one or more continuous
    target variables **t** given the value of a D-dimensional vector **X** of input
    variables.


    +   - The simplest form of linear regression models are also linear functions
    of the input variables.


    +   - However, we can obtain a much more useful class of functions by taking linear
    combinations of a fixed set of nonlinear functions of the input variables, known
    as **basis functions**.'
  merge: -1
  img_proc: true
- pgno: 537
  md: '# # Linear Basis Function Models


    The simplest linear model for regression is one that involves a linear combination
    of

    the input variables


    \(y(\mathbf{x}, \mathbf{w}) = w_0 + w_1 x_1 + \dots + w_D x_D\) (3.1)


    where \(\mathbf{x} = (x_1, \dots, x_D)^T\). This is often simply known as _linear
    regression_. The key

    property of this model is that it is a linear function of the parameters \(w_0,
    \dots, w_D\). It is

    also, however, a linear function of the input variables \(x_i\), and this imposes
    significant

    limitations on the model. We therefore extend the class of models by considering

    linear combinations of fixed nonlinear functions of the input variables, of the
    form


    \(y(\mathbf{x}, \mathbf{w}) = w_0 + \sum_{j=1}^{M-1} w_j \phi_j(\mathbf{x})\)
    (3.2)


    where \(\phi_j(\mathbf{x})\) are known as _basis functions_. By denoting the maximum
    value of the

    index \(j\) by \(M-1\), the total number of parameters in this model will be \(M\).


    The parameter \(w_0\) allows for any fixed offset in the data and is sometimes
    called

    a _bias parameter_ (not to be confused with ‘bias’ in a statistical sense). It
    is often

    convenient to define an additional dummy ‘basis function’ \(\phi_0(\mathbf{x})
    = 1\) so that


    \(y(\mathbf{x}, \mathbf{w}) = \sum_{j=0}^{M-1} w_j \phi_j(\mathbf{x}) = \mathbf{w}^T
    \boldsymbol{\phi}(\mathbf{x})\) (3.3)


    where \(\mathbf{w} = (w_0, \dots, w_{M-1})^T\) and \(\boldsymbol{\phi} = (\phi_0,
    \dots, \phi_{M-1})^T\).'
  merge: -1
  img_proc: true
- pgno: 538
  md: '# # basis functions


    There are many other possible choices for the basis functions, for example


    \(\phi_j(x) = \exp \left\{ - \frac{(x - \mu_j)^2}{2s^2} \right\}\) (3.4)


    where the \(\mu_j\) govern the locations of the basis functions in input space,
    and the parameter \(s\) governs their spatial scale. These are usually referred
    to as ‘Gaussian’ basis functions, although it should be noted that they are not
    required to have a probabilistic interpretation, and in particular the normalization
    coefficient is unimportant because these basis functions will be multiplied by
    adaptive parameters \(w_j\).


    Another possibility is the sigmoidal basis function of the form


    \(\phi_j(x) = \sigma \left( \frac{x - \mu_j}{s} \right)\) (3.5)


    where \(\sigma(a)\) is the logistic sigmoid function defined by


    \(\sigma(a) = \frac{1}{1 + \exp(-a)}.\) (3.6)


    Equivalently, we can use the ‘tanh’ function because this is related to the logistic
    sigmoid by \(\tanh(a) = 2\sigma(a) - 1\), and so a general linear combination
    of logistic sigmoid functions is equivalent to a general linear combination of
    ‘tanh’ functions. These various choices of basis function are illustrated in Figure
    3.1.'
  merge: -1
  img_proc: true
