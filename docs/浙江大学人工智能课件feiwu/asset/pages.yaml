- pgno: 1385
  md: '# LSTM: look into the gradient flow


    **Looking at the full LSTM gradient**  To understand why nothing really changes
    when using the full gradient, we need to look at what happens to the recursive
    gradient when we take the full gradient. As we stated before, the recursive derivative
    is the main thing that is causing the vanishing gradient, so lets expand out the
    full derivative for $\frac{\partial C_t}{\partial C_{t-1}}$. First recall that
    in the LSTM, $C_t$ is a function of $f_t$ (the forget gate), $i_t$ (the input
    gate), and $\tilde{C}_t$ (the candidate cell state), each of these being a function
    of $C_{t-1}$ (since they are all functions of $h_{t-1}$). Via the multivariate
    chain rule we get:


    ```

    $$\begin{aligned}

    f_t &= \sigma(W_f\cdot[h_{t-1},x_t]+b_f)\\

    i_t &= \sigma(W_i\cdot[h_{t-1},x_t]+b_i)\\

    \tilde{C}_t &= \tanh(W_C\cdot[h_{t-1},x_t]+b_C)\\

    C_t &= f_t*C_{t-1}+i_t*\tilde{C}_t\\

    o_t &= \sigma(W_o\cdot[h_{t-1},x_t]+b_o)\\

    h_t &= o_t*\tanh(C_t)

    \end{aligned}$$

    ```


    ```

    $$\frac{\partial C_t}{\partial C_{t-1}} = \frac{\partial C_t}{\partial f_t}\frac{\partial
    f_t}{\partial h_{t-1}}\frac{\partial h_{t-1}}{\partial C_{t-1}} + \frac{\partial
    C_t}{\partial i_t}\frac{\partial i_t}{\partial h_{t-1}}\frac{\partial h_{t-1}}{\partial
    C_{t-1}} + \frac{\partial C_t}{\partial \tilde{C}_t}\frac{\partial \tilde{C}_t}{\partial
    h_{t-1}}\frac{\partial h_{t-1}}{\partial C_{t-1}} + \frac{\partial C_t}{\partial
    C_{t-1}}$$

    ```


    ```

    $$\begin{aligned}

    \frac{\partial C_t}{\partial C_{t-1}} ={}& C_{t-1}\sigma''(\cdot)W_f*o_{t-1}\tanh''(C_{t-1})\\

    &+\tilde{C}_t\sigma''(\cdot)W_i*o_{t-1}\tanh''(C_{t-1})\\

    &+i_t\tanh''(\cdot)W_C*o_{t-1}\tanh''(C_{t-1})\\

    &+f_t

    \end{aligned}$$

    ```'
