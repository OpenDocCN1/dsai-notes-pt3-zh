  md: '# # Conjugate priors


    +   - Conjugacy: If we choose a prior, then the posterior distribution will have
    the same functional form as the prior.


    +   - For any member of the exponential family: \( p(x|\eta) = h(x)g(\eta) \exp
    \left\{ \eta^T u(x) \right\} \)


    +   - there exists a conjugate prior: \( p(\eta|\chi, \nu) = f(\chi, \nu)g(\eta)^\nu
    \exp \left\{ \nu\eta^T \chi \right\} \)'
