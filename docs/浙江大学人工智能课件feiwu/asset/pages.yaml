    for learning to generate an output sequence (**y**<sup>(1)</sup>,...,**y**<sup>(_n<sub>y</sub>_)</sup>)
    given an input sequence (**x**<sup>(1)</sup>,**x**<sup>(2)</sup>,...,**x**<sup>(_n<sub>x</sub>_)</sup>).
    It is composed of an encoder RNN that reads the input sequence and a decoder RNN
    that generates the output sequence (or computes the probability of a given output
    sequence). The final hidden state of the encoder RNN is used to compute a generally
    fixed-size context variable _C_ which represents a semantic summary of the input
    sequence and is given as input to the decoder RNN.'
