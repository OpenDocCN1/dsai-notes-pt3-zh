- pgno: 794
  md: '# # Greedy best-first search


    Figure 3.23 shows the progress of a greedy best-first search using _h<sub>SLD</sub>_
    to find a path from Arad to Bucharest. The first node to be expanded from Arad
    will be Sibiu because it is closer to Bucharest than either Zerind or Timisoara.
    The next node to be expanded will be Fagaras because it is closest. Fagaras in
    turn generates Bucharest, which is the goal. For this particular problem, greedy
    best-first search using _h<sub>SLD</sub>_ finds a solution without ever expanding
    a node that is not on the solution path; hence, its search cost is minimal. It
    is not optimal, however: the path via Sibiu and Fagaras to Bucharest is 32 kilometers
    longer than the path through Rimnicu Vilcea and Pitesti. This shows why the algorithm
    is called “greedy”—at each step it tries to get as close to the goal as it can.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_794_0.png)


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_794_1.png)'
