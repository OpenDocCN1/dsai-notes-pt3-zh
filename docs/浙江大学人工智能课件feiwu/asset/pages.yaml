    +   - **Initial state**: Any state can be designated as the initial state.


    +   - **Actions**: In this simple environment, each state has just three actions:
    Left, Right, and Suck. Larger environments might also include Up and Down.


    +   - **Transition model**: The actions have their expected effects, except that
    moving Left in the leftmost square, moving Right in the rightmost square, and
    Sucking in a clean square have no effect. The complete state space is shown in
    Figure 3.3.


    +   - **Goal test**: This checks whether all the squares are clean.


    +   - **Path cost**: Each step costs 1, so the path cost is the number of steps
