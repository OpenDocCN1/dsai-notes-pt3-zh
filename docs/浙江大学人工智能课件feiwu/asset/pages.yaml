- pgno: 439
  md: '# # Expectation-Maximization algorithm for GMM


    \(\ln p(\mathbf{X}|\pi,\mu,\Sigma)=\sum_{n=1}^N \ln \left\{\sum_{k=1}^K \pi_k\mathcal{N}(\mathbf{x}_n|\mu_k,\Sigma_k)\right\}\)

    \(\sum_{k=1}^K \pi_k=1\quad 0 \leq \pi_k \leq 1\)


    # ## E Step


    \(\gamma(z_{nk})=\frac{\pi_k\mathcal{N}(\mathbf{x}_n|\mu_k,\Sigma_k)}{\sum_j \pi_j\mathcal{N}(\mathbf{x}_n|\mu_j,\Sigma_j)}\)


    > Each iteration will increase the log likelihood function.


    # ## M Step


    +   - Solve \(\mu_k\) : \(\frac{\partial \ln p(\mathbf{X}|\pi,\mu,\Sigma)}{\partial
    \mu_k}=0 \Rightarrow 0 = -\sum_{n=1}^N \frac{\pi_k\mathcal{N}(\mathbf{x}_n|\mu_k,\Sigma_k)}{\sum_j
    \pi_j\mathcal{N}(\mathbf{x}_n|\mu_j,\Sigma_j)} \Sigma_k^{-1}(\mathbf{x}_n - \mu_k)\)

    +     \(\Rightarrow \mu_k = \frac{1}{N_k} \sum_{n=1}^N \gamma(z_{nk})\mathbf{x}_n
    \quad N_k = \sum_{n=1}^N \gamma(z_{nk})\)


    +   - Solve \(\Sigma_k\) : \(\frac{\partial \ln p(\mathbf{X}|\pi,\mu,\Sigma)}{\partial
    \Sigma_k}=0 \Rightarrow \Sigma_k = \frac{1}{N_k} \sum_{n=1}^N \gamma(z_{nk})(\mathbf{x}_n
    - \mu_k)(\mathbf{x}_n - \mu_k)^\mathrm{T}\)


    +   - Solve \(\pi_k\) : \(\frac{\partial}{\partial \pi_k}\left\{ \ln p(\mathbf{X}|\pi,\mu,\Sigma)
    + \lambda \left( \sum_{k=1}^K \pi_k - 1 \right) \right\}=0 \Rightarrow 0 = \sum_{n=1}^N
    \frac{\mathcal{N}(\mathbf{x}_n|\mu_k,\Sigma_k)}{\sum_j \pi_j\mathcal{N}(\mathbf{x}_n|\mu_j,\Sigma_j)}
    + \lambda \Rightarrow \pi_k = \frac{N_k}{N}\)'
