  md: '# # Decision Theory


    Suppose we have an input vector x together with a corresponding vector t of target
    variables, and our goal is to predict t given a new value for x. For regression
    problems, t will comprise continuous variables, whereas for classification problems
    t will represent class labels. The joint probability distribution p(x, t) provides
    a complete summary of the uncertainty associated with these variables. Determination
    of p(x, t) from a set of training data is an example of inference and is typically
    a very difficult problem whose solution forms the subject of much of this book.
    In a practical application, however, we must often make a specific prediction
    for the value of t, or more generally take a specific action based on our understanding
    of the values t is likely to take, and this aspect is the subject of decision
    theory.


    Consider, for example, a medical diagnosis problem in which we have taken an X-ray
    image of a patient, and we wish to determine whether the patient has cancer or
    not. In this case, the input vector x is the set of pixel intensities in the image,
    and output variable t will represent the presence of cancer, which we denote by
    the class C1, or the absence of cancer, which we denote by the class C2. We might,
    for instance, choose t to be a binary variable such that t = 0 corresponds to
    class C1 and t = 1 corresponds to class C2. We shall see later that this choice
    of label values is particularly convenient for probabilistic models. The general
    inference problem then involves determining the joint distribution p(x, Ck), or
    equivalently p(x, t), which gives us the most complete probabilistic description
    of the situation. Although this can be a very useful and informative quantity,
    in the end we must decide either to give treatment to the patient or not, and
    we would like this choice to be optimal in some appropriate sense (Duda and Hart,
    1973). This is the decision step, and it is the subject of decision theory to
    tell us how to make optimal decisions given the appropriate probabilities. We
    shall see that the decision stage is generally very simple, even trivial, once
    we have solved the inference problem.'
  merge: -1
  img_proc: true
- pgno: 991
  md: '# # Decision Theory


    Before giving a more detailed analysis, let us first consider informally how we
    might expect probabilities to play a role in making decisions. When we obtain
    the X-ray image **x** for a new patient, our goal is to decide which of the two
    classes to assign to the image. We are interested in the probabilities of the
    two classes given the image, which are given by _p_(_C<sub>k</sub>_|**x**). Using
    Bayes’ theorem, these probabilities can be expressed in the form


    \(p(C_k|\mathbf{x})=\frac{p(\mathbf{x}|C_k)p(C_k)}{p(\mathbf{x})}.\) (1.77)


    Note that any of the quantities appearing in Bayes’ theorem can be obtained from
    the joint distribution _p_(**x**_,C<sub>k</sub>_) by either marginalizing or conditioning
    with respect to the appropriate variables. We can now interpret _p_(_C<sub>k</sub>_)
    as the prior probability for the class _C<sub>k</sub>_, and _p_(_C<sub>k</sub>_|**x**)
    as the corresponding posterior probability. Thus _p_(_C_<sub>1</sub>) represents
    the probability that a person has cancer, before we take the X-ray measurement.
    Similarly, _p_(_C_<sub>1</sub>|**x**) is the corresponding probability, revised
    using Bayes’ theorem in light of the information contained in the X-ray. If our
    aim is to minimize the chance of assigning **x** to the wrong class, then intuitively
    we would choose the class having the higher posterior probability. We now show
    that this intuition is correct, and we also discuss more general criteria for
    making decisions.'
  merge: -1
  img_proc: true
- pgno: 992
  md: '# # Minimizing the misclassification rate


    Suppose that our goal is simply to make as few misclassifications as possible.
    We need a rule that assigns each value of x to one of the available classes. Such
    a rule will divide the input space into regions R<sub>k</sub> called decision
    regions, one for each class, such that all points in R<sub>k</sub> are assigned
    to class C<sub>k</sub>. The boundaries between decision regions are called decision
    boundaries or decision surfaces. Note that each decision region need not be contiguous
    but could comprise some number of disjoint regions. We shall encounter examples
    of decision boundaries and decision regions in later chapters. In order to find
    the optimal decision rule, consider first of all the case of two classes, as in
    the cancer problem for instance. A mistake occurs when an input vector belonging
    to class C<sub>1</sub> is assigned to class C<sub>2</sub> or vice versa. The probability
    of this occurring is given by


    ```

    \(p(mistake) = p(x \in \mathcal{R}_1, C_2) + p(x \in \mathcal{R}_2, C_1)\)

    \(= \int_{\mathcal{R}_1} p(x, C_2) \, \mathrm{d}x + \int_{\mathcal{R}_2} p(x,
    C_1) \, \mathrm{d}x.\) (1.78)

    ```'
  merge: -1
  img_proc: true
- pgno: 993
  md: '# # Minimizing the misclassification rate


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_993_0.png)


    **Figure 1.24** Schematic illustration of the joint probabilities _p_(_x_, C_<sub>k</sub>_)
    for each of two classes plotted against _x_, together with the decision boundary
    _x_ = x̃. Values of _x_ ≥ x̃ are classified as class C<sub>2</sub> and hence belong
    to decision region R<sub>2</sub>, whereas points _x_ < x̃ are classified as C<sub>1</sub>
    and belong to R<sub>1</sub>. Errors arise from the blue, green, and red regions,
    so that for _x_ < x̃ the errors are due to points from class C<sub>2</sub> being
    misclassified as C<sub>1</sub> (represented by the sum of the red and green regions),
    and conversely for points in the region _x_ ≥ x̃ the errors are due to points
    from class C<sub>1</sub> being misclassified as C<sub>2</sub> (represented by
    the blue region). As we vary the location x̃ of the decision boundary, the combined
    areas of the blue and green regions remain constant, whereas the size of the red
    region varies. The optimal choice for x̃ is where the curves for _p_(_x_, C<sub>1</sub>)
    and _p_(_x_, C<sub>2</sub>) cross, corresponding to x̃ = _x_<sub>0</sub>, because
    in this case the red region disappears. This is equivalent to the minimum misclassification
    rate decision rule, which assigns each value of _x_ to the class having the higher
    posterior probability _p_(C_<sub>k</sub>_|_x_).'
  merge: -1
  img_proc: true
- pgno: 994
  md: '# # Minimizing the misclassification rate


    For the more general case of _K_ classes, it is slightly easier to maximize the
    probability of being correct, which is given by


    ```

    \(p(\text{correct})=\sum_{k=1}^Kp\left(\mathbf{x}\in\mathcal{R}_k,C_k\right)\)

    \(=\sum_{k=1}^K\int_{\mathcal{R}_k}p\left(\mathbf{x},C_k\right)\mathrm{d}\mathbf{x}\)
    (1.79)

    ```


    which is maximized when the regions R_<sub>k</sub>_ are chosen such that each
    **x** is assigned to the class for which _p_(**x**_,C<sub>k</sub>_) is largest.
    Again, using the product rule _p_(**x**_,C<sub>k</sub>_)=_p_(_C<sub>k</sub>_|**x**)_p_(**x**),
    and noting that the factor of _p_(**x**) is common to all terms, we see that each
    **x** should be assigned to the class having the largest posterior probability
    _p_(_C<sub>k</sub>_|**x**).'
  merge: -1
  img_proc: true
- pgno: 995
  md: '# # Minimizing the expected loss


    For many applications, our objective will be more complex than simply minimizing
    the number of misclassifications. Let us consider again the medical diagnosis
    problem. We note that, if a patient who does not have cancer is incorrectly diagnosed
    as having cancer, the consequences may be some patient distress plus the need
    for further investigations. Conversely, if a patient with cancer is diagnosed
    as healthy, the result may be premature death due to lack of treatment. Thus the
    consequences of these two types of mistake can be dramatically different. It would
    clearly be better to make fewer mistakes of the second kind, even if this was
    at the expense of making more mistakes of the first kind.

    We can formalize such issues through the introduction of a _loss function_, also
    called a _cost function_, which is a single, overall measure of loss incurred
    in taking any of the available decisions or actions. Our goal is then to minimize
    the total loss incurred. Note that some authors consider instead a _utility function_,
    whose value they aim to maximize. These are equivalent concepts if we take the
    utility to be simply the negative of the loss, and throughout this text we shall
    use the loss function convention. Suppose that, for a new value of x, the true
    class is C<sub>k</sub> and that we assign x to class C<sub>j</sub> (where j may
    or may not be equal to k). In so doing, we incur some level of loss that we denote
    by L<sub>kj</sub>, which we can view as the k, j element of a _loss matrix_. For
    instance, in our cancer example, we might have a loss matrix of the form shown
    in Figure 1.25. This particular loss matrix says that there is no loss incurred
    if the correct decision is made, there is a loss of 1 if a healthy patient is
    diagnosed as having cancer, whereas there is of loss of 1000 if a patient having
    cancer is diagnosed as healthy.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_995_0.png)


    **Figure 1.25** An example of a loss matrix with elements L<sub>kj</sub> for the
    cancer treatment problem. The rows correspond to the true class, whereas the columns
    correspond to the assignment of class made by our decision criterion.'
  merge: -1
  img_proc: true
- pgno: 996
  md: '# Minimizing the expected loss


    The optimal solution is the one which minimizes the loss function. However, the
    loss function depends on the true class, which is unknown. For a given input vector
    x, our uncertainty in the true class is expressed through the joint probability
    distribution p(x, C_k), and so we seek instead to minimize the average loss, where
    the average is computed with respect to this distribution, which is given by


    $$\mathbb{E}[L] = \sum_k \sum_j \int_{\mathcal{R}_j} L_{kj}p(x,C_k)\,dx. \tag{1.80}$$


    Each x can be assigned independently to one of the decision regions $\mathcal{R}_j$.
    Our goal is to choose the regions $\mathcal{R}_j$ in order to minimize the expected
    loss (1.80), which implies that for each x we should minimize $\sum_k L_{kj}p(x,C_k)$.
    As before, we can use the product rule $p(x,C_k)=p(C_k|x)p(x)$ to eliminate the
    common factor of $p(x)$. Thus the decision rule that minimizes the expected loss
    is the one that assigns each new x to the class j for which the quantity


    $$\sum_k L_{kj}p(C_k|x) \tag{1.81}$$


    is a minimum. This is clearly trivial to do, once we know the posterior class
    probabilities $p(C_k|x)$.'
  merge: -1
  img_proc: true
- pgno: 997
  md: '# # The reject option


    We have seen that classification errors arise from the regions of input space
    where the largest of the posterior probabilities \(p(C_k|x)\) is significantly
    less than unity, or equivalently where the joint distributions \(p(x, C_k)\) have
    comparable values. These are the regions where we are relatively uncertain about
    class membership. In some applications, it will be appropriate to avoid making
    decisions on the difficult cases in anticipation of a lower error rate on those
    examples for which a classification decision is made. This is known as the **reject
    option**. For example, in our hypothetical medical illustration, it may be appropriate
    to use an automatic system to classify those X-ray images for which there is little
    doubt as to the correct class, while leaving a human expert to classify the more
    ambiguous cases. We can achieve this by introducing a threshold \(\theta\) such
    that we reject inputs for which the largest of the posterior probabilities \(p(C_k|x)\)
    is less than or equal to \(\theta\). This is illustrated for the case of two classes,
    and a single continuous input variable \(x\), in Figure 1.26. Note that setting
    \(\theta = 1\) will ensure that all examples are rejected, whereas if there are
    \(K\) classes then setting \(\theta < 1/K\) will ensure that no examples are rejected.
    Thus fraction of examples that get rejected is controlled by the value of \(\theta\).


    We can easily extend the reject criterion to minimize the expected loss, when
    a loss matrix is given, taking account of the loss incurred when a reject decision
    is made.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_997_0.png)'
  merge: -1
  img_proc: true
- pgno: 998
  md: '# Inference and decision


    We have broken the classification problem down into two separate stages, the *inference
    stage* in which we use training data to learn a model for \(p(C_k \mid x)\), and
    the subsequent *decision stage* in which we use these posterior probabilities
    to make optimal class assignments. An alternative possibility would be to solve
    both problems together and simply learn a function that maps inputs \(x\) directly
    into decisions. Such a function is called a *discriminant function*.'
  merge: -1
  img_proc: true
- pgno: 999
  md: '# three distinct approaches to solving decision problems


    (a) First solve the inference problem of determining the class-conditional densities
    \( p(x|C_k) \) for each class \( C_k \) individually. Also separately infer the
    prior class probabilities \( p(C_k) \). Then use Bayes’ theorem in the form


    \( p(C_k|x) = \frac{p(x|C_k)p(C_k)}{p(x)} \) (1.82)


    to find the posterior class probabilities \( p(C_k|x) \). As usual, the denominator
    in Bayes’ theorem can be found in terms of the quantities appearing in the numerator,
    because


    \( p(x) = \sum_k p(x|C_k)p(C_k) \). (1.83)


    Equivalently, we can model the joint distribution \( p(x, C_k) \) directly and
    then normalize to obtain the posterior probabilities. Having found the posterior
    probabilities, we use decision theory to determine class membership for each new
    input \( x \). Approaches that explicitly or implicitly model the distribution
    of inputs as well as outputs are known as **generative models**, because by sampling
    from them it is possible to generate synthetic data points in the input space.'
  merge: -1
  img_proc: true
