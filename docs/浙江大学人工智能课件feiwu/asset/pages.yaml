  md: "# # Alpha-Beta Pruning\n\n+   - Stages in the calculation of the optimal decision\
    \ for the game tree in Figure 5.2\n+     - At each point, we show the range of\
    \ possible values for each nodes\n\n```\nfunction ALPHA-BETA-SEARCH(state) returns\
    \ an action\n    v ← MAX-VALUE(state, −∞, +∞)\n    return the action in ACTIONS(state)\
    \ with value v\n\nfunction MAX-VALUE(state, α, β) returns a utility value\n  \
    \  if TERMINAL-TEST(state) then return UTILITY(state)\n    v ← −∞\n    for each\
