  md: '# Curse of Dimensionality


    In the polynomial curve fitting example we had just one input variable $x$. For
    practical applications of pattern recognition, however, we will have to deal with
    spaces of high dimensionality comprising many input variables. As we now discuss,
    this poses some serious challenges and is an important factor influencing the
    design of pattern recognition techniques.


    In order to illustrate the problem we consider a synthetically generated data
    set representing measurements taken from a pipeline containing a mixture of oil,
    water, and gas (Bishop and James, 1993). These three materials can be present
    in one of three different geometrical configurations known as ‘homogeneous’, ‘annular’,
    and ‘laminar’, and the fractions of the three materials can also vary. Each data
    point comprises a 12-dimensional input vector consisting of measurements taken
    with gamma ray densitometers that measure the attenuation of gamma rays passing
    along narrow beams through the pipe. This data set is described in detail in Appendix
    A.


    **Figure 1.19** Scatter plot of the oil flow data for input variables $x_6$ and
    $x_7$, in which red denotes the ‘homogeneous’ class, green denotes the ‘annular’
    class, and blue denotes the ‘laminar’ class. Our goal is to classify the new test
    point denoted by ‘×’.


