- pgno: 629
  md: '# # Marginal Gaussian Distributions


    \(p(\mathbf{x}_a, \mathbf{x}_b) := -\frac{1}{2}(\mathbf{x}_a - \mu_a)^\mathrm{T}
    \Lambda_{aa} (\mathbf{x}_a - \mu_a) - \frac{1}{2}(\mathbf{x}_a - \mu_a)^\mathrm{T}
    \Lambda_{ab} (\mathbf{x}_b - \mu_b) - \frac{1}{2}(\mathbf{x}_b - \mu_b)^\mathrm{T}
    \Lambda_{ba} (\mathbf{x}_a - \mu_a) - \frac{1}{2}(\mathbf{x}_b - \mu_b)^\mathrm{T}
    \Lambda_{bb} (\mathbf{x}_b - \mu_b)\)


    \(p(\mathbf{x}_a) = \int p(\mathbf{x}_a, \mathbf{x}_b) \, \mathrm{d}\mathbf{x}_b\)


    1. considering the terms involving \(\mathbf{x}_b\) and then completing the square:


    \(-\frac{1}{2} \mathbf{x}_b^\mathrm{T} \Lambda_{bb} \mathbf{x}_b + \mathbf{x}_b^\mathrm{T}
    \mathbf{m} = -\frac{1}{2} (\mathbf{x}_b - \Lambda_{bb}^{-1} \mathbf{m})^\mathrm{T}
    \Lambda_{bb} (\mathbf{x}_b - \Lambda_{bb}^{-1} \mathbf{m}) + \frac{1}{2} \mathbf{m}^\mathrm{T}
    \Lambda_{bb}^{-1} \mathbf{m}\)


    \(\int \exp \left\{ -\frac{1}{2} (\mathbf{x}_b - \Lambda_{bb}^{-1} \mathbf{m})^\mathrm{T}
    \Lambda_{bb} (\mathbf{x}_b - \Lambda_{bb}^{-1} \mathbf{m}) \right\} \, \mathrm{d}\mathbf{x}_b
    \qquad \mathbf{m} = \Lambda_{bb} \mu_b - \Lambda_{ba} (\mathbf{x}_a - \mu_a)\)


    2. considering the remaining terms that depend on \(\mathbf{x}_a\):


    \(\frac{1}{2} [\Lambda_{bb} \mu_b - \Lambda_{ba} (\mathbf{x}_a - \mu_a)]^\mathrm{T}
    \Lambda_{bb}^{-1} [\Lambda_{bb} \mu_b - \Lambda_{ba} (\mathbf{x}_a - \mu_a)] -
    \frac{1}{2} \mathbf{x}_a^\mathrm{T} \Lambda_{aa} \mathbf{x}_a + \mathbf{x}_a^\mathrm{T}
    (\Lambda_{aa} \mu_a + \Lambda_{ab} \mu_b) + \text{const}\)


    \(= -\frac{1}{2} \mathbf{x}_a^\mathrm{T} (\Lambda_{aa} - \Lambda_{ab} \Lambda_{bb}^{-1}
    \Lambda_{ba}) \mathbf{x}_a + \mathbf{x}_a^\mathrm{T} (\Lambda_{aa} - \Lambda_{ab}
    \Lambda_{bb}^{-1} \Lambda_{ba})^{-1} \mu_a + \text{const}\)


    \(\begin{pmatrix} \Lambda_{aa} & \Lambda_{ab} \\ \Lambda_{ba} & \Lambda_{bb} \end{pmatrix}^{-1}
    = \begin{pmatrix} \Sigma_{aa} & \Sigma_{ab} \\ \Sigma_{ba} & \Sigma_{bb} \end{pmatrix}\)


    \((\Lambda_{aa} - \Lambda_{ab} \Lambda_{bb}^{-1} \Lambda_{ba})^{-1} = \Sigma_{aa}\)


    \(\Sigma_a = (\Lambda_{aa} - \Lambda_{ab} \Lambda_{bb}^{-1} \Lambda_{ba})^{-1}\)


    \(\Sigma_a (\Lambda_{aa} - \Lambda_{ab} \Lambda_{bb}^{-1} \Lambda_{ba}) \mu_a
    = \mu_a\)


    \(\mathbb{E}[\mathbf{x}_a] = \mu_a\)


    \(\text{cov}[\mathbf{x}_a] = \Sigma_{aa}\)'
