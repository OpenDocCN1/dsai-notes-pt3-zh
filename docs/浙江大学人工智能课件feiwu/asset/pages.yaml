- pgno: 1253
  md: '# # ConvNet Architecture


    +   - Convolutional Layer -- Summary

    +     - Accepts a volume of size W₁×H₁×D₁

    +     - Requires four hyperparameters:

    +       - Number of filters K,

    +       - their spatial extent F,

    +       - the stride S,

    +       - the amount of zero padding P.

    +     - Produces a volume of size W₂×H₂×D₂ where:

    +       - W₂=(W₁−F+2P)/S+1

    +       - H₂=(H₁−F+2P)/S+1 (i.e. width and height are computed equally by symmetry)

    +       - D₂=K

    +     - With parameter sharing, it introduces F·F·D₁ weights per filter, for a
    total of (F·F·D₁)·K weights and K biases.

    +     - In the output volume, the d-th depth slice (of size W₂×H₂) is the result
    of performing a valid convolution of the d-th filter over the input volume with
    a stride of S, and then offset by d-th bias.'
  merge: -1
  img_proc: true
- pgno: 1254
  md: '# # ConvNet Architecture


    +   • Pooling Layer

    +     – It is common to periodically insert a Pooling layer in-between successive
    Conv layers in a ConvNet architecture.

    +     – Its function is to progressively reduce the spatial size of the representation
    to reduce the amount of parameters and computation in the network, and hence to
    also control overfitting.

    +     – The Pooling Layer operates independently on every depth slice of the input
    and resizes it spatially, using the MAX operation.

    +     – The most common form is a pooling layer with filters of size 2x2 applied
    with a stride of 2 downsamples every depth slice in the input by 2 along both
    width and height, discarding 75% of the activations. Every MAX operation would
    in this case be taking a max over 4 numbers (little 2x2 region in some depth slice).
    The depth dimension remains unchanged.'
  merge: -1
  img_proc: true
- pgno: 1255
  md: '# ConvNet Architecture


    +   - **Pooling Layer – General pooling summary**

    +     - Accepts a volume of size $W_1 \times H_1 \times D_1$

    +     - Requires three hyperparameters:

    +       - their spatial extent $F$,

    +       - the stride $S$,

    +     - Produces a volume of size $W_2 \times H_2 \times D_2$ where:

    +       - $W_2=(W_1-F)/S+1$

    +       - $H_2=(H_1-F)/S+1$

    +       - $D_2=D_1$

    +     - Introduces zero parameters since it computes a fixed function of the input

    +     - Note that it is not common to use zero-padding for Pooling layers


    It is worth noting that there are only two commonly seen variations of the max
    pooling layer found in practice: A pooling layer with $F=3,S=2$ (also called *overlapping
    pooling*), and more commonly $F=2,S=2$. Pooling sizes with larger receptive fields
    are too destructive'
  merge: -1
  img_proc: true
