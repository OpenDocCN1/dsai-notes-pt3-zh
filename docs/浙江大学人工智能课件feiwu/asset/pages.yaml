- pgno: 714
  md: '# # Minimizing the misclassification rate


    For the more general case of _K_ classes, it is slightly easier to maximize the
    probability of being correct, which is given by


    \(p(\text{correct})=\sum_{k=1}^K p(\mathbf{x} \in \mathcal{R}_k, C_k)=\sum_{k=1}^K
    \int_{\mathcal{R}_k} p(\mathbf{x}, C_k) \mathrm{d} \mathbf{x}\) (1.79)


    which is maximized when the regions R<sub>k</sub> are chosen such that each **x**
    is assigned to the class for which _p_(**x**, _C<sub>k</sub>_) is largest. Again,
    using the product rule _p_(**x**, _C<sub>k</sub>_) = _p_(_C<sub>k</sub>_|**x**)_p_(**x**),
    and noting that the factor of _p_(**x**) is common to all terms, we see that each
    **x** should be assigned to the class having the largest posterior probability
    _p_(_C<sub>k</sub>_|**x**).'
  merge: -1
  img_proc: true
- pgno: 715
  md: '# Minimizing the expected loss


    For many applications, our objective will be more complex than simply minimizing
    the number of misclassifications. Let us consider again the medical diagnosis
    problem. We note that, if a patient who does not have cancer is incorrectly diagnosed
    as having cancer, the consequences may be some patient distress plus the need
    for further investigations. Conversely, if a patient with cancer is diagnosed
    as healthy, the result may be premature death due to lack of treatment. Thus the
    consequences of these two types of mistake can be dramatically different. It would
    clearly be better to make fewer mistakes of the second kind, even if this was
    at the expense of making more mistakes of the first kind.


    We can formalize such issues through the introduction of a loss function, also
    called a cost function, which is a single, overall measure of loss incurred in
    taking any of the available decisions or actions. Our goal is then to minimize
    the total loss incurred. Note that some authors consider instead a utility function,
    whose value they aim to maximize. These are equivalent concepts if we take the
    utility to be simply the negative of the loss, and throughout this text we shall
    use the loss function convention. Suppose that, for a new value of x, the true
    class is C_k and that we assign x to class C_j (where j may or may not be equal
    to k). In so doing, we incur some level of loss, which we denote by L_{kj}, which
    we can view as the k, j element of a loss matrix. For instance, in our cancer
    example, we might have a loss matrix of the form shown in Figure 1.25. This particular
    loss matrix says that there is no loss incurred if the correct decision is made,
    there is a loss of 1 if a healthy patient is diagnosed as having cancer, whereas
    there is a loss of 1000 if a patient having cancer is diagnosed as healthy.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_715_0.png)


    **Figure 1.25** An example of a loss matrix with elements $L_{kj}$ for the cancer
    treatment problem. The rows correspond to the true class, whereas the columns
    correspond to the assignment of classes made by our decision criterion.'
  merge: -1
  img_proc: true
- pgno: 716
  md: '# # Minimizing the expected loss


    The optimal solution is the one which minimizes the loss function. However, the
    loss function depends on the true class, which is unknown. For a given input vector
    x, our uncertainty in the true class is expressed through the joint probability
    distribution p(x,C<sub>k</sub>) and so we seek instead to minimize the average
    loss, where the average is computed with respect to this distribution, which is
    given by


    \(\mathbb{E}[L]=\sum_k\sum_j\int_{\mathcal{R}_j}L_{kj}p(x,C_k)\mathrm{d}x.\) (1.80)


    Each x can be assigned independently to one of the decision regions R<sub>j</sub>.
    Our goal is to choose the regions R<sub>j</sub> in order to minimize the expected
    loss (1.80), which implies that for each x we should minimize \(\sum_kL_{kj}p(x,C_k)\).
    As before, we can use the product rule p(x,C<sub>k</sub>)=p(C<sub>k</sub>|x)p(x)
    to eliminate the common factor of p(x). Thus the decision rule that minimizes
    the expected loss is the one that assigns each new x to the class j for which
    the quantity


    \(\sum_kL_{kj}p(C_k|x)\) (1.81)


    is a minimum. This is clearly trivial to do, once we know the posterior class
    probabilities p(C<sub>k</sub>|x).'
  merge: -1
  img_proc: true
- pgno: 717
  md: '# # The reject option


    We have seen that classification errors arise from the regions of input space
    where the largest of the posterior probabilities \( p(C_k|x) \) is significantly
    less than unity, or equivalently where the joint distributions \( p(x, C_k) \)
    have comparable values. These are regions where we are relatively uncertain about
    class membership. In some applications, it will be appropriate to avoid making
    decisions on the difficult cases in anticipation of a lower error rate on those
    examples for which a classification decision is made. This is known as the **reject
    option**. For example, in our hypothetical medical illustration, it may be appropriate
    to use an automatic system to classify those X-ray images for which there is little
    doubt as to the correct class, while leaving a human expert to classify the more
    ambiguous cases. We can achieve this by introducing a threshold \( \theta \) on
    the largest posterior probability \( p(C_k|x) \) for which the posterior probabilities
    \( p(C_k|x) \) is less than or equal to \( \theta \). This is illustrated for
    the case of two classes, and a single continuous input variable \( x \), in Figure
    1.26. Note that setting \( \theta = 1 \) will ensure that all examples are rejected,
    whereas if there are \( K \) classes then setting \( \theta < 1/K \) will ensure
    that no examples are rejected. Thus fraction of examples that get rejected is
    controlled by the value of \( \theta \).


    We can easily extend the reject criterion to minimize the expected loss, when
    a loss matrix is given, taking account of the loss incurred when a reject decision
    is made.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_717_0.png)'
  merge: -1
  img_proc: true
- pgno: 718
  md: '# Inference and decision


    We have broken the classification problem down into two separate stages, the inference
    stage in which we use training data to learn a model for p(Ck|x), and the subsequent
    decision stage in which we use these posterior probabilities to make optimal class
    assignments. An alternative possibility would be to solve both problems together
    and simply learn a function that maps inputs x directly into decisions. Such a
    function is called a discriminative function.'
  merge: -1
  img_proc: true
- pgno: 719
  md: '# # three distinct approaches to solving decision problems


    (a) First solve the inference problem of determining the class-conditional densities
    \( p(x|C_k) \) for each class \( C_k \) individually. Also separately infer the
    prior class probabilities \( p(C_k) \). Then use Bayes’ theorem in the form


    \( p(C_k|x) = \frac{p(x|C_k)p(C_k)}{p(x)} \) (1.82)


    to find the posterior class probabilities \( p(C_k|x) \). As usual, the denominator
    in Bayes’ theorem can be found in terms of the quantities appearing in the numerator,
    because


    \( p(x) = \sum_k p(x|C_k)p(C_k) \). (1.83)


    Equivalently, we can model the joint distribution \( p(x, C_k) \) directly and
    then normalize to obtain the posterior probabilities. Having found the posterior
    probabilities, we use decision theory to determine class membership for each new
    input \( x \). Approaches that explicitly or implicitly model the distribution
    of inputs as well as outputs are known as **generative models**, because by sampling
    from them it is possible to generate synthetic data points in the input space.'
  merge: -1
  img_proc: true
- pgno: 720
  md: '# three distinct approaches to solving decision problems


    (b) First solve the inference problem of determining the posterior class probabilities
    $p(C_k \mid x)$, and then subsequently use decision theory to assign each new
    $x$ to one of the classes. Approaches that model the posterior probabilities directly
    are called *discriminative models*.


    (c) Find a function $f(x)$, called a discriminant function, which maps each input
    $x$ directly onto a class label. For instance, in the case of two-class problems,
    $f(\cdot)$ might be binary valued and such that $f = 0$ represents class $C_1$
    and $f = 1$ represents class $C_2$. In this case, probabilities play no role.'
  merge: -1
  img_proc: true
