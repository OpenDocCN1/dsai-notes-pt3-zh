- pgno: 583
  md: '# # Probabilistic Generative Models


    We turn next to a probabilistic view of classification and show how models with
    linear decision boundaries arise from simple assumptions about the distribution
    of the data. In Section 1.5.4, we discussed the distinction between the discriminative
    and the generative approaches to classification. Here we shall adopt a generative
    approach in which we model the class-conditional densities _p_(**x**|_C<sub>k</sub>_),
    as well as the class priors _p_(_C<sub>k</sub>_), and then use these to compute
    the posterior probabilities _p_(_C<sub>k</sub>_|**x**) through Bayes’ theorem.


    Consider first of all the case of two classes. The posterior probability for class
    _C_<sub>1</sub> can be written as


    \(p(C_1|\mathbf{x})=\frac{p(\mathbf{x}|C_1)p(C_1)}{p(\mathbf{x}|C_1)p(C_1)+p(\mathbf{x}|C_2)p(C_2)}\)


    \(=\frac{1}{1+\exp(-a)}=\sigma(a)\) (4.57)


    where we have defined


    \(a=\mathrm{ln}\frac{p(\mathbf{x}|C_1)p(C_1)}{p(\mathbf{x}|C_2)p(C_2)}\) (4.58)


    and \(\sigma(a)\) is the _logistic sigmoid_ function defined by


    \(\sigma(a)=\frac{1}{1+\exp(-a)}\) (4.59)'
