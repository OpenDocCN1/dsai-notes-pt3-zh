- pgno: 807
  md: '# # Heuristic Functions


    # ## Generating admissible heuristics from relaxed problems


    We have seen that both *h₁* (misplaced tiles) and *h₂* (Manhattan distance) are
    fairly good heuristics for the 8-puzzle and that *h₂* is better. How might one
    come up with *h₂*? Is it possible for a computer to invent such a heuristic mechanically?


    *h₁* and *h₂* are estimates of the remaining path length for the 8-puzzle, but
    they are also perfectly accurate path lengths for *simplified versions* of the
    puzzle. If the rules of the puzzle were changed so that a tile could move anywhere
    instead of just to the adjacent empty square, then *h₁* would give the exact number
    of steps in the shortest solution. Similarly, if a tile could move one square
    in any direction, even onto an occupied square, then *h₂* would give the exact
    number of steps in the shortest solution. A problem with fewer restrictions on
    the actions is called a *relaxed problem*. The state-space graph of the relaxed
    problem is a *supergraph* of the original state space because the removal of restrictions
    creates added edges in the graph.


    Because the relaxed problem adds edges to the state space, any optimal solution
    in the original problem is, by definition, also a solution in the relaxed problem,
    but the relaxed problem may have better solutions if the added edges provide short
    cuts. Hence, the *cost of an optimal solution to a relaxed problem is an admissible
    heuristic for the original problem*. Furthermore, because the derived heuristic
    is an exact cost for the relaxed problem, it must obey the triangle inequality
    and is therefore consistent (see page 95).'
  merge: -1
  img_proc: true
- pgno: 808
  md: '# # Heuristic Functions


    # ## Generating admissible heuristics from relaxed problems


    If a problem definition is written down in a formal language, it is possible to
    construct relaxed problems automatically.<sup>11</sup> For example, if the 8-puzzle
    actions are described as


    A tile can move from square A to square B if


    A is horizontally or vertically adjacent to B and B is blank,


    we can generate three relaxed problems by removing one or both of the conditions:


    (a) A tile can move from square A to square B if A is adjacent to B.


    (b) A tile can move from square A to square B if B is blank.


    (c) A tile can move from square A to square B.


    From (a), we can derive _h_<sub>2</sub> (Manhattan distance). The reasoning is
    that _h_<sub>2</sub> would be the proper score if we moved each tile in turn to
    its destination. The heuristic derived from (b) is discussed in Exercise 3.31.
    From (c), we can derive _h_<sub>1</sub> (misplaced tiles) because it would be
    the proper score if tiles could move to their intended destination in one step.
    Notice that it is crucial that the relaxed problems generated by this technique
    can be solved essentially _without search_, because the relaxed rules allow the
    problem to be decomposed into eight independent subproblems. If the relaxed problem
    is hard to solve, then the values of the corresponding heuristic will be expensive
    to obtain.<sup>12</sup>'
  merge: -1
  img_proc: true
- pgno: 809
  md: '# Learning heuristics from experience


    A heuristic function $h(n)$ is supposed to estimate the cost of a solution beginning
    from the state at node $n$. How could an agent construct such a function? One
    solution was given in the preceding sections—namely, to devise relaxed problems
    for which an optimal solution can be found efficiently. Another solution is to
    learn from experience. “Experience” here means solving lots of 8-puzzles, for
    instance. Each optimal solution to an 8-puzzle problem provides examples from
    which $h(n)$ can be learned. Each example consists of a state from the solution
    path and the actual cost of the solution from that point. From these examples,
    a learning algorithm can be used to construct a function $h(n)$ that can (with
    luck) predict solution costs for other states that arise during search. Techniques
    for doing just this using neural nets, decision trees, and other methods are demonstrated
    in Chapter 18. (The reinforcement learning methods described in Chapter 21 are
    also applicable.)'
  merge: -1
  img_proc: true
- pgno: 810
  md: '# # Learning heuristics from experience


    Inductive learning methods work best when supplied with features of a state that
    are relevant to predicting the state’s value, rather than with just the raw state
    description. For example, the feature “number of misplaced tiles” might be helpful
    in predicting the actual distance of a state from the goal. Let’s call this feature
    _x_<sub>1</sub>(_n_). We could take 100 random generated 8-puzzle configurations
    and gather statistics on their actual solution costs. We might find that when
    _x_<sub>1</sub>(_n_) is 5, the average solution cost is around 14, and so on.
    Given these data, the value of _x_<sub>1</sub> can be used to predict _h_(_n_).
    Of course, we can use several features. A second feature _x_<sub>2</sub>(_n_)
    might be “number of pairs of adjacent tiles that are not adjacent in the goal
    state.” How should _x_<sub>1</sub>(_n_) and _x_<sub>2</sub>(_n_) be combined to
    predict _h_(_n_)? A common approach is to use a linear combination:


    \(h(n)=c_1x_1(n)+c_2x_2(n).\)


    The constants _c_<sub>1</sub> and _c_<sub>2</sub> are adjusted to give the best
    fit to the actual data on solution costs. One expects both _c_<sub>1</sub> and
    _c_<sub>2</sub> to be positive because misplaced tiles and incorrect adjacent
    pairs make the problem harder to solve. Notice that this heuristic does satisfy
    the condition that _h_(_n_)=0 for goal states, but it is not necessarily admissible
    or consistent.'
  merge: -1
  img_proc: true
- pgno: 811
  md: '# # Summary


    We have introduced methods that an agent can use to select actions in environments
    that are deterministic, observable, static, and completely known. In such cases,
    the agent can construct sequences of actions that achieve its goals; this process
    is called **search**


    +   Before an agent can start searching for solutions, a **goal** must be identified
    and a well defined **problem** must be formulated.


    +   A problem consists of five parts: the **initial state**, a set of **actions**,
    a **transition model** describing the results of those actions, a **goal test**
    function, and a **path cost** function.


    +   The environment of the problem is represented by a **state space**. A path
    through the state space from the initial state to a goal state is a **solution**.


    +   Search algorithms treat states and actions as **atomic**: they do not consider
    any internal structure they might possess.'
  merge: -1
  img_proc: true
- pgno: 812
  md: '# Summary


    We have introduced methods that an agent can use to select actions in environments
    that are **deterministic**, **observable**, **static**, and **completely known**.
    In such cases, the agent can construct sequences of actions that achieve its goals;
    this process is called **search**


    +   - A general TREE-SEARCH algorithm considers all possible paths to find a solution,
    whereas a GRAPH-SEARCH algorithm avoids consideration of redundant paths.


    +   - Search algorithms are judged on the basis of **completeness**, **optimality**,
    **time complexity**, and **space complexity**. Complexity depends on b, the branching
    factor in the state space, and d, the depth of the shallowest solution.'
  merge: -1
  img_proc: true
- pgno: 813
  md: '# # Summary


    **Uninformed search** methods have access only to the problem definition. The
    basic algorithms are as follows:


    +   - **Breadth-first search** expands the shallowest nodes first; it is complete,
    optimal for unit step costs, but has exponential space complexity.

    +   - **Uniform-cost search** expands the node with lowest path cost, g(n), and
    is optimal for general step costs.

    +   - **Depth-first search** expands the deepest unexpanded node first. It is
    neither complete nor optimal, but has linear space complexity. **Depth-limited
    search** adds a depth bound.

    +   - **Iterative deepening search** calls depth-first search with increasing
    depth limits until a goal is found. It is complete, optimal for unit step costs,
    has time complexity comparable to breadth-first search, and has linear space complexity.

    +   - **Bidirectional search** can enormously reduce time complexity, but it is
    not always applicable and may require too much space.'
  merge: -1
  img_proc: true
- pgno: 814
  md: '# # Summary


    Informed search methods may have access to a heuristic function h(n) that estimates

    the cost of a solution from n.


    +   - The generic best-first search algorithm selects a node for expansion according
    to

    +   an evaluation function.


    +   - Greedy best-first search expands nodes with minimal h(n). It is not optimal
    but

    +   is often efficient.


    +   - A* search expands nodes with minimal f(n) = g(n) + h(n). A* is complete
    and

    +   optimal, provided that h(n) is admissible (for TREE-SEARCH) or consistent
    (for

    +   GRAPH-SEARCH). The space complexity of A* is still prohibitive.


    +   - RBFS (recursive best-first search) and SMA* (simplified memory-bounded A*)

    +   are robust, optimal search algorithms that use limited amounts of memory;
    given

    +   enough time, they can solve problems that A* cannot solve because it runs
    out of

    +   memory.


    +   - The performance of heuristic search algorithms depends on the quality of
    the heuristic

    +   function. One can sometimes construct good heuristics by relaxing the problem
    definition,

    +   by storing precomputed solution costs for subproblems in a pattern database,
    or

    +   by learning from experience with the problem class.'
  merge: -1
