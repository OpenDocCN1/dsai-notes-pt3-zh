- pgno: 1020
  md: '# # Multivariate Gaussian Distribution


    +   • The second order moments of the Gaussian


    \(\mathbb{E}[\mathbf{x}\mathbf{x}^\mathrm{T}] = \frac{1}{(2\pi)^{D/2}} \frac{1}{|\Sigma|^{1/2}}
    \int \exp \left\{ -\frac{1}{2}(\mathbf{x} - \boldsymbol{\mu})^\mathrm{T} \Sigma^{-1}
    (\mathbf{x} - \boldsymbol{\mu}) \right\} \mathbf{x}\mathbf{x}^\mathrm{T} \, d\mathbf{x}\)


    \(\underline{\mathbf{z} = \mathbf{x} - \boldsymbol{\mu}} \quad \frac{1}{(2\pi)^{D/2}}
    \frac{1}{|\Sigma|^{1/2}} \int \exp \left\{ -\frac{1}{2} \mathbf{z}^\mathrm{T}
    \Sigma^{-1} \mathbf{z} \right\} (\mathbf{z} + \boldsymbol{\mu})(\mathbf{z} + \boldsymbol{\mu})^\mathrm{T}
    \, d\mathbf{z}\)


    \(\boldsymbol{\mu}\boldsymbol{\mu}^\mathrm{T}\) is constant, \(\boldsymbol{\mu}\mathbf{z}^\mathrm{T}\)
    and \(\boldsymbol{\mu}^\mathrm{T}\mathbf{z}\) will again vanish by symmetry.


    Consider the term involving \(\mathbf{z}\mathbf{z}^\mathrm{T}\)


    \(\frac{1}{(2\pi)^{D/2}} \frac{1}{|\Sigma|^{1/2}} \int \exp \left\{ -\frac{1}{2}
    \mathbf{z}^\mathrm{T} \Sigma^{-1} \mathbf{z} \right\} \mathbf{z}\mathbf{z}^\mathrm{T}
    \, d\mathbf{z}\)


    \(= \frac{1}{(2\pi)^{D/2}} \frac{1}{|\Sigma|^{1/2}} \sum_{i=1}^D \sum_{j=1}^D
    \mathbf{u}_i \mathbf{u}_j^\mathrm{T} \int \exp \left\{ -\sum_{k=1}^D \frac{y_k^2}{2\lambda_k}
    \right\} y_i y_j \, d\mathbf{y} = \sum_{i=1}^D \mathbf{u}_i \mathbf{u}_i^\mathrm{T}
    \lambda_i = \Sigma\)


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1020_0.png)


    \(\boxed{\mathbb{E}[\mathbf{x}\mathbf{x}^\mathrm{T}] = \boldsymbol{\mu}\boldsymbol{\mu}^\mathrm{T}
    + \Sigma}\)'
