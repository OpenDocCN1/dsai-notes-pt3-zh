- pgno: 547
  md: '# # Regularized least squares


    In Section 1.1.1, we introduced the idea of adding a regularization term to an
    error function in order to control over-fitting, so that the total error function
    to be minimized takes the form


    \(E_D(\mathbf{w}) + \lambda E_W(\mathbf{w})\) (3.24)


    where \(\lambda\) is the regularization coefficient that controls the relative
    importance of the data-dependent error \(E_D(\mathbf{w})\) and the regularization
    term \(E_W(\mathbf{w})\). One of the simplest forms of regularizer is given by
    the sum-of-squares of the weight vector elements


    \(E_W(\mathbf{w}) = \frac{1}{2}\mathbf{w}^\mathbf{T}\mathbf{w}.\) (3.25)


    If we also consider the sum-of-squares error function given by


    \(E(\mathbf{w}) = \frac{1}{2}\sum_{n=1}^N \{t_n - \mathbf{w}^\mathbf{T}\phi(\mathbf{x}_n)\}^2\)
    (3.26)


    then the total error function becomes


    \(\frac{1}{2}\sum_{n=1}^N \{t_n - \mathbf{w}^\mathbf{T}\phi(\mathbf{x}_n)\}^2
    + \frac{\lambda}{2}\mathbf{w}^\mathbf{T}\mathbf{w}.\) (3.27)


    This particular choice of regularizer is known in the machine learning literature
    as _weight decay_ because in sequential learning algorithms, it encourages weight
    values to decay towards zero, unless supported by the data. In statistics, it
    provides an example of a _parameter shrinkage_ method because it shrinks parameter
    values towards zero. It has the advantage that the error function remains a quadratic
    function of **w**, and so its exact minimizer can be found in closed form. Specifically,
    setting the gradient of (3.27) with respect to **w** to zero, and solving for
    **w** as before, we obtain


    \(\mathbf{w} = (\lambda\mathbf{I} + \unknown^\mathbf{T}\unknown)^{-1}\unknown^\mathbf{T}\mathbf{t}.\)
    (3.28)


    This represents a simple extension of the least-squares solution (3.15).'
  merge: -1
  img_proc: true
- pgno: 548
  md: '# # Regularized least squares


    A more general regularizer is sometimes used, for which the regularized error
    takes the form


    $$\frac{1}{2}\sum_{n=1}^{N}\{t_n-\mathbf{w}^{T}\phi(\mathbf{x}_n)\}^{2}+\frac{\lambda}{2}\sum_{j=1}^{M}|w_j|^q$$  (3.29)


    where $q=2$ corresponds to the quadratic regularizer (3.27). Figure 3.3 shows
    contours of the regularization function for different values of $q$. The case
    of $q=1$ is known as the lasso in the statistics literature (Tibshirani, 1996).
    It has the property that if $\lambda$ is sufficiently large, some of the coefficients
    $w_j$ are driven to zero, leading to a sparse model in which the corresponding
    basis functions play no role. To see this, we first note that minimizing (3.29)
    is equivalent to minimizing the unregularized sum-of-squares error (3.12) subject
    to the constraint


    $$\sum_{j=1}^{M}|w_j|^q\leq\eta$$  (3.30)


    for an appropriate value of the parameter $\eta$, where the two approaches can
    be related using Lagrange multipliers. The origin of the sparsity can be seen
    from Figure 3.4, which shows that the minimum of the error function, subject to
    the constraint (3.30). As $\lambda$ is increased, so an increasing number of parameters
    are driven to zero. Regularization allows complex models to be trained on data
    sets of limited size without severe over-fitting, essentially by limiting the
    effective model complexity. However, the problem of determining the optimal model
    complexity is then shifted from one of finding the appropriate number of basis
    functions to one of determining a suitable value of the regularization coefficient
    $\lambda$. We shall return to the issue of model complexity later in this chapter.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_548_0.png)


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_548_1.png)'
