  md: "# Linear basis function models\n\n+   - Regression:\n+   \n+     Given a training\
    \ data set comprising $N$ observations $\\{\\mathbf{x}_n\\}$, where $n=1,\\ldots,N$,\
    \ together with corresponding target values $\\{t_n\\}$, the goal is to predict\
    \ the value of $t$ for a new value of $\\mathbf{x}$.\n\n+   - Linear regression:\n\
    +   \n+     $$y(\\mathbf{x},\\mathbf{w})=w_0+w_1x_1+\\cdots+w_Dx_D$$\n+   \n+\
    \     where $\\mathbf{x}=(x_1,\\ldots,x_D)^\\mathrm{T}$\n\n+   - Linear basis\
    \ function model:\n+     - Linear combinations of fixed nonlinear functions of\
    \ the input variables\n\n![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1044_0.png)"
  merge: -1
