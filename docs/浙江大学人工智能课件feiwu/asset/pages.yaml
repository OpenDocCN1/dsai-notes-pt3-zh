- pgno: 754
  md: '# # Searching for solution


    +   Leaf node: a node with no children in the tree. The set of all leaf nodes
    available for expansion at any given point is called the frontier. (Many authors
    call it the open list, which is both geographically less evocative and less accurate,
    because other data structures are better suited than a list.) In Figure 3.6, the
    frontier of each tree consists of those nodes with bold outlines.


    +   The process of expanding nodes on the frontier continues until either a solution
    is found or there are no more states to expand. The general algorithm is shown
    informally in Figure 3.7. Search algorithms all share this basic structure; they
    vary primarily according to how they choose which state to expand next—the so-called
    search strategy.'
  merge: -1
  img_proc: true
- pgno: 755
  md: '# Searching for solution


    +   - In(Arad)is a repeated state in the search tree, generated in this case by
    **a loopy path**.


    +   - Considering such loopy paths means that the complete search tree for Romania
    is infinite because there is no limit to how often one can traverse a loop. On
    the other hand, the state space—the map shown in Figure 3.2—has only 20 states.


    +   - loops can cause certain algorithms to fail, making otherwise solvable problems
    unsolvable. Fortunately, there is no need to consider loopy paths. We can rely
    on more than intuition for this: because path costs are additive and step costs
    are nonnegative, a loopy path to any given state is never better than the same
    path with the loop removed.'
  merge: -1
  img_proc: true
- pgno: 756
  md: "# # Searching for solution\n\n+   • Tree-search and graph-search algorithms\n\
    \n```\n```\nfunction TREE-SEARCH(problem) returns a solution, or failure\n  initialize\
    \ the frontier using the initial state of problem\n  loop do\n    if the frontier\
    \ is empty then return failure\n    choose a leaf node and remove it from the\
    \ frontier\n    if the node contains a goal state then return the corresponding\
    \ solution\n    expand the chosen node, adding the resulting nodes to the frontier\n\
    \nfunction GRAPH-SEARCH(problem) returns a solution, or failure\n  initialize\
    \ the frontier using the initial state of problem\n  initialize the explored set\
    \ to be empty\n  loop do\n    if the frontier is empty then return failure\n \
    \   choose a leaf node and remove it from the frontier\n    if the node contains\
    \ a goal state then return the corresponding solution\n    add the node to the\
    \ explored set\n    expand the chosen node, adding the resulting nodes to the\
    \ frontier\n      only if not in the frontier or explored set\n```\n```\n\nIn\
    \ order to avoid exploring redundant paths, we augment the TREE-SEARCH algorithm\
    \ with a data structure called the explored set (also known as the closed list),\
    \ which remembers every expanded node."
  merge: -1
