- pgno: 56
  md: '# # Monte-Carlo Simulation


    +   In some games of interest, e.g., in the game of Go, it has proven hard to
    encode or learn an evaluation function of sufficient quality to achieve good performance
    in a minimax search. Instead of constructing an evaluation function, an alternative
    idea is to first construct a **policy**, and then to use that policy to **estimate**
    the values of states.


    +   A policy is a mapping from states to actions, in other words a policy determines
    a way to play the game. Given a policy pair (one policy for each player, which
    if symmetric can be represented by a single policy), a value estimate for a state
    scan be obtained by simulation: start in state s and follow the respective policies
    in an alternating manner from s until the end of the game, and use the reward
    in the terminal state as the value of state s.


    +   In some games, it is easier to estimate the value indirectly by simulation,
    i.e., it may be easier to come up with a simple policy that leads to good value
    estimates via simulation, than to estimate those values directly.'
  merge: -1
  img_proc: true
