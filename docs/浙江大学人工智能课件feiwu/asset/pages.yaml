- pgno: 776
  md: '# # Properties of breadth-first search


    +   - Completeness: Yes, if b is finite

    +   - Time complexity: O(b^d), i.e., exponential in d

    +   - Space complexity: O(b^d), keeps every node in memory

    +   - Optimality: Yes, if cost = 1 per step; not optimal in general


    So far, the news about breadth-first search has been good. The news about time
    and space is not so good. Imagine searching a uniform tree where every state has
    b successors. The root of the search tree generates b nodes at the first level,
    each of which generates b more nodes, for a total of b^2 at the second level.
    Each of these generates b more nodes, yielding b^3 nodes at the third level, and
    so on. Now suppose that the solution is at depth d. In the worst case, it is the
    last node generated at that depth. Then the total number of nodes generated is
    b + b^2 + b^3 + ... + b^d = O(b^d).


    (If the algorithm were to apply the goal test to nodes when selected for expansion,
    rather than when generated, the whole layer of nodes at depth d would be expanded
    before the goal was detected and the time complexity would be O(b^(d+1)).)'
  merge: -1
  img_proc: true
- pgno: 777
  md: '# # Properties of breadth-first search


    | Depth | Nodes | Time | Memory |

    |---|---|---|---|

    | 2 | 110 | .11 milliseconds | 107 kilobytes |

    | 4 | 11,110 | 11 milliseconds | 10.6 megabytes |

    | 6 | 10<sup>6</sup> | 1.1 seconds | 1 gigabyte |

    | 8 | 10<sup>8</sup> | 2 minutes | 103 gigabytes |

    | 10 | 10<sup>10</sup> | 3 hours | 10 terabytes |

    | 12 | 10<sup>12</sup> | 13 days | 1 petabyte |

    | 14 | 10<sup>14</sup> | 3.5 years | 99 petabytes |

    | 16 | 10<sup>16</sup> | 350 years | 10 exabytes |


    **Figure 3.13** Time and memory requirements for breadth-first search. The numbers
    shown assume branching factor _b_ = 10; 1 million nodes/second; 1000 bytes/node.


    Two lessons can be learned from Figure 3.13. First, _the memory requirements are
    a bigger problem for breadth-first search than is the execution time_. One might
    wait 13 days for the solution to an important problem with search depth 12, but
    no personal computer has the petabyte of memory it would take. Fortunately, other
    strategies require less memory.


    The second lesson is that time is still a major factor. If your problem has a
    solution at depth 16, then (given our assumptions) it will take about 350 years
    for breadth-first search (or indeed any uninformed search) to find it. In general,
    _exponential-complexity search problems cannot be solved by uninformed methods
    for any but the smallest instances_.'
  merge: -1
  img_proc: true
- pgno: 778
  md: '# Depth-first search


    **Depth-first search** always expands the deepest node in the current frontier
    of the search tree. The search proceeds immediately to the deepest level of the
    search tree, where the nodes have no successors. As those nodes are expanded,
    they are dropped from the frontier, so then the search “backs up” to the next
    deepest node that still has unexplored successors.


    whereas breadth-first-search uses a FIFO queue, depth-first search uses a LIFO
    queue.'
  merge: -1
  img_proc: true
