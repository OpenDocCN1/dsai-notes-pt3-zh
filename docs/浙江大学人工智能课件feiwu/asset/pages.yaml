  md: '# Three AI winters (setbacks)


    +   - The first AI winter: **Lighthill report** published in 1973


    +   - The report was compiled by Lighthill for the British Science Research Council
    as an evaluation of the academic research in the field of artificial intelligence.


    +   - The report gave a very **pessimistic prognosis** for many core aspects of
    research in this field, stating that "in no part of the field have discoveries
    made so far produced the major impact that was then promised".


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_479_0.png)


    Sir James Lighthill, *Artificial Intelligence: A General Survey*, Science Research
    Council, 1973'
  merge: -1
  img_proc: true
- pgno: 480
  md: '# Three AI winters (setbacks)


    +   - The first AI winter: **Lighthill report** published in 1973


    +   - The Lighthill Report is organized around a classification of AI research
    into three categories:

    +     - Category A is advanced automation or applications.

    +     - Category C comprises studies of the central nervous system including computer
    modeling in support of both neurophysiology and psychology.

    +     - Category B is defined as ``building robots'''' and ``bridge'''' between
    the other two categories.


    > > …work in the categories A and C has some respectable achievements to its credit,
    but to a **disappointingly** smaller extent than had been hoped and expected,
    while progress in category B has been even **slower** and more **discouraging**…'
  merge: -1
  img_proc: true
- pgno: 481
  md: '# # Three AI winters (setbacks)


    +   - The first AI winter: **Lighthill report** published in 1973

    +   - The report led to the complete dismantling of AI research in England

    +   - AI research continued in only a few top universities (Edinburgh, Essex and
    Sussex).

    +   - This created a bow-wave effect that led to funding cuts across Europe. Research
    would not revive on a large scale until 1983, when Alvey (a research project of
    the British Government) began to fund AI again from a war chest of £350 million
    in response to the Japanese Fifth Generation Project .

    +   - Lessons: It is very difficult to make a clear judgement at the inception
    of AI development.'
  merge: -1
  img_proc: true
- pgno: 482
  md: '# Three AI winters (setbacks)


    +   - The Second AI winter: **the Failure of Japanese Fifth Generation Project**

    +     - begun in 1982

    +     - The target defined by the FGCS project was to develop "Knowledge Information
    Processing systems" (roughly meaning, applied Artificial Intelligence). The chosen
    tool to implement this goal was logic programming.

    +     - The meaning of Logic programming:

    +       - The use of logic to express information in a computer.

    +       - The use of logic to present problems to a computer.

    +       - The use of logical inference to solve these problems.

    +     - Lessons: AI is not only drove by intelligent hardware, but also droved
    by intelligent software and knowledge.


    > Shapiro, Ehud Y, The fifth generation project—a trip report, *Communications
    of the ACM*, 26(9): 637-641,1983'
  merge: -1
  img_proc: true
