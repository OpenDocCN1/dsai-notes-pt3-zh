- pgno: 969
  md: '# # Expectation and Variance


    # ## the Variance of the Sum of Two Independent Random Variables is the Sum of
    the Variances


    Imagine two such random variables _X_ and _Y_.


    | X   | probability   |

    |-----|---------------|

    | x₁  | p₁            |

    | x₂  | p₂            |

    | ... | ...           |

    | xₙ  | pₙ            |


    | Y   | probability   |

    |-----|---------------|

    | y₁  | q₁            |

    | y₂  | q₂            |

    | ... | ...           |

    | yₘ  | qₘ            |


    Since _X_ and _Y_ are independent random variables, the probability of _X_

    taking on the value _x<sub>i</sub>_ and _Y_ the value _y<sub>j</sub>_ is simply
    the product _p<sub>i</sub>q<sub>j</sub>_.


    \(Var(X+Y)=\sum_{i,j}p_iq_j(x_i+y_j-\mu_X-\mu_Y)^2=\sum_{i,j}p_iq_j(x_i-\mu_X)^2+\sum_{i,j}p_iq_j(y_j-\mu_Y)^2+2\sum_{i,j}p_iq_j(x_i-\mu_X)(y_j-\mu_Y)=(\sum_jq_j)Var(X)+(\sum_ip_i)Var(Y)+2(\sum_ip_i(x_i-\mu_X))(\sum_jq_j(y_j-\mu_Y))=1\cdot
    Var(X)+1\cdot Var(Y)+2\cdot 0\cdot 0=Var(X)+Var(Y).\)'
