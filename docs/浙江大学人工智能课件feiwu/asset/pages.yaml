- pgno: 74
  md: '# Upper Confidence Bound Strategies


    +   • UCB is a simple, yet attractive algorithm that succeeds in resolving the
    exploration-exploitation tradeoff.


    UCB keeps track the average rewards $\bar{X}_{i,T_i(t-1)}$ all the arms and chooses
    the arm with the best upper confidence bound:


    $$I_t = \underset{i\in\{1,\ldots,K\}}{\arg\max}\left\{\bar{X}_{i,T_i(t-1)} + c_{t-1,T_i(t-1)}\right\}$$


    where $c_{t,s}$ is a bias sequence chosen to be


    $$c_{t,s}=\sqrt{\frac{2\ln t}{s}}$$


    where $T_i(t)=\sum_{s=1}^{t}\mathbb{I}(I_s=i)$ is the number of times arm $i$
    was played up to time $t$ (including $t$)'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# # Upper Confidence Bound Strategies


    +   - Why UCB utilizes exploration-exploitation tradeoff.

    +     - probability is decreasing in terms of the number of visits (explore)

    +     - probability is increasing in terms of a node''s value (exploit)


    For bandit problems, it is useful to know the _upper confidence bound (UCB)_ that
    any given arm will be optimal. The simplest UCB policy proposed by Auer et al.
    [13] is called _UCB1_, which has an expected logarithmic growth of regret uniformly
    over _n_ (not just asymptotically) without any prior knowledge regarding the reward
    distributions (which have to have their support in [0, 1]). The policy dictates
    to play arm _j_ that maximises:


    UCB1 = \(\bar{X}_j + \sqrt{\frac{2 \ln n}{n_j}}\)


    where \(\bar{X}_j\) is the average reward from arm _j_, _n<sub>j</sub>_ is the
    number of times arm _j_ was played and _n_ is the overall number of plays so far.
    The reward term \(\bar{X}_j\) encourages the _exploitation_ of higher-reward choices,
    while the right hand term \(\sqrt{\frac{2 \ln n}{n_j}}\) encourages the _exploration_
    of less-visited choices. The exploration term is related to the size of the one-sided
    confidence interval for the average reward within which the true expected reward
    falls with overwhelming probability [13, p 237].


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_75_0.png)


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_75_1.png)'
  merge: -1
