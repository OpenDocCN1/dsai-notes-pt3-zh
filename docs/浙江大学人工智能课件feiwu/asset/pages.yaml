    (x_n - \mu)^T \Sigma^{-1} (x_n - \mu)\)


    \(\frac{\partial a^T X^{-1} b}{\partial X} = -X^{-T} ab^T X^{-T}\)


    \(\frac{\partial}{\partial A} \ln|A| = (A^{-1})^T \Rightarrow -\frac{N}{2} \frac{\partial}{\partial
    \Sigma} \ln|\Sigma| = -\frac{N}{2} (\Sigma^{-1})^T = -\frac{N}{2} \Sigma^{-1}\)


