- pgno: 934
  md: '# # Alpha-Beta Pruning


    +   - Alpha is the maximum lower bound of possible solutions

    +   - Beta is the minimum upper bound of possible solutions

    +   - when any new node is being considered as a possible path to the solution,
    it can only work if:


    $\alpha \leq N \leq \beta$　(where N is the current estimate of the value of the
    node)


    To visualize this, we can use a number line. At any point in time, alpha and beta
    are lower and upper bounds on the set of possible solution values, like so:


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_934_0.png)'
  merge: -1
  img_proc: true
- pgno: 935
  md: 'As the problem progresses, we can assume restrictions about the range of possible
    solutions based on **Min** nodes (which may place an upper bound) and **Max**
    nodes (which may place a lower bound). As we move through the search tree, these
    bounds typically get closer and closer together:


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_935_0.png)


    This convergence is not a problem as long as there is some overlap in the ranges
    of alpha and beta. At some point in evaluating a node, we may find that it has
    moved one of the bounds such that there is no longer any overlap between the ranges
    of alpha and beta. At this point, we know that this node could never result in
    a solution path that we will consider, so we may stop processing this node. In
    other words, we stop generating its children and move back to its parent node.
    For the value of this node, we should pass to the parent the value we changed
    which exceeded the other bound.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_935_1.png)'
  merge: -1
  img_proc: true
