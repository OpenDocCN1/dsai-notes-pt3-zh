  md: '# # Maximum likelihood solution for K-classes


    +   - The likelihood function: \( p \left( \left\{ \phi_n, \mathbf{t}_n \right\}
    \mid \left\{ \pi_k \right\} \right) = \prod_{n=1}^N \prod_{k=1}^K \left\{ p(\phi_n|C_k)\pi_k
    \right\}^{t_{nk}} \qquad \sum_k \pi_k = 1 \)


    +   - The log likelihood: \( \ln p \left( \left\{ \phi_n, \mathbf{t}_n \right\}
    \mid \left\{ \pi_k \right\} \right) = \sum_{n=1}^N \sum_{k=1}^K t_{nk} \left\{
    \ln p(\phi_n|C_k) + \ln \pi_k \right\} \)


    +   - Introduce a Lagrange multiplier \(\lambda\): \( \ln p \left( \left\{ \phi_n,
    \mathbf{t}_n \right\} \mid \left\{ \pi_k \right\} \right) + \lambda \left( \sum_{k=1}^K
    \pi_k - 1 \right) \)


    +   - Solve \(\pi_k\): \( \pi_k = \frac{N_k}{N} \)


    +   - Solve \(\mu_k\): \( \mu_k = \frac{1}{N_k} \sum_{n=1}^N t_{nk} \phi_n \)


    +   - Solve \(\Sigma\): \( \Sigma = \sum_{k=1}^K \frac{N_k}{N} \mathbf{S}_k \qquad
    \mathbf{S}_k = \frac{1}{N_k} \sum_{n=1}^N t_{nk}(\phi_n - \mu_k)(\phi_n - \mu_k)^\mathrm{T}
    \)


    **Assumption**: Each class-conditional density is Gaussian with a shared covariance
    matrix.'
