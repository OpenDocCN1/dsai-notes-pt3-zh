  md: '# # Multi-class for Logistic regression


    +   • For the multiclass case, we represent posterior probabilities by a softmax
    transformation of linear functions of input variables :


    \( p(C_k|\mathbf{x}) = y_k(\mathbf{x}) = \frac{\exp(\mathbf{w}_k^T\mathbf{x})}{\sum_j
    \exp(\mathbf{w}_j^T\mathbf{x})} \)


    +   • Unlike in generative models, here we will use maximum likelihood to determine
    parameters of this discriminative model directly.


    +   • As usual, we observed a dataset \(\{ \mathbf{x}_n, t_n \}, n = 1, ..., N\),
    where we use 1-of-K encoding for the target vector \(\mathbf{t}_n\).


    +   • So if \(\mathbf{x}_n\) belongs to class \(C_k\), then **t** is a binary
    vector of length K containing a single 1 for element k (the correct class) and
    0 elsewhere.


    +   • For example, if we have K=5 classes, then an input that belongs to class
    2 would be given a target vector:


    \( t = (0, 1, 0, 0, 0)^T \)'
