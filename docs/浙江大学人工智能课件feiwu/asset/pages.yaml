- pgno: 640
  md: '# # Bayesian Inference for the Gaussian


    # ## 2. Known the mean, to infer the variance: \(\lambda \equiv 1/\sigma^2\)


    **Likelihood:** \(p(\mathbf{X}|\lambda) = \prod_{n=1}^N \mathcal{N}(x_n|\mu, \lambda^{-1})
    \propto \lambda^{N/2} \exp \left\{ -\frac{\lambda}{2} \sum_{n=1}^N (x_n - \mu)^2
    \right\}\)


    **Prior:** \(\text{Gam}(\lambda|a_0, b_0)\) _gamma distribution_


    **Posterior:** \(p(\lambda|\mathbf{X}) \propto p(\mathbf{X}|\lambda) \text{Gam}(\lambda|a_0,
    b_0)\)


    \(\text{Gam}(\lambda|a, b) = \frac{1}{\Gamma(a)} b^a \lambda^{a-1} \exp(-b \lambda)\)


    \(p(\lambda|\mathbf{X}) \propto \lambda^{a_0-1} \lambda^{N/2} \exp \left\{ -b_0
    \lambda - \frac{\lambda}{2} \sum_{n=1}^N (x_n - \mu)^2 \right\} \quad \Rightarrow
    \quad \text{Gam}(\lambda|a_N, b_N)\)


    \(a_N = a_0 + \frac{N}{2}\)


    \(b_N = b_0 + \frac{1}{2} \sum_{n=1}^N (x_n - \mu)^2 = b_0 + \frac{N}{2} \sigma_\text{ML}^2\)'
  merge: -1
