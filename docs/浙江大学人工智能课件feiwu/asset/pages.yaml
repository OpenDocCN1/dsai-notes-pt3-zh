- pgno: 573
  md: '# # Fisher''s linear discriminant


    +   - The Fisher''s criterion: maximize the separation between the projected class
    means as well as the inverse of the total within-class variance.


    \( J(\mathbf{w}) = \frac{(m_2 - m_1)^2}{s_1^2 + s_2^2} \quad s_k^2 = \sum_{n \in
    C_k} (y_n - m_k)^2 \quad y = \mathbf{w}^T \mathbf{x} \quad m_k = \mathbf{w}^T
    \mathbf{m}_k \)


    \( J(\mathbf{w}) = \frac{\mathbf{w}^T \mathbf{S}_B \mathbf{w}}{\mathbf{w}^T \mathbf{S}_W
    \mathbf{w}} \quad \text{Generalized Rayleigh quotient} \)


    \( \mathbf{S}_B = (\mathbf{m}_2 - \mathbf{m}_1)(\mathbf{m}_2 - \mathbf{m}_1)^T
    \quad \text{Between-class covariance matrix} \)


    \( \mathbf{S}_W = \sum_{n \in C_1} (\mathbf{x}_n - \mathbf{m}_1)(\mathbf{x}_n
    - \mathbf{m}_1)^T + \sum_{n \in C_2} (\mathbf{x}_n - \mathbf{m}_2)(\mathbf{x}_n
    - \mathbf{m}_2)^T \quad \text{Within-class covariance matrix} \)


    +   - Fisher''s linear discriminant:


    \( \nabla J(\mathbf{w}) = 0 \quad \Rightarrow \quad (\mathbf{w}^T \mathbf{S}_B
    \mathbf{w}) \mathbf{S}_W \mathbf{w} = (\mathbf{w}^T \mathbf{S}_W \mathbf{w}) \mathbf{S}_B
    \mathbf{w} \quad \Rightarrow \quad \mathbf{w} \propto \mathbf{S}_W^{-1} (\mathbf{m}_2
    - \mathbf{m}_1) \)'
  merge: -1
  img_proc: true
- pgno: 574
  md: "# # Fisher's linear discriminant\n\n+   • Notice that the objective \\( J(\\\
    mathbf{w}) \\) is invariant with respect to rescaling of the vector \\( \\mathbf{w}\
    \ \\rightarrow \\alpha \\mathbf{w} \\).\n\n+   • Maximizing\n+   \n+   \\( J(\\\
    mathbf{w}) = \\frac{\\mathbf{w}^T S_b \\mathbf{w}}{\\mathbf{w}^T S_w \\mathbf{w}}\
    \ \\)\n\nis equivalent to the following constraint optimization problem, known\
    \ as the generalized eigenvalue problem:\n\n\\( \\min_{\\mathbf{w}} -\\mathbf{w}^T\
    \ S_b \\mathbf{w}, \\quad \\text{subject to } \\mathbf{w}^T S_w \\mathbf{w} =\
    \ 1. \\)\n\n+   • Forming the Lagrangian:\n+   \n+   \\( L = -\\mathbf{w}^T S_b\
    \ \\mathbf{w} + \\lambda(\\mathbf{w}^T S_w \\mathbf{w} - 1). \\)\n\n+   • The\
    \ following equation needs to hold at the solution:\n+   \n+   \\( 2S_b \\mathbf{w}\
    \ = 2\\lambda S_w \\mathbf{w}. \\)\n\n+   • The solution is given by the eigenvector\
    \ of \\( S_w^{-1} S_b \\) that correspond to the largest eigenvalue."
  merge: -1
