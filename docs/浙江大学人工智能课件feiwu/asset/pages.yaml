  md: '# # Completing the square:


    \(\mu_{a|b}\quad \Sigma_{a|b}\quad p(x_a|x_b)\quad \Rightarrow\quad -\frac{1}{2}x^\mathrm{T}\Sigma^{-1}x
    + x^\mathrm{T}\Sigma^{-1}\mu + \mathrm{const}\)


    \(-\frac{1}{2}(x_a - \mu_a)^\mathrm{T}\Lambda_{aa}(x_a - \mu_a) - \frac{1}{2}(x_a
    - \mu_a)^\mathrm{T}\Lambda_{ab}(x_b - \mu_b) - \frac{1}{2}(x_b - \mu_b)^\mathrm{T}\Lambda_{ba}(x_a
    - \mu_a) - \frac{1}{2}(x_b - \mu_b)^\mathrm{T}\Lambda_{bb}(x_b - \mu_b)\)


    \(-\frac{1}{2}x_a^\mathrm{T}\Lambda_{aa}x_a\quad \Rightarrow\quad \boxed{\Sigma_{a|b}
    = \Lambda_{aa}^{-1}}\)


    \(x_a^\mathrm{T}\{\Lambda_{aa}\mu_a - \Lambda_{ab}(x_b - \mu_b)\} = x_a^\mathrm{T}\Sigma_{a|b}^{-1}\mu_{a|b}\quad
    \Rightarrow\quad \Sigma_{a|b}^{-1}\mu_{a|b} = \Lambda_{aa}\mu_a - \Lambda_{ab}(x_b
    - \mu_b)\)


    \(\Rightarrow\quad \mu_{a|b} = \Sigma_{a|b}\{\Lambda_{aa}\mu_a - \Lambda_{ab}(x_b
    - \mu_b)\} = \boxed{\mu_a - \Lambda_{aa}^{-1}\Lambda_{ab}(x_b - \mu_b)}\)


    \(\boxed{\begin{pmatrix} \mathrm{A} & \mathrm{B} \\ \mathrm{C} & \mathrm{D} \end{pmatrix}^{-1}
    = \begin{pmatrix} \mathrm{M} & -\mathrm{MBD}^{-1} \\ -\mathrm{D}^{-1}\mathrm{CM}
    & \mathrm{D}^{-1} + \mathrm{D}^{-1}\mathrm{CMBD}^{-1} \end{pmatrix}}\)


    \(\mathrm{M} = (\mathrm{A} - \mathrm{B}\mathrm{D}^{-1}\mathrm{C})^{-1}\)


    \(\begin{pmatrix} \Sigma_{aa} & \Sigma_{ab} \\ \Sigma_{ba} & \Sigma_{bb} \end{pmatrix}^{-1}
    = \begin{pmatrix} \Lambda_{aa} & \Lambda_{ab} \\ \Lambda_{ba} & \Lambda_{bb} \end{pmatrix}\)


    \(\Lambda_{aa} = (\Sigma_{aa} - \Sigma_{ab}\Sigma_{bb}^{-1}\Sigma_{ba})^{-1}\)


    \(\Lambda_{ab} = -(\Sigma_{aa} - \Sigma_{ab}\Sigma_{bb}^{-1}\Sigma_{ba})^{-1}\Sigma_{ab}\Sigma_{bb}^{-1}\)


    \(\boxed{\begin{aligned} \mu_{a|b} &= \mu_a + \Sigma_{ab}\Sigma_{bb}^{-1}(x_b
    - \mu_b) \\ \Sigma_{a|b} &= \Sigma_{aa} - \Sigma_{ab}\Sigma_{bb}^{-1}\Sigma_{ba}.
    \end{aligned}}\)


