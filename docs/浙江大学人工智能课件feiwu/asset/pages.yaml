  img_proc: true
- pgno: 976
  md: 'One common criterion for determining the parameters in a probability distribution
    using an observed data set is to find the parameter values that maximize the likelihood
    function. This might seem like a strange criterion because, from our foregoing
    discussion of probability theory, it would seem more natural to maximize the probability
    of the parameters given the data, not the probability of the data given the parameters.
    In fact, these two criteria are related, as we shall discuss in the context of
    curve fitting.


    For the moment, however, we shall determine values for the unknown parameters
    μ and σ² in the Gaussian by maximizing the likelihood function (1.53). In practice,
    it is more convenient to maximize the log of the likelihood function. Because
    the logarithm is a monotonically increasing function of its argument, maximization
    of the log of a function is equivalent to maximization of the function itself.
    Taking the log not only simplifies the subsequent mathematical analysis, but it
    also helps numerically because the product of a large number of small probabilities
    can easily underflow the numerical precision of the computer, and this is resolved
    by computing instead the sum of the log probabilities. From (1.46) and (1.53),
    the log likelihood function can be written in the form


    Maximizing (1.54) with respect to μ, we obtain the maximum likelihood solution
    given by


    which is the sample mean, i.e., the mean of the observed values {xₙ}. Similarly,
    maximizing (1.54) with respect to σ², we obtain the maximum likelihood solution
    for the variance in the form


    which is the sample variance measured with respect to the sample mean μML. Note
    that we are performing a joint maximization of (1.54) with respect to μ and σ²,
    but in the case of the Gaussian distribution the solution for μ decouples from
    that for σ² so that we can first evaluate (1.55) and then subsequently use this
    result to evaluate (1.56).


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_976_0.png)


