- pgno: 925
  md: '# # Minimax decision


    We want to compute an optimal move for player “Max”. In other words: “We are Max,
    and our opponent is Min."


    # ## Remember:


    +   - Max attempts to _maximize_ the utility _u(s)_ of the terminal state that
    will be reached during play.


    +   - Min attempts to _minimize u(s)_.


    # ## So what?


    +   - The computation alternates between minimization and maximization \(\Longrightarrow\)
    hence “Minimax”.'
  merge: -1
  img_proc: true
- pgno: 926
  md: "# # The minimax algorithm\n\n```\n```\nfunction MINIMAX-DECISION(state) returns\
    \ an action\n  return arg max a∈ ACTIONS(s) MIN-VALUE(RESULT(state, a))\nfunction\
    \ MAX-VALUE(state) returns a utility value\n  if TERMINAL-TEST(state) then return\
    \ Utility(state)\n  v ← −∞\n  for each a in ACTIONS(state) do\n    v ← MAX(v,\
    \ MIN-VALUE(RESULT(s, a)))\n  return v\nfunction MIN-VALUE(state) returns a utility\
    \ value\n  if TERMINAL-TEST(state) then return Utility(state)\n  v ← ∞\n  for\
    \ each a in ACTIONS(state) do\n    v ← MIN(v, MAX-VALUE(RESULT(s, a)))\n  return\
    \ v\n```\n```\n\nFigure 5.3 An algorithm for calculating minimax decisions. It\
    \ returns the action corresponding to the best possible move, that is, the move\
    \ that leads to the outcome with the best utility, under the assumption that the\
    \ opponent plays to minimize utility. The functions MAX-VALUE and MIN-VALUE go\
    \ through the whole game tree, all the way to the leaves, to determine the backed-up\
    \ value of a state. The notation argmax\\(_{a \\in S} f(a)\\) computes the element\
    \ \\(a\\) of set \\(S\\) that has the maximum value of \\(f(a)\\)."
  merge: -1
  img_proc: true
- pgno: 927
  md: "# # The minimax algorithm\n\n+   - The **minimax algorithm** computes the minimax\
    \ decision from the current state. It uses a simple recursive computation of the\
    \ minimax values of each successor state, directly implementing the defining equations.\
    \ The recursion proceeds all the way down to the leaves of the tree, and then\
    \ the minimax values are backed up through the tree as the recursion unwinds.\
    \ The minimax algorithm performs a complete depth-first exploration of the game\
    \ tree.\n\n![](img/c69bfdf1f6addd09d49cae0440fcc5c7_927_0.png)\n\n```\n```text\n\
    function MINIMAX-DECISION(state) returns an action\n    return arg max_{a ∈ ACTIONS(s)}\
    \ MIN-VALUE(RESULT(state, a))\n\nfunction MAX-VALUE(state) returns a utility value\n\
    \    if TERMINAL-TEST(state) then return UTILITY(state)\n    v ← −∞\n    for each\
    \ a in ACTIONS(state) do\n        v ← MAX(v, MIN-VALUE(RESULT(s, a)))\n    return\
    \ v\n\nfunction MIN-VALUE(state) returns a utility value\n    if TERMINAL-TEST(state)\
    \ then return UTILITY(state)\n    v ← ∞\n    for each a in ACTIONS(state) do\n\
    \        v ← MIN(v, MAX-VALUE(RESULT(s, a)))\n    return v\n```\n```\n\n+   -\
    \ If the maximum depth of the tree is $m$ and there are $b$ legal moves at each\
    \ point, then the time complexity of the minimax algorithm is $O(b^m)$. The space\
    \ complexity is $O(bm)$ for an algorithm that generates all actions at once, or\
    \ $O(m)$ for an algorithm that generates actions one at a time. For real games,\
    \ of course, the time cost is totally impractical, but this algorithm serves as\
    \ the basis for the mathematical analysis of games and for more practical algorithms."
  merge: -1
  img_proc: true
