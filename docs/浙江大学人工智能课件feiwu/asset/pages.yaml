- pgno: 1261
  md: '# # ConvNet Architecture


    +   - Several cases of ConvNet:

    +     - **LeNet**. The first successful applications of Convolutional Networks
    were developed by Yann LeCun in 1990''s. Of these, the best known is the LeNet
    architecture that was used to read zip codes, digits, etc.

    +     - **AlexNet**. The first work that popularized Convolutional Networks in
    Computer Vision was the AlexNet, developed by Alex Krizhevsky, Ilya Sutskever
    and Geoff Hinton. The AlexNet was submitted to the ImageNet ILSVRC challenge in
    2012 and significantly outperformed the second runner-up (top 5 error of 16% compared
    to runner-up with 26% error). The Network had a similar architecture basic as
    LeNet, but was deeper, bigger, and featured Convolutional Layers stacked on top
    of each other (previously it was common to only have a single CONV layer immediately
    followed by a POOL layer).

    +     - **ZF Net**. The ILSVRC 2013 winner was a Convolutional Network from Matthew
    Zeiler and Rob Fergus. It became known as the ZF Net (short for Zeiler & Fergus
    Net). It was an improvement on AlexNet by tweaking the architecture hyperparameters,
    in particular by expanding the size of the middle convolutional layers.'
  merge: -1
  img_proc: true
- pgno: 1262
  md: '# # ConvNet Architecture


    +   - Several cases of ConvNet:

    +     - **GoogLeNet**. The ILSVRC 2014 winner was a Convolutional Network from
    Szegedy et al. from Google. Its main contribution was the development of an *Inception
    Module* that dramatically reduced the number of parameters in the network (4M,
    compared to AlexNet with 60M).

    +     - **VGGNet**. The runner-up in ILSVRC 2014 was the network from Karen Simonyan
    and Andrew Zisserman that became known as the VGGNet. Its main contribution was
    in showing that the depth of the network is a critical component for good performance.
    Their final best network contains 16 CONV/FC layers and, appealingly, features
    an extremely homogeneous architecture that only performs 3x3 convolutions and
    2x2 pooling from the beginning to the end. It was later found that despite its
    slightly weaker classification performance, the VGG ConvNet features outperform
    those of GoogLeNet in multiple transfer learning tasks. Hence, the VGG network
    is currently the most preferred choice in the community when extracting CNN features
    from images. In particular, their pretrained model is available for plug and play
    use in Caffe. A downside of the VGGNet is that it is more expensive to evaluate
    and uses a lot more memory and parameters (140M).'
  merge: -1
  img_proc: true
