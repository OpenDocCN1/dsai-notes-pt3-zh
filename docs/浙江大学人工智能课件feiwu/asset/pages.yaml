  md: '# The recent resurgence of AI (1): **Human-Computer Game**

    from perfect information to imperfect information


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_488_0.png)


    # Heads-up limit hold’em poker is solved


    Poker is a family of games that exhibit imperfect information, where players do
    not have full knowledge of past events. Whereas many perfect-information games
    have been solved (e.g., Connect Four and checkers), no nontrivial imperfect-information
    game played competitively by humans has previously been solved. Here, we announce
    that heads-up limit Texas hold’em is now essentially weakly solved. Furthermore,
    our computation formally proves the common wisdom that the dealer in the game
    holds a substantial advantage. This result was enabled by a new algorithm, CFR+,
    which is capable of solving extensive-form games orders of magnitude larger than
    previously possible.


    > “Heads-up limit hold’em poker is solved, 347(6218):145-149, 2015, *Science*”


    # CARNEGIE MELLON ARTIFICIAL INTELLIGENCE BEATS TOP POKER PROS


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_488_1.png)


    Libratus by CMU'
