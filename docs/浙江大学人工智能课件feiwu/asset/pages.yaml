  md: '# # Kernel density estimators


    +   - Parzen window (an example of a Kernel function)


    \( k(\mathbf{u}) = \left\{ \begin{array}{ll} 1, & |u_i| \leqslant 1/2, \\ 0, &
    \text{otherwise} \end{array} \right. \quad i = 1, \dots, D \)


    +   - The total number of data points lying inside this cube:


    \( K = \sum_{n=1}^N k \left( \frac{\mathbf{x} - \mathbf{x}_n}{h} \right) \)


    +   - The estimated density at x:


    \( p(\mathbf{x}) = \frac{1}{N} \sum_{n=1}^N \frac{1}{h^D} k \left( \frac{\mathbf{x}
    - \mathbf{x}_n}{h} \right) \)


    # ## Smoother density model (Gaussian):


    \( p(\mathbf{x}) = \frac{1}{N} \sum_{n=1}^N \frac{1}{(2\pi h^2)^{D/2}} \exp \left\{
    - \frac{\|\mathbf{x} - \mathbf{x}_n\|^2}{2h^2} \right\} \)


