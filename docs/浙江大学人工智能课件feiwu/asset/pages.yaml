- pgno: 22
  md: '# # Alpha-Beta Pruning


    +   - **What is** \(\alpha\): For each search node \(n\), the highest Max-node
    utility that search has found already on its path to \(n\).

    +   - **How to use** \(\alpha\): In a Min node \(n\), if one of the successors
    already has utility \(\leq \alpha\), then stop considering \(n\). (Pruning out
    its remaining successors.)


    We can use a dual method for Min:


    +   - **What is** \(\beta\): For each search node \(n\), the lowest Min-node utility
    that search has found already on its path to \(n\).

    +   - **How to use** \(\beta\): In a Max node \(n\), if one of the successors
    already has utility \(\geq \beta\), then stop considering \(n\). (Pruning out
    its remaining successors.)'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# # Alpha-Beta Pruning


    Alpha-beta pruning can be applied to trees of any depth, and it is often possible
    to prune entire subtrees rather than just leaves. The general principle is this:
    consider a node _n_ somewhere in the tree (see Figure 5.6), such that Player has
    a choice of moving to that node. If Player has a better choice _m_ either at the
    parent node of _n_ or at any choice point further up, then _n_ will never be reached
    in actual play. So once we have found out enough about _n_ (by examining some
    of its descendants) to reach this conclusion, we can prune it.


    Remember that minimax search is depth-first, so at any one time we just have to
    consider the nodes along a single path in the tree. Alpha-beta pruning gets its
    name from the following two parameters that describe bounds on the backed-up values
    that appear anywhere along the path:


    +   \(\alpha\) = the value of the best (i.e., highest-value) choice we have found
    so far at any choice point along the path for MAX.


    +   \(\beta\) = the value of the best (i.e., lowest-value) choice we have found
    so far at any choice point along the path for MIN.


    Alpha-beta search updates the values of \(\alpha\) and \(\beta\) as it goes along
    and prunes the remaining branches at a node (i.e., terminates the recursive call)
    as soon as the value of the current node is known to be worse than the current
    \(\alpha\) or \(\beta\) value for MAX or MIN, respectively. The complete algorithm
    is given in Figure 5.7. We encourage you to trace its behavior when applied to
    the tree in Figure 5.5.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_23_0.png)'
  merge: -1
  img_proc: true
- pgno: 24
  md: '+   - General configuration (MIN version)

    +     - We’re computing the MIN-VALUE at some node *n*

    +     - We’re looping over *n*’s children

    +     - *n*’s estimate of the childrens’ min is dropping

    +     - Who cares about *n*’s value? MAX

    +     - Let *a* be the best value that MAX can get at any choice point along the
    current path from the root

    +     - If *n* becomes worse than *a*, MAX will avoid it, so we can stop considering
    *n*’s other children (it’s already bad enough that it won’t be played)


    +   - MAX version is symmetric


