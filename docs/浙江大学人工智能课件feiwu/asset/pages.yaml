- pgno: 645
  md: '# # Nonparametric Methods


    Nonparametric statistics is the branch of statistics that is not based solely
    on parameterized families of probability distributions (common examples of parameters
    are the mean and variance). Nonparametric statistics is based on either being
    distribution-free or having a specified distribution but with the distribution''s
    parameters unspecified. Nonparametric statistics includes both descriptive statistics
    and statistical inference.


    Non-parametric models differ from parametric models in that the model structure
    is not specified a priori but is instead determined from data. The term non-parametric
    is not meant to imply that such models completely lack parameters but that the
    number and nature of the parameters are flexible and not fixed in advance.


    +   - **A histogram** is a simple nonparametric estimate of a probability distribution.

    +   - **Kernel density estimation** provides better estimates of the density than
    histograms.

    +   - **Nonparametric regression** and semiparametric regression methods have
    been developed based on kernels, splines, and wavelets.

    +   - **KNNs(K-nearest neighbors)** classify the unseen instance based on the
    K points in the training set which are nearest to it.

    +   - ...'
  merge: -1
  img_proc: true
- pgno: 646
  md: "# # Nonparametric Methods\n\n+   - **How to estimate unknown probability density**\
    \ \\(p(x)\\):\n+     - Assume we have collected a data set comprising \\(N\\)\
    \ observations drawn from \\(p(x)\\). Consider some small region \\(R\\) containing\
    \ \\(x\\), the probability mass associated with this region is given by\n+   \n\
    +       \\[\n+       P = \\int_R p(x)\\,dx \\quad\\Longrightarrow\\quad p(x) =\
    \ \\frac{K}{NV}\n+       \\]\n+   \n+     - \\(V\\) is the volume of \\(R\\)\n\
    +     - \\(K\\) is the total number of points that lie inside \\(R\\)\n\n![](img/c69bfdf1f6addd09d49cae0440fcc5c7_646_0.png)\n\
    \n+   ① **Kernel density estimator**\n+     - Fix \\(V\\), determine \\(K\\) from\
    \ the data\n\n+   ② **KNN density estimator**\n+     - K-nearest-neighbor\n+ \
    \    - Fix \\(K\\), determine the value of \\(V\\) from the data"
  merge: -1
