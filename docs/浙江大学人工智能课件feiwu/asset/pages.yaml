  md: "# Monte-Carlo Tree Search\n\n# UCT Algorithm\n\n$S$: The set of states.  \n\
    $A(s)$: The set of valid and unvisited actions for state $s$.  \n$s(v)$: The state\
    \ that $v$ represents.  \n$a(v)$: The action that leading to $v$.  \n$f:S \\times\
    \ A \\to S$, the state transition function.  \n$N(v)$: The number of times node\
    \ $v$ has been visited.  \n$Q(v)$: The total reward of the action leading to $v$.\
    \  \n$\\Delta(v,p)$: The reward for the player $p$ to move at node $v$.\n\n![](img/c69bfdf1f6addd09d49cae0440fcc5c7_106_0.png)\n\
    \n```\nfunction UCTSearch($s_0$)  \n    create root node $v_0$ with state $s_0$\
    \  \n    while within computational budget do  \n        $v_l \\leftarrow$ TreePolicy($v_0$)\
    \  \n        $\\Delta \\leftarrow$ DefaultPolicy($s(v_l)$)  \n        Backup($v_l,\
    \ \\Delta$)  \n    return argmax BestChild($v_0, 0$)\n```\n\n```\nfunction TreePolicy($v$)\
    \  \n    while $v$ is nonterminal do  \n        if $v$ not fully expanded then\
    \  \n            return Expand($v$)  \n        else  \n            $v \\leftarrow$\
    \ BestChild($v, C_p$)  \n    return $v$\n```\n\n```\nfunction DefaultPolicy($s$)\
    \  \n    while $s$ is non-terminal do  \n        choose $a \\in A(s)$ uniformly\
    \ at random  \n        $s \\leftarrow f(s,a)$  \n    return reward for state $s$\n\
    ```\n\n```\nfunction Backup($v, \\Delta$)  \n    while $v$ is not null do  \n\
    \        $N(v) \\leftarrow N(v)+1$  \n        $Q(v) \\leftarrow Q(v)+\\Delta(v,p)$\
    \  \n        $v \\leftarrow$ parent of $v$\n```\n\n```\nfunction Expand($v$) \
    \ \n    choose $a \\in$ untried actions from $A(s(v))$  \n    add a new child\
    \ $v'$ to $v$  \n        with $s(v')=f(s(v),a)$  \n        and $a(v')=a$  \n \
    \   return $v'$\n```\n\n```\nfunction BestChild($v,c$)  \n    return arg max$_{v'\
    \ \\in children\\ of\\ v$} \\left[\\frac{Q(v')}{N(v')}+c\\sqrt{\\frac{2\\ln N(v)}{N(v')}}\\\
    right]$\n```"
