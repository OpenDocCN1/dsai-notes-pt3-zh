- pgno: 732
  md: '# # Problem-Solving by Search


    +   - **Uninformed** search algorithms


    +   – algorithms that are given no information about the problem other than its
    definition. Although some of these algorithms can solve any solvable problem,
    none of them can do so efficiently.


    +   - **Informed** search algorithms


    +   – do quite well given some guidance on where to look for solutions.'
