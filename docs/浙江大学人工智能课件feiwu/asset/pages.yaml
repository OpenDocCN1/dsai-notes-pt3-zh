- pgno: 805
  md: '# # Heuristic Functions


    # # The effect of heuristic accuracy on performance


    One way to characterize the quality of a heuristic is the **effective branching
    factor** _b_<sup>∗</sup>. If the total number of nodes generated by A<sup>∗</sup>
    for a particular problem is _N_ and the solution depth is _d_, then _b_<sup>∗</sup>
    is the branching factor that a uniform tree of depth _d_ would have to have in
    order to contain _N_+1 nodes. Thus,

    _N_+1=1+_b_<sup>∗</sup>+(_b_<sup>∗</sup>)<sup>2</sup>+⋯+(_b_<sup>∗</sup>)_<sup>d</sup>_
    .


    For example, if A<sup>∗</sup> finds a solution at depth 5 using 52 nodes, then
    the effective branching factor is 1.92. The effective branching factor can vary
    across problem instances, but usually it is fairly constant for sufficiently hard
    problems. (The existence of an effective branching factor follows from the result,
    mentioned earlier, that the number of nodes expanded by A<sup>∗</sup> grows exponentially
    with solution depth.) Therefore, experimental measurements of _b_<sup>∗</sup>
    on a small set of problems can provide a good guide to the heuristic’s overall
    usefulness. A well-designed heuristic would have a value of _b_<sup>∗</sup> close
    to 1, allowing fairly large problems to be solved at reasonable computational
    cost.'
  merge: -1
  img_proc: true
- pgno: 806
  md: '# # Heuristic Functions


    # # The effect of heuristic accuracy on performance


    To test the heuristic functions _h_<sub>1</sub> and _h_<sub>2</sub>, we generated
    1200 random problems with solution lengths from 2 to 24 (100 for each even number)
    and solved them with iterative deepening search and with A* tree search using
    both _h_<sub>1</sub> and _h_<sub>2</sub>. Figure 3.29 gives the average number
    of nodes generated by each strategy and the effective branching factor. The results
    suggest that _h_<sub>2</sub> is better than _h_<sub>1</sub>, and is far better
    than using iterative deepening search. Even for small problems with _d_ = 12,
    A* with _h_<sub>2</sub> is 50,000 times more efficient than uninformed iterative
    deepening search.


    One might ask whether _h_<sub>2</sub> is _always_ better than _h_<sub>1</sub>.
    The answer is “Essentially, yes.” It is easy to see from the definitions of the
    two heuristics that, for any node _n_, _h_<sub>2</sub>(_n_) ≥ _h_<sub>1</sub>(_n_).
    We thus say that _h_<sub>2</sub> _dominates h_<sub>1</sub>. Domination translates
    directly into efficiency: A* using _h_<sub>2</sub> will never expand more nodes
    than A* using _h_<sub>1</sub> (except possibly for some nodes with _f_(_n_) =
    _C_<sup>∗</sup>). The argument is simple. Recall the observation on page 97 that
    every node with _f_(_n_) < _C_<sup>∗</sup> will surely be expanded. This is the
    same as saying that every node with _h_(_n_) < _C_<sup>∗</sup> − _g_(_n_) will
    surely be expanded. But because _h_<sub>2</sub> is at least as big as _h_<sub>1</sub>
    for all nodes, every node that is surely expanded by A* search with _h_<sub>2</sub>
    will also surely be expanded with _h_<sub>1</sub>, and _h_<sub>1</sub> might cause
    other nodes to be expanded as well. Hence, it is generally better to use a heuristic
    function with higher values, provided it is consistent and that the computation
    time for the heuristic is not too long.


