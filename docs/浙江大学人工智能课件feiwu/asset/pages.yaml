- pgno: 641
  md: '# # Gamma distribution: \( \text{Gam}(\lambda|a, b) = \frac{1}{\Gamma(a)} b^a
    \lambda^{a-1} \exp(-b\lambda) \)


    > \( \Gamma(x) \equiv \int_0^\infty u^{x-1} e^{-u} \, du \)


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_641_0.png)


    \(\int_0^\infty \text{Gam}(\tau|a, b) \, d\tau = \frac{1}{\Gamma(a)} \int_0^\infty
    b^a \tau^{a-1} \exp(-b\tau) \, d\tau\)


    \( = \frac{1}{\Gamma(a)} \int_0^\infty b^a u^{a-1} \exp(-u) b^{1-a} b^{-1} \,
    du \)


    \( = 1 \)


    > \( b\tau = u \)


    \(\mathbb{E}[\tau] = \frac{1}{\Gamma(a)} \int_0^\infty b^a \tau^{a-1} \tau \exp(-b\tau)
    \, d\tau\)


    \( = \frac{1}{\Gamma(a)} \int_0^\infty b^a u^a \exp(-u) b^{-a} b^{-1} \, du \)


    \( = \frac{\Gamma(a+1)}{b\Gamma(a)} = \frac{a}{b} \)


    \(\mathbb{E}[\tau^2] = \frac{1}{\Gamma(a)} \int_0^\infty b^a \tau^{a-1} \tau^2
    \exp(-b\tau) \, d\tau\)


    \( = \frac{1}{\Gamma(a)} \int_0^\infty b^a u^{a+1} \exp(-u) b^{-a-1} b^{-1} \,
    du \)


    \( = \frac{\Gamma(a+2)}{b^2\Gamma(a)} = \frac{(a+1)\Gamma(a+1)}{b^2\Gamma(a)}
    = \frac{a(a+1)}{b^2} \)


    \(\text{var}[\tau] = \mathbb{E}[\tau^2] - \mathbb{E}[\tau]^2 = \frac{a(a+1)}{b^2}
    - \frac{a^2}{b^2} = \frac{a}{b^2} \)'
