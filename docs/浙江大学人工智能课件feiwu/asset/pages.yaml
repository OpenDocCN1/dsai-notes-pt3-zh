    R = (Λ + A^T L A -A^T L -LA L)


    cov[z] = R^-1 = (Λ^-1 Λ^-1 A^T A A^-1 L^-1 + A A^-1 A^T)


    x^T Λ μ - x^T A^T L b + y^T L b = (x y)^T (Λ μ - A^T L b L b)


