- pgno: 1386
  md: '# LSTM: look into the gradient flow


    +   - This might all seem magical, but it really is just the result of two main
    things:

    +     - The additive update function for the cell state gives a derivative that
    is much more ‘well behaved’

    +     - The gating functions allow the network to decide how much the gradient
    vanishes, and can take on different values at each time step. The values that
    they take on are learned functions of the current input and hidden state.'
