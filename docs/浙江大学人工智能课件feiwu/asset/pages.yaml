- pgno: 739
  md: '# # Well-defined problems and solutions


    +   - A problem can be defined formally by five components :


    +   - **Initial state**: The **initial state** that the agent starts in. For example,
    the initial state for our agent in Romania might be described as In(Arad).


    +   - **Actions**: A description of the possible **actions** available to the
    agent. Given a particular state s, ACTIONS(s) returns the set of actions that
    can be executed in s. We say that each of these actions is applicable in s. For
    example, from the state In(Arad), the applicable actions are {Go(Sibiu), Go(Timisoara),
    Go(Zerind)}.


    +   - **Transition model**: A description of what each action does; the formal
    name for this is the **transition model**, specified by a function RESULT(s, a)
    that returns the state that results from doing action **a** in state **s**. We
    also use the term **successor** to refer to any state reachable from a given state
    by a single action. For example, we have RESULT(In(Arad),Go(Zerind)) = In(Zerind)'
  merge: -1
  img_proc: true
- pgno: 740
  md: '# Well-defined problems and solutions


    +   - A problem can be defined formally by five components:


    +   - **Graph (Path):** The initial state, actions, and transition model implicitly
    define the state space of the problem—the set of all states reachable from the
    initial state by any sequence of actions. The state space forms a directed **network**
    or **graph** in which the nodes are states and the links between nodes are actions.
    (The map of Romania can be interpreted as a state-space graph if we view each
    road as standing PATH for two driving actions, one in each direction.) A **path**
    in the state space is a sequence of states connected by a sequence of actions.


    +   - **Goal test:** The **goal test**, which determines whether a given state
    is a goal state. Sometimes there is an explicit set of possible goal states, and
    the test simply checks whether the given state is one of them. The agent’s goal
    in Romania is the singleton set {In(Bucharest)}. Sometimes the goal is specified
    by an abstract property rather than an explicitly enumerated set of states.'
  merge: -1
  img_proc: true
- pgno: 741
  md: '# Well-defined problems and solutions


    +   - A problem can be defined formally by five components:


    +   - **Path cost:** A *path cost* function that assigns a numeric cost to each
    path. The problem-solving agent chooses a cost function that reflects its own
    performance measure. For the agent trying to get to Bucharest, time is of the
    essence, so the cost of a path might be its length in kilometers.'
  merge: -1
  img_proc: true
