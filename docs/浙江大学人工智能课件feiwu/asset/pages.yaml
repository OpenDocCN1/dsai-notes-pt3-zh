- pgno: 597
  md: '# # Multi-class for Logistic regression


    +   • We can write down the likelihood function:


    \( p(\mathbf{T}|\mathbf{X}, \mathbf{w}_1, ..., \mathbf{w}_K) = \prod_{n=1}^N \left[
    \prod_{k=1}^K p(C_k|\mathbf{x}_n)^{t_{nk}} \right] = \prod_{n=1}^N \left[ \prod_{k=1}^K
    y_{nk}^{t_{nk}} \right] \)


    N × K binary matrix of target variables.


    Only one term corresponding to correct class contributes.


    where \( y_{nk} = p(C_k|\mathbf{x}_n) = \frac{\exp(\mathbf{w}_k^T\mathbf{x}_n)}{\sum_j
    \exp(\mathbf{w}_j^T\mathbf{x}_n)} \).


    +   • Taking the negative logarithm gives the cross-entropy entropy function for
    multi-class classification problem:


    \( E(\mathbf{w}_1, ..., \mathbf{w}_K) = -\ln p(\mathbf{T}|\mathbf{X}, \mathbf{w}_1,
    ..., \mathbf{w}_K) = -\sum_{n=1}^N \left[ \sum_{k=1}^K t_{nk} \ln y_{nk} \right]
    \).


    +   • Taking the gradient:


    \( \nabla E_{\mathbf{w}_j}(\mathbf{w}_1, ...\mathbf{w}_K) = \sum_{n=1}^N (y_{nj}
    - t_{nj})\mathbf{x}_n \).'
