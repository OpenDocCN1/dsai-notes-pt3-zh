    belief nets. Neural Comp. 18, 1527–1554 (2006).

    +     - *This paper introduced a novel and effective way of training very deep
    neural networks by pre-training one hidden layer at a time using the unsupervised
    learning procedure for restricted Boltzmann machines.*

    +   - Bengio, Y., Lamblin, P., Popovici, D. & Larochelle, H. Greedy layer-wise
    training of deep networks. In Proc. Advances in Neural Information Processing
    Systems 19 153–160 (2006).

    +     - *This report demonstrated that the unsupervised pre-training method introduced
    in ref. 32 significantly improves performance on test data and generalizes the
    method to other unsupervised representation-learning techniques, such as auto-encoders.*

    +   - Ranzato, M., Poultney, C., Chopra, S. & LeCun, Y. Efficient learning of
    sparse representations with an energy-based model. In Proc. Advances in Neural
    Information Processing Systems 19 1137–1144 (2006).

