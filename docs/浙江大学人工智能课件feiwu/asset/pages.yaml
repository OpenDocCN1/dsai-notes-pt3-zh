- pgno: 332
  md: '# 损失函数


    SmoothL1 Loss:


    $$L_{loc}(t^u,v)=\sum_{i\in\{x,y,w,h\}} smooth_{L_1}(t_i^u-v_i)$$


    in which


    $$smooth_{L_1}(x)=\begin{cases}0.5x^2 & \text{if } |x|<1\\ |x|-0.5 & \text{otherwise,}\end{cases}$$


    正确率：若预测的 bounding box 与 ground truth 的 IoU 大于等于 0.75，则认为预测正确。'
  merge: -1
  img_proc: true
