- pgno: 919
  md: '# # The definition of a game


    We first consider games with two players, whom we call MAX and MIN for reasons
    that will soon become obvious. MAX moves first, and then they take turns moving
    until the game is over. At the end of the game, points are awarded to the winning
    player and penalties are given to the loser. A game can be formally defined as
    a kind of search problem with the following elements:


    +   - \( S_0 \): The **initial state**, which specifies how the game is set up
    at the start.

    +   - \( \text{PLAYER}(s) \): Defines which player has the move in a state.

    +   - \( \text{ACTIONS}(s) \): Returns the set of legal moves in a state.

    +   - \( \text{RESULT}(s, a) \): The **transition model**, which defines the result
    of a move.

    +   - \( \text{TERMINAL-TEST}(s) \): A **terminal test**, which is true when the
    game is over and false otherwise. States where the game has ended are called **terminal
    states**.

    +   - \( \text{UTILITY}(s, p) \): A **utility function** (also called an objective
    function or payoff function), defines the final numeric value for a game that
    ends in terminal state \( s \) for a player \( p \). In chess, the outcome is
    a win, loss, or draw, with values \( +1 \), \( 0 \), or \( \frac{1}{2} \). Some
    games have a wider variety of possible outcomes; the payoffs in backgammon range
    from \( 0 \) to \( +192 \). A **zero-sum game** is (confusingly) defined as one
    where the total payoff to all players is the same for every instance of the game.
    Chess is zero-sum because every game has payoff of either \( 0 + 1 \), \( 1 +
    0 \) or \( \frac{1}{2} + \frac{1}{2} \). "Constant-sum" would have been a better
    term, but zero-sum is traditional and makes sense if you imagine each player is
    charged an entry fee of \( \frac{1}{2} \).'
  merge: -1
  img_proc: true
