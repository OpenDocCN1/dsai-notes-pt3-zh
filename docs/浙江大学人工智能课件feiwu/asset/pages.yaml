    \ - The log of the likelihood function of GMM:\n+   \n+   \\(\\ln p(X|\\pi, \\\
    mu, \\Sigma)=\\sum_{n=1}^N \\ln \\left\\{\\sum_{k=1}^K \\pi_k \\mathcal{N}(x_n|\\\
    mu_k, \\Sigma_k)\\right\\}\\)\n\n+   - Issue #1: singularities\n+     - Collapses\
    \ onto a specific data point\n\n+   - Issue #2: identifiability\n+     - Total\
    \ K! equivalent solutions\n\n+   - Issue #3: no closed form solution\n+     -\
    \ The derivatives of the log likelihood\n+       are complex.\n\n![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1088_0.png)"
  merge: -1
  img_proc: true
- pgno: 1089
  md: '# # Expectation-Maximization algorithm for GMM


    \(\ln p(\mathbf{X}|\pi,\mu,\Sigma)=\sum_{n=1}^N \ln \left\{\sum_{k=1}^K \pi_k\mathcal{N}(\mathbf{x}_n|\mu_k,\Sigma_k)\right\}\)

    \(\sum_{k=1}^K \pi_k=1\quad 0 \leq \pi_k \leq 1\)


    # ## E Step


    \(\gamma(z_{nk})=\frac{\pi_k\mathcal{N}(\mathbf{x}_n|\mu_k,\Sigma_k)}{\sum_j \pi_j\mathcal{N}(\mathbf{x}_n|\mu_j,\Sigma_j)}\)


    > Each iteration will increase the log likelihood function.


    # ## M Step


    +   - Solve \(\mu_k\) : \(\frac{\partial \ln p(\mathbf{X}|\pi,\mu,\Sigma)}{\partial
    \mu_k}=0 \Rightarrow 0 = -\sum_{n=1}^N \frac{\pi_k\mathcal{N}(\mathbf{x}_n|\mu_k,\Sigma_k)}{\sum_j
    \pi_j\mathcal{N}(\mathbf{x}_n|\mu_j,\Sigma_j)} \Sigma_k^{-1}(\mathbf{x}_n - \mu_k)\)

    +     \(\Rightarrow \mu_k = \frac{1}{N_k} \sum_{n=1}^N \gamma(z_{nk})\mathbf{x}_n
    \quad N_k = \sum_{n=1}^N \gamma(z_{nk})\)


    +   - Solve \(\Sigma_k\) : \(\frac{\partial \ln p(\mathbf{X}|\pi,\mu,\Sigma)}{\partial
    \Sigma_k}=0 \Rightarrow \Sigma_k = \frac{1}{N_k} \sum_{n=1}^N \gamma(z_{nk})(\mathbf{x}_n
    - \mu_k)(\mathbf{x}_n - \mu_k)^\mathrm{T}\)


    +   - Solve \(\pi_k\) : \(\frac{\partial}{\partial \pi_k}\left\{ \ln p(\mathbf{X}|\pi,\mu,\Sigma)
    + \lambda \left( \sum_{k=1}^K \pi_k - 1 \right) \right\}=0 \Rightarrow 0 = \sum_{n=1}^N
    \frac{\mathcal{N}(\mathbf{x}_n|\mu_k,\Sigma_k)}{\sum_j \pi_j\mathcal{N}(\mathbf{x}_n|\mu_j,\Sigma_j)}
    + \lambda \Rightarrow \pi_k = \frac{N_k}{N}\)'
  merge: -1
  img_proc: true
- pgno: 1090
  md: '# # Expectation-Maximization algorithm for GMM


    # ## EM for Gaussian Mixtures


    +   1. Initialize the means \(\mu_k\), covariances \(\Sigma_k\) and mixing coefficients
    \(\pi_k\), and evaluate the initial value of the log likelihood.


    +   2. **E step.** Evaluate the responsibilities using the current parameter values


    \(\gamma(z_{nk}) = \frac{\pi_k \mathcal{N}(\mathbf{x}_n | \mu_k, \Sigma_k)}{\sum_j
    \pi_j \mathcal{N}(\mathbf{x}_n | \mu_j, \Sigma_j)}\)


    +   3. **M step.** Re-estimate the parameters using the current responsibilities


    \(\mu_k^{\text{new}} = \frac{1}{N_k} \sum_{n=1}^N \gamma(z_{nk}) \mathbf{x}_n\)


    \(\Sigma_k^{\text{new}} = \frac{1}{N_k} \sum_{n=1}^N \gamma(z_{nk}) (\mathbf{x}_n
    - \mu_k^{\text{new}}) (\mathbf{x}_n - \mu_k^{\text{new}})^T\)


    \(\pi_k^{\text{new}} = \frac{N_k}{N} \quad \text{where} \quad N_k = \sum_{n=1}^N
    \gamma(z_{nk}).\)


    +   4. Evaluate the log likelihood


    \(\ln p(\mathbf{X} | \mu, \Sigma, \pi) = \sum_{n=1}^N \ln \left\{ \sum_{k=1}^K
    \pi_k \mathcal{N}(\mathbf{x}_n | \mu_k, \Sigma_k) \right\}\)


    and check for convergence of either the parameters or the log likelihood. If the
    convergence criterion is not satisfied return to step 2.'
  merge: -1
  img_proc: true
