- pgno: 593
  md: '# # Logistic regression


    +   - Consider the problem of two-class classification.


    +   - We have seen that the posterior probability of class C<sub>1</sub> can be
    written as a logistic sigmoid function:


    \( p(C_1|\mathbf{x}) = \frac{1}{1 + \exp(-\mathbf{w}^T\mathbf{x})} = \sigma(\mathbf{w}^T\mathbf{x}),
    \)


    where \( p(C_2|\mathbf{x}) = 1 - p(C_1|\mathbf{x}) \), and we omit the bias term
    for clarity.


    +   - This model is known as logistic regression (although this is a model for
    classification rather than regression).


    Note that for generative models, we would first determine the class conditional
    densities and class-specific priors, and then use Bayes'' rule to obtain the posterior
    probabilities.


    Here we model \( p(C_k|\mathbf{x}) \) directly.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_593_0.png)'
  merge: -1
  img_proc: true
- pgno: 594
  md: '# # Maximum Likelihood for Logistic regression


    +   - We observed a training dataset \(\{ \mathbf{x}_n, t_n \}, n = 1, .., N;
    t_n \in \{0, 1\}\).


    +   - Maximize the probability of getting the label right, so the likelihood function
    takes form:


    \( p(\mathbf{t}|\mathbf{X}, \mathbf{w}) = \prod_{n=1}^N \left[ y_n^{t_n} (1 -
    y_n)^{1 - t_n} \right], \quad y_n = \sigma(\mathbf{w}^T \mathbf{x}_n). \)


    +   - Taking the negative log of the likelihood, we can define cross-entropy error
    function (that we want to minimize):


    \( E(\mathbf{w}) = - \ln p(\mathbf{t}|\mathbf{X}, \mathbf{w}) = - \sum_{n=1}^N
    \left[ t_n \ln y_n + (1 - t_n) \ln(1 - y_n) \right] = \sum_{n=1}^N E_n. \)


    +   - Differentiating and using the chain rule:


    \( \frac{\mathrm{d}}{\mathrm{d}y_n} E_n = \frac{y_n - t_n}{y_n(1 - y_n)}, \quad
    \frac{\mathrm{d}}{\mathrm{d}\mathbf{w}} y_n = y_n(1 - y_n)\mathbf{x}_n, \quad
    \frac{\mathrm{d}}{\mathrm{d}a}\sigma(a) = \sigma(a)(1 - \sigma(a)). \)


    \( \frac{\mathrm{d}}{\mathrm{d}\mathbf{w}} E_n = \frac{\mathrm{d}E_n}{\mathrm{d}y_n}
    \frac{\mathrm{d}y_n}{\mathrm{d}\mathbf{w}} = (y_n - t_n)\mathbf{x}_n. \)


    +   - Note that the factor involving the derivative of the logistic function cancelled.'
