    +   • The second order moments of the Gaussian


    \(\mathbb{E}[\mathbf{x}\mathbf{x}^\mathrm{T}] = \frac{1}{(2\pi)^{D/2}} \frac{1}{|\boldsymbol{\Sigma}|^{1/2}}
    \int \exp \left\{ -\frac{1}{2}(\mathbf{x} - \boldsymbol{\mu})^\mathrm{T} \boldsymbol{\Sigma}^{-1}
