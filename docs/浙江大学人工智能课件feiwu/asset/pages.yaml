- pgno: 180
  md: '# # Backpropagation


    # ## Compound expressions with chain rule


    Lets now start to consider more complicated expressions that involve multiple
    composed functions, such as \( f(x, y, z) = (x + y)z \). This expression is still
    simple enough to differentiate directly, but we’ll take a particular approach
    to it that will be helpful with understanding the intuition behind backpropagation.
    In particular, note that this expression can be broken down into two expressions:
    \( q = x + y \) and \( f = qz \). Moreover, we know how to compute the derivatives
    of both expressions separately, as seen in the previous section. \( f \) is just
    multiplication of \( q \) and \( z \), so \( \frac{\partial f}{\partial q} = z
    \), \( \frac{\partial f}{\partial z} = q \), and \( q \) is addition of \( x \)
    and \( y \) so \( \frac{\partial q}{\partial x} = 1 \), \( \frac{\partial q}{\partial
    y} = 1 \). However, we don’t necessarily care about the gradient on the intermediate
    value \( q \) - the value of \( \frac{\partial f}{\partial q} \) is not useful.
    Instead, we are ultimately interested in the gradient of \( f \) with respect
    to its inputs \( x, y, z \). The **chain rule** tells us that the correct way
    to “chain” these gradient expressions together is through multiplication. For
    example, \( \frac{\partial f}{\partial x} = \frac{\partial f}{\partial q} \frac{\partial
    q}{\partial x} \). In practice this is simply a multiplication of the two numbers
    that hold the two gradients. Lets see this with an example:


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_180_0.png)


    The real-valued “circuit” on left shows the visual representation of the computation.
    The **forward pass** computes values from inputs to output (shown in green). The
    **backward pass** then performs backpropagation which starts at the end and recursively
    applies the chain rule to compute the gradients (shown in red) all the way to
    the inputs of the circuit. The gradients can be thought of as flowing backwards
    through the circuit.'
  merge: -1
  img_proc: true
