  md: '# Stochastic Games


    Although White knows what his or her own legal moves are, White does not know
    what Black is going to roll and thus does not know what Black’s legal moves will
    be. That means White cannot construct a standard game tree of the sort we saw
    in chess and tic-tac-toe. A game tree in backgammon must include **chance nodes**
    in addition to MAX and MIN nodes.


    Chance nodes are shown as circles in Figure 5.11. The branches leading from each
    chance node to the possible dice rolls; each branch is labeled with the roll and
    its probability. There are 36 ways to roll two dice, each equally likely; but
    because a 6-5 is the same as a 5-6, there are only 21 distinct rolls. The six
    doubles (1-1 through 6-6) each have a probability of 1/36, so we say P(1-1) =
    1/36. The other 15 distinct rolls each have a 1/18 probability.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_48_0.png)'
