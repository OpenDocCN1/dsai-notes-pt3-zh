    # # ARTIFICIAL INTELLIGENCE AND LIFE IN 2030


    ONE HUNDRED YEAR STUDY ON ARTIFICIAL INTELLIGENCE | REPORT OF THE 2015 STUDY PANEL
    | SEPTEMBER 2016


    # # PREFACE


    The One Hundred Year Study on Artificial Intelligence, launched in the fall of
    2014, is a long-term investigation of the field of Artificial Intelligence (AI)
    and its influences on people, their communities, and society. It considers the
    science, engineering, and deployment of AI-enabled computing systems. As its core
    activity, the Standing Committee that oversees the One Hundred Year Study forms
    a Study Panel every five years to assess the current state of AI. The Study Panel
    reviews AI’s progress in the years following the immediately prior report, envisions
    the potential advances that lie ahead, and describes the technical and societal
    challenges and opportunities these advances raise, including in such arenas as
    ethics, economics, and the design of systems compatible with human cognition.
    The overarching purpose of the One Hundred Year Study’s periodic expert review
    is to provide a collected and connected reflection.


    The studies are expected to develop syntheses and assessments of the field’s advances.
    The studies will provide expert guidance for direction in AI research, development,
    and systems design, as well as programs and policies to help ensure that these
    systems broadly benefit individuals and society.


    The One Hundred Year Study is modeled on an earlier effort informally known as
    the “AAAI Asilomar Study”. During 2008-2009, the then president of the Association
    for Advancement of Artificial Intelligence (AAAI), Eric Horvitz, assembled a group
    of AI experts from multiple institutions and areas of the field, along with


    The overarching purpose of the One Hundred Year Study’s periodic expert review
    is to provide a collected and connected


    The research that fuels the AI revolution has also seen rapid changes:


    +   - maturation of machine learning (deep learning)


    +   - provides and leverages large amounts of data


    +   - the rise of cloud computing resources


    +   - consumer demand for widespread access to services such as speech recognition
    and navigation support


    The field of AI is shifting toward building intelligent systems that can collaborate
    effectively with people, including creative ways to develop interactive and scalable
    ways for people to teach robots.


