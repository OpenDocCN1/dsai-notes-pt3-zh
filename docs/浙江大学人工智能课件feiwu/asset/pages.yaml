- pgno: 907
  md: '# # Heuristic Functions


    +   - The 8-puzzle was one of the earliest heuristic search problems. As mentioned
    in Section 3.2, the object of the puzzle is to slide the tiles horizontally or
    vertically into the empty space until the configuration matches the goal configuration.


    The average solution cost for a randomly generated 8-puzzle instance is about
    22 steps. The branching factor is about 3. (When the empty tile is in the middle,
    four moves are possible; when it is in a corner, two; and when it is along an
    edge, three.) This means that an exhaustive tree search to depth 22 would look
    at about 3<sup>22</sup> ≈ 3.1 × 10<sup>10</sup> states. A graph search would cut
    this down by a factor of about 170,000 because only 9!/2 = 181,440 distinct states
    are reachable. (See Exercise 3.4.) This is a manageable number, but the corresponding
    number for the 15-puzzle is roughly 10<sup>13</sup>, so the next order of business
    is to find a good heuristic function. If we want to find the shortest solutions
    by using A*, we need a heuristic function that never overestimates the number
    of steps to the goal. There is a'
  merge: -1
  img_proc: true
- pgno: 908
  md: '# # Heuristic Functions


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_908_0.png)


    need a heuristic function that never overestimates the number of steps to the
    goal. There is a long history of such heuristics for the 15-puzzle; here are two
    commonly used candidates:


    +   - \( h_1 = \) the number of misplaced tiles. For Figure 3.28, all of the eight
    tiles are out of position, so the start state would have \( h_1 = 8 \). \( h_1
    \) is an admissible heuristic because it is clear that any tile that is out of
    place must be moved at least once.


    +   - \( h_2 = \) the sum of the distances of the tiles from their goal positions.
    Because tiles cannot move along diagonals, the distance we will count is the sum
    of the horizontal and vertical distances. This is sometimes called the city block
    distance or Manhattan distance. \( h_2 \) is also admissible because all any move
    can do is move one tile one step closer to the goal. Tiles 1 to 8 in the start
    state give a Manhattan distance of


    \( h_2 = 3 + 1 + 2 + 2 + 2 + 3 + 3 + 3 + 2 = 18 \).


    As expected, neither of these overestimates the true solution cost, which is 26.'
  merge: -1
  img_proc: true
- pgno: 909
  md: '# # Heuristic Functions


    # ## The effect of heuristic accuracy on performance


    One way to characterize the quality of a heuristic is the **effective branching
    factor** _b_<sup>∗</sup>. If the total number of nodes generated by A<sup>∗</sup>
    for a particular problem is _N_ and the solution depth is _d_, then _b_<sup>∗</sup>
    is the branching factor that a uniform tree of depth _d_ would have to have in
    order to contain _N_+1 nodes. Thus,


    ```

    ```

    N + 1 = 1 + b* + (b*)<sup>2</sup> + ... + (b*)<sup>d</sup> .

    ```

    ```


    For example, if A<sup>∗</sup> finds a solution at depth 5 using 52 nodes, then
    the effective branching factor is 1.92. The effective branching factor can vary
    across problem instances, but usually it is fairly constant for sufficiently hard
    problems. (The existence of an effective branching factor follows from the result,
    mentioned earlier, that the number of nodes expanded by A<sup>∗</sup> grows exponentially
    with solution depth.) Therefore, experimental measurements of _b_<sup>∗</sup>
    on a small set of problems can provide a good guide to the heuristic’s overall
    usefulness. A well-designed heuristic would have a value of _b_<sup>∗</sup> close
    to 1, allowing fairly large problems to be solved at reasonable computational
    cost.'
