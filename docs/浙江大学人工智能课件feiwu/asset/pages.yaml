- pgno: 216
  md: '+   - The goal of backpropagation is to optimize the weights so that the neural
    network can learn how to correctly map arbitrary inputs to outputs.

    +   - We''re going to work with a single training set: given inputs 0.05 and 0.10,
    we want the neural network to output 0.01 and 0.99.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_216_0.png)


    Here''s how we calculate the total net input for h₁:


    nctₕ₁ = w₁ * i₁ + w₂ * i₂ + b₁ * 1


    nctₕ₁ = 0.15 * 0.05 + 0.2 * 0.1 + 0.35 * 1 = 0.3775


    We then squash it using the logistic function to get the output of h₁:


    outₕ₁ = 1 / (1 + e⁻ⁿᶜᵗₕ₁) = 1 / (1 + e⁻⁰·³⁷⁷⁵) = 0.593269992


    Carrying out the same process for h₂ we get:


    outₕ₂ = 0.596884378


    We repeat this process for the output layer neurons, using the output from the
    hidden layer neurons as inputs.


    Here''s the output for o₁:


    nctₒ₁ = w₅ * outₕ₁ + w₆ * outₕ₂ + b₂ * 1


    nctₒ₁ = 0.4 * 0.593269992 + 0.45 * 0.596884378 + 0.6 * 1 = 1.105905967


    outₒ₁ = 1 / (1 + e⁻ⁿᶜᵗₒ₁) = 1 / (1 + e⁻¹·¹⁰⁵⁹⁰⁵⁹⁶⁷) = 0.75136507


    And carrying out the same process for o₂ we get:


    outₒ₂ = 0.772928465'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# # Calculating the Total Error


    For example, the target output for _o_<sub>1</sub> is 0.01 but the neural network
    output 0.75136507, therefore its error is:


    Repeating this process for _o_<sub>2</sub> (remembering that the target is 0.99)
    we get:


    The total error for the neural network is the sum of these errors:


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_217_0.png)


    ```

    ```

    E_{total} = \sum \frac{1}{2}(target - output)^2

    ```

    ```


    ```

    ```

    E_{o1} = \frac{1}{2}(target_{o1} - out_{o1})^2 = \frac{1}{2}(0.01 - 0.75136507)^2
    = 0.274811083

    ```

    ```


    ```

    ```

    E_{o2} = 0.023560026

    ```

    ```


    ```

    ```

    E_{total} = E_{o1} + E_{o2} = 0.274811083 + 0.023560026 = 0.298371109

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 218
  md: '![](img/c69bfdf1f6addd09d49cae0440fcc5c7_218_0.png)


    $$\frac{\partial E_{total}}{\partial w_5}=\frac{\partial E_{total}}{\partial out_1}\times\frac{\partial
    out_1}{\partial net_{o1}}\times\frac{\partial net_{o1}}{\partial w_5}$$


    Visually, here''s what we''re doing:


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_218_1.png)


    We need to figure out each piece in this equation.


    # # The Backwards Pass


    Output Layer


    Consider $w_5$. We want to know how much a change in $w_5$ affects the total error,
    aka $\frac{\partial E_{total}}{\partial w_5}$.


    First, how much does the total error change with respect to the output?


    $$E_{total}=\frac{1}{2}(target_{o1}-out_{o1})^2+\frac{1}{2}(target_{o2}-out_{o2})^2$$


    $$\frac{\partial E_{total}}{\partial out_{o1}}=2\times\frac{1}{2}(target_{o1}-out_{o1})^{2-1}\times(-1)+0$$


    $$\frac{\partial E_{total}}{\partial out_{o1}}=-(target_{o1}-out_{o1})=-(0.01-0.75136507)=0.74136507$$'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'Next, how much does the output of \( o_1 \) change with respect to its total
    net input?


    The partial <u>derivative of the logistic function</u> is the output multiplied
    by 1 minus the output:


    \( out_{o1} = \frac{1}{1+e^{-net_{o1}}} \)


    \( \frac{\partial out_{o1}}{\partial net_{o1}} = out_{o1}(1 - out_{o1}) = 0.75136507(1
    - 0.75136507) = 0.186815602 \)


    Finally, how much does the total net input of \( o_1 \) change with respect to
    \( w_5 \)?


    \( net_{o1} = w_5 * out_{h1} + w_6 * out_{h2} + b_2 * 1 \)


    \( \frac{\partial net_{o1}}{\partial w_5} = 1 * out_{h1} * w_5^{(1-1)} + 0 + 0
    = out_{h1} = 0.593269992 \)


    Putting it all together:


    \( \frac{\partial E_{total}}{\partial w_5} = \frac{\partial E_{total}}{\partial
    out_{o1}} * \frac{\partial out_{o1}}{\partial net_{o1}} * \frac{\partial net_{o1}}{\partial
    w_5} \)


    \( \frac{\partial E_{total}}{\partial w_5} = 0.74136507 * 0.186815602 * 0.593269992
    = 0.082167041 \)


    To decrease the error, we then subtract this value from the current weight (optionally
    multiplied by some learning rate, eta, which we''ll set to 0.5):


    \( w_5^+ = w_5 - \eta * \frac{\partial E_{total}}{\partial w_5} = 0.4 - 0.5 *
    0.082167041 = 0.35891648 \)'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# # Backpropagation


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_220_0.png)


    **Fig. 1** Overview of backpropagation. (a) Training pattern is fed forward, generating
    corresponding output. (b) Error between actual and desired output is computed.
    (c) The error propagates back, through updates where a ratio of the gradient \(\frac{\partial
    E}{\partial w_i}\) is subtracted from each weight. \(x_i\), \(w_i\), \(\phi\)
    are the inputs, input weights, and activation function of a neuron. Error _E_
    is computed from output _y_ and desired output _t_. \(\eta\) is the learning rate.'
  merge: -1
  img_proc: true
