- pgno: 1133
  md: '# # Backpropagation


    +   * A way of computing gradients of expressions through recursive application
    of **chain rule**


    **Problem statement**. The core problem studied in this section is as follows:
    We are given some function \( f(x) \) where \( x \) is a vector of inputs and
    we are interested in computing the gradient of \( f \) at \( x \) (i.e. \( \nabla
    f(x) \) ).


    **Motivation**. Recall that the primary reason we are interested in this problem
    is that in the specific case of Neural Networks, \( f \) will correspond to the
    loss function ( \( L \) ) and the inputs \( x \) will consist of the training
    data and the neural network weights. For example, the loss could be the SVM loss
    function and the inputs are both the training data \( (x_i, y_i), i = 1 \dots
    N \) and the weights and biases \( W, b \). Note that (as is usually the case
    in Machine Learning) we think of the training data as given and fixed, and of
    the weights as variables we have control over. Hence, even though we can easily
    use backpropagation to compute the gradient on the input examples \( x_i \), in
    practice we usually only compute the gradient for the parameters (e.g. \( W, b
    \)) so that we can use it to perform a parameter update. However, as we will see
    later in the class the gradient on \( x_i \) can still be useful sometimes, for
    example for purposes of visualization and interpreting what the Neural Network
    might be doing.'
  merge: -1
