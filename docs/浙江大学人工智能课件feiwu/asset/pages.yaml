- pgno: 1111
  md: '# # Common activation functions as well as their derivatives


    | Name | Plot | Equation | Derivative (with respect to x) | Range | Order of continuity
    | Monotonic |

    |---|---|---|---|---|---|---|

    | Identity | ![Identity plot](https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Identity_function.svg/20px-Identity_function.svg.png)
    | \( f(x) = x \) | \( f''(x) = 1 \) | \( (-\infty, \infty) \) | \( C^\infty \)
    | Yes |

    | Binary step | ![Binary step plot](https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/Binary_step_function.svg/20px-Binary_step_function.svg.png)
    | \( f(x) = \begin{cases} 0 & \text{for } x < 0 \\ 1 & \text{for } x \ge 0 \end{cases}
    \) | \( f''(x) = \begin{cases} 0 & \text{for } x \neq 0 \\ ? & \text{for } x =
    0 \end{cases} \) | \( \{0, 1\} \) | \( C^{-1} \) | Yes |

    | Logistic (a.k.a Soft step) | ![Logistic plot](https://upload.wikimedia.org/wikipedia/commons/thumb/8/88/Logistic-curve.svg/20px-Logistic-curve.svg.png)
    | \( f(x) = \frac{1}{1 + e^{-x}} \) | \( f''(x) = f(x)(1 - f(x)) \) | \( (0, 1)
    \) | \( C^\infty \) | Yes |

    | TanH | ![TanH plot](https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Tanh_function.svg/20px-Tanh_function.svg.png)
    | \( f(x) = \tanh(x) = \frac{2}{1 + e^{-2x}} - 1 \) | \( f''(x) = 1 - f(x)^2 \)
    | \( (-1, 1) \) | \( C^\infty \) | Yes |

    | ArcTan | ![ArcTan plot](https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Arctan_function.svg/20px-Arctan_function.svg.png)
    | \( f(x) = \tan^{-1}(x) \) | \( f''(x) = \frac{1}{x^2 + 1} \) | \( \left( -\frac{\pi}{2},
    \frac{\pi}{2} \right) \) | \( C^\infty \) | Yes |

    | Softsign [7][8] | ![Softsign plot](https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Softsign_function.svg/20px-Softsign_function.svg.png)
    | \( f(x) = \frac{x}{1 + |x|} \) | \( f''(x) = \frac{1}{(1 + |x|)^2} \) | \( (-1,
    1) \) | \( C^1 \) | Yes |

    | Rectifier (ReLU)[9] | ![ReLU plot](https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/ReLU_function.svg/20px-ReLU_function.svg.png)
    | \( f(x) = \begin{cases} 0 & \text{for } x < 0 \\ x & \text{for } x \ge 0 \end{cases}
    \) | \( f''(x) = \begin{cases} 0 & \text{for } x < 0 \\ 1 & \text{for } x \ge
    0 \end{cases} \) | \( [0, \infty) \) | \( C^0 \) | Yes |

    | Parametric Rectified Linear Unit (PReLU)[10] | ![PReLU plot](https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/PReLU_function.svg/20px-PReLU_function.svg.png)
    | \( f(\alpha, x) = \begin{cases} \alpha x & \text{for } x < 0 \\ x & \text{for
    } x \ge 0 \end{cases} \) | \( f''(\alpha, x) = \begin{cases} \alpha & \text{for
    } x < 0 \\ 1 & \text{for } x \ge 0 \end{cases} \) | \( (-\infty, \infty) \) |
    \( C^0 \) | Yes iff \( \alpha \ge 0 \) |'
