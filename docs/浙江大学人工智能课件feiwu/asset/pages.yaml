  md: '# # Basic notation


    +   - Now we consider the case of three boxes with fruit, and suppose we have
    different prior probabilities for choosing any one box.


    +   - A fruit is removed from the box (with equal probability of selecting any
    of the items in the box), then what is the probability of selecting an apple?


    \(p(a) = p(a|r)p(r) + p(a|b)p(b) + p(a|g)p(g)\)

    \(= \frac{3}{10} \times 0.2 + \frac{1}{2} \times 0.2 + \frac{3}{10} \times 0.6
    = 0.34\)


    +   - If we observe that the selected fruit is in fact an orange, what is the
