- pgno: 1119
  md: '# Representation Power


    Neural Networks with fully-connected layers define a family of functions that
    are parameterized by the weights of the network.


    It turns out that Neural Networks with at least one hidden layer are *universal
    approximators*. That is, it can be shown (e.g. see *Approximation by Superpositions
    of Sigmoidal Function* from 1989 (pdf), or this intuitive explanation from Michael
    Nielsen) that given any continuous function $f(x)$ and some $\epsilon > 0$, there
    exists a Neural Network $g(x)$ with one hidden layer (with a reasonable choice
    of non-linearity, e.g. sigmoid) such that $\forall x,\ |f(x)-g(x)| < \epsilon$.
    In other words, the neural network can approximate any continuous function.


    If one hidden layer suffices to approximate any function, why use more layers
    and go deeper? The answer is that the fact that a two-layer Neural Network is
    a universal approximator is, while mathematically cute, a relatively weak and
    useless statement in practice. In one dimension, the “sum of indicator bumps”
    function $g(x)=\sum_i c_i\mathbf{1}(a_i < x < b_i)$ where $a,b,c$ are parameter
    vectors is also a universal approximator, but no one would suggest that we use
    this functional form in Machine Learning. Neural Networks work well in practice
    because they compactly express nice, smooth functions that fit well with the statistical
    properties of data we encounter in practice, and are also easy to learn using
    our optimization algorithms (e.g. gradient descent). Similarly, the fact that
    deeper networks (with multiple hidden layers) can work better than a single-hidden-layer
    networks is an empirical observation, despite the fact that their representational
    power is equal.'
  merge: -1
  img_proc: true
- pgno: 1120
  md: '# # Representation Power


    # ## universal approximation theorem


    A **feed-forward** network with a single hidden layer containing a finite number
    of **neurons** (i.e., a **multilayer perceptron**), can approximate **continuous
    functions** on **compact subsets** of Rⁿ, under mild assumptions on the activation
    function. The theorem thus states that simple neural networks can _represent_
    a wide variety of interesting functions when given appropriate parameters; however,
    it does not touch upon the algorithmic **learnability** of those parameters. One
    of the first versions of the **theorem** was proved by **George Cybenko** in 1989
    for **sigmoid** activation functions.


    +   - Balázs Csanád Csáji, Approximation with Artificial Neural Networks, Faculty
    of Sciences; Eötvös Loránd University, Hungary

    +   - Cybenko,. G ., Approximations by superpositions of sigmoidal functions,
    _Mathematics of Control, Signals, and Systems_, 2 (4), 303-31,1989

    +   - Kurt Hornik,Approximation Capabilities of Multilayer Feedforward Networks,
    _Neural Networks_, 4(2), 251–257,1991'
  merge: -1
