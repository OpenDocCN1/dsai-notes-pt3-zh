- pgno: 544
  md: '# # Geometry of least squares


    +   • The geometrical interpretation of the least-squares solution


    \(\ln p(\mathbf{t}|\mathbf{w}, \beta) = \sum_{n=1}^N \ln \mathcal{N}(t_n|\mathbf{w}^T
    \phi(\mathbf{x}_n), \beta^{-1}) = \frac{N}{2} \ln \beta - \frac{N}{2} \ln(2\pi)
    - \beta E_D(\mathbf{w})\)


    \(E_D(\mathbf{w}) = \frac{1}{2} \sum_{n=1}^N \{t_n - \mathbf{w}^T \phi(\mathbf{x}_n)\}^2
    = \frac{1}{2}\|\mathbf{t} - \mathbf{\Phi}\mathbf{w}\|^2 \qquad \mathbf{w}_\text{ML}
    = \left(\mathbf{\Phi}^T \mathbf{\Phi}\right)^{-1} \mathbf{\Phi}^T \mathbf{t}\)


    \(\mathbf{\Phi} = \begin{pmatrix} \phi_0(\mathbf{x}_1) & \phi_1(\mathbf{x}_1)
    & \cdots & \phi_{M-1}(\mathbf{x}_1) \\ \phi_0(\mathbf{x}_2) & \phi_1(\mathbf{x}_2)
    & \cdots & \phi_{M-1}(\mathbf{x}_2) \\ \vdots & \vdots & \ddots & \vdots \\ \phi_0(\mathbf{x}_N)
    & \phi_1(\mathbf{x}_N) & \cdots & \phi_{M-1}(\mathbf{x}_N) \end{pmatrix} = \left(
    \boldsymbol{\varphi}_0 \quad \boldsymbol{\varphi}_1 \quad \cdots \quad \boldsymbol{\varphi}_{M-1}
    \right) \qquad \boldsymbol{\varphi}_j = \begin{pmatrix} \phi_j(\mathbf{x}_1) \\
    \phi_j(\mathbf{x}_2) \\ \vdots \\ \phi_j(\mathbf{x}_N) \end{pmatrix}\)


    \(\mathbf{w} = (w_0, \dots, w_{M-1})^T\)


    Geometrical interpretation of the least-squares solution, in an _N_-dimensional
    space whose axes are the values of _t_<sub>1</sub>_,...,t<sub>N</sub>_. The least-squares
    regression function is obtained by finding the orthogonal projection of the data
    vector **t** onto the subspace spanned by the basis functions \(\phi_j(\mathbf{x})\)
    in which each basis function is viewed as a vector \(\boldsymbol{\varphi}_j\)
    of length _N_ with elements \(\phi_j(\mathbf{x}_n)\).


