- pgno: 726
  md: '# # Claude Shannon 1916–2001


    After graduating from Michigan and MIT, Shannon joined the AT&T Bell Telephone
    laboratories in 1941. His paper ‘A Mathematical Theory of Communication’ published
    in the Bell System Technical Journal in 1948 laid the foundations for modern information
    the-


    ory. This paper introduced the word ‘bit’, and his concept that information could
    be sent as a stream of 1s and 0s paved the way for the communications revolution.
    It is said that von Neumann recommended to Shannon that he use the term entropy,
    not only because of its similarity to the quantity used in physics, but also because
    “nobody knows what entropy really is, so in any discussion you will always have
    an advantage”.


    Shannon entropy provides an absolute limit on the best possible average length
    of lossless encoding or compression of an information source.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_726_0.png)


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_726_1.png)'
  merge: -1
