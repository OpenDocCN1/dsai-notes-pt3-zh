    Figure 3 | Monte Carlo tree search in AlphaGo. a, Each simulation traverses the
    tree by selecting the edge with maximum action value Q, plus a bonus u(P) that
    depends on a stored prior probability P for that edge. b, The leaf node may be
    expanded; the new node is processed once by the policy network p_θ and the output
    probabilities are stored as prior probabilities P for each action. c, At the end
    of a simulation, the leaf node is evaluated in two ways: using the value network
    v_θ and by running a rollout to the end of the game with the fast rollout policy
    p_π, then computing the winner with function r. d, Action values Q are updated
    to track the mean value of all evaluations r(·) and v_θ(·) in the subtree below
    that action.


    Searching with policy and value networks in AlphaGo


    ```

    ```

    argmax_a(Q(s_b, a) + \frac{P(s, a)}{1 + N(s, a)})

    ```

