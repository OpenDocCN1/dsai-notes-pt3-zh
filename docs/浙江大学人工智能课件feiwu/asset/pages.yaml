- pgno: 678
  md: '# # Expectations and Covariances


    One of the most important operations involving probabilities is that of finding
    weighted averages of functions. The average value of some function _f_(_x_) under
    a probability distribution _p_(_x_) is called the _expectation_ of _f_(_x_) and
    will be denoted by E[_f_]. For a discrete distribution, it is given by


    ```

    \(\mathbb{E}[f]=\sum_x p(x)f(x)\) (1.33)

    ```


    so that the average is weighted by the relative probabilities of the different
    values of _x_. In the case of continuous variables, expectations are expressed
    in terms of an integration with respect to the corresponding probability density


    ```

    \(\mathbb{E}[f]=\int p(x)f(x)\mathrm{d}x.\) (1.34)

    ```


    In either case, if we are given a finite number _N_ of points drawn from the probability
    distribution or probability density, then the expectation can be approximated
    as a finite sum over these points


    ```

    \(\mathbb{E}[f]\simeq\frac{1}{N}\sum_{n=1}^Nf(x_n).\) (1.35)

    ```'
  merge: -1
  img_proc: true
- pgno: 679
  md: '# # Expectations and Covariances


    Sometimes we will be considering expectations of functions of several variables,
    in which case we can use a subscript to indicate which variable is being averaged
    over, so that for instance


    ```

    \(\mathbb{E}_x[f(x,y)]\)

    ```


    denotes the average of the function _f_(_x_,_y_) with respect to the distribution
    of _x_. Note that E_<sub>x</sub>_[_f_(_x_,_y_)] will be a function of _y_. We
    can also consider a _conditional expectation_ with respect to a conditional distribution,
    so that


    ```

    \(\mathbb{E}_x[f|y]=\sum_xp(x|y)f(x)\)

    ```


    with an analogous definition for continuous variables. The variance of _f_(_x_)
    is defined by


    ```

    \(\text{var}[f]=\mathbb{E}\left[\left(f(x)-\mathbb{E}[f(x)]\right)^2\right]\)

    ```


    and provides a measure of how much variability there is in _f_(_x_) around its
    mean value E[_f_(_x_)]. Expanding out the square, we see that the variance can
    also be written in terms of the expectations of _f_(_x_) and _f_(_x_)<sup>2</sup>


    ```

    \(\text{var}[f]=\mathbb{E}[f(x)^2]-\mathbb{E}[f(x)]^2.\)

    ```


    In particular, we can consider the variance of the variable _x_ itself, which
    is given by


    ```

    \(\text{var}[x]=\mathbb{E}[x^2]-\mathbb{E}[x]^2.\)

    ```


    For two random variables _x_ and _y_, the _covariance_ is defined by


    ```

    \(\begin{aligned} \text{cov}[x,y] &=\mathbb{E}_{x,y}\left[\left\{x-\mathbb{E}[x]\right\}\left\{y-\mathbb{E}[y]\right\}\right]
    \\ &=\mathbb{E}_{x,y}[xy]-\mathbb{E}[x]\mathbb{E}[y]

    \end{aligned}\)

    ```


    which expresses the extent to which _x_ and _y_ vary together. If _x_ and _y_
    are independent, then their covariance vanishes.


    # ## Properties of expected values


    ```

    \(\begin{array}{ c }

    \mathbb{E}[X+c]=\mathbb{E}[X]+c \\

    \mathbb{E}[X+Y]=\mathbb{E}[X]+\mathbb{E}[Y] \\

    \mathbb{E}[aX]=a\mathbb{E}[X]

    \end{array}\)

    ```


    ```

    \(\mathbb{E}[aX+bY+c]=a\mathbb{E}[X]+b\mathbb{E}[Y]+c\)

    ```


    ```

    \(\begin{array}{ c }

    \text{Var}(X)=\mathbb{E}\left[(X-\mathbb{E}[X])^2\right] \\

    =\mathbb{E}\left[X^2-2X\mathbb{E}[X]+(\mathbb{E}[X])^2\right] \\

    =\mathbb{E}\left[X^2\right]-2\mathbb{E}[X]\mathbb{E}[X]+(\mathbb{E}[X])^2 \\

    =\mathbb{E}\left[X^2\right]-(\mathbb{E}[X])^2

    \end{array}\)

    ```'
  merge: -1
  img_proc: true
- pgno: 680
  md: '# # Expectations and Covariances


    # ## the Variance of the Sum of Two Independent Random Variables is the Sum of
    the Variances


    Imagine two such random variables X and Y.


    | X   | probability   |

    |-----|---------------|

    | x₁  | p₁            |

    | x₂  | p₂            |

    | ... | ...           |

    | xₙ  | pₙ            |


    | Y   | probability   |

    |-----|---------------|

    | y₁  | q₁            |

    | y₂  | q₂            |

    | ... | ...           |

    | yₘ  | qₘ            |


    Since X and Y are independent random variables, the probability of X

    taking on the value xᵢ and Y the value yⱼ is simply the product pᵢqⱼ.


    Var(X + Y) = Σᵢⱼpᵢqⱼ(xᵢ + yⱼ - μₓ - μᵧ)²

    = Σᵢⱼpᵢqⱼ(xᵢ - μₓ)² + Σᵢⱼpᵢqⱼ(yⱼ - μᵧ)² + 2Σᵢⱼpᵢqⱼ(xᵢ - μₓ)(yⱼ - μᵧ)

    = (Σⱼqⱼ) Var(X) + (Σᵢpᵢ) Var(Y) + 2 (Σᵢpᵢ(xᵢ - μₓ)) (Σⱼqⱼ(yⱼ - μᵧ))

    = 1 · Var(X) + 1 · Var(Y) + 2 · 0 · 0

    = Var(X) + Var(Y).'
