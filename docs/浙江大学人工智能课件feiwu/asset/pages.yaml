    # ## About bias parameter \(w_0\):


    \(E_D(\mathbf{w}) = \frac{1}{2} \sum_{n=1}^N \{t_n - w_0 - \sum_{j=1}^{M-1} w_j
    \phi_j(\mathbf{x}_n)\}^2 \quad \Rightarrow \quad w_0 = \overline{t} - \sum_{j=1}^{M-1}
    w_j \overline{\phi_j}\)


    \(\overline{t} = \frac{1}{N} \sum_{n=1}^N t_n \quad \overline{\phi_j} = \frac{1}{N}
    \sum_{n=1}^N \phi_j(\mathbf{x}_n)\)


    > Thus the bias \(w_0\) compensates for the difference between the averages (over
    the training set) of the target values and the weighted sum of the averages of
    the basis function values.


