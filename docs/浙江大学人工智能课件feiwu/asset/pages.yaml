- pgno: 1305
  md: '# # Recurrent Neural Network


    We can process a sequence of vectors **x** by applying a **recurrence formula**
    at every time step:


    \( h_t = f_W(h_{t-1}, x_t) \)


    new state


    some function with parameters W


    old state


    input vector at some time step


    Notice: the same function and the same set of parameters are used at every time
    step.


