- pgno: 82
  md: '# # Monte-Carlo Tree Search


    +   - Monte-Carlo tree search (MCTS) combines Monte-Carlo simulation with game
    tree search. It proceeds by selectively growing a game tree. As in minimax search,
    each node in the tree corresponds to a single state of the game. However, unlike
    minimax search, the values of nodes (including both leaf nodes and interior nodes)
    are now estimated by Monte-Carlo simulation.


    +   - In the previous discussion of Monte-Carlo simulation, we assumed that a
    single, fixed policy was used during simulation. One of the key ideas of MCTS
    is to gradually adapt and improve this simulation policy. As more simulations
    are run, the game tree grows larger and the Monte-Carlo values at the nodes become
    more accurate, providing a great deal of useful information that can be used to
    bias the policy towards selecting actions which lead to child nodes with high
    values.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Monte-Carlo Tree Search


    +   - On average, this bias improves the policy, resulting in simulations that
    are closer to optimal. The stronger the bias, the more selective the game tree
    will be, resulting in a strongly asymmetric tree that expands the highest value
    nodes most deeply. Nevertheless, the game tree will only typically contain a small
    subtree of the overall game. At some point, the simulation will reach a state
    that is not represented in the tree.


    +   - At this point, the algorithm reverts to a single, fixed policy, which is
    followed by both players until a terminal state is reached, just like Monte-Carlo
    simulation. This part of the simulation is known as a roll-out.'
