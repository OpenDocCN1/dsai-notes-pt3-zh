  md: '# # Explicit Memory:


    Memory networks: include a set of memory cells that can be accessed via an addressing
    mechanism. Memory networks originally required a supervision signal instructing
    them how to use their memory cells.


    Neural Turing machine: able to learn to read from and write arbitrary content
    to memory cells without explicit supervision about which actions to undertake,
    and allowed end-to-end training without this supervision signal, via the use of
    a content-based soft attention mechanism.


