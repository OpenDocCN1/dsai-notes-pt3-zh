  md: '# # Feed-forward Neural Network


    +   - Neural Networks are modeled as collections of neurons that are connected
    in an acyclic graph (**layer-wise organization**).


    +   - In other words, the outputs of some neurons can become inputs to other neurons.
    Cycles are not allowed since that would imply an infinite loop in the forward
    pass of a network.


    +   - the most common layer type is the **fully-connected layer** in which neurons
    between two adjacent layers are fully pairwise connected, but neurons within a
    single layer share no connections.


