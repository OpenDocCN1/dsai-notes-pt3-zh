- pgno: 875
  md: "# # Properties of breadth-first search\n\n+   - Completeness: Yes, if \\( b\
    \ \\) is finite  \n+     (\\( b \\) is number of branches, \\( d \\) is the depth)\n\
    \n+   - Time complexity: \\( O(b^d) \\), i.e., exponential in \\( d \\)\n\n+ \
    \  - Space complexity: \\( O(b^d) \\), keeps every node in memory\n\n+   - Optimality:\
    \ Yes, if cost = 1 per step; not optimal in general"
  merge: -1
  img_proc: true
- pgno: 876
  md: '# # Uniform-cost search


    +   - When all step costs are equal, breadth-first search is optimal because it
    always expands the shallowest unexpanded node. By a simple extension, we can find
    an algorithm that is optimal with any step-cost function.

    +   - Instead of expanding the shallowest node, uniform-cost search expands the
    node $n$ with the lowest path cost $g(n)$. This is done by storing the frontier
    as a priority queue ordered by $g(n)$.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_876_0.png)


    **Figure 3.15** Part of the Romania state space, selected to illustrate uniform-cost
    search.'
  merge: -1
  img_proc: true
- pgno: 877
  md: "```\nfunction UNIFORM-COST-SEARCH(problem) returns a solution, or failure\n\
    \  node ← a node with STATE = problem.INITIAL-STATE, PATH-COST = 0\n  frontier\
    \ ← a priority queue ordered by PATH-COST, with node as the only element\n  explored\
    \ ← an empty set\n  loop do\n    if EMPTY?(frontier) then return failure\n   \
    \ node ← POP(frontier) /* chooses the lowest-cost node in frontier */\n    if\
    \ problem.GOAL-TEST(node.STATE) then return SOLUTION(node)\n    add node.STATE\
    \ to explored\n    for each action in problem.ACTIONS(node.STATE) do\n      child\
    \ ← CHILD-NODE(problem, node, action)\n      if child.STATE is not in explored\
    \ or frontier then\n        frontier ← INSERT(child, frontier)\n      else if\
    \ child.STATE is in frontier with higher PATH-COST then\n        replace that\
    \ frontier node with child\n```\n\nFigure 3.14 Uniform-cost search on a graph.\
    \ The algorithm is identical to the general\ngraph search algorithm in Figure\
    \ 3.7, except for the use of a priority queue and the addition\nof an extra check\
    \ in case a shorter path to a frontier state is discovered. The data structure\
    \ for\nfrontier needs to support efficient membership testing, so it should combine\
    \ the capabilities\nof a priority queue and a hash table."
