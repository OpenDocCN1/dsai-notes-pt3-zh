  md: '# Multivariate Gaussian Distribution


    $\Delta^2=(x-\mu)^T\Sigma^{-1}(x-\mu)=(x-\mu)^TU^T\Lambda^{-1}U(x-\mu)=(U(x-\mu))^T\Lambda^{-1}(U(x-\mu))=y^T\Lambda^{-1}y$


    The matrix $\Sigma$ can be taken to be symmetric, without loss of generality.


    $M$ is symmetric, so that $M^T=M$. $MM^{-1}=I$\n\n$(M^{-1})^TM^T=I^T=I \Rightarrow
    (M^{-1})^TM=I \Rightarrow (M^{-1})^T=M^{-1}$\n\nso $M^{-1}$ is also a symmetric
    matrix.


    the eigenvector equation for the covariance matrix


    $\Sigma u_i=\lambda_i u_i \quad \text{where } i=1,\ldots,D$


    $u_i^Tu_j=I_{ij},\quad I_{ij}=\begin{cases}1,&\text{if }i=j\\0,&\text{otherwise}\end{cases},\quad
    UU^T=I$


    $\Sigma=\sum_{i=1}^{D}\lambda_i u_i u_i^T=U\Lambda U^T \Rightarrow U^T\Sigma U=U^TU\Lambda
    U^TU=\Lambda \quad U\text{ is orthonormal},\ U^{-1}=U^T$


    $\Sigma^{-1}=(U\Lambda U^T)^{-1}=(U^T)^{-1}\Lambda^{-1}U^{-1}=U\Lambda^{-1}U^T=\sum_{i=1}^{D}\frac{1}{\lambda_i}u_i
    u_i^T$


    $\Delta^2=(x-\mu)^T\Sigma^{-1}(x-\mu) \xrightarrow{y_i=u_i^T(x-\mu)} \Delta^2=\sum_{i=1}^{D}\frac{y_i^2}{\lambda_i}
    \xrightarrow{y=U(x-\mu)} \Delta^2=y^T\Lambda^{-1}y$'
