  md: '# # Three classification approaches


    +   - Discriminant function:


    +   - Use discriminant functions directly, and do not compute probabilities


    Given discriminant functions \( f_1(\mathbf{x}), \dots, f_K(\mathbf{x}) \)

    Classify \(\mathbf{x}\) as class \( C_k \), **iff** \( f_k(\mathbf{x}) > f_j(\mathbf{x}),
    \forall j \neq k \)


    +   - **Least-squares approach**: making the model predictions as close as possible
    to a set of target values


    +   - **Fisher’s linear discriminant**: maximum class separation in the output
    space


    +   - **The perceptron algorithm of Rosenblatt**: generalized linear model'
