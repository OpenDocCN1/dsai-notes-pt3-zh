- pgno: 567
  md: '# # Two classes


    Suppose that we run a learning algorithm on a data set and it outputs a linear
    threshold function. Intuitively speaking, we can probably be relatively confident
    that points that are far from the decision boundary are labeled correctly, while
    we may be less confident about points that are very close to the decision boundary,
    since a small change to the boundary would result in different labels for these
    points. It would be nice if we could find a decision boundary such that no points
    are too close. We formalize this idea by introducing the notion of a margin.


    **Definition 1.** _Given a linear separator represented by its normal vector_
    **w**_, the margin_ \(\gamma\) _of a point_ **x** _with label_ \(y \in \{-1, +1\}\)
    _is the distance between_ **x** _and the decision boundary. That is,_


    \(\gamma = y \left( \frac{\mathbf{w}}{\|\mathbf{w}\|} \cdot \mathbf{x} \right).\)


    Let’s verify that this expression does indeed give the distance between **x**
    and the decision boundary. If **x** lies on the decision boundary, then **x**
    must be orthogonal to **w**, and so we get \(\gamma = 0\) as desired.


    Suppose **x** does not lie on the boundary. Let **z** be the projection of **x**
    onto the decision boundary, i.e., **z** is the closest point to **x** that lies
    on the boundary. Note that **x**<sub>1</sub>−**z**<sub>1</sub> is parallel to
    **w**. If _y_=+1, we have that


    \(\mathbf{x} - \mathbf{z} = \gamma \frac{\mathbf{w}}{\|\mathbf{w}\|}\)

    \(\mathbf{z} = \mathbf{x} - \gamma \frac{\mathbf{w}}{\|\mathbf{w}\|}\)

    \(\mathbf{z} \cdot \mathbf{w} = \mathbf{x} \cdot \mathbf{w} - \gamma \frac{\mathbf{w}
    \cdot \mathbf{w}}{\|\mathbf{w}\|}\)

    \(0 = \mathbf{x} \cdot \mathbf{w} - \gamma \|\mathbf{w}\|\)

    \(\gamma = \mathbf{x} \cdot \frac{\mathbf{w}}{\|\mathbf{w}\|} = y \left( \mathbf{x}
    \cdot \frac{\mathbf{w}}{\|\mathbf{w}\|} \right)\)


    If _y_=-1, the derivation is similar, except we start with


    \(\mathbf{x} - \mathbf{z} = -\gamma \frac{\mathbf{w}}{\|\mathbf{w}\|}\)


    which leads us to


    \(\gamma = -\mathbf{x} \cdot \frac{\mathbf{w}}{\|\mathbf{w}\|} = y \left( \mathbf{x}
    \cdot \frac{\mathbf{w}}{\|\mathbf{w}\|} \right).\)'
  merge: -1
