  md: '# # Greedy best-first search


    +   - Greedy best-first tree search is also incomplete even in a finite state
    space, much like depth-first search.


    Consider the problem of getting from Iasi to Fagaras. The heuristic suggests that
    Neamt be expanded first because it is closest to Fagaras, but it is a dead end.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_899_0.png)


    The solution is to go first to Vaslui—a step that is actually farther from the
    goal according to the heuristic—and then to continue to Urziceni, Bucharest, and
    Fagaras. The algorithm will never find this solution, however, because expanding
    Neamt puts Iasi back into the frontier, Iasi is closer to Fagaras than Vaslui
    is, and so Iasi will be expanded again, leading to an infinite loop.'
