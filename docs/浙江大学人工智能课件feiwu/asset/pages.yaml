  md: "# Depth-limited search\n\n+   - Depth-first search can be viewed as a special\
    \ case of **depth-limited search (DLS)** with **limit = ∞**\n\n```\nfunction DEPTH-LIMITED-SEARCH(problem,\
    \ limit) returns a solution, or failure/cutoff\n    return RECURSIVE-DLS(MAKE-NODE(problem.INITIAL-STATE),\
    \ problem, limit)\n\nfunction RECURSIVE-DLS(node, problem, limit) returns a solution,\
    \ or failure/cutoff\n    if problem.GOAL-TEST(node.STATE) then return SOLUTION(node)\n\
    \    else if limit = 0 then return cutoff\n    else\n        cutoff_occurred?\
    \ ← false\n        for each action in problem.ACTIONS(node.STATE) do\n       \
    \     child ← CHILD-NODE(problem, node, action)\n            result ← RECURSIVE-DLS(child,\
    \ problem, limit − 1)\n            if result = cutoff then cutoff_occurred? ←\
    \ true\n            else if result ≠ failure then return result\n        if cutoff_occurred?\
    \ then return cutoff else return failure\n```\n\n**Figure 3.17** A recursive implementation\
    \ of depth-limited tree search."
