- pgno: 1367
  md: '# # LSTM


    # ## Solution: long-short term memory (LSTM)


    +   - rather each node being just a simple RNN cell, make each node a more complex
    unit with gates controlling what information is passed through.

    +   - Instead of a unit that simply applies an element-wise nonlinearity to the
    affine transformation of inputs and recurrent units, LSTM recurrent networks have
    “LSTM cells” that have an internal recurrence (a self-loop), in addition to the
    outer recurrence of the RNN.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1367_0.png)'
  merge: -1
  img_proc: true
- pgno: 1368
  md: '# # LSTM


    Figure 10.16: Block diagram of the LSTM recurrent network “cell.” Cells are connected
    recurrently to each other, replacing the usual hidden units of ordinary recurrent
    networks. An input feature is computed with a regular artificial neuron unit.
    Its value can be accumulated into the state if the sigmoidal input gate allows
    it. The state unit has a linear self-loop whose weight is controlled by the forget
    gate. The output of the cell can be shut off by the output gate. All the gating
    units have a sigmoid nonlinearity, while the input unit can have any squashing
    nonlinearity. The state unit can also be used as an extra input to the gating
    units. The black square indicates a delay of a single time step.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1368_0.png)


    ```

    \(f_i^{(t)}=\sigma\left(b_i^f+\sum_jU_{i,j}^fx_j^{(t)}+\sum_jW_{i,j}^fh_j^{(t-1)}\right)\)

    \(s_i^{(t)}=f_i^{(t)}s_i^{(t-1)}+g_i^{(t)}\sigma\left(b_i+\sum_jU_{i,j}x_j^{(t)}+\sum_jW_{i,j}h_j^{(t-1)}\right)\)

    \(g_i^{(t)}=\sigma\left(b_i^g+\sum_jU_{i,j}^gx_j^{(t)}+\sum_jW_{i,j}^gh_j^{(t-1)}\right)\)

    \(h_i^{(t)}=\mathrm{tanh}\left(s_i^{(t)}\right)q_i^{(t)}\)

    \(q_i^{(t)}=\sigma\left(b_i^o+\sum_jU_{i,j}^ox_j^{(t)}+\sum_jW_{i,j}^oh_j^{(t-1)}\right)\)

    ```'
  merge: -1
  img_proc: true
- pgno: 1369
  md: '# LSTM


    # **why** do LSTMs help?


    +   1. forget gate allows information to **pass through unchanged**

    +   2. **cell state is separate** from what''s outputted

    +   3. $s^t$ depends on $s^{t-1}$ through **addition**!

    +      → derivatives don''t expand into a long product!


    $s_t = \tanh(Wx_t + Us_{t-1})$


    $= \tanh\left([W\quad U]\begin{bmatrix}x_t\\s_{t-1}\end{bmatrix}\right)$


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1369_0.png)


    $s_i^{(t)} = f_i^{(t)}s_i^{(t-1)} + g_i^{(t)}\sigma\left(b_i + \sum_j U_{i,j}x_j^{(t)}
    + \sum_j W_{i,j}h_j^{(t-1)}\right)$'
  merge: -1
  img_proc: true
- pgno: 1370
  md: '# Vanilla RNN vs LSTM


    # Vanilla RNN Gradient Flow


    Bengio et al, “Learning long-term dependencies with gradient descent is difficult”,
    IEEE Transactions on Neural Networks, 1994

    Pascanu et al., “On the difficulty of training recurrent neural networks”, ICML
    2013


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1370_0.png)


    $$h_t = \tanh(W_{hh}h_{t-1}+W_{xh}x_t)$$

    $$= \tanh\left(\begin{pmatrix}W_{hh} & W_{hx}\end{pmatrix}\begin{pmatrix}h_{t-1}\\x_t\end{pmatrix}\right)$$

    $$= \tanh\left(W\begin{pmatrix}h_{t-1}\\x_t\end{pmatrix}\right)$$


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1370_1.png)


    $$a^{(t)} = b + Wh^{(t-1)} + Ux^{(t)}$$

    $$h^{(t)} = \tanh(a^{(t)})$$

    $$o^{(t)} = c + Vh^{(t)}$$

    $$y^{(t)} = \operatorname{softmax}(o^{(t)})$$'
  merge: -1
  img_proc: true
