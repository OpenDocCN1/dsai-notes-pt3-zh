- pgno: 681
  md: '# # Expectations and Covariances


    In the case of two vectors of random variables x and y, the covariance is a matrix


    \(\begin{aligned} \text{cov}[\mathrm{x}, \mathrm{y}] & = \mathbb{E}_{\mathrm{x},
    \mathrm{y}}\left\{[\mathrm{x}-\mathbb{E}\{\mathrm{x}]\}\{\mathrm{y}^\mathrm{T}-\mathbb{E}[\mathrm{y}^\mathrm{T}]\}\right\]
    \\ & = \mathbb{E}_{\mathrm{x}, \mathrm{y}}[\mathrm{x} \mathrm{y}^\mathrm{T}]-\mathbb{E}[\mathrm{x}]\mathbb{E}[\mathrm{y}^\mathrm{T}].
    \end{aligned}\) (1.42)


    If we consider the covariance of the components of a vector x with each other,
    then we use a slightly simpler notation \(\text{cov}[\mathrm{x}] \equiv \text{cov}[\mathrm{x},
    \mathrm{x}]\).'
