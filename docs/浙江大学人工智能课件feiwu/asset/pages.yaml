  md: '# Properties of α–β


    +   - Alpha–beta pruning is a search algorithm that seeks to decrease the number
    of nodes that are evaluated by the minimax algorithm in its search tree. It is
    an adversarial search algorithm used commonly for machine playing of two-player
    games (Tic-tac-toe, Chess, Go, etc.).


    +   - The benefit of alpha–beta pruning lies in the fact that branches of the
    search tree can be eliminated. This way, the search time can be limited to the
    ''more promising'' subtree, and a deeper search can be performed in the same time.'
  merge: -1
