- pgno: 616
  md: '# # Operations and properties


    +   • Quadratic forms


    Given a square matrix \( A \in \mathbb{R}^{n \times n} \) and a vector \( x \in
    \mathbb{R}^n \), the scalar value \( x^T A x \) is called a **_quadratic form_**.
    Written explicitly, we see that


    \( x^T A x = \sum_{i=1}^n x_i(Ax)_i = \sum_{i=1}^n x_i \left( \sum_{j=1}^n A_{ij}
    x_j \right) = \sum_{i=1}^n \sum_{j=1}^n A_{ij} x_i x_j . \)


    Note that,


    \( x^T A x = (x^T A x)^T = x^T A^T x = x^T \left( \frac{1}{2} A + \frac{1}{2}
    A^T \right) x ,\)


    +   • _Let_ \( A = \Sigma^{-1} \)_, if A is not symmetric, let_ \( A^* = (A +
    A^T)/2 \)_, then it’s symmetric and_ \( (x - \mu)^T A (x - \mu) = (x - \mu)^T
    A^* (x - \mu) \) _._


    M is symmetric, so that \( \mathbf{M}^T = \mathbf{M} \). \( \mathbf{M} \mathbf{M}^{-1}
    = \mathbf{I} \)


    \( (\mathbf{M}^{-1})^T \mathbf{M}^T = \mathbf{I}^T = \mathbf{I} \Rightarrow (\mathbf{M}^{-1})^T
    \mathbf{M} = \mathbf{I} \Rightarrow (\mathbf{M}^{-1})^T = \mathbf{M}^{-1} \)


    so \( \mathbf{M}^{-1} \) is also a symmetric matrix.'
