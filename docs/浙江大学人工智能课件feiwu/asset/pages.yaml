- pgno: 89
  md: '# Monte-Carlo Tree Search


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_89_0.png)


    Fig. 2. One iteration of the general MCTS approach


    Figure 2 shows one iteration of the basic MCTS algorithm. Starting at the root
    node t₀, child nodes are recursively selected according to some utility function
    until a node tₙ is reached that either describes a terminal state or is not fully
    expanded (note that this is not necessarily a leaf node of the tree). An unvisited
    action a from this state s is selected and a new leaf node tₗ is added to the
    tree, which describes the state s′ reached from applying action a to state s.
    This completes the tree policy component for this iteration.


    A simulation is then run from the newly expanded leaf node tₗ to produce a reward
    value Δ, which is then backpropagated up the sequence of nodes selected for this
    iteration to update the node statistics; each node’s visit count is incremented
    and its average reward or Q value updated according to Δ. The reward value Δ may
    be a discrete (win/draw/loss) result or continuous reward value for simpler domains,
    or a vector of reward values relative to each agent p for more complex multi-agent
    domains.


    As soon as the search is interrupted or the computation budget is reached, the
    search terminates and an action a of the root node t₀ is selected by some mechanism.'
