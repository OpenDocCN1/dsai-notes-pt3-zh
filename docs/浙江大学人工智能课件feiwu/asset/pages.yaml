  md: '![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1190_0.png)


    $$\mathrm{Error}=\sum_{i=1}^{2}\frac{1}{2}(z_i-o_i)^2$$


    $z_i$ is the ground truth label'
