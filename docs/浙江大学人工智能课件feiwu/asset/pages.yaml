- pgno: 444
  md: "# # The general EM algorithm\n\n+   - The log likelihood of a discrete latent\
    \ variables model:\n+   \n+   \\(\\ln p(X|\\theta) = \\ln \\left\\{ \\sum_Z p(X,\
    \ Z|\\theta) \\right\\}\\)\n\n+   - The goal of EM algorithm is to find maximum\
    \ likelihood solution for models having latent variables.\n\n+   - For the complete\
    \ data set {X, Z}, the log likelihood function:\n+   \n+   \\(\\ln p(X|\\theta)\
    \ \\longrightarrow \\ln p(X, Z|\\theta)\\)\n\n+   - For the incomplete data set\
    \ {X}, we adopt the following steps to find maximum likelihood solution:\n+  \
    \ \n+   \\(\\theta^{old} \\longleftarrow \\theta^{new} = \\arg \\max_\\theta Q(\\\
    theta, \\theta^{old})\\)\n+   \n+   \\(\\downarrow\\)\n+   \n+   \\(p(Z|X, \\\
    theta^{old}) \\longrightarrow E_Z[\\ln p(X, Z|\\theta)] = \\sum_Z p(Z|X, \\theta^{old})\
    \ \\ln p(X, Z|\\theta) = Q(\\theta, \\theta^{old})\\)"
  merge: -1
  img_proc: true
- pgno: 445
  md: "# The general EM algorithm\n\n# The General EM Algorithm\n\nGiven a joint distribution\
    \ $p(X,Z|\\theta)$ over observed variables $X$ and latent variables $Z$, governed\
    \ by parameters $\\theta$, the goal is to maximize the likelihood function $p(X|\\\
    theta)$ with respect to $\\theta$.\n\n+   1. Choose an initial setting for the\
    \ parameters $\\theta^{\\mathrm{old}}$.\n+   \n+   2. **E step** Evaluate $p(Z|X,\\\
    theta^{\\mathrm{old}})$.\n+   \n+   3. **M step** Evaluate $\\theta^{\\mathrm{new}}$\
    \ given by\n+      $$\\theta^{\\mathrm{new}} = \\arg\\max_{\\theta} Q(\\theta,\\\
    theta^{\\mathrm{old}})$$\n+      where\n+      $$Q(\\theta,\\theta^{\\mathrm{old}})=\\\
    sum_Z p(Z|X,\\theta^{\\mathrm{old}})\\ln p(X,Z|\\theta).$$\n+   \n+   4. Check\
    \ for convergence of either the log likelihood or the parameter values. If the\
    \ convergence criterion is not satisfied, then let\n+      $$\\theta^{\\mathrm{old}}\
    \ \\leftarrow \\theta^{\\mathrm{new}}$$\n+      and return to step 2.\n\n![](img/c69bfdf1f6addd09d49cae0440fcc5c7_445_0.png)\n\
    \n> EM algorithm can be used to find MAP solution"
  merge: -1
  img_proc: true
