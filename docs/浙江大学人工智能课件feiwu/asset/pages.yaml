  md: '# # K-Nearest Neighbor Classifier


    +   - **Training Phase:** storing the d-Dim feature vectors and class labels of
    the training samples.

    +   - **Testing Phase:** An object is classified by a majority vote of its neighbors,
    with the object being assigned to the class most common among its k nearest neighbors
    (k = 1,3,5,…).

    +   - **Drawback:** it is sensitive to the local structure of the data. Examples
    of a more frequent class tend to dominate the prediction of the new example


