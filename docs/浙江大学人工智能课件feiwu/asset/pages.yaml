  md: '# # Multi-armed bandit


    For \( i = 1, \dots, K \) we denote by \( \mu_i \) the mean of \( \nu_i \) (mean
    reward of arm \( i \)). Let


    \( \mu^* = \max_{i=1,\dots,K} \mu_i \quad \text{and} \quad i^* \in \operatorname{argmax}_{i=1,\dots,K}
    \mu_i. \)


    In the stochastic setting, it is easy to see that the pseudo-regret can be written
    as


    \( \overline{R}_n = n\mu^* - \sum_{t=1}^n \mathbb{E}[\mu_{I_t}]. \) (1.4)


    The analysis of the stochastic bandit model was pioneered in the seminal paper
    of Lai and Robbins [125], who introduced the technique of upper confidence bounds
    for the asymptotic analysis of regret.


    [125] T. L. Lai and H. Robbins, Asymptotically efficient adaptive allocation rules,
    Advances in Applied Mathematics, vol. 6, pp. 4–22, 1985.'
