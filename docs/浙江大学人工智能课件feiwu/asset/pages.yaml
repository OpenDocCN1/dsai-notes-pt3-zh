  md: '**ReLU.** The Rectified Linear Unit has become very popular in the last few
    years. It computes the function $f(x)=\max(0,x)$. In other words, the activation
    is simply thresholded at zero.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_1110_0.png)


    Rectified Linear Unit (ReLU) activation function, which is zero when x is less
    than 0 and then linear with slope 1 when x is greater than 0'
