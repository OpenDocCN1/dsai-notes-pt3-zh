- pgno: 126
  md: "# Comparisons with other algorithms\n\n+   - When faced with a problem, the\
    \ a priori choice between MCTS and minimax may be difficult. If the game tree\
    \ is of nontrivial size and no reliable heuristic exists for the game of interest,\
    \ minimax is unsuitable but MCTS is applicable.\n+   \n+   - If domain-specific\
    \ knowledge is readily available, on the other hand, both algorithms may be viable\
    \ approaches.\n+   \n+   - MCTS approaches to games such as Chess are not as successful\
    \ as for games such as Go. They consider a class of synthetic spaces in which\
    \ UCT significantly outperforms minimax. In particular, the model produces bounded\
    \ trees where there is exactly one optimal action per state; sub-optimal choices\
    \ are penalized with a fixed additive cost. The systematic construction of the\
    \ tree ensures that the true minimax values are known. In this domain, UCT clearly\
    \ outperforms minimax and the gap in performance increases with tree depth."
  merge: -1
  img_proc: true
- pgno: 127
  md: '# # Comparisons with other algorithms


    UCT performs poorly in domains with many trap states (states that lead to losses
    within a small number of moves), whereas iterative deepening minimax performs
    relatively well. Trap states are common in Chess but relatively uncommon in Go,
    which may go some way towards explaining the algorithms’ relative performance
    in those games.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# # Terminology


    The terms MCTS and UCT are used in a variety of ways in the literature, sometimes
    inconsistently, potentially leading to confusion regarding the specifics of the
    algorithm referred to.


    +   - Flat Monte Carlo: A Monte Carlo method with uniform move selection and no
    tree growth.

    +   - Flat UCB: A Monte Carlo method with bandit-based move selection but no tree
    growth.

    +   - MCTS: A Monte Carlo method that builds a tree to inform its policy online.

    +   - UCT: MCTS with any UCB tree selection policy.

    +   - Plain UCT: MCTS with UCB1 as proposed by Kocsis and Szepesvari


    L. Kocsis and C. Szepesvari, Bandit based Monte-Carlo Planning, **ECML**, 2006:282–293'
  merge: -1
  img_proc: true
