    \ = \\sum_{n=1}^N \\sum_{k=1}^K z_{nk} \\left\\{\\ln \\pi_k + \\ln \\mathcal{N}(\\\
    mathbf{x}_n|\\mu_k, \\Sigma_k) \\right\\}\\)\n+   \n+   \\(\\mathbb{E}_\\mathbf{Z}[\\\
    ln p(\\mathbf{X}, \\mathbf{Z}|\\mu, \\Sigma, \\pi)] = \\sum_{n=1}^N \\sum_{k=1}^K\
    \ \\gamma(z_{nk}) \\left\\{\\ln \\pi_k + \\ln \\mathcal{N}(\\mathbf{x}_n|\\mu_k,\
    \ \\Sigma_k) \\right\\}\\)\n\n\\(\\mu^\\text{old}, \\Sigma^\\text{old} \\text{and\
    \ } \\pi^\\text{old} \\Longrightarrow \\gamma(z_{nk}) \\Longrightarrow \\arg \\\
    max_{\\mu, \\Sigma, \\pi} \\mathbb{E}_\\mathbf{Z}[\\ln p(\\mathbf{X}, \\mathbf{Z}|\\\
    mu, \\Sigma, \\pi)] \\Longrightarrow \\mu^\\text{new}, \\Sigma^\\text{new} \\\
    text{and } \\pi^\\text{new}\\)"
