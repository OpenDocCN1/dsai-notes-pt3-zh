  md: '# Heuristic Functions


    # The effect of heuristic accuracy on performance


    To test the heuristic functions $h_1$ and $h_2$, we generated 1200 random problems
    with solution lengths from 2 to 24 (100 for each enumerated) and solved them with
    iterative deepening search and with A* tree search using both $h_1$ and $h_2$.
    Figure 3.29 gives the average number of nodes generated by each strategy and the
    effective branching factor. The results suggest that $h_2$ is better than $h_1$,
    and is far better than using iterative deepening search. Even for small problems
    with $d=12$, A* with $h_2$ is 50,000 times more efficient than uninformed iterative
    deepening search.


    | $d$ | IDS | A*($h_1$) | A*($h_2$) | IDS | A*($h_1$) | A*($h_2$) |

    |---:|---:|---:|---:|---:|---:|---:|

    | 2 | 10 | 6 | 6 | 2.45 | 1.79 | 1.79 |

    | 4 | 112 | 13 | 12 | 2.87 | 1.48 | 1.45 |

    | 6 | 680 | 20 | 18 | 2.73 | 1.34 | 1.30 |

    | 8 | 6384 | 39 | 25 | 2.80 | 1.33 | 1.24 |

    | 10 | 47127 | 93 | 39 | 2.79 | 1.38 | 1.22 |

    | 12 | 3644035 | 227 | 73 | 2.78 | 1.42 | 1.24 |

    | 14 | — | 539 | 113 | — | 1.44 | 1.23 |

    | 16 | — | 1301 | 211 | — | 1.45 | 1.25 |

    | 18 | — | 3056 | 363 | — | 1.46 | 1.26 |

    | 20 | — | 7276 | 676 | — | 1.47 | 1.27 |

    | 22 | — | 18094 | 1219 | — | 1.48 | 1.28 |

    | 24 | — | 39135 | 1641 | — | 1.48 | 1.26 |


    **Search Cost (nodes generated)** and **Effective Branching Factor**


    **Figure 3.29** Comparison of the search costs and effective branching factors
    for Iterative-Deepening-Search and A* algorithms with $h_1$, $h_2$. Data are averaged
    over 100 instances of the 8-puzzle for each of various solution lengths $d$.


    One might ask whether $h_2$ is always better than $h_1$. The answer is “Essentially,
    yes.” It is easy to see from the definitions of the two heuristics that, for any
    node $n$, $h_2(n) \ge h_1(n)$. We thus say that $h_2$ **dominates** $h_1$. Domination
    translates directly into efficiency. A* using $h_2$ will never expand more nodes
    than A* using $h_1$ (except possibly for some nodes with $f(n)=C^*$). The argument
    is simple. Recall the observation on page 97 that every node with $f(n)<C^*$ will
    surely be expanded. This is the same as saying that every node with $h(n)<C^*-g(n)$
    will surely be expanded. But because $h_2$ is at least as big as $h_1$ for all
    nodes, every node that is surely expanded by A* search with $h_2$ will also surely
    be expanded with $h_1$, and $h_1$ might cause other nodes to be expanded as well.
    Hence, it is generally better to use a heuristic function with higher values,
    provided it is consistent and that the computation time for the heuristic is not
    too long.'
