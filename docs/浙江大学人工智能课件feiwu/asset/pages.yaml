- pgno: 167
  md: '# # Gradient Descent


    Suppose the loss function f(x) is a continuous differentiable multi-variant function,
    its Taylor expansion is:


    \(f(x + \Delta x) = f(x) + f''(x)\Delta x + \frac{1}{2}f''''(x)(\Delta x)^2 +
    \cdots + \frac{1}{n!}f^{(n)}(x)(\Delta x)^n\)


    We have


    \(f(x + \Delta x) - f(x) \approx (\nabla f(x))^T \Delta x\)


    We attempt to minimize the loss function f(x), then \((\nabla f(x))^T \Delta x
    < 0\)


    Since \((\nabla f(x))^T \Delta x = \|\nabla f(x)\|\|\Delta x\| \cos \theta\),
    to find a local minimum of a function using gradient descent, one takes steps
    proportional to the **negative** of the gradient of the loss function (i.e., \(\theta
    = \pi\)) at the current point.


    The reduced value between in terms of \(f(x + \Delta x) - f(x)\) is: \(\|\nabla
    f(x)\|\|\Delta x\| \cos \theta = -\alpha \|\nabla f(x)\|\).


    As a result, the loss function must be reduced toward to the **negative** of the
    gradient of the loss function.


    For smooth functions, both minimum/maximum values and relative extreme values
    can occur only where \(\nabla f(x) = 0\). However, zero slope while necessary,
    is not sufficient


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_167_0.png)'
  merge: -1
  img_proc: true
