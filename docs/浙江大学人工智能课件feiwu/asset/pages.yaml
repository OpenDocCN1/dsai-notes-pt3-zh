    logistic sigmoid function


    \(p(C_1|\phi) = y(\phi) = \sigma \left( \mathbf{w}^T \phi \right) \qquad p(C_2|\phi)
    = 1 - p(C_1|\phi) \qquad \sigma(a) = \frac{1}{1 + \exp(-a)}\)


    +   - For a data set \(\{\phi_n, t_n\}\), where \(t_n \in \{0, 1\}\) and \(\phi_n
    = \phi(\mathbf{x}_n)\), \(n=1, \dots, N\), the likelihood function can be written


    \(p(\mathbf{t}|\mathbf{w}) = \prod_{n=1}^N y_n^{t_n} \{1 - y_n\}^{1-t_n} \quad
    \text{where } \mathbf{t} = (t_1, \dots, t_N)^T \text{ and } y_n = p(C_1|\phi_n).\)


    +   - Cross-entropy error function:


    \(E(\mathbf{w}) = - \ln p(\mathbf{t}|\mathbf{w}) = - \sum_{n=1}^N \{t_n \ln y_n
    + (1 - t_n) \ln(1 - y_n)\}\)


    \(y_n = \sigma(a_n)\)

    \(a_n = \mathbf{w}^T \phi_n\)

    \(\frac{d\sigma}{da} = \sigma(1 - \sigma)\)


    \(\left\{ \frac{\partial E}{\partial y_n} = \frac{1 - t_n}{1 - y_n} - \frac{t_n}{y_n}
    = \frac{y_n(1 - t_n) - t_n(1 - y_n)}{y_n(1 - y_n)} = \frac{y_n - t_n}{y_n(1 -
    y_n)} \right.\)

    \(\left\{ \frac{\partial y_n}{\partial a_n} = \frac{\partial \sigma(a_n)}{\partial
    a_n} = \sigma(a_n)(1 - \sigma(a_n)) = y_n(1 - y_n) \right.\)


    No closed-form solution


    \(\nabla E(\mathbf{w}) = \sum_{n=1}^N \frac{\partial E}{\partial y_n} \frac{\partial
    y_n}{\partial a_n} \nabla a_n = \sum_{n=1}^N (y_n - t_n) \phi_n = \sum_{n=1}^N
