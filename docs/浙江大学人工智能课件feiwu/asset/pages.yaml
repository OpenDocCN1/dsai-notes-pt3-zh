- pgno: 913
  md: '# # Summary


    **Uninformed search** methods have access only to the problem definition.

    The basic algorithms are as follows:


    +   - **Breadth-first search** expands the shallowest nodes first; it is complete,

    +   optimal for unit step costs, but has exponential space complexity.

    +   - **Uniform-cost search** expands the node with lowest path cost, g(n), and

    +   is optimal for general step costs.

    +   - **Depth-first search** expands the deepest unexpanded node first. It is

    +   neither complete nor optimal, but has linear space complexity. **Depth-

    +   limited search** adds a depth bound.

    +   - **Iterative deepening search** calls depth-first search with increasing

    +   depth limits until a goal is found. It is complete, optimal for unit step
    costs,

    +   has time complexity comparable to breadth-first search, and has linear

    +   space complexity.

    +   - **Bidirectional search** can enormously reduce time complexity, but it is

    +   not always applicable and may require too much space.'
  merge: -1
  img_proc: true
- pgno: 914
  md: '# # Summary


    Informed search methods may have access to a **heuristic function** _h_(_n_) that
    estimates

    the cost of a solution from _n_.


    +   - The generic best-first search algorithm selects a node for expansion according
    to

    +   an evaluation function.


    +   - Greedy best-first search expands nodes with minimal _h_(_n_). It is not
    optimal but

    +   is often efficient.


    +   - A* search expands nodes with minimal _f_(_n_) = _g_(_n_) + _h_(_n_). A*
    is complete and

    +   optimal, provided that _h_(_n_) is admissible (for TREE-SEARCH) or consistent
    (for

    +   GRAPH-SEARCH). The space complexity of A* is still prohibitive.


    +   - RBFS (recursive best-first search) and SMA* (simplified memory-bounded A*)

    +   are robust, optimal search algorithms that use limited amounts of memory;
    given

    +   enough time, they can solve problems that A* cannot solve because it runs
    out of

    +   memory.


    +   - The performance of heuristic search algorithms depends on the quality of
    the heuristic

    +   function. One can sometimes construct good heuristics by relaxing the problem
    definition,

    +   by storing precomputed solution costs for subproblems in a pattern database,
    or

    +   by learning from experience with the problem class.'
