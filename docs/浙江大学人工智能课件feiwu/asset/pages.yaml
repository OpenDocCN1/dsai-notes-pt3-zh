- pgno: 799
  md: '# A* search: Minimizing the total estimated solution cost


    # Conditions for optimality: Admissibility and consistency


    The first condition we require for optimality is that h(n) be an admissible heuristic.
    An admissible heuristic is one that never overestimates the cost to reach the
    goal. Since g(n) is the actual cost to reach n along the current path, and f(n)
    = g(n) + h(n), we have as an immediate consequence that f(n) never overestimates
    the true cost of a solution along the current path through n.


    Admissible heuristics are by nature optimistic because they think the cost of
    solving the problem is less than it actually is. An obvious example of an admissible
    heuristic is the straight-line distance h_SLD that we used in getting to Bucharest.
    Straight-line distance is admissible because the shortest path between any two
    points is a straight line, so the straight line cannot be an overestimate. In
    Figure 3.24, we show the progress of an A* tree search for Bucharest. The values
    of g are computed from the step costs in Figure 3.2, and the values of h_SLD are
    given in Figure 3.22. Notice in particular that Bucharest first appears on the
    frontier at step (e), but it is not selected for expansion because its f-cost
    (450) is higher than that of Pitesti (417). Another way to say this is that there
    might be a solution through Pitesti whose cost is as low as 417, so the algorithm
    will not settle for a solution that costs 450.


    > For tree search problems, if an admissible heuristic is used, the A* search
    algorithm will never return a suboptimal goal node.'
  merge: -1
  img_proc: true
- pgno: 800
  md: '# # A* search: Minimizing the total estimated solution cost


    A second, slightly stronger condition called **consistency** (or sometimes **monotonicity**)
    is required only for applications of A* to graph search.<sup>9</sup> A heuristic
    _h_(_n_) is consistent if, for every node _n_ and every successor _n_′ of _n_
    generated by any action _a_, the estimated cost of reaching the goal from _n_
    is no greater than the step cost of getting to _n_′ plus the estimated cost of
    reaching the goal from _n_′:


    _h_(_n_) ≤ _c_(_n_, _a_, _n_′) + _h_(_n_′) .


    This is a form of the general **triangle inequality**, which stipulates that each
    side of a triangle cannot be longer than the sum of the other two sides. Here,
    the triangle is formed by _n_, _n_′, and the goal _G<sub>n</sub>_ closest to _n_.
    For an admissible heuristic, the inequality makes perfect sense: if there were
    a route from _n_ to _G<sub>n</sub>_ via _n_′ that was cheaper than _h_(_n_), that
    would violate the property that _h_(_n_) is a lower bound on the cost to reach
    _G<sub>n</sub>_.


    It is fairly easy to show (Exercise 3.29) that every consistent heuristic is also
    admissible. Consistency is therefore a stricter requirement than admissibility,
    but one has to work quite hard to concoct heuristics that are admissible but not
    consistent. All the admissible heuristics we discuss in this chapter are also
    consistent. Consider, for example, _h<sub>SLD</sub>_. We know that the general
    triangle inequality is satisfied when each side is measured by the straight-line
    distance and that the straight-line distance between _n_ and _n_′ is no greater
    than _c_(_n_, _a_, _n_′). Hence, _h<sub>SLD</sub>_ is a consistent heuristic.'
  merge: -1
  img_proc: true
- pgno: 801
  md: '# # A* search: Minimizing the total estimated solution cost


    # ## Conditions for optimality: Admissibility and consistency


    As we mentioned earlier, A* has the following properties: _the tree-search version
    of A* is optimal if h(n) is admissible, while the graph-search version is optimal
    if h(n) is consistent._


    We show the second of these two claims since it is more useful. The argument essentially
    mirrors the argument for the optimality of uniform-cost search, with _g_ replaced
    by _f_—just as in the A* algorithm itself.


    The first step is to establish the following: _if h(n) is consistent, then the
    values of f(n) along any path are nondecreasing_. The proof follows directly from
    the definition of consistency. Suppose \( n'' \) is a successor of _n_; then \(
    g(n'') = g(n) + c(n, a, n'') \) for some action _a_, and we have


    \( f(n'') = g(n'') + h(n'') = g(n) + c(n, a, n'') + h(n'') \geq g(n) + h(n) =
    f(n) \).


    The next step is to prove that _whenever A* selects a node n for expansion, the
    optimal path to that node has been found_. Were this not the case, there would
    have to be another frontier node \( n'' \) on the optimal path from the start
    node to _n_, by the graph separation property of Figure 3.9; because _f_ is nondecreasing
    along any path, \( n'' \) would have lower _f_-cost than _n_ and would have been
    selected first.


    From the two preceding observations, it follows that the sequence of nodes expanded
    by A* using GRAPH-SEARCH is in nondecreasing order of _f_(_n_). Hence, the first
    goal node selected for expansion must be an optimal solution because _f_ is the
    true cost for goal nodes (which have _h_ = 0) and all later goal nodes will be
    at least as expensive.'
  merge: -1
  img_proc: true
- pgno: 802
  md: '# # Heuristic Functions: hamming distance and Manhattan distances


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_802_0.png)


    need a heuristic function that never overestimates the number of steps to the
    goal. There is a long history of such heuristics for the 15-puzzle; here are two
    commonly used candidates:


    +   - \( h_1 = \) the number of misplaced tiles. For Figure 3.28, all of the eight
    tiles are out of position, so the start state would have \( h_1 = 8 \). It is
    an admissible heuristic because it is clear that any tile that is out of place
    must be moved at least once.


    +   - \( h_2 = \) the sum of the distances of the tiles from their goal positions.
    Because tiles cannot move along diagonals, the distance we will count is the sum
    of the horizontal and vertical distances. This is sometimes called the **city
    block distance** or **Manhattan distance**. \( h_2 \) is also admissible because
    all any move can do is move one tile one step closer to the goal. Tiles 1 to 8
    in the start state give a Manhattan distance of


    \( h_2 = 3 + 1 + 2 + 2 + 2 + 3 + 3 + 2 = 18 \).


    As expected, neither of these overestimates the true solution cost, which is 26.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_802_1.png)


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_802_2.png)


    \( h(n) = \sum_{\text{all tiles}} distance(\text{tile}, \text{correct position})
    \)'
