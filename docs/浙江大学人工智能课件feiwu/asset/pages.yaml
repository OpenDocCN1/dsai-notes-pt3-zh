  md: '# The definition of a game


    +   - A game can be formally defined as a kind of search problem with the following
    elements:

    +     - **S₀**: The **initial state**, which specifies how the game is set up
    at the start.

    +     - **PLAYER(s)**: Defines which player has the move in a state.

    +     - **ACTIONS(s)**: Returns the set of legal moves in a state.

    +     - **RESULT(s, a)**: The **transition model**, which defines the result of
    a move.

    +     - **TERMINAL-TEST(s)**: A **terminal test**, which is true when the game
    is over and false otherwise. States where the game has ended are called **terminal
    states**.

    +     - **UTILITY(s, p)**: A **utility function** (also called an objective function
    or payoff function), defines the final numeric value for a game that ends in terminal
    state s for a player p.'
