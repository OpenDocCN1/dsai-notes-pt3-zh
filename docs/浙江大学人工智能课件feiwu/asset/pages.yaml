- pgno: 40
  md: "# # Imperfect Real-time Decisions\n\n+   The minimax algorithm generates the\
    \ entire game search space, whereas the alpha–beta algorithm allows us to prune\
    \ large parts of it. However, alpha–beta still has to search all the way to terminal\
    \ states for at least a portion of the search space. This depth is usually not\
    \ practical, because moves must be made in a reasonable amount of time—typically\
    \ a few minutes at most.\n\n+   We should cut off the search earlier and apply\
    \ a heuristic evaluation function to states in the search, effectively turning\
    \ nonterminal nodes into terminal leaves. In other words, the suggestion is to\
    \ alter minimax or alpha–beta in two ways: replace the utility function by a heuristic\
    \ evaluation function EVAL, which estimates the position’s utility, and replace\
    \ the terminal test by a cutoff test that decides when to apply EVAL.\n\n+   That\
    \ gives us the following for heuristic minimax for state s and maximum depth d:\n\
    \n```\nH-MINIMAX(s,d) = \n⎧⎪⎪⎨⎪⎪⎩\nEVAL(s) if CUTOFF-TEST(s,d)\nmax\na∈Actions(s)\
    \ H-MINIMAX(RESULT(s,a),d+1) if PLAYER(s)=MAX\nmin\na∈Actions(s) H-MINIMAX(RESULT(s,a),d+1)\
    \ if PLAYER(s)=MIN.\n```"
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Imperfect Real-time Decisions: Evaluation functions


    An evaluation function returns an *estimate* of the expected utility of the game
    from a given position. How exactly do we design good evaluation functions?


    +   - First, the evaluation function should order the terminal states in the same
    way as the true utility function: states that are wins must evaluate better than
    draws, which in turn must be better than losses. Otherwise, an agent using the
    evaluation function might err even if it can see ahead all the way to the end
    of the game.


    +   - Second, the computation must not take too long! (The whole point is to search
    faster.)


    +   - Third, for nonterminal states, the evaluation function should be strongly
    correlated with the actual chances of winning.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Most evaluation functions work by calculating various **features** of the state—for
    example, in chess, we would have features for the number of white pawns, black
    pawns, white queens, black queens, and so on. The features, taken together, define
    various *categories* or *equivalence classes* of states: the states in each category
    have the same values for all the features.


    The evaluation function cannot know which states are which, but it can return
    a single value that reflects the proportion of states with each outcome. For example,
    suppose our experience suggests that 72% of the states encountered in the two-pawns
    vs. one-pawn category lead to a win (utility +1); 20% to a loss (0), and 8% to
    a draw (1/2). Then a reasonable evaluation for states in the category is the expected
    value: (0.72 × +1) + (0.20 × 0) + (0.08 × 1/2) = 0.76'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'In practice, this kind of analysis requires too many categories and hence too
    much experience to estimate all the probabilities of winning. Instead, most evaluation
    functions compute separate numerical contributions from each feature and then
    combine them to find the total value. For example, introductory chess books give
    an approximate material value for each piece: each pawn is worth 1, a knight or
    bishop is worth 3, a rook 5, and the queen 9. Other features such as “good pawn
    structure” and “king safety” might be worth half a pawn, say. These feature values
    are then simply added up to obtain the evaluation of the position.


    Mathematically, this kind of evaluation function is called **a weighted linear
    function** because it can be expressed as


    ```

    EVAL(s)=w<sub>1</sub>f<sub>1</sub>(s)+w<sub>2</sub>f<sub>2</sub>(s)+⋯+w<sub>n</sub>f<sub>n</sub>(s)=∑<sub>i=1</sub><sup>n</sup>w<sub>i</sub>f<sub>i</sub>(s),

    ```


    where each w<sub>i</sub> is a weight and each f<sub>i</sub> is a feature of the
    position. For chess, the f<sub>i</sub> could be the numbers of each kind of piece
    on the board, and the w<sub>i</sub> could be the values of the pieces (1 for pawn,
    3 for bishop, etc.).


    Adding up the values of features seems like a reasonable thing to do, but in fact
    it involves a strong assumption: that the contribution of each feature is **independent**
    of the values of the other features. For example, assigning the value 3 to a bishop
    ignores the fact that bishops are more powerful in the endgame, when they have
    a lot of space to maneuver.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '$$\mathrm{Eval}(s)=w_1f_1(s)+w_2f_2(s)+\cdots+w_nf_n(s)=\sum_{i=1}^{n}w_if_i(s),$$


    where each $w_i$ is a weight and each $f_i$ is a feature of the position. For
    chess, the $f_i$ could be the numbers of each kind of piece on the board, and
    the $w_i$ could be the values of the pieces (1 for pawn, 3 for bishop, etc.).


    Adding up the values of features seems like a reasonable thing to do, but in fact
    it involves a strong assumption: that the contribution of each feature is *independent*
    of the values of the other features. For example, assigning the value 3 to a bishop
    ignores the fact that bishops are more powerful in the endgame, when they have
    a lot of space to maneuver.


    For this reason, current programs for chess and other games also use *nonlinear*
    combinations of features. For example, a pair of bishops might be worth slightly
    more than twice the value of a single bishop, and a bishop is worth more in the
    endgame (that is, when the *move number* feature is high or the *number of remaining
    pieces* feature is low).


    The astute reader will have noticed that the features and weights are *not* part
    of the rules of chess! They come from centuries of human chess-playing experience.
    In games where this kind of experience is not available, the weights of the evaluation
    function can be estimated by the machine learning techniques of Chapter 18. Reassuringly,
    applying these techniques to chess has confirmed that a bishop is indeed worth
    about three pawns.


    # Fast simple $f$: weighted linear function


    $$w_1f_1+w_2f_2+\cdots+w_nf_n$$


    where the $w_i$ are the weights, and the $f_i$ are the features.


    # How to obtain such functions?


    +   - Weights $w_i$ can be learned automatically.

    +   - The features $f_i$ have to be designed by human experts.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# # Cutting off search


    The next step is to modify ALPHA-BETA-SEARCH so that it will call the heuristic
    EVAL function when it is appropriate to cut off the search. We replace the two
    lines in Figure 5.7 that mention TERMINAL-TEST with the following line:


    if CUTOFF-TEST(state, depth) then return EVAL(state)


    We also must arrange for some bookkeeping so that the current depth is incremented
    on each recursive call. The most straightforward approach to controlling the amount
    of search is to set a fixed depth limit so that CUTOFF-TEST(state, depth) returns
    true for all depth greater than some fixed depth d. (It must also return true
    for all terminal states, just as TERMINAL-TEST did.) The depth d is chosen so
    that a move is selected within the allocated time. A more robust approach is to
    apply iterative deepening. (See Chapter 3.) When time runs out, the program returns
    the move selected by the deepest completed search. As a bonus, iterative deepening
    also helps with move ordering.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_45_0.png)


    Figure 5.7 The alpha-beta search algorithm. Notice that these routines are the
    same as the MINMAX functions in Figure 5.3, except for the two lines in each of
    MIN-VALUE and MAX-VALUE that maintain α and β (and the bookkeeping to pass these
    parameters along).'
