- pgno: 795
  md: '# # Greedy best-first search


    Greedy best-first search is both non-optimal and incomplete (such as leading to
    an infinite loop)


    Greedy best-first tree search is also incomplete even in a finite state space,
    much like depth-first search. Consider the problem of getting from Iasi to Fagaras.
    The heuristic suggests that Neamt be expanded first because it is closest to Fagaras,
    but it is a dead end. The solution is to go first to Vaslui—a step that is actually
    farther from the goal according to the heuristic—and then to continue to Urziceni,
    Bucharest, and Fagaras. The algorithm will never find this solution, however,
    because expanding Neamt puts Iasi back into the frontier. Iasi is closer to Fagaras
    than Vaslui is, and so Iasi will be expanded again, leading to an infinite loop.
    (The graph search version is complete in finite spaces, but not in infinite ones.)
    The worst-case time and space complexity for the tree version is _O_(_b<sup>m</sup>_),
    where _m_ is the maximum depth of the search space. With a good heuristic function,
    however, the complexity can be reduced substantially. The amount of the reduction
    depends on the particular problem and on the quality of the heuristic.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_795_0.png)'
  merge: -1
  img_proc: true
- pgno: 796
  md: '# # A* search: Minimizing the total estimated solution cost


    The most widely known form of best-first search is called A** search (pronounced
    “A-star search”). It evaluates nodes by combining _g_(_n_), the cost to reach
    the node, and _h_(_n_), the cost to get from the node to the goal:


    _f_(_n_) = _g_(_n_) + _h_(_n_) .


    Since _g_(_n_) gives the path cost from the start node to node _n_, and _h_(_n_)
    is the estimated cost of the cheapest path from _n_ to the goal, we have


    _f_(_n_) = estimated cost of the cheapest solution through _n_ .


    Thus, if we are trying to find the cheapest solution, a reasonable thing to try
    first is the node with the lowest value of _g_(_n_) + _h_(_n_). It turns out that
    this strategy is more than just reasonable: provided that the heuristic function
    _h_(_n_) satisfies certain conditions, A** search is both complete and optimal.
    The algorithm is identical to UNIFORM-COST-SEARCH except that A** uses _g_ + _h_
    instead of _g_.


    ![](img/c69bfdf1f6addd09d49cae0440fcc5c7_796_0.png)'
