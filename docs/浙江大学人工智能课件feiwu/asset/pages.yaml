  md: '# # Recurrent Neural Network


    We can process a sequence of vectors x by applying a **recurrence formula** at
    every time step:


    \( h_t = f_W(h_{t-1}, x_t) \)


    **new state** **old state** **input vector at some time step**


    **some function with parameters W**


