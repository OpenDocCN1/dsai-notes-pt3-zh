- pgno: 61
  md: '# Remote Object Activation


    +   1. Compile all source files.

    +   2. Start the RMI registry with rmiregistry

    +   3. Start the RMI activation daemon with

    +      `rmid -J-Djava.security.policy=rmid.policy`

    +   4. Run the activation program from the server directory.

    +      `java -Djava.rmi.server.codebase=http://localhost:8080/WarehouseActivator`

    +   5. Run the client program from the client directory.

    +      `java -Djava.security.manager -Djava.security.policy=client.policy WarehouseClient`


    ![](bbox=[0.72, 0.51, 0.95, 0.86])'
