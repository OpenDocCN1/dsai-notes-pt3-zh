- pgno: 55
  md: '+   - **The activation mechanism**

    +     - lets you delay the object construction so that a remote object is only
    constructed when at least one client invokes a remote method on it.

    +     ```

    +     class WarehouseImpl extends

    +     Activatable implements Warehouse { . . . }

    +     ```

    +   - **You must provide a constructor that takes two parameters:**

    +     - An activation ID (which you simply pass to the superclass constructor).

    +     - A single object containing all construction information, wrapped in a
    MarshalledObject.'
