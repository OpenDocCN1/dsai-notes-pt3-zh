- pgno: 60
  md: "# Remote Object Activation\n\n+   - `Client.policy`\n+   \n+     ```\n+   \
    \  grant\n+     {\n+         permission com.sun.rmi.rmid.ExecPermission\n+   \
    \          \"${java.home}${/}bin${/}java\";\n+         permission com.sun.rmi.rmid.ExecOptionPermission\n\
    +             \"-Djava.security.policy=*\";\n+     };\n+     ```\n\n+   - `rmid.policy`\n\
    +   \n+     ```\n+     grant\n+     {\n+         permission com.sun.rmi.rmid.ExecPermission\n\
    +             \"${java.home}${/}bin${/}java\";\n+         permission com.sun.rmi.rmid.ExecOptionPermission\n\
    +             \"-Djava.security.policy=*\";\n+     };\n+     ```\n\n+   - Copy\
    \ the `rmid.policy` to `java.home/bin`\n\n![](bbox=[0.573, 0.602, 0.951, 0.873])"
  merge: -1
