- pgno: 7
  md: '+   - Enterprise applications often have complex data -- and lots of it --
    to work on, together with business rules that fail all tests of logical reasoning.

    +     - Other terms for enterprise applications include “information systems"

    +     - Enterprise applications include payroll, patient records, shipping tracking,
    cost analysis, credit scoring, insurance, supply chain, accounting, customer service,
    and foreign exchange trading.

    +     - Enterprise applications don''t include automobile fuel injection, word
    processors, elevator controllers, chemical plant controllers, telephone switches,
    operating systems, compilers, and games.'
  merge: -1
  img_proc: false
- pgno: 8
  md: '# What is Enterprise Application


    +   - Enterprise applications

    +     - usually involve persistent data

    +     - usually have a lot of data

    +     - usually many people access data concurrently

    +     - usually have a lot of user interface screens

    +     - usually they need to integrate with other enterprise applications scattered
    around the enterprise

    +     - conceptual dissonance with the data

    +     - complex business "illogic"'
  merge: -1
  img_proc: false
- pgno: 9
  md: '+   - An enterprise system is one that has the following qualities:

    +     - Shares some or all of the resources used by the application

    +     - Is intended for internal use

    +     - Must work within existing architecture

    +     - Will be deployed and supported by internal IT staff

    +     - Requires greater robustness, both in terms of exception-handling and scalability

    +     - Must fail gracefully

    +     - Must gracefully handle evolution over time'
  merge: -1
  img_proc: false
