  md: "# The RMI Programming Model\n\n+   - On the server side, you must provide the\
    \ implementation of the remote interface\n\n```\npublic class WarehouseImpl extends\
    \ UnicastRemoteObject implements Warehouse\n{\n    private Map<String, Double>\
    \ prices;\n\n    public WarehouseImpl() throws RemoteException\n    {\n      \
    \  prices = new HashMap<>();\n        prices.put(\"Blackwell Toaster\", 24.95);\n\
    \        prices.put(\"ZapXpress Microwave Oven\", 49.95);\n    }\n    public double\
    \ getPrice(String description) throws RemoteException\n    {\n        Double price\
    \ = prices.get(description);\n        return price == null ? 0 : price;\n    }\n\
    }\n```"
