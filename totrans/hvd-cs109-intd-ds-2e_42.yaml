- en: 'Let’s make some observations about the table above. First, observe that different
    polls, all conducted days before the election, report different *spreads*: the
    estimated difference between support for the two candidates. Notice that the reported
    spreads hover around what eventually became the actual result: Clinton won the
    popular vote by 2.1%. Additionally, we see a column titled **MoE** which stands
    for *margin of error*. We will learn what this means.'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们对上表进行一些观察。首先，注意不同民意调查，尽管都是在选举前几天进行的，但报告了不同的*差距*：两个候选人支持率的估计差异。注意，报告的差距围绕着最终成为实际结果的情况：克林顿以
    2.1% 的优势赢得了普选票。此外，我们看到了一个标题为**MoE**的列，它代表*误差范围*。我们将了解这是什么意思。
- en: 'A Motivating Example: The Polling Competition'
  id: totrans-29
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 动机示例：民意调查竞赛
- en: 'To help us understand the connection between polls and what we have learned,
    let’s construct a situation similar to what pollsters face. To simulate the challenge
    pollsters encounter in terms of competing with other pollsters for media attention,
    we will use an urn filled with beads to represent voters, and pretend we are competing
    for a $25 dollar prize. The challenge is to guess the spread between the proportion
    of blue and red beads in this urn (in this case, a pickle jar):'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: 为了帮助我们理解民意调查与我们所学知识之间的联系，让我们构建一个与民意调查者面临的情况类似的情况。为了模拟民意调查者在与其他民意调查者争夺媒体关注时所遇到的挑战，我们将使用一个装满珠子的罐子来代表选民，并假装我们在争夺
    25 美元的奖金。挑战是猜测这个罐子（在这种情况下，是一个腌黄瓜罐）中蓝色和红色珠子比例的差距：
- en: '![](../Images/111e6a330b2d903999d8eed3178d3eac.png)'
  id: totrans-31
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/111e6a330b2d903999d8eed3178d3eac.png)'
- en: Before making a prediction, you can take a sample (with replacement) from the
    urn. To reflect the fact that running polls is expensive, it costs you $0.10 for
    each bead you sample. Therefore, if your sample size is 250, and you win, you
    will break even since you would have paid $25 to collect your $25 prize. Your
    entry into the competition can be an interval. If the interval you submit contains
    the true proportion, you receive half what you paid and proceed to the second
    phase of the competition. In the second phase, the entry with the smallest interval
    is selected as the winner.
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 在做出预测之前，你可以从罐子中抽取一个样本（有放回）。为了反映进行民意调查的成本，每次抽取珠子你需要支付 0.10 美元。因此，如果你的样本大小是 250，并且你赢了，你将收支平衡，因为你已经支付了
    25 美元来收集你的 25 美元奖金。你的参赛方式可以是一个区间。如果你提交的区间包含真实比例，你将获得你支付的一半，并进入比赛的第二阶段。在第二阶段，选择区间最小的参赛者作为获胜者。
- en: 'The **dslabs** package includes a function that shows a random draw from this
    urn:'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: '**dslabs** 包含一个函数，可以显示从这个罐子中进行的随机抽取：'
- en: '[PRE0]'
  id: totrans-34
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: '*![](../Images/e73cfbe6c467faa88dd518ac632d7947.png)*  *Think about how you
    would construct your interval based on the data shown above.'
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: '*![](../Images/e73cfbe6c467faa88dd518ac632d7947.png)*  *思考一下你将如何根据上述数据构建你的区间。'
- en: 'We have just described a simple sampling model for opinion polls. In this model,
    the beads inside the urn represent individuals who will vote on election day.
    The red beads represent those voting for the Republican candidate, while the blue
    beads represent the Democrats. For simplicity, let’s assume there are no other
    colors; that is, that there are just two parties: Republican and Democratic.*'
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 我们刚刚描述了一个简单的民意调查采样模型。在这个模型中，瓮中的珠子代表将在选举日投票的个人。红色珠子代表投票给共和党候选人的人，而蓝色珠子代表民主党人。为了简化，让我们假设没有其他颜色；也就是说，只有两个政党：共和党和民主党。
- en: '*9.2 Populations, samples, parameters, and estimates*'
  id: totrans-37
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '*9.2 总体、样本、参数和估计*'
- en: '*We want to predict the proportion of blue beads in the urn. Let’s call this
    quantity \(p\), which then tells us the proportion of red beads \(1-p\), and the
    spread \(p - (1-p)\), which simplifies to \(2p - 1\).'
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: '*我们想要预测瓮中蓝色珠子的比例。让我们称这个量为 \(p\)，这样它就告诉我们红色珠子的比例 \(1-p\)，以及范围 \(p - (1-p)\)，这简化为
    \(2p - 1\)。'
- en: In statistical textbooks, the beads in the urn are called the *population*.
    The proportion of blue beads in the population \(p\) is called a *parameter*.
    The 25 beads we see in the previous plot are called a *sample*. The goal of statistical
    inference is to predict the parameter \(p\) based on the observed data in the
    sample.
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: 在统计教科书中，瓮中的珠子被称为 *总体*。总体中蓝色珠子的比例 \(p\) 被称为 *参数*。我们在前面的图中看到的 25 个珠子被称为 *样本*。统计推断的目标是根据样本中的观察数据预测参数
    \(p\)。
- en: Can we do this with the 25 observations above? It is certainly informative.
    For example, given that we see 13 red and 12 blue beads, it seems unlikely that
    \(p\) > .9 or \(p\) < .1\. But are we ready to predict with certainty that there
    are more red beads than blue in the jar?
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 我们能否用上面的 25 个观察结果来做这件事？这当然是有信息的。例如，鉴于我们看到 13 个红色珠子和 12 个蓝色珠子，\(p\) > .9 或 \(p\)
    < .1 的可能性似乎不大。但我们是否准备好确信罐子里红色珠子比蓝色珠子多？
- en: We want to construct an estimate of \(p\) using only the information we observe.
    An estimate should be thought of as a summary of the observed data that we think
    is informative about the parameter of interest. It seems intuitive to think that
    the proportion of blue beads in the sample \(0.48\) must be at least related to
    the actual proportion \(p\). But do we simply predict \(p\) to be 0.48? First,
    remember that the sample proportion is a random variable. If we run the command
    `take_poll(25)` four times, we get a different answer each time, since the sample
    proportion is a random variable.
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: 我们希望仅使用我们观察到的信息来构建对 \(p\) 的估计。估计应该被视为观察数据的总结，我们认为它对感兴趣的参数具有信息性。直观地认为，样本中蓝色珠子的比例
    \(0.48\) 必须至少与实际比例 \(p\) 有关。但我们是否简单地预测 \(p\) 为 0.48？首先，记住样本比例是一个随机变量。如果我们运行命令
    `take_poll(25)` 四次，每次都会得到不同的答案，因为样本比例是一个随机变量。
- en: '![](../Images/ad9c53063494c0693fef1c393a0a1dab.png)'
  id: totrans-42
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/ad9c53063494c0693fef1c393a0a1dab.png)'
- en: Observe that in the four random samples shown above, the sample proportions
    range from 0.44 to 0.60\. By describing the distribution of this random variable,
    we will be able to gain insights into how good this estimate is and how we can
    improve it.
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: 注意到在上述四个随机样本中，样本比例的范围从 0.44 到 0.60。通过描述这个随机变量的分布，我们将能够了解这个估计有多好，以及我们如何改进它。
- en: The sample average as an estimate
  id: totrans-44
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 样本平均作为估计值
- en: Conducting an opinion poll is being modeled as taking a random sample from an
    urn. We propose using the proportion of blue beads in our sample as an *estimate*
    of the parameter \(p\). Once we have this estimate, we can easily report an estimate
    for the spread \(2p-1\). However, for simplicity, we will illustrate the concepts
    for estimating \(p\). We will use our knowledge of probability to justify our
    use of the sample proportion and to quantify its proximity to the population proportion
    \(p\).
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: 民意调查的进行被建模为从瓮中抽取随机样本。我们建议使用样本中蓝色珠子的比例作为参数 \(p\) 的 *估计值*。一旦我们有了这个估计值，我们就可以轻松地报告范围
    \(2p-1\) 的估计值。然而，为了简化，我们将说明估计 \(p\) 的概念。我们将使用我们对概率的了解来证明我们使用样本比例的合理性，并量化其与总体比例
    \(p\) 的接近程度。
- en: We start by defining the random variable \(X\) as \(X=1\), if we pick a blue
    bead at random, and \(X=0\) if it is red. This implies that the population is
    a list of 0s and 1s. If we sample \(N\) beads, then the average of the draws \(X_1,
    \dots, X_N\) is equivalent to the proportion of blue beads in our sample. This
    is because adding the \(X\)s is equivalent to counting the blue beads, and dividing
    this count by the total \(N\) is equivalent to computing a proportion. We use
    the symbol \(\bar{X}\) to represent this average. In statistics textbooks, a bar
    on top of a symbol typically denotes the average.
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: 我们首先定义随机变量 \(X\) 为 \(X=1\)，如果我们随机抽取一个蓝色珠子，如果它是红色，则 \(X=0\)。这意味着总体是一个由0和1组成的列表。如果我们抽取
    \(N\) 个珠子，那么抽取的平均值 \(X_1, \dots, X_N\) 等价于样本中蓝色珠子的比例。这是因为将 \(X\) 相加等价于计数蓝色珠子，将这个计数除以总数
    \(N\) 等价于计算比例。我们用符号 \(\bar{X}\) 来表示这个平均值。在统计学教科书中，符号上方的横线通常表示平均值。
- en: 'The theory we just covered about the sum of draws becomes useful because the
    average is a sum of draws multiplied by the constant \(1/N\):'
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: 我们刚刚讨论的关于抽取总和的理论变得有用，因为平均值是抽取总和乘以常数 \(1/N\)：
- en: \[ \bar{X} = \frac{1}{N} \sum_{i=1}^N X_i \]
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \bar{X} = \frac{1}{N} \sum_{i=1}^N X_i \]
- en: For simplicity, let’s assume that the draws are independent; after we see each
    sampled bead, we return it to the urn. In this case, what do we know about the
    distribution of the sum of draws? First, we know that the expected value of the
    sum of draws is \(N\) times the average of the values in the urn. We know that
    the average of the 0s and 1s in the urn must be \(p\), the proportion of blue
    beads.
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: 为了简化，让我们假设抽取是独立的；在看到每个抽取的珠子后，我们将其放回罐子中。在这种情况下，我们知道抽取总和的分布是什么？首先，我们知道抽取总和的期望值是罐中数值平均值的
    \(N\) 倍。我们知道罐中0和1的平均值必须是 \(p\)，即蓝色珠子的比例。
- en: 'Here, we encounter an important difference compared to what we did in the probability
    part of the book: we don’t know the composition of the urn. While we know there
    are blue and red beads, we don’t know how many of each. This is what we want to
    find out: we are trying to *estimate* \(p\).'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: 在这里，我们遇到了与书中概率部分所做不同的重要区别：我们不知道罐子的组成。虽然我们知道有蓝色和红色珠子，但我们不知道每种颜色的数量。这正是我们想要找到的：我们正在尝试*估计*
    \(p\)。
- en: Parameters
  id: totrans-51
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 参数
- en: Just as we use variables to define unknowns in systems of equations, in statistical
    inference, we define *parameters* to represent unknown parts of our models. In
    the urn model, which we are using to simulate an opinion poll, we do not know
    the proportion of blue beads in the urn. We define the parameters \(p\) to represent
    this quantity. Since our main goal is determining \(p\), we are going to *estimate
    this parameter*.
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: 正如我们使用变量来定义方程组中的未知数一样，在统计推断中，我们定义*参数*来表示我们模型中的未知部分。在我们用来模拟民意调查的罐子模型中，我们不知道罐中蓝色珠子的比例。我们定义参数
    \(p\) 来表示这个数量。由于我们的主要目标是确定 \(p\)，我们将*估计这个参数*。
- en: The concepts presented here on how we estimate parameters, and provide insights
    into how good these estimates are, extend to many data analysis tasks. For example,
    we may want to determine the difference in health improvement between patients
    receiving treatment and a control group, investigate the health effects of smoking
    on a population, analyze the differences in racial groups of fatal shootings by
    police, or assess the rate of change in life expectancy in the US during the last
    10 years. All these questions can be framed as a task of estimating a parameter
    from a sample.
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: 这里介绍的是如何估计参数的概念，以及如何评估这些估计的好坏，这些概念可以扩展到许多数据分析任务中。例如，我们可能想要确定接受治疗的患者与对照组之间健康改善的差异，调查吸烟对人群的健康影响，分析警察致命射击中种族群体之间的差异，或者评估过去10年美国预期寿命变化率。所有这些问题都可以被构建为从样本中估计参数的任务。
- en: '*Introductory statistics textbooks typically begin by introducing the *population
    average* as the first example of a parameter. In our case, the parameter of interest
    \(p\) is defined as the proportion of 1s (blue) in the urn. Notice that this proportion
    is also equal to the average of all the numbers in the urn, since the 1s and 0s
    can be treated as numeric values.'
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
  zh: '*入门统计学教材通常首先介绍总体平均数作为参数的第一个例子。在我们的情况下，感兴趣的参数 \(p\) 被定义为罐中1（蓝色）的比例。请注意，这个比例也等于罐中所有数字的平均值，因为1和0可以被视为数值。*'
- en: This means that our parameter \(p\) can be interpreted as a **population average**.
    For this reason, we will use \(\bar{X}\) to denote its **estimate**, the average
    computed from a sample of draws from the urn. Although many textbooks use the
    notation \(\hat{p}\) for this estimate, the symbol \(\bar{X}\) better emphasizes
    the connection between sample averages and population means, a concept that extends
    naturally to situations beyond binary data.**
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: 这意味着我们的参数 \(p\) 可以被解释为**总体平均数**。因此，我们将使用 \(\bar{X}\) 来表示其**估计值**，这是从抽屉中抽取样本计算出的平均值。尽管许多教科书使用
    \(\hat{p}\) 来表示这个估计值，但符号 \(\bar{X}\) 更好地强调了样本平均值与总体均值之间的联系，这个概念可以自然地扩展到二元数据以外的情形。**
- en: '**9.3 Estimate properties: expected value and standard error**'
  id: totrans-56
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '**9.3 估计属性：期望值和标准误差**'
- en: '**To understand how good our estimate is, we will describe the statistical
    properties of the random variable defined above: the sample proportion \(\bar{X}\).
    Remember that \(\bar{X}\) is the sum of independent draws divided by a non-random
    constant so the rules we covered [Section 7.4](../prob/random-variables.html#sec-mean-var-eqs)
    apply.'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: '**为了了解我们的估计有多好，我们将描述上面定义的随机变量的统计特性：样本比例 \(\bar{X}\)。记住，\(\bar{X}\) 是独立抽取的总和除以一个非随机常数，因此我们之前讨论的规则[第7.4节](../prob/random-variables.html#sec-mean-var-eqs)适用。'
- en: 'Applying the concepts we have learned we can show that:'
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 应用我们学到的概念，我们可以证明：
- en: \[ \mathrm{E}[\bar{X}] = p \]
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mathrm{E}[\bar{X}] = p \]
- en: 'We can also use what we learned to determine the standard error: \[ \mathrm{SE}[\bar{X}]
    = \sqrt{p(1-p)/N} \]'
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: 我们还可以使用我们学到的知识来确定标准误差：\[ \mathrm{SE}[\bar{X}] = \sqrt{p(1-p)/N} \]
- en: This result reveals the power of polls. The expected value of the sample proportion
    \(\bar{X}\) is the parameter of interest \(p\), and we can make the standard error
    as small as we want by increasing \(N\). The law of large numbers tells us that
    with a large enough sample, our estimate converges to \(p\).
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: 这个结果揭示了调查的力量。样本比例的期望值 \(\bar{X}\) 是我们感兴趣的参数 \(p\)，我们可以通过增加 \(N\) 来使标准误差尽可能小。大数定律告诉我们，随着样本量的增大，我们的估计会收敛到
    \(p\)。
- en: If we take a large enough sample to make our standard error about 1%, we will
    be quite certain about who will win. But how large does the poll have to be for
    the standard error to be this small?
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们抽取足够大的样本，使标准误差大约为1%，我们将非常确信谁会获胜。但是，调查需要多大才能使标准误差如此之小？
- en: 'One problem is that we do not know \(p\), so we can’t actually compute the
    standard error. However, for illustrative purposes, let’s assume that \(p=0.51\)
    and make a plot of the standard error versus the sample size \(N\):'
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: 一个问题是，我们不知道 \(p\)，因此我们实际上无法计算标准误差。然而，为了说明目的，让我们假设 \(p=0.51\) 并绘制标准误差与样本量 \(N\)
    的关系图：
- en: '![](../Images/363ba49fee6322582534c2e8be7342de.png)'
  id: totrans-64
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/363ba49fee6322582534c2e8be7342de.png)'
- en: 'The plot shows that we would need a poll of over 10,000 people to achieve a
    standard error that low. We rarely see polls of this size due in part to the associated
    costs. According to the Real Clear Politics table, sample sizes in opinion polls
    range from 500-3,500 people. For a sample size of 1,000 and \(p=0.51\), the standard
    error is:'
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
  zh: 图表显示，我们需要一个超过10,000人的调查才能达到如此低的标准误差。我们很少看到这么大规模的调查，部分原因是相关的成本。根据Real Clear Politics表格，民意调查的样本量范围在500-3,500人之间。对于样本量为1,000且
    \(p=0.51\) 的情况，标准误差是：
- en: '[PRE1]'
  id: totrans-66
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: '*or 1.5 percentage points. So even with large polls, for close elections, \(\bar{X}\)
    can lead us astray if we don’t realize it is a random variable. Nonetheless, we
    can actually say more about how close we get to \(p\) and we do that in [Section
    9.4.1](#sec-clt).'
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
  zh: '*或者1.5个百分点。因此，即使在大规模调查中，对于竞争激烈的选举，如果我们没有意识到 \(\bar{X}\) 是一个随机变量，它也可能误导我们。然而，我们实际上可以更多地了解我们接近
    \(p\) 的程度，我们将在[第9.4.1节](#sec-clt)中这样做。'
- en: '*Polling versus forecasting* *Before we continue, it’s important to clarify
    a practical issue related to forecasting an election. If a poll is conducted four
    months before the election, it is estimating the \(p\) for that moment, and not
    for election day. The \(p\) for election night might be different, as people’s
    opinions tend to fluctuate through time. Generally, the polls conducted the night
    before the election tend to be the most accurate, since opinions do not change
    significantly in a day. However, forecasters try to develop tools that model how
    opinions vary over time and aim to predict the election night results by taking
    into consideration these fluctuations. We will explore some approaches for doing
    this in [Chapter 12](hierarchical-models.html).****'
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
  zh: '**民意调查与预测** 在我们继续之前，重要的是要澄清一个与预测选举相关的实际问题。如果在选举前四个月进行民意调查，它是在估计那个时刻的 \(p\)，而不是选举日的
    \(p\)。选举之夜的 \(p\) 可能会不同，因为人们的观点往往会随时间波动。通常，选举前一晚进行的民意调查最准确，因为观点在一天内不会发生显著变化。然而，预报员试图开发工具来模拟观点随时间的变化，并试图通过考虑这些波动来预测选举之夜的结果。我们将在[第12章](hierarchical-models.html)中探讨一些实现这一目标的方法。'
- en: '****9.4 Confidence Intervals****'
  id: totrans-69
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '**9.4 置信区间**'
- en: '****Pollsters summarize uncertainty using a single, easy-to-interpret number
    called the *margin of error*. The margin of error, together with the estimate
    of the parameter, defines an interval that they are *confident* contains the true
    value. But what does *confident* actually mean?'
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
  zh: '**民意调查员使用一个简单易懂的数字来总结不确定性，这个数字被称为**误差范围**。误差范围与参数的估计值一起定义了一个区间，他们对此区间**有信心**地认为它包含了真实值。但“有信心”实际上意味着什么呢？'
- en: To connect this idea to a familiar challenge, recall the competition described
    in [Section 9.1](#sec-poll-sampling-models), where you were asked to report an
    interval for the true proportion \(p\). If your interval included the actual \(p\),
    you recovered half the cost of your poll and advanced to the next round. A guaranteed
    way to move on would be to report a very wide interval, say \([0,1]\), which is
    certain to contain \(p\). But such an interval is useless because it conveys no
    information, and you would lose to someone submitting a narrower one. Similarly,
    an election forecaster who predicts that the spread will be between −100% and
    100% would not be taken seriously. Even an interval between −10% and 10% would
    be too vague to be meaningful.
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: 为了将这个想法与一个熟悉的问题联系起来，回想一下[第9.1节](#sec-poll-sampling-models)中描述的竞赛，其中你被要求报告一个真实比例
    \(p\) 的区间。如果你的区间包含了实际的 \(p\)，你就能收回一半的民意调查成本并进入下一轮。一种保证进入下一轮的方法是报告一个非常宽的区间，比如 \([0,1]\)，这肯定包含
    \(p\)。但这样的区间是没有用的，因为它没有传达任何信息，你可能会输给提交更窄区间的人。同样，一个预测选举范围在 -100% 到 100% 之间的选举预报员是不会被认真对待的。即使范围在
    -10% 到 10% 之间也会过于模糊而失去意义。
- en: 'On the other hand, a very narrow interval is risky. A pollster who reports
    extremely tight intervals but frequently misses the true value will quickly lose
    credibility. The goal is to find a balance: intervals that are narrow enough to
    be informative but wide enough to be reliable.'
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: 另一方面，一个非常窄的区间是有风险的。一个报告非常紧密区间但经常错过真实值的民意调查员会很快失去信誉。目标是找到一个平衡点：区间足够窄以提供信息，但足够宽以可靠。
- en: Statistical theory provides a way to quantify precisely what we mean by *confidence*,
    using the probability framework developed earlier. Specifically, we can construct
    intervals for which we can compute the probability of containing the true parameter
    \(p\). When a pollster reports an estimate along with a *margin of error*, they
    are effectively reporting an interval with a 95% probability of containing the
    true parameter, known as a **95% confidence interval**.
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: 统计理论提供了一种方法，使用之前开发的概率框架来精确量化我们所说的**置信度**。具体来说，我们可以构建一个区间，我们可以计算包含真实参数 \(p\)
    的概率。当一个民意调查员报告一个估计值以及一个**误差范围**时，他们实际上是在报告一个有 95% 概率包含真实参数的区间，这被称为**95% 置信区间**。
- en: The Central Limit Theorem
  id: totrans-74
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '**中心极限定理**'
- en: In [Chapter 9](#sec-parameters-and-estimates), we introduced the sample average
    \(\bar{X}\) as an estimate of the parameter \(p\), and we showed how to compute
    its standard error. However, to calculate probabilities, we need the *distribution*
    of \(\bar{X}\).
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: 在[第9章](#sec-parameters-and-estimates)中，我们介绍了样本平均值 \(\bar{X}\) 作为参数 \(p\) 的估计值，并展示了如何计算其标准误差。然而，为了计算概率，我们需要
    \(\bar{X}\) 的**分布**。
- en: In the *Probability* part of the book ([Section 8.3](../prob/sampling-models-and-clt.html#sec-clt-prob)),
    we learned that when the sample size is large, the average of independent draws
    from a population is approximately normally distributed, regardless of the shape
    of the population. This is the **Central Limit Theorem (CLT)**. Because \(\bar{X}\)
    is the average of independent draws, the CLT applies directly here, and it is
    the main tool used to construct confidence intervals.
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: 在书的 *概率* 部分（[第 8.3 节](../prob/sampling-models-and-clt.html#sec-clt-prob)），我们学习了当样本量很大时，从总体中独立抽取的平均值近似正态分布，无论总体的形状如何。这是
    **中心极限定理 (CLT)**。因为 \(\bar{X}\) 是独立抽取的平均值，CLT 直接适用于这里，并且它是构建置信区间的主要工具。
- en: 'Let’s use it to answer a concrete question:'
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们用它来回答一个具体问题：
- en: How likely is it that our sample estimate \(\bar{X}\) is within 2% of the true
    population proportion \(p\)?
  id: totrans-78
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 我们的样本估计值 \(\bar{X}\) 在真实总体比例 \(p\) 的 2% 以内有多大的可能性？
- en: 'We can express this as:'
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以表示为：
- en: \[ \Pr(|\bar{X} - p| \leq 0.02) = \Pr(\bar{X} \leq p + 0.02) - \Pr(\bar{X} \leq
    p - 0.02). \]
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \Pr(|\bar{X} - p| \leq 0.02) = \Pr(\bar{X} \leq p + 0.02) - \Pr(\bar{X} \leq
    p - 0.02). \]
- en: 'If we standardize \(\bar{X}\), subtracting its expected value and dividing
    by its standard error, we obtain a standard normal random variable \(Z\):'
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们对 \(\bar{X}\) 进行标准化，即减去其期望值并除以其标准误差，我们得到一个标准正态随机变量 \(Z\)：
- en: \[ Z = \frac{\bar{X} - \mathrm{E}[\bar{X}]}{\mathrm{SE}[\bar{X}]}. \]
  id: totrans-82
  prefs: []
  type: TYPE_NORMAL
  zh: \[ Z = \frac{\bar{X} - \mathrm{E}[\bar{X}]}{\mathrm{SE}[\bar{X}]}. \]
- en: 'Since \(\mathrm{E}[\bar{X}] = p\) and \(\mathrm{SE}[\bar{X}] = \sqrt{p(1-p)/N}\),
    the probability above becomes:'
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
  zh: 由于 \(\mathrm{E}[\bar{X}] = p\) 且 \(\mathrm{SE}[\bar{X}] = \sqrt{p(1-p)/N}\)，上面的概率变为：
- en: \[ \Pr\left(Z \leq \frac{0.02}{\sqrt{p(1-p)/N}}\right) - \Pr\left(Z \leq -\frac{0.02}{\sqrt{p(1-p)/N}}\right).
    \]
  id: totrans-84
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \Pr\left(Z \leq \frac{0.02}{\sqrt{p(1-p)/N}}\right) - \Pr\left(Z \leq -\frac{0.02}{\sqrt{p(1-p)/N}}\right).
    \]
- en: 'To compute this, we need \(\sqrt{p(1-p)/N}\), but \(p\) is unknown. Fortunately,
    the CLT still holds if we use a *plug-in estimate*, replacing \(p\) with our observed
    \(\bar{X}\):'
  id: totrans-85
  prefs: []
  type: TYPE_NORMAL
  zh: 为了计算这个，我们需要 \(\sqrt{p(1-p)/N}\)，但 \(p\) 是未知的。幸运的是，如果我们使用 *插值估计*，用观察到的 \(\bar{X}\)
    替换 \(p\)，CLT 仍然成立：
- en: \[ \widehat{\mathrm{SE}}[\bar{X}] = \sqrt{\bar{X}(1 - \bar{X})/N}. \]
  id: totrans-86
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \widehat{\mathrm{SE}}[\bar{X}] = \sqrt{\bar{X}(1 - \bar{X})/N}. \]
- en: '*In statistics, hats indicate estimates. For example, \(\hat{p}\) is often
    used instead of \(\bar{X}\) to denote the estimate of \(p\). Similarly, \(\widehat{\mathrm{SE}}\)
    means we are estimating the standard error rather than computing it exactly.*  *Using
    our earlier poll with \(\bar{X} = 0.48\) and \(N = 25\), we obtain:'
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: '*在统计学中，帽子符号表示估计值。例如，\(\hat{p}\) 通常用来代替 \(\bar{X}\) 表示 \(p\) 的估计值。同样，\(\widehat{\mathrm{SE}}\)
    表示我们正在估计标准误差而不是精确计算它。* 使用我们之前的民意调查，其中 \(\bar{X} = 0.48\) 和 \(N = 25\)，我们得到：'
- en: '[PRE2]'
  id: totrans-88
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: '*Now we can compute the probability that our estimate is within 2% of the true
    value:'
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
  zh: '*现在我们可以计算我们的估计值在真实值 2% 以内的概率：'
- en: '[PRE3]'
  id: totrans-90
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: '*There is only a small chance of being this close when \(N = 25\).'
  id: totrans-91
  prefs: []
  type: TYPE_NORMAL
  zh: '*当 \(N = 25\) 时，这种情况发生的可能性很小。'
- en: 'The same reasoning applies for any desired error. To find the error \(\epsilon\)
    that gives a 95% probability that \(\bar{X}\) is within that range of \(p\), we
    solve:'
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: 对于任何期望的误差，上述推理同样适用。为了找到使 \(\bar{X}\) 在 \(p\) 的给定范围内有 95% 概率的误差 \(\epsilon\)，我们解：
- en: \[ \Pr(|\bar{X} - p| \leq \epsilon) = 0.95. \]
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \Pr(|\bar{X} - p| \leq \epsilon) = 0.95. \]
- en: From the standard normal distribution, we know that
  id: totrans-94
  prefs: []
  type: TYPE_NORMAL
  zh: 从标准正态分布中，我们知道
- en: \[ \Pr(-1.96 \leq Z \leq 1.96) = 0.95. \]
  id: totrans-95
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \Pr(-1.96 \leq Z \leq 1.96) = 0.95. \]
- en: Therefore, \(\epsilon = 1.96 \times \widehat{\mathrm{SE}}[\bar{X}]\).
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，\(\epsilon = 1.96 \times \widehat{\mathrm{SE}}[\bar{X}]\)。
- en: This result gives us a way to construct **confidence intervals** that, in repeated
    samples, contain the true parameter 95% of the time.***
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
  zh: 这个结果给我们提供了一种构建 **置信区间** 的方法，在重复的样本中，有 95% 的时间包含真实的参数。
- en: '***Constructing Confidence Intervals***'
  id: totrans-98
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '***构建置信区间***'
- en: '***Using this result, we can write the 95% confidence interval for \(p\) as:'
  id: totrans-99
  prefs: []
  type: TYPE_NORMAL
  zh: '***使用这个结果，我们可以写出 \(p\) 的 95% 置信区间如下：***'
- en: \[ \left[\bar{X} - 1.96,\widehat{\mathrm{SE}}[\bar{X}], , \bar{X} + 1.96,\widehat{\mathrm{SE}}[\bar{X}]\right].
    \]
  id: totrans-100
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \left[\bar{X} - 1.96,\widehat{\mathrm{SE}}[\bar{X}], , \bar{X} + 1.96,\widehat{\mathrm{SE}}[\bar{X}]\right].
    \]
- en: 'The endpoints of this interval are not fixed numbers—they depend on the data.
    Each time we take a new sample, we obtain a new \(\bar{X}\) and therefore a new
    confidence interval. To see this, we can repeat the sampling process using the
    same parameters as before:'
  id: totrans-101
  prefs: []
  type: TYPE_NORMAL
  zh: 该区间的端点不是固定的数字——它们取决于数据。每次我们取一个新的样本，我们就会得到一个新的 \(\bar{X}\) 和一个新的置信区间。为了看到这一点，我们可以使用之前相同的参数重复抽样过程：
- en: '[PRE4]'
  id: totrans-102
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: '*If you run this code several times, you’ll see that the interval changes from
    run to run due to random sampling variation.'
  id: totrans-103
  prefs: []
  type: TYPE_NORMAL
  zh: '*如果你多次运行此代码，你会看到由于随机抽样变化，区间会从一次运行到下一次运行而变化。'
- en: 'The definition of a 95% confidence interval is that, over many repetitions
    of this process, about 95% of the intervals constructed in this way will contain
    the true value of \(p\). Mathematically:'
  id: totrans-104
  prefs: []
  type: TYPE_NORMAL
  zh: 95% 置信区间的定义是，在多次重复此过程的情况下，大约 95% 的以这种方式构建的区间将包含 \(p\) 的真实值。从数学上讲：
- en: \[ \Pr\left(p \in \left[\bar{X} - 1.96 ,\widehat{\mathrm{SE}}[\bar{X}], \bar{X}
    + 1.96,\widehat{\mathrm{SE}}[\bar{X}]\right]\right) = 0.95. \]
  id: totrans-105
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \Pr\left(p \in \left[\bar{X} - 1.96 ,\widehat{\mathrm{SE}}[\bar{X}], \bar{X}
    + 1.96,\widehat{\mathrm{SE}}[\bar{X}]\right]\right) = 0.95. \]
- en: '*Confidence intervals are not unique. We can construct other intervals that
    also have 95 percent coverage for \(p\). For example, approaches that avoid going
    past 0 or 1 when \(\bar{X}\) is close to 0 or 1.'
  id: totrans-106
  prefs: []
  type: TYPE_NORMAL
  zh: '*置信区间不是唯一的。我们可以构建其他也有 95% 覆盖率的 \(p\) 的区间。例如，当 \(\bar{X}\) 接近 0 或 1 时，避免超过 0
    或 1 的方法。'
- en: The 95 percent confidence interval we derived is symmetric around \(\bar{X}\)
    and, under standard assumptions, is the shortest interval for which the probability
    of containing \(p\) is 95 percent. For a discussion of alternative intervals and
    their properties, see the recommended reading section.*  *If we want a different
    confidence level, say 99%, we adjust the multiplier. The value \(z\) is determined
    by
  id: totrans-107
  prefs: []
  type: TYPE_NORMAL
  zh: 我们推导出的 95% 置信区间在 \(\bar{X}\) 两侧是对称的，并且在标准假设下，是包含 \(p\) 的概率为 95% 的最短区间。关于替代区间及其属性的讨论，请参阅推荐阅读部分。*
    *如果我们想得到不同的置信水平，例如 99%，我们调整乘数。值 \(z\) 由
- en: \[ \Pr(-z \leq Z \leq z) = 1 - \alpha, \]
  id: totrans-108
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \Pr(-z \leq Z \leq z) = 1 - \alpha, \]
- en: 'which in R can be computed as:'
  id: totrans-109
  prefs: []
  type: TYPE_NORMAL
  zh: 在 R 中，这可以计算为：
- en: '[PRE5]'
  id: totrans-110
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: '*For example, `qnorm(0.975)` gives 1.96 for a 95% confidence interval, and
    `qnorm(0.995)` gives 2.58 for a 99% interval.******'
  id: totrans-111
  prefs: []
  type: TYPE_NORMAL
  zh: '*例如，`qnorm(0.975)` 对于 95% 的置信区间给出 1.96，而 `qnorm(0.995)` 对于 99% 的区间给出 2.58。******'
- en: '*****A Monte Carlo Simulation*****'
  id: totrans-112
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '*****蒙特卡洛模拟*****'
- en: '*****We can verify that the intervals we construct have the desired probability
    of including \(p\) using a Monte Carlo simulation. By repeatedly drawing samples
    and constructing confidence intervals, we can check how often the intervals actually
    contain the true value of \(p\).'
  id: totrans-113
  prefs: []
  type: TYPE_NORMAL
  zh: '*****我们可以通过蒙特卡洛模拟验证我们构建的区间具有包含 \(p\) 的所需概率。通过反复抽取样本并构建置信区间，我们可以检查区间实际上包含 \(p\)
    的真实值的频率。'
- en: '[PRE6]'
  id: totrans-114
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: '*As expected, the interval covers \(p\) about 95% of the time.'
  id: totrans-115
  prefs: []
  type: TYPE_NORMAL
  zh: '*正如预期的那样，区间大约有 95% 的时间覆盖 \(p\)。'
- en: The plot below shows the first 100 simulated confidence intervals. Each horizontal
    line represents one interval, and the black vertical line marks the true proportion
    \(p\). Roughly 95% of the intervals overlap the line, while about 5% miss it,
    exactly as predicted.
  id: totrans-116
  prefs: []
  type: TYPE_NORMAL
  zh: 下面的图显示了前 100 个模拟的置信区间。每一条水平线代表一个区间，黑色垂直线标记的是真实比例 \(p\)。大约 95% 的区间与这条线重叠，而大约
    5% 的区间没有重叠，正如预测的那样。
- en: '![](../Images/1625dadfa9d4a3525b69e57a0de526db.png)'
  id: totrans-117
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/1625dadfa9d4a3525b69e57a0de526db.png)'
- en: '*When applying this theory, remember that the *intervals* are random, not \(p\).
    The confidence level refers to the procedure, not to a probability about \(p\)
    itself.*******'
  id: totrans-118
  prefs: []
  type: TYPE_NORMAL
  zh: '*在应用此理论时，请记住，*区间*是随机的，不是 \(p\)。置信水平指的是程序，而不是关于 \(p\) 本身的概率。*******'
- en: '*****Margin of Error*****'
  id: totrans-119
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '*****误差范围*****'
- en: '*****Margins of error are closely related to confidence intervals. The connection
    is simple: the *margin of error* is the amount added to and subtracted from the
    estimate to form a confidence interval.'
  id: totrans-120
  prefs: []
  type: TYPE_NORMAL
  zh: '*****误差范围与置信区间密切相关。联系很简单：*误差范围*是加到和从估计值中减去的量，以形成置信区间。'
- en: For polls, the margin of error is given by
  id: totrans-121
  prefs: []
  type: TYPE_NORMAL
  zh: 对于民意调查，误差范围由
- en: \[ z \times \sqrt{\bar{X}(1-\bar{X}) / N}. \]
  id: totrans-122
  prefs: []
  type: TYPE_NORMAL
  zh: \[ z \times \sqrt{\bar{X}(1-\bar{X}) / N}. \]
- en: For a 95 percent confidence interval, this corresponds to using \(z = 1.96\).
    Increasing the confidence level or decreasing the sample size both make the margin
    of error larger, while larger samples produce smaller margins of error.
  id: totrans-123
  prefs: []
  type: TYPE_NORMAL
  zh: 对于 95% 的置信区间，这相当于使用 \(z = 1.96\)。提高置信水平或减少样本量都会使误差范围更大，而较大的样本会产生更小的误差范围。
- en: In practice, pollsters almost always report 95 percent confidence intervals.
    Unless otherwise stated, you should assume that the reported margin of error is
    based on this level of confidence. Results are typically presented as “estimate
    ± margin of error.” For example, if \(\bar{X} = 0.52\) with a margin of error
    of \(0.03\), the result would be reported as “52% ± 3%”*****
  id: totrans-124
  prefs: []
  type: TYPE_NORMAL
  zh: 在实践中，民意调查员几乎总是报告95%的置信区间。除非另有说明，否则应假定报告的误差范围基于此置信水平。结果通常以“估计 ± 误差范围”的形式呈现。例如，如果\(\bar{X}
    = 0.52\)，误差范围为\(0.03\)，结果将报告为“52% ± 3%”*****
- en: '*****Why Not Just Run a Huge Poll?*****'
  id: totrans-125
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '*****为什么不只进行一次大规模民意调查？*****'
- en: '*****If we surveyed 100,000 people, the margin of error would shrink to less
    than 0.3%. In principle, we can make the margin of error as small as we want by
    increasing \(N\).'
  id: totrans-126
  prefs: []
  type: TYPE_NORMAL
  zh: '*****如果我们调查了10万人，误差范围将缩小到小于0.3%。原则上，我们可以通过增加\(N\)来使误差范围尽可能小。'
- en: In practice, however, polling is limited not only by cost but also by *bias*.
    Real-world polls are rarely simple random samples. Some people do not respond,
    others misreport their preferences, and defining the population (for example,
    registered voters versus likely voters) is not straightforward.
  id: totrans-127
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，在实践中，民意调查不仅受成本限制，还受*偏差*的影响。现实世界的民意调查很少是简单的随机样本。有些人不回应，其他人错误地报告了他们的偏好，而定义人口（例如，注册选民与可能选民）并不简单。
- en: These imperfections introduce systematic errors that the margin of error does
    not capture. Historically, U.S. popular-vote polls have shown biases of about
    2–3%. Understanding and modeling these biases is an essential part of modern election
    forecasting, a topic we return to in [Chapter 10](models.html).*********
  id: totrans-128
  prefs: []
  type: TYPE_NORMAL
  zh: 这些不完美之处引入了系统误差，而误差范围无法捕捉到。历史上，美国民调显示偏差约为2-3%。理解和模拟这些偏差是现代选举预测的重要组成部分，我们将在第10章中再次回到这个话题。*********
- en: '*****9.5 Exercises*****'
  id: totrans-129
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '*****9.5 练习题*****'
- en: '*****1\. Suppose you poll a population in which a proportion \(p\) of voters
    are Democrats and \(1-p\) are Republicans. Your sample size is \(N=25\). Consider
    the random variable \(S\), which is the total number of Democrats in your sample.
    What is the expected value of this random variable? Hint: It’s a function of \(p\).'
  id: totrans-130
  prefs: []
  type: TYPE_NORMAL
  zh: '*****1\. 假设你在调查一个选民群体，其中比例\(p\)的选民是民主党人，\(1-p\)是共和党人。你的样本大小是\(N=25\)。考虑随机变量\(S\)，它是你样本中民主党人的总数。这个随机变量的期望值是多少？提示：它是\(p\)的函数。'
- en: '2\. What is the standard error of \(S\) ? Hint: It’s a function of \(p\).'
  id: totrans-131
  prefs: []
  type: TYPE_NORMAL
  zh: 2\. \(S\)的标准误差是多少？提示：它是\(p\)的函数。
- en: '3\. Consider the random variable \(S/N\). This is equivalent to the sample
    average, which we have been denoting as \(\bar{X}\). What is the expected value
    of the \(\bar{X}\)? Hint: It’s a function of \(p\).'
  id: totrans-132
  prefs: []
  type: TYPE_NORMAL
  zh: 3\. 考虑随机变量\(S/N\)。这相当于样本平均值，我们一直用\(\bar{X}\)表示。\(\bar{X}\)的期望值是多少？提示：它是\(p\)的函数。
- en: '4\. What is the standard error of \(\bar{X}\)? Hint: It’s a function of \(p\).'
  id: totrans-133
  prefs: []
  type: TYPE_NORMAL
  zh: 4\. \(\bar{X}\)的标准误差是多少？提示：它是\(p\)的函数。
- en: 5\. Write a line of code that gives you the standard error \(\mathrm{SE}[\bar{X}]\)
    for problem 4 for several values of \(p\), specifically for `p <- seq(0, 1, length
    = 100)`. Make a plot of \(\mathrm{SE}[\bar{X}]\) versus `p`.
  id: totrans-134
  prefs: []
  type: TYPE_NORMAL
  zh: 5\. 编写一行代码，给出问题4中对于\(p <- seq(0, 1, length = 100)\)的几个值的\(\mathrm{SE}[\bar{X}]\)，并绘制\(\mathrm{SE}[\bar{X}]\)与\(p\)的图表。
- en: 6\. Copy the code from your solution to 5 and put it inside a for-loop to make
    three plots, one for \(N=25\), \(N=100\), and \(N=1,000\).
  id: totrans-135
  prefs: []
  type: TYPE_NORMAL
  zh: 6\. 将问题5中的代码复制到for循环中，制作三个图表，分别对应\(N=25\)、\(N=100\)和\(N=1,000\)。
- en: 7\. If we are interested in the difference in proportions, \(\theta = p - (1-p)\),
    our estimate is \(\hat{\theta} = \bar{X} - (1-\bar{X}) = 2\bar{X}-1\). Use the
    rules we learned about scaled random variables to derive the expected value of
    \(\hat{\theta}\).
  id: totrans-136
  prefs: []
  type: TYPE_NORMAL
  zh: 7\. 如果我们关注比例的差异，\(\theta = p - (1-p)\)，我们的估计是\(\hat{\theta} = \bar{X} - (1-\bar{X})
    = 2\bar{X}-1\)。使用我们关于缩放随机变量的规则来推导\(\hat{\theta}\)的期望值。
- en: 8\. What is the standard error of \(\hat{\theta}\)?
  id: totrans-137
  prefs: []
  type: TYPE_NORMAL
  zh: 8\. \(\hat{\theta}\)的标准误差是多少？
- en: 9\. If \(p=.45\), it means the Republicans are winning by a relatively large
    margin, since \(\theta = -.1\), which is a 10% margin of victory. In this case,
    what is the standard error of \(\hat{\theta} = 2\bar{X}-1\) if we take a sample
    of \(N=25\)?
  id: totrans-138
  prefs: []
  type: TYPE_NORMAL
  zh: 9\. 如果\(p=0.45\)，这意味着共和党人以相对较大的优势获胜，因为\(\theta = -0.1\)，这是一个10%的胜利范围。在这种情况下，如果我们抽取\(N=25\)的样本，\(\hat{\theta}
    = 2\bar{X}-1\)的标准误差是多少？
- en: 10\. Given the answer to exercise 9, which of the following best describes your
    strategy of using a sample size of \(N=25\)?
  id: totrans-139
  prefs: []
  type: TYPE_NORMAL
  zh: 10\. 基于练习9的答案，以下哪个选项最能描述你使用样本大小\(N=25\)的策略？
- en: The expected value of our estimate \(2\bar{X}-1\) is \(\theta\), so our prediction
    will be accurate.
  id: totrans-140
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我们估计 \(2\bar{X}-1\) 的期望值是 \(\theta\)，因此我们的预测将是准确的。
- en: Our standard error is almost as large as the observed difference, so the chances
    of \(2\bar{X}-1\) representing a large margin are not small even when \(p=0.5\).
    We should use a larger sample size.
  id: totrans-141
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我们的标准误差几乎与观察到的差异一样大，所以即使 \(p=0.5\)，\(2\bar{X}-1\) 代表一个大的差距的可能性也不小。我们应该使用更大的样本量。
- en: The difference is 10% and the standard error is about 0.1, therefore much smaller
    than the difference.
  id: totrans-142
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 差异是 10%，标准误差大约是 0.1，因此远小于差异。
- en: Because we don’t know \(p\), we have no way of knowing that making \(N\) larger
    would actually improve our standard error.
  id: totrans-143
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 由于我们不知道 \(p\)，我们无法知道增加 \(N\) 的数量实际上是否会改善我们的标准误差。
- en: 11\. Write an *urn model* function that takes the proportion of Democrats \(p\)
    and the sample size \(N\) as arguments, and returns the sample average if Democrats
    are 1s and Republicans are 0s. Call the function `take_sample`.
  id: totrans-144
  prefs: []
  type: TYPE_NORMAL
  zh: 11. 编写一个*抽屉模型*函数，该函数接受比例 \(p\) 和样本量 \(N\) 作为参数，并返回民主党为 1 和共和党为 0 的样本平均值。调用该函数为
    `take_sample`。
- en: '12\. Now assume `p <- 0.45` and that your sample size is \(N=100\). Take a
    sample 10,000 times and save the vector of `mean(X) - p` into an object called
    `errors`. Hint: Use the function you wrote for exercise 11 to write this in one
    line of code.'
  id: totrans-145
  prefs: []
  type: TYPE_NORMAL
  zh: 12. 现在假设 `p <- 0.45` 并且你的样本量是 \(N=100\)。进行 10,000 次抽样，并将 `mean(X) - p` 的向量保存到名为
    `errors` 的对象中。提示：使用你为练习 11 编写的函数，用一行代码来完成这个操作。
- en: 13\. The vector `errors` contains, for each simulated sample, the difference
    between the our estimate \(\bar{X}\) and the actual \(p\). We refer to this difference
    as the *error*. Compute the average and make a histogram of the errors generated
    in the Monte Carlo simulation,
  id: totrans-146
  prefs: []
  type: TYPE_NORMAL
  zh: 13. 向量 `errors` 包含了对于每个模拟样本，我们的估计 \(\bar{X}\) 与实际 \(p\) 之间的差异。我们称这个差异为*误差*。计算误差的平均值，并绘制蒙特卡洛模拟中生成的误差的直方图。
- en: '[PRE7]'
  id: totrans-147
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: '*and select which of the following best describes their distributions:'
  id: totrans-148
  prefs: []
  type: TYPE_NORMAL
  zh: '*并选择以下哪个最能描述它们的分布：'
- en: The errors are all about 0.05.
  id: totrans-149
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 误差都在大约 0.05。
- en: The errors are all about -0.05.
  id: totrans-150
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 误差都在大约 -0.05。
- en: The errors are symmetrically distributed around 0.
  id: totrans-151
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 误差在 0 的周围对称分布。
- en: The errors range from -1 to 1.
  id: totrans-152
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 误差的范围从 -1 到 1。
- en: 14\. Note that the error \(\bar{X}-p\) is a random variable. In practice, the
    error is not observed because we do not know \(p\). Here, we observe it since
    we constructed the simulation. What is the average size of the error if we define
    the size by taking the absolute value \(\mid \bar{X} - p \mid\)?
  id: totrans-153
  prefs: []
  type: TYPE_NORMAL
  zh: 14. 注意，误差 \(\bar{X}-p\) 是一个随机变量。在实践中，由于我们不知道 \(p\)，我们无法观察到误差。在这里，我们观察到它，因为我们构建了模拟。如果我们通过取绝对值
    \(\mid \bar{X} - p \mid\) 来定义大小，误差的平均大小是多少？
- en: 15\. The standard error is related to the typical **size** of the error we make
    when predicting. For mathematical reasons related to the Central Limit Theorem,
    we actually use the standard deviation of `errors`, rather than the average of
    the absolute values, to quantify the typical size. What is this standard deviation
    of the errors?
  id: totrans-154
  prefs: []
  type: TYPE_NORMAL
  zh: 15. 标准误差与我们在预测时犯错的典型**大小**相关。由于与中心极限定理相关的数学原因，我们实际上使用`errors`的标准差，而不是绝对值的平均值，来量化典型大小。这个误差的标准差是多少？
- en: 16\. The theory we just learned tells us what this standard deviation is going
    to be because \(\mathrm{SE}[\bar{X}-p]=\mathrm{SE}[\bar{X}]\) and we showed how
    to compute this. What does theory tell us is the standard error \(\mathrm{SE}[\bar{X}-p]\)
    is for a sample size of 100?
  id: totrans-155
  prefs: []
  type: TYPE_NORMAL
  zh: 16. 我们刚刚学到的理论告诉我们这个标准差将会是多少，因为 \(\mathrm{SE}[\bar{X}-p]=\mathrm{SE}[\bar{X}]\)，我们也展示了如何计算这个值。理论告诉我们对于样本量为
    100 的标准误差 \(\mathrm{SE}[\bar{X}-p]\) 是多少？
- en: 17\. In practice, we don’t know \(p\), so we construct an estimate of the theoretical
    prediction by plugging in \(\bar{X}\) for \(p\). Compute this estimate. Set the
    seed at 1 with `set.seed(1)`.
  id: totrans-156
  prefs: []
  type: TYPE_NORMAL
  zh: 17. 在实践中，我们不知道 \(p\)，所以我们通过将 \(\bar{X}\) 代入 \(p\) 来构建理论预测的估计。计算这个估计。使用 `set.seed(1)`
    将种子设置为 1。
- en: 18\. Note how close the standard error estimates obtained from the Monte Carlo
    simulation (exercise 15), the theoretical prediction (exercise 16), and the estimate
    of the theoretical prediction (exercise 17) are. The theory is working and it
    gives us a practical approach to knowing the typical error we will make if we
    predict \(p\) with \(\bar{X}\). Another advantage that the theoretical result
    provides is that it gives an idea of how large a sample size is required to obtain
    the precision we need. Earlier, we learned that the largest standard errors occur
    for \(p=0.5\). Create a plot of the largest standard error for \(N\) ranging from
    100 to 5,000\. Based on this plot, how large does the sample size have to be to
    have a standard error of about 1%?
  id: totrans-157
  prefs: []
  type: TYPE_NORMAL
  zh: 18. 注意从蒙特卡洛模拟（练习 15）、理论预测（练习 16）和理论预测估计（练习 17）中获得的标准误差估计是多么接近。理论是有效的，它为我们提供了一个了解如果我们用
    \(\bar{X}\) 预测 \(p\) 时将犯的典型误差的实际方法。理论结果提供的另一个优点是，它给出了一个关于需要多大样本量才能获得所需精度的概念。早些时候，我们了解到最大的标准误差发生在
    \(p=0.5\) 时。创建一个从 100 到 5,000 的 \(N\) 范围内最大标准误差的图表。根据这个图表，样本量需要多大才能使标准误差约为 1%？
- en: '100'
  id: totrans-158
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '100'
- en: '500'
  id: totrans-159
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '500'
- en: 2,500
  id: totrans-160
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 2,500
- en: 4,000
  id: totrans-161
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 4,000
- en: '19\. For sample size \(N=100\), the Central Limit Theorem tells us that the
    distribution of \(\bar{X}\) is:'
  id: totrans-162
  prefs: []
  type: TYPE_NORMAL
  zh: 19. 对于样本量 \(N=100\)，中心极限定理告诉我们 \(\bar{X}\) 的分布是：
- en: practically equal to \(p\).
  id: totrans-163
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 实际上等于 \(p\)。
- en: approximately normal with expected value \(p\) and standard error \(\sqrt{p(1-p)/N}\).
  id: totrans-164
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 大约呈正态分布，期望值为 \(p\)，标准误差为 \(\sqrt{p(1-p)/N}\)。
- en: approximately normal with expected value \(\bar{X}\) and standard error \(\sqrt{\bar{X}(1-\bar{X})/N}\).
  id: totrans-165
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 大约呈正态分布，期望值为 \(\bar{X}\)，标准误差为 \(\sqrt{\bar{X}(1-\bar{X})/N}\)。
- en: not a random variable.
  id: totrans-166
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 不是一个随机变量。
- en: '20\. Based on the answer from exercise 18, the error \(\bar{X} - p\) is:'
  id: totrans-167
  prefs: []
  type: TYPE_NORMAL
  zh: 20. 根据练习 18 的答案，误差 \(\bar{X} - p\) 是：
- en: practically equal to 0.
  id: totrans-168
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 实际上等于 0。
- en: approximately normal with expected value \(0\) and standard error \(\sqrt{p(1-p)/N}\).
  id: totrans-169
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 大约呈正态分布，期望值为 \(0\)，标准误差为 \(\sqrt{p(1-p)/N}\)。
- en: approximately normal with expected value \(p\) and standard error \(\sqrt{p(1-p)/N}\).
  id: totrans-170
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 大约呈正态分布，期望值为 \(p\)，标准误差为 \(\sqrt{p(1-p)/N}\)。
- en: not a random variable.
  id: totrans-171
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 不是一个随机变量。
- en: 21\. To corroborate your answer to exercise 19, make a qqplot of the `errors`
    you generated in exercise 12 to see if they follow a normal distribution.
  id: totrans-172
  prefs: []
  type: TYPE_NORMAL
  zh: 21. 为验证你对练习 19 的答案，绘制你在练习 12 中生成的 `errors` 的 qqplot，以查看它们是否遵循正态分布。
- en: 22\. Define \(p=0.45\) and \(N=100\) as in exercise 12\. Then use the CLT to
    estimate the probability that \(\bar{X}>0.5\). Assume you know \(p=0.45\) for
    this calculation.
  id: totrans-173
  prefs: []
  type: TYPE_NORMAL
  zh: 22. 定义 \(p=0.45\) 和 \(N=100\)，如练习 12 中所述。然后使用 CLT 估计 \(\bar{X}>0.5\) 的概率。假设你为此计算知道
    \(p=0.45\)。
- en: 23\. Assume you are in a practical situation and you don’t know \(p\). Take
    a sample of size \(N=100\) and obtain a sample average of \(\bar{X} = 0.51\).
    What is the CLT approximation for the probability that your error is equal to
    or larger than 0.01?
  id: totrans-174
  prefs: []
  type: TYPE_NORMAL
  zh: 23. 假设你处于实际情况下，你不知道 \(p\)。取一个样本量 \(N=100\) 的样本，并得到样本平均数 \(\bar{X} = 0.51\)。你的误差等于或大于
    0.01 的概率的 CLT 近似值是多少？
- en: For the next exercises, we will use actual polls from the 2016 election included
    in the **dslabs** package. Specifically, we will use all the national polls that
    ended within one week prior to the election.
  id: totrans-175
  prefs: []
  type: TYPE_NORMAL
  zh: 在接下来的练习中，我们将使用包含在 **dslabs** 包中的 2016 年选举的实际民调。具体来说，我们将使用选举前一周结束的所有全国民调。
- en: '[PRE8]'
  id: totrans-176
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: '*24\. For the first poll, you can obtain the samples size and estimated Clinton
    percentage with:'
  id: totrans-177
  prefs: []
  type: TYPE_NORMAL
  zh: '*24. 对于第一份民调，你可以获得样本量和估计的克林顿百分比：'
- en: '[PRE9]'
  id: totrans-178
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: '*Assume there are only two candidates and construct a 95% confidence interval
    for the election night proportion \(p\) of Clinton voters.'
  id: totrans-179
  prefs: []
  type: TYPE_NORMAL
  zh: '*假设只有两位候选人，构建选举之夜克林顿选民比例 \(p\) 的 95% 置信区间。'
- en: '25\. Add a confidence interval as two columns, call them `lower` and `upper`,
    to the object `polls`. Then show the `pollster`, `enddate`, `x_hat`,`lower`, `upper`
    variables. Hint: Define temporary columns `x_hat` and `se_hat`.'
  id: totrans-180
  prefs: []
  type: TYPE_NORMAL
  zh: 25. 在 `polls` 对象中添加置信区间作为两列，分别称为 `lower` 和 `upper`，然后展示 `pollster`、`enddate`、`x_hat`、`lower`、`upper`
    变量。提示：定义临时列 `x_hat` 和 `se_hat`。
- en: 26\. The final tally for the popular vote was Clinton 48.2% and Trump 46.1%.
    Add a column, call it `hit`, to the previous table stating if the confidence interval
    included the true proportion \(p=0.482\) or not.
  id: totrans-181
  prefs: []
  type: TYPE_NORMAL
  zh: 26. 选举人票的最终计票结果是克林顿 48.2%，特朗普 46.1%。在之前的表格中添加一列，称为 `hit`，说明置信区间是否包含真实比例 \(p=0.482\)。
- en: 27\. For the table you just created, what proportion of confidence intervals
    included \(p\)?
  id: totrans-182
  prefs: []
  type: TYPE_NORMAL
  zh: 27. 对于你刚刚创建的表格，有多少比例的置信区间包含了 \(p\)？
- en: 28\. If these confidence intervals are constructed correctly, and the theory
    holds up, what proportion should include \(p\)?
  id: totrans-183
  prefs: []
  type: TYPE_NORMAL
  zh: 28. 如果这些置信区间构建正确，并且理论成立，那么应该有多少比例包含\(p\)？
- en: 29\. A much smaller proportion of the polls than expected produce confidence
    intervals containing \(p\). If you look closely at the table, you will see that
    most polls that fail to include \(p\) are underestimating. The main reason for
    this is undecided voters, individuals polled that do not yet know who they will
    vote for or do not want to say. Because, historically, undecideds divide close
    to evenly between the two main candidates on election day, it is more informative
    to estimate the spread or the difference between the proportion of two candidates,
    we will denote tit with \(\theta\), which in this election was \(0\. 482 - 0.461
    = 0.021\). Assume that there are only two parties and that \(\theta = 2p - 1\).
    Redefine `polls` as below and re-do exercise 15, but for the difference.
  id: totrans-184
  prefs: []
  type: TYPE_NORMAL
  zh: 29. 与预期相比，只有极少数的民调产生了包含\(p\)的置信区间。如果你仔细查看表格，你会看到大多数未能包含\(p\)的民调都是低估的。主要原因是不确定的选民，即那些尚未决定他们将投票给谁或不想说的人。因为，从历史上看，不确定的选民在选举日几乎平均分配在两个主要候选人之间，因此估计两个候选人比例的差距或差异更有信息量，我们将用\(\theta\)表示它，在本届选举中为\(0.482
    - 0.461 = 0.021\)。假设只有两个政党，且\(\theta = 2p - 1\)。重新定义`polls`如下，并重新做练习15，但针对差异。
- en: '[PRE10]'
  id: totrans-185
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: '*30\. Now repeat exercise 26, but for the difference.'
  id: totrans-186
  prefs: []
  type: TYPE_NORMAL
  zh: '*30. 现在重复练习26，但针对差异进行。'
- en: 31\. Now repeat exercise 27, but for the difference.
  id: totrans-187
  prefs: []
  type: TYPE_NORMAL
  zh: 31. 现在重复练习27，但针对差异进行。
- en: 32\. Although the proportion of confidence intervals increases substantially,
    it is still lower than 0.95\. In the next chapter, we learn the reason for this.
    To motivate this, make a plot of the error, the difference between each poll’s
    estimate and the actual \(\theta=0.021\). Stratify by pollster.
  id: totrans-188
  prefs: []
  type: TYPE_NORMAL
  zh: 32. 尽管置信区间的比例大幅增加，但仍然低于0.95。在下一章中，我们将学习这种差异的原因。为了激发这一思考，绘制一个误差图，展示每个民调估计值与实际\(\theta=0.021\)之间的差异。按民调机构进行分层。
- en: 33\. Redo the plot that you made for exercise 32, but only for pollsters that
    took five or more polls.*********
  id: totrans-189
  prefs: []
  type: TYPE_NORMAL
  zh: 33. 重新绘制你在练习32中制作的图表，但仅针对进行了五次或更多民调的民调机构。
