- en: Concentration Inequalities and Confidence intervals[¶](#concentration-inequalities-and-confidence-intervals
    "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: We’ve seen many times that if we have an estimator <semantics><mrow><mover accent="true"><mi>θ</mi><mo>^</mo></mover></mrow><annotation
    encoding="application/x-tex">\hat{\theta}</annotation></semantics>θ^, we can construct
    a confidence interval for that estimator by using the distribution of <semantics><mrow><mover
    accent="true"><mi>θ</mi><mo>^</mo></mover></mrow><annotation encoding="application/x-tex">\hat{\theta}</annotation></semantics>θ^.
    Up until now, we’ve relied on either the bootstrap, computing the distribution
    exactly, or using the Central Limit Theorem to approximate it.
  prefs: []
  type: TYPE_NORMAL
- en: 'But, all of the methods we just discussed are applicable to any random variable!
    So, we could use any of them to construct a confidence interval for an estimator
    <semantics><mrow><mover accent="true"><mi>θ</mi><mo>^</mo></mover></mrow><annotation
    encoding="application/x-tex">\hat{\theta}</annotation></semantics>θ^, especially
    if that estimator is a sample mean (but often even if it isn’t). While the other
    approaches are perfectly valid, there are often cases where we might prefer a
    confidence interval from concentration inequalities instead:'
  prefs: []
  type: TYPE_NORMAL
- en: '*Why concentration inequalities over computing the distribution exactly?* As
    we’ve already discussed, in many cases, we many not know the distribution of our
    random variables exactly, and computing the distribution exactly may not be feasible.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '*Why concentration inequalities over bootstrap?* Using the bootstrap requires
    us to observe data and use that data to generate bootstrap resamples. In some
    cases, if we want to show a theoretical confidence interval before observing any
    data, it’s useful to use concentration inequalities.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '*Why concentration inequalities over the Central Limit Theorem?* As we’ve already
    discussed, the Central Limit Theorem only applies for large values of <semantics><mrow><mi>n</mi></mrow><annotation
    encoding="application/x-tex">n</annotation></semantics>n, while the results we’ve
    derived here are applicable for any value of <semantics><mrow><mi>n</mi></mrow><annotation
    encoding="application/x-tex">n</annotation></semantics>n, and for any shape of
    distribution.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '[PRE13]'
