- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: '*Throughout this section, we’ll need to be a bit more precise, so we’ll use
    uppercase letters to represent random variables, and lowercase letters to represent
    the values they take on.*'
  prefs: []
  type: TYPE_NORMAL
- en: '*You may find it helpful to review Sections [12.3](https://data140.org/textbook/content/Chapter_12/03_Bounds.html)
    and [19.4](https://data140.org/textbook/content/Chapter_19/04_Chernoff_Bound.html)
    of the Data 140 textbook.*'
  prefs: []
  type: TYPE_NORMAL
- en: Motivation and Introduction[¶](#motivation-and-introduction "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: What is a Concentration Inequality?[¶](#what-is-a-concentration-inequality "Link
    to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Concentration inequalities provide a way to quantify how likely a random variable
    is to be in the **tail** of its distribution (that is, the parts of the distribution
    on the far ends, away from the mean). We often will write these inequalities involving
    the distance between a random variable <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X and its mean <semantics><mrow><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">E[X]</annotation></semantics>E[X]. For example, consider
    the following inequality:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi mathvariant="normal">∣</mi><mi>X</mi><mo>−</mo><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo><mi mathvariant="normal">∣</mi><mo>≥</mo><mi>t</mi><mo
    stretchy="false">)</mo><mo>≤</mo><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">P(|X-E[X]|\geq
    t) \leq \epsilon</annotation></semantics>P(∣X−E[X]∣≥t)≤ϵ[(1)](#fwTMcM95sS "Link
    to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: This looks at the distance between random variable <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X and its mean <semantics><mrow><mi>E</mi><mo
    stretchy="false">[</mo><mi>x</mi><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">E[x]</annotation></semantics>E[x], and says that
    the probability of that distance being large (specifically, larger than some threshold
    <semantics><mrow><mi>t</mi></mrow><annotation encoding="application/x-tex">t</annotation></semantics>t)
    is small (specifically, smaller than some value <semantics><mrow><mi>δ</mi></mrow><annotation
    encoding="application/x-tex">\delta</annotation></semantics>δ).
  prefs: []
  type: TYPE_NORMAL
- en: 'Such inequalities are useful in understanding the behavior of arbitrary random
    variables, as well as algorithms that use random variables. For example, consider
    a sample of i.i.d. random variables <semantics><mrow><msub><mi>X</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>X</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">X_1, \ldots, X_n</annotation></semantics>X1​,…,Xn​,
    and their sample mean:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>Y</mi><mo>=</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">Y = \frac{1}{n} \sum_i X_i</annotation></semantics>Y=n1​i∑​Xi​[(2)](#xvbZ4pKxMw
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'If we’re using <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    to estimate the mean of <semantics><mrow><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">X_i</annotation></semantics>Xi​, then we can already
    guarantee that the average value of <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y will be the correct answer:
    <semantics><mrow><mi>E</mi><mo stretchy="false">[</mo><mi>Y</mi><mo stretchy="false">]</mo><mo>=</mo><mi>E</mi><mrow><mo
    fence="true">[</mo><mo stretchy="false">(</mo><mn>1</mn><mi mathvariant="normal">/</mi><mi>n</mi><mo
    stretchy="false">)</mo><msub><mo>∑</mo><mi>i</mi></msub><msub><mi>X</mi><mi>i</mi></msub><mo
    fence="true">]</mo></mrow><mo>=</mo><mi>E</mi><mo stretchy="false">[</mo><msub><mi>X</mi><mi>i</mi></msub><mo
    stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">E[Y] =
    E\left[(1/n) \sum_i X_i\right] = E[X_i]</annotation></semantics>E[Y]=E[(1/n)∑i​Xi​]=E[Xi​].
    But this statement doesn’t tell us anything about our chance of being far off
    from the correct answer. Is it possible that <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y could be very far away
    from <semantics><mrow><mi>E</mi><mo stretchy="false">[</mo><msub><mi>X</mi><mi>i</mi></msub><mo
    stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">E[X_i]</annotation></semantics>E[Xi​]?
    How likely is such a thing to happen?'
  prefs: []
  type: TYPE_NORMAL
- en: 'Concentration inequalities provide the answers to such questions: if we can
    guarantee that'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi mathvariant="normal">∣</mi><mi>Y</mi><mo>−</mo><mi>E</mi><mo
    stretchy="false">[</mo><msub><mi>X</mi><mi>i</mi></msub><mo stretchy="false">]</mo><mi
    mathvariant="normal">∣</mi><mo>≥</mo><mi>t</mi><mo stretchy="false">)</mo><mo>≤</mo><mi>ϵ</mi><mo
    separator="true">,</mo></mrow><annotation encoding="application/x-tex">P(|Y -
    E[X_i]| \geq t) \leq \epsilon,</annotation></semantics>P(∣Y−E[Xi​]∣≥t)≤ϵ,[(3)](#j5RUcHETzW
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'then we can have more confidence in our result. Suppose that the above statement
    holds for <semantics><mrow><mi>t</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">t=1</annotation></semantics>t=1
    and <semantics><mrow><mi>ϵ</mi><mo>=</mo><mn>0.01</mn></mrow><annotation encoding="application/x-tex">\epsilon=0.01</annotation></semantics>ϵ=0.01.
    Then we can clearly state “<semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    is very likely to be within 1 of the true mean <semantics><mrow><mi>E</mi><mo
    stretchy="false">[</mo><msub><mi>X</mi><mi>i</mi></msub><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">E[X_i]</annotation></semantics>E[Xi​]: the probability
    that it’s further away is less than <semantics><mrow><mn>1</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">1\%</annotation></semantics>1%.”'
  prefs: []
  type: TYPE_NORMAL
- en: If the <semantics><mrow><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">X_i</annotation></semantics>Xi​ are drawn from a
    well-known distribution such as the Gaussian, binomial, Poisson, etc., then we
    can compute such probabilities exactly, and we have no need for a concentration
    inequality. These inequalities are useful when we have less information about
    a random variable, and we want to make strong statements that hold **regardless
    of the specific distribution**.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: The inequality above is a two-sided inequality, because it looks at both the
    upper and lower tails. Sometimes, we’ll also consider **one-sided** concentration
    inequalities, such as <semantics><mrow><mi mathvariant="double-struck">P</mi><mo
    stretchy="false">(</mo><mi>X</mi><mo>−</mo><mi>E</mi><mo stretchy="false">[</mo><mi>X</mi><mo
    stretchy="false">]</mo><mo>≥</mo><mi>t</mi><mo stretchy="false">)</mo><mo>≤</mo><mi>ϵ</mi></mrow><annotation
    encoding="application/x-tex">\mathbb{P}(X-E[X] \geq t) \leq \epsilon</annotation></semantics>P(X−E[X]≥t)≤ϵ
    or <semantics><mrow><mi mathvariant="double-struck">P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>−</mo><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo><mo>≤</mo><mo>−</mo><mi>t</mi><mo
    stretchy="false">)</mo><mo>≤</mo><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\mathbb{P}(X-E[X]
    \leq -t) \leq \epsilon</annotation></semantics>P(X−E[X]≤−t)≤ϵ.
  prefs: []
  type: TYPE_NORMAL
- en: Why are we interested in concentration inequalities?[¶](#why-are-we-interested-in-concentration-inequalities
    "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: 'Example: One-sided Upper Tail Bound[¶](#example-one-sided-upper-tail-bound
    "Link to this Section")'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'We’ll start by looking at the upper tail bound for a random variable <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X with unknown density
    <semantics><mrow><mi>f</mi></mrow><annotation encoding="application/x-tex">f</annotation></semantics>f
    and corresponding CDF <semantics><mrow><mi>F</mi></mrow><annotation encoding="application/x-tex">F</annotation></semantics>F.
    Specifically, we want to find a probabilistic upper bound <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α such that most of
    the time, <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X
    takes on values less than <semantics><mrow><mi>α</mi></mrow><annotation encoding="application/x-tex">\alpha</annotation></semantics>α.
    Formally, we can write this one of two ways:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>≥</mo><mi>α</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>≤</mo><mi>ϵ</mi></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo><</mo><mi>α</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>≥</mo><mn>1</mn><mo>−</mo><mi>ϵ</mi></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} P(X \geq \alpha) &\leq \epsilon \\
    P(X < \alpha) &\geq 1-\epsilon \end{align*}</annotation></semantics>P(X≥α)P(X<α)​≤ϵ≥1−ϵ​[(4)](#geAq5tBZ3j
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'For small values of <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ,
    we can interpret this statement as saying that we are confident that <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X will be below <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α. For this reason,
    we’ll use the following terminology:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>α</mi></mrow><annotation encoding="application/x-tex">\alpha</annotation></semantics>α
    is our **upper confidence bound**,
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ
    is our **failure probability**, and
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: <semantics><mrow><mn>1</mn><mo>−</mo><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">1-\epsilon</annotation></semantics>1−ϵ
    is our **confidence level**.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'In general, we can express the bound as <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ)
    to show the dependence explicitly: we specify some desired level of confidence
    (or failure probability), and find a bound that holds for that level. In practice,
    we want these bounds to be as small as possible: we can always choose a trivial
    bound at <semantics><mrow><mi mathvariant="normal">∞</mi></mrow><annotation encoding="application/x-tex">\infty</annotation></semantics>∞,
    but this isn’t useful to us. So, we want <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ)
    to grow relatively slowly as a function of <semantics><mrow><mi>ϵ</mi></mrow><annotation
    encoding="application/x-tex">\epsilon</annotation></semantics>ϵ.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Suppose we choose <semantics><mrow><mi>ϵ</mi><mo>=</mo><mn>0.05</mn></mrow><annotation
    encoding="application/x-tex">\epsilon = 0.05</annotation></semantics>ϵ=0.05, and
    we want a value of <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mn>0.05</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\alpha(0.05)</annotation></semantics>α(0.05)
    that satisfies the inequality above. If <semantics><mrow><mi>f</mi></mrow><annotation
    encoding="application/x-tex">f</annotation></semantics>f and <semantics><mrow><mi>F</mi></mrow><annotation
    encoding="application/x-tex">F</annotation></semantics>F were known, we could
    easily compute such a value by solving for <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α (for this example,
    we’ll assume <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X
    is continuous so that <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo><</mo><mi>α</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>≤</mo><mi>α</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(X < \alpha)
    = P(X \leq \alpha)</annotation></semantics>P(X<α)=P(X≤α)):'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>≤</mo><mi>α</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>≥</mo><mn>1</mn><mo>−</mo><mi>ϵ</mi></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>F</mi><mo stretchy="false">(</mo><mi>α</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>≥</mo><mn>1</mn><mo>−</mo><mi>ϵ</mi></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mi>α</mi></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>≥</mo><msup><mi>F</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo
    stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>ϵ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} P(X \leq \alpha) &\geq 1-\epsilon
    \\ F(\alpha) &\geq 1 - \epsilon \\ \alpha &\geq F^{-1}(1-\epsilon) \end{align*}</annotation></semantics>P(X≤α)F(α)α​≥1−ϵ≥1−ϵ≥F−1(1−ϵ)​[(5)](#wiYupPUcdW
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: In other words, if we knew the CDF <semantics><mrow><mi>F</mi></mrow><annotation
    encoding="application/x-tex">F</annotation></semantics>F (and therefore the inverse
    CDF <semantics><mrow><msup><mi>F</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow><annotation
    encoding="application/x-tex">F^{-1}</annotation></semantics>F−1), we could calculate
    <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mn>0.05</mn><mo stretchy="false">)</mo><mo>=</mo><msup><mi>F</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo
    stretchy="false">(</mo><mn>0.95</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\alpha(0.05) = F^{-1}(0.95)</annotation></semantics>α(0.05)=F−1(0.95).
  prefs: []
  type: TYPE_NORMAL
- en: 'What if we don’t know the CDF? If we don’t know anything at all about the random
    variable <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X,
    then we’re stuck: we can’t really make any statement about <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α that would apply
    to any arbitrary random variable. But, we’ll see that if we make just a few assumptions,
    or just know a few things about <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X, then we can make some
    interesting statements.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Example: Sample Mean[¶](#example-sample-mean "Link to this Section")'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: One of the most common applications of concentration inequalities is to sample
    means. We’ll return to the example of a sequence of i.i.d. random variables <semantics><mrow><msub><mi>X</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>X</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">X_1, \ldots, X_n</annotation></semantics>X1​,…,Xn​
    with mean <semantics><mrow><mi>μ</mi></mrow><annotation encoding="application/x-tex">\mu</annotation></semantics>μ,
    and their sample mean <semantics><mrow><mi>Y</mi><mo>=</mo><mo stretchy="false">(</mo><mn>1</mn><mi
    mathvariant="normal">/</mi><mi>n</mi><mo stretchy="false">)</mo><mo>∑</mo><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">Y = (1/n)\sum X_i</annotation></semantics>Y=(1/n)∑Xi​.
  prefs: []
  type: TYPE_NORMAL
- en: Markov’s Inequality[¶](#markovs-inequality "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'We’ll start by assuming that <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X is **nonnegative**, and
    that we know its mean <semantics><mrow><mi>E</mi><mo stretchy="false">[</mo><mi>X</mi><mo
    stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">E[X]</annotation></semantics>E[X].
    Note that these are fairly weak assumptions: if we know that <semantics><mrow><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo><mo>=</mo><mn>10</mn></mrow><annotation
    encoding="application/x-tex">E[X] = 10</annotation></semantics>E[X]=10 and that
    <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X
    is nonnegative, there are an enormous number of possible densities for <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X! Markov’s inequality
    holds for all of them, and it tells us:'
  prefs: []
  type: TYPE_NORMAL
- en: '**Markov’s inequality**: For a nonnegative random variable <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X and bound <semantics><mrow><mi>α</mi><mo>></mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\alpha > 0</annotation></semantics>α>0, we have'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>≥</mo><mi>α</mi><mo
    stretchy="false">)</mo><mo>≤</mo><mfrac><mrow><mi>E</mi><mo stretchy="false">[</mo><mi>X</mi><mo
    stretchy="false">]</mo></mrow><mi>α</mi></mfrac><mi mathvariant="normal">.</mi></mrow><annotation
    encoding="application/x-tex">P(X \geq \alpha) \leq \frac{E[X]}{\alpha}.</annotation></semantics>P(X≥α)≤αE[X]​.[(6)](#lDlqV4tCUL
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: '**Exercise**: *Suppose a slot machine has a payout of <semantics><mrow><mi
    mathvariant="normal">$</mi><mn>10</mn></mrow><annotation encoding="application/x-tex">\$10</annotation></semantics>$10.
    Which of the following are possible values for the probability that the machine
    pays out exactly <semantics><mrow><mi mathvariant="normal">$</mi><mn>100</mn></mrow><annotation
    encoding="application/x-tex">\$100</annotation></semantics>$100?* <semantics><mrow><mn>2</mn><mi
    mathvariant="normal">%</mi><mo separator="true">,</mo><mn>4</mn><mi mathvariant="normal">%</mi><mo
    separator="true">,</mo><mn>5</mn><mi mathvariant="normal">%</mi><mo separator="true">,</mo><mn>7</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">2\%,
    4\%, 5\%, 7\%</annotation></semantics>2%,4%,5%,7%'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: Understanding properties of Markov’s inequality[¶](#understanding-properties-of-markovs-inequality
    "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Let’s use Markov’s inequality to derive a general upper confidence bound that
    will hold for any nonnegative random variable. If we want <semantics><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>X</mi><mo>≥</mo><mi>α</mi><mo stretchy="false">)</mo><mo>≤</mo><mi>ϵ</mi></mrow><annotation
    encoding="application/x-tex">P(X \geq \alpha) \leq \epsilon</annotation></semantics>P(X≥α)≤ϵ
    for a given value of <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ
    (i.e., a desired confidence level / failure probability), then we have <semantics><mrow><mi>ϵ</mi><mo>=</mo><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo><mi mathvariant="normal">/</mi><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\epsilon = E[X]/\alpha</annotation></semantics>ϵ=E[X]/α,
    or equivalently <semantics><mrow><mi>α</mi><mo>=</mo><mi>E</mi><mo stretchy="false">[</mo><mi>X</mi><mo
    stretchy="false">]</mo><mi mathvariant="normal">/</mi><mi>ϵ</mi></mrow><annotation
    encoding="application/x-tex">\alpha = E[X]/\epsilon</annotation></semantics>α=E[X]/ϵ.
    We can make some important observations about this bound:'
  prefs: []
  type: TYPE_NORMAL
- en: 'As <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ
    decreases, <semantics><mrow><mi>α</mi></mrow><annotation encoding="application/x-tex">\alpha</annotation></semantics>α
    increases. Convince yourself that this makes sense: if we want our bound <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α to have a very small
    probability of failing (i.e., to have a very small probability that the random
    variable takes on a value above the bound), then we must make the bound very large.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '*How fast does our bound increase as <semantics><mrow><mi>ϵ</mi></mrow><annotation
    encoding="application/x-tex">\epsilon</annotation></semantics>ϵ gets small?* As
    we noted above, a good bound will increase relatively slowly. Unfortunately, Markov’s
    inequality provides a relatively poor bound: the bound increases as <semantics><mrow><mi>O</mi><mo
    stretchy="false">(</mo><msup><mi>ϵ</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(\epsilon^{-1})</annotation></semantics>O(ϵ−1),
    which for most random variables is not a very tight bound.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Example: Sample Mean with Markov’s Inequality[¶](#example-sample-mean-with-markovs-inequality
    "Link to this Section")'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Given <semantics><mrow><msub><mi>X</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>X</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">X_1,
    \ldots, X_n</annotation></semantics>X1​,…,Xn​ and their sample mean <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y, how well does Markov’s
    inequality answer the question of whether <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y can be far from the true
    mean <semantics><mrow><mi>μ</mi></mrow><annotation encoding="application/x-tex">\mu</annotation></semantics>μ?
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>Y</mi><mo>−</mo><mi>μ</mi><mo>≥</mo><mi>α</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>P</mi><mo stretchy="false">(</mo><mi>Y</mi><mo>≥</mo><mi>μ</mi><mo>+</mo><mi>α</mi><mo
    stretchy="false">)</mo><mo>≤</mo><mfrac><mi>μ</mi><mrow><mi>μ</mi><mo>+</mo><mi>α</mi></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">P(Y - \mu \geq \alpha) = P(Y \geq \mu + \alpha) \leq
    \frac{\mu}{\mu+\alpha}</annotation></semantics>P(Y−μ≥α)=P(Y≥μ+α)≤μ+αμ​[(7)](#su3B3XRsOg
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'This is a remarkably poor bound! In particular, note that it doesn’t even improve
    as the number of samples <semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics>n
    grows larger. If we were to ask for an upper confidence bound <semantics><mrow><mi>α</mi><mo
    stretchy="false">(</mo><mi>ϵ</mi><mo separator="true">,</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\alpha(\epsilon, n)</annotation></semantics>α(ϵ,n)
    at a given level of confidence <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ
    for a given number of samples <semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics>n,
    we would see that this bound also has no dependence on <semantics><mrow><mi>n</mi></mrow><annotation
    encoding="application/x-tex">n</annotation></semantics>n: in other words, it remains
    the same regardless of how many samples we collect. This is contrary to our intuition
    about sample means: in general, we expect that the more independent samples we
    collect, the better our result should be. This is something we’ll look for in
    future inequalities.'
  prefs: []
  type: TYPE_NORMAL
- en: '**Exercises**:'
  prefs: []
  type: TYPE_NORMAL
- en: Consider a Poisson random variable <semantics><mrow><mi>T</mi></mrow><annotation
    encoding="application/x-tex">T</annotation></semantics>T with parameter <semantics><mrow><mi>λ</mi><mo>=</mo><mn>5</mn></mrow><annotation
    encoding="application/x-tex">\lambda = 5</annotation></semantics>λ=5. Using the
    PDF/CDF, find the smallest value of <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α such that <semantics><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>T</mi><mo>≥</mo><mi>α</mi><mo stretchy="false">)</mo><mo>≤</mo><mn>0.05</mn></mrow><annotation
    encoding="application/x-tex">P(T \geq \alpha) \leq 0.05</annotation></semantics>P(T≥α)≤0.05.
    Then, use Markov’s inequality to find an upper bound on <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α. What does this
    tell you about the usefulness of Markov’s inequality in this example?
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'Now, let <semantics><mrow><msub><mi>T</mi><mi>i</mi></msub><mo>∼</mo><mrow><mi
    mathvariant="normal">P</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">i</mi><mi
    mathvariant="normal">s</mi><mi mathvariant="normal">s</mi><mi mathvariant="normal">o</mi><mi
    mathvariant="normal">n</mi></mrow><mo stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">T_i \sim \mathrm{Poisson}(\lambda)</annotation></semantics>Ti​∼Poisson(λ),
    for <semantics><mrow><mi>i</mi><mo>=</mo><mn>1</mn><mo separator="true">,</mo><mn>2</mn><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><mi>n</mi></mrow><annotation
    encoding="application/x-tex">i = 1, 2, \ldots, n</annotation></semantics>i=1,2,…,n,
    and let <semantics><mrow><mi>S</mi></mrow><annotation encoding="application/x-tex">S</annotation></semantics>S
    be the sample mean of the <semantics><mrow><msub><mi>T</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">T_i</annotation></semantics>Ti​. If <semantics><mrow><mi>λ</mi><mo>=</mo><mn>5</mn></mrow><annotation
    encoding="application/x-tex">\lambda = 5</annotation></semantics>λ=5, find the
    smallest value <semantics><mrow><mi>α</mi></mrow><annotation encoding="application/x-tex">\alpha</annotation></semantics>α
    such that <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>S</mi><mo>≥</mo><mi>α</mi><mo
    stretchy="false">)</mo><mo>≤</mo><mn>0.05</mn></mrow><annotation encoding="application/x-tex">P(S
    \geq \alpha) \leq 0.05</annotation></semantics>P(S≥α)≤0.05 (*hint: use [the fact
    that the sum of independent Poisson RVs is also Poisson](https://data140.org/textbook/content/Chapter_07/01_Poisson_Distribution.html#sums-of-independent-poisson-variables)*).
    Then use Markov’s inequality to find an upper bound on <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α. How does the difference
    compare to Exercise 1?'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '*Hint: you may find the [`scipy.stats.poisson.ppf`](https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.poisson.html)
    function useful for both exercises.*'
  prefs: []
  type: TYPE_NORMAL
- en: As we’ll see, part of the reason Markov’s inequality provides such a weak bound
    is that it uses very limited information.
  prefs: []
  type: TYPE_NORMAL
- en: 'Video example: flipping biased coins[¶](#video-example-flipping-biased-coins
    "Link to this Section")'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '[PRE4]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: Chebyshev’s inequality and higher moments[¶](#chebyshevs-inequality-and-higher-moments
    "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'What if we use more information? Specifically, suppose we use both the mean
    and the variance. To do so, let’s consider a random variable <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X, for which we want to
    bound tail probabilities, and then the random variable <semantics><mrow><mi>Z</mi><mo>=</mo><mo
    stretchy="false">(</mo><mi>X</mi><mo>−</mo><mi>E</mi><mo stretchy="false">[</mo><mi>X</mi><mo
    stretchy="false">]</mo><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow><annotation
    encoding="application/x-tex">Z = (X-E[X])^2</annotation></semantics>Z=(X−E[X])2.
    We can see that <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    is always nonnegative, and by the definition of variance, <semantics><mrow><mi>E</mi><mo
    stretchy="false">[</mo><mi>Z</mi><mo stretchy="false">]</mo><mo>=</mo><mrow><mi
    mathvariant="normal">v</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo
    stretchy="false">(</mo><mi>X</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">E[Z] = \mathrm{var}(X)</annotation></semantics>E[Z]=var(X).
    So, if we apply Markov’s inequality to <semantics><mrow><mi>Z</mi></mrow><annotation
    encoding="application/x-tex">Z</annotation></semantics>Z, we arrive at Chebyshev’s
    inequality:'
  prefs: []
  type: TYPE_NORMAL
- en: '**Chebyshev’s inequality**: Consider a random variable <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X with known (finite) mean
    and variance. For any <semantics><mrow><mi>t</mi><mo>></mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">t > 0</annotation></semantics>t>0,'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi mathvariant="double-struck">P</mi><mo stretchy="false">(</mo><mi
    mathvariant="normal">∣</mi><mi>X</mi><mo>−</mo><mi>E</mi><mo stretchy="false">[</mo><mi>X</mi><mo
    stretchy="false">]</mo><mi mathvariant="normal">∣</mi><mo>≥</mo><mi>t</mi><mo
    stretchy="false">)</mo><mo>≤</mo><mfrac><mrow><mrow><mi mathvariant="normal">v</mi><mi
    mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo stretchy="false">(</mo><mi>X</mi><mo
    stretchy="false">)</mo></mrow><msup><mi>t</mi><mn>2</mn></msup></mfrac></mrow><annotation
    encoding="application/x-tex">\mathbb{P}(\vert X - E[X] \vert \ge t) \le \frac{\mathrm{var}(X)}{t^2}</annotation></semantics>P(∣X−E[X]∣≥t)≤t2var(X)​[(8)](#o3qXdp8JHq
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: '*Proof:*'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>P</mi><mo stretchy="false">(</mo><mi
    mathvariant="normal">∣</mi><mi>X</mi><mo>−</mo><mi>E</mi><mo stretchy="false">[</mo><mi>X</mi><mo
    stretchy="false">]</mo><mi mathvariant="normal">∣</mi><mo>≥</mo><mi>t</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>P</mi><mo
    stretchy="false">(</mo><mo stretchy="false">(</mo><mi>X</mi><mo>−</mo><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo>≥</mo><msup><mi>t</mi><mn>2</mn></msup><mo
    stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mi>P</mi><mo stretchy="false">(</mo><mi>Z</mi><mo>≥</mo><msup><mi>t</mi><mn>2</mn></msup><mo
    stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>≤</mo><mfrac><mrow><mi>E</mi><mo stretchy="false">[</mo><mi>Z</mi><mo
    stretchy="false">]</mo></mrow><msup><mi>t</mi><mn>2</mn></msup></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mrow><mi mathvariant="normal">v</mi><mi
    mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo stretchy="false">(</mo><mi>X</mi><mo
    stretchy="false">)</mo></mrow><msup><mi>t</mi><mn>2</mn></msup></mfrac><mi mathvariant="normal">■</mi></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} P(\vert X - E[X] \vert \geq t) &=
    P((X - E[X])^2 \geq t^2) \\ &= P(Z \geq t^2) \\ &\leq \frac{E[Z]}{t^2} \\ &= \frac{\mathrm{var}(X)}{t^2}
    \blacksquare \end{align*}</annotation></semantics>P(∣X−E[X]∣≥t)​=P((X−E[X])2≥t2)=P(Z≥t2)≤t2E[Z]​=t2var(X)​■​[(9)](#aZ8Oi1xEBu
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: Understanding properties of Chebyshev’s inequality[¶](#understanding-properties-of-chebyshevs-inequality
    "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'This tells us that the X is unlikely to be far away from its mean: the probability
    that the distance <semantics><mrow><mi mathvariant="normal">∣</mi><mi>X</mi><mo>−</mo><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo><mi mathvariant="normal">∣</mi></mrow><annotation
    encoding="application/x-tex">|X-E[X]|</annotation></semantics>∣X−E[X]∣ is large
    (specifically, larger than <semantics><mrow><mi>t</mi></mrow><annotation encoding="application/x-tex">t</annotation></semantics>t),
    decreases proportional to var<semantics><mrow><mo stretchy="false">(</mo><mi>X</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(X)</annotation></semantics>(X)
    and inversely proportional to <semantics><mrow><msup><mi>t</mi><mn>2</mn></msup></mrow><annotation
    encoding="application/x-tex">t^2</annotation></semantics>t2.'
  prefs: []
  type: TYPE_NORMAL
- en: Let’s use Chebyshev’s inequality to derive a general upper confidence bound
    that will hold for any random variable with known mean and variance. If we want
    <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>≥</mo><mi>α</mi><mo
    stretchy="false">)</mo><mo>≤</mo><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">P(X
    \geq \alpha) \leq \epsilon</annotation></semantics>P(X≥α)≤ϵ for a given value
    of <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ,
    we need to do some algebra first before we can apply Chebyshev’s inequality.
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>≥</mo><mi>α</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>P</mi><mo
    stretchy="false">(</mo><mi>X</mi><mo>−</mo><mi>E</mi><mo stretchy="false">[</mo><mi>X</mi><mo
    stretchy="false">]</mo><mo>≥</mo><mi>α</mi><mo>−</mo><mi>E</mi><mo stretchy="false">[</mo><mi>X</mi><mo
    stretchy="false">]</mo><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>≤</mo><mi>P</mi><mo stretchy="false">(</mo><mi
    mathvariant="normal">∣</mi><mi>X</mi><mo>−</mo><mi>E</mi><mo stretchy="false">[</mo><mi>X</mi><mo
    stretchy="false">]</mo><mi mathvariant="normal">∣</mi><mo>≥</mo><mi>α</mi><mo>−</mo><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>≤</mo><mfrac><mrow><mrow><mi mathvariant="normal">v</mi><mi
    mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo stretchy="false">(</mo><mi>X</mi><mo
    stretchy="false">)</mo></mrow><mrow><mo stretchy="false">(</mo><mi>α</mi><mo>−</mo><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mo
    separator="true">,</mo></mrow></mstyle></mtd></mtr></mtable><annotation encoding="application/x-tex">\begin{align*}
    P(X \geq \alpha) &= P(X - E[X] \geq \alpha - E[X]) \\ &\leq P(|X - E[X]| \geq
    \alpha - E[X]) \\ &\leq \frac{\mathrm{var}(X)}{(\alpha - E[X])^2}, \end{align*}</annotation></semantics>P(X≥α)​=P(X−E[X]≥α−E[X])≤P(∣X−E[X]∣≥α−E[X])≤(α−E[X])2var(X)​,​[(10)](#viPn0ZnQC2
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'So, we have <semantics><mrow><mi>ϵ</mi><mo>=</mo><mfrac><mrow><mrow><mi mathvariant="normal">v</mi><mi
    mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo stretchy="false">(</mo><mi>X</mi><mo
    stretchy="false">)</mo></mrow><mrow><mo stretchy="false">(</mo><mi>α</mi><mo>−</mo><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">\epsilon = \frac{\mathrm{var}(X)}{(\alpha - E[X])^2}</annotation></semantics>ϵ=(α−E[X])2var(X)​.
    While we could use the quadratic formula to obtain an expression for <semantics><mrow><mi>α</mi><mo
    stretchy="false">(</mo><mi>ϵ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ), the
    most important observations here are:'
  prefs: []
  type: TYPE_NORMAL
- en: The bound <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ)
    is directly proportional to the variance of <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '*How fast does our bound increase as <semantics><mrow><mi>ϵ</mi></mrow><annotation
    encoding="application/x-tex">\epsilon</annotation></semantics>ϵ gets small?* The
    bound <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ) is
    proportional to <semantics><mrow><msup><mi>ϵ</mi><mrow><mo>−</mo><mn>1</mn><mi
    mathvariant="normal">/</mi><mn>2</mn></mrow></msup></mrow><annotation encoding="application/x-tex">\epsilon^{-1/2}</annotation></semantics>ϵ−1/2
    (i.e., it increases as <semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><msup><mi>ϵ</mi><mrow><mo>−</mo><mn>1</mn><mi
    mathvariant="normal">/</mi><mn>2</mn></mrow></msup><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">O(\epsilon^{-1/2})</annotation></semantics>O(ϵ−1/2),
    which is a significant improvement over what we saw with Markov’s inequality.
    The question remains: can we do better?'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Example: Sample Mean with Chebyshev’s Inequality[¶](#example-sample-mean-with-chebyshevs-inequality
    "Link to this Section")'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Given <semantics><mrow><msub><mi>X</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>X</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">X_1,
    \ldots, X_n</annotation></semantics>X1​,…,Xn​ and their sample mean <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y, how well does Chebyshev’s
    inequality answer the question of whether <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y can be far from the true
    mean <semantics><mrow><mi>μ</mi></mrow><annotation encoding="application/x-tex">\mu</annotation></semantics>μ?
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi mathvariant="normal">∣</mi><mi>Y</mi><mo>−</mo><mi>μ</mi><mi
    mathvariant="normal">∣</mi><mo>></mo><mi>α</mi><mo stretchy="false">)</mo><mo>≤</mo><mfrac><mrow><mrow><mi
    mathvariant="normal">v</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo
    stretchy="false">(</mo><mi>Y</mi><mo stretchy="false">)</mo></mrow><msup><mi>α</mi><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mrow><mrow><mi
    mathvariant="normal">v</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo
    stretchy="false">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo stretchy="false">)</mo></mrow><mrow><mi>n</mi><msup><mi>α</mi><mn>2</mn></msup></mrow></mfrac><mo
    separator="true">,</mo></mrow><annotation encoding="application/x-tex">P(|Y -
    \mu| > \alpha) \leq \frac{\mathrm{var}(Y)}{\alpha^2} = \frac{\mathrm{var}(X_i)}{n\alpha^2},</annotation></semantics>P(∣Y−μ∣>α)≤α2var(Y)​=nα2var(Xi​)​,[(11)](#eWo9w2PhFP
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: where we use the fact that the <semantics><mrow><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">X_i</annotation></semantics>Xi​ are independent to
    derive <semantics><mrow><mrow><mi mathvariant="normal">v</mi><mi mathvariant="normal">a</mi><mi
    mathvariant="normal">r</mi></mrow><mo stretchy="false">(</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><msup><mi>n</mi><mn>2</mn></msup></mfrac><mo>∑</mo><mrow><mi
    mathvariant="normal">v</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo
    stretchy="false">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mo>=</mo><mrow><mi
    mathvariant="normal">v</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo
    stretchy="false">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mi
    mathvariant="normal">/</mi><mi>n</mi></mrow><annotation encoding="application/x-tex">\mathrm{var}(Y)
    = \frac{1}{n^2} \sum \mathrm{var}(X_i) = \mathrm{var}(X_i)/n</annotation></semantics>var(Y)=n21​∑var(Xi​)=var(Xi​)/n.
  prefs: []
  type: TYPE_NORMAL
- en: 'This is significantly better than the bound from Markov’s inequality: it tells
    us that as <semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics>n
    increases, the probability decreases proportional to <semantics><mrow><mn>1</mn><mi
    mathvariant="normal">/</mi><mi>n</mi></mrow><annotation encoding="application/x-tex">1/n</annotation></semantics>1/n.
    What if we were to ask for an upper confidence bound <semantics><mrow><mi>α</mi><mo
    stretchy="false">(</mo><mi>ϵ</mi><mo separator="true">,</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\alpha(\epsilon, n)</annotation></semantics>α(ϵ,n)
    at a given level of confidence <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ,
    for a given number of samples <semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics>n?'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mi>ϵ</mi></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mrow><mi mathvariant="normal">v</mi><mi
    mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo stretchy="false">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo
    stretchy="false">)</mo></mrow><mrow><mi>n</mi><msup><mi>α</mi><mn>2</mn></msup></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mi>α</mi></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mfrac><msub><mi>σ</mi><msub><mi>X</mi><mi>i</mi></msub></msub><msqrt><mrow><mi>n</mi><mi>ϵ</mi></mrow></msqrt></mfrac></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} \epsilon &= \frac{\mathrm{var}(X_i)}{n\alpha^2}
    \\ \alpha &= \frac{\sigma_{X_i}}{\sqrt{n\epsilon}} \end{align*}</annotation></semantics>ϵα​=nα2var(Xi​)​=nϵ​σXi​​​​[(12)](#QeQXkVSbGw
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: We see a dependence on <semantics><mrow><mfrac><mn>1</mn><msqrt><mi>n</mi></msqrt></mfrac></mrow><annotation
    encoding="application/x-tex">\frac{1}{\sqrt{n}}</annotation></semantics>n​1​,
    which tells us how fast our bound shrinks as the number of samples increases.
  prefs: []
  type: TYPE_NORMAL
- en: '**Exercise**: Consider again the i.i.d. Poisson random variables <semantics><mrow><msub><mi>T</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">T_i</annotation></semantics>Ti​ and their sample
    mean <semantics><mrow><mi>S</mi></mrow><annotation encoding="application/x-tex">S</annotation></semantics>S.
    Use Chebyshev’s inequality to find the smallest value <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α such that <semantics><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>S</mi><mo>≥</mo><mi>α</mi><mo stretchy="false">)</mo><mo>≤</mo><mn>0.05</mn></mrow><annotation
    encoding="application/x-tex">P(S \geq \alpha) \leq 0.05</annotation></semantics>P(S≥α)≤0.05.
    How does your result compare to the true probability and to the Markov bound?'
  prefs: []
  type: TYPE_NORMAL
- en: 'Video example: flipping biased coins with Chebyshev’s inequality[¶](#video-example-flipping-biased-coins-with-chebyshevs-inequality
    "Link to this Section")'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '[PRE5]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: Higher moment bounds[¶](#higher-moment-bounds "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Chebyshev’s inequality uses the first and second moments (<semantics><mrow><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">E[X]</annotation></semantics>E[X] and <semantics><mrow><mi>E</mi><mo
    stretchy="false">[</mo><msup><mi>X</mi><mn>2</mn></msup><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">E[X^2]</annotation></semantics>E[X2]). For any nonnegative
    random variable <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X
    and for any natural number <semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k,
    we can apply Markov’s inequality to <semantics><mrow><msup><mi>X</mi><mi>k</mi></msup></mrow><annotation
    encoding="application/x-tex">X^k</annotation></semantics>Xk, obtaining higher
    **moment bounds**:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi mathvariant="double-struck">P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>≥</mo><mi>α</mi><mo
    stretchy="false">)</mo><mo>≤</mo><mfrac><mrow><mi>E</mi><mo stretchy="false">[</mo><msup><mi>X</mi><mi>k</mi></msup><mo
    stretchy="false">]</mo></mrow><msup><mi>α</mi><mi>k</mi></msup></mfrac></mrow><annotation
    encoding="application/x-tex">\mathbb{P}(X \geq \alpha) \leq \frac{E[X^k]}{\alpha^k}</annotation></semantics>P(X≥α)≤αkE[Xk]​[(13)](#QfAizRYgPz
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'Some important observations:'
  prefs: []
  type: TYPE_NORMAL
- en: If we use this to find an upper confidence bound <semantics><mrow><mi>α</mi><mo
    stretchy="false">(</mo><mi>ϵ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ) as
    above, we can derive that the bound increases as <semantics><mrow><mi>O</mi><mo
    stretchy="false">(</mo><msup><mi>ϵ</mi><mrow><mo>−</mo><mn>1</mn><mi mathvariant="normal">/</mi><mi>k</mi></mrow></msup><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(\epsilon^{-1/k})</annotation></semantics>O(ϵ−1/k),
    which for large values of <semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k
    can be very small.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Using such bounds requires additional information about the random variable
    <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X:
    in fact, if we knew exactly all the moments <semantics><mrow><mi>E</mi><mo stretchy="false">[</mo><msup><mi>X</mi><mi>k</mi></msup><mo
    stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">E[X^k]</annotation></semantics>E[Xk]
    for <semantics><mrow><mi>k</mi><mo>=</mo><mn>1</mn><mo separator="true">,</mo><mn>2</mn><mo
    separator="true">,</mo><mo>…</mo></mrow><annotation encoding="application/x-tex">k
    = 1, 2, \ldots</annotation></semantics>k=1,2,…, then we would most likely also
    know the CDF.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Moment generating function and Chernoff’s method[¶](#moment-generating-function-and-chernoffs-method
    "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '*You may find it helpful to review [Section 19.2 of the Data 140 textbook](https://data140.org/textbook/content/Chapter_19/02_Moment_Generating_Functions.html).*'
  prefs: []
  type: TYPE_NORMAL
- en: 'Recall from calculus that we can write the exponential function <semantics><mrow><msup><mi>e</mi><mi>x</mi></msup></mrow><annotation
    encoding="application/x-tex">e^x</annotation></semantics>ex using aa Taylor series
    as:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><msup><mi>e</mi><mi>x</mi></msup><mo>=</mo><mn>1</mn><mo>+</mo><mi>x</mi><mo>+</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mo
    stretchy="false">!</mo></mrow></mfrac><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mrow><mn>3</mn><mo
    stretchy="false">!</mo></mrow></mfrac><msup><mi>x</mi><mn>3</mn></msup><mo>+</mo><mfrac><mn>1</mn><mrow><mn>4</mn><mo
    stretchy="false">!</mo></mrow></mfrac><msup><mi>x</mi><mn>4</mn></msup><mo>+</mo><mo>⋯</mo><mo
    separator="true">,</mo></mrow><annotation encoding="application/x-tex">e^x = 1
    + x + \frac{1}{2!} x^2 + \frac{1}{3!} x^3 + \frac{1}{4!} x^4 + \cdots,</annotation></semantics>ex=1+x+2!1​x2+3!1​x3+4!1​x4+⋯,[(14)](#EVuzSmkOoh
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'Motivated by this, and by our observation earlier that we can use the higher
    moments of a random variable to establish better tail bounds, we’ll examine the
    **moment-generating function** (or MGF) of a random variable <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><msub><mi>M</mi><mi>X</mi></msub><mo stretchy="false">(</mo><mi>λ</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>E</mi><mo stretchy="false">[</mo><msup><mi>e</mi><mrow><mi>λ</mi><mi>X</mi></mrow></msup><mo
    stretchy="false">]</mo><mo>=</mo><mn>1</mn><mo>+</mo><mi>λ</mi><mi>E</mi><mo stretchy="false">[</mo><mi>X</mi><mo
    stretchy="false">]</mo><mo>+</mo><mfrac><msup><mi>λ</mi><mn>2</mn></msup><mrow><mn>2</mn><mo
    stretchy="false">!</mo></mrow></mfrac><mi>E</mi><mo stretchy="false">[</mo><msup><mi>X</mi><mn>2</mn></msup><mo
    stretchy="false">]</mo><mo>+</mo><mfrac><msup><mi>λ</mi><mn>3</mn></msup><mrow><mn>3</mn><mo
    stretchy="false">!</mo></mrow></mfrac><mi>E</mi><mo stretchy="false">[</mo><msup><mi>X</mi><mn>3</mn></msup><mo
    stretchy="false">]</mo><mo>+</mo><mo>⋯</mo></mrow><annotation encoding="application/x-tex">M_X(\lambda)
    = E[e^{\lambda X}] = 1 + \lambda E[X] + \frac{\lambda^2}{2!} E[X^2] + \frac{\lambda^3}{3!}
    E[X^3] + \cdots</annotation></semantics>MX​(λ)=E[eλX]=1+λE[X]+2!λ2​E[X2]+3!λ3​E[X3]+⋯[(15)](#KCp9hjxex3
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'A very important fact about MGFs is that for a sum of independent random variables
    <semantics><mrow><mi>Y</mi><mo>=</mo><msub><mi>X</mi><mn>1</mn></msub><mo>+</mo><mo>⋯</mo><mo>+</mo><msub><mi>X</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">Y = X_1 + \cdots + X_n</annotation></semantics>Y=X1​+⋯+Xn​,
    the MGF of <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    is equal to the product of the MGFs for each <semantics><mrow><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">X_i</annotation></semantics>Xi​:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left right" columnspacing="0em
    1em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><msub><mi>M</mi><mi>Y</mi></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>E</mi><mrow><mo fence="true">[</mo><msup><mi>e</mi><mrow><mi>λ</mi><mi>Y</mi></mrow></msup><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mi>E</mi><mrow><mo fence="true">[</mo><msup><mi>e</mi><mrow><munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mi>λ</mi><msub><mi>X</mi><mi>i</mi></msub></mrow></msup><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mi>E</mi><mrow><mo fence="true">[</mo><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><msup><mi>e</mi><mrow><mi>λ</mi><msub><mi>X</mi><mi>i</mi></msub></mrow></msup><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mi>E</mi><mrow><mo
    fence="true">[</mo><msup><mi>e</mi><mrow><mi>λ</mi><msub><mi>X</mi><mi>i</mi></msub></mrow></msup><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>(by independence)</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><msub><mi>M</mi><msub><mi>X</mi><mi>i</mi></msub></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} M_Y(\lambda) &= E\left[e^{\lambda
    Y}\right] \\ &= E\left[e^{\sum_{i=1}^n \lambda X_i}\right] \\ &= E\left[\prod_{i=1}^n
    e^{\lambda X_i}\right] \\ &= \prod_{i=1}^n E\left[e^{\lambda X_i}\right] & \text{(by
    independence)} \\ &= \prod_{i=1}^n M_{X_i}(\lambda) \end{align*}</annotation></semantics>MY​(λ)​=E[eλY]=E[e∑i=1n​λXi​]=E[i=1∏n​eλXi​]=i=1∏n​E[eλXi​]=i=1∏n​MXi​​(λ)​(by independence)​[(16)](#Bu7p9bCIK4
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: Chernoff Bound[¶](#chernoff-bound "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Since <semantics><mrow><msup><mi>e</mi><mrow><mi>λ</mi><mi>X</mi></mrow></msup></mrow><annotation
    encoding="application/x-tex">e^{\lambda X}</annotation></semantics>eλX is a nonnegative
    random variable, we can again use Markov’s inequality to find a bound:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>≥</mo><mi>α</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>P</mi><mo stretchy="false">(</mo><mi>E</mi><mo
    stretchy="false">[</mo><msup><mi>e</mi><mrow><mi>λ</mi><mi>X</mi></mrow></msup><mo
    stretchy="false">]</mo><mo>≥</mo><msup><mi>e</mi><mrow><mi>λ</mi><mi>α</mi></mrow></msup><mo
    stretchy="false">)</mo><mo>≤</mo><mfrac><mrow><mi>E</mi><mo stretchy="false">[</mo><msup><mi>e</mi><mrow><mi>λ</mi><mi>X</mi></mrow></msup><mo
    stretchy="false">]</mo></mrow><msup><mi>e</mi><mrow><mi>λ</mi><mi>α</mi></mrow></msup></mfrac><mo>=</mo><mfrac><mrow><msub><mi>M</mi><mi>X</mi></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow><msup><mi>e</mi><mrow><mi>λ</mi><mi>α</mi></mrow></msup></mfrac></mrow><annotation
    encoding="application/x-tex">P(X \geq \alpha) = P(E[e^{\lambda X}] \geq e^{\lambda
    \alpha}) ~ \leq ~ \frac{E[e^{\lambda X}]}{e^{\lambda \alpha}} ~ = ~ \frac{M_X(\lambda)}{e^{\lambda
    \alpha}}</annotation></semantics>P(X≥α)=P(E[eλX]≥eλα) ≤ eλαE[eλX]​ = eλαMX​(λ)​[(17)](#KfpQZ3X5xW
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'This is a family of bounds, one for each positive <semantics><mrow><mi>λ</mi></mrow><annotation
    encoding="application/x-tex">\lambda</annotation></semantics>λ. To get the best
    possible one (i.e., the smallest), we should minimize over all nonnegative <semantics><mrow><mi>λ</mi></mrow><annotation
    encoding="application/x-tex">\lambda</annotation></semantics>λ:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>≥</mo><mi>α</mi><mo
    stretchy="false">)</mo><mo>≤</mo><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>λ</mi><mo>≥</mo><mn>0</mn></mrow></munder><mfrac><mrow><msub><mi>M</mi><mi>X</mi></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow><msup><mi>e</mi><mrow><mi>λ</mi><mi>α</mi></mrow></msup></mfrac></mrow><annotation
    encoding="application/x-tex">P(X \geq \alpha) ~ \leq ~ \min_{\lambda \ge 0} \frac{M_X(\lambda)}{e^{\lambda
    \alpha}}</annotation></semantics>P(X≥α) ≤ λ≥0min​eλαMX​(λ)​[(18)](#WlnHla1PiJ
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: This is the **Chernoff bound.**
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE6]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: 'Some important observations:'
  prefs: []
  type: TYPE_NORMAL
- en: 'This requires significantly more information about the distribution than the
    earlier two bounds we saw. Specifically, if we know all the moments of a distribution,
    in most cases we effectively know the distribution. But, as we’ll see shortly,
    it can still be useful if we can bound the MGF for an entire class of distributions:
    in that case, we can replace <semantics><mrow><msub><mi>M</mi><mi>X</mi></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">M_X(\lambda)</annotation></semantics>MX​(λ) with
    an upper bound on it.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '*How fast does our bound increase as <semantics><mrow><mi>ϵ</mi></mrow><annotation
    encoding="application/x-tex">\epsilon</annotation></semantics>ϵ gets small?* Solving
    for an upper confidence bound <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ),
    we see that <semantics><mrow><mi>ϵ</mi><mo>=</mo><mfrac><mrow><msub><mi>M</mi><mi>X</mi></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow><msup><mi>e</mi><mrow><mi>λ</mi><mi>α</mi></mrow></msup></mfrac></mrow><annotation
    encoding="application/x-tex">\epsilon = \frac{M_X(\lambda)}{e^{\lambda \alpha}}</annotation></semantics>ϵ=eλαMX​(λ)​.
    If we were to for <semantics><mrow><mi>α</mi></mrow><annotation encoding="application/x-tex">\alpha</annotation></semantics>α,
    we would see that it grows as <semantics><mrow><mi>log</mi><mo>⁡</mo><mo stretchy="false">(</mo><msup><mi>ϵ</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\log(\epsilon^{-1})</annotation></semantics>log(ϵ−1):
    this is much, much slower than our previous two results! So, if we can find a
    class of random variables where the MGF is known (or bounded, as in the previous
    observation), then we can place much tighter bounds on those random variables.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Example: Sample Mean with Chernoff Bound[¶](#example-sample-mean-with-chernoff-bound
    "Link to this Section")'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Given <semantics><mrow><msub><mi>X</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>X</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">X_1,
    \ldots, X_n</annotation></semantics>X1​,…,Xn​ and their sample mean <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y, how well does Chernoff’s
    bound answer the question of whether <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y can be far from the true
    mean <semantics><mrow><mi>μ</mi></mrow><annotation encoding="application/x-tex">\mu</annotation></semantics>μ?
    Because we know about the MGF of a sum of random variables, we’ll bound the variable
    <semantics><mrow><mi>n</mi><mi>Y</mi><mo>=</mo><mo>∑</mo><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">nY = \sum X_i</annotation></semantics>nY=∑Xi​:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>Y</mi><mo>−</mo><mi>μ</mi><mo>≥</mo><mi>α</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>P</mi><mo stretchy="false">(</mo><mi>n</mi><mi>Y</mi><mo>−</mo><mi>n</mi><mi>μ</mi><mo>≥</mo><mi>n</mi><mi>α</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>P</mi><mo stretchy="false">(</mo><mi>n</mi><mi>Y</mi><mo>≥</mo><mi>n</mi><mo
    stretchy="false">(</mo><mi>μ</mi><mo>+</mo><mi>α</mi><mo stretchy="false">)</mo><mo
    stretchy="false">)</mo><mo>≤</mo><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>λ</mi><mo>></mo><mn>0</mn></mrow></munder><mfrac><msup><mrow><mo
    fence="true">[</mo><msub><mi>M</mi><msub><mi>X</mi><mi>i</mi></msub></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo><mo fence="true">]</mo></mrow><mi>n</mi></msup><msup><mi>e</mi><mrow><mi>λ</mi><mi>n</mi><mo
    stretchy="false">(</mo><mi>μ</mi><mo>+</mo><mi>α</mi><mo stretchy="false">)</mo></mrow></msup></mfrac></mrow><annotation
    encoding="application/x-tex">P(Y - \mu \geq \alpha) = P(nY - n\mu \geq n\alpha)
    = P(nY \geq n(\mu + \alpha)) \leq \min_{\lambda > 0} \frac{\left[M_{X_i}(\lambda)\right]^n}{e^{\lambda
    n(\mu+\alpha)}}</annotation></semantics>P(Y−μ≥α)=P(nY−nμ≥nα)=P(nY≥n(μ+α))≤λ>0min​eλn(μ+α)[MXi​​(λ)]n​[(19)](#OVZ6uOFkan
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'This is even better than the Chebyshev bound: as <semantics><mrow><mi>n</mi></mrow><annotation
    encoding="application/x-tex">n</annotation></semantics>n increases, the probability
    decreases proportional to <semantics><mrow><msup><mi>e</mi><mrow><mo>−</mo><mi>n</mi></mrow></msup></mrow><annotation
    encoding="application/x-tex">e^{-n}</annotation></semantics>e−n.'
  prefs: []
  type: TYPE_NORMAL
- en: What if we were to ask for an upper confidence bound <semantics><mrow><mi>α</mi><mo
    stretchy="false">(</mo><mi>ϵ</mi><mo separator="true">,</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\alpha(\epsilon, n)</annotation></semantics>α(ϵ,n)
    at a given level of confidence <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ
    and a given number of samples <semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics>n?
    Doing the computation properly would require some more extensive computation due
    to the implicit optimization over <semantics><mrow><mi>λ</mi></mrow><annotation
    encoding="application/x-tex">\lambda</annotation></semantics>λ (specifically,
    the optimal value of <semantics><mrow><mi>λ</mi></mrow><annotation encoding="application/x-tex">\lambda</annotation></semantics>λ
    will depend on <semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics>n),
    but we would see that the dependence on the confidence level <semantics><mrow><mi>ϵ</mi></mrow><annotation
    encoding="application/x-tex">\epsilon</annotation></semantics>ϵ is <semantics><mrow><mi>O</mi><mo
    stretchy="false">(</mo><mi>log</mi><mo>⁡</mo><mo stretchy="false">(</mo><msup><mi>ϵ</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo
    stretchy="false">)</mo><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(\log(\epsilon^{-1}))</annotation></semantics>O(log(ϵ−1))
    , and the dependence on the number of samples is (just as with Chebyshev’s inequality)
    <semantics><mrow><msup><mi>n</mi><mrow><mo>−</mo><mn>1</mn><mi mathvariant="normal">/</mi><mn>2</mn></mrow></msup></mrow><annotation
    encoding="application/x-tex">n^{-1/2}</annotation></semantics>n−1/2.
  prefs: []
  type: TYPE_NORMAL
- en: '**Exercise**: Consider once more the i.i.d. Poisson random variables <semantics><mrow><msub><mi>T</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">T_i</annotation></semantics>Ti​ and their sample
    mean <semantics><mrow><mi>S</mi></mrow><annotation encoding="application/x-tex">S</annotation></semantics>S.
    Use the Chernoff bound to find the smallest value <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α such that <semantics><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>S</mi><mo>≥</mo><mi>α</mi><mo stretchy="false">)</mo><mo>≤</mo><mn>0.05</mn></mrow><annotation
    encoding="application/x-tex">P(S \geq \alpha) \leq 0.05</annotation></semantics>P(S≥α)≤0.05.
    How does your result compare to the true probability, to the Markov bound, and
    to the Chebyshev bound? *Hint: you can easily look up the MGF for the Poisson
    distribution.*'
  prefs: []
  type: TYPE_NORMAL
- en: 'Video example: flipping biased coins with the Chernoff bound[¶](#video-example-flipping-biased-coins-with-the-chernoff-bound
    "Link to this Section")'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '[PRE7]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: '(Optional) Example: comparing bounds on a known Gaussian random variable[¶](#id-optional-example-comparing-bounds-on-a-known-gaussian-random-variable
    "Link to this Section")'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Bounding the probability for a given threshold[¶](#bounding-the-probability-for-a-given-threshold
    "Link to this Section")
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: We now apply each of the bounds we’ve learned about to a Gaussian random variable
    with known mean <semantics><mrow><mi>μ</mi></mrow><annotation encoding="application/x-tex">\mu</annotation></semantics>μ
    and variance <semantics><mrow><msup><mi>σ</mi><mn>2</mn></msup></mrow><annotation
    encoding="application/x-tex">\sigma^2</annotation></semantics>σ2, <semantics><mrow><mi>X</mi><mo>∼</mo><mi
    mathvariant="script">N</mi><mo stretchy="false">(</mo><mi>μ</mi><mo separator="true">,</mo><msup><mi>σ</mi><mn>2</mn></msup><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">X \sim
    \mathcal{N}(\mu, \sigma^2)</annotation></semantics>X∼N(μ,σ2). For this example,
    we can also compute exact bounds and compare them.
  prefs: []
  type: TYPE_NORMAL
- en: We cannot use Markov’s inequality, since this random variable can take on negative
    values.
  prefs: []
  type: TYPE_NORMAL
- en: 'Because <semantics><mrow><mi>X</mi><mo>−</mo><mi>μ</mi></mrow><annotation encoding="application/x-tex">X
    - \mu</annotation></semantics>X−μ is symmetric about zero, the Chebyshev bound
    for a single tail is:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>−</mo><mi>μ</mi><mo>≥</mo><mi>t</mi><mo
    stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>P</mi><mo
    stretchy="false">(</mo><mi mathvariant="normal">∣</mi><mi>X</mi><mo>−</mo><mi>μ</mi><mi
    mathvariant="normal">∣</mi><mo>≥</mo><mi>t</mi><mo stretchy="false">)</mo><mo>≤</mo><mfrac><msup><mi>σ</mi><mn>2</mn></msup><mrow><mn>2</mn><msup><mi>t</mi><mn>2</mn></msup></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">P(X - \mu \geq t) = \frac{1}{2}P(|X - \mu| \geq t)
    \leq \frac{\sigma^2}{2t^2}</annotation></semantics>P(X−μ≥t)=21​P(∣X−μ∣≥t)≤2t2σ2​[(20)](#Q78iqYYq89
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: Next, let’s apply Chernoff’s method. Let <semantics><mrow><mi>Z</mi><mo>=</mo><mi>X</mi><mo>−</mo><mi>μ</mi><mo>∼</mo><mi
    mathvariant="script">N</mi><mo stretchy="false">(</mo><mn>0</mn><mo separator="true">,</mo><msup><mi>σ</mi><mn>2</mn></msup><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">Z = X -
    \mu \sim \mathcal{N}(0, \sigma^2)</annotation></semantics>Z=X−μ∼N(0,σ2). Then
    <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    has MGF <semantics><mrow><msub><mi>M</mi><mi>Z</mi></msub><mo stretchy="false">(</mo><mi>λ</mi><mo
    stretchy="false">)</mo><mo>=</mo><msup><mi>e</mi><mrow><msup><mi>σ</mi><mn>2</mn></msup><msup><mi>λ</mi><mn>2</mn></msup><mi
    mathvariant="normal">/</mi><mn>2</mn></mrow></msup></mrow><annotation encoding="application/x-tex">M_Z(\lambda)
    = e^{\sigma^2 \lambda^2/2}</annotation></semantics>MZ​(λ)=eσ2λ2/2. So for <semantics><mrow><mi>λ</mi><mo>≥</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\lambda \ge 0</annotation></semantics>λ≥0,
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi mathvariant="double-struck">P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>−</mo><mi>μ</mi><mo>></mo><mi>t</mi><mo
    stretchy="false">)</mo><mo>≤</mo><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>λ</mi><mo>≥</mo><mn>0</mn></mrow></munder><mi>exp</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mfrac><mrow><msup><mi>σ</mi><mn>2</mn></msup><msup><mi>λ</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>−</mo><mi>λ</mi><mi>t</mi><mo
    fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">\mathbb{P}(X
    - \mu > t) ~ \le ~ \min_{\lambda \geq 0} \exp \left( \frac{\sigma^2 \lambda^2}{2}
    - \lambda t \right)</annotation></semantics>P(X−μ>t) ≤ λ≥0min​exp(2σ2λ2​−λt)[(21)](#MZjKcZtmpW
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: How do we optimize this in <semantics><mrow><mi>λ</mi></mrow><annotation encoding="application/x-tex">\lambda</annotation></semantics>λ?
    Recognize that since <semantics><mrow><mi>exp</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\exp(x)</annotation></semantics>exp(x)
    is an increasing function, we have
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>λ</mi><mo>≥</mo><mn>0</mn></mrow></munder><mi>exp</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mfrac><mrow><msup><mi>σ</mi><mn>2</mn></msup><msup><mi>λ</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>−</mo><mi>λ</mi><mi>t</mi><mo
    fence="true">)</mo></mrow><mo>=</mo><mi>exp</mi><mo>⁡</mo><mrow><mo fence="true">(</mo><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>λ</mi><mo>≥</mo><mn>0</mn></mrow></munder><mrow><mo
    fence="true">{</mo><mfrac><mrow><msup><mi>σ</mi><mn>2</mn></msup><msup><mi>λ</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>−</mo><mi>λ</mi><mi>t</mi><mo
    fence="true">}</mo></mrow><mo fence="true">)</mo></mrow><mi mathvariant="normal">.</mi></mrow><annotation
    encoding="application/x-tex">\min_{\lambda \geq 0} \exp \left( \frac{\sigma^2
    \lambda^2}{2} - \lambda t \right) = \exp \left(\min_{\lambda \geq 0} \left\{\frac{\sigma^2
    \lambda^2}{2} - \lambda t \right\} \right).</annotation></semantics>λ≥0min​exp(2σ2λ2​−λt)=exp(λ≥0min​{2σ2λ2​−λt}).[(22)](#T7lejrdrc0
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: The quantity in the exponent is a quadratic function <semantics><mrow><mi>f</mi><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">f(\lambda)</annotation></semantics>f(λ), and can
    be minimized using the quadratic formula to get <semantics><mrow><msup><mi>λ</mi><mo>∗</mo></msup><mo>=</mo><mfrac><mi>t</mi><msup><mi>σ</mi><mn>2</mn></msup></mfrac></mrow><annotation
    encoding="application/x-tex">\lambda^* = \frac{t}{\sigma^2}</annotation></semantics>λ∗=σ2t​,
    and <semantics><mrow><mi>f</mi><mo stretchy="false">(</mo><msup><mi>λ</mi><mo>∗</mo></msup><mo
    stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mo>−</mo><msup><mi>t</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><msup><mi>σ</mi><mn>2</mn></msup></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">f(\lambda^*) = \frac{-t^2}{2\sigma^2}</annotation></semantics>f(λ∗)=2σ2−t2​.
  prefs: []
  type: TYPE_NORMAL
- en: Putting everything together, we get
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>−</mo><mi>μ</mi><mo>></mo><mi>t</mi><mo
    stretchy="false">)</mo><mo>≤</mo><mi>exp</mi><mo>⁡</mo><mrow><mo fence="true">(</mo><mo>−</mo><mfrac><msup><mi>t</mi><mn>2</mn></msup><mrow><mn>2</mn><msup><mi>σ</mi><mn>2</mn></msup></mrow></mfrac><mo
    fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">P(X-\mu
    > t) ~\leq ~\exp\left(-\frac{t^2}{2\sigma^2}\right)</annotation></semantics>P(X−μ>t) ≤ exp(−2σ2t2​)[(23)](#OACwQQ7NGh
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'Let’s visualize these two bounds along with the exact probability (which we
    can calculate using the CDF):'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE8]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 800x300 with 2 Axes>](../Images/8222ce80d529f6cef46b49239a149e01.png)'
  prefs: []
  type: TYPE_IMG
- en: Bounding the threshold for a given probability[¶](#bounding-the-threshold-for-a-given-probability
    "Link to this Section")
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: 'Suppose that instead of being given a threshold and asked for the probability
    of exceeding it, we instead want the opposite: we want to know, given a desired
    probability, a bound or threshold such that the probability of exceeding that
    bound is small. This is the **upper confidence bound** we described earlier. To
    simplify our calculations, and without loss of generality, we’ll assume that <semantics><mrow><mi>μ</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\mu = 0</annotation></semantics>μ=0. If we go about
    computing this for the normal distribution, we find that:'
  prefs: []
  type: TYPE_NORMAL
- en: For Chebyshev’s inequality, we have that <semantics><mrow><mi>ϵ</mi><mo>=</mo><mfrac><msup><mi>σ</mi><mn>2</mn></msup><mrow><mn>2</mn><msup><mi>α</mi><mn>2</mn></msup></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">\epsilon = \frac{\sigma^2}{2\alpha^2}</annotation></semantics>ϵ=2α2σ2​,
    or that <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mi>σ</mi><msqrt><mrow><mn>2</mn><mi>ϵ</mi></mrow></msqrt></mfrac></mrow><annotation
    encoding="application/x-tex">\alpha(\epsilon) = \frac{\sigma}{\sqrt{2\epsilon}}</annotation></semantics>α(ϵ)=2ϵ​σ​.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: For Chernoff’s bound, we have that <semantics><mrow><mi>ϵ</mi><mo>=</mo><mi>exp</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mo>−</mo><mfrac><msup><mi>α</mi><mn>2</mn></msup><mrow><mn>2</mn><msup><mi>σ</mi><mn>2</mn></msup></mrow></mfrac><mo
    fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">\epsilon
    = \exp\left(-\frac{\alpha^2}{2\sigma^2}\right)</annotation></semantics>ϵ=exp(−2σ2α2​),
    or equivalently <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>σ</mi><msqrt><mrow><mn>2</mn><mi>log</mi><mo>⁡</mo><mo
    stretchy="false">(</mo><mn>1</mn><mi mathvariant="normal">/</mi><mi>ϵ</mi><mo
    stretchy="false">)</mo></mrow></msqrt></mrow><annotation encoding="application/x-tex">\alpha(\epsilon)
    = \sigma\sqrt{2\log(1/\epsilon)}</annotation></semantics>α(ϵ)=σ2log(1/ϵ)​.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: As we saw before, the exact probability is <semantics><mrow><msup><mi>F</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo
    stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>ϵ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">F^{-1}(1-\epsilon)</annotation></semantics>F−1(1−ϵ).
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '[PRE9]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 800x300 with 2 Axes>](../Images/6335459126d5c49ee9132ca70f793965.png)'
  prefs: []
  type: TYPE_IMG
- en: Both bounds are clearly loose (i.e., too large compared to the true value),
    but the Chernoff bound is much tighter for larger values of <semantics><mrow><mi>t</mi></mrow><annotation
    encoding="application/x-tex">t</annotation></semantics>t (or equivalently, for
    small values of <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ.
  prefs: []
  type: TYPE_NORMAL
- en: It’s a bit silly to compute Chernoff and Chebyshev tail bounds this way for
    normal random variables, because we already know the true probabilities. Still,
    this helps us understand how good those bounds are, and we’ll see in the next
    section that we can apply these same bounds even in cases where we don’t know
    the MGF exactly.
  prefs: []
  type: TYPE_NORMAL
- en: Hoeffding’s Inequality[¶](#hoeffdings-inequality "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: So far, we’ve seen that using the MGF of a random variable can give us excellent
    tail bounds. But, if we know the MGF exactly, then we also know the distribution
    of the random variable, and in that case we might as well use the CDF to find
    tail bounds. As we saw in the previous example, even the Chernoff bound was not
    as good as using the actual CDF.
  prefs: []
  type: TYPE_NORMAL
- en: 'In that case, what’s the point of the Chernoff bound? In many cases, we may
    not know the MGF, but we can **bound** it: in other words, we can find some function
    of <semantics><mrow><mi>λ</mi></mrow><annotation encoding="application/x-tex">\lambda</annotation></semantics>λ,
    <semantics><mrow><mi>h</mi><mo stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">h(\lambda)</annotation></semantics>h(λ), such that
    <semantics><mrow><msub><mi>M</mi><mi>X</mi></msub><mo stretchy="false">(</mo><mi>λ</mi><mo
    stretchy="false">)</mo><mo>≤</mo><mi>λ</mi><mi mathvariant="normal">∀</mi><mi>λ</mi></mrow><annotation
    encoding="application/x-tex">M_X(\lambda) \leq \lambda ~ ~ \forall \lambda</annotation></semantics>MX​(λ)≤λ  ∀λ.'
  prefs: []
  type: TYPE_NORMAL
- en: 'One such example is that of **bounded** random variables: that is, random variables
    that only take on values between some lower bound <semantics><mrow><mi>a</mi></mrow><annotation
    encoding="application/x-tex">a</annotation></semantics>a and some upper bound
    <semantics><mrow><mi>b</mi></mrow><annotation encoding="application/x-tex">b</annotation></semantics>b.'
  prefs: []
  type: TYPE_NORMAL
- en: Hoeffding’s Lemma[¶](#hoeffdings-lemma "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Hoeffding’s lemma gives us an upper bound on the MGF for any bounded random
    variable. Specifically, given a random variable <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X with mean <semantics><mrow><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">E[X]</annotation></semantics>E[X] that is bounded
    between <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a
    and <semantics><mrow><mi>b</mi></mrow><annotation encoding="application/x-tex">b</annotation></semantics>b,
    we have that
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><msub><mi>M</mi><mi>X</mi></msub><mo stretchy="false">(</mo><mi>λ</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>E</mi><mo stretchy="false">[</mo><msup><mi>e</mi><mrow><mi>λ</mi><mi>X</mi></mrow></msup><mo
    stretchy="false">]</mo><mo>≤</mo><mi>exp</mi><mo>⁡</mo><mrow><mo fence="true">{</mo><mi>λ</mi><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo><mo>+</mo><mfrac><mrow><msup><mi>λ</mi><mn>2</mn></msup><mo
    stretchy="false">(</mo><mi>b</mi><mo>−</mo><mi>a</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow><mn>8</mn></mfrac><mo
    fence="true">}</mo></mrow></mrow><annotation encoding="application/x-tex">M_X(\lambda)
    = E[e^{\lambda X}] \leq \exp\left\{\lambda E[X] + \frac{\lambda^2(b-a)^2}{8}\right\}</annotation></semantics>MX​(λ)=E[eλX]≤exp{λE[X]+8λ2(b−a)2​}[(24)](#w0rHfAxkOq
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: For the proof and more on the lemma, see [the Hoeffding’s lemma Wikipedia article](https://en.wikipedia.org/wiki/Hoeffding%27s_lemma).
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: Hoeffding’s Inequality[¶](#hoeffdings-inequality-1 "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: We could use Hoeffding’s lemma on any bounded random variable, in combination
    with Chernoff’s bound, to bound tail probabilities. For the rest of this section,
    we’ll focus on the specific case of sample means, which is what Hoeffding’s inequality
    is all about.
  prefs: []
  type: TYPE_NORMAL
- en: 'Let <semantics><mrow><msub><mi>X</mi><mn>1</mn></msub><mo separator="true">,</mo><msub><mi>X</mi><mn>2</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>X</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">X_1 ,X_2, \ldots, X_n</annotation></semantics>X1​,X2​,…,Xn​
    be independent (but not necessarily identically distributed) random variables
    bounded between <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a
    and <semantics><mrow><mi>b</mi></mrow><annotation encoding="application/x-tex">b</annotation></semantics>b.
    Then Hoeffding’s inequality states that:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>P</mi><mrow><mo fence="true">(</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mo
    stretchy="false">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo>−</mo><mi mathvariant="double-struck">E</mi><mo
    stretchy="false">[</mo><msub><mi>X</mi><mi>i</mi></msub><mo stretchy="false">]</mo><mo
    stretchy="false">)</mo><mo>≥</mo><mi>t</mi><mo fence="true">)</mo></mrow><mo>≤</mo><mi>exp</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mo>−</mo><mfrac><mrow><mn>2</mn><mi>n</mi><msup><mi>t</mi><mn>2</mn></msup></mrow><mrow><mo
    stretchy="false">(</mo><mi>b</mi><mo>−</mo><mi>a</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mo
    fence="true">)</mo></mrow><mi>P</mi><mrow><mo fence="true">(</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mo
    stretchy="false">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo>−</mo><mi mathvariant="double-struck">E</mi><mo
    stretchy="false">[</mo><msub><mi>X</mi><mi>i</mi></msub><mo stretchy="false">]</mo><mo
    stretchy="false">)</mo><mo>≤</mo><mo>−</mo><mi>t</mi><mo fence="true">)</mo></mrow><mo>≤</mo><mi>exp</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mo>−</mo><mfrac><mrow><mn>2</mn><mi>n</mi><msup><mi>t</mi><mn>2</mn></msup></mrow><mrow><mo
    stretchy="false">(</mo><mi>b</mi><mo>−</mo><mi>a</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mo
    fence="true">)</mo></mrow><mi mathvariant="normal">.</mi></mrow><annotation encoding="application/x-tex">P\left(\frac{1}{n}\sum_{i=1}^n
    (X_i - \mathbb{E}[X_i]) \geq t\right) \leq \exp\left(-\frac{2nt^2}{(b-a)^2}\right)
    \\ P\left(\frac{1}{n}\sum_{i=1}^n (X_i - \mathbb{E}[X_i]) \leq -t\right) \leq
    \exp\left(-\frac{2nt^2}{(b-a)^2}\right).</annotation></semantics>P(n1​i=1∑n​(Xi​−E[Xi​])≥t)≤exp(−(b−a)22nt2​)P(n1​i=1∑n​(Xi​−E[Xi​])≤−t)≤exp(−(b−a)22nt2​).[(25)](#qzHc4jOWYW
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'We also have the two-sided version:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>P</mi><mrow><mo fence="true">(</mo><mrow><mo fence="true">∣</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mo
    stretchy="false">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo>−</mo><mi mathvariant="double-struck">E</mi><mo
    stretchy="false">[</mo><msub><mi>X</mi><mi>i</mi></msub><mo stretchy="false">]</mo><mo
    stretchy="false">)</mo><mo fence="true">∣</mo></mrow><mo>≥</mo><mi>t</mi><mo fence="true">)</mo></mrow><mo>≤</mo><mn>2</mn><mi>exp</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mo>−</mo><mfrac><mrow><mn>2</mn><mi>n</mi><msup><mi>t</mi><mn>2</mn></msup></mrow><mrow><mo
    stretchy="false">(</mo><mi>b</mi><mo>−</mo><mi>a</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mo
    fence="true">)</mo></mrow><mi mathvariant="normal">.</mi></mrow><annotation encoding="application/x-tex">P\left(\left|\frac{1}{n}\sum_{i=1}^n
    (X_i - \mathbb{E}[X_i])\right| \geq t\right) \leq 2\exp\left(-\frac{2nt^2}{(b-a)^2}\right).</annotation></semantics>P(∣∣​n1​i=1∑n​(Xi​−E[Xi​])∣∣​≥t)≤2exp(−(b−a)22nt2​).[(26)](#Fl5TudyXcK
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'In the case where the <semantics><mrow><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">X_i</annotation></semantics>Xi​ are identically distributed
    with mean <semantics><mrow><mi>μ</mi></mrow><annotation encoding="application/x-tex">\mu</annotation></semantics>μ,
    we can rewrite the first version as:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi mathvariant="double-struck">P</mi><mrow><mo fence="true">(</mo><mrow><mo
    fence="true">[</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><msub><mi>X</mi><mi>i</mi></msub><mo
    fence="true">]</mo></mrow><mo>−</mo><mi>μ</mi><mo>≥</mo><mi>t</mi><mo fence="true">)</mo></mrow><mo>≤</mo><mi>exp</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mo>−</mo><mfrac><mrow><mn>2</mn><mi>n</mi><msup><mi>t</mi><mn>2</mn></msup></mrow><mrow><mo
    stretchy="false">(</mo><mi>b</mi><mo>−</mo><mi>a</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mo
    fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">\mathbb{P}\left(\left[\frac{1}{n}\sum_{i=1}^n
    X_i\right] - \mu \geq t\right) \leq \exp\left(-\frac{2nt^2}{(b-a)^2}\right) \\</annotation></semantics>P([n1​i=1∑n​Xi​]−μ≥t)≤exp(−(b−a)22nt2​)[(27)](#b4eOM9I66p
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'This is a remarkable result! Recall that the Central Limit Theorem tells us
    that a similar result holds asymptotically: that is, for large values of <semantics><mrow><mi>n</mi></mrow><annotation
    encoding="application/x-tex">n</annotation></semantics>n, the sample mean converges
    to a normal distribution, and therefore, the probability of obtaining a value
    far from the mean decreases as <semantics><mrow><msup><mi>e</mi><mrow><mo>−</mo><msup><mi>t</mi><mn>2</mn></msup></mrow></msup></mrow><annotation
    encoding="application/x-tex">e^{-t^2}</annotation></semantics>e−t2. But this statement
    holds for **any** value of <semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics>n:
    whether <semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics>n
    is small or big, or the distribution of the <semantics><mrow><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">X_i</annotation></semantics>Xi​ is “nice” or not,
    this is true for the sample mean of any bounded random variables.'
  prefs: []
  type: TYPE_NORMAL
- en: We can also know it without knowing anything else about the distribution of
    the random variables <semantics><mrow><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">X_i</annotation></semantics>Xi​, other than some
    bounds on them.
  prefs: []
  type: TYPE_NORMAL
- en: 'Just as before, we can make some observations:'
  prefs: []
  type: TYPE_NORMAL
- en: '*How fast does our bound increase as <semantics><mrow><mi>ϵ</mi></mrow><annotation
    encoding="application/x-tex">\epsilon</annotation></semantics>ϵ gets small?* Solving
    for an upper confidence bound <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ),
    we see that <semantics><mrow><mi>ϵ</mi><mo>=</mo><mfrac><mrow><msub><mi>M</mi><mi>X</mi></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow><msup><mi>e</mi><mrow><mi>λ</mi><mi>α</mi></mrow></msup></mfrac></mrow><annotation
    encoding="application/x-tex">\epsilon = \frac{M_X(\lambda)}{e^{\lambda \alpha}}</annotation></semantics>ϵ=eλαMX​(λ)​.
    Solving for <semantics><mrow><mi>α</mi></mrow><annotation encoding="application/x-tex">\alpha</annotation></semantics>α
    (see below for an example), we can see that it grows as <semantics><mrow><mi>log</mi><mo>⁡</mo><mo
    stretchy="false">(</mo><msup><mi>ϵ</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\log(\epsilon^{-1})</annotation></semantics>log(ϵ−1):
    this is much, much slower than our previous two results! So, if we can find a
    class of random variables where the MGF is known (or bounded, as in the previous
    observation), then we can place much tighter bounds on those random variables.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '*Note a small error in the video below: the last equation should say <semantics><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>Y</mi><mo>≤</mo><mo>−</mo><mi>t</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">P(Y \leq -t)</annotation></semantics>P(Y≤−t), not
    <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>Y</mi><mo>≤</mo><mi>t</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(Y \leq
    t)</annotation></semantics>P(Y≤t)*'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: 'Example: Sample Mean with Hoeffding’s inequality[¶](#example-sample-mean-with-hoeffdings-inequality
    "Link to this Section")'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Given <semantics><mrow><msub><mi>X</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>X</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">X_1,
    \ldots, X_n</annotation></semantics>X1​,…,Xn​ and their sample mean <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y, how well does Hoefdding’s
    inequality answer the question of whether <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y can be far from the true
    mean <semantics><mrow><mi>μ</mi></mrow><annotation encoding="application/x-tex">\mu</annotation></semantics>μ?
    Answering this question simply requires us to state the inequality and then analyze
    the result:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi mathvariant="double-struck">P</mi><mrow><mo fence="true">(</mo><mi>Y</mi><mo>−</mo><mi>μ</mi><mo>≥</mo><mi>α</mi><mo
    fence="true">)</mo></mrow><mo>≤</mo><mi>exp</mi><mo>⁡</mo><mrow><mo fence="true">(</mo><mo>−</mo><mfrac><mrow><mn>2</mn><mi>n</mi><msup><mi>α</mi><mn>2</mn></msup></mrow><mrow><mo
    stretchy="false">(</mo><mi>b</mi><mo>−</mo><mi>a</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mo
    fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">\mathbb{P}\left(Y
    - \mu \geq \alpha\right) \leq \exp\left(-\frac{2n\alpha^2}{(b-a)^2}\right) \\</annotation></semantics>P(Y−μ≥α)≤exp(−(b−a)22nα2​)[(28)](#h3WyyvpbZo
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'As expected (since Hoeffding’s inequality is derived using the Chernoff bound),
    we see the same dependence on <semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics>n:
    the probability decreases proportional to <semantics><mrow><msup><mi>e</mi><mrow><mo>−</mo><mi>n</mi></mrow></msup></mrow><annotation
    encoding="application/x-tex">e^{-n}</annotation></semantics>e−n. As mentioned
    earlier, we also see a dependence on <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α of the form <semantics><mrow><msup><mi>e</mi><mrow><mo>−</mo><msup><mi>α</mi><mn>2</mn></msup></mrow></msup></mrow><annotation
    encoding="application/x-tex">e^{-\alpha^2}</annotation></semantics>e−α2, as we
    would with a normal random variable or with the Central Limit Theorem.'
  prefs: []
  type: TYPE_NORMAL
- en: What if we were to ask for an upper confidence bound <semantics><mrow><mi>α</mi><mo
    stretchy="false">(</mo><mi>ϵ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ) at
    a given level of confidence <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ?
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mi>ϵ</mi></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mi>exp</mi><mo>⁡</mo><mrow><mo fence="true">(</mo><mo>−</mo><mfrac><mrow><mn>2</mn><mi>n</mi><msup><mi>α</mi><mn>2</mn></msup></mrow><mrow><mo
    stretchy="false">(</mo><mi>b</mi><mo>−</mo><mi>a</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mo
    fence="true">)</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo stretchy="false">(</mo><mi>b</mi><mo>−</mo><mi>a</mi><msup><mo
    stretchy="false">)</mo><mn>2</mn></msup><mi>log</mi><mo>⁡</mo><mo stretchy="false">(</mo><mn>1</mn><mi
    mathvariant="normal">/</mi><mi>ϵ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mn>2</mn><mi>n</mi><msup><mi>α</mi><mn>2</mn></msup></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mi>α</mi></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mi mathvariant="normal">∣</mi><mi>b</mi><mo>−</mo><mi>a</mi><mi
    mathvariant="normal">∣</mi><msqrt><mfrac><mrow><mi>log</mi><mo>⁡</mo><mo stretchy="false">(</mo><mn>1</mn><mi
    mathvariant="normal">/</mi><mi>ϵ</mi><mo stretchy="false">)</mo></mrow><mrow><mn>2</mn><mi>n</mi></mrow></mfrac></msqrt></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} \epsilon &= \exp\left(-\frac{2n\alpha^2}{(b-a)^2}\right)
    \\ (b-a)^2 \log(1/\epsilon) &= 2n\alpha^2 \\ \alpha &= |b-a|\sqrt{\frac{\log(1/\epsilon)}{2n}}
    \end{align*}</annotation></semantics>ϵ(b−a)2log(1/ϵ)α​=exp(−(b−a)22nα2​)=2nα2=∣b−a∣2nlog(1/ϵ)​​​[(29)](#J81djwt1ne
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'We can see that while this bound’s dependence on <semantics><mrow><mi>ϵ</mi></mrow><annotation
    encoding="application/x-tex">\epsilon</annotation></semantics>ϵ is much better
    than what we saw with the Chebyshev bound, its dependence on <semantics><mrow><mi>n</mi></mrow><annotation
    encoding="application/x-tex">n</annotation></semantics>n is similar: **this bound
    also decreases proportional to <semantics><mrow><msup><mi>n</mi><mrow><mo>−</mo><mn>1</mn><mi
    mathvariant="normal">/</mi><mn>2</mn></mrow></msup></mrow><annotation encoding="application/x-tex">n^{-1/2}</annotation></semantics>n−1/2**.'
  prefs: []
  type: TYPE_NORMAL
- en: Proof of Hoeffding’s Inequality[¶](#proof-of-hoeffdings-inequality "Link to
    this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Without loss of generality ,we can replace <semantics><mrow><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">X_i</annotation></semantics>Xi​ with <semantics><mrow><msub><mi>X</mi><mi>i</mi></msub><mo>−</mo><mi
    mathvariant="double-struck">E</mi><mo stretchy="false">[</mo><msub><mi>X</mi><mi>i</mi></msub><mo
    stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">X_i - \mathbb{E}[X_i]</annotation></semantics>Xi​−E[Xi​]
    if necessary, so we may assume that <semantics><mrow><mi mathvariant="double-struck">E</mi><mo
    stretchy="false">[</mo><msub><mi>X</mi><mi>i</mi></msub><mo stretchy="false">]</mo><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\mathbb{E}[X_i] = 0</annotation></semantics>E[Xi​]=0
    for each <semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics>i
    to simplify our calculations. Let <semantics><mrow><mi>Z</mi><mo>=</mo><msubsup><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></msubsup><mfrac><msub><mi>X</mi><mi>i</mi></msub><mi>n</mi></mfrac></mrow><annotation
    encoding="application/x-tex">Z = \sum_{i=1}^n \frac{X_i}{n}</annotation></semantics>Z=∑i=1n​nXi​​,
    and observe that each term is bounded between <semantics><mrow><mi>a</mi><mi mathvariant="normal">/</mi><mi>n</mi></mrow><annotation
    encoding="application/x-tex">a/n</annotation></semantics>a/n and <semantics><mrow><mi>b</mi><mi
    mathvariant="normal">/</mi><mi>n</mi></mrow><annotation encoding="application/x-tex">b/n</annotation></semantics>b/n.
    Then
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><msub><mi>M</mi><mi>Z</mi></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><msub><mi>M</mi><msub><mi>X</mi><mi>i</mi></msub></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>≤</mo><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mi>exp</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mfrac><mrow><mo stretchy="false">(</mo><mi>b</mi><mo>−</mo><mi>a</mi><msup><mo
    stretchy="false">)</mo><mn>2</mn></msup></mrow><mrow><mn>8</mn><msup><mi>n</mi><mn>2</mn></msup></mrow></mfrac><msup><mi>λ</mi><mn>2</mn></msup><mo
    fence="true">)</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mi>exp</mi><mo>⁡</mo><mrow><mo fence="true">(</mo><mfrac><mrow><mo
    stretchy="false">(</mo><mi>b</mi><mo>−</mo><mi>a</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow><mrow><mn>8</mn><mi>n</mi></mrow></mfrac><msup><mi>λ</mi><mn>2</mn></msup><mo
    fence="true">)</mo></mrow></mrow></mstyle></mtd></mtr></mtable><annotation encoding="application/x-tex">\begin{align*}
    M_Z(\lambda) &= \prod_{i=1}^n M_{X_i}(\lambda) \\ & \leq \prod_{i=1}^n \exp \left(
    \frac{(b-a)^2}{8n^2}\lambda^2 \right) \\ & = \exp \left( \frac{(b-a)^2}{8n}\lambda^2
    \right) \end{align*}</annotation></semantics>MZ​(λ)​=i=1∏n​MXi​​(λ)≤i=1∏n​exp(8n2(b−a)2​λ2)=exp(8n(b−a)2​λ2)​[(30)](#P7QLoT1cYR
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'Applying Chernoff’s method:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>Z</mi><mo>></mo><mi>t</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>≤</mo><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>λ</mi><mo>≥</mo><mn>0</mn></mrow></munder><mi>exp</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mfrac><mrow><mo stretchy="false">(</mo><mi>b</mi><mo>−</mo><mi>a</mi><msup><mo
    stretchy="false">)</mo><mn>2</mn></msup><msup><mi>λ</mi><mn>2</mn></msup></mrow><mrow><mn>8</mn><mi>n</mi></mrow></mfrac><mo>−</mo><mi>λ</mi><mi>t</mi><mo
    fence="true">)</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mi>exp</mi><mo>⁡</mo><mrow><mo fence="true">(</mo><mo>−</mo><mfrac><mrow><mn>2</mn><mi>n</mi><msup><mi>t</mi><mn>2</mn></msup></mrow><mrow><mo
    stretchy="false">(</mo><mi>b</mi><mo>−</mo><mi>a</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mo
    fence="true">)</mo></mrow><mi mathvariant="normal">.</mi></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} P(Z > t) ~ & \le ~ \min_{\lambda \geq
    0} \exp \left( \frac{(b-a)^2 \lambda^2}{8n} - \lambda t \right) \\ & = \exp\left(-\frac{2nt^2}{(b-a)^2}\right).
    \end{align*}</annotation></semantics>P(Z>t) ​≤ λ≥0min​exp(8n(b−a)2λ2​−λt)=exp(−(b−a)22nt2​).​[(31)](#lRulWwIJDD
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
