  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 特别感谢所有通过GitHub拉取请求编辑书籍或通过创建*问题*或发送电子邮件提出建议的人：`nickyfoto`（黄强），`desautm`（马克-安德烈·德索特尔斯），`michaschwab`（米哈伊尔·施瓦布），`alvarolarreategui`（阿尔瓦罗·拉雷特圭），`jakevc`（杰克·范坎彭），`omerta`（吉列尔莫·伦格曼），`espinielli`（恩里科·斯皮内利），`asimumba`（阿隆·西姆巴），`braunschweig`（马尔代沃），`gwierzchowski`（格热戈orz·维赫罗夫斯基），`technocrat`（理查德·卡雷加），`atzakas`，`defeit`（大卫·艾默生·费特），`shiraamitchell`（希拉·米切尔），`Nathalie-S`，`andreashandel`（安德烈亚斯·汉德尔），`berkowitze`（伊利亚斯·伯科维茨），`Dean-Webb`（迪恩·韦伯），`mohayusuf`，`jimrothstein`，`mPloenzke`（马修·普洛恩茨克），`NicholasDowand`（尼古拉斯·道），`kant`（达里奥·赫雷努），`debbieyuster`（黛比·尤斯特），`tuanchauict`（段超），`phzeller`，`BTJ01`（布拉德·J），`glsnow`（格雷格·斯诺），`mberlanda`（马乌罗·贝尔兰达），`wfan9`，`larswestvang`（拉斯·韦斯特万格），`jj999`（扬·安德烈·约德科维奇），`Kriegslustig`（卢卡·尼尔斯·施密德），`odahhani`，`aidanhorn`（艾丹·霍恩），`atraxler`（阿德里安·特拉克斯勒），`alvegorova`，`wycheong`（
