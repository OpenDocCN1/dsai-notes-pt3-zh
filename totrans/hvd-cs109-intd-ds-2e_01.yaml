- en: This is the website for the **Data Wrangling and Visualization with R** part
    of **Introduction to Data Science**.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 这是**《数据科学导论》**中**《使用R进行数据整理和可视化》**部分的网站。
- en: The website for the **Statistics and Prediction Algorithms Through Case Studies**
    part is [here](http://rafalab.dfci.harvard.edu/dsbook-part-2/)[¹](#fn1).
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: '**《通过案例研究学习统计和预测算法》**部分的网站[在此](http://rafalab.dfci.harvard.edu/dsbook-part-2/)[¹](#fn1)。'
- en: We make announcements related to the book on Twitter. For updates follow [@rafalab](https://twitter.com/rafalab)[²](#fn2).
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 我们在Twitter上发布与本书相关的公告。如需更新，请关注[@rafalab](https://twitter.com/rafalab)[²](#fn2)。
- en: This book started out as the class notes used in the HarvardX [Data Science
    Series](https://www.edx.org/professional-certificate/harvardx-data-science)[³](#fn3).
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 本书最初是哈佛X [数据科学系列](https://www.edx.org/professional-certificate/harvardx-data-science)[³](#fn3)中使用的课程笔记。
- en: The Quarto files used to generate the book is available on [GitHub](https://github.com/rafalab/dsbook-part-1)[⁴](#fn4).
    Note that, the graphical theme used for plots throughout the book can be recreated
    using the `ds_theme_set()` function from **dslabs** package.
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 用于生成本书的Quarto文件可在[GitHub](https://github.com/rafalab/dsbook-part-1)[⁴](#fn4)上找到。注意，本书中用于图表的图形主题可以使用**dslabs**包中的`ds_theme_set()`函数重新创建。
