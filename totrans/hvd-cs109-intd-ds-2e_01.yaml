- en: A hardcopy version of the book is available from [CRC Press](https://www.routledge.com/Introduction-to-Data-Science-Data-Wrangling-and-Visualization-with-R/Irizarry/p/book/9781032116556)[⁶](#fn6).
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 本书的有售纸质版可在[CRC Press](https://www.routledge.com/Introduction-to-Data-Science-Data-Wrangling-and-Visualization-with-R/Irizarry/p/book/9781032116556)[⁶](#fn6)处获得。
- en: A free PDF of the October 24, 2019 version of the book is available from [Leanpub](https://leanpub.com/datasciencebook)[⁷](#fn7).
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 可在[Leanpub](https://leanpub.com/datasciencebook)[⁷](#fn7)获得2019年10月24日版本本书的免费PDF。
- en: Acknowledgments
  id: totrans-13
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 致谢
- en: This book is dedicated to all the people involved in building and maintaining
    R and the R packages we use in this book. A special thanks to the developers and
    maintainers of base R, the tidyverse, data.table, and the caret package.
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 本书献给所有参与构建和维护R及其在本书中使用的R包的人们。特别感谢基础R、tidyverse、data.table和caret包的开发者和维护者。
- en: A special thanks to Jenna Landy for her careful editing and helpful advice on
    this book; to David Robinson for generously answering many questions about the
    tidyverse and aiding in my understanding of it; and to Amy Gill for dozens of
    comments, edits, and suggestions. Also, many thanks to Stephanie Hicks who twice
    served as a co-instructor in my data science classes and Yihui Xie who patiently
    put up with my many questions related to markdown. Thanks also to Karl Broman,
    from whom I borrowed ideas for the Data Visualization and Productivity Tools parts.
    Thanks to Peter Aldhous from whom I borrowed ideas for the principles of data
    visualization section and Jenny Bryan for writing *Happy Git and GitHub for the
    useR*, which influenced our Git chapters. Also, many thanks to Jeff Leek, Roger
    Peng, and Brian Caffo, whose onlile classes inspired the way this book is divided,
    to Garrett Grolemund and Hadley Wickham for making the markdown code for their
    R for Data Science book open, and the editors, John Kimmel and Lara Spieker, for
    their support. Finally, thanks to Alex Nones for proofreading the manuscript during
    its various stages.
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 感谢Jenna Landy对本书的仔细编辑和有益的建议；感谢David Robinson慷慨回答关于tidyverse的许多问题，并帮助我理解它；感谢Amy
    Gill提供的数十条评论、编辑和建议。还要感谢Stephanie Hicks，她两次担任我的数据科学课程合教，以及耐心回答我关于markdown的许多问题的Yihui
    Xie。感谢Karl Broman，我从他那里借鉴了数据可视化和生产力工具部分的想法。感谢Peter Aldhous，我从他那里借鉴了数据可视化原则部分的想法，以及撰写了*Happy
    Git and GitHub for the useR*的Jenny Bryan，这对我们的Git章节产生了影响。还要感谢Jeff Leek、Roger Peng和Brian
    Caffo，他们的在线课程启发了本书的章节划分方式，感谢Garrett Grolemund和Hadley Wickham，他们使他们的R for Data
    Science书的markdown代码开源，感谢编辑John Kimmel和Lara Spieker的支持。最后，感谢Alex Nones在本书各个阶段审阅手稿。
- en: This book was conceived during the teaching of several applied statistics courses,
    starting over fifteen years ago. The teaching assistants working with me throughout
    the years made important indirect contributions to this book. The material was
    further refined during a HarvardX series coordinated by Heather Sternshein and
    Zofia Gajdos. We thank them for their contributions. We are also grateful to all
    the students whose questions and comments helped us improve the book. The courses
    were partially funded by NIH grant R25GM114818\. We are very grateful to the National
    Institutes of Health for its support.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 本书是在教授多个应用统计学课程的过程中构思的，始于十五年前。多年来与我合作的助教对该书做出了重要的间接贡献。材料在由Heather Sternshein和Zofia
    Gajdos协调的HarvardX系列课程中得到进一步精炼。我们感谢他们的贡献。我们也感谢所有提出问题和评论的学生，他们的帮助使我们改进了本书。这些课程部分由NIH资助的R25GM114818号资助。我们非常感谢美国国立卫生研究院的支持。
- en: 'A special thanks goes to all those who edited the book via GitHub pull requests
    or made suggestions by creating an *issue* or sending an email: `nickyfoto` (Huang
    Qiang), `desautm` (Marc-André Désautels), `michaschwab` (Michail Schwab), `alvarolarreategui`
