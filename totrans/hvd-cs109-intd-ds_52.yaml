- en: Chapter 37 Accessing the terminal and installing Git
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook/accessing-the-terminal-and-installing-git.html](https://rafalab.dfci.harvard.edu/dsbook/accessing-the-terminal-and-installing-git.html)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: Before getting started, we need to make sure you have access to a *terminal*
    and that Git is installed. The terminal is integrated into Mac and Linux systems,
    but Windows users will have to install an *emulator*. There are many emulator
    options available, but here we show how to install Git Bash because it can be
    done as part of the Windows Git installation. Because of the differences in Mac
    and Windows, the sections in this chapter are divided accordingly.
  prefs: []
  type: TYPE_NORMAL
- en: 37.1 Accessing the terminal on a Mac
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'In Chapter [38](unix.html#unix) we describe how the terminal is our window
    into the Unix world. On a Mac you can access a terminal by opening the application
    in the Utilities folder:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/a3efa812bf0fab4f10f5e33556ecedee.png)![](../Images/252b735511d4a193457961eb2ecb2e0a.png)![](../Images/76ad97e5444cfe53d301596e2af94486.png)'
  prefs: []
  type: TYPE_IMG
- en: You can also use the Spotlight feature on the Mac by typing command-spacebar,
    then type *Terminal*.
  prefs: []
  type: TYPE_NORMAL
- en: Yet another way to access the terminal is from RStudio. In the *Console* pane
    you should see a *Terminal* tab. If you click on this tab you will open a terminal
    window.
  prefs: []
  type: TYPE_NORMAL
- en: 37.2 Installing Git on the Mac
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '**Warning: The instructions in this subsection are not for Windows users.**'
  prefs: []
  type: TYPE_NORMAL
- en: Start by opening a terminal as described in the previous section.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'Once you start the terminal, you will see a console like this:'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/76ad97e5444cfe53d301596e2af94486.png)'
  prefs: []
  type: TYPE_IMG
- en: 'You might have Git installed already. One way to check is by asking for the
    version by typing:'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: 'If you get a version number back, it is already installed. If not, you will
    get the following message:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/676ba9e4ed2712ff722126c85638893c.png)'
  prefs: []
  type: TYPE_IMG
- en: 'and you will be asked if you want to install it. You should click *Install*:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/eba7dcc2063f973a341f3f94e80c3fb2.png)'
  prefs: []
  type: TYPE_IMG
- en: 'This will take you through the installation process:'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/5bf5e763947a243dffec06d66dfaeba8.png)![](../Images/a531aad58c4a979b0c71e1fe4f4131f9.png)![](../Images/83bc2792b2c4669e7cb64b80a4f31a5a.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Once installed, you can check for the version again and it should show you
    something like this:'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/14c32f8dc47daea5d6ce03758fae9464.png)'
  prefs: []
  type: TYPE_IMG
- en: Congratulations. You have installed Git on your Mac.
  prefs: []
  type: TYPE_NORMAL
- en: 37.3 Installing Git and Git Bash on Windows
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '**Warning: The instructions in this subsection are not for Mac users.**'
  prefs: []
  type: TYPE_NORMAL
- en: There are several pieces of software that will permit you to perform Unix commands
    on Windows. We will be using Git Bash as it interfaces with RStudio and it is
    automatically installed when we install Git for Windows.
  prefs: []
  type: TYPE_NORMAL
- en: Start by searching for *Git for Windows* on your browser and clicking on the
    link from *git-scm.com*.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/c0f91ab26dcc1627bd4194c5c49773a0.png)'
  prefs: []
  type: TYPE_IMG
- en: 'This will take you to the *Download Git* page from which you can download the
    *most recent maintained build*:'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/014d101821c153ed3871b76198fae4fc.png)'
  prefs: []
  type: TYPE_IMG
- en: 'You can then accept to run the installer and agree to the license:'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/5a9fe3461d0200823a459f417b730a6e.png)![](../Images/63c39439925f1ae756bc0ff60b8a7165.png)'
  prefs: []
  type: TYPE_IMG
- en: 'In one of the installation steps, you will be asked to pick the default editor
    for Git. Unless you are already a *vi* or *vim* user, we recommend against selecting
    *vim* which might be the default. If you do not recognize an editor you are familiar
    with among the options given, we recommend that you select *nano* as your default
    editor for Git since it is the easiest to learn:'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/8d831bad51fd62461d6d34f7679d9aaa.png)'
  prefs: []
  type: TYPE_IMG
- en: The next installation decision is actually an **important one**. This installation
    process installs Git Bash. We recommend that you select *Git and optional Unix
    tools from the Windows Command Prompt* as this will permit you to learn Unix from
    within RStudio. However, if you do this, **some commands that run on your Windows
    command line will stop working**. If you do not use your Windows command line,
    then this should not be a problem. Also, most, if not all, of these Windows command
    lines have a Unix equivalent that you will be able to use now.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/9f39a55463dd37ab44636282444ae01a.png)'
  prefs: []
  type: TYPE_IMG
- en: You can now continue selecting the default options.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/dd43b561e7aa6ac495f97f8907137747.png)![](../Images/8f112e4cf68e9ef2c34087d8ed20f903.png)![](../Images/d9cfa8427a664ec9c0f015391221cd04.png)'
  prefs: []
  type: TYPE_IMG
- en: '![](../Images/21bd2fca89d3ea875943338aa3cedf09.png)![](../Images/5e370231e2e0cc79e85832e222eb5264.png)'
  prefs: []
  type: TYPE_IMG
- en: You have now installed Git on Windows.
  prefs: []
  type: TYPE_NORMAL
- en: 37.4 Accessing the terminal on Windows
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Now that Git Bash is installed, we can access the terminal either through RStudio
    or by opening Git Bash directly.
  prefs: []
  type: TYPE_NORMAL
- en: 'To access the terminal through RStudio, we need to change a preference so that
    Git Bash becomes the default Unix shell in RStudio. In RStudio, go to preferences
    (under the File pull down menu), then select *Terminal*, then select *Git Bash*:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/5688eefb2dfae0ad4c16425eb06d973e.png)'
  prefs: []
  type: TYPE_IMG
- en: 'To check that you in fact are using Git Bash in RStudio, you can open a *New
    Terminal* in RStudio:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/c034726c5c3754794eaa9c116924756e.png)'
  prefs: []
  type: TYPE_IMG
- en: 'It should look something like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/caa4531ed5e7f9f47f25fb36416fc713.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Often we want access to the terminal, but do not need RStudio. You can do this
    by running the Git Bash program directly:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/ff2ce9186a12ad7342b296d173a7da7f.png)![](../Images/e7d2f88592356f71f1a7b55986929d57.png)'
  prefs: []
  type: TYPE_IMG
