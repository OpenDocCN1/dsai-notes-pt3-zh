  zh: '[PRE4]'
- en: Review Questions
  id: totrans-49
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 复习问题
- en: What does it mean for a matrix to be sparse?
  id: totrans-50
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 矩阵稀疏是什么意思？
- en: What factors might you consider when deciding how to store a sparse matrix?
    (Why would you store a matrix in one format over another?)
  id: totrans-51
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 在决定如何存储稀疏矩阵时，您可能考虑哪些因素？（为什么您会选择一种格式而不是另一种格式来存储矩阵？）
- en: Given a sparse matrix, put the matrix in CSR format.
  id: totrans-52
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 给定一个稀疏矩阵，将其转换为CSR格式。
- en: Given a sparse matrix, put the matrix in COO format.
  id: totrans-53
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 给定一个稀疏矩阵，将其转换为COO格式。
- en: For a given matrix, how many bytes total are required to store it in CSR format?
  id: totrans-54
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 对于一个给定的矩阵，存储它需要多少字节的CSR格式？
- en: For a given matrix, how many bytes total are required to store it in COO format?
  id: totrans-55
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 对于一个给定的矩阵，存储它需要多少字节的COO格式？
