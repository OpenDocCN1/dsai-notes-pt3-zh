  id: totrans-3
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[1  开始使用](../R/getting-started.html)'
- en: 1.1 Why R?
  id: totrans-4
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 1.1 为什么选择R？
- en: R is not a programming language like C or Java. It was not created by software
    engineers for software development. Instead, it was developed by statisticians
    as an interactive environment for data analysis. You can read the full history
    in the paper A Brief History of S[¹](#fn1). The interactivity is an indispensable
    feature in data science because, as you will soon learn, the ability to quickly
    explore data is a necessity for success in this field. However, like in other
    programming languages, you can save your work as scripts that can be easily executed
    at any moment. These scripts serve as a record of the analysis you performed,
    a key feature that facilitates reproducible work. If you are an expert programmer,
    you should not expect R to follow the conventions you are used to since you will
    be disappointed. If you are patient, you will come to appreciate the unequal power
    of R when it comes to data analysis and, specifically, data visualization.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: R不是像C或Java这样的编程语言。它不是由软件工程师为软件开发而创建的。相反，它是统计学家开发的一个交互式数据分析环境。您可以在论文《S简史》中阅读完整的背景[¹](#fn1)。交互性是数据科学中不可或缺的特性，因为您很快就会了解到，快速探索数据的能力是成功在这个领域的关键。然而，与其他编程语言一样，您可以保存您的作品为脚本，这些脚本可以在任何时刻轻松执行。这些脚本记录了您所进行的分析，这是一个关键特性，有助于可重复性工作。如果您是专家程序员，您不应该期望R遵循您习惯的约定，因为您可能会感到失望。如果您有耐心，您将开始欣赏R在数据分析（尤其是数据可视化）方面的不凡能力。
- en: 'Other attractive features of R are:'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: R的其他吸引人的特性包括：
- en: R is free and open source[²](#fn2).
  id: totrans-7
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: R是免费和开源的[²](#fn2)。
- en: 'It runs on all major platforms: Windows, Mac Os, UNIX/Linux.'
  id: totrans-8
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 它在所有主要平台上运行：Windows、Mac Os、UNIX/Linux。
- en: Scripts and data objects can be shared seamlessly across platforms.
  id: totrans-9
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 脚本和数据对象可以在不同平台上无缝共享。
- en: There is a large, growing, and active community of R users and, as a result,
    there are numerous resources for learning and asking questions[³](#fn3) [⁴](#fn4).
  id: totrans-10
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: R用户有一个庞大、不断增长和活跃的社区，因此有大量的学习资源和提问资源[³](#fn3) [⁴](#fn4)。
- en: It is easy for others to contribute add-ons which enables developers to share
    software implementations of new data science methodologies. This gives R users
    early access to the latest methods and to tools which are developed for a wide
    variety of disciplines, including ecology, molecular biology, social sciences,
    and geography, just to name a few examples.
  id: totrans-11
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 其他人为贡献的附加功能使得开发者能够分享新的数据科学方法论的软件实现。这使得R用户能够提前接触到最新的方法，以及为众多学科（包括生态学、分子生物学、社会科学和地理学等）开发的工具，仅举几个例子。
- en: 1.2 The R console
  id: totrans-12
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 1.2 R控制台
- en: 'Interactive data analysis usually occurs on the *R console* that executes commands
    as you type them. There are several ways to gain access to an R console. One way
    is to simply start R on your computer. The console looks something like this:'
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 交互式数据分析通常在*R控制台*上进行，该控制台在您输入命令时执行。有多种方式可以访问R控制台。一种方式是在您的计算机上简单地启动R。控制台看起来大致如下：
- en: '![](../Images/16e7688448a021f99948229d362aee07.png)'
  id: totrans-14
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/16e7688448a021f99948229d362aee07.png)'
- en: 'As a quick example, try using the console to calculate a 15% tip on a meal
    that cost $19.71:'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 作为快速示例，尝试使用控制台计算一顿价值19.71美元的餐点的15%小费：
- en: '[PRE0]'
  id: totrans-16
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: '***Note that in this book, grey boxes are used to show R code typed into the
    R console. The symbol `#>` is used to denote what the R console outputs.***'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: '***请注意，在这本书中，灰色框用于显示在R控制台中输入的R代码。符号`#>`用于表示R控制台输出的内容。***'
- en: '*1.3 Scripts*'
  id: totrans-18
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '*1.3 脚本*'
- en: '*One of the great advantages of R over point-and-click analysis software is
    that you can save your work as scripts. You can edit and save these scripts using
    a text editor. The material in this book was developed using the interactive *integrated
    development environment* (IDE) RStudio[⁵](#fn5). RStudio includes an editor with
    many R specific features, a console to execute your code, and other useful panes,
    including one to show figures.'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: '*R相对于点选分析软件的一个巨大优势是您可以保存您的作品为脚本。您可以使用文本编辑器编辑和保存这些脚本。本书中的材料是使用交互式*集成开发环境*（IDE）RStudio开发的[⁵](#fn5)。RStudio包括一个具有许多R特定功能的编辑器、一个用于执行代码的控制台以及其他有用的面板，包括一个用于显示图形的面板。'
- en: '![](../Images/6f0bf21dcb1a713270a95f6838b626fe.png)'
  id: totrans-20
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/6f0bf21dcb1a713270a95f6838b626fe.png)'
- en: Most web-based R consoles also provide a pane to edit scripts, but not all permit
    you to save the scripts for later use.
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 大多数基于网络的 R 控制台也提供了一个面板来编辑脚本，但并非所有都允许你保存脚本以供以后使用。
- en: All the R scripts used to generate this book can be found on GitHub[⁶](#fn6).*
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 所有用于生成这本书的 R 脚本都可以在 GitHub[⁶](#fn6) 上找到。
- en: '*1.4 RStudio*'
  id: totrans-23
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '*1.4 RStudio*'
- en: '*RStudio will be our launching pad for data science projects. It not only provides
    an editor for us to create and edit our scripts but also provides many other useful
    tools. In this section, we go over some of the basics.'
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: '*RStudio 将成为我们数据科学项目的起点。它不仅为我们提供了一个编辑器来创建和编辑我们的脚本，还提供了许多其他有用的工具。在本节中，我们将介绍一些基础知识。*'
- en: 1.4.1 The panes
  id: totrans-25
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 1.4.1 面板
- en: 'When you start RStudio for the first time, you will see three panes. The left
    pane shows the R console. On the right, the top pane includes tabs such as *Environment*
    and *History*, while the bottom pane shows five tabs: *File*, *Plots*, *Packages*,
    *Help*, and *Viewer* (these tabs may change in new versions). You can click on
    each tab to move across the different features. For example, to start a new script,
    you can click on File, then New File, then R Script.'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 当你第一次启动 RStudio 时，你会看到三个面板。左侧面板显示 R 控制台。在右侧，顶部面板包括 *环境* 和 *历史* 等标签页，而底部面板显示了五个标签页：*文件*、*绘图*、*包*、*帮助*
    和 *查看器*（这些标签页在新版本中可能会有所变化）。你可以点击每个标签来浏览不同的功能。例如，要开始一个新的脚本，你可以点击 *文件*，然后选择 *新建文件*，接着选择
    *R 脚本*。
- en: '![](../Images/b02092bcdb7c8e316eefd1d5a45d4dac.png)'
  id: totrans-27
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/b02092bcdb7c8e316eefd1d5a45d4dac.png)'
- en: This starts a new pane on the left and it is here where you can start writing
    your script.
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 这将在左侧启动一个新的面板，你可以在那里开始编写你的脚本。
- en: '![](../Images/01092302f6a34e263f625f2a50fb33de.png)'
  id: totrans-29
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/01092302f6a34e263f625f2a50fb33de.png)'
- en: 1.4.2 Key bindings
  id: totrans-30
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 1.4.2 快捷键
- en: 'Many tasks we perform with the mouse can be achieved with a combination of
    key strokes instead. These keyboard versions for performing tasks are referred
    to as *key bindings*. For example, we just showed how to use the mouse to start
    a new script, but you can also use a key binding: Ctrl+Shift+N on Windows and
    command+shift+N on the Mac.'
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: 我们使用鼠标执行的大多数任务都可以通过组合键来达到。这些用于执行任务的键盘版本被称为 *快捷键*。例如，我们刚刚展示了如何使用鼠标开始一个新的脚本，但你也可以使用快捷键：Windows
    上的 Ctrl+Shift+N 和 Mac 上的 command+shift+N。
- en: 'Although in this tutorial we often show how to use the mouse, **we highly recommend
    that you memorize key bindings for the operations you use most**. RStudio provides
    a useful cheat sheet with the most widely used commands. You can get it from RStudio
    directly:'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 虽然在这个教程中我们经常展示如何使用鼠标，但我们**强烈建议你记住你使用最多的操作的快捷键**。RStudio 提供了一份有用的快捷键表，列出了最常用的命令。你可以直接从
    RStudio 获取它：
- en: '![](../Images/98d99aa61fbe12f6d58efdd1292b2952.png)'
  id: totrans-33
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/98d99aa61fbe12f6d58efdd1292b2952.png)'
- en: You might want to keep this handy so you can look up key-bindings when you find
    yourself performing repetitive point-and-clicking.
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: 你可能想把它放在手边，这样你就可以在你发现自己进行重复的点按操作时查找快捷键。
- en: 1.4.3 Running commands while editing scripts
  id: totrans-35
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 1.4.3 在编辑脚本时运行命令
- en: There are many editors specifically made for coding. These are useful because
    color and indentation are automatically added to make code more readable. RStudio
    is one of these editors, and it was specifically developed for R. One of the main
    advantages provided by RStudio over other editors is that we can test our code
    easily as we edit our scripts. Below we show an example.
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 有许多专门为编码制作的编辑器。这些编辑器很有用，因为它们会自动添加颜色和缩进，使代码更易于阅读。RStudio 就是这些编辑器之一，它是专门为 R 开发的。RStudio
    相比其他编辑器提供的主要优势之一是我们可以在编辑脚本时轻松测试我们的代码。下面我们展示一个例子。
- en: Let’s start by opening a new script as we did before. A next step is to give
    the script a name. We can do this through the editor by saving the current new
    unnamed script. To do this, click on the save icon or use the key binding Ctrl+S
    on Windows and command+S on the Mac.
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们先打开一个新的脚本，就像之前做的那样。下一步是为脚本命名。我们可以通过编辑器保存当前未命名的脚本来实现这一点。为此，点击保存图标或使用 Windows
    上的 Ctrl+S 键或 Mac 上的 command+S 键。
- en: When you ask for the document to be saved for the first time, RStudio will prompt
    you for a name. A good convention is to use a descriptive name, with lower case
    letters, no spaces, only hyphens to separate words, and then followed by the suffix
    `.R`. We will call this script `my-first-script.R`.
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: 当你第一次要求保存文档时，RStudio 会提示你输入名称。一个好的惯例是使用描述性的名称，使用小写字母，没有空格，只使用连字符来分隔单词，然后跟随着后缀
    `.R`。我们将把这个脚本称为 `my-first-script.R`。
- en: '![](../Images/4c35c439da344f7d3246f93a0afa68b9.png)'
  id: totrans-39
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/4c35c439da344f7d3246f93a0afa68b9.png)'
- en: 'Now we are ready to start editing our first script. The first lines of code
    in an R script are dedicated to loading the libraries we will use. Another useful
    RStudio feature is that once we type `[library()](https://rdrr.io/r/base/library.html)`
    it starts auto-completing with libraries that we have installed. Note what happens
    when we type `[library(ti)](https://rdrr.io/r/base/library.html)`:'
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们准备开始编辑我们的第一个脚本。R 脚本中的第一行代码是专门用来加载我们将要使用的库的。另一个有用的 RStudio 功能是，一旦我们输入 `[library()](https://rdrr.io/r/base/library.html)`，它就会自动完成我们已安装的库。注意当我们输入
    `[library(ti)](https://rdrr.io/r/base/library.html)` 时会发生什么：
- en: '![](../Images/fcb59a2e14a347d53d8c51146dd02376.png)'
  id: totrans-41
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/fcb59a2e14a347d53d8c51146dd02376.png)'
- en: 'Another feature you may have noticed is that when you type `library(` the second
    parenthesis is automatically added. This will help you avoid one of the most common
    errors in coding: forgetting to close a parenthesis.'
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: 你可能还注意到的一个功能是，当你输入 `library(` 时，第二个括号会自动添加。这将帮助你避免编码中最常见的错误之一：忘记关闭括号。
- en: 'Now we can continue to write code. As an example, we will make a graph showing
    murder totals versus population totals by state. Once you are done writing the
    code needed to make this plot, you can try it out by *executing* the code. To
    do this, click on the *Run* button on the upper right side of the editing pane.
    You can also use the key binding: Ctrl+Shift+Enter on Windows or command+shift+return
    on the Mac.'
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们可以继续编写代码。作为一个例子，我们将制作一个图表，展示各州的谋杀总数与人口总数。一旦你编写了制作此图表所需的代码，你可以通过 *执行* 代码来尝试它。为此，点击编辑窗格右上角的
    *运行* 按钮。你也可以使用快捷键：Windows 上的 Ctrl+Shift+Enter 或 Mac 上的 command+shift+return。
- en: Once you run the code, you will see it appear in the R console and, in this
    case, the generated plot appears in the plots console. Note that the plot console
    has a useful interface that permits you to click back and forward across different
    plots, zoom in to the plot, or save the plots as files.
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 一旦你运行了代码，你将在 R 控制台中看到它，在这种情况下，生成的图表将出现在图表控制台中。请注意，图表控制台有一个有用的界面，允许你点击在不同图表之间前后导航，放大图表，或将图表保存为文件。
- en: '![](../Images/4e435905aa01b366ab832adbac2547dd.png)'
  id: totrans-45
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/4e435905aa01b366ab832adbac2547dd.png)'
- en: To run one line at a time instead of the entire script, you can use Control-Enter
    on Windows and command-return on the Mac.
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: 要逐行运行代码而不是整个脚本，你可以在 Windows 上使用 Control-Enter，在 Mac 上使用 command-return。
- en: 1.4.4 Changing global options
  id: totrans-47
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 1.4.4 更改全局选项
- en: You can change the look and functionality of RStudio quite a bit.
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: 你可以大幅度改变 RStudio 的外观和功能。
- en: To change the global options you click on *Tools* then *Global Options…*.
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: 要更改全局选项，你点击 *工具* 然后选择 *全局选项…*。
- en: 'As an example we show how to make a change that we **highly recommend**. This
    is to change the *Save workspace to .RData on exit* to *Never* and uncheck the
    *Restore .RData into workspace at start*. By default, when you exit R saves all
    the objects you have created into a file called .RData. This is done so that when
    you restart the session in the same folder, it will load these objects. We find
    that this causes confusion especially when we share code with colleagues and assume
    they have this .RData file. To change these options, make your *General* settings
    look like this:'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: 作为例子，我们展示如何进行我们 **强烈推荐** 的更改。这是将 *退出时保存工作空间到 .RData* 改为 *从不*，并取消选中 *启动时将 .RData
    恢复到工作空间*。默认情况下，当你退出 R 时，会将你创建的所有对象保存到一个名为 .RData 的文件中。这样做是为了当你重新在同一文件夹中启动会话时，它会加载这些对象。我们发现这会导致混淆，尤其是当我们与同事共享代码并假设他们有这个
    .RData 文件时。要更改这些选项，让你的 *常规* 设置看起来像这样：
- en: '![](../Images/399d171bba56dd71643175db27352dd8.png)*'
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: '![图片](../Images/399d171bba56dd71643175db27352dd8.png)*'
- en: '*1.5 Installing R packages*'
  id: totrans-52
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '*1.5 安装 R 包*'
- en: '*The functionality provided by a fresh install of R is only a small fraction
    of what is possible. In fact, we refer to what you get after your first install
    as *base R*. The extra functionality comes from add-ons available from developers.
    There are currently hundreds of these available from CRAN and many others shared
    via other repositories such as GitHub. However, because not everybody needs all
    available functionality, R instead makes different components available via *packages*.
    R makes it very easy to install packages from within R. For example, to install
    the **dslabs** package, which we use to share datasets and code related to this
    book, you would type:'
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: '*R 的新安装提供的功能只是可能功能的一小部分。实际上，我们将您第一次安装后获得的内容称为 *基础 R*。额外的功能来自开发者的附加组件。目前 CRAN
    上有数百个这样的附加组件，还有许多通过其他存储库如 GitHub 分享。然而，由于并非所有人都需要所有可用功能，R 通过 *包* 提供不同的组件。R 使您能够非常容易地从
    R 内部安装包。例如，要安装我们用于共享与本书相关的数据集和代码的 **dslabs** 包，您将输入：'
- en: '[PRE1]'
  id: totrans-54
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: '*In RStudio, you can navigate to the *Tools* tab and select install packages.
    We can then load the package into our R sessions using the `library` function:'
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: '*在 RStudio 中，您可以导航到 *工具* 选项卡并选择安装包。然后我们可以使用 `library` 函数将包加载到我们的 R 会话中：'
- en: '[PRE2]'
  id: totrans-56
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: '*As you go through this book, you will see that we load packages without installing
    them. This is because once you install a package, it remains installed and only
    needs to be loaded with `library`. The package remains loaded until we quit the
    R session. If you try to load a package and get an error, it probably means you
    need to install it first.'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: '*随着您阅读本书，您将看到我们加载包而不安装它们。这是因为一旦您安装了一个包，它就会保持安装状态，并且只需要使用 `library` 加载。包将保持加载状态，直到我们退出
    R 会话。如果您尝试加载一个包并遇到错误，这可能意味着您需要先安装它。'
- en: 'We can install more than one package at once by feeding a character vector
    to this function:'
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以通过向此函数提供字符向量来一次性安装多个包：
- en: '[PRE3]'
  id: totrans-59
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: '*One advantage of using RStudio is that it auto-completes package names once
    you start typing, which is helpful when you do not remember the exact spelling
    of the package.'
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: '*使用 RStudio 的一个优点是，一旦您开始输入，它会自动完成包名，这在您不记得包的确切拼写时很有帮助。'
- en: Note that installing **tidyverse** actually installs several packages. This
    commonly occurs when a package has *dependencies*, or uses functions from other
    packages. When you load a package using `library`, you also load its dependencies.
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，安装 **tidyverse** 实际上会安装几个包。这通常发生在包有 *依赖项* 或使用其他包中的函数时。当您使用 `library` 函数加载包时，也会加载其依赖项。
- en: Once packages are installed, you can load them into R and you do not need to
    install them again, unless you install a fresh version of R. Remember packages
    are installed in R not RStudio.
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: 一旦安装了包，您就可以将它们加载到 R 中，除非您安装了 R 的新版本，否则不需要再次安装。请记住，包是在 R 中而不是在 RStudio 中安装的。
- en: It is helpful to keep a list of all the packages you need for your work in a
    script because if you need to perform a fresh install of R, you can re-install
    all your packages by simply running a script.
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: 将您工作中需要的所有包列在一个脚本中很有帮助，因为如果您需要重新安装 R，只需运行脚本即可重新安装所有包。
- en: 'You can see all the packages you have installed using the following function:'
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: 您可以使用以下函数查看您已安装的所有包：
