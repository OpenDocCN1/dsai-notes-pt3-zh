- en: Acknowledgments
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 致谢
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook/acknowledgments.html](https://rafalab.dfci.harvard.edu/dsbook/acknowledgments.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook/acknowledgments.html](https://rafalab.dfci.harvard.edu/dsbook/acknowledgments.html)
- en: This book is dedicated to all the people involved in building and maintaining
    R and the R packages we use in this book. A special thanks to the developers and
    maintainers of R base, the tidyverse, and the caret package.
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 本书献给所有参与构建和维护R以及本书中使用的R包的人们。特别感谢R基础、tidyverse和caret包的开发者和维护者。
- en: A special thanks to my tidyverse guru David Robinson and Amy Gill for dozens
    of comments, edits, and suggestions. Also, many thanks to Stephanie Hicks who
    twice served as a co-instructor in my data science classes and Yihui Xie who patiently
    put up with my many questions about bookdown. Thanks also to Karl Broman, from
    whom I borrowed ideas for the Data Visualization and Productivity Tools parts,
    and to Héctor Corrada-Bravo, for advice on how to best teach machine learning.
    Thanks to Peter Aldhous from whom I borrowed ideas for the principles of data
    visualization section and Jenny Bryan for writing *Happy Git and GitHub for the
    useR*, which influenced our Git chapters. Thanks to Alyssa Frazee for helping
    create the homework problem that became the Recommendation Systems chapter and
    to Amanda Cox for providing the New York Regents exams data. Also, many thanks
    to Jeff Leek, Roger Peng, and Brian Caffo, whose class inspired the way this book
    is divided and to Garrett Grolemund and Hadley Wickham for making the bookdown
    code for their R for Data Science book open. Finally, thanks to Alex Nones for
    proofreading the manuscript during its various stages.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 特别感谢我的tidyverse大师David Robinson和Amy Gill，他们提出了数十条评论、编辑和建议。还要感谢Stephanie Hicks，她两次担任我的数据科学课程助教，以及耐心回答我关于bookdown的许多问题的Yihui
    Xie。感谢Karl Broman，我从他那里借鉴了数据可视化和生产力工具部分的想法，以及Héctor Corrada-Bravo，他提供了关于如何最好地教授机器学习的建议。感谢Peter
    Aldhous，我从他那里借鉴了数据可视化原则部分的想法，以及撰写了*Happy Git and GitHub for the useR*的Jenny Bryan，这对我们的Git章节产生了影响。感谢Alyssa
    Frazee，她帮助创建了成为推荐系统章节的家庭作业问题，以及Amanda Cox，她提供了纽约州教育委员会考试数据。还要感谢Jeff Leek、Roger
    Peng和Brian Caffo，他们的课程启发了本书的章节划分方式，以及Garrett Grolemund和Hadley Wickham，他们使他们的R
    for Data Science书籍的bookdown代码开源。最后，感谢Alex Nones，他在本书的不同阶段进行了校对。
- en: This book was conceived during the teaching of several applied statistics courses,
    starting over fifteen years ago. The teaching assistants working with me throughout
    the years made important indirect contributions to this book. The latest iteration
    of this course is a HarvardX series coordinated by Heather Sternshein and Zofia
    Gajdos. We thank them for their contributions. We are also grateful to all the
    students whose questions and comments helped us improve the book. The courses
    were partially funded by NIH grant R25GM114818\. We are very grateful to the National
    Institutes of Health for its support.
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 这本书是在教授几门应用统计学课程的过程中构思的，始于十五年前。多年来与我一起工作的助教们对本书做出了重要的间接贡献。这门课程的最新版本是由Heather
    Sternshein和Zofia Gajdos协调的HarvardX系列课程。我们感谢他们的贡献。我们还要感谢所有提出问题和评论的学生，他们的帮助使我们改进了本书。这些课程部分由NIH资助的R25GM114818项目资助。我们非常感谢美国国立卫生研究院的支持。
