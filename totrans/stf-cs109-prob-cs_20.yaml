- en: Enigma Machine
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: Enigma Machine
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/examples/enigma/](https://chrispiech.github.io/probabilityForComputerScientists/en/examples/enigma/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/examples/enigma/](https://chrispiech.github.io/probabilityForComputerScientists/en/examples/enigma/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: 'One of the very first computers was built to break the Nazi “enigma” codes
    in WW2\. It was a hard problem because the “enigma” machine, used to make secret
    codes, had so many unique configurations. Every day the Nazis would choose a new
    configuration and if the Allies could figure out the daily configuration, they
    could read all enemy messages. One solution was to try all configurations until
    one produced legible German. This begs the question: How many configurations are
    there?'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 最早的计算机之一是在二战期间建造的，用于破解纳粹的“Enigma”密码。这是一个难题，因为用于制作秘密密码的“Enigma”机器有如此多的独特配置。纳粹每天都会选择一个新的配置，如果盟军能够找出每天的配置，他们就能阅读所有敌人的信息。一种解决方案是尝试所有配置，直到找到一个可以产生可读德语的配置。这引发了一个问题：有多少种配置？
- en: '![](../Images/1b8ce0b1b1c748ebd70f1b8f61c54269.png)'
  id: totrans-4
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/1b8ce0b1b1c748ebd70f1b8f61c54269.png)'
- en: '*The WW2 machine built to search different enigma configurations.*'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: '*二战期间建造的用于搜索不同Enigma配置的机器。*'
- en: The enigma machine has three rotors. Each rotor can be set to one of 26 different
    positions. How many unique configurations are there of the three rotors?
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: Enigma机器有三个转子。每个转子可以设置为26个不同位置中的一个。三个转子有多少种独特的配置？
- en: 'Using the [steps rule](../../part1/counting) of counting: $26 \cdot 26 \cdot
    26 = 26^3 = 17,576$.'
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 使用计数步骤规则：$26 \cdot 26 \cdot 26 = 26^3 = 17,576$。
- en: Whats more! The machine has a plug board which could swap the electrical signal
    for letters. On the plug board, wires can connect any pair of letters to produce
    a new configuration. A wire can’t connect a letter to itself. Wires are indistinct.
    A wire from ‘K’ to ’L’ is not considered distinct from a wire from ‘L’ to ’K’.
    We are going to work up to considering any number of wires.
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 更重要的是，这台机器有一个插板，可以交换字母的电信号。在插板上，线可以连接任何一对字母以产生新的配置。线不能连接到自身。线是不可区分的。从‘K’到‘L’的线与从‘L’到‘K’的线是不可区分的。我们将逐步考虑任意数量的线。
- en: '![](../Images/dc4db0aa3fbed57078e81d19944f44cb.png)'
  id: totrans-9
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/dc4db0aa3fbed57078e81d19944f44cb.png)'
- en: '*The engima plugboard. For electrical reasons, each letter has two jacks and
    each plug has two prongs. Semantically this is equivalent to one plug location
    per letter.*'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: '*Enigma插板。由于电气原因，每个字母有两个插孔，每个插头有两个触点。从语义上讲，这相当于每个字母一个插头位置。*'
- en: '**One wire**: How many ways are there to place exactly one wire that connects
    two letters?'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: '**一根线**: 有多少种方式可以放置恰好一根连接两个字母的线？'
- en: 'Chosing 2 letters from 26 is a combination. Using the [combination formula](../../part1/combinatorics):
    ${26 \choose 2} = 325$.'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 从26个字母中选择2个是一个组合。使用[组合公式](../../part1/combinatorics)：${26 \choose 2} = 325$。
- en: '**Two wires**: How many ways are there to place exactly two wires? Recall that
    wires are not considered distinct. Each letter can have at most one wire connected
    to it, thus you couldn’t have a wire connect ‘K’ to ‘L’ and another one connect
    ‘L’ to ‘X’'
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: '**两根线**: 有多少种方式可以放置恰好两根线？回想一下，线不被认为是可区分的。每个字母最多只能连接一根线，因此你不能有一根线连接‘K’到‘L’，另一根线连接‘L’到‘X’。'
- en: 'There are ${26 \choose 2}$ ways to place the first wire and ${24 \choose 2}$
    ways to place the second wire. However, since the wires are indistinct, we have
    double counted every possibility. Because every possibility is counted twice we
    should divide by 2: $$ \text{Total} = \frac{ {26 \choose 2} \cdot {24 \choose
    2} }{2} = 44,850 $$'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 放置第一根线有${26 \choose 2}$种方式，放置第二根线有${24 \choose 2}$种方式。然而，由于线是不可区分的，我们双倍计算了每一种可能性。因为每一种可能性都被计算了两次，所以我们应该除以2：$$
    \text{总数} = \frac{ {26 \choose 2} \cdot {24 \choose 2} }{2} = 44,850 $$
- en: '**Three wires**: How many ways are there to place **exactly** three wires?'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: '**三根线**: 有多少种方式可以放置**恰好**三根线？'
- en: 'There are ${26 \choose 2}$ ways to place the first wire and ${24 \choose 2}$
    ways to place the second wire. There are now ${22 \choose 2}$ ways to place the
    third. However, since the wires are indistinct, and our step counting implicitly
    treats them as distinct, we have overcounted each possibility. How many times
    is each pairing of three letters overcounted? It''s the number of permutations
    of three distinct objects: 3! $$ \text{Total} = \frac{ {26 \choose 2} \cdot {24
    \choose 2} \cdot {22 \choose 2}}{3!} = 3,453,450 $$ There is another way to arrive
    at the same answer. First we are going to choose the letters to be paired, then
    we are going to pair them off. There are ${26 \choose 6}$ ways to select the letters
    that are being wired up. We then need to pair off those letters. One way to think
    about pairing the letters off is to first permute them (6! ways) and then pair
    up the first two letters, the next two, the next two, and so on. For example,
    if our letters were {A,B,C,D,E,F} and our permutation was BADCEF, then this would
    correspond to wiring B to A and D to C and E to F. We are overcounting by a lot.
    First, we are overcounting by a factor of 3! since the ordering of the pairs doesn’t
    matter. Second, we are overcounting by a factor of $2 ^ 3$ since the ordering
    of the letters within each pair doesn’t matter. $$ \text{Total} = {26 \choose
    6} \frac{6!}{3! \cdot 2^3} = 3,453,450 $$'
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 放置第一根线有 ${26 \choose 2}$ 种方式，放置第二根线有 ${24 \choose 2}$ 种方式。现在放置第三根线有 ${22 \choose
    2}$ 种方式。然而，由于线是不可区分的，并且我们的步数计数隐含地将其视为可区分的，所以我们已经对每种可能性进行了重复计数。每个三个字母的组合被重复计数了多少次？这是三个不同对象的排列数：3!
    $$ \text{Total} = \frac{ {26 \choose 2} \cdot {24 \choose 2} \cdot {22 \choose
    2}}{3!} = 3,453,450 $$ 另一种得到相同答案的方法是：首先选择要配对的字母，然后进行配对。选择正在布线的字母有 ${26 \choose
    6}$ 种方式。然后我们需要配对这些字母。考虑配对字母的一种方法是首先对它们进行排列（6!种方式），然后配对前两个字母，然后是下一对，再下一对，依此类推。例如，如果我们的字母是
    {A,B,C,D,E,F}，并且我们的排列是 BADCEF，那么这对应于将 B 连接到 A，D 连接到 C，E 连接到 F。我们过度计数了很多。首先，由于配对顺序不重要，我们过度计数了3!倍。其次，由于每个配对内字母的顺序不重要，我们过度计数了$2^3$倍。$$
    \text{Total} = {26 \choose 6} \frac{6!}{3! \cdot 2^3} = 3,453,450 $$
- en: '**Arbitrary wires**: How many ways are there to place $k$ wires, thus connecting
    $2 \cdot k$ letters? During WW2 the Germans always used a fixed number of wires.
    But one fear was that if they discovered the Enigma machine was cracked, they
    could simply use an arbitrary number of wires.'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: '**任意线**：放置 $k$ 根线，从而连接 $2 \cdot k$ 个字母，有多少种方式？在二战期间，德国人总是使用固定数量的线。但有一种担忧是，如果他们发现恩尼格玛机被破解，他们可以简单地使用任意数量的线。'
- en: 'The set of ways to use exactly $i$ wires is mutually exclusive from the set
    of ways to use exactly $j$ wires if $i \neq j$ (since no way can use both exactly
    $i$ and $j$ wires). As such $ \text{Total} = \sum_{k=0}^{13} \text{Total}_k $
    Where Total$_k$ is the number of ways to use exactly $k$ wires. Continuing our
    logic for ways to used exact number of wires: $$ \text{Total}_k = \frac{\prod_{i=1}^{k}
    {28 - 2i \choose 2} }{k!} $$ Bringing it all together: $$ \begin{align} \text{Total}
    &= \sum_{k=0}^{13} \text{Total}_k \\ &= \sum_{k=0}^{13} \frac{\prod_{i=1}^{k}
    {28 - 2i \choose 2} }{k!} \\ &= 532,985,208,200,576 \end{align} $$'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 使用恰好 $i$ 根线的组合方式与使用恰好 $j$ 根线的组合方式互斥，如果 $i \neq j$（因为没有任何一种方式可以同时使用恰好 $i$ 和 $j$
    根线）。因此，$\text{Total} = \sum_{k=0}^{13} \text{Total}_k$，其中 Total$_k$ 是使用恰好 $k$
    根线的组合方式的数量。继续我们关于使用确切数量的线的逻辑：$$ \text{Total}_k = \frac{\prod_{i=1}^{k} {28 - 2i
    \choose 2} }{k!} $$ 将所有内容整合起来：$$ \begin{align} \text{Total} &= \sum_{k=0}^{13}
    \text{Total}_k \\ &= \sum_{k=0}^{13} \frac{\prod_{i=1}^{k} {28 - 2i \choose 2}
    }{k!} \\ &= 532,985,208,200,576 \end{align} $$
- en: The actual Enigma used in WW2 had exactly 10 wires connecting 20 letters allowing
    for 150,738,274,937,250 unique configuration. The enigma machine also chose the
    three rotors from a set of five adding another factor of ${5 \choose 3} = 60$.
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 在二战中实际使用的恩尼格玛机有10根线连接20个字母，允许有150,738,274,937,250种独特的配置。恩尼格玛机还从5个转子集中选择了3个转子，这又增加了${5
    \choose 3} = 60$的另一个因子。
- en: 'When you combine the number of ways of setting the rotors, with the number
    of ways you could set the plug board you get the total number of configurations
    of an enigma machine. Thinking of this as two steps we can multiply the two numbers
    we earlier calculated: 17,576 · 150,738,274,937,250 · 60 $\approx 159 \cdot 10^{18}$
    unique settings. So, Alan Turing and his team at Blechly Park went on to build
    a machine which could help test many configurations -- a predecessor to the first
    computers.'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 当你将设置转子方式的数量与设置插线板的方式数量相加，你就能得到恩尼格玛机配置的总数。将这个过程视为两个步骤，我们可以将之前计算出的两个数字相乘：17,576
    · 150,738,274,937,250 · 60 $\approx 159 \cdot 10^{18}$ 唯一设置。因此，艾伦·图灵和他的团队在布莱奇利公园继续建造了一台可以帮助测试许多配置的机器——这是第一台计算机的前身。
