- en: 27  Performance Metrics
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 27 性能指标
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/ml/evaluation-metrics.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/ml/evaluation-metrics.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/ml/evaluation-metrics.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/ml/evaluation-metrics.html)
- en: '[Machine Learning](../ml/intro-ml.html)'
  id: totrans-2
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[机器学习](../ml/intro-ml.html)'
- en: '[27  Performance Metrics](../ml/evaluation-metrics.html)'
  id: totrans-3
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[27 性能指标](../ml/evaluation-metrics.html)'
- en: Before we start describing approaches to optimize the way we build algorithms,
    we first need to define what we mean when we say one approach is better than another.
    In this section, we focus on describing ways in which machine learning algorithms
    are evaluated. Specifically, we need to quantify what we mean by “better”.
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 在我们开始描述优化算法构建方式的方法之前，我们首先需要定义当我们说一种方法比另一种方法更好时，我们指的是什么。在本节中，我们专注于描述评估机器学习算法的方式。具体来说，我们需要量化我们所说的“更好”的含义。
- en: 'For our first introduction to machine learning concepts, we will start with
    a boring and simple example: how to predict sex using height. As we explain how
    to build a prediction algorithm with this example, we will start to set down the
    first building block needed to understand machine learning. Soon enough, we will
    be undertaking more interesting challenges.'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 对于我们对机器学习概念的第一次介绍，我们将从一个无聊且简单的例子开始：如何使用身高预测性别。随着我们解释如何使用这个例子构建预测算法，我们将开始奠定理解机器学习所需的第一块基石。不久，我们将面对更有趣的挑战。
- en: We introduce the **caret** package, which provides useful functions to facilitate
    machine learning in R, and we describe it in more detail in [Section 31.2](ml-in-practice.html#sec-caret).
    For our first example, we use the height data provided by the **dslabs** package.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 我们介绍了**caret**包，它提供了有用的函数来促进R中的机器学习，我们将在[第31.2节](ml-in-practice.html#sec-caret)中更详细地描述它。在我们的第一个例子中，我们使用**dslabs**包提供的高度数据。
- en: '[PRE0]'
  id: totrans-7
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: '*We start by noting that `heights$sex` provides the outcomes (Y) and `heights$height`
    is our predictor (X). To simplify the code used throughout this chapter, we rename
    the variables:'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: '*我们首先指出，`heights$sex`提供了结果（Y），而`heights$height`是我们的预测变量（X）。为了简化本章中使用的代码，我们重命名了变量：'
- en: '[PRE1]'
  id: totrans-9
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: '*In this example, we have a single predictor, and the outcome is categorical:
    each observation is either `Male` or `Female`. Because the average height difference
    between males and females is modest relative to the variability within each group,
    we should not expect to predict \(Y\) with very high accuracy. But can we do better
    than random guessing? To answer this, we first need a quantitative way to define
    what “better” means.'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: '*在这个例子中，我们有一个单一的预测变量，结果为分类：每个观测值要么是`Male`，要么是`Female`。由于男性和女性之间的平均身高差异相对于每个组内的变异性是适度的，我们不应期望用非常高的准确性预测\(Y\)。但我们能否比随机猜测做得更好？为了回答这个问题，我们首先需要一个量化的方法来定义“更好”的含义。'
- en: '*In machine learning applications in R, and particularly when using the **caret**
    package, categorical outcomes should be stored as factors. Doing so ensures they
    are treated as labels rather than numeric values, preventing errors that arise
    when numeric codes are mistakenly interpreted as quantitative.'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: '*在R中的机器学习应用中，尤其是在使用**caret**包时，分类结果应存储为因子。这样做可以确保它们被视为标签而不是数值，从而防止将数值代码错误地解释为定量值时出现的错误。'
- en: For binary outcomes, **caret** treats the first factor level as \(Y=1\) and
    the second as \(Y=0\). Because R assigns factor levels in alphabetical order by
    default, in our examples this means females are coded as \(Y=1\) and males as
    \(Y=0\).*  *## 27.1 Training and test sets
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 对于二元结果，**caret**将第一个因子级别视为\(Y=1\)，第二个级别视为\(Y=0\)。因为R默认按字母顺序分配因子级别，在我们的例子中这意味着女性编码为\(Y=1\)，男性编码为\(Y=0\)。*##
    27.1 训练集和测试集
- en: 'Ultimately, a machine learning algorithm is evaluated on how it performs in
    the real world with completely new datasets. However, when developing an algorithm,
    we usually have a dataset for which we know the outcomes, as we do with the heights:
    we know the sex of every student in our dataset. Therefore, to mimic the ultimate
    evaluation process, we typically split the data into two parts and act as if we
    don’t know the outcome for one of these. We stop pretending we don’t know the
    outcome to evaluate the algorithm, but only *after* we are done constructing it.
    We refer to the group for which we know the outcome, and that we use to develop
    the algorithm, as the *training* set. We refer to the group for which we pretend
    we don’t know the outcome as the *test* set.'
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 最终，机器学习算法的评估标准是它在现实世界中使用全新的数据集时的表现。然而，在开发算法时，我们通常有一个已知结果的数据集，就像我们对身高那样：我们知道数据集中每个学生的性别。因此，为了模仿最终的评估过程，我们通常将数据分成两部分，并假装我们不知道其中一部分的结果。我们在完成算法构建后停止假装不知道结果来评估算法，但只有在构建完成后。我们将我们知道结果并用于开发算法的那组数据称为*训练集*。我们将假装不知道结果的那组数据称为*测试集*。
- en: 'A standard way of generating the training and test sets is by randomly splitting
    the data. The **caret** package includes the function `createDataPartition` that
    helps us generate indexes for randomly splitting the data into training and test
    sets:'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 生成训练集和测试集的标准方法是通过随机分割数据。**caret**包包括一个名为`createDataPartition`的函数，它帮助我们生成用于将数据随机分割成训练集和测试集的索引：
- en: '[PRE2]'
  id: totrans-15
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: '*The argument `times` is used to define how many random samples of indexes
    to return, the argument `p` is used to define what proportion of the data is represented
    by the index, and the argument `list` is used to decide if we want the indexes
    returned as a list or not.'
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: '*`times`参数用于定义要返回多少个随机索引样本，`p`参数用于定义索引代表数据集的比例，而`list`参数用于决定我们是否希望返回索引列表。'
- en: 'We can use the result of the `createDataPartition` function call to define
    the training and test sets as follows:'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以使用`createDataPartition`函数调用的结果来定义训练集和测试集，如下所示：
- en: '[PRE3]'
  id: totrans-18
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: '*We will now develop an algorithm using **only** the training set. Once we
    are done developing the algorithm, we will *freeze* it and evaluate it using the
    test set. The simplest way to evaluate the algorithm when the outcomes are categorical
    is by simply reporting the proportion of cases that were correctly predicted **in
    the test set**. This metric is usually referred to as *overall accuracy*.**'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: '*我们现在将使用*仅*训练集开发一个算法。一旦我们完成算法的开发，我们将*冻结*它，并使用测试集来评估它。当结果为分类时，评估算法的最简单方法就是简单地报告在测试集中正确预测的案例比例。这个指标通常被称为*总体准确率*。**'
- en: '**27.2 Overall accuracy**'
  id: totrans-20
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '**27.2 总体准确率**'
- en: '**To demonstrate the use of overall accuracy, we will build two competing algorithms
    and compare them.'
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: '**为了演示总体准确率的使用，我们将构建两个相互竞争的算法并比较它们。'
- en: 'Let’s start by developing the simplest possible machine algorithm: guessing
    the outcome.'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们先开发最简单的机器算法：猜测结果。
- en: '[PRE4]'
  id: totrans-23
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: '*Note that we are completely ignoring the predictor and simply guessing the
    sex.'
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: '*请注意，我们完全忽略了预测变量，只是在猜测性别。'
- en: 'The *overall accuracy* is simply defined as the overall proportion that is
    predicted correctly:'
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: '*总体准确率*简单地定义为预测正确的总体比例：'
- en: '[PRE5]'
  id: totrans-26
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: '*Not surprisingly, our accuracy is about 50%. We are guessing!'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: '*不出所料，我们的准确率大约是50%。我们只是在猜测！'
- en: 'Can we do better? Exploratory data analysis suggests we can because, on average,
    males are slightly taller than females. But how do we make use of this insight?
    Let’s try another simple approach: predict 1 (`Female`) if height is less than
    two standard deviations from the average male height:'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 我们能做得更好吗？探索性数据分析表明我们可以，因为平均而言，男性的身高略高于女性。但我们如何利用这个洞察力呢？让我们尝试另一种简单的方法：如果身高低于平均男性身高两个标准差，则预测1（女性）：
- en: '[PRE6]'
  id: totrans-29
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: '*The accuracy goes up from 0.5 to about 0.8:'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: '*准确率从0.5上升到大约0.8：'
- en: '[PRE7]'
  id: totrans-31
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: '*But can we do even better? In the example above, we used a cutoff of 62, but
    we can examine the accuracy obtained for other cutoffs and then pick the value
    that provides the best results. But remember, **it is important that we optimize
    the cutoff using only the training set**: the test set is only for evaluation.
    Although for this simplistic example it is not much of a problem, later we will
    learn that evaluating an algorithm on the training set can lead to *overfitting*,
    which often results in over-optimistic assessments.'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: '*但我们能否做得更好？在上面的例子中，我们使用了62的截止值，但我们可以检查其他截止值所获得的准确性，然后选择提供最佳结果的那个值。但请记住，**我们只应使用训练集来优化截止值**：测试集仅用于评估。尽管对于这个简单的例子来说这不是一个大问题，但稍后我们将了解到，在训练集上评估算法可能会导致*过拟合*，这通常会导致过于乐观的评估。'
- en: 'Here we examine the accuracy of 10 different cutoffs and pick the one yielding
    the best result:'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 在这里，我们检查了10个不同截止值的准确性，并选择了产生最佳结果的那个：
- en: '[PRE8]'
  id: totrans-34
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: '*We can make a plot showing the accuracy obtained on the training set for males
    and females:'
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: '*我们可以绘制一个图，显示训练集上男性和女性的准确性：'
- en: '![](../Images/f42c3953647c444238993c458706071e.png)'
  id: totrans-36
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/f42c3953647c444238993c458706071e.png)'
- en: 'We see that the maximum value is:'
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: 我们看到最大值是：
- en: '[PRE9]'
  id: totrans-38
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: '*which is much higher than 0.5\. The cutoff resulting in this accuracy is:'
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: '*这个值远高于0.5。产生这个准确性的截止值是：'
- en: '[PRE10]'
  id: totrans-40
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: '*We can now test this cutoff on our test set to make sure our accuracy is not
    overly optimistic:'
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: '*现在我们可以将这个截止值测试在我们的测试集上，以确保我们的准确性不是过于乐观的：'
- en: '[PRE11]'
  id: totrans-42
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: '*We see that it is a bit lower than the accuracy observed for the training
    set. This is because we used the training set to select the cutoff, so there is
    some overtraining. However, out cutoff-based approach is still better than guessing.
    And by testing on a dataset that we did not train on, we know our improvement
    is not due to overtraining.**********'
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: '*我们发现它略低于训练集观察到的准确性。这是因为我们使用了训练集来选择截止值，所以存在一些过度训练。然而，我们的基于截止值的方法仍然比猜测要好。而且通过在一个我们没有训练过的数据集上进行测试，我们知道我们的改进不是由于过度训练。**********'
- en: '***27.3 The confusion matrix***'
  id: totrans-44
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '***27.3 混淆矩阵***'
- en: '***The prediction rule we developed in the previous section predicts female
    if the student is shorter than 64 inches. Given that the average female is about
    64 inches, this prediction rule seems wrong. What happened? If a student is the
    height of the average female, shouldn’t we predict female?'
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: '***我们在上一节中开发的预测规则预测如果学生的身高低于64英寸，则为女性。鉴于平均女性的身高约为64英寸，这个预测规则似乎是不正确的。发生了什么？如果一个学生的身高与平均女性相同，我们不应该预测为女性吗？'
- en: 'Generally speaking, overall accuracy can be misleading. To understand why,
    we begin by constructing a *confusion matrix*, a table that counts how often each
    combination of prediction and true outcome occurs. In R, we could create this
    table with `table`, but the **caret** package provides a convenient function,
    `confusionMatrix`, that not only computes the confusion matrix but also reports
    several additional performance metrics that we will use later:'
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: 一般而言，整体准确性可能会误导。为了理解原因，我们首先构建一个*混淆矩阵*，这是一个表格，它统计了每种预测和真实结果的组合出现的频率。在R中，我们可以使用`table`创建这个表格，但**caret**包提供了一个方便的函数`confusionMatrix`，它不仅计算混淆矩阵，还报告了我们将稍后使用的几个额外的性能指标：
- en: '[PRE12]'
  id: totrans-47
  prefs: []
  type: TYPE_PRE
  zh: '[PRE12]'
- en: '*If we study this table closely, it reveals a problem. If we compute the accuracy
    separately for each sex (in the next section, we explain that, in this context,
    *sensitivity* and *specificity* are equivalent to accuracy for females and males,
    respectively) we get:'
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: '*如果我们仔细研究这个表格，就会发现一个问题。如果我们分别计算每个性别的准确性（在下一节中，我们将解释，在这个上下文中，*灵敏度*和*特异性*分别等同于女性和男性的准确性），我们得到：'
- en: '[PRE13]'
  id: totrans-49
  prefs: []
  type: TYPE_PRE
  zh: '[PRE13]'
- en: '*We notice an imbalance: too many females are predicted to be male. We are
    calling almost half of the females male! How can our overall accuracy be so high
    then? This is because the *prevalence*, defined as the proportion of \(Y=1\) in
    our data, is low. These heights were collected from three data sciences courses,
    two of which had higher male enrollment:'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: '*我们注意到一个不平衡：预测为男性的女性太多。我们几乎将一半的女性错误地标记为男性！那么我们的整体准确性怎么会这么高呢？这是因为*患病率*，定义为数据中\(Y=1\)的比例，很低。这些身高是从三个数据科学课程中收集的，其中两个课程的男性入学率更高：'
- en: '[PRE14]'
  id: totrans-51
  prefs: []
  type: TYPE_PRE
  zh: '[PRE14]'
- en: '*So when computing overall accuracy, the high percentage of mistakes made for
    females is outweighed by the gains in correct calls for men.'
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: '*因此，在计算整体准确性时，对女性犯的错误的高比例被对男性正确预测的收益所抵消。'
- en: This type of bias can actually be a big problem in practice. If your training
    data is biased in some way, you are likely to develop algorithms that are biased
    as well. The fact that we used a test set does not matter because it is also derived
    from the original biased dataset. This is one of the reasons we look at metrics
    other than overall accuracy when evaluating a machine learning algorithm.
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: 这种类型的偏差在实践中实际上可能是一个大问题。如果你的训练数据以某种方式存在偏差，你很可能会开发出同样存在偏差的算法。我们使用了测试集的事实并不重要，因为它也是从原始的偏差数据集中推导出来的。这就是我们在评估机器学习算法时除了整体准确率之外还要查看其他指标的原因之一。
- en: There are several metrics that we can use to evaluate an algorithm in a way
    that prevalence does not cloud our assessment, and these can all be derived from
    the confusion matrix. A general improvement to using overall accuracy is to study
    *sensitivity* and *specificity* separately.******
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
  zh: 有几种指标我们可以用来评估算法，这样流行度就不会影响我们的评估，并且这些都可以从混淆矩阵中推导出来。使用整体准确率的一般改进是分别研究 *敏感性* 和
    *特异性*。******
- en: '***27.4 Sensitivity and specificity***'
  id: totrans-55
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '***27.4 敏感性和特异性***'
- en: '***To define sensitivity and specificity, we need a binary outcome. When outcomes
    are categorical, we can still use these terms by focusing on one specific category
    of interest. For example, in a digit recognition task, we might ask: What is the
    specificity of correctly identifying the digit 2 as opposed to any other digit?
    Once we choose a specific category, we treat observations in that category as
    positive cases (\(Y=1\)) and all others as negative cases (\(Y=0\)). This binary
    framing allows us to compute sensitivity and specificity in the usual way.'
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: '***为了定义敏感性和特异性，我们需要一个二元结果。当结果为分类时，我们可以通过关注一个感兴趣的特定类别来使用这些术语。例如，在一个数字识别任务中，我们可能会问：正确识别数字2而不是其他任何数字的特异性是什么？一旦我们选择了一个特定类别，我们就将那个类别中的观察值视为阳性案例
    (\(Y=1\))，而所有其他观察值视为阴性案例 (\(Y=0\))。这种二元框架使我们能够以通常的方式计算敏感性和特异性。***'
- en: 'In general, *sensitivity* is defined as the ability of an algorithm to predict
    a positive outcome when the actual outcome is positive: \(\hat{Y}=1\) when \(Y=1\).
    Because an algorithm that calls everything positive (\(\hat{Y}=1\) no matter what)
    has perfect sensitivity, this metric on its own is not enough to judge an algorithm.'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: 通常，*敏感性* 定义为算法在实际结果为正时预测阳性结果的能力：\(\hat{Y}=1\) 当 \(Y=1\)。因为一个将所有东西都称为阳性的算法 (\(\hat{Y}=1\)
    不论什么情况) 具有完美的敏感性，这个指标本身不足以判断一个算法。
- en: 'For this reason, we also examine *specificity*, which is generally defined
    as the ability of an algorithm to predict a negative \(\hat{Y}=0\) when the actual
    outcome is a negative \(Y=0\). We can summarize in the following way:'
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，我们也考察 *特异性*，这通常定义为算法在实际结果为负 \(Y=0\) 时预测负 \(\hat{Y}=0\) 的能力。我们可以以下述方式总结：
- en: 'High sensitivity: \(Y=1 \implies \hat{Y}=1\)'
  id: totrans-59
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 高敏感性：\(Y=1 \implies \hat{Y}=1\)
- en: 'High specificity: \(Y=0 \implies \hat{Y} = 0\)'
  id: totrans-60
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 高特异性：\(Y=0 \implies \hat{Y} = 0\)
- en: 'Although the above is often considered the definition of specificity, another
    way to think of specificity is by the proportion of positive calls that are actually
    positive:'
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: 虽然上述内容通常被认为是特异性的定义，但另一种思考特异性的方式是考虑实际为正的阳性呼叫的比例：
- en: 'High specificity: \(\hat{Y}=1 \implies Y=1\).'
  id: totrans-62
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 高特异性：\(\hat{Y}=1 \implies Y=1\)
- en: 'To provide precise definitions, we name the four entries of the confusion matrix:'
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: 为了提供精确的定义，我们命名混淆矩阵的四个条目：
- en: '|  | Actually Positive | Actually Negative |'
  id: totrans-64
  prefs: []
  type: TYPE_TB
  zh: '|  | 实际为阳性 | 实际为阴性 |'
- en: '| --- | --- | --- |'
  id: totrans-65
  prefs: []
  type: TYPE_TB
  zh: '| --- | --- | --- |'
- en: '| Predicted positive | True positives (TP) | False positives (FP) |'
  id: totrans-66
  prefs: []
  type: TYPE_TB
  zh: '| 预测为阳性 | 真阳性 (TP) | 假阳性 (FP) |'
- en: '| Predicted negative | False negatives (FN) | True negatives (TN) |'
  id: totrans-67
  prefs: []
  type: TYPE_TB
  zh: '| 预测为阴性 | 假阴性 (FN) | 真阴性 (TN) |'
- en: '*Sensitivity* is typically quantified by \(TP/(TP+FN)\), the proportion of
    actual positives (the first column = \(TP+FN\)) that are called positives (\(TP\)).
    This quantity is referred to as the *true positive rate* (TPR) or *recall*.'
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
  zh: '*敏感性* 通常通过 \(TP/(TP+FN)\) 来量化，这是实际阳性（第一列 = \(TP+FN\))的比例，被称为阳性 (\(TP\))。这个量被称为
    *真正的阳性率* (TPR) 或 *召回率*。'
- en: Specificity is defined as \(TN/(TN+FP)\) or the proportion of negatives (the
    second column = \(FP+TN\)) that are called negatives (\(TN\)). This quantity is
    also called the true negative rate (TNR).
  id: totrans-69
  prefs: []
  type: TYPE_NORMAL
  zh: 特异性定义为 \(TN/(TN+FP)\) 或称为负例的比例（第二列 = \(FP+TN\))，这些被称为负例 (\(TN\))。这个量也称为真正的负例率
    (TNR)。
- en: There is another way of quantifying *specificity* which is \(TP/(TP+FP)\) or
    the proportion of outcomes called positives (the first row or \(TP+FP\)) that
    are actually positives (\(TP\)). This quantity is referred to as *positive predictive
    value (PPV)* and also as *precision*. Note that, unlike TPR and TNR, precision
    depends on prevalence since higher prevalence implies you can get higher precision
    even when guessing.
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
  zh: 另一种量化 *特异度* 的方法是 \(TP/(TP+FP)\) 或实际为正例（\(TP\)）的预测结果（第一行或 \(TP+FP\)）的比例。这个量被称为
    *阳性预测值（PPV）*，也称为 *精确度*。请注意，与TPR和TNR不同，精确度取决于发病率，因为高发病率意味着即使猜测也能获得更高的精确度。
- en: The multiple names can be confusing, so we include a table to help us remember
    the terms. The table includes a column that shows the definition if we think of
    the proportions as probabilities.
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: 多种名称可能会令人困惑，因此我们包括一个表格来帮助我们记住这些术语。该表格包括一个列，如果我们将比例视为概率，则显示定义。
- en: '| Measure of | Name 1 | Name 2 | Definition | Probability representation |'
  id: totrans-72
  prefs: []
  type: TYPE_TB
  zh: '| 衡量指标 | 名称1 | 名称2 | 定义 | 概率表示 |'
- en: '| --- | --- | --- | --- | --- |'
  id: totrans-73
  prefs: []
  type: TYPE_TB
  zh: '| --- | --- | --- | --- | --- |'
- en: '| sensitivity | TPR | Recall | \(\frac{\mbox{TP}}{\mbox{TP} + \mbox{FN}}\)
    | \(\mathrm{Pr}(\hat{Y}=1 \mid Y=1)\) |'
  id: totrans-74
  prefs: []
  type: TYPE_TB
  zh: '| 灵敏度 | 真阳性率 | 召回率 | \(\frac{\mbox{TP}}{\mbox{TP} + \mbox{FN}}\) | \(\mathrm{Pr}(\hat{Y}=1
    \mid Y=1)\) |'
- en: '| specificity | TNR | 1-FPR | \(\frac{\mbox{TN}}{\mbox{TN}+\mbox{FP}}\) | \(\mathrm{Pr}(\hat{Y}=0
    \mid Y=0)\) |'
  id: totrans-75
  prefs: []
  type: TYPE_TB
  zh: '| 特异度 | 真阴性率 | 1-假阳性率 | \(\frac{\mbox{TN}}{\mbox{TN}+\mbox{FP}}\) | \(\mathrm{Pr}(\hat{Y}=0
    \mid Y=0)\) |'
- en: '| specificity | PPV | Precision | \(\frac{\mbox{TP}}{\mbox{TP}+\mbox{FP}}\)
    | \(\mathrm{Pr}(Y=1 \mid \hat{Y}=1)\) |'
  id: totrans-76
  prefs: []
  type: TYPE_TB
  zh: '| 特异度 | 阳性预测值 | 精确度 | \(\frac{\mbox{TP}}{\mbox{TP}+\mbox{FP}}\) | \(\mathrm{Pr}(Y=1
    \mid \hat{Y}=1)\) |'
- en: The **caret** function `confusionMatrix` computes all these metrics for us once
    we define which category is the positive (\(Y=1\)). The function expects factors
    as input, and the first level is considered the positive outcome, though it can
    be redefined with the `positive` argument.
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: '**caret** 函数 `confusionMatrix` 在我们定义哪个类别是正类（\(Y=1\)）后为我们计算所有这些指标。该函数期望输入因子，第一级被视为正结果，尽管可以通过
    `positive` 参数重新定义。'
- en: 'If you type this into R:'
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你将此输入R：
- en: '[PRE15]'
  id: totrans-79
  prefs: []
  type: TYPE_PRE
  zh: '[PRE15]'
- en: '*you will see several metrics including accuracy, sensitivity, specificity,
    and PPV.'
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
  zh: 你将看到几个指标，包括准确率、灵敏度、特异性和阳性预测值（PPV）。
- en: 'You can access these directly, for example, like this:'
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
  zh: 你可以直接访问这些指标，例如，像这样：
- en: '[PRE16]'
  id: totrans-82
  prefs: []
  type: TYPE_PRE
  zh: '[PRE16]'
- en: '*We can see that the high overall accuracy is possible despite relatively low
    sensitivity. As we hinted at above, the reason this happens is because of the
    low prevalence (0.23): the proportion of females is low. Because prevalence is
    low, failing to predict females correctly (low sensitivity) does not lower the
    overall accuracy as much as failing to predict males correctly (low specificity).
    This is an example of why it is important to examine sensitivity and specificity
    and not just accuracy.'
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
  zh: '*我们可以看到，尽管灵敏度相对较低，但仍然可能实现较高的整体准确率。正如我们上面所暗示的，这种情况发生的原因是由于低发病率（0.23）：女性的比例较低。由于发病率低，未能正确预测女性（灵敏度低）并不会像未能正确预测男性（特异度低）那样大幅降低整体准确率。这是一个为什么检查灵敏度和特异度而不仅仅是准确率很重要的例子。*'
- en: Before applying this algorithm to general datasets, we need to ask ourselves
    if prevalence in the general population will be the same as in our training dataset.*****
  id: totrans-84
  prefs: []
  type: TYPE_NORMAL
  zh: 在将此算法应用于通用数据集之前，我们需要问自己，总体人群中的发病率是否会与我们的训练数据集相同。*****
- en: '***27.5 Balanced accuracy and \(F_1\) score***'
  id: totrans-85
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '***27.5 平衡准确率和 \(F_1\) 分数***'
- en: '***Although we usually recommend studying both specificity and sensitivity,
    it is often useful to have a one-number summary, for example, for optimization
    purposes. One metric that is preferred over overall accuracy is the average of
    specificity and sensitivity, referred to as *balanced accuracy*. Because specificity
    and sensitivity are rates, it is more appropriate to compute the *harmonic* average.
    In fact, the *\(F_1\)-score*, a widely used one-number summary, is the harmonic
    average of precision and recall:'
  id: totrans-86
  prefs: []
  type: TYPE_NORMAL
  zh: '***尽管我们通常推荐研究特异度和灵敏度，但有时有一个数字总结是有用的，例如，用于优化目的。一个比整体准确率更受欢迎的指标是特异度和灵敏度的平均值，称为
    *平衡准确率*。由于特异度和灵敏度是比率，因此计算 *调和平均数* 更为合适。事实上，*\(F_1\)-分数*，一个广泛使用的数字总结，是精确度和召回率的调和平均数：'
- en: \[ \frac{1}{\frac{1}{2}\left(\frac{1}{\mbox{recall}} + \frac{1}{\mbox{precision}}\right)
    } = 2 \times \frac{\mbox{precision} \cdot \mbox{recall}} {\mbox{precision} + \mbox{recall}}.
    \]
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \frac{1}{\frac{1}{2}\left(\frac{1}{\mbox{召回率}} + \frac{1}{\mbox{精确度}}\right)
    } = 2 \times \frac{\mbox{精确度} \cdot \mbox{召回率}} {\mbox{精确度} + \mbox{召回率}}. \]
- en: 'The \(F_1\)-score can be adapted to weigh specificity and sensitivity differently.
    This is useful in practice because, depending on the context, some types of errors
    are more costly than others. For instance, in the case of plane safety, it is
    much more important to maximize sensitivity over specificity: failing to predict
    a plane will malfunction before it crashes is a much more costly error than grounding
    a plane when, in fact, the plane is in perfect condition. In a capital murder
    criminal case, the opposite is true since a false positive can lead to executing
    an innocent person.'
  id: totrans-88
  prefs: []
  type: TYPE_NORMAL
  zh: \(F_1\) 分数可以调整以不同方式权衡特异性和灵敏度。这在实践中很有用，因为根据上下文，某些类型的错误可能比其他类型的错误代价更高。例如，在飞机安全的情况下，最大化灵敏度比最大化特异性更重要：未能预测飞机在坠毁前发生故障是一个代价更高的错误，而实际上飞机处于完美状态时将飞机停飞。在一个死刑刑事案件中，情况正好相反，因为假阳性可能导致无辜的人被处决。
- en: 'To adapt \(F_1\), we define a weight \(\beta\) to represent how much more important
    sensitivity is compared to specificity and consider a weighted harmonic average:'
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
  zh: 为了适应 \(F_1\)，我们定义一个权重 \(\beta\) 来表示灵敏度相对于特异性的重要性，并考虑加权调和平均：
- en: \[ \frac{1}{\frac{\beta^2}{1+\beta^2}\frac{1}{\mbox{recall}} + \frac{1}{1+\beta^2}\frac{1}{\mbox{precision}}
    } \]
  id: totrans-90
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \frac{1}{\frac{\beta^2}{1+\beta^2}\frac{1}{\mbox{召回率}} + \frac{1}{1+\beta^2}\frac{1}{\mbox{精确率}}
    } \]
- en: The `F_meas` function in the **caret** package computes this summary with \(\beta\)
    defaulting to 1.
  id: totrans-91
  prefs: []
  type: TYPE_NORMAL
  zh: '**caret** 包中的 `F_meas` 函数使用默认的 \(\beta\) 值为 1 来计算这个摘要。'
- en: 'Let’s rebuild our prediction algorithm, but this time maximizing the F-score
    instead of overall accuracy:'
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们重新构建我们的预测算法，但这次是最大化 F 分数而不是整体准确性：
- en: '[PRE17]'
  id: totrans-93
  prefs: []
  type: TYPE_PRE
  zh: '[PRE17]'
- en: '*As before, we can plot these \(F_1\) measures versus the cutoffs:'
  id: totrans-94
  prefs: []
  type: TYPE_NORMAL
  zh: '*与之前一样，我们可以绘制这些 \(F_1\) 衡量值与截止值的对比图：'
- en: '![](../Images/63a605aa74c304f2319524af568b5c00.png)'
  id: totrans-95
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/63a605aa74c304f2319524af568b5c00.png)'
- en: 'We see that it is maximized at \(F_1\) value of:'
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: 我们看到它在 \(F_1\) 值最大化时：
- en: '[PRE18]'
  id: totrans-97
  prefs: []
  type: TYPE_PRE
  zh: '[PRE18]'
- en: '*This maximum is achieved when we use the following cutoff:'
  id: totrans-98
  prefs: []
  type: TYPE_NORMAL
  zh: '*这个最大值是在我们使用以下截止值时达到的：'
- en: '[PRE19]'
  id: totrans-99
  prefs: []
  type: TYPE_PRE
  zh: '[PRE19]'
- en: '*A cutoff of 66 makes more sense than 64 because it falls closer to the midpoint
    between the average heights of males and females. Additionally, it provides a
    better balance between sensitivity and specificity in the resulting confusion
    matrix.'
  id: totrans-100
  prefs: []
  type: TYPE_NORMAL
  zh: '*66 的截止值比 64 更有意义，因为它更接近男性和女性平均身高的中点。此外，它还在结果混淆矩阵中提供了灵敏度和特异性之间的更好平衡。'
- en: '[PRE20]'
  id: totrans-101
  prefs: []
  type: TYPE_PRE
  zh: '[PRE20]'
- en: '*We now see that we do much better than guessing, that both sensitivity and
    specificity are relatively high.*******'
  id: totrans-102
  prefs: []
  type: TYPE_NORMAL
  zh: '*现在我们可以看到，我们的表现比猜测要好得多，灵敏度和特异性都相对较高。*******'
- en: '***27.6 ROC and precision-recall curves***'
  id: totrans-103
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '***27.6 ROC 和精确率-召回率曲线***'
- en: '***When comparing the two methods (guessing versus using a height cutoff),
    we looked at accuracy and \(F_1\). The second method clearly outperformed the
    first. However, while we considered several cutoffs for the second method, for
    the first we only considered one approach: guessing with equal probability. Be
    aware that guessing `Male` with higher probability would give us higher accuracy
    due to the bias in the sample. But, as described above, this would come at the
    cost of lower sensitivity. The curves we describe in this section will help us
    see this.'
  id: totrans-104
  prefs: []
  type: TYPE_NORMAL
  zh: '***当我们比较两种方法（猜测和使用身高截止值）时，我们考虑了准确性和 \(F_1\)。第二种方法明显优于第一种。然而，虽然我们考虑了第二种方法的几个截止值，但对于第一种，我们只考虑了一种方法：以等概率猜测。请注意，以更高的概率猜测“男性”会由于样本中的偏差而提高准确性，但如上所述，这将以降低灵敏度为代价。本节中描述的曲线将帮助我们看到这一点。'
- en: Remember that for each cutoff, we can get a different sensitivity and specificity.
    For this reason, a very common approach to evaluating methods is to compare them
    graphically by plotting both.
  id: totrans-105
  prefs: []
  type: TYPE_NORMAL
  zh: 记住，对于每个截止值，我们都可以得到不同的灵敏度和特异性。因此，评估方法的一个非常常见的方法是通过绘制两者来图形化比较。
- en: A widely used plot that does this is the *receiver operating characteristic*
    (ROC) curve. If you are wondering about this name, consult the ROC Wikipedia page[¹](#fn1).
  id: totrans-106
  prefs: []
  type: TYPE_NORMAL
  zh: 做这件事的一个广泛使用的图是 *接收者操作特征*（ROC）曲线。如果你对这个名字感到好奇，可以查阅 ROC 维基百科页面[¹](#fn1)。
- en: 'The ROC curve plots sensitivity, represented as the TPR, versus 1 - specificity
    represented as the false positive rate (FPR). Here we compute the TPR and FPR
    needed for different probabilities of guessing male:'
  id: totrans-107
  prefs: []
  type: TYPE_NORMAL
  zh: ROC 曲线绘制了灵敏度（表示为 TPR）与 1 - 特异性（表示为假阳性率 FPR）的对比。在这里，我们计算了不同猜测男性概率所需的 TPR 和 FPR：
- en: '[PRE21]'
  id: totrans-108
  prefs: []
  type: TYPE_PRE
  zh: '[PRE21]'
- en: '*We can use similar code to compute these values for our our second approach.
    By plotting both curves together, we are able to compare sensitivity for different
    values of specificity:'
  id: totrans-109
  prefs: []
  type: TYPE_NORMAL
  zh: '*我们可以使用类似的代码来计算我们第二种方法的这些值。通过同时绘制两条曲线，我们能够比较不同特异性值下的灵敏度：'
- en: '![](../Images/06d7aa0094c9a6a821f16d2dc4441b1c.png)'
  id: totrans-110
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/06d7aa0094c9a6a821f16d2dc4441b1c.png)'
- en: We see that we obtain higher sensitivity with the cutoff approach for all values
    of specificity, which implies it is in fact a better method than guessing. Keep
    in mind that ROC curves for guessing always fall on the identity line. Also, note
    that when making ROC curves, it is often nice to add the cutoff associated with
    each point.
  id: totrans-111
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以看到，对于所有特异性值，我们通过截止方法获得了更高的灵敏度，这意味着它实际上是一个比猜测更好的方法。记住，猜测的ROC曲线总是落在身份线上。此外，请注意，在制作ROC曲线时，通常很好添加每个点的截止值。
- en: The packages **pROC** and **plotROC** are useful for generating these plots.
  id: totrans-112
  prefs: []
  type: TYPE_NORMAL
  zh: '**pROC**和**plotROC**包对于生成这些图表很有用。'
- en: 'ROC curves have one weakness and it is that neither of the measures plotted
    depends on prevalence. In cases in which prevalence matters, we may instead make
    a precision-recall plot. The idea is similar, but we instead plot precision against
    recall:'
  id: totrans-113
  prefs: []
  type: TYPE_NORMAL
  zh: ROC曲线有一个弱点，那就是图中绘制的两个指标都不依赖于发病率。在发病率很重要的情况下，我们可能需要制作一个精度-召回率图。想法是相似的，但我们绘制的是精度对召回率的图：
- en: '![](../Images/94cd696c645661bc06265f0d291aa1bb.png)'
  id: totrans-114
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/94cd696c645661bc06265f0d291aa1bb.png)'
- en: From the plot on the left, we immediately see that the precision of guessing
    is not high. This is because the prevalence is low. From the plot on the right,
    we see that if we change \(Y=1\) to mean `Male` instead of `Female`, the precision
    increases. Note that the ROC curve would remain the same.****
  id: totrans-115
  prefs: []
  type: TYPE_NORMAL
  zh: 从左边的图表中，我们立即可以看出猜测的精度并不高。这是因为发病率低。从右边的图表中，我们看到如果我们把\(Y=1\)改为表示“男性”而不是“女性”，精度就会提高。请注意，ROC曲线将保持不变。****
- en: '***27.7 Prevalence matters in practice***'
  id: totrans-116
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '***27.7 发病率在实践中很重要***'
- en: '***A machine learning algorithm with very high TPR and TNR may not be useful
    in practice when prevalence is close to either 0 or 1\. To see this, consider
    the case of a doctor that specializes in a rare disease and is interested in developing
    an algorithm for predicting who has the disease.'
  id: totrans-117
  prefs: []
  type: TYPE_NORMAL
  zh: '***一个具有非常高的TPR和TNR的机器学习算法，当发病率接近0或1时，在实践上可能并不有用。为了看到这一点，考虑一个专注于罕见疾病并希望开发预测疾病患者的算法的医生的情况。***'
- en: The doctor shares data with about 1/2 cases and 1/2 controls and some predictors.
    You then develop an algorithm with TPR=0.99 and TNR = 0.99\. You are excited to
    explain to the doctor that this means that if a patient has the disease, the algorithm
    is very likely to predict correctly. The doctor is not impressed and explains
    that your TNR is too low for this algorithm to be used in practice.
  id: totrans-118
  prefs: []
  type: TYPE_NORMAL
  zh: 医生与大约一半的病例和一半的对照组以及一些预测因子共享数据。然后你开发了一个算法，其TPR为0.99，TNR为0.99。你兴奋地向医生解释说，这意味着如果一个患者患有该疾病，算法很可能预测正确。医生并不感到印象深刻，并解释说你的TNR对于这个算法在实际应用中来说太低了。
- en: This is because, although the study dataset was constructed with equal numbers
    of cases and controls, the disease is very rare in the general population, with
    a prevalence of only about 0.5%.
  id: totrans-119
  prefs: []
  type: TYPE_NORMAL
  zh: 这是因为，尽管研究数据集是按照病例和对照组数量相等构建的，但在普通人群中，该疾病的发病率非常低，只有大约0.5%。
- en: 'We can use Bayes rule to compute the precision we expect you algorithm to have
    in the real population: \[ \begin{aligned} &\mathrm{Pr}(Y = 1\mid \hat{Y}=1) =
    \mathrm{Pr}(\hat{Y}=1 \mid Y=1) \frac{\mathrm{Pr}(Y=1)}{\mathrm{Pr}(\hat{Y}=1)}
    \implies\\ &\text{Precision} = \text{TPR} \times \frac{\text{Prevalence}}{\text{TPR}\times
    \text{Prevalence} + \text{FPR}\times(1-\text{Prevalence})} \approx 0.33 \end{aligned}
    \]'
  id: totrans-120
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以使用贝叶斯定理来计算你算法在真实人群中的预期精度：\[ \begin{aligned} &\mathrm{Pr}(Y = 1\mid \hat{Y}=1)
    = \mathrm{Pr}(\hat{Y}=1 \mid Y=1) \frac{\mathrm{Pr}(Y=1)}{\mathrm{Pr}(\hat{Y}=1)}
    \implies\\ &\text{Precision} = \text{TPR} \times \frac{\text{Prevalence}}{\text{TPR}\times
    \text{Prevalence} + \text{FPR}\times(1-\text{Prevalence})} \approx 0.33 \end{aligned}
    \]
- en: 'Here is plot of precision as a function of prevalence with TPR and TNR both
    equal to 99%:'
  id: totrans-121
  prefs: []
  type: TYPE_NORMAL
  zh: 这里是精度作为发病率函数的图表，其中TPR和TNR都等于99%：
- en: '![](../Images/0c3b633b9eea30aed1816a028cfb16ea.png)'
  id: totrans-122
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/0c3b633b9eea30aed1816a028cfb16ea.png)'
- en: Although your algorithm achieves a precision of about 99% on the balanced training
    data (with 50% prevalence), its precision would drop to roughly 33% when applied
    to the general population, where the disease prevalence is only 0.5%. A doctor
    cannot rely on a test for which two-thirds of positive results are false positives.
    Even with perfect sensitivity, the precision would still be about 33% under these
    conditions. To make the algorithm clinically useful, you would need to drastically
    reduce the false positive rate (FPR).***
  id: totrans-123
  prefs: []
  type: TYPE_NORMAL
  zh: 虽然你的算法在平衡的训练数据（50%的患病率）上实现了大约 99% 的精确度，但当应用于一般人群时，其精确度会下降到大约 33%，其中疾病患病率仅为 0.5%。医生不能依赖于三分之二阳性结果为假阳性的测试。即使具有完美的灵敏度，在这些条件下精确度仍然大约为
    33%。为了使算法在临床上有用，你需要大幅降低假阳性率（FPR）。
- en: '***27.8 Mean Squared Error***'
  id: totrans-124
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '***27.8 均方误差***'
- en: '***Up to now we have described evaluation metrics that apply exclusively to
    categorical data. Specifically, for binary outcomes, we have described how sensitivity,
    specificity, accuracy, and \(F_1\) can be used to quantify performance. However,
    these metrics are not useful for continuous outcomes.'
  id: totrans-125
  prefs: []
  type: TYPE_NORMAL
  zh: '***到目前为止，我们已描述了仅适用于分类数据的评估指标。具体来说，对于二元结果，我们已描述了如何使用灵敏度、特异性、准确性和 \(F_1\) 来量化性能。然而，这些指标对于连续结果来说并不适用。***'
- en: In this section, we describe how the general approach to defining “best” in
    machine learning is to define a *loss function*, which can be applied to both
    categorical and continuous data.
  id: totrans-126
  prefs: []
  type: TYPE_NORMAL
  zh: 在本节中，我们描述了在机器学习中定义“最佳”的一般方法，即定义一个 *损失函数*，该函数可以应用于分类和连续数据。
- en: 'The most commonly used loss function is the squared loss function. If \(\hat{y}\)
    is our predictor and \(y\) is the observed outcome, the squared loss function
    is simply: \((\hat{y} - y)^2\).'
  id: totrans-127
  prefs: []
  type: TYPE_NORMAL
  zh: 最常用的损失函数是平方损失函数。如果 \(\hat{y}\) 是我们的预测值，\(y\) 是观察到的结果，则平方损失函数简单地为：\((\hat{y}
    - y)^2\)。
- en: 'Because we often model \(y\) as the outcome of a random process, theoretically,
    it does not make sense to compare algorithms based on \((\hat{y} - y)^2\) as the
    minimum can change from sample to sample. For this reason, we minimize mean squared
    error (MSE):'
  id: totrans-128
  prefs: []
  type: TYPE_NORMAL
  zh: 因为我们通常将 \(y\) 模型化为一个随机过程的输出，从理论上讲，基于 \((\hat{y} - y)^2\) 来比较算法是没有意义的，因为最小值可能从样本到样本而变化。因此，我们最小化均方误差（MSE）：
- en: \[ \text{MSE} \equiv \mathrm{E}[(\hat{Y} - Y)^2 ] \]
  id: totrans-129
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \text{MSE} \equiv \mathrm{E}[(\hat{Y} - Y)^2 ] \]
- en: Consider that if the outcomes are binary, the MSE is equivalent to one minus
    expected accuracy, since \((\hat{y} - y)^2\) is 0 if the prediction was correct
    and 1 otherwise.
  id: totrans-130
  prefs: []
  type: TYPE_NORMAL
  zh: 假设结果为二元，MSE 等于 1 减去预期准确率，因为如果预测正确，\((\hat{y} - y)^2\) 为 0，否则为 1。
- en: Different algorithms will result in different predictions \(\hat{Y}\), and therefore
    different MSE. In general, our goal is to build an algorithm that minimizes the
    loss so it is as close to 0 as possible.
  id: totrans-131
  prefs: []
  type: TYPE_NORMAL
  zh: 不同的算法会导致不同的预测 \(\hat{Y}\)，因此不同的 MSE。一般来说，我们的目标是构建一个算法，使其损失最小化，尽可能接近 0。
- en: 'However, note that the mean squared error (MSE) is a theoretical quantity that
    depends on the unknown data-generating process. How do we estimate it in practice?
    Because we typically have a test set consisting of many independent observations
    \(y_1, \dots, y_N\), a natural and widely used estimate of the MSE is based on
    the average of the squared errors over the test set:'
  id: totrans-132
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，请注意，均方误差（MSE）是一个理论量，它依赖于未知的数据生成过程。我们在实践中如何估计它？因为我们通常有一个由许多独立观察值 \(y_1, \dots,
    y_N\) 组成的测试集，一个自然且广泛使用的 MSE 估计是基于测试集中平方误差的平均值：
- en: \[ \hat{\mbox{MSE}} = \frac{1}{N}\sum_{i=1}^N (\hat{y}_i - y_i)^2 \]
  id: totrans-133
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \hat{\mbox{MSE}} = \frac{1}{N}\sum_{i=1}^N (\hat{y}_i - y_i)^2 \]
- en: with the \(\hat{y}_i\) generated completely independently from the the \(y_i\)s.
  id: totrans-134
  prefs: []
  type: TYPE_NORMAL
  zh: 使用完全独立于 \(y_i\) 的 \(\hat{y}_i\) 生成。
- en: However, the estimate \(\hat{\text{MSE}}\) is a random variable. In fact, \(\text{MSE}\)
    and \(\hat{\text{MSE}}\) are often referred to as the true error and apparent
    error, respectively. Due to the complexity of some machine learning algorithms,
    it is difficult to derive the statistical properties of how well the apparent
    error estimates the true error. In [Chapter 29](resampling-methods.html), we introduce
    cross-validation an approach to estimating the MSE.
  id: totrans-135
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，估计值 \(\hat{\text{MSE}}\) 是一个随机变量。实际上，\(\text{MSE}\) 和 \(\hat{\text{MSE}}\)
    通常分别被称为真实误差和表面误差。由于某些机器学习算法的复杂性，很难推导出表面误差如何估计真实误差的统计特性。在[第29章](resampling-methods.html)中，我们介绍了交叉验证，这是一种估计MSE的方法。
- en: We conclude this chapter by noting that squared loss is not the only possible
    choice of loss function. For instance, the *mean absolute error (MAE)* replaces
    squared errors \((\hat{Y}_i - Y_i)^2\) with their absolute values \(|\hat{Y}_i
    - Y_i|\). Other loss functions are also possible, depending on the context and
    goals of the analysis. In this book, however, we focus on squared loss, since
    it is by far the most widely used and provides important mathematical conveniences
    that simplify both theory and computation.
  id: totrans-136
  prefs: []
  type: TYPE_NORMAL
  zh: 我们通过指出平方损失不是唯一可能的损失函数选择来结束本章。例如，*平均绝对误差（MAE）* 将平方误差 \((\hat{Y}_i - Y_i)^2\)
    替换为其绝对值 \(|\hat{Y}_i - Y_i|\)。根据上下文和分析目标，还有其他可能的损失函数。然而，在这本书中，我们专注于平方损失，因为它是最广泛使用的，并且提供了简化理论和计算的重要数学便利。
- en: '*In practice, we often report the root mean squared error (RMSE), which is
    simply \(\sqrt{\mbox{MSE}}\), because it is in the same units as the outcomes.****'
  id: totrans-137
  prefs: []
  type: TYPE_NORMAL
  zh: '*在实践中，我们经常报告均方根误差（RMSE），它只是 \(\sqrt{\mbox{MSE}}\)，因为它与结果具有相同的单位。**'
- en: '****27.9 Exercises****'
  id: totrans-138
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '****27.9 练习****'
- en: '****In the following exercises, we use the Titanic dataset to explore evaluation
    metrics for classification using simple decision rules based on continuous predictors.
    Our goal is not to build a sophisticated model but to understand how accuracy,
    sensitivity, specificity, precision, and prevalence depend on the choice of cutoff.
    We will predict survival using variables such as fare (ticket price), age, and
    passenger class (`Pclass`), treating survival (`Survived`) as a binary outcome.'
  id: totrans-139
  prefs: []
  type: TYPE_NORMAL
  zh: '****在以下练习中，我们使用 Titanic 数据集来探索使用基于连续预测因子的简单决策规则进行分类的评价指标。我们的目标不是构建一个复杂的模型，而是了解准确率、敏感性、特异性、精确率和患病率如何取决于截止值的选择。我们将使用票价（票价）、年龄和乘客等级（`Pclass`）等变量来预测生存，将生存（`Survived`）视为二元结果。'
- en: '[PRE22]'
  id: totrans-140
  prefs: []
  type: TYPE_PRE
  zh: '[PRE22]'
- en: '*Note that we defined the levels to be `c(1,0)` to avoid the defailt behaviou
    of making 0 (first alphabetically) the first level given that **caret** defines
    positives \(Y=1\) as the first level.'
  id: totrans-141
  prefs: []
  type: TYPE_NORMAL
  zh: '*请注意，我们将级别定义为 `c(1,0)` 以避免由于 **caret** 将正 \(Y=1\) 定义为第一个级别而导致的默认行为。**'
- en: 1\. Split the `titanic` datset into to `train_set` with 80% of the data and
    `test_set` with the remaining 20%.
  id: totrans-142
  prefs: []
  type: TYPE_NORMAL
  zh: 1. 将 `titanic` 数据集分为 `train_set`（80% 的数据）和 `test_set`（剩余的 20%）。
- en: '2\. Use `Fare` (ticket price) as a continuous score to predict survival. Create
    a simple rule: predict `1` (survived) if `Fare > cutoff`, otherwise predict `0`.
    Take `cutoff = median(train_set$Fare)`. Compute the accuracy on the `test_set`.
    Hint: When using `[factor()](https://rdrr.io/r/base/factor.html)`, R orders levels
    alphabetically by default. This means “0” will come before “1”, so if you convert
    predictions to a factor without specifying levels, the positive class may be assigned
    incorrectly. In this dataset, however, Survived has 1 as the first level. Make
    sure the factor levels of your predictions match the levels of test_set$Survived
    before computing accuracy or a confusion matrix.'
  id: totrans-143
  prefs: []
  type: TYPE_NORMAL
  zh: 2. 使用 `Fare`（票价）作为连续得分来预测生存。创建一个简单的规则：如果 `Fare > cutoff`，则预测 `1`（生存），否则预测 `0`。取
    `cutoff = median(train_set$Fare)`。在 `test_set` 上计算准确率。提示：当使用 `[factor()](https://rdrr.io/r/base/factor.html)`
    时，R 默认按字母顺序对级别进行排序。这意味着“0”将排在“1”之前，所以如果你在未指定级别的情况下将预测转换为因子，正类可能会被错误地分配。然而，在这个数据集中，Survived
    的第一个级别是 1。确保你的预测因子的级别与 test_set$Survived 的级别相匹配，在计算准确率或混淆矩阵之前。
- en: 3\. How does the accuracy achieved in exercise 2 compare to simply predicting
    `0` (not survived) for everyone?
  id: totrans-144
  prefs: []
  type: TYPE_NORMAL
  zh: 3. 练习 2 中实现的准确率与简单地预测每个人为 `0`（未生存）相比如何？
- en: 4\. For the same rule (predict `1` if `Fare > cutoff`), compute *sensitivity*,
    *specificity*, and *prevalence* for `cutoff = median(Fare)`. Use `sensitivity`,
    `specificity`, and `posPredValue` from **caret**. Interpret each quantity in the
    context of predicting who survives based only on ticket price.
  id: totrans-145
  prefs: []
  type: TYPE_NORMAL
  zh: 4. 对于相同的规则（如果 `Fare > cutoff`，则预测 `1`），计算 `cutoff = median(Fare)` 时的 *敏感性*、*特异性*
    和 *患病率*。使用 **caret** 中的 `sensitivity`、`specificity` 和 `posPredValue`。在仅基于票价预测谁会生存的上下文中解释每个量。
- en: '5\. Now repeat exercise 3 but for different cutoffs:'
  id: totrans-146
  prefs: []
  type: TYPE_NORMAL
  zh: 5. 现在重复练习 3，但使用不同的截止值：
- en: '[PRE23]'
  id: totrans-147
  prefs: []
  type: TYPE_PRE
  zh: '[PRE23]'
- en: '*For each cutoff, classify passengers as survived / not survived using `Fare
    > cutoff` and plot accuracy computed on the `train_set` against cutoff.'
  id: totrans-148
  prefs: []
  type: TYPE_NORMAL
  zh: '*对于每个截止值，使用 `Fare > cutoff` 将乘客分类为生存/未生存，并绘制在 `train_set` 上计算的准确率与截止值的关系图。'
- en: 6\. Using the results from exercise 5, best cutoff and compare accuracy with
    the rule chose on exercise 4 on both `train_set` and `test_set`.
  id: totrans-149
  prefs: []
  type: TYPE_NORMAL
  zh: 6. 使用练习 5 的结果，找到最佳截止值，并在 `train_set` 和 `test_set` 上将准确率与练习 4 中选择的规则进行比较。
- en: '7\. Generate an ROC curve based on the specificity and sensitivity computed
    on the test_set. For each point on the curve show the corresponding cutoff associated
    with that point. Briefly describe the trade-off you see as you move the cutoff:
    what happens to sensitivity and specificity when you increase the cutoff, and
    why does this make sense in terms of who tends to buy expensive tickets on the
    Titanic?'
  id: totrans-150
  prefs: []
  type: TYPE_NORMAL
  zh: 7. 根据在测试集上计算出的特异性和灵敏度生成一个ROC曲线。对于曲线上的每个点，显示与该点相关的截止值。简要描述当你移动截止值时看到的权衡：当你提高截止值时，灵敏度和特异性会发生什么变化，为什么这在评估谁倾向于在泰坦尼克号上购买昂贵的票时是有意义的？
- en: '8\. Now use a logistic regression model as a more refined continuous score.
    Fit the model:'
  id: totrans-151
  prefs: []
  type: TYPE_NORMAL
  zh: 8. 现在用一个逻辑回归模型作为更精细的连续得分。拟合模型：
- en: '[PRE24]'
  id: totrans-152
  prefs: []
  type: TYPE_PRE
  zh: '[PRE24]'
- en: '*We can obtain predicted probabilities of survival for each individual in both
    the train and test sets using the `predict` function:'
  id: totrans-153
  prefs: []
  type: TYPE_NORMAL
  zh: '*我们可以使用`predict`函数从训练集和测试集中为每个个体获得生存的预测概率：'
- en: '[PRE25]'
  id: totrans-154
  prefs: []
  type: TYPE_PRE
  zh: '[PRE25]'
- en: '*Classify passengers as survived if this probability is larger than 0.5\. How
    does the accuracy compare when computed on training and test sets? Comment on
    why the difference is larger than in our previous comparison in exercises 2 and
    3.'
  id: totrans-155
  prefs: []
  type: TYPE_NORMAL
  zh: '*如果这个概率大于0.5，则将乘客分类为生存。当在训练集和测试集上计算准确率时，这种比较与我们在第2题和第3题中的比较有何不同？请评论为什么差异比我们之前的比较更大。'
- en: 9\. Consider different cutoffs for `cutofs <- seq(0.05, 0.95, 0.05)` for this
    probability and generate an ROC curve based in the test set. Based on this ROC
    curve and the one computed in exercise 7, which method would you say performs
    better?
  id: totrans-156
  prefs: []
  type: TYPE_NORMAL
  zh: 9. 考虑`cutofs <- seq(0.05, 0.95, 0.05)`这个概率的不同截止值，并在测试集上生成一个ROC曲线。基于这个ROC曲线和第7题计算出的ROC曲线，你认为哪种方法表现更好？
- en: '10\. The overall prevalence of survival in this dataset is:'
  id: totrans-157
  prefs: []
  type: TYPE_NORMAL
  zh: 10. 该数据集中生存的整体普及率是：
- en: '[PRE26]'
  id: totrans-158
  prefs: []
  type: TYPE_PRE
  zh: '[PRE26]'
- en: '*Suppose you deploy your glm-based rule (from exercise 8) in a new setting
    where survival prevalence is only 20% instead. Explain qualitatively (no code
    needed) how this change in prevalence would affect *precision* (positive predictive
    value), even if sensitivity and specificity remained the same. Why is it important
    to think about prevalence when evaluating a model?*********'
  id: totrans-159
  prefs: []
  type: TYPE_NORMAL
  zh: '*假设你在生存普及率仅为20%的新环境中部署你的基于glm的规则（第8题）。无需代码，定性解释这种普及率的变化会如何影响*精确度*（阳性预测值），即使灵敏度和特异性保持不变。为什么在评估模型时考虑普及率很重要？*********'
- en: '* * *'
  id: totrans-160
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: '****1.  https://en.wikipedia.org/wiki/Receiver_operating_characteristic[↩︎](#fnref1)*******'
  id: totrans-161
  prefs: []
  type: TYPE_NORMAL
  zh: '****1.  https://en.wikipedia.org/wiki/Receiver_operating_characteristic[↩︎](#fnref1)*******'
