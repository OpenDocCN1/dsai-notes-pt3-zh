- en: Rounding
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 取整
- en: 原文：[https://cs357.cs.illinois.edu/textbook/notes/rounding.html](https://cs357.cs.illinois.edu/textbook/notes/rounding.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://cs357.cs.illinois.edu/textbook/notes/rounding.html](https://cs357.cs.illinois.edu/textbook/notes/rounding.html)
- en: Learning Objectives
  id: totrans-2
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 学习目标
- en: Understand the rounding options of a non-representable number using the IEEE-754
    floating pont standard.
  id: totrans-3
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用IEEE-754浮点数标准理解不可表示数字的取整选项。
- en: Measure the error in rounding numbers using the IEEE-754 floating point standard
  id: totrans-4
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用IEEE-754浮点数标准测量取整数字的误差
- en: Understand catastrophic cancellation in floating point arithmetic
  id: totrans-5
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 理解浮点数算术中的灾难性消去
- en: Predict the outcome of loss of significance in floating point arithmetic
  id: totrans-6
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 预测浮点数算术中精度损失的结果
- en: Make an optimal selection among a group of mathematically equivalent formulae
    to minimize floating point error
  id: totrans-7
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在一组数学上等价的公式中选择最优的，以最小化浮点误差
- en: Rounding Options in IEEE-754
  id: totrans-8
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: IEEE-754中的取整选项
- en: 'Not all real numbers can be stored exactly as floating point numbers. Consider
    a real number in the normalized floating point form:'
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 并非所有实数都可以精确地存储为浮点数。考虑一个规范化浮点数形式的实数：
- en: \[x = \pm 1.b_1 b_2 b_3 ... b_n ... \times 2^m\]
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: \[x = \pm 1.b_1 b_2 b_3 ... b_n ... \times 2^m\]
- en: where \(n\) is the number of bits in the significand and \(m\) is the exponent
    for a given floating point system. If \(x\) does not have an exact representation
    as a floating point number, it will be instead represented as either \(x_{-}\)
    or \(x_{+}\), the nearest two floating point numbers.
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 其中 \(n\) 是尾数的位数，\(m\) 是给定浮点数系统的指数。如果 \(x\) 不能精确地表示为浮点数，它将表示为 \(x_{-}\) 或 \(x_{+}\)，即最近的两个浮点数。
- en: 'Without loss of generality, let us assume \(x\) is a positive number. In this
    case, we have:'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 为了不失一般性，我们假设 \(x\) 是一个正数。在这种情况下，我们有：
- en: \[x_{-} = 1.b_1 b_2 b_3 ... b_n \times 2^m\]
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: \[x_{-} = 1.b_1 b_2 b_3 ... b_n \times 2^m\]
- en: and
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 以及
- en: \[x_{+} = 1.b_1 b_2 b_3 ... b_n \times 2^m + 0.\underbrace{000000...0001}_{n\text{
    bits}} \times 2^m\]![](../Images/1fa0f011597abe699785d7e54c67f1de.png)
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: \[x_{+} = 1.b_1 b_2 b_3 ... b_n \times 2^m + 0.\underbrace{000000...0001}_{n\text{
    bits}} \times 2^m\]![图片](../Images/1fa0f011597abe699785d7e54c67f1de.png)
- en: Notice that \(x_{-}\) is retrieved by "chopping" all the bits after the \(n^{th}\)
    bit, and \(x_{+} = x_{-} + {\epsilon}_{m} \times 2^m\), where \({\epsilon}_{m}\)
    is the machine epsilon.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 注意到 \(x_{-}\) 是通过“截断”第 \(n\) 位之后的所有位来检索的，而 \(x_{+} = x_{-} + {\epsilon}_{m}
    \times 2^m\)，其中 \({\epsilon}_{m}\) 是机器精度。
- en: The process of replacing a real number \(x\) by a nearby machine number (either
    \(x_{-}\) or \(x_{+}\)) is called **rounding**, and the error involved is called
    **roundoff error**.
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 将一个实数 \(x\) 替换为附近的机器数（\(x_{-}\) 或 \(x_{+}\)）的过程称为**取整**，涉及到的误差称为**取整误差**。
- en: '![](../Images/a71f1b345e75c811ecb7193358366769.png)'
  id: totrans-18
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/a71f1b345e75c811ecb7193358366769.png)'
- en: 'IEEE-754 doesn''t specify exactly how to round floating point numbers, but
    there are several different options:'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: IEEE-754没有指定如何精确地取整浮点数，但有几种不同的选项：
- en: round towards zero
  id: totrans-20
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 向零取整
- en: round towards infinity
  id: totrans-21
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 向无穷大取整
- en: round up
  id: totrans-22
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 向上取整
- en: round down
  id: totrans-23
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 向下取整
- en: round to the next nearest floating point number (either round up or down, whatever
    is closer)
  id: totrans-24
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 向最近的浮点数取整（向上或向下取整，取最近的那个）
- en: round by chopping
  id: totrans-25
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 通过截断取整
- en: 'We will denote the floating point number as \(fl(x)\). The rounding rules above
    can be summarized below:'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将浮点数表示为 \(fl(x)\)。上述取整规则可以总结如下：
- en: '![](../Images/bdec8c44150fced8a4719734836b0e1d.png)'
  id: totrans-27
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/bdec8c44150fced8a4719734836b0e1d.png)'
- en: 'round by chopping: \(fl(x) = x_{-}\)'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 通过截断取整：\(fl(x) = x_{-}\)
- en: Round-off Errors
  id: totrans-29
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 取整误差
- en: 'For each distinct exponent number \(m \in [L, U]\), the gap between two machine
    numbers is (notice that \(\epsilon_m\) is the machine epsilon, and is irrelevant
    with \(m\)):'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: 对于每个不同的指数数 \(m \in [L, U]\)，两个机器数之间的差距是（注意，\(\epsilon_m\) 是机器精度，与 \(m\) 无关）：
- en: \[\vert x_{+} - x_{-} \vert = 0.\underbrace{000000...0001}_{n\text{ bits}} \times
    2^m = \epsilon_m \times 2^m\]
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: \[\vert x_{+} - x_{-} \vert = 0.\underbrace{000000...0001}_{n\text{ bits}} \times
    2^m = \epsilon_m \times 2^m\]
- en: 'Notice that the interval between successive floating point numbers is not uniform:
    the interval is smaller as the magnitude of the numbers themselves is smaller,
    and it is bigger as the numbers get bigger. For example, considering simple precision:'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 注意到连续浮点数之间的间隔并不均匀：当数字本身的幅度较小时，间隔较小；当数字变大时，间隔变大。例如，考虑简单的精度：
- en: '\[x_{+} \hspace{3mm}\text{and}\hspace{3mm} x_{-} \hspace{3mm}\text{of the form}\hspace{3mm}
    q \times 2^{-10}: \vert x_{+} - x_{-} \vert = 2^{-33} \approx 10^{-10}\] \[x_{+}
    \hspace{3mm}\text{and}\hspace{3mm} x_{-} \hspace{3mm}\text{of the form}\hspace{3mm}
    q \times 2^{4}: \vert x_{+} - x_{-} \vert = 2^{-19} \approx 2 \times 10^{-6}\]
    \[x_{+} \hspace{3mm}\text{and}\hspace{3mm} x_{-} \hspace{3mm}\text{of the form}\hspace{3mm}
    q \times 2^{20}: \vert x_{+} - x_{-} \vert = 2^{-3} \approx 0.125\] \[x_{+} \hspace{3mm}\text{and}\hspace{3mm}
    x_{-} \hspace{3mm}\text{of the form}\hspace{3mm} q \times 2^{60}: \vert x_{+}
    - x_{-} \vert = 2^{37} \approx 10^{11}\]'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: '\[x_{+} \hspace{3mm}\text{和}\hspace{3mm} x_{-} \hspace{3mm}\text{的形式为}\hspace{3mm}
    q \times 2^{-10}: \vert x_{+} - x_{-} \vert = 2^{-33} \approx 10^{-10}\] \[x_{+}
    \hspace{3mm}\text{和}\hspace{3mm} x_{-} \hspace{3mm}\text{的形式为}\hspace{3mm} q \times
    2^{4}: \vert x_{+} - x_{-} \vert = 2^{-19} \approx 2 \times 10^{-6}\] \[x_{+}
    \hspace{3mm}\text{和}\hspace{3mm} x_{-} \hspace{3mm}\text{的形式为}\hspace{3mm} q \times
    2^{20}: \vert x_{+} - x_{-} \vert = 2^{-3} \approx 0.125\] \[x_{+} \hspace{3mm}\text{和}\hspace{3mm}
    x_{-} \hspace{3mm}\text{的形式为}\hspace{3mm} q \times 2^{60}: \vert x_{+} - x_{-}
    \vert = 2^{37} \approx 10^{11}\]'
- en: Hence it's better to use machine epsilon to bound the error in representing
    a real number as a machine number.
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，使用机器精度来界定表示实数作为机器数时的误差会更好。
- en: 'Absolute error:'
  id: totrans-35
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 绝对误差：
- en: \[\vert fl(x) - x \vert \le \vert x_{+} - x_{-} \vert = \epsilon_m \times 2^m\]
    \[\vert fl(x) - x \vert \le \epsilon_m \times 2^m\]
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: \[\vert fl(x) - x \vert \le \vert x_{+} - x_{-} \vert = \epsilon_m \times 2^m\]
    \[\vert fl(x) - x \vert \le \epsilon_m \times 2^m\]
- en: 'Relative error:'
  id: totrans-37
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 相对误差：
- en: \[\frac{ \vert fl(x) - x \vert }{ \vert x \vert } \le \frac{ \epsilon_m \times
    2^m } { \vert \pm 1.b_1 b_2 b_3 ... b_n ... \times 2^m \vert }\] \[\frac{ \vert
    fl(x) - x \vert }{ \vert x \vert } \le \epsilon_m\]
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: \[\frac{ \vert fl(x) - x \vert }{ \vert x \vert } \le \frac{ \epsilon_m \times
    2^m } { \vert \pm 1.b_1 b_2 b_3 ... b_n ... \times 2^m \vert }\] \[\frac{ \vert
    fl(x) - x \vert }{ \vert x \vert } \le \epsilon_m\]
- en: 'Using this inequality, observe that for the IEEE **single-precision** floating
    point system: \(\frac{ \vert fl(x) - x \vert }{ \vert x \vert } \le 2^{-23} \approx
    1.2 \times 10^{-7}\). Since the system consistently introduces relative errors
    of about \(10^{-7}\), a single precision floating point system typically gives
    you about **7** (decimal) accurate digits.'
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: 使用这个不等式，观察IEEE **单精度**浮点数系统：\(\frac{ \vert fl(x) - x \vert }{ \vert x \vert
    } \le 2^{-23} \approx 1.2 \times 10^{-7}\)。由于该系统始终引入大约 \(10^{-7}\) 的相对误差，单精度浮点系统通常提供大约
    **7**（十进制）位准确数字。
- en: 'Similarly, observe that for the IEEE **double-precision** floating point system:
    \(\frac{ \vert fl(x) - x \vert }{ \vert x \vert } \le 2^{-52} \approx 2.2 \times
    10^{-16}\). Since the system consistently introduces relative errors of about
    \(10^{-16}\), a double precision floating point system typically gives you about
    **16** (decimal) accurate digits.'
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 类似地，观察IEEE **双精度**浮点数系统：\(\frac{ \vert fl(x) - x \vert }{ \vert x \vert } \le
    2^{-52} \approx 2.2 \times 10^{-16}\)。由于该系统始终引入大约 \(10^{-16}\) 的相对误差，双精度浮点系统通常提供大约
    **16**（十进制）位准确数字。
- en: 'Example: Determine the rounding error of a non-representable number'
  id: totrans-41
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例：确定一个无法表示的数的舍入误差
- en: If we round to the nearest, what is the double-precision machine representation
    for 0.1? How much rounding error does it introduce?
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们四舍五入到最接近的，0.1的双精度机器表示形式是什么？它引入了多少舍入误差？
- en: '<details style="line-height: 2;"><summary>**Answer**</summary> Use the same
    algorithm that converts a decimal fraction to binary (as introduced in the previous
    section), we build the following table:'
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: '<details style="line-height: 2;"><summary>**答案**</summary> 使用与之前章节中介绍将十进制分数转换为二进制的相同算法，我们构建以下表格：'
- en: '| Previous Fractional Part \( \times 2 \) | Integer Part | Current Fractional
    Part |'
  id: totrans-44
  prefs: []
  type: TYPE_TB
  zh: '| 前一个分数部分 \( \times 2 \) | 整数部分 | 当前分数部分 |'
- en: '| --- | --- | --- |'
  id: totrans-45
  prefs: []
  type: TYPE_TB
  zh: '| --- | --- | --- |'
- en: '| 0.2 | 0 | 0.2 |'
  id: totrans-46
  prefs: []
  type: TYPE_TB
  zh: '| 0.2 | 0 | 0.2 |'
- en: '| 0.4 | 0 | 0.4 |'
  id: totrans-47
  prefs: []
  type: TYPE_TB
  zh: '| 0.4 | 0 | 0.4 |'
- en: '| 0.8 | 0 | 0.8 |'
  id: totrans-48
  prefs: []
  type: TYPE_TB
  zh: '| 0.8 | 0 | 0.8 |'
- en: '| 1.6 | 1 | 0.6 |'
  id: totrans-49
  prefs: []
  type: TYPE_TB
  zh: '| 1.6 | 1 | 0.6 |'
- en: '| 1.2 | 1 | 0.2 |'
  id: totrans-50
  prefs: []
  type: TYPE_TB
  zh: '| 1.2 | 1 | 0.2 |'
- en: '| 0.4 | 0 | 0.4 |'
  id: totrans-51
  prefs: []
  type: TYPE_TB
  zh: '| 0.4 | 0 | 0.4 |'
- en: '| 0.8 | 0 | 0.8 |'
  id: totrans-52
  prefs: []
  type: TYPE_TB
  zh: '| 0.8 | 0 | 0.8 |'
- en: '| 1.6 | 1 | 0.6 |'
  id: totrans-53
  prefs: []
  type: TYPE_TB
  zh: '| 1.6 | 1 | 0.6 |'
- en: '| 1.2 | 1 | 0.2 |'
  id: totrans-54
  prefs: []
  type: TYPE_TB
  zh: '| 1.2 | 1 | 0.2 |'
- en: '| ... | ... | ... |'
  id: totrans-55
  prefs: []
  type: TYPE_TB
  zh: '| ... | ... | ... |'
- en: We can observe that the integer part sequence \( {0, 0, 1, 1} \) is recurring.
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以观察到整数部分序列 \( {0, 0, 1, 1} \) 是循环出现的。
- en: Then, we have \( 0.1 = (0.000110011\hspace{1mm}\overline{0011})_2 = (1.10011\hspace{1mm}\overline{0011})_2
    \times 2^{-4}\) .
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: 然后，我们有 \( 0.1 = (0.000110011\hspace{1mm}\overline{0011})_2 = (1.10011\hspace{1mm}\overline{0011})_2
    \times 2^{-4}\) .
- en: 'Rounded by nearest, the double-precision machine representation for 0.1 is
    the tuple \( (s, c, f) \), where \(s\) is the sign bit, \(c\) is the exponent
    field, and \(f\) is the significand:'
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 使用最近邻舍入，0.1的双精度机器表示形式为元组 \( (s, c, f) \)，其中 \(s\) 是符号位，\(c\) 是指数字段，\(f\) 是尾数：
- en: \( s = 0 \)
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: \( s = 0 \)
- en: \( m = -4 \Rightarrow c = m + 1023 = 1019 = 01111111011\)
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: \( m = -4 \Rightarrow c = m + 1023 = 1019 = 01111111011\)
- en: \( f = 10011...0011...0011010 \)
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: \( f = 10011...0011...0011010 \)
- en: 'In other words, the double-precision machine representation for 0.1 is:'
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: 换句话说，0.1的双精度机器表示是：
- en: \( \bf{0\hspace{2mm}01111111011\hspace{2mm}\underbrace{10011...0011...0011010}_{52\text{
    bits}}} \)
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: \( \bf{0\hspace{2mm}01111111011\hspace{2mm}\underbrace{10011...0011...0011010}_{52\text{
    bits}}} \)
- en: 'The rounding error is then:'
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: 然后，舍入误差是：
- en: \( fl(0.1) - 0.1 = (0.00011001100110011...11010)_2 - (0.00011001100110011...1100110011\overline{0011})_2\)
    \(= (0.\underbrace{0...0}_{54\text{ 0's}}000110011\overline{0011})_2 = 2^{-54}
    \times 0.1 = 2^{-2} \times 0.1 \times 2^{-52} = \bf{0.025\epsilon_m}\)</details>
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
  zh: \( fl(0.1) - 0.1 = (0.00011001100110011...11010)_2 - (0.00011001100110011...1100110011\overline{0011})_2\)
    \(= (0.\underbrace{0...0}_{54\text{ 0's}}000110011\overline{0011})_2 = 2^{-54}
    \times 0.1 = 2^{-2} \times 0.1 \times 2^{-52} = \bf{0.025\epsilon_m}\)
- en: 'Example: Floating Point Equality'
  id: totrans-66
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例：浮点数相等
- en: Assume you are working with IEEE single-precision numbers. Find the smallest
    representable number \(a\) that satisfies \(2^8 + a \neq 2^8\).
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
  zh: 假设你正在使用 IEEE 单精度数。找到满足 \(2^8 + a \neq 2^8\) 的最小可表示数 \(a\)。
- en: '<details style="line-height: 2;"><summary>**Answer**</summary> In this class,
    to approximate the smallest number \(x\) such that \(2^n + x \neq 2^n\), we use
    the formula \(x = \epsilon_m \cdot 2^n\).'
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
  zh: '<details style="line-height: 2;"><summary>**答案**</summary> 在本课程中，为了近似最小的数 \(x\)，使得
    \(2^n + x \neq 2^n\)，我们使用公式 \(x = \epsilon_m \cdot 2^n\).'
- en: Therefore, given that \(\epsilon_m\) for IEEE single-precision is \(2^{-23}\),
    the answer is \(\bf{a = 2^{-23} \cdot 2^8 = 2^{-15}}\).
  id: totrans-69
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，鉴于 IEEE 单精度中的 \(\epsilon_m\) 为 \(2^{-23}\)，答案是 \(\bf{a = 2^{-23} \cdot 2^8
    = 2^{-15}}\).
- en: 'If you''re interested in the \(\textbf{exact}\) smallest number, here''s the
    solution (you do not need to know about this for CS 357, and please only use the
    formula above for all assignments in this class):'
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你感兴趣的是 \(\textbf{精确}\) 的最小数，这里是有解决方案（你不需要了解这个内容，对于 CS 357 课程，请只使用上述公式完成所有作业）：
- en: Notice that we use the default rounding mode - rounding to the nearest representable
    value. If the result is midway between two representable values, the even representable
    is chosen. "Even" means the lowest-order bit is zero.
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: 注意我们使用默认的舍入模式 - 舍入到最近的表示值。如果结果位于两个可表示值之间，则选择偶数表示值。"偶数"意味着最低位是零。
- en: The smallest representable number larger than \(2^8\) is \((2+\epsilon_m)\times
    2^8\).
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: 大于 \(2^8\) 的最小可表示数是 \((2+\epsilon_m)\times 2^8\).
- en: Let \(x_{-} = 2^8\) and \(x_{+} = (2+\epsilon_m)\times 2^8\).
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: 设 \(x_{-} = 2^8\) 和 \(x_{+} = (2+\epsilon_m)\times 2^8\).
- en: In order to have \(2^8 + a\) rounded to \(x_{+}\), we must have \(a \gt \frac{\vert
    x_{+} - x_{-} \vert}{2} = \frac{\epsilon_m\times 2^8}{2} = \frac{2^{-23}\times
    2^8}{2} = 2^{-16}\).
  id: totrans-74
  prefs: []
  type: TYPE_NORMAL
  zh: 为了使 \(2^8 + a\) 舍入到 \(x_{+}\)，我们必须有 \(a \gt \frac{\vert x_{+} - x_{-} \vert}{2}
    = \frac{\epsilon_m\times 2^8}{2} = \frac{2^{-23}\times 2^8}{2} = 2^{-16}\).
- en: The smallest machine representable number greater than \(2^{-16}\) is \((1 +
    \epsilon_m) \times 2^{-16}\).
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: 大于 \(2^{-16}\) 的最小机器可表示数是 \((1 + \epsilon_m) \times 2^{-16}\).
- en: Hence \(\bf{a = \bf{(1 + 2^{-23}) \times 2^{-16}}}\).</details>
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: 因此 \(\bf{a = \bf{(1 + 2^{-23}) \times 2^{-16}}}\).
