- en: Mathematical Properties of Floating Point Operations
  id: totrans-115
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 浮点运算的数学特性
- en: 'Not necessarily associative: \((x + y) + z \neq x + (y + z)\).'
  id: totrans-116
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 不一定是结合律：\((x + y) + z \neq x + (y + z)\).
- en: This is because \(fl(fl(x + y) + z) \neq fl(x + fl(y + z))\).
  id: totrans-117
  prefs: []
  type: TYPE_NORMAL
  zh: 这是因为 \(fl(fl(x + y) + z) \neq fl(x + fl(y + z))\).
- en: 'Not necessarily distributive: \(z \cdot (x + y) \neq z \cdot x + z \cdot y\).'
  id: totrans-118
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 不一定是分配律：\(z \cdot (x + y) \neq z \cdot x + z \cdot y\).
- en: This is because \(fl(z \cdot fl(x + y)) \neq fl(fl(z \cdot x) + fl(z \cdot y))\).
  id: totrans-119
  prefs: []
  type: TYPE_NORMAL
  zh: 这是因为 \(fl(z \cdot fl(x + y)) \neq fl(fl(z \cdot x) + fl(z \cdot y))\).
- en: 'Not necessarily cumulative: repeatedly adding a very small number to a large
    number may do nothing.'
  id: totrans-120
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 不一定是累积性：反复将一个非常小的数加到一个大数上可能没有任何效果。
- en: 'Example: Non-associative Feature'
  id: totrans-121
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例：非结合特性
- en: Find \(a\), \(b\) and \(c\) such that \((a + b) + c \neq a + (b + c)\) under
    double-precision floating point arithmetic.
  id: totrans-122
  prefs: []
  type: TYPE_NORMAL
  zh: 找到 \(a\)、\(b\) 和 \(c\)，使得在双精度浮点算术中 \((a + b) + c \neq a + (b + c)\).
- en: '<details style="line-height: 2;"><summary>**Answer**</summary> Let \(a = \pi,
    b = 10^{100}, c = -10^{100}\)'
  id: totrans-123
  prefs: []
  type: TYPE_NORMAL
  zh: '<details style="line-height: 2;"><summary>**答案**</summary> 设 \(a = \pi, b =
    10^{100}, c = -10^{100}\)</details>'
- en: 'Under double-precision floating point arithmetic:'
  id: totrans-124
  prefs: []
  type: TYPE_NORMAL
  zh: 在双精度浮点算术中：
- en: \((a + b) + c = 10^{100} + (-10^{100}) = 0\)
  id: totrans-125
  prefs: []
  type: TYPE_NORMAL
  zh: \((a + b) + c = 10^{100} + (-10^{100}) = 0\)
- en: \(a + (b + c) = \pi + 0 = \pi\)</details>
  id: totrans-126
  prefs: []
  type: TYPE_NORMAL
  zh: \(a + (b + c) = \pi + 0 = \pi\)</details>
- en: 'Example: Non-distributive Feature'
  id: totrans-127
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例：非分配特性
- en: Find \(a\), \(b\) and \(c\) such that \(c(a + b) \neq ca + cb\) under double-precision
    floating point arithmetic.
  id: totrans-128
  prefs: []
  type: TYPE_NORMAL
  zh: 找到 \(a\)、\(b\) 和 \(c\)，使得在双精度浮点算术中 \(c(a + b) \neq ca + cb\).
- en: '<details style="line-height: 2;"><summary>**Answer**</summary> Let \(a = 0.1,
    b = 0.2, c = 100\)'
  id: totrans-129
  prefs: []
  type: TYPE_NORMAL
  zh: '<details style="line-height: 2;"><summary>**答案**</summary> 设 \(a = 0.1, b =
    0.2, c = 100\)</details>'
- en: 'Under double-precision floating point arithmetic:'
  id: totrans-130
  prefs: []
  type: TYPE_NORMAL
  zh: 在双精度浮点算术中：
- en: \(c(a + b) = 100 \times 0.30000000000000004 = 30.000000000000004\)
  id: totrans-131
  prefs: []
  type: TYPE_NORMAL
  zh: \(c(a + b) = 100 \times 0.30000000000000004 = 30.000000000000004\)
- en: \(ca + cb = 10 + 20 = 30\)</details>
  id: totrans-132
  prefs: []
  type: TYPE_NORMAL
  zh: \(ca + cb = 10 + 20 = 30\)</details>
- en: Floating Point Arithmetic
  id: totrans-133
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 浮点算术
- en: 'The basic idea of floating point arithmetic is to first compute the exact result,
    and then round the result to make it fit into the desired precision:'
  id: totrans-134
  prefs: []
  type: TYPE_NORMAL
  zh: 浮点算术的基本思想是首先计算精确结果，然后将结果四舍五入以适应所需的精度：
- en: \[x + y = fl(x + y)\] \[x \times y = fl(x \times y)\]
  id: totrans-135
  prefs: []
  type: TYPE_NORMAL
  zh: \[x + y = fl(x + y)\] \[x \times y = fl(x \times y)\]
- en: Floating Point Addition
  id: totrans-136
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 浮点加法
- en: 'Adding two floating point numbers is easy. The basic idea is:'
  id: totrans-137
  prefs: []
  type: TYPE_NORMAL
  zh: 添加两个浮点数很简单。基本思想是：
- en: Bring both numbers to a common exponent
  id: totrans-138
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 将两个数都转换为相同的指数
- en: Do grade-school addition from the front, until you run out of digits in your
    system
  id: totrans-139
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 从系统中的前导位开始进行小学加法，直到你的系统中没有更多的数字
- en: Round the result
  id: totrans-140
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 四舍五入结果
- en: Consider a number system such that \(x = \pm 1.b_1 b_2 b_3 \times 2^m\) for
    \(m \in [-4, 4]\) and \(b_i \in \{0, 1\}\), and we perform addition on two numbers
    from this system.
  id: totrans-141
  prefs: []
  type: TYPE_NORMAL
  zh: 考虑一个数制，其中 \(x = \pm 1.b_1 b_2 b_3 \times 2^m\) 对于 \(m \in [-4, 4]\) 和 \(b_i
    \in \{0, 1\}\)，我们从这个系统中进行两个数的加法运算。
- en: 'Example 1: No Rounding Needed'
  id: totrans-142
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例 1：不需要舍入
- en: Let \(a = (1.101)_2 \times 2^1\) and \(b = (1.001)_2 \times 2^1\), find \(c
    = a + b\).
  id: totrans-143
  prefs: []
  type: TYPE_NORMAL
  zh: 设 \(a = (1.101)_2 \times 2^1\) 和 \(b = (1.001)_2 \times 2^1\)，求 \(c = a + b\).
- en: '<details style="line-height: 2;"><summary>**Answer**</summary> \(c = a + b
    = (10.110)_2 \times 2^1 = (1.011)_2 \times 2^2\)</details>'
  id: totrans-144
  prefs: []
  type: TYPE_NORMAL
  zh: '<details style="line-height: 2;"><summary>**答案**</summary> \(c = a + b = (10.110)_2
    \times 2^1 = (1.011)_2 \times 2^2\)</details>'
- en: 'Example 2: No Rounding Needed'
  id: totrans-145
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例 2：不需要舍入
- en: Let \(a = (1.100)_2 \times 2^1\) and \(b = (1.100)_2 \times 2^{-1}\), find \(c
    = a + b\).
  id: totrans-146
  prefs: []
  type: TYPE_NORMAL
  zh: 设 \(a = (1.100)_2 \times 2^1\) 和 \(b = (1.100)_2 \times 2^{-1}\)，求 \(c = a +
    b\).
- en: '<details style="line-height: 2;"><summary>**Answer**</summary> \(c = a + b
    = (1.100)_2 \times 2^1 + (0.011)_2 \times 2^1 = (1.111)_2 \times 2^1\)</details>'
  id: totrans-147
  prefs: []
  type: TYPE_NORMAL
  zh: '<details style="line-height: 2;"><summary>**答案**</summary> \(c = a + b = (1.100)_2
    \times 2^1 + (0.011)_2 \times 2^1 = (1.111)_2 \times 2^1\)</details>'
- en: 'Example 3: Requiring Rounding and Precision Lost'
  id: totrans-148
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例 3：需要舍入且精度丢失
- en: Let \(a = (1.a_1a_2a_3a_4a_5a_6...a_n...)_2 \times 2^0\) and \(b = (1.b_1b_2b_3b_4b_5b_6...b_n...)_2
    \times 2^{-8}\), find \(c = a + b\). Assume a single-precision system is used,
    and that \(n \gt 23\).
  id: totrans-149
  prefs: []
  type: TYPE_NORMAL
  zh: 设 \(a = (1.a_1a_2a_3a_4a_5a_6...a_n...)_2 \times 2^0\) 和 \(b = (1.b_1b_2b_3b_4b_5b_6...b_n...)_2
    \times 2^{-8}\)，求 \(c = a + b\)。假设使用单精度系统，且 \(n > 23\)。
- en: '<details style="line-height: 2;"><summary>**Answer**</summary> In single precision:'
  id: totrans-150
  prefs: []
  type: TYPE_NORMAL
  zh: '<details style="line-height: 2;"><summary>**答案**</summary> 在单精度中：'
- en: \(a = (1.a_1a_2a_3a_4a_5a_6...a_{22}a_{23})_2 \times 2^0\)
  id: totrans-151
  prefs: []
  type: TYPE_NORMAL
  zh: \(a = (1.a_1a_2a_3a_4a_5a_6...a_{22}a_{23})_2 \times 2^0\)
- en: \(b = (1.b_1b_2b_3b_4b_5b_6...b_{22}b_{23})_2 \times 2^{-8}\)
  id: totrans-152
  prefs: []
  type: TYPE_NORMAL
  zh: \(b = (1.b_1b_2b_3b_4b_5b_6...b_{22}b_{23})_2 \times 2^{-8}\)
- en: So \(a + b = (1.a_1a_2a_3a_4a_5a_6...a_{22}a_{23})_2 \times 2^0 + (0.00000001b_1b_2b_3b_4b_5b_6...b_{14}b_{15})_2
    \times 2^0\)
  id: totrans-153
  prefs: []
  type: TYPE_NORMAL
  zh: 因此 \(a + b = (1.a_1a_2a_3a_4a_5a_6...a_{22}a_{23})_2 \times 2^0 + (0.00000001b_1b_2b_3b_4b_5b_6...b_{14}b_{15})_2
    \times 2^0\)
- en: In this example, the result \(c = fl(a+b)\) includes only \(15\) bits of precision
    from \(b\), so a lost of precision happens as well.</details>
  id: totrans-154
  prefs: []
  type: TYPE_NORMAL
  zh: 在这个例子中，结果 \(c = fl(a+b)\) 只包含来自 \(b\) 的 \(15\) 位精度，因此也会发生精度丢失。</details>
- en: 'Example 4: Require Rounding and Precision Lost'
  id: totrans-155
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例 4：需要舍入且精度丢失
- en: Let \(a = (1.101)_2 \times 2^0\) and \(b = (1.000)_2 \times 2^0\), find \(c
    = a + b\). Round down if necessary.
  id: totrans-156
  prefs: []
  type: TYPE_NORMAL
  zh: 设 \(a = (1.101)_2 \times 2^0\) 和 \(b = (1.000)_2 \times 2^0\)，求 \(c = a + b\)。如有必要，向下舍入。
- en: '<details style="line-height: 2;"><summary>**Answer**</summary> \(c = a + b
    = (10.101)_2 \times 2^0 \approx (1.010)_2 \times 2^1\)</details>'
  id: totrans-157
  prefs: []
  type: TYPE_NORMAL
  zh: '<details style="line-height: 2;"><summary>**答案**</summary> \(c = a + b = (10.101)_2
    \times 2^0 \approx (1.010)_2 \times 2^1\)</details>'
- en: 'Example 5: Require Rounding and Precision Lost'
  id: totrans-158
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例 5：需要舍入且精度丢失
- en: Let \(a = (1.101)_2 \times 2^1\) and \(b = (1.001)_2 \times 2^{-1}\), find \(c
    = a + b\). Round down if necessary.
  id: totrans-159
  prefs: []
  type: TYPE_NORMAL
  zh: 设 \(a = (1.101)_2 \times 2^1\) 和 \(b = (1.001)_2 \times 2^{-1}\)，求 \(c = a +
    b\)。如有必要，向下舍入。
- en: '<details style="line-height: 2;"><summary>**Answer**</summary>\[\begin{align}
    a &= 1.101 \times 2^1 \\ b &= 0.01001 \times 2^1 \\ a + b &= 1.111 \times 2^1
    \\ \end{align}\]You''ll notice that we added two numbers with 4 significant digits,
    and our result also has 4 significant digits. There is no loss of significant
    digits with floating point addition.</details>'
  id: totrans-160
  prefs: []
  type: TYPE_NORMAL
  zh: '<details style="line-height: 2;"><summary>**答案**</summary>\[\begin{align} a
    &= 1.101 \times 2^1 \\ b &= 0.01001 \times 2^1 \\ a + b &= 1.111 \times 2^1 \\
    \end{align}\]您会注意到我们添加了两个具有 4 个有效数字的数字，我们的结果也有 4 个有效数字。在浮点数加法中没有有效数字的丢失。</details>'
- en: 'Example 6: No Rounding Needed but Precision Lost'
  id: totrans-161
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例 6：不需要舍入但精度丢失
- en: Let \(a = (1.1011)_2 \times 2^1\) and \(b = (-1.1010)_2 \times 2^1\), find \(c
    = a + b\).
  id: totrans-162
  prefs: []
  type: TYPE_NORMAL
  zh: 设 \(a = (1.1011)_2 \times 2^1\) 和 \(b = (-1.1010)_2 \times 2^1\)，求 \(c = a +
    b\)。
- en: '<details style="line-height: 2;"><summary>**Answer**</summary> \(c = a + b
    = (0.0001)_2 \times 2^1 = (1.????)_2 \times 2^{-3}\)'
  id: totrans-163
  prefs: []
  type: TYPE_NORMAL
  zh: '<details style="line-height: 2;"><summary>**答案**</summary> \(c = a + b = (0.0001)_2
    \times 2^1 = (1.????)_2 \times 2^{-3}\)'
- en: Unfortunately there is not data to indicate what the missing digits should be.
    The effect is that the number of significant digits in the result is reduced.
    Machine fills them with its best guess,which is often not good (usually what is
    called spurious zeros). This phenomenon is called Catastrophic Cancellation.</details>
  id: totrans-164
  prefs: []
  type: TYPE_NORMAL
  zh: 不幸的是，没有数据表明缺失的数字应该是什么。结果是，结果中的有效数字数量减少。机器用其最佳猜测来填充，这通常不是很好（通常称为虚假零）。这种现象被称为灾难性舍入。</details>
- en: Floating Point Subtraction and Catastrophic Cancellation
  id: totrans-165
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 浮点数减法和灾难性舍入
- en: Floating point subtraction works much the same was that addition does. However,
    problems occur when you subtract two numbers of similar magnitude.
  id: totrans-166
  prefs: []
  type: TYPE_NORMAL
  zh: 浮点数减法与加法的工作方式基本相同。然而，当您从两个相似大小的数字中减去时，会出现问题。
- en: 'For example, in order to subtract \(b = (1.1010)_2 \times 2^1\) from \(a =
    (1.1011)_2 \times 2^1\), this would look like:'
  id: totrans-167
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，为了从 \(a = (1.1011)_2 \times 2^1\) 中减去 \(b = (1.1010)_2 \times 2^1\)，这看起来会是这样：
- en: \[\begin{align} a &= 1.1011???? \times 2^1 \\ b &= 1.1010???? \times 2^1 \\
    a - b &= 0.0001???? \times 2^1 \\ \end{align}\]
  id: totrans-168
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{align} a &= 1.1011???? \times 2^1 \\ b &= 1.1010???? \times 2^1 \\
    a - b &= 0.0001???? \times 2^1 \\ \end{align}\]
- en: When we normalize the result, we get \(1.???? \times 2^{-3}\). There is no data
    to indicate what the missing digits should be. Although the floating point number
    will be stored with 4 digits in the fractional, it will only be accurate to a
    single significant digit. This loss of significant digits is known as ***catastrophic
    cancellation***.
  id: totrans-169
  prefs: []
  type: TYPE_NORMAL
  zh: 当我们对结果进行归一化时，我们得到 \(1.???? \times 2^{-3}\)。没有数据表明缺失的数字应该是什么。尽管浮点数将以小数点后 4 位存储，但它只能精确到单个有效数字。这种有效数字的丢失被称为
    ***灾难性舍入***。
- en: 'More rigidly, consider a general case when \(x \approx y\). Without loss of
    generality, we assume \(x, y \gt 0\) (if \(x\) and \(y\) are negative, then \(y
    - x = -(x - y) = -x - (-y)\), where \(-x\) and \(-y\) are both positive and similar
    in magnitude). Suppose we need to calculate \(fl(y - x)\) given:'
  id: totrans-170
  prefs: []
  type: TYPE_NORMAL
  zh: 更严格地，考虑一个一般情况，当 \(x \approx y\)。不失一般性，我们假设 \(x, y > 0\)（如果 \(x\) 和 \(y\) 是负数，那么
    \(y - x = -(x - y) = -x - (-y)\)，其中 \(-x\) 和 \(-y\) 都是正数并且大小相似）。假设我们已知以下条件来计算
    \(fl(y - x)\)：
- en: \[x = 1.a_1 a_2 a_3 ... a_{n-2} a_{n-1}0 a_{n+1} a_{n+2} ... \times 2^m\] \[y
    = 1.a_1 a_2 a_3 ... a_{n-2} a_{n-1}1 b_{n+1} b_{n+2} ... \times 2^m\]
  id: totrans-171
  prefs: []
  type: TYPE_NORMAL
  zh: \[x = 1.a_1 a_2 a_3 ... a_{n-2} a_{n-1}0 a_{n+1} a_{n+2} ... \times 2^m\] \[y
    = 1.a_1 a_2 a_3 ... a_{n-2} a_{n-1}1 b_{n+1} b_{n+2} ... \times 2^m\]
- en: It can be shown that for all \(n \gt 1\), precision lost happens, and it becomes
    more catastrophic when \(n\) increases (in other words, when \(x\) and \(y\) gets
    more similar). Then, consider when \(n = 23\) and single-precision floating point
    system is used, then \(fl(y - x) = 1.????... \times 2^{-23+m}\), where the leading
    "\(1\)" before the decimal point becomes the only significant digit. Notice that
    the floating point system may produce \(fl(y - x) = 1.000... \times 2^{-n+m}\),
    but all digits after the decimal point are "guessed" and are not significant digits.
    In fact, the precision lost is not due to \(fl(y-x)\) but due to rounding of \(x,
    y\) from the beginning in order to get numbers representable by the floating point
    system.
  id: totrans-172
  prefs: []
  type: TYPE_NORMAL
  zh: 可以证明，对于所有 \(n > 1\)，精度损失会发生，并且当 \(n\) 增加时（换句话说，当 \(x\) 和 \(y\) 更相似时），它变得更加灾难性。然后，考虑当
    \(n = 23\) 并且使用单精度浮点系统时，那么 \(fl(y - x) = 1.????... \times 2^{-23+m}\)，其中小数点前的“1”成为唯一的显著性数字。注意，浮点系统可能会产生
    \(fl(y - x) = 1.000... \times 2^{-n+m}\)，但小数点后的所有数字都是“猜测”的，并且不是显著性数字。实际上，精度损失不是由于
    \(fl(y-x)\) 而是由于从开始对 \(x, y\) 进行舍入以获得浮点系统可表示的数字。
- en: 'Example: Using Mathematically-Equivalent Formulae to Prevent Cancellation'
  id: totrans-173
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 示例：使用数学上等效的公式来防止舍入误差
- en: Consider the function \(f(x) = \sqrt{x^{2} + 1} - 1\). When we evaluate \(f(x)\)
    for values of \(x\) near zero, we may encounter loss of significance due to floating
    point subtraction. If \(x = 10^{-3}\), using five-decimal-digit arithmetic, \(f(10^{-3})
    = \sqrt{10^{-6} + 1} - 1 = 0\). How can we find an alternative formula to perform
    mathematically-equivalent computation without catastrophic cancellation?
  id: totrans-174
  prefs: []
  type: TYPE_NORMAL
  zh: 考虑函数 \(f(x) = \sqrt{x^{2} + 1} - 1\). 当我们评估 \(f(x)\) 在 \(x\) 接近零的值时，可能会因为浮点数减法而遇到显著性损失。如果
    \(x = 10^{-3}\)，使用五位小数运算，\(f(10^{-3}) = \sqrt{10^{-6} + 1} - 1 = 0\)。我们如何找到一个替代公式来执行数学上等效的计算，而不发生灾难性的舍入误差？
- en: '<details style="line-height: 2;"><summary>**Answer**</summary> A method of
    avoiding loss of significant digits is to eliminate subtraction:'
  id: totrans-175
  prefs: []
  type: TYPE_NORMAL
  zh: '<details style="line-height: 2;"><summary>**答案**</summary> 避免显著性数字损失的一种方法是消除减法：'
- en: \( f(x) = \sqrt{x^{2} + 1} - 1 = \frac{ (\sqrt{x^{2} + 1} - 1) \cdot (\sqrt{x^{2}
    + 1} + 1) } { \sqrt{x^{2} + 1} + 1 } = \frac{ x^{2} } { (\sqrt{x^{2} + 1} + 1)
    } \)
  id: totrans-176
  prefs: []
  type: TYPE_NORMAL
  zh: \( f(x) = \sqrt{x^{2} + 1} - 1 = \frac{ (\sqrt{x^{2} + 1} - 1) \cdot (\sqrt{x^{2}
    + 1} + 1) } { \sqrt{x^{2} + 1} + 1 } = \frac{ x^{2} } { (\sqrt{x^{2} + 1} + 1)
    } \)
- en: Thus for \( x = 10^{-3} \), using five-decimal-digit arithmetic, \( f(10^{-3})
    = \frac{ 10^{-6} } { 2 } \).</details>
  id: totrans-177
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，对于 \(x = 10^{-3}\)，使用五位小数运算，\( f(10^{-3}) = \frac{ 10^{-6} } { 2 } \).</details>
- en: 'Example: Calculating Relative Error when Cancellation Occurs'
  id: totrans-178
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 示例：当发生舍入时计算相对误差
- en: If \(x = 0.3721448693\) and \(y = 0.3720214371\), what is the relative error
    in the computation of \((x − y)\) in a computer with five decimal digits of accuracy?
  id: totrans-179
  prefs: []
  type: TYPE_NORMAL
  zh: 如果 \(x = 0.3721448693\) 和 \(y = 0.3720214371\)，在具有五位小数精度的计算机上计算 \((x − y)\)
    的相对误差是多少？
- en: '<details style="line-height: 2;"><summary>**Answer**</summary> Using five decimal
    digits of accuracy, the numbers are rounded as:'
  id: totrans-180
  prefs: []
  type: TYPE_NORMAL
  zh: '<details style="line-height: 2;"><summary>**答案**</summary> 使用五位小数的精度，数字被四舍五入如下：'
- en: \(fl(x) = 0.37214\) and \(fl(y) = 0.37202\)
  id: totrans-181
  prefs: []
  type: TYPE_NORMAL
  zh: \(fl(x) = 0.37214\) 和 \(fl(y) = 0.37202\)
- en: 'Then the subtraction is computed:'
  id: totrans-182
  prefs: []
  type: TYPE_NORMAL
  zh: 然后进行减法运算：
- en: \(fl(x) − fl(y) = 0.37214 − 0.37202 = 0.00012 \)
  id: totrans-183
  prefs: []
  type: TYPE_NORMAL
  zh: \(fl(x) − fl(y) = 0.37214 − 0.37202 = 0.00012 \)
- en: 'The result of the operation is:'
  id: totrans-184
  prefs: []
  type: TYPE_NORMAL
  zh: 操作的结果是：
- en: \(fl(x − y) = 1.20000 × 10^{−2}\)
  id: totrans-185
  prefs: []
  type: TYPE_NORMAL
  zh: \(fl(x − y) = 1.20000 × 10^{−2}\)
- en: Notice that the last four digits are filled with spurious zeros.
  id: totrans-186
  prefs: []
  type: TYPE_NORMAL
  zh: 注意到最后四位数字被填充了虚假的零。
- en: 'The relative error between the exact and computer solutions is given by:'
  id: totrans-187
  prefs: []
  type: TYPE_NORMAL
  zh: 精确解和计算机解之间的相对误差由以下公式给出：
- en: \( \frac{\vert (x - y) - fl(x - y) \vert}{\vert (x - y) \vert} = \frac{0.0001234322
    − 0.00012}{0.000123432} = \frac{0.0000034322}{0.000123432} \approx \bf{3 \times
    10^{-2}} \)
  id: totrans-188
  prefs: []
  type: TYPE_NORMAL
  zh: \(\frac{\vert (x - y) - fl(x - y) \vert}{\vert (x - y) \vert} = \frac{0.0001234322
    − 0.00012}{0.000123432} = \frac{0.0000034322}{0.000123432} \approx \bf{3 \times
    10^{-2}} \)
- en: 'Note that the magnitude of the error due to the subtraction is large when compared
    with the relative error due to the rounding, which is:'
  id: totrans-189
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，与舍入的相对误差相比，减法引起的误差的幅度较大，其相对误差为：
- en: \( \frac{\vert x - fl(x) \vert}{\vert x \vert} \approx 1.3 \times 10^{-5} \)</details>
  id: totrans-190
  prefs: []
  type: TYPE_NORMAL
  zh: \( \frac{\vert x - fl(x) \vert}{\vert x \vert} \approx 1.3 \times 10^{-5} \)</details>
- en: Review Questions
  id: totrans-191
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 复习问题
- en: Given a real number, what is the rounding error involved in storing it as a
    machine number? What is the relative error?
  id: totrans-192
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 给定一个实数，将其存储为机器数时涉及到的舍入误差是什么？相对误差是多少？
- en: How can we bound the relative error of representing a real number as a normalized
    machine number?
  id: totrans-193
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我们如何界定将实数表示为归一化机器数时的相对误差？
- en: What is cancellation? Why is it a problem?
  id: totrans-194
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 什么是消去？为什么它是一个问题？
- en: What types of operations lead to catastrophic cancellation?
  id: totrans-195
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 哪些类型的操作会导致灾难性消去？
- en: Given two different equations for evaluating the same value, can you identify
    which is more accurate for certain x and why?
  id: totrans-196
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 给定两个用于评估相同值的方程，你能确定哪个在特定的x值上更准确，以及为什么吗？
