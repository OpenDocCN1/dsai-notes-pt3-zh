    "Edit This Page")<details class="myst-dropdown rounded-md my-5 shadow dark:shadow-2xl
    dark:shadow-neutral-900 overflow-hidden bg-gray-50 dark:bg-stone-800"><summary
    class="myst-dropdown-header m-0 text-lg font-medium py-1 min-h-[2em] pl-3 cursor-pointer
