- en: '14\. Now fit a model with both `Sex` and `Class`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE32]'
  prefs: []
  type: TYPE_PRE
- en: '*1.  Which passenger class has the highest odds of survival, based on the estimates?'
  prefs: []
