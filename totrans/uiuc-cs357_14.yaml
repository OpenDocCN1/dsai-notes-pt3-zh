- en: Finite Difference Methods
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 有限差分方法
- en: 原文：[https://cs357.cs.illinois.edu/textbook/notes/finite-difference.html](https://cs357.cs.illinois.edu/textbook/notes/finite-difference.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://cs357.cs.illinois.edu/textbook/notes/finite-difference.html](https://cs357.cs.illinois.edu/textbook/notes/finite-difference.html)
- en: Learning Objectives
  id: totrans-2
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 学习目标
- en: Approximate derivatives using the Finite Difference Method
  id: totrans-3
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用有限差分法近似导数
- en: Finite Difference Approximation
  id: totrans-4
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 有限差分近似
- en: Motivation
  id: totrans-5
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 动机
- en: For a given smooth function \(f(x)\), we want to calculate the derivative \(f'(x)\)
    at a given value of \(x\).
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 对于一个给定的光滑函数 \(f(x)\)，我们想要计算 \(x\) 的给定值处的导数 \(f'(x)\)。
- en: However, sometimes we do not know how to compute the analytical expression \(f'(x)\)
    or it is computationally too expensive.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，有时我们不知道如何计算 \(f'(x)\) 的解析表达式，或者计算成本太高。
- en: Finite difference methods can help find an approximation for the value of \(f'(x)\).
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 有限差分方法可以帮助找到 \(f'(x)\) 的近似值。
- en: Definition
  id: totrans-9
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 定义
- en: For a differentiable function \(f(x):\mathbb{R} \rightarrow \mathbb{R}\), the
    derivative is defined as
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 对于一个可微函数 \(f(x):\mathbb{R} \rightarrow \mathbb{R}\)，导数的定义是
- en: \[f'(x) = \lim_{h \rightarrow 0} \frac{f(x+h)-f(x)}{h} \]
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: \[f'(x) = \lim_{h \rightarrow 0} \frac{f(x+h)-f(x)}{h} \]
- en: We define the forward finite difference approximation, \(df(x)\), to the first
    derivative as
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将前向有限差分近似，\(df(x)\)，定义为第一导数
- en: \[f'(x) \approx df(x) = \frac{f(x+h)-f(x)}{h} \]
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: \[f'(x) \approx df(x) = \frac{f(x+h)-f(x)}{h} \]
- en: where \(h\) is often called a "perturbation", i.e., a "small" change to the
    variable \(x\) (small when compared to the magnitude of \(x\)).
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 其中 \(h\) 通常被称为“扰动”，即对变量 \(x\) 的“小”变化（与 \(x\) 的大小相比是小）。
- en: By Taylor's theorem, we can write
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 通过泰勒定理，我们可以写出
- en: \[f(x+h) = f(x) + f'(x)\, h + f''(x) \frac{h^2}{2} + f'''(x) \frac{h^3}{6} +
    ... \]\[f(x+h) =f(x) + f'(x)\, h + O(h^2) \]\[f'(x) = \frac{f(x+h)-f(x)}{h} +
    O(h) \]
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: \[f(x+h) = f(x) + f'(x)\, h + f''(x) \frac{h^2}{2} + f'''(x) \frac{h^3}{6} +
    ... \]\[f(x+h) =f(x) + f'(x)\, h + O(h^2) \]\[f'(x) = \frac{f(x+h)-f(x)}{h} +
    O(h) \]
- en: 'Rearranging the above, we get the derivative \(f''(x)\) as a function of the
    forward finite difference approximation \(df(x)\):'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 重新排列上述公式，我们得到导数 \(f'(x)\) 作为前向有限差分近似 \(df(x)\) 的函数：
- en: \[f'(x) = df(x) + O(h) \]
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: \[f'(x) = df(x) + O(h) \]
- en: Error
  id: totrans-19
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 错误
- en: 'Therefore, the truncation error of the forward finite difference approximation
    is bounded by:'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，前向有限差分近似的截断误差被限制在以下范围内：
- en: \[Mh \geq |f'(x) - df(x)| \]
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: \[Mh \geq |f'(x) - df(x)| \]
- en: where \(M\) is a constant bound on the value of \(h\).
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 其中 \(M\) 是 \(h\) 值的一个常数界限。
- en: 'If \(h\) is very small, we will have cancellation errors, which is bounded
    by:'
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 如果 \(h\) 非常小，我们将会遇到舍入误差，其界限为：
- en: \[\frac{\epsilon_m|f(x)|}{h} \geq df(x) \]
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: \[\frac{\epsilon_m|f(x)|}{h} \geq df(x) \]
- en: where \(\epsilon_m\) is machine epsilon.
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: 其中 \(\epsilon_m\) 是机器精度。
- en: 'To find the \(h\) that minimizes the total error:'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 为了找到使总误差最小化的 \(h\)：
- en: \[error \approx \frac{\epsilon_m|f(x)|}{h} + Mh \]\[h = \sqrt{\frac{\epsilon_m
    |f(x)|}{M}} \]
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: \[error \approx \frac{\epsilon_m|f(x)|}{h} + Mh \]\[h = \sqrt{\frac{\epsilon_m
    |f(x)|}{M}} \]
- en: Using the forward finite different approximation on \(f(x) = e^x - 2\), we can
    see the values of total error, truncation error, and rounding error depending
    on the chosen perturbation \(h\) in the graph below.
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 使用 \(f(x) = e^x - 2\) 上的前向有限差分近似，我们可以从下面的图中看到总误差、截断误差和舍入误差的值，这取决于选择的扰动 \(h\)。
- en: '![Vector v graph](../Images/6814520206f8b98da833ea26248f9f5c.png)'
  id: totrans-29
  prefs: []
  type: TYPE_IMG
  zh: '![向量 v 图](../Images/6814520206f8b98da833ea26248f9f5c.png)'
- en: Therefore, we can see that the optimal \(h\) that minimizes the total error
    is where the truncation error and rounding error intersect.
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，我们可以看到使总误差最小化的最优 \(h\) 是截断误差和舍入误差相交的地方。
- en: 'Using a similar approach, we can summarize the following finite difference
    approximations:'
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: 使用类似的方法，我们可以总结以下有限差分近似：
- en: Forward Finite Difference Method
  id: totrans-32
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 前向有限差分法
- en: \[df(x) = \frac{f(x+h)-f(x)}{h}\]
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: \[df(x) = \frac{f(x+h)-f(x)}{h}\]
- en: In addition to the computation of \(f(x)\), this method requires an extra cost
    of one function evaluation \(f(x+h)\) for a given perturbation, and has truncation
    order \(O(h)\).
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: 除了计算 \(f(x)\) 之外，这种方法还需要额外的计算成本，即对一个给定的扰动 \(f(x+h)\) 进行一次函数评估，并且具有截断阶 \(O(h)\)。
- en: Example
  id: totrans-35
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 示例
- en: Assume \(f(x) = 2x^2 + 15x + 1\) and we are trying to find \(df(x)\) at \(x
    = 10, h = 0.01\).
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 假设 \(f(x) = 2x^2 + 15x + 1\) 并且我们试图在 \(x = 10, h = 0.01\) 处找到 \(df(x)\)。
- en: \[f(x) = f(10) = 2 \times 10^2 + 15 \times 10+ 1 = 351 \]\[f(x+h) = f(10+0.01)
    = 2 \times (10.01)^2 + 15 \times (10.01)+ 1 = 351.5502 \]\[df(x) = df(10) = \frac
    {351.5502 - 351}{0.01} = 55.02 \]
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: \[f(x) = f(10) = 2 \times 10^2 + 15 \times 10+ 1 = 351 \]\[f(x+h) = f(10+0.01)
    = 2 \times (10.01)^2 + 15 \times (10.01)+ 1 = 351.5502 \]\[df(x) = df(10) = \frac
    {351.5502 - 351}{0.01} = 55.02 \]
- en: 'We can find the absolute truncation error by:'
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以通过以下方式找到绝对截断误差：
- en: \[f'(x) = 4x + 15, f'(10) = 55 \]\[error = |f'(x) - df(x)| = |55 - 55.02| =
    0.02 \]
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: \[f'(x) = 4x + 15, f'(10) = 55 \]\[error = |f'(x) - df(x)| = |55 - 55.02| =
    0.02 \]
- en: Backward Finite Difference Method
  id: totrans-40
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 后向有限差分法
- en: \[df(x) = \frac{f(x)-f(x-h)}{h}\]
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: \[df(x) = \frac{f(x)-f(x-h)}{h}\]
- en: In addition to the computation of \(f(x)\), this method requires and extra cost
    of one function evaluation \(f(x-h)\) for a given perturbation, and has truncation
    order \(O(h) \).
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: 除了计算 \(f(x)\) 的值之外，这种方法还需要额外的计算一个函数值 \(f(x-h)\) 的成本，对于一个给定的扰动，并且具有截断阶数 \(O(h)
    \)。
- en: Example
  id: totrans-43
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 示例
- en: Assume \(f(x) = 2x^2 + 15x + 1\) and we are trying to find \(df(x)\) at \(x
    = 10, h = 0.01\).
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 假设 \(f(x) = 2x^2 + 15x + 1\)，我们试图在 \(x = 10, h = 0.01\) 处找到 \(df(x)\)。
- en: \[f(x) = f(10) = 2 \times 10^2 + 15 \times 10+ 1 = 351 \]\[f(x-h) = f(10-0.01)
    = 2 \times (9.99)^2 + 15 \times (9.99)+ 1 = 350.4502 \]\[df(x) = df(10) = \frac
    {351 - 350.4502}{0.01} = 54.98 \]
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: \[f(x) = f(10) = 2 \times 10^2 + 15 \times 10+ 1 = 351 \]\[f(x-h) = f(10-0.01)
    = 2 \times (9.99)^2 + 15 \times (9.99)+ 1 = 350.4502 \]\[df(x) = df(10) = \frac
    {351 - 350.4502}{0.01} = 54.98 \]
- en: 'We can find the absolute truncation error by:'
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以通过以下方式找到绝对截断误差：
- en: \[f'(x) = 4x + 15, f'(10) = 55 \]\[error = |f'(x) - df(x)| = |55 - 54.98| =
    0.02 \]
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: \[f'(x) = 4x + 15, f'(10) = 55 \]\[error = |f'(x) - df(x)| = |55 - 54.98| =
    0.02 \]
- en: Central Finite Difference Method
  id: totrans-48
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 中央有限差分法
- en: \[df(x) = \frac{f(x+h)-f(x-h)}{2h}\]
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: \[df(x) = \frac{f(x+h)-f(x-h)}{2h}\]
- en: This method requires an extra cost of two function evaluations (\(f(x+h)\) and
    \(f(x-h)\) ) for a given perturbation, and has truncation order \(O(h^2) \). So,
    we can see that the Central Finite Difference approximation provides better accuracy
    with possible increased computational cost.
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: 这种方法需要一个额外的函数评估成本（\(f(x+h)\) 和 \(f(x-h)\)），对于一个给定的扰动，并且具有截断阶数 \(O(h^2) \)。因此，我们可以看到中央有限差分近似提供了更好的精度，但可能增加了计算成本。
- en: Example
  id: totrans-51
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 示例
- en: Assume \(f(x) = 2x^2 + 15x + 1\) and we are trying to find \(df(x)\) at \(x
    = 10, h = 0.01\).
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: 假设 \(f(x) = 2x^2 + 15x + 1\)，我们试图在 \(x = 10, h = 0.01\) 处找到 \(df(x)\)。
- en: \[f(x+h) = f(10+0.01) = 2 \times (10.01)^2 + 15 \times (10.01)+ 1 = 351.5502
    \]\[f(x-h) = f(10-0.01) = 2 \times (9.99)^2 + 15 \times (9.99)+ 1 = 350.4502 \]\[df(x)
    = df(10) = \frac {351.5502 - 350.4502}{2 \times 0.01} = 55.0 \]
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: \[f(x+h) = f(10+0.01) = 2 \times (10.01)^2 + 15 \times (10.01)+ 1 = 351.5502
    \]\[f(x-h) = f(10-0.01) = 2 \times (9.99)^2 + 15 \times (9.99)+ 1 = 350.4502 \]\[df(x)
    = df(10) = \frac {351.5502 - 350.4502}{2 \times 0.01} = 55.0 \]
- en: 'We can find the absolute truncation error by:'
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以通过以下方式找到绝对截断误差：
- en: \[f'(x) = 4x + 15, f'(10) = 55 \]\[error = |f'(x) - df(x)| = |55 - 55| = 0.0\]
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: \[f'(x) = 4x + 15, f'(10) = 55 \]\[error = |f'(x) - df(x)| = |55 - 55| = 0.0\]
- en: Gradient Approximation
  id: totrans-56
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 梯度近似
- en: Consider a differentiable function \(f(x_1, \dots, x_n):\mathbb{R^n} \rightarrow
    \mathbb{R}\), where the derivative is defined as the gradient, or
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: 考虑一个可微函数 \(f(x_1, \dots, x_n):\mathbb{R^n} \rightarrow \mathbb{R}\)，其中导数定义为梯度，或者
- en: \[\nabla f(x) = \begin{bmatrix} \frac{\partial f}{\partial x_1} \\ \frac{\partial
    f}{\partial x_2} \\ \vdots \\ \frac{\partial f}{\partial x_n} \end{bmatrix} \]
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: \[\nabla f(x) = \begin{bmatrix} \frac{\partial f}{\partial x_1} \\ \frac{\partial
    f}{\partial x_2} \\ \vdots \\ \frac{\partial f}{\partial x_n} \end{bmatrix} \]
- en: We define the gradient finite difference approximation as
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: 我们定义梯度有限差分近似为
- en: \[\nabla_{FD} f(x) = \begin{bmatrix} df(x_1) \\ df(x_2) \\ \vdots \\ df(x_n)
    \end{bmatrix} = \begin{bmatrix} \frac{f(x+h \delta_1) - f(x)}{h} \\ \frac{f(x+h
    \delta_2) - f(x)}{h} \\ \vdots \\ \frac{f(x+h \delta_n) - f(x)}{h} \end{bmatrix}\]
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: \[\nabla_{FD} f(x) = \begin{bmatrix} df(x_1) \\ df(x_2) \\ \vdots \\ df(x_n)
    \end{bmatrix} = \begin{bmatrix} \frac{f(x+h \delta_1) - f(x)}{h} \\ \frac{f(x+h
    \delta_2) - f(x)}{h} \\ \vdots \\ \frac{f(x+h \delta_n) - f(x)}{h} \end{bmatrix}\]
- en: using the forward finite difference method, where \(\delta_i \) is a vector
    with a \(1\) at position \(i\) and \(0\) elsewhere.
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: 使用前向有限差分法，其中 \(\delta_i \) 是一个在位置 \(i\) 有 \(1\) 而其他地方为 \(0\) 的向量。
- en: 'Note: \(df(x) \) can be defined using any finite difference method.'
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: 注意：\(df(x) \) 可以使用任何有限差分方法定义。
- en: Example
  id: totrans-63
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 示例
- en: Assume \(f(x_1, x_2) = 2x_1 + x_1^2x_2 + x_2^3\) and we are trying to find the
    forward finite difference gradient approximation at \(x_1 = 1.3, x_2 = 4.9\) when
    \(h = 0.05\).
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: 假设 \(f(x_1, x_2) = 2x_1 + x_1^2x_2 + x_2^3\)，我们试图在 \(x_1 = 1.3, x_2 = 4.9\)
    处，当 \(h = 0.05\) 时找到前向有限差分梯度的近似值。
- en: \[\nabla_{FD} f(x) = \begin{bmatrix} df(x_1) \\ df(x_2) \end{bmatrix} = \begin{bmatrix}
    14.985 \\ 74.4575 \end{bmatrix} \]\[\ df(x_1) = \frac{f(x_1 + h, x_2) - f(x_1,
    x_2)}{h} = \frac{f(1.3 + 0.05, 4.9) - f(1.3, 4.9)}{0.05} = 14.985 \]\[\ df(x_2)
    = \frac{f(x_1, x_2 + h) - f(x_1, x_2)}{h} = \frac{f(1.3, 4.9 + 0.05) - f(1.3,
    4.9)}{0.05} = 74.4575 \]
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
  zh: \[\nabla_{FD} f(x) = \begin{bmatrix} df(x_1) \\ df(x_2) \end{bmatrix} = \begin{bmatrix}
    14.985 \\ 74.4575 \end{bmatrix} \]\[\ df(x_1) = \frac{f(x_1 + h, x_2) - f(x_1,
    x_2)}{h} = \frac{f(1.3 + 0.05, 4.9) - f(1.3, 4.9)}{0.05} = 14.985 \]\[\ df(x_2)
    = \frac{f(x_1, x_2 + h) - f(x_1, x_2)}{h} = \frac{f(1.3, 4.9 + 0.05) - f(1.3,
    4.9)}{0.05} = 74.4575 \]
- en: 'We can find the absolute truncation error by:'
  id: totrans-66
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以通过以下方式找到绝对截断误差：
- en: \[\nabla f(x) = \begin{bmatrix} \frac{\partial f}{\partial x_1} \\ \frac{\partial
    f}{\partial x_2} \end{bmatrix} = \begin{bmatrix} 2 x_1 x_2 + 2 \\ x_1^2 + 3 x_2^2
    \end{bmatrix} \ = \begin{bmatrix} 14.74 \\ 73.72 \end{bmatrix} \]\[error = |\nabla
    f(x) - \nabla_{FD} f(x)| = \begin{bmatrix} |14.985 - 14.74| \\ | 74.4575 - 73.72|
    \end{bmatrix} \ = \begin{bmatrix} .245 \\ .7375 \end{bmatrix} \ \]
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
  zh: \[\nabla f(x) = \begin{bmatrix} \frac{\partial f}{\partial x_1} \\ \frac{\partial
    f}{\partial x_2} \end{bmatrix} = \begin{bmatrix} 2 x_1 x_2 + 2 \\ x_1^2 + 3 x_2^2
    \end{bmatrix} \ = \begin{bmatrix} 14.74 \\ 73.72 \end{bmatrix} \]\[error = |\nabla
    f(x) - \nabla_{FD} f(x)| = \begin{bmatrix} |14.985 - 14.74| \\ | 74.4575 - 73.72|
    \end{bmatrix} \ = \begin{bmatrix} .245 \\ .7375 \end{bmatrix} \ \]
- en: Jacobian Approximation
  id: totrans-68
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 雅可比近似
- en: Consider a differentiable function \(f = \begin{bmatrix} f_1(x) & f_2(x) & \dots
    & f_n(x) \end{bmatrix}:\mathbb{R^n} \rightarrow \mathbb{R^m}\), where the derivative
    is defined as the Jacobian matrix, or
  id: totrans-69
  prefs: []
  type: TYPE_NORMAL
  zh: 考虑一个可微函数 \(f = \begin{bmatrix} f_1(x) & f_2(x) & \dots & f_n(x) \end{bmatrix}:\mathbb{R^n}
    \rightarrow \mathbb{R^m}\)，其中导数定义为雅可比矩阵，或者
- en: \[\mathbb{J}(x) = \begin{bmatrix} \frac{\partial f_1}{\partial x_1} & \frac{\partial
    f_1}{\partial x_2} & \dots & \frac{\partial f_1}{\partial x_n}\\ \frac{\partial
    f_2}{\partial x_1} & \frac{\partial f_2}{\partial x_2} & \dots & \frac{\partial
    f_2}{\partial x_n} \\ & \ddots \\ \frac{\partial f_m}{\partial x_1} & \frac{\partial
    f_m}{\partial x_2} & \dots & \frac{\partial f_m}{\partial x_n} \end{bmatrix} \]
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
  zh: \[\mathbb{J}(x) = \begin{bmatrix} \frac{\partial f_1}{\partial x_1} & \frac{\partial
    f_1}{\partial x_2} & \dots & \frac{\partial f_1}{\partial x_n}\\ \frac{\partial
    f_2}{\partial x_1} & \frac{\partial f_2}{\partial x_2} & \dots & \frac{\partial
    f_2}{\partial x_n} \\ & \ddots \\ \frac{\partial f_m}{\partial x_1} & \frac{\partial
    f_m}{\partial x_2} & \dots & \frac{\partial f_m}{\partial x_n} \end{bmatrix} \]
- en: We define the Jacobian finite difference approximation as
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: 我们定义雅可比有限差分近似为
- en: \[\mathbb{J_{FD}}(x) = \begin{bmatrix} df_1(x_1) & df_1(x_2) & \dots & df_1(x_n)\\
    df_2(x_1) & df_2(x_2) & \dots & df_2(x_n) \\ & \ddots \\ df_m(x_1) & df_m(x_2)
    & \dots & df_m(x_n) \end{bmatrix} \]
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: \[\mathbb{J_{FD}}(x) = \begin{bmatrix} df_1(x_1) & df_1(x_2) & \dots & df_1(x_n)\\
    df_2(x_1) & df_2(x_2) & \dots & df_2(x_n) \\ & \ddots \\ df_m(x_1) & df_m(x_2)
    & \dots & df_m(x_n) \end{bmatrix} \]
- en: where \(df_i(x_j) \) is the approximation of \(f_i\) at \(x_j\) using any finite
    difference method.
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: 其中 \(df_i(x_j) \) 是使用任何有限差分方法在 \(x_j\) 处对 \(f_i\) 的近似。
- en: Example
  id: totrans-74
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 示例
- en: Assume \(f = \begin{bmatrix} f_1(x) = 2x_1^2 + 6x_1x_2 & f_2(x) = 3x_1 + 7x_2
    \end{bmatrix}\) and we are trying to find the forward finite difference gradient
    approximation at \(x_1 = 3, x_2 = 7\) when \(h = 0.1\).
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: 假设 \(f = \begin{bmatrix} f_1(x) = 2x_1^2 + 6x_1x_2 & f_2(x) = 3x_1 + 7x_2 \end{bmatrix}\)
    并且我们试图在 \(x_1 = 3, x_2 = 7\) 时，当 \(h = 0.1\) 时找到前向有限差分梯度近似。
- en: \[\nabla_{FD} f(x) = \begin{bmatrix} df_1(x_1) && df_1(x_2) \\ df_2(x_1) &&
    df_2(x_2) \end{bmatrix} = \begin{bmatrix} 54.2 && 18 \\ 3 && 7 \end{bmatrix} \]\[\
    df_1(x_1) = \frac{f_1(x_1 + h, x_2) - f_1(x_1, x_2)}{h} = \frac{f_1(3 + 0.1, 7)
    - f_1(3, 7)}{0.1} = 54.2 \]\[\ df_1(x_2) = \frac{f_1(x_1, x_2 + h) - f_1(x_1,
    x_2)}{h} = \frac{f_1(3, 7 + 0.1) - f_1(3, 7)}{0.1} = 18 \]\[\ df_2(x_1) = \frac{f_2(x_1
    + h, x_2) - f_2(x_1, x_2)}{h} = \frac{f_2(3 + 0.1, 7) - f_2(3, 7)}{0.1} = 3 \]\[\
    df_2(x_2) = \frac{f_2(x_1, x_2 + h) - f_2(x_1, x_2)}{h} = \frac{f_2(3, 7 + 0.1)
    - f_2(3, 7)}{0.1} = 7 \]
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: \[\nabla_{FD} f(x) = \begin{bmatrix} df_1(x_1) && df_1(x_2) \\ df_2(x_1) &&
    df_2(x_2) \end{bmatrix} = \begin{bmatrix} 54.2 && 18 \\ 3 && 7 \end{bmatrix} \]\[\
    df_1(x_1) = \frac{f_1(x_1 + h, x_2) - f_1(x_1, x_2)}{h} = \frac{f_1(3 + 0.1, 7)
    - f_1(3, 7)}{0.1} = 54.2 \]\[\ df_1(x_2) = \frac{f_1(x_1, x_2 + h) - f_1(x_1,
    x_2)}{h} = \frac{f_1(3, 7 + 0.1) - f_1(3, 7)}{0.1} = 18 \]\[\ df_2(x_1) = \frac{f_2(x_1
    + h, x_2) - f_2(x_1, x_2)}{h} = \frac{f_2(3 + 0.1, 7) - f_2(3, 7)}{0.1} = 3 \]\[\
    df_2(x_2) = \frac{f_2(x_1, x_2 + h) - f_2(x_1, x_2)}{h} = \frac{f_2(3, 7 + 0.1)
    - f_2(3, 7)}{0.1} = 7 \]
- en: 'We can find the absolute truncation error by:'
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以通过以下方式找到绝对截断误差：
- en: \[\nabla f(x) = \begin{bmatrix} \frac{\partial f_1}{\partial x_1} & \frac{\partial
    f_1}{\partial x_2} \\ \frac{\partial f_2}{\partial x_1} & \frac{\partial f_2}{\partial
    x_2} \end{bmatrix} = \begin{bmatrix} 4 x_1 + 6 x_2 & 6 x_1 \\ 3 & 7 \end{bmatrix}
    \ = \begin{bmatrix} 54 & 18 \\ 3 & 7 \end{bmatrix} \]\[error = |\nabla f(x) -
    \nabla_{FD} f(x)| = \begin{bmatrix} |54.2 - 54| & | 18 - 18| \\ | 3 - 3| & |7-7|
    \end{bmatrix} \ = \begin{bmatrix} 0.2 & 0.0 \\ 0.0 & 0.0 \end{bmatrix} \ \]
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: \[\nabla f(x) = \begin{bmatrix} \frac{\partial f_1}{\partial x_1} & \frac{\partial
    f_1}{\partial x_2} \\ \frac{\partial f_2}{\partial x_1} & \frac{\partial f_2}{\partial
    x_2} \end{bmatrix} = \begin{bmatrix} 4 x_1 + 6 x_2 & 6 x_1 \\ 3 & 7 \end{bmatrix}
    \ = \begin{bmatrix} 54 & 18 \\ 3 & 7 \end{bmatrix} \]\[error = |\nabla f(x) -
    \nabla_{FD} f(x)| = \begin{bmatrix} |54.2 - 54| & | 18 - 18| \\ | 3 - 3| & |7-7|
    \end{bmatrix} \ = \begin{bmatrix} 0.2 & 0.0 \\ 0.0 & 0.0 \end{bmatrix} \ \]
- en: '*Reference text: "Scientific Computing: an introductory survey" by Michael
    Heath*'
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
  zh: '*参考文献：Michael Heath 所著的 "Scientific Computing: an introductory survey"*'
- en: Review Questions
  id: totrans-80
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 复习问题
- en: What is the general form of a Taylor series?
  id: totrans-81
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 泰勒级数的一般形式是什么？
- en: How do you use a Taylor series to approximate a function at a given point?
  id: totrans-82
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 你如何使用泰勒级数来近似给定点的函数？
- en: How can you approximate the derivative of a function using Taylor series?
  id: totrans-83
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 你如何使用泰勒级数近似函数的导数？
- en: How can you approximate the integral of a function using Taylor series?
  id: totrans-84
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 你如何使用泰勒级数近似函数的积分？
- en: Given an function and a center, can you write out the \(n\)-th degree Taylor
    polynomial?
  id: totrans-85
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 给定一个函数和一个中心点，你能写出\(n\)次度的泰勒多项式吗？
- en: For an \(n\)-th degree Taylor polynomial, what is the bound on the error of
    your approximation as a function of distance from the center?
  id: totrans-86
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 对于一个\(n\)次度的泰勒多项式，你的近似误差作为距离中心的函数的界限是多少？
- en: For simple functions, can you find the constant \(C\) in the Taylor error bound?
  id: totrans-87
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 对于简单函数，你能在泰勒误差界限中找到常数\(C\)吗？
- en: Be able to determine how many terms are required for a Taylor series approximation
    to have less than some given error.
  id: totrans-88
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 能够确定为了使泰勒级数近似误差小于某个给定值，需要多少项。
