- en: 'Random numbers are always an integral part of Numerical Methods. NumPy has
    provided several functions that makes it super easy to use random numbers, and
    this will be key during chapters like Monte Carlo. Let''s dive into what NumPy
    has to offer for random numbers:'
  id: totrans-126
  prefs: []
  type: TYPE_NORMAL
  zh: 随机数总是数值方法的一个基本组成部分。NumPy提供了几个函数，使得使用随机数变得非常简单，这在蒙特卡洛等章节中将是关键。让我们深入了解NumPy为随机数提供了什么：
