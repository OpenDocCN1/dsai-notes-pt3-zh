- en: Learning Objectives
  id: totrans-4
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 学习目标
- en: Get familiar with the Python 3 syntax
  id: totrans-5
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 熟悉 Python 3 语法
- en: Understand the difference between mutable and immutable objects
  id: totrans-6
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 理解可变对象和不可变对象之间的区别
- en: Understand the purpose of NumPy and learn about common operations with NumPy
    datatypes.
  id: totrans-7
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 理解 NumPy 的用途，并了解 NumPy 数据类型的一些常见操作。
- en: Notes
  id: totrans-8
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 注意事项
- en: Remember, the most efficient way to learn a programming language is to practice!
  id: totrans-9
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 记住，学习编程语言最有效的方法是实践！
- en: Google is a great resource for any programming language.
  id: totrans-10
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: Google 是任何编程语言的绝佳资源。
- en: Types
  id: totrans-11
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 类型
- en: Just like any other language, variables can store data of different types in
    Python, such as `int`, `float`, or `str`. We can use the `type()` function to
    find the type of an expression.
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 就像任何其他语言一样，Python 中的变量可以存储不同类型的数据，例如 `int`、`float` 或 `str`。我们可以使用 `type()` 函数来查找表达式的类型。
- en: Example
  id: totrans-13
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例
- en: '[PRE0]'
  id: totrans-14
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: What are the correct types for variables `c` and `d`?
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 变量 `c` 和 `d` 的正确类型是什么？
- en: \[\begin{flalign} & \text{A) } \text{c is a float, d is a float} \\ & \text{B)
    } \text{c is a float, d is an int} \\ & \text{C) } \text{c is an int, d is an
    int} \\ & \text{D) } \text{c is an int, d is a float} \\ \end{flalign}\] <details><summary>**Answer**</summary>
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{flalign} & \text{A) } \text{c 是浮点数，d 是浮点数} \\ & \text{B) } \text{c
    是浮点数，d 是整数} \\ & \text{C) } \text{c 是整数，d 是整数} \\ & \text{D) } \text{c 是整数，d 是浮点数}
    \\ \end{flalign}\] <details><summary>**答案**</summary>
- en: '**B.**'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: '**B.**'
- en: In Python, any operation between an int and a float will result in a float.
    Hence, c is a float. d is an int because we did a multiplication operation on
    two ints.</details>
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 在 Python 中，任何整数和浮点数之间的操作都会得到浮点数。因此，c 是浮点数。d 是整数，因为我们对两个整数进行了乘法运算。</details>
- en: Names and Values
  id: totrans-19
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 名称和值
- en: 'Consider the following example:'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 考虑以下示例：
- en: '[PRE1]'
  id: totrans-21
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: In this case, `a` and `b` are not separate entities, even though they are different
    variables. The list `[1, 2, 3]` is an object, and both variable names a and b
    are bounded to the same list.
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 在这种情况下，`a` 和 `b` 虽然是不同的变量，但它们并不是独立的实体。列表 `[1, 2, 3]` 是一个对象，变量名 a 和 b 都绑定到同一个列表上。
- en: Modifying an Object
  id: totrans-23
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 修改对象
- en: 'Now let''s consider another example:'
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: 现在让我们考虑另一个例子：
- en: '[PRE2]'
  id: totrans-25
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: '`b.append(4)` modifies the object list, such that the list is now `[1, 2, 3,
    4]`. We know that b is now `[1, 2, 3, 4]`, but what happens to the variable name
    a?'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: '`b.append(4)` 修改了对象列表，使得列表现在是 `[1, 2, 3, 4]`。我们知道 b 现在是 `[1, 2, 3, 4]`，但变量名
    a 发生了什么变化？'
- en: <details><summary>**Answer**</summary> Because a and b are bounded to the same
    list they will have the same values once the list is modified.</details>
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: <details><summary>**答案**</summary> 因为 a 和 b 绑定到同一个列表，一旦列表被修改，它们将具有相同的值。</details>
- en: Get the "id" for an object
  id: totrans-28
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 获取对象的 "id"
- en: Let's see how we can use a built-in Python function to see whether a and b point
    to the same object or not.
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们看看如何使用内置的 Python 函数来查看 a 和 b 是否指向同一个对象。
- en: '[PRE3]'
  id: totrans-30
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: Memory Management
  id: totrans-31
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 内存管理
- en: 'To review the way Python manages memory, let''s look at the following examples:'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 为了回顾 Python 管理内存的方式，让我们看看以下示例：
- en: '[PRE4]'
  id: totrans-33
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: Mutable and Immutable Objects
  id: totrans-34
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 可变和不可变对象
- en: In Python, objects are divided into **mutable** and **immutable**. Mutable objects
    can be modified after they are first created, including lists, dictionaries, NumPy
    arrays, etc. Immutable objects cannot be modified once they are created, including
    tuples, strings, floats, etc.
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: 在 Python 中，对象分为 **可变** 和 **不可变**。可变对象在创建后可以被修改，包括列表、字典、NumPy 数组等。不可变对象一旦创建后就不能被修改，包括元组、字符串、浮点数等。
- en: For example,
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，
- en: '[PRE5]'
  id: totrans-37
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: List
  id: totrans-38
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 列表
- en: 'A list is an example of a mutable object. Let''s take a look at how it behaves
    in different situations:'
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: 列表是可变对象的一个例子。让我们看看它在不同情况下是如何表现的：
- en: '[PRE6]'
  id: totrans-40
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: Example
  id: totrans-41
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例
- en: 'Which of the following code snippets result in `print(a==c) -> True`:'
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: '以下代码片段中哪个会导致 `print(a==c) -> True`:'
- en: 'A:'
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: 'A:'
- en: '[PRE7]'
  id: totrans-44
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: 'B:'
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: 'B:'
- en: '[PRE8]'
  id: totrans-46
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: 'C:'
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: 'C:'
- en: '[PRE9]'
  id: totrans-48
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: <details><summary>**Answer**</summary>
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: <details><summary>**答案**</summary>
- en: '**C**'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: '**C**'
- en: A is incorrect because `c` ends up having two "hey" elements in its list. B
    is incorrect because `a += b` adds each character of "hey" as its own element.
    Hence, C must be the correct choice.</details>
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: A 是不正确的，因为 `c` 的列表中最终有两个 "hey" 元素。B 是不正确的，因为 `a += b` 将 "hey" 的每个字符都作为其自己的元素添加。因此，C
    必须是正确的选择。</details>
- en: Objects and Naming
  id: totrans-52
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 对象和命名
- en: Advanced Naming
  id: totrans-53
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 高级命名
- en: 'Let''s make some objects and see what happens in this next snippet of code:'
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们创建一些对象，并查看在接下来的代码片段中会发生什么：
- en: '[PRE10]'
  id: totrans-55
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: Example
  id: totrans-56
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例
- en: What is the correct output for the following code snippet?
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: 以下代码片段的正确输出是什么？
- en: '[PRE11]'
  id: totrans-58
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: 'A: `computer_science, math [''electrical'', ''physics'']`'
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: 'A: `computer_science, math [''electrical'', ''physics'']`'
- en: 'B: `computer_science, math [''electrical'']`'
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: 'B: `computer_science, math [''electrical'']`'
- en: 'C: `computer_science [''electrical'', ''physics'']`'
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: 'C: `computer_science [''electrical'', ''physics'']`'
- en: 'D: `computer_science [''electrical'']`'
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: 'D: `computer_science [''electrical'']`'
- en: <details><summary>**Answer**</summary>
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: <details><summary>**答案**</summary>
- en: '**C**'
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: '**C**'
- en: 'In the above code snippet, John and Tim refer to separate objects since strings
    are immutable in Python, and so the variable John is equal to `''computer_science''`.
    Lists are mutable, so Julie and Anna are equal to the same list: `[''electrical'',
    ''physics'']`. Hence, C is the correct choice.</details>'
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
  zh: 在上面的代码片段中，由于Python中字符串是不可变的，John和Tim指的是不同的对象，因此变量John等于`'computer_science'`。列表是可变的，所以Julie和Anna等于同一个列表：`['electrical',
    'physics']`。因此，C是正确的选择。</details>
- en: Indexing
  id: totrans-66
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 索引
- en: 'Indexing is important to iterate through for loops in a variety of ways in
    Python. Given a list `a`, the formatting for indexing follows this standard: `a[i:j:k]`.
    Here, `i` is the starting index of the iteration, `j` is the stopping index (exclusive)
    of the iteration, and `k` is the step size.'
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
  zh: 索引在Python中通过多种方式遍历for循环非常重要。给定一个列表`a`，索引的格式遵循以下标准：`a[i:j:k]`。在这里，`i`是迭代的起始索引，`j`是迭代的停止索引（不包括），`k`是步长。
- en: Example
  id: totrans-68
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例
- en: '[PRE12]'
  id: totrans-69
  prefs: []
  type: TYPE_PRE
  zh: '[PRE12]'
- en: What is the output for the command line above?
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
  zh: 上面的命令行输出是什么？
- en: \[\begin{flalign} & \text{A) } [1, 3, 5, 7, 9] \\ & \text{B) } [1, 3] \\ & \text{C)
    } [3, 1] \\ & \text{D) } [9, 7] \\ & \text{E) } [9, 7, 5, 3, 1] \\ && \end{flalign}\]
    <details><summary>**Answer**</summary>
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{flalign} & \text{A) } [1, 3, 5, 7, 9] \\ & \text{B) } [1, 3] \\ & \text{C)
    } [3, 1] \\ & \text{D) } [9, 7] \\ & \text{E) } [9, 7, 5, 3, 1] \\ && \end{flalign}\]
    <details><summary>**答案**</summary>
- en: \(\bf E\)
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: \(\bf E\)
- en: The first step is to get the resulting array of a[1::2]. The start index is
    1 in a zero-indexed array, and the step size is 1 until the end of the array (since
    no stop index was given here). Hence, the resulting array is [1, 3, 5, 7, 9],
    which we'll call array b for now.
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: 第一步是获取数组a[1::2]的结果数组。在零索引数组中，起始索引是1，步长是1直到数组的末尾（因为没有给出停止索引）。因此，结果数组是[1, 3, 5,
    7, 9]，我们现在将其称为数组b。
- en: The final step is to get the resulting array of b[::-1]. There is not start
    or stop index given, but the step size is -1\. This means that we simply need
    to reverse the array b, as a negative step size means we start the iteration from
    the end of the array rather than the start. Hence, the final array will be [9,
    7, 5, 3, 1], which equals answer choice E.</details>
  id: totrans-74
  prefs: []
  type: TYPE_NORMAL
  zh: 最后一步是获取数组b[::-1]的结果数组。没有给出起始或停止索引，但步长是-1。这意味着我们只需要反转数组b，因为负步长意味着我们从数组的末尾开始迭代，而不是从开始迭代。因此，最终的数组将是[9,
    7, 5, 3, 1]，这等于答案选项E。</details>
- en: Control Flow
  id: totrans-75
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 控制流程
- en: 'Control flow includes iterating over list-like objects with for/while loops,
    using if/else blocks to perform logic for certain conditions, and using break
    and continue statements to control when you exit a for loop or move onto the next
    iteration of a loop, respectively. Let''s see a simple example of this:'
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: 控制流程包括使用for/while循环遍历类似列表的对象，使用if/else块执行特定条件的逻辑，以及使用break和continue语句来控制何时退出for循环或移动到循环的下一个迭代。让我们看看这个简单示例：
- en: '[PRE13]'
  id: totrans-77
  prefs: []
  type: TYPE_PRE
  zh: '[PRE13]'
- en: Functions
  id: totrans-78
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 函数
- en: Defining Functions
  id: totrans-79
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 定义函数
- en: 'Sometimes it''s useful to define a function. This is done by using the keyword
    "def" followed by a list of parameters. Here is a basic example of a function
    definition:'
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
  zh: 有时定义一个函数是有用的。这是通过使用关键字"def"后跟参数列表来完成的。以下是一个函数定义的基本示例：
- en: '[PRE14]'
  id: totrans-81
  prefs: []
  type: TYPE_PRE
  zh: '[PRE14]'
- en: Here is the [official documentation](https://docs.python.org/3.8/tutorial/controlflow.html#defining-functions)
    for function definition.
  id: totrans-82
  prefs: []
  type: TYPE_NORMAL
  zh: 这是关于函数定义的[官方文档](https://docs.python.org/3.8/tutorial/controlflow.html#defining-functions)。
- en: Function Scope
  id: totrans-83
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 函数作用域
- en: 'It''s important to understand the idea of scope. A variable created inside
    a function can only be used inside that function, because it has **local scope**.
    A variable created in the main body of the Python code is a global variable and
    hence has **global scope**. This variable has no restrictions and can be used/accessed
    anywhere. Again, the best way to learn this is by looking at an example:'
  id: totrans-84
  prefs: []
  type: TYPE_NORMAL
  zh: 理解作用域的概念很重要。在函数内部创建的变量只能在该函数内部使用，因为它具有**局部作用域**。在Python代码的主体中创建的变量是全局变量，因此具有**全局作用域**。这个变量没有限制，可以在任何地方使用/访问。再次强调，通过查看示例来学习这是最好的方法：
- en: '[PRE15]'
  id: totrans-85
  prefs: []
  type: TYPE_PRE
  zh: '[PRE15]'
- en: Example
  id: totrans-86
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例
- en: Which code snippet does not modify the variables?
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: 哪个代码片段不会修改变量？
- en: A
  id: totrans-88
  prefs: []
  type: TYPE_NORMAL
  zh: A
- en: '[PRE16]'
  id: totrans-89
  prefs: []
  type: TYPE_PRE
  zh: '[PRE16]'
- en: B
  id: totrans-90
  prefs: []
  type: TYPE_NORMAL
  zh: B
- en: '[PRE17]'
  id: totrans-91
  prefs: []
  type: TYPE_PRE
  zh: '[PRE17]'
- en: C
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: C
- en: '[PRE18]'
  id: totrans-93
  prefs: []
  type: TYPE_PRE
  zh: '[PRE18]'
- en: <details><summary>**Answer**</summary>
  id: totrans-94
  prefs: []
  type: TYPE_NORMAL
  zh: <details><summary>**答案**</summary>
- en: '**B**'
  id: totrans-95
  prefs: []
  type: TYPE_NORMAL
  zh: '**B**'
- en: B is the correct answer because `ints` in Python are immutable. This means that
    incrementing `a` by 1 and `b` by 2 inside the function just creates new objects
    for both a and b. These new objects will be restricted to the scope of this function,
    and as a result the variables will not be modified.
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: B是正确答案，因为在Python中`ints`是不可变的。这意味着在函数内部将`a`增加1和将`b`增加2只会为a和b创建新的对象。这些新对象将限制在函数的作用域内，因此变量不会被修改。
- en: However, lists are mutable objects, and appending values to them does not create
    new objects. The function simply updates the variables that already have global
    scope, and so these variables are modified.</details>
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，列表是可变对象，向其中添加值并不会创建新的对象。函数只是更新已经具有全局作用域的变量，因此这些变量被修改。</details>
- en: Dictionary
  id: totrans-98
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 字典
- en: 'A dictionary is an important and useful structure in Python. A dictionary is
    made up of key-value pairs, where the value is extracted using the key. You will
    be using dictionaries a lot in this class for later chapters. Here are some examples
    on how to use a dictionary:'
  id: totrans-99
  prefs: []
  type: TYPE_NORMAL
  zh: 字典是Python中重要且有用的结构。字典由键值对组成，其中值是通过键提取的。你将在本课程中大量使用字典，尤其是在后面的章节中。以下是一些使用字典的示例：
- en: '[PRE19]'
  id: totrans-100
  prefs: []
  type: TYPE_PRE
  zh: '[PRE19]'
- en: Here is the [official documentation](https://docs.python.org/3/tutorial/datastructures.html#dictionaries)
    for dictionaries and some other useful data structures.
  id: totrans-101
  prefs: []
  type: TYPE_NORMAL
  zh: 这里是[官方文档](https://docs.python.org/3/tutorial/datastructures.html#dictionaries)关于字典和一些其他有用的数据结构。
- en: Type Annotations
  id: totrans-102
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 类型注解
- en: Python is a dynamically typed language, meaning that the variable type is determined
    at runtime. As you've likely noticed, this is why we have the luxury to declare
    and initialize variables without assigning a type to the variable. This wouldn't
    be allowed in languages like C++ or Java.
  id: totrans-103
  prefs: []
  type: TYPE_NORMAL
  zh: Python是一种动态类型语言，这意味着变量的类型是在运行时确定的。正如你可能已经注意到的，这就是为什么我们有声明和初始化变量而不必为变量分配类型的奢侈。在C++或Java这样的语言中，这是不允许的。
- en: '**Type Annotations**, however, provide a way for developers to specify the
    type of a variable, function parameter, or function result. While it doesn''t
    really improve performance, it helps developers get a better understanding of
    the type of data they''re dealing with, whether that be in the form of variables
    or inputs and outputs of a function call. Here''s an example of what a type-annotated
    variable/function definition might look like:'
  id: totrans-104
  prefs: []
  type: TYPE_NORMAL
  zh: '**类型注解**，然而，为开发者提供了一种指定变量、函数参数或函数结果类型的方法。虽然它并不真正提高性能，但它有助于开发者更好地理解他们正在处理的数据类型，无论是变量还是函数调用的输入和输出。以下是一个类型注解变量/函数定义的示例：'
- en: '[PRE20]'
  id: totrans-105
  prefs: []
  type: TYPE_PRE
  zh: '[PRE20]'
- en: NumPy
  id: totrans-106
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: NumPy
- en: NumPy is a Python library used for numerical computing. Developed almost entirely
    in C and C++, it is highly performant and can easily support operations on large
    amounts of data. This section will serve as a brief intro to some common NumPy
    tools you'll be expected to use throughout the class. While this section will
    explain some of these common tools, the [NumPy documentation](https://NumPy.org/doc/)
    goes into much greater detail and is always the go-to resource whenever unsure
    how to use a specific function.
  id: totrans-107
  prefs: []
  type: TYPE_NORMAL
  zh: NumPy是一个用于数值计算的Python库。它几乎完全用C和C++开发，性能极高，可以轻松支持大量数据的操作。本节将简要介绍一些你将在整个课程中使用的常见NumPy工具。虽然本节将解释一些这些常见工具，但[NumPy文档](https://NumPy.org/doc/)提供了更详细的说明，并且始终是当你不确定如何使用特定函数时的首选资源。
- en: NumPy Arrays
  id: totrans-108
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: NumPy数组
- en: 'NumPy arrays are generally preferred over lists because you can conduct highly
    performant operations on them to accomplish any task. This is specifically important
    in a class like Numerical Methods. The following are ways you can initialize different
    types of NumPy arrays:'
  id: totrans-109
  prefs: []
  type: TYPE_NORMAL
  zh: NumPy数组通常比列表更受欢迎，因为你可以对它们进行高度性能的操作以完成任何任务。这在数值方法这样的课程中尤为重要。以下是你可以初始化不同类型NumPy数组的方法：
