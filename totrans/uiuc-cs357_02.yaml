- en: Types
  id: totrans-11
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Just like any other language, variables can store data of different types in
    Python, such as `int`, `float`, or `str`. We can use the `type()` function to
    find the type of an expression.
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
- en: Example
  id: totrans-13
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '[PRE0]'
  id: totrans-14
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: What are the correct types for variables `c` and `d`?
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{flalign} & \text{A) } \text{c is a float, d is a float} \\ & \text{B)
    } \text{c is a float, d is an int} \\ & \text{C) } \text{c is an int, d is an
    int} \\ & \text{D) } \text{c is an int, d is a float} \\ \end{flalign}\] <details><summary>**Answer**</summary>
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
- en: '**B.**'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
- en: In Python, any operation between an int and a float will result in a float.
    Hence, c is a float. d is an int because we did a multiplication operation on
    two ints.</details>
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
- en: Names and Values
  id: totrans-19
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'Consider the following example:'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  id: totrans-21
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: In this case, `a` and `b` are not separate entities, even though they are different
    variables. The list `[1, 2, 3]` is an object, and both variable names a and b
    are bounded to the same list.
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
- en: Modifying an Object
  id: totrans-23
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Now let''s consider another example:'
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE2]'
  id: totrans-25
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: '`b.append(4)` modifies the object list, such that the list is now `[1, 2, 3,
    4]`. We know that b is now `[1, 2, 3, 4]`, but what happens to the variable name
    a?'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
- en: <details><summary>**Answer**</summary> Because a and b are bounded to the same
    list they will have the same values once the list is modified.</details>
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
- en: Get the "id" for an object
  id: totrans-28
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Let's see how we can use a built-in Python function to see whether a and b point
    to the same object or not.
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  id: totrans-30
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: Memory Management
  id: totrans-31
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'To review the way Python manages memory, let''s look at the following examples:'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE4]'
  id: totrans-33
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: Mutable and Immutable Objects
  id: totrans-34
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: In Python, objects are divided into **mutable** and **immutable**. Mutable objects
    can be modified after they are first created, including lists, dictionaries, NumPy
    arrays, etc. Immutable objects cannot be modified once they are created, including
    tuples, strings, floats, etc.
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
- en: For example,
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE5]'
  id: totrans-37
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: List
  id: totrans-38
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: 'A list is an example of a mutable object. Let''s take a look at how it behaves
    in different situations:'
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE6]'
  id: totrans-40
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: Example
  id: totrans-41
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Which of the following code snippets result in `print(a==c) -> True`:'
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
- en: 'A:'
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE7]'
  id: totrans-44
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: 'B:'
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE8]'
  id: totrans-46
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: 'C:'
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE9]'
  id: totrans-48
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: <details><summary>**Answer**</summary>
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
- en: '**C**'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
- en: A is incorrect because `c` ends up having two "hey" elements in its list. B
    is incorrect because `a += b` adds each character of "hey" as its own element.
    Hence, C must be the correct choice.</details>
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
- en: Objects and Naming
  id: totrans-52
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Advanced Naming
  id: totrans-53
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Let''s make some objects and see what happens in this next snippet of code:'
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]'
  id: totrans-55
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: Example
  id: totrans-56
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: What is the correct output for the following code snippet?
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]'
  id: totrans-58
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: 'A: `computer_science, math [''electrical'', ''physics'']`'
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
- en: 'B: `computer_science, math [''electrical'']`'
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
- en: 'C: `computer_science [''electrical'', ''physics'']`'
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
- en: 'D: `computer_science [''electrical'']`'
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
- en: <details><summary>**Answer**</summary>
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
- en: '**C**'
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
- en: 'In the above code snippet, John and Tim refer to separate objects since strings
    are immutable in Python, and so the variable John is equal to `''computer_science''`.
    Lists are mutable, so Julie and Anna are equal to the same list: `[''electrical'',
    ''physics'']`. Hence, C is the correct choice.</details>'
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
- en: Indexing
  id: totrans-66
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'Indexing is important to iterate through for loops in a variety of ways in
    Python. Given a list `a`, the formatting for indexing follows this standard: `a[i:j:k]`.
    Here, `i` is the starting index of the iteration, `j` is the stopping index (exclusive)
    of the iteration, and `k` is the step size.'
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
- en: Example
  id: totrans-68
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '[PRE12]'
  id: totrans-69
  prefs: []
  type: TYPE_PRE
  zh: '[PRE12]'
- en: What is the output for the command line above?
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{flalign} & \text{A) } [1, 3, 5, 7, 9] \\ & \text{B) } [1, 3] \\ & \text{C)
    } [3, 1] \\ & \text{D) } [9, 7] \\ & \text{E) } [9, 7, 5, 3, 1] \\ && \end{flalign}\]
    <details><summary>**Answer**</summary>
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
- en: \(\bf E\)
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
- en: The first step is to get the resulting array of a[1::2]. The start index is
    1 in a zero-indexed array, and the step size is 1 until the end of the array (since
    no stop index was given here). Hence, the resulting array is [1, 3, 5, 7, 9],
    which we'll call array b for now.
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
- en: The final step is to get the resulting array of b[::-1]. There is not start
    or stop index given, but the step size is -1\. This means that we simply need
    to reverse the array b, as a negative step size means we start the iteration from
    the end of the array rather than the start. Hence, the final array will be [9,
    7, 5, 3, 1], which equals answer choice E.</details>
  id: totrans-74
  prefs: []
  type: TYPE_NORMAL
- en: Control Flow
  id: totrans-75
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'Control flow includes iterating over list-like objects with for/while loops,
    using if/else blocks to perform logic for certain conditions, and using break
    and continue statements to control when you exit a for loop or move onto the next
    iteration of a loop, respectively. Let''s see a simple example of this:'
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE13]'
  id: totrans-77
  prefs: []
  type: TYPE_PRE
  zh: '[PRE13]'
- en: Functions
  id: totrans-78
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Defining Functions
  id: totrans-79
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Sometimes it''s useful to define a function. This is done by using the keyword
    "def" followed by a list of parameters. Here is a basic example of a function
    definition:'
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE14]'
  id: totrans-81
  prefs: []
  type: TYPE_PRE
  zh: '[PRE14]'
- en: Here is the [official documentation](https://docs.python.org/3.8/tutorial/controlflow.html#defining-functions)
    for function definition.
  id: totrans-82
  prefs: []
  type: TYPE_NORMAL
- en: Function Scope
  id: totrans-83
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'It''s important to understand the idea of scope. A variable created inside
    a function can only be used inside that function, because it has **local scope**.
    A variable created in the main body of the Python code is a global variable and
    hence has **global scope**. This variable has no restrictions and can be used/accessed
    anywhere. Again, the best way to learn this is by looking at an example:'
  id: totrans-84
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE15]'
  id: totrans-85
  prefs: []
  type: TYPE_PRE
  zh: '[PRE15]'
- en: Example
  id: totrans-86
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Which code snippet does not modify the variables?
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
- en: A
  id: totrans-88
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE16]'
  id: totrans-89
  prefs: []
  type: TYPE_PRE
  zh: '[PRE16]'
- en: B
  id: totrans-90
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE17]'
  id: totrans-91
  prefs: []
  type: TYPE_PRE
  zh: '[PRE17]'
- en: C
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE18]'
  id: totrans-93
  prefs: []
  type: TYPE_PRE
  zh: '[PRE18]'
- en: <details><summary>**Answer**</summary>
  id: totrans-94
  prefs: []
  type: TYPE_NORMAL
- en: '**B**'
  id: totrans-95
  prefs: []
  type: TYPE_NORMAL
- en: B is the correct answer because `ints` in Python are immutable. This means that
    incrementing `a` by 1 and `b` by 2 inside the function just creates new objects
    for both a and b. These new objects will be restricted to the scope of this function,
    and as a result the variables will not be modified.
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
- en: However, lists are mutable objects, and appending values to them does not create
    new objects. The function simply updates the variables that already have global
    scope, and so these variables are modified.</details>
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
- en: Dictionary
  id: totrans-98
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'A dictionary is an important and useful structure in Python. A dictionary is
    made up of key-value pairs, where the value is extracted using the key. You will
    be using dictionaries a lot in this class for later chapters. Here are some examples
    on how to use a dictionary:'
  id: totrans-99
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE19]'
  id: totrans-100
  prefs: []
  type: TYPE_PRE
  zh: '[PRE19]'
- en: Here is the [official documentation](https://docs.python.org/3/tutorial/datastructures.html#dictionaries)
    for dictionaries and some other useful data structures.
  id: totrans-101
  prefs: []
  type: TYPE_NORMAL
- en: Type Annotations
  id: totrans-102
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Python is a dynamically typed language, meaning that the variable type is determined
    at runtime. As you've likely noticed, this is why we have the luxury to declare
    and initialize variables without assigning a type to the variable. This wouldn't
    be allowed in languages like C++ or Java.
  id: totrans-103
  prefs: []
  type: TYPE_NORMAL
- en: '**Type Annotations**, however, provide a way for developers to specify the
    type of a variable, function parameter, or function result. While it doesn''t
    really improve performance, it helps developers get a better understanding of
    the type of data they''re dealing with, whether that be in the form of variables
    or inputs and outputs of a function call. Here''s an example of what a type-annotated
    variable/function definition might look like:'
  id: totrans-104
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE20]'
  id: totrans-105
  prefs: []
  type: TYPE_PRE
  zh: '[PRE20]'
- en: NumPy
  id: totrans-106
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: NumPy is a Python library used for numerical computing. Developed almost entirely
    in C and C++, it is highly performant and can easily support operations on large
    amounts of data. This section will serve as a brief intro to some common NumPy
    tools you'll be expected to use throughout the class. While this section will
    explain some of these common tools, the [NumPy documentation](https://NumPy.org/doc/)
    goes into much greater detail and is always the go-to resource whenever unsure
    how to use a specific function.
  id: totrans-107
  prefs: []
  type: TYPE_NORMAL
- en: NumPy Arrays
  id: totrans-108
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'NumPy arrays are generally preferred over lists because you can conduct highly
    performant operations on them to accomplish any task. This is specifically important
    in a class like Numerical Methods. The following are ways you can initialize different
    types of NumPy arrays:'
  id: totrans-109
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE21]'
  id: totrans-110
  prefs: []
  type: TYPE_PRE
  zh: '[PRE21]'
- en: 'We can find out additional information about the NumPy array and do more with
    them with the following functions:'
  id: totrans-111
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE22]'
  id: totrans-112
  prefs: []
  type: TYPE_PRE
  zh: '[PRE22]'
- en: Indexing and Slicing
  id: totrans-113
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'We can use indexing and slicing on NumPy arrays in order to extract specific
    information from arrays/matrices. This will be a constant part of the class, so
    it''s better to get used to indexing/slicing now! Note that this section is similar
    to the above indexing section. A NumPy array a will follow the standard: `a[i:j:k]`,
    where `i` is the starting index of the iteration, `j` is the stopping index (exclusive)
    of the iteration, and `k` is the step size.'
  id: totrans-114
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE23]'
  id: totrans-115
  prefs: []
  type: TYPE_PRE
  zh: '[PRE23]'
- en: Array Manipulation
  id: totrans-116
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Array manipulation is particularly useful when certain formulas in later chapters
    require building matrices or perform certain operations on matrices (for instance,
    transposing a matrix). Below are some examples:'
  id: totrans-117
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE24]'
  id: totrans-118
  prefs: []
  type: TYPE_PRE
  zh: '[PRE24]'
- en: Array Mathematics
  id: totrans-119
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'NumPy provides several math functions that can be performed on each element
    in the array. Rather than iterating through each element, these functions will
    do the operation over the entire array and are hence extremely convenient. Which
    math functions might be relevant in Numerical Methods? Let''s take a look:'
  id: totrans-120
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE25]'
  id: totrans-121
  prefs: []
  type: TYPE_PRE
  zh: '[PRE25]'
- en: Linear Algebra
  id: totrans-122
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'This class will often ask you to perform linear algebra operations on vectors/matrices.
    This is when the `numpy.linalg` library and the following functions it provides
    will be useful:'
  id: totrans-123
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE26]'
  id: totrans-124
  prefs: []
  type: TYPE_PRE
  zh: '[PRE26]'
- en: Random Numbers
  id: totrans-125
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Random numbers are always an integral part of Numerical Methods. NumPy has
    provided several functions that makes it super easy to use random numbers, and
    this will be key during chapters like Monte Carlo. Let''s dive into what NumPy
    has to offer for random numbers:'
  id: totrans-126
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE27]'
  id: totrans-127
  prefs: []
  type: TYPE_PRE
  zh: '[PRE27]'
- en: Python also has a random module that is separate from NumPy but can be used
    to do a lot of similar operations as the ones introduced above.
  id: totrans-128
  prefs: []
  type: TYPE_NORMAL
- en: Broadcasting
  id: totrans-129
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Broadcasting is a powerful technique in Python that allows us to perform arithmetic
    between two differently-shaped arrays.
  id: totrans-130
  prefs: []
  type: TYPE_NORMAL
- en: Say we have a smaller array **A** (with a shape of 1 x 5) and a larger array
    **B** (with a shape of 4 x 5), and we want to add these arrays together.
  id: totrans-131
  prefs: []
  type: TYPE_NORMAL
- en: Without broadcasting, only the first row in **B** would be modified by **A**.
    With broadcasting, however, **A**'s values are added to each row of **B**. Hence,
    **A** is broadcasted onto **B**. The dimension sizes need to cooperate as they
    did in this example, or we'll receive some error when performing this arithmetic.
  id: totrans-132
  prefs: []
  type: TYPE_NORMAL
- en: 'Here is an example illustrating the concept:'
  id: totrans-133
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE28]'
  id: totrans-134
  prefs: []
  type: TYPE_PRE
  zh: '[PRE28]'
- en: This result demonstrates how the values from array A were added to each row
    of array B, thanks to broadcasting. The dimension of A (1 x 5) was compatible
    with B (4 x 5), allowing A to be "stretched" across B to perform the element-wise
    addition. ​​
  id: totrans-135
  prefs: []
  type: TYPE_NORMAL
