  zh: Python还有一个与NumPy分开的随机模块，但可以用来执行与上面介绍的操作非常相似的操作。
- en: Broadcasting
  id: totrans-129
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 广播
- en: Broadcasting is a powerful technique in Python that allows us to perform arithmetic
    between two differently-shaped arrays.
  id: totrans-130
  prefs: []
  type: TYPE_NORMAL
  zh: 广播是Python中的一个强大技术，它允许我们在形状不同的两个数组之间执行算术运算。
- en: Say we have a smaller array **A** (with a shape of 1 x 5) and a larger array
    **B** (with a shape of 4 x 5), and we want to add these arrays together.
  id: totrans-131
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们有一个较小的数组**A**（形状为1 x 5）和一个较大的数组**B**（形状为4 x 5），我们想要将这些数组相加。
- en: Without broadcasting, only the first row in **B** would be modified by **A**.
    With broadcasting, however, **A**'s values are added to each row of **B**. Hence,
    **A** is broadcasted onto **B**. The dimension sizes need to cooperate as they
    did in this example, or we'll receive some error when performing this arithmetic.
  id: totrans-132
  prefs: []
  type: TYPE_NORMAL
  zh: 没有广播，只有B的第一行会被A修改。然而，有了广播，A的值会被添加到B的每一行。因此，A被广播到B上。维度大小需要像这个例子中那样协作，否则在执行这个算术运算时我们会收到一些错误。
- en: 'Here is an example illustrating the concept:'
  id: totrans-133
  prefs: []
  type: TYPE_NORMAL
  zh: 这里有一个示例来说明这个概念：
- en: '[PRE28]'
  id: totrans-134
  prefs: []
  type: TYPE_PRE
  zh: '[PRE28]'
- en: This result demonstrates how the values from array A were added to each row
    of array B, thanks to broadcasting. The dimension of A (1 x 5) was compatible
    with B (4 x 5), allowing A to be "stretched" across B to perform the element-wise
    addition. ​​
  id: totrans-135
  prefs: []
  type: TYPE_NORMAL
  zh: 这个结果展示了如何将数组A的值添加到数组B的每一行，这得益于广播。A的维度（1 x 5）与B（4 x 5）兼容，使得A能够“拉伸”到B上以执行逐元素加法。
    ​​
