- en: Chapter 21 Reshaping data
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook/reshaping-data.html](https://rafalab.dfci.harvard.edu/dsbook/reshaping-data.html)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: As we have seen through the book, having data in *tidy* format is what makes
    the tidyverse flow. After the first step in the data analysis process, importing
    data, a common next step is to reshape the data into a form that facilitates the
    rest of the analysis. The **tidyr** package includes several functions that are
    useful for tidying data.
  prefs: []
  type: TYPE_NORMAL
- en: We will use the fertility wide format dataset described in Section [4.1](tidyverse.html#tidy-data)
    as an example in this section.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: 21.1 `pivot_longer`
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: One of the most used functions in the **tidyr** package is `pivot_longer`, which
    is useful for converting wide data into tidy data.
  prefs: []
  type: TYPE_NORMAL
- en: As with most tidyverse functions, the `pivot_longer` function’s first argument
    is the data frame that will be converted. Here we want to reshape the `wide_data`
    dataset so that each row represents a fertility observation, which implies we
    need three columns to store the year, country, and the observed value. In its
    current form, data from different years are in different columns with the year
    values stored in the column names. Through the `names_to` and `values_to` argument
    we will tell `pivot_longer` the column names we want to assign to the columns
    containing the current column names and observations, respectively. The default
    names are `name` and `value`, which are often usable choices. In this case a better
    choice for these two arguments would be `year` and `fertility`. Note that nowhere
    in the data file does it tell us this is fertility data. Instead, we deciphered
    this from the file name. Through `cols`,the second argument we specify the columns
    containing observed values; these are the columns that will be *pivoted*. The
    default is to pivot all columns so, in most cases, we have to specify the columns.
    In our example we want columns `1960`, `1961` up to `2015`.
  prefs: []
  type: TYPE_NORMAL
- en: 'The code to pivot the fertility data therefore looks like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: 'We can also use the pipe like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: 'We can see that the data have been converted to tidy format with columns `year`
    and `fertility`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: 'and that each year resulted in two rows since we have two countries and this
    column was not pivoted. A somewhat quicker way to write this code is to specify
    which column will **not** include in the pivot, rather than all the columns that
    will be pivoted:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE4]'
  prefs: []
  type: TYPE_PRE
- en: The `new_tidy_data` object looks like the original `tidy_data` we defined this
    way
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE5]'
  prefs: []
  type: TYPE_PRE
- en: 'with just one minor difference. Can you spot it? Look at the data type of the
    year column:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE6]'
  prefs: []
  type: TYPE_PRE
- en: 'The `pivot_longer` function assumes that column names are characters. So we
    need a bit more wrangling before we are ready to make a plot. We need to convert
    the year column to be numbers:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE7]'
  prefs: []
  type: TYPE_PRE
- en: Note that we could have also used the `mutate` and `as.numeric`.
  prefs: []
  type: TYPE_NORMAL
- en: 'Now that the data is tidy, we can use this relatively simple ggplot code:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE8]'
  prefs: []
  type: TYPE_PRE
- en: 21.2 `pivot_wider`
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: As we will see in later examples, it is sometimes useful for data wrangling
    purposes to convert tidy data into wide data. We often use this as an intermediate
    step in tidying up data. The `pivot_wider` function is basically the inverse of
    `pivot_longer`. The first argument is for the data, but since we are using the
    pipe, we don’t show it. The `names_from` argument tells `pivot_wider` which variable
    will be used as the column names. The `values_from` argument specifies which variable
    to use to fill out the cells.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE9]'
  prefs: []
  type: TYPE_PRE
- en: Similar to `pivot_wider`, `names_from` and `values_from` default to `name` and
    `value`.
  prefs: []
  type: TYPE_NORMAL
- en: 21.3 `separate`
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'The data wrangling shown above was simple compared to what is usually required.
    In our example spreadsheet files, we include an illustration that is slightly
    more complicated. It contains two variables: life expectancy and fertility. However,
    the way it is stored is not tidy and, as we will explain, not optimal.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]'
  prefs: []
  type: TYPE_PRE
- en: First, note that the data is in wide format. Second, notice that this table
    includes values for two variables, fertility and life expectancy, with the column
    name encoding which column represents which variable. Encoding information in
    the column names is not recommended but, unfortunately, it is quite common. We
    will put our wrangling skills to work to extract this information and store it
    in a tidy fashion.
  prefs: []
  type: TYPE_NORMAL
- en: 'We can start the data wrangling with the `pivot_longer` function, but we should
    no longer use the column name `year` for the new column since it also contains
    the variable type. We will call it `name`, the default, for now:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]'
  prefs: []
  type: TYPE_PRE
- en: 'The result is not exactly what we refer to as tidy since each observation is
    associated with two, not one, rows. We want to have the values from the two variables,
    fertility and life expectancy, in two separate columns. The first challenge to
    achieve this is to separate the `name` column into the year and the variable type.
    Notice that the entries in this column separate the year from the variable name
    with an underscore:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE12]'
  prefs: []
  type: TYPE_PRE
- en: 'Encoding multiple variables in a column name is such a common problem that
    the **readr** package includes a function to separate these columns into two or
    more. Apart from the data, the `separate` function takes three arguments: the
    name of the column to be separated, the names to be used for the new columns,
    and the character that separates the variables. So, a first attempt at this is:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE13]'
  prefs: []
  type: TYPE_PRE
- en: 'Because `_` is the default separator assumed by `separate`, we do not have
    to include it in the code:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE14]'
  prefs: []
  type: TYPE_PRE
- en: 'The function does separate the values, but we run into a new problem. We receive
    the warning `Too many values at 112 locations:` and that the `life_expectancy`
    variable is truncated to `life`. This is because the `_` is used to separate `life`
    and `expectancy`, not just year and variable name! We could add a third column
    to catch this and let the `separate` function know which column to *fill in* with
    missing values, `NA`, when there is no third value. Here we tell it to fill the
    column on the right:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE15]'
  prefs: []
  type: TYPE_PRE
- en: 'However, if we read the `separate` help file, we find that a better approach
    is to merge the last two variables when there is an extra separation:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE16]'
  prefs: []
  type: TYPE_PRE
- en: 'This achieves the separation we wanted. However, we are not done yet. We need
    to create a column for each variable. As we learned, the `pivot_wider` function
    can do this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE17]'
  prefs: []
  type: TYPE_PRE
- en: 'The data is now in tidy format with one row for each observation with three
    variables: year, fertility, and life expectancy.'
  prefs: []
  type: TYPE_NORMAL
- en: 21.4 `unite`
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'It is sometimes useful to do the inverse of `separate`, unite two columns into
    one. To demonstrate how to use `unite`, we show code that, although *not* the
    optimal approach, serves as an illustration. Suppose that we did not know about
    `extra` and used this command to separate:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE18]'
  prefs: []
  type: TYPE_PRE
- en: 'We can achieve the same final result by uniting the second and third columns,
    then pivoting the columns and renaming `fertility_NA` to `fertility`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE19]'
  prefs: []
  type: TYPE_PRE
- en: 21.5 Exercises
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '1\. Run the following command to define the `co2_wide` object:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE20]'
  prefs: []
  type: TYPE_PRE
- en: Use the `pivot_longer` function to wrangle this into a tidy dataset. Call the
    column with the CO2 measurements `co2` and call the month column `month`. Call
    the resulting object `co2_tidy`.
  prefs: []
  type: TYPE_NORMAL
- en: '2\. Plot CO2 versus month with a different curve for each year using this code:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE21]'
  prefs: []
  type: TYPE_PRE
- en: 'If the expected plot is not made, it is probably because `co2_tidy$month` is
    not numeric:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE22]'
  prefs: []
  type: TYPE_PRE
- en: Rewrite your code to make sure the month column is numeric. Then make the plot.
  prefs: []
  type: TYPE_NORMAL
- en: 3\. What do we learn from this plot?
  prefs: []
  type: TYPE_NORMAL
- en: CO2 measures increase monotonically from 1959 to 1997.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: CO2 measures are higher in the summer and the yearly average increased from
    1959 to 1997.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: CO2 measures appear constant and random variability explains the differences.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: CO2 measures do not have a seasonal trend.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '4\. Now load the `admissions` data set, which contains admission information
    for men and women across six majors and keep only the admitted percentage column:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE23]'
  prefs: []
  type: TYPE_PRE
- en: 'If we think of an observation as a major, and that each observation has two
    variables (men admitted percentage and women admitted percentage) then this is
    not tidy. Use the `pivot_wider` function to wrangle into tidy shape: one row for
    each major.'
  prefs: []
  type: TYPE_NORMAL
- en: '5\. Now we will try a more advanced wrangling challenge. We want to wrangle
    the admissions data so that for each major we have 4 observations: `admitted_men`,
    `admitted_women`, `applicants_men` and `applicants_women`. The *trick* we perform
    here is actually quite common: first use `pivot_longer` to generate an intermediate
    data frame and then `pivot_wider` to obtain the tidy data we want. We will go
    step by step in this and the next two exercises.'
  prefs: []
  type: TYPE_NORMAL
- en: Use the `pivot_longer` function to create a `tmp` data.frame with a column containing
    the type of observation `admitted` or `applicants`. Call the new columns `name`
    and `value`.
  prefs: []
  type: TYPE_NORMAL
- en: '6\. Now you have an object `tmp` with columns `major`, `gender`, `name` and
    `value`. Note that if you combine the `name` and `gender`, we get the column names
    we want: `admitted_men`, `admitted_women`, `applicants_men` and `applicants_women`.
    Use the function `unite` to create a new column called `column_name`.'
  prefs: []
  type: TYPE_NORMAL
- en: 7\. Now use the `pivot_wider` function to generate the tidy data with four variables
    for each major.
  prefs: []
  type: TYPE_NORMAL
- en: 8\. Now use the pipe to write a line of code that turns `admissions` to the
    table produced in the previous exercise.
  prefs: []
  type: TYPE_NORMAL
