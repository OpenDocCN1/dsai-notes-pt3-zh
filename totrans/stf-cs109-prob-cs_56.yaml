- en: Bayesian Networks
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 贝叶斯网络
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part3/bayesian_networks/](https://chrispiech.github.io/probabilityForComputerScientists/en/part3/bayesian_networks/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part3/bayesian_networks/](https://chrispiech.github.io/probabilityForComputerScientists/en/part3/bayesian_networks/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: At this point in the reader we have developed tools for analytically solving
    for probabilities. We can calculate the likelihood of random variables taking
    on values, even if they are interacting with other random variables (which we
    have called multi-variate models, or we say the random variables are jointly distributed).
    We have also started to study samples and sampling.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 在这个阶段，我们已经为分析求解概率开发了工具。我们可以计算随机变量取特定值的可能性，即使它们与其他随机变量相互作用（我们称之为多元模型，或者说随机变量是联合分布的）。我们还开始了对样本和抽样的研究。
- en: 'Consider the WebMD Symptom Checker. WebMD has built a probabilistic model with
    random variables which roughly fall under three categories: symptoms, risk factors
    and diseases. For any combination of observed symptoms and risk factors, they
    can calculate the probability of any disease. For example, they can calculate
    the probability that I have influenza given that I am a 21-year-old female who
    has a fever and who is tired: $P(I = 1 | A = 21, G = 1, T = 1, F = 1)$. Or they
    could calculate the probability that I have a cold given that I am a 30-year-old
    with a runny nose: $P(C = 1 | A = 30, R = 1)$. At first blush this might not seem
    difficult. But as we dig deeper we will realize just how hard it is. There are
    two challenges: (1) Modelling: sufficiently specifying the probabilistic model
    and (2) Inference: calculating any desired probability.'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 以WebMD症状检查器为例。WebMD构建了一个概率模型，其中随机变量大致分为三类：症状、风险因素和疾病。对于任何观察到的症状和风险因素的组合，他们可以计算出任何疾病的概率。例如，他们可以计算我作为一个21岁的发烧且疲倦的女性患流感的概率：$P(I
    = 1 | A = 21, G = 1, T = 1, F = 1)$。或者他们可以计算我作为一个30岁流鼻涕的人患感冒的概率：$P(C = 1 | A =
    30, R = 1)$。乍一看，这可能并不困难。但随着我们深入挖掘，我们会意识到这有多么困难。有两个挑战：(1) 模型：充分指定概率模型；(2) 推理：计算任何所需的概率。
- en: Bayesian Networks
  id: totrans-5
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 贝叶斯网络
- en: 'Before we jump into how to solve probability (aka inference) questions, let''s
    take a moment to go over how an expert doctor could specify the relationship between
    so many random variables. Ideally we could have our expert sit down and specify
    the entire "joint distribution" (see the first lecture on multi-variable models).
    She could do so either by writing a single equation that relates all the variables
    (which is as impossible as it sounds), or she could come up with a joint distribution
    table where she specifies the probability of any possible combination of assignments
    to variables. It turns out that is not feasible either. Why? Imagine there are
    $N = 100$ binary random variables in our WebMD model. Our expert doctor would
    have to specify a probability for each of the $2^N > 10^{30}$ combinations of
    assignments to those variables, which is approaching the number of atoms in the
    universe. Thankfully, there is a better way. We can simplify our task if we know
    the "generative" process that creates a joint assignment. Based on the generative
    process we can make a data structure known as a **Bayesian Network**. Here are
    two networks of random variables for diseases:'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 在我们深入探讨如何解决概率（即推理）问题之前，让我们花一点时间回顾一下专家医生如何指定这么多随机变量之间的关系。理想情况下，我们可以让专家坐下来并指定整个“联合分布”（参见关于多元模型的第一讲）。她可以通过写一个包含所有变量的单个方程来实现（这听起来就像是不可能的），或者她可以创建一个联合分布表，其中指定任何可能的变量赋值组合的概率。但事实证明这也不可行。为什么？想象一下，在我们的WebMD模型中有$N
    = 100$个二元随机变量。我们的专家医生将不得不为这些变量的$2^N > 10^{30}$种赋值组合中的每一种指定一个概率，这几乎接近于宇宙中的原子数量。幸运的是，有更好的方法。如果我们知道创建联合赋值的“生成”过程，我们可以简化我们的任务。基于生成过程，我们可以创建一个称为**贝叶斯网络**的数据结构。以下是两个关于疾病的随机变量网络：
- en: '![](../Images/18bb95373eb44ede204f0830e324cbb6.png)'
  id: totrans-7
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/18bb95373eb44ede204f0830e324cbb6.png)'
- en: For diseases the flow of influence is directed. The states of "demographic"
    random variables influence whether someone has particular "conditions", which
    influence whether someone shows particular "symptoms". On the right is a simple
    model with only four random variables. Though this is a less interesting model
    it is easier to understand when first learning Bayesian Networks. Being in university
    (binary) influences whether or not someone has influenza (binary). Having influenza
    influences whether or not someone has a fever (binary) and the state of university
    and influenza influences whether or not someone feels tired (also binary).
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 对于疾病，影响流是定向的。人口统计随机变量的状态影响某人是否有特定的“条件”，这些条件又影响某人是否表现出特定的“症状”。在右侧是一个只有四个随机变量的简单模型。虽然这是一个不太有趣的模型，但在学习贝叶斯网络时更容易理解。是否在大学（二元）影响某人是否患有流感（二元）。是否患有流感影响某人是否发烧（二元），而大学和流感的状态影响某人是否感到疲倦（也是二元）。
- en: 'In a Bayesian Network an arrow from random variable $X$ to random variable
    $Y$ articulates our assumption that $X$ directly influences the likelihood of
    $Y$. We say that $X$ is a *parent* of $Y$. To fully define the Bayesian network
    we must provide a way to compute the probability of each random variable ($X_i$)
    conditioned on knowing the value of all their parents: $P(X_i = k | \text{Parents
    of }X_i \text{ take on specified values})$. Here is a concrete example of what
    needs to be defined for the simple disease model. Recall that each of the random
    variables is binary: \begin{align*} & P(\text{Uni} = 1) = 0.8 \\ & P(\text{Influenza}
    = 1 | \text{Uni} = 1) = 0.2 && P(\text{Fever} = 1 | \text{Influenza} = 1) = 0.9
    \\ & P(\text{Influenza} = 1 | \text{Uni} = 0) = 0.1 && P(\text{Fever} = 1 | \text{Influenza}
    = 0) = 0.05 \\ & P(\text{Tired} = 1 | \text{Uni} = 0, \text{Influenza} = 0) =
    0.1 && P(\text{Tired} = 1 | \text{Uni} = 0, \text{Influenza} = 1) = 0.9 \\ & P(\text{Tired}
    = 1 | \text{Uni} = 1, \text{Influenza} = 0) = 0.8 && P(\text{Tired} = 1 | \text{Uni}
    = 1, \text{Influenza} = 1) = 1.0 \end{align*}'
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 在贝叶斯网络中，从随机变量 $X$ 到随机变量 $Y$ 的箭头表达了我们的假设，即 $X$ 直接影响 $Y$ 的可能性。我们说 $X$ 是 $Y$ 的**父节点**。为了完全定义贝叶斯网络，我们必须提供一种计算每个随机变量（$X_i$）在知道所有父节点取值的情况下概率的方法：$P(X_i
    = k | \text{Parents of }X_i \text{ take on specified values})$。以下是一个简单疾病模型的定义示例。回想一下，每个随机变量都是二元的：\begin{align*}
    & P(\text{Uni} = 1) = 0.8 \\ & P(\text{Influenza} = 1 | \text{Uni} = 1) = 0.2
    && P(\text{Fever} = 1 | \text{Influenza} = 1) = 0.9 \\ & P(\text{Influenza} =
    1 | \text{Uni} = 0) = 0.1 && P(\text{Fever} = 1 | \text{Influenza} = 0) = 0.05
    \\ & P(\text{Tired} = 1 | \text{Uni} = 0, \text{Influenza} = 0) = 0.1 && P(\text{Tired}
    = 1 | \text{Uni} = 0, \text{Influenza} = 1) = 0.9 \\ & P(\text{Tired} = 1 | \text{Uni}
    = 1, \text{Influenza} = 0) = 0.8 && P(\text{Tired} = 1 | \text{Uni} = 1, \text{Influenza}
    = 1) = 1.0 \end{align*}
- en: 'Let''s put this in programming terms. All that we need to do in order to code
    up a Bayesian network is to define a function: `getProbXi(i, k, parents)` which
    returns the probability that $X_i$ (the random var with index `i`) takes on the
    value `k` given a value for each of the parents of $X_i$ encoded by the list `parents`:
    $P(X_i = x_i | \text{Values of parents of }X_i)$'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们用编程术语来解释这一点。为了编码贝叶斯网络，我们所需做的所有事情就是定义一个函数：`getProbXi(i, k, parents)`，该函数返回
    $X_i$（索引为 `i` 的随机变量）在给定 $X_i$ 的每个父节点值的情况下取值 `k` 的概率：$P(X_i = x_i | \text{Values
    of parents of }X_i)$
- en: '***Deeper understanding***: The reason that a Bayes Net is so useful is that
    the "joint" probability can be expressed in exponentially less space as the product
    of the probabilities of each random variable conditioned on its parents! Without
    loss of generality, let $X_i$ refer to the $i$th random variable (such that if
    $X_i$ is a parent of $X_j$ then $i < j$): \begin{align*} P&(\text{Joint}) = P(X_1
    = x_1, \dots, X_n = x_n) = \prod_i P(X_i = x_i | \text{Values of parents of }X_i
    ) \end{align*} What assumptions are implicit in a Bayes Net? Using the chain rule
    we can decompose the **exact** joint probability for $n$ random variables. To
    make the following math easier to digest I am going to use $x_i$ as shorthand
    for the event that $X_i = x_i$: \begin{align*} P(x_1, \dots, x_n) &= \prod_i P(x_i
    | x_{i-1}, \dots, x_1)\\ \end{align*} By looking at the difference in the two
    equations, we can see that a Bayes Net is assuming that $$P(x_i | x_{i-1}, \dots,
    x_1) = P(x_i | \text{Values of parents of }X_i)$$ This is a conditional independence
    statement. It is saying that once you know the value of the parents of a variable
    in your network, $X_i$, any further information about non-descendents will not
    change your belief in $X_i$. Formally we say that $X_i$ is conditionally independent
    of its non-descendents, given its parents. What is a non-descendent again? In
    a graph, a descendent of $X_i$ is anything which is in the subtree that starts
    at $X_i$. Everything else is a non-descendent. Non-descendents include the "ancestor"
    nodes of $X_i$ as well as nodes which are totally unconnected to $X_i$. When designing
    Bayes Nets you don''t have to think about this assumption directly. It turns out
    to be a naturally good assumption if the arrows between your nodes follow a causal
    path.'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: '**深入理解**：贝叶斯网络之所以如此有用，是因为“联合”概率可以以指数级减少空间来表示，即每个随机变量在其父节点值条件下的概率的乘积！不失一般性，让
    $X_i$ 指第 $i$ 个随机变量（如果 $X_i$ 是 $X_j$ 的父节点，则 $i < j$）：\begin{align*} P&(\text{Joint})
    = P(X_1 = x_1, \dots, X_n = x_n) = \prod_i P(X_i = x_i | \text{Values of parents
    of }X_i ) \end{align*}贝叶斯网络中隐含了哪些假设？使用链式法则，我们可以分解 $n$ 个随机变量的**精确**联合概率。为了使下面的数学更容易理解，我将使用
    $x_i$ 作为 $X_i = x_i$ 事件的简称：\begin{align*} P(x_1, \dots, x_n) &= \prod_i P(x_i
    | x_{i-1}, \dots, x_1)\\ \end{align*}通过观察两个方程的差异，我们可以看到贝叶斯网络假设 $$P(x_i | x_{i-1},
    \dots, x_1) = P(x_i | \text{Values of parents of }X_i)$$ 这是一个条件独立性声明。它表示，一旦你知道网络中变量
    $X_i$ 的父节点值，关于非后裔的任何进一步信息都不会改变你对 $X_i$ 的信念。正式地说，我们说 $X_i$ 在其父节点条件下对其非后裔是条件独立的。那么，非后裔是什么？在一个图中，$X_i$
    的后裔是任何在以 $X_i$ 为起点的子树中的东西。其他所有东西都是非后裔。非后裔包括 $X_i$ 的“祖先”节点，以及与 $X_i$ 完全不相连的节点。在设计贝叶斯网络时，你不必直接考虑这个假设。如果节点之间的箭头遵循因果路径，这个假设自然就是好的。 '
- en: Designing a Bayes Net
  id: totrans-12
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 设计贝叶斯网络
- en: There are several steps to designing a Bayes Net.
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 设计贝叶斯网络有几个步骤。
- en: Choose your random variables, and make them nodes.
  id: totrans-14
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 选择你的随机变量，并将它们作为节点。
- en: Add edges, often based off your assumptions about which nodes directly cause
    which others.
  id: totrans-15
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 添加边，通常基于你对哪些节点直接导致其他节点的假设。
- en: Define $P(X_i = x_i | \text{Values of parents of }X_i )$ for all nodes.
  id: totrans-16
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 为所有节点定义 $P(X_i = x_i | \text{Values of parents of }X_i )$。
- en: As you might have guessed, we can do step (2) and (3) by hand, or, we can have
    computers try and perform those tasks based on data. The first task is called
    "structure learning" and the second is an instance of "machine learning." There
    are fully autonomous solutions to structure learning—but they only work well if
    you have a massive amount of data. Alternatively people will often compute a statistic
    called correlation between all pairs of random variables to help in the art form
    of designing a Bayes Net.
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 如你所猜，我们可以手动完成步骤（2）和（3），或者让计算机根据数据尝试执行这些任务。第一个任务被称为“结构学习”，第二个是“机器学习”的一个实例。结构学习有完全自主的解决方案——但只有在你有大量数据的情况下才能很好地工作。或者，人们通常会计算一个称为相关性的统计量，它是所有随机变量对的统计量，以帮助设计贝叶斯网络的艺术形式。
- en: 'In the next part of the reader we are going to talk about how we could learn
    $P(X_i = x_i | \text{Values of parents of }X_i )$ from data. For now let''s start
    with the (reasonable) assumption that an expert can write down these functions
    in equations or as python: `getProbXi`.'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 在下一部分中，我们将讨论如何从数据中学习 $P(X_i = x_i | \text{Values of parents of }X_i )$。现在，让我们从（合理的）假设开始，即专家可以以方程或作为
    python 的 `getProbXi` 函数写下这些函数。
- en: Next Steps
  id: totrans-19
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 下一步
- en: 'Great! We have a feasible way to define a large network of random variables.
    First challenge complete. We haven''t talked about continuous or multinomial random
    variables in Bayes Nets. None of the theory changes: the expert will just have
    to define `getProbXi` to handle more values of `k` than 0 or 1.'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 太好了！我们有一个可行的方法来定义一个包含大量随机变量的网络。第一个挑战已经完成。我们还没有在贝叶斯网络中讨论连续或多项式随机变量。理论本身并没有变化：专家只需定义`getProbXi`来处理比0或1更多的`k`值。
- en: A Bayesian network is not very interesting to us unless we can use it to solve
    different conditional probability questions. How can we perform "inference" on
    a network as complex as a Bayesian network?
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 贝叶斯网络对我们来说并不很有趣，除非我们能用它来解决不同的条件概率问题。我们如何对一个像贝叶斯网络这么复杂的网络进行“推理”呢？
