- en: '***Binarize the data***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***The histogram above seems to suggest that this data is mostly binary. A
    pixel either has ink or does not. Applying what we learned in [Section 21.3.7](#sec-indexing-matrices),
    we can binarize the data using just matrix operations:'
