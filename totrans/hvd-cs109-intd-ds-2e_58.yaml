  type: TYPE_NORMAL
- en: '[PRE42]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/e0ea9c432457f578b5e84b182b8ff147.png)****'
  prefs: []
  type: TYPE_NORMAL
- en: '***Do some digits require more ink to write than others?***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***Let’s study the distribution of the total pixel darkness and how it varies
    by digits.'
  prefs: []
  type: TYPE_NORMAL
- en: 'We can use what we learned in [Section 21.3.5](#sec-row-col-summaries) to computed
    this average for each pixel and the display the values for each digit using a
    boxplot:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE43]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/04b79ce3241f7f178f372f21c505e916.png)*  *From this plot we see
    that, not surprisingly, 1s use less ink than other digits.****'
  prefs: []
  type: TYPE_NORMAL
- en: '***Are some pixels uninformative?***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***We now examine the variation of each pixel across digits to identify and
    remove those that provide little information for classification. Pixels that show
    little variation across images do not help distinguish between digits and can
    safely be excluded. In many cases, removing uninformative features not only simplifies
    the analysis but also reduces the dataset’s size substantially, improving computational
    speed.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Using what we learned in Sections [21.3.5](#sec-row-col-summaries) and [21.3.6](#sec-conditional-filtering),
    we can efficiently compute and filter out such columns. To quantify each pixel’s
    variability, we calculate its standard deviation across all images using the `colSds`
    function from the **matrixStats** package:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE44]'
  prefs: []
  type: TYPE_PRE
- en: '*A quick look at the distribution of these values shows that some pixels have
    very low entry to entry variability:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE45]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/ae2f4139eb9408614ba34b1dcf94de2b.png)*  *This makes sense since
    we don’t write in some parts of the box. Here is the variance plotted by location
    after using what we learned in [Section 21.3.1](#sec-creating-a-matrix) to creat
    a \(28 \times 28\) matrix:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE46]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/603f55282784651f921ac283071fb1b6.png)*  *We see that there is
    little variation in the corners.'
  prefs: []
  type: TYPE_NORMAL
- en: We could remove features that have no variation since these can’t help us predict.
  prefs: []
  type: TYPE_NORMAL
- en: 'So if we wanted to remove uninformative predictors from our matrix, we could
    write this one line of code:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE47]'
  prefs: []
  type: TYPE_PRE
- en: '*Only the columns for which the standard deviation is above 60 are kept, which
    removes over half the predictors.*******'
  prefs: []
  type: TYPE_NORMAL
- en: '***Can we remove smudges?***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***We will first look at the distribution of all pixel values.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE48]'
  prefs: []
