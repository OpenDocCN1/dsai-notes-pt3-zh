- en: '| $E$ | Capital letters can denote events |'
  id: totrans-6
  prefs: []
  type: TYPE_TB
  zh: '| $E$ | 大写字母可以表示事件 |'
- en: '| $A$ | Sometimes they denote sets |'
  id: totrans-7
  prefs: []
  type: TYPE_TB
  zh: '| $A$ | 有时它们表示集合 |'
- en: '| $&#124;E&#124; $ | Size of an event or set |'
  id: totrans-8
  prefs: []
  type: TYPE_TB
  zh: '| $|E| $ | 事件或集合的大小 |'
- en: '| $E^C$ | Complement of an event or set |'
  id: totrans-9
  prefs: []
  type: TYPE_TB
  zh: '| $E^C$ | 事件或集合的补集 |'
- en: '| $EF$ | And of events (aka intersection) |'
  id: totrans-10
  prefs: []
  type: TYPE_TB
  zh: '| $EF$ | 事件的“与”（也称为交集） |'
- en: '| $ E \and F$ | And of events (aka intersection) |'
  id: totrans-11
  prefs: []
  type: TYPE_TB
  zh: '| $ E \and F$ | 事件的“与”（也称为交集） |'
- en: '| $ E \cap F$ | And of events (aka intersection) |'
  id: totrans-12
  prefs: []
  type: TYPE_TB
  zh: '| $ E \cap F$ | 事件的“与”（也称为交集） |'
- en: '| $ E \or F$ | Or of events (aka union) |'
  id: totrans-13
  prefs: []
  type: TYPE_TB
  zh: '| $ E \lor F$ | 事件的“或”（也称为并集） |'
- en: '| $ E \cup F$ | Or of events (aka union) |'
  id: totrans-14
  prefs: []
  type: TYPE_TB
  zh: '| $ E \cup F$ | 事件的“或”（也称为并集） |'
- en: '| $\text{count}(E)$ | The number of times that $E$ occurs |'
  id: totrans-15
  prefs: []
  type: TYPE_TB
  zh: '| $\text{count}(E)$ | $E$ 发生的次数 |'
- en: '| $\p(E)$ | The probability of an event $E$ |'
  id: totrans-16
  prefs: []
  type: TYPE_TB
  zh: '| $\p(E)$ | 事件 $E$ 的概率 |'
- en: '| $\p(E&#124;F)$ | The conditional probability of an event $E$ given $F$ |'
  id: totrans-17
  prefs: []
  type: TYPE_TB
  zh: '| $\p(E\vert F)$ | 在给定 $F$ 的条件下事件 $E$ 的条件概率 |'
- en: '| $\p(E,F)$ | The probability of event $E$ and $F$ |'
  id: totrans-18
  prefs: []
  type: TYPE_TB
  zh: '| $\p(E,F)$ | 事件 $E$ 和 $F$ 的概率 |'
- en: '| $\p(E&#124;F,G)$ | The conditional probability of an event $E$ given both
    $F$ and $G$ |'
  id: totrans-19
  prefs: []
  type: TYPE_TB
  zh: '| $\p(E\vert F,G)$ | 在给定 $F$ 和 $G$ 的条件下事件 $E$ 的条件概率 |'
- en: '| $n!$ | $n$ factorial |'
  id: totrans-20
  prefs: []
  type: TYPE_TB
  zh: '| $n!$ | $n$ 的阶乘 |'
- en: '| ${n \choose k}$ | Binomial coefficient |'
  id: totrans-21
  prefs: []
  type: TYPE_TB
  zh: '| ${n \choose k}$ | 二项式系数 |'
- en: '| ${n \choose {r_1,r_2,r_3} }$ | [Multinomial coefficient](../../part1/combinatorics/#bucketing_fixed)
    |'
  id: totrans-22
  prefs: []
  type: TYPE_TB
  zh: '| ${n \choose {r_1,r_2,r_3} }$ | [多项式系数](../../part1/combinatorics/#bucketing_fixed)
    |'
- en: Random Variables
  id: totrans-23
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 随机变量
- en: '| Notation | Meaning |'
  id: totrans-24
  prefs: []
