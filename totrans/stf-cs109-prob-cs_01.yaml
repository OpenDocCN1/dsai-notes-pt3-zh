- en: '| --- | --- |'
  id: totrans-25
  prefs: []
  type: TYPE_TB
  zh: '| --- | --- |'
- en: '| $x$ | Lower case letters denote regular variables |'
  id: totrans-26
  prefs: []
  type: TYPE_TB
  zh: '| $x$ | 小写字母表示常规变量 |'
- en: '| $X$ | Capital letters are used to denote random variables |'
  id: totrans-27
  prefs: []
  type: TYPE_TB
  zh: '| $X$ | 大写字母用于表示随机变量 |'
- en: '| $K$ | Capital $K$ is reserved for constants |'
  id: totrans-28
  prefs: []
  type: TYPE_TB
  zh: '| $K$ | 大写 $K$ 保留用于常数 |'
- en: '| $\E[X]$ | Expectation of $X$ |'
  id: totrans-29
  prefs: []
  type: TYPE_TB
  zh: '| $\E[X]$ | $X$ 的期望值 |'
- en: '| $\Var(X)$ | Variance of $X$ |'
  id: totrans-30
  prefs: []
  type: TYPE_TB
  zh: '| $\Var(X)$ | $X$ 的方差 |'
- en: '| $\p(X=x)$ | Probability mass function (PMF) of $X$, evaluated at $x$ |'
  id: totrans-31
  prefs: []
  type: TYPE_TB
  zh: '| $\p(X=x)$ | $X$ 在 $x$ 处的概率质量函数 (PMF) |'
- en: '| $\p(x)$ | Probability mass function (PMF) of $X$, evaluated at $x$ |'
  id: totrans-32
  prefs: []
  type: TYPE_TB
  zh: '| $\p(x)$ | $X$ 在 $x$ 处的概率质量函数 (PMF) |'
- en: '| $f(X=x)$ | Probability density function (PDF) of $X$, evaluated at $x$ |'
  id: totrans-33
  prefs: []
  type: TYPE_TB
  zh: '| $f(X=x)$ | $X$ 在 $x$ 处的概率密度函数 (PDF) |'
- en: '| $f(x)$ | Probability density function (PDF) of $X$, evaluated at $x$ |'
  id: totrans-34
  prefs: []
  type: TYPE_TB
  zh: '| $f(x)$ | $X$ 在 $x$ 处的概率密度函数 (PDF) |'
- en: '| $f(X=x,Y=y)$ | Joint probability density |'
  id: totrans-35
  prefs: []
  type: TYPE_TB
  zh: '| $f(X=x,Y=y)$ | 联合概率密度 |'
- en: '| $f(X=x&#124;Y=y)$ | Conditional probability density |'
  id: totrans-36
  prefs: []
  type: TYPE_TB
  zh: '| $f(X=x\vert Y=y)$ | 条件概率密度 |'
- en: '| $F_X(x)$ or $F(x)$ | Cumulative distribution function (CDF) of $X$ |'
  id: totrans-37
  prefs: []
  type: TYPE_TB
  zh: '| $F_X(x)$ 或 $F(x)$ | $X$ 的累积分布函数 (CDF) |'
- en: '| IID | Independent and Identically Distributed |'
  id: totrans-38
  prefs: []
  type: TYPE_TB
  zh: '| IID | 独立同分布 (Independent and Identically Distributed) |'
