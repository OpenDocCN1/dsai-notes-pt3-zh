- en: Up to this point, the book has focused mainly on datasets with a single variable.
    In real data analysis, however, we are often interested in the relationship between
    two or more variables. In this part of the book, we introduce linear models, a
    general framework that unifies methods for studying associations among variables,
    including simple and multivariable regression, treatment effect models, association
    tests, and generalized linear models. We will use several case studies to illustrate
    these ideas. We will examine whether height is hereditary ([15  Introduction to
    Regression](regression.html)), whether a high-fat diet makes mice heavier ([17 
    Treatment Effect Models](treatment-effect-models.html)), whether there is gender
    bias in research funding in the Netherlands ([Association Tests](glm.html#sec-association-tests))
    and how to build a baseball team on a budget ([20  Multivariable Regression](multivariable-regression.html)).
    We also include a chapter on the important concept that association is not causation
    ([19  Association Is Not Causation](association-not-causation.html)), with a detailed
    discussion and examples of the challenges that arise when interpreting relationships
    between variables.
  prefs: []
  type: TYPE_NORMAL
