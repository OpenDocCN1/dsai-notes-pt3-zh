- en: '[Recommended Reading](../summaries/reading-summaries.html)'
  id: totrans-3
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[推荐阅读](../summaries/reading-summaries.html)'
- en: '**Freedman, D., Pisani, R., & Purves, R. (2007). *Statistics* (4th ed.).**
    A clear, concept-first introduction to distributions, variability, and summaries,
    excellent for intuition and statistical thinking.'
  id: totrans-4
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**弗里德曼，D.，皮萨尼，R.，& 普尔维斯，R. (2007). *统计学* (第4版).** 一种清晰、以概念为先导的分布、变异性和总结的介绍，非常适合直觉和统计思维。'
- en: '**Tukey, J. W. (1977). *Exploratory Data Analysis*.** The classic source for
    boxplots, robust summaries, and EDA philosophy, foundational for this chapter’s
    emphasis on describing data.'
  id: totrans-5
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**图基，J. W. (1977). *数据探索分析*.** 关于箱线图、稳健总结和EDA哲学的经典来源，为本章强调描述数据奠定了基础。'
- en: '**Cleveland, W. S. (1993). *Visualizing Data*.** A practical, graphics-first
    treatment of distributions and patterns; pairs well with histograms, density plots,
    and eCDFs.'
  id: totrans-6
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**克利夫兰，W. S. (1993). *可视化数据*.** 一种实用、以图形为主的分布和模式处理方法；与直方图、密度图和eCDFs相得益彰。'
- en: '**Hoaglin, D. C., Mosteller, F., & Tukey, J. W. (1983). *Understanding Robust
    and Exploratory Data Analysis*. Wiley.** A classic edited volume aimed at explaining
    robust methods in an accessible style; many chapters are practical.'
  id: totrans-7
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**霍格林，D. C.，莫斯特勒，F.，& 图基，J. W. (1983). *理解稳健和探索性数据分析*. Wiley.** 一本旨在以易于理解的方式解释稳健方法的经典编辑集；许多章节都是实用的。'
- en: '**Wilcox, R. R. (2017). *Introduction to Robust Estimation and Hypothesis Testing*
    (4th ed.). Academic Press.** A practical, applied text with many worked examples.
    It goes well beyond what we convered in this chapter but starts with chapters
    on medians, trimmed means, MAD, and robust alternatives to SD. The later chapters
    require knowledge of hypothesis testing which we cover in the statistical inference
    part of the book.'
  id: totrans-8
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**威尔科克斯，R. R. (2017). *稳健估计与假设检验导论* (第4版). 学术出版社.** 一本包含许多实例的实用、应用性文本。它超越了本章所涵盖的内容，但始于关于中位数、截尾均值、MAD和稳健替代标准差的章节。后面的章节需要假设检验的知识，我们在本书的统计推断部分进行了介绍。'
- en: '**Huber, P. J., & Ronchetti, E. M. (2009). *Robust Statistics* (2nd ed.). Wiley.**
    More advanced, but the opening chapters give a rigorous yet readable account of
    why robustness matters. Useful for readers that want to go a deeper. Requires
    knowledge we topics we cover in the statistical inference and linear model parts
    of the book.'
  id: totrans-9
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**胡贝尔，P. J.，& 朗切蒂，E. M. (2009). *稳健统计* (第2版). Wiley.** 更高级，但开篇章节以严谨且易读的方式阐述了稳健性为何重要。对希望深入了解的读者很有用。需要我们本书统计推断和线性模型部分所涵盖的知识。'
