- en: Recommended Reading
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/linear-models/reading-lm.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/linear-models/reading-lm.html)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '[Linear Models](../linear-models/intro-to-linear-models.html)'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '[Recommended Reading](../linear-models/reading-lm.html)'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '**Montgomery, D. C. (2017). *Design and Analysis of Experiments* (9th ed.).
    Wiley.**'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: The standard reference for experimental design, randomization, and treatment
    effect estimation ,from randomized blocks to factorial designs.
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
- en: '**Freedman, D. A. (2009). *Statistical Models: Theory and Practice*. Cambridge
    University Press.**'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Conceptually sharp and rigorous introduction to what regression models mean
    and how assumptions affect inference.
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
- en: '**Kutner, M. H., Nachtsheim, C. J., & Neter, J. (2004). *Applied Linear Regression
    Models* (4th ed.). McGraw-Hill.**'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: A widely used undergraduate/graduate text emphasizing linear model formulation,
    assumptions, and practical applications.
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
- en: '**James, G., Witten, D., Hastie, T., & Tibshirani, R. (2021). *An Introduction
    to Statistical Learning with Applications in R* (2nd ed.). Springer.**'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Chapters 3-4 provide a gentle, modern introduction to simple and multiple regression
    with R code examples.
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
- en: '**Agresti, A. (2013). *Categorical Data Analysis* (3rd ed.).**'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Authoritative resource on association tests and categorical data.
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
- en: '**Dobson, A. J., & Barnett, A. G. (2018). *An Introduction to Generalized Linear
    Models* (4th ed.).**'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: A clear, accessible introduction to GLMs.
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
- en: '**McCullagh, P., & Nelder, J. A. (1989). *Generalized Linear Models* (2nd ed.).**'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: The classic and definitive text on GLMs; more theoretical but essential for
    deep understanding.
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
- en: '**Tyler Vigen. *Spurious Correlations.***'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: A lighthearted but instructive look at how unrelated variables can appear strongly
    correlated. Helps develop critical thinking about association versus causation.
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
- en: '[Website](https://www.tylervigen.com/spurious-correlations)'
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
- en: '**Rothman, K. J., Greenland, S., & Lash, T. L. (2021). *Modern Epidemiology*
    (4th ed.).**'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: A thorough reference on confounding, bias, and study design, often used in epidemiology
    and public health.
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
