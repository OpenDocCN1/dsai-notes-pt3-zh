  id: totrans-2
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[线性模型](../linear-models/intro-to-linear-models.html)'
- en: '[Recommended Reading](../linear-models/reading-lm.html)'
  id: totrans-3
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[推荐阅读](../linear-models/reading-lm.html)'
- en: '**Montgomery, D. C. (2017). *Design and Analysis of Experiments* (9th ed.).
    Wiley.**'
  id: totrans-4
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Montgomery, D. C. (2017). *实验设计与分析* (第9版). Wiley.**'
- en: The standard reference for experimental design, randomization, and treatment
    effect estimation ,from randomized blocks to factorial designs.
  id: totrans-5
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 实验设计、随机化和治疗效果估计的标准参考书，从随机区组设计到析因设计。
- en: '**Freedman, D. A. (2009). *Statistical Models: Theory and Practice*. Cambridge
    University Press.**'
  id: totrans-6
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Freedman, D. A. (2009). *统计模型：理论与应用*. 剑桥大学出版社.**'
- en: Conceptually sharp and rigorous introduction to what regression models mean
    and how assumptions affect inference.
  id: totrans-7
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 对回归模型的意义以及假设如何影响推断的概念性清晰且严谨的介绍。
- en: '**Kutner, M. H., Nachtsheim, C. J., & Neter, J. (2004). *Applied Linear Regression
    Models* (4th ed.). McGraw-Hill.**'
  id: totrans-8
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Kutner, M. H., Nachtsheim, C. J., & Neter, J. (2004). *应用线性回归模型* (第4版). 麦格劳-希尔.**'
- en: A widely used undergraduate/graduate text emphasizing linear model formulation,
    assumptions, and practical applications.
  id: totrans-9
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 一本广泛使用的本科/研究生教材，强调线性模型的表达式、假设和实际应用。
- en: '**James, G., Witten, D., Hastie, T., & Tibshirani, R. (2021). *An Introduction
    to Statistical Learning with Applications in R* (2nd ed.). Springer.**'
  id: totrans-10
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**James, G., Witten, D., Hastie, T., & Tibshirani, R. (2021). *统计学习导论及其在R中的应用*
    (第2版). Springer.**'
- en: Chapters 3-4 provide a gentle, modern introduction to simple and multiple regression
    with R code examples.
  id: totrans-11
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 第3-4章以R代码示例，对简单和多重回归进行了温和的现代介绍。
- en: '**Agresti, A. (2013). *Categorical Data Analysis* (3rd ed.).**'
  id: totrans-12
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Agresti, A. (2013). *分类数据分析* (第3版).**'
- en: Authoritative resource on association tests and categorical data.
  id: totrans-13
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 关于关联测试和分类数据的权威资源。
- en: '**Dobson, A. J., & Barnett, A. G. (2018). *An Introduction to Generalized Linear
    Models* (4th ed.).**'
  id: totrans-14
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Dobson, A. J. & Barnett, A. G. (2018). *广义线性模型导论* (第4版).**'
- en: A clear, accessible introduction to GLMs.
  id: totrans-15
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 对广义线性模型的一个清晰、易于理解的介绍。
- en: '**McCullagh, P., & Nelder, J. A. (1989). *Generalized Linear Models* (2nd ed.).**'
  id: totrans-16
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**McCullagh, P., & Nelder, J. A. (1989). *广义线性模型* (第2版).**'
- en: The classic and definitive text on GLMs; more theoretical but essential for
    deep understanding.
  id: totrans-17
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 关于广义线性模型的经典和权威文本；更偏向理论，但对于深入理解是必不可少的。
- en: '**Tyler Vigen. *Spurious Correlations.***'
  id: totrans-18
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Tyler Vigen. *虚假相关性*.**'
- en: A lighthearted but instructive look at how unrelated variables can appear strongly
    correlated. Helps develop critical thinking about association versus causation.
  id: totrans-19
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 以轻松愉快但富有教育意义的方式审视看似无关的变量如何表现出强烈的相关性。有助于培养关于关联与因果关系的批判性思维。
- en: '[Website](https://www.tylervigen.com/spurious-correlations)'
  id: totrans-20
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: '[网站](https://www.tylervigen.com/spurious-correlations)'
- en: '**Rothman, K. J., Greenland, S., & Lash, T. L. (2021). *Modern Epidemiology*
    (4th ed.).**'
  id: totrans-21
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Rothman, K. J., Greenland, S., & Lash, T. L. (2021). *现代流行病学* (第4版).**'
- en: A thorough reference on confounding, bias, and study design, often used in epidemiology
    and public health.
  id: totrans-22
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 一本关于混杂因素、偏差和实验设计的详尽参考书，常用于流行病学和公共卫生领域。
