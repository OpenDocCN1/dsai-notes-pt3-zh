- en: Multiple testing and the replication crisis[¶](#multiple-testing-and-the-replication-crisis
    "Link to this Section")
  id: totrans-4
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 多重检验与复制危机[¶](#multiple-testing-and-the-replication-crisis "链接到本节")
- en: So far, we’ve looked at false positive rate (FPR) and true positive rate (TPR,
    or power) when evaluating a single hypothesis test. We saw that when using the
    traditional null hypothesis significance testing (NHST) framework, we choose a
    p-value threshold, which is our FPR for each test. If we choose a simple alternative
    hypothesis, we can compute the TPR by looking at the probability of making a discovery
    under that alternative hypothesis (i.e., the probability that our test statistic
    is above our decision threshold under that simple alternative hypothesis).
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 到目前为止，我们已经讨论了在评估单个假设检验时，如何考虑假阳性率（FPR）和真阳性率（TPR，或功效）。我们了解到，在使用传统的零假设显著性检验（NHST）框架时，我们选择一个p值阈值，这是我们每个测试的FPR。如果我们选择一个简单的备择假设，我们可以通过查看在该简单备择假设下做出发现的概率来计算TPR（即，在我们的测试统计量超过决策阈值的情况下，该简单备择假设的概率）。
- en: 'But in many cases, controlling the false positive rate might not be enough
    to give us the desired level of errors. To help illustrate this, we’ll consider
    three researchers conducting hypothetical studies of associations between how
    much margarine people eat and how many books they read in a year:'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 但在很多情况下，仅仅控制假阳性率可能不足以达到我们期望的错误水平。为了帮助说明这一点，我们将考虑三位研究人员进行假设性研究，研究人们每年吃多少黄油和每年读多少本书之间的关联：
- en: Researcher Nat conducts one test, looking at a random sample of all individuals
    in the US.
  id: totrans-7
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 研究员纳特进行了一次测试，观察了美国所有个人的随机样本。
- en: Researcher Stan conducts fifty tests, looking at fifty random samples, one from
    each state in the US.
  id: totrans-8
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 研究员斯坦进行了五十次测试，观察了来自美国每个州的五十个随机样本。
- en: Researcher Colin conducts 3,244 tests, looking at 3,244 random samples, one
    from each county in the US.
  id: totrans-9
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 研究员科林进行了3,244次测试，观察了来自美国每个县的3,244个随机样本。
- en: 'Suppose all three of them use a p-value threshold of 0.05: this means that
    they should have only a <semantics><mrow><mn>5</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">5\%</annotation></semantics>5% chance of finding
    false positives. Also, since the premise of the study is somewhat absurd, we can
    safely assume that *in every test, the null hypothesis is true*: in other words,
    there is no correlation between margarine consumption and reading books. If that’s
    the case, what is the expected number of false positives each one will find?'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 假设他们三人都使用0.05的p值阈值：这意味着他们发现假阳性的概率只有 <semantics><mrow><mn>5</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">5\%</annotation></semantics>5%。此外，由于研究的前提有些荒谬，我们可以安全地假设*在每次测试中，零假设都是正确的*：换句话说，黄油消费与阅读书籍之间没有相关性。如果是这样，每个人预期的假阳性数量是多少？
- en: 'The number of FPs each researcher finds is a Bernoulli random variable with
    parameter <semantics><mrow><mi>p</mi><mo>=</mo><mn>0.05</mn></mrow><annotation
    encoding="application/x-tex">p=0.05</annotation></semantics>p=0.05 and <semantics><mrow><mi>n</mi><mo>∈</mo><mo
    stretchy="false">{</mo><mn>1</mn><mo separator="true">,</mo><mn>50</mn><mo separator="true">,</mo><mn>3244</mn><mo
    stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">n \in \{1,
    50, 3244\}</annotation></semantics>n∈{1,50,3244} depending on the researcher.
    So, the expected number of false positives is <semantics><mrow><mi>n</mi><mi>p</mi></mrow><annotation
    encoding="application/x-tex">np</annotation></semantics>np:'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 每位研究人员发现的假阳性数量是一个参数为 <semantics><mrow><mi>p</mi><mo>=</mo><mn>0.05</mn></mrow><annotation
    encoding="application/x-tex">p=0.05</annotation></semantics>p=0.05 且 <semantics><mrow><mi>n</mi><mo>∈</mo><mo
    stretchy="false">{</mo><mn>1</mn><mo separator="true">,</mo><mn>50</mn><mo separator="true">,</mo><mn>3244</mn><mo
    stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">n \in \{1,
    50, 3244\}</annotation></semantics>n∈{1,50,3244} 的伯努利随机变量，具体取决于研究人员。因此，预期的假阳性数量是
    <semantics><mrow><mi>n</mi><mi>p</mi></mrow><annotation encoding="application/x-tex">np</annotation></semantics>np：
- en: 'Nat’s expected number of false positives is <semantics><mrow><mn>0.05</mn><mo>×</mo><mn>1</mn><mo>=</mo><mn>0.05</mn></mrow><annotation
    encoding="application/x-tex">0.05 \times 1 = 0.05</annotation></semantics>0.05×1=0.05:
    this is very close to 0.'
  id: totrans-12
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 内特预期的假阳性数量是 <semantics><mrow><mn>0.05</mn><mo>×</mo><mn>1</mn><mo>=</mo><mn>0.05</mn></mrow><annotation
    encoding="application/x-tex">0.05 \times 1 = 0.05</annotation></semantics>0.05×1=0.05：这非常接近0。
- en: 'Stan’s expected number of false positives is <semantics><mrow><mn>0.05</mn><mo>×</mo><mn>50</mn><mo>=</mo><mn>2.5</mn></mrow><annotation
    encoding="application/x-tex">0.05 \times 50 = 2.5</annotation></semantics>0.05×50=2.5:
    in other words, even though the null hypothesis is true, Stan should expect to
    have 2-3 states come up as false positives.'
  id: totrans-13
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 斯坦预期的假阳性数量是 <semantics><mrow><mn>0.05</mn><mo>×</mo><mn>50</mn><mo>=</mo><mn>2.5</mn></mrow><annotation
    encoding="application/x-tex">0.05 \times 50 = 2.5</annotation></semantics>0.05×50=2.5：换句话说，即使零假设为真，斯坦也应该预期有2-3个州被误判为假阳性。
- en: 'Colin’s expected number of false positives is <semantics><mrow><mn>0.05</mn><mo>×</mo><mn>3244</mn><mo>=</mo><mn>162.2</mn></mrow><annotation
    encoding="application/x-tex">0.05 \times 3244 = 162.2</annotation></semantics>0.05×3244=162.2:
    Colin should expect to have, on average, 162 counties come up as false positives.'
  id: totrans-14
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 科林预期的假阳性数量是 <semantics><mrow><mn>0.05</mn><mo>×</mo><mn>3244</mn><mo>=</mo><mn>162.2</mn></mrow><annotation
    encoding="application/x-tex">0.05 \times 3244 = 162.2</annotation></semantics>0.05×3244=162.2：科林应该预期平均有162个县被误判为假阳性。
- en: 'These false positives could have serious impacts! Stan’s study, if covered
    poorly in the news, could result in dramatic headlines like “California and Idaho
    show strong link between margarine consumption and reading: should elementary
    schools serve more margarine to improve reading rates?” While this example seems
    somewhat silly since it’s obvious that the associations are spurious, this happens
    often when researchers use poor statistical practices.'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 这些假阳性可能会产生严重影响！如果斯坦的研究在新闻报道中被处理不当，可能会导致戏剧性的标题，例如“加利福尼亚和爱达荷州显示黄油消费与阅读之间存在强烈联系：小学应该提供更多黄油以提高阅读率吗？”虽然这个例子看起来有些荒谬，因为很明显这些关联是虚假的，但研究人员使用不良的统计实践时这种情况经常发生。
- en: A <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    threshold of 0.05 means that we should expect that when the null hypothesis is
    true, <semantics><mrow><mn>5</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">5\%</annotation></semantics>5% of the time, we’ll
    incorrectly make a discovery. This adds up when doing lots of tests.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 一个0.05的p值阈值意味着，当零假设为真时，我们应预期在<semantics><mrow><mn>5</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">5\%</annotation></semantics>5% 的时间里，我们会错误地做出一个发现。当进行大量测试时，这种情况会累积起来。
- en: This issue can often come up when researchers are deciding which associations
    to test. For example, a researcher might be interested in the effect of Vitamin
    D supplements on overall health. If an initial analysis of the data returns no
    results, the researcher might try to see if the effects are different for people
    of different genders. If that turns up no results, the researcher might think
    that Vitamin D absorption from the sun depends on melanin in skin, so they might
    look at the effect for all six different [Fitzpatrick skin types](https://en.wikipedia.org/wiki/Fitzpatrick_scale).
    At this point, in what might be a fairly innocuous sequence of tests, the researcher
    has already conducted 9 different tests, and the probability of making at least
    one false positive is<semantics><mrow><mn>1</mn><mo>−</mo><msup><mrow><mo fence="true">(</mo><mn>1</mn><mo>−</mo><mn>0.05</mn><mo
    fence="true">)</mo></mrow><mn>9</mn></msup><mo>≈</mo><mn>0.37</mn></mrow><annotation
    encoding="application/x-tex">~1 - \left(1-0.05\right)^9 \approx 0.37</annotation></semantics> 1−(1−0.05)9≈0.37.
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 当研究人员决定要测试哪些关联时，这个问题经常会发生。例如，一个研究人员可能对维生素D补充剂对整体健康的影响感兴趣。如果对数据的初步分析没有返回结果，研究人员可能会尝试看看这些效果是否对不同性别的人不同。如果这也找不到结果，研究人员可能会认为维生素D从阳光中的吸收取决于皮肤中的黑色素，所以他们可能会查看所有六种不同的[Fitzpatrick皮肤类型](https://en.wikipedia.org/wiki/Fitzpatrick_scale)的效果。在这个时候，在可能是一个相当无害的测试序列中，研究人员已经进行了9个不同的测试，至少出现一个假阳性的概率是<semantics><mrow><mn>1</mn><mo>−</mo><msup><mrow><mo
    fence="true">(</mo><mn>1</mn><mo>−</mo><mn>0.05</mn><mo fence="true">)</mo></mrow><mn>9</mn></msup><mo>≈</mo><mn>0.37</mn></mrow><annotation
    encoding="application/x-tex">~1 - \left(1-0.05\right)^9 \approx 0.37</annotation></semantics> 1−(1−0.05)9≈0.37。
- en: Different approaches to multiple testing[¶](#different-approaches-to-multiple-testing
    "Link to this Section")
  id: totrans-18
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 多重测试的不同方法[¶](#different-approaches-to-multiple-testing "链接到本节")
- en: 'We’ve seen that when we conduct multiple hypothesis tests at a fixed <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value threshold, we can
    control the FPR of each test, but we don’t necessarily control the rate of making
    errors across multiple tests. In order to address this, we’ll define error rates
    involving all the tests we conduct, and find algorithms that control those error
    rates. We’ll let <semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics>m
    be the number of hypothesis tests, and define two error rates:'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 我们已经看到，当我们在一个固定的<semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p值阈值下进行多次假设检验时，我们可以控制每个测试的FPR，但我们不一定能控制多次测试中犯错误的速率。为了解决这个问题，我们将定义涉及我们进行的所有测试的错误率，并找到控制这些错误率的算法。我们将让<semantics><mrow><mi>m</mi></mrow><annotation
    encoding="application/x-tex">m</annotation></semantics>m 表示假设检验的次数，并定义两个错误率：
- en: The **family-wise error rate (FWER)** is the probability of any one of the <semantics><mrow><mi>m</mi></mrow><annotation
    encoding="application/x-tex">m</annotation></semantics>m tests resulting in a
    false positive.
  id: totrans-20
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**家族错误率（FWER）**是任何一次<semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics>m
    次测试导致假阳性的概率。'
- en: The **false discovery rate (FDR)** is the expected value of the false discovery
    proportion (FDP) for the <semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics>m
    tests.
  id: totrans-21
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**假发现率（FDR）**是对于<semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics>m
    次测试的假发现比例（FDP）的期望值。'
- en: 'We’ll explore two algorithms that we can apply to the <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-values obtained from
    all <semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics>m
    tests: Bonferroni correction, which controls FWER, and the Benjamini-Hochberg
    procedure, which controls FDR. Here, “controls” means that we’re guaranteeing
    that error rate will be below a certain value we choose. Once we describe the
    algorithms, we’ll discuss the tradeoffs between the two, and how those tradeoffs
    are related to the inherent properties of the two error rates.'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将探讨两种算法，这些算法可以应用于从所有<semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics>m次测试中获得的<semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p值：Bonferroni校正，它控制FWER，以及Benjamini-Hochberg过程，它控制FDR。在这里，“控制”意味着我们保证错误率将低于我们选择的某个值。一旦我们描述了这些算法，我们将讨论两种算法之间的权衡，以及这些权衡如何与两种错误率的固有属性相关。
