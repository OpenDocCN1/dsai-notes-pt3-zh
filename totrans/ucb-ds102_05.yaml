  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: 在这里，<semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x轴是<semantics><mrow><mi>k</mi></mrow><annotation
    encoding="application/x-tex">k</annotation></semantics>k，即索引，而<semantics><mrow><mi>y</mi></mrow><annotation
    encoding="application/x-tex">y</annotation></semantics>y轴表示<semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p值。我们可以可视化两种技术的结果：
- en: If we use a naive <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    threshold of 0.05 for all tests, we will obtain an FPR of 0.05\. This threshold
    is the black line below.
  id: totrans-73
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 如果我们为所有测试使用0.05的朴素<semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p值阈值，我们将获得0.05的FPR。这个阈值是下面的黑线。
- en: If we use Bonferroni correction and want a FWER of 0.05 (i.e., the probability
    of making any false positives at all is 0.05), then we should use a <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value threshold of <semantics><mrow><mfrac><mn>0.05</mn><mn>100</mn></mfrac><mo>=</mo><mn>0.0005</mn></mrow><annotation
    encoding="application/x-tex">\frac{0.05}{100} = 0.0005</annotation></semantics>1000.05​=0.0005.
    This threshold is the red dashed line below.
  id: totrans-74
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 如果我们使用Bonferroni校正并希望得到0.05的FWER（即，做出任何假阳性的概率为0.05），那么我们应该使用一个<semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p值阈值为<semantics><mrow><mfrac><mn>0.05</mn><mn>100</mn></mfrac><mo>=</mo><mn>0.0005</mn></mrow><annotation
    encoding="application/x-tex">\frac{0.05}{100} = 0.0005</annotation></semantics>1000.05​=0.0005。这个阈值是下面的红色虚线。
- en: We can see that by using the more conservative Bonferroni threshold (in red),
    we leave
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以看到，通过使用更保守的Bonferroni阈值（红色），我们留下了
- en: '[PRE8]'
  id: totrans-76
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: '![<Figure size 600x450 with 1 Axes>](../Images/bd9976cf5dc26fa54645fc1bb00bfc0c.png)'
