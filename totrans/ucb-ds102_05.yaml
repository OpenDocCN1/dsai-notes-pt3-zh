    encoding="application/x-tex">p</annotation></semantics>p-values (after being sorted).
    The graph below shows all three thresholds:'
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
  zh: Benjamini-Hochberg过程建议取小于比较值<semantics><mrow><mfrac><mrow><mi>k</mi><mi>α</mi></mrow><mi>m</mi></mfrac></mrow><annotation
    encoding="application/x-tex">\frac{k\alpha}{m}</annotation></semantics>mkα​的最大<semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p值：在这种情况下，那就是索引16的点。这成为我们的<semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p值阈值，因此我们选择拒绝前16个<semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p值（排序后）。下面的图表显示了所有三个阈值：
