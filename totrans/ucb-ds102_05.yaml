  type: TYPE_IMG
  zh: '![<Figure size 600x450 with 1 Axes>](../Images/879eba4f617fbe8e77cdb6d3e84a6f03.png)'
- en: 'The Benjamini-Hochberg procedure says to take the largest <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value that’s below the
    comparison value <semantics><mrow><mfrac><mrow><mi>k</mi><mi>α</mi></mrow><mi>m</mi></mfrac></mrow><annotation
    encoding="application/x-tex">\frac{k\alpha}{m}</annotation></semantics>mkα​: in
    this case, that’s the point at index 16\. This becomes our <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value threshold, so we
