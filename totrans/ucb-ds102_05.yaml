  prefs: []
  type: TYPE_IMG
  zh: '![<Figure size 600x450 with 1 Axes>](../Images/bd9976cf5dc26fa54645fc1bb00bfc0c.png)'
- en: 'In this visualization, how does the Benjamini-Hochberg procedure work? We compare
    each <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    to the comparison value <semantics><mrow><mfrac><mrow><mi>k</mi><mi>α</mi></mrow><mi>m</mi></mfrac></mrow><annotation
    encoding="application/x-tex">\frac{k\alpha}{m}</annotation></semantics>mkα​, which
    in this visualization is a diagonal line. In order to better see what’s going
    on, we’ll also zoom in on a narrower range of <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-values:'
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: 在这个可视化中，Benjamini-Hochberg过程是如何工作的？我们比较每个<semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p值与比较值<semantics><mrow><mfrac><mrow><mi>k</mi><mi>α</mi></mrow><mi>m</mi></mfrac></mrow><annotation
    encoding="application/x-tex">\frac{k\alpha}{m}</annotation></semantics>mkα​，在这个可视化中是一个对角线。为了更好地看到正在发生的事情，我们还将放大一个更窄范围的<semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p值：
- en: '[PRE9]'
  id: totrans-79
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: '![<Figure size 600x450 with 1 Axes>](../Images/879eba4f617fbe8e77cdb6d3e84a6f03.png)'
