    is <semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k,
    the index, and the <semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y-axis
