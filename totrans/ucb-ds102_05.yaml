- en: Comparing and Contrasting FWER and FDR[¶](#comparing-and-contrasting-fwer-and-fdr
    "Link to this Section")
  id: totrans-88
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 比较和对比FWER和FDR[¶](#comparing-and-contrasting-fwer-and-fdr "链接到本节")
- en: 'Now that we’ve seen how we might control FWER and FDR, we’ll build a better
    understanding of when each one might be better suited for a particular problem.
    Recall the definitions:'
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们已经看到了如何控制FWER和FDR，我们将更好地理解在特定问题中何时每个可能更适合。回顾定义：
- en: Family-wise error rate (FWER) is the probability that any of the <semantics><mrow><mi>m</mi></mrow><annotation
    encoding="application/x-tex">m</annotation></semantics>m tests is a false positive.
  id: totrans-90
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 家族错误率（FWER）是任何测试中出现假阳性的概率。
- en: False discovery rate (FDR) is the expected FDP, or equivalently, the expected
    fraction of discoveries that are incorrect.
  id: totrans-91
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 假发现率（FDR）是预期的FDP，或者说，是预期的不正确发现的比率。
- en: Suppose we conduct 1,000,000 tests (<semantics><mrow><mi>m</mi><mo>=</mo><mn>1000000</mn></mrow><annotation
    encoding="application/x-tex">m=1000000</annotation></semantics>m=1000000).
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们进行了100万个测试（<semantics><mrow><mi>m</mi><mo>=</mo><mn>1000000</mn></mrow><annotation
    encoding="application/x-tex">m=1000000</annotation></semantics>m=1000000）。
- en: 'If we want a FWER of 0.05, this means that we want the probability of any one
    of the 1,000,000 tests being a false positive to be 0.05 or less. In order to
    control this probability, we’ll need to be very conservative: after all, even
    a single false positive will mean that we’ve failed. In other words, controlling
    FWER requires us to be very conservative, and use very small <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value thresholds. This
    typically leads to very low power, or true positive rate (TPR), because our <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value threshold is so
    low that we miss many true positives.'
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们希望FWER为0.05，这意味着我们希望100万个测试中任何一个测试为假阳性的概率不超过0.05。为了控制这个概率，我们需要非常保守：毕竟，即使是单个假阳性也意味着我们已经失败了。换句话说，控制FWER要求我们非常保守，并使用非常小的<semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics><p>值阈值。这通常会导致非常低的功效，或者说真正的阳性率（TPR），因为我们的<semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics><p>值阈值如此之低，以至于我们错过了许多真正的阳性。
- en: On the other hand, if we want a FDR of 0.05, this just means that out of the
    discoveries we make in the 1,000,000 tests, on average, we want <semantics><mrow><mn>95</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">95\%</annotation></semantics>95%
    or more of them to be correct. We can achieve this with a much less conservative
    threshold. In other words, when we control FDR, we accept some more false positives,
    and in return we can achieve a higher true positive rate (i.e., do better in the
    case where <semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">R=1</annotation></semantics>R=1).
  id: totrans-94
  prefs: []
  type: TYPE_NORMAL
  zh: 另一方面，如果我们希望假发现率（FDR）为0.05，这仅仅意味着在100万个测试中，我们平均希望95%或更多的发现是正确的。我们可以通过一个不那么保守的阈值来实现这一点。换句话说，当我们控制FDR时，我们接受一些假阳性，作为回报，我们可以实现更高的真正阳性率（即，在<semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">R=1</annotation></semantics>R=1)的情况下做得更好）。
- en: How do these interpretations translate into choosing a rate to control in real-world
    applications? We’ll look at two examples to help illustrate the difference.
  id: totrans-95
  prefs: []
  type: TYPE_NORMAL
  zh: 这些解释如何转化为在现实世界应用中选择控制率？我们将通过两个例子来帮助说明差异。
- en: Consider a medical test for a rare condition where the only treatment is a dangerous
    surgery. In this case, a false positive could subject a patient to unnecessarily
    undergo the procedure, putting the patient’s life needlessly at risk and potentially
    inducing medical trauma. A false negative, on the other hand, while still potentially
    harmful due to lack of treatment, may not be as bad. In this case, or any similar
    case where a false positive is much worse than a false negative, controlling FWER
    is likely a better choice, since controlling FWER favors false negatives over
    false positives.
  id: totrans-96
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 考虑一种罕见疾病的医学检测，这种疾病的唯一治疗方法是危险的手术。在这种情况下，假阳性可能导致患者不必要地接受手术，使患者的生命无谓地处于危险之中，并可能引发医疗创伤。另一方面，假阴性虽然由于缺乏治疗可能仍然具有潜在危害，但可能没有这么严重。在这种情况下，或者任何假阳性远比假阴性更严重的情况，控制家族错误发现率（FWER）可能是一个更好的选择，因为控制FWER倾向于假阴性而非假阳性。
- en: Consider an online retailer who is interested in conducting many A/B tests to
    measure whether various website changes improve the chances that shoppers will
    buy products. In this case, the harm of a false positive is not particularly severe,
    and we can likely tolerate that <semantics><mrow><mn>5</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">5\%</annotation></semantics>5% of our discoveries
    could be wrong, especially if it means a better chance of finding changes that
    increase product purchases.
  id: totrans-97
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 考虑一个对进行大量A/B测试以衡量各种网站更改是否提高购物者购买产品机会感兴趣的在线零售商。在这种情况下，假阳性的危害并不特别严重，我们可能能够容忍我们的发现中有5%是错误的，尤其是如果这意味着有更好的机会找到能增加产品购买的机会。
- en: Note that both of these examples are somewhat ambiguous! In the first example,
    the cost of a false negative depends strongly on how much the treatment improves
    the prognosis for patients with the condition, whether follow-on tests exist,
    and so on. Similarly, in the second example, if the website changes have auxiliary
    costs (time and money spent by developers to make the changes, changes in user
    opinion about the website based on the changes, etc.), then this could affect
    whether we might prefer one over the other.
  id: totrans-98
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，这两个例子都有点模糊！在第一个例子中，假阴性的成本强烈取决于治疗如何改善该条件患者的预后，是否存在后续测试等因素。同样，在第二个例子中，如果网站更改有辅助成本（开发者为进行更改所花费的时间和金钱，以及基于更改的用户对网站的看法变化等），那么这可能会影响我们是否可能更喜欢其中一个。
