- en: Randomness, FWER, FDR, and FDP[¶](#randomness-fwer-fdr-and-fdp "Link to this
    Section")
  id: totrans-27
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 随机性、FWER、FDR和FDP[¶](#randomness-fwer-fdr-and-fdp "链接到本节")
- en: Up until now, we’ve focused primarily on the false discovery *proportion* (FDP).
    From now on, we’ll look more at the false discovery *rate* (FDR), so it’s important
    to understand the distinction between the two. Throughout this section, we’ll
    take a frequentist approach, and assume that our data are random (and because
    our decisions are based on our data, they’re random too), and that reality is
    fixed and unknown.
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 到目前为止，我们主要关注的是**假发现比例**（FDP）。从现在开始，我们将更多地关注**假发现率**（FDR），因此理解这两者之间的区别很重要。在本节中，我们将采用频率主义方法，并假设我们的数据是随机的（而且因为我们的决策是基于我们的数据，所以它们也是随机的），现实是固定且未知的。
- en: 'The FDP is the value that we obtain for any particular dataset: we obtain data,
    make a series of decisions, and then the false discovery proportion is based on
    those particular decisions.'
  id: totrans-29
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: FDP是我们为任何特定数据集获得的价值：我们获得数据，做出一系列决策，然后假发现比例是基于那些特定决策的。
- en: The FDR is the expectation of the FDP, where the expectation is taken over the
    randomness in the data. In other words, the FDR is the average FDP, averaged across
    all possible datasets (and weighted by how likely each one is).
  id: totrans-30
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: FDR是FDP的期望值，这里的期望值是对数据中的随机性进行取值。换句话说，FDR是平均FDP，平均所有可能的数据集（并按每个数据集的可能性进行加权）。
- en: Similarly, for any particular dataset, we can define the event “at least one
    false positive happened”. This event either occurs or it doesn’t for any particular
    series of decisions. The family-wise error rate (FWER) is the probability of this
    event occurring for any dataset.
  id: totrans-31
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 类似地，对于任何特定的数据集，我们可以定义事件“至少发生了一个假阳性”。对于任何一系列决策，这个事件要么发生，要么不发生。家族错误率（FWER）是对于任何数据集该事件发生的概率。
- en: In other words, the false discovery **proportion** is based on any particular
    dataset, while the false discovery **rate** is the average FDP across all possible
    datasets.
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 换句话说，**假发现比例**是基于任何特定的数据集，而**假发现率**是所有可能数据集的平均FDP。
- en: Known and Unknown[¶](#known-and-unknown "Link to this Section")
  id: totrans-33
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 已知与未知[¶](#known-and-unknown "链接到本节")
- en: 'Throughout this section, we’ll discuss FDP, FDR, and FWER as metrics to help
    us evaluate a decision-making process. But recall that in reality, we only ever
    observe the data and the decisions we make based on the data: reality is unknown
    to us. That means that in many real-world scenarios, we can’t actually compute
    the FDP for any particular series of decisions, because it requires us to know
    when <semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">R=0</annotation></semantics>R=0
    and when <semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">R=1</annotation></semantics>R=1.'
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: 在本节中，我们将讨论FDP、FDR和FWER作为评估决策过程的指标。但请记住，在现实中，我们只能观察到数据和基于数据的决策：现实对我们来说是未知的。这意味着在许多现实世界的场景中，我们实际上无法计算任何特定一系列决策的FDP，因为这需要我们知道何时<semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">R=0</annotation></semantics>R=0和何时<semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">R=1</annotation></semantics>R=1。
- en: So if we can’t actually compute the FDP, why are we analyzing it?
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，如果我们实际上无法计算FDP，我们为什么要分析它？
- en: 'The key is that the FDR (average FDP) provides a way of evaluating an algorithm.
    We’ll discuss several procedures, and show that on average, they perform well:
    in other words, if we look at the performance of these procedures averaged over
    the randomness in the data, we can mathematically show that the FDR or FWER will
    be below a certain level. For example, we’ll look at a procedure called Bonferroni
    correction and show that if we use it, our FWER, or probability of making a false
    positive, will be less than a particular threshold that we get to specify.'
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 关键在于FDR（平均FDP）提供了一种评估算法的方法。我们将讨论几个程序，并表明平均而言，它们的性能良好：换句话说，如果我们观察这些程序在数据随机性上的平均性能，我们可以从数学上证明FDR或FWER将低于某个特定水平。例如，我们将研究一个称为Bonferroni
    correction的程序，并表明如果我们使用它，我们的FWER，即做出错误阳性的概率，将低于我们特定指定的某个阈值。
- en: This process, of first defining algorithms that operate on the observed data
    to make decisions, then theoretically evaluating those algorithms using metrics
    that depend on unknown variables, is something we’ll see over and over throughout
    this course.
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: 这个过程，首先定义在观测数据上操作以做出决策的算法，然后使用依赖于未知变量的指标来理论上评估这些算法，是我们将在整个课程中反复看到的东西。
- en: '[PRE3]'
  id: totrans-38
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: Loading...
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: Bonferroni correction[¶](#bonferroni-correction "Link to this Section")
  id: totrans-40
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '[Bonferroni correction](#bonferroni-correction "链接到本节")'
- en: Bonferroni correction is a technique for controlling the FWER. In this context,
    when we use the term “**controlling** the FWER at level <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α”, this just means
    that we want the FWER to be less than or equal to some value <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α that we choose.
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: Bonferroni correction是一种控制FWER的技术。在这个上下文中，当我们使用“**控制**”FWER在水平α时，这仅仅意味着我们希望FWER低于或等于我们选择的某个值α。
- en: 'The procedure itself is very simple: it says that if we want to guarantee that
    our FWER for <semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics>m
    tests will be less than or equal to <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α, then we just need
    to use a <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    threshold of <semantics><mrow><mi>α</mi><mi mathvariant="normal">/</mi><mi>m</mi></mrow><annotation
    encoding="application/x-tex">\alpha/m</annotation></semantics>α/m to make a decision
    for each test. For example, if we want to guarantee an FWER of 0.01 for 500 tests,
    we should use a <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    threshold for each test of <semantics><mrow><mn>0.01</mn><mi mathvariant="normal">/</mi><mn>5000</mn><mo>=</mo><mn>2</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>6</mn></mrow></msup></mrow><annotation
    encoding="application/x-tex">0.01 / 5000 = 2 \times 10^{-6}</annotation></semantics>0.01/5000=2×10−6.'
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: 该程序本身非常简单：它指出，如果我们想保证我们的m个测试的FWER（家庭错误率）小于或等于α，那么我们只需要使用一个p值阈值为α/m来对每个测试做出决策。例如，如果我们想保证500个测试的FWER为0.01，那么我们应该为每个测试使用p值阈值为0.01/5000=2×10−6。
- en: Let’s show why this formula works. We’ll start by establishing some facts and
    definitions that we need.
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们展示为什么这个公式是有效的。我们首先将建立一些我们需要的事实和定义。
- en: To start, we’ll need to use the [union bound](https://en.wikipedia.org/wiki/Boole%27s_inequality),
    which states that for events <semantics><mrow><msub><mi>A</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>A</mi><mi>m</mi></msub></mrow><annotation
    encoding="application/x-tex">A_1, \ldots, A_m</annotation></semantics>A1​,…,Am​,
    that
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 首先，我们需要使用[并集不等式](https://en.wikipedia.org/wiki/Boole%27s_inequality)，它指出对于事件<semantics><mrow><msub><mi>A</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>A</mi><mi>m</mi></msub></mrow><annotation
    encoding="application/x-tex">A_1, \ldots, A_m</annotation></semantics>A1​,…,Am​，有
- en: <semantics><mrow><mi>P</mi><mrow><mo fence="true">(</mo><munderover><mo>⋃</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>m</mi></munderover><msub><mi>A</mi><mi>i</mi></msub><mo
    fence="true">)</mo></mrow><mo>≤</mo><munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>m</mi></munderover><mi>P</mi><mo
    stretchy="false">(</mo><msub><mi>A</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mi
    mathvariant="normal">.</mi></mrow><annotation encoding="application/x-tex">P\left(\bigcup_{i=1}^m
    A_i\right) \leq \sum_{i=1}^m P(A_i).</annotation></semantics>P(i=1⋃m​Ai​)≤i=1∑m​P(Ai​).[(1)](#BYnLUCY4HM
    "Link to this Equation")
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi>P</mi><mrow><mo fence="true">(</mo><munderover><mo>⋃</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>m</mi></munderover><msub><mi>A</mi><mi>i</mi></msub><mo
    fence="true">)</mo></mrow><mo>≤</mo><munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>m</mi></munderover><mi>P</mi><mo
    stretchy="false">(</mo><msub><mi>A</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mi
    mathvariant="normal">.</mi></mrow><annotation encoding="application/x-tex">P\left(\bigcup_{i=1}^m
    A_i\right) \leq \sum_{i=1}^m P(A_i).\right.</annotation></semantics>P(i=1⋃m​Ai​)≤i=1∑m​P(Ai​).[(1)](#BYnLUCY4HM
    "链接到这个公式")
- en: Informally, this says that if we add up the independent probabilities of the
    events occuring, the result will always be greater than or equal to the probability
    of the union of those events. Intuitively, this is true because when computing
    the probability of the union, we have to effectively subtract off the overlap
    between probabilities.
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: 非正式地说，这意味着如果我们把事件发生的独立概率相加，结果总是大于或等于这些事件并集的概率。直观上，这是正确的，因为在计算并集的概率时，我们必须有效地减去概率之间的重叠部分。
- en: 'To use the union bound, we’ll define the indicator variables <semantics><mrow><msub><mi>T</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>T</mi><mi>m</mi></msub></mrow><annotation
    encoding="application/x-tex">T_1, \ldots, T_m</annotation></semantics>T1​,…,Tm​,
    where <semantics><mrow><msub><mi>T</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">T_i</annotation></semantics>Ti​
    is the event that test <semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics>i
    results in a false positive. The family-wise error rate is the probability that
    any one of the tests is a false positive: in other words, <semantics><mrow><mi>F</mi><mi>W</mi><mi>E</mi><mi>R</mi><mo>=</mo><mi>P</mi><mo
    stretchy="false">(</mo><msub><mi>T</mi><mn>1</mn></msub><mo>∪</mo><msub><mi>T</mi><mn>2</mn></msub><mo>∪</mo><msub><mi>T</mi><mn>3</mn></msub><mo>⋯</mo><mo>∪</mo><msub><mi>T</mi><mi>m</mi></msub><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">FWER =
    P(T_1 \cup T_2 \cup T_3 \cdots \cup T_m)</annotation></semantics>FWER=P(T1​∪T2​∪T3​⋯∪Tm​).
    We know from the previous section that if we use the same <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value threshold <semantics><mrow><mi>γ</mi></mrow><annotation
    encoding="application/x-tex">\gamma</annotation></semantics>γ for each test, then
    <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><msub><mi>T</mi><mi>i</mi></msub><mo
    stretchy="false">)</mo><mo>=</mo><mi>γ</mi></mrow><annotation encoding="application/x-tex">P(T_i)
    = \gamma</annotation></semantics>P(Ti​)=γ.'
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: 要使用并集界，我们将定义指示变量 <semantics><mrow><msub><mi>T</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>T</mi><mi>m</mi></msub></mrow><annotation encoding="application/x-tex">T_1,
    \ldots, T_m</annotation></semantics>T1​,…,Tm​，其中 <semantics><mrow><msub><mi>T</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">T_i</annotation></semantics>Ti​ 是测试 <semantics><mrow><mi>i</mi></mrow><annotation
    encoding="application/x-tex">i</annotation></semantics>i 结果为假阳性的事件。家族错误率是任何一项测试为假阳性的概率：换句话说，<semantics><mrow><mi>F</mi><mi>W</mi><mi>E</mi><mi>R</mi><mo>=</mo><mi>P</mi><mo
    stretchy="false">(</mo><msub><mi>T</mi><mn>1</mn></msub><mo>∪</mo><msub><mi>T</mi><mn>2</mn></msub><mo>∪</mo><msub><mi>T</mi><mn>3</mn></msub><mo>⋯</mo><mo>∪</mo><msub><mi>T</mi><mi>m</mi></msub><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">FWER =
    P(T_1 \cup T_2 \cup T_3 \cdots \cup T_m)</annotation></semantics>FWER= P(T1​∪T2​∪T3​⋯∪Tm​).
    我们从上一节知道，如果我们为每个测试使用相同的 <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-值阈值
    <semantics><mrow><mi>γ</mi></mrow><annotation encoding="application/x-tex">\gamma</annotation></semantics>γ，那么
    <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><msub><mi>T</mi><mi>i</mi></msub><mo
    stretchy="false">)</mo><mo>=</mo><mi>γ</mi></mrow><annotation encoding="application/x-tex">P(T_i)
    = \gamma</annotation></semantics>P(Ti​)=γ.
- en: 'Putting it all together, we have:'
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: 将所有内容综合起来，我们有：
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>F</mi><mi>W</mi><mi>E</mi><mi>R</mi></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>P</mi><mrow><mo fence="true">(</mo><munderover><mo>⋃</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>m</mi></munderover><msub><mi>T</mi><mi>i</mi></msub><mo
    fence="true">)</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>≤</mo><munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>m</mi></munderover><mi>P</mi><mrow><mo
    fence="true">(</mo><msub><mi>T</mi><mi>i</mi></msub><mo fence="true">)</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>m</mi><mi>γ</mi></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} FWER &= P\left(\bigcup_{i=1}^m T_i\right)
    \\ &\leq \sum_{i=1}^m P\left(T_i\right) \\ &= m \gamma \end{align*}</annotation></semantics>FWER​=P(i=1⋃m​Ti​)≤i=1∑m​P(Ti​)=mγ​[(2)](#mLFMKPYQEt
    "Link to this Equation")
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>F</mi><mi>W</mi><mi>E</mi><mi>R</mi></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>P</mi><mrow><mo fence="true">(</mo><munderover><mo>⋃</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>m</mi></munderover><msub><mi>T</mi><mi>i</mi></msub><mo
    fence="true">)</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>≤</mo><munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>m</mi></munderover><mi>P</mi><mrow><mo
    fence="true">(</mo><msub><mi>T</mi><mi>i</mi></msub><mo fence="true">)</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>m</mi><mi>γ</mi></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} FWER &= P\left(\bigcup_{i=1}^m T_i\right)
    \\ &\leq \sum_{i=1}^m P\left(T_i\right) \\ &= m \gamma \end{align*}</annotation></semantics>FWER=
    P( i=1⋃m​Ti​) ≤ i=1∑m​P(Ti​) = mγ [(2)](#mLFMKPYQEt "链接到这个方程")
- en: If we choose our <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    threshold for each test <semantics><mrow><mi>γ</mi></mrow><annotation encoding="application/x-tex">\gamma</annotation></semantics>γ
    to be equal to <semantics><mrow><mi>α</mi><mi mathvariant="normal">/</mi><mi>m</mi></mrow><annotation
    encoding="application/x-tex">\alpha/m</annotation></semantics>α/m (recall that
    <semantics><mrow><mi>α</mi></mrow><annotation encoding="application/x-tex">\alpha</annotation></semantics>α
    is our desired FWER), then the right-hand side becomes <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α, and we guarantee
    that our FWER is less than or equal to <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α.
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们选择每个测试的 <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p
    值阈值 <semantics><mrow><mi>γ</mi></mrow><annotation encoding="application/x-tex">\gamma</annotation></semantics>γ
    等于 <semantics><mrow><mi>α</mi><mi mathvariant="normal">/</mi><mi>m</mi></mrow><annotation
    encoding="application/x-tex">\alpha/m</annotation></semantics>α/m（记住 <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α 是我们想要的 FWER），那么右侧就变成了
    <semantics><mrow><mi>α</mi></mrow><annotation encoding="application/x-tex">\alpha</annotation></semantics>α，我们就能保证我们的
    FWER 小于或等于 <semantics><mrow><mi>α</mi></mrow><annotation encoding="application/x-tex">\alpha</annotation></semantics>α。
- en: '[PRE4]'
  id: totrans-51
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: Loading...
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: Controlling FDR[¶](#controlling-fdr "Link to this Section")
  id: totrans-53
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 控制 FDR[¶](#controlling-fdr "链接到本节")
- en: Why control FDR instead of FWER?[¶](#why-control-fdr-instead-of-fwer "Link to
    this Section")
  id: totrans-54
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 为什么控制 FDR 而不是 FWER？[¶](#why-control-fdr-instead-of-fwer "链接到本节")
- en: 'Suppose we conduct 1,000,000 tests, and we want to control the FWER at level
    0.01. If we use the Bonferroni procedure, our <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value threshold will
    be 10^(-8): we will only make discoveries if the <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-values are incredibly
    small! This is because FWER is a very strict criterion. Controlling FWER means
    we want the probability of making **any** false positives in <semantics><mrow><mi>m</mi></mrow><annotation
    encoding="application/x-tex">m</annotation></semantics>m tests to be less than
    or equal to <semantics><mrow><mi>α</mi></mrow><annotation encoding="application/x-tex">\alpha</annotation></semantics>α:
    this requirement gets harder and harder to satisfy the larger <semantics><mrow><mi>m</mi></mrow><annotation
    encoding="application/x-tex">m</annotation></semantics>m gets. This is why the
    <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    threshold from Bonferroni correction gets smaller as <semantics><mrow><mi>m</mi></mrow><annotation
    encoding="application/x-tex">m</annotation></semantics>m increases.'
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们进行 1,000,000 次测试，并希望将 FWER 控制在 0.01 的水平。如果我们使用 Bonferroni 方法，我们的 <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p 值阈值将是 10^(-8)：只有当 <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p 值极其小的时候，我们才会做出发现！这是因为
    FWER 是一个非常严格的标准。控制 FWER 意味着我们要确保在 <semantics><mrow><mi>m</mi></mrow><annotation
    encoding="application/x-tex">m</annotation></semantics>m 次测试中产生任何假阳性的概率小于或等于 <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α：随着 <semantics><mrow><mi>m</mi></mrow><annotation
    encoding="application/x-tex">m</annotation></semantics>m 的增大，这个要求变得越来越难以满足。这就是为什么随着
    <semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics>m
    的增加，Bonferroni 校正的 p 值阈值会变得越来越小。
- en: Controlling FDR, on the other hand, is much more forgiving of a small number
    of errors. In our example above, controlling FDR at level 0.01 means that out
    of the discoveries we make, we want <semantics><mrow><mn>1</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">1\%</annotation></semantics>1% or fewer of them to
    be wrong. This is still a much stricter criterion than just controlling FPR as
    we saw with naive thresholding, but it’s easier to satisfy as <semantics><mrow><mi>m</mi></mrow><annotation
    encoding="application/x-tex">m</annotation></semantics>m grows without imposing
    such a drastically low <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    threshold. Next, we’ll see an algorithm that strikes this middle ground.
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: 另一方面，控制 FDR 对少量错误更为宽容。在我们上面的例子中，在 0.01 水平上控制 FDR 意味着在我们做出的发现中，我们希望 1% 或更少的它们是错误的。这仍然比我们通过简单阈值化看到的只控制
    FPR 更为严格，但随着 m 的增长，它更容易满足，而不需要施加如此极端低的 <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value 阈值。接下来，我们将看到一个达到这个中间点的算法。
- en: The Benjamini-Hochberg Procedure[¶](#the-benjamini-hochberg-procedure "Link
    to this Section")
  id: totrans-57
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: Benjamini-Hochberg 程序[¶](#the-benjamini-hochberg-procedure "链接到本节")
- en: 'The Benjamini-Hochberg (often abbreviated to B-H) procedure is slightly more
    complicated than Bonferroni correction, but it also uses the same <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value threshold for all
    tests. The key is that we use the <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-values themselves to
    determine the threshold. Here’s how it works, for a desired FDR <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α:'
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 'Benjamini-Hochberg (通常简称为 B-H) 程序比 Bonferroni 校正稍微复杂一些，但它也使用相同的 <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value 阈值对所有测试。关键是，我们使用
    <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-values
    本身来确定阈值。以下是它的工作原理，对于一个期望的 FDR <semantics><mrow><mi>α</mi></mrow><annotation encoding="application/x-tex">\alpha</annotation></semantics>α:'
- en: First, sort the <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-values,
    and index them by <semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k
    (i.e., the first one corresponds to <semantics><mrow><mi>k</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">k=1</annotation></semantics>k=1, the second one corresponds
    to <semantics><mrow><mi>k</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">k=2</annotation></semantics>k=2,
    and so on, until the last one corresponds to <semantics><mrow><mi>k</mi><mo>=</mo><mi>m</mi></mrow><annotation
    encoding="application/x-tex">k=m</annotation></semantics>k=m)
  id: totrans-59
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 首先，对 <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-values
    进行排序，并按 <semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k
    (即，第一个对应于 <semantics><mrow><mi>k</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">k=1</annotation></semantics>k=1，第二个对应于
    <semantics><mrow><mi>k</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">k=2</annotation></semantics>k=2，以此类推，直到最后一个对应于
    <semantics><mrow><mi>k</mi><mo>=</mo><mi>m</mi></mrow><annotation encoding="application/x-tex">k=m</annotation></semantics>k=m)
- en: For each sorted <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value,
    compare it to the value <semantics><mrow><mfrac><mrow><mi>k</mi><mi>α</mi></mrow><mi>m</mi></mfrac></mrow><annotation
    encoding="application/x-tex">\frac{k\alpha}{m}</annotation></semantics>mkα​ (i.e.,
    the smallest p-value gets compared to <semantics><mrow><mi>α</mi><mi mathvariant="normal">/</mi><mi>m</mi></mrow><annotation
    encoding="application/x-tex">\alpha/m</annotation></semantics>α/m, the second-smallest
    gets compared to <semantics><mrow><mn>2</mn><mi>α</mi><mi mathvariant="normal">/</mi><mi>m</mi></mrow><annotation
    encoding="application/x-tex">2\alpha/m</annotation></semantics>2α/m, and so on,
    until the largest one gets compared to <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α)
  id: totrans-60
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 对于每个排序的<semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p值，将其与值<semantics><mrow><mfrac><mrow><mi>k</mi><mi>α</mi></mrow><mi>m</mi></mfrac></mrow><annotation
    encoding="application/x-tex">\frac{k\alpha}{m}</annotation></semantics>mkα比较（即，最小的p值与<semantics><mrow><mi>α</mi><mi
    mathvariant="normal">/</mi><mi>m</mi></mrow><annotation encoding="application/x-tex">\alpha/m</annotation></semantics>α/m比较，第二小的与<semantics><mrow><mn>2</mn><mi>α</mi><mi
    mathvariant="normal">/</mi><mi>m</mi></mrow><annotation encoding="application/x-tex">2\alpha/m</annotation></semantics>2α/m比较，以此类推，直到最大的与<semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α比较）
- en: Find the largest sorted <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    that’s still below its comparison value
  id: totrans-61
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 找到仍然低于其比较值的最大的排序<semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p值
- en: Use that <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    as the threshold
  id: totrans-62
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用该<semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p值作为阈值
