  zh: 5\. 现在我们将添加一层，以及相应的美学映射。对于谋杀数据，我们绘制了总谋杀数与人口规模的关系。探索 `murders` 数据框，以提醒自己这两个变量的名称，并选择正确的答案。**提示**：查看
