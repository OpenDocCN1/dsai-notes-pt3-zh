  zh: '[PRE42]'
- en: '*However, here the second density is drawn over the other. We can make the
    curves more visible by using alpha blending to add transparency. Set the alpha
    parameter to 0.2 in the `geom_density` function to make this change.************'
  id: totrans-225
  prefs: []
  type: TYPE_NORMAL
  zh: '*然而，在这里，第二密度是覆盖在其他密度之上的。我们可以通过使用alpha混合来增加透明度，使曲线更加明显。在`geom_density`函数中将alpha参数设置为0.2以实现这一变化。************'
