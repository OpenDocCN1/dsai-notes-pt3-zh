  id: totrans-202
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 在`ggplot`中使用`color`参数。
- en: Because we want all colors to be blue, we do not need to map colors, just use
    the color argument in `geom_label`.
  id: totrans-203
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 因为我们希望所有颜色都是蓝色，所以我们不需要映射颜色，只需在`geom_label`中使用颜色参数。
