    for this function, we learn that the only required argument is `x`, the variable
    for which we will construct a histogram. We dropped the `x` because we know it
    is the first argument. The code looks like this:'
  id: totrans-133
  prefs: []
  type: TYPE_NORMAL
  zh: '***要生成直方图，我们使用 `geom_histogram`。通过查看该函数的帮助文件，我们了解到唯一必需的参数是 `x`，这是我们将要构建直方图的变量。我们省略了
    `x`，因为我们知道它是第一个参数。代码看起来是这样的：'
- en: '[PRE26]'
  id: totrans-134
  prefs: []
  type: TYPE_PRE
  zh: '[PRE26]'
- en: '*Note that we use the optional arguments `bandwidth = 1` to change the bin
    size to 1 inch. The default is to create 30 bins. We also use the optional arguments
    `fill = "blue"` and `col = "black"` to fill the bars with colors and use a different
    color to outline the bars.****'
  id: totrans-135
  prefs: []
  type: TYPE_NORMAL
  zh: '*请注意，我们使用可选参数 `bandwidth = 1` 来改变条形大小为1英寸。默认情况下，创建30个条形。我们还使用可选参数 `fill = "blue"`
    和 `col = "black"` 来用颜色填充条形，并使用不同的颜色来勾勒条形。****'
