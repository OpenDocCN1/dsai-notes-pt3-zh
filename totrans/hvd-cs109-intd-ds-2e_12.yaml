- en: '***8.14 Geometries***'
  id: totrans-123
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '***8.14 几何形状***'
- en: '***In our illustrative example we introduced the scatterplot geometry `geom_point`.
    However, **ggplot2** has many others and here we demonstrate how to generate plots
    related to distributions, specifically the plots shown [Chapter 7](distributions.html).'
  id: totrans-124
  prefs: []
  type: TYPE_NORMAL
  zh: '***在我们的示例中，我们介绍了散点图几何形状 `geom_point`。然而，**ggplot2** 有很多其他形状，在这里我们演示如何生成与分布相关的图表，特别是第7章中显示的图表。'
- en: 8.14.1 Barplots
  id: totrans-125
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 8.14.1 条形图
- en: To generate a barplot we can use the `geom_bar` geometry. The default is to
    count the number of each category and draw a bar. Here is the plot for the regions
    of the US.
  id: totrans-126
  prefs: []
  type: TYPE_NORMAL
  zh: 要生成条形图，我们可以使用 `geom_bar` 几何形状。默认情况下，是计算每个类别的数量并绘制一个条形。以下是美国各地区的条形图。
- en: '[PRE23]'
  id: totrans-127
  prefs: []
  type: TYPE_PRE
  zh: '[PRE23]'
