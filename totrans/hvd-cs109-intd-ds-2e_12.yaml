  prefs: []
  type: TYPE_NORMAL
  zh: '*要改变y轴为对数尺度，我们学习了`[scale_x_log10()](https://ggplot2.tidyverse.org/reference/scale_continuous.html)`函数。将此层添加到对象`p`中，以更改尺度并渲染图表。*'
- en: 15\. Repeat the previous exercise but now change both axes to be in the log
    scale.
  id: totrans-208
  prefs: []
  type: TYPE_NORMAL
  zh: 15. 重复之前的练习，但现在将两个轴都改为对数尺度。
- en: '16\. Now edit the code above to add the title “Gun murder data” to the plot.
    Hint: use the `ggtitle` function.'
  id: totrans-209
  prefs: []
  type: TYPE_NORMAL
  zh: 16. 现在编辑上面的代码，向图表添加标题“枪支谋杀数据”。提示：使用`ggtitle`函数。
- en: 17\. Now we are going to use the `geom_histogram` function to make a histogram
    of the heights in the `height` data frame. When reading the documentation for
    this function we see that it requires just one mapping, the values to be used
    for the histogram. Make a histogram of all the plots.
  id: totrans-210
  prefs: []
  type: TYPE_NORMAL
  zh: 17. 现在我们将使用`geom_histogram`函数来制作`height`数据框中高度的直方图。当阅读该函数的文档时，我们看到它只需要一个映射，即用于直方图的值。制作所有图表的直方图。
- en: What is the variable containing the heights?
  id: totrans-211
  prefs: []
  type: TYPE_NORMAL
  zh: 哪个变量包含高度？
- en: '`sex`'
  id: totrans-212
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`sex`'
- en: '`heights`'
  id: totrans-213
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`heights`'
- en: '`height`'
  id: totrans-214
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`height`'
- en: '`heights$height`'
  id: totrans-215
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`heights$height`'
- en: 18\. Now create a ggplot object using the pipe to assign the heights data to
    a ggplot object. Assign `height` to the x values through the `aes` function.
  id: totrans-216
  prefs: []
  type: TYPE_NORMAL
  zh: 18. 现在创建一个ggplot对象，使用管道将高度数据分配给ggplot对象。通过`aes`函数将`height`分配给x值。
- en: 19\. Now we are ready to add a layer to actually make the histogram. Use the
    object created in the previous exercise and the `geom_histogram` function to make
    the histogram.
  id: totrans-217
  prefs: []
  type: TYPE_NORMAL
  zh: 19. 现在我们准备添加一个层来实际制作直方图。使用之前练习中创建的对象和`geom_histogram`函数来制作直方图。
- en: '20\. Note that when we run the code in the previous exercise we get the warning:
    `[stat_bin()](https://ggplot2.tidyverse.org/reference/geom_histogram.html)` using
    `bins = 30`. Pick better value with `binwidth`.'
  id: totrans-218
  prefs: []
  type: TYPE_NORMAL
  zh: 20. 注意，当我们运行上一个练习中的代码时，我们会得到警告：`[stat_bin()](https://ggplot2.tidyverse.org/reference/geom_histogram.html)`使用`bins
    = 30`。使用`binwidth`选择更好的值。
- en: Use the `binwidth` argument to change the histogram made in the previous exercise
    to use bins of size 1 inch.
  id: totrans-219
  prefs: []
  type: TYPE_NORMAL
  zh: 使用`binwidth`参数将上一个练习中制作的直方图更改为使用1英寸大小的bin。
- en: 21\. Instead of a histogram, we are going to make a smooth density plot. In
    this case we will not make an object, but instead render the plot with one line
    of code. Change the geometry in the code previously used to make a smooth density
    instead of a histogram.
  id: totrans-220
  prefs: []
  type: TYPE_NORMAL
  zh: 21. 我们将不再使用直方图，而是制作一个平滑密度图。在这种情况下，我们不会创建一个对象，而是用一行代码来渲染图表。将之前用于制作直方图的几何形状更改为制作平滑密度。
- en: 22\. Now we are going to make a density plot for males and females separately.
    We can do this using the `group` argument. We assign groups via the aesthetic
    mapping as each point needs to a group before making the calculations needed to
    estimate a density.
  id: totrans-221
  prefs: []
  type: TYPE_NORMAL
  zh: 22. 现在我们将分别为男性和女性制作密度图。我们可以使用`group`参数来完成这项工作。我们通过美学映射来分配组，因为每个点在执行估计密度的计算之前都需要属于一个组。
- en: 23\. We can also assign groups through the `color` argument. This has the added
    benefit that it uses colors to distinguish the groups. Change the code above to
    use color.
  id: totrans-222
  prefs: []
  type: TYPE_NORMAL
  zh: 23. 我们也可以通过`color`参数来分配组。这个额外的优点是它使用颜色来区分组。将上面的代码更改为使用颜色。
- en: '24\. We can also assign groups through the `fill` argument. This has the added
    benefit that it uses colors to distinguish the groups, like this:'
  id: totrans-223
  prefs: []
  type: TYPE_NORMAL
  zh: 24. 我们也可以通过`fill`参数来分配组。这个额外的优点是它使用颜色来区分组，如下所示：
