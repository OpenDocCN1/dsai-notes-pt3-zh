  prefs: []
  type: TYPE_NORMAL
  zh: '[PRE29]***'
- en: '***8.14.5 Images***'
  id: totrans-144
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '***8.14.5 图片***'
- en: '***Images were not needed for the concepts described in this chapter, but we
    will use images in [Section 10.9](dataviz-in-practice.html#sec-vaccines), so we
    introduce the two geometries used to plot images: **geom_tile** and **geom_raster**.
    They behave similarly; to see how they differ, please consult the help file. To
    create an image in **ggplot2** we need a data frame with the x and y coordinates
    as well as the values associated with each of these. Here is a data frame.'
  id: totrans-145
  prefs: []
  type: TYPE_NORMAL
  zh: '***本章中描述的概念不需要图像，但我们在 [第10.9节](dataviz-in-practice.html#sec-vaccines) 中将使用图像，因此我们介绍用于绘制图像的两个几何形状：**geom_tile**
    和 **geom_raster**。它们的行为类似；要了解它们之间的区别，请查阅帮助文件。要在 **ggplot2** 中创建图像，我们需要一个包含 x 和
    y 坐标以及与每个这些坐标相关联的值的数据框。下面是一个数据框。'
