- en: This book started out as the class notes used in the HarvardX [Data Science
    Series](https://www.edx.org/professional-certificate/harvardx-data-science)
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 本书最初是哈佛X [数据科学系列](https://www.edx.org/professional-certificate/harvardx-data-science)中使用的课堂笔记。
- en: A **hardcopy** version of the book is available from [CRC Press](https://www.routledge.com/Introduction-to-Data-Science-Data-Analysis-and-Prediction-Algorithms-with/Irizarry/p/book/9780367357986?utm_source=author&utm_medium=shared_link&utm_campaign=B043135_jm1_5ll_6rm_t081_1al_introductiontodatascienceauthorshare)
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 书的**精装版**可在[CRC Press](https://www.routledge.com/Introduction-to-Data-Science-Data-Analysis-and-Prediction-Algorithms-with/Irizarry/p/book/9780367357986?utm_source=author&utm_medium=shared_link&utm_campaign=B043135_jm1_5ll_6rm_t081_1al_introductiontodatascienceauthorshare)获取。
- en: A **free PDF** of the October 24, 2019 version of the book is available from
    [Leanpub](https://leanpub.com/datasciencebook)
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 本书2019年10月24日的版本**免费PDF**可在[Leanpub](https://leanpub.com/datasciencebook)获取。
- en: A version in **Spanish** is available from [https://rafalab.github.io/dslibro](https://rafalab.github.io/dslibro/).
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 西班牙语版本可在[https://rafalab.github.io/dslibro](https://rafalab.github.io/dslibro/)获取。
- en: This book was published with [bookdown](https://github.com/rstudio/bookdown).
    The **R markdown code** used to generate the book is available on [GitHub](https://github.com/rafalab/dsbook).
    Note that, the graphical theme used for plots throughout the book can be recreated
    using the `ds_theme_set()` function from **dslabs** package.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 本书使用[bookdown](https://github.com/rstudio/bookdown)出版。用于生成本书的**R markdown代码**可在[GitHub](https://github.com/rafalab/dsbook)上找到。请注意，书中使用的图形主题可以通过**dslabs**包中的`ds_theme_set()`函数重新创建。
