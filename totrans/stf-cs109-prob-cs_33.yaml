- en: Poisson Distribution
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 泊松分布
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part2/poisson/](https://chrispiech.github.io/probabilityForComputerScientists/en/part2/poisson/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part2/poisson/](https://chrispiech.github.io/probabilityForComputerScientists/en/part2/poisson/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: A Poisson random variable gives the probability of a given number of events
    in a fixed interval of time (or space). It makes the Poisson assumption that events
    occur with a known constant mean rate and independently of the time since the
    last event.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 泊松随机变量给出在固定时间间隔（或空间）内发生特定数量事件的概率。它假设事件以已知的恒定平均速率发生，并且与上次事件发生的时间无关。
- en: '**Poisson Random Variable**'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: '**泊松随机变量**'
- en: '| Notation: | $X \sim \Poi(\lambda)$ |'
  id: totrans-5
  prefs: []
  type: TYPE_TB
  zh: '| 符号：| $X \sim \Poi(\lambda)$ |'
- en: '| Description: | Number of events in a fixed time frame if (a) the events occur
    with a constant mean rate and (b) they occur independently of time since last
    event. |'
  id: totrans-6
  prefs: []
  type: TYPE_TB
  zh: '| 描述：| 在固定时间段内发生的事件数量，如果（a）事件以恒定的平均速率发生，并且（b）它们与上次事件发生的时间无关。|'
- en: '| Parameters: | $\lambda \in \mathbb{R}^{+}$, the constant average rate. |'
  id: totrans-7
  prefs: []
  type: TYPE_TB
  zh: '| 参数：| $\lambda \in \mathbb{R}^{+}$，恒定的平均速率。|'
- en: '| Support: | $x \in \{0, 1, \dots\}$ |'
  id: totrans-8
  prefs: []
  type: TYPE_TB
  zh: '| 支持集：| $x \in \{0, 1, \dots\}$ |'
- en: '| PMF equation: | $$\p(X=x) = \frac{\lambda^xe^{-\lambda}}{x!}$$ |'
  id: totrans-9
  prefs: []
  type: TYPE_TB
  zh: '| PMF 方程：| $$\p(X=x) = \frac{\lambda^xe^{-\lambda}}{x!}$$ |'
- en: '| Expectation: | $\E[X] = \lambda$ |'
  id: totrans-10
  prefs: []
  type: TYPE_TB
  zh: '| 期望：| $\E[X] = \lambda$ |'
- en: '| Variance: | $\var(X) = \lambda$ |'
  id: totrans-11
  prefs: []
  type: TYPE_TB
  zh: '| 方差：| $\var(X) = \lambda$ |'
- en: '| PMF graph: |'
  id: totrans-12
  prefs: []
  type: TYPE_TB
  zh: '| PMF 图：|'
- en: 'Parameter $\lambda$:'
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: '参数 $\lambda$:'
- en: '<canvas id="poissonPmf" style="max-height: 400px"></canvas>'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: '<canvas id="poissonPmf" style="max-height: 400px"></canvas>'
- en: Poisson Intuition
  id: totrans-15
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 泊松直觉
- en: In this section we show the intuition behind the Poisson derivation. It is both
    a great way to deeply understand the Poisson, as well as good practice with Binomial
    distributions.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 在本节中，我们展示了泊松推导背后的直觉。这不仅是一种深入理解泊松分布的好方法，也是对二项分布的良好实践。
- en: Let's work on the problem of predicting the chance of a given number of events
    occurring in a fixed time interval — the next minute. For example, imagine you
    are working on a ride sharing application and you care about the probability of
    how many requests you get from a particular area. From historical data, you know
    that the average requests per minute is $\lambda = 5$. What is the probability
    of getting 1, 2, 3, etc requests in a minute?
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们来解决预测在固定时间段（下一分钟）内发生特定数量事件概率的问题。例如，假设你正在开发一个共享出行应用程序，你关心特定区域收到的请求数量的概率。根据历史数据，你知道每分钟的请求平均数为
    $\lambda = 5$。在一分钟内收到1个、2个、3个等请求的概率是多少？
- en: '*: We could approximate a solution to this problem by using a binomial distribution!
    Lets say we split our minute into 60 seconds, and make each second an [indicator
    Bernoulli](../../part2/bernoulli) variable — you either get a request or you don''t.
    If you get a request in a second, the indicator is 1\. Otherwise it is 0\. Here
    is a visualization of our 60 binary-indicators. In this example imagine we have
    requests at 2.75 and 7.12 seconds. the corresponding indicator variables are blue
    filled in boxes:*'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: '*：我们可以通过使用二项分布来近似解决这个问题！假设我们将一分钟分成60秒，并将每一秒作为一个[指示伯努利](../../part2/bernoulli)变量——你要么收到请求，要么不收。如果你在一秒内收到请求，指示变量为1。否则为0。以下是我们的60个二元指示变量的可视化。在这个例子中，假设我们在2.75秒和7.12秒收到请求，相应的指示变量是蓝色填充的方框：*'
- en: '*1 minute'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: '*1 分钟'
- en: 'The total number of requests received over the minute can be approximated as
    the sum of the sixty indicator variables, which conveniently matches the description
    of a [binomial](../../part2/binomial) — a sum of Bernoullis. Specifically define
    $X$ to be the number of requests in a minute. $X$ is a binomial with $n=60$ trials.
    What is the probability, $p$, of a success on a single trial? To make the expectation
    of $X$ equal the observed historical average $\lambda =5$ we should choose $p$
    so that $\lambda = \E[X]$. $$ \begin{align} \lambda &= \E[X] && \text{Expectation
    matches historical average} \\ \lambda &= n \cdot p && \text{Expectation of a
    Binomial is } n \cdot p \\ p &= \frac{\lambda}{n} && \text{Solving for $p$} \end{align}
    $$ In this case since $\lambda=5$ and $n=60$, we should choose $p=5/60$ and state
    that $X \sim \Bin(n=60, p=5/60)$. Now that we have a form for $X$ we can answer
    probability questions about the number of requests by using the Binomial PMF:
    $$\p(X = x) = {n \choose x} p^x (1-p)^{n-x}$$'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 在一分钟内接收到的总请求数可以近似为六十个指示变量的和，这恰好符合二项分布——伯努利分布的和的描述。具体定义 $X$ 为一分钟内的请求数。$X$ 是一个有
    $n=60$ 次试验的二项分布。在单次试验中成功的概率 $p$ 是多少？为了使 $X$ 的期望值等于观察到的历史平均值 $\lambda =5$，我们应该选择
    $p$ 使得 $\lambda = \E[X]$。$$ \begin{align} \lambda &= \E[X] && \text{期望值与历史平均值匹配}
    \\ \lambda &= n \cdot p && \text{二项分布的期望值是 } n \cdot p \\ p &= \frac{\lambda}{n}
    && \text{求解 $p$} \end{align} $$ 在这个例子中，由于 $\lambda=5$ 且 $n=60$，我们应该选择 $p=5/60$
    并声明 $X \sim \Bin(n=60, p=5/60)$。现在我们有了 $X$ 的形式，我们可以通过使用二项分布的概率质量函数来回答关于请求数量的概率问题：$$\p(X
    = x) = {n \choose x} p^x (1-p)^{n-x}$$
- en: So for example:$$\p(X=1) = {60 \choose 1} (5/60)^1 (55/60)^{60-1} \approx 0.0295$$
    $$\p(X=2) = {60 \choose 2} (5/60)^2 (55/60)^{60-2} \approx 0.0790$$ $$\p(X=3)
    = {60 \choose 3} (5/60)^3 (55/60)^{60-3} \approx 0.1389$$ Great! But don't forget
    that this was an approximation. We didn't account for the fact that there can
    be more than one event in a single second. One way to assuage this issue is to
    divide our minute into more fine-grained intervals (the choice to split it into
    60 seconds was rather arbitrary). Instead lets divide our minute into 600 deciseconds,
    again with requests at 2.75 and 7.12 seconds:1 minute
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 例如：$$\p(X=1) = {60 \choose 1} (5/60)^1 (55/60)^{60-1} \approx 0.0295$$ $$\p(X=2)
    = {60 \choose 2} (5/60)^2 (55/60)^{60-2} \approx 0.0790$$ $$\p(X=3) = {60 \choose
    3} (5/60)^3 (55/60)^{60-3} \approx 0.1389$$ 很好！但别忘了这只是一个近似。我们没有考虑到在单个秒内可能发生多个事件的事实。解决这个问题的方法之一是将我们的分钟分割成更细的区间（将它们分割成60秒的选择相当随意）。相反，让我们将我们的分钟分割成600分秒，再次在2.75秒和7.12秒有请求：1
    分钟
- en: 'Now $n=600$, $p=5/600$ and $X \sim \Bin(n=600, p=6/600)$. We can repeat our
    example calculations using this better approximation: $$\p(X=1) = {600 \choose
    1} (5/600)^1 (595/60)^{600-1} \approx 0.0333$$ $$\p(X=2) = {600 \choose 2} (5/600)^2
    (595/600)^{600-2} \approx 0.0837$$ $$\p(X=3) = {600 \choose 3} (5/600)^3 (595/600)^{600-3}
    \approx 0.1402$$'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 现在 $n=600$，$p=5/600$，且 $X \sim \Bin(n=600, p=6/600)$。我们可以使用这个更好的近似重复我们的示例计算：$$\p(X=1)
    = {600 \choose 1} (5/600)^1 (595/60)^{600-1} \approx 0.0333$$ $$\p(X=2) = {600
    \choose 2} (5/600)^2 (595/600)^{600-2} \approx 0.0837$$ $$\p(X=3) = {600 \choose
    3} (5/600)^3 (595/600)^{600-3} \approx 0.1402$$
- en: 'Choose any value of $n$, the number of buckets to divide our minute into:'
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 选择任何 $n$ 的值，这是我们分割分钟的桶的数量：
- en: The larger $n$ is, the more accurate the approximation. So what happens when
    $n$ is infinity? It becomes a Poisson!
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: $n$ 越大，近似值越准确。那么当 $n$ 是无穷大时会发生什么？它变成了泊松分布！
- en: Poisson, a Binomial in the limit
  id: totrans-25
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 泊松分布，二项分布的极限
- en: 'Or if we really cared about making sure that we don''t get two events in the
    same bucket, we can divide our minute into infinitely small buckets:'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 或者，如果我们真的关心确保我们不会在同一个桶中出现两个事件，我们可以将我们的分钟分割成无限小的桶：
- en: 1 minute
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: 1 分钟
- en: '***Proof***: Derivation of the Poisson'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: '***证明***：泊松分布的推导'
- en: 'What does the PMF of $X$ look like now that we have infinite divisions of our
    minute? We can write the equation and think about it as $n$ goes to infinity.
    Recall that $p$ still equals $\lambda/n$:'
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们将我们的分钟无限分割，$X$ 的概率质量函数（PMF）看起来会是什么样子？我们可以写出方程，并随着 $n$ 趋向于无穷大来思考它。回想一下，$p$
    仍然等于 $\lambda/n$：
- en: $$ \P(X=x) = \lim_{n \rightarrow \infty} {n \choose x} (\lambda / n)^x(1-\lambda/n)^{n-x}
    $$
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: $$ \P(X=x) = \lim_{n \rightarrow \infty} {n \choose x} (\lambda / n)^x(1-\lambda/n)^{n-x}
    $$
- en: 'While it may look intimidating, this expression simplifies nicely. This proof
    uses a few special limit rules that we haven''t introduced in this book:'
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: 虽然这个表达式看起来可能令人畏惧，但它简化得很好。这个证明使用了我们在这本书中没有介绍的一些特殊的极限规则：
- en: '$$ \begin{align} \P(X=x) &= \lim_{n \rightarrow \infty} {n \choose x} (\lambda
    / n)^x(1-\lambda/n)^{n-x} && \text{Start: binomial in the limit}\\ &= \lim_{n
    \rightarrow \infty} {n \choose x} \cdot \frac{\lambda^x}{n^x} \cdot \frac{(1-\lambda/n)^{n}}{(1-\lambda/n)^{x}}
    && \text{Expanding the power terms} \\ &= \lim_{n \rightarrow \infty} \frac{n!}{(n-x)!x!}
    \cdot \frac{\lambda^x}{n^x} \cdot \frac{(1-\lambda/n)^{n}}{(1-\lambda/n)^{x}}
    && \text{Expanding the binomial term} \\ &= \lim_{n \rightarrow \infty} \frac{n!}{(n-x)!x!}
    \cdot \frac{\lambda^x}{n^x} \cdot \frac{e^{-\lambda}}{(1-\lambda/n)^{x}} && \href{http://www.sosmath.com/calculus/sequence/specialim/specialim.html}{\text{Rule
    }} \lim_{n \rightarrow \infty}(1-\lambda/n)^{n} = e^{-\lambda}\\ &= \lim_{n \rightarrow
    \infty} \frac{n!}{(n-x)!x!} \cdot \frac{\lambda^x}{n^x} \cdot \frac{e^{-\lambda}}{1}
    && \href{https://www.youtube.com/watch?v=x1WBTBtfvjM}{\text{Rule }} \lim_{n \rightarrow
    \infty}\lambda/n= 0\\ &= \lim_{n \rightarrow \infty} \frac{n!}{(n-x)!} \cdot \frac{1}{x!}
    \cdot \frac{\lambda^x}{n^x} \cdot \frac{e^{-\lambda}}{1} && \text{Splitting first
    term}\\ &= \lim_{n \rightarrow \infty} \frac{n^x}{1} \cdot \frac{1}{x!} \cdot
    \frac{\lambda^x}{n^x} \cdot \frac{e^{-\lambda}}{1} && \lim_{n \rightarrow \infty
    }\frac{n!}{(n-x)!} = n^x\\ &= \lim_{n \rightarrow \infty} \frac{\lambda^x}{x!}
    \cdot \frac{e^{-\lambda}}{1} && \text{Cancel }n^x\\ &= \frac{\lambda^x \cdot e^{-\lambda}}{x!}
    && \text{Simplify}\\ \end{align} $$'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: $$ \begin{align} \P(X=x) &= \lim_{n \rightarrow \infty} {n \choose x} (\lambda
    / n)^x(1-\lambda/n)^{n-x} && \text{开始：极限中的二项式}\\ &= \lim_{n \rightarrow \infty}
    {n \choose x} \cdot \frac{\lambda^x}{n^x} \cdot \frac{(1-\lambda/n)^{n}}{(1-\lambda/n)^{x}}
    && \text{展开幂次项} \\ &= \lim_{n \rightarrow \infty} \frac{n!}{(n-x)!x!} \cdot \frac{\lambda^x}{n^x}
    \cdot \frac{(1-\lambda/n)^{n}}{(1-\lambda/n)^{x}} && \text{展开二项式项} \\ &= \lim_{n
    \rightarrow \infty} \frac{n!}{(n-x)!x!} \cdot \frac{\lambda^x}{n^x} \cdot \frac{e^{-\lambda}}{(1-\lambda/n)^{x}}
    && \href{http://www.sosmath.com/calculus/sequence/specialim/specialim.html}{\text{规则
    }} \lim_{n \rightarrow \infty}(1-\lambda/n)^{n} = e^{-\lambda}\\ &= \lim_{n \rightarrow
    \infty} \frac{n!}{(n-x)!x!} \cdot \frac{\lambda^x}{n^x} \cdot \frac{e^{-\lambda}}{1}
    && \href{https://www.youtube.com/watch?v=x1WBTBtfvjM}{\text{规则 }} \lim_{n \rightarrow
    \infty}\lambda/n= 0\\ &= \lim_{n \rightarrow \infty} \frac{n!}{(n-x)!} \cdot \frac{1}{x!}
    \cdot \frac{\lambda^x}{n^x} \cdot \frac{e^{-\lambda}}{1} && \text{拆分第一项}\\ &=
    \lim_{n \rightarrow \infty} \frac{n^x}{1} \cdot \frac{1}{x!} \cdot \frac{\lambda^x}{n^x}
    \cdot \frac{e^{-\lambda}}{1} && \lim_{n \rightarrow \infty }\frac{n!}{(n-x)!}
    = n^x\\ &= \lim_{n \rightarrow \infty} \frac{\lambda^x}{x!} \cdot \frac{e^{-\lambda}}{1}
    && \text{消去 }n^x\\ &= \frac{\lambda^x \cdot e^{-\lambda}}{x!} && \text{简化}\\ \end{align}
    $$
- en: 'That is a beautiful expression! Now we can calculate the real probability of
    number of requests in a minute, if the historical average is $\lambda=5$:'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 这是一个美丽的表达式！现在我们可以计算每分钟请求数量的实际概率，如果历史平均值为 $\lambda=5$：
- en: $$\p(X=1) = \frac{5^1 \cdot e^{-5}}{1!} = 0.03369$$ $$\p(X=2) = \frac{5^2 \cdot
    e^{-5}}{2!}= 0.08422$$ $$\p(X=3) = \frac{5^3 \cdot e^{-5}}{3!} = 0.14037$$
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: $$\p(X=1) = \frac{5^1 \cdot e^{-5}}{1!} = 0.03369$$ $$\p(X=2) = \frac{5^2 \cdot
    e^{-5}}{2!}= 0.08422$$ $$\p(X=3) = \frac{5^3 \cdot e^{-5}}{3!} = 0.14037$$
- en: This is both more accurate and much easier to compute!
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: 这既更准确，也更容易计算！
- en: Changing time frames
  id: totrans-36
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 改变时间框架
- en: Say you are given a rate over one unit of time, but you want to know the rate
    in another unit of time. For example, you may be given the rate of hits to a website
    per minute, but you want to know the probability over a 20 minute period. You
    would just need to multiply this rate by 20 in order to go from the "per 1 minute
    of time" rate to obtain the "per 20 minutes of time" rate.*
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: 假设你被给出一个单位时间内的速率，但你想要知道另一个单位时间内的速率。例如，你可能被给出每分钟的网站点击率，但你想要知道20分钟内的概率。你只需将这个速率乘以20，就可以从“每1分钟时间”的速率转换为“每20分钟时间”的速率。*
