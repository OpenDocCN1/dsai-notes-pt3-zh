    stretchy="false">)</mo><mo stretchy="false">)</mo><mo>≥</mo><msubsup><mi>G</mi><mi>T</mi><mrow><mo>−</mo><mn>1</mn></mrow></msubsup><mo
    stretchy="false">(</mo><mi>p</mi><mo stretchy="false">)</mo><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi mathvariant="double-struck">P</mi><mo
    stretchy="false">(</mo><mi>T</mi><mo>≥</mo><msubsup><mi>G</mi><mi>T</mi><mrow><mo>−</mo><mn>1</mn></mrow></msubsup><mo
    stretchy="false">(</mo><mi>p</mi><mo stretchy="false">)</mo><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} F_P(p) &= \mathbb{P}(G_T(T) \leq p)
    \\ &= \mathbb{P}(G_T^{-1}(G_T(T)) \geq G_T^{-1}(p)) \\ &= \mathbb{P}(T \geq G_T^{-1}(p))
    \end{align*}</annotation></semantics>FP​(p)​=P(GT​(T)≤p)=P(GT−1​(GT​(T))≥GT−1​(p))=P(T≥GT−1​(p))​[(2)](#rqdiCZkhK6
    "Link to this Equation")
