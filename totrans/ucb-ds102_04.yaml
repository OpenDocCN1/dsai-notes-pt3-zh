    encoding="application/x-tex">\begin{align*} G_T(t) &= \mathbb{P}(T \geq t) & \text{(定义尾部累积分布函数)}\\
    P &= G_T(T) & \text{(定义p值)} \\ F_P(p) &= \mathbb{P}(P \leq p) & \text{(定义累积分布函数)}\\
    &= \mathbb{P}(G_T(T) \leq p) & \\ &= \mathbb{P}(G_T^{-1}(G_T(T)) \geq G_T^{-1}(p))
