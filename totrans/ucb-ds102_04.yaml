    "链接到这个方程")
- en: 'Consider the function <semantics><mrow><msubsup><mi>G</mi><mi>T</mi><mrow><mo>−</mo><mn>1</mn></mrow></msubsup></mrow><annotation
    encoding="application/x-tex">G_T^{-1}</annotation></semantics>GT−1​, the inverse
    of <semantics><mrow><msub><mi>G</mi><mi>T</mi></msub></mrow><annotation encoding="application/x-tex">G_T</annotation></semantics>GT​.
    Both <semantics><mrow><msub><mi>G</mi><mi>T</mi></msub></mrow><annotation encoding="application/x-tex">G_T</annotation></semantics>GT​
    and its inverse are monotonically non-increasing: in other words, if <semantics><mrow><mi>a</mi><mo>></mo><mi>b</mi></mrow><annotation
    encoding="application/x-tex">a > b</annotation></semantics>a>b, then <semantics><mrow><msub><mi>G</mi><mi>T</mi></msub><mo
    stretchy="false">(</mo><mi>a</mi><mo stretchy="false">)</mo><mo>≤</mo><msub><mi>G</mi><mi>T</mi></msub><mo
    stretchy="false">(</mo><mi>b</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">G_T(a) \leq G_T(b)</annotation></semantics>GT​(a)≤GT​(b),
    and <semantics><mrow><msubsup><mi>G</mi><mi>T</mi><mrow><mo>−</mo><mn>1</mn></mrow></msubsup><mo
    stretchy="false">(</mo><mi>a</mi><mo stretchy="false">)</mo><mo>≤</mo><msubsup><mi>G</mi><mi>T</mi><mrow><mo>−</mo><mn>1</mn></mrow></msubsup><mo
    stretchy="false">(</mo><mi>b</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">G_T^{-1}(a) \leq G_T^{-1}(b)</annotation></semantics>GT−1​(a)≤GT−1​(b).
    So, we can apply the function <semantics><mrow><msubsup><mi>G</mi><mi>T</mi><mrow><mo>−</mo><mn>1</mn></mrow></msubsup></mrow><annotation
    encoding="application/x-tex">G_T^{-1}</annotation></semantics>GT−1​ to both sides
    of the inequality above, which flips the inequality:'
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
  zh: 考虑函数 <semantics><mrow><msubsup><mi>G</mi><mi>T</mi><mrow><mo>−</mo><mn>1</mn></mrow></msubsup></mrow><annotation
    encoding="application/x-tex">G_T^{-1}</annotation></semantics>GT−1，它是 <semantics><mrow><msub><mi>G</mi><mi>T</mi></msub></mrow><annotation
    encoding="application/x-tex">G_T</annotation></semantics>GT 的逆函数。GT 和它的逆函数都是单调非增的：换句话说，如果
    <semantics><mrow><mi>a</mi><mo>></mo><mi>b</mi></mrow><annotation encoding="application/x-tex">a
    > b</annotation></semantics>a>b，那么 <semantics><mrow><msub><mi>G</mi><mi>T</mi></msub><mo
    stretchy="false">(</mo><mi>a</mi><mo stretchy="false">)</mo><mo>≤</mo><msub><mi>G</mi><mi>T</mi></msub><mo
    stretchy="false">(</mo><mi>b</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">G_T(a) \leq G_T(b)</annotation></semantics>GT(a)≤GT(b)，以及
    <semantics><mrow><msubsup><mi>G</mi><mi>T</mi><mrow><mo>−</mo><mn>1</mn></mrow></msubsup><mo
    stretchy="false">(</mo><mi>a</mi><mo stretchy="false">)</mo><mo>≤</mo><msubsup><mi>G</mi><mi>T</mi><mrow><mo>−</mo><mn>1</mn></mrow></msubsup><mo
    stretchy="false">(</mo><mi>b</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">G_T^{-1}(a) \leq G_T^{-1}(b)</annotation></semantics>GT−1(a)≤GT−1(b)。因此，我们可以将函数
    <semantics><mrow><msubsup><mi>G</mi><mi>T</mi><mrow><mo>−</mo><mn>1</mn></mrow></msubsup></mrow><annotation
    encoding="application/x-tex">G_T^{-1}</annotation></semantics>GT−1 应用于上述不等式的两边，这将反转不等式的方向：
