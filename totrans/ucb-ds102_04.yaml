- en: '*You may find it helpful to review [Chapter 11](https://inferentialthinking.com/chapters/11/Testing_Hypotheses.html)
    and [Chapter 12](https://inferentialthinking.com/chapters/12/Comparing_Two_Samples.html)
    of the Data 8 textbook, which cover the basics of hypothesis testing.*'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: '*你可能发现回顾数据8教科书的第11章[测试假设](https://inferentialthinking.com/chapters/11/Testing_Hypotheses.html)和第12章[比较两个样本](https://inferentialthinking.com/chapters/12/Comparing_Two_Samples.html)会有所帮助，这两章涵盖了假设检验的基础知识。*'
- en: 'Hypothesis testing is a specific kind of binary decision-making problem. Although
    the **null hypothesis statistical test (NHST)** framework has been criticized
    in recent years, it still provides a useful framework for making decisions from
    data. We’ll explore these criticisms later, but to start, here’s a quick refresher
    on how the process works:'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 假设检验是一种特定的二元决策问题。尽管近年来**零假设统计检验（NHST）**框架受到了批评，但它仍然为从数据中做出决策提供了一个有用的框架。我们将在稍后探讨这些批评，但首先，这里有一个关于这个过程如何工作的快速复习：
- en: 'Determine the viewpoint that you want to test, and decide on:'
  id: totrans-6
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 确定你想要测试的观点，并决定：
- en: 'Null hypothesis: a chance model under which you can either simulate data or
    analytically compute the distribution of data'
  id: totrans-7
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 零假设：一个可以模拟数据或通过分析计算数据分布的随机模型
- en: 'Alternative hypothesis: viewpoint from the question'
  id: totrans-8
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 备择假设：问题的观点
- en: 'Test statistic: quantity computed from your data to help you decide between
    the two hypotheses (in this book, we’ll always use the convention that larger
    values of the test statistic should favor the alternative hypothesis, without
    loss of generality).'
  id: totrans-9
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 检验统计量：从你的数据中计算出的量，帮助你在这两个假设之间做出决定（在这本书中，我们将始终使用惯例，即检验统计量的较大值应有利于备择假设，不失一般性）。
- en: Compute the value of the test statistic on your data.
  id: totrans-10
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 计算你数据上的检验统计量值。
- en: Compute the distribution of the test statistic under the null distribution,
    either by simulation or analytically.
  id: totrans-11
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 通过模拟或分析计算零假设下的检验统计量分布。
- en: 'Compute a p-value: this is the probability, if the null hypothesis is true,
    of obtaining a test statistic that is equal to or larger than the observed value.'
  id: totrans-12
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 计算p值：这是在零假设为真的情况下，获得一个等于或大于观察值的测试统计量的概率。
- en: 'Compare that p-value to some threshold: if the p-value is smaller than the
    threshold, our test statistic was very unlikely under the null, so our data support
    the alternative hypothesis. If the p-value is larger, then the data support the
    null hypothesis.'
  id: totrans-13
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 将该p值与某个阈值进行比较：如果p值小于阈值，则我们的测试统计量在零假设下非常不可能，因此我们的数据支持备择假设。如果p值较大，则数据支持零假设。
- en: '[PRE1]'
  id: totrans-14
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: Hypothesis testing and binary decision-making[¶](#hypothesis-testing-and-binary-decision-making
    "Link to this Section")
  id: totrans-15
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 假设检验与二元决策[¶](#hypothesis-testing-and-binary-decision-making "链接到本节")
- en: We’ll frame hypothesis testing as a binary decision-making problem, where we
    decide between the null and alternative hypotheses, and we assume that one of
    them is true (note that this framing is flawed; see below for more). In this case,
    **reality** corresponds to which hypothesis is actually true, and we make our
    **decision** based on the p-values.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将假设检验框架化为一个二元决策问题，其中我们在零假设和备择假设之间做出选择，并假设其中一个是真实的（注意，这种框架是有缺陷的；下面将进行更多说明）。在这种情况下，**现实**对应于哪个假设实际上是真实的，我们根据p值做出**决策**。
- en: 'In order to translate the p-values into binary decisions, we’ll have to decide
    on some threshold(s) for doing so: we’ll spend the rest of this chapter analyzing
    different ways to pick this threshold (or thresholds), and what assumptions are
    encoded in each one.'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 为了将p值转换为二元决策，我们必须决定一些阈值：我们将在本章的剩余部分分析选择此阈值（或阈值）的不同方法，以及每个方法中编码的假设。
- en: 'Here are some important notes about conventions and vocabulary:'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 以下是关于惯例和词汇的一些重要说明：
- en: By convention, we’ll always define the null hypothesis as 0, and the alternative
    hypothesis as 1.
  id: totrans-19
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 按照惯例，我们将始终将零假设定义为0，将备择假设定义为1。
- en: 'We’ll use the following terms interchangeably (in other words, they all mean
    the same thing):'
  id: totrans-20
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 我们将以下术语互换使用（换句话说，它们都意味着同一件事）：
- en: “reject the null hypothesis”
  id: totrans-21
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: “拒绝零假设”
- en: “make a discovery”
  id: totrans-22
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: “做出发现”
- en: “make a decision of 1” (<semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">D = 1</annotation></semantics>D=1)
  id: totrans-23
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: “做出1的决策” (<semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">D = 1</annotation></semantics>D=1)
- en: Limitations of binary outlook on hypothesis testing[¶](#limitations-of-binary-outlook-on-hypothesis-testing
    "Link to this Section")
  id: totrans-24
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 假设检验二元视角的局限性[¶](#limitations-of-binary-outlook-on-hypothesis-testing "链接到本节")
- en: In many cases, the null and alternative hypotheses are not necessarily mutually
    exclusive! When we make a discovery, or equivalently, reject the null hypothesis,
    this only means that **the data we observed are unlikely if the null hypothesis
    is true**. In many cases, this doesn’t necessarily mean that the alternative hypothesis
    is true! A rejection of the null hypothesis is often only one step toward showing
    an alternative hypothesis that we’re interested in.
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: 在许多情况下，零假设和备择假设不一定是不相容的！当我们做出发现，或者等价地，拒绝零假设时，这只意味着**如果我们假设零假设为真，我们观察到的数据是不太可能的**。在许多情况下，这并不一定意味着备择假设是真实的！拒绝零假设通常只是向我们感兴趣的其他备择假设迈出的第一步。
- en: For example, consider a blood pressure drug trial, where researchers want to
    show that the drug lowers blood pressure. They conduct a randomized experiment
    to measure the drug’s effects. They precisely state their null hypothesis, that
    the drug has no effect on blood pressure, as “there is no difference in the distribution
    of blood pressure changes between the population of people who take the drug and
    the population of people who don’t”. Since they’re interested in showing a decrease
    (rather than just a change), they state their alternative hypothesis, that the
    drug lowers blood pressure, as “the distribution of blood pressure changes in
    people who take the drug is lower than the distribution for people who don’t”.
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，考虑一个血压药物试验，研究人员想要证明该药物可以降低血压。他们进行随机实验来测量药物的效果。他们精确地陈述他们的零假设，即药物对血压没有影响，为“在服用药物的群体和未服用药物的群体之间，血压变化分布没有差异”。由于他们感兴趣的是显示降低（而不仅仅是变化），他们将备择假设，即药物降低血压，陈述为“服用药物的群体血压变化分布低于未服用药物的群体”。
- en: 'In general, in this situation, consider the following four statements:'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: 通常情况下，在这种情况下，考虑以下四个陈述：
- en: 'The null hypothesis: *the outcomes for treatment/control follow the same distribution*'
  id: totrans-28
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 零假设：*治疗/对照组的结果遵循相同的分布*
- en: 'The logical complement of the null hypothesis: *the outcomes for treatment/control
    do **not** follow the same distribution* (direct logical inversion of the null
    hypothesis)'
  id: totrans-29
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 零假设的逻辑补：*治疗/对照组的结果**不**遵循相同的分布*（零假设的直接逻辑逆）
- en: 'The alternative hypothesis: *the outcomes if treated follow a lower-mean distribution
    than the outcomes if untreated*'
  id: totrans-30
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 备择假设：*如果接受治疗，结果将遵循比未接受治疗时更低均值的分布*
- en: 'What the researchers actually want to show: *the drug lowers blood pressure
    in a clinically meaningful and beneficial way*'
  id: totrans-31
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 研究人员实际上想要展示的是：*药物以临床上有意义和有益的方式降低血压*
- en: 'Let’s visualize the space of possible outcomes to help us understand the relationship
    between these four statements:'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们可视化可能的结果空间，以帮助我们理解这四个陈述之间的关系：
- en: '![nhst_outcomes_diagram.png](../Images/925e0f5a1b994b6cf222104c40b75882.png)'
  id: totrans-33
  prefs: []
  type: TYPE_IMG
  zh: '![nhst_outcomes_diagram.png](../Images/925e0f5a1b994b6cf222104c40b75882.png)'
- en: 'Consider the case where we reject the null hypothesis. Without knowing any
    other information, if we want to make a binary decision, we can only decide that
    statement 2 is true (i.e., that the truth lies somewhere in the entire blue-colored
    region on the right side). But in practice, we want to make a binary decision
    between statements 1 (orange-colored left side) and 4 (smallest dark blue oval):
    in other words, we want to show that either there is no effect, or there is a
    meaningful effect in the direction that we’re interested in. In order to do this,
    we must rule out all the other possibilities.'
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: 考虑我们拒绝零假设的情况。在不知道任何其他信息的情况下，如果我们想要做出二元决策，我们只能决定陈述2是正确的（即，真相位于右侧整个蓝色区域的某个地方）。但在实践中，我们希望在陈述1（左侧橙色区域）和陈述4（最小的深蓝色椭圆）之间做出二元决策：换句话说，我们想要表明要么没有效果，要么在我们感兴趣的方向上有有意义的效果。为了做到这一点，我们必须排除所有其他可能性。
- en: We can rule out some of these possibilities through smart statistical choices.
    For example, the researchers decided on a one-tailed test (i.e., using the alternative
    hypothesis “the outcome is lower”) rather than a two-tailed test (i.e., using
    the alternative hypothesis “the outcome is different”), and chose a test statistic
    that reflects that (e.g., difference between treatment/control means, rather than
    absolute difference). This ensures that our binary decision is between statement
    1, the null hypothesis (orange area on the left), and statement 3, the alternative
    hypothesis they chose (larger blue ellipse on the right).
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以通过明智的统计选择排除一些可能性。例如，研究人员决定进行单尾检验（即，使用备择假设“结果较低”）而不是双尾检验（即，使用备择假设“结果不同”），并选择反映这一点的检验统计量（例如，治疗/对照组均值之间的差异，而不是绝对差异）。这确保了我们的二元决策是在陈述1，零假设（左侧的橙色区域）和陈述3，他们选择的备择假设（右侧较大的蓝色椭圆）之间。
- en: In order for our binary decision to be meaningful, we need to eliminate possibilities
    outside statement 4 (the small blue oval). In order to do this, we must ensure
    **good experimental design** and **good statistical practices**. This includes
    avoiding confounding variables, ensuring that our effect sizes are meaningful
    in the real world, avoiding practices such as p-hacking and multiple testing (see
    the next section for more on these), and so on.
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 为了使我们的二元决策有意义，我们需要排除陈述4（小蓝色椭圆）之外的可能性。为了做到这一点，我们必须确保**良好的实验设计**和**良好的统计实践**。这包括避免混杂变量，确保我们的效应量在现实世界中是有意义的，避免诸如p-hacking和多重检验等做法（下一节将详细介绍这些），等等。
- en: '*Exercise*: For each of the possible outcomes below, determine where they fall
    on the diagram above.'
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: '*练习*：对于以下每种可能的结果，确定它们在上述图中的位置。'
- en: The drug consistently lowers blood pressure, but by an amount that is medically
    insignificant (i.e., the decrease has no meaningful impact on any other biological
    processes in the body, or any other clinical outcomes).
  id: totrans-38
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 药物持续降低血压，但降低的量在医学上不具意义（即，降低对体内任何其他生物过程或任何其他临床结果都没有有意义的影响）。
- en: The drug raises blood pressure.
  id: totrans-39
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 药物升高血压。
- en: The drug lowers blood pressure by an amount that is potentially dangerous in
    certain individuals.
  id: totrans-40
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 药物降低血压的量对某些人来说可能危险。
- en: The drug was originally designed to lower cholesterol, but after expensive and
    unsuccessful trials on cholesterol, the pharmaceutical company’s researchers decided
    to look at ten other factors, and found that blood pressure happened to be lower
    in the treatment group. However, this finding was due to chance.
  id: totrans-41
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 该药物最初是为了降低胆固醇而设计的，但在对胆固醇进行的昂贵且不成功的试验之后，制药公司的研究人员决定考虑其他十个因素，并发现治疗组的血压恰好较低。然而，这个发现是偶然的。
- en: 'From these examples, we can see that conducting a hypothesis test is not a
    decisive statement: instead, it should be viewed as one step within a larger process.'
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: 从这些例子中，我们可以看到进行假设检验并不是一个决定性的陈述：相反，它应该被视为更大过程中的一个步骤。
- en: Connecting <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-values
    with false positive rate[¶](#connecting-p-values-with-false-positive-rate "Link
    to this Section")
  id: totrans-43
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 将 <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p
    值与假阳性率连接[¶](#connecting-p-values-with-false-positive-rate "链接到本节")
- en: '*You may find it helpful to review [Chapter 15](http://prob140.org/textbook/content/Chapter_15/01_Density_and_CDF.html)
    of the Data 140 textbook, which covers continuous random variables.*'
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: '*你可能觉得回顾数据 140 教科书中的第 15 章（http://prob140.org/textbook/content/Chapter_15/01_Density_and_CDF.html）会有所帮助，该章涵盖了连续随机变量。*'
- en: We’ll work through a few exercises to help us understand the connection between
    <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-values
    and the error rates described in the previous section. In the process, we’ll get
    some practice reasoning about probabilities, and learn some important facts about
    the distribution of <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-values
    under the null hypothesis.
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将通过几个练习来帮助我们理解 <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p
    值与上一节中描述的错误率之间的关系。在这个过程中，我们将练习推理概率，并了解关于零假设下 <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p 值分布的一些重要事实。
- en: '**Exercise 1**: Suppose the null hypothesis is true. In this case, what is
    the probability of obtaining a <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    less than 0.05?'
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: '**练习 1**：假设零假设是正确的。在这种情况下，获得一个小于 0.05 的 <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p 值的概率是多少？'
- en: '**Solution**: In order to answer this question, we’ll look at the distribution
    of the test statistic under the null hypothesis, and use what we know about probabilities.
    If the null hypothesis is true, then the test statistic comes from some distribution
    that we can either simulate or analytically compute. We’ll represent it visually
    as follows. Note that everything we’re about to conclude is true even if the shape
    of the distribution is very different: we’re only making it to facilitate easy
    visualization.'
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: '**解答**：为了回答这个问题，我们将查看零假设下的测试统计量的分布，并使用我们所知道的关于概率的知识。如果零假设是正确的，那么测试统计量来自某个我们可以模拟或解析计算的分布。我们将如下直观地表示它。请注意，即使分布的形状非常不同，我们即将得出的所有结论都是真实的：我们只是在便于可视化。'
- en: '[PRE2]'
  id: totrans-48
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: '![<Figure size 500x200 with 1 Axes>](../Images/433c5aaf96528dc63d835b05bb10aee2.png)'
  id: totrans-49
  prefs: []
  type: TYPE_IMG
  zh: '![<Figure size 500x200 with 1 Axes>](../Images/433c5aaf96528dc63d835b05bb10aee2.png)'
- en: 'What does it mean to obtain a <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value less than 0.05?
    This happens when our test statistic is large enough that it’s unlikely according
    to the null distribution. Specifically, let’s choose a particular value of the
    test statistic <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a,
    chosen such that the area under the curve to the right of <semantics><mrow><mi>a</mi></mrow><annotation
    encoding="application/x-tex">a</annotation></semantics>a is 0.05:'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: 获得一个小于 0.05 的 <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p
    值意味着什么？这发生在我们的测试统计量足够大，根据零分布不太可能的情况下。具体来说，让我们选择一个特定的测试统计量 <semantics><mrow><mi>a</mi></mrow><annotation
    encoding="application/x-tex">a</annotation></semantics>a 的值，选择这样一个值，使得曲线右侧的面积是
    0.05：
- en: '[PRE3]'
  id: totrans-51
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: '![<Figure size 500x200 with 1 Axes>](../Images/49859bbe682c05d6d326bb7e8cd7cb06.png)'
  id: totrans-52
  prefs: []
  type: TYPE_IMG
  zh: '![<Figure size 500x200 with 1 Axes>](../Images/49859bbe682c05d6d326bb7e8cd7cb06.png)'
- en: If our test statistic is <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a,
    then the <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    is the probability of getting a value greater than or equal to <semantics><mrow><mi>a</mi></mrow><annotation
    encoding="application/x-tex">a</annotation></semantics>a. That probability is
    the area under the curve to the right of <semantics><mrow><mi>a</mi></mrow><annotation
    encoding="application/x-tex">a</annotation></semantics>a. By construction, that
    area is 0.05 (in other words, we set things up and chose <semantics><mrow><mi>a</mi></mrow><annotation
    encoding="application/x-tex">a</annotation></semantics>a to have an area of 0.05).
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们的测试统计量是 <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a，那么
    <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p
    值就是得到大于或等于 <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a
    的值的概率。这个概率是曲线右侧 <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a
    下的面积。根据构造，这个面积是 0.05（换句话说，我们设置了事情，并选择了 <semantics><mrow><mi>a</mi></mrow><annotation
    encoding="application/x-tex">a</annotation></semantics>a 以使其面积为 0.05）。
- en: So, a test statistic of <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a
    results in a <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    of 0.05\. We also know that any test statistic greater than <semantics><mrow><mi>a</mi></mrow><annotation
    encoding="application/x-tex">a</annotation></semantics>a will result in a <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value less than 0.05
    (since there will be less area). Putting it all together, we can conclude that
    any test statistic greater than or equal to <semantics><mrow><mi>a</mi></mrow><annotation
    encoding="application/x-tex">a</annotation></semantics>a will result in a <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value less than or equal
    to 0.05.
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，一个等于 <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a
    的测试统计量会导致一个 <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p
    值为 0.05。我们还知道，任何大于 <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a
    的测试统计量都会导致一个小于 0.05 的 <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p
    值（因为面积会更小）。将所有这些放在一起，我们可以得出结论，任何大于或等于 <semantics><mrow><mi>a</mi></mrow><annotation
    encoding="application/x-tex">a</annotation></semantics>a 的测试统计量都会导致一个小于或等于 0.05
    的 <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p
    值。
- en: Now, what is the probability of obtaining a test statistic greater than or equal
    to <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a,
    if the null hypothesis is true? The answer is just the area under the null distribution
    to the right of <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a.
    By construction, this area is 0.05. So, the probability of obtaining a <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value less than or equal
    to 0.05 is simply 0.05!
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: 现在，如果零假设为真，那么获得一个大于或等于 <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a
    的测试统计量的概率是多少？答案是零分布右侧 <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a
    下的面积。根据构造，这个面积是 0.05。因此，获得一个小于或等于 <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p 值 0.05 的概率仅仅是 0.05！
- en: 'To summarize what we did:'
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: 总结我们所做的工作：
- en: Chose a test statistic value <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a
    such that the area under the the null distribution to the right of <semantics><mrow><mi>a</mi></mrow><annotation
    encoding="application/x-tex">a</annotation></semantics>a is 0.05
  id: totrans-57
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 选择一个测试统计量值 <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a，使得零分布右侧
    <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a
    下的面积是 0.05
- en: Determined that “obtaining a <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    less than or equal to 0.05” is exactly equivalent to “obtaining a test statistic
    greater than or equal to <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a”
  id: totrans-58
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 确定获得“小于或等于0.05的p值”与“获得大于或等于<semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a的测试统计量”是等价的。
- en: Computed that if the null is true, the probability of “obtaining a test statistic
    greater than or equal to <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a”
    is 0.05
  id: totrans-59
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 计算得出，如果零假设为真，获得大于或等于<semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a的测试统计量的概率是0.05。
- en: Found (by combining 2 and 3) that if the null is true, the probability of "obtaining
    a <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    less than or equal to 0.05 is 0.05.
  id: totrans-60
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 通过结合2和3，发现如果零假设为真，获得小于或等于0.05的p值的概率是0.05。
- en: '**Exercise 3**: Suppose the null hypothesis is true. In this case, what is
    the probability of obtaining a <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    less than <semantics><mrow><mi>γ</mi></mrow><annotation encoding="application/x-tex">\gamma</annotation></semantics>γ
    (assuming <semantics><mrow><mn>0</mn><mo><</mo><mi>γ</mi><mo>≤</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">0 < \gamma \leq 1</annotation></semantics>0<γ≤1)?
    *Note this is a generalization of the previous question, using <semantics><mrow><mi>γ</mi></mrow><annotation
    encoding="application/x-tex">\gamma</annotation></semantics>γ instead of the specific
    value 0.05.*'
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: '**练习3**：假设零假设为真。在这种情况下，获得小于<semantics><mrow><mi>γ</mi></mrow><annotation encoding="application/x-tex">\gamma</annotation></semantics>γ的p值的概率是多少（假设<semantics><mrow><mn>0</mn><mo><</mo><mi>γ</mi><mo>≤</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">0 < \gamma \leq 1</annotation></semantics>0<γ≤1）？*注意这是对上一个问题的推广，使用<semantics><mrow><mi>γ</mi></mrow><annotation
    encoding="application/x-tex">\gamma</annotation></semantics>γ代替特定的值0.05*。'
- en: '**Solution**: Throughout our solution to the last exercise, there was nothing
    special about the value of 0.05 that we used. All of our conclusions are still
    valid even if we choose any other threshold between 0 and 1\. So, we can safely
    conclude that this probability is <semantics><mrow><mi>γ</mi></mrow><annotation
    encoding="application/x-tex">\gamma</annotation></semantics>γ.'
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: '**解答**：在我们对上一个练习的解答过程中，我们使用的0.05这个值并没有什么特殊之处。即使我们选择0到1之间的任何其他阈值，我们的所有结论仍然有效。因此，我们可以安全地得出结论，这个概率是<semantics><mrow><mi>γ</mi></mrow><annotation
    encoding="application/x-tex">\gamma</annotation></semantics>γ。'
- en: '**Exercise 4**: Suppose our <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    threshold is <semantics><mrow><mi>γ</mi></mrow><annotation encoding="application/x-tex">\gamma</annotation></semantics>γ.
    What is the false positive rate for this test?'
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: '**练习4**：假设我们的<semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p值阈值为<semantics><mrow><mi>γ</mi></mrow><annotation
    encoding="application/x-tex">\gamma</annotation></semantics>γ。这个测试的假阳性率是多少？'
- en: '**Solution**: We know the following things:'
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: '**解答**：我们知道以下事情：'
- en: The false positive rate is <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mi
    mathvariant="normal">∣</mi><mi>R</mi><mo>=</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">P(D=1 | R=0)</annotation></semantics>P(D=1∣R=0).
  id: totrans-65
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 假阳性率是<semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mi
    mathvariant="normal">∣</mi><mi>R</mi><mo>=</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">P(D=1 | R=0)</annotation></semantics>P(D=1∣R=0)。
- en: In hypothesis testing, this is the probability of rejecting the null hypothesis
    given that the null hypothesis is true.
  id: totrans-66
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在假设检验中，这是在零假设为真的情况下拒绝零假设的概率。
- en: We reject the null hypothesis whenever our <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value is below the threshold.
  id: totrans-67
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 当我们的<semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p值低于阈值时，我们拒绝零假设。
- en: 'From the last exercise: if the null is true, then the probability of obtaining
    a <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    less than or equal to <semantics><mrow><mi>γ</mi></mrow><annotation encoding="application/x-tex">\gamma</annotation></semantics>γ
    is <semantics><mrow><mi>γ</mi></mrow><annotation encoding="application/x-tex">\gamma</annotation></semantics>γ.'
  id: totrans-68
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 从上一个练习开始：如果零假设为真，那么获得小于或等于 <semantics><mrow><mi>γ</mi></mrow><annotation encoding="application/x-tex">\gamma</annotation></semantics>γ
    的 p 值的概率是 <semantics><mrow><mi>γ</mi></mrow><annotation encoding="application/x-tex">\gamma</annotation></semantics>γ.
- en: 'Putting these facts together, the false positive rate is <semantics><mrow><mi>γ</mi></mrow><annotation
    encoding="application/x-tex">\gamma</annotation></semantics>γ: in other words,
    **the p-value threshold that we use for a test is the false positive rate for
    that test**.'
  id: totrans-69
  prefs: []
  type: TYPE_NORMAL
  zh: 将这些事实结合起来，假阳性率是 <semantics><mrow><mi>γ</mi></mrow><annotation encoding="application/x-tex">\gamma</annotation></semantics>γ：换句话说，**我们用于测试的
    p 值阈值是该测试的假阳性率**。
- en: '**Exercise 5**: If the null hypothesis is true, what is the distribution of
    the <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value?
    *Hint: the answer is a well-known distribution.*'
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
  zh: '**练习 5**：如果零假设为真，p 值的分布是什么？*提示：答案是众所周知的分布。*'
- en: '**Solution**: Let <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p
    be the <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    (this is a random variable).'
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: '**解答**：设 <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p
    为 p 值（这是一个随机变量）。'
- en: In Exercise 3, we showed that if the null hypothesis is true, <semantics><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>p</mi><mo>≤</mo><mi>γ</mi><mo stretchy="false">)</mo><mo>=</mo><mi>γ</mi></mrow><annotation
    encoding="application/x-tex">P(p \leq \gamma) = \gamma</annotation></semantics>P(p≤γ)=γ.
    This is precisely the CDF of the random variable <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p! In other words, <semantics><mrow><msub><mi>F</mi><mi>p</mi></msub><mo
    stretchy="false">(</mo><mi>p</mi><mo stretchy="false">)</mo><mo>=</mo><mi>p</mi></mrow><annotation
    encoding="application/x-tex">F_p(p) = p</annotation></semantics>Fp​(p)=p, as long
    as <semantics><mrow><mn>0</mn><mo>≤</mo><mi>p</mi><mo>≤</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">0 \leq p \leq 1</annotation></semantics>0≤p≤1. This
    is exactly the CDF of the uniform distribution! Therefore, we can conclude that
    if the null hypothesis is true, the <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value has a uniform distribution.
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: 在练习 3 中，我们证明了如果零假设为真，<semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>p</mi><mo>≤</mo><mi>γ</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>γ</mi></mrow><annotation encoding="application/x-tex">P(p
    \leq \gamma) = \gamma</annotation></semantics>P(p≤γ)=γ。这正是随机变量 <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p 的累积分布函数！换句话说，<semantics><mrow><msub><mi>F</mi><mi>p</mi></msub><mo
    stretchy="false">(</mo><mi>p</mi><mo stretchy="false">)</mo><mo>=</mo><mi>p</mi></mrow><annotation
    encoding="application/x-tex">F_p(p) = p</annotation></semantics>Fp​(p)=p，只要 <semantics><mrow><mn>0</mn><mo>≤</mo><mi>p</mi><mo>≤</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">0 \leq p \leq 1</annotation></semantics>0≤p≤1。这正是均匀分布的累积分布函数！因此，我们可以得出结论，如果零假设为真，p
    值具有均匀分布。
- en: '[PRE4]'
  id: totrans-73
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: Loading...
  id: totrans-74
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: Proof of Uniformity of <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-values
    under the null distribution (optional)[¶](#proof-of-uniformity-of-p-values-under-the-null-distribution-optional
    "Link to this Section")
  id: totrans-75
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 零假设分布下 p 值均匀性的证明（可选）[¶](#proof-of-uniformity-of-p-values-under-the-null-distribution-optional
    "链接到本节")
- en: '*For this subsection only, we’ll use more precise notation: random variables
    will be denoted with capital letters, values they can take on will be denoted
    with lowercase letters, and density functions and cumulative distribution functions
    will be subscripted with the corresponding random variables. For a refresher on
    this notation, see the Data 140 textbook.*'
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: '*仅对本小节，我们将使用更精确的符号：随机变量将用大写字母表示，它们可以取的值将用小写字母表示，密度函数和累积分布函数将用相应的随机变量下标表示。关于这种符号的复习，请参阅数据
    140 教科书。*'
- en: '*Additionally, note carefully the difference between the notation for random
    variable <semantics><mrow><mi>P</mi></mrow><annotation encoding="application/x-tex">P</annotation></semantics>P
    and probability <semantics><mrow><mi mathvariant="double-struck">P</mi></mrow><annotation
    encoding="application/x-tex">\mathbb{P}</annotation></semantics>P.*'
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: 此外，请注意随机变量符号 <semantics><mrow><mi>P</mi></mrow><annotation encoding="application/x-tex">P</annotation></semantics>P
    和概率符号 <semantics><mrow><mi mathvariant="double-struck">P</mi></mrow><annotation
    encoding="application/x-tex">\mathbb{P}</annotation></semantics>P.* 之间的区别。
- en: 'Let <semantics><mrow><mi>T</mi></mrow><annotation encoding="application/x-tex">T</annotation></semantics>T
    be a continuous random variable denoting our test statistic, and let <semantics><mrow><msub><mi>F</mi><mi>T</mi></msub></mrow><annotation
    encoding="application/x-tex">F_T</annotation></semantics>FT​ be the CDF of <semantics><mrow><mi>T</mi></mrow><annotation
    encoding="application/x-tex">T</annotation></semantics>T under the null hypothesis:
    in other words, <semantics><mrow><msub><mi>F</mi><mi>T</mi></msub><mo stretchy="false">(</mo><mi>t</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi mathvariant="double-struck">P</mi><mo stretchy="false">(</mo><mi>T</mi><mo>≤</mo><mi>t</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">F_T(t)
    = \mathbb{P}(T \leq t)</annotation></semantics>FT​(t)=P(T≤t). Let <semantics><mrow><msub><mi>G</mi><mi>T</mi></msub></mrow><annotation
    encoding="application/x-tex">G_T</annotation></semantics>GT​ be the *tail CDF*:
    <semantics><mrow><msub><mi>G</mi><mi>T</mi></msub><mo stretchy="false">(</mo><mi>t</mi><mo
    stretchy="false">)</mo><mo>=</mo><mn>1</mn><mo>−</mo><msub><mi>F</mi><mi>T</mi></msub><mo
    stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi mathvariant="double-struck">P</mi><mo
    stretchy="false">(</mo><mi>T</mi><mo>≥</mo><mi>t</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">G_T(t) = 1 - F_T(t) = \mathbb{P}(T \geq t)</annotation></semantics>GT​(t)=1−FT​(t)=P(T≥t).
    We’re being imprecise with our use of <semantics><mrow><mo>≥</mo></mrow><annotation
    encoding="application/x-tex">\geq</annotation></semantics>≥ rather than <semantics><mrow><mo>></mo></mrow><annotation
    encoding="application/x-tex">></annotation></semantics>> here, but the equality
    is still true since <semantics><mrow><mi>T</mi></mrow><annotation encoding="application/x-tex">T</annotation></semantics>T
    is a continuous random variable and therefore <semantics><mrow><mi mathvariant="double-struck">P</mi><mo
    stretchy="false">(</mo><mi>T</mi><mo>=</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\mathbb{P}(T = t) = 0</annotation></semantics>P(T=t)=0.'
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: 设 <semantics><mrow><mi>T</mi></mrow><annotation encoding="application/x-tex">T</annotation></semantics>T
    为表示我们的检验统计量的连续随机变量，并设 <semantics><mrow><msub><mi>F</mi><mi>T</mi></msub></mrow><annotation
    encoding="application/x-tex">F_T</annotation></semantics>FT​ 为在零假设下的 <semantics><mrow><mi>T</mi></mrow><annotation
    encoding="application/x-tex">T</annotation></semantics>T 的累积分布函数（CDF）：换句话说，<semantics><mrow><msub><mi>F</mi><mi>T</mi></msub><mo
    stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi mathvariant="double-struck">P</mi><mo
    stretchy="false">(</mo><mi>T</mi><mo>≤</mo><mi>t</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">F_T(t) = \mathbb{P}(T \leq t)</annotation></semantics>FT​(t)=P(T≤t)。设
    <semantics><mrow><msub><mi>G</mi><mi>T</mi></msub></mrow><annotation encoding="application/x-tex">G_T</annotation></semantics>GT​
    为 *尾部累积分布函数*：<semantics><mrow><msub><mi>G</mi><mi>T</mi></msub><mo stretchy="false">(</mo><mi>t</mi><mo
    stretchy="false">)</mo><mo>=</mo><mn>1</mn><mo>−</mo><msub><mi>F</mi><mi>T</mi></msub><mo
    stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi mathvariant="double-struck">P</mi><mo
    stretchy="false">(</mo><mi>T</mi><mo>≥</mo><mi>t</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">G_T(t) = 1 - F_T(t) = \mathbb{P}(T \geq t)</annotation></semantics>GT​(t)=1−FT​(t)=P(T≥t)。在这里，我们使用
    <semantics><mrow><mo>≥</mo></mrow><annotation encoding="application/x-tex">\geq</annotation></semantics>≥
    而不是 <semantics><mrow><mo>></mo></mrow><annotation encoding="application/x-tex">></annotation></semantics>>
    是不精确的，但由于 <semantics><mrow><mi>T</mi></mrow><annotation encoding="application/x-tex">T</annotation></semantics>T
    是一个连续随机变量，因此等式仍然成立，因为 <semantics><mrow><mi mathvariant="double-struck">P</mi><mo
    stretchy="false">(</mo><mi>T</mi><mo>=</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\mathbb{P}(T = t) = 0</annotation></semantics>P(T=t)=0。
- en: '<semantics><mrow><msub><mi>G</mi><mi>T</mi></msub></mrow><annotation encoding="application/x-tex">G_T</annotation></semantics>GT​
    is a tail cumulative distribution function, but we can also view it as just a
    function: we can plug in any number and obtain a number between 0 and 1\. In general,
    we can apply any function to a random variable and, in doing so, obtain another
    random variable. For example, if we apply the function <semantics><mrow><mi>h</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mn>7</mn><mi>x</mi></mrow><annotation
    encoding="application/x-tex">h(x) = 7x</annotation></semantics>h(x)=7x to <semantics><mrow><mi>T</mi></mrow><annotation
    encoding="application/x-tex">T</annotation></semantics>T, we’d obtain a new random
    variable <semantics><mrow><mi>h</mi><mo stretchy="false">(</mo><mi>T</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">h(T)</annotation></semantics>h(T) that takes on values
    seven times what <semantics><mrow><mi>T</mi></mrow><annotation encoding="application/x-tex">T</annotation></semantics>T
    would. So, if we apply the function <semantics><mrow><msub><mi>G</mi><mi>T</mi></msub></mrow><annotation
    encoding="application/x-tex">G_T</annotation></semantics>GT​ to the random variable
    <semantics><mrow><mi>T</mi></mrow><annotation encoding="application/x-tex">T</annotation></semantics>T,
    we get another random variable. Note the difference between <semantics><mrow><msub><mi>G</mi><mi>T</mi></msub><mo
    stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">G_T(t)</annotation></semantics>GT​(t), which is the
    function applied to a specific number <semantics><mrow><mi>t</mi></mrow><annotation
    encoding="application/x-tex">t</annotation></semantics>t, and <semantics><mrow><msub><mi>G</mi><mi>T</mi></msub><mo
    stretchy="false">(</mo><mi>T</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">G_T(T)</annotation></semantics>GT​(T), which is the
    function applied to the random variable <semantics><mrow><mi>T</mi></mrow><annotation
    encoding="application/x-tex">T</annotation></semantics>T.'
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><msub><mi>G</mi><mi>T</mi></msub></mrow><annotation encoding="application/x-tex">G_T</annotation></semantics>GT
    是一个尾部累积分布函数，但我们也可以将其视为一个函数：我们可以输入任何数字并得到一个介于 0 和 1 之间的数字。一般来说，我们可以将任何函数应用于一个随机变量，并因此得到另一个随机变量。例如，如果我们将函数
    <semantics><mrow><mi>h</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mn>7</mn><mi>x</mi></mrow><annotation
    encoding="application/x-tex">h(x) = 7x</annotation></semantics>h(x)=7x 应用于 <semantics><mrow><mi>T</mi></mrow><annotation
    encoding="application/x-tex">T</annotation></semantics>T，我们将得到一个新的随机变量 <semantics><mrow><mi>h</mi><mo
    stretchy="false">(</mo><mi>T</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">h(T)</annotation></semantics>h(T)，其值是 <semantics><mrow><mi>T</mi></mrow><annotation
    encoding="application/x-tex">T</annotation></semantics>T 的七倍。因此，如果我们将函数 <semantics><mrow><msub><mi>G</mi><mi>T</mi></msub></mrow><annotation
    encoding="application/x-tex">G_T</annotation></semantics>GT 应用于随机变量 <semantics><mrow><mi>T</mi></mrow><annotation
    encoding="application/x-tex">T</annotation></semantics>T，我们得到另一个随机变量。注意 <semantics><mrow><msub><mi>G</mi><mi>T</mi></msub><mo
    stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">G_T(t)</annotation></semantics>GT(t)，这是应用于特定数字 <semantics><mrow><mi>t</mi></mrow><annotation
    encoding="application/x-tex">t</annotation></semantics>t 的函数，以及 <semantics><mrow><msub><mi>G</mi><mi>T</mi></msub><mo
    stretchy="false">(</mo><mi>T</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">G_T(T)</annotation></semantics>GT(T)，这是应用于随机变量 <semantics><mrow><mi>T</mi></mrow><annotation
    encoding="application/x-tex">T</annotation></semantics>T 的函数。
- en: 'The <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    associated with a particular test statistic <semantics><mrow><mi>t</mi></mrow><annotation
    encoding="application/x-tex">t</annotation></semantics>t is <semantics><mrow><mi
    mathvariant="double-struck">P</mi><mo stretchy="false">(</mo><mi>T</mi><mo>≥</mo><mi>t</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathbb{P}(T
    \geq t)</annotation></semantics>P(T≥t): this is simply <semantics><mrow><msub><mi>G</mi><mi>T</mi></msub><mo
    stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">G_T(t)</annotation></semantics>GT​(t). The <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value is a random variable
    <semantics><mrow><mi>P</mi></mrow><annotation encoding="application/x-tex">P</annotation></semantics>P
    that depends on the random variable <semantics><mrow><mi>T</mi></mrow><annotation
    encoding="application/x-tex">T</annotation></semantics>T: <semantics><mrow><mi>P</mi><mo>=</mo><msub><mi>G</mi><mi>T</mi></msub><mo
    stretchy="false">(</mo><mi>T</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">P = G_T(T)</annotation></semantics>P=GT​(T).'
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
  zh: 与特定检验统计量<semantics><mrow><mi>t</mi></mrow><annotation encoding="application/x-tex">t</annotation></semantics>t相关的<semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p值是<semantics><mrow><mi
    mathvariant="double-struck">P</mi><mo stretchy="false">(</mo><mi>T</mi><mo>≥</mo><mi>t</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathbb{P}(T
    \geq t)</annotation></semantics>P(T≥t)：这仅仅是<semantics><mrow><msub><mi>G</mi><mi>T</mi></msub><mo
    stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">G_T(t)</annotation></semantics>GT​(t)。p值是一个随机变量<semantics><mrow><mi>P</mi></mrow><annotation
    encoding="application/x-tex">P</annotation></semantics>P，它依赖于随机变量<semantics><mrow><mi>T</mi></mrow><annotation
    encoding="application/x-tex">T</annotation></semantics>T：<semantics><mrow><mi>P</mi><mo>=</mo><msub><mi>G</mi><mi>T</mi></msub><mo
    stretchy="false">(</mo><mi>T</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">P = G_T(T)</annotation></semantics>P=GT​(T).
- en: What is the CDF of this random variable <semantics><mrow><mi>P</mi></mrow><annotation
    encoding="application/x-tex">P</annotation></semantics>P?
