    \geq G_T^{-1}(p)) & \\ &= G_T(G_T^{-1}(p))) & \text{(using definition of }G_T\text{)}
    \\ &= p, \quad 0 \leq p \leq 1 \\ f_P(p) &= \frac{d}{dp}F_P(p) \\ &= 1, \quad
    0 \leq p \leq 1 \\ P &\sim \mathrm{Uniform}(0, 1) \end{align*}</annotation></semantics>GT​(t)PFP​(p)fP​(p)P​=P(T≥t)=GT​(T)=P(P≤p)=P(GT​(T)≤p)=P(GT−1​(GT​(T))≥GT−1​(p))=P(T≥GT−1​(p))=GT​(GT−1​(p)))=p,0≤p≤1=dpd​FP​(p)=1,0≤p≤1∼Uniform(0,1)​(definition of tail CDF)(definition of p-value)(definition of CDF)(applying GT−1​ to both sides)(using definition of GT​)​[(4)](#D2IUp6KzfW
