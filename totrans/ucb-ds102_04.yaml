    G_T(G_T^{-1}(p))) & \text{(使用 }G_T\text{ 的定义)} \\ &= p, \quad 0 \leq p \leq 1
    \\ f_P(p) &= \frac{d}{dp}F_P(p) \\ &= 1, \quad 0 \leq p \leq 1 \\ P &\sim \mathrm{Uniform}(0,
    1) \end{align*}</annotation></semantics>GT​(t)PFP​(p)fP​(p)P​=P(T≥t)=GT​(T)=P(P≤p)=P(GT​(T)≤p)=P(GT−1​(GT​(T))≥GT−1​(p))=P(T≥GT−1​(p))=GT​(GT−1​(p)))=p,0≤p≤1=dpd​FP​(p)=1,0≤p≤1∼Uniform(0,1)​(定义尾部累积分布函数)(定义p值)(定义累积分布函数)(应用GT−1​到两边)(使用GT​的定义)
- en: 'Example: p-value thresholds for e-commerce website optimization[¶](#example-p-value-thresholds-for-e-commerce-website-optimization
    "Link to this Section")'
  id: totrans-91
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例：电子商务网站优化的p值阈值[¶](#example-p-value-thresholds-for-e-commerce-website-optimization
    "链接到本节")
- en: This example will explore how our choice of <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value thresholds leads
    to tradeoffs between the different error rates we discussed in the previous section.
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: 这个例子将探讨我们选择<semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p值阈值如何导致我们在上一节中讨论的不同错误率之间的权衡。
- en: 'Suppose we are exploring ways to make our e-commerce site more appealing to
    customers. We make 100 different changes to the website (different colors, fonts,
    page layouts, etc.), and for each one, we use an A/B test to see whether customers
    are more likely to make a purchase. We define the following null and alternative
    hypotheses:'
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们正在探索使我们的电子商务网站对客户更具吸引力的方法。我们对网站进行了100种不同的变更（不同的颜色、字体、页面布局等），并且对于每一种变更，我们使用A/B测试来查看客户是否更有可能进行购买。我们定义以下零假设和备择假设：
- en: 'Null hypothesis: the change to the website has no effect on whether or not
    customers make a purchase.'
  id: totrans-94
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 零假设：网站变更对客户是否购买没有影响。
- en: 'Alternative hypothesis: the change increases the chance that customers will
    make a purchase.'
  id: totrans-95
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 备择假设：变更增加了客户购买的机会。
- en: 'For each change, we randomly assign half the users of our website to the old
    version, and half to the new version: because this is a randomized experiment,
    we can determine whether our change *causes* customers to purchase products more.
    Our test statistic is the difference between the percentage of people who made
    a purchase in the treatment group (new version of website) and the same percentage
    in the control group (old version of website). We simulate the test statistic
    under the null hypothesis, and obtain a p-value for each test. These p-values
    are in the following dataframe:'
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: 对于每一次变更，我们将我们网站一半的用户随机分配到旧版本，另一半分配到新版本：因为这是一个随机实验，我们可以确定我们的变更是否*导致*客户购买产品更多。我们的测试统计量是处理组（网站新版本）中做出购买的人的百分比与控制组（网站旧版本）中相同百分比的差异。我们在零假设下模拟测试统计量，并为每个测试获得一个p值。这些p值在以下数据框中：
- en: '[PRE5]'
  id: totrans-97
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: Loading...
  id: totrans-98
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: 'We can visualize the distribution of them using a strip plot, which gives us
    a scatterplot-like view. Each point represents one test, the x-axis represents
    the p-value, and the y-axis doesn’t have any meaning (it just helps spread out
    the points so they’re easier to see):'
  id: totrans-99
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以使用条形图来可视化它们的分布，这给我们一个类似散点图的观点。每个点代表一个测试，x轴代表p值，y轴没有意义（它只是帮助分散点，以便更容易看到）：
- en: '[PRE6]'
  id: totrans-100
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: '![<Figure size 600x450 with 1 Axes>](../Images/f203f9e2b474b0c7113f7d4a012a2e10.png)'
  id: totrans-101
  prefs: []
  type: TYPE_IMG
  zh: '![<图大小 600x450，1 个坐标轴>](../Images/f203f9e2b474b0c7113f7d4a012a2e10.png)'
- en: Normally, we wouldn’t know for certain whether or not each change actually affects
    customer behavior. Instead, we must decide from the p-values. In particular, our
    job is to decide, based on the p-values, for which tests the data favor the null
    hypothesis, and for which tests the data favor the alternative hypothesis. From
    the definition of the p-value, we know that smaller p-values should favor the
    alternative hypothesis, while larger p-values should favor the null hypothesis.
  id: totrans-102
  prefs: []
  type: TYPE_NORMAL
  zh: 通常，我们无法确定每个变更是否实际上影响了客户行为。相反，我们必须根据p值来决定。特别是，我们的任务是，根据p值，决定哪些测试的数据支持零假设，哪些测试的数据支持备择假设。从p值的定义中，我们知道较小的p值应该支持备择假设，而较大的p值应该支持零假设。
- en: What if we did magically know the true effect of each change? In this case,
    we could use that known truth to analyze our decision-making process and evaluate
    how well we do.
  id: totrans-103
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们神奇地知道每个变更的真实效果怎么办？在这种情况下，我们可以使用这个已知的真相来分析我们的决策过程，并评估我们做得如何。
- en: 'This is an approach we’ll use many times throughout this book: when creating,
    designing, and evaluating our algorithms, we’ll suppose that we know the “true”
    values of reality, so that we can provide a quantitative analysis. Then, when
    we go apply those algorithms in the real world (where we don’t know reality),
    we can be confident in how well we’re doing.'
  id: totrans-104
  prefs: []
  type: TYPE_NORMAL
  zh: 这是我们将在整本书中多次使用的方法：在创建、设计和评估我们的算法时，我们将假设我们知道现实的“真实”值，这样我们就可以提供定量分析。然后，当我们将这些算法应用于现实世界（我们不知道现实）时，我们可以对我们的表现有信心。
- en: 'The column `is_alternative` contains the known true effects for each of these
    100 A/B tests:'
  id: totrans-105
  prefs: []
  type: TYPE_NORMAL
  zh: 列`is_alternative`包含这100个A/B测试中每个测试的已知真实效果：
- en: '[PRE7]'
  id: totrans-106
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: Loading...
  id: totrans-107
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: We can visualize the p-values again, this time grouped by whether or not the
    website change actually affected customers’ purchase behavior (i.e., reality).
    The top row contains the points where the null is true, and the bottom row contains
    the points where the alternative is true.
  id: totrans-108
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以再次可视化p值，这次是根据网站更改是否实际上影响了客户的购买行为（即现实情况）进行分组。最上面一行包含原假设为真的点，最下面一行包含备择假设为真的点。
- en: '[PRE8]'
  id: totrans-109
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: '[PRE9]'
  id: totrans-110
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: '![<Figure size 600x450 with 1 Axes>](../Images/8561b22255dd3153e833037e618eae47.png)'
  id: totrans-111
  prefs: []
  type: TYPE_IMG
  zh: '![<Figure size 600x450 with 1 Axes>](../Images/8561b22255dd3153e833037e618eae47.png)'
- en: 'We can now see that any particular threshold we choose will lead us to make
    some correct and some incorrect decisions. For example, suppose we use a p-value
    threshold of 0.1:'
  id: totrans-112
  prefs: []
  type: TYPE_NORMAL
  zh: 我们现在可以看到，我们选择的任何特定阈值都会导致我们做出一些正确的决策和一些错误的决策。例如，假设我们使用0.1的p值阈值：
- en: '[PRE10]'
  id: totrans-113
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: '![<Figure size 600x450 with 1 Axes>](../Images/534243ef5e9e02a231f70097dfe15397.png)'
  id: totrans-114
  prefs: []
  type: TYPE_IMG
  zh: '![<Figure size 600x450 with 1 Axes>](../Images/534243ef5e9e02a231f70097dfe15397.png)'
- en: 'For p-values smaller than our threshold (to the left of the line), our decision
    is 1\. So:'
  id: totrans-115
  prefs: []
  type: TYPE_NORMAL
  zh: 对于小于我们阈值的p值（位于线左侧），我们的决策是1。所以：
- en: 'For all the orange (bottom) points to the left of the line, we make a correct
    decision: in this case, reality and our decision are both 1 (alternative), so
    these are *true positives*.'
  id: totrans-116
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 对于所有位于线左侧的橙色（底部）点，我们做出了正确的决策：在这种情况下，现实和我们的决策都是1（备择假设），因此这些是*真阳性*。
- en: 'For all the orange (bottom) points to the right of the line, we make an incorrect
    decision: in this case, reality is 1 (alternative), but our decision is 0 (null).
    So, these are *false negatives*.'
  id: totrans-117
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 对于所有位于线右侧的橙色（底部）点，我们做出了错误的决策：在这种情况下，现实是1（备择假设），但我们的决策是0（原假设）。因此，这些是*假阴性*。
- en: 'For all the blue (top) points to the left of the line, we make an incorrect
    decision: in this case, reality is 0 (null), but our decision is 1 (alternative).
    So, these are *false positives*.'
  id: totrans-118
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 对于所有位于线左侧的蓝色（顶部）点，我们做出了错误的决策：在这种情况下，现实是0（原假设），但我们的决策是1（备择假设）。因此，这些是*假阳性*。
- en: 'For all the blue (top) points to the right of the line, we make a correct decision:
    in this case, reality and our decision are both 0 (null), so these are *true negatives*.'
  id: totrans-119
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 对于所有位于线右侧的蓝色（顶部）点，我们做出了正确的决策：在这种情况下，现实和我们的决策都是0（原假设），因此这些是*真阴性*。
- en: 'Our goal should be to make as many true negatives and true positives as possible,
    while making as few false positives and false negatives as possible. But we can
    see from the graph that there is a tradeoff: as we make fewer false positives,
    we must necessarily make more false negatives. For example, suppose we wanted
    to have no false negatives at all. That means we want all the p-values from tests
    where the alternative is true to be below our threshold (all orange points to
    the left of the line).Let’s see what happens if we choose such a threshold of
    0.42:'
  id: totrans-120
  prefs: []
  type: TYPE_NORMAL
  zh: 我们的目标应该是尽可能多地做出真阴性和真阳性，同时尽可能少地做出假阳性和假阴性。但从图中我们可以看到，这是一个权衡：当我们减少假阳性时，我们必然会增加假阴性。例如，假设我们希望完全没有假阴性。这意味着我们希望所有备择假设为真的测试的p值都低于我们的阈值（线左侧的所有橙色点）。让我们看看如果我们选择这样的阈值0.42会发生什么：
- en: '[PRE11]'
  id: totrans-121
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: '![<Figure size 600x450 with 1 Axes>](../Images/32e3a07786c22c04d01519f2ecb8ccb3.png)'
  id: totrans-122
  prefs: []
  type: TYPE_IMG
  zh: '![<Figure size 600x450 with 1 Axes>](../Images/32e3a07786c22c04d01519f2ecb8ccb3.png)'
- en: 'Even though we’ve dropped our false negative rate dramatically, we’ve unfortunately
    increased our false positive rate: there are now many more tests where the null
    is true but the p-value is below our threshold (blue points to the left of the
    line).'
  id: totrans-123
  prefs: []
  type: TYPE_NORMAL
  zh: 尽管我们大幅降低了假阴性率，但不幸的是，我们的假阳性率增加了：现在有更多测试的原假设为真，但p值低于我们的阈值（线左侧的蓝色点）。
- en: Simple and Composite Hypotheses[¶](#simple-and-composite-hypotheses "Link to
    this Section")
  id: totrans-124
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 简单和复合假设[¶](#simple-and-composite-hypotheses "链接到本节")
- en: 'When conducting hypothesis testing, our null and alternative hypotheses fall
    into one of two categories:'
  id: totrans-125
  prefs: []
  type: TYPE_NORMAL
  zh: 在进行假设检验时，我们的原假设和备择假设分为两类：
- en: A **simple** hypothesis is precise, and states that the test statistic takes
    on a particular value. For example, hypotheses such as “there is no difference
    between the average values in the two groups (<semantics><mrow><msub><mi>μ</mi><mn>1</mn></msub><mo>−</mo><msub><mi>μ</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\mu_1 - \mu_2 = 0</annotation></semantics>μ1​−μ2​=0)”
    or “the true proportion is 0.5 (<semantics><mrow><mi>q</mi><mo>=</mo><mn>0.5</mn></mrow><annotation
    encoding="application/x-tex">q = 0.5</annotation></semantics>q=0.5)” provide one
    single value for the test statistic.
  id: totrans-126
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**简单**假设是精确的，它表明测试统计量取某个特定值。例如，像“两组的平均值之间没有差异（<semantics><mrow><msub><mi>μ</mi><mn>1</mn></msub><mo>−</mo><msub><mi>μ</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\mu_1 - \mu_2 = 0</annotation></semantics>μ1​−μ2​=0）”或“真实比例是0.5（<semantics><mrow><mi>q</mi><mo>=</mo><mn>0.5</mn></mrow><annotation
    encoding="application/x-tex">q = 0.5</annotation></semantics>q=0.5）”这样的假设为测试统计量提供了一个单一值。'
- en: In contrast, a **composite** hypothesis is less specific, and usually describes
    the test statistic as being greater than, less than, or not equal to some reference
    value. For example, hypotheses such as “the average of the first group is greater
    than the average of the second group (<semantics><mrow><msub><mi>μ</mi><mn>1</mn></msub><mo>−</mo><msub><mi>μ</mi><mn>2</mn></msub><mo>></mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\mu_1 - \mu_2 > 0</annotation></semantics>μ1​−μ2​>0)”
    or “the true proportion is not equal to 0.5 (<semantics><mrow><mi>q</mi><mo mathvariant="normal">≠</mo><mn>0.5</mn></mrow><annotation
    encoding="application/x-tex">q \neq 0.5</annotation></semantics>q=0.5)” are composite.
  id: totrans-127
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 相比之下，**复合**假设不那么具体，通常描述测试统计量大于、小于或等于某个参考值。例如，像“第一组的平均值大于第二组的平均值（<semantics><mrow><msub><mi>μ</mi><mn>1</mn></msub><mo>−</mo><msub><mi>μ</mi><mn>2</mn></msub><mo>></mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\mu_1 - \mu_2 > 0</annotation></semantics>μ1​−μ2​>0）”或“真实比例不等于0.5（<semantics><mrow><mi>q</mi><mo
    mathvariant="normal">≠</mo><mn>0.5</mn></mrow><annotation encoding="application/x-tex">q
    \neq 0.5</annotation></semantics>q=0.5）”这样的假设就是复合的。
- en: In most hypothesis tests you’ve seen so far, you’ve likely worked with a simple
    null hypothesis (i.e., one that’s specific that we can simulate or calculate under),
    and a composite alternative hypothesis. Later, we’ll explore what happens when
    we use a simple alternative hypothesis as well.
  id: totrans-128
  prefs: []
  type: TYPE_NORMAL
  zh: 在你迄今为止看到的大多数假设检验中，你可能已经使用了一个简单的零假设（即我们可以模拟或计算的特定假设），以及一个复合备择假设。稍后，我们将探讨当我们使用简单的备择假设时会发生什么。
- en: From p-values to decisions[¶](#from-p-values-to-decisions "Link to this Section")
  id: totrans-129
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 从p值到决策[¶](#from-p-values-to-decisions "链接到本节")
- en: 'We’ve seen above that in order to make a binary decision from a single p-value,
    we must use some threshold. We’ll see several different ways to choose such a
    threshold:'
  id: totrans-130
  prefs: []
  type: TYPE_NORMAL
  zh: 我们在上面已经看到，为了从单个p值中做出二元决策，我们必须使用某个阈值。我们将看到几种不同的方法来选择这样的阈值：
- en: 'Classical null hypothesis significance testing (NHST): here, we choose a threshold
    based on our desired false positive rate. For example, the traditional (arbitrary)
    threshold of 0.05 corresponds to a 5% chance of making a false positive with each
    hypothesis test we conduct. In this setting, our null hypothesis will usually
    be a clearly specified simple hypothesis, but we usually use “vague” composite
    alternative hypotheses such as ‘there is no difference between the two groups’.
    This means that we can precisely analyze what happens when the null is true (<semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">R=0</annotation></semantics>R=0), and reason about
    the false positive rate and true negative rate. However, because our alternative
    hypothesis is composite, we can’t precisely define what happens in the alternative
    case, so we typically don’t reason about the true positive rate and false negative
    rate (i.e., the rates corresponding to <semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">R=1</annotation></semantics>R=1).'
  id: totrans-131
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 经典的零假设显著性检验（NHST）：在这里，我们根据我们期望的假阳性率选择一个阈值。例如，传统的（任意的）0.05阈值对应于每次假设测试中产生假阳性的5%的机会。在这种情况下，我们的零假设通常是一个明确指定的简单假设，但我们通常使用“模糊”的组合备择假设，例如“两组之间没有差异”。这意味着我们可以精确地分析当零假设为真时会发生什么（<semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">R=0</annotation></semantics>R=0），并推理假阳性率和真阴性率。然而，因为我们的备择假设是组合的，我们无法精确地定义备择情况会发生什么，所以我们通常不推理真阳性率和假阴性率（即对应于<semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">R=1</annotation></semantics>R=1)的比率）。
- en: In the Neyman-Pearson framework, we choose a simple alternative hypothesis,
    and reason about the true positive rate.
  id: totrans-132
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在奈曼-皮尔逊框架中，我们选择一个简单的备择假设，并推理真阳性率。
- en: When making multiple tests, we’ll need to choose thresholds that take into account
    error rates involving all the tests we conduct. We’ll examine these error rates
    and why they’re important in the next section.
  id: totrans-133
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在进行多次测试时，我们需要选择考虑所有进行测试的错误率的阈值。我们将在下一节中检查这些错误率以及它们为什么重要。
- en: '[PRE12]'
  id: totrans-134
  prefs: []
  type: TYPE_PRE
  zh: '[PRE12]'
- en: Loading...
  id: totrans-135
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: '[PRE13]'
  id: totrans-136
  prefs: []
  type: TYPE_PRE
  zh: '[PRE13]'
- en: Trading off between different row-wise rates[¶](#trading-off-between-different-row-wise-rates
    "Link to this Section")
  id: totrans-137
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 在不同的行内率之间进行权衡[¶](#trading-off-between-different-row-wise-rates "链接到本节")
- en: 'Analysis of <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-values
    helps us understand what happens if the null is true: we saw earlier that the
    <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    threshold we choose is the false positive rate for the test. But what about if
    the alternative is true? For example, we may be interested in constructing a test
    where we want the false negative rate to be less than 0.1, or we may want to numerically
    quantify how much the false negative rate would increase if we reduced our false
    positive rate by 0.01.'
  id: totrans-138
  prefs: []
  type: TYPE_NORMAL
  zh: 对<semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p值的分析帮助我们理解如果零假设为真会发生什么：我们之前看到，我们选择的<semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p值阈值是测试的假阳性率。但如果备择假设为真呢？例如，我们可能对构建一个测试感兴趣，我们希望假阴性率小于0.1，或者我们可能想数值量化如果我们减少假阳性率0.01，假阴性率会增加多少。
- en: 'Composite alternative hypotheses don’t support the kind of analysis we did
    above: we can only reason about the alternative case if we choose a simple alternative
    hypothesis. So, for the remainder of this section, we’ll only consider the case
    where **both the null and alternative hypotheses are simple**.'
  id: totrans-139
  prefs: []
  type: TYPE_NORMAL
  zh: 组合备择假设不支持我们上面所做的那种分析：只有当我们选择一个简单的备择假设时，我们才能对备择情况进行推理。因此，在本节的剩余部分，我们只考虑**零假设和备择假设都简单**的情况。
- en: 'There are many ways to analyze the tradeoff, so we’ll focus on two of them:'
  id: totrans-140
  prefs: []
  type: TYPE_NORMAL
  zh: 分析权衡的方法有很多，所以我们将关注其中的两种：
- en: '**How do we quantify the tradeoff between false positive rate and false negative
    rate?** In other words, how do we measure the tradeoff between the row-wise rates
    for <semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">R=0</annotation></semantics>R=0
    and the row-wise rates for <semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">R=1</annotation></semantics>R=1? We’ll use a receiver
    operating characteristic curve, commonly known as an **ROC curve**, to answer
    this. For more, see the binary classification section.'
  id: totrans-141
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '**我们如何量化假阳性率和假阴性率之间的权衡？**换句话说，我们如何衡量<semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">R=0</annotation></semantics>R=0和<semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">R=1</annotation></semantics>R=1时的行率之间的权衡？我们将使用接收者操作特征曲线，通常称为**ROC曲线**，来回答这个问题。更多内容，请参阅二分类部分。'
- en: '**For a given false positive rate (i.e., significance threshold or <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value threshold), what
    test statistic should we choose to maximize the power, or true positive rate?**
    In other words, if we fix a desired level of error for the case where <semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">R=0</annotation></semantics>R=0, how do we get the
    best possible performance when <semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">R=1</annotation></semantics>R=1? This is what we’ll
    turn our attention to now.'
  id: totrans-142
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '**对于给定的假阳性率（即显著性阈值或<semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>值阈值），我们应该选择哪个检验统计量来最大化功效，或者说最大化真正的阳性率？**换句话说，如果我们为<semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">R=0</annotation></semantics>R=0的情况固定一个期望的错误水平，那么当<semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">R=1</annotation></semantics>R=1时，我们如何获得最佳性能？这是我们接下来要关注的问题。'
- en: Understanding the power-significance tradeoff in hypothesis testing[¶](#understanding-the-power-significance-tradeoff-in-hypothesis-testing
    "Link to this Section")
  id: totrans-143
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 理解假设检验中的功效-显著性权衡[¶](#understanding-the-power-significance-tradeoff-in-hypothesis-testing
    "链接到本节")
- en: When using the Neyman-Pearson lemma, our goal will be to find the most powerful
    test for any given level of significance. In other words, for any desired FPR
    we specify (i.e., we want to control our error probability if the null is true),
    we want to find the test with the highest possible power (i.e., we want to maximize
    our success probability if the alternative is true).
  id: totrans-144
  prefs: []
  type: TYPE_NORMAL
  zh: 当使用奈曼-皮尔逊引理时，我们的目标将是找到任何给定显著性水平的最强检验。换句话说，对于任何我们指定的期望的假阳性率（即，我们想要控制当原假设为真时的错误概率），我们想要找到具有最高可能功效的检验（即，我们想要最大化当备择假设为真时的成功概率）。
- en: 'We’ll do so by choosing a test statistic (i.e., a function of our observed
    data) that maximizes the power. Instead of computing a <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p-value as before, we’ll
    make a decision by applying a threshold to our test statistic: if it’s above our
    threshold, then we’ll reject the null, and if it’s below our threshold, we’ll
    fail to reject the null.'
  id: totrans-145
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将通过选择一个最大化功效的检验统计量（即我们观察到的数据的函数）来实现这一点。而不是像以前那样计算一个<semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>值，我们将通过将阈值应用于我们的检验统计量来做出决定：如果它高于我们的阈值，那么我们将拒绝原假设，如果它低于我们的阈值，我们将无法拒绝原假设。
- en: 'Before we see what this test statistic is, let’s look at a few diagrams that
    help illustrate the trade-off between power and significance. Suppose we observe
    a single normally distributed data point <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x, and our test statistic
    is <semantics><mrow><mi>t</mi><mo>=</mo><mi>x</mi></mrow><annotation encoding="application/x-tex">t=x</annotation></semantics>t=x.
    We’ll assume that <semantics><mrow><mi>t</mi><mo>∼</mo><mi mathvariant="script">N</mi><mo
    stretchy="false">(</mo><mi>μ</mi><mo separator="true">,</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">t \sim \mathcal{N}(\mu, 1)</annotation></semantics>t∼N(μ,1),
    for some mean <semantics><mrow><mi>μ</mi></mrow><annotation encoding="application/x-tex">\mu</annotation></semantics>μ.
    If our null hypothesis states that <semantics><mrow><mi>μ</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\mu = 0</annotation></semantics>μ=0, then we can
    write <semantics><mrow><mi>t</mi><mi mathvariant="normal">∣</mi><msub><mi>H</mi><mn>0</mn></msub><mo>∼</mo><mi
    mathvariant="script">N</mi><mo stretchy="false">(</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">t | H_0
    \sim \mathcal{N}(0, 1)</annotation></semantics>t∣H0​∼N(0,1). Therefore, our distribution
    for <semantics><mrow><mi>t</mi></mrow><annotation encoding="application/x-tex">t</annotation></semantics>t
    under the null hypothesis is:'
  id: totrans-146
  prefs: []
  type: TYPE_NORMAL
  zh: 在我们看到这个检验统计量之前，让我们看看几个有助于说明效力与显著性之间权衡的图表。假设我们观察到一个正态分布的单个数据点<semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x，我们的检验统计量是<semantics><mrow><mi>t</mi><mo>=</mo><mi>x</mi></mrow><annotation
    encoding="application/x-tex">t=x</annotation></semantics>t=x。我们将假设<semantics><mrow><mi>t</mi><mo>∼</mo><mi
    mathvariant="script">N</mi><mo stretchy="false">(</mo><mi>μ</mi><mo separator="true">,</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">t \sim
    \mathcal{N}(\mu, 1)</annotation></semantics>t∼N(μ,1)，对于某个均值<semantics><mrow><mi>μ</mi></mrow><annotation
    encoding="application/x-tex">\mu</annotation></semantics>μ。如果我们的零假设表明<semantics><mrow><mi>μ</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\mu = 0</annotation></semantics>μ=0，那么我们可以写出<semantics><mrow><mi>t</mi><mi
    mathvariant="normal">∣</mi><msub><mi>H</mi><mn>0</mn></msub><mo>∼</mo><mi mathvariant="script">N</mi><mo
    stretchy="false">(</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">t | H_0 \sim \mathcal{N}(0, 1)</annotation></semantics>t∣H0​∼N(0,1)。因此，在零假设下，我们的t分布为：
- en: '[PRE14]'
  id: totrans-147
  prefs: []
  type: TYPE_PRE
  zh: '[PRE14]'
- en: '![<Figure size 600x300 with 1 Axes>](../Images/00e7e83a9b95d945f34178ef488581ae.png)'
  id: totrans-148
  prefs: []
  type: TYPE_IMG
  zh: '![<Figure size 600x300 with 1 Axes>](../Images/00e7e83a9b95d945f34178ef488581ae.png)'
- en: 'The black vertical line shows one arbitrarily chosen decision threshold: if
    we use this threshold, the shaded areas show the FPR (right, red) and TNR (left,
    yellow) of our test. We can see that if we were to raise the threshold, we’d obtain
    a lower false positive rate (red).'
  id: totrans-149
  prefs: []
  type: TYPE_NORMAL
  zh: 黑色垂直线表示一个任意选择的决策阈值：如果我们使用这个阈值，阴影区域显示了我们的测试的FPR（右侧，红色）和TNR（左侧，黄色）。我们可以看到，如果我们提高阈值，我们会得到更低的假阳性率（红色）。
- en: 'But what about the power? If we want to follow a similar process to compute
    the power (or TPR) of the test, we must use a simple alternative hypothesis. A
    compound alternative such as <semantics><mrow><mi>μ</mi><mo>></mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\mu > 0</annotation></semantics>μ>0 won’t give us
    enough information to compute the error rates under the alternative. So, we’ll
    choose a specific alternative hypothesis: <semantics><mrow><mi>T</mi><mi mathvariant="normal">∣</mi><msub><mi>H</mi><mn>1</mn></msub><mo>∼</mo><mi
    mathvariant="script">N</mi><mo stretchy="false">(</mo><mn>2.5</mn><mo separator="true">,</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">T | H_1
    \sim \mathcal{N}(2.5, 1)</annotation></semantics>T∣H1​∼N(2.5,1):'
  id: totrans-150
  prefs: []
  type: TYPE_NORMAL
  zh: '但是，关于检验的效力呢？如果我们想遵循类似的过程来计算检验的效力（或TPR），我们必须使用一个简单的备择假设。例如，一个复合备择假设如<semantics><mrow><mi>μ</mi><mo>></mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\mu > 0</annotation></semantics>μ>0，它不会给我们足够的信息来计算备择假设下的错误率。因此，我们将选择一个特定的备择假设：<semantics><mrow><mi>T</mi><mi
    mathvariant="normal">∣</mi><msub><mi>H</mi><mn>1</mn></msub><mo>∼</mo><mi mathvariant="script">N</mi><mo
    stretchy="false">(</mo><mn>2.5</mn><mo separator="true">,</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">T | H_1 \sim \mathcal{N}(2.5, 1)</annotation></semantics>T∣H1​∼N(2.5,1):'
- en: '[PRE15]'
  id: totrans-151
  prefs: []
  type: TYPE_PRE
  zh: '[PRE15]'
- en: '![<Figure size 600x300 with 1 Axes>](../Images/6b4e38525b0404f7659967f14993eb63.png)'
  id: totrans-152
  prefs: []
  type: TYPE_IMG
  zh: '![<Figure size 600x300 with 1 Axes>](../Images/6b4e38525b0404f7659967f14993eb63.png)'
- en: For this choice of the alternative hypothesis, we can now see the power (TPR)
    and FNR as the green (right) and purple (left) areas, respectively. If we were
    to raise the threshold, we’d obtain a lower power (green).
  id: totrans-153
  prefs: []
  type: TYPE_NORMAL
  zh: 对于这种备择假设的选择，我们现在可以看到TPR（真阳性率）和FNR（假阴性率）分别对应绿色（右侧）和紫色（左侧）的区域。如果我们提高阈值，我们将获得更低的TPR（绿色）。
- en: 'Now, we’ll visualize both hypotheses on the same graph:'
  id: totrans-154
  prefs: []
  type: TYPE_NORMAL
  zh: 现在，我们将在同一张图上可视化这两个假设：
- en: '[PRE16]'
  id: totrans-155
  prefs: []
  type: TYPE_PRE
  zh: '[PRE16]'
- en: '![<Figure size 600x300 with 1 Axes>](../Images/cbdee3f001d3c5238c19335d547e78ff.png)'
  id: totrans-156
  prefs: []
  type: TYPE_IMG
  zh: '![<图大小600x300，1个轴>](../Images/cbdee3f001d3c5238c19335d547e78ff.png)'
- en: 'Now, we can see the impact of our threshold in both cases: if the null is true,
    our error probability is the area under the red curve to the **right** of the
    threshold (make sure you convince yourself why this is true). If the alternative
    is true, our error probability is the area under the blue curve to the **left**
    of the threshold. Ideally, we want both of these areas to be as small as possible,
    but in practice, we often must trade off one for the other.'
  id: totrans-157
  prefs: []
  type: TYPE_NORMAL
  zh: 现在，我们可以看到我们的阈值在这两种情况下的影响：如果零假设为真，我们的错误概率是阈值右侧红色曲线下的面积（确保你让自己相信这是正确的）。如果备择假设为真，我们的错误概率是阈值左侧蓝色曲线下的面积。理想情况下，我们希望这两个区域都尽可能小，但在实践中，我们通常必须在这两者之间进行权衡。
- en: 'The Neyman-Pearson lemma helps us quantify this tradeoff by choosing a good
    test statistic. Recall our testing framework: we first specify the distribution
    of the data under the null and the alternative (e.g., above, we chose <semantics><mrow><mi>X</mi><mi
    mathvariant="normal">∣</mi><msub><mi>H</mi><mn>0</mn></msub><mo>∼</mo><mi mathvariant="script">N</mi><mo
    stretchy="false">(</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">X | H_0 \sim \mathcal{N}(0, 1)</annotation></semantics>X∣H0​∼N(0,1)
    and <semantics><mrow><mi>X</mi><mi mathvariant="normal">∣</mi><msub><mi>H</mi><mn>1</mn></msub><mo>∼</mo><mi
    mathvariant="script">N</mi><mo stretchy="false">(</mo><mn>2.5</mn><mo separator="true">,</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">X | H_1
    \sim \mathcal{N}(2.5, 1)</annotation></semantics>X∣H1​∼N(2.5,1)). Then, we choose
    a test statistic that helps us distinguish between the null and the alternative.
    In the very simple example above, where we only observed one data point, we just
    chose our test statistic to be the data point we observed. But in general, when
    we observe many data points and have to choose between more complex hypotheses,
    there are many possible test statistics we could choose.'
  id: totrans-158
  prefs: []
  type: TYPE_NORMAL
  zh: Neyman-Pearson引理通过选择一个好的检验统计量来帮助我们量化这种权衡。回想一下我们的测试框架：我们首先指定在零假设和备择假设下数据的分布（例如，在上面，我们选择了<semantics><mrow><mi>X</mi><mi
    mathvariant="normal">∣</mi><msub><mi>H</mi><mn>0</mn></msub><mo>∼</mo><mi mathvariant="script">N</mi><mo
    stretchy="false">(</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">X | H_0 \sim \mathcal{N}(0, 1)</annotation></semantics>X∣H0​∼N(0,1)和<semantics><mrow><mi>X</mi><mi
    mathvariant="normal">∣</mi><msub><mi>H</mi><mn>1</mn></msub><mo>∼</mo><mi mathvariant="script">N</mi><mo
    stretchy="false">(</mo><mn>2.5</mn><mo separator="true">,</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">X | H_1 \sim \mathcal{N}(2.5, 1)</annotation></semantics>X∣H1​∼N(2.5,1)）。然后，我们选择一个检验统计量来帮助我们区分零假设和备择假设。在上述非常简单的例子中，我们只观察到一个数据点，我们只是选择了我们观察到的数据点作为检验统计量。但在一般情况下，当我们观察到许多数据点并需要在更复杂的假设之间进行选择时，我们有多种可能的检验统计量可以选择。
- en: 'Note that above, we defined a distribution for our data given each hypothesis:
    these are called **likelihood functions**. They specify the distribution for our
    observed data given a certain unknown state of the world. In the conventional
    hypothesis testing setup, we only need to define the likelihood under the null
    (or be able to simulate it). When we want to reason about power, we need to specify
    the likelihood under the alternative as well. This usually requires us to make
    a specific assumption about the size of the difference or effect that we are looking
    for: any calculation of power is based on this assumption.'
  id: totrans-159
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，在上面，我们为每个假设定义了数据的分布：这些被称为**似然函数**。它们指定了在某个未知世界状态下我们观察到的数据的分布。在传统的假设检验设置中，我们只需要定义零假设下的似然（或者能够模拟它）。当我们想要推理关于功率时，我们需要指定备择假设下的似然。这通常需要我们对我们寻找的差异或效果的大小做出一个具体的假设：任何功率的计算都是基于这个假设的。
- en: Neyman-Pearson[¶](#neyman-pearson "Link to this Section")
  id: totrans-160
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: Neyman-Pearson[¶](#neyman-pearson "链接到本节")
- en: The Neyman Pearson lemma states that for any desired level of significance (i.e.,
    false positive rate) that we wish to achieve, we can achieve the highest possible
    power by computing the **likelihood ratio** as our test statistic, and then comparing
    it to a threshold that’s determined by our desired significance.
  id: totrans-161
  prefs: []
  type: TYPE_NORMAL
  zh: 奈曼-皮尔逊引理表明，对于任何我们希望达到的显著性水平（即假阳性率），我们可以通过将**似然比**作为检验统计量来计算，然后将其与由我们所需的显著性水平确定的阈值进行比较，从而实现可能的最大功效。
- en: 'Given observed data <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x
    (which can often represent multiple observations), and likelihood functions for
    the null and alternative, we compute the test statistic:'
  id: totrans-162
  prefs: []
  type: TYPE_NORMAL
  zh: 给定观察到的数据x（这通常可以代表多个观察值），以及原假设和备择假设的似然函数，我们计算检验统计量：
- en: <semantics><mrow><mi>L</mi><mi>R</mi><mo>=</mo><mfrac><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mi
    mathvariant="normal">∣</mi><msub><mi>H</mi><mn>1</mn></msub><mo stretchy="false">)</mo></mrow><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><msub><mi>H</mi><mn>0</mn></msub><mo
    stretchy="false">)</mo></mrow></mfrac></mrow><annotation encoding="application/x-tex">LR
    = \frac{p(x|H_1)}{p(x|H_0)}</annotation></semantics>LR=p(x∣H0​)p(x∣H1​)​[(5)](#qGt1vMikmg
    "Link to this Equation")
  id: totrans-163
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi>L</mi><mi>R</mi><mo>=</mo><mfrac><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mi
    mathvariant="normal">∣</mi><msub><mi>H</mi><mn>1</mn></msub><mo stretchy="false">)</mo></mrow><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><msub><mi>H</mi><mn>0</mn></msub><mo
    stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">LR
    = \frac{p(x|H_1)}{p(x|H_0)}</annotation></semantics>LR=p(x∣H0​)p(x∣H1​)​[(5)](#qGt1vMikmg
    "链接到这个方程")
- en: 'and compare it to some threshold <semantics><mrow><mi>η</mi></mrow><annotation
    encoding="application/x-tex">\eta</annotation></semantics>η. If the likelihood
    ratio is greater than the threshold, we reject the null, and if it’s below the
    threshold, we fail to reject. Intuitively, this test asks: “how many times more
    likely are the data under the alternative, compared to under the null?” Our threshold
    then determines how much more likely we require the data to be under the alternative
    before we decide to reject the null. For example, a threshold of 2 requires us
    to see data that are twice as likely under the alternative (relative to the null)
    before we decide to reject the null.'
  id: totrans-164
  prefs: []
  type: TYPE_NORMAL
  zh: 并将其与某个阈值η比较。如果似然比大于阈值，我们拒绝原假设，如果它低于阈值，我们则不拒绝。直观地说，这个测试询问：“与原假设相比，数据在备择假设下的可能性高多少倍？”我们的阈值然后决定了我们在决定拒绝原假设之前需要数据在备择假设下的可能性高出多少。例如，阈值为2意味着我们需要看到在备择假设下（相对于原假设）可能性是两倍的数据，我们才决定拒绝原假设。
- en: 'Using the Neyman-Pearson lemma in practice typically involves the following
    sequence of steps:'
  id: totrans-165
  prefs: []
  type: TYPE_NORMAL
  zh: 在实践中使用奈曼-皮尔逊引理通常涉及以下步骤：
- en: Define the likelihood functions for the observed data according to the null
    and alternative hypothesis.
  id: totrans-166
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 根据原假设和备择假设定义观察数据的似然函数。
- en: Identify a desired level of significance (i.e., false positive rate that you
    are willing to tolerate).
  id: totrans-167
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 确定所需的显著性水平（即你愿意容忍的假阳性率）。
- en: Use the significance level to compute a threshold by (a) expressing the false
    positive rate as a conditional probability based on the decision rule described
    above, (b) setting it equal to the desired significance level, and (c) solving
    for the threshold as a function of the significance level.
  id: totrans-168
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 使用显著性水平通过以下步骤计算一个阈值：(a) 将假阳性率表示为基于上述决策规则的条件概率，(b) 将其设置为所需的显著性水平，并(c) 解出阈值作为显著性水平的函数。
- en: Compute the power of the test by (a) expressing the power as a conditional probability
    based on the decision rule above and (b) plugging in the threshold computed in
    the previous step.
  id: totrans-169
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 通过以下步骤计算检验的功效：(a) 将功效表示为基于上述决策规则的条件概率，并(b) 插入在上一步骤中计算出的阈值。
- en: By solving for the threshold in step (3) in terms of any desired significance
    level, we can use step (4) to explicitly relate the tradeoff between power and
    significance level.
  id: totrans-170
  prefs: []
  type: TYPE_NORMAL
  zh: 通过将步骤(3)中的阈值用任何所需的显著性水平来解出，我们可以使用步骤(4)来明确地关联功效和显著性水平之间的权衡。
