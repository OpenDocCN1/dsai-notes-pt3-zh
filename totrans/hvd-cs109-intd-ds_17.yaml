- en: 9.8.4 Boxplots
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: The geometry for boxplot is `geom_boxplot`. As discussed, boxplots are useful
    for comparing distributions. For example, below are the previously shown heights
    for women, but compared to men. For this geometry, we need arguments `x` as the
    categories, and `y` as the values.
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/3a284446d24c0039e5c92e77139d5dca.png)'
  prefs: []
  type: TYPE_IMG
- en: 9.8.5 Images
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Images were not needed for the concepts described in this chapter, but we will
    use images in Section [11.14](data-visualization-principles.html#vaccines), so
    we introduce the two geometries used to create images: **geom_tile** and **geom_raster**.
    They behave similarly; to see how they differ, please consult the help file. To
    create an image in **ggplot2** we need a data frame with the x and y coordinates
    as well as the values associated with each of these. Here is a data frame.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE18]'
  prefs: []
  type: TYPE_PRE
- en: 'Note that this is the tidy version of a matrix, `matrix(1:120, 12, 10)`. To
    plot the image we use the following code:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE19]'
  prefs: []
  type: TYPE_PRE
- en: With these images you will often want to change the color scale. This can be
    done through the `scale_fill_gradientn` layer.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE20]'
  prefs: []
  type: TYPE_PRE
- en: '![](../Images/865db5bd77332ccac82df95d10fe7df5.png)'
