- en: 9.8.6 Quick plots
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: In Section [8.13](ggplot2.html#qplot) we introduced `qplot` as a useful function
    when we need to make a quick scatterplot. We can also use `qplot` to make histograms,
    density plots, boxplot, qqplots and more. Although it does not provide the level
    of control of `ggplot`, `qplot` is definitely useful as it permits us to make
    a plot with a short snippet of code.
  prefs: []
  type: TYPE_NORMAL
- en: 'Suppose we have the female heights in an object `x`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE21]'
  prefs: []
  type: TYPE_PRE
- en: 'To make a quick histogram we can use:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE22]'
  prefs: []
  type: TYPE_PRE
- en: The function guesses that we want to make a histogram because we only supplied
    one variable. In Section [8.13](ggplot2.html#qplot) we saw that if we supply `qplot`
    two variables, it automatically makes a scatterplot.
  prefs: []
  type: TYPE_NORMAL
- en: To make a quick qqplot you have to use the `sample` argument. Note that we can
    add layers just as we do with `ggplot`.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE23]'
  prefs: []
  type: TYPE_PRE
- en: If we supply a factor and a numeric vector, we obtain a plot like the one below.
    Note that in the code below we are using the `data` argument. Because the data
    frame is not the first argument in `qplot`, we have to use the dot operator.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE24]'
  prefs: []
  type: TYPE_PRE
- en: 'We can also select a specific geometry by using the `geom` argument. So to
    convert the plot above to a boxplot, we use the following code:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE25]'
  prefs: []
  type: TYPE_PRE
- en: 'We can also use the `geom` argument to generate a density plot instead of a
    histogram:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE26]'
  prefs: []
  type: TYPE_PRE
- en: 'Although not as much as with `ggplot`, we do have some flexibility to improve
    the results of `qplot`. Looking at the help file we see several ways in which
    we can improve the look of the histogram above. Here is an example:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE27]'
  prefs: []
  type: TYPE_PRE
- en: '![](../Images/7b46eb5090225b3d508c858cbf71f156.png)'
  prefs: []
  type: TYPE_IMG
- en: '**Technical note**: The reason we use `I("black")` is because we want `qplot`
    to treat `"black"` as a character rather than convert it to a factor, which is
    the default behavior within `aes`, which is internally called here. In general,
    the function `I` is used in R to say “keep it as it is”.'
  prefs: []
  type: TYPE_NORMAL
- en: 9.9 Exercises
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 1\. Now we are going to use the `geom_histogram` function to make a histogram
    of the heights in the `height` data frame. When reading the documentation for
    this function we see that it requires just one mapping, the values to be used
    for the histogram. Make a histogram of all the plots.
  prefs: []
  type: TYPE_NORMAL
- en: What is the variable containing the heights?
  prefs: []
  type: TYPE_NORMAL
- en: '`sex`'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`heights`'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`height`'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`heights$height`'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 2\. Now create a ggplot object using the pipe to assign the heights data to
    a ggplot object. Assign `height` to the x values through the `aes` function.
  prefs: []
  type: TYPE_NORMAL
- en: 3\. Now we are ready to add a layer to actually make the histogram. Use the
    object created in the previous exercise and the `geom_histogram` function to make
    the histogram.
  prefs: []
  type: TYPE_NORMAL
- en: '4\. Note that when we run the code in the previous exercise we get the warning:
    `stat_bin()` using `bins = 30`. Pick better value with `binwidth`.`'
  prefs: []
  type: TYPE_NORMAL
- en: Use the `binwidth` argument to change the histogram made in the previous exercise
    to use bins of size 1 inch.
  prefs: []
  type: TYPE_NORMAL
- en: 5\. Instead of a histogram, we are going to make a smooth density plot. In this
    case we will not make an object, but instead render the plot with one line of
    code. Change the geometry in the code previously used to make a smooth density
    instead of a histogram.
  prefs: []
  type: TYPE_NORMAL
- en: 6\. Now we are going to make a density plot for males and females separately.
    We can do this using the `group` argument. We assign groups via the aesthetic
    mapping as each point needs to a group before making the calculations needed to
    estimate a density.
  prefs: []
  type: TYPE_NORMAL
- en: 7\. We can also assign groups through the `color` argument. This has the added
    benefit that it uses color to distinguish the groups. Change the code above to
    use color.
  prefs: []
  type: TYPE_NORMAL
- en: '8\. We can also assign groups through the `fill` argument. This has the added
    benefit that it uses colors to distinguish the groups, like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE28]'
  prefs: []
  type: TYPE_PRE
- en: However, here the second density is drawn over the other. We can make the curves
    more visible by using alpha blending to add transparency. Set the alpha parameter
    to 0.2 in the `geom_density` function to make this change.
  prefs: []
  type: TYPE_NORMAL
