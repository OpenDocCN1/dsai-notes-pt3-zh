- en: '[Introduction](./intro.html)'
  id: totrans-3
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[引言](./intro.html)'
- en: 'The phrase *data science* began gaining significant popularity around 2012,
    thanks in part to the publication titled *“Data Scientist: The Most Alluring Profession
    of the 21st Century”*[¹](#fn1)(https://hbr.org/2012/10/data-scientist-the-sexiest-job-of-the-21st-century).
    This coincided with the rise of a new kind of endeavor in the technology sector
    and in academic projects during the 2000s: extracting insights from messy, complex,
    and large datasets, which had become increasingly prevalent with the advent of
    digital data storage.'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: “数据科学”这一短语大约在2012年开始获得显著的关注，部分原因是《“数据科学家：21世纪最具吸引力的职业”》一书的出版[¹](#fn1)(https://hbr.org/2012/10/data-scientist-the-sexiest-job-of-the-21st-century)。这与21世纪初科技行业和学术项目中一种新类型努力的兴起相吻合：从混乱、复杂和大型数据集中提取见解，随着数字数据存储的出现，这些数据集变得越来越普遍。
- en: Examples include combining data from multiple political pollsters to improve
    election predictions, scraping athletic department websites to evaluate baseball
    prospects, analyzing movie ratings from millions of streaming service users to
    make personalized recommendations, developing software to read zip codes by digitizing
    handwritten digits, and using advanced measurement technologies to understand
    the molecular causes of diseases. This book is centered around these and other
    practical examples.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 例子包括结合多个政治民意调查的数据来提高选举预测，抓取体育部门网站以评估棒球前景，分析来自数百万流媒体服务用户的电影评分以提供个性化推荐，开发通过数字化手写数字来读取邮政编码的软件，以及使用先进的测量技术来理解疾病的分子原因。本书围绕这些和其他实际例子展开。
- en: Achieving success in these instances requires collaboration among experts with
    complementary skills. In this book, our primary focus is on **data analysis**,
    specifically, the *statistical thinking* that allows us to draw meaningful conclusions
    from data. To understand how to analyze data effectively in these examples, we
    will cover key mathematical concepts. Many of these concepts are not new, some
    were originally developed for different purposes, but they have proven adaptable
    and useful across a wide range of applications.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 在这些情况下取得成功需要具有互补技能的专家之间的合作。在这本书中，我们的主要重点是**数据分析**，特别是那种使我们能够从数据中得出有意义的结论的**统计思维**。为了理解如何有效地分析这些示例中的数据，我们将涵盖关键数学概念。其中许多概念并不新颖，一些最初是为了不同的目的而开发的，但它们已经证明在广泛的领域中具有适应性和实用性。
- en: The mathematical difficulty in this book varies by topic, and we assume you
    are already familiar with the required material. However, the recommended readings
    at the end of each part can help fill in any gaps. The math is not an end in itself,
    it is a tool for articulating and deepening our understanding of statistical ideas
    and thow they are useful for data analysis.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 本书中的数学难度因主题而异，我们假设你已经熟悉所需材料。然而，每个部分的结尾推荐阅读可以帮助填补任何空白。数学本身不是目的，它是表达和深化我们对统计思想及其在数据分析中用途理解的一种工具。
- en: The same is true for the code. We alternate between **base R**, **data.table**,
    and the **tidyverse**, choosing whichever is most appropriate for the task at
    hand. Given how capable large language models (LLMs) have become at writing and
    explaining code, we do not focus on syntax or programming best practices. Instead,
    we include code because it connects statistical ideas to data, and therefore to
    real-world applications.
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 对于代码来说，也是如此。我们在**基础R**、**data.table**和**tidyverse**之间交替使用，选择最适合当前任务的工具。鉴于大型语言模型（LLMs）在编写和解释代码方面的能力已经变得非常强大，我们并不专注于语法或编程最佳实践。相反，我们包含代码，因为它们将统计思想与数据联系起来，从而与实际应用联系起来。
- en: 'For example, running Monte Carlo simulations on your own computer and generating
    your own data can make abstract probability concepts tangible. In general, we
    encourage you to experiment: change parameters, modify the code, or design your
    own simulations to test and refine your understanding. This process of active
    exploration is central to developing intuition about randomness, uncertainty,
    and inference.'
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，在自己的计算机上运行蒙特卡洛模拟并生成自己的数据可以使抽象的概率概念变得具体。总的来说，我们鼓励你进行实验：改变参数、修改代码或设计自己的模拟来测试和细化你的理解。这种积极的探索过程对于培养对随机性、不确定性和推理的直觉至关重要。
- en: 'While LLMs can now produce working code for many specific problems, they are
    not yet capable of doing the main thing we teach here: **thinking statistically**
    about data-driven questions. This skill involves formulating questions, visually
    exploring data, identifying sources of variability, and reasoning about uncertainty.
    These are human-centered tasks that remain at the heart of data analysis.'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 虽然现在大型语言模型（LLMs）可以为许多特定问题生成可工作的代码，但它们还无法完成我们在这里教授的主要任务：对数据驱动问题进行**统计性思考**。这项技能包括提出问题、可视化探索数据、识别变异来源以及处理不确定性。这些是以人为中心的任务，仍然是数据分析的核心。
- en: 'The book is divided into six parts: **Summary Statistics**, **Probability**,
    **Statistical Inference**, **Linear Models**, **High-Dimensional Data**, and **Machine
    Learning**. The first two parts introduce key statistical ideas through illustrative
    examples, while the later parts focus on real-world case studies that demonstrate
    how these ideas come together in practice. Readers already comfortable with probability
    and statistical theory who are mainly interested in the applied perspective may
    wish to skip ahead to those later sections.'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 本书分为六个部分：**描述性统计**、**概率论**、**统计推断**、**线性模型**、**高维数据**和**机器学习**。前两部分通过实例介绍关键统计概念，而后续部分则聚焦于现实世界的案例研究，展示这些概念在实际中的应用。对于已经熟悉概率和统计理论，主要对应用视角感兴趣的读者，可能希望跳过这些后期章节。
- en: Each part is organized into concise chapters designed to fit within a single
    lecture and paired with exercises for practice. All datasets used in the book
    are available in the **dslabs** package, and the complete Quarto source files
    can be found on [GitHub](https://github.com/rafalab/dsbook-part-2)[²](#fn2).
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 每一部分都组织成简洁的章节，旨在适应单个讲座，并配以练习题以供实践。本书中使用的所有数据集都可在**dslabs**包中找到，完整的Quarto源文件可在[GitHub](https://github.com/rafalab/dsbook-part-2)[²](#fn2)上找到。
