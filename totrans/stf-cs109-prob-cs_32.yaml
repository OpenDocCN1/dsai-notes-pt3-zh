- en: Binomial Distribution
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part2/binomial/](https://chrispiech.github.io/probabilityForComputerScientists/en/part2/binomial/)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
- en: In this section, we will discuss the binomial distribution. To start, imagine
    the following example. Consider $n$ independent trials of an experiment where
    each trial is a "success" with probability $p$. Let $X$ be the number of successes
    in $n$ trials. This situation is truly common in the natural world, and as such,
    there has been a lot of research into such phenomena. Random variables like $X$
    are called binomial random variables. If you can identify that a process fits
    this description, you can inherit many already proved properties such as the PMF
    formula, expectation, and variance!
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/bcfb0bdd21aa5f1a2934882efb3ff007.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Here are a few examples of binomial random variables:'
  prefs: []
  type: TYPE_NORMAL
- en: of heads in $n$ coin flips
  prefs:
  - PREF_UL
  - PREF_H1
  type: TYPE_NORMAL
- en: of 1’s in randomly generated length $n$ bit string
  prefs:
  - PREF_UL
  - PREF_H1
  type: TYPE_NORMAL
- en: of disk drives crashed in 1000 computer cluster, assuming disks crash independently
  prefs:
  - PREF_UL
  - PREF_H1
  type: TYPE_NORMAL
- en: '**Binomial Random Variable**'
  prefs: []
  type: TYPE_NORMAL
- en: '| Notation: | $X \sim \Bin(n, p)$ |'
  prefs: []
  type: TYPE_TB
- en: '| Description: | Number of "successes" in $n$ identical, independent experiments
    each with probability of success $p$. |'
  prefs: []
  type: TYPE_TB
- en: '| Parameters: | $n \in \{0, 1, \dots\}$, the number of experiments. $p \in
    [0, 1]$, the probability that a single experiment gives a "success". |'
  prefs: []
  type: TYPE_TB
- en: '| Support: | $x \in \{0, 1, \dots, n\}$ |'
  prefs: []
  type: TYPE_TB
- en: '| PMF equation: | $$\p(X=x) = {n \choose x}p^x(1-p)^{n-x}$$ |'
  prefs: []
  type: TYPE_TB
- en: '| Expectation: | $\E[X] = n \cdot p$ |'
  prefs: []
  type: TYPE_TB
- en: '| Variance: | $\var(X) = n \cdot p \cdot (1-p)$ |'
  prefs: []
  type: TYPE_TB
- en: '| PMF graph: |'
  prefs: []
  type: TYPE_TB
- en: 'Parameter $n$: Parameter $p$:'
  prefs: []
  type: TYPE_NORMAL
- en: '<canvas id="binomialPmf" style="max-height: 400px"></canvas>'
  prefs: []
  type: TYPE_NORMAL
- en: 'One way to think of the binomial is as the sum of $n$ [Bernoulli](../../part2/bernoulli)
    variables. Say that $Y_i \sim \Ber(p)$ is an indicator Bernoulli random variable
    which is 1 if experiment $i$ is a success. Then if $X$ is the total number of
    successes in $n$ experiments, $X \sim \Bin(n, p)$: $$ X = \sum_{i=1}^n Y_i $$'
  prefs: []
  type: TYPE_NORMAL
- en: Recall that the outcome of $Y_i$ will be 1 or 0, so one way to think of $X$
    is as the sum of those 1s and 0s.
  prefs: []
  type: TYPE_NORMAL
- en: Binomial PMF
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'The most important property to know about a binomial is its [PMF function](../../part2/pmf):'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/9b91eb08b12423b9abf45dbd31db2255.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Recall, we derived this formula in Part 1\. There is a complete example on
    the probability of $k$ heads in $n$ coin flips, where each flip is heads with
    probability $0.5$: [Many Coin Flips](../../examples/many_flips). To briefly review,
    if you think of each experiment as being distinct, then there are ${n \choose
    k}$ ways of permuting $k$ successes from $n$ experiments. For any of the mutually
    exclusive permutations, the probability of that permutation is $p^k \cdot (1-p)^{n-k}$.'
  prefs: []
  type: TYPE_NORMAL
- en: The name binomial comes from the term ${n \choose k}$ which is formally called
    the binomial coefficient.
  prefs: []
  type: TYPE_NORMAL
- en: Expectation of Binomial
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'There is an easy way to calculate the expectation of a binomial and a hard
    way. The easy way is to leverage the fact that a binomial is the sum of Bernoulli
    [indicator](../../part2/bernoulli#indicator) random variables. $X = \sum_{i=1}^{n}
    Y_i$ where $Y_1$ is an indicator of whether the $i$th experiment was a success:
    $Y_i \sim \Ber(p)$. Since the [expectation of the sum](../../part2/expectation)
    of random variables is the sum of expectations, we can add the expectation, $\E[Y_i]
    = p$, of each of the Bernoulli''s: $$ \begin{align} \E[X] &= \E\Big[\sum_{i=1}^{n}
    Y_i\Big] && \text{Since }X = \sum_{i=1}^{n} Y_i \\ &= \sum_{i=1}^{n}\E[ Y_i] &&
    \text{Expectation of sum} \\ &= \sum_{i=1}^{n}p && \text{Expectation of Bernoulli}
    \\ &= n \cdot p && \text{Sum $n$ times} \end{align} $$ The hard way is to use
    the definition of expectation: $$ \begin{align} \E[X] &= \sum_{i=0}^n i \cdot
    \p(X = i) && \text{Def of expectation} \\ &= \sum_{i=0}^n i \cdot {n \choose i}
    p^i(1-p)^{n-i} && \text{Sub in PMF} \\ & \cdots && \text{Many steps later} \\
    &= n \cdot p \end{align} $$'
  prefs: []
  type: TYPE_NORMAL
- en: Binomial Distribution in Python
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: As you might expect, you can use binomial distributions in code. The standardized
    library for binomials is `scipy.stats.binom`.
  prefs: []
  type: TYPE_NORMAL
