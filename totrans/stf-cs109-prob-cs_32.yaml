  id: totrans-32
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: 'Console:'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 控制台：
- en: '[PRE1]'
  id: totrans-34
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: 'Another particularly helpful function is the ability to generate a random sample
    from a binomial. For example, say $X \sim \Bin(n=10, p = 0.3)$ represents the
    number of requests to a website. We can draw 100 samples from this distribution
    using the following code:'
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: 另一个特别有用的函数是生成二项分布的随机样本的能力。例如，假设 $X \sim \Bin(n=10, p = 0.3)$ 代表网站请求的数量。我们可以使用以下代码从这个分布中抽取100个样本：
- en: '[PRE2]'
  id: totrans-36
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: 'Console:'
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: 控制台：
- en: '[PRE3]'
  id: totrans-38
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: 'You might be wondering what a random sample is! A random sample is a randomly
    chosen assignment for our random variable. Above we have 100 such assignments.
    The probability that value $x$ is chosen is given by the PMF: $\p(X=x)$. You will
    notice that even though 8 is a possible assignment to the binomial above, in 100
    samples we never saw the value 8\. Why? Because $P(X=8) \approx 0.0014$. You would
    need to draw 1,000 samples before you would expect to see an 8.'
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: 你可能想知道什么是随机样本！随机样本是对我们的随机变量进行随机赋值。上面我们有100个这样的赋值。值 $x$ 被选中的概率由概率质量函数给出：$\p(X=x)$。你会注意到，尽管8是上述二项分布的一个可能的赋值，但在100个样本中我们从未看到过值8。为什么？因为
    $P(X=8) \approx 0.0014$。你需要抽取1,000个样本，才可能期望看到8。
- en: There are also functions for getting the mean, the variance, and more. You can
    read the scipy.stats.binom [documentation](https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.binom.html),
    especially the list of methods.
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 此外，还有获取均值、方差等功能。你可以阅读 scipy.stats.binom [文档](https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.binom.html)，特别是方法列表。
