- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: 'You might be wondering what a random sample is! A random sample is a randomly
    chosen assignment for our random variable. Above we have 100 such assignments.
    The probability that value $x$ is chosen is given by the PMF: $\p(X=x)$. You will
    notice that even though 8 is a possible assignment to the binomial above, in 100
    samples we never saw the value 8\. Why? Because $P(X=8) \approx 0.0014$. You would
    need to draw 1,000 samples before you would expect to see an 8.'
  prefs: []
  type: TYPE_NORMAL
- en: There are also functions for getting the mean, the variance, and more. You can
    read the scipy.stats.binom [documentation](https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.binom.html),
    especially the list of methods.
  prefs: []
  type: TYPE_NORMAL
