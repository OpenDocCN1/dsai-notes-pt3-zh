    must be shared under the same terms</title></svg>](https://creativecommons.org/licenses/by-sa/4.0/)[](https://github.com/ds-102/ds-102-book
    "GitHub Repository: ds-102/ds-102-book")[](https://github.com/ds-102/ds-102-book/edit/main/ds-102-book/content/chapters/03/01_prediction.ipynb
    "Edit This Page")'
  prefs: []
  type: TYPE_NORMAL
- en: '*You may find it helpful to review [Chapter 15 of the Data 8 textbook](https://inferentialthinking.com/chapters/15/Prediction.html),
    which looks at prediction using linear regression and <semantics><mrow><mi>k</mi></mrow><annotation
    encoding="application/x-tex">k</annotation></semantics>k-nearest neighbors.*'
  prefs: []
  type: TYPE_NORMAL
- en: 'In many cases, our goal is **prediction**: to predict one variable from several
    others. We’ll usually call the prediction variable <semantics><mrow><mi>y</mi></mrow><annotation
    encoding="application/x-tex">y</annotation></semantics>y, and the other variables
    <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x.
    Here are a few examples of prediction in real-world settings:'
  prefs: []
  type: TYPE_NORMAL
- en: A subscription-based company might be interested in predicting whether a certain
    customer will renew their subscription next month (<semantics><mrow><mi>y</mi></mrow><annotation
    encoding="application/x-tex">y</annotation></semantics>y), using demographic information,
    historical usage data, and general market trends (<semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x). This information will
    help them make important business decisions on whether to send promotions to that
    customer, or by aggregating many predictions, to estimate how much revenue the
    company will bring in over the next month.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: A YouTube content producer might be interested in predicting the number of views
    on their next video (<semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y),
    using information about their YouTube channel (follower count, etc.) and information
    about the video itself (length, number of guest stars, production cost, etc.)
    (<semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x).
    This information could be useful when looking for advertisers who want to understand
    how many people will see the ad if they watch the video.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: In each of these examples, we can see that we have multiple predictors <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x (usually we write these
    as <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo separator="true">,</mo><msub><mi>x</mi><mn>2</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>d</mi></msub></mrow><annotation
    encoding="application/x-tex">x_1, x_2, \ldots, x_d</annotation></semantics>x1​,x2​,…,xd​,
    or just as a vector <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x),
    and we’re predicting a single target variable <semantics><mrow><mi>y</mi></mrow><annotation
    encoding="application/x-tex">y</annotation></semantics>y (usually scalar-valued).
    The predictions can be binary, otherwise discrete, or continuous.
  prefs: []
  type: TYPE_NORMAL
- en: 'Here’s the general framework that we’ll use: we’ll start by assuming that we
    have some pairs of known examples, <semantics><mrow><mo stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><msub><mi>y</mi><mn>1</mn></msub><mo stretchy="false">)</mo><mo
    separator="true">,</mo><mo stretchy="false">(</mo><msub><mi>x</mi><mn>2</mn></msub><mo
    separator="true">,</mo><msub><mi>y</mi><mn>2</mn></msub><mo stretchy="false">)</mo><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><mo stretchy="false">(</mo><msub><mi>x</mi><mi>n</mi></msub><mo
    separator="true">,</mo><msub><mi>y</mi><mi>n</mi></msub><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">(x_1, y_1), (x_2, y_2), \ldots, (x_n, y_n)</annotation></semantics>(x1​,y1​),(x2​,y2​),…,(xn​,yn​),
    where each pair contains a vector <semantics><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">x_i</annotation></semantics>xi​ of predictors for
    data point <semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics>i,
    and a known value of the prediction target for data point <semantics><mrow><mi>i</mi></mrow><annotation
    encoding="application/x-tex">i</annotation></semantics>i. In the examples above,
    this might be historical information on customers who did and didn’t renew in
    the past, or data on previously released videos with known view counts and channel
    information at the time of release. We’ll use these points to learn a relationship
    between <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x
    and <semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y,
    and then apply what we learned to new points <semantics><mrow><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo
    separator="true">,</mo><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>2</mn></mrow></msub><mo
    separator="true">,</mo><mo>…</mo></mrow><annotation encoding="application/x-tex">x_{n+1},
    x_{n+2}, \ldots</annotation></semantics>xn+1​,xn+2​,…. Any points we use to learn
    that relationship are referred to as the training set.'
  prefs: []
  type: TYPE_NORMAL
- en: 'You’ve already seen this pattern used several times before:'
  prefs: []
  type: TYPE_NORMAL
- en: '...in linear regression, where we **fit** or **train** a linear model using
    <semantics><mrow><mo stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><msub><mi>y</mi><mn>1</mn></msub><mo stretchy="false">)</mo><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><mo stretchy="false">(</mo><msub><mi>x</mi><mi>n</mi></msub><mo
    separator="true">,</mo><msub><mi>y</mi><mi>n</mi></msub><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">(x_1, y_1), \ldots, (x_n, y_n)</annotation></semantics>(x1​,y1​),…,(xn​,yn​)
    and then use the learned coefficients to make predictions on new data points.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '...in <semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k-nearest
    neighbors classification, where we store the entire training set, and then when
    classifying (i.e., predicting classification labels for) new points, we find the
    <semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k
    closest points in the training set, and then use a majority vote of their labels
    as our prediction.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Note that prediction is not necessarily the same as causality! A YouTuber might
    find that the view count on their most recent video is a strong predictor of the
    view count for their next video, but one doesn’t necesarily have a causal relationship
    to the other. This doesn’t mean it’s any less useful for prediction, though. So,
    we’ll limit ourselves to the world of making and understanding predictions, and
    avoid making any conclusions about causality or lack thereof for now. In the next
    chapter, we’ll build a better understanding of the distinction between the two,
    and discover when we can in fact reason about causality.
  prefs: []
  type: TYPE_NORMAL
