  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/examples/100_binomial_problems/](https://chrispiech.github.io/probabilityForComputerScientists/en/examples/100_binomial_problems/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: 'Just for fun (and to give you a lot of practice) I wrote a generative probabilistic
    program which could sample binomial distribution problems. Here are 100 binomial
    questions:'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 为了娱乐（并让你有大量的练习）我编写了一个生成概率程序，可以采样二项分布问题。这里有 100 个二项式问题：
- en: Questions
  id: totrans-4
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 问题
- en: '***Question 1:*** Laura is running a server cluster with 50 computers. The
    probability of a crash on a given server is 0.5\. What is the standard deviation
    of crashes?'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 1:*** Laura 在运行一个由 50 台计算机组成的服务器集群。每次服务器崩溃的概率是 0.5。崩溃的标准差是多少？'
- en: '***Answer 1:***'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 1:***'
- en: Let $X$ be the number of crashes. $X \sim \Bin(n = 50, p = 0.5)$ \begin{align*}
    \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{50 \cdot 0.5 \cdot (1 - 0.5)}\\ &= 3.54
    \end{align*}
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为崩溃次数。$X \sim \Bin(n = 50, p = 0.5)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)}
    \\ &= \sqrt{50 \cdot 0.5 \cdot (1 - 0.5)}\\ &= 3.54 \end{align*}
- en: '***Question 2:*** You are showing an online-ad to 30 people. The probability
    of an ad ignore on each ad shown is 2/3\. What is the expected number of ad clicks?'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 2:*** 你向 30 个人展示在线广告。每次展示广告被忽略的概率是 2/3。期望的广告点击次数是多少？'
- en: '***Answer 2:***'
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 2:***'
- en: Let $X$ be the number of ad clicks. $X \sim \Bin(n = 30, p = 1/3)$ \begin{align*}
    \E[X] &= np \\ &= 30 \cdot 1/3 \\ &= 10 \end{align*}
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为广告点击次数。$X \sim \Bin(n = 30, p = 1/3)$ \begin{align*} \E[X] &= np \\ &=
    30 \cdot 1/3 \\ &= 10 \end{align*}
- en: '***Question 3:*** A machine learning algorithm makes binary predictions. The
    machine learning algorithm makes 50 guesses where the probability of a incorrect
    prediction on a given guess is 19/25\. What is the probability that the number
    of correct predictions is greater than 0?'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 3:*** 一个机器学习算法进行二元预测。该机器学习算法在 50 次猜测中，每次猜测错误预测的概率是 19/25。正确预测的数量大于 0
    的概率是多少？'
- en: '***Answer 3:***'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 3:***'
- en: Let $X$ be the number of correct predictions. $X \sim \Bin(n = 50, p = 6/25)$
    \begin{align*} \P(X > 0) &= 1 - \P(0 <= X <= 0)\\ &= 1 - {n \choose 0} p^0 (1
    - p)^{n - 0} \end{align*}
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为正确预测的数量。$X \sim \Bin(n = 50, p = 6/25)$ \begin{align*} \P(X > 0) &= 1
    - \P(0 <= X <= 0)\\ &= 1 - {n \choose 0} p^0 (1 - p)^{n - 0} \end{align*}
- en: '***Question 4:*** Wind blows independently across 50 locations. The probability
    of no wind at a given location is 0.5\. What is the expected number of locations
    that have wind?'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 4:*** 风在 50 个地点独立吹拂。没有风的地点的概率是 0.5。有风的地点的期望值是多少？'
- en: '***Answer 4:***'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 4:***'
- en: Let $X$ be the number of locations that have wind. $X \sim \Bin(n = 50, p =
    0.5)$ \begin{align*} \E[X] &= np \\ &= 50 \cdot 0.5 \\ &= 25.0 \end{align*}
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为有风的地点数量。$X \sim \Bin(n = 50, p = 0.5)$ \begin{align*} \E[X] &= np \\
    &= 50 \cdot 0.5 \\ &= 25.0 \end{align*}
- en: '***Question 5:*** Wind blows independently across 30 locations. What is the
    standard deviation of locations that have wind? the probability of wind at each
    location is 0.6\.'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 5:*** 风在 30 个地点独立吹拂。有风的地点的标准差是多少？每个地点有风的概率是 0.6。'
- en: '***Answer 5:***'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 5:***'
- en: Let $X$ be the number of locations that have wind. $X \sim \Bin(n = 30, p =
    0.6)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{30 \cdot 0.6 \cdot
    (1 - 0.6)}\\ &= 2.68 \end{align*}
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为有风的地点数量。$X \sim \Bin(n = 30, p = 0.6)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)}
    \\ &= \sqrt{30 \cdot 0.6 \cdot (1 - 0.6)}\\ &= 2.68 \end{align*}
- en: '***Question 6:*** You are trying to mine bitcoins. There are 50 independent
    attempts where the probability of a mining a bitcoin on a given attempt is 0.6\.
    What is the expectation of bitcoins mined?'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 6:*** 你正在尝试挖比特币。有 50 次独立的尝试，每次尝试挖到比特币的概率是 0.6。挖到的比特币期望值是多少？'
- en: '***Answer 6:***'
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 6:***'
- en: Let $X$ be the number of bitcoins mined. $X \sim \Bin(n = 50, p = 0.6)$ \begin{align*}
    \E[X] &= np \\ &= 50 \cdot 0.6 \\ &= 30.0 \end{align*}
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为挖到的比特币数量。$X \sim \Bin(n = 50, p = 0.6)$ \begin{align*} \E[X] &= np \\
    &= 50 \cdot 0.6 \\ &= 30.0 \end{align*}
- en: '***Question 7:*** You are testing a new medicine on 40 patients. What is P(X
    is exactly 38)? The number of cured patients can be represented by a random variable
    X. X ~ Bin(40, 3/10).'
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 7:*** 你正在对 40 名患者测试一种新药。X 是治愈患者的数量，X ~ Bin(40, 3/10)。求 P(X 精确为 38)？'
- en: '***Answer 7:***'
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 7:***'
- en: Let $X$ be the number of cured patients. $X \sim \Bin(n = 40, p = 3/10)$ \begin{align*}
    \P(X = 38) &= {n \choose 38 } p^{ 38 } (1 - p)^{n - 38 } \\ &= { 40 \choose 38
    } 3/10^{ 38 } (1 - 3/10)^{40 - 38 } \\ &< 0.00001 \end{align*}
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为治愈的患者数。$X \sim \Bin(n = 40, p = 3/10)$ \begin{align*} \P(X = 38) &= {n
    \choose 38 } p^{ 38 } (1 - p)^{n - 38 } \\ &= { 40 \choose 38 } 3/10^{ 38 } (1
    - 3/10)^{40 - 38 } \\ &< 0.00001 \end{align*}
- en: '***Question 8:*** You are manufacturing chips and are testing for defects.
    There are 50 independent tests and 0.5 is the probability of a defect on each
    test. What is the standard deviation of defects?'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 8:*** 你正在制造芯片，并对其进行缺陷测试。有 50 个独立的测试，每个测试中缺陷的概率是 0.5。缺陷的标准差是多少？'
- en: '***Answer 8:***'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 8:***'
- en: Let $X$ be the number of defects. $X \sim \Bin(n = 50, p = 0.5)$ \begin{align*}
    \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{50 \cdot 0.5 \cdot (1 - 0.5)}\\ &= 3.54
    \end{align*}
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为缺陷数。$X \sim \Bin(n = 50, p = 0.5)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)}
    \\ &= \sqrt{50 \cdot 0.5 \cdot (1 - 0.5)}\\ &= 3.54 \end{align*}
- en: '***Question 9:*** Laura is flipping a coin 12 times. The probability of a tail
    on a given coin-flip is 5/12\. What is the probability that the number of tails
    is greater than or equal to 2?'
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 9:*** Laura 正在抛硬币 12 次。给定抛掷中反面的概率是 5/12。反面数大于或等于 2 的概率是多少？'
- en: '***Answer 9:***'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 9:***'
- en: Let $X$ be the number of tails. $X \sim \Bin(n = 12, p = 5/12)$ \begin{align*}
    \P(X >= 2) &= 1 - \P(0 <= X <= 1)\\ &= 1 - \sum_{i = 0}^{1} {n \choose i} p^i
    (1 - p)^{n - i} \end{align*}
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为反面数。$X \sim \Bin(n = 12, p = 5/12)$ \begin{align*} \P(X >= 2) &= 1 -
    \P(0 <= X <= 1)\\ &= 1 - \sum_{i = 0}^{1} {n \choose i} p^i (1 - p)^{n - i} \end{align*}
- en: '***Question 10:*** You are asking a survey question where responses are "like"
    or "dislike". There are 30 responses. You can assume each response is independent
    where the probability of a dislike on a given response is 1/6\. What is the probability
    that the number of likes is greater than 28?'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 10:*** 你正在询问一个调查问题，回答是“喜欢”或“不喜欢”。有 30 个回答。你可以假设每个回答是独立的，其中给定回答不喜欢的概率是
    1/6。喜欢数大于 28 的概率是多少？'
- en: '***Answer 10:***'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 10:***'
- en: Let $X$ be the number of likes. $X \sim \Bin(n = 30, p = 5/6)$ \begin{align*}
    \P(X > 28) &= P(29 <= X <= 30)\\ &= \sum_{i = 29}^{30} {n \choose i} p^i (1 -
    p)^{n - i} \end{align*}
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为喜欢数。$X \sim \Bin(n = 30, p = 5/6)$ \begin{align*} \P(X > 28) &= P(29
    <= X <= 30)\\ &= \sum_{i = 29}^{30} {n \choose i} p^i (1 - p)^{n - i} \end{align*}
- en: '***Question 11:*** A ball hits a series of 50 pins where it can bounce either
    right or left. The probability of a left on a given pin hit is 0.4\. What is the
    standard deviation of rights?'
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 11:*** 一个球击中一系列 50 个柱子，它可以向左或向右弹跳。给定柱子击中时向左的概率是 0.4。右边的标准差是多少？'
- en: '***Answer 11:***'
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 11:***'
- en: Let $X$ be the number of rights. $X \sim \Bin(n = 50, p = 3/5)$ \begin{align*}
    \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{50 \cdot 3/5 \cdot (1 - 3/5)}\\ &= 3.46
    \end{align*}
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为正确数。$X \sim \Bin(n = 50, p = 3/5)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)}
    \\ &= \sqrt{50 \cdot 3/5 \cdot (1 - 3/5)}\\ &= 3.46 \end{align*}
- en: '***Question 12:*** You are sending a stream of 30 bits to space. The probability
    of a no corruption on a given bit is 1/3\. What is the probability that the number
    of corruptions is 10?'
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 12:*** 你正在向太空发送一系列 30 个比特。给定比特无损坏的概率是 1/3。损坏的比特数为 10 的概率是多少？'
- en: '***Answer 12:***'
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 12:***'
- en: Let $X$ be the number of corruptions. $X \sim \Bin(n = 30, p = 2/3)$ \begin{align*}
    \P(X = 10) &= {n \choose 10 } p^{ 10 } (1 - p)^{n - 10 } \\ &= { 30 \choose 10
    } 2/3^{ 10 } (1 - 2/3)^{30 - 10 } \\ &= 0.00015 \end{align*}
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为损坏数。$X \sim \Bin(n = 30, p = 2/3)$ \begin{align*} \P(X = 10) &= {n \choose
    10 } p^{ 10 } (1 - p)^{n - 10 } \\ &= { 30 \choose 10 } 2/3^{ 10 } (1 - 2/3)^{30
    - 10 } \\ &= 0.00015 \end{align*}
- en: '***Question 13:*** Wind blows independently across locations. The probability
    of wind at a given location is 0.9\. The number of independent locations is 20\.
    What is the probability that the number of locations that have wind is not less
    than 19?'
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 13:*** 风独立地吹过各个地点。给定地点的风的概率是 0.9。独立地点的数量是 20。有多少地点有风的概率不低于 19？'
- en: '***Answer 13:***'
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 13:***'
- en: Let $X$ be the number of locations that have wind. $X \sim \Bin(n = 20, p =
    0.9)$ \begin{align*} \P(X >= 19) &= P(19 <= X <= 20)\\ &= \sum_{i = 19}^{20} {n
    \choose i} p^i (1 - p)^{n - i} \end{align*}
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为有风的地点数。$X \sim \Bin(n = 20, p = 0.9)$ \begin{align*} \P(X >= 19) &= P(19
    <= X <= 20)\\ &= \sum_{i = 19}^{20} {n \choose i} p^i (1 - p)^{n - i} \end{align*}
- en: '***Question 14:*** You are sending a stream of bits to space. There are 30
    independent bits where 5/6 is the probability of a no corruption on each bit.
    What is the probability that the number of corruptions is 21?'
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 14:*** 你正在向太空发送一系列比特。有 30 个独立的比特，每个比特无损坏的概率是 5/6。损坏的比特数为 21 的概率是多少？'
- en: '***Answer 14:***'
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 14:***'
- en: Let $X$ be the number of corruptions. $X \sim \Bin(n = 30, p = 1/6)$ \begin{align*}
    \P(X = 21) &= {n \choose 21 } p^{ 21 } (1 - p)^{n - 21 } \\ &= { 30 \choose 21
    } 1/6^{ 21 } (1 - 1/6)^{30 - 21 } \\ &< 0.00001 \end{align*}
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为损坏的数量。$X \sim \Bin(n = 30, p = 1/6)$ \begin{align*} \P(X = 21) &= {n
    \choose 21 } p^{ 21 } (1 - p)^{n - 21 } \\ &= { 30 \choose 21 } 1/6^{ 21 } (1
    - 1/6)^{30 - 21 } \\ &< 0.00001 \end{align*}
- en: '***Question 15:*** Cody generates random bit strings. There are 20 independent
    bits. Each bit has a 1/4 probability of resulting in a 1\. What is the probability
    that the number of 1s is 11?'
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 15:*** Cody 生成随机的比特字符串。有 20 个独立的比特。每个比特有 1/4 的概率产生 1。1 的数量为 11 的概率是多少？'
- en: '***Answer 15:***'
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 15:***'
- en: Let $X$ be the number of 1s. $X \sim \Bin(n = 20, p = 1/4)$ \begin{align*} \P(X
    = 11) &= {n \choose 11 } p^{ 11 } (1 - p)^{n - 11 } \\ &= { 20 \choose 11 } 1/4^{
    11 } (1 - 1/4)^{20 - 11 } \\ &= 0.00301 \end{align*}
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为 1 的数量。$X \sim \Bin(n = 20, p = 1/4)$ \begin{align*} \P(X = 11) &= {n
    \choose 11 } p^{ 11 } (1 - p)^{n - 11 } \\ &= { 20 \choose 11 } 1/4^{ 11 } (1
    - 1/4)^{20 - 11 } \\ &= 0.00301 \end{align*}
- en: '***Question 16:*** In a restaurant some customers ask for a water with their
    meal. A random sample of 40 customers is selected where the probability of a water
    requested by a given customer is 9/20\. What is the probability that the number
    of waters requested is 16?'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 16:*** 在一家餐厅，一些顾客在用餐时要求喝水。随机选取了 40 名顾客，其中给定顾客要求水的概率是 9/20。请求水的数量为 16
    的概率是多少？'
- en: '***Answer 16:***'
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 16:***'
- en: Let $X$ be the number of waters requested. $X \sim \Bin(n = 40, p = 9/20)$ \begin{align*}
    \P(X = 16) &= {n \choose 16 } p^{ 16 } (1 - p)^{n - 16 } \\ &= { 40 \choose 16
    } 9/20^{ 16 } (1 - 9/20)^{40 - 16 } \\ &= 0.10433 \end{align*}
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为请求水的数量。$X \sim \Bin(n = 40, p = 9/20)$ \begin{align*} \P(X = 16) &= {n
    \choose 16 } p^{ 16 } (1 - p)^{n - 16 } \\ &= { 40 \choose 16 } 9/20^{ 16 } (1
    - 9/20)^{40 - 16 } \\ &= 0.10433 \end{align*}
- en: '***Question 17:*** A student is guessing randomly on an exam with 12 questions.
    What is the expected number of correct answers? the probability of a correct answer
    on a given question is 5/12\.'
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 17:*** 一个学生在考试中随机猜测 12 个问题。正确答案的期望数量是多少？给定问题的正确答案概率是 5/12。'
- en: '***Answer 17:***'
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 17:***'
- en: Let $X$ be the number of correct answers. $X \sim \Bin(n = 12, p = 5/12)$ \begin{align*}
    \E[X] &= np \\ &= 12 \cdot 5/12 \\ &= 5 \end{align*}
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为正确答案的数量。$X \sim \Bin(n = 12, p = 5/12)$ \begin{align*} \E[X] &= np \\
    &= 12 \cdot 5/12 \\ &= 5 \end{align*}
- en: '***Question 18:*** Laura is trying to mine bitcoins. The number of bitcoins
    mined can be represented by a random variable X. X ~ Bin(n = 100, p = 1/2). What
    is P(X is equal to 53)?'
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 18:*** Laura 正在尝试挖比特币。挖到的比特币数量可以用随机变量 X 表示。X ~ Bin(n = 100, p = 1/2)。X
    等于 53 的概率是多少？'
- en: '***Answer 18:***'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 18:***'
- en: Let $X$ be the number of bitcoins mined. $X \sim \Bin(n = 100, p = 1/2)$ \begin{align*}
    \P(X = 53) &= {n \choose 53 } p^{ 53 } (1 - p)^{n - 53 } \\ &= { 100 \choose 53
    } 1/2^{ 53 } (1 - 1/2)^{100 - 53 } \\ &= 0.06659 \end{align*}
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为挖到的比特币数量。$X \sim \Bin(n = 100, p = 1/2)$ \begin{align*} \P(X = 53) &=
    {n \choose 53 } p^{ 53 } (1 - p)^{n - 53 } \\ &= { 100 \choose 53 } 1/2^{ 53 }
    (1 - 1/2)^{100 - 53 } \\ &= 0.06659 \end{align*}
- en: '***Question 19:*** You are showing an online-ad to customers. The add is shown
    to 100 people. The probability of an ad ignore on a given ad shown is 1/2\. What
    is the standard deviation of ad clicks?'
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 19:*** 你正在向客户展示在线广告。广告被展示给 100 个人。给定展示的广告被忽略的概率是 1/2。广告点击的标准差是多少？'
- en: '***Answer 19:***'
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 19:***'
- en: Let $X$ be the number of ad clicks. $X \sim \Bin(n = 100, p = 0.5)$ \begin{align*}
    \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{100 \cdot 0.5 \cdot (1 - 0.5)}\\ &= 5.00
    \end{align*}
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为广告点击的数量。$X \sim \Bin(n = 100, p = 0.5)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)}
    \\ &= \sqrt{100 \cdot 0.5 \cdot (1 - 0.5)}\\ &= 5.00 \end{align*}
- en: '***Question 20:*** You are running a server cluster with 40 computers. 5/8
    is the probability of a computer continuing to work on each server. What is the
    expected number of crashes?'
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 20:*** 你正在运行一个由 40 台计算机组成的服务器集群。每台计算机在服务器上继续工作的概率是 5/8。崩溃的期望数量是多少？'
- en: '***Answer 20:***'
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 20:***'
- en: Let $X$ be the number of crashes. $X \sim \Bin(n = 40, p = 3/8)$ \begin{align*}
    \E[X] &= np \\ &= 40 \cdot 3/8 \\ &= 15 \end{align*}
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为崩溃的数量。$X \sim \Bin(n = 40, p = 3/8)$ \begin{align*} \E[X] &= np \\ &=
    40 \cdot 3/8 \\ &= 15 \end{align*}
- en: '***Question 21:*** You are hashing 100 strings into a hashtable. The probability
    of a hash to the first bucket on a given string hash is 3/20\. What is the probability
    that the number of hashes to the first bucket is greater than or equal to 97?'
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 21:*** 你正在将 100 个字符串哈希到散列表中。给定字符串哈希到第一个桶的概率是 3/20。哈希到第一个桶的数量大于或等于 97
    的概率是多少？'
- en: '***Answer 21:***'
  id: totrans-66
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 21:***'
- en: Let $X$ be the number of hashes to the first bucket. $X \sim \Bin(n = 100, p
    = 3/20)$ \begin{align*} \P(X >= 97) &= P(97 <= X <= 100)\\ &= \sum_{i = 97}^{100}
    {n \choose i} p^i (1 - p)^{n - i} \end{align*}
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为到达第一个桶的哈希数量。$X \sim \Bin(n = 100, p = 3/20)$ \begin{align*} \P(X >= 97)
    &= P(97 <= X <= 100)\\ &= \sum_{i = 97}^{100} {n \choose i} p^i (1 - p)^{n - i}
    \end{align*}
- en: '***Question 22:*** You are running in an election with 50 voters. 6/25 is the
    probability of a vote for you on each vote. What is the probability that the number
    of votes for you is less than 2?'
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 22:*** 你在一个有 50 个选民的大选中。每个选票投给你的概率是 6/25。求你得到的选票数量少于 2 的概率？'
- en: '***Answer 22:***'
  id: totrans-69
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 22:***'
- en: Let $X$ be the number of votes for you. $X \sim \Bin(n = 50, p = 6/25)$ \begin{align*}
    \P(X < 2) &= P(0 <= X <= 1)\\ &= \sum_{i = 0}^{1} {n \choose i} p^i (1 - p)^{n
    - i} \end{align*}
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为你得到的选票数量。$X \sim \Bin(n = 50, p = 6/25)$ \begin{align*} \P(X < 2) &=
    P(0 <= X <= 1)\\ &= \sum_{i = 0}^{1} {n \choose i} p^i (1 - p)^{n - i} \end{align*}
- en: '***Question 23:*** Irina is sending a stream of 40 bits to space. The probability
    of a corruption on each bit is 3/4\. What is the probability that the number of
    corruptions is 22?'
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 23:*** Irina 正在向太空发送一个 40 位的比特流。每个比特损坏的概率是 3/4。求损坏的数量为 22 的概率？'
- en: '***Answer 23:***'
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 23:***'
- en: Let $X$ be the number of corruptions. $X \sim \Bin(n = 40, p = 3/4)$ \begin{align*}
    \P(X = 22) &= {n \choose 22 } p^{ 22 } (1 - p)^{n - 22 } \\ &= { 40 \choose 22
    } 3/4^{ 22 } (1 - 3/4)^{40 - 22 } \\ &= 0.00294 \end{align*}
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为损坏的数量。$X \sim \Bin(n = 40, p = 3/4)$ \begin{align*} \P(X = 22) &= {n
    \choose 22 } p^{ 22 } (1 - p)^{n - 22 } \\ &= { 40 \choose 22 } 3/4^{ 22 } (1
    - 3/4)^{40 - 22 } \\ &= 0.00294 \end{align*}
- en: '***Question 24:*** You are hashing 100 strings into a hashtable. The probability
    of a hash to the first bucket on a given string hash is 9/50\. What is the probability
    that the number of hashes to the first bucket is greater than 97?'
  id: totrans-74
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 24:*** 你正在将 100 个字符串哈希到一个散列表中。给定字符串哈希到第一个桶的概率是 9/50。求到达第一个桶的哈希数量大于 97
    的概率？'
- en: '***Answer 24:***'
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 24:***'
- en: Let $X$ be the number of hashes to the first bucket. $X \sim \Bin(n = 100, p
    = 9/50)$ \begin{align*} \P(X > 97) &= P(98 <= X <= 100)\\ &= \sum_{i = 98}^{100}
    {n \choose i} p^i (1 - p)^{n - i} \end{align*}
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为到达第一个桶的哈希数量。$X \sim \Bin(n = 100, p = 9/50)$ \begin{align*} \P(X > 97)
    &= P(98 <= X <= 100)\\ &= \sum_{i = 98}^{100} {n \choose i} p^i (1 - p)^{n - i}
    \end{align*}
- en: '***Question 25:*** You generate random bit strings. There are 100 independent
    bits. The probability of a 1 at a given bit is 3/25\. What is the probability
    that the number of 1s is less than 97?'
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 25:*** 你生成随机的比特串。有 100 个独立的比特。给定比特为 1 的概率是 3/25。求 1 的数量小于 97 的概率？'
- en: '***Answer 25:***'
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 25:***'
- en: Let $X$ be the number of 1s. $X \sim \Bin(n = 100, p = 3/25)$ \begin{align*}
    \P(X < 97) &= 1 - \P(97 <= X <= 100)\\ &= 1 - \sum_{i = 97}^{100} {n \choose i}
    p^i (1 - p)^{n - i} \end{align*}
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为 1 的数量。$X \sim \Bin(n = 100, p = 3/25)$ \begin{align*} \P(X < 97) &=
    1 - \P(97 <= X <= 100)\\ &= 1 - \sum_{i = 97}^{100} {n \choose i} p^i (1 - p)^{n
    - i} \end{align*}
- en: '***Question 26:*** You are manufacturing toys and are testing for defects.
    What is the probability that the number of defects is greater than 1? the probability
    of a non-defect on a given test is 16/25 and you test 50 objects.'
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 26:*** 你在制造玩具并测试缺陷。求缺陷数量大于 1 的概率？给定测试中非缺陷的概率是 16/25，你测试了 50 个物品。'
- en: '***Answer 26:***'
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 26:***'
- en: Let $X$ be the number of defects. $X \sim \Bin(n = 50, p = 9/25)$ \begin{align*}
    \P(X > 1) &= 1 - \P(0 <= X <= 1)\\ &= 1 - \sum_{i = 0}^{1} {n \choose i} p^i (1
    - p)^{n - i} \end{align*}
  id: totrans-82
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为缺陷的数量。$X \sim \Bin(n = 50, p = 9/25)$ \begin{align*} \P(X > 1) &= 1 -
    \P(0 <= X <= 1)\\ &= 1 - \sum_{i = 0}^{1} {n \choose i} p^i (1 - p)^{n - i} \end{align*}
- en: '***Question 27:*** Laura is sending a stream of 40 bits to space. The number
    of corruptions can be represented by a random variable X. X is a Binomial with
    n = 40 and p = 3/4\. What is P(X = 25)?'
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 27:*** Laura 正在向太空发送一个 40 位的比特流。损坏的数量可以用随机变量 X 表示。X 是一个二项分布，n = 40，p
    = 3/4。求 P(X = 25)?'
- en: '***Answer 27:***'
  id: totrans-84
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 27:***'
- en: Let $X$ be the number of corruptions. $X \sim \Bin(n = 40, p = 3/4)$ \begin{align*}
    \P(X = 25) &= {n \choose 25 } p^{ 25 } (1 - p)^{n - 25 } \\ &= { 40 \choose 25
    } 3/4^{ 25 } (1 - 3/4)^{40 - 25 } \\ &= 0.02819 \end{align*}
  id: totrans-85
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为损坏的数量。$X \sim \Bin(n = 40, p = 3/4)$ \begin{align*} \P(X = 25) &= {n
    \choose 25 } p^{ 25 } (1 - p)^{n - 25 } \\ &= { 40 \choose 25 } 3/4^{ 25 } (1
    - 3/4)^{40 - 25 } \\ &= 0.02819 \end{align*}
- en: '***Question 28:*** 100 trials are run. What is the probability that the number
    of successes is 78? 1/2 is the probability of a success on each trial.'
  id: totrans-86
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 28:*** 进行了 100 次试验。求成功的数量为 78 的概率？每次试验成功的概率是 1/2。'
- en: '***Answer 28:***'
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 28:***'
- en: Let $X$ be the number of successes. $X \sim \Bin(n = 100, p = 1/2)$ \begin{align*}
    \P(X = 78) &= {n \choose 78 } p^{ 78 } (1 - p)^{n - 78 } \\ &= { 100 \choose 78
    } 1/2^{ 78 } (1 - 1/2)^{100 - 78 } \\ &< 0.00001 \end{align*}
  id: totrans-88
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为成功的数量。$X \sim \Bin(n = 100, p = 1/2)$ \begin{align*} \P(X = 78) &= {n
    \choose 78 } p^{ 78 } (1 - p)^{n - 78 } \\ &= { 100 \choose 78 } 1/2^{ 78 } (1
    - 1/2)^{100 - 78 } \\ &< 0.00001 \end{align*}
- en: '***Question 29:*** You are flipping a coin. You flip the coin 20 times. The
    probability of a tail on a given coin-flip is 1/10\. What is the standard deviation
    of heads?'
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 29:*** 你抛硬币。你抛了 20 次。每次抛硬币出现尾巴的概率是 1/10。正面的标准差是多少？'
- en: '***Answer 29:***'
  id: totrans-90
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 29:***'
- en: Let $X$ be the number of heads. $X \sim \Bin(n = 20, p = 0.9)$ \begin{align*}
    \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{20 \cdot 0.9 \cdot (1 - 0.9)}\\ &= 1.34
    \end{align*}
  id: totrans-91
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为正面的数量。$X \sim \Bin(n = 20, p = 0.9)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)}
    \\ &= \sqrt{20 \cdot 0.9 \cdot (1 - 0.9)}\\ &= 1.34 \end{align*}
- en: '***Question 30:*** Irina is showing an online-ad to 12 people. 5/12 is the
    probability of an ad click on each ad shown. What is the probability that the
    number of ad clicks is less than or equal to 11?'
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 30:*** 伊琳娜向 12 个人展示在线广告。每次展示广告被点击的概率是 5/12。广告点击数少于或等于 11 的概率是多少？'
- en: '***Answer 30:***'
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 30:***'
- en: Let $X$ be the number of ad clicks. $X \sim \Bin(n = 12, p = 5/12)$ \begin{align*}
    \P(X <= 11) &= 1 - \P(12 <= X <= 12)\\ &= 1 - {n \choose 12} p^12 (1 - p)^{n -
    12} \end{align*}
  id: totrans-94
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为广告点击的数量。$X \sim \Bin(n = 12, p = 5/12)$ \begin{align*} \P(X <= 11) &=
    1 - \P(12 <= X <= 12)\\ &= 1 - {n \choose 12} p^12 (1 - p)^{n - 12} \end{align*}
- en: '***Question 31:*** You are flipping a coin 50 times. 19/25 is the probability
    of a head on each coin-flip. What is the standard deviation of tails?'
  id: totrans-95
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 31:*** 你抛硬币 50 次。每次抛硬币出现正面的概率是 19/25。尾巴的标准差是多少？'
- en: '***Answer 31:***'
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 31:***'
- en: Let $X$ be the number of tails. $X \sim \Bin(n = 50, p = 6/25)$ \begin{align*}
    \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{50 \cdot 6/25 \cdot (1 - 6/25)}\\ &= 3.02
    \end{align*}
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为尾巴的数量。$X \sim \Bin(n = 50, p = 6/25)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)}
    \\ &= \sqrt{50 \cdot 6/25 \cdot (1 - 6/25)}\\ &= 3.02 \end{align*}
- en: '***Question 32:*** You are running in an election with 100 voters. The probability
    of a vote for you on each vote is 1/4\. What is the probability that the number
    of votes for you is less than or equal to 97?'
  id: totrans-98
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 32:*** 你在一个有 100 名选民的选举中参选。每次投票给你票的概率是 1/4。你得到的票数少于或等于 97 的概率是多少？'
- en: '***Answer 32:***'
  id: totrans-99
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 32:***'
- en: Let $X$ be the number of votes for you. $X \sim \Bin(n = 100, p = 1/4)$ \begin{align*}
    \P(X <= 97) &= 1 - \P(98 <= X <= 100)\\ &= 1 - \sum_{i = 98}^{100} {n \choose
    i} p^i (1 - p)^{n - i} \end{align*}
  id: totrans-100
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为你得到的票数。$X \sim \Bin(n = 100, p = 1/4)$ \begin{align*} \P(X <= 97) &=
    1 - \P(98 <= X <= 100)\\ &= 1 - \sum_{i = 98}^{100} {n \choose i} p^i (1 - p)^{n
    - i} \end{align*}
- en: '***Question 33:*** You are running a server cluster with 40 computers. What
    is the probability that the number of crashes is less than or equal to 39? 3/4
    is the probability of a computer continuing to work on each server.'
  id: totrans-101
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 33:*** 你在运行一个由 40 台计算机组成的服务器集群。崩溃数少于或等于 39 的概率是多少？每台服务器上计算机继续工作的概率是 3/4。'
- en: '***Answer 33:***'
  id: totrans-102
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 33:***'
- en: Let $X$ be the number of crashes. $X \sim \Bin(n = 40, p = 1/4)$ \begin{align*}
    \P(X <= 39) &= 1 - \P(40 <= X <= 40)\\ &= 1 - {n \choose 40} p^40 (1 - p)^{n -
    40} \end{align*}
  id: totrans-103
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为崩溃的数量。$X \sim \Bin(n = 40, p = 1/4)$ \begin{align*} \P(X <= 39) &= 1
    - \P(40 <= X <= 40)\\ &= 1 - {n \choose 40} p^40 (1 - p)^{n - 40} \end{align*}
- en: '***Question 34:*** Waddie is sending a stream of bits to space. Waddie sends
    100 bits. The probability of a corruption on each bit is 1/2\. What is the standard
    deviation of corruptions?'
  id: totrans-104
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 34:*** 沃迪正在向太空发送一串比特。沃迪发送了 100 个比特。每个比特发生损坏的概率是 1/2。损坏的标准差是多少？'
- en: '***Answer 34:***'
  id: totrans-105
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 34:***'
- en: Let $X$ be the number of corruptions. $X \sim \Bin(n = 100, p = 1/2)$ \begin{align*}
    \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{100 \cdot 1/2 \cdot (1 - 1/2)}\\ &= 5.00
    \end{align*}
  id: totrans-106
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为损坏的数量。$X \sim \Bin(n = 100, p = 1/2)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)}
    \\ &= \sqrt{100 \cdot 1/2 \cdot (1 - 1/2)}\\ &= 5.00 \end{align*}
- en: '***Question 35:*** A student is guessing randomly on an exam with 100 questions.
    Each question has a 0.5 probability of resulting in a incorrect answer. What is
    the probability that the number of correct answers is greater than 97?'
  id: totrans-107
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 35:*** 一个学生在 100 道题的考试中随机猜测。每道题答错的概率是 0.5。答对题数多于 97 的概率是多少？'
- en: '***Answer 35:***'
  id: totrans-108
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 35:***'
- en: Let $X$ be the number of correct answers. $X \sim \Bin(n = 100, p = 1/2)$ \begin{align*}
    \P(X > 97) &= P(98 <= X <= 100)\\ &= \sum_{i = 98}^{100} {n \choose i} p^i (1
    - p)^{n - i} \end{align*}
  id: totrans-109
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为答对的题数。$X \sim \Bin(n = 100, p = 1/2)$ \begin{align*} \P(X > 97) &= P(98
    <= X <= 100)\\ &= \sum_{i = 98}^{100} {n \choose i} p^i (1 - p)^{n - i} \end{align*}
- en: '***Question 36:*** You are testing a new medicine on patients. 0.5 is the probability
    of a cured patient on each trial. There are 10 independent trials. What is the
    expected number of cured patients?'
  id: totrans-110
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 36:*** 你在测试一种新药。每个试验治愈患者的概率是 0.5。有 10 次独立的试验。治愈患者的期望数是多少？'
- en: '***Answer 36:***'
  id: totrans-111
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 36:***'
- en: Let $X$ be the number of cured patients. $X \sim \Bin(n = 10, p = 0.5)$ \begin{align*}
    \E[X] &= np \\ &= 10 \cdot 0.5 \\ &= 5.0 \end{align*}
  id: totrans-112
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为治愈患者数。$X \sim \Bin(n = 10, p = 0.5)$ \begin{align*} \E[X] &= np \\ &=
    10 \cdot 0.5 \\ &= 5.0 \end{align*}
- en: '***Question 37:*** A ball hits a series of pins where it can either go right
    or left. The number of independent pin hits is 100\. The probability of a right
    on each pin hit is 0.5\. What is the standard deviation of rights?'
  id: totrans-113
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 37:*** 一个球击中一系列的柱子，它可以向右或向左移动。独立击中柱子的次数是 100 次。每次击中柱子向右的概率是 0.5。向右的标准差是多少？'
- en: '***Answer 37:***'
  id: totrans-114
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 37:***'
- en: Let $X$ be the number of rights. $X \sim \Bin(n = 100, p = 0.5)$ \begin{align*}
    \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{100 \cdot 0.5 \cdot (1 - 0.5)}\\ &= 5.00
    \end{align*}
  id: totrans-115
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为正确次数。$X \sim \Bin(n = 100, p = 0.5)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)}
    \\ &= \sqrt{100 \cdot 0.5 \cdot (1 - 0.5)}\\ &= 5.00 \end{align*}
- en: '***Question 38:*** You are flipping a coin 40 times. The probability of a head
    on a given coin-flip is 1/2\. What is the probability that the number of heads
    is 38?'
  id: totrans-116
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 38:*** 你抛硬币 40 次。每次抛硬币正面的概率是 1/2。正面次数为 38 的概率是多少？'
- en: '***Answer 38:***'
  id: totrans-117
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 38:***'
- en: Let $X$ be the number of heads. $X \sim \Bin(n = 40, p = 1/2)$ \begin{align*}
    \P(X = 38) &= {n \choose 38 } p^{ 38 } (1 - p)^{n - 38 } \\ &= { 40 \choose 38
    } 1/2^{ 38 } (1 - 1/2)^{40 - 38 } \\ &< 0.00001 \end{align*}
  id: totrans-118
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为正面次数。$X \sim \Bin(n = 40, p = 1/2)$ \begin{align*} \P(X = 38) &= {n \choose
    38 } p^{ 38 } (1 - p)^{n - 38 } \\ &= { 40 \choose 38 } 1/2^{ 38 } (1 - 1/2)^{40
    - 38 } \\ &< 0.00001 \end{align*}
- en: '***Question 39:*** 100 trials are run and the probability of a success on a
    given trial is 1/2\. What is the standard deviation of successes?'
  id: totrans-119
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 39:*** 进行了 100 次试验，每次试验成功的概率是 1/2。成功的标准差是多少？'
- en: '***Answer 39:***'
  id: totrans-120
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 39:***'
- en: Let $X$ be the number of successes. $X \sim \Bin(n = 100, p = 1/2)$ \begin{align*}
    \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{100 \cdot 1/2 \cdot (1 - 1/2)}\\ &= 5.00
    \end{align*}
  id: totrans-121
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为成功次数。$X \sim \Bin(n = 100, p = 1/2)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)}
    \\ &= \sqrt{100 \cdot 1/2 \cdot (1 - 1/2)}\\ &= 5.00 \end{align*}
- en: '***Question 40:*** You are trying to mine bitcoins. There are 40 independent
    attempts. The probability of a mining a bitcoin on each attempt is 3/10\. What
    is the probability that the number of bitcoins mined is 19?'
  id: totrans-122
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 40:*** 你尝试挖比特币。有 40 次独立的尝试。每次尝试挖到比特币的概率是 3/10。挖到比特币次数为 19 的概率是多少？'
- en: '***Answer 40:***'
  id: totrans-123
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 40:***'
- en: Let $X$ be the number of bitcoins mined. $X \sim \Bin(n = 40, p = 3/10)$ \begin{align*}
    \P(X = 19) &= {n \choose 19 } p^{ 19 } (1 - p)^{n - 19 } \\ &= { 40 \choose 19
    } 3/10^{ 19 } (1 - 3/10)^{40 - 19 } \\ &= 0.00852 \end{align*}
  id: totrans-124
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为挖到的比特币数。$X \sim \Bin(n = 40, p = 3/10)$ \begin{align*} \P(X = 19) &=
    {n \choose 19 } p^{ 19 } (1 - p)^{n - 19 } \\ &= { 40 \choose 19 } 3/10^{ 19 }
    (1 - 3/10)^{40 - 19 } \\ &= 0.00852 \end{align*}
- en: '***Question 41:*** 20 trials are run. 0.5 is the probability of a failure on
    each trial. What is the probability that the number of successes is 6?'
  id: totrans-125
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 41:*** 进行了 20 次试验。每次试验失败的概率是 0.5。成功的次数为 6 的概率是多少？'
- en: '***Answer 41:***'
  id: totrans-126
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 41:***'
- en: Let $X$ be the number of successes. $X \sim \Bin(n = 20, p = 0.5)$ \begin{align*}
    \P(X = 6) &= {n \choose 6 } p^{ 6 } (1 - p)^{n - 6 } \\ &= { 20 \choose 6 } 0.5^{
    6 } (1 - 0.5)^{20 - 6 } \\ &= 0.03696 \end{align*}
  id: totrans-127
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为成功次数。$X \sim \Bin(n = 20, p = 0.5)$ \begin{align*} \P(X = 6) &= {n \choose
    6 } p^{ 6 } (1 - p)^{n - 6 } \\ &= { 20 \choose 6 } 0.5^{ 6 } (1 - 0.5)^{20 -
    6 } \\ &= 0.03696 \end{align*}
- en: '***Question 42:*** You are flipping a coin. What is the probability that the
    number of tails is 0? there are 30 independent coin-flips where the probability
    of a head on a given coin-flip is 5/6\.'
  id: totrans-128
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 42:*** 你在抛硬币。反面次数为 0 的概率是多少？有 30 次独立的抛硬币，每次抛硬币正面的概率是 5/6。'
- en: '***Answer 42:***'
  id: totrans-129
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 42:***'
- en: Let $X$ be the number of tails. $X \sim \Bin(n = 30, p = 1/6)$ \begin{align*}
    \P(X = 0) &= {n \choose 0 } p^{ 0 } (1 - p)^{n - 0 } \\ &= { 30 \choose 0 } 1/6^{
    0 } (1 - 1/6)^{30 - 0 } \\ &= 0.00421 \end{align*}
  id: totrans-130
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为反面次数。$X \sim \Bin(n = 30, p = 1/6)$ \begin{align*} \P(X = 0) &= {n \choose
    0 } p^{ 0 } (1 - p)^{n - 0 } \\ &= { 30 \choose 0 } 1/6^{ 0 } (1 - 1/6)^{30 -
    0 } \\ &= 0.00421 \end{align*}
- en: '***Question 43:*** In a restaurant some customers ask for a water with their
    meal. A random sample of 20 customers is selected and each customer has a 1/4
    probability of resulting in a water not requested. What is the probability that
    the number of waters requested is 14?'
  id: totrans-131
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 43：*** 在一家餐厅，一些顾客在用餐时要求提供水。随机抽取了 20 名顾客，每位顾客有 1/4 的概率不会要求水。要求水的顾客数量为
    14 的概率是多少？'
- en: '***Answer 43:***'
  id: totrans-132
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 43：***'
- en: Let $X$ be the number of waters requested. $X \sim \Bin(n = 20, p = 3/4)$ \begin{align*}
    \P(X = 14) &= {n \choose 14 } p^{ 14 } (1 - p)^{n - 14 } \\ &= { 20 \choose 14
    } 3/4^{ 14 } (1 - 3/4)^{20 - 14 } \\ &= 0.16861 \end{align*}
  id: totrans-133
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为要求水的次数。$X \sim \Bin(n = 20, p = 3/4)$ \begin{align*} \P(X = 14) &= {n
    \choose 14 } p^{ 14 } (1 - p)^{n - 14 } \\ &= { 20 \choose 14 } 3/4^{ 14 } (1
    - 3/4)^{20 - 14 } \\ &= 0.16861 \end{align*}
- en: '***Question 44:*** A student is guessing randomly on an exam. 3/8 is the probability
    of a incorrect answer on each question. The number of independent questions is
    40\. What is the probability that the number of correct answers is less than or
    equal to 37?'
  id: totrans-134
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 44：*** 一名学生随机猜测考试中的答案。每次回答错误的概率是 3/8。独立问题的数量是 40。正确答案数量不超过 37 的概率是多少？'
- en: '***Answer 44:***'
  id: totrans-135
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 44：***'
- en: Let $X$ be the number of correct answers. $X \sim \Bin(n = 40, p = 5/8)$ \begin{align*}
    \P(X <= 37) &= 1 - \P(38 <= X <= 40)\\ &= 1 - \sum_{i = 38}^{40} {n \choose i}
    p^i (1 - p)^{n - i} \end{align*}
  id: totrans-136
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为正确答案的数量。$X \sim \Bin(n = 40, p = 5/8)$ \begin{align*} \P(X \leq 37) &=
    1 - \P(38 \leq X \leq 40)\\ &= 1 - \sum_{i = 38}^{40} {n \choose i} p^i (1 - p)^{n
    - i} \end{align*}
- en: '***Question 45:*** You are running in an election with 30 voters. 3/5 is the
    probability of a vote for you on each vote. What is the standard deviation of
    votes for you?'
  id: totrans-137
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 45：*** 你正在一场选举中拥有 30 名选民。每次投票给你票的概率是 3/5。你获得的选票的标准差是多少？'
- en: '***Answer 45:***'
  id: totrans-138
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 45：***'
- en: Let $X$ be the number of votes for you. $X \sim \Bin(n = 30, p = 3/5)$ \begin{align*}
    \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{30 \cdot 3/5 \cdot (1 - 3/5)}\\ &= 2.68
    \end{align*}
  id: totrans-139
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为你获得的选票数。$X \sim \Bin(n = 30, p = 3/5)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)}
    \\ &= \sqrt{30 \cdot 3/5 \cdot (1 - 3/5)}\\ &= 2.68 \end{align*}
- en: '***Question 46:*** Charlotte is flipping a coin 100 times. The probability
    of a tail on each coin-flip is 0.5\. What is the probability that the number of
    tails is greater than 2?'
  id: totrans-140
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 46：*** Charlotte 正在抛掷一枚硬币 100 次。每次抛掷出现 tails 的概率是 0.5。出现 tails 的次数大于
    2 的概率是多少？'
- en: '***Answer 46:***'
  id: totrans-141
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 46：***'
- en: Let $X$ be the number of tails. $X \sim \Bin(n = 100, p = 0.5)$ \begin{align*}
    \P(X > 2) &= 1 - \P(0 <= X <= 2)\\ &= 1 - \sum_{i = 0}^{2} {n \choose i} p^i (1
    - p)^{n - i} \end{align*}
  id: totrans-142
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为出现 tails 的次数。$X \sim \Bin(n = 100, p = 0.5)$ \begin{align*} \P(X > 2)
    &= 1 - \P(0 \leq X \leq 2)\\ &= 1 - \sum_{i = 0}^{2} {n \choose i} p^i (1 - p)^{n
    - i} \end{align*}
- en: '***Question 47:*** You are trying to mine bitcoins. You try 50 times. 3/5 is
    the probability of a not mining a bitcoin on each attempt. What is the probability
    that the number of bitcoins mined is 14?'
  id: totrans-143
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 47：*** 你正在尝试挖比特币。你尝试了 50 次。每次尝试不挖到比特币的概率是 3/5。挖到的比特币数量为 14 的概率是多少？'
- en: '***Answer 47:***'
  id: totrans-144
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 47：***'
- en: Let $X$ be the number of bitcoins mined. $X \sim \Bin(n = 50, p = 2/5)$ \begin{align*}
    \P(X = 14) &= {n \choose 14 } p^{ 14 } (1 - p)^{n - 14 } \\ &= { 50 \choose 14
    } 2/5^{ 14 } (1 - 2/5)^{50 - 14 } \\ &= 0.02597 \end{align*}
  id: totrans-145
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为挖到的比特币数量。$X \sim \Bin(n = 50, p = 2/5)$ \begin{align*} \P(X = 14) &=
    {n \choose 14 } p^{ 14 } (1 - p)^{n - 14 } \\ &= { 50 \choose 14 } 2/5^{ 14 }
    (1 - 2/5)^{50 - 14 } \\ &= 0.02597 \end{align*}
- en: '***Question 48:*** You are testing a new medicine on 100 patients. The probability
    of a cured patient on a given trial is 3/25\. What is the probability that the
    number of cured patients is not less than 97?'
  id: totrans-146
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 48：*** 你正在对 100 名患者进行一种新药测试。在给定试验中，治愈患者的概率是 3/25。治愈患者的数量不少于 97 的概率是多少？'
- en: '***Answer 48:***'
  id: totrans-147
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 48：***'
- en: Let $X$ be the number of cured patients. $X \sim \Bin(n = 100, p = 3/25)$ \begin{align*}
    \P(X >= 97) &= P(97 <= X <= 100)\\ &= \sum_{i = 97}^{100} {n \choose i} p^i (1
    - p)^{n - i} \end{align*}
  id: totrans-148
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为治愈的患者数量。$X \sim \Bin(n = 100, p = 3/25)$ \begin{align*} \P(X \geq 97)
    &= P(97 \leq X \leq 100)\\ &= \sum_{i = 97}^{100} {n \choose i} p^i (1 - p)^{n
    - i} \end{align*}
- en: '***Question 49:*** Wind blows independently across 40 locations. What is the
    probability that the number of locations that have wind is 40? 11/20 is the probability
    of no wind at each location.'
  id: totrans-149
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 49：*** 风独立地吹过 40 个地点。有风的地点数量为 40 的概率是多少？每个地点无风的概率是 11/20。'
- en: '***Answer 49:***'
  id: totrans-150
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 49：***'
- en: Let $X$ be the number of locations that have wind. $X \sim \Bin(n = 40, p =
    9/20)$ \begin{align*} \P(X = 40) &= {n \choose 40 } p^{ 40 } (1 - p)^{n - 40 }
    \\ &= { 40 \choose 40 } 9/20^{ 40 } (1 - 9/20)^{40 - 40 } \\ &< 0.00001 \end{align*}
  id: totrans-151
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为有风的位置的数量。$X \sim \Bin(n = 40, p = 9/20)$
- en: '***Question 50:*** You are showing an online-ad to 30 people. 1/6 is the probability
    of an ad click on each ad shown. What is the probability that the number of ad
    clicks is less than or equal to 28?'
  id: totrans-152
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 50:*** 你正在向 30 个人展示在线广告。每个广告被点击的概率是 1/6。点击数量的概率小于或等于 28 的概率是多少？'
- en: '***Answer 50:***'
  id: totrans-153
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 50:***'
- en: Let $X$ be the number of ad clicks. $X \sim \Bin(n = 30, p = 1/6)$ \begin{align*}
    \P(X <= 28) &= 1 - \P(29 <= X <= 30)\\ &= 1 - \sum_{i = 29}^{30} {n \choose i}
    p^i (1 - p)^{n - i} \end{align*}
  id: totrans-154
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为广告点击的数量。$X \sim \Bin(n = 30, p = 1/6)$
- en: '***Question 51:*** You are flipping a coin. You flip the coin 40 times and
    7/8 is the probability of a head on each coin-flip. What is the standard deviation
    of tails?'
  id: totrans-155
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 51:*** 你正在抛硬币。你抛了 40 次硬币，每次抛硬币出现正面的概率是 7/8。尾巴的标准差是多少？'
- en: '***Answer 51:***'
  id: totrans-156
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 51:***'
- en: Let $X$ be the number of tails. $X \sim \Bin(n = 40, p = 1/8)$ \begin{align*}
    \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{40 \cdot 1/8 \cdot (1 - 1/8)}\\ &= 2.09
    \end{align*}
  id: totrans-157
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为尾巴的数量。$X \sim \Bin(n = 40, p = 1/8)$
- en: '***Question 52:*** Cody is sending a stream of bits to space. 2/5 is the probability
    of a no corruption on each bit and there are 20 independent bits. What is the
    expectation of corruptions?'
  id: totrans-158
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 52:*** Cody 正在向太空发送比特流。每个比特不发生损坏的概率是 2/5，共有 20 个独立的比特。损坏的期望值是多少？'
- en: '***Answer 52:***'
  id: totrans-159
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 52:***'
- en: Let $X$ be the number of corruptions. $X \sim \Bin(n = 20, p = 3/5)$ \begin{align*}
    \E[X] &= np \\ &= 20 \cdot 3/5 \\ &= 12 \end{align*}
  id: totrans-160
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为损坏的数量。$X \sim \Bin(n = 20, p = 3/5)$
- en: '***Question 53:*** You are running in an election. There are 12 independent
    votes and 5/6 is the probability of a vote for you on each vote. What is the probability
    that the number of votes for you is greater than or equal to 9?'
  id: totrans-161
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 53:*** 你正在竞选。有 12 个独立的选票，每个选票投给你的概率是 5/6。投给你的选票数量大于或等于 9 的概率是多少？'
- en: '***Answer 53:***'
  id: totrans-162
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 53:***'
- en: Let $X$ be the number of votes for you. $X \sim \Bin(n = 12, p = 5/6)$ \begin{align*}
    \P(X >= 9) &= P(9 <= X <= 12)\\ &= \sum_{i = 9}^{12} {n \choose i} p^i (1 - p)^{n
    - i} \end{align*}
  id: totrans-163
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为对你投票的数量。$X \sim \Bin(n = 12, p = 5/6)$
- en: '***Question 54:*** You are flipping a coin. The number of tails can be represented
    by a random variable X. X is a Bin(n = 30, p = 5/6). What is the probability that
    X = 1?'
  id: totrans-164
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 54:*** 你正在抛硬币。尾巴的数量可以用随机变量 X 表示。X 是 Bin(n = 30, p = 5/6)。X = 1 的概率是多少？'
- en: '***Answer 54:***'
  id: totrans-165
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 54:***'
- en: Let $X$ be the number of tails. $X \sim \Bin(n = 30, p = 5/6)$ \begin{align*}
    \P(X = 1) &= {n \choose 1 } p^{ 1 } (1 - p)^{n - 1 } \\ &= { 30 \choose 1 } 5/6^{
    1 } (1 - 5/6)^{30 - 1 } \\ &< 0.00001 \end{align*}
  id: totrans-166
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为尾巴的数量。$X \sim \Bin(n = 30, p = 5/6)$
- en: '***Question 55:*** In a restaurant some customers ask for a water with their
    meal. A random sample of 100 customers is selected where 0.3 is the probability
    of a water requested by each customer. What is the expected number of waters requested?'
  id: totrans-167
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 55:*** 在一家餐厅，一些顾客在用餐时要求加水。随机抽取了 100 名顾客，其中每个顾客要求加水的概率是 0.3。期望请求的水的数量是多少？'
- en: '***Answer 55:***'
  id: totrans-168
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 55:***'
- en: Let $X$ be the number of waters requested. $X \sim \Bin(n = 100, p = 0.3)$ \begin{align*}
    \E[X] &= np \\ &= 100 \cdot 0.3 \\ &= 30.0 \end{align*}
  id: totrans-169
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为请求的水的数量。$X \sim \Bin(n = 100, p = 0.3)$
- en: '***Question 56:*** You are hashing strings into a hashtable. 30 strings are
    hashed. The probability of a hash to the first bucket on each string hash is 1/6\.
    What is the expected number of hashes to the first bucket?'
  id: totrans-170
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 56:*** 你正在将字符串哈希到散列表中。有 30 个字符串被哈希。每个字符串哈希到第一个桶的概率是 1/6。到达第一个桶的期望哈希数量是多少？'
- en: '***Answer 56:***'
  id: totrans-171
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 56:***'
- en: Let $X$ be the number of hashes to the first bucket. $X \sim \Bin(n = 30, p
    = 1/6)$ \begin{align*} \E[X] &= np \\ &= 30 \cdot 1/6 \\ &= 5 \end{align*}
  id: totrans-172
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为到达第一个桶的哈希数量。$X \sim \Bin(n = 30, p = 1/6)$
- en: '***Question 57:*** You are flipping a coin 100 times. What is the probability
    that the number of tails is greater than or equal to 98? 19/20 is the probability
    of a head on each coin-flip.'
  id: totrans-173
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 57:*** 你抛硬币100次。正面朝上的概率是每次抛掷的19/20。正面朝上的次数大于或等于98的概率是多少？'
- en: '***Answer 57:***'
  id: totrans-174
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 57:***'
- en: Let $X$ be the number of tails. $X \sim \Bin(n = 100, p = 1/20)$ \begin{align*}
    \P(X >= 98) &= P(98 <= X <= 100)\\ &= \sum_{i = 98}^{100} {n \choose i} p^i (1
    - p)^{n - i} \end{align*}
  id: totrans-175
  prefs: []
  type: TYPE_NORMAL
  zh: 设$X$为正面朝上的数量。$X \sim \Bin(n = 100, p = 1/20)$
- en: '***Question 58:*** Irina is running a server cluster. What is the probability
    that the number of crashes is less than 99? the server has 100 computers which
    crash independently and the probability of a computer continuing to work on a
    given server is 22/25\.'
  id: totrans-176
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 58:*** 伊琳娜正在运行一个服务器集群。服务器崩溃的数量少于99的概率是多少？服务器有100台计算机，每台计算机独立崩溃，给定服务器上计算机继续工作的概率是22/25。'
- en: '***Answer 58:***'
  id: totrans-177
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 58:***'
- en: Let $X$ be the number of crashes. $X \sim \Bin(n = 100, p = 3/25)$ \begin{align*}
    \P(X < 99) &= 1 - \P(99 <= X <= 100)\\ &= 1 - \sum_{i = 99}^{100} {n \choose i}
    p^i (1 - p)^{n - i} \end{align*}
  id: totrans-178
  prefs: []
  type: TYPE_NORMAL
  zh: 设$X$为崩溃的数量。$X \sim \Bin(n = 100, p = 3/25)$
- en: '***Question 59:*** You are manufacturing chairs and are testing for defects.
    You test 100 objects. 1/2 is the probability of a non-defect on each test. What
    is the probability that the number of defects is not greater than 97?'
  id: totrans-179
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 59:*** 你正在制造椅子并检测缺陷。你检测了100个对象。每个测试中非缺陷的概率是1/2。缺陷数量不超过97的概率是多少？'
- en: '***Answer 59:***'
  id: totrans-180
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 59:***'
- en: Let $X$ be the number of defects. $X \sim \Bin(n = 100, p = 1/2)$ \begin{align*}
    \P(X <= 97) &= 1 - \P(98 <= X <= 100)\\ &= 1 - \sum_{i = 98}^{100} {n \choose
    i} p^i (1 - p)^{n - i} \end{align*}
  id: totrans-181
  prefs: []
  type: TYPE_NORMAL
  zh: 设$X$为缺陷数量。$X \sim \Bin(n = 100, p = 1/2)$
- en: '***Question 60:*** In a restaurant some customers ask for a water with their
    meal. There are 50 customers. You can assume each customer is independent. 0.2
    is the probability of a water requested by each customer. What is the expected
    number of waters requested?'
  id: totrans-182
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 60:*** 在一家餐厅，一些顾客在用餐时要求喝水。有50位顾客。你可以假设每位顾客是独立的。每位顾客要求喝水的概率是0.2。期望有多少人要求喝水？'
- en: '***Answer 60:***'
  id: totrans-183
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 60:***'
- en: Let $X$ be the number of waters requested. $X \sim \Bin(n = 50, p = 0.2)$ \begin{align*}
    \E[X] &= np \\ &= 50 \cdot 0.2 \\ &= 10.0 \end{align*}
  id: totrans-184
  prefs: []
  type: TYPE_NORMAL
  zh: 设$X$为要求喝水的数量。$X \sim \Bin(n = 50, p = 0.2)$
- en: '***Question 61:*** You are showing an online-ad to 40 people. 1/4 is the probability
    of an ad ignore on each ad shown. What is the probability that the number of ad
    clicks is 9?'
  id: totrans-185
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 61:*** 你向40人展示在线广告。每次展示广告被忽略的概率是1/4。广告点击次数为9的概率是多少？'
- en: '***Answer 61:***'
  id: totrans-186
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 61:***'
- en: Let $X$ be the number of ad clicks. $X \sim \Bin(n = 40, p = 3/4)$ \begin{align*}
    \P(X = 9) &= {n \choose 9 } p^{ 9 } (1 - p)^{n - 9 } \\ &= { 40 \choose 9 } 3/4^{
    9 } (1 - 3/4)^{40 - 9 } \\ &< 0.00001 \end{align*}
  id: totrans-187
  prefs: []
  type: TYPE_NORMAL
  zh: 设$X$为广告点击的数量。$X \sim \Bin(n = 40, p = 3/4)$
- en: '***Question 62:*** 100 trials are run. Each trial has a 22/25 probability of
    resulting in a failure. What is the standard deviation of successes?'
  id: totrans-188
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 62:*** 进行了100次试验。每次试验有22/25的概率导致失败。成功的标准差是多少？'
- en: '***Answer 62:***'
  id: totrans-189
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 62:***'
- en: Let $X$ be the number of successes. $X \sim \Bin(n = 100, p = 3/25)$ \begin{align*}
    \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{100 \cdot 3/25 \cdot (1 - 3/25)}\\ &= 3.25
    \end{align*}
  id: totrans-190
  prefs: []
  type: TYPE_NORMAL
  zh: 设$X$为成功数量。$X \sim \Bin(n = 100, p = 3/25)$
- en: '***Question 63:*** A machine learning algorithm makes binary predictions. There
    are 12 independent guesses where the probability of a incorrect prediction on
    a given guess is 1/6\. What is the expected number of correct predictions?'
  id: totrans-191
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 63:*** 一个机器学习算法进行二元预测。有12次独立的猜测，每次猜测错误预测的概率是1/6。正确预测的期望数量是多少？'
- en: '***Answer 63:***'
  id: totrans-192
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 63:***'
- en: Let $X$ be the number of correct predictions. $X \sim \Bin(n = 12, p = 5/6)$
    \begin{align*} \E[X] &= np \\ &= 12 \cdot 5/6 \\ &= 10 \end{align*}
  id: totrans-193
  prefs: []
  type: TYPE_NORMAL
  zh: 设$X$为正确预测的数量。$X \sim \Bin(n = 12, p = 5/6)$
- en: '***Question 64:*** Waddie is showing an online-ad to customers. 1/2 is the
    probability of an ad click on each ad shown. The add is shown to 100 people. What
    is the average number of ad clicks?'
  id: totrans-194
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 64:*** 沃迪正在向客户展示在线广告。每个展示的广告被点击的概率是 1/2。广告被展示给 100 个人。平均点击次数是多少？'
- en: '***Answer 64:***'
  id: totrans-195
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 64:***'
- en: Let $X$ be the number of ad clicks. $X \sim \Bin(n = 100, p = 1/2)$ \begin{align*}
    \E[X] &= np \\ &= 100 \cdot 1/2 \\ &= 50 \end{align*}
  id: totrans-196
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为广告点击次数。$X \sim \Bin(n = 100, p = 1/2)$ \begin{align*} \E[X] &= np \\
    &= 100 \cdot 1/2 \\ &= 50 \end{align*}
- en: '***Question 65:*** Charlotte is testing a new medicine on 50 patients. The
    probability of a cured patient on a given trial is 1/5\. What is the probability
    that the number of cured patients is 12?'
  id: totrans-197
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 65:*** 夏洛特正在对 50 名患者测试一种新药。每次试验治愈患者的概率是 1/5。治愈患者数量为 12 的概率是多少？'
- en: '***Answer 65:***'
  id: totrans-198
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 65:***'
- en: Let $X$ be the number of cured patients. $X \sim \Bin(n = 50, p = 1/5)$ \begin{align*}
    \P(X = 12) &= {n \choose 12 } p^{ 12 } (1 - p)^{n - 12 } \\ &= { 50 \choose 12
    } 1/5^{ 12 } (1 - 1/5)^{50 - 12 } \\ &= 0.10328 \end{align*}
  id: totrans-199
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为治愈患者数。$X \sim \Bin(n = 50, p = 1/5)$ \begin{align*} \P(X = 12) &= {n
    \choose 12 } p^{ 12 } (1 - p)^{n - 12 } \\ &= { 50 \choose 12 } 1/5^{ 12 } (1
    - 1/5)^{50 - 12 } \\ &= 0.10328 \end{align*}
- en: '***Question 66:*** You are running in an election. The number of votes for
    you can be represented by a random variable X. X is a Bin(n = 50, p = 0.4). What
    is P(X is exactly 8)?'
  id: totrans-200
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 66:*** 你正在竞选。你的投票数可以用随机变量 X 表示。X 是 Bin(n = 50, p = 0.4)。P(X 精确等于 8) 是多少？'
- en: '***Answer 66:***'
  id: totrans-201
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 66:***'
- en: Let $X$ be the number of votes for you. $X \sim \Bin(n = 50, p = 0.4)$ \begin{align*}
    \P(X = 8) &= {n \choose 8 } p^{ 8 } (1 - p)^{n - 8 } \\ &= { 50 \choose 8 } 0.4^{
    8 } (1 - 0.4)^{50 - 8 } \\ &= 0.00017 \end{align*}
  id: totrans-202
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为为你投票的人数。$X \sim \Bin(n = 50, p = 0.4)$ \begin{align*} \P(X = 8) &= {n
    \choose 8 } p^{ 8 } (1 - p)^{n - 8 } \\ &= { 50 \choose 8 } 0.4^{ 8 } (1 - 0.4)^{50
    - 8 } \\ &= 0.00017 \end{align*}
- en: '***Question 67:*** Irina is flipping a coin 100 times. The probability of a
    head on a given coin-flip is 1/2\. What is the probability that the number of
    tails is less than or equal to 99?'
  id: totrans-203
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 67:*** 伊琳娜正在抛硬币 100 次。每次抛硬币出现正面的概率是 1/2。反面次数小于或等于 99 的概率是多少？'
- en: '***Answer 67:***'
  id: totrans-204
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 67:***'
- en: Let $X$ be the number of tails. $X \sim \Bin(n = 100, p = 0.5)$ \begin{align*}
    \P(X <= 99) &= 1 - \P(100 <= X <= 100)\\ &= 1 - {n \choose 100} p^100 (1 - p)^{n
    - 100} \end{align*}
  id: totrans-205
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为反面次数。$X \sim \Bin(n = 100, p = 0.5)$ \begin{align*} \P(X <= 99) &= 1
    - \P(100 <= X <= 100)\\ &= 1 - {n \choose 100} p^100 (1 - p)^{n - 100} \end{align*}
- en: '***Question 68:*** You are manufacturing airplanes and are testing for defects.
    You test 30 objects and the probability of a defect on a given test is 5/6\. What
    is the probability that the number of defects is 14?'
  id: totrans-206
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 68:*** 你正在制造飞机，并测试缺陷。你测试了 30 个对象，每次测试出现缺陷的概率是 5/6。缺陷数量为 14 的概率是多少？'
- en: '***Answer 68:***'
  id: totrans-207
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 68:***'
- en: Let $X$ be the number of defects. $X \sim \Bin(n = 30, p = 5/6)$ \begin{align*}
    \P(X = 14) &= {n \choose 14 } p^{ 14 } (1 - p)^{n - 14 } \\ &= { 30 \choose 14
    } 5/6^{ 14 } (1 - 5/6)^{30 - 14 } \\ &< 0.00001 \end{align*}
  id: totrans-208
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为缺陷数。$X \sim \Bin(n = 30, p = 5/6)$ \begin{align*} \P(X = 14) &= {n \choose
    14 } p^{ 14 } (1 - p)^{n - 14 } \\ &= { 30 \choose 14 } 5/6^{ 14 } (1 - 5/6)^{30
    - 14 } \\ &< 0.00001 \end{align*}
- en: '***Question 69:*** You are flipping a coin 20 times. The number of heads can
    be represented by a random variable X. X is a Binomial with 20 trials. Each trial
    is a success, independently, with probability 1/4\. What is the standard deviation
    of X?'
  id: totrans-209
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 69:*** 你正在抛硬币 20 次。正面次数可以用随机变量 X 表示。X 是 20 次试验的二项分布。每次试验独立成功，概率为 1/4。X
    的标准差是多少？'
- en: '***Answer 69:***'
  id: totrans-210
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 69:***'
- en: Let $X$ be the number of heads. $X \sim \Bin(n = 20, p = 1/4)$ \begin{align*}
    \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{20 \cdot 1/4 \cdot (1 - 1/4)}\\ &= 1.94
    \end{align*}
  id: totrans-211
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为正面次数。$X \sim \Bin(n = 20, p = 1/4)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)}
    \\ &= \sqrt{20 \cdot 1/4 \cdot (1 - 1/4)}\\ &= 1.94 \end{align*}
- en: '***Question 70:*** You are giving a survey question where responses are "like"
    or "dislike" to 100 people. What is the probability that X is equal to 4? The
    number of likes can be represented by a random variable X. X is a Bin(100, 0.5).'
  id: totrans-212
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 70:*** 你正在对 100 个人进行问卷调查，问题回答是“喜欢”或“不喜欢”。X 等于 4 的概率是多少？点赞数可以用随机变量 X 表示。X
    是 Bin(100, 0.5)。'
- en: '***Answer 70:***'
  id: totrans-213
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 70:***'
- en: Let $X$ be the number of likes. $X \sim \Bin(n = 100, p = 0.5)$ \begin{align*}
    \P(X = 4) &= {n \choose 4 } p^{ 4 } (1 - p)^{n - 4 } \\ &= { 100 \choose 4 } 0.5^{
    4 } (1 - 0.5)^{100 - 4 } \\ &< 0.00001 \end{align*}
  id: totrans-214
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为点赞数。$X \sim \Bin(n = 100, p = 0.5)$ \begin{align*} \P(X = 4) &= {n \choose
    4 } p^{ 4 } (1 - p)^{n - 4 } \\ &= { 100 \choose 4 } 0.5^{ 4 } (1 - 0.5)^{100
    - 4 } \\ &< 0.00001 \end{align*}
- en: '***Question 71:*** You are flipping a coin. There are 20 independent coin-flips
    where the probability of a tail on a given coin-flip is 0.9\. What is the standard
    deviation of tails?'
  id: totrans-215
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 71:*** 你正在抛硬币。有 20 次独立的抛掷，每次抛掷得到尾部的概率是 0.9。尾部的标准差是多少？'
- en: '***Answer 71:***'
  id: totrans-216
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 71:***'
- en: Let $X$ be the number of tails. $X \sim \Bin(n = 20, p = 0.9)$ \begin{align*}
    \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{20 \cdot 0.9 \cdot (1 - 0.9)}\\ &= 1.34
    \end{align*}
  id: totrans-217
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为尾部次数。$X \sim \Bin(n = 20, p = 0.9)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)}
    \\ &= \sqrt{20 \cdot 0.9 \cdot (1 - 0.9)}\\ &= 1.34 \end{align*}
- en: '***Question 72:*** You are flipping a coin. There are 50 independent coin-flips.
    The probability of a tail on a given coin-flip is 4/5\. What is the expectation
    of heads?'
  id: totrans-218
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 72:*** 你正在抛硬币。有 50 次独立的抛掷。每次抛掷得到尾部的概率是 4/5。成功的期望值是多少？'
- en: '***Answer 72:***'
  id: totrans-219
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 72:***'
- en: Let $X$ be the number of heads. $X \sim \Bin(n = 50, p = 1/5)$ \begin{align*}
    \E[X] &= np \\ &= 50 \cdot 1/5 \\ &= 10 \end{align*}
  id: totrans-220
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为头部次数。$X \sim \Bin(n = 50, p = 1/5)$ \begin{align*} \E[X] &= np \\ &=
    50 \cdot 1/5 \\ &= 10 \end{align*}
- en: '***Question 73:*** You are giving a survey question where responses are "like"
    or "dislike" to 100 people. What is the standard deviation of likes? the probability
    of a dislike on each response is 41/50\.'
  id: totrans-221
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 73:*** 你正在向 100 个人进行调查，调查问题是“喜欢”或“不喜欢”。不喜欢的概率是 41/50。喜欢的标准差是多少？'
- en: '***Answer 73:***'
  id: totrans-222
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 73:***'
- en: Let $X$ be the number of likes. $X \sim \Bin(n = 100, p = 9/50)$ \begin{align*}
    \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{100 \cdot 9/50 \cdot (1 - 9/50)}\\ &= 3.84
    \end{align*}
  id: totrans-223
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为点赞次数。$X \sim \Bin(n = 100, p = 9/50)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)}
    \\ &= \sqrt{100 \cdot 9/50 \cdot (1 - 9/50)}\\ &= 3.84 \end{align*}
- en: '***Question 74:*** In a restaurant some customers ask for a water with their
    meal. 0.6 is the probability of a water requested by each customer and there are
    30 independent customers. What is the expected number of waters requested?'
  id: totrans-224
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 74:*** 在一家餐厅，一些顾客在用餐时要求喝水。每位顾客要求喝水的概率是 0.6，共有 30 位独立的顾客。预计会有多少位顾客要求喝水？'
- en: '***Answer 74:***'
  id: totrans-225
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 74:***'
- en: Let $X$ be the number of waters requested. $X \sim \Bin(n = 30, p = 0.6)$ \begin{align*}
    \E[X] &= np \\ &= 30 \cdot 0.6 \\ &= 18.0 \end{align*}
  id: totrans-226
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为要求喝水的次数。$X \sim \Bin(n = 30, p = 0.6)$ \begin{align*} \E[X] &= np \\
    &= 30 \cdot 0.6 \\ &= 18.0 \end{align*}
- en: '***Question 75:*** There are 40 independent trials and 0.5 is the probability
    of a failure on each trial. What is the expectation of successes?'
  id: totrans-227
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 75:*** 有 40 次独立的试验，每次试验失败的概率是 0.5。成功的期望值是多少？'
- en: '***Answer 75:***'
  id: totrans-228
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 75:***'
- en: Let $X$ be the number of successes. $X \sim \Bin(n = 40, p = 1/2)$ \begin{align*}
    \E[X] &= np \\ &= 40 \cdot 1/2 \\ &= 20 \end{align*}
  id: totrans-229
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为成功次数。$X \sim \Bin(n = 40, p = 1/2)$ \begin{align*} \E[X] &= np \\ &=
    40 \cdot 1/2 \\ &= 20 \end{align*}
- en: '***Question 76:*** Imran is showing an online-ad to 30 people. 5/6 is the probability
    of an ad click on each ad shown. What is the standard deviation of ad clicks?'
  id: totrans-230
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 76:*** Imran 正在向 30 个人展示在线广告。每次展示广告点击的概率是 5/6。广告点击的标准差是多少？'
- en: '***Answer 76:***'
  id: totrans-231
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 76:***'
- en: Let $X$ be the number of ad clicks. $X \sim \Bin(n = 30, p = 5/6)$ \begin{align*}
    \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{30 \cdot 5/6 \cdot (1 - 5/6)}\\ &= 2.04
    \end{align*}
  id: totrans-232
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为广告点击次数。$X \sim \Bin(n = 30, p = 5/6)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)}
    \\ &= \sqrt{30 \cdot 5/6 \cdot (1 - 5/6)}\\ &= 2.04 \end{align*}
- en: '***Question 77:*** You are running a server cluster. What is the probability
    that the number of crashes is 1? the server has 30 computers which crash independently
    and each server has a 1/3 probability of resulting in a crash.'
  id: totrans-233
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 77:*** 你正在运行一个服务器集群。崩溃次数为 1 的概率是多少？服务器有 30 台计算机，它们独立崩溃，每台服务器有 1/3 的概率导致崩溃。'
- en: '***Answer 77:***'
  id: totrans-234
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 77:***'
- en: Let $X$ be the number of crashes. $X \sim \Bin(n = 30, p = 1/3)$ \begin{align*}
    \P(X = 1) &= {n \choose 1 } p^{ 1 } (1 - p)^{n - 1 } \\ &= { 30 \choose 1 } 1/3^{
    1 } (1 - 1/3)^{30 - 1 } \\ &= 0.00008 \end{align*}
  id: totrans-235
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为碰撞次数。$X \sim \Bin(n = 30, p = 1/3)$ \begin{align*} \P(X = 1) &= {n \choose
    1 } p^{ 1 } (1 - p)^{n - 1 } \\ &= { 30 \choose 1 } 1/3^{ 1 } (1 - 1/3)^{30 -
    1 } \\ &= 0.00008 \end{align*}
- en: '***Question 78:*** Cody is running a server cluster with 40 computers. What
    is P(X <= 39)? The number of crashes can be represented by a random variable X.
    X is a Bin(n = 40, p = 3/4).'
  id: totrans-236
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 78:*** Cody 正在运行一个包含 40 台计算机的服务器集群。$P(X <= 39)$ 是多少？崩溃次数可以用随机变量 $X$ 表示。$X$
    服从二项分布 $Bin(n = 40, p = 3/4)$。'
- en: '***Answer 78:***'
  id: totrans-237
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 78:***'
- en: Let $X$ be the number of crashes. $X \sim \Bin(n = 40, p = 3/4)$ \begin{align*}
    \P(X <= 39) &= 1 - \P(40 <= X <= 40)\\ &= 1 - {n \choose 40} p^40 (1 - p)^{n -
    40} \end{align*}
  id: totrans-238
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为碰撞次数。$X \sim \Bin(n = 40, p = 3/4)$ \begin{align*} \P(X <= 39) &= 1 -
    \P(40 <= X <= 40)\\ &= 1 - {n \choose 40} p^40 (1 - p)^{n - 40} \end{align*}
- en: '***Question 79:*** You are hashing strings into a hashtable. 5/6 is the probability
    of a hash to the first bucket on each string hash. There are 30 independent string
    hashes. What is the probability that the number of hashes to the first bucket
    is greater than or equal to 29?'
  id: totrans-239
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 79:*** 你将字符串哈希到散列表中。每个字符串哈希到第一个桶的概率是5/6。有30个独立的字符串哈希。到达第一个桶的哈希数量大于或等于29的概率是多少？'
- en: '***Answer 79:***'
  id: totrans-240
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 79:***'
- en: Let $X$ be the number of hashes to the first bucket. $X \sim \Bin(n = 30, p
    = 5/6)$ \begin{align*} \P(X >= 29) &= P(29 <= X <= 30)\\ &= \sum_{i = 29}^{30}
    {n \choose i} p^i (1 - p)^{n - i} \end{align*}
  id: totrans-241
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为到达第一个桶的哈希数量。$X \sim \Bin(n = 30, p = 5/6)$ \begin{align*} \P(X >= 29)
    &= P(29 <= X <= 30)\\ &= \sum_{i = 29}^{30} {n \choose i} p^i (1 - p)^{n - i}
    \end{align*}
- en: '***Question 80:*** Irina is flipping a coin. Irina flips the coin 30 times
    and the probability of a head on each coin-flip is 0.4\. What is the probability
    that the number of tails is 19?'
  id: totrans-242
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 80:*** 伊丽娜在抛硬币。伊丽娜抛硬币30次，每次抛硬币正面朝上的概率是0.4。尾巴的数量为19的概率是多少？'
- en: '***Answer 80:***'
  id: totrans-243
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 80:***'
- en: Let $X$ be the number of tails. $X \sim \Bin(n = 30, p = 0.6)$ \begin{align*}
    \P(X = 19) &= {n \choose 19 } p^{ 19 } (1 - p)^{n - 19 } \\ &= { 30 \choose 19
    } 0.6^{ 19 } (1 - 0.6)^{30 - 19 } \\ &= 0.13962 \end{align*}
  id: totrans-244
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为反面朝上的次数。$X \sim \Bin(n = 30, p = 0.6)$ \begin{align*} \P(X = 19) &= {n
    \choose 19 } p^{ 19 } (1 - p)^{n - 19 } \\ &= { 30 \choose 19 } 0.6^{ 19 } (1
    - 0.6)^{30 - 19 } \\ &= 0.13962 \end{align*}
- en: '***Question 81:*** You are asking a survey question where responses are "like"
    or "dislike". The probability of a like on a given response is 1/2\. You give
    the survey to 100 people. What is the probability that the number of likes is
    not less than 2?'
  id: totrans-245
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 81:*** 你在做一个调查问题，回答是“喜欢”或“不喜欢”。给定回答中“喜欢”的概率是1/2。你向100人发放调查问卷。点赞数量不少于2的概率是多少？'
- en: '***Answer 81:***'
  id: totrans-246
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 81:***'
- en: Let $X$ be the number of likes. $X \sim \Bin(n = 100, p = 1/2)$ \begin{align*}
    \P(X >= 2) &= 1 - \P(0 <= X <= 1)\\ &= 1 - \sum_{i = 0}^{1} {n \choose i} p^i
    (1 - p)^{n - i} \end{align*}
  id: totrans-247
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为点赞数量。$X \sim \Bin(n = 100, p = 1/2)$ \begin{align*} \P(X >= 2) &= 1 -
    \P(0 <= X <= 1)\\ &= 1 - \sum_{i = 0}^{1} {n \choose i} p^i (1 - p)^{n - i} \end{align*}
- en: '***Question 82:*** Wind blows independently across locations. The number of
    independent locations is 100\. The probability of wind at a given location is
    3/20\. What is the probability that the number of locations that have wind is
    93?'
  id: totrans-248
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 82:*** 风在各个位置上独立吹拂。独立的位置数量是100。给定位置有风的概率是3/20。有风的位置数量为93的概率是多少？'
- en: '***Answer 82:***'
  id: totrans-249
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 82:***'
- en: Let $X$ be the number of locations that have wind. $X \sim \Bin(n = 100, p =
    3/20)$ \begin{align*} \P(X = 93) &= {n \choose 93 } p^{ 93 } (1 - p)^{n - 93 }
    \\ &= { 100 \choose 93 } 3/20^{ 93 } (1 - 3/20)^{100 - 93 } \\ &< 0.00001 \end{align*}
  id: totrans-250
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为有风的位置数量。$X \sim \Bin(n = 100, p = 3/20)$ \begin{align*} \P(X = 93) &=
    {n \choose 93 } p^{ 93 } (1 - p)^{n - 93 } \\ &= { 100 \choose 93 } 3/20^{ 93
    } (1 - 3/20)^{100 - 93 } \\ &< 0.00001 \end{align*}
- en: '***Question 83:*** You are flipping a coin. 0.9 is the probability of a tail
    on each coin-flip. You flip the coin 50 times. What is the expected number of
    heads?'
  id: totrans-251
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 83:*** 你在抛硬币。每次抛硬币反面朝上的概率是0.9。你抛硬币50次。正面朝上的期望数量是多少？'
- en: '***Answer 83:***'
  id: totrans-252
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 83:***'
- en: Let $X$ be the number of heads. $X \sim \Bin(n = 50, p = 0.1)$ \begin{align*}
    \E[X] &= np \\ &= 50 \cdot 0.1 \\ &= 5.0 \end{align*}
  id: totrans-253
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为正面朝上的次数。$X \sim \Bin(n = 50, p = 0.1)$ \begin{align*} \E[X] &= np \\
    &= 50 \cdot 0.1 \\ &= 5.0 \end{align*}
- en: '***Question 84:*** A machine learning algorithm makes binary predictions. What
    is the probability that the number of correct predictions is less than or equal
    to 0? the probability of a incorrect prediction on a given guess is 1/4\. The
    number of independent guesses is 40\.'
  id: totrans-254
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 84:*** 一个机器学习算法做出二元预测。正确预测的数量小于或等于0的概率是多少？在给定猜测上的错误预测的概率是1/4。独立的猜测次数是40次。'
- en: '***Answer 84:***'
  id: totrans-255
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 84:***'
- en: Let $X$ be the number of correct predictions. $X \sim \Bin(n = 40, p = 3/4)$
    \begin{align*} \P(X <= 0) &= P(0 <= X <= 0)\\ &= {n \choose 0} p^0 (1 - p)^{n
    - 0} \end{align*}
  id: totrans-256
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为正确预测的数量。$X \sim \Bin(n = 40, p = 3/4)$ \begin{align*} \P(X <= 0) &= P(0
    <= X <= 0)\\ &= {n \choose 0} p^0 (1 - p)^{n - 0} \end{align*}
- en: '***Question 85:*** Wind blows independently across 20 locations. 1/2 is the
    probability of wind at each location. What is the standard deviation of locations
    that have wind?'
  id: totrans-257
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 85:*** 风在20个位置上独立吹拂。每个位置有风的概率是1/2。有风的位置的标准差是多少？'
- en: '***Answer 85:***'
  id: totrans-258
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 85:***'
- en: Let $X$ be the number of locations that have wind. $X \sim \Bin(n = 20, p =
    1/2)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{20 \cdot 1/2 \cdot
    (1 - 1/2)}\\ &= 2.24 \end{align*}
  id: totrans-259
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为有风的地点数量。$X \sim \Bin(n = 20, p = 1/2)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)}
    \\ &= \sqrt{20 \cdot 1/2 \cdot (1 - 1/2)}\\ &= 2.24 \end{align*}
- en: '***Question 86:*** 7/10 is the probability of a failure on each trial and the
    number of independent trials is 100\. What is the probability that the number
    of successes is 7?'
  id: totrans-260
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 86:*** 每次试验失败的概率是 7/10，独立试验的数量是 100。成功次数为 7 的概率是多少？'
- en: '***Answer 86:***'
  id: totrans-261
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 86:***'
- en: Let $X$ be the number of successes. $X \sim \Bin(n = 100, p = 0.3)$ \begin{align*}
    \P(X = 7) &= {n \choose 7 } p^{ 7 } (1 - p)^{n - 7 } \\ &= { 100 \choose 7 } 0.3^{
    7 } (1 - 0.3)^{100 - 7 } \\ &< 0.00001 \end{align*}
  id: totrans-262
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为成功次数。$X \sim \Bin(n = 100, p = 0.3)$ \begin{align*} \P(X = 7) &= {n \choose
    7 } p^{ 7 } (1 - p)^{n - 7 } \\ &= { 100 \choose 7 } 0.3^{ 7 } (1 - 0.3)^{100
    - 7 } \\ &< 0.00001 \end{align*}
- en: '***Question 87:*** You generate random bit strings. What is the expectation
    of 1s? there are 100 independent bits and 0.1 is the probability of a 1 at each
    bit.'
  id: totrans-263
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 87:*** 你生成随机的比特字符串。1s 的期望值是多少？有 100 个独立的比特，每个比特为 1 的概率是 0.1。'
- en: '***Answer 87:***'
  id: totrans-264
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 87:***'
- en: Let $X$ be the number of 1s. $X \sim \Bin(n = 100, p = 0.1)$ \begin{align*}
    \E[X] &= np \\ &= 100 \cdot 0.1 \\ &= 10.0 \end{align*}
  id: totrans-265
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为 1 的数量。$X \sim \Bin(n = 100, p = 0.1)$ \begin{align*} \E[X] &= np \\
    &= 100 \cdot 0.1 \\ &= 10.0 \end{align*}
- en: '***Question 88:*** You are testing a new medicine on patients. 3/5 is the probability
    of a cured patient on each trial. There are 30 independent trials. What is the
    probability that the number of cured patients is greater than or equal to 1?'
  id: totrans-266
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 88:*** 你正在对病人进行新药测试。每次试验治愈患者的概率是 3/5。有 30 次独立的试验。治愈患者数量大于或等于 1 的概率是多少？'
- en: '***Answer 88:***'
  id: totrans-267
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 88:***'
- en: Let $X$ be the number of cured patients. $X \sim \Bin(n = 30, p = 3/5)$ \begin{align*}
    \P(X >= 1) &= 1 - \P(0 <= X <= 0)\\ &= 1 - {n \choose 0} p^0 (1 - p)^{n - 0} \end{align*}
  id: totrans-268
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为治愈的患者数量。$X \sim \Bin(n = 30, p = 3/5)$ \begin{align*} \P(X >= 1) &= 1
    - \P(0 <= X <= 0)\\ &= 1 - {n \choose 0} p^0 (1 - p)^{n - 0} \end{align*}
- en: '***Question 89:*** A student is guessing randomly on an exam. 0.9 is the probability
    of a correct answer on each question and the test has 20 questions. What is the
    standard deviation of correct answers?'
  id: totrans-269
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 89:*** 一个学生在考试中随机猜测。每道题正确答案的概率是 0.9，考试有 20 道题。正确答案的标准差是多少？'
- en: '***Answer 89:***'
  id: totrans-270
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 89:***'
- en: Let $X$ be the number of correct answers. $X \sim \Bin(n = 20, p = 0.9)$ \begin{align*}
    \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{20 \cdot 0.9 \cdot (1 - 0.9)}\\ &= 1.34
    \end{align*}
  id: totrans-271
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为正确答案的数量。$X \sim \Bin(n = 20, p = 0.9)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)}
    \\ &= \sqrt{20 \cdot 0.9 \cdot (1 - 0.9)}\\ &= 1.34 \end{align*}
- en: '***Question 90:*** A student is guessing randomly on an exam with 40 questions.
    What is the probability that the number of correct answers is 32? 0.5 is the probability
    of a correct answer on each question.'
  id: totrans-272
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 90:*** 一个学生在 40 道题的考试中随机猜测。正确答案的数量是 32 的概率是多少？每道题正确答案的概率是 0.5。'
- en: '***Answer 90:***'
  id: totrans-273
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 90:***'
- en: Let $X$ be the number of correct answers. $X \sim \Bin(n = 40, p = 0.5)$ \begin{align*}
    \P(X = 32) &= {n \choose 32 } p^{ 32 } (1 - p)^{n - 32 } \\ &= { 40 \choose 32
    } 0.5^{ 32 } (1 - 0.5)^{40 - 32 } \\ &= 0.00007 \end{align*}
  id: totrans-274
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为正确答案的数量。$X \sim \Bin(n = 40, p = 0.5)$ \begin{align*} \P(X = 32) &= {n
    \choose 32 } p^{ 32 } (1 - p)^{n - 32 } \\ &= { 40 \choose 32 } 0.5^{ 32 } (1
    - 0.5)^{40 - 32 } \\ &= 0.00007 \end{align*}
- en: '***Question 91:*** In a restaurant some customers ask for a water with their
    meal. A random sample of 40 customers is selected where the probability of a water
    not requested by a given customer is 1/4\. What is the standard deviation of waters
    requested?'
  id: totrans-275
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 91:*** 在一家餐厅，一些顾客在用餐时要求加水。从 40 名顾客中随机抽取样本，其中某个顾客不要求加水的概率是 1/4。要求加水的标准差是多少？'
- en: '***Answer 91:***'
  id: totrans-276
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 91:***'
- en: Let $X$ be the number of waters requested. $X \sim \Bin(n = 40, p = 3/4)$ \begin{align*}
    \Std(X) &= \sqrt{np(1-p)} \\ &= \sqrt{40 \cdot 3/4 \cdot (1 - 3/4)}\\ &= 2.74
    \end{align*}
  id: totrans-277
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为要求加水的数量。$X \sim \Bin(n = 40, p = 3/4)$ \begin{align*} \Std(X) &= \sqrt{np(1-p)}
    \\ &= \sqrt{40 \cdot 3/4 \cdot (1 - 3/4)}\\ &= 2.74 \end{align*}
- en: '***Question 92:*** A machine learning algorithm makes binary predictions. The
    number of correct predictions can be represented by a random variable X. X is
    a Bin(n = 30, p = 2/5). What is P(X < 27)?'
  id: totrans-278
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 92:*** 一个机器学习算法进行二元预测。正确预测的数量可以用随机变量 X 表示。X 是 Bin(n = 30, p = 2/5)。P(X
    < 27) 是多少？'
- en: '***Answer 92:***'
  id: totrans-279
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 92:***'
- en: Let $X$ be the number of correct predictions. $X \sim \Bin(n = 30, p = 2/5)$
    \begin{align*} \P(X < 27) &= 1 - \P(27 <= X <= 30)\\ &= 1 - \sum_{i = 27}^{30}
    {n \choose i} p^i (1 - p)^{n - i} \end{align*}
  id: totrans-280
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为正确预测的数量。$X \sim \Bin(n = 30, p = 2/5)$ \begin{align*} \P(X < 27) &= 1
    - \P(27 <= X <= 30)\\ &= 1 - \sum_{i = 27}^{30} {n \choose i} p^i (1 - p)^{n -
    i} \end{align*}
- en: '***Question 93:*** Irina is flipping a coin. The probability of a tail on each
    coin-flip is 3/4\. The number of independent coin-flips is 40\. What is the probability
    that the number of tails is greater than 0?'
  id: totrans-281
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 93:*** 伊丽娜正在抛硬币。每次抛硬币得到尾部的概率是 3/4。独立抛硬币的次数是 40。尾部数量大于 0 的概率是多少？'
- en: '***Answer 93:***'
  id: totrans-282
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 93:***'
- en: Let $X$ be the number of tails. $X \sim \Bin(n = 40, p = 3/4)$ \begin{align*}
    \P(X > 0) &= 1 - \P(0 <= X <= 0)\\ &= 1 - {n \choose 0} p^0 (1 - p)^{n - 0} \end{align*}
  id: totrans-283
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为尾部的数量。$X \sim \Bin(n = 40, p = 3/4)$ \begin{align*} \P(X > 0) &= 1 -
    \P(0 <= X <= 0)\\ &= 1 - {n \choose 0} p^0 (1 - p)^{n - 0} \end{align*}
- en: '***Question 94:*** Waddie is sending a stream of 50 bits to space. The probability
    of a no corruption on a given bit is 1/2\. What is the expectation of corruptions?'
  id: totrans-284
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 94:*** 沃迪正在向太空发送一个 50 位的比特流。给定比特没有损坏的概率是 1/2。损坏的期望值是多少？'
- en: '***Answer 94:***'
  id: totrans-285
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 94:***'
- en: Let $X$ be the number of corruptions. $X \sim \Bin(n = 50, p = 0.5)$ \begin{align*}
    \E[X] &= np \\ &= 50 \cdot 0.5 \\ &= 25.0 \end{align*}
  id: totrans-286
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为损坏的数量。$X \sim \Bin(n = 50, p = 0.5)$ \begin{align*} \E[X] &= np \\ &=
    50 \cdot 0.5 \\ &= 25.0 \end{align*}
- en: '***Question 95:*** You are hashing strings into a hashtable. There are 30 independent
    string hashes where the probability of a hash to the first bucket on each string
    hash is 5/6\. What is the probability that the number of hashes to the first bucket
    is 24?'
  id: totrans-287
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 95:*** 你正在将字符串哈希到散列表中。有 30 个独立的字符串哈希，每个字符串哈希到达第一个桶的概率是 5/6。到达第一个桶的哈希次数为
    24 的概率是多少？'
- en: '***Answer 95:***'
  id: totrans-288
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 95:***'
- en: Let $X$ be the number of hashes to the first bucket. $X \sim \Bin(n = 30, p
    = 5/6)$ \begin{align*} \P(X = 24) &= {n \choose 24 } p^{ 24 } (1 - p)^{n - 24
    } \\ &= { 30 \choose 24 } 5/6^{ 24 } (1 - 5/6)^{30 - 24 } \\ &= 0.16009 \end{align*}
  id: totrans-289
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为到达第一个桶的哈希次数。$X \sim \Bin(n = 30, p = 5/6)$ \begin{align*} \P(X = 24)
    &= {n \choose 24 } p^{ 24 } (1 - p)^{n - 24 } \\ &= { 30 \choose 24 } 5/6^{ 24
    } (1 - 5/6)^{30 - 24 } \\ &= 0.16009 \end{align*}
- en: '***Question 96:*** Charlotte is hashing strings into a hashtable. 100 strings
    are hashed and the probability of a hash to the first bucket on a given string
    hash is 1/5\. What is the probability that the number of hashes to the first bucket
    is greater than or equal to 1?'
  id: totrans-290
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 96:*** 夏洛特正在将字符串哈希到散列表中。100 个字符串被哈希，给定字符串哈希到达第一个桶的概率是 1/5。到达第一个桶的哈希次数大于或等于
    1 的概率是多少？'
- en: '***Answer 96:***'
  id: totrans-291
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 96:***'
- en: Let $X$ be the number of hashes to the first bucket. $X \sim \Bin(n = 100, p
    = 1/5)$ \begin{align*} \P(X >= 1) &= 1 - \P(0 <= X <= 0)\\ &= 1 - {n \choose 0}
    p^0 (1 - p)^{n - 0} \end{align*}
  id: totrans-292
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为到达第一个桶的哈希次数。$X \sim \Bin(n = 100, p = 1/5)$ \begin{align*} \P(X >= 1)
    &= 1 - \P(0 <= X <= 0)\\ &= 1 - {n \choose 0} p^0 (1 - p)^{n - 0} \end{align*}
- en: '***Question 97:*** You are flipping a coin. Each coin-flip has a 3/10 probability
    of resulting in a head and there are 100 coin-flips. You can assume each coin-flip
    is independent. What is the probability that the number of heads is 0?'
  id: totrans-293
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 97:*** 你正在抛硬币。每次抛硬币得到头部的概率是 3/10，共有 100 次抛硬币。你可以假设每次抛硬币是独立的。头部数量为 0 的概率是多少？'
- en: '***Answer 97:***'
  id: totrans-294
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 97:***'
- en: Let $X$ be the number of heads. $X \sim \Bin(n = 100, p = 3/10)$ \begin{align*}
    \P(X = 0) &= {n \choose 0 } p^{ 0 } (1 - p)^{n - 0 } \\ &= { 100 \choose 0 } 3/10^{
    0 } (1 - 3/10)^{100 - 0 } \\ &< 0.00001 \end{align*}
  id: totrans-295
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为头部的数量。$X \sim \Bin(n = 100, p = 3/10)$ \begin{align*} \P(X = 0) &= {n
    \choose 0 } p^{ 0 } (1 - p)^{n - 0 } \\ &= { 100 \choose 0 } 3/10^{ 0 } (1 - 3/10)^{100
    - 0 } \\ &< 0.00001 \end{align*}
- en: '***Question 98:*** Chris is sending a stream of 50 bits to space. 16/25 is
    the probability of a no corruption on each bit. What is the probability that the
    number of corruptions is greater than or equal to 47?'
  id: totrans-296
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 98:*** 克里斯正在向太空发送一个 50 位的比特流。每个比特没有损坏的概率是 16/25。损坏的数量大于或等于 47 的概率是多少？'
- en: '***Answer 98:***'
  id: totrans-297
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 98:***'
- en: Let $X$ be the number of corruptions. $X \sim \Bin(n = 50, p = 9/25)$ \begin{align*}
    \P(X >= 47) &= P(47 <= X <= 50)\\ &= \sum_{i = 47}^{50} {n \choose i} p^i (1 -
    p)^{n - i} \end{align*}
  id: totrans-298
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为损坏的数量。$X \sim \Bin(n = 50, p = 9/25)$ \begin{align*} \P(X >= 47) &= P(47
    <= X <= 50)\\ &= \sum_{i = 47}^{50} {n \choose i} p^i (1 - p)^{n - i} \end{align*}
- en: '***Question 99:*** You are flipping a coin 30 times. What is the probability
    that the number of tails is less than 29? the probability of a tail on a given
    coin-flip is 2/3\.'
  id: totrans-299
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 99:*** 你正在抛硬币 30 次。尾部数量少于 29 的概率是多少？给定抛硬币得到尾部的概率是 2/3。'
- en: '***Answer 99:***'
  id: totrans-300
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 99:***'
- en: Let $X$ be the number of tails. $X \sim \Bin(n = 30, p = 2/3)$ \begin{align*}
    \P(X < 29) &= 1 - \P(29 <= X <= 30)\\ &= 1 - \sum_{i = 29}^{30} {n \choose i}
    p^i (1 - p)^{n - i} \end{align*}
  id: totrans-301
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为反面出现的次数。$X \sim \Bin(n = 30, p = 2/3)$ \begin{align*} \P(X < 29) &= 1
    - \P(29 <= X <= 30)\\ &= 1 - \sum_{i = 29}^{30} {n \choose i} p^i (1 - p)^{n -
    i} \end{align*}
- en: '***Question 100:*** You are manufacturing chips and are testing for defects.
    There are 40 independent tests. The probability of a non-defect on a given test
    is 5/8\. What is the probability that the number of defects is 10?'
  id: totrans-302
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题 100：*** 你正在制造芯片，并对其进行缺陷测试。有 40 个独立的测试。给定测试中非缺陷的概率是 5/8。缺陷数量为 10 的概率是多少？'
- en: '***Answer 100:***'
  id: totrans-303
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案 100：***'
- en: Let $X$ be the number of defects. $X \sim \Bin(n = 40, p = 3/8)$ \begin{align*}
    \P(X = 10) &= {n \choose 10 } p^{ 10 } (1 - p)^{n - 10 } \\ &= { 40 \choose 10
    } 3/8^{ 10 } (1 - 3/8)^{40 - 10 } \\ &= 0.03507 \end{align*}
  id: totrans-304
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $X$ 为缺陷的数量。$X \sim \Bin(n = 40, p = 3/8)$ \begin{align*} \P(X = 10) &= {n
    \choose 10 } p^{ 10 } (1 - p)^{n - 10 } \\ &= { 40 \choose 10 } 3/8^{ 10 } (1
    - 3/8)^{40 - 10 } \\ &= 0.03507 \end{align*}
