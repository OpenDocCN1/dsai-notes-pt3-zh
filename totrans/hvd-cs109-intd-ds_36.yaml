- en: 25.3 Exercises
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: In the previous exercise section, we wrangled data from a PDF file containing
    vital statistics from Puerto Rico. We did this for the month of September. Below
    we include code that does it for all 12 months.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE21]'
  prefs: []
  type: TYPE_PRE
- en: 1\. We want to make a plot of death counts versus date. A first step is to convert
    the month variable from characters to numbers. Note that the month abbreviations
    are in Spanglish. Use the `recode` function to convert months to numbers and redefine
    `tab`.
  prefs: []
  type: TYPE_NORMAL
- en: '2\. Create a new column `date` with the date for each observation. Hint: use
    the `make_date` function.'
  prefs: []
  type: TYPE_NORMAL
- en: 3\. Plot deaths versus date.
  prefs: []
  type: TYPE_NORMAL
- en: 4\. Note that after May 31, 2018, the deaths are all 0\. The data is probably
    not entered yet. We also see a drop off starting around May 1\. Redefine `tab`
    to exclude observations taken on or after May 1, 2018\. Then, remake the plot.
  prefs: []
  type: TYPE_NORMAL
- en: '5\. Remake the plot above but this time plot deaths against the day of the
    year, for example, Jan 12, 2016 and Jan 12, 2017 are both day 12\. Use color to
    denote the different years. Hint: use the **lubridate** function `yday`.'
  prefs: []
  type: TYPE_NORMAL
- en: 6\. Remake the plot above but, this time, use two different colors for before
    and after September 20, 2017.
  prefs: []
  type: TYPE_NORMAL
- en: '7\. Advanced: remake the plot above, but this time show the month in the x-axis.
    Hint: create a variable with the date for a given year. Then use the `scale_x_date`
    function to show just the months.'
  prefs: []
  type: TYPE_NORMAL
- en: '8\. Remake the deaths versus day but with weekly averages. Hint: use the function
    `round_date`.'
  prefs: []
  type: TYPE_NORMAL
- en: '9\. Remake the plot but with monthly averages. Hint: use the function `round_date`
    again.'
  prefs: []
  type: TYPE_NORMAL
