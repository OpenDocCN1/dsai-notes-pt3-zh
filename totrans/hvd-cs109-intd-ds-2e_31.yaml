- en: 2  Numerical Summaries
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/summaries/numerical-summaries.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/summaries/numerical-summaries.html)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '[Summary Statistics](../summaries/intro-summaries.html)'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '[2  Numerical Summaries](../summaries/numerical-summaries.html)'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'Histograms and density plots provide excellent summaries of a distribution.
    But can we summarize even further? We often see the average and standard deviation
    used as summary statistics: a two-number summary! To understand what these summaries
    are and why they are so widely used, we need to understand the normal distribution.'
  prefs: []
  type: TYPE_NORMAL
- en: 2.1 The normal distribution
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: The normal distribution, also known as the bell curve and as the Gaussian distribution,
    is one of the most famous mathematical concepts in history. One reason for this
    is that approximately normal distributions occur in many situations, including
    gambling winnings, heights, weights, blood pressure, standardized test scores,
    and experimental measurement errors. There are explanations for these occurrences,
    which we will describe later. Here we focus on how the normal distribution helps
    us summarize data.
  prefs: []
  type: TYPE_NORMAL
- en: 'Rather than using data, the normal distribution is defined with a mathematical
    formula. For any interval \((a,b)\), the proportion of values in that interval
    can be computed using this formula:'
  prefs: []
  type: TYPE_NORMAL
- en: \[\mathrm{Pr}(a < x \leq b) = \int_a^b \frac{1}{\sqrt{2\pi}\sigma} e^{-\frac{1}{2}\left(
    \frac{x-\mu}{\sigma} \right)^2} \, dx\]
  prefs: []
  type: TYPE_NORMAL
- en: 'But you don’t need to memorize the formula to use the normal distribution in
    practics. The most important characterstics is that it is completely defined by
    just two parameters: \(\mu\) and \(\sigma\). The rest of the symbols in the formula
    represent the interval ends, \(a\) and \(b\), and known mathematical constants
    \(\pi\) and \(e\). These two parameters, \(\mu\) and \(\sigma\), are referred
    to as the *mean* and the *standard deviation* (SD) of the distribution, respectively
    (and are the Greek letters for \(m\) and \(s\)). In R the fucntion `pnorm` let’s
    us compute the \(\mathrm{Pr}(x \leq a)\) for any \(a,\mu,\) and \(\sigma\):'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: '*The distribution is symmetric, centered at \(\mu\), and most values (about
    95%) are within \(2\sigma\) from \(\mu\). Here is what the normal distribution
    looks like when the \(\mu = 0\) and \(\sigma = 1\):'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/4a92c76b4970ac517c9a91d40238d4ad.png)'
  prefs: []
  type: TYPE_IMG
- en: 'The fact that the distribution is defined by just two parameters implies that
    if a dataset’s distribution is approximated by the normal distribution, all the
    information needed to describe the distribution can be encoded in just two numbers:
    the mean and the standard deviation.*'
  prefs: []
  type: TYPE_NORMAL
- en: '*2.2 The average and standard deviation*'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '*Discrete distributions also have means and standard deviations. We will discuss
    these terms in more detail in [Chapter 7](../prob/random-variables.html). For
    a list of values \(x_1, \dots, x_n\) the mean, call it \(\mu_x\) is defined by'
  prefs: []
  type: TYPE_NORMAL
- en: \[ \mu_x = \frac{1}{n}\sum_{i=1}^n x_i \] Note that this is equivalent to the
    average of the \(x\)s.
  prefs: []
  type: TYPE_NORMAL
- en: The standard deviation is defined with
  prefs: []
  type: TYPE_NORMAL
- en: \[ \sigma_x = \sqrt{\frac{1}{n}\sum_{i=1}^n (x_i - \mu_x)^2} \] which can be
    thought of as the average distance of the points \(x_i\) to the mean \(\mu_x\).
  prefs: []
  type: TYPE_NORMAL
- en: 'Let’s compute the mean and stardard deviations for the height for males:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: '*The pre-built functions `mean` and `sd` can be used here:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: '**For reasons explained in [Section 10.2.1](../inference/models.html#sec-population-sd),
    `sd(x)` divides by `length(x)-1` rather than `length(x)`. But note that when `length(x)`
    is large, `sd(x)` and `sqrt(sum((x-mu)^2)/length(x))` are practically equal.*  *If
    the distribution of the values stored in `x` is well approximated by a normal
    distribution, it makes sense to use the normal distribution with mean `m <- mean(x)`
    and standard deviation `s <- sd(x)`. This means that the entire distribution of
    `x` can be summarized with just these two numbers!'
  prefs: []
  type: TYPE_NORMAL
- en: 'The plot below shows the smooth density of the observed data (blue) and the
    corresponding normal approximation (black line) with mean = 69.3 and SD = 3.6:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/81d84d86040c8b0ed1ee203d3563ae68.png)'
  prefs: []
  type: TYPE_IMG
- en: The normal distribution appears to be a good approximation. For example, the
    probabilities computed using `pnorm` closely match those estimated directly from
    the data.
  prefs: []
  type: TYPE_NORMAL
- en: 'To check this, we can compare the proportion of observations falling within
    a given interval, say \((a, b]\), as predicted by the normal model to the actual
    proportion observed in the data. The proportion of values in the interval \([a,
    b]\) can be computed with:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: '*Here, the logical expression `x >= a & x <= b` returns `TRUE` for all values
    of `x` in the interval and `FALSE` otherwise. Because the `mean` function automatically
    converts `TRUE` to 1 and `FALSE` to 0, the average of this logical vector is simply
    the proportion of observations that fall within the interval. We will use this
    convenient approach throughout the book.'
  prefs: []
  type: TYPE_NORMAL
- en: The following examples illustrate how closely the observed proportions match
    the theoretical probabilities from the normal distribution.
  prefs: []
  type: TYPE_NORMAL
- en: 'The probability of being shorter than the average student:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE4]'
  prefs: []
  type: TYPE_PRE
- en: '*The probability of being within two standard deviations of the mean:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE5]'
  prefs: []
  type: TYPE_PRE
- en: '**When using the normal approximation with discrete data (for example, when
    heights are rounded to the nearest inch), note that `mean(x < a)` and `mean(x
    <= a)` may differ. In such cases, it’s common to apply a *continuity correction*,
    using `pnorm(a + delta/2, m, s)` to approximate `mean(x <= a)`, where `delta`
    is the bin width (in our example, 1 inch). In our dataset, however, some students
    reported more precise measurements, so the degree of discretization varies. As
    a result, the normal approximation should be applied with care.********'
  prefs: []
  type: TYPE_NORMAL
- en: '*****2.3 Standard units*****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '*****For data that is approximately normally distributed, it is convenient
    to think in terms of *standard units*. The standard unit of a value tells us how
    many standard deviations away from the average it is. Specifically, for a value
    `x` from a vector `x`, we define the value of `x` in standard units as `z = (x
    - m)/s` with `m` and `s` the average and standard deviation of `x`, respectively.
    Why is this convenient?'
  prefs: []
  type: TYPE_NORMAL
- en: First, revisit the formula for the normal distribution and observe that what
    is being exponentiated is \(-z^2/2\) with \(z\) equivalent to \(x\) in standard
    units. Because the maximum of \(e^{-z^2/2}\) is at \(z = 0\), this explains why
    the maximum of the distribution occurs at the mean. It also explains the symmetry
    since \(- z^2/2\) is symmetric around 0\. Second, note that by converting the
    normally distributed data to standard units, we can quickly ascertain whether,
    for example, a person is about average (\(z = 0\)), one of the tallest (\(z \approx
    2\)), one of the shortest (\(z \approx -2\)), or an extremely rare occurrence
    (\(z > 3\) or \(z < -3\)). Remember that it does not matter what the original
    units are, these rules apply to any data that is approximately normal.
  prefs: []
  type: TYPE_NORMAL
- en: 'In R, we can transform to standard units using the function `scale`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE6]'
  prefs: []
  type: TYPE_PRE
- en: '*To see how many males are within 2 SDs from the average, we simply type:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE7]'
  prefs: []
  type: TYPE_PRE
- en: '*The proportion is about 95%, which is what the normal distribution predicts!'
  prefs: []
  type: TYPE_NORMAL
- en: '*In statistics, the letter \(z\) is commonly used to denote values expressed
    in standard units. When referring to random outcomes rather than specific observed
    values, we use an uppercase \(Z\).'
  prefs: []
  type: TYPE_NORMAL
- en: Throughout this book, we use \(z\) and \(Z\) in this way whenever we describe
    quantities that have been standardized. This notation helps connect examples across
    different chapters.********
  prefs: []
  type: TYPE_NORMAL
- en: '*****2.4 Robust summaries*****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '*****Note that the heights we explored in the [Chapter 1](distributions.html)
    are not the original heights reported by students. A second challenge involves
    exploring the *original* reported heights, which are also included in the **dslabs**
    package in the `reported_heights` object. We will see that due to errors in reporting,
    using *robust summaries* are necessary to produce useful summaries.'
  prefs: []
  type: TYPE_NORMAL
- en: Outliers
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Outliers are very common in real-world data analysis. Data recording can be
    complex and it is common to observe data points generated in error. For example,
    an old monitoring device may read out nonsensical measurements before completely
    failing. Human error is also a source of outliers, in particular when data entry
    is done manually. For example, an individual may mistakenly enter their height
    in centimeters instead of inches or put the decimal in the wrong place.
  prefs: []
  type: TYPE_NORMAL
- en: How do we distinguish an outlier from measurements that were too big or too
    small simply due to expected variability? This is not always an easy question
    to answer, but we try to provide some guidance. Let’s begin with a simple case.
  prefs: []
  type: TYPE_NORMAL
- en: 'Suppose a colleague is charged with collecting demography data for a group
    of males. The data report height in feet and are stored in the object:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE8]'
  prefs: []
  type: TYPE_PRE
- en: '*Our colleague uses the fact that heights are usually well approximated by
    a normal distribution and summarizes the data with average and standard deviation:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE9]'
  prefs: []
  type: TYPE_PRE
- en: '*Our colleage writes a report on the interesting fact that this group of males
    is much taller than usual. The average height is over six feet tall! However,
    using your data analysis skills you notice something else that is unexpected:
    the standard deviation is over 7 feet.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]'
  prefs: []
  type: TYPE_PRE
- en: '*Adding and subtracting two standard deviations, you note that 95% of this
    population will have heights between -9.49, 21.7 feet, which does not make sense.
    A quick plot reveals the problem:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/b9dd27b9683f0c9ee24329450b5b0aa7.png)*  *There appears to be
    at least one value that is nonsensical, since we know that a height of 180 feet
    is impossible. The boxplot detects this point as an outlier.****'
  prefs: []
  type: TYPE_NORMAL
- en: '***The Median***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***Outliers can make the average arbitrarily large. With 500 data points, increasing
    a single observation by \(\Delta \times\) 500 raises the average by \(\Delta\).
    In contrast, the *median* is *robust* to outliers: no matter how extreme one value
    becomes, the median remains unchanged as long as it does not cross the middle
    of the data.'
  prefs: []
  type: TYPE_NORMAL
- en: 'The median of our example data is:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE12]'
  prefs: []
  type: TYPE_PRE
- en: '*which corresponds to about 5 feet and 9 inches. The median is often a better
    measure of *typical* value when the data contain outliers.****'
  prefs: []
  type: TYPE_NORMAL
- en: '***Median Absolute Deviation***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***Just as outliers can distort the average, they can also make the standard
    deviation misleadingly large. A more *robust* measure of spread is the *median
    absolute deviation (MAD)*.'
  prefs: []
  type: TYPE_NORMAL
- en: To compute the MAD, we first find the median, then calculate the absolute deviation
    of each value from the median, and finally take the median of those deviations.
    To make it comparable to the standard deviation when data are normally distributed,
    we multiply this value by 1.4826\. (The `mad` function in R applies this correction
    automatically.)
  prefs: []
  type: TYPE_NORMAL
- en: 'For our height data, the MAD is:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE13]'
  prefs: []
  type: TYPE_PRE
- en: '*which corresponds to about 3 inches.'
  prefs: []
  type: TYPE_NORMAL
- en: The MAD provides a more stable estimate of variability when data include outliers.
    In such cases, it offers a truer sense of the dataset’s *typical* spread.****
  prefs: []
  type: TYPE_NORMAL
- en: '***The Interquartile Range (IQR)***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***When data contain outliers or do not follow a normal distribution, the *interquartile
    range (IQR)* provides another way to summarize spread that is more robust than
    the standard deviation. The IQR represents the range that contains the *middle
    50%* of the data, spanning from the 25th percentile (first quartile) to the 75th
    percentile (third quartile), and always includes the median.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Like the median and MAD, the IQR is resistant to extreme values: no matter
    how large or small an outlier becomes, the IQR remains largely unaffected. For
    normally distributed data, dividing the IQR by 1.349 gives an estimate of the
    standard deviation we would expect if no outliers were present.'
  prefs: []
  type: TYPE_NORMAL
- en: 'In our example, this approximation works well. The IQR-based estimate of the
    standard deviation is:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE14]'
  prefs: []
  type: TYPE_PRE
- en: '*which corresponds to about 3 inches.'
  prefs: []
  type: TYPE_NORMAL
- en: In addition to summarizing spread, the IQR allows us to formally define what
    we mean by an *outlier*, a concept we will introduce in the next section.****
  prefs: []
  type: TYPE_NORMAL
- en: '***A Data-Driven Definition of Outliers***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***A precise, data-driven definition of an *outlier* was introduced by John
    Tukey, who also developed the boxplot, a visualization we will introduce in the
    next section. To construct a boxplot, we first need a formal way to identify which
    data points count as outliers.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Let the first and third quartiles be denoted as \(Q_1 = Q(0.25)\) and \(Q_3
    = Q(0.75)\), respectively. Tukey defined an observation as an *outlier* if it
    falls outside the following range:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ [Q_1 - 1.5 \times \text{IQR}, ; Q_3 + 1.5 \times \text{IQR}], \quad \text{where
    } \text{IQR} = Q_3 - Q_1 \]
  prefs: []
  type: TYPE_NORMAL
- en: 'When the data follow a **standard normal distribution**, this range is:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE15]'
  prefs: []
  type: TYPE_PRE
- en: '*Using `pnorm`, we can compute the proportion of data expected to fall within
    this range:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE16]'
  prefs: []
  type: TYPE_PRE
- en: '*Thus, about 99.302% of the data lie inside this interval for a normal distribution.
    In other words, we expect roughly 7 out of every 1,000 observations from a perfectly
    normal dataset to fall outside this range, not because they are erroneous, but
    simply due to random variation.'
  prefs: []
  type: TYPE_NORMAL
- en: To make the definition stricter, Tukey proposed using a wider multiplier, such
    as 3 instead of 1.5, to flag *far-out outliers*. For normally distributed data,
    the range
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE17]'
  prefs: []
  type: TYPE_PRE
- en: '*captures about 99.9998% of all values, meaning that only about two in a million
    observations would fall outside it. In **ggplot** `[geom_boxplot()](https://ggplot2.tidyverse.org/reference/geom_boxplot.html)`
    function, this multiplier is controlled by the `coef` argument, which defaults
    to 1.5.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Let’s apply Tukey’s rule to our height data. The extreme 180-foot measurement
    is well beyond the range defined by \(Q_3 + 3 \times \text{IQR}\):'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE18]'
  prefs: []
  type: TYPE_PRE
- en: '*If we remove this value, the remaining data follow an approximately normal
    distribution, as expected:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE19]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/1cb9d7fb5309459532f8bcd39c37c952.png)*  *This demonstrates the
    usefulness of Tukey’s approach: it provides an objective, reproducible way to
    detect unusual observations—one that adapts to the spread of the data itself.*************'
  prefs: []
  type: TYPE_NORMAL
- en: '****2.5 Boxplots****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '****To introduce boxplots, we will use a dataset of U.S. murders by state.
    Suppose we want to summarize the distribution of murder rates. A histogram quickly
    reveals that the data are right-skewed, indicating that the normal approximation
    does not apply:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/f7d2f7c6dce347ba3df5f1a5bd42eb16.png)'
  prefs: []
  type: TYPE_IMG
- en: While a histogram provides valuable detail, people often prefer a more concise
    numerical summary, one that highlights the main features of the distribution without
    showing every data point.
  prefs: []
  type: TYPE_NORMAL
- en: 'The *boxplot* offers such a summary. It condenses a dataset into five numbers:
    the minimum, first quartile (\(Q_1\)), median (\(Q_2\)), third quartile (\(Q_3\)),
    and maximum. Outliers, values that fall outside Tukey’s range, defined in the
    previous section, are not included in the computation of the range, but are instead
    plotted as individual points.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Here’s the boxplot for the murder rate data:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/575d62ea885fd50bd5750acee7fe29ef.png)'
  prefs: []
  type: TYPE_IMG
- en: The box spans from \(Q_1\) to \(Q_3\), with a horizontal line marking the median.
    The whiskers extend to the smallest and largest observations that are not outliers,
    while outliers are shown as separate points. The height of the box corresponds
    to the IQR, representing the middle 50% of the data.
  prefs: []
  type: TYPE_NORMAL
- en: Boxplots are especially useful when comparing distributions across groups, for
    example, comparing murder rates across regions or male and female height distributions.
    They provide a quick visual summary of differences in center, spread, and the
    presence of outliers. In the next chapter, we will use boxplots in exactly this
    way to compare distributions between groups.****
  prefs: []
  type: TYPE_NORMAL
- en: '****2.6 Exercises****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '****1\. Load the height dataset and create a vector `x` with just the male
    heights:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE20]'
  prefs: []
  type: TYPE_PRE
- en: '*What proportion of the data is between 69 and 72 inches (taller than 69, but
    shorter or equal to 72)? Hint: use a logical operator and `mean`.'
  prefs: []
  type: TYPE_NORMAL
- en: '2\. Suppose all you know about the data is the average and the standard deviation.
    Use the normal approximation to estimate the proportion you just calculated. Hint:
    start by computing the average and standard deviation. Then use the `pnorm` function
    to predict the proportions.'
  prefs: []
  type: TYPE_NORMAL
- en: 3\. Notice that the approximation calculated in question 1 is very close to
    the exact calculation in question 2\. Now perform the same task for more extreme
    values. Compare the exact calculation and the normal approximation for the interval
    (79,81]. How many times larger is the actual proportion than the approximation?
  prefs: []
  type: TYPE_NORMAL
- en: '4\. Approximate the distribution of adult men in the world as normally distributed
    with an average of 69 inches and a standard deviation of 3 inches. Using this
    approximation, estimate the proportion of adult men that are 7 feet tall or taller,
    referred to as *seven-footers*. Hint: use the `pnorm` function.'
  prefs: []
  type: TYPE_NORMAL
- en: 5\. There are about 1 billion men between the ages of 18 and 40 in the world.
    Use your answer to the previous question to estimate how many of these men (18-40
    year olds) are seven feet tall or taller in the world?
  prefs: []
  type: TYPE_NORMAL
- en: 6\. There are about 10 National Basketball Association (NBA) players that are
    7 feet tall or higher. Using the answer to the previous two questions, what proportion
    of the world’s 18-to-40-year-old *seven-footers* are in the NBA?
  prefs: []
  type: TYPE_NORMAL
- en: '7\. Repeat the calculations performed in the previous question for Lebron James’
    height: 6 feet 8 inches. There are about 150 players that are at least that tall.'
  prefs: []
  type: TYPE_NORMAL
- en: '8\. In answering the previous questions, we found that it is not uncommon for
    a seven-footer to become an NBA player. What would be a fair critique of our calculations:'
  prefs: []
  type: TYPE_NORMAL
- en: Practice and talent are what make a great basketball player, not height.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: The normal approximation is not appropriate for heights.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: The normal approximation tends to underestimate the extreme values. It’s possible
    that there are more seven-footers than we predicted.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: The normal approximation tends to overestimate the extreme values. It’s possible
    that there are fewer seven-footers than we predicted.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'We are going to use the **HistData** package. Load the `Galton` data and create
    a vector `x`, consisting solely of the child heights:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE21]'
  prefs: []
  type: TYPE_PRE
- en: '*9\. Compute the average and SD of these data.'
  prefs: []
  type: TYPE_NORMAL
- en: 10\. Compute the median and median absolute deviation of these data.
  prefs: []
  type: TYPE_NORMAL
- en: '11\. Now suppose Galton made a mistake when entering the first value and forgot
    to use the decimal point. You can imitate this error by typing:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE22]'
  prefs: []
  type: TYPE_PRE
- en: '*How many inches does the average grow after this mistake?'
  prefs: []
  type: TYPE_NORMAL
- en: 12\. How many inches does the SD grow after this mistake?
  prefs: []
  type: TYPE_NORMAL
- en: 13\. How many inches does the median grow after this mistake?
  prefs: []
  type: TYPE_NORMAL
- en: 14\. How many inches does the MAD grow after this mistake?
  prefs: []
  type: TYPE_NORMAL
- en: 15\. How could you use exploratory data analysis to detect that an error was
    made?
  prefs: []
  type: TYPE_NORMAL
- en: Since it is only one value out of many, we will not be able to detect this.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: We would see an obvious shift in the distribution.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: A boxplot, histogram, or qqplot would reveal a clear outlier.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: A scatterplot would show high levels of measurement error.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 16\. How much can the average accidentally grow with mistakes like this? Write
