- en: Continuous Joint
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 连续联合
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part3/continuous_joint/](https://chrispiech.github.io/probabilityForComputerScientists/en/part3/continuous_joint/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part3/continuous_joint/](https://chrispiech.github.io/probabilityForComputerScientists/en/part3/continuous_joint/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: 'Random variables $X$ and $Y$ are Jointly Continuous if there exists a joint
    Probability Density Function (PDF) $f$ such that: \begin{align*} P(a_1 < X \leq
    a_2,b_1 < Y \leq b_2) = \int_{a_1}^{a_2} \int_{b_1}^{b_2} f(X=x,Y=y)\d y \text{
    } \d x \end{align*}'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 如果存在一个联合概率密度函数（PDF）$f$，使得随机变量$X$和$Y$是联合连续的，那么：\begin{align*} P(a_1 < X \leq
    a_2,b_1 < Y \leq b_2) = \int_{a_1}^{a_2} \int_{b_1}^{b_2} f(X=x,Y=y)\d y \text{
    } \d x \end{align*}
- en: 'Using the PDF we can compute marginal probability densities: \begin{align*}
    f(X=a) &= \int_{-\infty}^{\infty}f(X=a,Y=y)\d y \\ f(Y=b) &= \int_{-\infty}^{\infty}f(X=x,Y=b)\d
    x \end{align*}'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 使用概率密度函数（PDF）我们可以计算边缘概率密度：\begin{align*} f(X=a) &= \int_{-\infty}^{\infty}f(X=a,Y=y)\d
    y \\ f(Y=b) &= \int_{-\infty}^{\infty}f(X=x,Y=b)\d x \end{align*}
- en: 'Let $F(x,y)$ be the Cumulative Density Function (CDF): \begin{align*} P(a_1
    < X \leq a_2,b_1 < Y \leq b_2) = F(a_2,b_2) - F(a_1,b_2) + F(a_1,b_1) - F(a_2,b_1)
    \end{align*}'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $F(x,y)$ 为累积分布函数（CDF）：\begin{align*} P(a_1 < X \leq a_2,b_1 < Y \leq b_2)
    = F(a_2,b_2) - F(a_1,b_2) + F(a_1,b_1) - F(a_2,b_1) \end{align*}
- en: From Discrete Joint to Continuous Joint
  id: totrans-6
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 从离散联合到连续联合
- en: 'Thinking about multiple continuous random variables jointly can be unintuitive
    at first blush. But we can turn to our helpful trick that we can use to understand
    continuous random variables: start with a discrete approximation. Consider the
    example of creating the [CS109 seal](../../examples/dart_logo/). It was generated
    by throwing half a million darts at an image of the stanford logo (keeping all
    the pixels that get hit by at least one dart). The darts could hit any continuous
    location on the logo, and, the locations are not equally likely. Instead, the
    location a dart hits is goverened by a joint continuous distribution. In this
    case there are only two simultaneous random variables, the x location of the dart
    and the y location of the dart. Each random variable is continuous (it takes on
    real numbers). Thinking about the joint probability density function is easier
    by first considering a discretization. I am going to break the dart landing area
    into 25 discrete buckets:'
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 联合考虑多个连续随机变量一开始可能难以直观理解。但我们可以借助一个有用的技巧来理解连续随机变量：从离散近似开始。以创建[CS109徽标](../../examples/dart_logo/)的例子来说明。它是通过向斯坦福标志的图像投掷五十万支飞镖（保留至少被一支飞镖击中的所有像素）生成的。飞镖可以击中标志上的任何连续位置，而这些位置的概率并不相等。相反，飞镖击中的位置受一个联合连续分布的支配。在这种情况下，只有两个同时存在的随机变量，即飞镖的x位置和y位置。每个随机变量都是连续的（它取实数值）。通过首先考虑离散化，思考联合概率密度函数会更加容易。我将把飞镖着陆区域划分为25个离散的桶：
- en: '![](../Images/74126130785aa474f25358f70ceb3524.png)![](../Images/69da47a15acf13df486eb6b5313dc618.png)'
  id: totrans-8
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/74126130785aa474f25358f70ceb3524.png)![](../Images/69da47a15acf13df486eb6b5313dc618.png)'
- en: 'On the left is a visualization of the probability mass of this joint distribution,
    and on the right is a visualization of how we could answer the question: what
    is the probability that a dart hits within a certain distance of the center. For
    each bucket there is a single number, the probability that a dart will fall into
    that particular bucket (these probabilities are mutually exclusive and sum to
    1).'
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 左边是这种联合分布的概率质量可视化，右边是回答问题的可视化：飞镖击中中心一定距离内的概率。对于每个桶，都有一个单独的数字，即飞镖落入该特定桶的概率（这些概率是互斥的，且总和为1）。
- en: Of course this discretization only *approximates* the joint probability distribution.
    In order to get a better approximation we could create more fine-grained discretizations.
    In the limit we can make our buckets infinitely small, and the value associated
    with each bucket becomes a second derivative of probability.
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 当然，这种离散化只是对联合概率分布的近似。为了得到更好的近似，我们可以创建更精细的离散化。在极限情况下，我们可以使我们的桶无限小，与每个桶关联的值成为概率的二阶导数。
- en: '![](../Images/546617a27d5d13ef0ae07805bf8994c7.png)![](../Images/2faa831619a12335f0ea6db842a085dd.png)'
  id: totrans-11
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/546617a27d5d13ef0ae07805bf8994c7.png)![](../Images/2faa831619a12335f0ea6db842a085dd.png)'
- en: 'To represent the 2D probability density in a graph, we use the darkness of
    a value to represent the density (darker means more density). Another way to visualize
    this distribution is from an angle. This makes it easier to realize that this
    is a function with two inputs and one output. Below is an different visualization
    of the exact same density function:'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 为了在图中表示二维概率密度，我们使用值的深度来表示密度（越深表示密度越大）。另一种可视化这种分布的方法是从一个角度。这使得更容易意识到这是一个有两个输入和一个输出的函数。下面是同一密度函数的不同可视化：
- en: '![](../Images/420889815e1773704617f27899ccb9dd.png)'
  id: totrans-13
  prefs: []
  type: TYPE_IMG
  zh: '![图片4](../Images/420889815e1773704617f27899ccb9dd.png)'
- en: Just like in the single random variable case, we are now representing our belief
    in the continuous random variables as *densities* rather than probabilities. Recall
    that a density represents a relative belief. If the density of $f(X = 1.1, Y =
    0.9)$ is twice as high as the density that $f(X = 1.1, Y = 1.1)$ the function
    is expressing that it is twice as likely to find the particular combination of
    $X = 1.1$ and $Y=0.9$.
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 就像在单随机变量情况下一样，我们现在用**密度**而不是概率来表示我们对连续随机变量的信念。回想一下，密度表示相对信念。如果$f(X = 1.1, Y
    = 0.9)$的密度是$f(X = 1.1, Y = 1.1)$的两倍，那么函数表示找到特定的组合$X = 1.1$和$Y=0.9$的可能性是两倍。
- en: Multivariate Gaussian
  id: totrans-15
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 多元高斯
- en: The density that is depicted in this example happens to be a particular of joint
    continuous distribution called Multivariate Gaussian. In fact it is a special
    case where all of the constituent variables are independent.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 在这个例子中，所表示的密度恰好是联合连续分布的一个特例，称为多元高斯分布。实际上，它是一个所有构成变量都是独立的特殊情况。
- en: '***Def: Independent Multivariate Gaussian*** . An Independent Multivariate
    Gaussian can model a collection of continuous joint random variables $\vec{X}
    = (X_1 \dots X_n)$ as being a composition of independent normals with means $\vec{\mu}
    = (\mu_1 \dots \mu_n)$ and standard deviations $\vec{\sigma} = (\sigma_1 \dots
    \sigma_n)$. Notice how we now have variables in vectors (similar to a list in
    python). The notation for the multivariate uses vector notation: \begin{align*}
    \vec{X} \sim \vec{\N}(\vec{\mu}, \vec{\sigma}) \end{align*} The joint PDF is:
    \begin{align*} f(\vec{x}) &= \prod_{i=1}^n f(x_i) \\ &= \prod_{i=1}^n \frac{1}{\sigma_i
    \sqrt{2\pi} } e ^{\frac{-(x-\mu_i)^2}{2\sigma_i^2}} \end{align*} And the joint
    CDF is \begin{align*} F(\vec{x}) &= \prod_{i=1}^n F(x_i) \\ &= \prod_{i=1}^n \Phi(\frac{x_i-\mu_i}{\sigma_i})
    \end{align*}'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义：独立多元高斯分布***。独立多元高斯分布可以用来模拟一组连续的联合随机变量 $\vec{X} = (X_1 \dots X_n)$，将其视为由独立的正态分布组成，具有均值
    $\vec{\mu} = (\mu_1 \dots \mu_n)$ 和标准差 $\vec{\sigma} = (\sigma_1 \dots \sigma_n)$。注意我们现在有了向量中的变量（类似于Python中的列表）。多元分布的表示使用向量符号：\begin{align*}
    \vec{X} \sim \vec{\N}(\vec{\mu}, \vec{\sigma}) \end{align*} 联合概率密度函数为：\begin{align*}
    f(\vec{x}) &= \prod_{i=1}^n f(x_i) \\ &= \prod_{i=1}^n \frac{1}{\sigma_i \sqrt{2\pi}
    } e ^{\frac{-(x-\mu_i)^2}{2\sigma_i^2}} \end{align*} 联合累积分布函数为 \begin{align*}
    F(\vec{x}) &= \prod_{i=1}^n F(x_i) \\ &= \prod_{i=1}^n \Phi(\frac{x_i-\mu_i}{\sigma_i})
    \end{align*}'
- en: '***Example: Gaussian Blur***'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: '***示例：高斯模糊***'
- en: 'In the same way that many single random variables are assumed to be gaussian,
    many joint random variables may be assumed to be Multivariate Gaussian. Consider
    this example of Gaussian Blur:'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 就像许多单随机变量被假设为高斯分布一样，许多联合随机变量也可以假设为多元高斯分布。考虑以下高斯模糊的例子：
- en: In image processing, a Gaussian blur is the result of blurring an image by a
    Gaussian function. It is a widely used effect in graphics software, typically
    to reduce image noise. A Gaussian blur works by convolving an image with a 2D
    independent multivariate gaussian (with means of 0 and equal valued standard deviations).
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 在图像处理中，高斯模糊是通过高斯函数模糊图像的结果。这是图形软件中广泛使用的效果，通常用于减少图像噪声。高斯模糊通过将图像与二维独立多元高斯（均值为0，标准差相等）进行卷积来实现。
- en: '![](../Images/f7dc358d4dc7c801f113f96220fa323c.png)![](../Images/b3a34251081e3898dacb97f55277fd2e.png)![](../Images/abd58945a2de8936fb837925986d6611.png)'
  id: totrans-21
  prefs: []
  type: TYPE_IMG
  zh: '![图片1](../Images/f7dc358d4dc7c801f113f96220fa323c.png)![图片2](../Images/b3a34251081e3898dacb97f55277fd2e.png)![图片3](../Images/abd58945a2de8936fb837925986d6611.png)'
- en: In order to use a Gaussian blur, you need to be able to compute the probability
    mass of that 2D gaussian in the space of pixels. Each pixel is given a weight
    equal to the probability that X and Y are both within the pixel bounds. The center
    pixel covers the area where $-0.5 ≤ x ≤ 0.5$ and $-0.5 ≤ y ≤ 0.5$. Let's do one
    step in computing the Gaussian function discretized over image space. What is
    the weight of the center pixel for gaussian blur with a multivariate gaussian
    which has means of 0 and standard deviation of 3?
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 为了使用高斯模糊，你需要能够计算该二维高斯在像素空间中的概率质量。每个像素被赋予一个等于 X 和 Y 都在像素边界内的概率的权重。中心像素覆盖的区域是
    $-0.5 ≤ x ≤ 0.5$ 和 $-0.5 ≤ y ≤ 0.5$。让我们在计算图像空间上离散化的高斯函数时进行一步。对于具有均值为 0 和标准差为 3
    的多元高斯，中心像素的权重是多少？
- en: 'Let $\vec{B}$ be the multivariate gaussian, $\vec{B} \sim \N(\vec{\mu} = [0,0],
    \vec{\sigma} = [3,3])$. Let''s compute the CDF of this multivariate gaussian $F(x_1,x_2)$:
    \begin{align*} F(x_1,x_2) &= \prod_{i=1}^n \Phi(\frac{x_i-\mu_i}{\sigma_i}) \\
    &= \Phi(\frac{x_1-\mu_1}{\sigma_1}) \cdot \Phi(\frac{x_2-\mu_2}{\sigma_2}) \\
    &= \Phi(\frac{x_1}{3}) \cdot \Phi(\frac{x_2}{3}) \end{align*}'
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $\vec{B}$ 为多元高斯分布，$\vec{B} \sim \N(\vec{\mu} = [0,0], \vec{\sigma} = [3,3])$。让我们计算这个多元高斯分布的累积分布函数
    $F(x_1,x_2)$：\begin{align*} F(x_1,x_2) &= \prod_{i=1}^n \Phi(\frac{x_i-\mu_i}{\sigma_i})
    \\ &= \Phi(\frac{x_1-\mu_1}{\sigma_1}) \cdot \Phi(\frac{x_2-\mu_2}{\sigma_2})
    \\ &= \Phi(\frac{x_1}{3}) \cdot \Phi(\frac{x_2}{3}) \end{align*}
- en: 'Now we are ready to calculate the weight of the center pixel: \begin{align*}
    \P&(-0.5 < X_1 \leq 0.5,-0.5 < X_2 \leq 0.5) \\ &= F(0.5,0.5) - F(-0.5,0.5) +
    F(-0.5,-0.5) - F(0.5,-0.5) \\ &=\Phi(\frac{0.5}{3}) \cdot \Phi(\frac{0.5}{3})
    - \Phi(\frac{-0.5}{3}) \cdot \Phi(\frac{0.5}{3}) + \Phi(\frac{-0.5}{3}) \cdot
    \Phi(\frac{-0.5}{3}) - \Phi(\frac{0.5}{3}) \cdot \Phi(\frac{-0.5}{3})\\ &\approx
    0.026 \end{align*}'
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们准备计算中心像素的权重：\begin{align*} \P&(-0.5 < X_1 \leq 0.5,-0.5 < X_2 \leq 0.5)
    \\ &= F(0.5,0.5) - F(-0.5,0.5) + F(-0.5,-0.5) - F(0.5,-0.5) \\ &=\Phi(\frac{0.5}{3})
    \cdot \Phi(\frac{0.5}{3}) - \Phi(\frac{-0.5}{3}) \cdot \Phi(\frac{0.5}{3}) + \Phi(\frac{-0.5}{3})
    \cdot \Phi(\frac{-0.5}{3}) - \Phi(\frac{0.5}{3}) \cdot \Phi(\frac{-0.5}{3})\\
    &\approx 0.026 \end{align*}
- en: 'How can this 2D gaussian blur the image? Wikipedia explains: "Since the Fourier
    transform of a Gaussian is another Gaussian, applying a Gaussian blur has the
    effect of reducing the image''s high-frequency components; a Gaussian blur is
    a low pass filter" [[2](https://en.wikipedia.org/wiki/Gaussian_blur)].'
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: 如何使这个二维高斯模糊图像？维基百科解释道：“由于高斯函数的傅里叶变换仍然是另一个高斯函数，应用高斯模糊的效果是减少图像的高频成分；高斯模糊是一个低通滤波器”
    [[2](https://en.wikipedia.org/wiki/Gaussian_blur)]。
