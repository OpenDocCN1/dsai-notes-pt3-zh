- en: Naïve Bayes
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part5/naive_bayes/](https://chrispiech.github.io/probabilityForComputerScientists/en/part5/naive_bayes/)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
- en: Naive Bayes is a Machine Learning algorithm for the ``classification task".
    It make the substantial assumption (called the Naive Bayes assumption) that all
    features are independent of one another, given the classification label. This
    assumption is wrong, but allows for a fast and quick algorithm that is often useful.
    In order to implement Naive Bayes you will need to learn how to train your model
    and how to use it to make predictions, once trained.
  prefs: []
  type: TYPE_NORMAL
- en: Training (aka Parameter Estimation)
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: The objective in training is to estimate the probabilities $P(Y)$ and $P(X_i
    | Y)$ for all $0 < i \leq m$ features. We use the symbol $\hat{p}$ to make it
    clear that the probability is an estimate.
  prefs: []
  type: TYPE_NORMAL
- en: 'Using an MLE estimate: \begin{align*} \hat{p}(X_i = x_i | Y = y) = \frac{ (\text{#
    training examples where $X_i = x_i$ and $Y = y$})}{(\text{# training examples
    where $Y = y$})} \end{align*}'
  prefs: []
  type: TYPE_NORMAL
- en: 'Using a Laplace MAP estimate: \begin{align*} \hat{p}(X_i = x_i | Y = y) = \frac{
    (\text{# training examples where $X_i = x_i$ and $Y = y$}) + 1 }{(\text{# training
    examples where $Y = y$}) + 2} \end{align*}'
  prefs: []
  type: TYPE_NORMAL
- en: 'The prior probability of $Y$ trained using an MLE estimate: \begin{align*}
    \hat{p}(Y = y) = \frac{ (\text{# training examples where $Y = y$) }}{(\text{#
    training examples)}} \end{align*}'
  prefs: []
  type: TYPE_NORMAL
- en: Prediction
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'For an example with $\mathbf{x} = [x_1, x_2, \dots , x_m]$, estimate the value
    of $y$ as: \begin{align*} \hat{y} &= \argmax_{y = \{0, 1\}} \text{ } \log \hat{p}(Y
    = y) + \sum_{i=1}^m \log \hat{p}(X_i = x_i | Y = y) \end{align*} Note that for
    small enough datasets you may not need to use the log version of the argmax.'
  prefs: []
  type: TYPE_NORMAL
- en: Theory
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: In the world of classification when we make a prediction we want to chose the
    value of $y$ that maximizes $P(Y=y|\mathbf{X})$. \begin{align*} \hat{y} &= \argmax_{y
    = \{0, 1\}} P(Y = y|\mathbf{X} = \mathbf{X}) && \text{Our objective}\\ &= \argmax_{y
    = \{0, 1\}} \frac{P(Y=y)P(\mathbf{X} =\mathbf{x}| Y = y)}{P(\mathbf{X} =\mathbf{x})}
    && \text{By bayes theorem}\\ &= \argmax_{y = \{0, 1\}} P(Y=y)P(\mathbf{X} =\mathbf{x}|
    Y = y)) && \text{Since $P(\mathbf{X} =\mathbf{x})$ is constant with respect to
    $Y$} \end{align*}
  prefs: []
  type: TYPE_NORMAL
- en: Using our training data we could interpret the joint distribution of $\mathbf{X}$
    and $Y$ as one giant multinomial with a different parameter for every combination
    of $\mathbf{X}=\mathbf{x}$ and $Y=y$. If for example, the input vectors are only
    length one. In other words $|\mathbf{x}| = 1$ and the number of values that $x$
    and $y$ can take on are small, say binary, this is a totally reasonable approach.
    We could estimate the multinomial using MLE or MAP estimators and then calculate
    argmax over a few lookups in our table.
  prefs: []
  type: TYPE_NORMAL
- en: The bad times hit when the number of features becomes large. Recall that our
    multinomial needs to estimate a parameter for every unique combination of assignments
    to the vector $\mathbf{x}$ and the value $y$. If there are $|\mathbf{x}| = n$
    binary features then this strategy is going to take order $\mathcal{O}(2^n)$ space
    and there will likely be many parameters that are estimated without any training
    data that matches the corresponding assignment.
  prefs: []
  type: TYPE_NORMAL
- en: '**Naive Bayes Assumption**'
  prefs: []
  type: TYPE_NORMAL
- en: 'The Naïve Bayes Assumption is that each feature of $\mathbf{x}$ is independent
    of one another given $y$.The Naïve Bayes Assumption is wrong, but useful. This
    assumption allows us to make predictions using space and data which is linear
    with respect to the size of the features: $\mathcal{O}(n)$ if $|\mathbf{x}| =
    n$. That allows us to train and make predictions for huge feature spaces such
    as one which has an indicator for every word on the internet. Using this assumption
    the prediction algorithm can be simplified. \begin{align*} \hat{y} &= \argmax\limits_{y
    = \{0, 1\}} \text{ }P(Y = y)P(\mathbf{X} = \mathbf{x}| Y = y) && \text{As we last
    left off}\\ &= \argmax\limits_{y = \{0, 1\}} \text{ } P(Y= y)\prod_i P(X_i = x_i|
    Y = y) &&\text{Naïve bayes assumption}\\ &= \argmax\limits_{y = \{0, 1\}} \text{
    } \log P(Y = y) + \sum_i \log P(X_i = x_i| Y = y) && \text{For numerical stability}\\
    \end{align*}'
  prefs: []
  type: TYPE_NORMAL
- en: In the last step we leverage the fact that the argmax of a function is equal
    to the argmax of the log of a function. This algorithm is both fast and stable
    both when training and making predictions.
  prefs: []
  type: TYPE_NORMAL
