- en: Digital Vision Test
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/examples/digital_vision_test/](https://chrispiech.github.io/probabilityForComputerScientists/en/examples/digital_vision_test/)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
- en: '**The Story:** This problem was initially posed as a CS109 Final exam problem
    in Spring 2017\. This grew into a collaboration with a former student, Ali Malik,
    as well as a Stanford Ophthalmology doctor Charles Lin. We realized that it was
    actually a much more accurate way of measuring visual acuity. The algorithm, which
    is called the Stanford Acuity Test, or StAT, has since been published as an article
    for AAAI and covered by Science Magazine and The Lancet. To the best of our knowledge,
    the algorithm is still the most acurate way to infer ability to see from an optotype
    based test.'
  prefs: []
  type: TYPE_NORMAL
- en: 'You can find a demo of the Stanford Acuity Test here: [https://myeyes.ai/](https://myeyes.ai/measure).
    Look out for the bar icon *to see the belief distribution change as the test progresses.*'
  prefs: []
  type: TYPE_NORMAL
- en: '*### Digital Vision Tests'
  prefs: []
  type: TYPE_NORMAL
- en: The goal of a digital vision test is to estimate how well a patient can see.
    You can give the patient a series of vision tests, observe their responses and
    then based on those responses eventually make your diagnosis. In this chapter
    we consider the Tumbling E tasks. The patient is presented an E at a chosen font
    size. The E will be randomly written up, down, left or right and the patient must
    say which direction it is facing. Their guess will either be correct, or incorrect.
    The patient will have a series of 20 of these tasks. Vision tests as useful for
    people who need glasses, but can be critical for folks with eye disease who need
    to closely monitor for subtle decreases in vision.
  prefs: []
  type: TYPE_NORMAL
- en: 'There are two primary tasks in a digital vision test: (1) based on the patient
    responses, infer their ability to see and (2) select the next font size to show
    to the patient.'
  prefs: []
  type: TYPE_NORMAL
- en: How to Represent Ability to See?
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Ability is a random variable! We define $A$ to represent the ability of someone
    to see. $A$ takes on values between 0.0 (representing legal blindness) and 1.0
    (representing standard vision). While ability to see is in theory a continuous
    random variable, we are going to represent ability to see as discretized into
    one hundreths. As such $A \in \{0.00, 0.01, \dots, 0.99\}$. As a small aside,
    visual acuity can be represented in many different units (such as a log based
    unit called LogMAR). We chose this 0 to 1 scale as it makes the math easier to
    explain.
  prefs: []
  type: TYPE_NORMAL
- en: 'The prior probability mass function for $A$, written as $\p(A=a)$, represents
    our belief that $A$ takes on the value of $a$, *before* we have seen any observations
    about the patient. This prior belief comes from the natural distribution of how
    well people can see. To make our algorithm most accurate, the prior should best
    reflect our patient population. Since our eye test is built for doctors in an
    eye hospital, we used historical data from eye hospital visits to build our prior.
    Here is $P(A=a)$ as a graph:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/3a9d940305285ed5c587e51a22baf036.png)'
  prefs: []
  type: TYPE_IMG
- en: '*The prior belief on ability to see*'
  prefs: []
  type: TYPE_NORMAL
- en: 'Here is that exact same probability mass function written as a table. A table
    representation is possible because of our choice to discretize $A$. In code we
    can access $\p(A=a)$ as a dictionary lookup, `belief[a]` where `belief` stores
    the whole probability mass function:'
  prefs: []
  type: TYPE_NORMAL
- en: '| $a$ | $\P(A=a)$ |  | $a$ | $\P(A=a)$ |  | $a$ | $\P(A=a)$ |'
  prefs: []
  type: TYPE_TB
