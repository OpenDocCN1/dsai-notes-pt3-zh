  prefs: []
  type: TYPE_TB
- en: '| [3] | [Eye, robot: Artificial intelligence dramatically improves accuracy
    of classic eye exam](https://www.science.org/content/article/eye-robot-artificial-intelligence-dramatically-improves-accuracy-classic-eye-exam).
    Science Magazine. |'
  prefs: []
  type: TYPE_TB
- en: Special thanks to Ali Malik who co-invented the Stanford Acuity Test.*
  prefs: []
  type: TYPE_NORMAL
