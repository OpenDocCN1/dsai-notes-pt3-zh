- en: Observations
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Once the patient starts the test, you will begin collecting observations. Consider
    this first observation, $\text{obs}_1$ where the patient was shown a letter with
    font size 0.7 and answered the question incorrectly:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/985ea39441f435a29743f9462780440c.png)'
  prefs: []
  type: TYPE_IMG
- en: We can represent this observation as a tuple with font size and correctness.
    Mathematically this could be written as $\text{obs}_1 = [0.7, \text{False}]$.
    In code this observation could be stored as a dictionary
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: 'Eventually we will have 20 of these observations: $[\text{obs}_1, \text{obs}_2,
    \dots, \text{obs}_{20}]$.'
  prefs: []
  type: TYPE_NORMAL
- en: Infering Ability
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Our first major task is to write code which can update our probability mass
    function for $A$ based on observations. First let us consider how to update our
    belief in ability to see from a single observation, $\text{obs}$ (aside: formally
    this the event that random variable $\text{Obs}$ takes on the value $\text{obs}$).
    We can use [Bayes'' Theory for random variables](../../part3/inference/): \begin{align*}
    \P(A=a|\text{obs}) &= \frac{\P(\text{obs}|A=a)P(A=a)}{\P(\text{obs})}\end{align*}
    This will be computed inside a `for` loop for each assignment $a$ to ability to
    see. How can we compute each term in the Bayes'' Theorem expression? We already
    have values for the prior $\p(A=a)$ and we can compute the denominator $\p(\text{obs})$
    using the Law of Total Probability: \begin{align*} \P(\text{obs}) &= \sum_x \P(\text{obs},
    A=x) && \href{ ../../part1/law_total/}{\text{LOTP}} \\ &= \sum_x P(\text{obs}
    | A=x)P(A=x)&&\text{Chain Rule} \end{align*} Notice how the terms in this new
    expression for $\p(\text{obs})$ already show up in the numerator of our Bayes''
    Theorem equation. As such, in code we are going to (1) compute the numerator for
    every value of $a$, store it as the value of belief, (2) compute the sum of all
    of those terms and (3) devide each value of belief by the sum. The process of
    doing steps 2 and 3 is also known as normalization:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: At this point we have an expression, and corresponding code, to update our belief
    in ability to see given an observation. However we are **missing** a way to compute
    $\p(\text{obs}|A=a)$. In our code this expression is the currently undefined `calc_likelihood(a,
    obs)` function. In the next section we will go over how to compute this "likelihood"
    function. Before we do so, let's take a look at the result of applying `update_belief`
    for a patient with the single observation `obs_1` defined above.
  prefs: []
  type: TYPE_NORMAL
- en: '`obs_1` says that this patient got a rather large letter (font-size of 0.7)
    incorrect. As such in our posterior we think they can''t see very well, though
    we have a lot of uncertainty as it has only been one observation. This belief
    is expressed in our updated probability mass function for $A$, $\p(A = a | \text{obs}_1)$,
    called the posterior. Here is what the posterior looks like for `obs_1`. Note
    that the posterior $\p(A=a|\text{obs}_1)$ is still represented in code as a dictionary,
    as in the prior, $\p(A=a)$:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/ee738a12a00caee44c76fdf35632e6f5.png)'
  prefs: []
  type: TYPE_IMG
- en: '*The posterior belief on ability to see given a patient incorrectly identified
    a letter with font size 0.7\. It shows a belief that the patient can''t see very
    well.*'
  prefs: []
  type: TYPE_NORMAL
- en: Likelihood Function
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: We are not done yet! We have not yet said how we will compute $\p(\text{obs}|A=a)$.
    In Bayes' Theorem this term is called the "likelihood." The likelhood for our
    eye exam will be function that returns back probabilities for inputs of $a$ and
    $\text{obs}$. In python this will be a function `calc_likelihood(a, obs)`. In
    this function `obs` is a single observation such as `obs_1` described above. Imagine
    a concrete call to the likelihood function bellow. This call will return back
    the probability a person who has true ability to see of 0.5 would get a letter
    of font-size 0.7 incorrect.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: 'Before going any further, let''s make two critical notes about the likelihood
    function:'
  prefs: []
  type: TYPE_NORMAL
- en: '**Note 1:** When computing the likelihood term, $\p(\text{obs}|A=a)$, we do
    not have to estimate $A$ as it shows up on the right hand size of the conditional.
    In the likelihood term we are told *exactly* how well the person can see. Their
    vision is truly $a$. Do not be fooled by the fact that $a$ is a (non-random) variable.
    When computing the likelihood function this varaible will have a numeric value.'
  prefs: []
  type: TYPE_NORMAL
- en: '**Note 2:** The variable `obs` represents a single patient interaction. It
    has two parts: a font-size and a boolean for whether the patient got the letter
    correct. However, we don''t think of font-size as being a random variable. Instead
    we think of it as a contant which has been fixed by the computer. As such $\p(\text{obs}|A=a)$
    can be simplified to $\p(\text{correct}|A=a)$. "correct" is short hand for the
    event that a random variable Correct takes on the `True` or `False` value correct:
    \begin{align*} \p(&\text{obs}|A=a) \\ &= \p(\text{correct}, f|A=a) && \text{obs
    is a tuple} \\ &= \p(\text{correct}|A=a) && f \text{ is a constant } \end{align*}'
  prefs: []
  type: TYPE_NORMAL
- en: Defining the likelihood function $\p(\text{correct}|A=a)$ involves more medical
    and education theory than probability theory. You don't need to know either for
    this course! But it is still neat to learn and without the likelihood function
    we won't have complete code. So, let's dive in.
  prefs: []
  type: TYPE_NORMAL
- en: 'A very practical starting point for the likelihood function for a vision test
    comes from a classic education model called "[Item Response Theory](https://en.wikipedia.org/wiki/Item_response_theory)",
    also known as IRT. IRT *assumes* the probability that a student with ability $a$
    gets a question with difficulty $d$ correct is governed by the easy to compute
    function: \begin{align*} \p(&\text{Correct} = \text{True}|a) \\ &= \text{sigmoid}(a-d)
    && d \text{ is difficulty} \\ &= \frac{1}{1+e^{-(a-d)}} \\ \end{align*} where
    $e$ is the [natural base](https://en.wikipedia.org/wiki/E_(mathematical_constant))
    constant and $\text{sigmoid}(x) = \frac{1}{1+e^{-x}}$. The [sigmoid function](https://en.wikipedia.org/wiki/Sigmoid_function)
    is a handy function which takes in any real valued input and returns a corresponding
    value in the range $[0, 1]$.'
  prefs: []
  type: TYPE_NORMAL
- en: 'This IRT model introduces a new constant: difficulty of a letter $d$. How difficult
    is it to correctly respond to a letter with a given font size? The simplest way
    to model difficulty, while accounting for the fact that large font sizes are easier
    than small ones, is to define the difficulty of a letter with font size $f$ to
    be $d = 1-f$. Plugging this in: \begin{align*} \p(&\text{Correct} = \text{True}|a)\\
    &= \text{sigmoid}(a-[1-f])\\ &= \text{sigmoid}(a-1+f)\\ &= \frac{1}{1+e^{-(a-1+f)}}
    \end{align*} We now have a complete, if simplistic, liklihood function! In code
    it would look like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: 'Note that Item Response Theory returns the probability that a a patient answers
    a letter *correctly*. In the code above, notice what we do if the patient instead
    guesses the letter incorrectly: $$\p(\text{Correct} = \text{False}|a,f) = 1-\p(\text{Correct}
    = \text{True}|a,f)$$'
  prefs: []
  type: TYPE_NORMAL
- en: In the published version of the Stanford Acuity Test we extend Item Response
    Theory in several ways. We have a term for the probability that a patient gets
    the answer correct by random guessing as well as a term that they make a mistake,
    aka "slip", even though they know the correct answer. We also observed that a
    Floored Exponential seems to be a more accurate function than the sigmoid. These
    extensions are beyond the scope of this chapter as they are not central to the
    probability insight. For more details see the original paper [1].
  prefs: []
  type: TYPE_NORMAL
- en: Multiple Observations
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: What if you have multiple observations? For multiple observations the only term
    that will change will be the likelihood term $\p(\text{Observations}|A=a)$. We
    assume that each observation is independent, conditioned on ability to see. Formally
    $$\p(\text{obs}_1, \dots, \text{obs}_{20} |A=a) = \prod_i \p(\text{obs}_i|A=a)$$
    As such the likelihood of all observations will be the product of the likelihood
    of each observation on its own. This is equivalent mathematically to calculating
    the posterior for one observation and calling the posterior your new prior.
  prefs: []
  type: TYPE_NORMAL
- en: The Full Code
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Here is the full code for inference of ability to see given observations, minus
    the user interface functions and the file reading for the prior belief:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE4]'
  prefs: []
  type: TYPE_PRE
- en: Chosing the Next Font Size
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'At this point, we have a way to calculate a probability mass function of our
    belief in how well the patient can see, at any point in our test. This leaves
    one more task for us to perform: In a digital eye test, we *select* the next font
    size to show to the patient. Instead of showing a predetermined set, we should
    make a choice which is informed by our current belief in how well the patient
    can see. We were inspired by Thompson Sampling, an algorithm which is able to
    balance exploring uncertainty and narrowing in on your most confident belief.
    When chosing a font size we simply take a sample from our current belief $A$ and
    then chose the font size that we think a person with ability with that sampled
    value could see with 80% accuracy. We chose the 80% constant so that the eye test
    would not be too painful.'
  prefs: []
  type: TYPE_NORMAL
- en: One of the neat take aways from this application is that there are many problems
    where you could take the knowledge learned from this course and improve on the
    current state of the art! Often the most creative task is to recognize where computer
    based probability could be usefully applied. Even for eye tests this is not the
    end of the story. The Stanford Eye Test, which started in CS109, is just a step
    on the journey to a more accurate digital eye test. There is ./always a better
    way. Have an idea?
  prefs: []
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
