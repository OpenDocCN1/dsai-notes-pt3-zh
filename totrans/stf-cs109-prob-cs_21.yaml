- en: Serendipity
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/examples/serendipity/](https://chrispiech.github.io/probabilityForComputerScientists/en/examples/serendipity/)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/980c7c4993ba0a002f5fce8a52a31edd.png)*The word serendipity comes
    from the Persian fairy tale of the [Three Princes of Serendip](https://en.wikipedia.org/wiki/The_Three_Princes_of_Serendip)*'
  prefs: []
  type: TYPE_NORMAL
- en: Problem
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: What is the probability of a seredipitous encounter with a friend? Imagine you
    are live in an area with a large general population (eg Stanford with 17,000 students).
    A small subset of the population are friends. What are the chances that you run
    into at least one friend if you see a handful of people from the population? Assume
    that seeing each person from the population is equally likely.
  prefs: []
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
- en: Answer
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The probability that you see at least one friend is:'
  prefs: []
  type: TYPE_NORMAL
- en: Terms
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'First lets define some useful terms:'
  prefs: []
  type: TYPE_NORMAL
- en: $p$ = total population = $s$ = people seen = $f$ = num friends =
  prefs: []
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
- en: Approach
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Since each way of seeing $s$ people is equally likely, we can use the "[Equally
    Likely Events](//web.stanford.edu/class/cs109/pdfs/HO06 Probability.pdf)" probability
    calculation:'
  prefs: []
  type: TYPE_NORMAL
- en: $P(E) = \frac{|E|}{|S|}$
  prefs: []
  type: TYPE_NORMAL
- en: Where $S$ is the sample set (all the ways of seing $s$ people) and $E$ is the
    event set (all the ways of seing $s$ people where at least one is a friend).
  prefs: []
  type: TYPE_NORMAL
- en: One way to approach this problem is to directly count all ways you see 1 or
    more friends. That is hard. You would have to count the ways you could see exactly
    one friend, then exactly two friends and so on. It is much easier to calculate
    the ways that you see zero friends. If we can calculate the probability of seeing
    zero friends our answer is just one minus that number.
  prefs: []
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
- en: Prob that you don't see friends
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Let the sample space ($S$) be the set of ways that you could see $s$ people.
    The size of the sample space is: the total population choose the number of people
    seen.'
  prefs: []
  type: TYPE_NORMAL
- en: 'The event space ($E$) is the set of ways that you could see no friends. The
    size of the event space is: the number of non friends (aka population - friends)
    choose the number of people seen.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Thus the probability of not seeing a friend is:'
  prefs: []
  type: TYPE_NORMAL
- en: $\text{prob(not seen)} = \frac{ \left( {\begin{array}{*{20}c} p - f \\ s \\
    \end{array}} \right) } { \left( {\begin{array}{*{20}c} p \\ s \\ \end{array}}
    \right) } $
  prefs: []
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
- en: Prob that you see friends
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Now the probability that you see at least one friend is 1 minus the probability
    that you see no friends.
  prefs: []
  type: TYPE_NORMAL
- en: $\text{prob(seen)} = 1 - \frac{ \left( {\begin{array}{*{20}c} p - f \\ s \\
    \end{array}} \right) } { \left( {\begin{array}{*{20}c} p \\ s \\ \end{array}}
    \right) } $
  prefs: []
  type: TYPE_NORMAL
- en: That is equal to
  prefs: []
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
- en: Isn't that suprising?
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
