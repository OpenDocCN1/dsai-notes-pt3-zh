- en: Equally Likely Outcomes
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 等可能结果
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part1/equally_likely/](https://chrispiech.github.io/probabilityForComputerScientists/en/part1/equally_likely/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part1/equally_likely/](https://chrispiech.github.io/probabilityForComputerScientists/en/part1/equally_likely/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: 'Some sample spaces have equally likely outcomes. We like those sample spaces,
    because there is a way to calculate probability questions about those sample spaces
    simply by counting. Here are a few examples where there are equally likely outcomes:'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 一些样本空间具有等可能的结果。我们喜欢这样的样本空间，因为我们可以通过计数简单地计算这些样本空间中的概率问题。以下是一些具有等可能结果的例子：
- en: 'Coin flip: S = {Head, Tails}'
  id: totrans-4
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 抛掷硬币：S = {正面，反面}
- en: 'Flipping two coins: S = {(H, H), (H, T), (T, H), (T, T)}'
  id: totrans-5
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 抛掷两个硬币：S = {(H, H), (H, T), (T, H), (T, T)}
- en: 'Roll of 6-sided die: S = {1, 2, 3, 4, 5, 6}'
  id: totrans-6
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 抛掷六面骰子：S = {1, 2, 3, 4, 5, 6}
- en: 'Because every outcome is equally likely, and the probability of the [sample
    space](../../part1/probability/#sampleSpace) must be 1, we can prove that each
    outcome must have probability:'
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 因为每个结果都是等可能的，并且样本空间的概率必须是1，我们可以证明每个结果必须具有概率：
- en: $$ \p(\text{an outcome}) = \frac{1}{|S|} $$ Where |S| is the size of the sample
    space, or, put in other words, the total number of outcomes of the experiment.
    Of course this is only true in the special case where every outcome has the same
    likelihood.
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: $$ \p(\text{一个结果}) = \frac{1}{|S|} $$ 其中 |S| 是样本空间的大小，或者说，是实验所有可能结果的总数。当然，这只在每种结果都有相同可能性的特殊情况下才成立。
- en: '***Definition:*** Probability of Equally Likely Outcomes'
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义：*** 等可能结果的概率'
- en: 'If $S$ is a sample space with equally likely outcomes, for an event $E$ that
    is a subset of the outcomes in $S$: $$ \begin{align} \p(E) &= \frac{\text{number
    of outcomes in $E$}}{\text{number of outcomes in $S$}} = \frac{|E|}{|S|} \end{align}
    $$'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 如果 $S$ 是具有等可能结果的样本空间，对于事件 $E$，它是 $S$ 中结果的一个子集：$$ \begin{align} \p(E) &= \frac{\text{在
    $E$ 中的结果数量}}{\text{在 $S$ 中的结果数量}} = \frac{|E|}{|S|} \end{align} $$
- en: There is some art form to setting up a problem to calculate a probability based
    on the equally likely outcome rule. (1) The first step is to explicitly define
    your sample space and to argue that all outcomes in your sample space are equally
    likely. (2) Next, you need to count the number of elements in the sample space
    and (3) finally you need to count the size of the event space. The event space
    must be all elements of the sample space that you defined in part (1). The first
    step leaves you with a lot of choice! For example you can decide to make indistinguishable
    objects distinct, as long as your calculation of the size of the event space makes
    the exact same assumptions.
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 根据等可能结果规则计算概率的问题，设置问题有一些技巧。 (1) 第一步是明确定义你的样本空间，并论证你的样本空间中的所有结果都是等可能的。 (2) 接下来，你需要计算样本空间中的元素数量，(3)
    最后你需要计算事件空间的大小。事件空间必须是你在第(1)部分定义的样本空间中的所有元素。第一步给你留下了很多选择！例如，你可以决定使不可区分的对象变得不同，只要你的计算事件空间大小时做出相同的假设。
- en: '***Example:*** What is the probability that the sum of two dice is equal to
    7?'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: '***示例：*** 两个骰子之和等于7的概率是多少？'
- en: '**Buggy Solution:** You could define your sample space to be all the possible
    sum values of two die (2 through 12). However this sample space fails the “equally
    likely” test. You are not equally likely to have a sum of 2 as you are to have
    a sum of 7.'
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: '**有缺陷的解决方案：** 你可以将你的样本空间定义为两个骰子所有可能的和（2到12）。然而，这个样本空间未能通过“等可能性”测试。你得到和为2的概率并不等于得到和为7的概率。'
- en: '***Solution:*** Consider the sample space from the previous chapter where we
    thought of the dice as distinct and enumerated all of the outcomes in the sample
    space. The first number is the roll on die 1 and the second number is the roll
    on die 2\. Note that (1, 2) is distinct from (2, 1). Since each outcome is equally
    likely, and the sample space has exactly 36 outcomes, the likelihood of any one
    outcome is $\frac{1}{36}$. Here is a visualization of all outcomes:'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: '***解决方案：*** 考虑前一章中我们考虑的样本空间，其中我们将骰子视为不同的，并列举了样本空间中的所有结果。第一个数字是骰子1的投掷，第二个数字是骰子2的投掷。请注意，(1,
    2) 与 (2, 1) 是不同的。由于每个结果都是等可能的，并且样本空间恰好有36个结果，因此任何单个结果的概率是 $\frac{1}{36}$。以下是所有结果的可视化：'
- en: '| (1,1) | (1,2) | (1,3) | (1,4) | (1,5) | **(1,6)** |'
  id: totrans-15
  prefs: []
  type: TYPE_TB
  zh: '| (1,1) | (1,2) | (1,3) | (1,4) | (1,5) | **(1,6)** |'
- en: '| (2,1) | (2,2) | (2,3) | (2,4) | **(2,5)** | (2,6) |'
  id: totrans-16
  prefs: []
  type: TYPE_TB
  zh: '| (2,1) | (2,2) | (2,3) | (2,4) | **(2,5)** | (2,6) |'
- en: '| (3,1) | (3,2) | (3,3) | **(3,4)** | (3,5) | (3,6) |'
  id: totrans-17
  prefs: []
  type: TYPE_TB
  zh: '| (3,1) | (3,2) | (3,3) | **(3,4)** | (3,5) | (3,6) |'
- en: '| (4,1) | (4,2) | **(4,3)** | (4,4) | (4,5) | (4,6) |'
  id: totrans-18
  prefs: []
  type: TYPE_TB
  zh: '| (4,1) | (4,2) | **(4,3)** | (4,4) | (4,5) | (4,6) |'
- en: '| (5,1) | **(5,2)** | (5,3) | (5,4) | (5,5) | (5,6) |'
  id: totrans-19
  prefs: []
  type: TYPE_TB
  zh: '| (5,1) | **(5,2)** | (5,3) | (5,4) | (5,5) | (5,6) |'
- en: '| **(6,1)** | (6,2) | (6,3) | (6,4) | (6,5) | (6,6) |'
  id: totrans-20
  prefs: []
  type: TYPE_TB
  zh: '| **(6,1)** | (6,2) | (6,3) | (6,4) | (6,5) | (6,6) |'
- en: 'The event (sum of dice is 7) is the subset of the sample space where the sum
    of the two dice is 7\. Each outcome in the event is highlighted in **blue**. There
    are 6 such outcomes: (1, 6), (2, 5), (3, 4), (4, 3), (5, 2), (6, 1). Notice that
    (1, 6) is a different outcome than (6, 1). To make the outcomes equally likely
    we had to make the die distinct. $$ \begin{align} \p(\text{Sum of two dice is
    7}) &= \frac{|E|}{|S|} && \text{Since outcomes are equally likely} \\ &= \frac{6}{36}
    = \frac{1}{6} && \text{There are 6 outcomes in the event} \end{align} $$'
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 事件（两个骰子之和为7）是样本空间中两个骰子之和为7的子集。事件中的每个结果都用**蓝色**突出显示。共有6种这样的结果：(1, 6), (2, 5),
    (3, 4), (4, 3), (5, 2), (6, 1)。请注意，(1, 6)与(6, 1)是不同的结果。为了使结果等可能，我们必须使骰子不同。$$ \begin{align}
    \p(\text{两个骰子之和为7}) &= \frac{|E|}{|S|} && \text{由于结果等可能} \\ &= \frac{6}{36} =
    \frac{1}{6} && \text{事件中有6种结果} \end{align} $$
- en: Interestingly, this idea also applies to continuous sample spaces. Consider
    the sample space of all the outcomes of the computer function "random" which produces
    a real valued number between 0 and 1, where all real-valued numbers are equally
    likely. Now consider the event $E$ that the number generated is in the range [0.3
    to 0.7]. Since the sample space is equally likely, $\p(E)$ is the ratio of the
    size of $E$ to the size of $S$. In this case $\p(E) = \frac{0.4}{1} = 0.4$.
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 有趣的是，这个想法也适用于连续样本空间。考虑计算机函数"random"的所有可能结果的样本空间，该函数产生介于0和1之间的实数值，其中所有实数值等可能。现在考虑事件$E$，即生成的数字在[0.3到0.7]的范围内。由于样本空间等可能，$\p(E)$是$E$的大小与$S$的大小的比值。在这种情况下，$\p(E)
    = \frac{0.4}{1} = 0.4$。
