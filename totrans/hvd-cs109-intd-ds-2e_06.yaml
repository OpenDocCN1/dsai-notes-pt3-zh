- en: 3  Programming basics
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 3 编程基础
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-1/R/programming-basics.html](https://rafalab.dfci.harvard.edu/dsbook-part-1/R/programming-basics.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-1/R/programming-basics.html](https://rafalab.dfci.harvard.edu/dsbook-part-1/R/programming-basics.html)
- en: '[R](../R/intro-to-R.html)'
  id: totrans-2
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[R](../R/intro-to-R.html)'
- en: '[3  Programming basics](../R/programming-basics.html)'
  id: totrans-3
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[3 编程基础](../R/programming-basics.html)'
- en: 'We teach R because it greatly facilitates data analysis, the main topic of
    this book. By coding in R, we can efficiently perform exploratory data analysis,
    build data analysis pipelines, and prepare data visualization to communicate results.
    However, R is not just a data analysis environment but a programming language.
    Advanced R programmers can develop complex packages and even improve R itself,
    but we do not cover advanced programming in this book. Nonetheless, in this section,
    we introduce three key programming concepts: conditional expressions, for-loops,
    and functions. These are not just key building blocks for advanced programming,
    but are sometimes useful during data analysis. We also note that there are several
    functions that are widely used to program in R but that we will not cover in this
    book. These include `split`, `cut`, `do.call`, and `Reduce`. These are worth learning
    if you plan to become an expert R programmer.'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 我们教授R语言，因为它极大地促进了数据分析，这是本书的主要内容。通过在R语言中编码，我们可以高效地进行数据探索分析，构建数据分析管道，并准备数据可视化以传达结果。然而，R语言不仅仅是一个数据分析环境，它也是一种编程语言。高级R语言程序员可以开发复杂的包，甚至可以改进R语言本身，但本书不涉及高级编程。尽管如此，在本节中，我们介绍了三个关键编程概念：条件表达式、for循环和函数。这些不仅是高级编程的关键构建块，有时在数据分析中也非常有用。我们还注意到，有几个在R语言编程中广泛使用的函数，但本书不会涉及。这些包括`split`、`cut`、`do.call`和`Reduce`。如果你计划成为一名专家R语言程序员，这些是值得学习的。
- en: 3.1 Conditional expressions
  id: totrans-5
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 3.1 条件表达式
- en: Conditional expressions are one of the basic features of programming. They are
    used for what is called *flow control*. The most common conditional expression
    is the if-else statement. In R, we can actually perform quite a bit of data analysis
    without conditionals. However, they do come up occasionally, and you will need
    them once you start writing your own functions and packages.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 条件表达式是编程的基本特性之一。它们用于所谓的*流程控制*。最常用的条件表达式是if-else语句。在R语言中，我们实际上可以在不使用条件语句的情况下进行相当多的数据分析。然而，它们偶尔会出现，一旦你开始编写自己的函数和包，你将需要它们。
- en: 'Here is a very simple example showing the general structure of an if-else statement.
    The basic idea is to print the reciprocal of `a` unless `a` is 0:'
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 这是一个非常简单的例子，展示了if-else语句的一般结构。基本思想是打印`a`的倒数，除非`a`为0：
- en: '[PRE0]'
  id: totrans-8
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: '*Let’s look at one more example using the US murders data frame:'
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: '*让我们再看一个使用美国谋杀数据的例子：'
- en: '[PRE1]'
  id: totrans-10
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: '*Here is a very simple example that tells us the state with the lowest murder
    rate if it is lower than 0.5 per 100,000\. The if-else statement protects us from
    the case in which no state satisfies the condition.'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: '*这是一个非常简单的例子，告诉我们如果谋杀率低于每10万人0.5，那么谋杀率最低的状态。if-else语句保护我们免受没有州满足条件的情况。'
- en: '[PRE2]'
  id: totrans-12
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: '*If we try it again with a rate of 0.25, we get a different answer:'
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: '*如果我们再次尝试以0.25的比率，我们会得到不同的答案：'
- en: '[PRE3]'
  id: totrans-14
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: '*A related function that is very useful is `ifelse`. This function takes three
    arguments: a logical and two possible answers. If the logical is `TRUE`, the value
    in the second argument is returned and if `FALSE`, the value in the third argument
    is returned. Here is an example:'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: '*一个相关的非常有用的函数是`ifelse`。该函数接受三个参数：一个逻辑值和两个可能的答案。如果逻辑值为`TRUE`，则返回第二个参数的值，如果为`FALSE`，则返回第三个参数的值。以下是一个例子：'
- en: '[PRE4]'
  id: totrans-16
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: '*The function is particularly useful because it works on vectors. It examines
    each entry of the logical vector and returns elements from the vector provided
    in the second argument, if the entry is `TRUE`, or elements from the vector provided
    in the third argument, if the entry is `FALSE`.'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: '*该函数特别有用，因为它可以在向量上工作。它检查逻辑向量的每个条目，如果条目为`TRUE`，则从第二个参数提供的向量中返回元素，如果条目为`FALSE`，则从第三个参数提供的向量中返回元素。'
- en: '[PRE5]'
  id: totrans-18
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: '*This table helps us see what happened:'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: '*这个表格帮助我们了解发生了什么：'
- en: '| a | is_a_positive | answer1 | answer2 | result |'
  id: totrans-20
  prefs: []
  type: TYPE_TB
  zh: '| a | is_a_positive | answer1 | answer2 | result |'
- en: '| --- | --- | --- | --- | --- |'
  id: totrans-21
  prefs: []
  type: TYPE_TB
  zh: '| --- | --- | --- | --- | --- |'
- en: '| 0 | FALSE | Inf | NA | NA |'
  id: totrans-22
  prefs: []
  type: TYPE_TB
  zh: '| 0 | FALSE | Inf | NA | NA |'
- en: '| 1 | TRUE | 1.00 | NA | 1.0 |'
  id: totrans-23
  prefs: []
  type: TYPE_TB
  zh: '| 1 | TRUE | 1.00 | NA | 1.0 |'
- en: '| 2 | TRUE | 0.50 | NA | 0.5 |'
  id: totrans-24
  prefs: []
  type: TYPE_TB
  zh: '| 2 | TRUE | 0.50 | NA | 0.5 |'
- en: '| -4 | FALSE | -0.25 | NA | NA |'
  id: totrans-25
  prefs: []
  type: TYPE_TB
  zh: '| -4 | FALSE | -0.25 | NA | NA |'
- en: '| 5 | TRUE | 0.20 | NA | 0.2 |'
  id: totrans-26
  prefs: []
  type: TYPE_TB
  zh: '| 5 | TRUE | 0.20 | NA | 0.2 |'
- en: 'Here is an example of how this function can be readily used to replace all
    the missing values in a vector with zeros:'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: 以下是一个示例，说明如何使用此函数轻松地将向量中的所有缺失值替换为零：
- en: '[PRE6]'
  id: totrans-28
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: '*Two other useful functions are `any` and `all`. The `any` function takes a
    vector of logicals and returns `TRUE` if any of the entries is `TRUE`. The `all`
    function takes a vector of logicals and returns `TRUE` if all of the entries are
    `TRUE`. Here is an example:'
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: '*另外两个有用的函数是 `any` 和 `all`。`any` 函数接受一个逻辑向量，如果其中任何一项为 `TRUE`，则返回 `TRUE`。`all`
    函数接受一个逻辑向量，如果所有项都为 `TRUE`，则返回 `TRUE`。以下是一个例子：'
- en: '[PRE7]'
  id: totrans-30
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: '**You are ready to do exercises 1-3.*********'
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: '**你已经准备好做练习 1-3。*********'
- en: '****3.2 Defining functions****'
  id: totrans-32
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '****3.2 定义函数*****'
- en: '****As you become more experienced, you will find yourself needing to perform
    the same operations over and over. A simple example is computing averages. We
    can compute the average of a vector `x` using the `sum` and `length` functions:
    `sum(x)/length(x)`. Because we do this repeatedly, it is much more efficient to
    write a function that performs this operation. This particular operation is so
    common that someone already wrote the `mean` function and it is included in base
    R. However, you will encounter situations in which the function does not already
    exist, so R permits you to write your own. A simple version of a function that
    computes the average can be defined like this:'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: '****随着你变得越来越有经验，你将发现自己需要反复执行相同的操作。一个简单的例子是计算平均值。我们可以使用 `sum` 和 `length` 函数计算向量
    `x` 的平均值：`sum(x)/length(x)`。因为我们反复这样做，所以编写执行此操作的函数会更高效。这个特定的操作非常常见，因此有人已经编写了 `mean`
    函数，它包含在基础 R 中。然而，你将遇到函数尚未存在的情况，因此 R 允许你编写自己的函数。一个计算平均值的函数的简单版本可以定义如下：'
- en: '[PRE8]'
  id: totrans-34
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: '*Now `avg` is a function that computes the mean:'
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: '*现在 `avg` 是一个计算平均值的函数：'
- en: '[PRE9]'
  id: totrans-36
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: '*Notice that variables defined inside a function are not saved in the workspace.
    So while we use `s` and `n` when we call `avg`, the values are created and changed
    only during the call. Here is an illustrative example:'
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: '*请注意，在函数内部定义的变量不会保存在工作空间中。因此，当我们调用 `avg` 时使用 `s` 和 `n`，这些值仅在调用期间创建和更改。以下是一个说明性的例子：'
- en: '[PRE10]'
  id: totrans-38
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: '*Note how `s` is still 3 after we call `avg`.'
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: '*注意，在调用 `avg` 之后，`s` 仍然是 3。'
- en: 'In general, functions are objects, so we assign them to variable names with
    `<-`. The function `function` tells R you are about to define a function. The
    general form of a function definition looks like this:'
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 通常，函数是对象，所以我们使用 `<-` 将它们分配给变量名。`function` 函数告诉 R 你即将定义一个函数。函数定义的一般形式如下：
- en: '[PRE11]'
  id: totrans-41
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: '*The functions you define can have multiple arguments as well as default values.
    For example, we can define a function that computes either the arithmetic or geometric
    average depending on a user defined variable like this:'
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: '*你定义的函数可以有多个参数以及默认值。例如，我们可以定义一个函数，根据用户定义的变量计算算术平均数或几何平均数，如下所示：'
- en: '[PRE12]'
  id: totrans-43
  prefs: []
  type: TYPE_PRE
  zh: '[PRE12]'
- en: '*We will learn more about how to create functions through experience as we
    face more complex tasks.'
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: '*随着我们面对更复杂的任务，我们将通过经验学习如何创建函数。'
- en: '*You are ready to do exercises 4-7.**********'
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: '*你已经准备好做练习 4-7。**********'
- en: '*****3.3 Namespaces*****'
  id: totrans-46
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '*****3.3 命名空间*****'
- en: '*****Once you start becoming more of an R expert user, you will likely need
    to load several add-on packages for some of your analysis. Once you start doing
    this, it is likely that two packages use the same name for two different functions.
    And often these functions do completely different things. In fact, you have already
    encountered this because both **dplyr** and the R-base **stats** package define
    a `filter` function. There are five other examples in **dplyr**. We know this
    because when we first load **dplyr** we see the following message:'
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: '*****一旦你开始成为一个更高级的 R 用户，你可能会需要为某些分析加载几个附加包。一旦你开始这样做，很可能两个包会为两个不同的函数使用相同的名称。而且，这些函数通常执行完全不同的操作。实际上，你已经遇到过这种情况，因为
    **dplyr** 和 R 基础包的 **stats** 都定义了一个 `filter` 函数。**dplyr** 中还有五个其他例子。我们知道这一点是因为当我们第一次加载
    **dplyr** 时，我们会看到以下消息：'
- en: '[PRE13]'
  id: totrans-48
  prefs: []
  type: TYPE_PRE
  zh: '[PRE13]'
- en: Now when we type `filter` it uses the **dplyr** one. But what if we want to
    use the **stats** version?
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们输入 `filter` 时，它使用的是 **dplyr** 的版本。但如果我们想使用 **stats** 版本怎么办？
- en: 'These functions live in different *namespaces*. R will follow a certain order
    when searching for a function in these *namespaces*. You can see the order by
    typing:'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: 这些函数位于不同的 *命名空间* 中。R 在这些 *命名空间* 中搜索函数时会遵循一定的顺序。你可以通过输入以下内容来查看顺序：
- en: '[PRE14]'
  id: totrans-51
  prefs: []
  type: TYPE_PRE
  zh: '[PRE14]'
- en: '*The first entry in this list is the global environment which includes all
    the objects you define.'
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: '*列表中的第一个条目是全局环境，它包括你定义的所有对象。'
- en: 'So what if we want to use the **stats** `filter` instead of the **dplyr** filter
    but **dplyr** appears first in the search list? You can force the use of a specific
    namespace by using double colons (`::`) like this:'
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: 所以，如果我们想使用 **stats** `filter` 而不是 **dplyr** filter，但 **dplyr** 在搜索列表中排在前面怎么办？你可以通过使用双冒号
    (`::`) 来强制使用特定的命名空间，如下所示：
- en: '[PRE15]'
  id: totrans-54
  prefs: []
  type: TYPE_PRE
  zh: '[PRE15]'
- en: '*If we want to be absolutely sure that we use the **dplyr** `filter`, we can
    use'
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: '*如果我们想绝对确保使用 **dplyr** `filter`，我们可以使用'
- en: '[PRE16]'
  id: totrans-56
  prefs: []
  type: TYPE_PRE
  zh: '[PRE16]'
- en: '*Also note that if we want to use a function in a package without loading the
    entire package, we can use the double colon as well.'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: '*注意，如果我们想在不需要加载整个包的情况下使用包中的函数，我们也可以使用双冒号。'
- en: '*If you want to see all the packages that have function called, for example
    `filter`, you can use double questions marks: `??filter`.*  *For more on this
    more advanced topic we recommend the R packages book[¹](#fn1).*********'
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: '*如果你想查看所有具有名为 `filter` 的函数的包，你可以使用双问号：`??filter`。*  *关于这个更高级的话题，我们推荐阅读 R 包书籍[¹](#fn1)。*********'
- en: '*****3.4 For-loops*****'
  id: totrans-59
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '*****3.4 For 循环*****'
- en: '*****The formula for the sum of the series \(1+2+\dots+n\) is \(S_n = n(n+1)/2\).
    What if we weren’t sure that was the right function? How could we check? Using
    what we learned about functions we can create one that computes \(S_n\):'
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: '*****数列 \(1+2+\dots+n\) 的和的公式是 \(S_n = n(n+1)/2\)。如果我们不确定这是正确的函数怎么办？我们如何检查？利用我们关于函数的知识，我们可以创建一个计算
    \(S_n\) 的函数：'
- en: '[PRE17]'
  id: totrans-61
  prefs: []
  type: TYPE_PRE
  zh: '[PRE17]'
- en: '*How can we compute \(S_n\) for various values of \(n\), say \(n=1,\dots,25\)?
    Do we write 25 lines of code calling `compute_s_n`? No, that is what for-loops
    are for in programming. In this case, we are performing exactly the same task
    over and over, and the only thing that is changing is the value of \(n\). For-loops
    let us define the range that our variable takes (in our example \(n=1,\dots,10\)),
    then change the value and evaluate expression as you *loop*.'
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: '*我们如何计算 \(S_n\) 的各种值，比如 \(n=1,\dots,25\)？我们是否需要写 25 行代码调用 `compute_s_n`？不，这就是编程中
    for 循环的作用。在这种情况下，我们正在重复执行完全相同的任务，唯一改变的是 \(n\) 的值。for 循环允许我们定义变量取值的范围（在我们的例子中 \(n=1,\dots,10\)），然后改变值并
    *循环* 评估表达式。'
- en: 'Perhaps the simplest example of a for-loop is this useless piece of code:'
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: 可能最简单的 for 循环示例就是下面这段无用的代码：
- en: '[PRE18]'
  id: totrans-64
  prefs: []
  type: TYPE_PRE
  zh: '[PRE18]'
- en: '*Here is the for-loop we would write for our \(S_n\) example:'
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
  zh: '*以下是我们的 \(S_n\) 示例中会写的 for 循环：'
- en: '[PRE19]'
  id: totrans-66
  prefs: []
  type: TYPE_PRE
  zh: '[PRE19]'
- en: '*In each iteration \(n=1\), \(n=2\), etc…, we compute \(S_n\) and store it
    in the \(n\)th entry of `s_n`.'
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
  zh: '*在每次迭代 \(n=1\)，\(n=2\) 等…，我们计算 \(S_n\) 并将其存储在 `s_n` 的第 \(n\) 个条目中。'
- en: 'Now we can create a plot to search for a pattern:'
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
  zh: 现在，我们可以创建一个图来寻找模式：
- en: '[PRE20]'
  id: totrans-69
  prefs: []
  type: TYPE_PRE
  zh: '[PRE20]'
- en: '*![](../Images/ae6077910cdc329b164df336b5ef2604.png)'
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
  zh: '*![](../Images/ae6077910cdc329b164df336b5ef2604.png)'
- en: If you noticed that it appears to be a quadratic, you are on the right track
    because the formula is \(n(n+1)/2\).*********
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你注意到它似乎是一个二次函数，那么你就在正确的道路上，因为公式是 \(n(n+1)/2\)。*********
- en: '****3.5 Vectorization and functionals****'
  id: totrans-72
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '****3.5 向量化与函数式编程****'
- en: '****Although for-loops are an important concept to understand, in R we rarely
    use them. As you learn more R, you will realize that *vectorization* is preferred
    over for-loops since it results in shorter and clearer code. We already saw examples
    in the Vector Arithmetic section. A *vectorized* function is a function that will
    apply the same operation on each of the vectors.'
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: '****尽管 for 循环是一个重要的概念，但在 R 中我们很少使用它。随着你对 R 的学习越来越深入，你会意识到 *向量化* 被优先于 for 循环，因为它会产生更短、更清晰的代码。我们已经在向量算术部分看到了例子。一个
    *向量化* 的函数是会对每个向量执行相同操作的函数。我们已经在向量算术部分看到了例子。A *向量化* 的函数是会对每个向量执行相同操作的函数。'
- en: '[PRE21]'
  id: totrans-74
  prefs: []
  type: TYPE_PRE
  zh: '[PRE21]'
- en: '*To make this calculation, there is no need for for-loops. However, not all
    functions work this way. For instance, the function we just wrote, `compute_s_n`,
    does not work element-wise since it is expecting a scalar. This piece of code
    does not run the function on each entry of `n`:'
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: '*为了进行这个计算，不需要使用 for 循环。然而，并非所有函数都以这种方式工作。例如，我们刚才写的函数 `compute_s_n` 并不是逐元素工作的，因为它期望一个标量。这段代码并没有在
    `n` 的每个条目上运行函数：'
- en: '[PRE22]'
  id: totrans-76
  prefs: []
  type: TYPE_PRE
  zh: '[PRE22]'
- en: '**Functionals* are functions that help us apply the same function to each entry
    in a vector, matrix, data frame, or list. Here we cover the functional that operates
    on numeric, logical, and character vectors: `sapply`.'
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: '**函数式**是帮助我们将相同的函数应用于向量、矩阵、数据框或列表中的每个条目的函数。在这里，我们介绍在数值、逻辑和字符向量上操作的函数式：`sapply`。'
- en: 'The function `sapply` permits us to perform element-wise operations on any
    function. Here is how it works:'
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: 函数 `sapply` 允许我们对任何函数执行逐元素操作。以下是它是如何工作的：
- en: '[PRE23]'
  id: totrans-79
  prefs: []
  type: TYPE_PRE
  zh: '[PRE23]'
- en: '*Each element of `x` is passed on to the function `sqrt` and the result is
    returned. These results are concatenated. In this case, the result is a vector
    of the same length as the original `x`. This implies that the for-loop above can
    be written as follows:'
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
  zh: '*每个 `x` 的元素都传递给函数 `sqrt`，并返回结果。这些结果被连接起来。在这种情况下，结果是一个与原始 `x` 长度相同的向量。这意味着上面的
    for 循环可以写成以下形式：*'
- en: '[PRE24]'
  id: totrans-81
  prefs: []
  type: TYPE_PRE
  zh: '[PRE24]'
- en: '*Other functionals are `apply`, `lapply`, `tapply`, `mapply`, `vapply`, and
    `replicate`. We mostly use `sapply`, `apply`, and `replicate` in this book, but
    we recommend familiarizing yourselves with the others as they can be very useful.'
  id: totrans-82
  prefs: []
  type: TYPE_NORMAL
  zh: '*其他函数包括 `apply`, `lapply`, `tapply`, `mapply`, `vapply`, 和 `replicate`。我们在这本书中主要使用
    `sapply`, `apply`, 和 `replicate`，但我们建议您熟悉其他函数，因为它们可能非常有用。'
- en: '*You are ready to do exercises 8-11.*********'
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
  zh: '*你已经准备好做练习 8-11。*********'
- en: '*****3.6 Exercises*****'
  id: totrans-84
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '*****3.6 练习题*****'
- en: '*****1\. What will this conditional expression return?'
  id: totrans-85
  prefs: []
  type: TYPE_NORMAL
  zh: '*****1. 这个条件表达式将返回什么？*****'
- en: '[PRE25]'
  id: totrans-86
  prefs: []
  type: TYPE_PRE
  zh: '[PRE25]'
- en: '*2\. Which of the following expressions is always `FALSE` when at least one
    entry of a logical vector `x` is TRUE?'
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: '*2. 以下哪个表达式在逻辑向量 `x` 至少有一个条目为 TRUE 时总是 `FALSE`？*'
- en: '`all(x)`'
  id: totrans-88
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`all(x)`'
- en: '`any(x)`'
  id: totrans-89
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`any(x)`'
- en: '`any(!x)`'
  id: totrans-90
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`any(!x)`'
- en: '`all(!x)`'
  id: totrans-91
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`all(!x)`'
- en: 3\. The function `nchar` tells you how many characters long a character vector
    is. Write a line of code that assigns to the object `new_names` the state abbreviation
    when the state name is longer than 8 characters.
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: 3. 函数 `nchar` 告诉你字符向量有多长。编写一行代码，将对象 `new_names` 赋值为当州名长度超过 8 个字符时的州简称。
- en: 4\. Create a function `sum_n` that for any given value, say \(n\), computes
    the sum of the integers from 1 to n (inclusive). Use the function to determine
    the sum of integers from 1 to 5,000.
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: 4. 创建一个名为 `sum_n` 的函数，对于任何给定的值，例如 \(n\)，计算从 1 到 \(n\)（包含）的整数之和。使用该函数确定从 1 到
    5,000 的整数之和。
- en: 5\. Create a function `altman_plot` that takes two arguments, `x` and `y`, and
    plots the difference against the sum.
  id: totrans-94
  prefs: []
  type: TYPE_NORMAL
  zh: 5. 创建一个名为 `altman_plot` 的函数，该函数接受两个参数 `x` 和 `y`，并绘制差值与和的关系图。
- en: 6\. After running the code below, what is the value of `x`?
  id: totrans-95
  prefs: []
  type: TYPE_NORMAL
  zh: 6. 在运行以下代码后，`x` 的值是多少？
- en: '[PRE26]'
  id: totrans-96
  prefs: []
  type: TYPE_PRE
  zh: '[PRE26]'
- en: '*7\. Write a function `compute_s_n` that for any given \(n\) computes the sum
    \(S_n = 1^2 + 2^2 + 3^2 + \dots n^2\). Report the value of the sum when \(n=10\).'
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
  zh: '*7. 编写一个名为 `compute_s_n` 的函数，对于任何给定的 \(n\)，计算和 \(S_n = 1^2 + 2^2 + 3^2 + \dots
    n^2\)。当 \(n=10\) 时，报告和的值。*'
- en: 8\. Define an empty numerical vector `s_n` of size 25 using `s_n <- vector("numeric",
    25)` and store in the results of \(S_1, S_2, \dots S_{25}\) using a for-loop.
  id: totrans-98
  prefs: []
  type: TYPE_NORMAL
  zh: 8. 使用 `s_n <- vector("numeric", 25)` 定义一个大小为 25 的空数值向量 `s_n`，并使用 for 循环将 \(S_1,
    S_2, \dots S_{25}\) 的结果存储在其中。
- en: 9\. Repeat exercise 8, but this time use `sapply`.
  id: totrans-99
  prefs: []
  type: TYPE_NORMAL
  zh: 9. 重复练习 8，但这次使用 `sapply`。
- en: 10\. Plot \(S_n\) versus \(n\). Use points defined by \(n=1,\dots,25\).
  id: totrans-100
  prefs: []
  type: TYPE_NORMAL
  zh: 10. 绘制 \(S_n\) 与 \(n\) 的关系图。使用 \(n=1,\dots,25\) 定义的点。
- en: 11\. Confirm that the formula for this sum is \(S_n= n(n+1)(2n+1)/6\).*******
  id: totrans-101
  prefs: []
  type: TYPE_NORMAL
  zh: 11. 确认这个和的公式是 \(S_n= n(n+1)(2n+1)/6\)。*******
