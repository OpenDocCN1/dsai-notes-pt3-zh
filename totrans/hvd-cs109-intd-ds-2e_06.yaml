- en: 3  Programming basics
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-1/R/programming-basics.html](https://rafalab.dfci.harvard.edu/dsbook-part-1/R/programming-basics.html)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '[R](../R/intro-to-R.html)'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '[3  Programming basics](../R/programming-basics.html)'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'We teach R because it greatly facilitates data analysis, the main topic of
    this book. By coding in R, we can efficiently perform exploratory data analysis,
    build data analysis pipelines, and prepare data visualization to communicate results.
    However, R is not just a data analysis environment but a programming language.
    Advanced R programmers can develop complex packages and even improve R itself,
    but we do not cover advanced programming in this book. Nonetheless, in this section,
    we introduce three key programming concepts: conditional expressions, for-loops,
    and functions. These are not just key building blocks for advanced programming,
    but are sometimes useful during data analysis. We also note that there are several
    functions that are widely used to program in R but that we will not cover in this
    book. These include `split`, `cut`, `do.call`, and `Reduce`. These are worth learning
    if you plan to become an expert R programmer.'
  prefs: []
  type: TYPE_NORMAL
- en: 3.1 Conditional expressions
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Conditional expressions are one of the basic features of programming. They are
    used for what is called *flow control*. The most common conditional expression
    is the if-else statement. In R, we can actually perform quite a bit of data analysis
    without conditionals. However, they do come up occasionally, and you will need
    them once you start writing your own functions and packages.
  prefs: []
  type: TYPE_NORMAL
- en: 'Here is a very simple example showing the general structure of an if-else statement.
    The basic idea is to print the reciprocal of `a` unless `a` is 0:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: '*Let’s look at one more example using the US murders data frame:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: '*Here is a very simple example that tells us the state with the lowest murder
    rate if it is lower than 0.5 per 100,000\. The if-else statement protects us from
    the case in which no state satisfies the condition.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: '*If we try it again with a rate of 0.25, we get a different answer:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: '*A related function that is very useful is `ifelse`. This function takes three
    arguments: a logical and two possible answers. If the logical is `TRUE`, the value
    in the second argument is returned and if `FALSE`, the value in the third argument
    is returned. Here is an example:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE4]'
  prefs: []
  type: TYPE_PRE
- en: '*The function is particularly useful because it works on vectors. It examines
    each entry of the logical vector and returns elements from the vector provided
    in the second argument, if the entry is `TRUE`, or elements from the vector provided
    in the third argument, if the entry is `FALSE`.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE5]'
  prefs: []
  type: TYPE_PRE
- en: '*This table helps us see what happened:'
  prefs: []
  type: TYPE_NORMAL
- en: '| a | is_a_positive | answer1 | answer2 | result |'
  prefs: []
  type: TYPE_TB
- en: '| --- | --- | --- | --- | --- |'
  prefs: []
  type: TYPE_TB
- en: '| 0 | FALSE | Inf | NA | NA |'
  prefs: []
  type: TYPE_TB
- en: '| 1 | TRUE | 1.00 | NA | 1.0 |'
  prefs: []
  type: TYPE_TB
- en: '| 2 | TRUE | 0.50 | NA | 0.5 |'
  prefs: []
  type: TYPE_TB
- en: '| -4 | FALSE | -0.25 | NA | NA |'
  prefs: []
  type: TYPE_TB
- en: '| 5 | TRUE | 0.20 | NA | 0.2 |'
  prefs: []
  type: TYPE_TB
- en: 'Here is an example of how this function can be readily used to replace all
    the missing values in a vector with zeros:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE6]'
  prefs: []
  type: TYPE_PRE
- en: '*Two other useful functions are `any` and `all`. The `any` function takes a
    vector of logicals and returns `TRUE` if any of the entries is `TRUE`. The `all`
    function takes a vector of logicals and returns `TRUE` if all of the entries are
    `TRUE`. Here is an example:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE7]'
  prefs: []
  type: TYPE_PRE
- en: '**You are ready to do exercises 1-3.*********'
  prefs: []
  type: TYPE_NORMAL
- en: '****3.2 Defining functions****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '****As you become more experienced, you will find yourself needing to perform
    the same operations over and over. A simple example is computing averages. We
    can compute the average of a vector `x` using the `sum` and `length` functions:
    `sum(x)/length(x)`. Because we do this repeatedly, it is much more efficient to
    write a function that performs this operation. This particular operation is so
    common that someone already wrote the `mean` function and it is included in base
    R. However, you will encounter situations in which the function does not already
    exist, so R permits you to write your own. A simple version of a function that
    computes the average can be defined like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE8]'
  prefs: []
  type: TYPE_PRE
- en: '*Now `avg` is a function that computes the mean:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE9]'
  prefs: []
  type: TYPE_PRE
- en: '*Notice that variables defined inside a function are not saved in the workspace.
    So while we use `s` and `n` when we call `avg`, the values are created and changed
    only during the call. Here is an illustrative example:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]'
  prefs: []
  type: TYPE_PRE
- en: '*Note how `s` is still 3 after we call `avg`.'
  prefs: []
  type: TYPE_NORMAL
- en: 'In general, functions are objects, so we assign them to variable names with
    `<-`. The function `function` tells R you are about to define a function. The
    general form of a function definition looks like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]'
  prefs: []
  type: TYPE_PRE
- en: '*The functions you define can have multiple arguments as well as default values.
    For example, we can define a function that computes either the arithmetic or geometric
    average depending on a user defined variable like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE12]'
  prefs: []
  type: TYPE_PRE
- en: '*We will learn more about how to create functions through experience as we
    face more complex tasks.'
  prefs: []
  type: TYPE_NORMAL
- en: '*You are ready to do exercises 4-7.**********'
  prefs: []
  type: TYPE_NORMAL
- en: '*****3.3 Namespaces*****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '*****Once you start becoming more of an R expert user, you will likely need
    to load several add-on packages for some of your analysis. Once you start doing
    this, it is likely that two packages use the same name for two different functions.
    And often these functions do completely different things. In fact, you have already
    encountered this because both **dplyr** and the R-base **stats** package define
    a `filter` function. There are five other examples in **dplyr**. We know this
    because when we first load **dplyr** we see the following message:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE13]'
  prefs: []
  type: TYPE_PRE
- en: Now when we type `filter` it uses the **dplyr** one. But what if we want to
    use the **stats** version?
  prefs: []
  type: TYPE_NORMAL
- en: 'These functions live in different *namespaces*. R will follow a certain order
    when searching for a function in these *namespaces*. You can see the order by
    typing:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE14]'
  prefs: []
  type: TYPE_PRE
- en: '*The first entry in this list is the global environment which includes all
    the objects you define.'
  prefs: []
  type: TYPE_NORMAL
- en: 'So what if we want to use the **stats** `filter` instead of the **dplyr** filter
    but **dplyr** appears first in the search list? You can force the use of a specific
    namespace by using double colons (`::`) like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE15]'
  prefs: []
  type: TYPE_PRE
- en: '*If we want to be absolutely sure that we use the **dplyr** `filter`, we can
    use'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE16]'
  prefs: []
  type: TYPE_PRE
- en: '*Also note that if we want to use a function in a package without loading the
    entire package, we can use the double colon as well.'
  prefs: []
  type: TYPE_NORMAL
- en: '*If you want to see all the packages that have function called, for example
    `filter`, you can use double questions marks: `??filter`.*  *For more on this
    more advanced topic we recommend the R packages book[¹](#fn1).*********'
  prefs: []
  type: TYPE_NORMAL
- en: '*****3.4 For-loops*****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '*****The formula for the sum of the series \(1+2+\dots+n\) is \(S_n = n(n+1)/2\).
    What if we weren’t sure that was the right function? How could we check? Using
    what we learned about functions we can create one that computes \(S_n\):'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE17]'
  prefs: []
  type: TYPE_PRE
- en: '*How can we compute \(S_n\) for various values of \(n\), say \(n=1,\dots,25\)?
    Do we write 25 lines of code calling `compute_s_n`? No, that is what for-loops
    are for in programming. In this case, we are performing exactly the same task
    over and over, and the only thing that is changing is the value of \(n\). For-loops
    let us define the range that our variable takes (in our example \(n=1,\dots,10\)),
    then change the value and evaluate expression as you *loop*.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Perhaps the simplest example of a for-loop is this useless piece of code:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE18]'
  prefs: []
  type: TYPE_PRE
- en: '*Here is the for-loop we would write for our \(S_n\) example:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE19]'
  prefs: []
  type: TYPE_PRE
- en: '*In each iteration \(n=1\), \(n=2\), etc…, we compute \(S_n\) and store it
    in the \(n\)th entry of `s_n`.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Now we can create a plot to search for a pattern:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE20]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/ae6077910cdc329b164df336b5ef2604.png)'
  prefs: []
  type: TYPE_NORMAL
- en: If you noticed that it appears to be a quadratic, you are on the right track
    because the formula is \(n(n+1)/2\).*********
  prefs: []
  type: TYPE_NORMAL
- en: '****3.5 Vectorization and functionals****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '****Although for-loops are an important concept to understand, in R we rarely
    use them. As you learn more R, you will realize that *vectorization* is preferred
    over for-loops since it results in shorter and clearer code. We already saw examples
    in the Vector Arithmetic section. A *vectorized* function is a function that will
    apply the same operation on each of the vectors.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE21]'
  prefs: []
  type: TYPE_PRE
- en: '*To make this calculation, there is no need for for-loops. However, not all
    functions work this way. For instance, the function we just wrote, `compute_s_n`,
    does not work element-wise since it is expecting a scalar. This piece of code
    does not run the function on each entry of `n`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE22]'
  prefs: []
  type: TYPE_PRE
- en: '**Functionals* are functions that help us apply the same function to each entry
    in a vector, matrix, data frame, or list. Here we cover the functional that operates
    on numeric, logical, and character vectors: `sapply`.'
  prefs: []
  type: TYPE_NORMAL
- en: 'The function `sapply` permits us to perform element-wise operations on any
    function. Here is how it works:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE23]'
  prefs: []
  type: TYPE_PRE
- en: '*Each element of `x` is passed on to the function `sqrt` and the result is
    returned. These results are concatenated. In this case, the result is a vector
    of the same length as the original `x`. This implies that the for-loop above can
    be written as follows:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE24]'
  prefs: []
  type: TYPE_PRE
- en: '*Other functionals are `apply`, `lapply`, `tapply`, `mapply`, `vapply`, and
    `replicate`. We mostly use `sapply`, `apply`, and `replicate` in this book, but
    we recommend familiarizing yourselves with the others as they can be very useful.'
  prefs: []
  type: TYPE_NORMAL
- en: '*You are ready to do exercises 8-11.*********'
  prefs: []
  type: TYPE_NORMAL
