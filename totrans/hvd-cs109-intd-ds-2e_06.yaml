- en: '*2\. Which of the following expressions is always `FALSE` when at least one
    entry of a logical vector `x` is TRUE?'
  prefs: []
  type: TYPE_NORMAL
- en: '`all(x)`'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`any(x)`'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`any(!x)`'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`all(!x)`'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 3\. The function `nchar` tells you how many characters long a character vector
    is. Write a line of code that assigns to the object `new_names` the state abbreviation
    when the state name is longer than 8 characters.
  prefs: []
  type: TYPE_NORMAL
- en: 4\. Create a function `sum_n` that for any given value, say \(n\), computes
    the sum of the integers from 1 to n (inclusive). Use the function to determine
    the sum of integers from 1 to 5,000.
  prefs: []
  type: TYPE_NORMAL
- en: 5\. Create a function `altman_plot` that takes two arguments, `x` and `y`, and
    plots the difference against the sum.
  prefs: []
  type: TYPE_NORMAL
- en: 6\. After running the code below, what is the value of `x`?
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE26]'
  prefs: []
  type: TYPE_PRE
- en: '*7\. Write a function `compute_s_n` that for any given \(n\) computes the sum
    \(S_n = 1^2 + 2^2 + 3^2 + \dots n^2\). Report the value of the sum when \(n=10\).'
  prefs: []
  type: TYPE_NORMAL
- en: 8\. Define an empty numerical vector `s_n` of size 25 using `s_n <- vector("numeric",
    25)` and store in the results of \(S_1, S_2, \dots S_{25}\) using a for-loop.
  prefs: []
  type: TYPE_NORMAL
- en: 9\. Repeat exercise 8, but this time use `sapply`.
  prefs: []
  type: TYPE_NORMAL
- en: 10\. Plot \(S_n\) versus \(n\). Use points defined by \(n=1,\dots,25\).
  prefs: []
  type: TYPE_NORMAL
- en: 11\. Confirm that the formula for this sum is \(S_n= n(n+1)(2n+1)/6\).*******
  prefs: []
  type: TYPE_NORMAL
