- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: 'We are able to know the age of ancient artefacts using a process called carbon
    dating. This process involves a lot of uncertainty! You observe a measurement
    of 90% of natural C14 molecules in a sample. What is your belief distribution
    over the age of the sample? This task requires probabilistic models because we
    have to think about two random variables together: the age $A$ of the sample,
    and $M$ the remaining C14 molecules.'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以使用被称为碳定年法的过程来确定古代文物的年龄。这个过程涉及很多不确定性！你观察到样本中90%的自然C14分子的测量值。你对样本年龄的信念分布是什么？这项任务需要概率模型，因为我们必须同时考虑两个随机变量：样本的年龄$A$和剩余的C14分子数$M$。
- en: Carbon Dating Demo
  id: totrans-4
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 碳定年演示
- en: Imagine you have just taken a sample from your artifact. For the sample size
    you took, a living organism would have had 1000 molecules of C14\. Use this demo
    to explore the relationship between how much C14 is left and your belief ditribution
    for how old your artifact is.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 想象你刚刚从你的文物中取了一个样本。对于你取的样本大小，一个活体生物会有1000个C14分子。使用这个演示来探索剩余的C14量和你对文物年龄的信念分布之间的关系。
