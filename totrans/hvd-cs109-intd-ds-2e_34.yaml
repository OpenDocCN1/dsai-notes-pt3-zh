  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/prob/intro-to-prob.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/prob/intro-to-prob.html)
- en: Introduction
  id: totrans-2
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 引言
- en: The first part of the book focused on describing data we have already collected.
    But in most data analysis projects, what we observe is only one possible outcome
    among many. If we were to collect the same data again, another survey, another
    experiment, we would not obtain exactly the same results. This variation is not
    to be ignored as it reflects the fundamental uncertainty that accompanies all
    real data.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 本书的第一部分专注于描述我们已经收集到的数据。但在大多数数据分析项目中，我们所观察到的只是众多可能结果中的一个。如果我们再次收集相同的数据，进行另一次调查或实验，我们不会得到完全相同的结果。这种变化不容忽视，因为它反映了伴随所有真实数据的根本不确定性。
- en: Probability is the mathematical language we use to describe that uncertainty.
    It provides the foundation for reasoning about variation, quantifying how likely
    different outcomes are, and ultimately, for drawing conclusions from data. Every
    inferential method we will learn, from confidence intervals to regression and
    machine learning, rests on these ideas.
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 概率是我们用来描述这种不确定性的数学语言。它为推理变化、量化不同结果的可能性以及最终从数据中得出结论提供了基础。我们将学习的每一个推断方法，从置信区间到回归和机器学习，都建立在这些理念之上。
- en: 'The study of probability began with *games of chance*, where uncertainty is
    both concrete and controlled: tossing coins, drawing cards, or betting on outcomes.
    Mathematicians such as Cardano, Fermat, and Pascal developed the first formal
    methods for computing odds in these settings, laying the groundwork for what would
    become modern probability theory.'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 概率论的研究始于*机会游戏*，其中不确定性既具体又可控：抛硬币、抽牌或下注结果。像Cardano、Fermat和Pascal这样的数学家在这些环境中开发了计算赔率的第一个正式方法，为后来成为现代概率理论奠定了基础。
- en: In this part of the book, we use these games of chance as a pedagogical tool.
    They provide clear, well-defined examples that make abstract ideas intuitive.
    By working with them, we can focus on the logic of probability without the complications
    of real-world data collection. In later parts of the book, we return to data analysis
    and show how these same principles apply to real-world uncertainty, polls, experiments,
    and prediction problems.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 在本书的这一部分，我们使用这些机会游戏作为教学工具。它们提供了清晰、定义良好的例子，使抽象概念变得直观。通过使用它们，我们可以专注于概率的逻辑，而无需考虑现实世界数据收集的复杂性。在本书的后续部分，我们将回到数据分析，展示这些相同的原理如何应用于现实世界的不确定性、民意调查、实验和预测问题。
- en: 'We will introduce the essential concepts of probability through simple, concrete
    examples: defining events, computing probabilities, and describing random variables
    and their distributions. Our emphasis is on intuition and computation rather than
    mathematical derivation.'
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将通过简单、具体的例子介绍概率论的基本概念：定义事件、计算概率以及描述随机变量及其分布。我们的重点是直观和计算，而不是数学推导。
- en: Throughout this part of the book, we also connect probability theory to computer
    simulations. Using R code and Monte Carlo methods, we will learn how to estimate
    probabilities, explore random behavior, and develop intuition for uncertainty
    through simulation. This practical, code-based approach will prepare you to see
    how probability connects directly to real data in the chapters that follow.
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 在本书的这一部分，我们还把概率理论与计算机模拟联系起来。使用R代码和蒙特卡洛方法，我们将学习如何估计概率、探索随机行为，并通过模拟培养对不确定性的直觉。这种基于代码的实用方法将使你能够看到概率如何直接与后续章节中的真实数据相联系。
