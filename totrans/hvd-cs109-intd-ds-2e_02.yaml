- en: Who will find this book useful?
  id: totrans-12
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 谁会找到这本书有用？
- en: This book is meant to be a textbook for a first course in Data Science. No previous
    knowledge of R is necessary, although some experience with programming may be
    helpful. To be a successful data analyst implementing these skill requires understanding
    advanced statistical concepts, such as those covered in [Advanced Data Science](http://rafalab.dfci.harvard.edu/dsbook-part-2/).
    If you read and understand all the chapters and complete all the exercises in
    this book, and understand statistical concepts, you will be well-positioned to
    perform basic data analysis tasks and you will be prepared to learn the more advanced
    concepts and skills needed to become an expert.
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 这本书旨在作为数据科学入门课程的教科书。不需要先前的 R 语言知识，尽管一些编程经验可能会有所帮助。要成为一名成功的数据分析师，实施这些技能需要理解高级统计概念，例如在[高级数据科学](http://rafalab.dfci.harvard.edu/dsbook-part-2/)中涵盖的概念。如果你阅读并理解了本书的所有章节，完成了所有练习，并理解了统计概念，你将能够很好地执行基本的数据分析任务，并准备好学习成为专家所需的更高级的概念和技能。
- en: What does this book cover?
  id: totrans-14
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 这本书涵盖了什么内容？
- en: We start by going over the **basics of R**, the **tidyverse**, and the **data.table**
    package. You learn R throughout the book, but in the first part we go over the
    building blocks needed to keep learning.
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 我们首先回顾了 R 的**基础**、**tidyverse**和**data.table**包。你将在整本书中学习 R，但在第一部分中，我们回顾了继续学习所需的构建块。
- en: The growing availability of informative datasets and software tools has led
    to increased reliance on **data visualizations** in many fields. In the second
    part we demonstrate how to use **ggplot2** to generate graphs and describe important
    data visualization principles.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 信息的数据库和软件工具的日益可用导致许多领域对**数据可视化**的依赖性增加。在第二部分中，我们展示了如何使用**ggplot2**生成图表并描述重要的数据可视化原则。
- en: The third part uses several examples to familiarize the reader with **data wrangling**.
    Among the specific skills we learn are web scraping, using regular expressions,
    and joining and reshaping data tables. We do this using **tidyverse** tools.
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 第三部分通过几个示例使读者熟悉**数据整理**。我们学习的具体技能包括网络抓取、使用正则表达式以及合并和重塑数据表。我们使用**tidyverse**工具来完成这些工作。
- en: In the final part, we provide a brief introduction to the **productivity tools**
    we use on a day-to-day basis in data science projects. These are RStudio, UNIX/Linux
    shell, Git and GitHub, Quarto, and **knitr**.
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 在最后一部分，我们简要介绍了我们在数据科学项目中日常使用的**生产力工具**。这些包括RStudio、UNIX/Linux shell、Git和GitHub、Quarto以及**knitr**。
- en: What is not covered by this book?
  id: totrans-19
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 本书没有涵盖哪些内容？
- en: This book focuses on the computing skills necessary for the data analysis aspects
    of data science. As mentioned, we do not cover statistical concepts. We also do
    not cover aspects related to data management or engineering. Although R programming
    is an essential part of the book, we do not teach more advanced computer science
    topics such as data structures, optimization, and algorithm theory. Similarly,
    we do not cover topics such as web services, interactive graphics, parallel computing,
    and data streaming processing.
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 本书专注于数据科学中数据分析方面所需的计算技能。正如所述，我们不涉及统计概念。我们也不涵盖与数据管理或工程相关的方面。尽管R编程是本书的一个重要部分，但我们不教授更高级的计算机科学主题，如数据结构、优化和算法理论。同样，我们也不涉及诸如网络服务、交互式图形、并行计算和数据流处理等主题。
