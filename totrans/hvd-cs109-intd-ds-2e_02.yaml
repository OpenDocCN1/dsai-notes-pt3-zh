- en: Introduction
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-1/intro.html](https://rafalab.dfci.harvard.edu/dsbook-part-1/intro.html)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: 'The demand for skilled data science practitioners in industry, academia, and
    government is rapidly growing. This book introduces skills that can help you tackle
    real-world data analysis challenges. These include R programming, data wrangling
    with **dplyr**, data visualization with **ggplot2**, file organization with UNIX/Linux
    shell, version control with Git and GitHub, and reproducible document preparation
    with Quarto and **knitr**. The book is divided into four parts: **R**, **Data
    Visualization**, **Data Wrangling**, and **Productivity Tools**. Each part has
    several chapters meant to be presented as one lecture and includes dozens of exercises
    distributed across chapters.'
  prefs: []
  type: TYPE_NORMAL
- en: Case studies
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'Throughout the book, we use motivating case studies. In each case study, we
    try to realistically mimic a data scientist’s experience. For each of the skills
    covered, we start by asking specific questions and answer these through data analysis.
    We learn the concepts as a means to answer the questions. Examples of the case
    studies included in the book are:'
  prefs: []
  type: TYPE_NORMAL
- en: '| Case Study | Concept |  |'
  prefs: []
  type: TYPE_TB
- en: '| --- | --- | --- |'
  prefs: []
  type: TYPE_TB
- en: '| US murder rates by state | R Basics |  |'
  prefs: []
  type: TYPE_TB
- en: '| Student heights | Statistical Summaries |  |'
  prefs: []
  type: TYPE_TB
- en: '| Trends in world health and economics | Data Visualization |  |'
  prefs: []
  type: TYPE_TB
- en: '| The impact of vaccines on infectious disease rates | Data Visualization |  |'
  prefs: []
