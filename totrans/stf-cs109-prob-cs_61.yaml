- en: Fairness in Artificial Intelligence
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 人工智能中的公平性
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/examples/fairness/](https://chrispiech.github.io/probabilityForComputerScientists/en/examples/fairness/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/examples/fairness/](https://chrispiech.github.io/probabilityForComputerScientists/en/examples/fairness/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: Artificial Intelligence often gives the impression that it is objective and
    "fair". However, algorithms are made by humans and trained by data which may be
    biased. There are several examples of deployed AI algorithms that have been shown
    to make decisions that were biased based on gender, race or other protected demographics
    — even when there was no intention for it.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 人工智能常常给人一种客观和“公平”的印象。然而，算法是由人类制作的，并且由可能存在偏见的数据进行训练。有几个部署的人工智能算法的例子已经表明，它们基于性别、种族或其他受保护的群体做出有偏见的决策——即使没有这样的意图。
- en: These examples have also led to a necessary research into a growing field of
    algorithmic fairness. How can we demonstrate, or prove, that an algorithm is behaving
    in a way that we think is appropriate? What is fair? Clearly these are complex
    questions and are deserving of a complete conversation. This example is simple
    for the purpose of giving an introduction to the topic.
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 这些例子也引发了对算法公平性日益增长领域的研究需求。我们如何证明或展示一个算法是以我们认为适当的方式运行的？什么是公平？显然，这些问题很复杂，值得进行深入的讨论。这个例子简单，目的是为了介绍这个话题。
- en: '![](../Images/4f4aa2949d1f295db51cb4becbe73785.png)'
  id: totrans-5
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/4f4aa2949d1f295db51cb4becbe73785.png)'
- en: '*ML stands for Machine Learning. Solon Barocas and Moritz Hardt, "Fairness
    in Machine Learning", NeurIPS 2017*'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: '*ML 代表机器学习。Solon Barocas 和 Moritz Hardt，"机器学习中的公平性"，NeurIPS 2017*'
- en: What is Fairness?
  id: totrans-7
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 什么是公平？
- en: 'An artificial intelligence algorithm is going to be used to make a binary prediction
    ($G$ for guess) for whether a person will repay a loan. The question has come
    up: is the algorithm "fair" with respect to a binary protected demographic ($D$
    for demographic)? To answer this question we are going to analyze predictions
    the algorithm made on historical data. We are then going to compare the predictions
    to the true outcome ($T$ for truth). Consider the following joint probability
    table from the history of the algorithm’s predictions:'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 将使用人工智能算法来对一个人是否会偿还贷款进行二元预测（$G$ 代表猜测）。问题已经出现：该算法在二元受保护群体（$D$ 代表人口统计）方面是否“公平”？为了回答这个问题，我们将分析算法在历史数据上做出的预测。然后，我们将比较预测与真实结果（$T$
    代表真实）进行比较。考虑以下算法预测历史的联合概率表：
- en: $D=0$
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: $D=0$
- en: '|  | $G=0$ | $G=1$ |'
  id: totrans-10
  prefs: []
  type: TYPE_TB
  zh: '|  | $G=0$ | $G=1$ |'
- en: '| $T=0$ | 0.21 | 0.32 |'
  id: totrans-11
  prefs: []
  type: TYPE_TB
  zh: '| $T=0$ | 0.21 | 0.32 |'
- en: '| $T=1$ | 0.07 | 0.28 |'
  id: totrans-12
  prefs: []
  type: TYPE_TB
  zh: '| $T=1$ | 0.07 | 0.28 |'
- en: $D=1$
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: $D=1$
- en: '|  | $G=0$ | $G=1$ |'
  id: totrans-14
  prefs: []
  type: TYPE_TB
  zh: '|  | $G=0$ | $G=1$ |'
- en: '| $T=0$ | 0.01 | 0.01 |'
  id: totrans-15
  prefs: []
  type: TYPE_TB
  zh: '| $T=0$ | 0.01 | 0.01 |'
- en: '| $T=1$ | 0.02 | 0.08 |'
  id: totrans-16
  prefs: []
  type: TYPE_TB
  zh: '| $T=1$ | 0.02 | 0.08 |'
- en: Recall that cell $D=i,G=j,T=k$ contains the probability $\P(D=i,G=j,T=k)$. A
    joint probability table gives the probability of all combination of events. Recall
    that since each cell is mutually exclusive, the $\sum_i \sum_j \sum_k \P(D=i,G=j,T=k)
    = 1$. Note that this assumption of mutual exclusion could be problematic for demographic
    variables (some people are mixed ethnicity, etc) which gives you a hint that we
    are just scratching the surface in our conversation about fairness. Let's use
    this joint probability to learn about some of the common definitions of fairness.
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 记住，单元格 $D=i,G=j,T=k$ 包含概率 $\P(D=i,G=j,T=k)$。联合概率表给出了所有事件组合的概率。记住，由于每个单元格都是互斥的，所以
    $\sum_i \sum_j \sum_k \P(D=i,G=j,T=k) = 1$。注意，这种互斥的假设对于人口统计变量可能是问题（有些人可能是混血种族等），这给你一个提示，我们只是在公平性的讨论中刚刚触及表面。让我们使用这个联合概率来了解一些公平性的常见定义。
- en: '**Practice with joint marginalization**'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: '**练习联合边缘化**'
- en: What is $\p(D=0)$? What is $\p(D=1)$?
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: $\p(D=0)$ 是什么？$\p(D=1)$ 是什么？
- en: 'Probabilities with assignments to a subset of the random variables in the joint
    distribution can be calculated by a process called *marginalization*: sum the
    probability from all cells where that assignment is true.'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 通过一种称为边缘化的过程，可以计算联合分布中随机变量子集的分配的概率：将所有该分配为真的单元格的概率相加。
- en: $$ \begin{align} \p(D=1) &= \sum_{j \in \{0, 1\}} \sum_{k \in \{0, 1\}} \p(D=
    1, G= j, T = k)\\ &= 0.01 + 0.01 + 0.02 + 0.08 = 0.12 \end{align} $$ $$ \begin{align}
    \p(D=0) &= \sum_{j \in \{0, 1\}} \sum_{k \in \{0, 1\}} \p(D= 0, G= j, T = k)\\
    &= 0.21 + 0.32 + 0.07 + 0.28 = 0.88 \end{align} $$
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: $$ \begin{align} \p(D=1) &= \sum_{j \in \{0, 1\}} \sum_{k \in \{0, 1\}} \p(D=
    1, G= j, T = k)\\ &= 0.01 + 0.01 + 0.02 + 0.08 = 0.12 \end{align} $$ $$ \begin{align}
    \p(D=0) &= \sum_{j \in \{0, 1\}} \sum_{k \in \{0, 1\}} \p(D= 0, G= j, T = k)\\
    &= 0.21 + 0.32 + 0.07 + 0.28 = 0.88 \end{align} $$
- en: Note that $\p(D=0) + \p(D=1) = 1$. That implies that the demographics are mututally
    exclusive.
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 注意到 $\p(D=0) + \p(D=1) = 1$。这意味着人口统计变量是互斥的。
- en: '**Fairness definition #1: Parity**'
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: '**公平性定义 #1：奇偶性**'
- en: An algorithm satisfies “parity” if the probability that the algorithm makes
    a positive prediction ($G$ = 1) is the same regardless of being conditioned on
    demographic variable.
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: 如果算法做出正预测（$G$ = 1）的概率在条件化人口统计变量时保持不变，则算法满足“奇偶性”。
- en: Does this algorithm satisfy parity?
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: 这个算法是否满足“奇偶性”？
- en: $$ \begin{align} P(G=1|D=1) &= \frac{P(G = 1, D = 1)}{P(D=1)} && \text{Cond.
    Prob.}\\ &= \frac{P(G = 1, D = 1, T= 0) + P(G=1, D = 1, T=1)}{P(D=1)} && \text{Prob
    or}\\ &= \frac{0.01 + 0.08}{0.12} = 0.75 && \text{From joint} \end{align} $$ $$
    \begin{align} P(G=1|D=0) &= \frac{P(G = 1, D = 0)}{P(D=0)} && \text{Cond. Prob.}\\
    &= \frac{P(G = 1, D = 0, T= 0) + P(G=1, D = 0, T=1)}{P(D=0)} && \text{Prob or}\\
    &= \frac{0.32 + 0.28}{0.88} \approx 0.68 && \text{From joint} \end{align} $$
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: $$ \begin{align} P(G=1|D=1) &= \frac{P(G = 1, D = 1)}{P(D=1)} && \text{条件概率}\\
    &= \frac{P(G = 1, D = 1, T= 0) + P(G=1, D = 1, T=1)}{P(D=1)} && \text{概率或}\\ &=
    \frac{0.01 + 0.08}{0.12} = 0.75 && \text{从联合概率得出} \end{align} $$ $$ \begin{align}
    P(G=1|D=0) &= \frac{P(G = 1, D = 0)}{P(D=0)} && \text{条件概率}\\ &= \frac{P(G = 1,
    D = 0, T= 0) + P(G=1, D = 0, T=1)}{P(D=0)} && \text{概率或}\\ &= \frac{0.32 + 0.28}{0.88}
    \approx 0.68 && \text{从联合概率得出} \end{align} $$
- en: No. Since $P(G=1|D=1) \neq P(G=1|D=0)$ this algorithm does not satisfy parity.
    It is more likely to guess 1 when the demographic indicator is 1.
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: 不满足。由于 $P(G=1|D=1) \neq P(G=1|D=0)$，此算法不满足奇偶性。当人口统计指标为1时，更可能猜测为1。
- en: '**Fairness definition #2: Calibration**'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: '**公平性定义 #2：校准**'
- en: An algorithm satisfies “calibration” if the probability that the algorithm is
    correct ($G=T$) is the same regardless of demographics.
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: 如果算法正确（$G=T$）的概率在不受人口统计因素的影响下保持不变，则算法满足“校准”。
- en: Does this algorithm satisfy calibration?
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: 这个算法是否满足校准？
- en: 'The algorithm satisfies calibration if $P(G = T | D = 0) = P(G = T | D = 1)$
    $$ \begin{align} P(G = T | D = 0) &= P(G = 1, T = 1 | D = 0) + P(G = 0, T = 0
    | D = 0)\\ &= \frac{0.28 + 0.21}{0.88} \approx 0.56 \\ P(G = T | D = 1) &= P(G
    = 1, T = 1 | D = 1) + P(G = 0, T = 0 | D = 1)\\ &= \frac{0.08 + 0.01}{0.12} =
    0.75 \end{align} $$ No: $P(G = T | D = 0) \neq P(G = T | D = 1)$'
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: 当 $P(G = T | D = 0) = P(G = T | D = 1)$ 时，算法满足校准。$$ \begin{align} P(G = T |
    D = 0) &= P(G = 1, T = 1 | D = 0) + P(G = 0, T = 0 | D = 0)\\ &= \frac{0.28 +
    0.21}{0.88} \approx 0.56 \\ P(G = T | D = 1) &= P(G = 1, T = 1 | D = 1) + P(G
    = 0, T = 0 | D = 1)\\ &= \frac{0.08 + 0.01}{0.12} = 0.75 \end{align} $$ 不满足：$P(G
    = T | D = 0) \neq P(G = T | D = 1)$
- en: '**Fairness definition #3: Equality of Odds**'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: '**公平性定义 #3：机会均等**'
- en: An algorithm satisfies "equality of odds" if the probability that the algorithm
    *predicts a positive outcome* ($G=1$) is the same regardless of demographics *given*
    that the outcome will occur ($T=1$).
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 如果算法预测正结果（$G=1$）的概率在给定结果发生（$T=1$）的情况下不受人口统计因素的影响，则算法满足“机会均等”。
- en: Does this algorithm satisfy equality of odds?
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: 这个算法是否满足“机会均等”？
- en: 'The algorithm satisfies equality of odds if $P(G = 1 | D = 0, T = 1) = P(G
    = 1 | D = 1, T = 1)$ $$ \begin{align*} P(G = 1 | D = 1, T = 1) &= \frac{P(G =
    1 , D = 1, T = 1)}{P(D = 1, T = 1)}\\ &= \frac{0.08}{0.08 + 0.02} = 0.8 \\ P(G
    = 1 | D = 0, T = 1) &= \frac{P(G = 1 , D = 0, T = 1)}{P(D = 0, T = 1)}\\ &= \frac{0.28}{0.28
    + 0.07} = 0.8 \end{align*} $$ Yes: $P(G = 1 | D = 0, T = 1) = P(G = 1 | D = 1,
    T = 1)$'
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: 当 $P(G = 1 | D = 0, T = 1) = P(G = 1 | D = 1, T = 1)$ 时，算法满足“机会均等”。$$ \begin{align*}
    P(G = 1 | D = 1, T = 1) &= \frac{P(G = 1 , D = 1, T = 1)}{P(D = 1, T = 1)}\\ &=
    \frac{0.08}{0.08 + 0.02} = 0.8 \\ P(G = 1 | D = 0, T = 1) &= \frac{P(G = 1 , D
    = 0, T = 1)}{P(D = 0, T = 1)}\\ &= \frac{0.28}{0.28 + 0.07} = 0.8 \end{align*}
    $$ 满足：$P(G = 1 | D = 0, T = 1) = P(G = 1 | D = 1, T = 1)$
- en: Which of these definitions seems right to you? It turns out, it can actually
    be proven that these three cannot be jointly optimized, and this is called the
    [Impossibility Theorem of Machine Fairness](https://arxiv.org/pdf/2007.06024.pdf).
    In other words, any AI system we build will necessarily violate some notion of
    fairness. For a deeper treatment of the subject, here is a useful summary of the
    latest research [Pessach et al. Algorithmic Fairness](https://arxiv.org/pdf/2001.09784.pdf).
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 哪个定义看起来更正确？实际上，可以证明这三个定义不能同时优化，这被称为[机器公平性的不可能定理](https://arxiv.org/pdf/2007.06024.pdf)。换句话说，我们构建的任何AI系统都将不可避免地违反某些公平性概念。关于这个主题的更深入探讨，这里有一份关于最新研究的有用总结[Pessach等人算法公平性](https://arxiv.org/pdf/2001.09784.pdf)。
- en: Gender Shades
  id: totrans-37
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 性别阴影
- en: 'In 2018, Joy Buolamwini and Timnit Gebru had a breakthrough result called "gender
    shades" published in the first conference on Fairness, Accountability and Transparency
    in ML [1]. They showed that facial recognition algorithms, which had been deployed
    to be used by Facebook, IBM and Microsoft, were substantially better at making
    predicitons (in this case classifying gender) when looking at lighter skinned
    men than darker skinned women. Their work exposed several shortcomings in production
    AI: biased datasets, optimizing for average accuracy (which means that the majority
    demographic gets most weight) lack of awareness of intersectionality, and more.
    Let''s take a look at some of their results.'
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: 在2018年，Joy Buolamwini和Timnit Gebru在首届机器学习公平性、责任和透明度会议上发表了一项突破性成果，称为“性别阴影” [1]。他们展示了Facebook、IBM和Microsoft部署的面部识别算法，在观察浅色皮肤男性时比观察深色皮肤女性时在做出预测（在这种情况下是分类性别）方面要好得多。他们的工作揭示了生产级AI的几个不足：有偏见的训练数据集、优化平均准确性（这意味着大多数人口统计数据得到最多的权重）、缺乏对交叉性的认识，等等。让我们看看他们的部分结果。
- en: '![](../Images/cdc7b9f7102e456a6525b31ece93cb9d.png)'
  id: totrans-39
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/cdc7b9f7102e456a6525b31ece93cb9d.png)'
- en: '*Figure by Joy Buolamwini and Timnit Gebru. Facial recognition algorithms perform
    very differently depending on who they are looking at.* [1]'
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: '*图由Joy Buolamwini和Timnit Gebru提供。面部识别算法在观察不同对象时表现差异很大。[1]*'
- en: 'Timnit and Joy looked at three classifiers trained to predict gender, and computed
    several statistics. Let''s take a look at one statistic, accuracy, for one of
    the facial recognition classifiers, IBMs:'
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: Timnit和Joy研究了三个训练以预测性别的分类器，并计算了几个统计数据。让我们看看其中一个统计数据，即面部识别分类器IBM的准确率：
- en: '|  | Women | Men | Darker | Lighter |'
  id: totrans-42
  prefs: []
  type: TYPE_TB
  zh: '|  | 女性 | 男性 | 深色 | 浅色 |'
- en: '| --- | --- | --- | --- | --- |'
  id: totrans-43
  prefs: []
  type: TYPE_TB
  zh: '| --- | --- | --- | --- | --- |'
- en: '| Accuracy | 79.7 | 94.4 | 77.6 | 96.8 |'
  id: totrans-44
  prefs: []
  type: TYPE_TB
  zh: '| 准确率 | 79.7 | 94.4 | 77.6 | 96.8 |'
- en: 'Using the language of fairness, accuracy measures $\p(G=T)$. The cell in the
    table above under "Women" says the accuracy when looking at photos of women $\p(G=T|D
    = \text{Women})$. It is easy to show that these production level systems are terribly
    "uncalibrated": $$\p(G=T|D = \text{Woman}) \neq \p(G=T|D = \text{Man})$$ $$\p(G=T|D
    = \text{Lighter}) \neq \p(G=T|D = \text{Darker})$$'
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: 使用公平性的语言，准确性度量 $\p(G=T)$。上表中“女性”所在的单元格表示在查看女性照片时的准确性 $\p(G=T|D = \text{女性})$。很容易证明这些生产级系统在“校准”方面非常糟糕：$$\p(G=T|D
    = \text{女性}) \neq \p(G=T|D = \text{男性})$$ $$\p(G=T|D = \text{浅色}) \neq \p(G=T|D
    = \text{深色})$$
- en: 'Why should we care about calibration and not the other definitions of fairness?
    In this case the classifier was making a prediction of gender where a positive
    prediction (say predicting women) doesn''t have a directly associated reward as
    in our above example, where we were predicting if someone should receive a loan.
    As such the most salient idea is: is the algorithm just as accurate for different
    genders (calibration)?'
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: 我们为什么应该关注校准而不是其他公平性的定义？在这种情况下，分类器正在预测性别，其中正预测（例如预测女性）没有直接相关的奖励，就像我们上面的例子中预测某人是否应该获得贷款一样。因此，最显著的想法是：算法对不同性别的准确性是否相同（校准）？
- en: The lack of calibration between men/women and lighter/darker skinned photos
    is an issue. What Joy and Timnit showed next was that the problem becomes even
    worse when you look at intersectional demographics.
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: 男性/女性和浅色/深色皮肤照片之间的校准不足是一个问题。接下来，Joy和Timnit展示了当查看交叉人口统计特征时，问题变得更加严重。
- en: '|  | Darker Men | Darker Women | Lighter Men | Lighter Women |'
  id: totrans-48
  prefs: []
  type: TYPE_TB
  zh: '|  | 深色男性 | 深色女性 | 浅色男性 | 浅色女性 |'
- en: '| --- | --- | --- | --- | --- |'
  id: totrans-49
  prefs: []
  type: TYPE_TB
  zh: '| --- | --- | --- | --- | --- |'
- en: '| Accuracy | 88.0 | 65.3 | 99.7 | 92.9 |'
  id: totrans-50
  prefs: []
  type: TYPE_TB
  zh: '| 准确率 | 88.0 | 65.3 | 99.7 | 92.9 |'
- en: If the algorithms were "fair" according to the calibration you would expect
    the accuracy to be the same regardless of demographics. Instead there is almost
    a 34.2 percentage point difference! $\p(G=T|D = \text{Darker Woman})$ = 65.3 compared
    to $\p(G=T|D = \text{Ligher Man}) = 99.7$
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
