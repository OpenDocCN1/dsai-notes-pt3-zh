- en: Chapter 39 Git and GitHub
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 第 39 章 Git 和 GitHub
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook/git.html](https://rafalab.dfci.harvard.edu/dsbook/git.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook/git.html](https://rafalab.dfci.harvard.edu/dsbook/git.html)
- en: 'Here we provide some details on Git and GitHub. However, we are only scratching
    the surface. To learn more about this topic, we highly recommend the following
    resources:'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 在这里，我们提供有关 Git 和 GitHub 的详细信息。然而，我们只是触及了表面。要了解更多关于这个主题的信息，我们强烈推荐以下资源：
- en: 'Codeacademy: [https://www.codecademy.com/learn/learn-git](https://www.codecademy.com/learn/learn-git)'
  id: totrans-3
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: Codecademy：[https://www.codecademy.com/learn/learn-git](https://www.codecademy.com/learn/learn-git)
- en: 'GitHub Guides: [https://guides.github.com/activities/hello-world/](https://guides.github.com/activities/hello-world/)'
  id: totrans-4
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: GitHub 指南：[https://guides.github.com/activities/hello-world/](https://guides.github.com/activities/hello-world/)
- en: 'Try Git tutorial: [https://try.github.io/levels/1/challenges/1](https://try.github.io/levels/1/challenges/1)'
  id: totrans-5
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 尝试 Git 教程：[https://try.github.io/levels/1/challenges/1](https://try.github.io/levels/1/challenges/1)
- en: 'Happy Git and GitHub for the useR: [http://happygitwithr.com/](http://happygitwithr.com/)'
  id: totrans-6
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 享受 Git 和 GitHub 的 useR：[http://happygitwithr.com/](http://happygitwithr.com/)
- en: 39.1 Why use Git and GitHub?
  id: totrans-7
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 39.1 为什么使用 Git 和 GitHub？
- en: There are three main reasons to use Git and GitHub.
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 使用 Git 和 GitHub 的三个主要原因。
- en: 'Sharing: Even if we do not take advantage of the advanced and powerful version
    control functionality, we can still use Git and GitHub to share our code.'
  id: totrans-9
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 分享：即使我们不利用高级强大的版本控制功能，我们仍然可以使用 Git 和 GitHub 来分享我们的代码。
- en: 'Collaborating: Once you set up a central repo, you can have multiple people
    make changes to code and keep versions synched. GitHub provides a free service
    for centralized repos. GitHub also has a special utility, called a *pull request*,
    that can be used by anybody to suggest changes to your code. You can easily either
    accept or deny the request.'
  id: totrans-10
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 协作：一旦您设置了中央仓库，多人可以对代码进行更改并保持版本同步。GitHub 为中央仓库提供免费服务。GitHub 还有一个特殊工具，称为 *拉取请求*，任何人都可以用它来建议对您代码的更改。您可以轻松地接受或拒绝请求。
- en: 'Version control: The version control capabilities of Git permit us to keep
    track of changes we make to our code. We can also revert back to previous versions
    of files. Git also permits us to create *branches* in which we can test out ideas,
    then decide if we *merge* the new branch with the original.'
  id: totrans-11
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 版本控制：Git 的版本控制功能使我们能够跟踪我们对代码所做的更改。我们还可以回滚到文件的先前版本。Git 还允许我们创建 *分支*，在其中我们可以测试想法，然后决定是否
    *合并* 新分支与原始分支。
- en: Here we focus on the sharing aspects of Git and GitHub and refer the reader
    to the links above to learn more about this powerful tool.
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 在这里，我们关注 Git 和 GitHub 的分享方面，并将读者指引到上面的链接以了解更多关于这个强大工具的信息。
- en: 39.2 GitHub accounts
  id: totrans-13
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 39.2 GitHub 账户
- en: After installing git[^(120)](#fn120), the first step is to get a GitHub account.
    Basic GitHub accounts are free. To do this, go to [GitHub](github.com) where you
    will see a box in which you can sign up.
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 安装 git[^(120)](#fn120) 后，第一步是获取一个 GitHub 账户。基本的 GitHub 账户是免费的。为此，请访问 [GitHub](github.com)，在那里您将看到一个可以注册的框。
- en: You want to pick a name carefully. It should be short, easy to remember and
    to spell, somehow related to your name, and professional. This last one is important
    since you might be sending potential employers a link to your GitHub account.
    In the example below, I am sacrificing on the ease of spelling to incorporate
    my name. Your initials and last name are usually a good choice. If you have a
    very common name, then this may have to be taken into account. A simple solution
    would be to add numbers or spell out part of your name.
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 您需要仔细选择一个名字。它应该是简短、易于记忆和拼写的，并且与您的名字有些关联，并且专业。这一点很重要，因为您可能会向潜在雇主发送您 GitHub 账户的链接。在下面的例子中，我牺牲了拼写的便利性，以包含我的名字。您的首字母和姓氏通常是不错的选择。如果您有一个非常常见的名字，那么这可能需要考虑。一个简单的解决方案是添加数字或拼写出您名字的一部分。
- en: The account I use for my research, *rafalab*, is the same one I use for my webpage[^(121)](#fn121)
    and Twitter[^(122)](#fn122), which makes it easy to remember for those that follow
    my work.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 我用于研究账户的 *rafalab* 与我用于网页[^(121)](#fn121) 和 Twitter[^(122)](#fn122) 的账户是同一个，这使得那些关注我的工作的人容易记住。
- en: Once you have a GitHub account, you are ready to connect Git and RStudio to
    this account.
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 一旦您有了 GitHub 账户，您就可以将 Git 和 RStudio 连接到这个账户。
- en: 'A first step is to let Git know who we are. This will make it easier to connect
    with GitHub. We start by opening a terminal window in RStudio (remember you can
    get one through *Tools* in the menu bar). Now we use the `git config` command
    to tell Git who we are. We will type the following two commands in our terminal
    window:'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 第一步是让 Git 知道我们的身份。这将有助于我们与 GitHub 连接。我们首先在 RStudio 中打开一个终端窗口（记住您可以通过菜单栏中的 *工具*
    菜单获取一个终端）。现在我们使用 `git config` 命令来告诉 Git 我们是谁。我们将在终端窗口中输入以下两个命令：
- en: '[PRE0]'
  id: totrans-19
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: 'You need to use the email account that you used to open your GitHub account.
    The RStudio session should look something like this:'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 您需要使用您用来开通 GitHub 账户的电子邮件账户。RStudio 会话应该看起来像这样：
- en: '![](../Images/5460d5dfa61abd3161b2dc9778974038.png)'
  id: totrans-21
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/5460d5dfa61abd3161b2dc9778974038.png)'
- en: You start by going to the *Global Options*, selecting *Git/SVN*, and then you
    enter a path for the Git executable we just installed.
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 您首先前往 *全局选项*，选择 *Git/SVN*，然后输入我们刚刚安装的 Git 可执行文件的路径。
- en: '![](../Images/53273ce65b44f5703a08617a6f12d84b.png)'
  id: totrans-23
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/53273ce65b44f5703a08617a6f12d84b.png)'
- en: 'On the Windows default installation, this will be *C:/Program File/Git/bin/git.exe*,
    but you should find it by browsing your system as this can change from system
    to system. Now to avoid entering our GitHub password every time we try to access
    our repository, we will create what is called an *SSH RSA Key*. RStudio can do
    this for us automatically if we click on the *Create RSA Key* button:'
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: 在 Windows 默认安装中，这将是 *C:/Program File/Git/bin/git.exe*，但您应该通过浏览系统来找到它，因为这可能会因系统而异。现在为了避免每次尝试访问我们的仓库时都输入
    GitHub 密码，我们将创建一个所谓的 *SSH RSA 密钥*。如果点击 *创建 RSA 密钥* 按钮，RStudio 可以为我们自动完成这项操作：
- en: '![](../Images/4738ba7983c6297ceb43dddba171f160.png)![](../Images/b1e13988b43046b2a82c9e78c597237e.png)'
  id: totrans-25
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/4738ba7983c6297ceb43dddba171f160.png)![图片](../Images/b1e13988b43046b2a82c9e78c597237e.png)'
- en: 'You can follow the default instructions as shown below:'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 您可以遵循以下默认说明：
- en: '![](../Images/05e3747a1f8e7f65c5c41576205ebe3f.png)![](../Images/54f5dafb1c4687f389d60ce4f0f54631.png)'
  id: totrans-27
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/05e3747a1f8e7f65c5c41576205ebe3f.png)![图片](../Images/54f5dafb1c4687f389d60ce4f0f54631.png)'
- en: Git, RStudio and GitHub should now be able to connect and we are ready to create
    a first GitHub code repository.
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: Git、RStudio 和 GitHub 现在应该能够连接，我们就可以创建第一个 GitHub 代码仓库了。
- en: 39.3 GitHub repositories
  id: totrans-29
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 39.3 GitHub 仓库
- en: 'You are now ready to create a GitHub repository (repo). The general idea is
    that you will have at least two copies of your code: one on your computer and
    one on GitHub. If you add collaborators to this project, then each will have a
    copy on their computer. The GitHub copy is usually considered the *main* (previously
    called *master*) copy that each collaborator syncs to. Git will help you keep
    all the different copies synced.'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: 您现在可以创建一个 GitHub 仓库（repo）了。一般而言，您将至少拥有您代码的两个副本：一个在您的电脑上，另一个在 GitHub 上。如果您将协作者添加到这个项目中，那么每个人都会在自己的电脑上有一个副本。GitHub
    上的副本通常被认为是*主副本*（之前称为*master*），每个协作者都会将其同步到这个副本。Git 将帮助您保持所有不同副本的同步。
- en: As mentioned, one of the advantages of keeping code on a GitHub repository is
    that you can easily share it with potential employers interested in seeing examples
    of your work. Because many data science companies use version control systems,
    like Git, to collaborate on projects, they might also be impressed that you already
    know at least the basics.
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: 如前所述，将代码保存在 GitHub 仓库中的一个优点是您可以轻松地与对查看您工作示例感兴趣的可能雇主分享。因为许多数据科学公司使用版本控制系统，如 Git，来协作项目，他们可能会对您已经至少掌握了基础知识的技能印象深刻。
- en: The first step in creating a repo for your code is to initialize on GitHub.
    Because you already created an account, you will have a page on GitHub with the
    URL `http://github.com/username`.
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 为您的代码创建仓库的第一步是在 GitHub 上初始化。因为您已经创建了一个账户，您将在 GitHub 上有一个带有 URL `http://github.com/username`
    的页面。
- en: To create a repo, first log in to your account by clicking the *Sign In* button
    on [https://github.com](http://github.com). You might already be signed in, in
    which case the *Sign In* button will not show up. If signing in, you will have
    to enter your username and password. We recommend you set up your browser to remember
    this to avoid typing it in each time.
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 要创建一个仓库，首先通过点击 [https://github.com](http://github.com) 上的 *登录* 按钮登录您的账户。您可能已经登录，在这种情况下，*登录*
    按钮将不会显示。如果需要登录，您将需要输入您的用户名和密码。我们建议您设置浏览器记住这些信息，以避免每次都输入。
- en: 'Once on your account, you can click on *Repositories* and then click on *New*
    to create a new repo:'
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: 登录到您的账户后，您可以点击 *仓库*，然后点击 *新建* 来创建一个新的仓库：
- en: '![](../Images/130cf83b173501859c0edd44b68b884d.png)![](../Images/d27f5cea3c5722b85190d715ae87e55b.png)'
  id: totrans-35
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/130cf83b173501859c0edd44b68b884d.png)![](../Images/d27f5cea3c5722b85190d715ae87e55b.png)'
- en: You will then want to choose a good descriptive name for the project. In the
    future, you might have dozens of repos so keep that in mind when choosing a name.
    Here we will use `homework-0`. We recommend you make the repo public. If you want
    to keep it private, you will have to pay a monthly charge.
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 你将需要为项目选择一个良好的描述性名称。将来，你可能有数十个仓库，所以在选择名称时要记住这一点。这里我们将使用 `homework-0`。我们建议你使仓库公开。如果你想保持私有，你将不得不支付每月的费用。
- en: '![](../Images/796d959ebeddb11c9d5de490407f2f62.png)'
  id: totrans-37
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/796d959ebeddb11c9d5de490407f2f62.png)'
- en: You now have your first repo on GitHub. The next step will be to *clone it*
    on your computer and start editing and syncing using Git.
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: 现在，你在 GitHub 上有了你的第一个仓库。下一步将是将其 *克隆* 到你的电脑上，并开始使用 Git 进行编辑和同步。
- en: To do this, it is convenient to copy the link provided by GitHub specifically
    to connect to this repo, using Git as shown below. We will later need to copy
    and paste this so make sure to remember this step.
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: 为了这样做，复制 GitHub 提供的链接以连接到这个仓库，使用 Git 如下所示是很方便的。我们稍后需要复制并粘贴这个链接，所以请确保记住这个步骤。
- en: '![](../Images/dc983cb8298f2c460aecef3be0b9c6dd.png)'
  id: totrans-40
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/dc983cb8298f2c460aecef3be0b9c6dd.png)'
- en: 39.4 Overview of Git
  id: totrans-41
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 39.4 Git 概述
- en: 'The main actions in Git are to:'
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: Git 中的主要操作包括：
- en: '**pull** changes from the remote repo, in this case the GitHub repo'
  id: totrans-43
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '**从**远程仓库 *拉取* 更改，在这种情况下是 GitHub 仓库'
- en: '**add** files, or as we say in the Git lingo *stage* files'
  id: totrans-44
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '**添加**文件，或者我们用 Git 行话来说，是 *暂存* 文件'
- en: '**commit** changes to the local repo'
  id: totrans-45
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '**提交**更改到本地仓库'
- en: '**push** changes to the *remote* repo, in our case the GitHub repo'
  id: totrans-46
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '**推送**更改到 *远程* 仓库，在我们的例子中是 GitHub 仓库'
- en: 'To effectively permit version control and collaboration in Git, files move
    across four different areas:'
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: 为了在 Git 中有效地进行版本控制和协作，文件会在四个不同的区域之间移动：
- en: '![](../Images/077f534bc9af26130e42d211cdc08161.png)'
  id: totrans-48
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/077f534bc9af26130e42d211cdc08161.png)'
- en: 'But how does it all get started? There are two ways: we can clone an existing
    repo or initialize one. We will explore cloning first.'
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: 但这一切是如何开始的呢？有两种方式：我们可以克隆一个现有的仓库或者初始化一个。我们将首先探讨克隆。
- en: 39.4.1 Clone
  id: totrans-50
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 39.4.1 克隆
- en: 'We are going to *clone* an existing *Upstream Repository*. You can see it on
    GitHub here: [https://github.com/rairizarry/murders](https://github.com/rairizarry/murders).
    By visiting this page, you can see multiple files and directories. This is the
    Upstream Repository. By clicking the green clone button, we can copy the repo’s
    URL `https://github.com/rairizarry/murders.git`.'
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将 *克隆* 一个现有的 *上游仓库*。你可以在 GitHub 上看到它：[https://github.com/rairizarry/murders](https://github.com/rairizarry/murders)。通过访问这个页面，你可以看到多个文件和目录。这是上游仓库。通过点击绿色的克隆按钮，我们可以复制仓库的
    URL `https://github.com/rairizarry/murders.git`。
- en: 'But what does *clone* mean? Rather than download all these files to your computer,
    we are going to actually copy the entire Git structure, which means we will add
    the files and directories to each of the three local stages: Working Directory,
    Staging Area, and Local Repository. When you clone, all three are exactly the
    same to start.'
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: 但 *克隆* 的意思是什么？我们不会将所有这些文件下载到你的电脑上，而是实际上复制整个 Git 结构，这意味着我们将文件和目录添加到每个三个本地阶段：工作目录、暂存区域和本地仓库。当你克隆时，这三个阶段最初都是完全相同的。
- en: 'You can quickly see an example of this by doing the following. Open a terminal
    and type:'
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: 你可以通过以下步骤快速查看一个示例。打开终端并输入：
- en: '[PRE1]'
  id: totrans-54
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: You now have cloned a GitHub repo and have a working Git directory, with all
    the files, on your system.
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: 现在，你已经克隆了一个 GitHub 仓库，并且在你的系统上有一个包含所有文件的 Git 工作目录。
- en: '[PRE2]'
  id: totrans-56
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: '![](../Images/92feb29057d8de604156ef59fc7546ea.png)'
  id: totrans-57
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/92feb29057d8de604156ef59fc7546ea.png)'
- en: 'The *Working Directory* is the same as your Unix working directory. When you
    edit files using an editor such as RStudio, you change the files in this area
    and only in this area. Git can tell you how these files relate to the versions
    of the files in other areas with the command `git status`:'
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: '*工作目录* 与你的 Unix 工作目录相同。当你使用像 RStudio 这样的编辑器编辑文件时，你只在这个区域更改文件，并且只在这个区域更改。Git
    可以通过 `git status` 命令告诉你这些文件与其他区域文件版本之间的关系：'
- en: '![](../Images/da6f6e80bc38ee8cfa88132add4689f7.png)'
  id: totrans-59
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/da6f6e80bc38ee8cfa88132add4689f7.png)'
- en: 'If you check the status now, you will see that nothing has changed and you
    get the following message:'
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你现在检查状态，你会看到没有任何变化，并且你会得到以下消息：
- en: '[PRE3]'
  id: totrans-61
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: 'Now we are going to make changes to these files. Eventually, we want these
    new versions of the files to be tracked and synched with the upstream repo. But
    we don’t want to keep track of every little change: we don’t want to sync until
    we are sure these versions are final enough to share. For this reason, edits in
    the staging area are not kept by the version control system.'
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们将对这些文件进行更改。最终，我们希望这些新版本的文件被跟踪并与上游仓库同步。但我们不想跟踪每一个小变化：我们不想同步，直到我们确信这些版本足够最终可以分享。因此，暂存区的编辑不会被版本控制系统保留。
- en: 'To demonstrate, we add a file to the staging area with the `git add` command.
    Below we create a file using the Unix `echo` command just as an example (in reality
    you would use RStudio):'
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: 为了演示，我们使用`git add`命令将文件添加到暂存区。以下我们使用 Unix 的`echo`命令创建一个文件，仅作为一个例子（实际上你会使用 RStudio）：
- en: '[PRE4]'
  id: totrans-64
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: 'We are also adding a temporary file that we do not want to track at all:'
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
  zh: 我们还添加了一个我们根本不想跟踪的临时文件：
- en: '[PRE5]'
  id: totrans-66
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: 'Now we can stage the file we eventually want to add to our repository:'
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们可以暂存我们最终想要添加到我们的仓库的文件：
- en: '[PRE6]'
  id: totrans-68
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: 'Notice what the status says now:'
  id: totrans-69
  prefs: []
  type: TYPE_NORMAL
  zh: 注意现在的状态说明：
- en: '[PRE7]'
  id: totrans-70
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: '![](../Images/89525337219ddcb48852c1fb8ef54923.png)'
  id: totrans-71
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/89525337219ddcb48852c1fb8ef54923.png)'
- en: 'Because `new-file.txt` is staged, the current version of the file will get
    added to the local repository next time we commit, which we do as follows:'
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: 因为`new-file.txt`已经被暂存，所以下次提交时，当前版本的文件将被添加到本地仓库中，我们按照以下步骤操作：
- en: '[PRE8]'
  id: totrans-73
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: We have now changed the local repo, which you can confirm using
  id: totrans-74
  prefs: []
  type: TYPE_NORMAL
  zh: 我们现在已经更改了本地仓库，你可以使用以下命令来确认：
- en: '[PRE9]'
  id: totrans-75
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: '![](../Images/ff91b8481496506339330b0c9192cbce.png)'
  id: totrans-76
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/ff91b8481496506339330b0c9192cbce.png)'
- en: 'However, if we edit that file again, it changes only in the working directory.
    To add to the local repo, we need to stage it and commit the changes that are
    added to the local repo:'
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，如果我们再次编辑该文件，它只在工作目录中发生变化。为了将其添加到本地仓库，我们需要将其暂存并提交添加到本地仓库的更改：
- en: '[PRE10]'
  id: totrans-78
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: 'Note that this step is often unnecessary in our uses of Git. We can skip the
    staging part if we add the file name to the commit command like this:'
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，在我们的 Git 使用中，这一步通常是不必要的。如果我们像这样将文件名添加到提交命令中，我们可以跳过暂存部分：
- en: '[PRE11]'
  id: totrans-80
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: 'We can keep track of all the changes we have made with:'
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以使用以下命令来跟踪我们所做的所有更改：
- en: '[PRE12]'
  id: totrans-82
  prefs: []
  type: TYPE_PRE
  zh: '[PRE12]'
- en: 'To keep everything synced, the final step is to push the changes to the upstream
    repo. This is done with the `git push` command like this:'
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
  zh: 为了保持一切同步，最后一步是将更改推送到上游仓库。这可以通过`git push`命令来完成，如下所示：
- en: '[PRE13]'
  id: totrans-84
  prefs: []
  type: TYPE_PRE
  zh: '[PRE13]'
- en: '![](../Images/45fac83e746fe2917e33288608eb8560.png)'
  id: totrans-85
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/45fac83e746fe2917e33288608eb8560.png)'
- en: However, in this particular example, you will not be able to do this because
    you do not have permission to edit the upstream repo. If this was your repo, you
    could.
  id: totrans-86
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，在这个特定的例子中，你将无法这样做，因为你没有权限编辑上游仓库。如果这是你的仓库，你就可以。
- en: 'If this is a collaborative project, the upstream repo may change and become
    different than our version. To update our local repository to be like the upstream
    repo, we use the command `fetch`:'
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: 如果这是一个协作项目，上游仓库可能会发生变化，与我们版本不同。为了使本地仓库与上游仓库保持一致，我们使用`fetch`命令：
- en: '[PRE14]'
  id: totrans-88
  prefs: []
  type: TYPE_PRE
  zh: '[PRE14]'
- en: '![](../Images/d0236e52199bb10a4895341f8cf2eb9f.png)'
  id: totrans-89
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/d0236e52199bb10a4895341f8cf2eb9f.png)'
- en: 'And then to make these copies to the staging area and working directory, we
    use the command:'
  id: totrans-90
  prefs: []
  type: TYPE_NORMAL
  zh: 然后为了将这些副本添加到暂存区和工作目录，我们使用以下命令：
- en: '[PRE15]'
  id: totrans-91
  prefs: []
  type: TYPE_PRE
  zh: '[PRE15]'
- en: '![](../Images/e012315b74068c7bfda22bdeb3070bc1.png)'
  id: totrans-92
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/e012315b74068c7bfda22bdeb3070bc1.png)'
- en: 'However, we often just want to change both with one command. For this, we use:'
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，我们通常只想用一个命令同时更改这两个文件。为此，我们使用：
- en: '[PRE16]'
  id: totrans-94
  prefs: []
  type: TYPE_PRE
  zh: '[PRE16]'
- en: '![](../Images/d1b230b5fc85c58f899ff98b6f1e56f5.png)'
  id: totrans-95
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/d1b230b5fc85c58f899ff98b6f1e56f5.png)'
- en: We will learn in Section [39.6](git.html#rstudio-git) how RStudio has buttons
    to do all this. The details provided here should help you understand what happens
    in the background.
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将在第 [39.6](git.html#rstudio-git) 节学习 RStudio 如何通过按钮完成所有这些操作。这里提供的信息应该能帮助你理解后台发生了什么。
- en: 39.5 Initializing a Git directory
  id: totrans-97
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 39.5 初始化 Git 目录
- en: 'Now let’s learn the second way we can get started: by initializing a directory
    on our own computer rather than cloning.'
  id: totrans-98
  prefs: []
  type: TYPE_NORMAL
  zh: 现在让我们学习第二种启动方式：通过在我们的电脑上初始化目录而不是克隆。
- en: Suppose we already have a populated local directory and we want to turn this
    directory into a collaborative GitHub repository. The most efficient way of achieving
    this is by *initializing* the local directory.
  id: totrans-99
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们已经有了一个已填充的本地目录，我们想要将这个目录变成一个协作的 GitHub 仓库。最有效的方法是通过*初始化*本地目录。
- en: To demonstrate how to do this we will initialize the gun murders directory we
    created in Section [38.7](unix.html#prep-project). Note that we already created
    a directory with several subdirectories on our computer but we do not yet have
    a Git local repo or GitHub upstream repo.
  id: totrans-100
  prefs: []
  type: TYPE_NORMAL
  zh: 为了演示如何做这件事，我们将初始化我们在第[38.7](unix.html#prep-project)节中创建的`gun murders`目录。请注意，我们已经在我们的电脑上创建了一个包含几个子目录的目录，但我们还没有一个Git本地仓库或GitHub上游仓库。
- en: 'We start by creating a new repo on our GitHub page. We click on the *New* button:'
  id: totrans-101
  prefs: []
  type: TYPE_NORMAL
  zh: 我们首先在我们的GitHub页面上创建一个新的仓库。我们点击*新建*按钮：
- en: '![](../Images/d133539cdb2266cd1e149450ae2b108b.png)![](../Images/9746092b5803d7f03f3e7ab99a7c5b1a.png)'
  id: totrans-102
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/d133539cdb2266cd1e149450ae2b108b.png)![图片](../Images/9746092b5803d7f03f3e7ab99a7c5b1a.png)'
- en: We call it `murders` here to match the name of the directory on our local system.
    But if you are doing this for another project, please choose an appropriate name.
  id: totrans-103
  prefs: []
  type: TYPE_NORMAL
  zh: 我们在这里将其称为`murders`以匹配我们本地系统上的目录名称。但如果你为另一个项目做这件事，请选择一个合适的名称。
- en: '![](../Images/ab83ad437ae6942e77afccdf31125784.png)'
  id: totrans-104
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/ab83ad437ae6942e77afccdf31125784.png)'
- en: 'We then get a series of instructions on how to get started, but we can instead
    use what we have learned. The main thing we need from this page is to copy the
    repo’s URL, in this case: `https://github.com/rairizarry/murders.git`.'
  id: totrans-105
  prefs: []
  type: TYPE_NORMAL
  zh: 然后，我们会得到一系列如何开始的指导，但我们可以使用我们所学到的知识。我们从这个页面需要的主要东西是复制仓库的URL，在这个例子中：`https://github.com/rairizarry/murders.git`。
- en: 'At this moment, we can start a terminal and `cd` into our local projects directory.
    In our example, it would be:'
  id: totrans-106
  prefs: []
  type: TYPE_NORMAL
  zh: 在这个时刻，我们可以打开一个终端并使用`cd`命令进入我们的本地项目目录。在我们的例子中，它会是：
- en: '[PRE17]'
  id: totrans-107
  prefs: []
  type: TYPE_PRE
  zh: '[PRE17]'
- en: 'We then *intialize* the directory. This turns the directory into a Git directory
    and Git starts tracking:'
  id: totrans-108
  prefs: []
  type: TYPE_NORMAL
  zh: 然后，我们*初始化*这个目录。这会将目录变成一个Git目录，Git开始跟踪：
- en: '[PRE18]'
  id: totrans-109
  prefs: []
  type: TYPE_PRE
  zh: '[PRE18]'
- en: All the files are now **only** in our working directory; no files are in our
    local repo or on GitHub.
  id: totrans-110
  prefs: []
  type: TYPE_NORMAL
  zh: 所有的文件现在**只**在我们的工作目录中；没有文件在我们的本地仓库或GitHub上。
- en: 'The next step is to connect the local repo with the GitHub repo. In a previous
    example, we had RStudio do this for us. Now we need to do it ourselves. We can
    by adding any of the files and committing it:'
  id: totrans-111
  prefs: []
  type: TYPE_NORMAL
  zh: 下一步是将本地仓库与GitHub仓库连接起来。在先前的例子中，RStudio为我们做了这件事。现在我们需要自己来做。我们可以通过添加任何文件并提交它来实现：
- en: '[PRE19]'
  id: totrans-112
  prefs: []
  type: TYPE_PRE
  zh: '[PRE19]'
- en: 'We now have a file in our local repo and can connect it to the upstream repo,
    which has url: `https://github.com/rairizarry/murders.git`.'
  id: totrans-113
  prefs: []
  type: TYPE_NORMAL
  zh: '现在我们有一个文件在我们的本地仓库中，并且可以将其连接到具有url: `https://github.com/rairizarry/murders.git`的上游仓库。'
- en: To do this, we use the command `git remote add`.
  id: totrans-114
  prefs: []
  type: TYPE_NORMAL
  zh: 为了做到这一点，我们使用命令`git remote add`。
- en: '[PRE20]'
  id: totrans-115
  prefs: []
  type: TYPE_PRE
  zh: '[PRE20]'
- en: 'We can now use `git push` since there is a connection to an upstream repo:'
  id: totrans-116
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们可以使用`git push`，因为我们已经连接到了一个上游仓库：
- en: '[PRE21]'
  id: totrans-117
  prefs: []
  type: TYPE_PRE
  zh: '[PRE21]'
- en: In Section [40.3](reproducible-projects-with-rstudio-and-r-markdown.html#organizing)
    we continue to work with this example, as we demonstrate how we can use RStudio
    to work with Git and keep a project synced on GitHub.
  id: totrans-118
  prefs: []
  type: TYPE_NORMAL
  zh: 在第[40.3](reproducible-projects-with-rstudio-and-r-markdown.html#organizing)节中，我们继续使用这个例子，因为我们演示了如何使用RStudio与Git一起工作并保持项目在GitHub上同步。
- en: 39.6 Using Git and GitHub in RStudio
  id: totrans-119
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 39.6 在RStudio中使用Git和GitHub
- en: While command line Git is a powerful and flexible tool, it can be somewhat daunting
    when we are getting started. RStudio provides a graphical interface that facilitates
    the use of Git in the context of a data analysis project. We describe how to use
    this RStudio feature to do this here.
  id: totrans-120
  prefs: []
  type: TYPE_NORMAL
  zh: 虽然命令行Git是一个强大且灵活的工具，但当我们刚开始时，它可能会有些令人畏惧。RStudio提供了一个图形界面，它有助于在数据分析项目的背景下使用Git。我们在这里描述如何使用这个RStudio功能来完成这个任务。
- en: 'Now we are ready to start an RStudio project that uses version control and
    stores the code on a GitHub repo. To do this, we start a project but, instead
    of *New Directory*, we will select *Version Control* and then we will select *Git*
    as our version control system:'
  id: totrans-121
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们已经准备好开始一个使用版本控制并存储代码在GitHub仓库上的RStudio项目。为了做到这一点，我们启动一个项目，但不是选择*新目录*，我们将选择*版本控制*，然后我们将选择*Git*作为我们的版本控制系统：
- en: '![](../Images/53c8d76a2532db4fc1908105fc82b836.png)![](../Images/071f9377d9df8952bc05f293d84284b5.png)'
  id: totrans-122
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/53c8d76a2532db4fc1908105fc82b836.png)![图片](../Images/071f9377d9df8952bc05f293d84284b5.png)'
- en: The repository URL is the link you used to clone. In Section [39.3](git.html#github-repos),
    we used `https://github.com/username/homework-0.git` as an example. In the project
    directory name, you need to put the name of the folder that was generated, which
    in our example will be the name of the repo `homework-0`. This will create a folder
    called `homework-0` on your local system. Once you do this, the project is created
    and it is aware of the connection to a GitHub repo. You will see on the top right
    corner the name and type of project as well as a new tab on the upper right pane
    titled *Git*.
  id: totrans-123
  prefs: []
  type: TYPE_NORMAL
  zh: 仓库URL是你用来克隆的链接。在[39.3节](git.html#github-repos)中，我们使用了 `https://github.com/username/homework-0.git`
    作为示例。在项目目录名称中，你需要放入生成的文件夹名称，在我们的示例中，这将是仓库的名称 `homework-0`。这将在你本地系统中创建一个名为 `homework-0`
    的文件夹。一旦你这样做，项目就创建完成了，并且它知道与GitHub仓库的连接。你将在右上角看到项目的名称和类型，以及右上面板中的一个新标签页，标题为 *Git*。
- en: '![](../Images/bbf94571a6140f299ea2a5f386247c4a.png)![](../Images/501d54c32c9d1b18086b480a2fcd0c3d.png)'
  id: totrans-124
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/bbf94571a6140f299ea2a5f386247c4a.png)![图片](../Images/501d54c32c9d1b18086b480a2fcd0c3d.png)'
- en: If you select this tab, it will show you the files on your project with some
    icons that give you information about these files and their relationship to the
    repo. In the example below, we already added a file to the folder, called *code.R*
    which you can see in the editing pane.
  id: totrans-125
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你选择这个标签页，它将显示你项目中的文件，并带有一些图标，这些图标会给你提供关于这些文件及其与仓库之间关系的信息。在下面的示例中，我们已经在文件夹中添加了一个名为
    *code.R* 的文件，你可以在编辑面板中看到它。
- en: '![](../Images/c4fc0ddc806b6b76c863ee49d9c0a554.png)'
  id: totrans-126
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/c4fc0ddc806b6b76c863ee49d9c0a554.png)'
- en: We now need to pay attention to the Git pane. It is important to know that **your
    local files and the GitHub repo will not be synced automatically**. As described
    in Section [39.4](git.html#git-overview), you have to sync using git push when
    you are ready. We show you can do this through RStudio rather than the terminal
    below.
  id: totrans-127
  prefs: []
  type: TYPE_NORMAL
  zh: 我们现在需要关注Git面板。重要的是要知道，**你的本地文件和GitHub仓库不会自动同步**。如[39.4节](git.html#git-overview)中所述，当你准备好时，你必须使用git
    push来同步。我们下面会展示你如何通过RStudio而不是终端来完成这个操作。
- en: Before we start working on a collaborative project, usually the first thing
    we do is *pull* in the changes from the remote repo, in our case the one on GitHub.
    However, for the example shown here, since we are starting with an empty repo
    and we are the only ones making changes, we don’t need to start by pulling.
  id: totrans-128
  prefs: []
  type: TYPE_NORMAL
  zh: 在我们开始一个协作项目之前，通常我们首先要做的是从远程仓库，在我们的例子中是GitHub上的仓库，*拉取* 变更。然而，对于这里显示的示例，由于我们从一个空的仓库开始，并且我们是唯一进行更改的人，所以我们不需要从拉取开始。
- en: In RStudio, the status of the file as it relates to the remote and local repos
    are represented in the status symbols with colors. A yellow square means that
    Git knows nothing about this file. To sync with the GitHub repo, we need to *add*
    the file, then *commit* the change to our local Git repo, then *push* the change
    to the GitHub repo. Right now, the file is just on our computer. To add the file
    using RStudio, we click the *Stage* box. You will see that the status icon now
    changes to a green A.
  id: totrans-129
  prefs: []
  type: TYPE_NORMAL
  zh: 在RStudio中，文件与远程和本地仓库的状态通过带有颜色的状态符号表示。一个黄色的方块表示Git对这个文件一无所知。为了与GitHub仓库同步，我们需要
    *添加* 文件，然后 *提交* 改变到我们的本地Git仓库，然后 *推送* 改变到GitHub仓库。目前，这个文件只是在我们的电脑上。要使用RStudio添加文件，我们点击
    *暂存* 框。你会看到状态图标现在变成了绿色的A。
- en: '![](../Images/ba9b9ab67638a3a7eb3f82674b3471b4.png)'
  id: totrans-130
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/ba9b9ab67638a3a7eb3f82674b3471b4.png)'
- en: 'Note: we are only adding the *code.R* file. We don’t necessarily need to add
    all the files in our local repo to the GitHub repo, only the ones we want to keep
    track of or the ones we want to share. If our work is producing files of a certain
    type that we do not want to keep track of, we can add the suffix that defines
    these files to the .gitignore file. More details on using .gitignore are included
    here: [https://git-scm.com/docs/gitignore](https://git-scm.com/docs/gitignore).
    These files will stop appearing in your RStudio Git pane. For the example shown
    here, we will only be adding *code.R*. But, in general, for an RStudio project,
    we recommend adding both the .gitignore and .Rproj files.'
  id: totrans-131
  prefs: []
  type: TYPE_NORMAL
  zh: 注意：我们只添加 *code.R* 文件。我们不一定需要将本地仓库中的所有文件添加到GitHub仓库，只需要我们想要跟踪或想要分享的文件。如果我们的工作产生了我们不希望跟踪的特定类型的文件，我们可以将这些文件的定义后缀添加到
    .gitignore 文件中。关于使用 .gitignore 的更多详细信息请参考这里：[https://git-scm.com/docs/gitignore](https://git-scm.com/docs/gitignore)。这些文件将不会出现在你的RStudio
    Git面板中。对于这里显示的示例，我们只会添加 *code.R*。但是，一般来说，对于RStudio项目，我们建议添加 .gitignore 和 .Rproj
    文件。
- en: Now we are ready to commit the file to our local repo. In RStudio, we can use
    the *Commit* button. This will open a new dialog window. With Git, whenever we
    commit a change, we are required to enter a comment describing the changes being
    *committed*.
  id: totrans-132
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们已经准备好将文件提交到我们的本地仓库。在RStudio中，我们可以使用*提交*按钮。这将打开一个新的对话框窗口。使用Git时，每次提交更改，我们都需要输入一个注释来描述正在*提交*的更改。
- en: '![](../Images/fc87959116f0301bf92fa9b478fef8dc.png)'
  id: totrans-133
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/fc87959116f0301bf92fa9b478fef8dc.png)'
- en: In this case, we will simply describe that we are adding a new script. In this
    dialog box, RStudio also gives you a summary of what you are changing to the GitHub
    repo. In this case, because it is a new file, the entire file is highlighted as
    green, which highlights the changes.
  id: totrans-134
  prefs: []
  type: TYPE_NORMAL
  zh: 在这种情况下，我们只需简单描述我们在添加一个新的脚本。在这个对话框中，RStudio还会给你一个总结，说明你正在对GitHub仓库进行哪些更改。在这种情况下，因为这是一个新文件，整个文件都被高亮显示为绿色，这突出了更改。
- en: 'Once we hit the commit button, we should see a message from Git with a summary
    of the changes that were committed. Now we are ready to *push* these changes to
    the GitHub repo. We can do this by clicking on the *Push* button on the top right
    corner:'
  id: totrans-135
  prefs: []
  type: TYPE_NORMAL
  zh: 一旦我们点击提交按钮，我们应该看到Git发来的一个包含已提交更改摘要的消息。现在我们准备好*推送*这些更改到GitHub仓库。我们可以通过点击右上角的*推送*按钮来完成此操作：
- en: '![](../Images/45c9f320acc454ac08d18a9847dec2e0.png)![](../Images/7eb6a3c9a168092d692cda5e34d1f008.png)'
  id: totrans-136
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/45c9f320acc454ac08d18a9847dec2e0.png)![](../Images/7eb6a3c9a168092d692cda5e34d1f008.png)'
- en: We now see a message from Git letting us know that the push has succeeded. In
    the pop-up window we no longer see the `code.R` file. This is because no new changes
    have been performed since we last pushed. We can exit this pop-up window now and
    continue working on our code.
  id: totrans-137
  prefs: []
  type: TYPE_NORMAL
  zh: 我们现在看到Git发来的消息，告知我们推送成功。在弹出窗口中，我们不再看到`code.R`文件。这是因为自我们上次推送以来没有进行任何新的更改。现在我们可以退出这个弹出窗口，继续我们的代码工作。
- en: '![](../Images/b86588b85c23248c21da93367d9fc0a1.png)![](../Images/8df087ab9c93af716dc54e7e5989d72f.png)'
  id: totrans-138
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/b86588b85c23248c21da93367d9fc0a1.png)![](../Images/8df087ab9c93af716dc54e7e5989d72f.png)'
- en: If we now visit our repo on the web, we will see that it matches our local copy.
  id: totrans-139
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们现在访问我们的仓库在网页上，我们会看到它与我们的本地副本相匹配。
- en: '![](../Images/2be6a410fb405a17a93d4726e08902d2.png)'
  id: totrans-140
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/2be6a410fb405a17a93d4726e08902d2.png)'
- en: Congratulations, you have successfully shared code on a GitHub repository!
  id: totrans-141
  prefs: []
  type: TYPE_NORMAL
  zh: 恭喜，你已经在GitHub仓库上成功共享了代码！
