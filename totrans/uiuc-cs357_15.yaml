- en: Solving Nonlinear Equations
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://cs357.cs.illinois.edu/textbook/notes/solve_nd.html](https://cs357.cs.illinois.edu/textbook/notes/solve_nd.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: Learning objectives
  id: totrans-2
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Evaluate the bisection, newton, and secant methods to solve nonlinear equations
    in 1D
  id: totrans-3
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Apply Newton's method to solve a nonlinear system of equations
  id: totrans-4
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Root of a Function
  id: totrans-5
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'Consider a function \(f : \mathbb{R} \to \mathbb{R}\). The point \(x \in \mathbb{R}\)
    is called the ***root*** of \(f\) if \(f(x) = 0\).'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
- en: Solution of an Equation
  id: totrans-7
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'Finding the values of \(x\) for which \(f(x) = 0\) is useful for many applications,
    but a more general task is to find the values of \(x\) for which \(f(x) = y\).
    The same techniques used to find the root of a function can be used to solve an
    equation by manipulating the function like so:'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
- en: \[\tilde{f}(x) = f(x) - y = 0\]
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
- en: The new function \(\tilde{f}(x)\) has a root at the solution to the original
    equation \(f(x) = y\).
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
- en: Nonlinear Equations in 1D
  id: totrans-11
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Linear functions are trivial to solve, as are quadratic functions if you have
    the quadratic formula memorized. However, polynomials of higher degree and non-polynomial
    functions are much more difficult to solve. The simplest technique for solving
    these types of equations is to use an iterative root-finding technique. Instead
    of finding out where \(f(x) = 0\) directly, we will start with an initial guess
    and improve it over multiple steps until our *residual* \(f(x)\) is sufficiently
    small.
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
- en: Convergence
  id: totrans-13
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'An iterative method converges with rate \(\mathbf r\) if:'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
- en: \[\lim_{k\to\infty} \frac{\|e_{k + 1}\|}{\|e_{k}\|^{\mathbf r}} = C, \quad 0
    < C < \infty\]
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
- en: where \(e_k\) is the error at iteration k.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
- en: '\[\begin{eqnarray} \mathbf{r} &=& 1: linear\ convergence\\ \\ 1 < \mathbf{r}
    &<& 2: superlinear\ convergence\\ \\ \mathbf{r} &=& 2: quadratic\ convergence\\
    \end{eqnarray}\]'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
- en: '**Linear convergence** gains a constant number of accurate digits each step
    (the error shrinks linearly). When \(C\) is close to 1 convergence is slow.'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
- en: '**Quadratic convergence** doubles the number of accurate digits in each step
    (the error shrinks quadratically). However it only starts making sense once \(\|e^k\|\)
    is small, and C does not matter much.'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
- en: Example
  id: totrans-20
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: What is the convergence rate of **Power Iteration**?
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
- en: <details><summary>**Answer**</summary>
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
- en: Recall from the power iteration method
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
- en: \[\lim_{k\to\infty} \frac{\|e_{k + 1}\|}{\|e_{k}\|^{\mathbf 1}} = |\frac{\lambda_{2}}
    {\lambda_{1}}| = C\]
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
- en: We see that when \({\mathbf r} = 1\), we get a constant for the ratio between
    two consecutive iterations. Therefore power iteration has linear convergence.</details>
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
- en: Bisection Method
  id: totrans-26
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: The bisection method is the simplest root-finding technique.
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
- en: Algorithm
  id: totrans-28
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: 'The algorithm for bisection is analogous to binary search:'
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
- en: Take two points, \(a\) and \(b\), on each side of the root such that \(f(a)\)
    and \(f(b)\) have opposite signs.
  id: totrans-30
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Calculate the midpoint \(c = \frac{a + b}{2}\)
  id: totrans-31
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Evaluate \(f(c)\) and use \(c\) to replace either \(a\) or \(b\), keeping the
    signs of the endpoints opposite.
  id: totrans-32
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: With this algorithm we successively half the length of the interval known to
    contain the root each time. We can repeat this process until the length of the
    interval is less than the tolerance to which we want to know the root.
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
- en: Convergence
  id: totrans-34
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: The bisection method does not estimate \(x_{k}\), the approximation of the desired
    root \(x\). It instead finds an interval (smaller than a given tolerance), that
    contains the root.
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
- en: Therefore, the error at iteration k is defined to be the length of the interval
    at k iterations or \(\frac{(b - a)}{2^k}\).
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
- en: \[\lim_{k\to\infty} \frac{\|e_{k + 1}\|}{\|e_{k}\|^{\mathbf r}} = \lim_{k\to\infty}
    \frac{\|\frac{(b - a)}{2^{k + 1}}\|}{\|\frac{(b - a)}{2^k}\|} = 0.5\]
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
- en: Which gives us linear convergence, with a constant of \(\frac{1}{2}\).
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
- en: Computational Cost
  id: totrans-39
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: Conceptually bisection method uses 2 function evaluations at each iteration.
    However, at each step either one of \(a\) or \(b\) stays the same. So, at each
    iteration (after the first iteration), one of \(f(a)\) or \(f(b)\) was computed
    during the previous iteration. Therefore, bisection method requires only one new
    function evaluation per iteration. Depending on how costly the function is to
    evaluate, this can be a significant cost savings.
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
- en: Drawbacks
  id: totrans-41
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: The bisection method requires us to know a little about our function. Specifically,
    \(f(x)\) must be continuous and we must have an interval \([a, b]\) such that
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
- en: \[\mathrm{sgn}(f(a)) = -\mathrm{sgn}(f(b)).\]
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
- en: Then, by the intermediate value theorem, we know that there must be a root in
    the interval \([a,b]\).
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
- en: This restriction means that the bisection method cannot solve for the root of
    \(x^2\), as it never crosses the x-axis and becomes negative.
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
- en: Example
  id: totrans-46
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: \[f(x) = x^3 - x - 1\] <details><summary>**Answer**</summary>
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/ee64c8344097c9d7056bb06f48325443.png)'
  id: totrans-48
  prefs: []
  type: TYPE_IMG
- en: From the graph above, we can see that \(f(x)\) has a root somewhere between
    1 and 2\. It is difficult to tell exactly what the root is, but we can use the
    bisection method to approximate it. Specifically, we can set \(a = 1\) and \(b
    = 2\).
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
- en: '**Iteration 1**'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{flalign*} &\hspace{0.4cm}a = 1 \hspace{6.5cm} f(a) = f(1) = -1&\\ &\hspace{0.4cm}b
    = 2 \hspace{6.5cm} f(b) = f(2) = 5&\\ &\hspace{0.4cm}c = \frac{a + b}{2} = \frac{3}{2}
    = 1.5 \hspace{3cm} f(c) = f(1.5) = 1.5^3 - 1.5 - 1 = 0.875& \end{flalign*}\]
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
- en: Since \(f(b)\) and \(f(c)\) are both positive, we will replace \(b\) with \(c\)
    and further narrow our interval.
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
- en: '**Iteration 2**'
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{flalign*} &\hspace{0.4cm}a = 1 \hspace{6.5cm} f(a) = f(1) = -1&\\ &\hspace{0.4cm}b
    = 1.5 \hspace{6.2cm} f(b) = f(1.5) = 0.875&\\ &\hspace{0.4cm}c = \frac{a + b}{2}
    = \frac{2.5}{2} = 1.25 \hspace{2.5cm} f(c) = f(1.25) = 1.25^3 - 1.25 - 1 = -0.296875&
    \end{flalign*}\]
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
- en: Since \(f(a)\) and \(f(c)\) are both negative, we will replace \(a\) with \(c\)
    and further narrow our interval.
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
- en: Note that as described above, we didn't need to recalculate \(f(a)\) or \(f(b)\)
    as we had already calculated them during the previous iteration. Reusing these
    values can be a significant cost savings.
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
- en: '**Iteration 3**'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{flalign*} &\hspace{0.4cm}a = 1.25 \hspace{6.0cm} f(a) = f(1.25) = -0.296875&\\
    &\hspace{0.4cm}b = 1.5 \hspace{6.25cm} f(b) = f(1.5) = 0.875&\\ &\hspace{0.4cm}c
    = \frac{a + b}{2} = \frac{1.25 + 1.5}{2} = 1.375 \hspace{0.9cm} f(c) = f(1.375)
    = 1.375^3 - 1.375 - 1 = 0.224609375& \end{flalign*}\]
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
- en: Since \(f(b)\) and \(f(c)\) are both positive, we will replace \(b\) with \(c\)
    and further narrow our interval.
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
- en: '**…**'
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
- en: '**Iteration n**'
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
- en: When running the code for bisection method given below, the resulting approximate
    root determined is \(1.324717957244502\). With bisection, we can approximate the
    root to a desired tolerance (the value above is for the default tolerances).
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
- en: '**Code**'
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
- en: 'The following Python code calls SciPy''s `bisect` method:'
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]</details>'
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
- en: Newton's Method
  id: totrans-66
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The Newton-Raphson Method (a.k.a. Newton''s Method) uses a Taylor series approximation
    of the function to find an approximate solution. Specifically, it takes the first
    2 terms:'
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
- en: \[f(x_k + h) \approx f(x_k) + f'(x_k)h\]
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
- en: Algorithm
  id: totrans-69
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: 'Starting with the Taylor series above, we can find the root of this new function
    like so:'
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
- en: \[f(x_k) + f'(x_k)h = 0\] \[h = - \frac{f(x_k)}{f'(x_k)}\]
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
- en: 'This value of \(h\) is known as the **Newton step**. Now, \(h\) can be used
    to perform a **Newton update**, to find a value of \(x\) closer to the root of
    \(f\):'
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{eqnarray} x_{k+1} &=& x_k + h \\ &=& x_k - \frac{f(x_k)}{f'(x_k)} \end{eqnarray}\]
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
- en: Geometrically, \((x_{k+1}, 0)\) is the intersection of the x-axis and the tangent
    of the graph at \((x_k, f(x_k))\).
  id: totrans-74
  prefs: []
  type: TYPE_NORMAL
- en: By repeating this procedure, we can get closer and closer to the actual root.
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
- en: Computational Cost
  id: totrans-76
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: With Newton's method, at each iteration we must evaluate both \(f(x)\) and \(f'(x)\).
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
- en: Convergence
  id: totrans-78
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: Although Newton's method is more costly than the bisection method, it converges
    quicker.
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
- en: \[\lim_{k\to\infty} \frac{\|e_{k + 1}\|}{\|e_{k}\|^{\mathbf 2}} = C\]
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
- en: Which gives us quadratic convergence. However, as we see in the next section,
    this can depend on the initial guess.
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
- en: Drawbacks
  id: totrans-82
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: The additional cost of evaluating the derivative makes each iteration slower
    to compute.
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
- en: Many functions are not easily differentiable, so Newton's Method is not always
    possible. Even in cases when it is possible to evaluate the derivative, it may
    be quite costly.
  id: totrans-84
  prefs: []
  type: TYPE_NORMAL
- en: Convergence only works well if you are already close to the root. Specifically,
    if started too far from the root Newton's method may not converge at all.
  id: totrans-85
  prefs: []
  type: TYPE_NORMAL
- en: Example
  id: totrans-86
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: \[\begin{align*} f(x) &= x^3 - x - 1 \\ f'(x) &= 3x^2 - 1 \end{align*}\] <details><summary>**Answer**</summary>
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/ee64c8344097c9d7056bb06f48325443.png)'
  id: totrans-88
  prefs: []
  type: TYPE_IMG
- en: From the graph above, we can see that the root is somewhere near \(x = 1\).
    We will use \(x_0\) as our starting position.
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
- en: '**Iteration 1**'
  id: totrans-90
  prefs: []
  type: TYPE_NORMAL
- en: \(\begin{flalign*} \hspace{2cm} x_1 &= x_0 - \frac{f(x_0)}{f'(x_0)} \\ &= 1
    - \frac{f(1)}{f'(1)} &\\ &= 1 - \frac{1^3 - 1 - 1}{3 \cdot 1^2 - 1} \\ &= 1 +
    \frac{1}{2} \\ &= 1.5 \end{flalign*}\)
  id: totrans-91
  prefs: []
  type: TYPE_NORMAL
- en: '**Iteration 2**'
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
- en: \(\begin{flalign*} \hspace{2cm} x_2 &= x_1 - \frac{f(x_1)}{f'(x_1)} \\ &= 1.5
    - \frac{f(1.5)}{f'(1.5)} &\\ &= 1.5 - \frac{1.5^3 - 1.5 - 1}{3 \cdot 1.5^2 - 1}
    \\ &= 1.5 - \frac{0.875}{5.75} \\ &= 1.3478260869565217 \end{flalign*}\)
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
- en: '**Iteration 3**'
  id: totrans-94
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{flalign*} \hspace{2cm} x_3 &= x_2 - \frac{f(x_2)}{f'(x_2)} \\ &= 1.3478260869565217
    - \frac{f(1.3478260869565217)}{f'(1.3478260869565217)}& \\ &= 1.3478260869565217
    - \frac{1.3478260869565217^3 - 1.3478260869565217 - 1}{3 \cdot 1.3478260869565217^2
    - 1} \\ &= 1.3478260869565217 - \frac{0.10068217309114824}{4.449905482041588}
    \\ &= 1.325200398950907 \end{flalign*}\]
  id: totrans-95
  prefs: []
  type: TYPE_NORMAL
- en: As you can see, Newton's Method is already converging significantly faster than
    the Bisection Method.
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
- en: '**…**'
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
- en: '**Iteration n**'
  id: totrans-98
  prefs: []
  type: TYPE_NORMAL
- en: When running the code for Newton's method given below, the resulting approximate
    root determined is \(1.324717957244746\).
  id: totrans-99
  prefs: []
  type: TYPE_NORMAL
- en: '**Code**'
  id: totrans-100
  prefs: []
  type: TYPE_NORMAL
- en: 'The following Python code calls SciPy''s `newton` method:'
  id: totrans-101
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]</details>'
  id: totrans-102
  prefs: []
  type: TYPE_NORMAL
- en: Secant Method
  id: totrans-103
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Like Newton''s Method, secant method uses the Taylor Series to find the solution.
    However, you may not always be able to take the derivative of a function. Secant
    method gets around this by approximating the derivative as:'
  id: totrans-104
  prefs: []
  type: TYPE_NORMAL
- en: \[f'(x_k) \approx \frac{f(x_k) - f(x_{k-1})}{x_k - x_{k-1}}\]
  id: totrans-105
  prefs: []
  type: TYPE_NORMAL
- en: Algorithm
  id: totrans-106
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: The steps involved in the Secant Method are identical to those of the Newton
    Method, with the derivative replaced by an approximation for the slope of the
    tangent.
  id: totrans-107
  prefs: []
  type: TYPE_NORMAL
- en: Computational Cost
  id: totrans-108
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: Similar to bisection, although secant method conceptually requires 2 function
    evaluations per iteration, one of the function evaluations will have been computed
    in the previous iteration and can be reused. So, secant method requires 1 new
    function evaluation per iteration (after the first iteration).
  id: totrans-109
  prefs: []
  type: TYPE_NORMAL
- en: Convergence
  id: totrans-110
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: Secant method has superlinear convergence.
  id: totrans-111
  prefs: []
  type: TYPE_NORMAL
- en: 'More specifically, the rate of convergence \(r\) is:'
  id: totrans-112
  prefs: []
  type: TYPE_NORMAL
- en: \[r = \frac{1 + \sqrt{5}}{2} \approx 1.618\]
  id: totrans-113
  prefs: []
  type: TYPE_NORMAL
- en: This happens to be the golden ratio.
  id: totrans-114
  prefs: []
  type: TYPE_NORMAL
- en: Drawbacks
  id: totrans-115
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: This technique has many of the same drawbacks as Newton's Method, but does not
    require a derivative. It does not converge as quickly as Newton's Method. It also
    requires two starting guesses near the root.
  id: totrans-116
  prefs: []
  type: TYPE_NORMAL
- en: Example
  id: totrans-117
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: \[f(x) = x^3 - x - 1\] <details><summary>**Answer**</summary>
  id: totrans-118
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/ee64c8344097c9d7056bb06f48325443.png)'
  id: totrans-119
  prefs: []
  type: TYPE_IMG
- en: Let's start with \(x_0 = 1\) and \(x_{-1} = 2\).
  id: totrans-120
  prefs: []
  type: TYPE_NORMAL
- en: '**Iteration 1**'
  id: totrans-121
  prefs: []
  type: TYPE_NORMAL
- en: 'First, find an approximate for the derivative (slope):'
  id: totrans-122
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{flalign*} \hspace{0.5cm}f'(x_0) &\approx \frac{f(x_0) - f(x_{-1})}{x_0
    - x_{-1}} \\ &= \frac{f(1) - f(2)}{1 - 2} &\\ &= \frac{(1^3 - 1 - 1) - (2^3 -
    2 - 1)}{1 - 2} \\ &= \frac{(-1) - (5)}{1 - 2} \\ &= 6 \end{flalign*}\]
  id: totrans-123
  prefs: []
  type: TYPE_NORMAL
- en: 'Then, use this for Newton''s Method:'
  id: totrans-124
  prefs: []
  type: TYPE_NORMAL
- en: \(\begin{flalign*} \hspace{0.5cm}x_1 &= x_0 - \frac{f(x_0)}{f'(x_0)} \\ &= 1
    - \frac{f(1)}{f'(1)} &\\ &= 1 - \frac{1^3 - 1 - 1}{6} \\ &= 1 + \frac{1}{6} \\
    &= 1.1666666666666667 \end{flalign*}\)
  id: totrans-125
  prefs: []
  type: TYPE_NORMAL
- en: '**Iteration 2**'
  id: totrans-126
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{flalign*} \hspace{0.5cm}f'(x_1) &\approx \frac{f(x_1) - f(x_0)}{x_1
    - x_0} \\ &= \frac{f(1.1666666666666667) - f(1)}{1.1666666666666667 - 1} &\\ &=
    \frac{(1.1666666666666667^3 - 1.1666666666666667 - 1) - (1^3 - 1 - 1)}{1.1666666666666667
    - 1} \\ &= \frac{(-0.5787037037037035) - (-1)}{1.1666666666666667 - 1} \\ &= 2.5277777777777777
    \end{flalign*}\]
  id: totrans-127
  prefs: []
  type: TYPE_NORMAL
- en: \(\begin{flalign*} \hspace{0.5cm}x_2 &= x_1 - \frac{f(x_1)}{f'(x_1)} \\ &= 1.1666666666666667
    - \frac{f(1.1666666666666667)}{f'(1.1666666666666667)} &\\ &= 1.1666666666666667
    - \frac{1.1666666666666667^3 - 1.1666666666666667 - 1}{2.5277777777777777} \\
    &= 1.1666666666666667 - \frac{-0.5787037037037035}{2.5277777777777777} \\ &= 1.3956043956043955
    \end{flalign*}\)
  id: totrans-128
  prefs: []
  type: TYPE_NORMAL
- en: '**Iteration 3**'
  id: totrans-129
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{flalign*} \hspace{0.5cm}f'(x_2) &\approx \frac{f(x_2) - f(x_1)}{x_2
    - x_1} \\ &= \frac{f(1.3956043956043955) - f(1.1666666666666667)}{1.3956043956043955
    - 1.1666666666666667} &\\ &= \frac{(1.3956043956043955^3 - 1.3956043956043955
    - 1) - (1.1666666666666667^3 - 1.1666666666666667 - 1)}{1.3956043956043955 - 1.1666666666666667}
    \\ &= \frac{(0.3226305152401032) - (-0.5787037037037035)}{1.3956043956043955 -
    1.1666666666666667} \\ &= 3.9370278683465503 \end{flalign*}\] \[\begin{flalign*}
    \hspace{0.5cm}x_3 &= x_2 - \frac{f(x_2)}{f'(x_2)} \\ &= 1.3956043956043955 - \frac{f(1.3956043956043955)}{f'(1.3956043956043955)}
    &\\ &= 1.3956043956043955 - \frac{1.3956043956043955^3 - 1.3956043956043955 -
    1}{3.9370278683465503} \\ &= 1.3956043956043955 - \frac{0.3226305152401032}{3.9370278683465503}
    \\ &= 1.3136566609098987 \end{flalign*}\]
  id: totrans-130
  prefs: []
  type: TYPE_NORMAL
- en: '**…**'
  id: totrans-131
  prefs: []
  type: TYPE_NORMAL
- en: '**Iteration n**'
  id: totrans-132
  prefs: []
  type: TYPE_NORMAL
- en: When running the code for secant method given below, the resulting approximate
    root determined is \(1.324717957244753\).
  id: totrans-133
  prefs: []
  type: TYPE_NORMAL
- en: '**Code**'
  id: totrans-134
  prefs: []
  type: TYPE_NORMAL
- en: 'SciPy''s `newton` method serves double-duty. If given a function \(f\) and
    a first derivative \(f''\), it will use Newton''s Method. If it is not given a
    derivative, it will instead use the Secant Method to approximate it:'
  id: totrans-135
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE2]</details>'
  id: totrans-136
  prefs: []
  type: TYPE_NORMAL
- en: 1D Summary
  id: totrans-137
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '![1D methods](../Images/ae9f318e967365cc35c5324d72da7f4c.png)'
  id: totrans-138
  prefs: []
  type: TYPE_IMG
- en: Nonlinear System of Equations
  id: totrans-139
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'Similar to root-finding in 1 dimension, we can also perform root-finding for
    multiple equations in \(n\) dimensions. Mathematically, we are trying to solve
    \(\boldsymbol{f(x) = 0}\) for \(\boldsymbol{f} : \mathbb{R}^n \to \mathbb{R}^n\).
    In other words, \(\boldsymbol{f(x)}\) is now a vector-valued function'
  id: totrans-140
  prefs: []
  type: TYPE_NORMAL
- en: \[\boldsymbol{f(x)} = \begin{bmatrix} f_1(\boldsymbol{x}) \\ \vdots \\ f_n(\boldsymbol{x})
    \end{bmatrix} = \begin{bmatrix} f_1(x_1, \ldots, x_n) \\ \vdots \\ f_n(x_1, \ldots,
    x_n) \end{bmatrix}\]
  id: totrans-141
  prefs: []
  type: TYPE_NORMAL
- en: 'If we are instead looking for the solution to \(\boldsymbol{f(x) = y}\), we
    can rework our function like so:'
  id: totrans-142
  prefs: []
  type: TYPE_NORMAL
- en: \[\boldsymbol{\tilde{f}(x)} = \boldsymbol{f(x)} - \boldsymbol{y} = \boldsymbol{0}\]
  id: totrans-143
  prefs: []
  type: TYPE_NORMAL
- en: We can think of each equation as a function that describes a surface. We are
    looking for vectors that describe the intersection of these surfaces.
  id: totrans-144
  prefs: []
  type: TYPE_NORMAL
- en: The Jacobian Matrix
  id: totrans-145
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Given \(\boldsymbol{f} : \mathbb{R}^n \to \mathbb{R}^n\) we define the Jacobian
    matrix \({\bf J}_f\) as:'
  id: totrans-146
  prefs: []
  type: TYPE_NORMAL
- en: \[{\bf J}_f(\boldsymbol{x}) = \begin{bmatrix} \frac{\partial f_1}{\partial x_1}
    & \ldots & \frac{\partial f_1}{\partial x_n} \\ \vdots & \ddots & \vdots \\ \frac{\partial
    f_n}{\partial x_1} & \ldots & \frac{\partial f_n}{\partial x_n} \end{bmatrix}\]
  id: totrans-147
  prefs: []
  type: TYPE_NORMAL
- en: Newton's Method
  id: totrans-148
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The multi-dimensional equivalent of Newton''s Method involves approximating
    a function as:'
  id: totrans-149
  prefs: []
  type: TYPE_NORMAL
- en: \[\boldsymbol{f(x + s)} \approx \boldsymbol{f(x)} + {\bf J}_f(\boldsymbol{x})\boldsymbol{s}\]
  id: totrans-150
  prefs: []
  type: TYPE_NORMAL
- en: where \({\bf J}_f\) is the ***Jacobian matrix*** of \(\boldsymbol{f}\).
  id: totrans-151
  prefs: []
  type: TYPE_NORMAL
- en: 'By setting this to \(\mathbf{0}\) and rearranging, we get:'
  id: totrans-152
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{align*} {\bf J}_f(\boldsymbol{x})\boldsymbol{s} &= -\boldsymbol{f(x)}
    \qquad \qquad (1) \\ \boldsymbol{s} &= - {\bf J}_f(\boldsymbol{x})^{-1} \boldsymbol{f(x)}
    \end{align*}\]
  id: totrans-153
  prefs: []
  type: TYPE_NORMAL
- en: Note that in practice we would not actually invert the Jacobian, but would instead
    solve the linear system in \((1)\) to determine the step.
  id: totrans-154
  prefs: []
  type: TYPE_NORMAL
- en: Algorithm
  id: totrans-155
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: 'Similar to the way we solved for \(x_{k+1}\) in 1 dimension, we can solve for:'
  id: totrans-156
  prefs: []
  type: TYPE_NORMAL
- en: \(\boldsymbol{x_{k+1}} = \boldsymbol{x_k} + \boldsymbol{s_k}\) where \(\boldsymbol{s_k}\)
    is determined by solving the linear system \({\bf J}_f(\boldsymbol{x_k})\boldsymbol{s_k}
    = -\boldsymbol{f(x_k)}.\)
  id: totrans-157
  prefs: []
  type: TYPE_NORMAL
- en: Drawbacks
  id: totrans-158
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: Just like in 1D, Newton's Method only converges locally. It may also be expensive
    to compute \({\bf J}_f\) at each iteration and we must solve a linear system at
    each iteration.
  id: totrans-159
  prefs: []
  type: TYPE_NORMAL
- en: Example
  id: totrans-160
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: Find a root for
  id: totrans-161
  prefs: []
  type: TYPE_NORMAL
- en: \[\boldsymbol{f}(x, y) = \begin{bmatrix} x + 2y - 2 \\ x^2 + 4y^2 - 4 \end{bmatrix}\]
    <details><summary>**Answer**</summary>
  id: totrans-162
  prefs: []
  type: TYPE_NORMAL
- en: 'The corresponding Jacobian and inverse Jacobian are:'
  id: totrans-163
  prefs: []
  type: TYPE_NORMAL
- en: \[{\bf J}_f(\boldsymbol{x}) = \begin{bmatrix} 1 & 2 \\ 2x & 8y \end{bmatrix}\]
    \[{\bf J}_f^{-1} = \frac{1}{x - 2y} \begin{bmatrix} -2y & \frac{1}{2} \\ \frac{x}{2}
    & - \frac{1}{4} \end{bmatrix}\]
  id: totrans-164
  prefs: []
  type: TYPE_NORMAL
- en: In this example, as the Jacobian is a \(2 \times 2\) matrix with a simple inverse,
    we work explicitly with the inverse, even though we would not explicitly compute
    the inverse for a real problem.
  id: totrans-165
  prefs: []
  type: TYPE_NORMAL
- en: Let's start at \(\boldsymbol{x_0} = \begin{bmatrix}1 \\ 1\end{bmatrix}\).
  id: totrans-166
  prefs: []
  type: TYPE_NORMAL
- en: '**Iteration 1**'
  id: totrans-167
  prefs: []
  type: TYPE_NORMAL
- en: \(\begin{flalign*} \hspace{2cm}\boldsymbol{x_1} &= \boldsymbol{x_0} - {\bf J}_f(\boldsymbol{x_0})^{-1}
    \boldsymbol{f(x_0)} \\ &= \begin{bmatrix}1 \\ 1\end{bmatrix} - \frac{1}{1 - 2}\begin{bmatrix}-2
    & \frac{1}{2} \\ \frac{1}{2} & - \frac{1}{4}\end{bmatrix} \begin{bmatrix}1 \\
    1\end{bmatrix} &\\ &= \begin{bmatrix}1 \\ 1\end{bmatrix} + \begin{bmatrix}-1.5
    \\ 0.25\end{bmatrix} \\ &= \begin{bmatrix}-0.5 \\ 1.25\end{bmatrix} \end{flalign*}\)
  id: totrans-168
  prefs: []
  type: TYPE_NORMAL
- en: '**Iteration 2**'
  id: totrans-169
  prefs: []
  type: TYPE_NORMAL
- en: \(\begin{flalign*} \hspace{2cm}\boldsymbol{x_2} &= \boldsymbol{x_1} - {\bf J}_f(\boldsymbol{x_1})^{-1}
    \boldsymbol{f(x_1)} \\ &= \begin{bmatrix}-0.5 \\ 1.25\end{bmatrix} - \frac{1}{-0.5
    - 2.5}\begin{bmatrix}-2.5 & \frac{1}{2} \\ - \frac{1}{4} & - \frac{1}{4}\end{bmatrix}
    \begin{bmatrix}0 \\ 2.5\end{bmatrix} &\\ &= \begin{bmatrix}-0.5 \\ 1.25\end{bmatrix}
    + \frac{1}{3}\begin{bmatrix}1.25 \\ -0.625\end{bmatrix} \\ &= \begin{bmatrix}-0.08333333
    \\ 1.04166667\end{bmatrix} \end{flalign*}\)
  id: totrans-170
  prefs: []
  type: TYPE_NORMAL
- en: '**Iteration 3**'
  id: totrans-171
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{flalign*} \hspace{2cm}\boldsymbol{x_3} &= \boldsymbol{x_2} - {\bf J}_f(\boldsymbol{x_2})^{-1}
    \boldsymbol{f(x_2)} \\ &= \begin{bmatrix}-0.08333333 \\ 1.04166667\end{bmatrix}
    - \frac{1}{-0.08333333 - 2.08333334}\begin{bmatrix}-2.08333334 & 0.5 \\ -0.041666665
    & -0.25\end{bmatrix} \begin{bmatrix}9.99999993922529 \cdot 10^{-9} \\ 0.34722224944444413\end{bmatrix}
    &\\ &= \begin{bmatrix}-0.08333333 \\ 1.04166667\end{bmatrix} + \frac{1}{2.1666666699999997}\begin{bmatrix}0.1736111
    \\ -0.08680556\end{bmatrix} \\ &= \begin{bmatrix}-0.00320513 \\ 1.00160256\end{bmatrix}
    \end{flalign*}\]
  id: totrans-172
  prefs: []
  type: TYPE_NORMAL
- en: '**…**'
  id: totrans-173
  prefs: []
  type: TYPE_NORMAL
- en: '**Iteration n**'
  id: totrans-174
  prefs: []
  type: TYPE_NORMAL
- en: When running the code for Newton's method given below, the resulting approximate
    root determined is \(\begin{bmatrix}-2.74060567 \cdot 10^{-16} & 1\end{bmatrix}^\top.\)
  id: totrans-175
  prefs: []
  type: TYPE_NORMAL
- en: '**Code**'
  id: totrans-176
  prefs: []
  type: TYPE_NORMAL
