- en: Adding Random Variables
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part4/summation_vars/](https://chrispiech.github.io/probabilityForComputerScientists/en/part4/summation_vars/)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
- en: In this section on uncertainty theory we are going to explore some of the great
    results in probability theory. As a gentle introduction we are going to start
    with convolution. Convolution is a very fancy way of saying "adding" two different
    random variables together. The name comes from the fact that adding two random
    varaibles requires you to "convolve" their distribution functions. It is interesting
    to study in detail because (1) many natural processes can be modelled as the sum
    of random variables, and (2) because mathemeticians have made great progress on
    proving convolution theorems. For some particular random variables computing convolution
    has closed form equations. Importantly convolution is the sum of the random variables
    themselves, not the addition of the probability density functions (PDF)s that
    correspond to the random variables.
  prefs: []
  type: TYPE_NORMAL
