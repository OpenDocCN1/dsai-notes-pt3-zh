  zh: 2. 使用 `data(murders)` 将 `murders` 重置为原始表。使用管道创建一个名为 `my_states` 的新数据框，该数据框仅考虑东北部或西部的谋杀率低于
    1 的州，并且仅包含州、率和排名列。管道应包含四个由三个 `|>` 分隔的组件。代码看起来可能像这样：
- en: '[PRE23]'
  id: totrans-108
  prefs: []
  type: TYPE_PRE
  zh: '[PRE23]'
- en: 4.7 Summarizing data
  id: totrans-109
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 4.7 总结数据
- en: 'An important part of exploratory data analysis is summarizing data. The average
    and standard deviation are two examples of widely used summary statistics. More
    informative summaries can often be achieved by first splitting data into groups.
    In this section, we cover two new **dplyr** verbs that make these computations
    easier: `summarize` and `group_by`. We learn to access resulting values using
    the `pull` function.'
  id: totrans-110
  prefs: []
  type: TYPE_NORMAL
  zh: 探索性数据分析的一个重要部分是总结数据。平均值和标准差是广泛使用的摘要统计的两个例子。通过首先将数据分成组，通常可以得出更有信息的摘要。在本节中，我们介绍了两个新的
    **dplyr** 动词，使这些计算更容易：`summarize` 和 `group_by`。我们学习使用 `pull` 函数访问结果值。
- en: 4.7.1 `summarize`
  id: totrans-111
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 4.7.1 `summarize`
- en: The `summarize` function in **dplyr** provides a way to compute summary statistics
    with intuitive and readable code. We start with a simple example based on heights.
    The `heights` dataset includes heights and sex reported by students in an in-class
    survey.
  id: totrans-112
  prefs: []
  type: TYPE_NORMAL
  zh: '**dplyr** 中的 `summarize` 函数提供了一种使用直观且可读的代码来计算摘要统计的方法。我们从基于身高的简单示例开始。`heights`
    数据集包括课堂调查中报告的学生身高和性别。'
- en: '[PRE24]'
  id: totrans-113
  prefs: []
  type: TYPE_PRE
  zh: '[PRE24]'
- en: 'The following code computes the average and standard deviation for females:'
  id: totrans-114
  prefs: []
  type: TYPE_NORMAL
  zh: 以下代码计算女性的平均值和标准差：
- en: '[PRE25]'
  id: totrans-115
  prefs: []
  type: TYPE_PRE
  zh: '[PRE25]'
- en: This takes our original data table as input, filters it to keep only females,
    and then produces a new summarized table with just the average and the standard
    deviation of heights. We get to choose the names of the columns of the resulting
    table. For example, above we decided to use `average` and `standard_deviation`,
    but we could have used other names just the same.
  id: totrans-116
  prefs: []
  type: TYPE_NORMAL
  zh: 这将我们的原始数据表作为输入，过滤它以仅保留女性，然后生成一个新的摘要表，其中只包含身高的平均值和标准差。我们可以选择结果表的列名。例如，在上面的例子中，我们决定使用
    `average` 和 `standard_deviation`，但我们可以使用其他名称。
- en: 'Because the resulting table stored in `s` is a data frame, we can access the
    components with the accessor `$`:'
  id: totrans-117
  prefs: []
  type: TYPE_NORMAL
  zh: 因为存储在 `s` 中的结果表是一个数据框，我们可以使用访问器 `$` 访问其组件：
- en: '[PRE26]'
  id: totrans-118
  prefs: []
  type: TYPE_PRE
  zh: '[PRE26]'
- en: As with most other **dplyr** functions, `summarize` is aware of the variable
    names and we can use them directly. So when inside the call to the `summarize`
    function we write `mean(height)`, the function is accessing the column with the
    name “height” and then computing the average of the resulting numeric vector.
    We can compute any other summary that operates on vectors and returns a single
    value.
  id: totrans-119
  prefs: []
  type: TYPE_NORMAL
  zh: 与大多数其他 **dplyr** 函数一样，`summarize` 函数了解变量名称，我们可以直接使用它们。因此，当我们在 `summarize` 函数的调用中写入
    `mean(height)` 时，该函数正在访问名为“height”的列，然后计算结果数值向量的平均值。我们可以计算任何其他在向量上操作并返回单个值的摘要。
- en: 'For another example of how we can use the `summarize` function, let’s compute
    the average murder rate for the United States. Remember our data table includes
    total murders and population size for each state and we have already used **dplyr**
    to add a murder rate column:'
  id: totrans-120
  prefs: []
  type: TYPE_NORMAL
  zh: 再举一个使用 `summarize` 函数的例子，让我们计算美国的平均谋杀率。记住，我们的数据表包括每个州的谋杀总数和人口规模，我们之前已经使用 **dplyr**
    添加了一个谋杀率列：
- en: '[PRE27]'
  id: totrans-121
  prefs: []
  type: TYPE_PRE
  zh: '[PRE27]'
- en: 'Remember that the US murder rate is **not** the average of the state murder
    rates:'
  id: totrans-122
  prefs: []
  type: TYPE_NORMAL
  zh: 记住，美国的谋杀率 **不是** 州谋杀率的平均值：
- en: '[PRE28]'
  id: totrans-123
  prefs: []
  type: TYPE_PRE
  zh: '[PRE28]'
- en: 'This is because in the computation above the small states are given the same
    weight as the large ones. The US murder rate is the total number of murders in
    the US divided by the total US population. So the correct computation is:'
  id: totrans-124
  prefs: []
  type: TYPE_NORMAL
  zh: 这是因为在上面的计算中，小州被赋予了与大型州相同的权重。美国的谋杀率是美国谋杀总数除以美国总人口。因此，正确的计算方法是：
- en: '[PRE29]'
  id: totrans-125
  prefs: []
  type: TYPE_PRE
  zh: '[PRE29]'
- en: This computation counts larger states proportionally to their size which results
    in a larger value.
  id: totrans-126
  prefs: []
  type: TYPE_NORMAL
  zh: 这种计算会按比例计算较大州的谋杀率，这会导致结果值较大。
- en: 4.7.2 Multiple summaries
  id: totrans-127
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 4.7.2 多个汇总
- en: 'Suppose we want three summaries from the same variable such as the median,
    minimum, and maximum heights. The `quantile` function: `quantile(x, c(0.5, 0,
    1))` returns the median (50th percentile), the min (0th percentile), and max (100th
    percentile) of the vector `x`. We can use it with `summarize` like this:'
  id: totrans-128
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们想要从同一个变量中获取三个汇总，例如中位数、最小值和最大身高。`quantile` 函数：`quantile(x, c(0.5, 0, 1))`
    返回向量 `x` 的中位数（50百分位数）、最小值（0百分位数）和最大值（100百分位数）。我们可以像这样与 `summarize` 一起使用它：
- en: '[PRE30]'
  id: totrans-129
  prefs: []
  type: TYPE_PRE
  zh: '[PRE30]'
- en: 'However, notice that the summaries are returned in a row each. To obtain the
    results in different columns, we have to define a function that returns a data
    frame like this:'
  id: totrans-130
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，请注意，汇总是按行返回的。为了在不同的列中获取结果，我们必须定义一个返回数据框的函数，如下所示：
- en: '[PRE31]'
  id: totrans-131
  prefs: []
  type: TYPE_PRE
  zh: '[PRE31]'
- en: In the next section we learn how useful this approach can be when summarizing
    by group.
  id: totrans-132
  prefs: []
  type: TYPE_NORMAL
  zh: 在下一节中，我们将学习这种按组汇总的方法是多么有用。
- en: 4.7.3 Group then summarize with `group_by`
  id: totrans-133
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 4.7.3 使用 `group_by` 分组然后汇总
- en: A common operation in data exploration is to first split data into groups and
    then compute summaries for each group. For example, we may want to compute the
    average and standard deviation for men’s and women’s heights separately. The `group_by`
    function helps us do this.
  id: totrans-134
  prefs: []
  type: TYPE_NORMAL
  zh: 在数据探索中，一个常见的操作是首先将数据分成组，然后对每个组进行汇总计算。例如，我们可能想分别计算男性和女性的平均身高和标准差。`group_by` 函数帮助我们完成这项工作。
- en: 'If we type this:'
  id: totrans-135
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们输入以下内容：
- en: '[PRE32]'
  id: totrans-136
  prefs: []
  type: TYPE_PRE
  zh: '[PRE32]'
- en: 'The result does not look very different from `heights`, except we see `Groups:
    sex [2]` when we print the object. Although not immediately obvious from its appearance,
    this is now a special data frame called a *grouped data frame*, and **dplyr**
    functions, in particular `summarize`, will behave differently when acting on this
    object. Conceptually, you can think of this table as many tables, with the same
    columns but not necessarily the same number of rows, stacked together in one object.
    When we summarize the data after grouping, this is what happens:'
  id: totrans-137
  prefs: []
  type: TYPE_NORMAL
  zh: '结果看起来与 `heights` 并没有太大不同，除了当我们打印对象时，我们会看到 `Groups: sex [2]`。尽管从其外观上并不立即明显，但现在这是一个特殊的数据框，称为
    *分组数据框*，**dplyr** 函数，特别是 `summarize`，在作用于此对象时会有不同的行为。从概念上讲，你可以将这个表格视为许多表格，它们具有相同的列，但行数不一定相同，堆叠在一个对象中。当我们对分组后的数据进行汇总时，就会发生这种情况：'
- en: '[PRE33]'
  id: totrans-138
  prefs: []
  type: TYPE_PRE
  zh: '[PRE33]'
- en: The `summarize` function applies the summarization to each group separately.
  id: totrans-139
  prefs: []
  type: TYPE_NORMAL
  zh: '`summarize` 函数将汇总分别应用于每个组。'
- en: 'For another example, let’s compute the median, minimum, and maximum murder
    rate in the four regions of the country using the `median_min_max` defined above:'
  id: totrans-140
  prefs: []
  type: TYPE_NORMAL
  zh: 举例来说，让我们使用上面定义的 `median_min_max` 函数来计算该国四个地区的谋杀率的中位数、最小值和最大值：
- en: '[PRE34]'
  id: totrans-141
  prefs: []
  type: TYPE_PRE
  zh: '[PRE34]'
- en: 4.8 `pull`
  id: totrans-142
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 4.8 `pull`
- en: 'The `us_murder_rate` object defined above represents just one number. Yet we
    are storing it in a data frame:'
  id: totrans-143
  prefs: []
  type: TYPE_NORMAL
  zh: 上面定义的 `us_murder_rate` 对象只代表一个数字。然而，我们将其存储在一个数据框中：
- en: '[PRE35]'
  id: totrans-144
  prefs: []
  type: TYPE_PRE
  zh: '[PRE35]'
- en: since, as most **dplyr** functions, `summarize` always returns a data frame.
  id: totrans-145
  prefs: []
  type: TYPE_NORMAL
  zh: 因为，像大多数 **dplyr** 函数一样，`summarize` 总是返回一个数据框。
- en: 'This might be problematic if we want to use this result with functions that
    require a numeric value. Here we show a useful trick for accessing values stored
    in data when using pipes: when a data object is piped that object and its columns
    can be accessed using the `pull` function. To understand what we mean take a look
    at this line of code:'
  id: totrans-146
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们想要使用需要数值函数的结果，这可能会出现问题。在这里，我们展示了在使用管道时访问数据中存储值的一个有用的技巧：当一个数据对象被管道传输时，可以使用
    `pull` 函数访问该对象及其列。为了理解我们的意思，请看以下代码行：
- en: '[PRE36]'
  id: totrans-147
  prefs: []
  type: TYPE_PRE
  zh: '[PRE36]'
- en: This returns the value in the `rate` column of `us_murder_rate` making it equivalent
    to `us_murder_rate$rate`.
  id: totrans-148
  prefs: []
  type: TYPE_NORMAL
  zh: 这返回了`us_murder_rate`中`rate`列的值，使其等同于`us_murder_rate$rate`。
- en: 'To get a number from the original data table with one line of code we can type:'
  id: totrans-149
  prefs: []
  type: TYPE_NORMAL
  zh: 要从原始数据表中用一行代码获取一个数字，我们可以输入：
- en: '[PRE37]'
  id: totrans-150
  prefs: []
  type: TYPE_PRE
  zh: '[PRE37]'
- en: 'which is now a numeric:'
  id: totrans-151
  prefs: []
  type: TYPE_NORMAL
  zh: 现在是一个数值：
- en: '[PRE38]'
  id: totrans-152
  prefs: []
  type: TYPE_PRE
  zh: '[PRE38]'
- en: 4.9 Sorting data frames
  id: totrans-153
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 4.9 排序数据框
- en: 'When examining a dataset, it is often convenient to sort the table by the different
    columns. We know about the `order` and `sort` function, but for ordering entire
    tables, the **dplyr** function `arrange` is useful. For example, here we order
    the states by population size:'
  id: totrans-154
  prefs: []
  type: TYPE_NORMAL
  zh: 当检查数据集时，按不同的列排序表格通常很方便。我们了解`order`和`sort`函数，但为了对整个表格进行排序，`dplyr`函数`arrange`很有用。例如，这里我们按人口数量对州进行排序：
- en: '[PRE39]'
  id: totrans-155
  prefs: []
  type: TYPE_PRE
  zh: '[PRE39]'
- en: 'With `arrange` we get to decide which column to sort by. To see the states
    by murder rate, from lowest to highest, we arrange by `rate` instead:'
  id: totrans-156
  prefs: []
  type: TYPE_NORMAL
  zh: 使用`arrange`，我们可以决定按哪个列排序。要按谋杀率从低到高查看各州，我们按`rate`排序：
- en: '[PRE40]'
  id: totrans-157
  prefs: []
  type: TYPE_PRE
  zh: '[PRE40]'
- en: 'Note that the default behavior is to order in ascending order. In **dplyr**,
    the function `desc` transforms a vector so that it is in descending order. To
    sort the table in descending order, we can type:'
  id: totrans-158
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，默认行为是按升序排序。在**dplyr**中，`desc`函数将向量转换成降序。要按降序排序表格，我们可以输入：
- en: '[PRE41]'
  id: totrans-159
  prefs: []
  type: TYPE_PRE
  zh: '[PRE41]'
- en: 4.9.1 Nested sorting
  id: totrans-160
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 4.9.1 嵌套排序
- en: 'If we are ordering by a column with ties, we can use a second column to break
    the tie. Similarly, a third column can be used to break ties between first and
    second and so on. Here we order by `region`, then within region we order by murder
    rate:'
  id: totrans-161
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们按有并列的列排序，我们可以使用第二列来打破并列。同样，第三列可以用来打破第一和第二之间的并列，依此类推。这里我们按`region`排序，然后在区域内按谋杀率排序：
- en: '[PRE42]'
  id: totrans-162
  prefs: []
  type: TYPE_PRE
  zh: '[PRE42]'
- en: 4.9.2 The top \(n\)
  id: totrans-163
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 4.9.2 顶部\(n\)
- en: 'In the code above, we have used the function `head` to avoid having the page
    fill up with the entire dataset. If we want to see a larger proportion, we can
    use the `top_n` function. This function takes a data frame as it’s first argument,
    the number of rows to show in the second, and the variable to filter by in the
    third. Here is an example of how to see the top 5 rows:'
  id: totrans-164
  prefs: []
  type: TYPE_NORMAL
  zh: 在上面的代码中，我们使用了`head`函数来避免整个数据集填满页面。如果我们想看到更大的比例，我们可以使用`top_n`函数。这个函数的第一个参数是一个数据框，第二个参数是要显示的行数，第三个参数是要过滤的变量。以下是如何查看前5行的示例：
- en: '[PRE43]'
  id: totrans-165
  prefs: []
  type: TYPE_PRE
  zh: '[PRE43]'
- en: Note that rows are not sorted by `rate`, only filtered. If we want to sort,
    we need to use `arrange`. Note that if the third argument is left blank, `top_n`
    filters by the last column.
  id: totrans-166
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，行不是按`rate`排序的，只是进行了过滤。如果我们想排序，我们需要使用`arrange`。注意，如果第三个参数留空，`top_n`将根据最后一列进行过滤。
- en: 4.10 Exercises
  id: totrans-167
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 4.10 练习
- en: 'For these exercises, we will be using the data from the survey collected by
    the United States National Center for Health Statistics (NCHS). This center has
    conducted a series of health and nutrition surveys since the 1960’s. Starting
    in 1999, about 5,000 individuals of all ages have been interviewed every year
    and they complete the health examination component of the survey. Part of the
    data is made available via the **NHANES** package. Once you install the **NHANES**
    package, you can load the data like this:'
  id: totrans-168
  prefs: []
  type: TYPE_NORMAL
  zh: 对于这些练习，我们将使用美国国家健康统计中心（NCHS）收集的调查数据。自20世纪60年代以来，该中心进行了一系列健康和营养调查。从1999年开始，每年大约有5,000名各年龄段的个人接受采访，并完成调查的健康检查部分。部分数据通过**NHANES**包提供。一旦安装了**NHANES**包，你可以这样加载数据：
- en: '[PRE44]'
  id: totrans-169
  prefs: []
  type: TYPE_PRE
  zh: '[PRE44]'
- en: 'The **NHANES** data has many missing values. The `mean` and `sd` functions
    in R will return `NA` if any of the entries of the input vector is an `NA`. Here
    is an example:'
  id: totrans-170
  prefs: []
  type: TYPE_NORMAL
  zh: '**NHANES**数据有许多缺失值。在R中，如果输入向量的任何条目是`NA`，`mean`和`sd`函数将返回`NA`。以下是一个示例：'
- en: '[PRE45]'
  id: totrans-171
  prefs: []
  type: TYPE_PRE
  zh: '[PRE45]'
- en: 'To ignore the `NA`s we can use the `na.rm` argument:'
  id: totrans-172
  prefs: []
  type: TYPE_NORMAL
  zh: 要忽略`NA`，我们可以使用`na.rm`参数：
- en: '[PRE46]'
  id: totrans-173
  prefs: []
  type: TYPE_PRE
  zh: '[PRE46]'
- en: Let’s now explore the NHANES data.
  id: totrans-174
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们来探索NHANES数据。
- en: 1\. We will provide some basic facts about blood pressure. First let’s select
    a group to set the standard. We will use 20-to-29-year-old females. `AgeDecade`
    is a categorical variable with these ages. Note that the category is coded like
    ” 20-29”, with a space in front! What is the average and standard deviation of
    systolic blood pressure as saved in the `BPSysAve` variable? Save it to a variable
    called `ref`.
  id: totrans-175
  prefs: []
  type: TYPE_NORMAL
  zh: 1. 我们将提供一些关于血压的基本事实。首先，让我们选择一个组来设定标准。我们将使用20至29岁的女性。`AgeDecade`是一个具有这些年龄的类别变量。注意，类别编码为“20-29”，前面有一个空格！`BPSysAve`变量中保存的平均值和标准差是多少？保存到名为`ref`的变量中。
- en: 'Hint: Use `filter` and `summarize` and use the `na.rm = TRUE` argument when
    computing the average and standard deviation. You can also filter the NA values
    using `filter`.'
  id: totrans-176
  prefs: []
  type: TYPE_NORMAL
  zh: 提示：使用`filter`和`summarize`，并在计算平均值和标准差时使用`na.rm = TRUE`参数。你还可以使用`filter`过滤NA值。
- en: '2\. Using a pipe, assign the average to a numeric variable `ref_avg`. Hint:
    Use the code similar to above and then `pull`.'
  id: totrans-177
  prefs: []
  type: TYPE_NORMAL
  zh: 2. 使用管道，将平均值赋给一个数值变量`ref_avg`。提示：使用与上面类似的代码，然后使用`pull`。
- en: 3\. Now report the min and max values for the same group.
  id: totrans-178
  prefs: []
  type: TYPE_NORMAL
  zh: 3. 现在报告同一组的最大值和最小值。
- en: '4\. Compute the average and standard deviation for females, but for each age
    group separately rather than a selected decade as in question 1\. Note that the
    age groups are defined by `AgeDecade`. Hint: rather than filtering by age and
    gender, filter by `Gender` and then use `group_by`.'
  id: totrans-179
  prefs: []
  type: TYPE_NORMAL
  zh: 4. 为女性计算平均值和标准差，但按年龄组分别计算，而不是像问题1中那样按十年计算。注意，年龄组由`AgeDecade`定义。提示：与其按年龄和性别过滤，不如按`Gender`过滤，然后使用`group_by`。
- en: 5\. Repeat exercise 4 for males.
  id: totrans-180
  prefs: []
  type: TYPE_NORMAL
  zh: 5. 为男性重复第4个练习。
- en: 6\. We can actually combine both summaries for exercises 4 and 5 into one line
    of code. This is because `group_by` permits us to group by more than one variable.
    Obtain one big summary table using `group_by(AgeDecade, Gender)`.
  id: totrans-181
  prefs: []
  type: TYPE_NORMAL
  zh: 6. 我们实际上可以将第4和第5个练习的摘要合并为一行代码。这是因为`group_by`允许我们按多个变量分组。使用`group_by(AgeDecade,
    Gender)`获取一个大的汇总表。
- en: 7\. For males between the ages of 40-49, compare systolic blood pressure across
    race as reported in the `Race1` variable. Order the resulting table from lowest
    to highest average systolic blood pressure.
  id: totrans-182
  prefs: []
  type: TYPE_NORMAL
  zh: 7. 对于40-49岁的男性，比较`Race1`变量中报告的种族间的收缩压。按平均收缩压从低到高排序结果表。
- en: 4.11 Tibbles
  id: totrans-183
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 4.11 Tibbles
- en: Tidy data must be stored in data frames. We introduced the data frame in Section
    [2.4.1](r-basics.html#data-frames) and have been using the `murders` data frame
    throughout the book. In Section [4.7.3](tidyverse.html#group-by) we introduced
    the `group_by` function, which permits stratifying data before computing summary
    statistics. But where is the group information stored in the data frame?
  id: totrans-184
  prefs: []
  type: TYPE_NORMAL
  zh: 整洁数据必须存储在数据框中。我们在第[2.4.1](r-basics.html#data-frames)节中介绍了数据框，并在整本书中使用了`murders`数据框。在第[4.7.3](tidyverse.html#group-by)节中，我们介绍了`group_by`函数，它允许在计算汇总统计量之前对数据进行分层。但是，分组信息存储在数据框的哪里呢？
- en: '[PRE47]'
  id: totrans-185
  prefs: []
  type: TYPE_PRE
  zh: '[PRE47]'
- en: 'Notice that there are no columns with this information. But, if you look closely
    at the output above, you see the line `A tibble` followd by dimensions. We can
    learn the class of the returned object using:'
  id: totrans-186
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，没有列包含此类信息。但是，如果你仔细查看上面的输出，你会看到`A tibble`后面跟着维度。我们可以使用以下方法来了解返回对象的类别：
- en: '[PRE48]'
  id: totrans-187
  prefs: []
  type: TYPE_PRE
  zh: '[PRE48]'
- en: 'The `tbl`, pronounced tibble, is a special kind of data frame. The functions
    `group_by` and `summarize` always return this type of data frame. The `group_by`
    function returns a special kind of `tbl`, the `grouped_df`. We will say more about
    these later. For consistency, the **dplyr** manipulation verbs (`select`, `filter`,
    `mutate`, and `arrange`) preserve the class of the input: if they receive a regular
    data frame they return a regular data frame, while if they receive a tibble they
    return a tibble. But tibbles are the preferred format in the tidyverse and as
    a result tidyverse functions that produce a data frame from scratch return a tibble.
    For example, in Chapter [5](importing-data.html#importing-data) we will see that
    tidyverse functions used to import data create tibbles.'
  id: totrans-188
  prefs: []
  type: TYPE_NORMAL
  zh: '`tbl`，发音为`tibble`，是一种特殊类型的数据框。函数`group_by`和`summarize`总是返回这种类型的数据框。`group_by`函数返回一种特殊的`tbl`，即`grouped_df`。我们稍后会详细介绍这些内容。为了保持一致性，**dplyr**操作符（`select`、`filter`、`mutate`和`arrange`）保留输入数据的类别：如果它们接收一个常规数据框，则返回一个常规数据框；如果它们接收一个`tibble`，则返回一个`tibble`。但是，在tidyverse中，`tibble`是首选格式，因此tidyverse函数从零开始生成数据框时返回`tibble`。例如，在第[5](importing-data.html#importing-data)章中，我们将看到tidyverse函数用于导入数据时创建`tibble`。'
- en: Tibbles are very similar to data frames. In fact, you can think of them as a
    modern version of data frames. Nonetheless there are three important differences
    which we describe next.
  id: totrans-189
  prefs: []
  type: TYPE_NORMAL
  zh: '`Tibbles`与数据框非常相似。实际上，你可以把它们看作是数据框的现代版本。尽管如此，它们之间有三个重要的区别，我们将在下面描述。'
- en: 4.11.1 Tibbles display better
  id: totrans-190
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 4.11.1 Tibbles display better
- en: The print method for tibbles is more readable than that of a data frame. To
    see this, compare the outputs of typing `murders` and the output of murders if
    we convert it to a tibble. We can do this using `as_tibble(murders)`. If using
    RStudio, output for a tibble adjusts to your window size. To see this, change
    the width of your R console and notice how more/less columns are shown.
  id: totrans-191
  prefs: []
  type: TYPE_NORMAL
  zh: tibbles 的打印方法比数据框的可读性更好。为了看到这一点，比较一下输入 `murders` 和将 `murders` 转换为 tibble 的输出。我们可以使用
    `as_tibble(murders)` 来做这件事。如果在 RStudio 中使用，tibble 的输出会根据你的窗口大小进行调整。为了看到这一点，改变你的
    R 控制台宽度，注意显示的列数是更多还是更少。
- en: 4.11.2 Subsets of tibbles are tibbles
  id: totrans-192
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 4.11.2 Tibbles 的子集是 tibbles
- en: 'If you subset the columns of a data frame, you may get back an object that
    is not a data frame, such as a vector or scalar. For example:'
  id: totrans-193
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你从数据框的列中提取子集，你可能得到一个不是数据框的对象，比如向量或标量。例如：
- en: '[PRE49]'
  id: totrans-194
  prefs: []
  type: TYPE_PRE
  zh: '[PRE49]'
- en: 'is not a data frame. With tibbles this does not happen:'
  id: totrans-195
  prefs: []
  type: TYPE_NORMAL
  zh: 不是一个数据框。在 tibbles 中这种情况不会发生：
- en: '[PRE50]'
  id: totrans-196
  prefs: []
  type: TYPE_PRE
  zh: '[PRE50]'
- en: This is useful in the tidyverse since functions require data frames as input.
  id: totrans-197
  prefs: []
  type: TYPE_NORMAL
  zh: 这在 tidyverse 中很有用，因为函数需要数据框作为输入。
- en: 'With tibbles, if you want to access the vector that defines a column, and not
    get back a data frame, you need to use the accessor `$`:'
  id: totrans-198
  prefs: []
  type: TYPE_NORMAL
  zh: 使用 tibbles，如果你想访问定义列的向量，而不是得到一个数据框，你需要使用访问器 `$`：
- en: '[PRE51]'
  id: totrans-199
  prefs: []
  type: TYPE_PRE
  zh: '[PRE51]'
- en: 'A related feature is that tibbles will give you a warning if you try to access
    a column that does not exist. If we accidentally write `Population` instead of
    `population` this:'
  id: totrans-200
  prefs: []
  type: TYPE_NORMAL
  zh: 一个相关特性是，如果你尝试访问一个不存在的列，tibbles会给你一个警告。如果我们不小心将`Population`写成`population`而不是这样：
- en: '[PRE52]'
  id: totrans-201
  prefs: []
  type: TYPE_PRE
  zh: '[PRE52]'
- en: 'returns a `NULL` with no warning, which can make it harder to debug. In contrast,
    if we try this with a tibble we get an informative warning:'
  id: totrans-202
  prefs: []
  type: TYPE_NORMAL
  zh: 返回一个没有警告的 `NULL`，这可能会使调试更加困难。相比之下，如果我们尝试使用 tibble 做同样的事情，我们会得到一个信息丰富的警告：
- en: '[PRE53]'
  id: totrans-203
  prefs: []
  type: TYPE_PRE
  zh: '[PRE53]'
- en: 4.11.3 Tibbles can have complex entries
  id: totrans-204
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 4.11.3 Tibbles 可以有复杂的条目
- en: 'While data frame columns need to be vectors of numbers, strings, or logical
    values, tibbles can have more complex objects, such as lists or functions. Also,
    we can create tibbles with functions:'
  id: totrans-205
  prefs: []
  type: TYPE_NORMAL
  zh: 当数据框的列需要是数字、字符串或逻辑值的向量时，tibbles 可以有更复杂的对象，例如列表或函数。此外，我们还可以使用函数创建 tibbles：
- en: '[PRE54]'
  id: totrans-206
  prefs: []
  type: TYPE_PRE
  zh: '[PRE54]'
- en: 4.11.4 Tibbles can be grouped
  id: totrans-207
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 4.11.4 Tibbles 可以分组
- en: 'The function `group_by` returns a special kind of tibble: a grouped tibble.
    This class stores information that lets you know which rows are in which groups.
    The tidyverse functions, in particular the `summarize` function, are aware of
    the group information.'
  id: totrans-208
  prefs: []
  type: TYPE_NORMAL
  zh: '`group_by` 函数返回一种特殊的 tibble：分组 tibble。这个类存储了让你知道哪些行属于哪个组的信息。tidyverse 函数，特别是
    `summarize` 函数，都了解分组信息。'
- en: 4.11.5 Create a tibble using `tibble` instead of `data.frame`
  id: totrans-209
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 4.11.5 使用 `tibble` 而不是 `data.frame` 创建 tibble
- en: It is sometimes useful for us to create our own data frames. To create a data
    frame in the tibble format, you can do this by using the `tibble` function.
  id: totrans-210
  prefs: []
  type: TYPE_NORMAL
  zh: 有时我们创建自己的数据框很有用。要创建 tibble 格式的数据框，你可以通过使用 `tibble` 函数来完成。
- en: '[PRE55]'
  id: totrans-211
  prefs: []
  type: TYPE_PRE
  zh: '[PRE55]'
- en: Note that base R (without packages loaded) has a function with a very similar
    name, `data.frame`, that can be used to create a regular data frame rather than
    a tibble.
  id: totrans-212
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，基础 R（未加载包）有一个非常相似名称的函数，`data.frame`，它可以用来创建一个常规数据框而不是 tibble。
- en: '[PRE56]'
  id: totrans-213
  prefs: []
  type: TYPE_PRE
  zh: '[PRE56]'
- en: To convert a regular data frame to a tibble, you can use the `as_tibble` function.
  id: totrans-214
  prefs: []
  type: TYPE_NORMAL
  zh: 要将常规数据框转换为 tibble，你可以使用 `as_tibble` 函数。
- en: '[PRE57]'
  id: totrans-215
  prefs: []
  type: TYPE_PRE
  zh: '[PRE57]'
- en: 4.12 The placeholder
  id: totrans-216
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 4.12 占位符
- en: 'One of the advantages of using the pipe `|>` is that we do not have to keep
    naming new objects as we manipulate the data frame. The object on the left-hand
    side of the pipe is used as the first argument of the function on the right-hand
    side of the pipe. But what if we want to pass it as argument to the right-hand
    side function that is not the first? The answer is the placeholder operator `_`
    (for the `%>%` pipe the placeholder is `.`). Below is a simple example that passes
    the `base` argument to the `log` function. The following three are equivalent:'
  id: totrans-217
  prefs: []
  type: TYPE_NORMAL
  zh: 使用管道 `|>` 的一大优点是，我们在操作数据框时不需要不断为新对象命名。管道左侧的对象被用作管道右侧函数的第一个参数。但如果我们想将其作为非第一个参数传递给右侧的函数怎么办？答案是占位符运算符
    `_`（对于 `%>%` 管道，占位符是 `.`）。下面是一个简单的例子，它将 `base` 参数传递给 `log` 函数。以下三个是等价的：
