- en: 4.13 The **purrr** package
  id: totrans-219
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 4.13 **purrr** 包
- en: 'In Section [3.5](programming-basics.html#vectorization) we learned about the
    `sapply` function, which permitted us to apply the same function to each element
    of a vector. We constructed a function and used `sapply` to compute the sum of
    the first `n` integers for several values of `n` like this:'
  id: totrans-220
  prefs: []
  type: TYPE_NORMAL
  zh: 在第 [3.5](programming-basics.html#vectorization) 节中，我们学习了 `sapply` 函数，它允许我们将相同的函数应用于向量的每个元素。我们构建了一个函数，并使用
    `sapply` 来计算 `n` 的几个值的第一 `n` 个整数的和，如下所示：
- en: '[PRE59]'
  id: totrans-221
  prefs: []
  type: TYPE_PRE
  zh: '[PRE59]'
- en: 'This type of operation, applying the same function or procedure to elements
    of an object, is quite common in data analysis. The **purrr** package includes
    functions similar to `sapply` but that better interact with other tidyverse functions.
    The main advantage is that we can better control the output type of functions.
    In contrast, `sapply` can return several different object types; for example,
    we might expect a numeric result from a line of code, but `sapply` might convert
    our result to character under some circumstances. **purrr** functions will never
    do this: they will return objects of a specified type or return an error if this
    is not possible.'
  id: totrans-222
  prefs: []
  type: TYPE_NORMAL
  zh: 这种类型的操作，将相同的函数或过程应用于对象中的元素，在数据分析中相当常见。**purrr** 包包括类似于 `sapply` 的函数，但与 tidyverse
    的其他函数更好地交互。主要优势是我们可以更好地控制函数的输出类型。相比之下，`sapply` 可以返回几种不同的对象类型；例如，我们可能期望一行代码的结果是数值，但在某些情况下
    `sapply` 可能会将我们的结果转换为字符。**purrr** 函数永远不会这样做：它们将返回指定类型的对象，或者在不可能的情况下返回错误。
- en: 'The first **purrr** function we will learn is `map`, which works very similar
    to `sapply` but always, without exception, returns a list:'
  id: totrans-223
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将要学习的第一个 **purrr** 函数是 `map`，它的工作方式与 `sapply` 非常相似，但总是，没有例外，返回一个列表：
- en: '[PRE60]'
  id: totrans-224
  prefs: []
  type: TYPE_PRE
  zh: '[PRE60]'
- en: If we want a numeric vector, we can instead use `map_dbl` which always returns
    a vector of numeric values.
  id: totrans-225
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们想要一个数值向量，我们可以改用 `map_dbl`，它总是返回一个数值向量。
- en: '[PRE61]'
  id: totrans-226
  prefs: []
  type: TYPE_PRE
  zh: '[PRE61]'
- en: This produces the same results as the `sapply` call shown above.
  id: totrans-227
  prefs: []
  type: TYPE_NORMAL
  zh: 这会产生与上面显示的 `sapply` 调用相同的结果。
- en: 'A particularly useful **purrr** function for interacting with the rest of the
    tidyverse is `map_df`, which always returns a tibble data frame. However, the
    function being called needs to return a vector or a list with names. For this
    reason, the following code would result in a `Argument 1 must have names` error:'
  id: totrans-228
  prefs: []
  type: TYPE_NORMAL
  zh: 一个特别有用的与 tidyverse 其他部分交互的 **purrr** 函数是 `map_df`，它总是返回一个 tibble 数据框。然而，被调用的函数需要返回一个带有名称的向量或列表。因此，以下代码会导致“参数
    1 必须有名称”错误：
- en: '[PRE62]'
  id: totrans-229
  prefs: []
  type: TYPE_PRE
  zh: '[PRE62]'
- en: 'We need to change the function to make this work:'
  id: totrans-230
  prefs: []
  type: TYPE_NORMAL
  zh: 我们需要更改函数才能使其工作：
- en: '[PRE63]'
  id: totrans-231
  prefs: []
  type: TYPE_PRE
  zh: '[PRE63]'
- en: The **purrr** package provides much more functionality not covered here. For
    more details you can consult [this online resource](https://jennybc.github.io/purrr-tutorial/).
  id: totrans-232
  prefs: []
  type: TYPE_NORMAL
  zh: '**purrr** 包提供了许多这里没有涵盖的功能。更多详情，您可以参考 [这个在线资源](https://jennybc.github.io/purrr-tutorial/)。'
- en: 4.14 Tidyverse conditionals
  id: totrans-233
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 4.14 Tidyverse 条件操作
- en: A typical data analysis will often involve one or more conditional operations.
    In Section [3.1](programming-basics.html#conditionals) we described the `ifelse`
    function, which we will use extensively in this book. In this section we present
    two **dplyr** functions that provide further functionality for performing conditional
    operations.
  id: totrans-234
  prefs: []
  type: TYPE_NORMAL
  zh: 典型的数据分析通常涉及一个或多个条件操作。在第 [3.1](programming-basics.html#conditionals) 节中，我们介绍了
    `ifelse` 函数，我们将在本书中广泛使用它。在本节中，我们介绍了两个提供进一步功能以执行条件操作的 **dplyr** 函数。
- en: 4.14.1 `case_when`
  id: totrans-235
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 4.14.1 `case_when`
- en: 'The `case_when` function is useful for vectorizing conditional statements.
    It is similar to `ifelse` but can output any number of values, as opposed to just
    `TRUE` or `FALSE`. Here is an example splitting numbers into negative, positive,
    and 0:'
  id: totrans-236
  prefs: []
  type: TYPE_NORMAL
  zh: '`case_when` 函数对于向量化条件语句很有用。它与 `ifelse` 类似，但可以输出任意数量的值，而不仅仅是 `TRUE` 或 `FALSE`。以下是一个将数字分为负数、正数和
    0 的示例：'
- en: '[PRE64]'
  id: totrans-237
  prefs: []
  type: TYPE_PRE
  zh: '[PRE64]'
- en: 'A common use for this function is to define categorical variables based on
    existing variables. For example, suppose we want to compare the murder rates in
    four groups of states: *New England*, *West Coast*, *South*, and *other*. For
    each state, we need to ask if it is in New England, if it is not we ask if it
    is in the West Coast, if not we ask if it is in the South, and if not we assign
    *other*. Here is how we use `case_when` to do this:'
  id: totrans-238
  prefs: []
  type: TYPE_NORMAL
  zh: 这个函数的一个常见用途是基于现有变量定义分类变量。例如，假设我们想要比较四个州组（新英格兰、西海岸、南部和其他）的谋杀率。对于每个州，我们需要询问它是否在新英格兰，如果不是，我们询问它是否在西海岸，如果不是，我们询问它是否在南部，如果不是，我们将其分配为“其他”。以下是使用
    `case_when` 来执行此操作的示例：
