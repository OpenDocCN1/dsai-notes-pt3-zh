- en: Chapter 4 The tidyverse
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook/tidyverse.html](https://rafalab.dfci.harvard.edu/dsbook/tidyverse.html)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: Up to now we have been manipulating vectors by reordering and subsetting them
    through indexing. However, once we start more advanced analyses, the preferred
    unit for data storage is not the vector but the data frame. In this chapter we
    learn to work directly with data frames, which greatly facilitate the organization
    of information. We will be using data frames for the majority of this book. We
    will focus on a specific data format referred to as *tidy* and on specific collection
    of packages that are particularly helpful for working with *tidy* data referred
    to as the *tidyverse*.
  prefs: []
  type: TYPE_NORMAL
- en: 'We can load all the tidyverse packages at once by installing and loading the
    **tidyverse** package:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: We will learn how to implement the tidyverse approach throughout the book, but
    before delving into the details, in this chapter we introduce some of the most
    widely used tidyverse functionality, starting with the **dplyr** package for manipulating
    data frames and the **purrr** package for working with functions. Note that the
    tidyverse also includes a graphing package, **ggplot2**, which we introduce later
    in Chapter [8](ggplot2.html#ggplot2) in the Data Visualization part of the book;
    the **readr** package discussed in Chapter [5](importing-data.html#importing-data);
    and many others. In this chapter, we first introduce the concept of *tidy data*
    and then demonstrate how we use the tidyverse to work with data frames in this
    format.
  prefs: []
  type: TYPE_NORMAL
- en: 4.1 Tidy data
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: We say that a data table is in *tidy* format if each row represents one observation
    and columns represent the different variables available for each of these observations.
    The `murders` dataset is an example of a tidy data frame.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: 'Each row represent a state with each of the five columns providing a different
    variable related to these states: name, abbreviation, region, population, and
    total murders.'
  prefs: []
  type: TYPE_NORMAL
- en: 'To see how the same information can be provided in different formats, consider
    the following example:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: 'This tidy dataset provides fertility rates for two countries across the years.
    This is a tidy dataset because each row presents one observation with the three
    variables being country, year, and fertility rate. However, this dataset originally
    came in another format and was reshaped for the **dslabs** package. Originally,
    the data was in the following format:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: 'The same information is provided, but there are two important differences in
    the format: 1) each row includes several observations and 2) one of the variables,
    year, is stored in the header. For the tidyverse packages to be optimally used,
    data need to be reshaped into `tidy` format, which you will learn to do in the
    Data Wrangling part of the book. Until then, we will use example datasets that
    are already in tidy format.'
  prefs: []
  type: TYPE_NORMAL
- en: Although not immediately obvious, as you go through the book you will start
    to appreciate the advantages of working in a framework in which functions use
    tidy formats for both inputs and outputs. You will see how this permits the data
    analyst to focus on more important aspects of the analysis rather than the format
    of the data.
  prefs: []
  type: TYPE_NORMAL
- en: 4.2 Exercises
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '1\. Examine the built-in dataset `co2`. Which of the following is true:'
  prefs: []
  type: TYPE_NORMAL
- en: '`co2` is tidy data: it has one year for each row.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`co2` is not tidy: we need at least one column with a character vector.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`co2` is not tidy: it is a matrix instead of a data frame.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`co2` is not tidy: to be tidy we would have to wrangle it to have three columns
    (year, month and value), then each co2 observation would have a row.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '2\. Examine the built-in dataset `ChickWeight`. Which of the following is true:'
  prefs: []
  type: TYPE_NORMAL
- en: '`ChickWeight` is not tidy: each chick has more than one row.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`ChickWeight` is tidy: each observation (a weight) is represented by one row.
    The chick from which this measurement came is one of the variables.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`ChickWeight` is not tidy: we are missing the year column.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`ChickWeight` is tidy: it is stored in a data frame.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '3\. Examine the built-in dataset `BOD`. Which of the following is true:'
  prefs: []
  type: TYPE_NORMAL
- en: '`BOD` is not tidy: it only has six rows.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`BOD` is not tidy: the first column is just an index.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`BOD` is tidy: each row is an observation with two values (time and demand)'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`BOD` is tidy: all small datasets are tidy by definition.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '4\. Which of the following built-in datasets is tidy (you can pick more than
    one):'
  prefs: []
  type: TYPE_NORMAL
- en: '`BJsales`'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`EuStockMarkets`'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`DNase`'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`Formaldehyde`'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`Orange`'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`UCBAdmissions`'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 4.3 Manipulating data frames
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: The **dplyr** package from the **tidyverse** introduces functions that perform
    some of the most common operations when working with data frames and uses names
    for these functions that are relatively easy to remember. For instance, to change
    the data table by adding a new column, we use `mutate`. To filter the data table
    to a subset of rows, we use `filter`. Finally, to subset the data by selecting
    specific columns, we use `select`.
  prefs: []
  type: TYPE_NORMAL
- en: 4.3.1 Adding a column with `mutate`
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'We want all the necessary information for our analysis to be included in the
    data table. So the first task is to add the murder rates to our murders data frame.
    The function `mutate` takes the data frame as a first argument and the name and
    values of the variable as a second argument using the convention `name = values`.
    So, to add murder rates, we use:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE4]'
  prefs: []
  type: TYPE_PRE
- en: Notice that here we used `total` and `population` inside the function, which
    are objects that are **not** defined in our workspace. But why don’t we get an
    error?
  prefs: []
  type: TYPE_NORMAL
- en: This is one of **dplyr**’s main features. Functions in this package, such as
    `mutate`, know to look for variables in the data frame provided in the first argument.
    In the call to mutate above, `total` will have the values in `murders$total`.
    This approach makes the code much more readable.
  prefs: []
  type: TYPE_NORMAL
- en: 'We can see that the new column is added:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE5]'
  prefs: []
  type: TYPE_PRE
- en: Although we have overwritten the original `murders` object, this does not change
    the object that loaded with `data(murders)`. If we load the `murders` data again,
    the original will overwrite our mutated version.
  prefs: []
  type: TYPE_NORMAL
- en: 4.3.2 Subsetting with `filter`
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Now suppose that we want to filter the data table to only show the entries for
    which the murder rate is lower than 0.71\. To do this we use the `filter` function,
    which takes the data table as the first argument and then the conditional statement
    as the second. Like `mutate`, we can use the unquoted variable names from `murders`
    inside the function and it will know we mean the columns and not objects in the
    workspace.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE6]'
  prefs: []
  type: TYPE_PRE
- en: 4.3.3 Selecting columns with `select`
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Although our data table only has six columns, some data tables include hundreds.
    If we want to view just a few, we can use the **dplyr** `select` function. In
    the code below we select three columns, assign this to a new object and then filter
    the new object:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE7]'
  prefs: []
  type: TYPE_PRE
- en: In the call to `select`, the first argument `murders` is an object, but `state`,
    `region`, and `rate` are variable names.
  prefs: []
  type: TYPE_NORMAL
- en: 4.4 Exercises
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 1\. Load the **dplyr** package and the murders dataset.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE8]'
  prefs: []
  type: TYPE_PRE
- en: 'You can add columns using the **dplyr** function `mutate`. This function is
    aware of the column names and inside the function you can call them unquoted:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE9]'
  prefs: []
  type: TYPE_PRE
- en: We can write `population` rather than `murders$population`. The function `mutate`
    knows we are grabbing columns from `murders`.
  prefs: []
  type: TYPE_NORMAL
- en: Use the function `mutate` to add a murders column named `rate` with the per
    100,000 murder rate as in the example code above. Make sure you redefine `murders`
    as done in the example code above ( murders <- [your code]) so we can keep using
    this variable.
  prefs: []
  type: TYPE_NORMAL
- en: 2\. If `rank(x)` gives you the ranks of `x` from lowest to highest, `rank(-x)`
    gives you the ranks from highest to lowest. Use the function `mutate` to add a
    column `rank` containing the rank, from highest to lowest murder rate. Make sure
    you redefine `murders` so we can keep using this variable.
  prefs: []
  type: TYPE_NORMAL
- en: '3\. With **dplyr**, we can use `select` to show only certain columns. For example,
    with this code we would only show the states and population sizes:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]'
  prefs: []
  type: TYPE_PRE
- en: Use `select` to show the state names and abbreviations in `murders`. Do not
    redefine `murders`, just show the results.
  prefs: []
  type: TYPE_NORMAL
- en: '4\. The **dplyr** function `filter` is used to choose specific rows of the
    data frame to keep. Unlike `select` which is for columns, `filter` is for rows.
    For example, you can show just the New York row like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]'
  prefs: []
  type: TYPE_PRE
- en: You can use other logical vectors to filter rows.
  prefs: []
  type: TYPE_NORMAL
- en: Use `filter` to show the top 5 states with the highest murder rates. After we
    add murder rate and rank, do not change the murders dataset, just show the result.
    Remember that you can filter based on the `rank` column.
  prefs: []
  type: TYPE_NORMAL
- en: '5\. We can remove rows using the `!=` operator. For example, to remove Florida,
    we would do this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE12]'
  prefs: []
  type: TYPE_PRE
- en: Create a new data frame called `no_south` that removes states from the South
    region. How many states are in this category? You can use the function `nrow`
    for this.
  prefs: []
  type: TYPE_NORMAL
- en: '6\. We can also use `%in%` to filter with **dplyr**. You can therefore see
    the data from New York and Texas like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE13]'
  prefs: []
  type: TYPE_PRE
- en: Create a new data frame called `murders_nw` with only the states from the Northeast
    and the West. How many states are in this category?
  prefs: []
  type: TYPE_NORMAL
- en: 7\. Suppose you want to live in the Northeast or West **and** want the murder
    rate to be less than 1\. We want to see the data for the states satisfying these
    options. Note that you can use logical operators with `filter`. Here is an example
    in which we filter to keep only small states in the Northeast region.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE14]'
  prefs: []
  type: TYPE_PRE
- en: 'Make sure `murders` has been defined with `rate` and `rank` and still has all
    states. Create a table called `my_states` that contains rows for states satisfying
    both the conditions: it is in the Northeast or West and the murder rate is less
    than 1\. Use `select` to show only the state name, the rate, and the rank.'
  prefs: []
  type: TYPE_NORMAL
- en: '4.5 The pipe: `|>` or `%>%`'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'In R we can perform a series of operations, for example `select` and then `filter`,
    by sending the results of one function to another using what is called the *pipe
    operator*: `|>`. This feature is available starting with R version 4.1.0, but
    before that, the tidyverse used the `%>%` operator made available by the `magrittr`
    package. Some details are included below.'
  prefs: []
  type: TYPE_NORMAL
- en: 'We wrote code above to show three variables (state, region, rate) for states
    that have murder rates below 0.71\. To do this, we defined the intermediate object
    `new_table`. In **dplyr** we can write code that looks more like a description
    of what we want to do without intermediate objects:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ \mbox{original data } \rightarrow \mbox{ select } \rightarrow \mbox{ filter
    } \]
  prefs: []
  type: TYPE_NORMAL
- en: 'For such an operation, we can use the pipe `|>`. The code looks like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE15]'
  prefs: []
  type: TYPE_PRE
- en: This line of code is equivalent to the two lines of code above. What is going
    on here?
  prefs: []
  type: TYPE_NORMAL
- en: 'In general, the pipe *sends* the result of the left side of the pipe to be
    the first argument of the function on the right side of the pipe. Here is a very
    simple example:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE16]'
  prefs: []
  type: TYPE_PRE
- en: 'We can continue to pipe values along:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE17]'
  prefs: []
  type: TYPE_PRE
- en: The above statement is equivalent to `log2(sqrt(16))`.
  prefs: []
  type: TYPE_NORMAL
- en: 'Remember that the pipe sends values to the first argument, so we can define
    other arguments as if the first argument is already defined:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE18]'
  prefs: []
  type: TYPE_PRE
- en: 'Therefore, when using the pipe with data frames and **dplyr**, we no longer
    need to specify the required first argument since the **dplyr** functions we have
    described all take the data as the first argument. In the code we wrote:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE19]'
  prefs: []
  type: TYPE_PRE
- en: '`murders` is the first argument of the `select` function, and the new data
    frame (formerly `new_table`) is the first argument of the `filter` function.'
  prefs: []
  type: TYPE_NORMAL
- en: Note that the pipe works well with functions where the first argument is the
    input data. Functions in **tidyverse** packages like **dplyr** have this format
    and can be used easily with the pipe.
  prefs: []
  type: TYPE_NORMAL
- en: 4.6 Exercises
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 1\. The pipe `|>` can be used to perform operations sequentially without having
    to define intermediate objects. Start by redefining murder to include rate and
    rank.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE20]'
  prefs: []
  type: TYPE_PRE
- en: 'In the solution to the previous exercise, we did the following:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE21]'
  prefs: []
  type: TYPE_PRE
- en: 'The pipe `|>` permits us to perform both operations sequentially without having
    to define an intermediate variable `my_states`. We therefore could have mutated
    and selected in the same line like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE22]'
  prefs: []
  type: TYPE_PRE
- en: Notice that `select` no longer has a data frame as the first argument. The first
    argument is assumed to be the result of the operation conducted right before the
    `|>`.
  prefs: []
  type: TYPE_NORMAL
- en: Repeat the previous exercise, but now instead of creating a new object, show
    the result and only include the state, rate, and rank columns. Use a pipe `|>`
    to do this in just one line.
  prefs: []
  type: TYPE_NORMAL
- en: '2\. Reset `murders` to the original table by using `data(murders)`. Use a pipe
    to create a new data frame called `my_states` that considers only states in the
    Northeast or West which have a murder rate lower than 1, and contains only the
    state, rate and rank columns. The pipe should also have four components separated
    by three `|>`. The code should look something like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE23]'
  prefs: []
  type: TYPE_PRE
- en: 4.7 Summarizing data
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'An important part of exploratory data analysis is summarizing data. The average
    and standard deviation are two examples of widely used summary statistics. More
    informative summaries can often be achieved by first splitting data into groups.
    In this section, we cover two new **dplyr** verbs that make these computations
    easier: `summarize` and `group_by`. We learn to access resulting values using
    the `pull` function.'
  prefs: []
  type: TYPE_NORMAL
- en: 4.7.1 `summarize`
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: The `summarize` function in **dplyr** provides a way to compute summary statistics
    with intuitive and readable code. We start with a simple example based on heights.
    The `heights` dataset includes heights and sex reported by students in an in-class
    survey.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE24]'
  prefs: []
  type: TYPE_PRE
- en: 'The following code computes the average and standard deviation for females:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE25]'
  prefs: []
  type: TYPE_PRE
- en: This takes our original data table as input, filters it to keep only females,
    and then produces a new summarized table with just the average and the standard
    deviation of heights. We get to choose the names of the columns of the resulting
    table. For example, above we decided to use `average` and `standard_deviation`,
    but we could have used other names just the same.
  prefs: []
  type: TYPE_NORMAL
- en: 'Because the resulting table stored in `s` is a data frame, we can access the
    components with the accessor `$`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE26]'
  prefs: []
  type: TYPE_PRE
- en: As with most other **dplyr** functions, `summarize` is aware of the variable
    names and we can use them directly. So when inside the call to the `summarize`
    function we write `mean(height)`, the function is accessing the column with the
    name “height” and then computing the average of the resulting numeric vector.
    We can compute any other summary that operates on vectors and returns a single
    value.
  prefs: []
  type: TYPE_NORMAL
- en: 'For another example of how we can use the `summarize` function, let’s compute
    the average murder rate for the United States. Remember our data table includes
    total murders and population size for each state and we have already used **dplyr**
    to add a murder rate column:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE27]'
  prefs: []
  type: TYPE_PRE
- en: 'Remember that the US murder rate is **not** the average of the state murder
    rates:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE28]'
  prefs: []
  type: TYPE_PRE
- en: 'This is because in the computation above the small states are given the same
    weight as the large ones. The US murder rate is the total number of murders in
    the US divided by the total US population. So the correct computation is:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE29]'
  prefs: []
  type: TYPE_PRE
- en: This computation counts larger states proportionally to their size which results
    in a larger value.
  prefs: []
  type: TYPE_NORMAL
- en: 4.7.2 Multiple summaries
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Suppose we want three summaries from the same variable such as the median,
    minimum, and maximum heights. The `quantile` function: `quantile(x, c(0.5, 0,
    1))` returns the median (50th percentile), the min (0th percentile), and max (100th
    percentile) of the vector `x`. We can use it with `summarize` like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE30]'
  prefs: []
  type: TYPE_PRE
- en: 'However, notice that the summaries are returned in a row each. To obtain the
    results in different columns, we have to define a function that returns a data
    frame like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE31]'
  prefs: []
  type: TYPE_PRE
- en: In the next section we learn how useful this approach can be when summarizing
    by group.
  prefs: []
  type: TYPE_NORMAL
- en: 4.7.3 Group then summarize with `group_by`
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: A common operation in data exploration is to first split data into groups and
    then compute summaries for each group. For example, we may want to compute the
    average and standard deviation for men’s and women’s heights separately. The `group_by`
    function helps us do this.
  prefs: []
  type: TYPE_NORMAL
- en: 'If we type this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE32]'
  prefs: []
  type: TYPE_PRE
- en: 'The result does not look very different from `heights`, except we see `Groups:
    sex [2]` when we print the object. Although not immediately obvious from its appearance,
    this is now a special data frame called a *grouped data frame*, and **dplyr**
    functions, in particular `summarize`, will behave differently when acting on this
    object. Conceptually, you can think of this table as many tables, with the same
    columns but not necessarily the same number of rows, stacked together in one object.
    When we summarize the data after grouping, this is what happens:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE33]'
  prefs: []
  type: TYPE_PRE
- en: The `summarize` function applies the summarization to each group separately.
  prefs: []
  type: TYPE_NORMAL
- en: 'For another example, let’s compute the median, minimum, and maximum murder
    rate in the four regions of the country using the `median_min_max` defined above:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE34]'
  prefs: []
  type: TYPE_PRE
- en: 4.8 `pull`
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'The `us_murder_rate` object defined above represents just one number. Yet we
    are storing it in a data frame:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE35]'
  prefs: []
  type: TYPE_PRE
- en: since, as most **dplyr** functions, `summarize` always returns a data frame.
  prefs: []
  type: TYPE_NORMAL
- en: 'This might be problematic if we want to use this result with functions that
    require a numeric value. Here we show a useful trick for accessing values stored
    in data when using pipes: when a data object is piped that object and its columns
    can be accessed using the `pull` function. To understand what we mean take a look
    at this line of code:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE36]'
  prefs: []
  type: TYPE_PRE
- en: This returns the value in the `rate` column of `us_murder_rate` making it equivalent
    to `us_murder_rate$rate`.
  prefs: []
  type: TYPE_NORMAL
- en: 'To get a number from the original data table with one line of code we can type:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE37]'
  prefs: []
  type: TYPE_PRE
- en: 'which is now a numeric:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE38]'
  prefs: []
  type: TYPE_PRE
- en: 4.9 Sorting data frames
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'When examining a dataset, it is often convenient to sort the table by the different
    columns. We know about the `order` and `sort` function, but for ordering entire
    tables, the **dplyr** function `arrange` is useful. For example, here we order
    the states by population size:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE39]'
  prefs: []
  type: TYPE_PRE
- en: 'With `arrange` we get to decide which column to sort by. To see the states
    by murder rate, from lowest to highest, we arrange by `rate` instead:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE40]'
  prefs: []
  type: TYPE_PRE
- en: 'Note that the default behavior is to order in ascending order. In **dplyr**,
    the function `desc` transforms a vector so that it is in descending order. To
    sort the table in descending order, we can type:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE41]'
  prefs: []
  type: TYPE_PRE
- en: 4.9.1 Nested sorting
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'If we are ordering by a column with ties, we can use a second column to break
    the tie. Similarly, a third column can be used to break ties between first and
    second and so on. Here we order by `region`, then within region we order by murder
    rate:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE42]'
  prefs: []
  type: TYPE_PRE
- en: 4.9.2 The top \(n\)
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'In the code above, we have used the function `head` to avoid having the page
    fill up with the entire dataset. If we want to see a larger proportion, we can
    use the `top_n` function. This function takes a data frame as it’s first argument,
    the number of rows to show in the second, and the variable to filter by in the
    third. Here is an example of how to see the top 5 rows:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE43]'
  prefs: []
  type: TYPE_PRE
- en: Note that rows are not sorted by `rate`, only filtered. If we want to sort,
    we need to use `arrange`. Note that if the third argument is left blank, `top_n`
    filters by the last column.
  prefs: []
  type: TYPE_NORMAL
- en: 4.10 Exercises
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'For these exercises, we will be using the data from the survey collected by
    the United States National Center for Health Statistics (NCHS). This center has
    conducted a series of health and nutrition surveys since the 1960’s. Starting
    in 1999, about 5,000 individuals of all ages have been interviewed every year
    and they complete the health examination component of the survey. Part of the
    data is made available via the **NHANES** package. Once you install the **NHANES**
    package, you can load the data like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE44]'
  prefs: []
  type: TYPE_PRE
- en: 'The **NHANES** data has many missing values. The `mean` and `sd` functions
    in R will return `NA` if any of the entries of the input vector is an `NA`. Here
    is an example:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE45]'
  prefs: []
  type: TYPE_PRE
- en: 'To ignore the `NA`s we can use the `na.rm` argument:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE46]'
  prefs: []
  type: TYPE_PRE
- en: Let’s now explore the NHANES data.
  prefs: []
  type: TYPE_NORMAL
- en: 1\. We will provide some basic facts about blood pressure. First let’s select
    a group to set the standard. We will use 20-to-29-year-old females. `AgeDecade`
    is a categorical variable with these ages. Note that the category is coded like
    ” 20-29”, with a space in front! What is the average and standard deviation of
    systolic blood pressure as saved in the `BPSysAve` variable? Save it to a variable
    called `ref`.
  prefs: []
  type: TYPE_NORMAL
- en: 'Hint: Use `filter` and `summarize` and use the `na.rm = TRUE` argument when
    computing the average and standard deviation. You can also filter the NA values
    using `filter`.'
  prefs: []
  type: TYPE_NORMAL
- en: '2\. Using a pipe, assign the average to a numeric variable `ref_avg`. Hint:
    Use the code similar to above and then `pull`.'
  prefs: []
  type: TYPE_NORMAL
- en: 3\. Now report the min and max values for the same group.
  prefs: []
  type: TYPE_NORMAL
- en: '4\. Compute the average and standard deviation for females, but for each age
    group separately rather than a selected decade as in question 1\. Note that the
    age groups are defined by `AgeDecade`. Hint: rather than filtering by age and
    gender, filter by `Gender` and then use `group_by`.'
  prefs: []
  type: TYPE_NORMAL
- en: 5\. Repeat exercise 4 for males.
  prefs: []
  type: TYPE_NORMAL
- en: 6\. We can actually combine both summaries for exercises 4 and 5 into one line
    of code. This is because `group_by` permits us to group by more than one variable.
    Obtain one big summary table using `group_by(AgeDecade, Gender)`.
  prefs: []
  type: TYPE_NORMAL
- en: 7\. For males between the ages of 40-49, compare systolic blood pressure across
    race as reported in the `Race1` variable. Order the resulting table from lowest
    to highest average systolic blood pressure.
  prefs: []
  type: TYPE_NORMAL
- en: 4.11 Tibbles
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Tidy data must be stored in data frames. We introduced the data frame in Section
    [2.4.1](r-basics.html#data-frames) and have been using the `murders` data frame
    throughout the book. In Section [4.7.3](tidyverse.html#group-by) we introduced
    the `group_by` function, which permits stratifying data before computing summary
    statistics. But where is the group information stored in the data frame?
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE47]'
  prefs: []
  type: TYPE_PRE
- en: 'Notice that there are no columns with this information. But, if you look closely
    at the output above, you see the line `A tibble` followd by dimensions. We can
    learn the class of the returned object using:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE48]'
  prefs: []
  type: TYPE_PRE
- en: 'The `tbl`, pronounced tibble, is a special kind of data frame. The functions
    `group_by` and `summarize` always return this type of data frame. The `group_by`
    function returns a special kind of `tbl`, the `grouped_df`. We will say more about
    these later. For consistency, the **dplyr** manipulation verbs (`select`, `filter`,
    `mutate`, and `arrange`) preserve the class of the input: if they receive a regular
    data frame they return a regular data frame, while if they receive a tibble they
    return a tibble. But tibbles are the preferred format in the tidyverse and as
    a result tidyverse functions that produce a data frame from scratch return a tibble.
    For example, in Chapter [5](importing-data.html#importing-data) we will see that
    tidyverse functions used to import data create tibbles.'
  prefs: []
  type: TYPE_NORMAL
- en: Tibbles are very similar to data frames. In fact, you can think of them as a
    modern version of data frames. Nonetheless there are three important differences
    which we describe next.
  prefs: []
  type: TYPE_NORMAL
- en: 4.11.1 Tibbles display better
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: The print method for tibbles is more readable than that of a data frame. To
    see this, compare the outputs of typing `murders` and the output of murders if
    we convert it to a tibble. We can do this using `as_tibble(murders)`. If using
    RStudio, output for a tibble adjusts to your window size. To see this, change
    the width of your R console and notice how more/less columns are shown.
  prefs: []
  type: TYPE_NORMAL
- en: 4.11.2 Subsets of tibbles are tibbles
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'If you subset the columns of a data frame, you may get back an object that
    is not a data frame, such as a vector or scalar. For example:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE49]'
  prefs: []
  type: TYPE_PRE
- en: 'is not a data frame. With tibbles this does not happen:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE50]'
  prefs: []
  type: TYPE_PRE
- en: This is useful in the tidyverse since functions require data frames as input.
  prefs: []
  type: TYPE_NORMAL
- en: 'With tibbles, if you want to access the vector that defines a column, and not
    get back a data frame, you need to use the accessor `$`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE51]'
  prefs: []
  type: TYPE_PRE
- en: 'A related feature is that tibbles will give you a warning if you try to access
    a column that does not exist. If we accidentally write `Population` instead of
    `population` this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE52]'
  prefs: []
  type: TYPE_PRE
- en: 'returns a `NULL` with no warning, which can make it harder to debug. In contrast,
    if we try this with a tibble we get an informative warning:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE53]'
  prefs: []
  type: TYPE_PRE
- en: 4.11.3 Tibbles can have complex entries
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'While data frame columns need to be vectors of numbers, strings, or logical
    values, tibbles can have more complex objects, such as lists or functions. Also,
    we can create tibbles with functions:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE54]'
  prefs: []
  type: TYPE_PRE
- en: 4.11.4 Tibbles can be grouped
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The function `group_by` returns a special kind of tibble: a grouped tibble.
    This class stores information that lets you know which rows are in which groups.
    The tidyverse functions, in particular the `summarize` function, are aware of
    the group information.'
  prefs: []
  type: TYPE_NORMAL
- en: 4.11.5 Create a tibble using `tibble` instead of `data.frame`
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: It is sometimes useful for us to create our own data frames. To create a data
    frame in the tibble format, you can do this by using the `tibble` function.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE55]'
  prefs: []
  type: TYPE_PRE
- en: Note that base R (without packages loaded) has a function with a very similar
    name, `data.frame`, that can be used to create a regular data frame rather than
    a tibble.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE56]'
  prefs: []
  type: TYPE_PRE
- en: To convert a regular data frame to a tibble, you can use the `as_tibble` function.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE57]'
  prefs: []
  type: TYPE_PRE
- en: 4.12 The placeholder
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'One of the advantages of using the pipe `|>` is that we do not have to keep
    naming new objects as we manipulate the data frame. The object on the left-hand
    side of the pipe is used as the first argument of the function on the right-hand
    side of the pipe. But what if we want to pass it as argument to the right-hand
    side function that is not the first? The answer is the placeholder operator `_`
    (for the `%>%` pipe the placeholder is `.`). Below is a simple example that passes
    the `base` argument to the `log` function. The following three are equivalent:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE58]'
  prefs: []
  type: TYPE_PRE
- en: 4.13 The **purrr** package
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'In Section [3.5](programming-basics.html#vectorization) we learned about the
    `sapply` function, which permitted us to apply the same function to each element
    of a vector. We constructed a function and used `sapply` to compute the sum of
    the first `n` integers for several values of `n` like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE59]'
  prefs: []
  type: TYPE_PRE
- en: 'This type of operation, applying the same function or procedure to elements
    of an object, is quite common in data analysis. The **purrr** package includes
    functions similar to `sapply` but that better interact with other tidyverse functions.
    The main advantage is that we can better control the output type of functions.
    In contrast, `sapply` can return several different object types; for example,
    we might expect a numeric result from a line of code, but `sapply` might convert
    our result to character under some circumstances. **purrr** functions will never
    do this: they will return objects of a specified type or return an error if this
    is not possible.'
  prefs: []
  type: TYPE_NORMAL
- en: 'The first **purrr** function we will learn is `map`, which works very similar
    to `sapply` but always, without exception, returns a list:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE60]'
  prefs: []
  type: TYPE_PRE
- en: If we want a numeric vector, we can instead use `map_dbl` which always returns
    a vector of numeric values.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE61]'
  prefs: []
  type: TYPE_PRE
- en: This produces the same results as the `sapply` call shown above.
  prefs: []
  type: TYPE_NORMAL
- en: 'A particularly useful **purrr** function for interacting with the rest of the
    tidyverse is `map_df`, which always returns a tibble data frame. However, the
    function being called needs to return a vector or a list with names. For this
    reason, the following code would result in a `Argument 1 must have names` error:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE62]'
  prefs: []
  type: TYPE_PRE
- en: 'We need to change the function to make this work:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE63]'
  prefs: []
  type: TYPE_PRE
- en: The **purrr** package provides much more functionality not covered here. For
    more details you can consult [this online resource](https://jennybc.github.io/purrr-tutorial/).
  prefs: []
  type: TYPE_NORMAL
- en: 4.14 Tidyverse conditionals
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: A typical data analysis will often involve one or more conditional operations.
    In Section [3.1](programming-basics.html#conditionals) we described the `ifelse`
    function, which we will use extensively in this book. In this section we present
    two **dplyr** functions that provide further functionality for performing conditional
    operations.
  prefs: []
  type: TYPE_NORMAL
- en: 4.14.1 `case_when`
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The `case_when` function is useful for vectorizing conditional statements.
    It is similar to `ifelse` but can output any number of values, as opposed to just
    `TRUE` or `FALSE`. Here is an example splitting numbers into negative, positive,
    and 0:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE64]'
  prefs: []
  type: TYPE_PRE
- en: 'A common use for this function is to define categorical variables based on
    existing variables. For example, suppose we want to compare the murder rates in
    four groups of states: *New England*, *West Coast*, *South*, and *other*. For
    each state, we need to ask if it is in New England, if it is not we ask if it
    is in the West Coast, if not we ask if it is in the South, and if not we assign
    *other*. Here is how we use `case_when` to do this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE65]'
  prefs: []
  type: TYPE_PRE
- en: 4.14.2 `between`
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: A common operation in data analysis is to determine if a value falls inside
    an interval. We can check this using conditionals. For example, to check if the
    elements of a vector `x` are between `a` and `b` we can type
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE66]'
  prefs: []
  type: TYPE_PRE
- en: However, this can become cumbersome, especially within the tidyverse approach.
    The `between` function performs the same operation.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE67]'
  prefs: []
  type: TYPE_PRE
- en: 4.15 Exercises
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 1\. Load the `murders` dataset. Which of the following is true?
  prefs: []
  type: TYPE_NORMAL
- en: '`murders` is in tidy format and is stored in a tibble.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`murders` is in tidy format and is stored in a data frame.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`murders` is not in tidy format and is stored in a tibble.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`murders` is not in tidy format and is stored in a data frame.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 2\. Use `as_tibble` to convert the `murders` data table into a tibble and save
    it in an object called `murders_tibble`.
  prefs: []
  type: TYPE_NORMAL
- en: 3\. Use the `group_by` function to convert `murders` into a tibble that is grouped
    by region.
  prefs: []
  type: TYPE_NORMAL
- en: '4\. Write tidyverse code that is equivalent to this code:'
