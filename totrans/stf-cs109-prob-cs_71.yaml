- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: '**Warning:** After learning about joint distributions, and about inference,
    you have all the technical abilities necessary to follow this example. However
    this is very very difficult. Primarily because you need to understand three complex
    things at the same time: (1) how to represent a continuous joint distribution,
    (2) inference in probabilistic models and (3) a rather complex probability of
    observation calculation.'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: '**警告：** 在学习联合分布和推理之后，你已经拥有了跟随本例所需的所有技术能力。然而，这非常非常困难。主要是因为你需要同时理解三个复杂的东西：(1)
    如何表示连续联合分布，(2) 概率模型中的推理，以及 (3) 相当复杂的观察概率计算。'
- en: In this example we are going to explore the problem of tracking an object in
    2D space. The object exists at some $(x, y)$ location, however we are not sure
    exactly where! Thus we are going to use random variables $X$ and $Y$ to represent
    location. \begin{align*} f(X = x, Y = y) &= f(X = x) \cdot f(Y = y) && \text{In
    the prior X and Y are independent} \\ &= \frac{1}{\sqrt{2 \cdot 4 \cdot \pi}}\cdot
    e ^{-\frac{(x-3)^2}{2 \cdot 4}} \cdot \frac{1}{\sqrt{2 \cdot 4 \cdot \pi}}\cdot
    e ^{-\frac{(y-3)^2}{2 \cdot 4}} && \text{Using the PDF equation for normals} \\
    &= K_1 \cdot e ^{-\frac{(x-3)^2 + (y-3)^2}{8}} && \text{All constants are put
    into } K_1 \end{align*} This combinations of normals is called a bivariate distribution.
    Here is a visualization of the PDF of our prior. ![](../Images/7efda801325aa1ea40c3fb70f5266aa3.png)
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 在本例中，我们将探讨在二维空间中跟踪一个物体的难题。该物体存在于某个 $(x, y)$ 位置，但我们不确定确切的位置！因此，我们将使用随机变量 $X$
    和 $Y$ 来表示位置。 \begin{align*} f(X = x, Y = y) &= f(X = x) \cdot f(Y = y) && \text{在先验中
    X 和 Y 是独立的} \\ &= \frac{1}{\sqrt{2 \cdot 4 \cdot \pi}}\cdot e ^{-\frac{(x-3)^2}{2
    \cdot 4}} \cdot \frac{1}{\sqrt{2 \cdot 4 \cdot \pi}}\cdot e ^{-\frac{(y-3)^2}{2
    \cdot 4}} && \text{使用正态分布的 PDF 公式} \\ &= K_1 \cdot e ^{-\frac{(x-3)^2 + (y-3)^2}{8}}
    && \text{所有常数都放入 } K_1 \end{align*} 这种正态分布的组合称为二元分布。以下是先验 PDF 的可视化。 ![](../Images/7efda801325aa1ea40c3fb70f5266aa3.png)
- en: 'The interesting part about tracking an object is the process of updating your
    belief about it''s location based on an observation. Let''s say that we get an
    instrument reading from a sonar that is sitting on the origin. The instrument
    reports that the object is 4 units away. Our instrument is not perfect: if the
    true distance was $t$ units away, than the instrument will give a reading which
    is normally distributed with mean $t$ and variance 1\. Let''s visualize the observation:
    ![](../Images/985b1c520feccdd5f9422ff998ff55d9.png) Based on this information
    about the noisiness of our prior, we can compute the conditional probability of
    seeing a particular distance reading $D$, given the true location of the object
    $X$, $Y$. If we knew the object was at location $(x, y)$, we could calculate the
    true distance to the origin $\sqrt{x^2 + y^2}$ which would give us the mean for
    the instrument Gaussian: \begin{align*} f(D = d | X = x, Y = y) &= \frac{1}{\sqrt{2
    \cdot 1 \cdot \pi}}\cdot e ^{-\frac{\big(d-\sqrt{x^2 + y^2}\big)^2}{2 \cdot 1}}
    && \text{Normal PDF where } \mu = \sqrt{x^2 + y^2} \\ &= K_2\cdot e ^{-\frac{\big(d-\sqrt{x^2
    + y^2}\big)^2}{2 \cdot 1}} && \text{All constants are put into } K_2 \end{align*}
    How about we try this out on actual numbers. How much more likely is an instrument
    reading of 1 compared to 2, given that the location of the object is at (1, 1)?
    \begin{align*} \frac{f(D = 1 | X = 1, Y = 1)}{f(D = 2 | X = 1, Y = 1) } &= \frac
    {K_2\cdot e ^{-\frac{\big(1-\sqrt{1^2 + 1^2}\big)^2}{2 \cdot 1}}} {K_2\cdot e
    ^{-\frac{\big(2-\sqrt{1^2 + 1^2}\big)^2}{2 \cdot 1}}} && \text{Substituting into
    the conditional PDF of D}\\ &= \frac {e ^0} {e^{-1/2}} \approx 1.65 && \text{Notice
    how the $K_2$ cancel out} \end{align*} At this point we have a prior belief and
    we have an observation. We would like to compute an updated belief, given that
    observation. This is a classic Bayes'' formula scenario. We are using joint continuous
    variables, but that doesn''t change the math much, it just means we will be dealing
    with densities instead of probabilities: \begin{align*} f&(X =x, Y =y | D =4)
    \\ &= \frac{f(D = 4| X = x, Y =y) \cdot f(X = x, Y = y)}{f(D =4)} && \text{Bayes
    using densities}\\ &= \frac{K_1 \cdot e^{-\frac{[4 - \sqrt{x^2 + y^2})^2]}{2}}
    \cdot K_2 \cdot e^{-\frac{[(x - 3)^2 + (y - 3)^2]}{8}}}{f(D = 4)} && \text{Substitute}\\
    &= \frac{K_1 \cdot K_2}{ { f(D =4)}} \cdot e ^{-\big[\frac{[4 - \sqrt{x^2 + y^2})^2]}{2}
    + \frac{[(x - 3)^2 + (y - 3)^2]}{8} \big]} && \text{$f(D=4)$ is a constant w.r.t.
    $(x,y)$}\\ &= K_3 \cdot e ^{-\big[\frac{(4 - \sqrt{x^2 + y^2})^2}{2} + \frac{[(x
    - 3)^2 + (y - 3)^2]}{8} \big]} && \text{$K_3$ is a new constant} \end{align*}
    Wow! That looks like a pretty interesting function! You have successfully computed
    the updated belief. Let''s see what it looks like. Here is a figure with our prior
    on the left and the posterior on the right: ![](../Images/b7937f8effb0ad574f481530a6644b1f.png)
    How beautiful is that! Its like a 2D normal distribution merged with a circle.
    But wait, what about that constant! We do not know the value of $K_3$ and that
    is not a problem for two reasons: the first reason is that if we ever want to
    calculate a relative probability of two locations, $K_3$ will cancel out. The
    second reason is that if we really wanted to know what $K_3$ was, we could solve
    for it. This math is used every day in millions of applications. If there are
    multiple observations the equations can get truly complex (even worse than this
    one). To represent these complex functions often use an algorithm called particle
    filtering.'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 跟踪一个物体的有趣之处在于根据观察更新你对它位置的信念的过程。比如说，我们从位于原点的声纳设备中获取了一个仪器读数。仪器报告说物体距离为4个单位。我们的仪器并不完美：如果真实距离是$t$个单位，那么仪器给出的读数将服从均值为$t$、方差为1的正态分布。让我们可视化这个观察结果：![](../Images/985b1c520feccdd5f9422ff998ff55d9.png)基于我们对先验信息噪声的了解，我们可以计算在给定物体真实位置$X$、$Y$的情况下，看到特定距离读数$D$的条件概率。如果我们知道物体位于$(x,
    y)$的位置，我们可以计算出到原点的真实距离$\sqrt{x^2 + y^2}$，这将给出仪器高斯分布的均值：\begin{align*} f(D = d
    | X = x, Y = y) &= \frac{1}{\sqrt{2 \cdot 1 \cdot \pi}}\cdot e ^{-\frac{\big(d-\sqrt{x^2
    + y^2}\big)^2}{2 \cdot 1}} && \text{正态概率密度函数，其中 } \mu = \sqrt{x^2 + y^2} \\ &=
    K_2\cdot e ^{-\frac{\big(d-\sqrt{x^2 + y^2}\big)^2}{2 \cdot 1}} && \text{所有常数都放入
    } K_2 \end{align*}那么，我们尝试用实际数字来验证一下。假设物体的位置在$(1, 1)$，仪器读数1比2更有可能吗？\begin{align*}
    \frac{f(D = 1 | X = 1, Y = 1)}{f(D = 2 | X = 1, Y = 1) } &= \frac {K_2\cdot e
    ^{-\frac{\big(1-\sqrt{1^2 + 1^2}\big)^2}{2 \cdot 1}}} {K_2\cdot e ^{-\frac{\big(2-\sqrt{1^2
    + 1^2}\big)^2}{2 \cdot 1}}} && \text{将条件概率密度函数D代入}\\ &= \frac {e ^0} {e^{-1/2}}
    \approx 1.65 && \text{注意$K_2$如何相互抵消} \end{align*}在这个阶段，我们有一个先验信念和一个观察结果。我们希望根据这个观察结果计算一个更新的信念。这是一个经典的贝叶斯公式场景。我们使用联合连续变量，但这并不会使数学变得复杂多少，只是意味着我们将处理密度而不是概率：\begin{align*}
    f&(X =x, Y =y | D =4) \\ &= \frac{f(D = 4| X = x, Y =y) \cdot f(X = x, Y = y)}{f(D
    =4)} && \text{使用密度进行贝叶斯计算}\\ &= \frac{K_1 \cdot e^{-\frac{[4 - \sqrt{x^2 + y^2})^2]}{2}}
    \cdot K_2 \cdot e^{-\frac{[(x - 3)^2 + (y - 3)^2]}{8}}}{f(D = 4)} && \text{代入}\\
    &= \frac{K_1 \cdot K_2}{ { f(D =4)}} \cdot e ^{-\big[\frac{[4 - \sqrt{x^2 + y^2})^2]}{2}
    + \frac{[(x - 3)^2 + (y - 3)^2]}{8} \big]} && \text{$f(D=4)$相对于$(x,y)$是常数}\\ &=
    K_3 \cdot e ^{-\big[\frac{(4 - \sqrt{x^2 + y^2})^2}{2} + \frac{[(x - 3)^2 + (y
    - 3)^2]}{8} \big]} && \text{$K_3$是新的常数} \end{align*}哇！这看起来像是一个非常有趣的函数！你已经成功计算了更新的信念。让我们看看它是什么样子。这是一个图，左边是我们的先验，右边是我们的后验：![](../Images/b7937f8effb0ad574f481530a6644b1f.png)多么美丽啊！它就像是一个二维正态分布与一个圆的结合。但是等等，那个常数怎么办！我们不知道$K_3$的值，但这不是问题，原因有两个：第一个原因是，如果我们想要计算两个位置的相对概率，$K_3$将会相互抵消。第二个原因是，如果我们真的想知道$K_3$的值，我们可以解出它。这种数学在数百万个应用中每天都在使用。如果有多个观察结果，方程会变得非常复杂（甚至比这个还要复杂）。为了表示这些复杂函数，通常使用一个叫做粒子滤波的算法。
