- en: 1  Distributions
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 1  分布
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/summaries/distributions.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/summaries/distributions.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/summaries/distributions.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/summaries/distributions.html)
- en: '[Summary Statistics](../summaries/intro-summaries.html)'
  id: totrans-2
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[描述性统计量](../summaries/intro-summaries.html)'
- en: '[1  Distributions](../summaries/distributions.html)'
  id: totrans-3
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[1  分布](../summaries/distributions.html)'
- en: Before we begin, we clarify that this chapter will not cover distributions in
    the context of probability, which is the mathematical framework used to model
    uncertainty. We postpone that discussion until the next part of the book, where
    we will use it throughout. Here, we focus on *distributions* as a way to describe
    and summarize data we’ve already collected. Our goal is to understand the variation
    and patterns present in a dataset, without yet making probabilistic claims or
    predictions. The concepts introduced in this chapter will later serve as the foundation
    for understanding probability distributions, where similar tools are used to describe
    the likely outcomes of random processes.
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 在我们开始之前，我们明确指出，本章不会涉及概率论中的分布，这是用于建模不确定性的数学框架。我们将这一讨论推迟到本书的下一部分，在那里我们将贯穿使用它。在这里，我们关注*分布*作为描述和总结我们已收集的数据的一种方式。我们的目标是理解数据集中的变异和模式，而不进行概率性陈述或预测。本章引入的概念将作为理解概率分布的基础，在那里使用类似的工具来描述随机过程的可能结果。
- en: To illustrate the concepts needed to understand distribution and how they relate
    to summary statistics, we will pretend that we have to describe the heights of
    our classmates to ET, an extraterrestrial that has never seen humans. As a first
    step, we need to collect data. To do this, we ask students to report their heights
    in inches. We ask them to provide sex information because we know there are two
    different distributions by sex. We collect the data and save it in the `heights`
    data frame included in the **dslabs** package.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 为了说明理解分布及其与描述性统计量之间关系所需的概念，我们将假装我们需要向ET，一个从未见过人类的地球外生物，描述我们同学的身高。作为第一步，我们需要收集数据。为此，我们要求学生报告他们的身高（英寸）。我们要求他们提供性别信息，因为我们知道存在两种不同的性别分布。我们收集数据并将其保存在**dslabs**包中包含的`heights`数据框中。
- en: '[PRE0]'
  id: totrans-6
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: '*One way to convey the heights to ET is to simply send him a list with all
    the heights. However, there are much more effective ways to convey this information,
    and understanding the concept of a distribution will help. To simplify the explanation,
    we first focus on male heights. We examine the female height data in [Section
    3.3](comparing-groups.html#sec-stratification).'
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: '*向ET传达身高的一种方法就是简单地发送一个包含所有身高的列表。然而，还有更有效的方法来传达这些信息，理解分布的概念将有所帮助。为了简化解释，我们首先关注男性的身高。我们将在[第3.3节](comparing-groups.html#sec-stratification)中检查女性的身高数据。'
- en: At this stage, we are thinking of distributions purely as tools for summarizing
    and describing data. In the next part of the book, we will connect these same
    ideas to probability, where distributions help us model uncertainty. For now,
    our goal is simply to explore the patterns and variation present in the data we
    do have.
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 在这个阶段，我们纯粹将分布视为总结和描述数据的工具。在本书的下一部分，我们将将这些相同的思想与概率联系起来，在那里分布帮助我们建模不确定性。目前，我们的目标仅仅是探索我们所拥有的数据中存在的模式和变异。
- en: It turns out that, in some cases, the two summary statistics introduced in the
    next chapter, the average and the standard deviation, are all we need to understand
    the data. We will learn data visualization techniques that will help us determine
    when this two-number summary is appropriate. These same techniques will serve
    as an alternative for when two numbers are not enough.
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 结果表明，在某些情况下，下一章中引入的两个描述性统计量，即平均值和标准差，就足以帮助我们理解数据。我们将学习数据可视化技术，这些技术将帮助我们确定这两个数字的总结是否合适。这些相同的技巧在两个数字不足以描述时也可以作为替代方案。
- en: 1.1 Variable types
  id: totrans-10
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 1.1 变量类型
- en: Knowing what variable type we are working with is important because it will
    help us determining the most effective way to summarize our data and display its
    distribution.
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 了解我们正在处理哪种变量类型非常重要，因为它将帮助我们确定最有效的方法来总结我们的数据并展示其分布。
- en: 'We will be working with two types of variables: categorical and numeric. Each
    can be divided into two other groups: categorical can be ordinal or not, whereas
    numerical variables can be discrete or continuous.'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将处理两种类型的变量：分类和数值。每种类型都可以分为另外两组：分类可以是有序的或无序的，而数值变量可以是离散的或连续的。
- en: When data values represent groups instead of numbers, we refer to the data as
    *categorical*. Two simple examples are sex (male or female) and US regions (Northeast,
    South, North Central, West). Some categorical data can be ordered even if they
    are not numbers, such as spiciness (mild, medium, hot). These ordered categorical
    data are referred to as *ordinal* data.
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 当数据值代表组而不是数字时，我们称这些数据为*分类数据*。两个简单的例子是性别（男或女）和美国地区（东北部、南部、北中部、西部）。即使这些数据不是数字，一些分类数据也可以排序，例如辣度（温和、中等、辣）。这些有序分类数据被称为*有序数据*。
- en: Numerical data can be continuous or discrete. A continuous variable can take
    on any value within a range. For example, if measured with sufficient precision,
    height is continuous because the difference between two individuals (even identical
    twins) can be an arbitrarily small fraction. However, if height is rounded to
    the nearest inch, it becomes discrete since values must be a whole number. Other
    examples of discrete data are the number of heads when tossing 10 coins, the number
    of cigarettes a person smokes a day, or the number of customers visiting a store
    in an hour. In these cases, the values are countable and cannot take on fractional
    values. Unlike continuous data, which can be measured with increasing precision,
    discrete data are limited to distinct, separate values.
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 数值数据可以是连续的或离散的。一个连续变量可以取一个范围内的任何值。例如，如果测量足够精确，身高是连续的，因为两个个体（即使是同卵双胞胎）之间的差异可以是任意小的分数。然而，如果身高四舍五入到最近的英寸，它就变成了离散的，因为值必须是整数。其他离散数据的例子包括抛掷10个硬币时的正面数量、一个人一天抽的香烟数量，或一小时光顾商店的客户数量。在这些情况下，值是可数的，不能取分数值。与可以随着精度增加而测量的连续数据不同，离散数据仅限于不同的、单独的值。
- en: In practice, there are occasions in which discrete variables are treated as
    continuous. For example, a digital measuring instrument might record data as 16-bit
    integers. However, because it is rare to obtain exactly the same reading more
    than once, it is convenient to treat the data as continuous. Another example is
    country population size. Although population counts are always whole numbers,
    it is uncommon for two jurisdictions to have exactly the same population. For
    this reason, population size is also commonly treated as continuous.
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 在实践中，有时将离散变量视为连续变量。例如，一个数字测量仪器可能记录数据为16位整数。然而，由于很少能获得完全相同的读数超过一次，因此将数据视为连续的是方便的。另一个例子是国家人口规模。尽管人口计数总是整数，但两个司法管辖区人口完全相同的情况很少见。因此，人口规模也通常被视为连续的。
- en: 1.2 Relative frequency distribution
  id: totrans-16
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 1.2 相对频率分布
- en: 'The most basic statistical summary of a list of numbers or categories is its
    *distribution*. The simplest way to think of a distribution is as a compact description
    of values with many entries. This concept should not be new for readers of this
    book. For example, with categorical data, the *relative frequency distribution*
    simply describes the proportion of each unique category:'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 一组数字或类别的最基本统计摘要是其*分布*。简单来说，分布可以看作是具有许多条目的值的紧凑描述。这个概念对于本书的读者来说不应该陌生。例如，对于分类数据，*相对频率分布*简单地描述了每个唯一类别的比例：
- en: \[ p_k = \frac{\mbox{number of times category }k \mbox{ appears in the list}}{n}
    \]
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: \[ p_k = \frac{\text{类别 } k \text{ 出现在列表中的次数}}{n} \]
- en: with \(n\) the length of the list.
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 其中 \(n\) 是列表的长度。
- en: 'Here is an example with US state regions:'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 这里有一个关于美国州区域的例子：
- en: '[PRE1]'
  id: totrans-21
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: '*When the data are discrete numerical values, the relative frequency distribution
    is defined in the same way, except it is more common to use the following notation
    since the frequency can be considered a function of numerical values:'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: '*当数据是离散数值时，相对频率分布的定义方式相同，但更常见的是使用以下符号，因为频率可以被认为是数值的函数：'
- en: \[ f(x) = \frac{\mbox{number of times value } x \mbox{ appears in the list}}{n}
    \]
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: \[ f(x) = \frac{\text{值 } x \text{ 出现在列表中的次数}}{n} \]
- en: 'Here is the distribution for US state populations rounded to the nearest million,
    which are discrete numerical values:'
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: 这里是按最接近百万数四舍五入的美国各州人口分布，这些是离散的数值：
- en: '![](../Images/97a6c9c1d843fda1d0496dc044dcc004.png)*'
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: '![图片](../Images/97a6c9c1d843fda1d0496dc044dcc004.png)*'
- en: '*1.3 Empirical cumulative distribution functions*'
  id: totrans-26
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '*1.3 实验累积分布函数*'
- en: '*When the data is continuous, the task of constructing a summary based on a
    distribution is more challenging because reporting the frequency of each entry
    is not an effective summary: most entries are unique so the relative frequency
    distribution does not summarize much.'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: '*当数据是连续的时，基于分布构建摘要的任务更具挑战性，因为报告每个条目的频率不是一个有效的摘要：大多数条目是唯一的，因此相对频率分布并不能很好地总结。'
- en: 'Here are the relative frequencies of US state populations:'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 下面是各州人口的相对频率：
- en: '![](../Images/d412f302c6ae158154b544b8e9e2f681.png)'
  id: totrans-29
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/d412f302c6ae158154b544b8e9e2f681.png)'
- en: Since there are 50 states, each with a unique population value \(x\), the plot
    shows \(f(x) = \frac{1}{50} = 0.02\) for each state.
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: 由于有50个州，每个州都有一个独特的种群值\(x\)，因此图表显示了每个州的\(f(x) = \frac{1}{50} = 0.02\)。
- en: 'To define a distribution for continuous numeric data we define a function that
    reports the proportion of the data entries \(x\) that are below \(a\), for all
    possible values of \(a\). This function is called the empirical cumulative distribution
    function (eCDF) and often denoted with \(F\):'
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: 为了定义连续数值数据的分布，我们定义一个函数，该函数报告所有可能的值\(a\)下数据条目\(x\)的比例。这个函数被称为经验累积分布函数（eCDF），通常用\(F\)表示：
- en: \[ F(a) = \mbox{Proportion of data points that are less than or equal to }a\]
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: \[ F(a) = \mbox{小于或等于 }a\mbox{ 的数据点的比例} \]
- en: 'Here is the eCDF for state population data above:'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 下面是上述州人口数据的eCDF：
- en: '![](../Images/28a47326d7bcaa70f6d380ee71a25050.png)'
  id: totrans-34
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/28a47326d7bcaa70f6d380ee71a25050.png)'
- en: Similar to how a frequency table summarizes categorical data, the empirical
    cumulative distribution function (eCDF) summarizes continuous data. The eCDF provides
    a clear picture of how the values are distributed and highlights key characteristics
    of the dataset. For instance, in the population data, we can see that about half
    of the states have populations greater than 5,000,000, while most states fall
    below 20,000,000\. This type of summary helps us quickly identify medians, ranges,
    and other important distributional features.
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: 与频率表总结分类数据的方式相似，经验累积分布函数（eCDF）总结了连续数据。eCDF提供了关于值如何分布的清晰图景，并突出了数据集的关键特征。例如，在人口数据中，我们可以看到大约一半的州的种群超过500万，而大多数州的种群低于2000万。这种类型的摘要有助于我们快速识别中位数、范围和其他重要的分布特征。
- en: In our heights case study, most students reported heights rounded to the nearest
    inch. However, some did not. For example, one student reported a height of `68.503937007874`
    inches, and another reported `68.8976377952756` inches. These values correspond
    to 174 cm and 175 cm converted to inches, respectively, suggesting that some students
    knew their heights to the closest centimeter and reported this number divided
    by 2.54.
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 在我们关于身高的案例研究中，大多数学生报告的身高是四舍五入到最接近的英寸。然而，有些人没有这样做。例如，一名学生报告的身高为`68.503937007874`英寸，另一名学生报告的身高为`68.8976377952756`英寸。这些值分别对应于174厘米和175厘米转换为英寸，这表明一些学生知道自己的身高精确到厘米，并报告了这个数值除以2.54。
- en: 'As a result the data is continuous and the relative frequency distribution
    is somewhat confusing:'
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，数据是连续的，相对频率分布有些令人困惑：
- en: '![](../Images/63323c32e17edf9ea03e40a3fe997693.png)'
  id: totrans-38
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/63323c32e17edf9ea03e40a3fe997693.png)'
- en: 'Although this approach preserves all the information from the list of observations,
    it can give misleading impressions if extrapolating insights to a broader population.
    For example, it might suggest there are no people with heights between 74 and
    74.5 inches or that significantly more people are exactly 72 inches tall than
    71.5 inches, patterns we know aren’t accurate. In contrast, the eCDF provides
    a more useful visual summary:'
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: 尽管这种方法保留了观察列表中的所有信息，但如果将洞察力外推到更广泛的群体，可能会产生误导性的印象。例如，它可能表明没有人的身高在74英寸到74.5英寸之间，或者有显著更多的人的身高正好是72英寸，而不是71.5英寸，这些模式我们知道并不准确。相比之下，经验累积分布图（eCDF）提供了更有用的视觉摘要：
- en: '![](../Images/053ed3af01368fef4d6890fbb39a8417.png)'
  id: totrans-40
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/053ed3af01368fef4d6890fbb39a8417.png)'
- en: From a quick glance at the figure, we can already infer some general characteristics
    of the data. For example, about half of the males are shorter than 69 inches,
    since \(F(69) \approx 0.5\), and being shorter than 60 inches or taller than 80
    inches is very rare. Moreover, because we can compute the proportion of individuals
    with heights between any two values \(a\) and \(b\) as \(F(b) - F(a)\), the plot
    above contains all the information needed to reconstruct the entire dataset.
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: 从对图表的快速浏览中，我们已能推断出数据的一些一般特征。例如，大约一半的男性身高低于69英寸，因为 \(F(69) \approx 0.5\)，而身高低于60英寸或高于80英寸是非常罕见的。此外，因为我们可以计算任何两个值
    \(a\) 和 \(b\) 之间个体身高的比例 \(F(b) - F(a)\)，上面的图表包含了重建整个数据集所需的所有信息。
- en: Paraphrasing the saying “a picture is worth a thousand words,” in this case,
    a picture is as informative as 812 numbers.
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: 将俗语“一图胜千言”进行改写，在这种情况下，一张图的信息量相当于812个数字。
- en: '*The reason we add the word *empirical* is because, as we will see in [Section
    6.1](../prob/continuous-probability.html#sec-cdf-intro), the cumulative distribution
    function (CDF) can be defined mathematically, meaning without any data.**'
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: '*我们添加“经验”这个词的原因是，正如我们将在[第6.1节](../prob/continuous-probability.html#sec-cdf-intro)中看到的那样，累积分布函数（CDF）可以数学上定义，这意味着无需任何数据。**'
- en: '**1.4 Histograms**'
  id: totrans-44
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '**1.4 直方图**'
- en: '**Although the eCDF is a fundamental concept in statistics, it is not commonly
    used in practice. The main reason is that it does not easily highlight key distribution
    characteristics, such as the central tendency, symmetry, or the range that contains
    95% of the values. In contrast, histograms are widely preferred because they make
    these features much more interpretable. While histograms sacrifice a small amount
    of information, they provide a much clearer summary of the data.'
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: '**尽管经验累积分布函数（eCDF）是统计学中的一个基本概念，但在实践中并不常用。主要原因是不易突出关键分布特征，如中心趋势、对称性或包含95%值的范围。相比之下，直方图因其使这些特征更容易解释而更受欢迎。虽然直方图牺牲了一小部分信息，但它提供了对数据的更清晰的总结。**'
- en: To construct a histogram, we first divide the range of the data into non-overlapping
    bins. Each bin acts as a category, and its height is chosen so that the area of
    the bar, calculated as the height multiplied by the bin width, represents the
    relative frequency of observations within that bin. Although a histogram resembles
    a bar plot, it differs in that the x-axis represents numerical values rather than
    categorical ones.
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: 要构建直方图，我们首先将数据的范围划分为非重叠的箱。每个箱作为一个类别，其高度被选择，使得条形的高度（即高度乘以箱宽度）代表该箱内观测值的相对频率。尽管直方图类似于条形图，但它不同之处在于x轴代表数值而不是类别。
- en: 'If we round the reported heights to the nearest inch and create a relative
    frequency distribution, we obtain a histogram with bins defined in one-inch intervals:'
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们将报告的身高四舍五入到最接近的英寸，并创建一个相对频率分布，我们得到一个以一英寸间隔定义的箱的直方图：
- en: \[(49.5, 50.5], (50.5, 51.5], (51.5, 52.5], (52.5, 53.5], \dots, (82.5, 83.5]\]
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: \[(49.5, 50.5], (50.5, 51.5], (51.5, 52.5], (52.5, 53.5], \dots, (82.5, 83.5]\]
- en: 'We can do this with the following **ggplot2** code:'
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以使用以下**ggplot2**代码来完成这项工作：
- en: '[PRE2]'
  id: totrans-50
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: '*![](../Images/b50ae91dc2e270ae6530a84ada5ed2ab.png)*  *The R base `hist` function
    also allows us quickly construct a histogram. We can define custom bin intervals
    which is particularly useful for grouping extreme values and avoiding empty bins:'
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: '*![](../Images/b50ae91dc2e270ae6530a84ada5ed2ab.png)*  *R的基础`hist`函数也允许我们快速构建直方图。我们可以定义自定义的箱间隔，这对于分组极端值和避免空箱特别有用：*'
- en: '[PRE3]'
  id: totrans-52
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: '*![](../Images/3c8f6cf8cdd9a582f2942967c894826d.png)*  *If we were to send
    either of these plots to an extraterrestrial unfamiliar with human height distributions,
    they would immediately gain key insights about the data. First, the height values
    range from 50 to 84 inches, with over 95% of observations falling between 63 and
    75 inches. Second, the distribution is approximately symmetric around 69 inches.
    Additionally, by summing bin counts, one could estimate the proportion of data
    falling within any given interval. Thus, a histogram provides an intuitive summary
    that preserves most of the information from the original 812 height measurements
    using only about 30 bin counts.'
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: '*![](../Images/3c8f6cf8cdd9a582f2942967c894826d.png)*  *如果我们将这些图表之一发送给一个对人类身高分布不熟悉的地球外生物，他们可以立即获得关于数据的关键见解。首先，身高值范围从50到84英寸，超过95%的观测值在63到75英寸之间。其次，分布在大约69英寸处近似对称。此外，通过求和箱计数，可以估计任何给定区间内数据所占的比例。因此，直方图提供了一个直观的总结，仅使用大约30个箱计数就保留了从原始的812个身高测量值中提取的大部分信息。*'
- en: What information is lost? A histogram treats all values within a bin as if they
    were the same when computing bar heights. For instance, values of 64.0, 64.1,
    and 64.2 inches are grouped together. However, since these differences are barely
    perceptible, the practical impact is negligible, and we achieve a meaningful summary
    using just 23 numbers.
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
  zh: 失去了哪些信息？直方图在计算条形高度时将分箱内的所有值视为相同的。例如，64.0英寸、64.1英寸和64.2英寸的值被分组在一起。然而，由于这些差异几乎不可察觉，实际影响可以忽略不计，我们只需使用23个数字就能得到有意义的总结。
- en: '*By default, histograms often display frequency on the y-axis instead of relative
    frequency. The **ggplot2** package follows this convention:'
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: '*默认情况下，直方图通常在y轴上显示频率而不是相对频率。**ggplot2**包遵循这一惯例：'
- en: '[PRE4]'
  id: totrans-56
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: '*![](../Images/ad2a6de39b161a247dfb596cd4055f97.png)*  *Note we use `fill`
    and `color` to mimic the behavior or `hist`.'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: '*![](../Images/ad2a6de39b161a247dfb596cd4055f97.png)*  *注意我们使用`fill`和`color`来模仿`hist`的行为。'
- en: 'When displaying frequencies, it is important to use equally spaced bins, as
    larger bins will naturally contain more observations and may distort the visual
    representation of the data. To instead display **relative** frequency, you can
    modify the code by setting `y = after_stat(density)`:'
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 当显示频率时，使用等间距的分箱很重要，因为较大的分箱自然会包含更多的观察值，并可能扭曲数据的视觉表示。要显示**相对**频率，可以通过设置`y = after_stat(density)`来修改代码：
- en: '[PRE5]'
  id: totrans-59
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: '*![](../Images/36952a0e52ea23660c7256a4b81a35ba.png)***  ***### Choosing bin
    widths'
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: '*![](../Images/36952a0e52ea23660c7256a4b81a35ba.png)***  ***### 选择分箱宽度'
- en: 'The appearance and interpretation of a histogram depend on the choice of bins,
    and in the case of equally sized bins, their width. Different bin widths can make
    the same data look quite different, too narrow, and the histogram may appear noisy
    or fragmented; too wide, and important features of the distribution may be hidden.
    The choice of bin width should be guided by the context of the data. For example,
    in the case of height, most people report values rounded to the nearest half inch,
    so using bins smaller than that does not make sense. At the same time, because
    height differences of more than an inch are noticeable in real life, bins larger
    than about two inches would obscure meaningful variation. For the extreme regions
    of the distribution, such as below 60 inches or above 80 inches, where there are
    few observations, it is reasonable to use wider bins to keep the summary clear.
    Every dataset requires a context-specific decision: the goal is to choose bins
    that reveal structure without introducing noise, maximizing the information conveyed
    by a single figure.*******'
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: 直方图的外观和解释取决于分箱的选择，在等宽分箱的情况下，还取决于它们的宽度。不同的分箱宽度可以使相同的数据看起来非常不同，太窄时，直方图可能显得嘈杂或破碎；太宽时，分布的重要特征可能被隐藏。分箱宽度的选择应受数据上下文指导。例如，在身高的情况下，大多数人报告的数值是四舍五入到最近的半英寸，因此使用比这更小的分箱是没有意义的。同时，由于现实生活中超过一英寸的高度差异是可察觉的，因此大于约两英寸的分箱会掩盖有意义的变异。对于分布的极端区域，例如低于60英寸或高于80英寸的区域，由于观察值很少，使用较宽的分箱来保持总结清晰是合理的。每个数据集都需要一个特定于上下文的决定：目标是选择分箱，以便在不引入噪声的情况下揭示结构，最大化单张图所传达的信息。*******
- en: '*****1.5 Smoothed density plots*****'
  id: totrans-62
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '*****1.5 平滑密度图*****'
- en: '*****Smooth density plots are similar to histograms, but the data is not divided
    into bins. Here is what a smooth density plot looks like for our heights data:'
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: '*****平滑密度图与直方图类似，但数据没有被分成分箱。以下是我们身高数据的平滑密度图：'
- en: '[PRE6]'
  id: totrans-64
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: '*![](../Images/b214c656bb52b8b05911f836052c4abf.png)*  *In this plot, we no
    longer have sharp edges at the interval boundaries and many of the local peaks
    have been removed.'
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
  zh: '*![](../Images/b214c656bb52b8b05911f836052c4abf.png)*  *在这个图中，我们不再在区间边界处有尖锐的边缘，许多局部峰值也被移除了。'
- en: To understand smooth densities, we have to understand *estimates*, a topic we
    don’t cover until later. However, we provide a heuristic explanation to help you
    understand the basics.
  id: totrans-66
  prefs: []
  type: TYPE_NORMAL
  zh: 要理解平滑密度，我们必须理解*估计*，这是一个我们稍后才会涉及的话题。然而，我们提供了一个启发式解释来帮助您理解基础知识。
- en: The main new concept you must understand is that we assume that our list of
    observed values is a subset of a much larger list of unobserved values. In the
    case of heights, you can imagine that our list of 812 male students comes from
    a hypothetical list containing all the heights of all the male students in all
    the world measured very precisely. Let’s say there are 1,000,000 of these measurements.
    This list of values has a distribution, like any other list of values, and what
    we truly want to report to ET is this larger distribution, as it is much more
    general. Unfortunately, we don’t get to see it.
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
  zh: 你必须理解的主要新概念是我们假设我们所观察到的值的列表是未观察到的更大列表的一个子集。在身高的例子中，你可以想象我们的812名男学生的身高列表来自一个假设的列表，该列表包含所有男性学生的身高，这些身高被非常精确地测量。假设有1,000,000个这样的测量值。这个值列表有一个分布，就像任何其他值列表一样，而我们真正想要报告给ET的是这个更大的分布，因为它更加普遍。不幸的是，我们看不到它。
- en: 'However, we make an assumption that helps us perhaps approximate it. If we
    had 1,000,000 values, measured very precisely, we could make a histogram with
    very, very small bins. The assumption is that if we show this, the height of consecutive
    bins will be similar. This is what we mean by smooth: we don’t have big jumps
    in the heights of consecutive bins. Below, we present histograms for this hypothetical
    data with bins of size 1, 0.5, and 0.25\. To make the curve not depend on the
    hypothetical size of the hypothetical list, we compute the curve on frequencies
    rather than counts. The smaller we make the bins, the smoother the histogram becomes:'
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，我们做出一个假设，这个假设可能帮助我们近似它。如果我们有1,000,000个值，这些值被非常精确地测量，我们可以制作具有非常非常小柱子的直方图。这个假设是，如果我们展示这个，连续柱子的高度将相似。这就是我们所说的平滑：连续柱子的高度没有大的跳跃。下面，我们展示了具有大小为1、0.5和0.25的柱子的这个假设数据的直方图。为了使曲线不依赖于假设列表的假设大小，我们使用频率而不是计数来计算曲线。我们使柱子越小，直方图就越平滑：
- en: '![](../Images/9911d779cd3c36c1f2d25c87d77d0971.png)'
  id: totrans-69
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/9911d779cd3c36c1f2d25c87d77d0971.png)'
- en: The smooth density is basically the curve that goes through the top of the histogram
    bars when the bins are very, very small.
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
  zh: 平滑密度基本上是在柱状图柱子顶部通过的曲线，当柱子非常非常小的时候。
- en: Now, back to reality. We don’t have millions of measurements. Instead, we have
    812 and we can’t make a histogram with very small bins.
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: 现在，回到现实。我们没有数百万的测量值。相反，我们有812个，我们无法制作具有非常小柱子的直方图。
- en: 'Therefore, we make a histogram using bin sizes appropriate for our data, computing
    frequencies rather than counts. Additionally, we draw a smooth curve that passes
    through the tops of the histogram bars. The following plots demonstrate the steps
    that lead to a smooth density:'
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，我们使用适合我们数据大小的柱子大小制作直方图，计算频率而不是计数。此外，我们绘制一条通过直方图柱子顶部的平滑曲线。以下图表展示了导致平滑密度的步骤：
- en: '![](../Images/6152882109f81cdfe4f8064dc3104d4a.png)'
  id: totrans-73
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/6152882109f81cdfe4f8064dc3104d4a.png)'
- en: Choosing the bandwidth
  id: totrans-74
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 选择带宽
- en: '*Smooth* is a relative term. The degree of smoothness in a density curve is
    not fixed, it depends on a parameter, often called the bandwidth, that controls
    how much we smooth the curve. Most functions that compute smooth densities include
    an option to adjust this bandwidth. The examples below show the same histogram
    with two different bandwidth choices, illustrating how the amount of smoothing
    can change the appearance of the density curve.'
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: '*平滑*是一个相对术语。密度曲线的平滑程度不是固定的，它取决于一个参数，通常称为带宽，它控制我们如何平滑曲线。大多数计算平滑密度的函数都包括一个选项来调整这个带宽。下面的例子显示了使用两种不同带宽选择的相同直方图，说明了平滑程度如何改变密度曲线的外观。'
- en: '![](../Images/fe4bd8524f9304fbc0541cf6c64941e7.png)'
  id: totrans-76
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/fe4bd8524f9304fbc0541cf6c64941e7.png)'
- en: 'Just as a histogram’s appearance depends on the chosen bin width, a smoothed
    density depends on the bandwidth, the smoothing parameter. Different bandwidths
    can make the same data look noisy (too small) or overly smooth (too large). We
    should pick a bandwidth that reflects the context and what we believe about the
    underlying distribution. For heights, for example, it’s reasonable to expect nearby
    values, within an inch, to occur with similar frequency, the proportion at 72
    inches should be closer to that at 71 than to that at 65 or 78, so a moderate
    level of smoothing is justified. The aim is the same as with bin width: reveal
    structure without adding noise or hiding meaningful features.'
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: 正如直方图的形状取决于选择的桶宽一样，平滑密度取决于带宽，即平滑参数。不同的带宽可以使相同的数据看起来噪声过多（太小）或过度平滑（太大）。我们应该选择一个带宽，以反映上下文以及我们对潜在分布的信念。例如，对于高度来说，合理地预期在一英寸范围内的值会以相似频率发生，72英寸的比例应该比71英寸的比例更接近，比65英寸或78英寸的比例更接近，因此适度的平滑是合理的。目标是与桶宽相同：揭示结构，而不添加噪声或隐藏有意义的特点。
- en: Interpreting the y-axis
  id: totrans-78
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 解释y轴
- en: 'Interpreting the y-axis of a smooth density plot is not straightforward. It
    is scaled so that the area under the density curve adds up to 1\. If you imagine
    that we form a bin with a base 1 unit in length, the y-axis value tells us the
    proportion of values in that bin. However, this is only true for bins of size
    1\. For other size intervals, the best way to determine the proportion of data
    in that interval is by computing the proportion of the total area contained in
    that interval. For example, here are the proportion of values between 65 and 68:'
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
  zh: 解释平滑密度图的y轴并不简单。它是按比例缩放的，使得密度曲线下的面积总和为1。如果你想象我们用一个长度为1单位的底部的桶，y轴的值告诉我们该桶中值的比例。然而，这只适用于大小为1的桶。对于其他大小区间，确定该区间中数据比例的最佳方法是通过计算该区间包含的总面积的比例。例如，这里是在65英寸和68英寸之间的值的比例：
- en: '![](../Images/4bfd18f41c8fd31edda3c28026da604f.png)'
  id: totrans-80
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/4bfd18f41c8fd31edda3c28026da604f.png)'
- en: The proportion of this area is about 0.3, meaning that about 30% of male heights
    are between 65 and 68 inches.
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
  zh: 这个区域的占比大约是0.3，这意味着大约30%的男性身高在65英寸到68英寸之间。
- en: 'By understanding this, we are ready to use the smooth density as a summary.
    For this dataset, we would feel quite comfortable with the smoothness assumption,
    and therefore with sharing this aesthetically pleasing figure with ET, which he
    could use to understand our male heights data:'
  id: totrans-82
  prefs: []
  type: TYPE_NORMAL
  zh: 通过理解这一点，我们就可以使用平滑密度作为总结。对于这个数据集，我们会非常舒适地接受平滑假设，因此可以与ET分享这个美观的图表，他可以用它来理解我们的男性身高数据：
- en: '![](../Images/d9386134581f3c0ff47afd987164ce34.png)'
  id: totrans-83
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/d9386134581f3c0ff47afd987164ce34.png)'
- en: '*With the material covered up to this point, you can complete exercises 1 through
    10.*******'
  id: totrans-84
  prefs: []
  type: TYPE_NORMAL
  zh: '*到目前为止，你可以完成1到10的练习。*******'
- en: '*****1.6 Describing distributions*****'
  id: totrans-85
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '*****1.6 描述分布*****'
- en: '*****When visualizing data with a histogram or density plot, we often describe
    the shape of a distribution using a few key terms and concepts. In this section,
    our goal is simply to familiarize you with this vocabulary, terms that you’ll
    encounter in most discussions of data analysis.'
  id: totrans-86
  prefs: []
  type: TYPE_NORMAL
  zh: '*****在用直方图或密度图可视化数据时，我们经常使用一些关键术语和概念来描述分布的形状。在本节中，我们的目标是简单地让你熟悉这个词汇，这些词汇你会在大多数数据分析讨论中遇到。'
- en: A *mode* is a value or region where the data are most concentrated, the peak
    of the distribution. Some distributions have one peak (unimodal), while others
    have two or more (bimodal or multimodal), which can indicate distinct subgroups
    within the data.
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: '*模式*是数据最集中的值或区域，分布的峰值。一些分布有一个峰值（单峰），而其他分布有两个或更多（双峰或多峰），这可以表明数据中有不同的子组。'
- en: A symmetric distribution has as many data points to both sides of the mode.
    A distribution is skewed if it is asymmetric.
  id: totrans-88
  prefs: []
  type: TYPE_NORMAL
  zh: 对称分布的模态两侧具有相同数量的数据点。如果分布是不对称的，则称为偏斜分布。
- en: The *tails* of a distribution are the regions that extend toward the smallest
    and largest values.
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
  zh: 分布的*尾部*是指向最小值和最大值延伸的区域。
- en: A *right-skewed* (positively skewed) distribution has a long tail toward larger
    values, for example, income, where most people earn modest amounts but a few earn
    much more.
  id: totrans-90
  prefs: []
  type: TYPE_NORMAL
  zh: '*右偏斜*（正偏斜）分布具有指向较大值的较长尾部，例如收入，大多数人收入适中，但少数人收入很高。'
- en: A *left-skewed* (negatively skewed) distribution has a longer tail toward smaller
    values, such as test scores on an easy exam where most students score high but
    a few perform poorly.
  id: totrans-91
  prefs: []
  type: TYPE_NORMAL
  zh: 一个*左偏斜*（负偏斜）的分布具有朝向较小值的更长尾巴，例如在简单考试中，大多数学生得分较高，但少数学生表现不佳的考试成绩。
- en: In the next chapter, we introduce the normal distribution, a symmetric, bell-shaped
    distribution that serves as a useful reference point. Distributions with heavy
    tails contain more extreme observations than the normal distribution, while light-tailed
    distributions contain fewer.
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: 在下一章中，我们将介绍正态分布，这是一种对称的钟形分布，可以作为有用的参考点。具有重尾的分布包含比正态分布更多的极端观测值，而轻尾分布包含较少的观测值。
- en: 'Here are some simulated examples illustrating the terms described above:'
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: 下面是一些模拟示例，说明了上述术语：
- en: '![](../Images/75e8384fec2eab2c7b8407b5cdfe60fe.png)*****'
  id: totrans-94
  prefs: []
  type: TYPE_NORMAL
  zh: '![](../Images/75e8384fec2eab2c7b8407b5cdfe60fe.png)*****'
- en: '*****1.7 From visual to numerical summaries*****'
  id: totrans-95
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '*****1.7 从视觉到数值摘要*****'
- en: '*****As we’ve seen, visual tools such as histograms, density plots, and qqplots
    help us understand the shape of a distribution, its center, spread, symmetry,
    and tails. However, graphical summaries are often complemented by numerical summaries,
    which distill much of this information into just a few key numbers. In the next
    chapter, we introduce two of the most useful numerical summaries, the average
    and the standard deviation, which provide all the information you need when the
    data are approximately normal. We will also explore alternative measures that
    are more appropriate when distributions deviate from normality. The visualization
    techniques introduced here will guide us in deciding when simple numerical summaries
    are sufficient and when more detailed descriptions are needed.*****'
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: '*****正如我们所见，直方图、密度图和QQ图等视觉工具帮助我们了解分布的形状、中心、范围、对称性和尾巴。然而，图形摘要通常需要数值摘要来补充，这些摘要将大量信息浓缩为几个关键数字。在下一章中，我们将介绍两个最有用的数值摘要，即平均值和标准差，当数据近似正态分布时，这些摘要提供了你需要的一切信息。我们还将探讨在分布偏离正态性时更合适的替代度量。这里介绍的可视化技术将指导我们在简单数值摘要足够时以及需要更详细描述时做出决定。*****'
- en: '*****1.8 Exercises*****'
  id: totrans-97
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '*****1.8 练习*****'
