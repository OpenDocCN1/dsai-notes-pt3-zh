- en: In fact, the proportion of players that have a lower batting average their sophomore
    year is 0.698.
  id: totrans-287
  prefs: []
  type: TYPE_NORMAL
  zh: 事实上，二年级时击球率低于平均值的球员比例是0.698。
- en: So is it “jitters” or “jinx”? To answer this question, let’s turn our attention
    to all players that played the 2013 and 2014 seasons and batted more than 130
    times (minimum to win Rookie of the Year).
  id: totrans-288
  prefs: []
  type: TYPE_NORMAL
  zh: 所以是“紧张”还是“诅咒”？为了回答这个问题，让我们将注意力转向所有在2013年和2014赛季中出场超过130次（最低标准以赢得年度最佳新秀）的球员。
- en: 'The same pattern arises when we look at the top performers: batting averages
    go down for most of the top performers.'
  id: totrans-289
  prefs: []
  type: TYPE_NORMAL
  zh: 当我们观察顶尖表现者时，同样的模式出现：大多数顶尖表现者的击球率下降。
- en: '| nameFirst | nameLast | 2013 | 2014 |'
  id: totrans-290
