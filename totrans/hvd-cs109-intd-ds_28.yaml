- en: 18.8 The regression fallacy
  id: totrans-275
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 18.8 回归谬误
- en: 'Wikipedia defines the *sophomore slump* as:'
  id: totrans-276
  prefs: []
  type: TYPE_NORMAL
  zh: 维基百科将**大二生滑坡**定义为：
- en: A sophomore slump or sophomore jinx or sophomore jitters refers to an instance
    in which a second, or sophomore, effort fails to live up to the standards of the
    first effort. It is commonly used to refer to the apathy of students (second year
    of high school, college or university), the performance of athletes (second season
    of play), singers/bands (second album), television shows (second seasons) and
    movies (sequels/prequels).
  id: totrans-277
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 大二生滑坡或大二生诅咒或大二生紧张是指第二次努力（或大二生）未能达到第一次努力标准的情况。这个词通常用来指代学生（高中、大学或大学的第二年）、运动员（第二个赛季）、歌手/乐队（第二张专辑）、电视节目（第二季）和电影（续集/前传）的表现。
- en: In Major League Baseball, the rookie of the year (ROY) award is given to the
    first-year player who is judged to have performed the best. The *sophmore slump*
    phrase is used to describe the observation that ROY award winners don’t do as
    well during their second year. For example, this Fox Sports article[^(69)](#fn69)
    asks “Will MLB’s tremendous rookie class of 2015 suffer a sophomore slump?”.
  id: totrans-278
  prefs: []
  type: TYPE_NORMAL
  zh: 在美国职业棒球大联盟中，年度最佳新秀（ROY）奖项授予第一年表现最佳的球员。**大二生滑坡**这个短语用来描述年度最佳新秀在第二年表现不佳的观察结果。例如，这篇Fox
    Sports文章[^(69)](#fn69)提出了“MLB 2015年令人惊叹的新秀班是否将遭遇大二生滑坡？”的问题。
- en: 'Does the data confirm the existence of a sophomore slump? Let’s take a look.
    Examining the data for batting average, we see that this observation holds true
    for the top performing ROYs:'
  id: totrans-279
  prefs: []
  type: TYPE_NORMAL
  zh: 是否数据证实了存在大二生滑坡？让我们看一下击球率的统计数据。我们发现，对于表现最好的年度最佳新秀（ROY）来说，这一观察结果是正确的：
- en: '| nameFirst | nameLast | rookie_year | rookie | sophomore |'
  id: totrans-280
  prefs: []
  type: TYPE_TB
  zh: '| nameFirst | nameLast | rookie_year | rookie | sophomore |'
- en: '| --- | --- | --- | --- | --- |'
  id: totrans-281
