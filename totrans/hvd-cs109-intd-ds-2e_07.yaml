- en: 4  The tidyverse
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 4  The tidyverse
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-1/R/tidyverse.html](https://rafalab.dfci.harvard.edu/dsbook-part-1/R/tidyverse.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-1/R/tidyverse.html](https://rafalab.dfci.harvard.edu/dsbook-part-1/R/tidyverse.html)
- en: '[R](../R/intro-to-R.html)'
  id: totrans-2
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[R](../R/intro-to-R.html)'
- en: '[4  The tidyverse](../R/tidyverse.html)'
  id: totrans-3
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[4  The tidyverse](../R/tidyverse.html)'
- en: Up to now we have been manipulating vectors by reordering and subsetting them
    through indexing. However, once we start more advanced analyses, the preferred
    unit for data storage is not the vector but the data frame. In this chapter we
    learn to work directly with data frames, which greatly facilitate the organization
    of information. We will be using data frames for the majority of this book. We
    will focus on a specific data format referred to as *tidy* and on specific collection
    of packages that are particularly helpful for working with *tidy* data referred
    to as the *tidyverse*.
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 到目前为止，我们通过重新排序和通过索引进行子集化来操作向量。然而，一旦我们开始更高级的分析，数据存储的首选单位不是向量，而是数据框。在本章中，我们将学习如何直接与数据框一起工作，这极大地促进了信息的组织。我们将在这本书的大部分内容中使用数据框。我们将关注一种特定的数据格式，称为*tidy*，以及一组特别有助于处理*tidy*数据的包，称为*tidyverse*。
- en: 'We can load all the tidyverse packages at once by installing and loading the
    **tidyverse** package:'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以通过安装和加载**tidyverse**包一次性加载所有tidyverse包：
- en: '[PRE0]'
  id: totrans-6
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: '*We will learn how to implement the tidyverse approach throughout the book,
    but before delving into the details, in this chapter we introduce some of the
    most widely used tidyverse functionality, starting with the **dplyr** package
    for manipulating data frames and the **purrr** package for working with functions.
    Note that the tidyverse also includes a graphing package, **ggplot2**, which we
    introduce later in [Chapter 8](../dataviz/ggplot2.html) in the Data Visualization
    part of the book, the **readr** package discussed in [Chapter 6](importing-data.html),
    and many others. In this chapter, we first introduce the concept of *tidy data*
    and then demonstrate how we use the tidyverse to work with data frames in this
    format.'
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: '*本书中我们将学习如何实现tidyverse方法，但在深入细节之前，在本章中我们介绍了一些最广泛使用的tidyverse功能，从用于操作数据框的**dplyr**包和用于处理函数的**purrr**包开始。请注意，tidyverse还包括一个绘图包**ggplot2**，我们将在本书数据可视化部分的第8章中介绍，还有在第六章中讨论的**readr**包以及其他许多包。在本章中，我们首先介绍*tidy数据*的概念，然后展示我们如何使用tidyverse以这种格式处理数据框。'
- en: 4.1 Tidy data
  id: totrans-8
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 4.1 整洁数据
- en: We say that a data table is in *tidy* format if each row represents one observation
    and columns represent the different variables available for each of these observations.
    The `murders` dataset is an example of a tidy data frame.
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 我们说一个数据表处于*tidy*格式，如果每一行代表一个观察结果，而列代表每个这些观察结果可用的不同变量。`murders`数据集是一个整洁数据框的例子。
- en: '[PRE1]'
  id: totrans-10
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: 'Each row represent a state with each of the five columns providing a different
    variable related to these states: name, abbreviation, region, population, and
    total murders.'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 每一行代表一个州，五个列中的每一个提供与这些州相关的不同变量：名称、缩写、地区、人口和谋杀总数。
- en: 'To see how the same information can be provided in different formats, consider
    the following example:'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 要了解相同的信息可以以不同的格式提供，请考虑以下示例：
- en: '[PRE2]'
  id: totrans-13
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: 'This tidy dataset provides fertility rates for two countries across the years.
    This is a tidy dataset because each row represents one observation with the three
    variables being country, year, and fertility rate. However, this dataset originally
    came in another format and was reshaped for the **dslabs** package. Originally,
    the data was in the following format:'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 这个tidy数据集提供了两个国家在多年间的生育率。这是一个tidy数据集，因为每一行代表一个观察结果，有三个变量：国家、年份和生育率。然而，这个数据集最初以另一种格式提供，并为**dslabs**包进行了重塑。最初，数据是以以下格式提供的：
- en: '[PRE3]'
  id: totrans-15
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: 'The same information is provided, but there are two important differences in
    the format: 1) each row includes several observations and 2) one of the variables,
    year, is stored in the header. For the tidyverse packages to be optimally used,
    data need to be reshaped into *tidy* format, which you will learn to do in the
    Data Wrangling part of the book. Until then, we will use example datasets that
    are already in tidy format.'
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 提供的信息相同，但在格式上有两个重要差异：1) 每一行包含多个观察结果，2) 其中一个变量，年份，存储在标题中。为了最优地使用tidyverse包，数据需要重新塑形为*tidy*格式，你将在本书的数据整理部分学习如何做到这一点。在此之前，我们将使用已经处于tidy格式的示例数据集。
- en: Although not immediately obvious, as you go through the book you will start
    to appreciate the advantages of working in a framework in which functions use
    tidy formats for both inputs and outputs. You will see how this permits the data
    analyst to focus on more important aspects of the analysis rather than the format
    of the data.
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 虽然一开始可能不明显，但随着你阅读本书，你将开始欣赏在函数使用整洁格式进行输入和输出的框架中工作的优势。你会看到这如何使数据分析师能够专注于分析的重要方面，而不是数据的格式。
- en: '*You are ready to do exercises 1-4.*'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: '*你准备好做练习1-4了。*'
- en: '*4.2 Refining data frames*'
  id: totrans-19
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '*4.2 优化数据框*'
- en: '*The **dplyr** package from the **tidyverse** introduces functions that perform
    some of the most common operations when working with data frames and uses names
    for these functions that are relatively easy to remember. For instance, to change
    the data table by adding a new column, we use `mutate`. To filter the data table
    to a subset of rows, we use `filter`. Finally, to subset the data by selecting
    specific columns, we use `select`.'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: '*来自**tidyverse**的**dplyr**包引入了执行数据框操作中最常见的一些函数，并使用相对容易记住的名称为这些函数命名。例如，要更改数据表并添加新列，我们使用`mutate`。要过滤数据表以仅显示行子集，我们使用`filter`。最后，要按选择特定列来子集数据，我们使用`select`。'
- en: 4.2.1 Adding columns
  id: totrans-21
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 4.2.1 添加列
- en: 'We want all the necessary information for our analysis to be included in the
    data frame. The first task is to add the murder rates to our murders data frame.
    The function `mutate` takes the data frame as a first argument and the name and
    values of the variable as a second argument using the convention `name = values`.
    So, to add murder rates, we use:'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 我们希望分析所需的所有信息都包含在数据框中。第一个任务是向我们的谋杀数据框中添加谋杀率。函数`mutate`将数据框作为第一个参数，将变量名称和值作为第二个参数，使用约定`name
    = values`。因此，要添加谋杀率，我们使用：
- en: '[PRE4]'
  id: totrans-23
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: '*Notice that here we used `total` and `population` inside the function, which
    are objects that are **not** defined in our workspace. But why don’t we get an
    error?'
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: '*请注意，在这里我们在函数内部使用了`total`和`population`，这些对象在我们的工作空间中**没有**定义。但为什么我们没有得到错误？'
- en: This is one of **dplyr**’s main features. Functions in this package, such as
    `mutate`, know to look for variables in the data frame provided in the first argument.
    In the call to mutate above, `total` will have the values in `murders$total`.
    This approach makes the code much more readable.
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: 这是**dplyr**的主要功能之一。此包中的函数，如`mutate`，知道在第一个参数提供的数据框中查找变量。在上面的`mutate`调用中，`total`将具有`murders$total`中的值。这种方法使代码更易于阅读。
- en: 'We can see that the new column is added:'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以看到新列已添加：
- en: '[PRE5]*'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: '[PRE5]*'
- en: '**4.2.2 Row-wise subsetting**'
  id: totrans-28
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '**4.2.2 行子集**'
- en: '**Now suppose that we want to filter the data frame to only show the entries
    for which the murder rate is lower than 0.71\. To do this we use the `filter`
    function, which takes the data frame as the first argument and then a conditional
    statement as the second. Like `mutate`, we can use the unquoted variable names
    from `murders` inside the function and it will know we mean the columns and not
    objects in the workspace.'
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: '**现在假设我们只想过滤数据框，只显示谋杀率低于0.71的条目。为此，我们使用`filter`函数，它将数据框作为第一个参数，然后是一个条件语句作为第二个参数。像`mutate`一样，我们可以在函数内部使用`murders`中的未引用变量名，并且它将知道我们指的是列而不是工作空间中的对象。'
- en: '[PRE6]**'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: '[PRE6]**'
- en: '***4.2.3 Column-wise subsetting***'
  id: totrans-31
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '***4.2.3 列子集***'
- en: '***Although our data frame only has six columns, some data frames include hundreds.
    If we want to view just a few, we can use the **dplyr** `select` function. In
    the code below we select three columns, assign this to a new object and then filter
    the new object:'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: '***尽管我们的数据框只有六个列，但一些数据框包含数百列。如果我们只想查看其中的一些，我们可以使用**dplyr**的`select`函数。在下面的代码中，我们选择三个列，将其分配给一个新的对象，然后过滤这个新对象：'
- en: '[PRE7]'
  id: totrans-33
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: '*In the call to `select`, the first argument `murders` is an object, but `state`,
    `region`, and `rate` are variable names.'
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: '*在`select`的调用中，第一个参数`murders`是一个对象，但`state`、`region`和`rate`是变量名。'
- en: '**dplyr** offers a series of helper functions to select columns based on their
    content. For example, the following code uses the function `where` to keep only
    the numeric columns:'
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: '**dplyr**提供了一系列辅助函数，用于根据内容选择列。例如，以下代码使用`where`函数仅保留数值列：'
- en: '[PRE8]'
  id: totrans-36
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: '*The helper functions `starts_with`, `ends_with`, `contains`, `matches`, and
    `num_range` can be used to select columns based on their names. Here is an example
    showing all the rows that start with `r`:'
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: '*辅助函数`starts_with`、`ends_with`、`contains`、`matches`和`num_range`可以用来根据列名选择列。以下是一个示例，显示所有以`r`开头的行：'
- en: '[PRE9]'
  id: totrans-38
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: '*The helper function `everything` selects all columns.******'
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: '*辅助函数`everything`选择所有列。******'
- en: '***4.2.4 Transforming variables***'
  id: totrans-40
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '***4.2.4 变量转换***'
- en: '***The function `mutate` can also be used to transform variables. For example,
    the following code takes the log transformation of the population variable:'
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: '***函数`mutate`也可以用于转换变量。例如，以下代码对人口变量进行了对数转换：'
- en: '[PRE10]'
  id: totrans-42
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: '*Often, we need to apply the same transformation to several variables. The
    function `across` facilitates the operation. For example if want to log transform
    both population and total murders we can use:'
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: '*通常，我们需要将相同的转换应用于多个变量。函数`across`简化了这一操作。例如，如果我们想对人口总数和谋杀总数进行对数转换，我们可以使用：'
- en: '[PRE11]'
  id: totrans-44
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: '*The helper functions come in handy when using across. An example is if we
    want to apply the same transformation to all numeric variables:'
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: '*当使用`across`时，辅助函数非常有用。例如，如果我们想将相同的转换应用于所有数值变量：'
- en: '[PRE12]'
  id: totrans-46
  prefs: []
  type: TYPE_PRE
  zh: '[PRE12]'
- en: '*or all character variables:'
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: '*或者所有字符变量：'
- en: '[PRE13]'
  id: totrans-48
  prefs: []
  type: TYPE_PRE
  zh: '[PRE13]'
- en: '**You are ready to do exercises 5-11.*********'
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: '**您现在可以开始练习5-11题了。*********'
- en: '*****4.3 The pipe*****'
  id: totrans-50
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '*****4.3 管道*****'
- en: '*****In R we can perform a series of operations, for example `select` and then
    `filter`, by sending the results of one function to another using what is called
    the *pipe operator*: `%>%`. Since R version 4.1.0, you can also use `|>`. Some
    details are included below.'
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: '*****在R中，我们可以通过使用所谓的*管道操作符* `%>%` 将一个函数的结果传递给另一个函数来执行一系列操作，例如`select`然后`filter`。自R版本4.1.0起，您也可以使用`|>`。以下包含了一些细节。'
- en: 'We wrote code in [Section 4.2.3](#sec-tidyverse-col-subset) to show three variables
    (state, region, rate) for states that have murder rates below 0.71\. To do this,
    we defined the intermediate object `new_dataframe`. In **dplyr** we can write
    code that looks more like a description of what we want to do without intermediate
    objects:'
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: 我们在[第4.2.3节](#sec-tidyverse-col-subset)中编写了代码，以展示具有谋杀率低于0.71的州的三个变量（州、地区、比率）。为此，我们定义了中间对象`new_dataframe`。在**dplyr**中，我们可以编写看起来更像是我们想要执行的操作描述的代码，而不需要中间对象：
- en: \[ \mbox{original data } \rightarrow \mbox{ select } \rightarrow \mbox{ filter
    } \]
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mbox{原始数据 } \rightarrow \mbox{ select } \rightarrow \mbox{ filter } \]
- en: 'For such an operation, we can use the pipe `|>`. The code looks like this:'
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
  zh: 对于此类操作，我们可以使用管道`|>`。代码如下：
- en: '[PRE14]'
  id: totrans-55
  prefs: []
  type: TYPE_PRE
  zh: '[PRE14]'
- en: '*This line of code is equivalent to the two lines in [Section 4.2.3](#sec-tidyverse-col-subset)
    What is going on here?'
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: '*此行代码等同于[第4.2.3节](#sec-tidyverse-col-subset)中的两行代码。这里发生了什么？'
- en: 'In general, the pipe *sends* the result of the left side of the pipe to be
    the first argument of the function on the right side of the pipe. Here is a very
    simple example:'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: 通常，管道会将管道左侧的结果发送到管道右侧函数的第一个参数。这里有一个非常简单的例子：
- en: '[PRE15]'
  id: totrans-58
  prefs: []
  type: TYPE_PRE
  zh: '[PRE15]'
- en: '*We can continue to pipe values along:'
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: '*我们可以继续将值通过管道传递：'
- en: '[PRE16]'
  id: totrans-60
  prefs: []
  type: TYPE_PRE
  zh: '[PRE16]'
- en: '*The above statement is equivalent to `log2(sqrt(16))`.'
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: '*上述语句等同于`log2(sqrt(16))`。'
- en: 'Remember that the pipe sends values to the first argument, so we can define
    other arguments as if the first argument is already defined:'
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: 记住，管道将值发送到第一个参数，因此我们可以定义其他参数，就像第一个参数已经定义一样：
- en: '[PRE17]'
  id: totrans-63
  prefs: []
  type: TYPE_PRE
  zh: '[PRE17]'
- en: '*Therefore, when using the pipe with data frames and **dplyr**, we no longer
    need to specify the required first argument since the **dplyr** functions we have
    described all take the data as the first argument. In the code we wrote:'
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: '*因此，当使用管道与数据框和**dplyr**一起时，我们不再需要指定所需的第一参数，因为我们所描述的**dplyr**函数都接受数据作为第一个参数。在代码中，我们这样写：'
- en: '[PRE18]'
  id: totrans-65
  prefs: []
  type: TYPE_PRE
  zh: '[PRE18]'
- en: '*`murders` is the first argument of the `select` function, and the new data
    frame (formerly `new_dataframe`) is the first argument of the `filter` function.'
  id: totrans-66
  prefs: []
  type: TYPE_NORMAL
  zh: '*`murders`是`select`函数的第一个参数，而新的数据框（以前称为`new_dataframe`）是`filter`函数的第一个参数。'
- en: Note that the pipe works well with functions where the first argument is the
    input data. Functions in **tidyverse** packages like **dplyr** have this format
    and can be used easily with the pipe.**********
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，管道操作符与那些第一个参数是输入数据的函数配合得很好。**tidyverse**包中的**dplyr**函数具有这种格式，并且可以很容易地与管道操作符一起使用。**********
- en: '****4.4 Summarizing data****'
  id: totrans-68
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '****4.4 数据汇总****'
- en: '****An important part of exploratory data analysis is summarizing data. The
    average and standard deviation are two examples of widely used summary statistics.
    More informative summaries can often be achieved by first splitting data into
    groups. In this section, we cover two new **dplyr** verbs that make these computations
    easier: `summarize` and `group_by`. We learn to access resulting values using
    the `pull` function.'
  id: totrans-69
  prefs: []
  type: TYPE_NORMAL
  zh: '****探索性数据分析的一个重要部分是总结数据。平均值和标准差是广泛使用的摘要统计的两个例子。通过首先将数据分成组，通常可以获取更有信息量的摘要。在本节中，我们介绍了两个新的**dplyr**动词，使这些计算更容易：`summarize`和`group_by`。我们学习使用`pull`函数访问结果值。'
- en: 4.4.1 The `summarize` function
  id: totrans-70
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 4.4.1 `summarize`函数
- en: The `summarize` function in **dplyr** provides a way to compute summary statistics
    with intuitive and readable code. We start with a simple example based on heights.
    The `heights` dataset includes heights and sex reported by students in an in-class
    survey.
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: '**dplyr**中的`summarize`函数提供了一种使用直观且易于阅读的代码来计算摘要统计的方法。我们从基于身高的简单示例开始。`heights`数据集包括课堂调查中报告的学生身高和性别。'
- en: '[PRE19]'
  id: totrans-72
  prefs: []
  type: TYPE_PRE
  zh: '[PRE19]'
- en: '*The following code computes the average and standard deviation for females:'
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: '*以下代码计算了女性的平均值和标准差：'
- en: '[PRE20]'
  id: totrans-74
  prefs: []
  type: TYPE_PRE
  zh: '[PRE20]'
- en: '*This takes our original data frame as input, filters it to keep only females,
    and then produces a new summarized table with just the average and the standard
    deviation of heights. We get to choose the names of the columns of the resulting
    table. For example, above we decided to use `average` and `standard_deviation`,
    but we could have used other names just the same.'
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: '*这个函数以我们的原始数据框为输入，过滤它以仅保留女性，然后生成一个新的摘要表，其中只包含平均身高和标准差。我们可以选择结果表的列名。例如，上面我们决定使用`average`和`standard_deviation`，但我们可以使用其他名称。'
- en: 'Because the resulting table stored in `s` is a data frame, we can access the
    components with the accessor `$`:'
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: 因为存储在`s`中的结果表是一个数据框，我们可以使用访问器`$`来访问其组件：
- en: '[PRE21]'
  id: totrans-77
  prefs: []
  type: TYPE_PRE
  zh: '[PRE21]'
- en: '*As with most other **dplyr** functions, `summarize` is aware of the variable
    names and we can use them directly. So when inside the call to the `summarize`
    function we write `mean(height)`, the function is accessing the column with the
    name “height” and then computing the average of the resulting numeric vector.
    We can compute any other summary that operates on vectors and returns a single
    value.'
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: '*与大多数其他**dplyr**函数一样，`summarize`了解变量名，我们可以直接使用它们。所以当我们在`summarize`函数的调用中写`mean(height)`时，函数正在访问名为“height”的列，然后计算结果数值向量的平均值。我们可以计算任何其他在向量上操作并返回单个值的摘要。'
- en: 'For another example of how we can use the `summarize` function, let’s compute
    the average murder rate for the United States. Remember our data table includes
    total murders and population size for each state and we have already used **dplyr**
    to add a murder rate column:'
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
  zh: 以下是我们如何使用`summarize`函数的另一个示例，让我们计算美国的平均谋杀率。记住，我们的数据表包括每个州的谋杀总数和人口规模，我们之前已经使用**dplyr**添加了一个谋杀率列：
- en: '[PRE22]'
  id: totrans-80
  prefs: []
  type: TYPE_PRE
  zh: '[PRE22]'
- en: '*Remember that the US murder rate is **not** the average of the state murder
    rates:'
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
  zh: '*记住，美国的谋杀率**不是**州谋杀率的平均值：'
- en: '[PRE23]'
  id: totrans-82
  prefs: []
  type: TYPE_PRE
  zh: '[PRE23]'
- en: '*This is because in the computation above, the small states are given the same
    weight as the large ones. The US murder rate is the total number of murders in
    the US divided by the total US population. So the correct computation is:'
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
  zh: '*这是因为在上面的计算中，小州被赋予了与大州相同的权重。美国的谋杀率是美国谋杀总数除以美国总人口。因此，正确的计算方法是：'
- en: '[PRE24]'
  id: totrans-84
  prefs: []
  type: TYPE_PRE
  zh: '[PRE24]'
- en: '*This computation counts larger states proportionally to their size which results
    in a larger value.******'
  id: totrans-85
  prefs: []
  type: TYPE_NORMAL
  zh: '*这种计算按比例计算较大州的规模，从而得到更大的值。******'
- en: '***4.4.2 Multiple summaries***'
  id: totrans-86
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '***4.4.2 多个摘要***'
- en: '***Suppose we want three summaries from the same variable such as the median,
    minimum, and maximum heights. We can use `summarize` like this:'
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: '***假设我们想要从同一个变量中获取三个摘要，例如中位数、最小值和最大值。我们可以这样使用`summarize`：'
- en: '[PRE25]'
  id: totrans-88
  prefs: []
  type: TYPE_PRE
  zh: '[PRE25]'
- en: '*But we can obtain these three values with just one line using the `quantile`
    function: `quantile(x, c(0.5, 0, 1))` returns the median (50th percentile), the
    min (0th percentile), and max (100th percentile) of the vector `x`. Here we can’t
    use `summarize` because it expects one value per row. Instead we have to use the
    `reframe` function:'
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
  zh: '*但我们可以使用`quantile`函数仅用一行代码就获得这三个值：`quantile(x, c(0.5, 0, 1))`返回向量`x`的中位数（50th
    百分位数）、最小值（0th 百分位数）和最大值（100th 百分位数）。在这里，我们不能使用`summarize`，因为它期望每行只有一个值。相反，我们必须使用`reframe`函数：'
- en: '[PRE26]'
  id: totrans-90
  prefs: []
  type: TYPE_PRE
  zh: '[PRE26]'
- en: '*However, if we want a column per summary, as the `summarize` call above, we
    have to define a function that returns a data frame like this:'
  id: totrans-91
  prefs: []
  type: TYPE_NORMAL
  zh: '*然而，如果我们想为每个总结定义一个列，就像上面的 `summarize` 调用一样，我们必须定义一个返回类似这样的数据框的函数：'
- en: '[PRE27]'
  id: totrans-92
  prefs: []
  type: TYPE_PRE
  zh: '[PRE27]'
- en: '*Then we can call `summarize` as above:'
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: '*然后我们可以像上面一样调用 `summarize`：'
- en: '[PRE28]******'
  id: totrans-94
  prefs: []
  type: TYPE_NORMAL
  zh: '[PRE28]******'
- en: '***4.4.3 Group then summarize with `group_by`***'
  id: totrans-95
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '***4.4.3 使用 `group_by` 进行分组后总结***'
- en: '***A common operation in data exploration is to first split data into groups
    and then compute summaries for each group. For example, we may want to compute
    the average and standard deviation for men’s and women’s heights separately. The
    `group_by` function helps us do this.'
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: '***数据探索中一个常见的操作是首先将数据分成组，然后对每个组进行总结。例如，我们可能想分别计算男性和女性身高的平均值和标准差。`group_by`
    函数帮助我们做到这一点。'
- en: 'If we type this:'
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们输入这个：
- en: '[PRE29]'
  id: totrans-98
  prefs: []
  type: TYPE_PRE
  zh: '[PRE29]'
- en: '*The result does not look very different from `heights`, except we see `Groups:
    sex [2]` when we print the object. Although not immediately obvious from its appearance,
    this is now a special data frame called a *grouped data frame*, and **dplyr**
    functions, in particular `summarize`, will behave differently when acting on this
    object. Conceptually, you can think of this table as many tables, with the same
    columns but not necessarily the same number of rows, stacked together in one object.
    When we summarize the data after grouping, this is what happens:'
  id: totrans-99
  prefs: []
  type: TYPE_NORMAL
  zh: '*结果看起来与 `heights` 并没有太大区别，除了打印对象时我们会看到 `Groups: sex [2]`。尽管从外观上并不立即明显，这现在是一个特殊的数据框，称为
    *分组数据框*，并且 **dplyr** 函数，特别是 `summarize`，在作用于这个对象时会表现出不同的行为。从概念上讲，你可以将这个表格视为许多表格，它们具有相同的列，但行数不一定相同，堆叠在一个对象中。当我们对分组后的数据进行总结时，就会发生这种情况：'
- en: '[PRE30]'
  id: totrans-100
  prefs: []
  type: TYPE_PRE
  zh: '[PRE30]'
- en: '*The `summarize` function applies the summarization to each group separately.'
  id: totrans-101
  prefs: []
  type: TYPE_NORMAL
  zh: '*`summarize` 函数会对每个分组单独应用总结。'
- en: 'For another example, let’s compute the median, minimum, and maximum murder
    rate in the four regions of the country using the `median_min_max` defined above:'
  id: totrans-102
  prefs: []
  type: TYPE_NORMAL
  zh: 作为另一个例子，让我们使用上面定义的 `median_min_max` 计算国家四个地区的谋杀率的中间值、最小值和最大值：
- en: '[PRE31]*****'
  id: totrans-103
  prefs: []
  type: TYPE_NORMAL
  zh: '[PRE31]*****'
- en: '***4.4.4 Extracting variables with `pull`***'
  id: totrans-104
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '***4.4.4 使用 `pull` 提取变量***'
- en: '***The `us_murder_rate` object defined in [Section 4.4.1](#sec-summarize) represents
    just one number. Yet we are storing it in a data frame:'
  id: totrans-105
  prefs: []
  type: TYPE_NORMAL
  zh: '***在 [4.4.1 节](#sec-summarize) 中定义的 `us_murder_rate` 对象只代表一个数字。然而，我们将其存储在一个数据框中：'
- en: '[PRE32]'
  id: totrans-106
  prefs: []
  type: TYPE_PRE
  zh: '[PRE32]'
- en: '*since, as most **dplyr** functions, `summarize` always returns a data frame.'
  id: totrans-107
  prefs: []
  type: TYPE_NORMAL
  zh: '*因为，像大多数 **dplyr** 函数一样，`summarize` 总是返回一个数据框。'
- en: 'This might be problematic if we want to use this result with functions that
    require a numeric value. Here we show a useful trick for accessing values stored
    in data when using pipes: when a data object is piped that object and its columns
    can be accessed using the `pull` function. To get a number from the original data
    table with one additional line of code we can type:'
  id: totrans-108
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们想使用需要数值型值的函数，这个结果可能会出现问题。这里我们展示了一个在通过管道使用数据时访问存储的值的实用技巧：当一个数据对象通过管道传递时，可以使用
    `pull` 函数访问该对象及其列。要从原始数据表中获取一个数字，我们只需多写一行代码，可以输入：
- en: '[PRE33]'
  id: totrans-109
  prefs: []
  type: TYPE_PRE
  zh: '[PRE33]'
- en: '*which is now a numeric:'
  id: totrans-110
  prefs: []
  type: TYPE_NORMAL
  zh: '*现在是一个数值型：'
- en: '[PRE34]*********'
  id: totrans-111
  prefs: []
  type: TYPE_NORMAL
  zh: '[PRE34]*********'
- en: '****4.5 Sorting****'
  id: totrans-112
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '****4.5 排序****'
- en: '****When examining a dataset, it is often convenient to sort the data frame
    by the different columns. We know about the `order` and `sort` function, but for
    ordering entire data frames, the **dplyr** function `arrange` is useful. For example,
    here we order the states by population size:'
  id: totrans-113
  prefs: []
  type: TYPE_NORMAL
  zh: '****在检查数据集时，按不同的列对数据框进行排序通常很方便。我们了解 `order` 和 `sort` 函数，但为了对整个数据框进行排序，**dplyr**
    函数 `arrange` 非常有用。例如，这里我们按人口规模对州进行排序：'
- en: '[PRE35]'
  id: totrans-114
  prefs: []
  type: TYPE_PRE
  zh: '[PRE35]'
- en: '*With `arrange` we get to decide which column to sort by. To see the states
    sorted by murder rates, for example, we would use `arrange(rate)` instead.'
  id: totrans-115
  prefs: []
  type: TYPE_NORMAL
  zh: '*使用 `arrange`，我们可以决定按哪个列进行排序。例如，要按谋杀率对州进行排序，我们会使用 `arrange(rate)`。'
- en: 'Note that the default behavior is to order in ascending order. In **dplyr**,
    the function `desc` transforms a vector so that it is in descending order. To
    sort the data frame by murder rates in descending order, we can type:'
  id: totrans-116
  prefs: []
  type: TYPE_NORMAL
  zh: 注意默认行为是按升序排序。在 **dplyr** 中，函数 `desc` 将向量转换成降序。要按谋杀率降序排序数据框，我们可以输入：
- en: '[PRE36]'
  id: totrans-117
  prefs: []
  type: TYPE_PRE
  zh: '[PRE36]'
- en: '*### 4.5.1 Nested sorting'
  id: totrans-118
  prefs: []
  type: TYPE_NORMAL
  zh: '*### 4.5.1 嵌套排序'
- en: 'If we are ordering by a column with ties, we can use a second column to break
    the tie. Similarly, a third column can be used to break ties between first and
    second and so on. Here we order by `region`, then within region we order by murder
    rate:'
  id: totrans-119
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们按有并列的列进行排序，我们可以使用第二个列来打破并列。同样，第三个列可以用来打破第一和第二之间的并列，依此类推。这里我们按 `region` 排序，然后在区域内按谋杀率排序：
- en: '[PRE37]'
  id: totrans-120
  prefs: []
  type: TYPE_PRE
  zh: '[PRE37]'
- en: '*4.5.2 The top \(n\)*'
  id: totrans-121
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '*4.5.2 顶部 \(n\) 个*'
- en: '*In the code above, we have used the function `head` to avoid having the page
    fill up with the entire dataset. For instance, using `arrange(desc(rate))` followed
    by `head` would show the 6 states with the largest murder rates, in order. Instead,
    to view a specific number of observations with the highest murder rates, we can
    use the `slice_max` function. This function takes a data frame as it’s first argument,
    the number of rows to show in the second, and the variable to filter by in the
    third. Here is an example of how to see the top 5 rows:'
  id: totrans-122
  prefs: []
  type: TYPE_NORMAL
  zh: '*在上面的代码中，我们使用了`head`函数来避免整个数据集填充整个页面。例如，使用`arrange(desc(rate))`然后使用`head`将按顺序显示谋杀率最高的6个州。相反，要查看具有最高谋杀率的具体数量的观测值，我们可以使用`slice_max`函数。这个函数将其第一个参数作为数据框，第二个参数是要显示的行数，第三个参数是要过滤的变量。以下是一个查看前5行示例：'
- en: '[PRE38]'
  id: totrans-123
  prefs: []
  type: TYPE_PRE
  zh: '[PRE38]'
- en: '*The function `slice_min` does the same, but for the smallest values.'
  id: totrans-124
  prefs: []
  type: TYPE_NORMAL
  zh: '*`slice_min`函数做的是同样的事情，但是针对最小值。'
- en: '*You are ready to do exercises 12-19.*********'
  id: totrans-125
  prefs: []
  type: TYPE_NORMAL
  zh: '*你准备好做12-19题练习了。*********'
- en: '*****4.6 Tibbles*****'
  id: totrans-126
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '*****4.6 Tibbles*****'
- en: '*****To work with the tidyverse, data must be stored in data frames. We introduced
    the data frame in [Section 2.3.1](R-basics.html#sec-data-frames) and have been
    using the `murders` data frame throughout the book. In [Section 4.4.3](#sec-group-by)
    we introduced the `group_by` function, which permits stratifying data before computing
    summary statistics. But where is the group information stored in the data frame?'
  id: totrans-127
  prefs: []
  type: TYPE_NORMAL
  zh: '*****要使用tidyverse，数据必须存储在数据框中。我们在[第2.3.1节](R-basics.html#sec-data-frames)中介绍了数据框，并在整本书中使用了`murders`数据框。在[第4.4.3节](#sec-group-by)中，我们介绍了`group_by`函数，它允许在计算汇总统计之前对数据进行分层。但是，数据框中存储了分组信息在哪里？'
- en: '[PRE39]'
  id: totrans-128
  prefs: []
  type: TYPE_PRE
  zh: '[PRE39]'
- en: '*Notice that there are no columns with this information. But, if you look closely
    at the output above, you see the line `A tibble` followed by dimensions. We can
    learn the class of the returned object using:'
  id: totrans-129
  prefs: []
  type: TYPE_NORMAL
  zh: '*注意，没有包含此信息的列。但是，如果你仔细查看上面的输出，你会看到`A tibble`后面跟着维度。我们可以使用以下方法了解返回对象的类别：'
- en: '[PRE40]'
  id: totrans-130
  prefs: []
  type: TYPE_PRE
  zh: '[PRE40]'
- en: '*The `tbl`, pronounced “tibble”, is a special kind of data frame. The functions
    `group_by` and `summarize` always return this type of data frame. The `group_by`
    function returns a special kind of `tbl`, the `grouped_df`. We will say more about
    these later. For consistency, the **dplyr** manipulation verbs (`select`, `filter`,
    `mutate`, and `arrange`) preserve the class of the input: if they receive a regular
    data frame they return a regular data frame, while if they receive a tibble they
    return a tibble. But tibbles are the preferred format in the tidyverse and as
    a result tidyverse functions that produce a data frame from scratch return a tibble.
    For example, in [Chapter 6](importing-data.html) we will see that tidyverse functions
    used to import data create tibbles.*******'
  id: totrans-131
  prefs: []
  type: TYPE_NORMAL
  zh: '*`tbl`，发音为“tibble”，是一种特殊的数据框。`group_by`和`summarize`函数总是返回这种类型的数据框。`group_by`函数返回一种特殊的`tbl`，即`grouped_df`。我们将在稍后详细介绍这些。为了保持一致性，**dplyr**操作符（`select`、`filter`、`mutate`和`arrange`）保留输入的类别：如果它们接收一个常规数据框，则返回一个常规数据框；如果它们接收一个tibble，则返回一个tibble。但是，tibbles是tidyverse中首选的格式，因此tidyverse函数从头开始生成数据框时返回一个tibble。例如，在[第6章](importing-data.html)中，我们将看到tidyverse函数用于导入数据时创建tibbles。'
- en: '*****4.7 Tibbles versus data frames*****'
  id: totrans-132
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '*****4.7 Tibbles与数据框*****'
- en: '*****Tibbles are very similar to data frames. In fact, you can think of them
    as a modern version of data frames. Nonetheless there are some important differences
    which we describe next.'
  id: totrans-133
  prefs: []
  type: TYPE_NORMAL
  zh: '*****Tibbles与数据框非常相似。实际上，你可以把它们看作是数据框的现代版本。尽管如此，它们之间还有一些重要的区别，我们将在下面描述。'
- en: '**(1) Tibbles display better**'
  id: totrans-134
  prefs: []
  type: TYPE_NORMAL
  zh: '**(1) Tibbles显示得更好**'
- en: The print method for tibbles is more readable than that of a data frame. To
    see this, compare the outputs of typing `murders` and the output of murders if
    we convert it to a tibble. We can do this using `as_tibble(murders)`. If using
    RStudio, output for a tibble adjusts to your window size. To see this, change
    the width of your R console and notice how more/less columns are shown.
  id: totrans-135
  prefs: []
  type: TYPE_NORMAL
  zh: Tibbles的打印方法比数据框的可读性更好。为了看到这一点，比较一下输入`murders`和将`murders`转换为tibble后的输出。我们可以使用`as_tibble(murders)`来完成这个操作。如果在RStudio中使用，tibble的输出会根据你的窗口大小进行调整。为了看到这一点，改变你的R控制台宽度，注意显示的列数是更多还是更少。
- en: 'If you subset the columns of a data frame, you may get back an object that
    is not a data frame, such as a vector or scalar. For example:'
  id: totrans-136
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你从数据框中提取列，你可能会得到一个不是数据框的对象，例如向量或标量。例如：
- en: '[PRE41]'
  id: totrans-137
  prefs: []
  type: TYPE_PRE
  zh: '[PRE41]'
- en: '*is not a data frame. With tibbles this does not happen:'
  id: totrans-138
  prefs: []
  type: TYPE_NORMAL
  zh: '*不是一个数据框。使用tibbles就不会发生这种情况：'
- en: '[PRE42]'
  id: totrans-139
  prefs: []
  type: TYPE_PRE
  zh: '[PRE42]'
- en: '*This is useful in the tidyverse since functions require data frames as input.'
  id: totrans-140
  prefs: []
  type: TYPE_NORMAL
  zh: '*这在 tidyverse 中很有用，因为函数需要数据框作为输入。'
- en: 'With tibbles, if you want to access the vector that defines a column, and not
    get back a data frame, you need to use the accessor `$`:'
  id: totrans-141
  prefs: []
  type: TYPE_NORMAL
  zh: 使用 tibbles，如果你想访问定义列的向量，而不是得到一个数据框，你需要使用访问器 `$`：
- en: '[PRE43]'
  id: totrans-142
  prefs: []
  type: TYPE_PRE
  zh: '[PRE43]'
- en: '*A related feature is that tibbles will give you a warning if you try to access
    a column that does not exist. If we accidentally write `Population` instead of
    `population` this:'
  id: totrans-143
  prefs: []
  type: TYPE_NORMAL
  zh: '*一个相关特性是，如果你尝试访问一个不存在的列，tibbles 会给出警告。如果我们不小心将 `Population` 写成 `population`
    而不是这样：'
- en: '[PRE44]'
  id: totrans-144
  prefs: []
  type: TYPE_PRE
  zh: '[PRE44]'
- en: '*returns a `NULL` with no warning, which can make it harder to debug. In contrast,
    if we try this with a tibble we get an informative warning:'
  id: totrans-145
  prefs: []
  type: TYPE_NORMAL
  zh: '*返回一个没有警告的 `NULL`，这可能会使调试变得更困难。相比之下，如果我们尝试使用 tibble，我们会得到一个有用的警告：'
- en: '[PRE45]'
  id: totrans-146
  prefs: []
  type: TYPE_PRE
  zh: '[PRE45]'
- en: '***(2) Tibbles can have complex entries**'
  id: totrans-147
  prefs: []
  type: TYPE_NORMAL
  zh: '***(2) Tibbles 可以有复杂条目**'
- en: 'While data frame columns need to be vectors of numbers, strings, or logical
    values, tibbles can have more complex objects, such as lists or functions. Also,
    we can create tibbles with functions:'
  id: totrans-148
  prefs: []
  type: TYPE_NORMAL
  zh: 虽然数据框的列需要是数字、字符串或逻辑值的向量，但 tibbles 可以有更复杂的对象，例如列表或函数。此外，我们还可以使用函数创建 tibbles：
- en: '[PRE46]'
  id: totrans-149
  prefs: []
  type: TYPE_PRE
  zh: '[PRE46]'
- en: '***(3) Tibbles can be grouped**'
  id: totrans-150
  prefs: []
  type: TYPE_NORMAL
  zh: '***(3) Tibbles 可以分组**'
- en: 'The function `group_by` returns a special kind of tibble: a grouped tibble.
    This class stores information that lets you know which rows are in which groups.
    The tidyverse functions, in particular the `summarize` function, are aware of
    the group information.'
  id: totrans-151
  prefs: []
  type: TYPE_NORMAL
  zh: 函数 `group_by` 返回一种特殊的 tibble：分组 tibble。这个类存储了信息，让你知道哪些行属于哪个组。tidyverse 函数，特别是
    `summarize` 函数，都了解分组信息。
- en: 4.7.1 Creating tibbles
  id: totrans-152
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 4.7.1 创建 tibbles
- en: It is sometimes useful for us to create our own data frames. To create a data
    frame in the tibble format, you can do this by using the `tibble` function.
  id: totrans-153
  prefs: []
  type: TYPE_NORMAL
  zh: 有时我们创建自己的数据框是有用的。要在 tibble 格式下创建数据框，你可以通过使用 `tibble` 函数来实现。
- en: '[PRE47]'
  id: totrans-154
  prefs: []
  type: TYPE_PRE
  zh: '[PRE47]'
- en: '*Note that base R (without packages loaded) has the `data.frame` function that
    can be used to create a regular data frame rather than a tibble.'
  id: totrans-155
  prefs: []
  type: TYPE_NORMAL
  zh: '*请注意，基础 R（未加载任何包）有一个 `data.frame` 函数，可以用来创建常规数据框而不是 tibble。'
- en: '[PRE48]'
  id: totrans-156
  prefs: []
  type: TYPE_PRE
  zh: '[PRE48]'
- en: '*To convert a regular data frame to a tibble, you can use the `as_tibble` function.'
  id: totrans-157
  prefs: []
  type: TYPE_NORMAL
  zh: '*要将常规数据框转换为 tibble，你可以使用 `as_tibble` 函数。'
- en: '[PRE49]*************'
  id: totrans-158
  prefs: []
  type: TYPE_NORMAL
  zh: '[PRE49]*************'
- en: '****4.8 The placeholder****'
  id: totrans-159
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '****4.8 占位符****'
- en: '****One of the advantages of using the pipe `|>` is that we do not have to
    keep naming new objects as we manipulate the data frame. The object on the left-hand
    side of the pipe is used as the first argument of the function on the right-hand
    side of the pipe. But what if we want to pass it as argument to the right-hand
    side function that is not the first? The answer is the placeholder operator `_`
    (for the `%>%` pipe the placeholder is `.`). Below is a simple example that passes
    the `base` argument to the `log` function. The following three are equivalent:'
  id: totrans-160
  prefs: []
  type: TYPE_NORMAL
  zh: '****使用管道 `|>` 的一大优点是我们不需要在操作数据框时不断为新对象命名。管道左侧的对象用作管道右侧函数的第一个参数。但如果我们想将其作为非第一个参数传递给右侧函数怎么办？答案是占位符运算符
    `_`（对于 `%>%` 管道，占位符是 `.`）。下面是一个简单示例，它将 `base` 参数传递给 `log` 函数。以下三个是等价的：'
- en: '[PRE50]****'
  id: totrans-161
  prefs: []
  type: TYPE_NORMAL
  zh: '[PRE50]****'
- en: '****4.9 The **purrr** package****'
  id: totrans-162
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '****4.9 **purrr** 包****'
- en: '****In [Section 3.5](programming-basics.html#sec-vectorization) we learned
    about the `sapply` function, which permitted us to apply the same function to
    each element of a vector. We constructed a function and used `sapply` to compute
    the sum of the first `n` integers for several values of `n` like this:'
  id: totrans-163
  prefs: []
  type: TYPE_NORMAL
  zh: '****在 [第 3.5 节](programming-basics.html#sec-vectorization) 我们学习了 `sapply` 函数，它允许我们将相同的函数应用于向量的每个元素。我们构建了一个函数，并使用
    `sapply` 来计算 `n` 的前 `n` 个整数的和，如下所示：'
- en: '[PRE51]'
  id: totrans-164
  prefs: []
  type: TYPE_PRE
  zh: '[PRE51]'
- en: '*This type of operation, applying the same function or procedure to elements
    of an object, is quite common in data analysis. The **purrr** package includes
    functions similar to `sapply` but that better interact with other tidyverse functions.
    The main advantage is that we can better control the output type of functions.
    In contrast, `sapply` can return several different object types; for example,
    we might expect a numeric result from a line of code, but `sapply` might convert
    our result to character under some circumstances. **purrr** functions will never
    do this: they will return objects of a specified type or return an error if this
    is not possible.'
  id: totrans-165
  prefs: []
  type: TYPE_NORMAL
  zh: '*这种类型的操作，将相同的函数或过程应用于对象中的元素，在数据分析中相当常见。`purrr`包包括类似于`sapply`但与其他tidyverse函数更好地交互的函数。主要优势是我们可以更好地控制函数的输出类型。相比之下，`sapply`可以返回几种不同的对象类型；例如，我们可能期望一行代码的结果是数值，但在某些情况下`sapply`可能会将我们的结果转换为字符。`purrr`函数永远不会这样做：它们将返回指定类型的对象，或者在不可能的情况下返回错误。*'
- en: 'The first **purrr** function we will learn is `map`, which works very similar
    to `sapply` but always, without exception, returns a list:'
  id: totrans-166
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将要学习的第一个`purrr`函数是`map`，它的工作方式与`sapply`非常相似，但始终，没有例外，返回一个列表：
- en: '[PRE52]'
  id: totrans-167
  prefs: []
  type: TYPE_PRE
  zh: '[PRE52]'
- en: '*If we want a numeric vector, we can instead use `map_dbl` which always returns
    a vector of numeric values.'
  id: totrans-168
  prefs: []
  type: TYPE_NORMAL
  zh: '*如果我们想要一个数值向量，我们可以使用`map_dbl`，它总是返回一个数值向量。*'
- en: '[PRE53]'
  id: totrans-169
  prefs: []
  type: TYPE_PRE
  zh: '[PRE53]'
- en: '*This produces the same results as the `sapply` call shown above.'
  id: totrans-170
  prefs: []
  type: TYPE_NORMAL
  zh: '*这会产生与上面显示的`sapply`调用相同的结果。*'
- en: 'A particularly useful **purrr** function for interacting with the rest of the
    tidyverse is `map_df`, which always returns a tibble data frame. However, the
    function being called needs to return a vector or a list with names. For this
    reason, the following code would result in a `Argument 1 must have names` error:'
  id: totrans-171
  prefs: []
  type: TYPE_NORMAL
  zh: 一个特别有用的`purrr`函数，用于与其他tidyverse交互，是`map_df`，它总是返回一个tibble数据框。然而，被调用的函数需要返回一个带有名称的向量或列表。因此，以下代码会导致`Argument
    1 must have names`错误：
- en: '[PRE54]'
  id: totrans-172
  prefs: []
  type: TYPE_PRE
  zh: '[PRE54]'
- en: '*The function needs to return a data frame to make this work:'
  id: totrans-173
  prefs: []
  type: TYPE_NORMAL
  zh: '*函数需要返回一个数据框才能使这起作用：*'
- en: '[PRE55]'
  id: totrans-174
  prefs: []
  type: TYPE_PRE
  zh: '[PRE55]'
- en: '*The **purrr** package provides much more functionality not covered here. For
    more details you can consult [this online resource](https://jennybc.github.io/purrr-tutorial/)[¹](#fn1).*********'
  id: totrans-175
  prefs: []
  type: TYPE_NORMAL
  zh: '*`purrr`包提供了更多这里没有涵盖的功能。有关更多详细信息，您可以查阅[这个在线资源](https://jennybc.github.io/purrr-tutorial/)[¹](#fn1)。*********'
- en: '****4.10 Tidyverse conditionals****'
  id: totrans-176
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '****4.10 Tidyverse条件语句****'
- en: '****A typical data analysis will often involve one or more conditional operations.
    In [Section 3.1](programming-basics.html#sec-conditionals) we described the `ifelse`
    function, which we will use extensively in this book. In this section we present
    two **dplyr** functions that provide further functionality for performing conditional
    operations.'
  id: totrans-177
  prefs: []
  type: TYPE_NORMAL
  zh: '****典型数据分析通常涉及一个或多个条件操作。在[第3.1节](programming-basics.html#sec-conditionals)中，我们描述了`ifelse`函数，我们将在本书中广泛使用它。在本节中，我们介绍了两个`dplyr`函数，它们提供了执行条件操作的功能。**'
- en: 4.10.1 `case_when`
  id: totrans-178
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 4.10.1 `case_when`
- en: 'The `case_when` function is useful for vectorizing conditional statements.
    It is similar to `ifelse` but can output any number of values, as opposed to just
    `TRUE` or `FALSE`. Here is an example splitting numbers into negative, positive,
    and 0:'
  id: totrans-179
  prefs: []
  type: TYPE_NORMAL
  zh: '`case_when`函数对于向量化条件语句很有用。它与`ifelse`类似，但可以输出任意数量的值，而不仅仅是`TRUE`或`FALSE`。以下是一个将数字分为负数、正数和0的示例：'
- en: '[PRE56]'
  id: totrans-180
  prefs: []
  type: TYPE_PRE
  zh: '[PRE56]'
- en: '*A common use for this function is to define categorical variables based on
    existing variables. For example, suppose we want to compare the murder rates in
    four groups of states: *New England*, *West Coast*, *South*, and *other*. For
    each state, we need to ask if it is in New England, if it is not we ask if it
    is in the West Coast, if not we ask if it is in the South, and if not we assign
    *other*. Here is how we use `case_when` to do this:'
  id: totrans-181
  prefs: []
  type: TYPE_NORMAL
  zh: '*这个函数的常见用途是根据现有变量定义分类变量。例如，假设我们想要比较四个州组（*新英格兰*，*西海岸*，*南部*和*其他*）的谋杀率。对于每个州，我们需要询问它是否在新英格兰，如果不是，我们询问它是否在西海岸，如果不是，我们询问它是否在南部，如果不是，我们将其归为*其他*。以下是使用`case_when`来完成此操作的示例：*'
- en: '[PRE57]*'
  id: totrans-182
  prefs: []
  type: TYPE_NORMAL
  zh: '[PRE57]*'
- en: '**4.10.2 `between`**'
  id: totrans-183
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '**4.10.2 `between`**'
- en: '**A common operation in data analysis is to determine if a value falls inside
    an interval. We can check this using conditionals. For example, to check if the
    elements of a vector `x` are between `a` and `b` we can type'
  id: totrans-184
  prefs: []
  type: TYPE_NORMAL
  zh: '**数据分析中的一个常见操作是确定一个值是否在区间内。我们可以使用条件语句来检查这一点。例如，为了检查向量`x`的元素是否在`a`和`b`之间，我们可以输入**'
- en: '[PRE58]'
  id: totrans-185
  prefs: []
  type: TYPE_PRE
  zh: '[PRE58]'
- en: '*However, this can become cumbersome, especially within the tidyverse approach.
    The `between` function performs the same operation.'
  id: totrans-186
  prefs: []
  type: TYPE_NORMAL
  zh: '*然而，这可能会变得繁琐，尤其是在tidyverse方法中。`between`函数执行相同的操作。'
- en: '[PRE59]*******'
  id: totrans-187
  prefs: []
  type: TYPE_NORMAL
  zh: '[PRE59]*******'
- en: '****4.11 Exercises****'
  id: totrans-188
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '****4.11 练习****'
- en: '****1\. Examine the built-in dataset `co2`. Which of the following is true:'
  id: totrans-189
  prefs: []
  type: TYPE_NORMAL
  zh: '****1. 检查内置数据集`co2`。以下哪项是正确的：'
- en: '`co2` is tidy data: it has one year for each row.'
  id: totrans-190
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`co2`是整洁数据：每行有一个年份。'
- en: '`co2` is not tidy: we need at least one column with a character vector.'
  id: totrans-191
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`co2`不是整洁数据：我们需要至少有一个字符向量列。'
- en: '`co2` is not tidy: it is a matrix instead of a data frame.'
  id: totrans-192
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`co2`不是整洁数据：它是一个矩阵而不是数据框。'
- en: '`co2` is not tidy: to be tidy we would have to wrangle it to have three columns
    (year, month and value), then each co2 observation would have a row.'
  id: totrans-193
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`co2`不是整洁数据：为了变得整洁，我们需要将其整理成三列（年份、月份和值），然后每个co2观测值将有一行。'
- en: '2\. Examine the built-in dataset `ChickWeight`. Which of the following is true:'
  id: totrans-194
  prefs: []
  type: TYPE_NORMAL
  zh: 2. 检查内置数据集`ChickWeight`。以下哪项是正确的：
- en: '`ChickWeight` is not tidy: each chick has more than one row.'
  id: totrans-195
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`ChickWeight`不是整洁数据：每只鸡有多于一行。'
- en: '`ChickWeight` is tidy: each observation (a weight) is represented by one row.
    The chick from which this measurement came is one of the variables.'
  id: totrans-196
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`ChickWeight`是整洁数据：每个观测值（一个重量）由一行表示。这个测量的鸡是其中一个变量。'
- en: '`ChickWeight` is not tidy: we are missing the year column.'
  id: totrans-197
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`ChickWeight`不是整洁数据：我们缺少年份列。'
- en: '`ChickWeight` is tidy: it is stored in a data frame.'
  id: totrans-198
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`ChickWeight`是整洁数据：它存储在数据框中。'
- en: '3\. Examine the built-in dataset `BOD`. Which of the following is true:'
  id: totrans-199
  prefs: []
  type: TYPE_NORMAL
  zh: 3. 检查内置数据集`BOD`。以下哪项是正确的：
- en: '`BOD` is not tidy: it only has six rows.'
  id: totrans-200
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`BOD`不是整洁数据：它只有六行。'
- en: '`BOD` is not tidy: the first column is just an index.'
  id: totrans-201
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`BOD`不是整洁数据：第一列只是一个索引。'
- en: '`BOD` is tidy: each row is an observation with two values (time and demand)'
  id: totrans-202
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`BOD`是整洁数据：每行是一个观测值，包含两个值（时间和需求）'
- en: '`BOD` is tidy: all small datasets are tidy by definition.'
  id: totrans-203
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`BOD`是整洁数据：所有小型数据集按定义都是整洁的。'
- en: '4\. Which of the following built-in datasets is tidy (you can pick more than
    one):'
  id: totrans-204
  prefs: []
  type: TYPE_NORMAL
  zh: 4. 以下哪个内置数据集是整洁的（您可以选择多个）：
- en: '`BJsales`'
  id: totrans-205
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`BJsales`'
- en: '`EuStockMarkets`'
  id: totrans-206
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`EuStockMarkets`'
- en: '`DNase`'
  id: totrans-207
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`DNase`'
- en: '`Formaldehyde`'
  id: totrans-208
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`Formaldehyde`'
- en: '`Orange`'
  id: totrans-209
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`Orange`'
- en: '`UCBAdmissions`'
  id: totrans-210
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`UCBAdmissions`'
- en: 5\. Load the **dplyr** package and the murders dataset.
  id: totrans-211
  prefs: []
  type: TYPE_NORMAL
  zh: 5. 加载**dplyr**包和谋杀数据集。
- en: '[PRE60]'
  id: totrans-212
  prefs: []
  type: TYPE_PRE
  zh: '[PRE60]'
- en: '*You can add columns using the **dplyr** function `mutate`. This function is
    aware of the column names and inside the function you can call them unquoted:'
  id: totrans-213
  prefs: []
  type: TYPE_NORMAL
  zh: '*您可以使用**dplyr**函数`mutate`添加列。此函数了解列名，在函数内部您可以不使用引号调用它们：'
- en: '[PRE61]'
  id: totrans-214
  prefs: []
  type: TYPE_PRE
  zh: '[PRE61]'
- en: '*We can write `population` rather than `murders$population`. The function `mutate`
    knows we are grabbing columns from `murders`.'
  id: totrans-215
  prefs: []
  type: TYPE_NORMAL
  zh: '*我们可以写`population`而不是`murders$population`。`mutate`函数知道我们在从`murders`中获取列。'
- en: Use the function `mutate` to add a murders column named `rate` with the per
    100,000 murder rate as in the example code above. Make sure you redefine `murders`
    as done in the example code above (`murders <- [your code]`) so we can keep using
    this variable.
  id: totrans-216
  prefs: []
  type: TYPE_NORMAL
  zh: 使用`mutate`函数添加一个名为`rate`的谋杀率列，其值如上例代码所示，每10万人谋杀率。确保您像示例代码中那样重新定义`murders`（`murders
    <- [your code]`），这样我们就可以继续使用这个变量。
- en: 6\. If `rank(x)` gives you the ranks of `x` from lowest to highest, `rank(-x)`
    gives you the ranks from highest to lowest. Use the function `mutate` to add a
    column `rank` containing the rank of murder rate from highest to lowest. Make
    sure you redefine `murders` so we can keep using this variable.
  id: totrans-217
  prefs: []
  type: TYPE_NORMAL
  zh: 6. 如果`rank(x)`给出`x`从低到高的排名，则`rank(-x)`给出从高到低的排名。使用`mutate`函数添加一个包含谋杀率从高到低排名的`rank`列。确保您重新定义`murders`，这样我们就可以继续使用这个变量。
- en: '7\. With **dplyr**, we can use `select` to show only certain columns. For example,
    with this code we would only show the states and population sizes:'
  id: totrans-218
  prefs: []
  type: TYPE_NORMAL
  zh: 7. 使用**dplyr**，我们可以用`select`来只显示某些列。例如，使用以下代码我们只会显示州和人口规模：
- en: '[PRE62]'
  id: totrans-219
  prefs: []
  type: TYPE_PRE
  zh: '[PRE62]'
- en: '*Use `select` to show the state names and abbreviations in `murders`. Do not
    redefine `murders`, just show the results.'
  id: totrans-220
  prefs: []
  type: TYPE_NORMAL
  zh: '*使用`select`来显示`murders`中的州名和缩写。不要重新定义`murders`，只需显示结果。'
- en: '8\. The **dplyr** function `filter` is used to choose specific rows of the
    data frame to keep. Unlike `select` which is for columns, `filter` is for rows.
    For example, you can show just the New York row like this:'
  id: totrans-221
  prefs: []
  type: TYPE_NORMAL
  zh: 8. **dplyr**函数`filter`用于选择数据框中特定的行以保留。与用于列的`select`不同，`filter`用于行。例如，您可以像这样显示仅纽约的行：
- en: '[PRE63]'
  id: totrans-222
  prefs: []
  type: TYPE_PRE
  zh: '[PRE63]'
- en: '*You can use other logical vectors to filter rows.'
  id: totrans-223
  prefs: []
  type: TYPE_NORMAL
  zh: '*您可以使用其他逻辑向量来过滤行。'
- en: Use `filter` to show the top 5 states with the highest murder rates. From here
    on, do not change the murders dataset, just show the result. Remember that you
    can filter based on the `rank` column.
  id: totrans-224
  prefs: []
  type: TYPE_NORMAL
  zh: 使用 `filter` 显示谋杀率最高的前5个州。从现在开始，不要更改 `murders` 数据集，只需显示结果。记住，你可以根据 `rank` 列进行筛选。
- en: '9\. We can remove rows using the `!=` operator. For example, to remove Florida,
    we would do this:'
  id: totrans-225
  prefs: []
  type: TYPE_NORMAL
  zh: 9. 我们可以使用 `!=` 操作符来删除行。例如，要删除佛罗里达州，我们会这样做：
- en: '[PRE64]'
  id: totrans-226
  prefs: []
  type: TYPE_PRE
  zh: '[PRE64]'
- en: '*Create a new data frame called `no_south` that removes states from the South
    region. How many states are in this category? You can use the function `nrow`
    for this.'
  id: totrans-227
  prefs: []
  type: TYPE_NORMAL
  zh: '*创建一个新的数据框 `no_south`，删除南部地区的州。这个类别中有多少个州？你可以使用 `nrow` 函数来做这件事。'
- en: '10\. We can also use `%in%` to filter with **dplyr**. You can therefore see
    the data from New York and Texas like this:'
  id: totrans-228
  prefs: []
  type: TYPE_NORMAL
  zh: 10. 我们还可以使用 `%in%` 与 **dplyr** 进行筛选。因此，你可以这样查看纽约和德克萨斯州的数据：
- en: '[PRE65]'
  id: totrans-229
  prefs: []
  type: TYPE_PRE
  zh: '[PRE65]'
- en: '*Create a new data frame called `murders_nw` with only the states from the
    Northeast and the West. How many states are in this category?'
  id: totrans-230
  prefs: []
  type: TYPE_NORMAL
  zh: '*创建一个新的数据框 `murders_nw`，只包含东北部和西部的州。这个类别中有多少个州？'
- en: 11\. Suppose you want to live in the Northeast or West **and** want the murder
    rate to be less than 1\. We want to see the data for the states satisfying these
    options. Note that you can use logical operators like `&` with `filter`. Here
    is an example in which we filter to keep only small states in the Northeast region.
  id: totrans-231
  prefs: []
  type: TYPE_NORMAL
  zh: 11. 假设你想要住在东北部或西部 **并且** 谋杀率要低于1。我们想要查看满足这些条件的州的数据。注意，你可以在 `filter` 中使用逻辑运算符如
    `&`。以下是一个示例，其中我们筛选出仅包含东北部小州的例子。
- en: '[PRE66]'
  id: totrans-232
  prefs: []
  type: TYPE_PRE
  zh: '[PRE66]'
- en: '*Make sure `murders` has been defined with `rate` and `rank` and still has
    all states. Create a table called `my_states` that contains rows for states satisfying
    both the conditions: it is in the Northeast or West and the murder rate is less
    than 1\. Use `select` to show only the state name, the rate, and the rank.'
  id: totrans-233
  prefs: []
  type: TYPE_NORMAL
  zh: '*确保 `murders` 已经使用 `rate` 和 `rank` 定义，并且仍然包含所有州。创建一个名为 `my_states` 的表格，其中包含满足以下两个条件的行：它位于东北部或西部，谋杀率低于1。使用
    `select` 仅显示州名、率和排名。'
- en: 12\. The pipe `|>` can be used to perform operations sequentially without having
    to define intermediate objects. Start by redefining `murders` to include rate
    and rank.
  id: totrans-234
  prefs: []
  type: TYPE_NORMAL
  zh: 12. 管道 `|>` 可以用来按顺序执行操作，而无需定义中间对象。首先，重新定义 `murders` 以包括率和排名。
- en: '[PRE67]'
  id: totrans-235
  prefs: []
  type: TYPE_PRE
  zh: '[PRE67]'
- en: '*In the solution to the previous exercise, we did the following:'
  id: totrans-236
  prefs: []
  type: TYPE_NORMAL
  zh: '*在上一题的解决方案中，我们做了以下操作：'
- en: '[PRE68]'
  id: totrans-237
  prefs: []
  type: TYPE_PRE
  zh: '[PRE68]'
- en: '*The pipe `|>` permits us to perform both operations sequentially without having
    to define an intermediate variable `my_states`. We therefore could have mutated
    and selected in the same line like this:'
  id: totrans-238
  prefs: []
  type: TYPE_NORMAL
  zh: '*管道 `|>` 允许我们按顺序执行操作，而无需定义中间变量 `my_states`。因此，我们可以在同一行中突变和选择，如下所示：'
- en: '[PRE69]'
  id: totrans-239
  prefs: []
  type: TYPE_PRE
  zh: '[PRE69]'
- en: '*Notice that `select` no longer has a data frame as the first argument. The
    first argument is assumed to be the result of the operation conducted right before
    the `|>`.'
  id: totrans-240
  prefs: []
  type: TYPE_NORMAL
  zh: '*注意，`select` 的第一个参数不再是数据框。第一个参数被认为是 `|>` 之前执行的操作的结果。'
- en: Repeat the previous exercise, but now instead of creating a new object, show
    the result and only include the state, rate, and rank columns. Use a pipe `|>`
    to do this in just one line.
  id: totrans-241
  prefs: []
  type: TYPE_NORMAL
  zh: 重复上一个练习，但现在不是创建一个新的对象，而是显示结果，并且只包括州、率和排名列。使用管道 `|>` 在一行内完成此操作。
- en: '[PRE70]'
  id: totrans-242
  prefs: []
  type: TYPE_PRE
  zh: '[PRE70]'
- en: '*13\. For exercises 13-19, we will be using the data from the survey collected
    by the United States National Center for Health Statistics (NCHS). This center
    has conducted a series of health and nutrition surveys since the 1960’s. Starting
    in 1999, about 5,000 individuals of all ages have been interviewed every year
    and they complete the health examination component of the survey. Part of the
    data is made available via the **NHANES** package. Once you install the **NHANES**
    package, you can load the data like this:'
  id: totrans-243
  prefs: []
  type: TYPE_NORMAL
  zh: '*13. 对于第13-19题的练习，我们将使用美国国家健康统计中心（NCHS）收集的调查数据。自1960年代以来，该中心进行了一系列健康和营养调查。从1999年开始，每年大约有5,000名各年龄段的个人接受采访，并完成调查的健康检查部分。部分数据通过
    **NHANES** 包提供。一旦安装了 **NHANES** 包，你可以这样加载数据：'
- en: '[PRE71]'
  id: totrans-244
  prefs: []
  type: TYPE_PRE
  zh: '[PRE71]'
- en: '*The **NHANES** data has many missing values. The `mean` and `sd` functions
    in R will return `NA` if any of the entries of the input vector is an `NA`. Here
    is an example:'
  id: totrans-245
  prefs: []
  type: TYPE_NORMAL
  zh: '***NHANES** 数据有许多缺失值。在R中，如果输入向量的任何条目是 `NA`，则 `mean` 和 `sd` 函数将返回 `NA`。以下是一个示例：'
- en: '[PRE72]'
  id: totrans-246
  prefs: []
  type: TYPE_PRE
  zh: '[PRE72]'
- en: '*To ignore the `NA`s we can use the `na.rm` argument:'
  id: totrans-247
  prefs: []
  type: TYPE_NORMAL
  zh: '*要忽略 `NA`，我们可以使用 `na.rm` 参数：'
- en: '[PRE73]'
  id: totrans-248
  prefs: []
  type: TYPE_PRE
  zh: '[PRE73]'
- en: '*Let’s now explore the NHANES data.'
  id: totrans-249
  prefs: []
  type: TYPE_NORMAL
  zh: '*现在让我们探索 **NHANES** 数据。'
- en: We will provide some basic facts about blood pressure. First let’s select a
    group to set the standard. We will use 20-to-29-year-old females. `AgeDecade`
    is a categorical variable with these ages. Note that the category is coded like
    `" 20-29"`, with a space in front! What is the average and standard deviation
    of systolic blood pressure as saved in the `BPSysAve` variable? Save it to a variable
    called `ref`.
  id: totrans-250
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将提供一些关于血压的基本事实。首先，让我们选择一个组来设定标准。我们将使用20至29岁的女性。`AgeDecade` 是一个具有这些年龄的类别变量。请注意，类别编码为
    `" 20-29"`，前面有一个空格！`BPSysAve` 变量中保存的收缩压的平均值和标准差是多少？将其保存到名为 `ref` 的变量中。
- en: 'Hint: Use `filter` and `summarize` and use the `na.rm = TRUE` argument when
    computing the average and standard deviation. You can also filter the NA values
    using `filter`.'
  id: totrans-251
  prefs: []
  type: TYPE_NORMAL
  zh: 提示：使用 `filter` 和 `summarize`，在计算平均值和标准差时使用 `na.rm = TRUE` 参数。您还可以使用 `filter`
    过滤 NA 值。
- en: '14\. Using a pipe, assign the average to a numeric variable `ref_avg`. Hint:
    Use the code from the previous exercise and then `pull`.'
  id: totrans-252
  prefs: []
  type: TYPE_NORMAL
  zh: 14. 使用管道操作符，将平均值赋给名为 `ref_avg` 的数值变量。提示：使用前一个练习中的代码，然后使用 `pull`。
- en: 15\. Now report the min and max values for the same group.
  id: totrans-253
  prefs: []
  type: TYPE_NORMAL
  zh: 15. 现在报告同一组的最大值和最小值。
- en: '16\. Compute the average and standard deviation for females, but for each age
    group separately rather than a selected decade as in exercise 13\. Note that the
    age groups are defined by `AgeDecade`. Hint: rather than filtering by age and
    gender, filter by `Gender` and then use `group_by`.'
  id: totrans-254
  prefs: []
  type: TYPE_NORMAL
  zh: 16. 计算女性的平均值和标准差，但分别按年龄组计算，而不是像练习13中那样选择一个十年。注意，年龄组由 `AgeDecade` 定义。提示：与其按年龄和性别过滤，不如按
    `Gender` 过滤，然后使用 `group_by`。
- en: 17\. Repeat exercise 16 for males.
  id: totrans-255
  prefs: []
  type: TYPE_NORMAL
  zh: 17. 对男性重复练习16。
- en: 19\. For males between the ages of 40-49, compare systolic blood pressure across
    race as reported in the `Race1` variable. Order the resulting table from lowest
    to highest average systolic blood pressure.
  id: totrans-256
  prefs: []
  type: TYPE_NORMAL
  zh: 19. 对于40-49岁的男性，比较 `Race1` 变量中报告的种族间的收缩压，并按平均收缩压从低到高排序结果表。
- en: 19\. Load the `murders` dataset. Which of the following is true?
  id: totrans-257
  prefs: []
  type: TYPE_NORMAL
  zh: 19. 加载 `murders` 数据集。以下哪个说法是正确的？
- en: '`murders` is in tidy format and is stored in a tibble.'
  id: totrans-258
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`murders` 是整洁格式，存储在 tibble 中。'
- en: '`murders` is in tidy format and is stored in a data frame.'
  id: totrans-259
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`murders` 是整洁格式，存储在数据框中。'
- en: '`murders` is not in tidy format and is stored in a tibble.'
  id: totrans-260
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`murders` 不是整洁格式，存储在 tibble 中。'
- en: '`murders` is not in tidy format and is stored in a data frame.'
  id: totrans-261
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`murders` 不是整洁格式，存储在数据框中。'
- en: 20\. Use `as_tibble` to convert the `murders` data table into a tibble and save
    it in an object called `murders_tibble`.
  id: totrans-262
  prefs: []
  type: TYPE_NORMAL
  zh: 20. 使用 `as_tibble` 将 `murders` 数据表转换为 tibble 并将其保存在名为 `murders_tibble` 的对象中。
- en: 21\. Use the `group_by` function to convert `murders` into a tibble that is
    grouped by region.
  id: totrans-263
  prefs: []
  type: TYPE_NORMAL
  zh: 21. 使用 `group_by` 函数将 `murders` 转换为按地区分组的 tibble。
- en: '22\. Write tidyverse code that is equivalent to this code:'
  id: totrans-264
  prefs: []
  type: TYPE_NORMAL
  zh: 22. 编写与以下代码等价的 tidyverse 代码：
