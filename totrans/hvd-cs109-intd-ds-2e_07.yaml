  id: totrans-265
  prefs: []
  type: TYPE_PRE
  zh: '[PRE74]'
- en: '*Write it using the pipe so that each function is called without arguments.
    Use the dot operator to access the population. Hint: The code should start with
    `murders |>`.'
  id: totrans-266
  prefs: []
  type: TYPE_NORMAL
  zh: '* 使用管道操作符，确保每个函数调用不带参数。使用点操作符访问人口。提示：代码应从 `murders |>` 开始。'
- en: 23\. Use the `map_df` to create a data frame with three columns named `n`, `s_n`,
    and `s_n_2`. The first column should contain the numbers 1 through 100\. The second
    and third columns should each contain the sum of 1 through \(n\) with \(n\) the
    row number.*******************
  id: totrans-267
  prefs: []
  type: TYPE_NORMAL
  zh: 23. 使用 `map_df` 创建一个包含三个列名为 `n`、`s_n` 和 `s_n_2` 的数据框。第一列应包含从1到100的数字。第二列和第三列应分别包含从1到
    \(n\) 的数字之和，其中 \(n\) 是行号。*******************
