- en: SciPy Stats Library
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: SciPy is a free and open source library for scientific computing that is built
    on top of NumPy. You may find it helpful to use SciPy to check the answers you
    obtain in the written section of your problem sets. NumPy has the capability of
    drawing samples from many common distributions (type `help(np.random)` in the
    python interpreter), but SciPy has the added capability of computing the probability
    of observing events, and it can perform computations directly on the probability
    mass/density functions.
  prefs: []
  type: TYPE_NORMAL
- en: Binomial
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Make a Binomial Random variable $X$ and compute its probability mass function
    (PMF) or cumulative density function (CDF). We love the scipy stats library because
    it defines all the functions you would care about for a random variable, including
    expectation, variance, and even things we haven''t talked about in CS109, like
    entropy. This example declares $X \sim \text{Bin}(n = 10, p = 0.2)$. It calculates
    a few statistics on $X$. It then calculates $P(X = 3)$ and $P(X \leq 4)$. Finally
    it generates a few random samples from $X$:'
  prefs: []
  type: TYPE_NORMAL
