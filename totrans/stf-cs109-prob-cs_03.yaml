- en: Discrete Random Variables
  id: totrans-3
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 离散随机变量
- en: '**Bernoulli Random Variable**'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: '**伯努利随机变量**'
- en: '| Notation: | $X \sim \Ber(p)$ |'
  id: totrans-5
  prefs: []
  type: TYPE_TB
  zh: '| 符号: | $X \sim \Ber(p)$ |'
- en: '| Description: | A boolean variable that is 1 with probability $p$ |'
  id: totrans-6
  prefs: []
  type: TYPE_TB
  zh: '| 描述: | 一个布尔变量，以概率 $p$ 为 1 |'
- en: '| Parameters: | $p$, the probability that $X=1$. |'
  id: totrans-7
  prefs: []
  type: TYPE_TB
  zh: '| 参数: | $p$，$X=1$ 的概率。 |'
- en: '| Support: | $x$ is either 0 or 1 |'
  id: totrans-8
  prefs: []
  type: TYPE_TB
  zh: '| 支持集: | $x$ 要么是 0，要么是 1 |'
- en: '| PMF equation: | $\p(X=x) = \begin{cases} p && \text{if }x = 1\\ 1-p && \text{if
    }x = 0 \end{cases}$ |'
  id: totrans-9
  prefs: []
  type: TYPE_TB
  zh: '| PMF 方程: | $\p(X=x) = \begin{cases} p && \text{if }x = 1\\ 1-p && \text{if
    }x = 0 \end{cases}$ |'
- en: '| PMF (smooth): | $\p(X=x) = p^x(1-p)^{1-x}$ |'
  id: totrans-10
  prefs: []
  type: TYPE_TB
  zh: '| PMF (平滑): | $\p(X=x) = p^x(1-p)^{1-x}$ |'
- en: '| Expectation: | $\E[X] = p$ |'
  id: totrans-11
  prefs: []
  type: TYPE_TB
  zh: '| 期望: | $\E[X] = p$ |'
- en: '| Variance: | $\var(X) = p (1-p)$ |'
  id: totrans-12
  prefs: []
  type: TYPE_TB
  zh: '| 方差: | $\var(X) = p (1-p)$ |'
- en: '| PMF graph: |'
  id: totrans-13
  prefs: []
  type: TYPE_TB
  zh: '| PMF 图: |'
- en: 'Parameter $p$:'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: '参数 $p$:'
- en: '<canvas id="bernoulliPmf" style="max-height: 400px"></canvas>'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: '<canvas id="bernoulliPmf" style="max-height: 400px"></canvas>'
- en: '**Binomial Random Variable**'
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: '**二项式随机变量**'
- en: '| Notation: | $X \sim \Bin(n, p)$ |'
  id: totrans-17
  prefs: []
  type: TYPE_TB
  zh: '| 符号: | $X \sim \Bin(n, p)$ |'
- en: '| Description: | Number of "successes" in $n$ identical, independent experiments
    each with probability of success $p$. |'
  id: totrans-18
  prefs: []
  type: TYPE_TB
  zh: '| 描述: | 在 $n$ 个相同、独立的实验中成功的次数，每个实验成功的概率为 $p$。 |'
- en: '| Parameters: | $n \in \{0, 1, \dots\}$, the number of experiments. $p \in
    [0, 1]$, the probability that a single experiment gives a "success". |'
  id: totrans-19
  prefs: []
  type: TYPE_TB
  zh: '| 参数: | $n \in \{0, 1, \dots\}$，实验次数。$p \in [0, 1]$，单个实验成功的概率。 |'
- en: '| Support: | $x \in \{0, 1, \dots, n\}$ |'
  id: totrans-20
  prefs: []
  type: TYPE_TB
  zh: '| 支持集: | $x \in \{0, 1, \dots, n\}$ |'
- en: '| PMF equation: | $$\p(X=x) = {n \choose x}p^x(1-p)^{n-x}$$ |'
  id: totrans-21
  prefs: []
  type: TYPE_TB
  zh: '| PMF 方程: | $$\p(X=x) = {n \choose x}p^x(1-p)^{n-x}$$ |'
- en: '| Expectation: | $\E[X] = n \cdot p$ |'
  id: totrans-22
  prefs: []
  type: TYPE_TB
  zh: '| 期望: | $\E[X] = n \cdot p$ |'
- en: '| Variance: | $\var(X) = n \cdot p \cdot (1-p)$ |'
  id: totrans-23
  prefs: []
  type: TYPE_TB
  zh: '| 方差: | $\var(X) = n \cdot p \cdot (1-p)$ |'
- en: '| PMF graph: |'
  id: totrans-24
  prefs: []
  type: TYPE_TB
  zh: '| PMF 图: |'
- en: 'Parameter $n$: Parameter $p$:'
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: '参数 $n$: 参数 $p$:'
- en: '<canvas id="binomialPmf" style="max-height: 400px"></canvas>'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: '<canvas id="binomialPmf" style="max-height: 400px"></canvas>'
- en: '**Poisson Random Variable**'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: '**泊松随机变量**'
- en: '| Notation: | $X \sim \Poi(\lambda)$ |'
  id: totrans-28
  prefs: []
  type: TYPE_TB
  zh: '| 符号: | $X \sim \Poi(\lambda)$ |'
- en: '| Description: | Number of events in a fixed time frame if (a) the events occur
    with a constant mean rate and (b) they occur independently of time since last
    event. |'
  id: totrans-29
  prefs: []
  type: TYPE_TB
  zh: '| 描述: | 在固定时间段内发生的事件数量，如果 (a) 事件以恒定的平均速率发生，并且 (b) 事件的发生与上次事件的时间无关。 |'
- en: '| Parameters: | $\lambda \in \mathbb{R}^{+}$, the constant average rate. |'
  id: totrans-30
  prefs: []
  type: TYPE_TB
  zh: '| 参数: | $\lambda \in \mathbb{R}^{+}$，恒定的平均速率。 |'
- en: '| Support: | $x \in \{0, 1, \dots\}$ |'
  id: totrans-31
  prefs: []
  type: TYPE_TB
  zh: '| 支持集: | $x \in \{0, 1, \dots\}$ |'
- en: '| PMF equation: | $$\p(X=x) = \frac{\lambda^xe^{-\lambda}}{x!}$$ |'
  id: totrans-32
  prefs: []
  type: TYPE_TB
  zh: '| PMF 方程: | $$\p(X=x) = \frac{\lambda^xe^{-\lambda}}{x!}$$ |'
- en: '| Expectation: | $\E[X] = \lambda$ |'
  id: totrans-33
  prefs: []
  type: TYPE_TB
  zh: '| 期望: | $\E[X] = \lambda$ |'
- en: '| Variance: | $\var(X) = \lambda$ |'
  id: totrans-34
  prefs: []
  type: TYPE_TB
  zh: '| 方差: | $\var(X) = \lambda$ |'
- en: '| PMF graph: |'
  id: totrans-35
  prefs: []
  type: TYPE_TB
  zh: '| PMF 图: |'
- en: 'Parameter $\lambda$:'
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: '参数 $\lambda$:'
- en: '<canvas id="poissonPmf" style="max-height: 400px"></canvas>'
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: '<canvas id="poissonPmf" style="max-height: 400px"></canvas>'
- en: '**Geometric Random Variable**'
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: '**几何随机变量**'
- en: '| Notation: | $X \sim \Geo(p)$ |'
  id: totrans-39
  prefs: []
  type: TYPE_TB
  zh: '| 符号: | $X \sim \Geo(p)$ |'
- en: '| Description: | Number of experiments until a success. Assumes independent
    experiments each with probability of success $p$. |'
  id: totrans-40
  prefs: []
  type: TYPE_TB
  zh: '| 描述: | 达到成功所需的实验次数。假设每个实验是独立的，成功的概率为 $p$。 |'
- en: '| Parameters: | $p \in [0, 1]$, the probability that a single experiment gives
    a "success". |'
  id: totrans-41
  prefs: []
  type: TYPE_TB
  zh: '| 参数: | $p \in [0, 1]$, 单个实验成功的概率。 |'
- en: '| Support: | $x \in \{1, \dots, \infty\}$ |'
  id: totrans-42
  prefs: []
  type: TYPE_TB
  zh: '| 支持集: | $x \in \{1, \dots, \infty\}$ |'
- en: '| PMF equation: | $$\p(X=x) = (1-p)^{x-1} p$$ |'
  id: totrans-43
  prefs: []
  type: TYPE_TB
  zh: '| PMF 方程: | $$\p(X=x) = (1-p)^{x-1} p$$ |'
- en: '| Expectation: | $\E[X] = \frac{1}{p}$ |'
  id: totrans-44
  prefs: []
  type: TYPE_TB
  zh: '| 期望: | $\E[X] = \frac{1}{p}$ |'
- en: '| Variance: | $\var(X) = \frac{1-p}{p^2}$ |'
  id: totrans-45
  prefs: []
  type: TYPE_TB
  zh: '| 方差: | $\var(X) = \frac{1-p}{p^2}$ |'
- en: '| PMF graph: |'
  id: totrans-46
  prefs: []
  type: TYPE_TB
  zh: '| PMF 图: |'
- en: 'Parameter $p$:'
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: '参数 $p$:'
- en: '<canvas id="geometricPmf" style="max-height: 400px"></canvas>'
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: '<canvas id="geometricPmf" style="max-height: 400px"></canvas>'
- en: '**Negative Binomial Random Variable**'
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: '**负二项式随机变量**'
- en: '| Notation: | $X \sim \NegBin(r, p)$ |'
  id: totrans-50
  prefs: []
  type: TYPE_TB
  zh: '| 符号: | $X \sim \NegBin(r, p)$ |'
- en: '| Description: | Number of experiments until $r$ successes. Assumes each experiment
    is independent with probability of success $p$. |'
  id: totrans-51
  prefs: []
  type: TYPE_TB
  zh: '| 描述: | 达到 $r$ 次成功所需的实验次数。假设每个实验是独立的，成功的概率为 $p$。 |'
- en: '| Parameters: | $r > 0$, the number of success we are waiting for. $p \in [0,
    1]$, the probability that a single experiment gives a "success". |'
  id: totrans-52
  prefs: []
  type: TYPE_TB
  zh: '| 参数: | $r > 0$，我们等待的成功次数。$p \in [0, 1]$，单个实验成功的概率。 |'
- en: '| Support: | $x \in \{r, \dots, \infty\}$ |'
  id: totrans-53
  prefs: []
  type: TYPE_TB
  zh: '| 支持集: | $x \in \{r, \dots, \infty\}$ |'
- en: '| PMF equation: | $$\p(X=x) = {x - 1 \choose r - 1}p^r(1-p)^{x-r}$$ |'
  id: totrans-54
  prefs: []
  type: TYPE_TB
  zh: '| PMF 方程：| $$\p(X=x) = {x - 1 \choose r - 1}p^r(1-p)^{x-r}$$ |'
- en: '| Expectation: | $\E[X] = \frac{r}{p}$ |'
  id: totrans-55
  prefs: []
  type: TYPE_TB
  zh: '| 期望：| $\E[X] = \frac{r}{p}$ |'
- en: '| Variance: | $\var(X) = \frac{r \cdot (1-p)}{p^2}$ |'
  id: totrans-56
  prefs: []
  type: TYPE_TB
  zh: '| 方差：| $\var(X) = \frac{r \cdot (1-p)}{p^2}$ |'
- en: '| PMF graph: |'
  id: totrans-57
  prefs: []
  type: TYPE_TB
  zh: '| PMF 图：|'
- en: 'Parameter $r$: Parameter $p$:'
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 参数 $r$：参数 $p$：
- en: '<canvas id="negBinomialPmf" style="max-height: 400px"></canvas>'
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: '<canvas id="negBinomialPmf" style="max-height: 400px"></canvas>'
- en: Continuous Random Variables
  id: totrans-60
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 连续随机变量
- en: '**Uniform Random Variable**'
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: '**均匀随机变量**'
- en: '| Notation: | $X \sim \Uni(\alpha, \beta)$ |'
  id: totrans-62
  prefs: []
  type: TYPE_TB
  zh: '| 符号：| $X \sim \Uni(\alpha, \beta)$ |'
- en: '| Description: | A continuous random variable that takes on values, with equal
    likelihood, between $\alpha$ and $\beta$ |'
  id: totrans-63
  prefs: []
  type: TYPE_TB
  zh: '| 描述：| 一个连续随机变量，其值在 $\alpha$ 和 $\beta$ 之间以相同的可能性取值。|'
- en: '| Parameters: | $\alpha \in \R$, the minimum value of the variable. $\beta
    \in \R$, $\beta > \alpha$, the maximum value of the variable. |'
  id: totrans-64
  prefs: []
  type: TYPE_TB
  zh: '| 参数：| $\alpha \in \R$，变量的最小值。$\beta \in \R$，$\beta > \alpha$，变量的最大值。|'
- en: '| Support: | $x \in [\alpha, \beta]$ |'
  id: totrans-65
  prefs: []
  type: TYPE_TB
  zh: '| 支持集：| $x \in [\alpha, \beta]$ |'
- en: '| PDF equation: | $$f(x) = \begin{cases} \frac{1}{\beta - \alpha} && \text{for
    }x \in [\alpha, \beta]\\ 0 && \text{else} \end{cases}$$ |'
  id: totrans-66
  prefs: []
  type: TYPE_TB
  zh: '| PDF 方程：| $$f(x) = \begin{cases} \frac{1}{\beta - \alpha} && \text{for }x
    \in [\alpha, \beta]\\ 0 && \text{else} \end{cases}$$ |'
- en: '| CDF equation: | $$F(x) = \begin{cases} \frac{x - \alpha}{\beta - \alpha}
    && \text{for }x \in [\alpha, \beta]\\ 0 && \text{for } x < \alpha \\ 1 && \text{for
    } x > \beta \end{cases}$$ |'
  id: totrans-67
  prefs: []
  type: TYPE_TB
  zh: '| CDF 方程：| $$F(x) = \begin{cases} \frac{x - \alpha}{\beta - \alpha} && \text{for
    }x \in [\alpha, \beta]\\ 0 && \text{for } x < \alpha \\ 1 && \text{for } x > \beta
    \end{cases}$$ |'
- en: '| Expectation: | $\E[X] = \frac{1}{2}(\alpha + \beta)$ |'
  id: totrans-68
  prefs: []
  type: TYPE_TB
  zh: '| 期望：| $\E[X] = \frac{1}{2}(\alpha + \beta)$ |'
- en: '| Variance: | $\var(X) = \frac{1}{12}(\beta - \alpha)^2$ |'
  id: totrans-69
  prefs: []
  type: TYPE_TB
  zh: '| 方差：| $\var(X) = \frac{1}{12}(\beta - \alpha)^2$ |'
- en: '| PDF graph: |'
  id: totrans-70
  prefs: []
  type: TYPE_TB
  zh: '| PDF 图：|'
- en: 'Parameter $\alpha$: Parameter $\beta$:'
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: 参数 $\alpha$：参数 $\beta$：
- en: '<canvas id="uniPdf" style="max-height: 400px"></canvas>'
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: '<canvas id="uniPdf" style="max-height: 400px"></canvas>'
- en: '**Exponential Random Variable**'
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: '**指数随机变量**'
- en: '| Notation: | $X \sim \Exp(\lambda)$ |'
  id: totrans-74
  prefs: []
  type: TYPE_TB
  zh: '| 符号：| $X \sim \Exp(\lambda)$ |'
- en: '| Description: | Time until next events if (a) the events occur with a constant
    mean rate and (b) they occur independently of time since last event. |'
  id: totrans-75
  prefs: []
  type: TYPE_TB
  zh: '| 描述：| 如果（a）事件以恒定的平均速率发生，并且（b）它们的发生与自上次事件以来经过的时间无关，则直到下一次事件的时间。|'
- en: '| Parameters: | $\lambda \in \mathbb{R}^{+}$, the constant average rate. |'
  id: totrans-76
  prefs: []
  type: TYPE_TB
  zh: '| 参数：| $\lambda \in \mathbb{R}^{+}$，恒定的平均速率。|'
- en: '| Support: | $x \in \mathbb{R}^+$ |'
  id: totrans-77
  prefs: []
  type: TYPE_TB
  zh: '| 支持集：| $x \in \mathbb{R}^+$ |'
- en: '| PDF equation: | $$f(x) = \lambda e^{-\lambda x}$$ |'
  id: totrans-78
  prefs: []
  type: TYPE_TB
  zh: '| PDF 方程：| $$f(x) = \lambda e^{-\lambda x}$$ |'
- en: '| CDF equation: | $$F(x) = 1 - e^{-\lambda x}$$ |'
  id: totrans-79
  prefs: []
  type: TYPE_TB
  zh: '| CDF 方程：| $$F(x) = 1 - e^{-\lambda x}$$ |'
- en: '| Expectation: | $\E[X] = 1/\lambda$ |'
  id: totrans-80
  prefs: []
  type: TYPE_TB
  zh: '| 期望：| $\E[X] = 1/\lambda$ |'
- en: '| Variance: | $\var(X) = 1/\lambda^2$ |'
  id: totrans-81
  prefs: []
  type: TYPE_TB
  zh: '| 方差：| $\var(X) = 1/\lambda^2$ |'
- en: '| PDF graph: |'
  id: totrans-82
  prefs: []
  type: TYPE_TB
  zh: '| PDF 图：|'
- en: 'Parameter $\lambda$:'
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
  zh: '参数 $\lambda$:'
- en: '<canvas id="exponentialPdf" style="max-height: 400px"></canvas>'
  id: totrans-84
  prefs: []
  type: TYPE_NORMAL
  zh: '<canvas id="exponentialPdf" style="max-height: 400px"></canvas>'
- en: '**Normal (aka Gaussian) Random Variable**'
  id: totrans-85
  prefs: []
  type: TYPE_NORMAL
  zh: '**正态（又称高斯）随机变量**'
- en: '| Notation: | $X \sim \N(\mu, \sigma^2)$ |'
  id: totrans-86
  prefs: []
  type: TYPE_TB
  zh: '| 符号：| $X \sim \N(\mu, \sigma^2)$ |'
- en: '| Description: | A common, naturally occurring distribution. |'
  id: totrans-87
  prefs: []
  type: TYPE_TB
  zh: '| 描述：| 一种常见且自然发生的分布。|'
- en: '| Parameters: | $\mu \in \mathbb{R}$, the mean. $\sigma^2 \in \mathbb{R}$,
    the variance.'
  id: totrans-88
  prefs: []
  type: TYPE_NORMAL
  zh: '| 参数：| $\mu \in \mathbb{R}$，均值。$\sigma^2 \in \mathbb{R}$，方差。|'
- en: '|'
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
  zh: '|'
- en: '| Support: | $x \in \mathbb{R}$ |'
  id: totrans-90
  prefs: []
  type: TYPE_TB
  zh: '| 支持集：| $x \in \mathbb{R}$ |'
- en: '| PDF equation: | $$f(x) = \frac{1}{\sigma \sqrt{2 \pi}} e^{-\frac{1}{2}\Big(\frac{x-\mu}{\sigma}\Big)^2}$$
    |'
  id: totrans-91
  prefs: []
  type: TYPE_TB
  zh: '| PDF 方程：| $$f(x) = \frac{1}{\sigma \sqrt{2 \pi}} e^{-\frac{1}{2}\Big(\frac{x-\mu}{\sigma}\Big)^2}$$
    |'
- en: '| CDF equation: | $$\begin{align} F(x) &= \phi(\frac{x-\mu}{\sigma}) && \text{Where
    $\phi$ is the CDF of the standard normal} \end{align}$$ |'
  id: totrans-92
  prefs: []
  type: TYPE_TB
  zh: '| CDF 方程：| $$\begin{align} F(x) &= \phi(\frac{x-\mu}{\sigma}) && \text{Where
    $\phi$ is the CDF of the standard normal} \end{align}$$ |'
- en: '| Expectation: | $\E[X] = \mu$ |'
  id: totrans-93
  prefs: []
  type: TYPE_TB
  zh: '| 期望：| $\E[X] = \mu$ |'
- en: '| Variance: | $\var(X) = \sigma^2$ |'
  id: totrans-94
  prefs: []
  type: TYPE_TB
  zh: '| 方差：| $\var(X) = \sigma^2$ |'
- en: '| PDF graph: |'
  id: totrans-95
  prefs: []
  type: TYPE_TB
  zh: '| PDF 图：|'
- en: 'Parameter $\mu$: Parameter $\sigma$:'
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: 参数 $\mu$：参数 $\sigma$：
- en: '<canvas id="normalPdf" style="max-height: 400px"></canvas>'
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
  zh: '<canvas id="normalPdf" style="max-height: 400px"></canvas>'
- en: '**Beta Random Variable**'
  id: totrans-98
  prefs: []
  type: TYPE_NORMAL
  zh: '**贝塔随机变量**'
- en: '| Notation: | $X \sim \Beta(a, b)$ |'
  id: totrans-99
  prefs: []
  type: TYPE_TB
  zh: '| 符号：| $X \sim \Beta(a, b)$ |'
- en: '| Description: | A belief distribution over the value of a probability $p$
    from a Binomial distribution after observing $a-1$ successes and $b- 1$ fails.
    |'
  id: totrans-100
  prefs: []
  type: TYPE_TB
