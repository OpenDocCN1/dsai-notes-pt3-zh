    numerical integration techniques are extremely costly. Below is the Python code
    for approximating the intergral of a function \(f(x,y) = x+y\) over the domain
    \([x_{min}, x_{max}] \times [y_{min}, y_{max}]\):'
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以使用蒙特卡洛方法有效地近似复杂函数的定积分，这在高维空间中尤其有用，因为其他数值积分技术可能非常昂贵。以下是用 Python 代码近似函数 \(f(x,y)
    = x+y\) 在域 \([x_{min}, x_{max}] \times [y_{min}, y_{max}]\) 上的积分的代码：
- en: '[PRE1]'
  id: totrans-64
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: Review Questions
  id: totrans-65
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 复习问题
- en: What is a pseudo-random number generator?
  id: totrans-66
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 什么是伪随机数生成器？
- en: What are properties of good random number generators?
  id: totrans-67
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 好的随机数生成器的特性有哪些？
- en: What are advantages/disadvantages of pseudorandom number generators in comparison
    to using truly random numbers?
  id: totrans-68
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 与使用真正的随机数相比，伪随机数生成器的优缺点是什么？
- en: What is a linear congruential generator (LCG)?
  id: totrans-69
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 什么是线性同余发生器（LCG）？
- en: What is a seed for a random number generator?
  id: totrans-70
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 随机数生成器的种子是什么？
- en: Do random number generators repeat? Are they reproducible?
  id: totrans-71
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 随机数生成器会重复吗？它们是可复制的吗？
- en: What are Monte Carlo methods and how are they used?
  id: totrans-72
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 蒙特卡洛方法是什么？它们是如何使用的？
- en: For Monte Carlo, how does the error behave in relation to the number of sampling
    points?
  id: totrans-73
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
