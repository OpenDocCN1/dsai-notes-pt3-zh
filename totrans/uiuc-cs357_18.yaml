  id: totrans-132
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 脚注
- en: 1\. See [this Math Stack Exchange post](https://web.archive.org/web/20241120230934/https://math.stackexchange.com/questions/1087064/non-zero-eigenvalues-of-aat-and-ata)
    for a brief explanation.
  id: totrans-133
  prefs: []
  type: TYPE_NORMAL
  zh: 1. 查看 [这篇 Math Stack Exchange 帖子](https://web.archive.org/web/20241120230934/https://math.stackexchange.com/questions/1087064/non-zero-eigenvalues-of-aat-and-ata)
    以获得简要说明。
- en: Review Questions
  id: totrans-134
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 复习问题
- en: For a matrix \(\bf A\) with SVD decomposition \(\bf{A=U{\Sigma}V^T}\), what
    are the columns of \(\bf U\) and how can we find them? What are the columns of
    \(\bf V\) and how can we find them? What are the entries of \(\bf{\Sigma}\) and
    how can we find them?
  id: totrans-135
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 对于具有 SVD 分解 \(\bf{A=U{\Sigma}V^T}\) 的矩阵 \(\bf A\)，\(\bf U\) 的列是什么？我们如何找到它们？\(\bf
    V\) 的列是什么？我们如何找到它们？\(\bf{\Sigma}\) 的元素是什么？我们如何找到它们？
- en: What special properties are true of \(\bf U\), \(\bf V\) and \(\bf{\Sigma}\)?
  id: totrans-136
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: \(\bf U\), \(\bf V\) 和 \(\bf{\Sigma}\) 具有哪些特殊性质？
- en: What are the shapes of \(\bf U\), \(\bf V\) and \(\bf{\Sigma}\) in the full
    SVD of an matrix?
  id: totrans-137
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在矩阵的完整SVD中，\(\bf U\)，\(\bf V\) 和 \(\bf{\Sigma}\) 的形状是什么？
- en: What are the shapes of \(\bf U\), \(\bf V\) and \(\bf{\Sigma}\) and in the reduced
    SVD of an matrix?
  id: totrans-138
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在矩阵的简化SVD中，\(\bf U\)，\(\bf V\) 和 \(\bf{\Sigma}\) 的形状是什么？
- en: What is the cost of computing the SVD?
  id: totrans-139
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 计算SVD的成本是多少？
- en: Given an already computed SVD of a matrix \(\bf A\), what is the cost of using
    the SVD to solve a linear system \(\bf{Ax=B}\)? How would you use the SVD to solve
    this system?
  id: totrans-140
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 给定一个矩阵 \(\bf A\) 的已计算SVD，使用SVD求解线性系统 \(\bf{Ax=B}\) 的成本是多少？你将如何使用SVD来求解这个系统？
- en: How do you use the SVD to compute a low-rank approximation of a matrix? For
    a small matrix, you should be able to compute a given low rank approximation (i.e.
    rank-one, rank-two).
  id: totrans-141
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 你如何使用SVD来计算矩阵的低秩近似？对于一个小矩阵，你应该能够计算给定的低秩近似（即秩一，秩二）。
- en: Given the SVD of a matrix \(\bf A\), what is the SVD of \(\mathbf{A}^+\) (the
    psuedoinverse of \(\bf A\))?
  id: totrans-142
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 给定矩阵 \(\bf A\) 的SVD，\(\mathbf{A}^+\)（\(\bf A\) 的伪逆）的SVD是什么？
- en: Given the SVD of a matrix \(\bf A\), what is the 2-norm of the matrix? What
    is the 2-norm condition number of the matrix?
  id: totrans-143
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 给定矩阵 \(\bf A\) 的SVD，矩阵的2-范数是多少？矩阵的2-范数条件数是多少？
