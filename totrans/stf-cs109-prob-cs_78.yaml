- en: Algorithmic Analysis
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 算法分析
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part4/algorithmic_analysis/](https://chrispiech.github.io/probabilityForComputerScientists/en/part4/algorithmic_analysis/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part4/algorithmic_analysis/](https://chrispiech.github.io/probabilityForComputerScientists/en/part4/algorithmic_analysis/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: 'In this section we are going to use probability to analyze code. Specifically
    we are going to be calculating expectations on code: expected run time, expected
    resulting values etc. The reason that we are going to focus on expectation is
    that it has several [nice properties](../../part2/expectation/). One of the most
    useful properties that we have seen so far is that the expectation of a sum, is
    the sum of expectations, *regardless* of whether the random variables are independent
    of one another. In this section we will see a few more helpful properties, including
    the Law of Total Expectation, which is also helpful in analyzing code:'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 在本节中，我们将使用概率来分析代码。具体来说，我们将计算代码的期望：期望运行时间、期望结果值等。我们将关注期望的原因是它有几个[很好的性质](../../part2/expectation/)。我们迄今为止看到的最有用的性质之一是，期望的和是期望的和，*无论*随机变量之间是否相互独立。在本节中，我们将看到更多有用的性质，包括总期望定律，这在分析代码时也非常有用：
- en: '**Law of Total Expectation**'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: '**总期望定律**'
- en: 'The law of total expectation gives you a way to calculate $\E[X]$ in the scenareo
    where it is easier to compute $\E[X|Y=y]$ where $Y$ is some other random variable:
    \begin{align*} \E[X] &= \sum_y \E[X|Y=y] \p(Y=y) \end{align*}'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 总期望定律为你提供了一种在计算 $\E[X|Y=y]$（其中 $Y$ 是另一个随机变量）更容易的情况下计算 $\E[X]$ 的方法：\begin{align*}
    \E[X] &= \sum_y \E[X|Y=y] \p(Y=y) \end{align*}
- en: Distributed File System
  id: totrans-6
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 分布式文件系统
- en: 'Imagine the task of loading a large file from your computer at Stanford, over
    the interet. Your file is stored in a distributed file system. In a distributed
    file system, the closest instance of your file might be on one of several computers
    at different locations in the world. Imagine you know the probability that the
    file is in one of a few locations $l$: $\P(L=l)$, and for each location the expected
    time, $T$, to get the file, $\E[T|L=l]$, given it is in that location:'
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 想象一下从斯坦福的电脑上加载一个大型文件的任务，通过互联网。你的文件存储在一个分布式文件系统中。在分布式文件系统中，你的文件最接近的实例可能在世界各地不同位置的几台电脑之一。想象你知道文件位于几个位置
    $l$ 之一的概率：$\P(L=l)$，以及对于每个位置，获取文件所需的期望时间 $T$，$\E[T|L=l]$，假设文件就在那个位置：
- en: '| Location | $P(L = l)$ | $\E[T&#124; L = l]$ |'
  id: totrans-8
  prefs: []
  type: TYPE_TB
  zh: '| 位置 | $P(L = l)$ | $\E[T|L = l]$ |'
- en: '| SoCal | 0.5 | 0.3 seconds |'
  id: totrans-9
  prefs: []
  type: TYPE_TB
  zh: '| 南加州 | 0.5 | 0.3 秒 |'
- en: '| New York | 0.2 | 20.7 seconds |'
  id: totrans-10
  prefs: []
  type: TYPE_TB
  zh: '| 纽约 | 0.2 | 20.7 秒 |'
- en: '| Japan | 0.3 | 96.3 seconds |'
  id: totrans-11
  prefs: []
  type: TYPE_TB
  zh: '| 日本 | 0.3 | 96.3 秒 |'
- en: 'The Law of Total Expectation gives a straightforward way to compute $\E[T]$:'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 总期望定律为计算 $\E[T]$ 提供了一种直接的方法：
- en: \begin{align*} \E[T] &= \sum_l \E[T|L=l] \p(L=l)\\ &= 0.5 \cdot 0.3 + 0.2 \cdot
    20.7 + 0.3 \cdot 96.7\\ &= 33.3 \text{ seconds} \end{align*}
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: \begin{align*} \E[T] &= \sum_l \E[T|L=l] \p(L=l)\\ &= 0.5 \cdot 0.3 + 0.2 \cdot
    20.7 + 0.3 \cdot 96.7\\ &= 33.3 \text{ 秒} \end{align*}
- en: Toy Example of Recursive Code
  id: totrans-14
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 递归代码的玩具示例
- en: In theoretical computer science, there are many times where you want to analyze
    the expected runtime of an algorithm. To practice this technique let's try to
    solve a simple recursive function. Let Y be the value returned by `recurse()`.
    What is $E[Y]$?
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 在理论计算机科学中，有很多时候你想分析算法的期望运行时间。为了练习这种技术，让我们尝试解决一个简单的递归函数。设 Y 为 `recurse()` 返回的值。$E[Y]$
    是什么？
- en: '[PRE0]'
  id: totrans-16
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: In order to solve this problem we are going to need to use the law of total
    expectation considering $X$ as your background variable.
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 为了解决这个问题，我们需要使用总期望定律，将 $X$ 作为背景变量。
- en: '\begin{align*} \E[Y] = &\sum_{i \in \{1,2,3\}} \E[Y|X=i] \P(X=i)\\ =&\E[Y|X=1]
    \P(X=1) \\& + \E[Y|X=2] \P(X=2) \\&+ \E[Y|X=3] \P(X=3) \end{align*} We know the
    probability $\P(X=x) = \frac{1}{3}$ for $x \in \{1,2,3\}$. How can we compute
    a value such as $\E[Y|X=2]$? Well that is the expectation of your return, in the
    world where $X=2$. In that case you will return 5 + recurse(). The expectation
    of that is $5 + \E[Y]$. Plugging a similar result for each case we can continue
    our solution: \begin{align*} E[Y|X=1] &= 3\\ E[Y|X=2] &= 5 + \E[Y]\\ E[Y|X=3]
    &= 7 + \E[Y]\\ \end{align*} Now we can just plug values into the law of total
    expectation: \begin{align*} \E[Y] = &\sum_{i \in \{1,2,3\}} \E[Y|X=i] \P(X=i)\\
    =&\E[Y|X=1] \P(X=1) \\& + \E[Y|X=2] \P(X=2) \\&+ \E[Y|X=3] \P(X=3) \\ =&3 \cdot
    1/3 \\ &+ (5 + \E[Y]) \cdot 1/3\\ &+ (7 + \E[Y]) \cdot 1/3\\ = &(15 + 2\E[Y])
    \cdot 1/3 \\ 1/3 \cdot \E[Y] = &5 \\ \E[Y] = &15 \end{align*}'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: \begin{align*} \E[Y] = &\sum_{i \in \{1,2,3\}} \E[Y|X=i] \P(X=i)\\ =&\E[Y|X=1]
    \P(X=1) \\& + \E[Y|X=2] \P(X=2) \\&+ \E[Y|X=3] \P(X=3) \end{align*} 我们知道对于 $x
    \in \{1,2,3\}$，概率 $\P(X=x) = \frac{1}{3}$。我们如何计算像 $\E[Y|X=2]$ 这样的值呢？嗯，那是在 $X=2$
    的世界里你的期望回报。在这种情况下，你将返回 5 + recurse()。这个期望是 $5 + \E[Y]$。将每个情况下的类似结果代入，我们可以继续我们的解决方案：\begin{align*}
    E[Y|X=1] &= 3\\ E[Y|X=2] &= 5 + \E[Y]\\ E[Y|X=3] &= 7 + \E[Y]\\ \end{align*} 现在我们可以将值代入总期望定律：\begin{align*}
    \E[Y] = &\sum_{i \in \{1,2,3\}} \E[Y|X=i] \P(X=i)\\ =&\E[Y|X=1] \P(X=1) \\& +
    \E[Y|X=2] \P(X=2) \\&+ \E[Y|X=3] \P(X=3) \\ =&3 \cdot 1/3 \\ &+ (5 + \E[Y]) \cdot
    1/3\\ &+ (7 + \E[Y]) \cdot 1/3\\ = &(15 + 2\E[Y]) \cdot 1/3 \\ 1/3 \cdot \E[Y]
    = &5 \\ \E[Y] = &15 \end{align*}
- en: Proof of Law of Total Expectation
  id: totrans-19
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 总期望定律的证明
- en: 'Let''s prove the law of total expectation. In this proof we are going to go
    backwards! We are going to start with $\sum_y E[X|Y=y]P(Y=y)$ and show this equals
    $E[X]$. Our first step will be to expand $E[X|Y=y]$. The rest of the proof will
    just be algebra:'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们来证明总期望定律。在这个证明中，我们将从 $\sum_y E[X|Y=y]P(Y=y)$ 开始，并展示它等于 $E[X]$。我们的第一步将是展开
    $E[X|Y=y]$。证明的其余部分将只是代数运算：
- en: \begin{align*}\sum_y& E[X|Y=y]P(Y=y) \\ &= \sum_y\sum_x x P(X =x | Y = y) P(Y
    = y) \\ &= \sum_y\sum_x x P(X =x , Y = y)  \\ &= \sum_x\sum_y x P(X =x , Y = y) 
    \\ &= \sum_x x \sum_y  P(X =x , Y = y)  \\ &= \sum_x x P(X =x)  \\ &= E[X]\end{align*}
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: \begin{align*}\sum_y& E[X|Y=y]P(Y=y) \\ &= \sum_y\sum_x x P(X =x | Y = y) P(Y
    = y) \\ &= \sum_y\sum_x x P(X =x , Y = y)  \\ &= \sum_x\sum_y x P(X =x , Y = y) 
    \\ &= \sum_x x \sum_y  P(X =x , Y = y)  \\ &= \sum_x x P(X =x)  \\ &= E[X]\end{align*}
