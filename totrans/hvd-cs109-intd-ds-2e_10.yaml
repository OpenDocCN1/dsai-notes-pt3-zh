- en: Data Visualization
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 数据可视化
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-1/dataviz/intro-dataviz.html](https://rafalab.dfci.harvard.edu/dsbook-part-1/dataviz/intro-dataviz.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-1/dataviz/intro-dataviz.html](https://rafalab.dfci.harvard.edu/dsbook-part-1/dataviz/intro-dataviz.html)
- en: 'Looking at the numbers and character strings that define a dataset is rarely
    useful. To convince yourself, print and stare at the US murders data table:'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 观察定义数据集的数字和字符串通常没有太大用处。为了说服自己，打印并盯着美国谋杀数据表看看：
- en: '[PRE0]'
  id: totrans-3
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: '*What do you learn from staring at this table? How quickly can you determine
    which states have the largest populations? Which states have the smallest? How
    large is a typical state? Is there a relationship between population size and
    total murders? How do murder rates vary across regions of the country? For most
    human brains, it is quite difficult to extract this information just by looking
    at the numbers. In contrast, the answer to all the questions above are readily
    available from examining this plot:'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: '*你从盯着这张表格中学到了什么？你能多快确定哪个州的人口最多？哪个州的人口最少？一个典型的州有多大？人口规模和谋杀总数之间有关系吗？这个国家的不同地区谋杀率是如何变化的？对于大多数人类大脑来说，仅通过观察数字很难提取这些信息。相比之下，上述所有问题的答案都可以通过查看这个图表轻松获得：*'
- en: '![](../Images/520b0d34dd5621f17cf33275d395314a.png)'
  id: totrans-5
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/520b0d34dd5621f17cf33275d395314a.png)'
- en: We are reminded of the saying “a picture is worth a thousand words”. Data visualization
    provides a powerful way to communicate a data-driven finding. In some cases, the
    visualization is so convincing that no follow-up analysis is required.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 我们想起了那句俗语“一图胜千言”。数据可视化提供了一种强大的方式来传达基于数据的发现。在某些情况下，可视化如此令人信服，以至于不需要进一步的分析。
- en: The growing availability of informative datasets and software tools has led
    to increased reliance on data visualizations across many industries, academia,
    and government. A salient example is news organizations, which are increasingly
    embracing *data journalism* and including effective *infographics* as part of
    their reporting.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 信息的数据库和软件工具的日益可用，导致数据可视化在许多行业、学术界和政府中的依赖性增加。一个显著的例子是新闻机构，它们越来越多地采用*数据新闻学*，并将有效的*信息图表*作为其报道的一部分。
- en: A particularly effective example is a Wall Street Journal article[¹](#fn1) showing
    data related to the impact of vaccines on battling infectious diseases. One of
    the graphs shows measles cases by US state through the years with a vertical line
    demonstrating when the vaccine was introduced.
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 一个特别有效的例子是《华尔街日报》的一篇文章[¹](#fn1)，展示了疫苗对抗传染病影响的相关数据。其中一张图表显示了多年来美国各州的麻疹病例，并通过一条垂直线展示了疫苗引入的时间。
- en: '![](../Images/cbf0f003c99030ddaa9bb73097b45034.png)'
  id: totrans-9
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/cbf0f003c99030ddaa9bb73097b45034.png)'
- en: A New York Times chart provides a compelling example by summarizing scores from
    the NYC Regents Exams[²](#fn2). According to the accompanying article[³](#fn3),
    these scores are collected for various purposes, one of which is to determine
    a student’s eligibility for high school graduation. In New York City, a score
    of 65 is required to pass. The pattern of these test scores suggests something
    unusual.
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 《纽约时报》的一张图表通过总结纽约市教育委员会考试的成绩[²](#fn2)提供了一个令人信服的例子。根据随附的文章[³](#fn3)，这些成绩收集用于各种目的，其中之一是确定学生是否有资格高中毕业。在纽约市，65分是及格的分数线。这些测试分数的模式表明了一些不寻常的情况。
- en: '![](../Images/dc6b2dafd0a34488359a07318e8bb2a2.png)'
  id: totrans-11
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/dc6b2dafd0a34488359a07318e8bb2a2.png)'
- en: The most common test score is the minimum passing grade, with very few scores
    just below the threshold. This unexpected result is consistent with students close
    to passing having their scores bumped up.
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 最常见的测试分数是最低及格分数，很少有分数仅低于阈值。这个意外的结果与即将及格的学生分数被提高是一致的。
- en: This is an example of how data visualization can lead to discoveries which would
    otherwise be missed if we simply subjected the data to a battery of data analysis
    tools or procedures. Data visualization is the strongest tool of what we call
    *exploratory data analysis* (EDA). John W. Tukey[⁴](#fn4), considered the father
    of EDA, once said,
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 这就是数据可视化如何导致发现，如果我们仅仅将数据提交给一系列数据分析工具或程序，这些发现可能会被忽视。数据可视化是我们所说的*探索性数据分析*（EDA）中最强大的工具。约翰·W·图基[⁴](#fn4)，被认为是EDA之父，曾说过：
- en: “The greatest value of a picture is when it forces us to notice what we never
    expected to see.”
  id: totrans-14
  prefs:
  - PREF_BQ
  - PREF_BQ
  type: TYPE_NORMAL
  zh: “图片的最大价值在于它迫使我们注意到我们从未预料到看到的东西。”
- en: Many widely used data analysis tools were initiated by discoveries made via
    EDA. EDA is perhaps the most important part of data analysis, yet it is one that
    is often overlooked.
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 许多广泛使用的数据分析工具都是由通过EDA（探索性数据分析）做出的发现所启发的。EDA可能是数据分析中最重要的部分，但它往往被忽视。
- en: Data visualization is also now pervasive in philanthropic and educational organizations.
    In the talks New Insights on Poverty[⁵](#fn5) and The Best Stats You’ve Ever Seen[⁶](#fn6),
    Hans Rosling forces us to notice the unexpected with a series of plots related
    to world health and economics. In his videos, he uses animated graphs to show
    us how the world is changing and how old narratives are no longer true.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 数据可视化现在也普遍应用于慈善和教育组织。在《贫困的新见解[⁵](#fn5)》和《你见过的最佳统计数据[⁶](#fn6)》的演讲中，汉斯·罗斯林通过一系列与全球健康和经济相关的图表，迫使我们注意到意外之处。在他的视频中，他使用动画图表向我们展示世界是如何变化的，以及旧叙事是如何不再真实的。
- en: '![](../Images/2f4e99b020e6140d450e16a67555c48e.png)'
  id: totrans-17
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/2f4e99b020e6140d450e16a67555c48e.png)'
- en: It is also important to note that mistakes, biases, systematic errors and other
    unexpected problems often lead to data that should be handled with care. Failure
    to discover these problems can give rise to flawed analyses and false discoveries.
    As an example, consider that measurement devices sometimes fail and that most
    data analysis procedures are not designed to detect these. Yet these data analysis
    procedures will still give you an answer. The fact that it can be difficult or
    impossible to notice an error just from the reported results makes data visualization
    particularly important.
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 还需要注意的是，错误、偏见、系统性错误和其他意外问题往往会导致需要谨慎处理的数据。未能发现这些问题可能导致分析结果有缺陷和错误发现。例如，考虑测量设备有时会失败，以及大多数数据分析程序都没有设计来检测这些情况。然而，这些数据分析程序仍然会给出答案。仅仅从报告的结果中难以或无法察觉错误的事实使得数据可视化尤为重要。
- en: 'In this part of the book, we will learn the basics of data visualization and
    exploratory data analysis by using three motivating examples. We will use the
    **ggplot2** package to code. To learn the very basics, we will start with a somewhat
    artificial example: heights reported by students. Then we will focus on two cases
    studies: 1) world health and economics and 2) infectious disease trends in the
    United States. Note that we do not cover interactive graphics. For those interested
    in creating interactive plots we highly recommend learning to use the **plotly**
    package or Shiny[⁷](#fn7), both build on top of R. For more advanced challenges
    consider learning to program in D3.js[⁸](#fn8).'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 在本书的这一部分，我们将通过三个具有启发性的例子来学习数据可视化和探索性数据分析的基础。我们将使用**ggplot2**包进行编码。为了学习最基本的知识，我们将从一个相对人为的例子开始：学生报告的身高。然后我们将关注两个案例研究：1)世界健康和经济以及2)美国传染病趋势。请注意，我们不涵盖交互式图形。对于那些有兴趣创建交互式图形的人来说，我们强烈推荐学习使用基于R的**plotly**包或Shiny[⁷](#fn7)，两者都建立在R的基础上。对于更高级的挑战，考虑学习使用D3.js[⁸](#fn8)进行编程。
