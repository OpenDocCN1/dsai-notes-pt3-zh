  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 不确定性量化
- en: 原文：[https://data102.org/ds-102-book/content/chapters/03/uncertainty-quantification](https://data102.org/ds-102-book/content/chapters/03/uncertainty-quantification)
