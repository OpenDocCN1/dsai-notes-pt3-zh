- en: Confidence intervals[¶](#confidence-intervals "Link to this Section")
  id: totrans-38
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 置信区间[¶](#confidence-intervals "Link to this Section")
- en: '*You may find it helpful to review [Section 13.3 of the Data 8 textbook](https://inferentialthinking.com/chapters/13/3/Confidence_Intervals.html),
    which covers confidence intervals.*'
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: '*你可能会发现回顾[Data 8教材的第13.3节](https://inferentialthinking.com/chapters/13/3/Confidence_Intervals.html)会很有帮助，该节涵盖了置信区间。*'
- en: A confidence interval provides a measure of uncertainty about our estimator,
    based on its distribution. Recall that confidence intervals provide a guarantee
    about the process, not about the location of the (fixed) unknown parameter. Specifically,
    thinking about a 95% confidence interval, we know that 95% of datasets will produce
    an interval that contains the true parameter. We don’t know whether our interval
    happens to be one of the lucky 95%, or one of the unlucky 5%.
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 置信区间基于估计量的分布，提供了关于我们估计器不确定性的度量。请记住，置信区间提供的是关于过程（而非固定未知参数位置）的保证。具体来说，对于一个95%的置信区间，我们知道95%的数据集会产生包含真实参数的区间。但我们不知道我们的区间恰好是幸运的95%之一，还是不幸的5%之一。
- en: '[PRE5]'
  id: totrans-41
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: Loading...
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: 'Uncertainty in GLMs: comparing coefficient and prediction intervals[¶](#uncertainty-in-glms-comparing-coefficient-and-prediction-intervals
    "Link to this Section")'
  id: totrans-43
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: GLM中的不确定性：比较系数区间与预测区间[¶](#uncertainty-in-glms-comparing-coefficient-and-prediction-intervals
    "Link to this Section")
- en: When quantifying uncertainty in GLMs, it’s important to keep in mind that there
    are multiple sources of uncertainty. For example, consider our estimate of the
    coefficients, <semantics><mrow><mover accent="true"><mi>β</mi><mo>^</mo></mover></mrow><annotation
    encoding="application/x-tex">\hat{\beta}</annotation></semantics>β^​, computed
    from data <semantics><mrow><mo stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><msub><mi>y</mi><mn>1</mn></msub><mo stretchy="false">)</mo><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><mo stretchy="false">(</mo><msub><mi>x</mi><mi>n</mi></msub><mo
    separator="true">,</mo><msub><mi>y</mi><mi>n</mi></msub><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">(x_1, y_1), \ldots, (x_n, y_n)</annotation></semantics>(x1​,y1​),…,(xn​,yn​).
    These are computed as the maximum likelihood estimates given the observed data,
    and so have inherent uncertainty in them. In other words, if we had observed a
    different dataset, we might have gotten a different set of estimated coefficients
    <semantics><mrow><mover accent="true"><mi>β</mi><mo>^</mo></mover></mrow><annotation
    encoding="application/x-tex">\hat{\beta}</annotation></semantics>β^​.
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 在量化广义线性模型（GLMs）中的不确定性时，必须牢记不确定性有多个来源。例如，考虑我们从数据 <semantics><mrow><mo stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><msub><mi>y</mi><mn>1</mn></msub><mo stretchy="false">)</mo><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><mo stretchy="false">(</mo><msub><mi>x</mi><mi>n</mi></msub><mo
    separator="true">,</mo><msub><mi>y</mi><mi>n</mi></msub><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">(x_1, y_1), \ldots, (x_n, y_n)</annotation></semantics>(x1​,y1​),…,(xn​,yn​)
    计算得出的系数估计值 <semantics><mrow><mover accent="true"><mi>β</mi><mo>^</mo></mover></mrow><annotation
    encoding="application/x-tex">\hat{\beta}</annotation></semantics>β^​。这些是给定观测数据的最大似然估计值，因此其本身具有固有的不确定性。换句话说，如果我们观测到不同的数据集，可能会得到一组不同的估计系数
    <semantics><mrow><mover accent="true"><mi>β</mi><mo>^</mo></mover></mrow><annotation
    encoding="application/x-tex">\hat{\beta}</annotation></semantics>β^​。
- en: 'Now, consider our estimated prediction for a new data point, <semantics><mrow><msub><mover
    accent="true"><mi>y</mi><mo>^</mo></mover><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation
    encoding="application/x-tex">\hat{y}_{n+1}</annotation></semantics>y^​n+1​. To
    simplify, we’ll focus on linear regression with a scalar <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x. In this case, we can
    write the distribution for the new value <semantics><mrow><msub><mi>y</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation
    encoding="application/x-tex">y_{n+1}</annotation></semantics>yn+1​ as:'
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: 现在，考虑我们对一个新数据点的预测估计值 <semantics><mrow><msub><mover accent="true"><mi>y</mi><mo>^</mo></mover><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation
    encoding="application/x-tex">\hat{y}_{n+1}</annotation></semantics>y^​n+1​。为简化起见，我们将重点讨论标量
    <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x
    的线性回归。在这种情况下，我们可以将新值 <semantics><mrow><msub><mi>y</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation
    encoding="application/x-tex">y_{n+1}</annotation></semantics>yn+1​ 的分布写为：
- en: <semantics><mrow><msub><mover accent="true"><mi>y</mi><mo>^</mo></mover><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>∼</mo><mi
    mathvariant="script">N</mi><mrow><mo fence="true">(</mo><msub><mover accent="true"><mi>β</mi><mo>^</mo></mover><mn>0</mn></msub><mo>+</mo><msub><mover
    accent="true"><mi>β</mi><mo>^</mo></mover><mn>1</mn></msub><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo
    separator="true">,</mo><msup><mi>σ</mi><mn>2</mn></msup><mo fence="true">)</mo></mrow></mrow><annotation
    encoding="application/x-tex">\hat{y}_{n+1} \sim \mathcal{N}\left(\hat{\beta}_0
    + \hat{\beta}_1 x_{n+1}\,,\, \sigma^2\right)</annotation></semantics>y^​n+1​∼N(β^​0​+β^​1​xn+1​,σ2)[(1)](#k0KIlnwgYB
    "Link to this Equation")
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><msub><mover accent="true"><mi>y</mi><mo>^</mo></mover><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>∼</mo><mi
    mathvariant="script">N</mi><mrow><mo fence="true">(</mo><msub><mover accent="true"><mi>β</mi><mo>^</mo></mover><mn>0</mn></msub><mo>+</mo><msub><mover
    accent="true"><mi>β</mi><mo>^</mo></mover><mn>1</mn></msub><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo
    separator="true">,</mo><msup><mi>σ</mi><mn>2</mn></msup><mo fence="true">)</mo></mrow></mrow><annotation
    encoding="application/x-tex">\hat{y}_{n+1} \sim \mathcal{N}\left(\hat{\beta}_0
    + \hat{\beta}_1 x_{n+1}\,,\, \sigma^2\right)</annotation></semantics>y^​n+1​∼N(β^​0​+β^​1​xn+1​,σ2)[(1)](#k0KIlnwgYB
    "链接至此方程")
- en: 'Here, there are two sources of uncertainty: (1) the uncertainty in our estimator
    for the coefficients, <semantics><mrow><mover accent="true"><mi>β</mi><mo>^</mo></mover></mrow><annotation
    encoding="application/x-tex">\hat{\beta}</annotation></semantics>β^​; and (2)
    the uncertainty in the observed value and how far away it’ll be from the average
    prediction (i.e., prediction line), as quantified by <semantics><mrow><mi>σ</mi></mrow><annotation
    encoding="application/x-tex">\sigma</annotation></semantics>σ.'
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: 这里存在两种不确定性来源：(1) 系数估计量 <semantics><mrow><mover accent="true"><mi>β</mi><mo>^</mo></mover></mrow><annotation
    encoding="application/x-tex">\hat{\beta}</annotation></semantics>β^​ 的不确定性；以及
    (2) 观测值的不确定性及其偏离平均预测值（即预测线）的程度，这由 <semantics><mrow><mi>σ</mi></mrow><annotation
    encoding="application/x-tex">\sigma</annotation></semantics>σ 量化。
- en: So, if we want to construct a confidence interval for <semantics><mrow><msub><mover
    accent="true"><mi>β</mi><mo>^</mo></mover><mn>0</mn></msub></mrow><annotation
    encoding="application/x-tex">\hat{\beta}_0</annotation></semantics>β^​0​, we need
    only consider the first source of uncertainty. But, if we want to construct a
    confidence interval for <semantics><mrow><msub><mover accent="true"><mi>y</mi><mo>^</mo></mover><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation
    encoding="application/x-tex">\hat{y}_{n+1}</annotation></semantics>y^​n+1​, we
    need to consider **both** sources of uncertainty! This second type of interval
    is often called a **prediction interval**.
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，如果我们想为 <semantics><mrow><msub><mover accent="true"><mi>β</mi><mo>^</mo></mover><mn>0</mn></msub></mrow><annotation
    encoding="application/x-tex">\hat{\beta}_0</annotation></semantics>β^​0​ 构建一个置信区间，我们只需要考虑第一种不确定性来源。但是，如果我们想为
    <semantics><mrow><msub><mover accent="true"><mi>y</mi><mo>^</mo></mover><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation
    encoding="application/x-tex">\hat{y}_{n+1}</annotation></semantics>y^​n+1​ 构建一个置信区间，我们需要考虑**两种**不确定性来源！这第二种区间通常被称为**预测区间**。
- en: Using Bootstrap to Quantify Uncertainty in GLMs[¶](#using-bootstrap-to-quantify-uncertainty-in-glms
    "Link to this Section")
  id: totrans-49
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 使用自助法量化广义线性模型中的不确定性[¶](#using-bootstrap-to-quantify-uncertainty-in-glms "Link
    to this Section")
- en: '*Text coming soon: see video*'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: '*文本即将推出：请参阅视频*'
- en: '[PRE6]'
  id: totrans-51
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: Loading...
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: 正在加载...
- en: Bayesian Uncertainty Quantification[¶](#bayesian-uncertainty-quantification
    "Link to this Section")
  id: totrans-53
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 贝叶斯不确定性量化[¶](#bayesian-uncertainty-quantification "Link to this Section")
- en: In the Bayesian setting, we treat our unknown parameters as random. This means
    that we can make statements like “The unknown is probably between A and B”, which
    we couldn’t in the frequentist setting.
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
  zh: 在贝叶斯框架下，我们将未知参数视为随机变量。这意味着我们可以做出诸如“未知量很可能在A和B之间”的陈述，而这在频率主义框架下是无法实现的。
- en: Credible Intervals[¶](#credible-intervals "Link to this Section")
  id: totrans-55
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 可信区间[¶](#credible-intervals "Link to this Section")
- en: This motivates the definition of a **credible interval**. A <semantics><mrow><mi>p</mi><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">p\%</annotation></semantics>p%
    credible interval for a parameter <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ, <semantics><mrow><mo
    stretchy="false">(</mo><mi>a</mi><mo separator="true">,</mo><mi>b</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">(a, b)</annotation></semantics>(a,b), says that there
    is a <semantics><mrow><mi>p</mi><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">p\%</annotation></semantics>p% chance that, given
    the observed data, the parameter <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ falls between <semantics><mrow><mi>a</mi></mrow><annotation
    encoding="application/x-tex">a</annotation></semantics>a and <semantics><mrow><mi>b</mi></mrow><annotation
    encoding="application/x-tex">b</annotation></semantics>b. For example, suppose
    we produce a <semantics><mrow><mn>90</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">90\%</annotation></semantics>90% credible interval
    for <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    of <semantics><mrow><mo stretchy="false">(</mo><mn>0.3</mn><mo separator="true">,</mo><mn>1.7</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(0.3, 1.7)</annotation></semantics>(0.3,1.7).
    This tells us that given our observed data, the probability of <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ being between 0.3
    and 1.7 is 0.9, or equivalently <semantics><mrow><msubsup><mo>∫</mo><mn>0.3</mn><mn>1.7</mn></msubsup><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mi mathvariant="normal">∣</mi><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub><mo
    stretchy="false">)</mo><mi>d</mi><mi>θ</mi><mo>=</mo><mn>0.9</mn></mrow><annotation
    encoding="application/x-tex">\int_{0.3}^{1.7} p(\theta|x_1, \ldots, x_n) d\theta
    = 0.9</annotation></semantics>∫0.31.7​p(θ∣x1​,…,xn​)dθ=0.9 (assuming <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ is continuous).
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: 这引出了**可信区间**的定义。对于参数 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ，一个
    <semantics><mrow><mi>p</mi><mi mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">p\%</annotation></semantics>p%
    可信区间 <semantics><mrow><mo stretchy="false">(</mo><mi>a</mi><mo separator="true">,</mo><mi>b</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(a, b)</annotation></semantics>(a,b)
    表示，在给定观测数据的情况下，参数 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    落在 <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a
    和 <semantics><mrow><mi>b</mi></mrow><annotation encoding="application/x-tex">b</annotation></semantics>b
    之间的概率为 <semantics><mrow><mi>p</mi><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">p\%</annotation></semantics>p%。例如，假设我们为 <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ 生成了一个 <semantics><mrow><mn>90</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">90\%</annotation></semantics>90%
    可信区间 <semantics><mrow><mo stretchy="false">(</mo><mn>0.3</mn><mo separator="true">,</mo><mn>1.7</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(0.3, 1.7)</annotation></semantics>(0.3,1.7)。这告诉我们，根据观测数据，<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ 在 0.3 和 1.7 之间的概率是
    0.9，等价于 <semantics><mrow><msubsup><mo>∫</mo><mn>0.3</mn><mn>1.7</mn></msubsup><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mi mathvariant="normal">∣</mi><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub><mo
    stretchy="false">)</mo><mi>d</mi><mi>θ</mi><mo>=</mo><mn>0.9</mn></mrow><annotation
    encoding="application/x-tex">\int_{0.3}^{1.7} p(\theta|x_1, \ldots, x_n) d\theta
    = 0.9</annotation></semantics>∫0.31.7​p(θ∣x1​,…,xn​)dθ=0.9（假设 <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ 是连续的）。
- en: 'Notice how much simpler this definition is than the confidence interval! This
    is one of the advantages of taking a Bayesian approach: treating our unknown as
    random lets us make intuitive statements about the probability that it takes on
    certain values.'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: 请注意，这个定义比置信区间要简单得多！这是采用贝叶斯方法的一个优势：将未知量视为随机变量，使我们能够对其取特定值的概率做出直观的陈述。
- en: '[PRE7]'
  id: totrans-58
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: Loading...
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: 正在加载...
- en: However, one problem with this definition is that it is **not unique**! Indeed,
    there are many possible credible intervals for a given level of confidence/credibility.
    Consider the following distribution, and the three possible <semantics><mrow><mn>80</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">80\%</annotation></semantics>80%
    credible intervals. For all three, the total shaded blue area is <semantics><mrow><mn>80</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">80\%</annotation></semantics>80%,
    so all three are valid <semantics><mrow><mn>80</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">80\%</annotation></semantics>80% credible intervals.
    Which one would you prefer?
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，这个定义的一个问题是它**不唯一**！确实，对于给定的置信度/可信度水平，存在许多可能的可信区间。考虑以下分布，以及三个可能的 <semantics><mrow><mn>80</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">80\%</annotation></semantics>80%
    可信区间。对于所有这三个区间，蓝色阴影区域的总面积都是 <semantics><mrow><mn>80</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">80\%</annotation></semantics>80%，因此它们都是有效的 <semantics><mrow><mn>80</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">80\%</annotation></semantics>80%
    可信区间。你更倾向于哪一个？
- en: '![](../Images/ce70fcaee9a6228bb06dd970b9e747a8.png)'
  id: totrans-61
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/ce70fcaee9a6228bb06dd970b9e747a8.png)'
- en: 'The one in the center seems the most appealing: it covers an area of highest
    density, and is also the narrowest. This motivates the definition of a **highest
    density interval (HDI)**, sometimes also called a highest posterior density (HPD)
    interval. The HDI is the narrowest interval for a given level of credibility/confidence.'
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: 中间的那个似乎最吸引人：它覆盖了最高密度的区域，并且也是最窄的。这引出了**最高密度区间（HDI）**的定义，有时也称为最高后验密度（HPD）区间。HDI
    是给定可信度/置信度水平下最窄的区间。
- en: '*Exercise: is the HDI always unique? If not, then what constraints could we
    place on the posterior to ensure it’s unique?*'
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: '*练习：最高密度区间总是唯一的吗？如果不是，那么我们可以对后验分布施加什么约束来确保其唯一性？*'
- en: We can see that the intervals we saw in Section 3.3 were HDIs that PyMC automatically
    constructed for us.
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以看到，在第 3.3 节中看到的区间是 PyMC 自动为我们构建的 HDI。
- en: '[PRE8]'
  id: totrans-65
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: Loading...
  id: totrans-66
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: Constructing HDIs from samples[¶](#constructing-hdis-from-samples "Link to this
    Section")
  id: totrans-67
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '[从样本构建最高密度区间](#constructing-hdis-from-samples "链接到此章节")'
- en: 'Given a posterior in closed form, we could analytically find <semantics><mrow><mi>a</mi></mrow><annotation
    encoding="application/x-tex">a</annotation></semantics>a and <semantics><mrow><mi>b</mi></mrow><annotation
    encoding="application/x-tex">b</annotation></semantics>b to minimize the width
    of the interval. But in practice, we rarely obtain posterior distributions in
    closed form: we usually end up approximating them with samples. So, how might
    we find an HDI with samples?'
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
  zh: 给定一个闭式后验分布，我们可以解析地找到 <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a
    和 <semantics><mrow><mi>b</mi></mrow><annotation encoding="application/x-tex">b</annotation></semantics>b
    以最小化区间宽度。但在实践中，我们很少能得到闭式后验分布：我们通常最终会用样本来近似它们。那么，我们如何用样本来找到 HDI 呢？
- en: 'Let’s do a simple example with some samples from a Beta-distributed random
    variable:'
  id: totrans-69
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们用一个来自 Beta 分布随机变量的样本做一个简单的例子：
- en: '[PRE9]'
  id: totrans-70
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: '`array([0.37568015, 0.3054924 , 0.40978748, 0.10349559, 0.17014057])`'
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: '`array([0.37568015, 0.3054924 , 0.40978748, 0.10349559, 0.17014057])`'
- en: 'Call the samples <semantics><mrow><msub><mi>θ</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>θ</mi><mn>100</mn></msub></mrow><annotation encoding="application/x-tex">\theta_1,
    \ldots, \theta_{100}</annotation></semantics>θ1​,…,θ100​. We can construct a <semantics><mrow><mn>90</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">90\%</annotation></semantics>90%
    credible interval by sorting the samples, choosing any <semantics><mrow><mi>i</mi></mrow><annotation
    encoding="application/x-tex">i</annotation></semantics>i and <semantics><mrow><mi>j</mi></mrow><annotation
    encoding="application/x-tex">j</annotation></semantics>j so that <semantics><mrow><mo
    stretchy="false">(</mo><mi>j</mi><mo>−</mo><mi>i</mi><mo stretchy="false">)</mo><mi
    mathvariant="normal">/</mi><mn>200</mn><mo>=</mo><mn>0.9</mn></mrow><annotation
    encoding="application/x-tex">(j-i)/200 = 0.9</annotation></semantics>(j−i)/200=0.9,
    and reporting <semantics><mrow><mo stretchy="false">[</mo><msub><mi>θ</mi><mi>i</mi></msub><mo
    separator="true">,</mo><msub><mi>θ</mi><mi>j</mi></msub><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">[\theta_i, \theta_j]</annotation></semantics>[θi​,θj​]:'
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: 将这些样本称为<semantics><mrow><msub><mi>θ</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>θ</mi><mn>100</mn></msub></mrow><annotation encoding="application/x-tex">\theta_1,
    \ldots, \theta_{100}</annotation></semantics>θ1​,…,θ100​。我们可以通过排序样本，选择任意满足<semantics><mrow><mo
    stretchy="false">(</mo><mi>j</mi><mo>−</mo><mi>i</mi><mo stretchy="false">)</mo><mi
    mathvariant="normal">/</mi><mn>200</mn><mo>=</mo><mn>0.9</mn></mrow><annotation
    encoding="application/x-tex">(j-i)/200 = 0.9</annotation></semantics>(j−i)/200=0.9的<semantics><mrow><mi>i</mi></mrow><annotation
    encoding="application/x-tex">i</annotation></semantics>i和<semantics><mrow><mi>j</mi></mrow><annotation
    encoding="application/x-tex">j</annotation></semantics>j，并报告<semantics><mrow><mo
    stretchy="false">[</mo><msub><mi>θ</mi><mi>i</mi></msub><mo separator="true">,</mo><msub><mi>θ</mi><mi>j</mi></msub><mo
    stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[\theta_i,
    \theta_j]</annotation></semantics>[θi​,θj​]来构建一个<semantics><mrow><mn>90</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">90\%</annotation></semantics>90%的可信区间：
- en: '[PRE10]'
  id: totrans-73
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: '[PRE11]'
  id: totrans-74
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: How can we find the HDI? We can simply search over all intervals of width <semantics><mrow><mn>200</mn><mo>×</mo><mn>0.9</mn><mo>=</mo><mn>180</mn></mrow><annotation
    encoding="application/x-tex">200 \times 0.9 = 180</annotation></semantics>200×0.9=180,
    and find the narrowest one.
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: 我们如何找到最高密度区间？我们可以简单地搜索所有宽度为<semantics><mrow><mn>200</mn><mo>×</mo><mn>0.9</mn><mo>=</mo><mn>180</mn></mrow><annotation
    encoding="application/x-tex">200 \times 0.9 = 180</annotation></semantics>200×0.9=180的区间，并找出最窄的那个。
- en: '[PRE12]'
  id: totrans-76
  prefs: []
  type: TYPE_PRE
  zh: '[PRE12]'
- en: '[PRE13]'
  id: totrans-77
  prefs: []
  type: TYPE_PRE
  zh: '[PRE13]'
- en: Bayesian UQ for Predictions[¶](#bayesian-uq-for-predictions "Link to this Section")
  id: totrans-78
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 预测的贝叶斯不确定性量化[¶](#bayesian-uq-for-predictions "链接至此章节")
- en: Just as in the frequentist world, in Bayesian GLMs, we can also construct credible
    intervals for our predictions! These will be constructed using the posterior predictive
    density, and inherit the uncertainty in the inference for the unknown coefficients
    as well as the uncertainty in the inference for parameters like <semantics><mrow><mi>σ</mi></mrow><annotation
    encoding="application/x-tex">\sigma</annotation></semantics>σ in linear regression.
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
  zh: 正如在频率主义世界中一样，在贝叶斯广义线性模型中，我们也可以为预测构建可信区间！这些区间将使用后验预测密度构建，并继承未知系数推断中的不确定性，以及线性回归中类似<semantics><mrow><mi>σ</mi></mrow><annotation
    encoding="application/x-tex">\sigma</annotation></semantics>σ等参数推断中的不确定性。
