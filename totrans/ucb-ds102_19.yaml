    "编辑此页面")'
- en: '[PRE0]'
  id: totrans-3
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: (Almost) every dataset we work with has some amount of uncertainty in it. Everything
    from the randomness in a sample, measurement error, differences between the data
    and the underlying truth they represent, and much more can lead to uncertainty.
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 我们处理的（几乎）每个数据集都存在一定程度的不确定性。从样本的随机性、测量误差、数据与其所代表的基础事实之间的差异，以及更多因素，都可能导致不确定性。
- en: 'Therefore, anything we **compute** using the data also inherits some uncertainty.
    So, it’s important to always report that uncertainty:'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，任何我们使用数据**计算**得出的结果也会继承一些不确定性。所以，始终报告这种不确定性至关重要：
- en: If we infer a parameter or trend, we should report our uncertainty in the inference.
  id: totrans-6
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 如果我们推断一个参数或趋势，就应当报告推断中的不确定性。
- en: If we make a prediction, we should report our uncertainty in the prediction.
  id: totrans-7
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 如果我们做出预测，就应当报告预测中的不确定性。
- en: If we draw a conclusion, we should report our uncertainty in the conclusion.
  id: totrans-8
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 如果我们得出结论，就应当报告结论中的不确定性。
- en: While uncertainty quantification looks slightly different from frequentist and
    Bayesian perspectives, the core ideas above remain true regardless.
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 尽管从频率派和贝叶斯视角看，不确定性量化的表现形式略有不同，但上述核心理念在任何情况下都成立。
- en: Frequentist Uncertainty Quantification[¶](#frequentist-uncertainty-quantification
    "Link to this Section")
  id: totrans-10
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 频率派不确定性量化[¶](#frequentist-uncertainty-quantification "链接至此章节")
- en: In the frequentist setting, we treat our data as random, but our unknowns as
    fixed. So, any uncertainty we quantify is only over the data! We **cannot** make
    statements like “*The unknown is probably within*” or “*The probability of the
    parameter being..*”.
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 在频率派框架下，我们将数据视为随机的，而将未知量视为固定的。因此，我们量化的任何不确定性都仅针对数据！我们**不能**做出诸如“*未知量很可能在...范围内*”或“*参数为...的概率是...*”这样的陈述。
- en: 'While these statements can be more intuitive and might align with what we want
    to say when quantifying uncertainty, they only make sense in the context of a
    probability model for the unknown: we’ll have to take a Bayesian approach in order
    to say anything of this sort.'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 尽管这些表述可能更直观，并且可能符合我们在量化不确定性时想要表达的意思，但它们只有在为未知量建立概率模型的背景下才有意义：我们必须采用贝叶斯方法才能做出此类表述。
- en: The main way we’ll quantify uncertainty in the frequentist setting is by using
    the distribution of our estimators. Specifically, whenever we estimate some parameter
    <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    with an estimator <semantics><mrow><mover accent="true"><mi>θ</mi><mo>^</mo></mover><mo>=</mo><mi>f</mi><mo
    stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\hat{\theta} = f(x_1, \ldots, x_n)</annotation></semantics>θ^=f(x1​,…,xn​),
    the estimator is random, because it depends on the random data (even if <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ is fixed). So, we
    can use the distribution of <semantics><mrow><mover accent="true"><mi>θ</mi><mo>^</mo></mover></mrow><annotation
    encoding="application/x-tex">\hat{\theta}</annotation></semantics>θ^ to quantify
    uncertainty.
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 在频率论框架下，我们量化不确定性的主要方式是利用估计量的分布。具体来说，当我们用估计量 <semantics><mrow><mover accent="true"><mi>θ</mi><mo>^</mo></mover><mo>=</mo><mi>f</mi><mo
    stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\hat{\theta} = f(x_1, \ldots, x_n)</annotation></semantics>θ^=f(x1​,…,xn​)
    来估计某个参数 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    时，该估计量是随机的，因为它依赖于随机数据（即使 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    是固定的）。因此，我们可以利用 <semantics><mrow><mover accent="true"><mi>θ</mi><mo>^</mo></mover></mrow><annotation
    encoding="application/x-tex">\hat{\theta}</annotation></semantics>θ^ 的分布来量化不确定性。
- en: We already know that if we have the distribution of <semantics><mrow><mover
    accent="true"><mi>θ</mi><mo>^</mo></mover></mrow><annotation encoding="application/x-tex">\hat{\theta}</annotation></semantics>θ^,
    we can construct a **confidence interval**, which gives us an idea of how much
    our estimator could vary if we had observed different datasets. But before we
    can construct one, we need to determine the distribution for <semantics><mrow><mover
    accent="true"><mi>θ</mi><mo>^</mo></mover></mrow><annotation encoding="application/x-tex">\hat{\theta}</annotation></semantics>θ^.
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 我们已经知道，如果掌握了 <semantics><mrow><mover accent="true"><mi>θ</mi><mo>^</mo></mover></mrow><annotation
    encoding="application/x-tex">\hat{\theta}</annotation></semantics>θ^ 的分布，我们就可以构建一个**置信区间**，这能让我们了解如果观测到不同的数据集，我们的估计量可能会有多大变化。但在构建之前，我们需要先确定
    <semantics><mrow><mover accent="true"><mi>θ</mi><mo>^</mo></mover></mrow><annotation
    encoding="application/x-tex">\hat{\theta}</annotation></semantics>θ^ 的分布。
- en: '[PRE1]'
  id: totrans-15
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: Loading...
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: UQ with the Central Limit Theorem[¶](#uq-with-the-central-limit-theorem "Link
    to this Section")
  id: totrans-17
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 利用中心极限定理进行不确定性量化[¶](#uq-with-the-central-limit-theorem "Link to this Section")
- en: '*For more on the Central Limit Theorem, see [Chapter 14 of the Data 140 textbook](https://data140.org/textbook/content/Chapter_14/00_The_Central_Limit_Theorem.html).*'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: '*关于中心极限定理的更多内容，请参阅 [Data 140 教材第 14 章](https://data140.org/textbook/content/Chapter_14/00_The_Central_Limit_Theorem.html)。*'
- en: 'If we want to use the distribution of <semantics><mrow><mover accent="true"><mi>θ</mi><mo>^</mo></mover></mrow><annotation
    encoding="application/x-tex">\hat{\theta}</annotation></semantics>θ^ to quantify
    our uncertainty, then we have to start by answering: "what is the distribution
    of <semantics><mrow><mover accent="true"><mi>θ</mi><mo>^</mo></mover></mrow><annotation
    encoding="application/x-tex">\hat{\theta}</annotation></semantics>θ^?'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们想利用 <semantics><mrow><mover accent="true"><mi>θ</mi><mo>^</mo></mover></mrow><annotation
    encoding="application/x-tex">\hat{\theta}</annotation></semantics>θ^ 的分布来量化不确定性，那么首先要回答的问题是：“<semantics><mrow><mover
    accent="true"><mi>θ</mi><mo>^</mo></mover></mrow><annotation encoding="application/x-tex">\hat{\theta}</annotation></semantics>θ^
    的分布是什么？”
- en: 'In the case where <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    is the sample mean, we can answer this with one of the most beautiful results
    in statistics: the **Central Limit Theorem**. Briefly, this states that if <semantics><mrow><mover
    accent="true"><mi>μ</mi><mo>^</mo></mover></mrow><annotation encoding="application/x-tex">\hat{\mu}</annotation></semantics>μ^​
    is the sample mean of data points <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">x_1, \ldots, x_n</annotation></semantics>x1​,…,xn​,
    where each <semantics><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">x_i</annotation></semantics>xi​ has mean <semantics><mrow><mi>μ</mi></mrow><annotation
    encoding="application/x-tex">\mu</annotation></semantics>μ and (finite) variance
    <semantics><mrow><msup><mi>σ</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">\sigma^2</annotation></semantics>σ2,
    then the distribution of <semantics><mrow><mover accent="true"><mi>μ</mi><mo>^</mo></mover></mrow><annotation
    encoding="application/x-tex">\hat{\mu}</annotation></semantics>μ^​ converges to
    a normal distribution with mean <semantics><mrow><mi>μ</mi></mrow><annotation
    encoding="application/x-tex">\mu</annotation></semantics>μ and variance <semantics><mrow><msup><mi>σ</mi><mn>2</mn></msup><mi
    mathvariant="normal">/</mi><mi>n</mi></mrow><annotation encoding="application/x-tex">\sigma^2/n</annotation></semantics>σ2/n.'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 当<semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>为样本均值时，我们可以用统计学中最优美的结果之一来回答这个问题：**中心极限定理**。简而言之，该定理指出，若<semantics><mrow><mover
    accent="true"><mi>μ</mi><mo>^</mo></mover></mrow><annotation encoding="application/x-tex">\hat{\mu}</annotation></semantics>是数据点<semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">x_1, \ldots, x_n</annotation></semantics>的样本均值，其中每个<semantics><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">x_i</annotation></semantics>的均值为<semantics><mrow><mi>μ</mi></mrow><annotation
    encoding="application/x-tex">\mu</annotation></semantics>且（有限）方差为<semantics><mrow><msup><mi>σ</mi><mn>2</mn></msup></mrow><annotation
    encoding="application/x-tex">\sigma^2</annotation></semantics>，则<semantics><mrow><mover
    accent="true"><mi>μ</mi><mo>^</mo></mover></mrow><annotation encoding="application/x-tex">\hat{\mu}</annotation></semantics>的分布会收敛于一个均值为<semantics><mrow><mi>μ</mi></mrow><annotation
    encoding="application/x-tex">\mu</annotation></semantics>、方差为<semantics><mrow><msup><mi>σ</mi><mn>2</mn></msup><mi
    mathvariant="normal">/</mi><mi>n</mi></mrow><annotation encoding="application/x-tex">\sigma^2/n</annotation></semantics>的正态分布。
- en: Note that a similar result holds for any maximum likelihood estimate! While
    the details are beyond the scope of this class, one can show that if <semantics><mrow><msub><mover
    accent="true"><mi>θ</mi><mo>^</mo></mover><mrow><mi>M</mi><mi>L</mi><mi>E</mi></mrow></msub></mrow><annotation
    encoding="application/x-tex">\hat{\theta}_{MLE}</annotation></semantics>θ^MLE​
    is the maximum likelihood estimate for some parameter <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ based on data points
    <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">x_1,
    \ldots, x_n</annotation></semantics>x1​,…,xn​, then the distribution for <semantics><mrow><msub><mover
    accent="true"><mi>θ</mi><mo>^</mo></mover><mrow><mi>M</mi><mi>L</mi><mi>E</mi></mrow></msub></mrow><annotation
    encoding="application/x-tex">\hat{\theta}_{MLE}</annotation></semantics>θ^MLE​
    **also** converges to a normal distribution, with mean <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ and variance <semantics><mrow><mn>1</mn><mi
    mathvariant="normal">/</mi><mo stretchy="false">(</mo><mi>n</mi><mi>I</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">1/(nI(\theta))</annotation></semantics>1/(nI(θ)).
    Here, <semantics><mrow><mi>I</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">I(\theta)</annotation></semantics>I(θ) is the [Fisher
    informatoin](https://en.wikipedia.org/wiki/Fisher_information) of the likelihood,
    which quantifies how much information each <semantics><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">x_i</annotation></semantics>xi​ gives us about <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ.
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 请注意，类似的结果适用于任何最大似然估计！虽然细节超出了本课程的范围，但可以证明，如果 <semantics><mrow><msub><mover accent="true"><mi>θ</mi><mo>^</mo></mover><mrow><mi>M</mi><mi>L</mi><mi>E</mi></mrow></msub></mrow><annotation
    encoding="application/x-tex">\hat{\theta}_{MLE}</annotation></semantics>θ^MLE​
    是基于数据点 <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">x_1,
    \ldots, x_n</annotation></semantics>x1​,…,xn​ 对某个参数 <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ 的最大似然估计，那么 <semantics><mrow><msub><mover
    accent="true"><mi>θ</mi><mo>^</mo></mover><mrow><mi>M</mi><mi>L</mi><mi>E</mi></mrow></msub></mrow><annotation
    encoding="application/x-tex">\hat{\theta}_{MLE}</annotation></semantics>θ^MLE​
    的分布**也**收敛于正态分布，其均值为 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ，方差为
    <semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mo stretchy="false">(</mo><mi>n</mi><mi>I</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">1/(nI(\theta))</annotation></semantics>1/(nI(θ))。这里，<semantics><mrow><mi>I</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">I(\theta)</annotation></semantics>I(θ) 是似然函数的[费希尔信息](https://en.wikipedia.org/wiki/Fisher_information)，它量化了每个
    <semantics><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">x_i</annotation></semantics>xi​
    为我们提供的关于 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    的信息量。
- en: 'While the details (e.g., Fisher information) are beyond the scope of this class,
    the takeaway is important:'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 虽然具体细节（例如，费希尔信息）超出了本课程的范围，但关键要点很重要：
- en: Asymptotically (i.e., as the number of observations gets very large), **the
    distribution of a maximum likelihood estimator, like that of a sample mean, converges
    to a normal distribution**.
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 渐近地（即当观测数量变得非常大时），**最大似然估计量的分布，如同样本均值的分布一样，收敛于正态分布**。
- en: '[PRE2]'
  id: totrans-24
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: Loading...
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: UQ with the Bootstrap[¶](#uq-with-the-bootstrap "Link to this Section")
  id: totrans-26
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 使用自助法进行不确定性量化[¶](#uq-with-the-bootstrap "链接到此章节")
- en: '*You may find it helpful to review [Chapter 13.2 of the Data 8 textbook](https://inferentialthinking.com/chapters/13/2/Bootstrap.html),
    which covers the bootstrap.*'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: '*你可能会发现复习[《Data 8》教材的第13.2章](https://inferentialthinking.com/chapters/13/2/Bootstrap.html)会很有帮助，该章节涵盖了自助法。*'
- en: In many cases, we might not be able to compute the distribution of <semantics><mrow><mover
    accent="true"><mi>θ</mi><mo>^</mo></mover></mrow><annotation encoding="application/x-tex">\hat{\theta}</annotation></semantics>θ^
    analytically. In some of these cases, we can use the **bootstrap** to quantify
    uncertainty.
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 在许多情况下，我们可能无法解析地计算出 <semantics><mrow><mover accent="true"><mi>θ</mi><mo>^</mo></mover></mrow><annotation
    encoding="application/x-tex">\hat{\theta}</annotation></semantics>θ^ 的分布。在这些情况中的某些部分，我们可以使用**自助法**来量化不确定性。
- en: Bootstrap limitations[¶](#bootstrap-limitations "Link to this Section")
  id: totrans-29
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 自助法的局限性[¶](#bootstrap-limitations "Link to this Section")
- en: 'The bootstrap works well in most, but not all situations. Here are some guidelines
    for when to (and when not to) use it:'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: 自助法在大多数情况下效果良好，但并非适用于所有情况。以下是一些关于何时使用（以及何时不使用）它的指导原则：
- en: The bootstrap is a **good** choice when the presence or absence of a single
    sample won’t change the estimate dramatically (e.g., this is not true for the
    min or max)
  id: totrans-31
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 当单个样本的存在与否不会显著改变估计值时（例如，对于最小值或最大值，这种情况则不适用），自助法是一个**很好**的选择。
- en: The bootstrap is a **good** choice when the number of data points is very small
  id: totrans-32
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 当数据点数量非常少时，自助法是一个**很好**的选择。
- en: The bootstrap is a **good** choice when the number of parameters <semantics><mrow><mi>d</mi></mrow><annotation
    encoding="application/x-tex">d</annotation></semantics>d being estimated is much
    smaller than the number of data points <semantics><mrow><mi>n</mi></mrow><annotation
    encoding="application/x-tex">n</annotation></semantics>n (e.g., this is not true
    for neural networks, where we are estimating a very large number of parameters)
  id: totrans-33
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 当待估计参数数量 <semantics><mrow><mi>d</mi></mrow><annotation encoding="application/x-tex">d</annotation></semantics>d
    远小于数据点数量 <semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics>n
    时（例如，对于神经网络，我们估计的参数数量非常庞大，这种情况则不适用），自助法是一个**很好**的选择。
- en: '[PRE3]'
  id: totrans-34
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
