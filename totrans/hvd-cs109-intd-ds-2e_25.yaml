- en: 19  Git and GitHub
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-1/productivity/git.html](https://rafalab.dfci.harvard.edu/dsbook-part-1/productivity/git.html)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '[Productivity Tools](../productivity/intro-productivity.html)'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '[19  Git and GitHub](../productivity/git.html)'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'Here we provide a brief introduction Git and GitHub. We are only scratching
    the surface. To learn more about Git, we highly recommend the following resources:'
  prefs: []
  type: TYPE_NORMAL
- en: “Learn Git & GitHub” on Codecademy[¹](#fn1)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: “Hello World” exercises GitHub Guides[²](#fn2)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: If you plan to use Git and Github frequently in conjunction with R, we highly
    recommend reading Happy Git and GitHub for the useR[³](#fn3) to learn about the
    details we don’t cover here.
  prefs: []
  type: TYPE_NORMAL
- en: 19.1 Why use Git and GitHub?
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'Three primary reasons to use Git and GitHub are:'
  prefs: []
  type: TYPE_NORMAL
- en: '**Version Control:** Git allows you to track changes in your code, revert to
    previous file versions, and work on multiple branches simultaneously. Once changes
    are finalized, different branches can be merged.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '**Collaboration:** GitHub offers a central storage solution for projects and
    lets you add collaborators. These collaborators can make changes, keeping all
    versions synchronized. Moreover, the *pull request* feature on GitHub enables
    others to suggest modifications to your code, which you can then approve or reject.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '**Sharing:** Beyond its powerful version control and collaboration tools, Git
    and GitHub serve as a platform to easily share your code with others.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: We primarily emphasize the sharing capabilities here. For a deeper dive into
    its other functionality, please refer to the provided resources above. One major
    advantage of hosting code on GitHub is the ease with which you can showcase it
    to potential employers seeking samples of your work. Given that numerous companies
    and organizations employ version control systems like Git for project collaboration,
    they may find it commendable that you possess some knowledge of the tool.
  prefs: []
  type: TYPE_NORMAL
- en: 19.2 Overview of Git
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: To effectively permit version control and collaboration with Git we need to
    understand the concept of a *repository*, often simply called a *repo*. A repo
    is a digital storage space where you can save, edit, and track versions of files
    for a specific project. Think of it as a project folder combined with a detailed
    logbook. It holds all the files and directories related to the project and also
    records of every change made, who made it, and when. This allows multiple people
    to collaborate on a project without overwriting contributions from others. You
    can also easily revert to previous versions if needed.
  prefs: []
  type: TYPE_NORMAL
- en: Note that Git permits the creation of different *branches* within a repository.
    This permits working on files in parallel which is particularly useful for testing
    ideas that involve big changes before incorporating with a stable version. In
    this book we provide only examples with just one branch. To learn more about how
    to define and use multiple branches please consult the resources provided above.
  prefs: []
  type: TYPE_NORMAL
- en: A common practice involves hosting central *main branch* on a GitHub repository
    that all collaborators can access remotely. The main branch is considered the
    stable official version. Each collaborator also maintains a *local repository*
    on their computer, allowing them to edit and test changes before committing them
    to the main repository.
  prefs: []
  type: TYPE_NORMAL
- en: 'We’re going to explore how Git works by following these step:'
  prefs: []
  type: TYPE_NORMAL
- en: 1\. First, you’ll learn how to make changes on your computer in what’s called
    the *working directory*.
  prefs: []
  type: TYPE_NORMAL
- en: 2. Once you’re happy with your changes, you’ll move them to the *staging area*.
    Think of this as preparing or packing your changes.
  prefs: []
  type: TYPE_NORMAL
- en: 3\. From there, you’ll save these changes to your *local repo*, this is like
    your personal save point on your computer and will generate a new version of the
    repository in the log.
  prefs: []
  type: TYPE_NORMAL
- en: 4\. After saving locally, you’ll then send, or *push*, these changes to the
    main storage space where everyone can see them. In our examples, this main storage
    space is hosted on GitHub, and Git calls it the *upstream repo*.
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/20ffe94f74b930b15d11fce76156c3b6.png)'
  prefs: []
  type: TYPE_IMG
- en: Now, to work with this strategy, you’ll need an account on GitHub. In the next
    two sections, we’ll guide you on how to set up an account and create repos on
    GitHub.
  prefs: []
  type: TYPE_NORMAL
- en: 19.3 GitHub accounts
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Basic GitHub accounts are free. To create one, go to GitHub[⁴](#fn4) where you
    will see a box in which you can sign up.
  prefs: []
  type: TYPE_NORMAL
- en: You want to pick a name carefully. It should be short, easy to remember and
    to spell, somehow related to your name, and professional. This last one is important
    since you might be sending potential employers a link to your GitHub account.
    Your initials and last name are usually a good choice.
  prefs: []
  type: TYPE_NORMAL
- en: 19.4 GitHub repositories
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Once you have an account, you are now ready to create a GitHub repository that
    will serve as the main or upstream repo for a project. Collaborators you add to
    this project will be able to manage a local repository on their computer and push
    changes. Git will help you keep all the different copies synced.
  prefs: []
  type: TYPE_NORMAL
- en: To create a repo, first log in to your account by clicking the *Sign In* button
    on GitHub. You might already be signed in, in which case the *Sign In* button
    will not show up. If signing in, you will have to enter your username and password.
    We recommend you set up your browser to remember this to avoid typing it in each
    time.
  prefs: []
  type: TYPE_NORMAL
- en: 'Once on your account, you can click on *Repositories* and then click on *New*
    to create a new repo. You will be prompted for a name:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/a3213afdd52503b55d91c4b8a806fd71.png)'
  prefs: []
  type: TYPE_IMG
- en: '![](../Images/241170920c630b6168f23b87550f06da.png)'
  prefs: []
  type: TYPE_IMG
- en: When naming your project, pick a descriptive name that clearly tells what the
    project is about. Keep in mind that as you work on more projects, you’ll accumulate
    many repositories. As an illustration, we will use the name `homework-0`.
  prefs: []
  type: TYPE_NORMAL
- en: 'You will also be prompted to decide whether your repo should be public or private.
    To decide, know that this is the difference:'
  prefs: []
  type: TYPE_NORMAL
- en: '**Public repositories**: Anyone on the internet can see these. Only collaborators
    can make changes.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Private repositories**: Only people you grant access to can view them.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: While there are other settings to consider, we typically stick with the default
    options provided by GitHub.
  prefs: []
  type: TYPE_NORMAL
- en: After creating your repo, GitHub will show you steps to link your local repo
    (the one on your computer) to the new one you’ve set up on GitHub. They’ll provide
    some code that you can directly copy and paste into your terminal. We will break
    down that code so you’ll know exactly what each command does.
  prefs: []
  type: TYPE_NORMAL
- en: 19.5 Connecting Git and GitHub
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'When accessing GitHub you need credentials to verify your identity. There are
    two ways to connect: HTTPS or SSH, each requiring different credentials. We recommend
    using HTTPS, which uses a Personal Access Token (PAT). Note that **your GitHub
    website password isn’t your access token**.'
  prefs: []
  type: TYPE_NORMAL
- en: 'GitHub provides a detailed guide on obtaining an access token[⁵](#fn5) which
    can be found by searching “Managing your personal access tokens” on the GitHub
    Docs website[⁶](#fn6). To generate a token:'
  prefs: []
  type: TYPE_NORMAL
- en: Carefully follow the instructions provided by GitHub.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: When setting permissions for the token, choose *non-expiring* and select the
    *repo* option in the *scopes* section.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'Once you complete these steps, GitHub will display your token—a lengthy string
    of characters. You should then:'
  prefs: []
  type: TYPE_NORMAL
- en: Immediately copy this token to your clipboard. Remember, this is the only time
    GitHub will show it to you.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: For security, save this token in a password manager. This ensures you can access
    it if needed later on.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: In some of the procedures outlined below, you’ll be prompted to enter your password.
    Instead, paste the token you’ve copied. After this, password prompts should no
    longer appear. If you ever need the token again, retrieve it from your password
    manager.
  prefs: []
  type: TYPE_NORMAL
- en: For a much more detailed explanation, including how to use SSH instead of HTTPS,
    please consult Happy Git and GitHub for the useR[⁷](#fn7).
  prefs: []
  type: TYPE_NORMAL
- en: 'The next step is to let Git know who we are. This will make it easier to connect
    with GitHub. To to this type the following two commands in our terminal window:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: This will change the Git configuration in way that anytime you use Git, it will
    know this information. Note that **you need to use the email account that you
    used to open your GitHub account**.
  prefs: []
  type: TYPE_NORMAL
- en: 19.6 Initial setup
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'In a terminal, move to the directory you want to store the local repository.
    We recommend naming the directory the same as the GitHub repo. In our example
    we would use:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: We then initialize the directory as a Git repository, starting the version control
    process.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: '*main verus master* *GitHub now uses `main` as the default branch name. In
    the past, both Git and GitHub used `master` as the default. As a result, many
    older repositories or older versions of Git might still use `master` as their
    primary branch.'
  prefs: []
  type: TYPE_NORMAL
- en: 'To ensure your local branch aligns with the GitHub repository’s branch name:'
  prefs: []
  type: TYPE_NORMAL
- en: Visit the GitHub repository page.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Check the dropdown menu on the left that lists branches. This will display the
    default branch name.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'To verify your local branch name, use:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: 'If you see a branch name other than `main` but want it to be `main`, rename
    it with:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE4]'
  prefs: []
  type: TYPE_PRE
- en: The `-M` stands for move. Note that this is different from changing branches,
    it is renaming the current branch.*  *To link your local repository to its counterpart
    on GitHub, you’ll need the GitHub repository’s URL. To find this, go to the repository’s
    webpage. Click the green *Code* button to quickly copy the URL, which in our example
    is `https://github.com/rairizarry/homework-0.git`.
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/8436057076cf128ab2d8a454baeea1d6.png)'
  prefs: []
  type: TYPE_IMG
- en: Once you have this you can type
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE5]'
  prefs: []
  type: TYPE_PRE
- en: To understand this command note that `git remote add` adds a new remote reference.
    A *remote* in Git refers to another place where your code repository is stored,
    usually on the internet or another network. `origin` is the conventional name
    given to the remote repository or the central repository that other people will
    treat as an main project source. It’s essentially a shorthand alias for the repository’s
    URL. You could technically name it anything you want, but `origin` is the convention
    most use. Finally, `https://github.com/rairizarry/homework-0.git` is the URL of
    the remote repository. It tells Git where the repository is hosted. Together,
    these commands set up a new local Git repository and link it to a remote repository
    on GitHub.*  *## 19.7 Git basics
  prefs: []
  type: TYPE_NORMAL
- en: Now that you have initialized a directory to store your local repository, we
    can learn how to move files from our *working directory* all the way to the upstream
    repo.
  prefs: []
  type: TYPE_NORMAL
- en: 19.7.1 The working directory
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '![](../Images/4c4577f81846a9cd78c64263d1ae35cd.png)'
  prefs: []
  type: TYPE_IMG
- en: The working directory is the same as your Unix working directory. In our example,
    if we create a file in the `homework-0` directory, it is considered to be in the
    working directory. Git can tell you how the files in the working directory relate
    to the versions of the files in other areas with the command
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE6]'
  prefs: []
  type: TYPE_PRE
- en: Because we have not done anything yet, you should receive a message such as
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE7]'
  prefs: []
  type: TYPE_PRE
- en: 'If we add a file, say `code.R`, you will see a message like:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE8]'
  prefs: []
  type: TYPE_PRE
- en: 19.7.2 add
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '![](../Images/e86cd35818cd815370e24d55652a3887.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Now we are going to make changes to these files. Eventually, we want these
    new versions of the files to be tracked and synced with the upstream repo. But
    we don’t want to keep track of every little change: we don’t want to sync until
    we are sure these versions are final enough to share as a new version. For this
    reason, edits in the staging area are not kept by the version control system.'
  prefs: []
  type: TYPE_NORMAL
- en: 'To demonstrate, we add `code.R` to the staging area:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE9]'
  prefs: []
  type: TYPE_PRE
- en: Running `git status` now shows
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]'
  prefs: []
  type: TYPE_PRE
- en: 'Note that it is not a problem to have other files in the working directory
    that are not in the staging area. For example, if we create files `test-1.R` and
    `test-2.R`, `git status` reminds us these are not staged:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]'
  prefs: []
  type: TYPE_PRE
- en: 19.7.3 commit
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '![](../Images/049be6ef1daf69f8520a31951d2ea55e.png)'
  prefs: []
  type: TYPE_IMG
- en: 'If we are now ready to make a first version of our repository, which only includes
    `code.R`, we can use the following command:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE12]'
  prefs: []
  type: TYPE_PRE
- en: 'Note that `commit` requires us to add a message. Making these informative will
    help us remember why this change was made. After running `commit` we will receive
    a message letting us know it was committed:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE13]'
  prefs: []
  type: TYPE_PRE
- en: Note that if we edit `code.R`, it changes only in the working directory. `git
    status` shows us
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE14]'
  prefs: []
  type: TYPE_PRE
- en: To add the edited file to the local repo, we need to stage the edited file and
    commit the changes
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE15]'
  prefs: []
  type: TYPE_PRE
- en: 'which gives us a message letting us know a change was made:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE16]'
  prefs: []
  type: TYPE_PRE
- en: 'Note that we can achieve the same results with just one line by following the
    commit command with the files we want committed:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE17]'
  prefs: []
  type: TYPE_PRE
- en: This is convenient when the number of files that change is small and we can
    list them at the end.
  prefs: []
  type: TYPE_NORMAL
- en: To see version control in action note what happens when we type
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE18]'
  prefs: []
  type: TYPE_PRE
- en: 'we get a list of the version that have been stored in our log:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE19]'
  prefs: []
  type: TYPE_PRE
- en: 19.7.4 push
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '![](../Images/6c254dd476a5db928d7667fea0b324de.png)'
  prefs: []
  type: TYPE_IMG
- en: Once we are ready to sync our local repo with the upstream GitHub repo, we can
    use
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE20]'
  prefs: []
  type: TYPE_PRE
- en: '*If this is your first time pushing to your GitHub account, you will be asked
    for a password and you have to enter the personal access token we described in
    [Section 19.5](#sec-connecting-git-github). You should only need to do this once.*  *The
    `-u` flag, short for `--set-upstream` will make Git remember that in this repository
    you want to push to the `main` branch in the remote repo `origin` defined in the
    initialization. This is beneficial because the next time you want to push or pull
    from this branch, you can simply use'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE21]'
  prefs: []
  type: TYPE_PRE
- en: If you need a reminder of where you are pushing to you can type
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE22]'
  prefs: []
  type: TYPE_PRE
- en: The `v` stands for `verbose`. In our example we will get
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE23]'
  prefs: []
  type: TYPE_PRE
- en: We describe `fetch` next. If you don’t get anything back it means you have not
    defined your remote as we did in [Section 19.6](#sec-init).*  *### 19.7.5 fetch
    and merge
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/7a28045ec16712abbf08ed20843d229f.png)'
  prefs: []
  type: TYPE_IMG
- en: '![](../Images/42dea7c454e5a82cbbb4a761b2954322.png)'
  prefs: []
  type: TYPE_IMG
- en: 'If this is a collaborative project, the upstream repo may change and become
    different than your version. To update your local repository to be like the upstream
    repo, we use the command `fetch`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE24]'
  prefs: []
  type: TYPE_PRE
- en: 'And then to make these copies to our working directory, we use the command:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE25]'
  prefs: []
  type: TYPE_PRE
- en: 19.7.6 pull
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '![](../Images/1ee35fea1236e3289d2836238ee08ecb.png)'
  prefs: []
  type: TYPE_IMG
- en: 'We very often just want to fetch and merge without checking. For this, we use:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE26]'
  prefs: []
  type: TYPE_PRE
- en: 19.7.7 clone
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'You can easily download all the code and version control logs from an existing
    public repository using `git clone`. When you clone you are essentially making
    a complete copy of the entire directory. For example, you can download all the
    code used to create this book using:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE27]'
  prefs: []
  type: TYPE_PRE
- en: 'You can see a simple example with the murders directory created in the Unix
    chapter by cloning this repository:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE28]'
  prefs: []
  type: TYPE_PRE
- en: If you use `git clone`, you do not need to initialize as the branch and remote
    will already be defined. Now, to push changes you need to be added as a collaborator.
    Otherwise you will have to follow the more complex process of a *pull request*,
    which we don’t cover here.*  *## 19.8 .gitignore
  prefs: []
  type: TYPE_NORMAL
- en: When we use `git status` we obtain information about all files in our local
    repo. But we don’t necessarily need to add all the files in our working directory
    to the Git repo, only the ones we want to keep track of or the ones we want to
    share. If our work is producing files of a certain type that we do not want to
    keep track of, we can add the suffix that defines these files to the .gitignore
    file. More details on using .gitignore are included on the git-scm website[⁸](#fn8).
    These files will stop appearing when you type `git status`.
  prefs: []
  type: TYPE_NORMAL
- en: 19.9 Git in RStudio
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: While command line Git is a powerful and flexible tool, it can be somewhat daunting
    when we are getting started. RStudio provides a graphical interface that facilitates
    the use of Git in the context of a data analysis project.
  prefs: []
  type: TYPE_NORMAL
- en: 'To do this, we start a project but, instead of *New Directory*, or *Existing
    Directory*, we select *Version Control* and then we will select *Git* as our version
    control system:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/ebb5d43a881bfefaab849ba002567d29.png)'
  prefs: []
  type: TYPE_IMG
- en: '![](../Images/50febbc04553776564467059c654317a.png)'
  prefs: []
  type: TYPE_IMG
- en: The repository URL is the link you used as `origin` or to clone. In [Section
    19.4](#sec-github-repos), we used `https://github.com/username/homework-0.git`
    as an example. In the project directory name, you need to put the name of the
    folder that was generated, which in our example will be the name of the repo `homework-0`.
    This will create a folder called `homework-0` on your local system. Note you will
    need to remove the folder if it already exists or chose a different name. Once
    you do this, the project is created and it is aware of the connection to a GitHub
    repo. You will see on the top right corner the name and type of project as well
    as a new tab on the upper right pane titled *Git*.
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/aa7d9358be0048da22dc81296ed18fb6.png)'
  prefs: []
  type: TYPE_IMG
- en: '![](../Images/70ed6aea95ef1126535b986c6d1e996f.png)'
  prefs: []
  type: TYPE_IMG
- en: If you select this tab, it will show you the files in your project, excluding
    those in `.gitignore`, with some icons that give you information about these files
    and their relationship to the repo. In the example below, we already added a file
    to the folder, called *code.R* which you can see in the editing pane.
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/a96155ee61f0ef6b50b31a677e83d3bf.png)'
  prefs: []
  type: TYPE_IMG
- en: We now need to pay attention to the Git pane. It is important to know that **your
    local files and the GitHub repo will not be synced automatically**. As described
    in [Section 19.2](#sec-git-overview), you have to sync using git push when you
    are ready. We show how you can do this through RStudio rather than the terminal
    below.
  prefs: []
  type: TYPE_NORMAL
- en: Before we start working on a collaborative project, usually the first thing
    we do is *pull* in the changes from the remote repo, in our case the one on GitHub.
    However, for the example shown here, since we are starting with an empty repo
    and we are the only ones making changes, we don’t need to start by pulling.
  prefs: []
  type: TYPE_NORMAL
- en: In RStudio, the status of the file as it relates to the remote and local repos
    are represented in the status symbols with colors. A yellow square means that
    Git knows nothing about this file. To sync with the GitHub repo, we need to *add*
    the file, then *commit* the change to our local Git repo, then *push* the change
    to the GitHub repo. Right now, the file is just on our computer. To add the file
    using RStudio, we click the *Stage* box. You will see that the status icon now
    changes to a green A.
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/f7ceec715a9ef225f109c666bfd2c535.png)'
  prefs: []
  type: TYPE_IMG
- en: Now we are ready to commit the file to our local repo. In RStudio, we can use
    the *Commit* button. This will open a new dialog window. With Git, whenever we
    commit a change, we are required to enter a message describing the changes being
    *committed*.
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/c0324491c6c39692f65533ff1556cf2a.png)'
  prefs: []
  type: TYPE_IMG
- en: In this case, we will simply describe that we are adding a new script. In this
    dialog box, RStudio also gives you a summary of what you are changing to the GitHub
    repo. In this case, because it is a new file, the entire file is highlighted as
    green, which highlights the changes.
  prefs: []
  type: TYPE_NORMAL
- en: 'Once we hit the commit button, we should see a message from Git with a summary
    of the changes that were committed. Now we are ready to *push* these changes to
    the GitHub repo. We can do this by clicking on the *Push* button on the top right
    corner:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/4ed01643084dc770f58580419eaa41e9.png)'
  prefs: []
  type: TYPE_IMG
- en: '![](../Images/ab285cc45dc747887fd1e1f153a777bb.png)'
  prefs: []
  type: TYPE_IMG
- en: We now see a message from Git letting us know that the push has succeeded. In
    the pop-up window we no longer see the `code.R` file. This is because no new changes
    have been performed since we last pushed. We can exit this pop-up window now and
    continue working on our code.
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/239343259317f531c4e25974ec4d9d8e.png)'
  prefs: []
  type: TYPE_IMG
- en: '![](../Images/ac90a763a095539eb8393c73d3a4e3a9.png)'
  prefs: []
  type: TYPE_IMG
- en: If we now visit our repo on the web, we will see that it matches our local copy.
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/f8b37fbd0dc5243051fbeedd7415fcce.png)'
  prefs: []
  type: TYPE_IMG
- en: Congratulations, you have successfully shared code on a GitHub repository!
  prefs: []
  type: TYPE_NORMAL
- en: '*For the example shown here, we only added *code.R*. But, in general, for an
    RStudio project, we recommend adding a README.md file and both the .gitignore
    and .Rproj files.*  ** * *'
  prefs: []
  type: TYPE_NORMAL
