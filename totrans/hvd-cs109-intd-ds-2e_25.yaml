  id: totrans-90
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/049be6ef1daf69f8520a31951d2ea55e.png)'
- en: 'If we are now ready to make a first version of our repository, which only includes
    `code.R`, we can use the following command:'
  id: totrans-91
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们现在准备好制作仓库的第一个版本，该版本仅包括 `code.R`，我们可以使用以下命令：
- en: '[PRE12]'
  id: totrans-92
  prefs: []
  type: TYPE_PRE
  zh: '[PRE12]'
- en: 'Note that `commit` requires us to add a message. Making these informative will
    help us remember why this change was made. After running `commit` we will receive
    a message letting us know it was committed:'
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，`commit` 需要我们添加一条消息。使这些消息信息丰富将帮助我们记住为什么做出这个更改。运行 `commit` 后，我们将收到一条消息，告知我们已提交：
- en: '[PRE13]'
  id: totrans-94
  prefs: []
  type: TYPE_PRE
  zh: '[PRE13]'
- en: Note that if we edit `code.R`, it changes only in the working directory. `git
    status` shows us
  id: totrans-95
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，如果我们编辑 `code.R`，它只会在工作目录中发生变化。`git status` 会显示给我们
- en: '[PRE14]'
  id: totrans-96
  prefs: []
  type: TYPE_PRE
  zh: '[PRE14]'
- en: To add the edited file to the local repo, we need to stage the edited file and
    commit the changes
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
  zh: 要将编辑后的文件添加到本地仓库，我们需要暂存编辑后的文件并提交更改
- en: '[PRE15]'
  id: totrans-98
  prefs: []
  type: TYPE_PRE
  zh: '[PRE15]'
- en: 'which gives us a message letting us know a change was made:'
  id: totrans-99
  prefs: []
  type: TYPE_NORMAL
  zh: 这将给我们一条消息，告知我们已进行更改：
- en: '[PRE16]'
  id: totrans-100
  prefs: []
  type: TYPE_PRE
  zh: '[PRE16]'
- en: 'Note that we can achieve the same results with just one line by following the
    commit command with the files we want committed:'
  id: totrans-101
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，我们可以通过在 `commit` 命令后跟要提交的文件，只用一行命令就达到相同的效果：
- en: '[PRE17]'
  id: totrans-102
  prefs: []
  type: TYPE_PRE
  zh: '[PRE17]'
- en: This is convenient when the number of files that change is small and we can
    list them at the end.
  id: totrans-103
  prefs: []
  type: TYPE_NORMAL
  zh: 当文件更改的数量很少，并且我们可以在末尾列出它们时，这很方便。
- en: To see version control in action note what happens when we type
  id: totrans-104
  prefs: []
  type: TYPE_NORMAL
  zh: 要查看版本控制的实际操作，请注意当我们输入
- en: '[PRE18]'
  id: totrans-105
  prefs: []
  type: TYPE_PRE
  zh: '[PRE18]'
- en: 'we get a list of the version that have been stored in our log:'
  id: totrans-106
  prefs: []
  type: TYPE_NORMAL
  zh: 我们得到存储在我们日志中的版本列表：
- en: '[PRE19]'
  id: totrans-107
  prefs: []
  type: TYPE_PRE
  zh: '[PRE19]'
- en: 19.7.4 push
  id: totrans-108
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 19.7.4 push
- en: '![](../Images/6c254dd476a5db928d7667fea0b324de.png)'
  id: totrans-109
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/6c254dd476a5db928d7667fea0b324de.png)'
- en: Once we are ready to sync our local repo with the upstream GitHub repo, we can
    use
  id: totrans-110
  prefs: []
  type: TYPE_NORMAL
  zh: 一旦我们准备好将本地仓库与上游 GitHub 仓库同步，我们可以使用
- en: '[PRE20]'
  id: totrans-111
  prefs: []
  type: TYPE_PRE
  zh: '[PRE20]'
- en: '*If this is your first time pushing to your GitHub account, you will be asked
    for a password and you have to enter the personal access token we described in
    [Section 19.5](#sec-connecting-git-github). You should only need to do this once.*  *The
    `-u` flag, short for `--set-upstream` will make Git remember that in this repository
    you want to push to the `main` branch in the remote repo `origin` defined in the
    initialization. This is beneficial because the next time you want to push or pull
    from this branch, you can simply use'
  id: totrans-112
  prefs: []
  type: TYPE_NORMAL
  zh: '*如果您是第一次将代码推送到您的 GitHub 账户，您将需要输入密码，并输入我们在[第19.5节](#sec-connecting-git-github)中描述的个人访问令牌。您可能只需要这样做一次。*  *`-u`
    标志，代表 `--set-upstream`，将使 Git 记住在这个仓库中，您想要推送到远程仓库 `origin` 中定义的 `main` 分支。这很有益处，因为下次您想要从这个分支推送到或拉取时，您只需简单地使用'
- en: '[PRE21]'
  id: totrans-113
  prefs: []
  type: TYPE_PRE
  zh: '[PRE21]'
- en: If you need a reminder of where you are pushing to you can type
  id: totrans-114
  prefs: []
  type: TYPE_NORMAL
  zh: 如果您需要提醒您正在推送到哪里，您可以输入
- en: '[PRE22]'
  id: totrans-115
  prefs: []
  type: TYPE_PRE
  zh: '[PRE22]'
- en: The `v` stands for `verbose`. In our example we will get
  id: totrans-116
  prefs: []
  type: TYPE_NORMAL
  zh: '`v` 代表 `verbose`。在我们的例子中，我们将得到'
- en: '[PRE23]'
  id: totrans-117
  prefs: []
  type: TYPE_PRE
  zh: '[PRE23]'
- en: We describe `fetch` next. If you don’t get anything back it means you have not
    defined your remote as we did in [Section 19.6](#sec-init).*  *### 19.7.5 fetch
    and merge
  id: totrans-118
  prefs: []
  type: TYPE_NORMAL
  zh: 我们接下来描述 `fetch`。如果您没有收到任何回复，这意味着您还没有定义远程仓库，就像我们在[第19.6节](#sec-init)中所做的那样。*  *###
    19.7.5 fetch 和 merge
- en: '![](../Images/7a28045ec16712abbf08ed20843d229f.png)'
  id: totrans-119
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/7a28045ec16712abbf08ed20843d229f.png)'
- en: '![](../Images/42dea7c454e5a82cbbb4a761b2954322.png)'
  id: totrans-120
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/42dea7c454e5a82cbbb4a761b2954322.png)'
- en: 'If this is a collaborative project, the upstream repo may change and become
    different than your version. To update your local repository to be like the upstream
    repo, we use the command `fetch`:'
  id: totrans-121
  prefs: []
  type: TYPE_NORMAL
  zh: 如果这是一个协作项目，上游仓库可能会发生变化，与您的版本不同。为了更新您的本地仓库以与上游仓库一致，我们使用 `fetch` 命令：
- en: '[PRE24]'
  id: totrans-122
  prefs: []
  type: TYPE_PRE
  zh: '[PRE24]'
- en: 'And then to make these copies to our working directory, we use the command:'
  id: totrans-123
  prefs: []
  type: TYPE_NORMAL
  zh: 然后为了将这些副本放入我们的工作目录，我们使用以下命令：
- en: '[PRE25]'
  id: totrans-124
  prefs: []
  type: TYPE_PRE
  zh: '[PRE25]'
- en: 19.7.6 pull
  id: totrans-125
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 19.7.6 pull
- en: '![](../Images/1ee35fea1236e3289d2836238ee08ecb.png)'
  id: totrans-126
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/1ee35fea1236e3289d2836238ee08ecb.png)'
- en: 'We very often just want to fetch and merge without checking. For this, we use:'
  id: totrans-127
  prefs: []
  type: TYPE_NORMAL
  zh: 我们经常只想获取和合并，而不进行检查。为此，我们使用：
- en: '[PRE26]'
  id: totrans-128
  prefs: []
  type: TYPE_PRE
  zh: '[PRE26]'
- en: 19.7.7 clone
  id: totrans-129
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 19.7.7 克隆
- en: 'You can easily download all the code and version control logs from an existing
    public repository using `git clone`. When you clone you are essentially making
    a complete copy of the entire directory. For example, you can download all the
    code used to create this book using:'
  id: totrans-130
  prefs: []
  type: TYPE_NORMAL
  zh: 您可以轻松地从现有的公共仓库使用 `git clone` 下载所有代码和版本控制日志。当您克隆时，您实际上是在制作整个目录的完整副本。例如，您可以使用以下方式下载创建此书所使用的所有代码：
- en: '[PRE27]'
  id: totrans-131
  prefs: []
  type: TYPE_PRE
  zh: '[PRE27]'
- en: 'You can see a simple example with the murders directory created in the Unix
    chapter by cloning this repository:'
  id: totrans-132
  prefs: []
  type: TYPE_NORMAL
  zh: 您可以看到一个简单的示例，这是通过克隆此仓库在 Unix 章节中创建的谋杀目录：
- en: '[PRE28]'
  id: totrans-133
  prefs: []
  type: TYPE_PRE
  zh: '[PRE28]'
- en: If you use `git clone`, you do not need to initialize as the branch and remote
    will already be defined. Now, to push changes you need to be added as a collaborator.
    Otherwise you will have to follow the more complex process of a *pull request*,
    which we don’t cover here.*  *## 19.8 .gitignore
  id: totrans-134
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你使用 `git clone`，你不需要初始化，因为分支和远程仓库已经定义好了。现在，要推送更改，你需要被添加为合作者。否则，你将不得不遵循更复杂的
    *pull request* 流程，这里我们不涉及。*  *## 19.8 .gitignore
- en: When we use `git status` we obtain information about all files in our local
    repo. But we don’t necessarily need to add all the files in our working directory
    to the Git repo, only the ones we want to keep track of or the ones we want to
    share. If our work is producing files of a certain type that we do not want to
    keep track of, we can add the suffix that defines these files to the .gitignore
    file. More details on using .gitignore are included on the git-scm website[⁸](#fn8).
    These files will stop appearing when you type `git status`.
  id: totrans-135
  prefs: []
  type: TYPE_NORMAL
  zh: 当我们使用 `git status` 时，我们获得有关本地仓库中所有文件的信息。但并不一定需要将工作目录中的所有文件添加到 Git 仓库中，只需那些我们想要跟踪或共享的文件。如果我们的工作正在生成我们不希望跟踪的特定类型的文件，我们可以将这些文件定义的后缀添加到
    .gitignore 文件中。关于使用 .gitignore 的更多详细信息，请参阅 git-scm 网站[⁸](#fn8)。当你输入 `git status`
    时，这些文件将不再出现。
- en: 19.9 Git in RStudio
  id: totrans-136
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 19.9 Git in RStudio
- en: While command line Git is a powerful and flexible tool, it can be somewhat daunting
    when we are getting started. RStudio provides a graphical interface that facilitates
    the use of Git in the context of a data analysis project.
  id: totrans-137
  prefs: []
  type: TYPE_NORMAL
  zh: 虽然命令行 Git 是一个强大且灵活的工具，但当我们刚开始时，它可能会有些令人望而生畏。RStudio 提供了一个图形界面，它简化了在数据分析项目中使用
    Git 的过程。
- en: 'To do this, we start a project but, instead of *New Directory*, or *Existing
    Directory*, we select *Version Control* and then we will select *Git* as our version
    control system:'
  id: totrans-138
  prefs: []
  type: TYPE_NORMAL
  zh: 要这样做，我们开始一个项目，但不是选择 *New Directory* 或 *Existing Directory*，而是选择 *Version Control*，然后我们将选择
    *Git* 作为我们的版本控制系统：
- en: '![](../Images/ebb5d43a881bfefaab849ba002567d29.png)'
  id: totrans-139
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/ebb5d43a881bfefaab849ba002567d29.png)'
- en: '![](../Images/50febbc04553776564467059c654317a.png)'
  id: totrans-140
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/50febbc04553776564467059c654317a.png)'
- en: The repository URL is the link you used as `origin` or to clone. In [Section
    19.4](#sec-github-repos), we used `https://github.com/username/homework-0.git`
    as an example. In the project directory name, you need to put the name of the
    folder that was generated, which in our example will be the name of the repo `homework-0`.
    This will create a folder called `homework-0` on your local system. Note you will
    need to remove the folder if it already exists or chose a different name. Once
    you do this, the project is created and it is aware of the connection to a GitHub
    repo. You will see on the top right corner the name and type of project as well
    as a new tab on the upper right pane titled *Git*.
  id: totrans-141
  prefs: []
  type: TYPE_NORMAL
  zh: 仓库 URL 是你用作 `origin` 或克隆的链接。在 [第 19.4 节](#sec-github-repos) 中，我们使用了 `https://github.com/username/homework-0.git`
    作为示例。在项目目录名称中，你需要放入生成的文件夹名称，在我们的示例中，这将是仓库的名称 `homework-0`。这将在你的本地系统中创建一个名为 `homework-0`
    的文件夹。注意，如果你已经存在该文件夹，则需要删除它或选择不同的名称。一旦这样做，项目就创建好了，并且它知道与 GitHub 仓库的连接。你将在右上角看到项目名称和类型，以及右上角的新标签页，标题为
    *Git*。
- en: '![](../Images/aa7d9358be0048da22dc81296ed18fb6.png)'
  id: totrans-142
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/aa7d9358be0048da22dc81296ed18fb6.png)'
- en: '![](../Images/70ed6aea95ef1126535b986c6d1e996f.png)'
  id: totrans-143
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/70ed6aea95ef1126535b986c6d1e996f.png)'
- en: If you select this tab, it will show you the files in your project, excluding
    those in `.gitignore`, with some icons that give you information about these files
    and their relationship to the repo. In the example below, we already added a file
    to the folder, called *code.R* which you can see in the editing pane.
  id: totrans-144
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你选择这个标签页，它将显示你的项目中的文件，排除 `.gitignore` 中的文件，以及一些图标，这些图标会给你提供关于这些文件及其与仓库关系的详细信息。在下面的示例中，我们已经在文件夹中添加了一个文件，名为
    *code.R*，你可以在编辑面板中看到它。
- en: '![](../Images/a96155ee61f0ef6b50b31a677e83d3bf.png)'
  id: totrans-145
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/a96155ee61f0ef6b50b31a677e83d3bf.png)'
- en: We now need to pay attention to the Git pane. It is important to know that **your
    local files and the GitHub repo will not be synced automatically**. As described
    in [Section 19.2](#sec-git-overview), you have to sync using git push when you
    are ready. We show how you can do this through RStudio rather than the terminal
    below.
  id: totrans-146
  prefs: []
  type: TYPE_NORMAL
  zh: 我们现在需要关注 Git 选项卡。重要的是要知道，**你的本地文件和 GitHub 仓库不会自动同步**。如 [第 19.2 节](#sec-git-overview)
    所述，当你准备好时，你必须使用 git push 进行同步。我们将在下面的 RStudio 中而不是在终端中展示如何这样做。
- en: Before we start working on a collaborative project, usually the first thing
    we do is *pull* in the changes from the remote repo, in our case the one on GitHub.
    However, for the example shown here, since we are starting with an empty repo
    and we are the only ones making changes, we don’t need to start by pulling.
  id: totrans-147
  prefs: []
  type: TYPE_NORMAL
  zh: 在我们开始协作项目之前，我们通常首先做的事情是从远程仓库*拉取*更改，在我们的例子中是 GitHub 上的那个。然而，对于这里显示的示例，由于我们从一个空的仓库开始，并且我们是唯一进行更改的人，所以我们不需要从拉取开始。
- en: In RStudio, the status of the file as it relates to the remote and local repos
    are represented in the status symbols with colors. A yellow square means that
    Git knows nothing about this file. To sync with the GitHub repo, we need to *add*
    the file, then *commit* the change to our local Git repo, then *push* the change
    to the GitHub repo. Right now, the file is just on our computer. To add the file
    using RStudio, we click the *Stage* box. You will see that the status icon now
    changes to a green A.
  id: totrans-148
  prefs: []
  type: TYPE_NORMAL
  zh: 在 RStudio 中，文件相对于远程和本地仓库的状态通过带有颜色的状态符号表示。黄色方块表示 Git 对此文件一无所知。为了与 GitHub 仓库同步，我们需要*添加*该文件，然后*提交*更改到我们的本地
    Git 仓库，然后*推送*更改到 GitHub 仓库。目前，该文件仅存在于我们的计算机上。要使用 RStudio 添加文件，我们点击*暂存*框。你会看到状态图标现在变成了绿色
    A。
- en: '![](../Images/f7ceec715a9ef225f109c666bfd2c535.png)'
  id: totrans-149
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/f7ceec715a9ef225f109c666bfd2c535.png)'
- en: Now we are ready to commit the file to our local repo. In RStudio, we can use
    the *Commit* button. This will open a new dialog window. With Git, whenever we
    commit a change, we are required to enter a message describing the changes being
    *committed*.
  id: totrans-150
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们已准备好将文件提交到我们的本地仓库。在 RStudio 中，我们可以使用*提交*按钮。这将打开一个新的对话框窗口。使用 Git 时，每次我们提交更改，都必须输入一个描述正在*提交*的更改的消息。
- en: '![](../Images/c0324491c6c39692f65533ff1556cf2a.png)'
  id: totrans-151
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/c0324491c6c39692f65533ff1556cf2a.png)'
- en: In this case, we will simply describe that we are adding a new script. In this
    dialog box, RStudio also gives you a summary of what you are changing to the GitHub
    repo. In this case, because it is a new file, the entire file is highlighted as
    green, which highlights the changes.
  id: totrans-152
  prefs: []
  type: TYPE_NORMAL
  zh: 在这种情况下，我们将简单地描述我们正在添加一个新的脚本。在这个对话框中，RStudio 还会给你一个关于你要更改到 GitHub 仓库的内容的摘要。在这种情况下，因为它是一个新文件，整个文件都被高亮显示为绿色，这突出了更改。
- en: 'Once we hit the commit button, we should see a message from Git with a summary
    of the changes that were committed. Now we are ready to *push* these changes to
    the GitHub repo. We can do this by clicking on the *Push* button on the top right
    corner:'
  id: totrans-153
  prefs: []
  type: TYPE_NORMAL
  zh: 一旦我们点击提交按钮，我们应该会看到 Git 发来的一个包含已提交更改摘要的消息。现在我们已准备好将这些更改*推送*到 GitHub 仓库。我们可以通过点击右上角的*推送*按钮来完成此操作：
- en: '![](../Images/4ed01643084dc770f58580419eaa41e9.png)'
  id: totrans-154
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/4ed01643084dc770f58580419eaa41e9.png)'
- en: '![](../Images/ab285cc45dc747887fd1e1f153a777bb.png)'
  id: totrans-155
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/ab285cc45dc747887fd1e1f153a777bb.png)'
- en: We now see a message from Git letting us know that the push has succeeded. In
    the pop-up window we no longer see the `code.R` file. This is because no new changes
    have been performed since we last pushed. We can exit this pop-up window now and
    continue working on our code.
  id: totrans-156
  prefs: []
  type: TYPE_NORMAL
  zh: 现在，我们看到 Git 发来的消息，告知我们推送已成功。在弹出的窗口中，我们不再看到 `code.R` 文件。这是因为自上次推送以来，我们没有进行任何新的更改。现在我们可以退出这个弹出窗口，继续我们的代码工作。
- en: '![](../Images/239343259317f531c4e25974ec4d9d8e.png)'
  id: totrans-157
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/239343259317f531c4e25974ec4d9d8e.png)'
- en: '![](../Images/ac90a763a095539eb8393c73d3a4e3a9.png)'
  id: totrans-158
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/ac90a763a095539eb8393c73d3a4e3a9.png)'
- en: If we now visit our repo on the web, we will see that it matches our local copy.
  id: totrans-159
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们现在访问我们的仓库在网页上，我们会看到它与我们的本地副本相匹配。
- en: '![](../Images/f8b37fbd0dc5243051fbeedd7415fcce.png)'
  id: totrans-160
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/f8b37fbd0dc5243051fbeedd7415fcce.png)'
- en: Congratulations, you have successfully shared code on a GitHub repository!
  id: totrans-161
  prefs: []
  type: TYPE_NORMAL
  zh: 恭喜你，你已经在 GitHub 仓库成功共享了代码！
- en: '*For the example shown here, we only added *code.R*. But, in general, for an
    RStudio project, we recommend adding a README.md file and both the .gitignore
    and .Rproj files.*  ** * *'
  id: totrans-162
  prefs: []
  type: TYPE_NORMAL
  zh: '*对于这里显示的示例，我们只添加了 *code.R*。但，一般来说，对于 RStudio 项目，我们建议添加一个 README.md 文件以及 .gitignore
    和 .Rproj 文件。** *'
