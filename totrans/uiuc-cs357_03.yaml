- en: Learning objectives
  id: totrans-4
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 学习目标
- en: Compare and contrast relative and absolute error
  id: totrans-5
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 比较和对比相对误差和绝对误差
- en: Categorize a cost as \(\mathcal{O}(n^p)\)
  id: totrans-6
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 将成本分类为 \(\mathcal{O}(n^p)\)
- en: Categorize an error \(\mathcal{O}(h^p)\)
  id: totrans-7
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 将误差分类为 \(\mathcal{O}(h^p)\)
- en: Identify algebraic vs exponential growth and convergence
  id: totrans-8
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 识别代数增长和指数增长与收敛
- en: Big Picture
  id: totrans-9
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 整体情况
- en: Numerical algorithms are distinguished by their ***cost*** and ***error***,
    and the tradeoff between them.
  id: totrans-10
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 数值算法以其***成本***和***误差***以及它们之间的权衡而区分。
- en: The algorithms or methods introduced in this course indicate their error and
    cost whenever possible. These might be exact expressions or asymptotic bounds
    like \(\mathcal{O}(h^2)\) as \(h \to 0\) or \(\mathcal{O}(n^3)\) as \(n \to \infty\).
    For asymptotics we always indicate the limit.
  id: totrans-11
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在可能的情况下，本课程中介绍的计算算法或方法会指出它们的误差和成本。这些可能是精确表达式或渐近界限，如 \(h \to 0\) 时的 \(\mathcal{O}(h^2)\)
    或 \(n \to \infty\) 时的 \(\mathcal{O}(n^3)\)。对于渐近分析，我们总是指明极限。
- en: Scientific Notation
  id: totrans-12
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 科学记数法
- en: Using scientific notation, a number can be expressed in the form
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 使用科学记数法，一个数可以表示为
- en: \[x = \pm r \times 10^{m}\]
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: \[x = \pm r \times 10^{m}\]
- en: where \(r\) is a coefficient in the range \(1 \leq r < 10 \) and \(m\) is the
    exponent.
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 其中 \(r\) 是一个在 \(1 \leq r < 10\) 范围内的系数，\(m\) 是指数。
- en: '**Examples:** Let us convert these numbers into scientific notation:'
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: '**示例：**让我们将这些数字转换为科学记数法：'
- en: \[\begin{equation} -165.73 = -1.6573 \times 10^{2} \end{equation}\] \[\begin{equation}
    0.00432 = 4.32 \times 10^{-3} \end{equation}\]
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{equation} -165.73 = -1.6573 \times 10^{2} \end{equation}\] \[\begin{equation}
    0.00432 = 4.32 \times 10^{-3} \end{equation}\]
- en: Absolute and Relative Error
  id: totrans-18
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 绝对误差和相对误差
- en: 'Results computed using numerical methods are inaccurate – they are approximations
    to the true values. We can represent an approximate result as a combination of
    the true value and some error:'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 使用数值方法计算的结果是不准确的——它们是真实值的近似。我们可以将一个近似结果表示为真实值和一些误差的组合：
- en: \[\begin{eqnarray} \text{Approximate Result} = \text{True Value} + \text{Error}
    \end{eqnarray}\] \[\hat{x} = x + \Delta x\]
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{eqnarray} \text{近似结果} = \text{真实值} + \text{误差} \end{eqnarray}\] \[\hat{x}
    = x + \Delta x\]
- en: 'Given this problem setup we can define the absolute error as:'
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 给定这个问题设置，我们可以定义绝对误差为：
- en: \[\begin{equation} \text{Absolute Error} = |x - \hat{x}| \end{equation} .\]
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{equation} \text{绝对误差} = |x - \hat{x}| \end{equation} .\]
- en: This tells us how close our approximate result is to the actual answer. However,
    absolute error can become an unsatisfactory and misleading representation of the
    error depending on the magnitude of \(x\).
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 这告诉我们我们的近似结果与实际答案有多接近。然而，绝对误差可能会因为 \(x\) 的大小而成为一个令人不满意且具有误导性的误差表示。
- en: '| Case 1 | Case 2 |'
  id: totrans-24
  prefs: []
  type: TYPE_TB
  zh: '| 情况 1 | 情况 2 |'
- en: '| --- | --- |'
  id: totrans-25
  prefs: []
  type: TYPE_TB
  zh: '| --- | --- |'
- en: '| \(x = 0.1\), \(\hat{x} = 0.2\) | \(x = 100.0\), \(\hat{x} = 100.1\) |'
  id: totrans-26
  prefs: []
  type: TYPE_TB
  zh: '| \(x = 0.1\), \(\hat{x} = 0.2\) | \(x = 100.0\), \(\hat{x} = 100.1\) |'
- en: '| \(\mid x - \hat{x} \mid = 0.1\) | \(\mid x - \hat{x} \mid = 0.1\) |'
  id: totrans-27
  prefs: []
  type: TYPE_TB
  zh: '| \(\mid x - \hat{x} \mid = 0.1\) | \(\mid x - \hat{x} \mid = 0.1\) |'
- en: In both of these cases, the absolute error is the same, 0.1\. However, we would
    intuitively consider case 2 more accurate than case 1 since our approximation
    is double the true value in case 1\. Because of this, we define the relative error,
    which will be an error estimate independent of the magnitude. To obtain this we
    simply divide the absolute error by the absolute value of the true value.
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 在这两种情况下，绝对误差相同，都是 0.1。然而，我们会直觉地认为情况 2 比情况 1 更准确，因为情况 1 中的近似值是真实值的两倍。因此，我们定义相对误差，这将是一个与大小无关的误差估计。为了获得这个值，我们只需将绝对误差除以真实值的绝对值。
- en: \[\begin{equation} \text{Relative Error} = \frac{|x - \hat{x}|}{|x|} \end{equation}\]
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{equation} \text{相对误差} = \frac{|x - \hat{x}|}{|x|} \end{equation}\]
- en: If we consider the two cases again, we can see that the relative error will
    be much lower in the second case, since relative error is independent of magnitude.
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们再次考虑这两种情况，我们可以看到相对误差在第二种情况下会低得多，因为相对误差与大小无关。
- en: '| Case 1 | Case 2 |'
  id: totrans-31
  prefs: []
  type: TYPE_TB
  zh: '| 情况 1 | 情况 2 |'
- en: '| --- | --- |'
  id: totrans-32
  prefs: []
  type: TYPE_TB
  zh: '| --- | --- |'
- en: '| \(x = 0.1\), \(\hat{x} = 0.2\) | \(x = 100.0\), \(\hat{x} = 100.1\) |'
  id: totrans-33
  prefs: []
  type: TYPE_TB
  zh: '| \(x = 0.1\), \(\hat{x} = 0.2\) | \(x = 100.0\), \(\hat{x} = 100.1\) |'
- en: '| \(\frac{\mid x - \hat{x} \mid}{\mid x \mid} = 1\) | \(\frac{\mid x - \hat{x}
    \mid}{\mid x \mid} = 10^{-3}\) |'
  id: totrans-34
  prefs: []
  type: TYPE_TB
  zh: '| \(\frac{\mid x - \hat{x} \mid}{\mid x \mid} = 1\) | \(\frac{\mid x - \hat{x}
    \mid}{\mid x \mid} = 10^{-3}\) |'
- en: Absolute and Relative Error of Vectors
  id: totrans-35
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 向量的绝对误差和相对误差
- en: If our calculated quantities are vectors, then instead of using the absolute
    value function, we can use the norm instead. Thus, our formulas become
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们的计算量是向量，那么我们不用绝对值函数，而可以用范数。因此，我们的公式变为
- en: \[\begin{equation} \text{Absolute Error} = \|\mathbf{x} - \mathbf{\hat{x}}\|
    \end{equation}\] \[\begin{equation} \text{Relative Error} = \frac{\|\mathbf{x}
    - \mathbf{\hat{x}}\|}{\|\mathbf{x}\|} \end{equation}\]
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{equation} \text{绝对误差} = \|\mathbf{x} - \mathbf{\hat{x}}\| \end{equation}\]
    \[\begin{equation} \text{相对误差} = \frac{\|\mathbf{x} - \mathbf{\hat{x}}\|}{\|\mathbf{x}\|}
    \end{equation}\]
- en: We take the norm of the difference (and not the difference of the norms), because
    we are interested in how far apart these two quantities are. This way, we are
    calculating the difference vector, and then using the vector norm to find the
    length of that difference vector.
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: 我们取差分的范数（而不是范数的差），因为我们感兴趣的是这两个量有多远。这样，我们计算差分向量，然后使用向量范数来找到该差分向量的长度。
- en: Significant Digits/Figures
  id: totrans-39
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 有效数字/数位
- en: '**Significant figures** of a number are digits that carry meaningful information.
    They are digits beginning from the leftmost nonzero digit and ending with the
    rightmost "correct" digit, including final zeros that are exact. For example:'
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: '**有效数字**是一个数字，它携带有意义的信息。它们是从最左边的非零数字开始，以最右边的“正确”数字结束的数字，包括精确的末尾零。例如：'
- en: The number 3.14159 has six significant digits.
  id: totrans-41
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 数字 3.14159 有六个有效数字。
- en: The number 0.00035 has two significant digits.
  id: totrans-42
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 数字 0.00035 有两个有效数字。
- en: The number 0.000350 has three significant digits.
  id: totrans-43
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 数字 0.000350 有三个有效数字。
- en: Significant Figures of an Approximation
  id: totrans-44
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 近似值的有效数字
- en: An approximate result \(\hat{x}\) has \(n\) **significant figures** of a true
    value \(x\) if the absolute error, \(\vert x - \hat{x}\vert\), has zeros in the
    first \(n\) decimal places counting from the leftmost nonzero (leading) digit
    of \(x\), followed by a digit from 0 to 4.
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: 近似结果 \(\hat{x}\) 的 \(n\) 个有效数字对应于真实值 \(x\)，如果绝对误差 \(\vert x - \hat{x}\vert\)
    在从 \(x\) 最左边的非零（首位）数字开始计数的第一个 \(n\) 位小数中包含零，然后是 0 到 4 之间的一个数字。
- en: '**Example:** Assume \(x = 3.141592653\) and suppose \(\hat{x}\) is the approximate
    result:'
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: '**示例：** 假设 \(x = 3.141592653\)，假设 \(\hat{x}\) 是近似结果：'
- en: \[\hat{x} = 3.14159 \longrightarrow |x - \hat{x}| = 0.00000\mathbf{2}653 = 2.653
    \times 10^{-6} \longrightarrow \hat{x} \text{ has 6 significant figures.}\] \[\hat{x}
    = 3.1415 \longrightarrow |x - \hat{x}| = 0.0000\mathbf{9}2653 = 0.92653 \times
    10^{-4} \longrightarrow \hat{x} \text{ has 4 significant figures.}\]
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: \[\hat{x} = 3.14159 \longrightarrow |x - \hat{x}| = 0.00000\mathbf{2}653 = 2.653
    \times 10^{-6} \longrightarrow \hat{x} \text{ 有 6 个有效数字。}\] \[\hat{x} = 3.1415
    \longrightarrow |x - \hat{x}| = 0.0000\mathbf{9}2653 = 0.92653 \times 10^{-4}
    \longrightarrow \hat{x} \text{ 有 4 个有效数字。}\]
- en: In other words, the number of significant figures tells us about how many positions
    of \(x\) and \(\hat{x}\) agree.
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: 换句话说，有效数字的数量告诉我们 \(x\) 和 \(\hat{x}\) 有多少位是相同的。
- en: 'Therefore, we can observe that the absolute error is bounded by:'
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，我们可以观察到绝对误差被以下所限制：
- en: \[|x - \hat{x}| \leq 5 \times 10^{-n}\]
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: \[|x - \hat{x}| \leq 5 \times 10^{-n}\]
- en: 'To find the bound on the relative error, let us define \(x\) and \(\hat{x}\)
    as:'
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: 为了找到相对误差的界限，让我们定义 \(x\) 和 \(\hat{x}\) 如下：
- en: \[\begin{equation} x = q \times 10^p \end{equation}\] \[\begin{equation} \hat{x}
    = \hat{q} \times 10^p \end{equation}\]
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{equation} x = q \times 10^p \end{equation}\] \[\begin{equation} \hat{x}
    = \hat{q} \times 10^p \end{equation}\]
- en: 'The absolute error can be stated as:'
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: 绝对误差可以这样表述：
- en: \[|x - \hat{x}| = |q - \hat{q}| \times 10^p\]
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
  zh: \[|x - \hat{x}| = |q - \hat{q}| \times 10^p\]
- en: 'Because of scientific notation we know that \(1 \leq q < 10\), so:'
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: 由于科学记数法，我们知道 \(1 \leq q < 10\)，所以：
- en: \[\text{Relative Error} = \frac{|x - \hat{x}|}{|x|} = \frac{|q - \hat{q}| \times
    10^p}{|q| \times 10^p} \leq \frac{5 \times 10^{-n}}{|q|} \leq 5 \times 10^{-n}\]
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: \[\text{相对误差} = \frac{|x - \hat{x}|}{|x|} = \frac{|q - \hat{q}| \times 10^p}{|q|
    \times 10^p} \leq \frac{5 \times 10^{-n}}{|q|} \leq 5 \times 10^{-n}\]
- en: 'In general, we will use the rule-of-thumb for calculating an upper bound of
    the relative error: if an approximation has \(n\) accurate significant digits,
    then the relative error is'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: 通常，我们将使用经验法则来计算相对误差的上界：如果一个近似值有 \(n\) 个准确的有效数字，那么相对误差是
- en: \[\frac{|x - \hat{x}|}{|x|} \leq 10^{-n+1}\]
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: \[\frac{|x - \hat{x}|}{|x|} \leq 10^{-n+1}\]
- en: Truncation Error vs. Rounding Error
  id: totrans-59
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 截断误差与舍入误差
- en: '**Rounding error** is the error that occurs from rounding values in a computation.
    This occurs constantly since computers use finite precision and have a limit on
    the memory available for storing one numerical value. Approximating \(\frac{1}{3}
    = 0.33333\dots\) with a finite decimal expansion is an example of rounding error.'
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: '**舍入误差**是在计算中对值进行舍入时产生的误差。由于计算机使用有限精度并且对存储一个数值值的内存有限制，因此这种情况会不断发生。用有限小数展开来近似
    \(\frac{1}{3} = 0.33333\dots\) 是舍入误差的一个例子。'
- en: '**Truncation error** is the error from using an approximate algorithm in place
    of an exact mathematical procedure or function. For example, in the case of evaluating
    functions, we may represent our function by a finite Taylor series up to degree
    \(n\). The truncation error is the error that is incurred by not using the \(n+1\)
    term and above.'
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: '**截断误差**是在使用近似算法代替精确的数学过程或函数时产生的误差。例如，在评估函数的情况下，我们可能用有限泰勒级数表示我们的函数，直到 \(n\)
    次方。截断误差是由于没有使用 \(n+1\) 次方及以上的项而产生的误差。'
- en: Big-O Notation
  id: totrans-62
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 大O表示法
- en: 'Big-O notation is used to understand and describe asymptotic behavior. The
    definition in the cases of approching 0 or \(\infty\) are as follows:'
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: 大O表示法用于理解和描述渐近行为。在趋近于0或\(\infty\)的情况下的定义如下：
- en: Let \(f\) and \(g\) be two functions. Then \(f(x) = \mathcal{O}(g(x))\) as \(x
    \rightarrow \infty\) if and only if there exists a value \(M\) and some \(x_0\)
    such that \(|f(x)| \leq M|g(x)|\) \(\forall x\) where \(x\geq x_0\)
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: 设 \(f\) 和 \(g\) 是两个函数。那么当 \(x \rightarrow \infty\) 时，\(f(x) = \mathcal{O}(g(x))\)
    当且仅当存在一个值 \(M\) 和某个 \(x_0\)，使得 \(|f(x)| \leq M|g(x)|\) 对于所有 \(x\) 成立，其中 \(x\geq
    x_0\)
- en: Let \(f\) and \(g\) be two functions. Then \(f(h) = \mathcal{O}(g(h))\) as \(h
    \rightarrow 0\) if and only if there exists a value \(M\) and some \(h_0\) such
    that \(|f(h)| \leq M|g(h)|\) \(\forall h\) where \(0 < h < h_0\)
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
  zh: 设 \(f\) 和 \(g\) 是两个函数。那么当 \(h \rightarrow 0\) 时，\(f(h) = \mathcal{O}(g(h))\)
    当且仅当存在一个值 \(M\) 和某个 \(h_0\)，使得 \(|f(h)| \leq M|g(h)|\) 对于所有 \(h\) 成立，其中 \(0 <
    h < h_0\)
- en: 'But what if we want to consider the function approaching an arbitrary value?
    Then we can redefine the expression as:'
  id: totrans-66
  prefs: []
  type: TYPE_NORMAL
  zh: 但如果我们想考虑函数趋近于任意值的情况呢？那么我们可以重新定义表达式如下：
- en: Let \(f\) and \(g\) be two functions. Then \(f(x) = \mathcal{O}(g(x))\) as \(x
    \rightarrow a\) if and only if there exists a value \(M\) and some \(\delta\)
    such that \(|f(x)| \leq M|g(x)|\) \(\forall x\) where \(0 < |x − a| < \delta\)
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
  zh: 设 \(f\) 和 \(g\) 是两个函数。那么当 \(x \rightarrow a\) 时，\(f(x) = \mathcal{O}(g(x))\)
    当且仅当存在一个值 \(M\) 和某个 \(\delta\)，使得 \(|f(x)| \leq M|g(x)|\) 对于所有 \(x\) 成立，其中 \(0
    < |x − a| < \delta\)
- en: Big-O Analysis
  id: totrans-68
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 大O分析
- en: Since Big-O notation is used to understand asymptotic behavior, we are interested
    in faster-growing terms that define the limiting behavior of the function.
  id: totrans-69
  prefs: []
  type: TYPE_NORMAL
  zh: 由于大O表示法用于理解渐近行为，我们感兴趣的是增长最快的项，这些项定义了函数的极限行为。
- en: For example, consider the function \(f(x) = 2x^2 + 27x + 1000\)
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，考虑函数 \(f(x) = 2x^2 + 27x + 1000\)
- en: When \(x \rightarrow \infty\), the term \(x^2\) is the fastest-growing, so it
    is the most significant, and hence \(f(x) = O(x^2)\).
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: 当 \(x \rightarrow \infty\) 时，项 \(x^2\) 是增长最快的，因此它是最重要的，所以 \(f(x) = O(x^2)\)。
- en: 'The hierarchy of fastest to slowest growing common terms, where \(c\) is a
    constant is:'
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: 最快增长到最慢增长常见项的层次结构，其中 \(c\) 是一个常数：
- en: \[\mathcal{O}(n!) > \mathcal{O}(c^n) > \mathcal{O}(n^c) > \mathcal{O}(n^2) >
    \mathcal{O}(n log(n)) > \mathcal{O}(n) > \mathcal{O}(log(n)) > \mathcal{O}(c)\]
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: \[\mathcal{O}(n!) > \mathcal{O}(c^n) > \mathcal{O}(n^c) > \mathcal{O}(n^2) >
    \mathcal{O}(n log(n)) > \mathcal{O}(n) > \mathcal{O}(log(n)) > \mathcal{O}(c)\]
- en: Big-O Examples - Time Complexity
  id: totrans-74
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 大O表示法示例 - 时间复杂度
- en: We can use Big-O to describe the time complexity of our algorithms.
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以使用大O来描述我们算法的时间复杂度。
- en: Consider the case of matrix-matrix multiplication. If the size of each of our
    matrices is \(n \times n\), to multiply the matrices, we have to compute the inner
    product at each entry, which requires \(n\) multiplications and \(n\) summations.
    In an \(n \times n\) matrix, there are \(n^2\) entries, meaning that there are
    \(n^2 (2n) = 2n^3\) operations, so the time taken to multiply the matrices is
    proportional to \(2n^3\).
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: 考虑矩阵-矩阵乘法的情况。如果我们的每个矩阵的大小是 \(n \times n\)，为了乘法矩阵，我们必须在每个元素上计算内积，这需要 \(n\) 次乘法和
    \(n\) 次求和。在一个 \(n \times n\) 的矩阵中，有 \(n^2\) 个元素，这意味着有 \(n^2 (2n) = 2n^3\) 次操作，所以乘法矩阵所需的时间与
    \(2n^3\) 成正比。
- en: However, when trying to understand time complexity, we care about the asymptotic
    growth rate of our algorithm based on input size, so we can say the time it will
    take to multiply the matrices is \(\mathcal{O}(n^3)\) meaning that \(\text{Run
    time} \approx C \cdot n^3\).
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，在尝试理解时间复杂度时，我们关注的是算法基于输入大小的渐近增长率，因此我们可以这样说，乘矩阵所需的时间是 \(\mathcal{O}(n^3)\)，这意味着
    \(\text{运行时间} \approx C \cdot n^3\)。
- en: Suppose we know that for \(n_1=1000\), the matrix-matrix multiplication takes
    5 seconds. Estimate how much time it would take if we double the size of our matrices
    to \(2n \times 2n\).
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们知道对于 \(n_1=1000\)，矩阵-矩阵乘法需要5秒。估计如果我们把矩阵的大小加倍到 \(2n \times 2n\)，需要多少时间。
- en: 'We know that:'
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
  zh: 我们知道：
- en: \[\begin{align*} \text{Time}(2n_1) &\approx C \cdot (2n_1)^3 \\ &= C \cdot 2^3
    \cdot n_1^3\\ &= 8 \cdot (C \cdot n_1^3) \\ &= 8 \cdot \text{Time}(n_1) \\ &=
    40 \text{ seconds} \end{align*}\]
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{align*} \text{时间}(2n_1) &\approx C \cdot (2n_1)^3 \\ &= C \cdot 2^3
    \cdot n_1^3\\ &= 8 \cdot (C \cdot n_1^3) \\ &= 8 \cdot \text{时间}(n_1) \\ &= 40
    \text{秒} \end{align*}\]
- en: So, when we double the size of our our matrices to \(2n \times 2n\), the time
    becomes \((2n)^3 = 8n^3\). Thus, the runtime will be roughly 8 times as long.
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，当我们把矩阵的大小加倍到 \(2n \times 2n\) 时，时间变为 \((2n)^3 = 8n^3\)。因此，运行时间将大约是原来的8倍。
- en: Big-O Examples - Truncation Errors
  id: totrans-82
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 大O记号示例 - 截断误差
- en: We can also use Big-O notation to describe the truncation error. A numerical
    method is called \(n\)-th order accurate if its truncation error \(E(h)\) obeys
    \(E(h) = \mathcal{O}(h^n)\).
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
  zh: 我们也可以使用大O记号来描述截断误差。一个数值方法被称为 \(n\) 阶精确，如果其截断误差 \(E(h)\) 符合 \(E(h) = \mathcal{O}(h^n)\)。
- en: Example 1
  id: totrans-84
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 示例 1
- en: 'The sine function can be expressed as an infinite series:'
  id: totrans-85
  prefs: []
  type: TYPE_NORMAL
  zh: 正弦函数可以表示为一个无穷级数：
- en: \[f(h) = sin(h) = h - \frac{h^3}{6} + \frac{h^5}{120} - \frac{h^7}{5040} + \dots\]
  id: totrans-86
  prefs: []
  type: TYPE_NORMAL
  zh: \[f(h) = \sin(h) = h - \frac{h^3}{6} + \frac{h^5}{120} - \frac{h^7}{5040} +
    \dots\]
- en: 'Suppose we take an approximation:'
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们取一个近似值：
- en: \[\hat{f(h)} = h\]
  id: totrans-88
  prefs: []
  type: TYPE_NORMAL
  zh: \[\hat{f(h)} = h\]
- en: 'We can define the truncation error as:'
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以将截断误差定义为：
- en: \[E = |f(h) - \hat{f(h)} | = | - \frac{h^3}{6} + \frac{h^5}{120} - \frac{h^7}{5040}
    + \dots|\]
  id: totrans-90
  prefs: []
  type: TYPE_NORMAL
  zh: \[E = |f(h) - \hat{f(h)} | = | - \frac{h^3}{6} + \frac{h^5}{120} - \frac{h^7}{5040}
    + \dots|\]
- en: 'Instead, using the Big-O notation, we define the truncation error as:'
  id: totrans-91
  prefs: []
  type: TYPE_NORMAL
  zh: 相反，使用大O记号，我们定义截断误差为：
- en: \[E = \mathcal{O}(h^3)\]
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: \[E = \mathcal{O}(h^3)\]
- en: Example 2
  id: totrans-93
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 示例 2
- en: Consider solving an interpolation problem. We have an interval of length \(h\)
    where our interpolant is valid and we know that our approximation is order \(\mathcal{O}(h^2)\).
    What this means is that as we decrease \(h\) (the interval length), our error
    will decrease quadratically. Using the definition of Big-O, we know that \(\text{Error}
    = C \cdot h^2\) where \(C\) is some constant.
  id: totrans-94
  prefs: []
  type: TYPE_NORMAL
  zh: 考虑解决一个插值问题。我们有一个长度为 \(h\) 的区间，其中我们的插值函数是有效的，并且我们知道我们的近似是 \(\mathcal{O}(h^2)\)
    阶。这意味着，当我们减小 \(h\)（区间长度）时，我们的误差将呈二次方减少。使用大O的定义，我们知道 \(\text{误差} = C \cdot h^2\)，其中
    \(C\) 是某个常数。
- en: 'In some cases, we may not know the exponent in \(E(h) = \mathcal{O}(h^n)\).
    We can estimate it using by computing the error at two different values of \(h\).
    Suppose we have two quantities, \(h_1 = 0.5\) and \(h_2 = 0.25\). We compute the
    corresponding errors as \(E(h_1) = 0.125\) and \(E(h_2) = 0.015625\). Then, since
    \(E(h) = \mathcal{O}(h^n)\), we have:'
  id: totrans-95
  prefs: []
  type: TYPE_NORMAL
  zh: 在某些情况下，我们可能不知道 \(E(h) = \mathcal{O}(h^n)\) 中的指数。我们可以通过计算 \(h\) 的两个不同值处的误差来估计它。假设我们有两个量，\(h_1
    = 0.5\) 和 \(h_2 = 0.25\)。我们计算相应的误差为 \(E(h_1) = 0.125\) 和 \(E(h_2) = 0.015625\)。然后，由于
    \(E(h) = \mathcal{O}(h^n)\)，我们有：
- en: \[\begin{eqnarray}\frac{0.125}{0.015625} &=\frac{E(h_1)}{E(h_2)} \\ &\approx\frac{Ch_1^n}{Ch_2^n}\\
    &=\left(\frac{h_1}{h_2}\right)^n\\ \end{eqnarray}\] \[\begin{eqnarray} \implies\log\left(\frac{0.125}{0.015625}\right)=
    n\log\left(\frac{h_1}{h_2}\right) =n\log\left(\frac{0.5}{0.25}\right) \end{eqnarray}\]
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{eqnarray}\frac{0.125}{0.015625} &=\frac{E(h_1)}{E(h_2)} \\ &\approx\frac{Ch_1^n}{Ch_2^n}\\
    &=\left(\frac{h_1}{h_2}\right)^n\\ \end{eqnarray}\] \[\begin{eqnarray} \implies\log\left(\frac{0.125}{0.015625}\right)=
    n\log\left(\frac{h_1}{h_2}\right) =n\log\left(\frac{0.5}{0.25}\right) \end{eqnarray}\]
- en: Solving this equation for \(n\), we obtain \(n = 3\).
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
  zh: 解这个方程得到 \(n = 3\)。
- en: Big-O Example - Role of Constants
  id: totrans-98
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 大O记号示例 - 常数的作用
- en: It is important that one does not place too much importance on the constant
    \(M\) in the definition of Big-O notation; it is essentially arbitrary.
  id: totrans-99
  prefs: []
  type: TYPE_NORMAL
  zh: 在大O记号定义中，对常数 \(M\) 的过分重视是不重要的；它本质上是不确定的。
- en: Suppose \(f_1(n) = 10^{-20}n^2\) and \(f_2(n) = 10^{20}n^2\). While \(f_2\)
    is much larger than \(f_1\) for all values of \(n\), **both** are \(\mathcal{O}(n^2)\);
    this is obvious if we choose any constants \(M_1 \geq 10^{-20}\) and \(M_2 \geq
    10^{20}\).
  id: totrans-100
  prefs: []
  type: TYPE_NORMAL
  zh: 假设 \(f_1(n) = 10^{-20}n^2\) 和 \(f_2(n) = 10^{20}n^2\)。虽然对于所有 \(n\) 的值，\(f_2\)
    都比 \(f_1\) 大得多，**但是**它们都是 \(\mathcal{O}(n^2)\)；如果我们选择任何 \(M_1 \geq 10^{-20}\)
    和 \(M_2 \geq 10^{20}\) 的常数，这是显而易见的。
- en: However, it is also true that \(f_2(n) = \mathcal{O}(10^{-20}n^2)\) for any
    constant \(M \geq 10^{40}\)
  id: totrans-101
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，对于任何 \(M \geq 10^{40}\) 的常数，\(f_2(n) = \mathcal{O}(10^{-20}n^2)\) 也是正确的。
- en: \[\begin{eqnarray} f_2(n) = 10^{20}n^2 = 10^{40} \times 10^{-20}n^2 \leq M\times
    10^{-20}n^2\. \end{eqnarray}\]
  id: totrans-102
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{eqnarray} f_2(n) = 10^{20}n^2 = 10^{40} \times 10^{-20}n^2 \leq M\times
    10^{-20}n^2\. \end{eqnarray}\]
- en: So including a constant inside the \(\mathcal{O}\) is basically meaningless.
  id: totrans-103
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，在 \(\mathcal{O}\) 内包含一个常数基本上是没有意义的。
- en: '**Question:** What is the function \(g(n)\) that gives the tightest bound on
    \(f_2(n) = \mathcal{O}(g(n))\)?'
  id: totrans-104
  prefs: []
  type: TYPE_NORMAL
  zh: '**问题：** 给出 \(f_2(n) = \mathcal{O}(g(n))\) 的最紧界函数 \(g(n)\) 是什么？'
- en: '**Solution:** the answer is \(g(n) = n^2\). For any \(r < 2\), there is **no**
    constant \(M\) such that \(|f_2(n)| \leq Mn^r\) for all \(n\) sufficiently large.
    So \(n^r\) for \(r < 2\) is not a bound on \(f_2\). For any \(q > 2\), there exist
    a pair of constants \(M_1\) and \(M_2\) such that for all \(n\) sufficiently large:'
  id: totrans-105
  prefs: []
  type: TYPE_NORMAL
  zh: '**解答：**答案是 \(g(n) = n^2\)。对于任何 \(r < 2\)，不存在常数 \(M\) 使得对于所有足够大的 \(n\)，\(|f_2(n)|
    \leq Mn^r\)。因此，对于 \(r < 2\)，\(n^r\) 不是 \(f_2\) 的上界。对于任何 \(q > 2\)，存在一对常数 \(M_1\)
    和 \(M_2\)，使得对于所有足够大的 \(n\)：'
- en: \[\begin{align*} f_2(n) \leq M_1 n^2\leq M_2 n^q. \end{align*}\]
  id: totrans-106
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{align*} f_2(n) \leq M_1 n^2\leq M_2 n^q. \end{align*}\]
- en: 'However, we **cannot** find a pair of constants \(M_3\) and \(M_4\) such that:'
  id: totrans-107
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，我们**不能**找到一对常数 \(M_3\) 和 \(M_4\)，使得：
- en: \[\begin{align*} f_2(n) \leq M_3 n^q\leq M_4 n^2\. \end{align*}\]
  id: totrans-108
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{align*} f_2(n) \leq M_3 n^q\leq M_4 n^2\. \end{align*}\]
- en: Thus, we cannot "fit" another function in between \(f_2(n)\) and \(n^2\), so
    \(n^2\) is the tightest bound.
  id: totrans-109
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，我们无法在 \(f_2(n)\) 和 \(n^2\) 之间“拟合”另一个函数，所以 \(n^2\) 是最紧的上界。
- en: One may be tempted to think the correct answer should actually be \(g(n) = 10^{20}n^2\);
    however, this does not actually provide any additional information about the growth
    of \(f_2\). Notice that we didn't specify what \(M_1\) and \(M_2\) were in the
    inequality above. Big-O notation says **nothing** about the size of the constant.
    The statements
  id: totrans-110
  prefs: []
  type: TYPE_NORMAL
  zh: 人们可能会想，正确的答案实际上应该是 \(g(n) = 10^{20}n^2\)；然而，这实际上并没有提供关于 \(f_2\) 增长的任何额外信息。注意，我们没有在上面的不等式中指定
    \(M_1\) 和 \(M_2\) 是什么。大 \(O\) 符号说**什么**关于常数的规模。以下陈述
- en: \[\begin{align*} f_2(n) &= \mathcal{O}(n^2),\\ f_2(n) &= \mathcal{O}(10^{20}n^2),\\
    f_2(n) &= \mathcal{O}(10^{-20}n^2), \end{align*}\]
  id: totrans-111
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{align*} f_2(n) &= \mathcal{O}(n^2),\\ f_2(n) &= \mathcal{O}(10^{20}n^2),\\
    f_2(n) &= \mathcal{O}(10^{-20}n^2), \end{align*}\]
- en: are all equivalent, in that they all give the same amount of information on
    the growth of \(f_2\), since the constants are not specified. Since \(10^{-20}\)
    is very small, it may be tempting to conclude that it is "tighter" than the other
    two, which is not true. Therefore, it is always best practice to avoid placing
    unnecessary constants inside the \(\mathcal{O}\), and we expect you do refrain
    from doing so in this course.
  id: totrans-112
  prefs: []
  type: TYPE_NORMAL
  zh: 都等价，因为它们都提供了关于 \(f_2\) 增长的相同信息，因为常数没有指定。由于 \(10^{-20}\) 非常小，可能会诱使人们得出结论，它比其他两个更“紧”，但这并不正确。因此，始终最好避免在
    \(\mathcal{O}\) 内放置不必要的常数，并且我们期望你在本课程中避免这样做。
- en: Convergence Definitions
  id: totrans-113
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 收敛定义
- en: Algebraic growth/convergence is when the coefficients \(a_n\) in the sequence
    we are interested in behave like \(\mathcal{O}(n^{\alpha})\) for growth and \(\mathcal{O}(1/n^{\alpha})\)
    for convergence, where \(\alpha\) is called the algebraic index of convergence.
    A sequence that grows or converges algebraically is a straight line in a log-log
    plot.
  id: totrans-114
  prefs: []
  type: TYPE_NORMAL
  zh: 代数增长/收敛是指我们感兴趣的序列中的系数 \(a_n\) 在增长时表现为 \(\mathcal{O}(n^{\alpha})\)，在收敛时表现为 \(\mathcal{O}(1/n^{\alpha})\)，其中
    \(\alpha\) 被称为收敛的代数指数。一个代数增长或收敛的序列在双对数图中是一条直线。
- en: Exponential growth/convergence is when the coefficients \(a_n\) of the sequence
    we are interested in behave like \(\mathcal{O}(e^{qn^{\beta}})\) for growth and
    \(\mathcal{O}(e^{-qn^{\beta}})\) for convergence, where \(q\) is a constant for
    some \(\beta > 0\). Exponential growth is much faster than algebraic growth. Exponential
    growth/convergence is also sometimes called spectral growth/convergence. A sequence
    that grows exponentially is a straight line in a log-linear plot. Exponential
    convergence is often further classified as supergeometric, geometric, or subgeometric
    convergence.
  id: totrans-115
  prefs: []
  type: TYPE_NORMAL
  zh: 指数增长/收敛是指我们感兴趣的序列的系数 \(a_n\) 在增长时表现为 \(\mathcal{O}(e^{qn^{\beta}})\)，在收敛时表现为
    \(\mathcal{O}(e^{-qn^{\beta}})\)，其中 \(q\) 是某个 \(\beta > 0\) 的常数。指数增长比代数增长快得多。指数增长/收敛有时也称为谱增长/收敛。在双对数图中，指数增长的序列是一条直线。指数收敛通常进一步分为超几何收敛、几何收敛或亚几何收敛。
- en: '![Convergence](../Images/47d4c952b7f32414f8c14d57cbc2f4cd.png)![Convergence](../Images/a760929254e4532ccc6f0329b0554edd.png)![Convergence](../Images/4810817e8d441e656c27d55d03009854.png)'
  id: totrans-116
  prefs: []
  type: TYPE_IMG
  zh: '![收敛](../Images/47d4c952b7f32414f8c14d57cbc2f4cd.png)![收敛](../Images/a760929254e4532ccc6f0329b0554edd.png)![收敛](../Images/4810817e8d441e656c27d55d03009854.png)'
- en: Figures from J. P. Boyd, *Chebyshev and Fourier Spectral Methods*, 2nd ed.,
    Dover, New York, 2001.
  id: totrans-117
  prefs: []
  type: TYPE_NORMAL
  zh: 来自 J. P. Boyd 的资料，*Chebyshev 和 Fourier 波谱方法*，第 2 版，Dover，纽约，2001 年。
- en: Review Questions
  id: totrans-118
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 复习问题
- en: What is the formula for relative error?
  id: totrans-119
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 相对误差的公式是什么？
- en: What is the formula for absolute error?
  id: totrans-120
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 绝对误差的公式是什么？
- en: Which is usually the better way to calculate error?
  id: totrans-121
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 通常哪种方法计算误差更好？
- en: If you have \(k\) accurate significant digits, what is the tightest bound on
    your relative error?
  id: totrans-122
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 如果你有一个 \(k\) 个有效数字是准确的，你的相对误差的最紧界限是什么？
- en: Given a maximum relative error, what is the largest (or smallest) value you
    could have?
  id: totrans-123
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 给定一个最大相对误差，你能有的最大（或最小）值是多少？
- en: How do you compute relative and absolute error for vectors?
  id: totrans-124
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 你如何计算向量的相对误差和绝对误差？
- en: What is truncation error?
  id: totrans-125
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 什么是截断误差？
- en: What is rounding error?
  id: totrans-126
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 什么是舍入误差？
- en: What does it mean for an algorithm to take \(O(n^3)\) time?
  id: totrans-127
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 一个算法需要 \(O(n^3)\) 的时间意味着什么？
- en: Can you give an example of an operation that takes \(O(n^2)\) time?
  id: totrans-128
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 你能给出一个操作需要 \(O(n^2)\) 时间的例子吗？
- en: What does it mean for error to follow \(O(h^4)\)?
  id: totrans-129
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 误差遵循 \(O(h^4)\) 意味着什么？
- en: Can you simplify \(O(h^5 + h^2 + h)\)? What assumption do you need to make?
  id: totrans-130
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 你能简化 \(O(h^5 + h^2 + h)\) 吗？你需要做出什么假设？
- en: If you know an operation is \(O(n^4)\), can you predict its time/error on unseen
    inputs from inputs that you already have?
  id: totrans-131
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 如果你已知一个操作是 \(O(n^4)\)，你能根据已有的输入预测其在未见过的输入上的时间/误差吗？
- en: If you are given runtime or error data for an operation, can you find the best
    \(x\) such that the operation is \(O(n^x)\)?
  id: totrans-132
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 如果你被给出了一个操作的运行时间或误差数据，你能找到最佳的 \(x\) 使得该操作是 \(O(n^x)\) 吗？
- en: What is algebraic growth/convergence?
  id: totrans-133
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 什么是代数增长/收敛？
- en: What is exponential growth/convergence?
  id: totrans-134
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 什么是指数增长/收敛？
