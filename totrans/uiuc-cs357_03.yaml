- en: Errors and Complexity
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://cs357.cs.illinois.edu/textbook/notes/error.html](https://cs357.cs.illinois.edu/textbook/notes/error.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '<details><summary style="font-size: 1.1em;">View Slides</summary>'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
- en: If you cannot see the PDF here, click [here](/textbook/assets/slides/03-Errors.pdf)
    to download the PDF.</details>
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
- en: Learning objectives
  id: totrans-4
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Compare and contrast relative and absolute error
  id: totrans-5
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Categorize a cost as \(\mathcal{O}(n^p)\)
  id: totrans-6
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Categorize an error \(\mathcal{O}(h^p)\)
  id: totrans-7
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Identify algebraic vs exponential growth and convergence
  id: totrans-8
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Big Picture
  id: totrans-9
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Numerical algorithms are distinguished by their ***cost*** and ***error***,
    and the tradeoff between them.
  id: totrans-10
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: The algorithms or methods introduced in this course indicate their error and
    cost whenever possible. These might be exact expressions or asymptotic bounds
    like \(\mathcal{O}(h^2)\) as \(h \to 0\) or \(\mathcal{O}(n^3)\) as \(n \to \infty\).
    For asymptotics we always indicate the limit.
  id: totrans-11
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Scientific Notation
  id: totrans-12
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Using scientific notation, a number can be expressed in the form
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
- en: \[x = \pm r \times 10^{m}\]
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
- en: where \(r\) is a coefficient in the range \(1 \leq r < 10 \) and \(m\) is the
    exponent.
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
- en: '**Examples:** Let us convert these numbers into scientific notation:'
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{equation} -165.73 = -1.6573 \times 10^{2} \end{equation}\] \[\begin{equation}
    0.00432 = 4.32 \times 10^{-3} \end{equation}\]
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
- en: Absolute and Relative Error
  id: totrans-18
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'Results computed using numerical methods are inaccurate – they are approximations
    to the true values. We can represent an approximate result as a combination of
    the true value and some error:'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{eqnarray} \text{Approximate Result} = \text{True Value} + \text{Error}
    \end{eqnarray}\] \[\hat{x} = x + \Delta x\]
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
- en: 'Given this problem setup we can define the absolute error as:'
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{equation} \text{Absolute Error} = |x - \hat{x}| \end{equation} .\]
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
- en: This tells us how close our approximate result is to the actual answer. However,
    absolute error can become an unsatisfactory and misleading representation of the
    error depending on the magnitude of \(x\).
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
- en: '| Case 1 | Case 2 |'
  id: totrans-24
  prefs: []
  type: TYPE_TB
- en: '| --- | --- |'
  id: totrans-25
  prefs: []
  type: TYPE_TB
- en: '| \(x = 0.1\), \(\hat{x} = 0.2\) | \(x = 100.0\), \(\hat{x} = 100.1\) |'
  id: totrans-26
  prefs: []
  type: TYPE_TB
- en: '| \(\mid x - \hat{x} \mid = 0.1\) | \(\mid x - \hat{x} \mid = 0.1\) |'
  id: totrans-27
  prefs: []
  type: TYPE_TB
- en: In both of these cases, the absolute error is the same, 0.1\. However, we would
    intuitively consider case 2 more accurate than case 1 since our approximation
    is double the true value in case 1\. Because of this, we define the relative error,
    which will be an error estimate independent of the magnitude. To obtain this we
    simply divide the absolute error by the absolute value of the true value.
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{equation} \text{Relative Error} = \frac{|x - \hat{x}|}{|x|} \end{equation}\]
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
- en: If we consider the two cases again, we can see that the relative error will
    be much lower in the second case, since relative error is independent of magnitude.
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
- en: '| Case 1 | Case 2 |'
  id: totrans-31
  prefs: []
  type: TYPE_TB
- en: '| --- | --- |'
  id: totrans-32
  prefs: []
  type: TYPE_TB
- en: '| \(x = 0.1\), \(\hat{x} = 0.2\) | \(x = 100.0\), \(\hat{x} = 100.1\) |'
  id: totrans-33
  prefs: []
  type: TYPE_TB
- en: '| \(\frac{\mid x - \hat{x} \mid}{\mid x \mid} = 1\) | \(\frac{\mid x - \hat{x}
    \mid}{\mid x \mid} = 10^{-3}\) |'
  id: totrans-34
  prefs: []
  type: TYPE_TB
- en: Absolute and Relative Error of Vectors
  id: totrans-35
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: If our calculated quantities are vectors, then instead of using the absolute
    value function, we can use the norm instead. Thus, our formulas become
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{equation} \text{Absolute Error} = \|\mathbf{x} - \mathbf{\hat{x}}\|
    \end{equation}\] \[\begin{equation} \text{Relative Error} = \frac{\|\mathbf{x}
    - \mathbf{\hat{x}}\|}{\|\mathbf{x}\|} \end{equation}\]
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
- en: We take the norm of the difference (and not the difference of the norms), because
    we are interested in how far apart these two quantities are. This way, we are
    calculating the difference vector, and then using the vector norm to find the
    length of that difference vector.
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
- en: Significant Digits/Figures
  id: totrans-39
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '**Significant figures** of a number are digits that carry meaningful information.
    They are digits beginning from the leftmost nonzero digit and ending with the
    rightmost "correct" digit, including final zeros that are exact. For example:'
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
- en: The number 3.14159 has six significant digits.
  id: totrans-41
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: The number 0.00035 has two significant digits.
  id: totrans-42
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: The number 0.000350 has three significant digits.
  id: totrans-43
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Significant Figures of an Approximation
  id: totrans-44
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: An approximate result \(\hat{x}\) has \(n\) **significant figures** of a true
    value \(x\) if the absolute error, \(\vert x - \hat{x}\vert\), has zeros in the
    first \(n\) decimal places counting from the leftmost nonzero (leading) digit
    of \(x\), followed by a digit from 0 to 4.
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
- en: '**Example:** Assume \(x = 3.141592653\) and suppose \(\hat{x}\) is the approximate
    result:'
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
- en: \[\hat{x} = 3.14159 \longrightarrow |x - \hat{x}| = 0.00000\mathbf{2}653 = 2.653
    \times 10^{-6} \longrightarrow \hat{x} \text{ has 6 significant figures.}\] \[\hat{x}
    = 3.1415 \longrightarrow |x - \hat{x}| = 0.0000\mathbf{9}2653 = 0.92653 \times
    10^{-4} \longrightarrow \hat{x} \text{ has 4 significant figures.}\]
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
- en: In other words, the number of significant figures tells us about how many positions
    of \(x\) and \(\hat{x}\) agree.
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
- en: 'Therefore, we can observe that the absolute error is bounded by:'
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
- en: \[|x - \hat{x}| \leq 5 \times 10^{-n}\]
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
- en: 'To find the bound on the relative error, let us define \(x\) and \(\hat{x}\)
    as:'
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{equation} x = q \times 10^p \end{equation}\] \[\begin{equation} \hat{x}
    = \hat{q} \times 10^p \end{equation}\]
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
- en: 'The absolute error can be stated as:'
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
- en: \[|x - \hat{x}| = |q - \hat{q}| \times 10^p\]
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
- en: 'Because of scientific notation we know that \(1 \leq q < 10\), so:'
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
- en: \[\text{Relative Error} = \frac{|x - \hat{x}|}{|x|} = \frac{|q - \hat{q}| \times
    10^p}{|q| \times 10^p} \leq \frac{5 \times 10^{-n}}{|q|} \leq 5 \times 10^{-n}\]
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
- en: 'In general, we will use the rule-of-thumb for calculating an upper bound of
    the relative error: if an approximation has \(n\) accurate significant digits,
    then the relative error is'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
- en: \[\frac{|x - \hat{x}|}{|x|} \leq 10^{-n+1}\]
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
- en: Truncation Error vs. Rounding Error
  id: totrans-59
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '**Rounding error** is the error that occurs from rounding values in a computation.
    This occurs constantly since computers use finite precision and have a limit on
    the memory available for storing one numerical value. Approximating \(\frac{1}{3}
    = 0.33333\dots\) with a finite decimal expansion is an example of rounding error.'
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
- en: '**Truncation error** is the error from using an approximate algorithm in place
    of an exact mathematical procedure or function. For example, in the case of evaluating
    functions, we may represent our function by a finite Taylor series up to degree
    \(n\). The truncation error is the error that is incurred by not using the \(n+1\)
    term and above.'
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
- en: Big-O Notation
  id: totrans-62
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'Big-O notation is used to understand and describe asymptotic behavior. The
    definition in the cases of approching 0 or \(\infty\) are as follows:'
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
- en: Let \(f\) and \(g\) be two functions. Then \(f(x) = \mathcal{O}(g(x))\) as \(x
    \rightarrow \infty\) if and only if there exists a value \(M\) and some \(x_0\)
    such that \(|f(x)| \leq M|g(x)|\) \(\forall x\) where \(x\geq x_0\)
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
- en: Let \(f\) and \(g\) be two functions. Then \(f(h) = \mathcal{O}(g(h))\) as \(h
    \rightarrow 0\) if and only if there exists a value \(M\) and some \(h_0\) such
    that \(|f(h)| \leq M|g(h)|\) \(\forall h\) where \(0 < h < h_0\)
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
- en: 'But what if we want to consider the function approaching an arbitrary value?
    Then we can redefine the expression as:'
  id: totrans-66
  prefs: []
  type: TYPE_NORMAL
- en: Let \(f\) and \(g\) be two functions. Then \(f(x) = \mathcal{O}(g(x))\) as \(x
    \rightarrow a\) if and only if there exists a value \(M\) and some \(\delta\)
    such that \(|f(x)| \leq M|g(x)|\) \(\forall x\) where \(0 < |x − a| < \delta\)
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
- en: Big-O Analysis
  id: totrans-68
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Since Big-O notation is used to understand asymptotic behavior, we are interested
    in faster-growing terms that define the limiting behavior of the function.
  id: totrans-69
  prefs: []
  type: TYPE_NORMAL
- en: For example, consider the function \(f(x) = 2x^2 + 27x + 1000\)
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
- en: When \(x \rightarrow \infty\), the term \(x^2\) is the fastest-growing, so it
    is the most significant, and hence \(f(x) = O(x^2)\).
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
- en: 'The hierarchy of fastest to slowest growing common terms, where \(c\) is a
    constant is:'
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
- en: \[\mathcal{O}(n!) > \mathcal{O}(c^n) > \mathcal{O}(n^c) > \mathcal{O}(n^2) >
    \mathcal{O}(n log(n)) > \mathcal{O}(n) > \mathcal{O}(log(n)) > \mathcal{O}(c)\]
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
- en: Big-O Examples - Time Complexity
  id: totrans-74
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: We can use Big-O to describe the time complexity of our algorithms.
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
- en: Consider the case of matrix-matrix multiplication. If the size of each of our
    matrices is \(n \times n\), to multiply the matrices, we have to compute the inner
    product at each entry, which requires \(n\) multiplications and \(n\) summations.
    In an \(n \times n\) matrix, there are \(n^2\) entries, meaning that there are
    \(n^2 (2n) = 2n^3\) operations, so the time taken to multiply the matrices is
    proportional to \(2n^3\).
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
- en: However, when trying to understand time complexity, we care about the asymptotic
    growth rate of our algorithm based on input size, so we can say the time it will
    take to multiply the matrices is \(\mathcal{O}(n^3)\) meaning that \(\text{Run
    time} \approx C \cdot n^3\).
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
- en: Suppose we know that for \(n_1=1000\), the matrix-matrix multiplication takes
    5 seconds. Estimate how much time it would take if we double the size of our matrices
    to \(2n \times 2n\).
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
- en: 'We know that:'
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{align*} \text{Time}(2n_1) &\approx C \cdot (2n_1)^3 \\ &= C \cdot 2^3
    \cdot n_1^3\\ &= 8 \cdot (C \cdot n_1^3) \\ &= 8 \cdot \text{Time}(n_1) \\ &=
    40 \text{ seconds} \end{align*}\]
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
- en: So, when we double the size of our our matrices to \(2n \times 2n\), the time
    becomes \((2n)^3 = 8n^3\). Thus, the runtime will be roughly 8 times as long.
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
- en: Big-O Examples - Truncation Errors
  id: totrans-82
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: We can also use Big-O notation to describe the truncation error. A numerical
    method is called \(n\)-th order accurate if its truncation error \(E(h)\) obeys
    \(E(h) = \mathcal{O}(h^n)\).
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
- en: Example 1
  id: totrans-84
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: 'The sine function can be expressed as an infinite series:'
  id: totrans-85
  prefs: []
  type: TYPE_NORMAL
- en: \[f(h) = sin(h) = h - \frac{h^3}{6} + \frac{h^5}{120} - \frac{h^7}{5040} + \dots\]
  id: totrans-86
  prefs: []
  type: TYPE_NORMAL
- en: 'Suppose we take an approximation:'
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
- en: \[\hat{f(h)} = h\]
  id: totrans-88
  prefs: []
  type: TYPE_NORMAL
- en: 'We can define the truncation error as:'
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
- en: \[E = |f(h) - \hat{f(h)} | = | - \frac{h^3}{6} + \frac{h^5}{120} - \frac{h^7}{5040}
    + \dots|\]
  id: totrans-90
  prefs: []
  type: TYPE_NORMAL
- en: 'Instead, using the Big-O notation, we define the truncation error as:'
  id: totrans-91
  prefs: []
  type: TYPE_NORMAL
- en: \[E = \mathcal{O}(h^3)\]
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
- en: Example 2
  id: totrans-93
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: Consider solving an interpolation problem. We have an interval of length \(h\)
    where our interpolant is valid and we know that our approximation is order \(\mathcal{O}(h^2)\).
    What this means is that as we decrease \(h\) (the interval length), our error
    will decrease quadratically. Using the definition of Big-O, we know that \(\text{Error}
    = C \cdot h^2\) where \(C\) is some constant.
  id: totrans-94
  prefs: []
  type: TYPE_NORMAL
- en: 'In some cases, we may not know the exponent in \(E(h) = \mathcal{O}(h^n)\).
    We can estimate it using by computing the error at two different values of \(h\).
    Suppose we have two quantities, \(h_1 = 0.5\) and \(h_2 = 0.25\). We compute the
    corresponding errors as \(E(h_1) = 0.125\) and \(E(h_2) = 0.015625\). Then, since
    \(E(h) = \mathcal{O}(h^n)\), we have:'
  id: totrans-95
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{eqnarray}\frac{0.125}{0.015625} &=\frac{E(h_1)}{E(h_2)} \\ &\approx\frac{Ch_1^n}{Ch_2^n}\\
    &=\left(\frac{h_1}{h_2}\right)^n\\ \end{eqnarray}\] \[\begin{eqnarray} \implies\log\left(\frac{0.125}{0.015625}\right)=
    n\log\left(\frac{h_1}{h_2}\right) =n\log\left(\frac{0.5}{0.25}\right) \end{eqnarray}\]
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
- en: Solving this equation for \(n\), we obtain \(n = 3\).
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
- en: Big-O Example - Role of Constants
  id: totrans-98
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: It is important that one does not place too much importance on the constant
    \(M\) in the definition of Big-O notation; it is essentially arbitrary.
  id: totrans-99
  prefs: []
  type: TYPE_NORMAL
- en: Suppose \(f_1(n) = 10^{-20}n^2\) and \(f_2(n) = 10^{20}n^2\). While \(f_2\)
    is much larger than \(f_1\) for all values of \(n\), **both** are \(\mathcal{O}(n^2)\);
    this is obvious if we choose any constants \(M_1 \geq 10^{-20}\) and \(M_2 \geq
    10^{20}\).
  id: totrans-100
  prefs: []
  type: TYPE_NORMAL
- en: However, it is also true that \(f_2(n) = \mathcal{O}(10^{-20}n^2)\) for any
    constant \(M \geq 10^{40}\)
  id: totrans-101
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{eqnarray} f_2(n) = 10^{20}n^2 = 10^{40} \times 10^{-20}n^2 \leq M\times
    10^{-20}n^2\. \end{eqnarray}\]
  id: totrans-102
  prefs: []
  type: TYPE_NORMAL
- en: So including a constant inside the \(\mathcal{O}\) is basically meaningless.
  id: totrans-103
  prefs: []
  type: TYPE_NORMAL
- en: '**Question:** What is the function \(g(n)\) that gives the tightest bound on
    \(f_2(n) = \mathcal{O}(g(n))\)?'
  id: totrans-104
  prefs: []
  type: TYPE_NORMAL
- en: '**Solution:** the answer is \(g(n) = n^2\). For any \(r < 2\), there is **no**
    constant \(M\) such that \(|f_2(n)| \leq Mn^r\) for all \(n\) sufficiently large.
    So \(n^r\) for \(r < 2\) is not a bound on \(f_2\). For any \(q > 2\), there exist
    a pair of constants \(M_1\) and \(M_2\) such that for all \(n\) sufficiently large:'
  id: totrans-105
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{align*} f_2(n) \leq M_1 n^2\leq M_2 n^q. \end{align*}\]
  id: totrans-106
  prefs: []
  type: TYPE_NORMAL
- en: 'However, we **cannot** find a pair of constants \(M_3\) and \(M_4\) such that:'
  id: totrans-107
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{align*} f_2(n) \leq M_3 n^q\leq M_4 n^2\. \end{align*}\]
  id: totrans-108
  prefs: []
  type: TYPE_NORMAL
- en: Thus, we cannot "fit" another function in between \(f_2(n)\) and \(n^2\), so
    \(n^2\) is the tightest bound.
  id: totrans-109
  prefs: []
  type: TYPE_NORMAL
- en: One may be tempted to think the correct answer should actually be \(g(n) = 10^{20}n^2\);
    however, this does not actually provide any additional information about the growth
    of \(f_2\). Notice that we didn't specify what \(M_1\) and \(M_2\) were in the
    inequality above. Big-O notation says **nothing** about the size of the constant.
    The statements
  id: totrans-110
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{align*} f_2(n) &= \mathcal{O}(n^2),\\ f_2(n) &= \mathcal{O}(10^{20}n^2),\\
    f_2(n) &= \mathcal{O}(10^{-20}n^2), \end{align*}\]
  id: totrans-111
  prefs: []
  type: TYPE_NORMAL
- en: are all equivalent, in that they all give the same amount of information on
    the growth of \(f_2\), since the constants are not specified. Since \(10^{-20}\)
    is very small, it may be tempting to conclude that it is "tighter" than the other
    two, which is not true. Therefore, it is always best practice to avoid placing
    unnecessary constants inside the \(\mathcal{O}\), and we expect you do refrain
    from doing so in this course.
  id: totrans-112
  prefs: []
  type: TYPE_NORMAL
- en: Convergence Definitions
  id: totrans-113
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Algebraic growth/convergence is when the coefficients \(a_n\) in the sequence
    we are interested in behave like \(\mathcal{O}(n^{\alpha})\) for growth and \(\mathcal{O}(1/n^{\alpha})\)
    for convergence, where \(\alpha\) is called the algebraic index of convergence.
    A sequence that grows or converges algebraically is a straight line in a log-log
    plot.
  id: totrans-114
  prefs: []
  type: TYPE_NORMAL
- en: Exponential growth/convergence is when the coefficients \(a_n\) of the sequence
    we are interested in behave like \(\mathcal{O}(e^{qn^{\beta}})\) for growth and
    \(\mathcal{O}(e^{-qn^{\beta}})\) for convergence, where \(q\) is a constant for
    some \(\beta > 0\). Exponential growth is much faster than algebraic growth. Exponential
    growth/convergence is also sometimes called spectral growth/convergence. A sequence
    that grows exponentially is a straight line in a log-linear plot. Exponential
    convergence is often further classified as supergeometric, geometric, or subgeometric
    convergence.
  id: totrans-115
  prefs: []
  type: TYPE_NORMAL
