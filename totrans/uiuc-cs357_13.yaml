- en: Given an undirected or directed graph (weighted or unweighted), determine the
    adjacency matrix for the graph.
  id: totrans-73
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 给定一个无向或有向图（加权或无权），确定图的邻接矩阵。
- en: What is a transition matrix? Given a graph representing the transitions or a
    description of the problem, determine the transition matrix.
  id: totrans-74
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 什么是转移矩阵？给定表示转换或问题描述的图，确定转移矩阵。
