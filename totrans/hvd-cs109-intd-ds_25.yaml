- en: Chapter 15 Statistical inference
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 第15章 统计推断
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook/inference.html](https://rafalab.dfci.harvard.edu/dsbook/inference.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook/inference.html](https://rafalab.dfci.harvard.edu/dsbook/inference.html)
- en: In Chapter [16](models.html#models) we will describe, in some detail, how poll
    aggregators such as FiveThirtyEight use data to predict election outcomes. To
    understand how they do this, we first need to learn the basics of *Statistical
    Inference*, the part of statistics that helps distinguish patterns arising from
    signal from those arising from chance. Statistical inference is a broad topic
    and here we go over the very basics using polls as a motivating example. To describe
    the concepts, we complement the mathematical formulas with Monte Carlo simulations
    and R code.
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 在第[16](models.html#models)章中，我们将详细描述像FiveThirtyEight这样的民意调查聚合器如何使用数据来预测选举结果。为了理解他们是如何做到这一点的，我们首先需要学习统计推断的基础知识，这是统计学中帮助区分由信号产生的模式与由偶然产生的模式的部分。统计推断是一个广泛的话题，在这里我们使用民意调查作为一个激励性的例子。为了描述这些概念，我们用蒙特卡洛模拟和R代码补充数学公式。
- en: 15.1 Polls
  id: totrans-3
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 15.1 民意调查
- en: Opinion polling has been conducted since the 19th century. The general goal
    is to describe the opinions held by a specific population on a given set of topics.
    In recent times, these polls have been pervasive during presidential elections.
    Polls are useful when interviewing every member of a particular population is
    logistically impossible. The general strategy is to interview a smaller group,
    chosen at random, and then infer the opinions of the entire population from the
    opinions of the smaller group. Statistical theory is used to justify the process.
    This theory is referred to as *inference* and it is the main topic of this chapter.
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 民意调查自19世纪以来就已经进行。一般目标是描述特定人口在特定主题上持有的观点。近年来，这些调查在总统选举中无处不在。当采访特定人群的每个成员在物流上不可能时，民意调查是有用的。一般策略是随机采访一个较小的群体，然后从较小群体的观点中推断整个群体的观点。统计理论被用来证明这一过程。这一理论被称为*推断*，它是本章的主要内容。
- en: Perhaps the best known opinion polls are those conducted to determine which
    candidate is preferred by voters in a given election. Political strategists make
    extensive use of polls to decide, among other things, how to invest resources.
    For example, they may want to know in which geographical locations to focus their
    “get out the vote” efforts.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 可能最著名的民意调查是那些用于确定在特定选举中选民更倾向于哪位候选人的调查。政治策略家广泛使用民意调查来决定如何投资资源。例如，他们可能想知道在哪些地理区域集中他们的“动员投票”努力。
- en: Elections are a particularly interesting case of opinion polls because the actual
    opinion of the entire population is revealed on election day. Of course, it costs
    millions of dollars to run an actual election which makes polling a cost effective
    strategy for those that want to forecast the results.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 选举是民意调查的一个特别有趣的案例，因为选举当天会揭示整个民众的实际观点。当然，举办实际选举需要花费数百万美元，这使得民意调查成为那些想要预测结果的人的一种成本效益策略。
- en: Although typically the results of these polls are kept private, similar polls
    are conducted by news organizations because results tend to be of interest to
    the general public and made public. We will eventually be looking at such data.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 尽管通常这些调查的结果是保密的，但新闻机构也会进行类似的调查，因为结果往往对公众感兴趣，并公之于众。我们最终将查看此类数据。
- en: 'Real Clear Politics[^(51)](#fn51) is an example of a news aggregator that organizes
    and publishes poll results. For example, they present the following poll results
    reporting estimates of the popular vote for the 2016 presidential election[^(52)](#fn52):'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: Real Clear Politics[^(51)](#fn51) 是一个新闻聚合器，它组织和发布民意调查结果。例如，他们展示了以下民意调查结果，报告了2016年总统选举的民调估计[^(52)](#fn52)：
