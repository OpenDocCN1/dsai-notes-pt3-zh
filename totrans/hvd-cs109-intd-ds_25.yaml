- en: Although in the United States the popular vote does not determine the result
    of the presidential election, we will use it as an illustrative and simple example
    of how well polls work. Forecasting the election is a more complex process since
    it involves combining results from 50 states and DC and we describe it in Section
    [16.8](models.html#election-forecasting).
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: 尽管在美国，普选票并不决定总统选举的结果，但我们将用它作为一个说明性的、简单的例子，来说明调查的效果。预测选举是一个更复杂的过程，因为它涉及到结合50个州和哥伦比亚特区的结果，我们将在第[16.8](models.html#election-forecasting)节中描述它。
- en: 'Let’s make some observations about the table above. First, note that different
    polls, all taken days before the election, report a different *spread*: the estimated
    difference between support for the two candidates. Notice also that the reported
    spreads hover around what ended up being the actual result: Clinton won the popular
    vote by 2.1%. We also see a column titled **MoE** which stands for *margin of
    error*.'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们对上表进行一些观察。首先，请注意，尽管这些调查都是在选举前几天进行的，但不同的调查报告了不同的*差距*：即两位候选人支持率的估计差异。同时，请注意，报告的差距围绕着最终的实际结果：克林顿以2.1%的得票率赢得了普选票。我们还可以看到一个标题为**MoE**的列，它代表*误差范围*。
- en: 'In this section, we will show how the probability concepts we learned in the
    previous chapter can be applied to develop the statistical approaches that make
    polls an effective tool. We will learn the statistical concepts necessary to define
    *estimates* and *margins of errors*, and show how we can use these to forecast
    final results relatively well and also provide an estimate of the precision of
    our forecast. Once we learn this, we will be able to understand two concepts that
    are ubiquitous in data science: *confidence intervals* and *p-values*. Finally,
    to understand probabilistic statements about the probability of a candidate winning,
    we will have to learn about Bayesian modeling. In the final sections, we put it
    all together to recreate the simplified version of the FiveThirtyEight model and
    apply it to the 2016 election.'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: 在本节中，我们将展示我们在上一章中学到的概率概念如何应用于开发使调查成为有效工具的统计方法。我们将学习定义*估计值*和*误差范围*所需的统计概念，并展示我们如何使用这些概念来相对准确地预测最终结果，并提供我们预测的精确度估计。一旦我们学会了这些，我们就能理解数据科学中无处不在的两个概念：*置信区间*和*p值*。最后，为了理解关于候选人获胜概率的概率性陈述，我们必须学习贝叶斯建模。在最后几节中，我们将把这些内容综合起来，重新创建五三八大模型的简化版本，并将其应用于2016年选举。
- en: We start by connecting probability theory to the task of using polls to learn
    about a population.
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 我们首先将概率论与使用调查了解总体的情况联系起来。
- en: 15.1.1 The sampling model for polls
  id: totrans-29
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 15.1.1 调查的抽样模型
- en: 'To help us understand the connection between polls and what we have learned,
    let’s construct a similar situation to the one pollsters face. To mimic the challenge
    real pollsters face in terms of competing with other pollsters for media attention,
    we will use an urn full of beads to represent voters and pretend we are competing
    for a $25 dollar prize. The challenge is to guess the spread between the proportion
    of blue and red beads in this urn (in this case, a pickle jar):'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: 为了帮助我们理解调查和我们所学的知识之间的联系，让我们构建一个与调查员面临的情况相似的情景。为了模拟调查员在与其他调查员竞争媒体关注方面的挑战，我们将使用一个装满珠子的罐子来代表选民，并假装我们在竞争一个25美元的奖品。挑战是猜测这个罐子（在这种情况下，是一个腌菜罐）中蓝色和红色珠子比例的差距：
- en: '![](../Images/6e2389b0d65b9b870d7f2fe86e0c9392.png)'
  id: totrans-31
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/6e2389b0d65b9b870d7f2fe86e0c9392.png)'
- en: Before making a prediction, you can take a sample (with replacement) from the
    urn. To mimic the fact that running polls is expensive, it costs you $0.10 per
    each bead you sample. Therefore, if your sample size is 250, and you win, you
    will break even since you will pay $25 to collect your $25 prize. Your entry into
    the competition can be an interval. If the interval you submit contains the true
    proportion, you get half what you paid and pass to the second phase of the competition.
    In the second phase, the entry with the smallest interval is selected as the winner.
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 在做出预测之前，你可以从瓮中抽取一个样本（有放回）。为了模拟进行民意调查的成本高昂的事实，每次抽取珠子需要花费你0.10美元。因此，如果你的样本大小是250，并且你赢了，你将收支平衡，因为你将支付25美元来收集你的25美元奖金。你的参赛资格可以是一个区间。如果你提交的区间包含真实比例，你将获得你所支付的一半，并进入比赛的第二阶段。在第二阶段，选择区间最小的参赛者作为获胜者。
- en: 'The **dslabs** package includes a function that shows a random draw from this
    urn:'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: '**dslabs** 包含一个函数，可以显示从这个瓮中进行的随机抽取：'
- en: '[PRE0]'
  id: totrans-34
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: '![](../Images/9da80d26a13c0ab7fd0446ac90552f51.png)'
  id: totrans-35
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/9da80d26a13c0ab7fd0446ac90552f51.png)'
- en: Think about how you would construct your interval based on the data shown above.
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 思考一下你将如何根据上述数据构建你的区间。
- en: 'We have just described a simple sampling model for opinion polls. The beads
    inside the urn represent the individuals that will vote on election day. Those
    that will vote for the Republican candidate are represented with red beads and
    the Democrats with the blue beads. For simplicity, assume there are no other colors.
    That is, that there are just two parties: Republican and Democratic.'
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: 我们刚刚描述了一个简单的民意调查采样模型。瓮中的珠子代表将在选举日投票的个人。支持共和党候选人的用红色珠子表示，民主党用蓝色珠子表示。为了简化，假设没有其他颜色。也就是说，只有两个政党：共和党和民主党。
- en: 15.2 Populations, samples, parameters, and estimates
  id: totrans-38
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 15.2 总体、样本、参数和估计
- en: We want to predict the proportion of blue beads in the urn. Let’s call this
    quantity \(p\), which then tells us the proportion of red beads \(1-p\), and the
    spread \(p - (1-p)\), which simplifies to \(2p - 1\).
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: 我们想要预测瓮中蓝色珠子的比例。让我们称这个量为 \(p\)，这然后告诉我们红色珠子的比例 \(1-p\)，以及范围 \(p - (1-p)\)，这简化为
    \(2p - 1\)。
- en: In statistical textbooks, the beads in the urn are called the *population*.
    The proportion of blue beads in the population \(p\) is called a *parameter*.
    The 25 beads we see in the previous plot are called a *sample*. The task of statistical
    inference is to predict the parameter \(p\) using the observed data in the sample.
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 在统计教科书中，瓮中的珠子被称为**总体**。总体中蓝色珠子的比例 \(p\) 被称为**参数**。我们在之前的图表中看到的25个珠子被称为**样本**。统计推断的任务是使用样本中的观察数据来预测参数
    \(p\)。
- en: Can we do this with the 25 observations above? It is certainly informative.
    For example, given that we see 13 red and 12 blue beads, it is unlikely that \(p\)
    > .9 or \(p\) < .1\. But are we ready to predict with certainty that there are
    more red beads than blue in the jar?
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: 我们能否用上述25个观察结果来做这件事？这当然是有信息的。例如，鉴于我们看到13个红色珠子和12个蓝色珠子，\(p\) > .9 或 \(p\) < .1
    的可能性不大。但我们是否准备好确信罐子里红色珠子比蓝色珠子多？
- en: We want to construct an estimate of \(p\) using only the information we observe.
    An estimate should be thought of as a summary of the observed data that we think
    is informative about the parameter of interest. It seems intuitive to think that
    the proportion of blue beads in the sample \(0.48\) must be at least related to
    the actual proportion \(p\). But do we simply predict \(p\) to be 0.48? First,
    remember that the sample proportion is a random variable. If we run the command
    `take_poll(25)` four times, we get a different answer each time, since the sample
    proportion is a random variable.
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: 我们想要使用我们观察到的信息来构建 \(p\) 的估计。估计应该被视为观察数据的总结，我们认为它对感兴趣参数是有信息的。直观地认为，样本中蓝色珠子的比例
    \(0.48\) 必然与实际比例 \(p\) 有关。但我们是否简单地预测 \(p\) 为0.48？首先，记住样本比例是一个随机变量。如果我们运行 `take_poll(25)`
    命令四次，我们每次都会得到不同的答案，因为样本比例是一个随机变量。
- en: '![](../Images/90b87f1f5dd058ec9f4d5c4d665eef88.png)'
  id: totrans-43
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/90b87f1f5dd058ec9f4d5c4d665eef88.png)'
- en: Note that in the four random samples shown above, the sample proportions range
    from 0.44 to 0.60\. By describing the distribution of this random variable, we
    will be able to gain insights into how good this estimate is and how we can make
    it better.
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，在上述四个随机样本中，样本比例的范围从0.44到0.60。通过描述这个随机变量的分布，我们将能够深入了解这个估计有多好，以及我们如何使其更好。
- en: 15.2.1 The sample average
  id: totrans-45
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 15.2.1 样本平均值
- en: Conducting an opinion poll is being modeled as taking a random sample from an
    urn. We are proposing the use of the proportion of blue beads in our sample as
    an *estimate* of the parameter \(p\). Once we have this estimate, we can easily
    report an estimate for the spread \(2p-1\), but for simplicity we will illustrate
    the concepts for estimating \(p\). We will use our knowledge of probability to
    defend our use of the sample proportion and quantify how close we think it is
    from the population proportion \(p\).
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: 意见调查的建模是随机从罐子中抽取样本。我们提出使用样本中蓝色珠子的比例作为参数 \(p\) 的**估计**。一旦我们有了这个估计值，我们就可以轻松地报告关于范围
    \(2p-1\) 的估计，但为了简化，我们将说明估计 \(p\) 的概念。我们将使用我们对概率的了解来捍卫我们使用样本比例的做法，并量化我们认为它与总体比例
    \(p\) 的接近程度。
- en: 'We start by defining the random variable \(X\) as: \(X=1\) if we pick a blue
    bead at random and \(X=0\) if it is red. This implies that the population is a
    list of 0s and 1s. If we sample \(N\) beads, then the average of the draws \(X_1,
    \dots, X_N\) is equivalent to the proportion of blue beads in our sample. This
    is because adding the \(X\)s is equivalent to counting the blue beads and dividing
    this count by the total \(N\) is equivalent to computing a proportion. We use
    the symbol \(\bar{X}\) to represent this average. In general, in statistics textbooks
    a bar on top of a symbol means the average. The theory we just learned about the
    sum of draws becomes useful because the average is a sum of draws multiplied by
    the constant \(1/N\):'
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: 我们首先定义随机变量 \(X\) 为：如果我们随机抽取一个蓝色珠子，则 \(X=1\)；如果是红色，则 \(X=0\)。这意味着总体是一个由 0 和 1
    组成的列表。如果我们抽取 \(N\) 个珠子，那么抽取的平均值 \(X_1, \dots, X_N\) 等价于我们样本中蓝色珠子的比例。这是因为将 \(X\)
    相加等价于计数蓝色珠子，然后将这个计数除以总数等价于计算一个比例。我们使用符号 \(\bar{X}\) 来表示这个平均值。一般来说，在统计学教科书中，符号上方的横线表示平均值。我们刚刚学到的关于抽取总和的理论变得有用，因为平均值是抽取总和乘以常数
    \(1/N\)：
- en: \[\bar{X} = 1/N \times \sum_{i=1}^N X_i\]
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: \[\bar{X} = \frac{1}{N} \times \sum_{i=1}^N X_i\]
- en: 'For simplicity, let’s assume that the draws are independent: after we see each
    sampled bead, we return it to the urn. In this case, what do we know about the
    distribution of the sum of draws? First, we know that the expected value of the
    sum of draws is \(N\) times the average of the values in the urn. We know that
    the average of the 0s and 1s in the urn must be \(p\), the proportion of blue
    beads.'
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: 为了简化，我们假设抽取是独立的：在我们看到每个样本珠子后，我们将其放回罐子中。在这种情况下，我们对抽取总和的分布了解什么？首先，我们知道抽取总和的期望值是罐子中值的平均值的
    \(N\) 倍。我们知道罐子中 0 和 1 的平均值必须是 \(p\)，即蓝色珠子的比例。
- en: 'Here we encounter an important difference with what we did in the Probability
    chapter: we don’t know what is in the urn. We know there are blue and red beads,
    but we don’t know how many of each. This is what we want to find out: we are trying
    to **estimate** \(p\).'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: 在这里，我们遇到了与概率章节中我们所做的重要区别：我们不知道罐子里有什么。我们知道有蓝色和红色珠子，但我们不知道每种颜色的数量。这正是我们想要找到的：我们试图**估计**
    \(p\)。
- en: 15.2.2 Parameters
  id: totrans-51
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 15.2.2 参数
- en: Just like we use variables to define unknowns in systems of equations, in statistical
    inference we define *parameters* to define unknown parts of our models. In the
    urn model which we are using to mimic an opinion poll, we do not know the proportion
    of blue beads in the urn. We define the parameters \(p\) to represent this quantity.
    \(p\) is the average of the urn because if we take the average of the 1s (blue)
    and 0s (red), we get the proportion of blue beads. Since our main goal is figuring
    out what is \(p\), we are going to *estimate this parameter*.
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: 就像我们在方程组中使用变量来定义未知数一样，在统计推断中，我们定义**参数**来定义我们模型中的未知部分。在我们用来模拟意见调查的罐子模型中，我们不知道罐子中蓝色珠子的比例。我们定义参数
    \(p\) 来表示这个数量。\(p\) 是罐子的平均值，因为如果我们取 1（蓝色）和 0（红色）的平均值，我们得到蓝色珠子的比例。由于我们的主要目标是确定
    \(p\) 是什么，我们将**估计这个参数**。
- en: The ideas presented here on how we estimate parameters, and provide insights
    into how good these estimates are, extrapolate to many data science tasks. For
    example, we may want to determine the difference in health improvement between
    patients receiving treatment and a control group. We may ask, what are the health
    effects of smoking on a population? What are the differences in racial groups
    of fatal shootings by police? What is the rate of change in life expectancy in
    the US during the last 10 years? All these questions can be framed as a task of
    estimating a parameter from a sample.
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: 这里提出的关于如何估计参数的想法，以及提供关于这些估计好坏的见解，可以推广到许多数据科学任务中。例如，我们可能想要确定接受治疗的患者与对照组之间健康改善的差异。我们可能会问，吸烟对人群的健康影响是什么？警察致命射击中种族群体的差异是什么？过去10年美国预期寿命的变化率是多少？所有这些问题都可以表述为从样本中估计参数的任务。
- en: 15.2.3 Polling versus forecasting
  id: totrans-54
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 15.2.3 民意调查与预测
- en: Before we continue, let’s make an important clarification related to the practical
    problem of forecasting the election. If a poll is conducted four months before
    the election, it is estimating the \(p\) for that moment and not for election
    day. The \(p\) for election night might be different since people’s opinions fluctuate
    through time. The polls provided the night before the election tend to be the
    most accurate since opinions don’t change that much in a day. However, forecasters
    try to build tools that model how opinions vary across time and try to predict
    the election night results taking into consideration the fact that opinions fluctuate.
    We will describe some approaches for doing this in a later section.
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: 在我们继续之前，让我们对与预测选举的实际问题相关的一个重要澄清进行说明。如果在选举前四个月进行民意调查，它是在估计那一刻的 \(p\)，而不是选举日的
    \(p\)。由于人们的观点随时间波动，选举夜的 \(p\) 可能不同。选举前一天提供的民意调查通常是最准确的，因为人们的观点在一天内变化不大。然而，预测者试图构建工具来模拟观点随时间的变化，并试图考虑观点波动这一事实来预测选举夜的结果。我们将在下一节中描述一些实现这一目标的方法。
- en: '15.2.4 Properties of our estimate: expected value and standard error'
  id: totrans-56
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 15.2.4 我们估计的性质：期望值和标准误差
- en: 'To understand how good our estimate is, we will describe the statistical properties
    of the random variable defined above: the sample proportion \(\bar{X}\). Remember
    that \(\bar{X}\) is the sum of independent draws so the rules we covered in the
    probability chapter apply.'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: 为了了解我们的估计有多好，我们将描述上面定义的随机变量的统计特性：样本比例 \(\bar{X}\)。记住，\(\bar{X}\) 是独立抽取的总和，因此我们在概率章节中讨论的规则适用。
- en: 'Using what we have learned, the expected value of the sum \(N\bar{X}\) is \(N
    \times\) the average of the urn, \(p\). So dividing by the non-random constant
    \(N\) gives us that the expected value of the average \(\bar{X}\) is \(p\). We
    can write it using our mathematical notation:'
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 使用我们所学到的知识，总和 \(N\bar{X}\) 的期望值是瓮的平均值 \(p\)。因此，除以非随机常数 \(N\)，我们得到平均 \(\bar{X}\)
    的期望值是 \(p\)。我们可以用我们的数学符号来表示它：
- en: \[ \mbox{E}(\bar{X}) = p \]
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mbox{E}(\bar{X}) = p \]
- en: 'We can also use what we learned to figure out the standard error: the standard
    error of the sum is \(\sqrt{N} \times\) the standard deviation of the urn. Can
    we compute the standard error of the urn? We learned a formula that tells us that
    it is \((1-0) \sqrt{p (1-p)}\) = \(\sqrt{p (1-p)}\). Because we are dividing the
    sum by \(N\), we arrive at the following formula for the standard error of the
    average:'
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: 我们还可以利用我们所学到的知识来找出标准误差：总和的标准误差是 \(\sqrt{N} \times\) 瓮的标准差。我们能计算瓮的标准误差吗？我们学到了一个公式，告诉我们它是
    \((1-0) \sqrt{p (1-p)}\) = \(\sqrt{p (1-p)}\)。因为我们把总和除以 \(N\)，所以我们得到了平均标准误差的以下公式：
- en: \[ \mbox{SE}(\bar{X}) = \sqrt{p(1-p)/N} \]
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mbox{SE}(\bar{X}) = \sqrt{p(1-p)/N} \]
- en: This result reveals the power of polls. The expected value of the sample proportion
    \(\bar{X}\) is the parameter of interest \(p\) and we can make the standard error
    as small as we want by increasing \(N\). The law of large numbers tells us that
    with a large enough poll, our estimate converges to \(p\).
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: 这个结果揭示了民意调查的力量。样本比例 \(\bar{X}\) 的期望值是我们感兴趣的参数 \(p\)，我们可以通过增加 \(N\) 来使标准误差尽可能小。大数定律告诉我们，随着调查规模的增大，我们的估计将收敛到
    \(p\)。
- en: If we take a large enough poll to make our standard error about 1%, we will
    be quite certain about who will win. But how large does the poll have to be for
    the standard error to be this small?
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们进行足够大的调查，使得我们的标准误差大约为1%，我们将非常确定谁会获胜。但是，调查需要有多大才能使标准误差如此之小？
- en: 'One problem is that we do not know \(p\), so we can’t compute the standard
    error. However, for illustrative purposes, let’s assume that \(p=0.51\) and make
    a plot of the standard error versus the sample size \(N\):'
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: 一个问题是，我们不知道 \(p\)，所以无法计算标准误差。然而，为了说明目的，让我们假设 \(p=0.51\) 并绘制标准误差与样本大小 \(N\) 的关系图：
- en: '![](../Images/d7b5836d1fcfdf9f339ae63a0668eb16.png)'
  id: totrans-65
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/d7b5836d1fcfdf9f339ae63a0668eb16.png)'
- en: 'From the plot we see that we would need a poll of over 10,000 people to get
    the standard error that low. We rarely see polls of this size due in part to costs.
    From the Real Clear Politics table, we learn that the sample sizes in opinion
    polls range from 500-3,500 people. For a sample size of 1,000 and \(p=0.51\),
    the standard error is:'
  id: totrans-66
  prefs: []
  type: TYPE_NORMAL
  zh: 从图中我们可以看到，我们需要一个超过 10,000 人的调查来得到这么低的标准误差。我们很少看到这么大规模的调查，部分原因是成本。从 Real Clear
    Politics 表格中，我们了解到民意调查的样本大小在 500-3,500 人之间。对于样本大小为 1,000 和 \(p=0.51\)，标准误差是：
- en: '[PRE1]'
  id: totrans-67
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: or 1.5 percentage points. So even with large polls, for close elections, \(\bar{X}\)
    can lead us astray if we don’t realize it is a random variable. Nonetheless, we
    can actually say more about how close we get the \(p\) and we do that in Section
    [15.4](inference.html#clt).
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
  zh: 或者 1.5 个百分点。所以即使在大规模调查中，对于接近的选举，如果我们没有意识到 \(\bar{X}\) 是一个随机变量，它也可能误导我们。尽管如此，我们实际上可以更多地了解我们如何接近
    \(p\)，我们将在第 [15.4](inference.html#clt) 节中这样做。
- en: 15.3 Exercises
  id: totrans-69
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 15.3 练习
- en: '1\. Suppose you poll a population in which a proportion \(p\) of voters are
    Democrats and \(1-p\) are Republicans. Your sample size is \(N=25\). Consider
    the random variable \(S\) which is the **total** number of Democrats in your sample.
    What is the expected value of this random variable? Hint: it’s a function of \(p\).'
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
  zh: 1. 假设你在对选民进行民意调查的群体中，有比例 \(p\) 的选民是民主党人，\(1-p\) 是共和党人。你的样本大小是 \(N=25\)。考虑随机变量
    \(S\)，它是你样本中民主党人的**总数**。这个随机变量的期望值是多少？提示：它是 \(p\) 的函数。
- en: '2\. What is the standard error of \(S\) ? Hint: it’s a function of \(p\).'
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: 2. \(S\) 的标准误差是多少？提示：它是 \(p\) 的函数。
- en: '3\. Consider the random variable \(S/N\). This is equivalent to the sample
    average, which we have been denoting as \(\bar{X}\). What is the expected value
    of the \(\bar{X}\)? Hint: it’s a function of \(p\).'
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: 3. 考虑随机变量 \(S/N\)。这相当于样本平均数，我们一直用 \(\bar{X}\) 表示。\(\bar{X}\) 的期望值是多少？提示：它是 \(p\)
    的函数。
- en: '4\. What is the standard error of \(\bar{X}\)? Hint: it’s a function of \(p\).'
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: 4. \(\bar{X}\) 的标准误差是多少？提示：它是 \(p\) 的函数。
- en: 5\. Write a line of code that gives you the standard error `se` for the problem
    above for several values of \(p\), specifically for `p <- seq(0, 1, length = 100)`.
    Make a plot of `se` versus `p`.
  id: totrans-74
  prefs: []
  type: TYPE_NORMAL
  zh: 5. 编写一行代码，给出上述问题中 \(p\) 的几个值的标准误差 `se`，特别是对于 `p <- seq(0, 1, length = 100)`。绘制
    `se` 与 `p` 的关系图。
- en: 6\. Copy the code above and put it inside a for-loop to make the plot for \(N=25\),
    \(N=100\), and \(N=1000\).
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: 6. 复制上面的代码并将其放入一个 for 循环中，以绘制 \(N=25\)、\(N=100\) 和 \(N=1000\) 的图形。
- en: 7\. If we are interested in the difference in proportions, \(p - (1-p)\), our
    estimate is \(d = \bar{X} - (1-\bar{X})\). Use the rules we learned about sums
    of random variables and scaled random variables to derive the expected value of
    \(d\).
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: 7. 如果我们感兴趣的是比例的差异，\(p - (1-p)\)，我们的估计是 \(d = \bar{X} - (1-\bar{X})\)。使用我们关于随机变量和缩放随机变量的和的规则来推导
    \(d\) 的期望值。
- en: 8\. What is the standard error of \(d\)?
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: 8. \(d\) 的标准误差是多少？
- en: 9\. If the actual \(p=.45\), it means the Republicans are winning by a relatively
    large margin since \(d= -.1\), which is a 10% margin of victory. In this case,
    what is the standard error of \(2\hat{X}-1\) if we take a sample of \(N=25\)?
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: 9. 如果实际的 \(p=0.45\)，这意味着共和党人以相对较大的优势获胜，因为 \(d= -0.1\)，这是一个 10% 的胜利幅度。在这种情况下，如果我们抽取
    \(N=25\) 的样本，\(2\hat{X}-1\) 的标准误差是多少？
- en: 10\. Given the answer to 9, which of the following best describes your strategy
    of using a sample size of \(N=25\)?
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
  zh: 10. 根据第 9 题的答案，以下哪项最好地描述了您使用 \(N=25\) 的样本大小的策略？
- en: The expected value of our estimate \(2\bar{X}-1\) is \(d\), so our prediction
    will be right on.
  id: totrans-80
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我们估计 \(2\bar{X}-1\) 的期望值是 \(d\)，所以我们的预测将是正确的。
- en: Our standard error is larger than the difference, so the chances of \(2\bar{X}-1\)
    being positive and throwing us off were not that small. We should pick a larger
    sample size.
  id: totrans-81
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我们的标准误差大于差异，所以 \(2\bar{X}-1\) 为正并使我们偏离的可能性并不小。我们应该选择更大的样本大小。
- en: The difference is 10% and the standard error is about 0.2, therefore much smaller
    than the difference.
  id: totrans-82
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 差异是 10%，标准误差大约是 0.2，因此远小于差异。
- en: Because we don’t know \(p\), we have no way of knowing that making \(N\) larger
    would actually improve our standard error.
  id: totrans-83
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 由于我们不知道 \(p\)，我们无法知道增加 \(N\) 实际上是否会改善我们的标准误差。
- en: 15.4 Central Limit Theorem in practice
  id: totrans-84
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 15.4 实际应用中的中心极限定理
- en: The CLT tells us that the distribution function for a sum of draws is approximately
    normal. We also learned that dividing a normally distributed random variable by
    a constant is also a normally distributed variable. This implies that the distribution
    of \(\bar{X}\) is approximately normal.
  id: totrans-85
  prefs: []
  type: TYPE_NORMAL
  zh: 中心极限定理告诉我们，抽取总和的分布函数大约是正态分布。我们还了解到，将正态分布的随机变量除以一个常数也是一个正态分布的变量。这意味着 \(\bar{X}\)
    的分布大约是正态分布。
- en: In summary, we have that \(\bar{X}\) has an approximately normal distribution
    with expected value \(p\) and standard error \(\sqrt{p(1-p)/N}\).
  id: totrans-86
  prefs: []
  type: TYPE_NORMAL
  zh: 总结来说，我们有 \(\bar{X}\) 有一个大约正态分布，期望值为 \(p\)，标准误差为 \(\sqrt{p(1-p)/N}\)。
- en: Now how does this help us? Suppose we want to know what is the probability that
    we are within 1% from \(p\). We are basically asking what is
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: 现在这是如何帮助我们的呢？假设我们想知道我们处于 \(p\) 的 1% 以内的概率是多少。我们基本上是在问什么
- en: '\[ \mbox{Pr}(| \bar{X} - p| \leq .01) \] which is the same as:'
  id: totrans-88
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mbox{Pr}(| \bar{X} - p| \leq .01) \] 这与以下相同：
- en: \[ \mbox{Pr}(\bar{X}\leq p + .01) - \mbox{Pr}(\bar{X} \leq p - .01) \]
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mbox{Pr}(\bar{X}\leq p + .01) - \mbox{Pr}(\bar{X} \leq p - .01) \]
- en: 'Can we answer this question? We can use the mathematical trick we learned in
    the previous chapter. Subtract the expected value and divide by the standard error
    to get a standard normal random variable, call it \(Z\), on the left. Since \(p\)
    is the expected value and \(\mbox{SE}(\bar{X}) = \sqrt{p(1-p)/N}\) is the standard
    error we get:'
  id: totrans-90
  prefs: []
  type: TYPE_NORMAL
  zh: 我们能回答这个问题吗？我们可以使用我们在上一章中学到的数学技巧。减去期望值并除以标准误差以得到一个标准正态随机变量，称为 \(Z\)，在左边。由于 \(p\)
    是期望值，\(\mbox{SE}(\bar{X}) = \sqrt{p(1-p)/N}\) 是标准误差，我们得到：
- en: \[ \mbox{Pr}\left(Z \leq \frac{ \,.01} {\mbox{SE}(\bar{X})} \right) - \mbox{Pr}\left(Z
    \leq - \frac{ \,.01} {\mbox{SE}(\bar{X})} \right) \]
  id: totrans-91
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mbox{Pr}\left(Z \leq \frac{ \,.01} {\mbox{SE}(\bar{X})} \right) - \mbox{Pr}\left(Z
    \leq - \frac{ \,.01} {\mbox{SE}(\bar{X})} \right) \]
- en: 'One problem we have is that since we don’t know \(p\), we don’t know \(\mbox{SE}(\bar{X})\).
    But it turns out that the CLT still works if we estimate the standard error by
    using \(\bar{X}\) in place of \(p\). We say that we *plug-in* the estimate. Our
    estimate of the standard error is therefore:'
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: 我们遇到的一个问题是，由于我们不知道 \(p\)，所以我们也不知道 \(\mbox{SE}(\bar{X})\)。但结果证明，如果我们用 \(\bar{X}\)
    代替 \(p\) 来估计标准误差，中心极限定理（CLT）仍然适用。我们说我们进行了“插值”。因此，我们估计的标准误差是：
- en: \[ \hat{\mbox{SE}}(\bar{X})=\sqrt{\bar{X}(1-\bar{X})/N} \] In statistics textbooks,
    we use a little hat to denote estimates. The estimate can be constructed using
    the observed data and \(N\).
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \hat{\mbox{SE}}(\bar{X})=\sqrt{\bar{X}(1-\bar{X})/N} \] 在统计学教科书中，我们用一个小帽子来表示估计。估计可以使用观察数据和
    \(N\) 构建出来。
- en: 'Now we continue with our calculation, but dividing by \(\hat{\mbox{SE}}(\bar{X})=\sqrt{\bar{X}(1-\bar{X})/N})\)
    instead. In our first sample we had 12 blue and 13 red so \(\bar{X} = 0.48\) and
    our estimate of standard error is:'
  id: totrans-94
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们继续我们的计算，但用 \(\hat{\mbox{SE}}(\bar{X})=\sqrt{\bar{X}(1-\bar{X})/N})\) 来代替除法。在我们的第一个样本中，我们有
    12 个蓝色和 13 个红色，所以 \(\bar{X} = 0.48\)，我们估计的标准误差是：
- en: '[PRE2]'
  id: totrans-95
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: 'And now we can answer the question of the probability of being close to \(p\).
    The answer is:'
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们可以回答接近 \(p\) 的概率问题。答案是：
- en: '[PRE3]'
  id: totrans-97
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: Therefore, there is a small chance that we will be close. A poll of only \(N=25\)
    people is not really very useful, at least not for a close election.
  id: totrans-98
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，我们有可能接近。只有 \(N=25\) 人的民意调查实际上并不很有用，至少对于一个接近的选举来说不是。
- en: 'Earlier we mentioned the *margin of error*. Now we can define it because it
    is simply two times the standard error, which we can now estimate. In our case
    it is:'
  id: totrans-99
  prefs: []
  type: TYPE_NORMAL
  zh: 之前我们提到了“误差范围”。现在我们可以定义它，因为它仅仅是标准误差的两倍，我们现在可以估计它。在我们的情况下它是：
- en: '[PRE4]'
  id: totrans-100
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: 'Why do we multiply by 1.96? Because if you ask what is the probability that
    we are within 1.96 standard errors from \(p\), we get:'
  id: totrans-101
  prefs: []
  type: TYPE_NORMAL
  zh: 我们为什么乘以 1.96？因为如果你问我们在 \(p\) 的 1.96 个标准误差内的概率是多少，我们得到：
- en: '\[ \mbox{Pr}\left(Z \leq \, 1.96\,\mbox{SE}(\bar{X}) / \mbox{SE}(\bar{X}) \right)
    - \mbox{Pr}\left(Z \leq - 1.96\, \mbox{SE}(\bar{X}) / \mbox{SE}(\bar{X}) \right)
    \] which is:'
  id: totrans-102
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mbox{Pr}\left(Z \leq \, 1.96\,\mbox{SE}(\bar{X}) / \mbox{SE}(\bar{X}) \right)
    - \mbox{Pr}\left(Z \leq - 1.96\, \mbox{SE}(\bar{X}) / \mbox{SE}(\bar{X}) \right)
    \] 这等于：
- en: \[ \mbox{Pr}\left(Z \leq 1.96 \right) - \mbox{Pr}\left(Z \leq - 1.96\right)
    \]
  id: totrans-103
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mbox{Pr}\left(Z \leq 1.96 \right) - \mbox{Pr}\left(Z \leq - 1.96\right)
    \]
- en: 'which we know is about 95%:'
  id: totrans-104
  prefs: []
  type: TYPE_NORMAL
  zh: 我们知道这大约是 95%：
- en: '[PRE5]'
  id: totrans-105
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: Hence, there is a 95% probability that \(\bar{X}\) will be within \(1.96\times
    \hat{SE}(\bar{X})\), in our case within about 0.2, of \(p\). Note that 95% is
    somewhat of an arbitrary choice and sometimes other percentages are used, but
    it is the most commonly used value to define margin of error. We often round 1.96
    up to 2 for simplicity of presentation.
  id: totrans-106
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，有95%的概率\(\bar{X}\)将在\(1.96\times \hat{SE}(\bar{X})\)的范围内，在我们的例子中大约是0.2，即\(p\)的范围内。请注意，95%是一个相当任意的选择，有时会使用其他百分比，但它是定义误差范围最常用的值。我们通常将1.96四舍五入到2，以便于展示。
- en: In summary, the CLT tells us that our poll based on a sample size of \(25\)
    is not very useful. We don’t really learn much when the margin of error is this
    large. All we can really say is that the popular vote will not be won by a large
    margin. This is why pollsters tend to use larger sample sizes.
  id: totrans-107
  prefs: []
  type: TYPE_NORMAL
  zh: 总结来说，中心极限定理（CLT）告诉我们，基于25个样本大小的调查并不很有用。当误差范围这么大时，我们实际上学不到很多东西。我们真正能说的只是，普选不会以很大的优势获胜。这就是为什么民意调查员倾向于使用更大的样本大小。
- en: From the table above, we see that typical sample sizes range from 700 to 3500\.
    To see how this gives us a much more practical result, notice that if we had obtained
    a \(\bar{X}\)=0.48 with a sample size of 2,000, our standard error \(\hat{\mbox{SE}}(\bar{X})\)
    would have been 0.011\. So our result is an estimate of `48`% with a margin of
    error of 2%. In this case, the result is much more informative and would make
    us think that there are more red balls than blue. Keep in mind, however, that
    this is hypothetical. We did not take a poll of 2,000 since we don’t want to ruin
    the competition.
  id: totrans-108
  prefs: []
  type: TYPE_NORMAL
  zh: 从上面的表中，我们看到典型的样本大小范围从700到3500。为了看到这如何给我们一个更实用的结果，注意如果我们用2000个样本大小得到\(\bar{X}=0.48\)，我们的标准误差\(\hat{\mbox{SE}}(\bar{X})\)将是0.011。因此，我们的结果是估计了48%，误差范围为2%。在这种情况下，结果更有信息量，会使我们想到红色球比蓝色球多。然而，请记住，这是假设的。我们并没有对2000人进行投票，因为我们不想破坏比赛。
- en: 15.4.1 A Monte Carlo simulation
  id: totrans-109
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 15.4.1 蒙特卡洛模拟
- en: 'Suppose we want to use a Monte Carlo simulation to corroborate the tools we
    have built using probability theory. To create the simulation, we would write
    code like this:'
  id: totrans-110
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们想使用蒙特卡洛模拟来证实我们使用概率论构建的工具。为了创建模拟，我们会编写如下代码：
- en: '[PRE6]'
  id: totrans-111
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: The problem is, of course, we don’t know `p`. We could construct an urn like
    the one pictured above and run an analog (without a computer) simulation. It would
    take a long time, but you could take 10,000 samples, count the beads and keep
    track of the proportions of blue. We can use the function `take_poll(n=1000)`
    instead of drawing from an actual urn, but it would still take time to count the
    beads and enter the results.
  id: totrans-112
  prefs: []
  type: TYPE_NORMAL
  zh: 问题当然是，我们不知道`p`。我们可以构建一个像上面图片中那样的容器，并运行一个类似（不使用计算机）的模拟。这会花费很长时间，但你可以在10,000个样本中计数珠子，并跟踪蓝色珠子的比例。我们可以使用`take_poll(n=1000)`函数而不是从实际的容器中抽取，但这仍然需要时间来计数珠子和输入结果。
- en: 'One thing we therefore do to corroborate theoretical results is to pick one
    or several values of `p` and run the simulations. Let’s set `p=0.45`. We can then
    simulate a poll:'
  id: totrans-113
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，为了证实理论结果，我们通常会选取一个或几个`p`的值并运行模拟。让我们设`p=0.45`。然后我们可以模拟一个调查：
- en: '[PRE7]'
  id: totrans-114
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: 'In this particular sample, our estimate is `x_hat`. We can use that code to
    do a Monte Carlo simulation:'
  id: totrans-115
  prefs: []
  type: TYPE_NORMAL
  zh: 在这个特定的样本中，我们的估计是`x_hat`。我们可以使用这段代码来进行蒙特卡洛模拟：
- en: '[PRE8]'
  id: totrans-116
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: 'To review, the theory tells us that \(\bar{X}\) is approximately normally distributed,
    has expected value \(p=\) 0.45 and standard error \(\sqrt{p(1-p)/N}\) = 0.016\.
    The simulation confirms this:'
  id: totrans-117
  prefs: []
  type: TYPE_NORMAL
  zh: 为了复习，理论告诉我们\(\bar{X}\)近似正态分布，期望值为\(p=\) 0.45，标准误差为\(\sqrt{p(1-p)/N}\) = 0.016。模拟证实了这一点：
- en: '[PRE9]'
  id: totrans-118
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: 'A histogram and qq-plot confirm that the normal approximation is accurate as
    well:'
  id: totrans-119
  prefs: []
  type: TYPE_NORMAL
  zh: 直方图和qq图证实了正态近似也是准确的：
- en: '![](../Images/9e67ea9dd9e351ed540dfdcf27eb5418.png)'
  id: totrans-120
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/9e67ea9dd9e351ed540dfdcf27eb5418.png)'
- en: Of course, in real life we would never be able to run such an experiment because
    we don’t know \(p\). But we could run it for various values of \(p\) and \(N\)
    and see that the theory does indeed work well for most values. You can easily
    do this by re-running the code above after changing `p` and `N`.
  id: totrans-121
  prefs: []
  type: TYPE_NORMAL
  zh: 当然，在现实生活中，我们永远无法进行这样的实验，因为我们不知道\(p\)。但我们可以对\(p\)和\(N\)的多个值进行模拟，并看到理论对于大多数值确实工作得很好。你可以通过更改`p`和`N`后重新运行上面的代码来轻松做到这一点。
- en: 15.4.2 The spread
  id: totrans-122
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 15.4.2 分布范围
- en: The competition is to predict the spread, not the proportion \(p\). However,
    because we are assuming there are only two parties, we know that the spread is
    \(p - (1-p) = 2p - 1\). As a result, everything we have done can easily be adapted
    to an estimate of \(2p - 1\). Once we have our estimate \(\bar{X}\) and \(\hat{\mbox{SE}}(\bar{X})\),
    we estimate the spread with \(2\bar{X} - 1\) and, since we are multiplying by
    2, the standard error is \(2\hat{\mbox{SE}}(\bar{X})\). Note that subtracting
    1 does not add any variability so it does not affect the standard error.
  id: totrans-123
  prefs: []
  type: TYPE_NORMAL
  zh: 竞争是为了预测传播，而不是比例 \(p\)。然而，因为我们假设只有两个党派，我们知道传播是 \(p - (1-p) = 2p - 1\)。因此，我们所做的一切都可以很容易地适应对
    \(2p - 1\) 的估计。一旦我们有了我们的估计 \(\bar{X}\) 和 \(\hat{\mbox{SE}}(\bar{X})\)，我们用 \(2\bar{X}
    - 1\) 来估计传播，由于我们乘以了2，标准误差是 \(2\hat{\mbox{SE}}(\bar{X})\)。请注意，减去1不会增加任何变异性，因此它不会影响标准误差。
- en: For our 25 item sample above, our estimate \(p\) is `.48` with margin of error
    `.20` and our estimate of the spread is `0.04` with margin of error `.40`. Again,
    not a very useful sample size. However, the point is that once we have an estimate
    and standard error for \(p\), we have it for the spread \(2p-1\).
  id: totrans-124
  prefs: []
  type: TYPE_NORMAL
  zh: 对于我们上面的25个项目的样本，我们的 \(p\) 估计值为 `.48`，误差范围为 `.20`，我们的传播估计值为 `0.04`，误差范围为 `.40`。然而，样本大小并不大。然而，重点是，一旦我们有了
    \(p\) 的估计和标准误差，我们就有 \(2p-1\) 的传播的估计。
- en: '15.4.3 Bias: why not run a very large poll?'
  id: totrans-125
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 15.4.3 偏差：为什么不进行一次非常大的民意调查？
- en: 'For realistic values of \(p\), say from 0.35 to 0.65, if we run a very large
    poll with 100,000 people, theory tells us that we would predict the election perfectly
    since the largest possible margin of error is around 0.3%:'
  id: totrans-126
  prefs: []
  type: TYPE_NORMAL
  zh: 对于 \(p\) 的现实值，例如从0.35到0.65，如果我们对10万人进行一次非常大的民意调查，理论告诉我们我们可以完美预测选举，因为最大的可能误差范围大约是0.3%：
- en: '![](../Images/4d6c8187ad50d07f6f2ed26c808066c9.png)'
  id: totrans-127
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/4d6c8187ad50d07f6f2ed26c808066c9.png)'
- en: One reason is that running such a poll is very expensive. Another possibly more
    important reason is that theory has its limitations. Polling is much more complicated
    than picking beads from an urn. Some people might lie to pollsters and others
    might not have phones. But perhaps the most important way an actual poll differs
    from an urn model is that we actually don’t know for sure who is in our population
    and who is not. How do we know who is going to vote? Are we reaching all possible
    voters? Hence, even if our margin of error is very small, it might not be exactly
    right that our expected value is \(p\). We call this bias. Historically, we observe
    that polls are indeed biased, although not by that much. The typical bias appears
    to be about 1-2%. This makes election forecasting a bit more interesting and we
    will talk about how to model this in a later chapter.
  id: totrans-128
  prefs: []
  type: TYPE_NORMAL
  zh: 一个原因是进行这样的民意调查非常昂贵。另一个可能更重要的原因是理论有其局限性。民意调查比从瓮中挑珠子要复杂得多。有些人可能会向民意调查员撒谎，而其他人可能没有电话。但也许实际民意调查与瓮模型最不同的地方是我们实际上并不确定谁在我们的群体中，谁不在。我们如何知道谁会去投票？我们是否接触到了所有可能的选民？因此，即使我们的误差范围非常小，我们的期望值也不一定是
    \(p\)。我们称之为偏差。从历史上看，我们观察到民意调查确实存在偏差，尽管不是那么多。典型的偏差似乎在1-2%左右。这使得选举预测变得更有趣，我们将在下一章讨论如何建模这一点。
- en: 15.5 Exercises
  id: totrans-129
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 15.5 练习
- en: 1\. Write an *urn model* function that takes the proportion of Democrats \(p\)
    and the sample size \(N\) as arguments and returns the sample average if Democrats
    are 1s and Republicans are 0s. Call the function `take_sample`.
  id: totrans-130
  prefs: []
  type: TYPE_NORMAL
  zh: 1. 编写一个**瓮模型**函数，该函数接受民主党比例 \(p\) 和样本大小 \(N\) 作为参数，并返回如果民主党为1，共和党为0的样本平均值。调用该函数为
    `take_sample`。
- en: '2\. Now assume `p <- 0.45` and that your sample size is \(N=100\). Take a sample
    10,000 times and save the vector of `mean(X) - p` into an object called `errors`.
    Hint: use the function you wrote for exercise 1 to write this in one line of code.'
  id: totrans-131
  prefs: []
  type: TYPE_NORMAL
  zh: 2. 现在假设 `p <- 0.45` 并且你的样本大小是 \(N=100\)。进行10,000次抽样，并将 `mean(X) - p` 的向量保存到名为
    `errors` 的对象中。提示：使用你为练习1编写的函数，用一行代码来完成这个操作。
- en: '3\. The vector `errors` contains, for each simulated sample, the difference
    between the actual \(p\) and our estimate \(\bar{X}\). We refer to this difference
    as the *error*. Compute the average and make a histogram of the errors generated
    in the Monte Carlo simulation and select which of the following best describes
    their distributions:'
  id: totrans-132
  prefs: []
  type: TYPE_NORMAL
  zh: 3. 向量 `errors` 包含每个模拟样本的实际 \(p\) 和我们的估计 \(\bar{X}\) 之间的差异。我们将这个差异称为**误差**。计算平均值，并绘制蒙特卡洛模拟生成的误差的直方图，并选择以下哪个最能描述它们的分布：
- en: '[PRE10]'
  id: totrans-133
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: The errors are all about 0.05.
  id: totrans-134
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 所有误差都在0.05左右。
- en: The errors are all about -0.05.
  id: totrans-135
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 所有误差都在 -0.05 左右。
- en: The errors are symmetrically distributed around 0.
  id: totrans-136
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 错误在0周围呈对称分布。
- en: The errors range from -1 to 1.
  id: totrans-137
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 误差范围从-1到1。
- en: 4\. The error \(\bar{X}-p\) is a random variable. In practice, the error is
    not observed because we do not know \(p\). Here we observe it because we constructed
    the simulation. What is the average size of the error if we define the size by
    taking the absolute value \(\mid \bar{X} - p \mid\) ?
  id: totrans-138
  prefs: []
  type: TYPE_NORMAL
  zh: 4. 误差\(\bar{X}-p\)是一个随机变量。在实践中，误差没有被观察到，因为我们不知道\(p\)。在这里我们观察到它，因为我们构建了模拟。如果我们通过取绝对值\(\mid
    \bar{X} - p \mid\)来定义大小，误差的平均大小是多少？
- en: 5\. The standard error is related to the typical **size** of the error we make
    when predicting. We say **size** because we just saw that the errors are centered
    around 0, so thus the average error value is 0\. For mathematical reasons related
    to the Central Limit Theorem, we actually use the standard deviation of `errors`
    rather than the average of the absolute values to quantify the typical size. What
    is this standard deviation of the errors?
  id: totrans-139
  prefs: []
  type: TYPE_NORMAL
  zh: 5. 标准误差与我们预测时犯的典型**大小**有关。我们说**大小**是因为我们刚刚看到错误集中在0周围，因此平均误差值是0。由于与中心极限定理相关的数学原因，我们实际上使用`errors`的标准差而不是绝对值的平均值来量化典型大小。这个误差的标准差是多少？
- en: 6\. The theory we just learned tells us what this standard deviation is going
    to be because it is the standard error of \(\bar{X}\). What does theory tell us
    is the standard error of \(\bar{X}\) for a sample size of 100?
  id: totrans-140
  prefs: []
  type: TYPE_NORMAL
  zh: 6. 我们刚刚学到的理论告诉我们这个标准差将会是多少，因为它是\(\bar{X}\)的标准误差。理论告诉我们，对于样本量为100的情况，\(\bar{X}\)的标准误差是多少？
- en: 7\. In practice, we don’t know \(p\), so we construct an estimate of the theoretical
    prediction based by plugging in \(\bar{X}\) for \(p\). Compute this estimate.
    Set the seed at 1 with `set.seed(1)`.
  id: totrans-141
  prefs: []
  type: TYPE_NORMAL
  zh: 7. 在实践中，我们不知道\(p\)，所以我们通过将\(\bar{X}\)插入\(p\)来构建理论预测的估计。计算这个估计。使用`set.seed(1)`设置种子为1。
- en: 8\. Note how close the standard error estimates obtained from the Monte Carlo
    simulation (exercise 5), the theoretical prediction (exercise 6), and the estimate
    of the theoretical prediction (exercise 7) are. The theory is working and it gives
    us a practical approach to knowing the typical error we will make if we predict
    \(p\) with \(\bar{X}\). Another advantage that the theoretical result provides
    is that it gives an idea of how large a sample size is required to obtain the
    precision we need. Earlier we learned that the largest standard errors occur for
    \(p=0.5\). Create a plot of the largest standard error for \(N\) ranging from
    100 to 5,000\. Based on this plot, how large does the sample size have to be to
    have a standard error of about 1%?
  id: totrans-142
  prefs: []
  type: TYPE_NORMAL
  zh: 8. 注意从蒙特卡洛模拟（练习5）、理论预测（练习6）和理论预测估计（练习7）中获得的标准误差估计是多么接近。理论正在起作用，它为我们提供了一个了解如果我们用\(\bar{X}\)预测\(p\)时将犯的典型错误的实用方法。理论结果提供的另一个优点是，它给出了一个关于需要多大样本量才能获得所需精度的概念。我们之前了解到，最大的标准误差发生在\(p=0.5\)时。创建一个从100到5,000的\(N\)值的最大标准误差的图表。根据这个图表，样本量需要多大才能使标准误差大约为1%？
- en: '100'
  id: totrans-143
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '100'
- en: '500'
  id: totrans-144
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '500'
- en: 2,500
  id: totrans-145
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 2,500
- en: 4,000
  id: totrans-146
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 4,000
- en: '9\. For sample size \(N=100\), the central limit theorem tells us that the
    distribution of \(\bar{X}\) is:'
  id: totrans-147
  prefs: []
  type: TYPE_NORMAL
  zh: 9. 对于样本量\(N=100\)，中心极限定理告诉我们\(\bar{X}\)的分布是：
- en: practically equal to \(p\).
  id: totrans-148
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 实际上等于\(p\)。
- en: approximately normal with expected value \(p\) and standard error \(\sqrt{p(1-p)/N}\).
  id: totrans-149
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 大约呈正态分布，期望值为\(p\)，标准误差为\(\sqrt{p(1-p)/N}\)。
- en: approximately normal with expected value \(\bar{X}\) and standard error \(\sqrt{\bar{X}(1-\bar{X})/N}\).
  id: totrans-150
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 大约呈正态分布，期望值为\(\bar{X}\)，标准误差为\(\sqrt{\bar{X}(1-\bar{X})/N}\)。
- en: not a random variable.
  id: totrans-151
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 不是一个随机变量。
- en: '10\. Based on the answer from exercise 8, the error \(\bar{X} - p\) is:'
  id: totrans-152
  prefs: []
  type: TYPE_NORMAL
  zh: 10. 根据练习8的答案，误差\(\bar{X} - p\)是：
- en: practically equal to 0.
  id: totrans-153
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 实际上等于0。
- en: approximately normal with expected value \(0\) and standard error \(\sqrt{p(1-p)/N}\).
  id: totrans-154
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 大约呈正态分布，期望值为\(0\)，标准误差为\(\sqrt{p(1-p)/N}\)。
- en: approximately normal with expected value \(p\) and standard error \(\sqrt{p(1-p)/N}\).
  id: totrans-155
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 大约呈正态分布，期望值为\(p\)，标准误差为\(\sqrt{p(1-p)/N}\)。
- en: not a random variable.
  id: totrans-156
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 不是一个随机变量。
- en: 11\. To corroborate your answer to exercise 9, make a qq-plot of the `errors`
    you generated in exercise 2 to see if they follow a normal distribution.
  id: totrans-157
  prefs: []
  type: TYPE_NORMAL
  zh: 11. 为了证实你对练习9的答案，制作一个练习2中生成的`errors`的qq-plot，以查看它们是否遵循正态分布。
- en: 12\. If \(p=0.45\) and \(N=100\) as in exercise 2, use the CLT to estimate the
    probability that \(\bar{X}>0.5\). You can assume you know \(p=0.45\) for this
    calculation.
  id: totrans-158
  prefs: []
  type: TYPE_NORMAL
  zh: 12. 如果\(p=0.45\)且\(N=100\)，如练习2中所述，使用中心极限定理估计\(\bar{X}>0.5\)的概率。你可以假设你为此计算知道\(p=0.45\)。
- en: 13\. Assume you are in a practical situation and you don’t know \(p\). Take
    a sample of size \(N=100\) and obtain a sample average of \(\bar{X} = 0.51\).
    What is the CLT approximation for the probability that your error is equal to
    or larger than 0.01?
  id: totrans-159
  prefs: []
  type: TYPE_NORMAL
  zh: 13. 假设你处于一个实际情境中，你不知道 \(p\)。抽取一个大小为 \(N=100\) 的样本，并得到样本平均数 \(\bar{X} = 0.51\)。你的误差等于或大于
    0.01 的 CLT 近似概率是多少？
- en: 15.6 Confidence intervals
  id: totrans-160
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 15.6 置信区间
- en: 'Confidence intervals are a very useful concept widely employed by data analysts.
    A version of these that are commonly seen come from the `ggplot` geometry `geom_smooth`.
    Here is an example using a temperature dataset available in R:'
  id: totrans-161
  prefs: []
  type: TYPE_NORMAL
  zh: 置信区间是数据分析师广泛使用的一个非常有用的概念。这些常见版本来自 `ggplot` 几何 `geom_smooth`。以下是一个使用 R 中可用的温度数据集的示例：
- en: '![](../Images/74707434df806001b9965e990b54d116.png)'
  id: totrans-162
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/74707434df806001b9965e990b54d116.png)'
- en: In the Machine Learning part we will learn how the curve is formed, but for
    now consider the shaded area around the curve. This is created using the concept
    of confidence intervals.
  id: totrans-163
  prefs: []
  type: TYPE_NORMAL
  zh: 在机器学习部分，我们将学习曲线是如何形成的，但就现在而言，考虑曲线周围的阴影区域。这是使用置信区间的概念创建的。
- en: In our earlier competition, you were asked to give an interval. If the interval
    you submitted includes the \(p\), you get half the money you spent on your “poll”
    back and pass to the next stage of the competition. One way to pass to the second
    round is to report a very large interval. For example, the interval \([0,1]\)
    is guaranteed to include \(p\). However, with an interval this big, we have no
    chance of winning the competition. Similarly, if you are an election forecaster
    and predict the spread will be between -100% and 100%, you will be ridiculed for
    stating the obvious. Even a smaller interval, such as saying the spread will be
    between -10 and 10%, will not be considered serious.
  id: totrans-164
  prefs: []
  type: TYPE_NORMAL
  zh: 在我们早期的比赛中，你被要求给出一个区间。如果你的区间包含 \(p\)，你将获得你为“民意调查”花费的一半钱，并进入比赛的下一阶段。进入第二轮的一种方式是报告一个非常大的区间。例如，区间
    \([0,1]\) 保证包含 \(p\)。然而，这样一个大的区间，我们没有任何赢得比赛的机会。同样，如果你是一个选举预测员，预测范围将在 -100% 和 100%
    之间，你将因为陈述显而易见的事情而受到嘲笑。即使是一个更小的区间，比如说你认为范围将在 -10 到 10% 之间，也不会被认为认真。
- en: On the other hand, the smaller the interval we report, the smaller our chances
    are of winning the prize. Likewise, a bold pollster that reports very small intervals
    and misses the mark most of the time will not be considered a good pollster. We
    want to be somewhere in between.
  id: totrans-165
  prefs: []
  type: TYPE_NORMAL
  zh: 另一方面，我们报告的区间越小，我们赢得奖金的机会就越小。同样，一个报告非常小区间并且大多数时候都错过目标的粗心民意调查员不会被认为是好的调查员。我们希望介于两者之间。
- en: We can use the statistical theory we have learned to compute the probability
    of any given interval including \(p\). If we are asked to create an interval with,
    say, a 95% chance of including \(p\), we can do that as well. These are called
    95% confidence intervals.
  id: totrans-166
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以使用我们学到的统计理论来计算任何给定区间包含 \(p\) 的概率。如果我们被要求创建一个有 95% 概率包含 \(p\) 的区间，我们也可以做到。这些被称为
    95% 置信区间。
- en: When a pollster reports an estimate and a margin of error, they are, in a way,
    reporting a 95% confidence interval. Let’s show how this works mathematically.
  id: totrans-167
  prefs: []
  type: TYPE_NORMAL
  zh: 当民意调查员报告一个估计值和误差范围时，他们在某种程度上是在报告一个 95% 的置信区间。让我们从数学的角度展示这是如何工作的。
- en: 'We want to know the probability that the interval \([\bar{X} - 2\hat{\mbox{SE}}(\bar{X}),
    \bar{X} + 2\hat{\mbox{SE}}(\bar{X})]\) contains the true proportion \(p\). First,
    consider that the start and end of these intervals are random variables: every
    time we take a sample, they change. To illustrate this, run the Monte Carlo simulation
    above twice. We use the same parameters as above:'
  id: totrans-168
  prefs: []
  type: TYPE_NORMAL
  zh: 我们想了解区间 \([\bar{X} - 2\hat{\mbox{SE}}(\bar{X}), \bar{X} + 2\hat{\mbox{SE}}(\bar{X})]\)
    包含真实比例 \(p\) 的概率。首先，考虑这些区间的起始和结束点是随机变量：每次我们抽取样本时，它们都会改变。为了说明这一点，请运行上面的蒙特卡洛模拟两次。我们使用与上面相同的参数：
- en: '[PRE11]'
  id: totrans-169
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: 'And notice that the interval here:'
  id: totrans-170
  prefs: []
  type: TYPE_NORMAL
  zh: 注意这里的区间：
- en: '[PRE12]'
  id: totrans-171
  prefs: []
  type: TYPE_PRE
  zh: '[PRE12]'
- en: 'is different from this one:'
  id: totrans-172
  prefs: []
  type: TYPE_NORMAL
  zh: 与这个不同：
- en: '[PRE13]'
  id: totrans-173
  prefs: []
  type: TYPE_PRE
  zh: '[PRE13]'
- en: Keep sampling and creating intervals and you will see the random variation.
  id: totrans-174
  prefs: []
  type: TYPE_NORMAL
  zh: 继续抽样并创建区间，你会看到随机变化。
- en: 'To determine the probability that the interval includes \(p\), we need to compute
    this: \[ \mbox{Pr}\left(\bar{X} - 1.96\hat{\mbox{SE}}(\bar{X}) \leq p \leq \bar{X}
    + 1.96\hat{\mbox{SE}}(\bar{X})\right) \]'
  id: totrans-175
  prefs: []
  type: TYPE_NORMAL
  zh: 为了确定区间包含 \(p\) 的概率，我们需要计算这个值：\[ \mbox{Pr}\left(\bar{X} - 1.96\hat{\mbox{SE}}(\bar{X})
    \leq p \leq \bar{X} + 1.96\hat{\mbox{SE}}(\bar{X})\right) \]
- en: 'By subtracting and dividing the same quantities in all parts of the equation,
    we get that the above is equivalent to:'
  id: totrans-176
  prefs: []
  type: TYPE_NORMAL
  zh: 通过在方程的所有部分减去和除以相同的量，我们得到上述等价于：
- en: \[ \mbox{Pr}\left(-1.96 \leq \frac{\bar{X}- p}{\hat{\mbox{SE}}(\bar{X})} \leq
    1.96\right) \]
  id: totrans-177
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mbox{Pr}\left(-1.96 \leq \frac{\bar{X}- p}{\hat{\mbox{SE}}(\bar{X})} \leq
    1.96\right) \]
- en: 'The term in the middle is an approximately normal random variable with expected
    value 0 and standard error 1, which we have been denoting with \(Z\), so we have:'
  id: totrans-178
  prefs: []
  type: TYPE_NORMAL
  zh: 中间的项是一个期望值为 0 且标准误差为 1 的近似正态随机变量，我们用 \(Z\) 表示，所以我们有：
- en: \[ \mbox{Pr}\left(-1.96 \leq Z \leq 1.96\right) \]
  id: totrans-179
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mbox{Pr}\left(-1.96 \leq Z \leq 1.96\right) \]
- en: 'which we can quickly compute using :'
  id: totrans-180
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以快速计算这个值：
- en: '[PRE14]'
  id: totrans-181
  prefs: []
  type: TYPE_PRE
  zh: '[PRE14]'
- en: proving that we have a 95% probability.
  id: totrans-182
  prefs: []
  type: TYPE_NORMAL
  zh: 证明我们有 95% 的概率。
- en: 'If we want to have a larger probability, say 99%, we need to multiply by whatever
    `z` satisfies the following:'
  id: totrans-183
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们想要一个更大的概率，比如说 99%，我们需要乘以满足以下条件的 `z`：
- en: \[ \mbox{Pr}\left(-z \leq Z \leq z\right) = 0.99 \]
  id: totrans-184
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mbox{Pr}\left(-z \leq Z \leq z\right) = 0.99 \]
- en: 'Using:'
  id: totrans-185
  prefs: []
  type: TYPE_NORMAL
  zh: 使用：
- en: '[PRE15]'
  id: totrans-186
  prefs: []
  type: TYPE_PRE
  zh: '[PRE15]'
- en: 'will achieve this because by definition `pnorm(qnorm(0.995))` is 0.995 and
    by symmetry `pnorm(1-qnorm(0.995))` is 1 - 0.995\. As a consequence, we have that:'
  id: totrans-187
  prefs: []
  type: TYPE_NORMAL
  zh: 将实现这一点，因为根据定义 `pnorm(qnorm(0.995))` 等于 0.995，并且由于对称性 `pnorm(1-qnorm(0.995))`
    等于 1 - 0.995。因此，我们有：
- en: '[PRE16]'
  id: totrans-188
  prefs: []
  type: TYPE_PRE
  zh: '[PRE16]'
- en: is `0.995 - 0.005 = 0.99`.
  id: totrans-189
  prefs: []
  type: TYPE_NORMAL
  zh: 是 `0.995 - 0.005 = 0.99`。
- en: We can use this approach for any probability, not just 0.95 and 0.99\. In statistics
    textbooks, these are usually written for any probability as
  id: totrans-190
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以使用这种方法来处理任何概率，而不仅仅是 0.95 和 0.99。在统计学教科书中，这些通常被写为任何概率：
- en: \(1-\alpha\). We can then obtain the \(z\) for the equation above noting using
    `z = qnorm(1 - alpha / 2)` because \(1 - \alpha/2 - \alpha/2 = 1 - \alpha\).
  id: totrans-191
  prefs: []
  type: TYPE_NORMAL
  zh: \(1-\alpha\)。然后我们可以通过使用 `z = qnorm(1 - alpha / 2)` 来获得上述方程的 \(z\)，因为 \(1 - \alpha/2
    - \alpha/2 = 1 - \alpha\)。
- en: 'So, for example, for \(\alpha=0.05\), \(1 - \alpha/2 = 0.975\) and we get the
    1.96 we have been using:'
  id: totrans-192
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，例如，对于 \(\alpha=0.05\)，\(1 - \alpha/2 = 0.975\)，我们得到我们一直在使用的 1.96：
- en: '[PRE17]'
  id: totrans-193
  prefs: []
  type: TYPE_PRE
  zh: '[PRE17]'
- en: 15.6.1 A Monte Carlo simulation
  id: totrans-194
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 15.6.1 一个蒙特卡洛模拟
- en: We can run a Monte Carlo simulation to confirm that, in fact, a 95% confidence
    interval includes \(p\) 95% of the time.
  id: totrans-195
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以通过蒙特卡洛模拟来确认，实际上 95% 的置信区间 95% 的时间包括 \(p\)。
- en: '[PRE18]'
  id: totrans-196
  prefs: []
  type: TYPE_PRE
  zh: '[PRE18]'
- en: 'The following plot shows the first 100 confidence intervals. In this case,
    we created the simulation so the black line denotes the parameter we are trying
    to estimate:'
  id: totrans-197
  prefs: []
  type: TYPE_NORMAL
  zh: 下面的图显示了前 100 个置信区间。在这种情况下，我们创建了模拟，所以黑色线表示我们试图估计的参数：
- en: '![](../Images/ec91690e98535f10a60a9cd0d73b70bc.png)'
  id: totrans-198
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/ec91690e98535f10a60a9cd0d73b70bc.png)'
- en: 15.6.2 The correct language
  id: totrans-199
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 15.6.2 正确的语言
- en: When using the theory we described above, it is important to remember that it
    is the intervals that are random, not \(p\). In the plot above, we can see the
    random intervals moving around and \(p\), represented with the vertical line,
    staying in the same place. The proportion of blue in the urn \(p\) is not. So
    the 95% relates to the probability that this random interval falls on top of \(p\).
    Saying the \(p\) has a 95% chance of being between this and that is technically
    an incorrect statement because \(p\) is not random.
  id: totrans-200
  prefs: []
  type: TYPE_NORMAL
  zh: 当使用我们上面描述的理论时，重要的是要记住，是区间是随机的，而不是 \(p\)。在上面的图中，我们可以看到随机区间在移动，而 \(p\)，用垂直线表示，保持在同一位置。urn
    中蓝色的比例 \(p\) 不是。因此，95% 是指这个随机区间落在 \(p\) 上的概率。说 \(p\) 有 95% 的机会在这个和那个之间是技术上不正确的陈述，因为
    \(p\) 不是随机的。
- en: 15.7 Exercises
  id: totrans-201
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 15.7 练习
- en: For these exercises, we will use actual polls from the 2016 election. You can
    load the data from the **dslabs** package.
  id: totrans-202
  prefs: []
  type: TYPE_NORMAL
  zh: 对于这些练习，我们将使用 2016 年选举的实际民调。你可以从 **dslabs** 包中加载数据。
- en: '[PRE19]'
  id: totrans-203
  prefs: []
  type: TYPE_PRE
  zh: '[PRE19]'
- en: Specifically, we will use all the national polls that ended within one week
    before the election.
  id: totrans-204
  prefs: []
  type: TYPE_NORMAL
  zh: 特别地，我们将使用选举前一周结束的所有全国性民调。
- en: '[PRE20]'
  id: totrans-205
  prefs: []
  type: TYPE_PRE
  zh: '[PRE20]'
- en: '1\. For the first poll, you can obtain the samples size and estimated Clinton
    percentage with:'
  id: totrans-206
  prefs: []
  type: TYPE_NORMAL
  zh: 1. 对于第一个民调，你可以通过以下方式获得样本量和估计的克林顿百分比：
- en: '[PRE21]'
  id: totrans-207
  prefs: []
  type: TYPE_PRE
  zh: '[PRE21]'
- en: Assume there are only two candidates and construct a 95% confidence interval
    for the election night proportion \(p\).
  id: totrans-208
  prefs: []
  type: TYPE_NORMAL
  zh: 假设有两个候选人，构建选举之夜比例 \(p\) 的 95% 置信区间。
- en: '2\. Now use `dplyr` to add a confidence interval as two columns, call them
    `lower` and `upper`, to the object `poll`. Then use `select` to show the `pollster`,
    `enddate`, `x_hat`,`lower`, `upper` variables. Hint: define temporary columns
    `x_hat` and `se_hat`.'
  id: totrans-209
  prefs: []
  type: TYPE_NORMAL
  zh: 2. 现在用 `dplyr` 添加一个置信区间作为两列，命名为 `lower` 和 `upper`，到对象 `poll` 中。然后使用 `select`
    来显示 `pollster`、`enddate`、`x_hat`、`lower`、`upper` 变量。提示：定义临时列 `x_hat` 和 `se_hat`。
- en: 3\. The final tally for the popular vote was Clinton 48.2% and Trump 46.1%.
    Add a column, call it `hit`, to the previous table stating if the confidence interval
    included the true proportion \(p=0.482\) or not.
  id: totrans-210
  prefs: []
  type: TYPE_NORMAL
  zh: 3. 最终的普选票数是克林顿 48.2% 和特朗普 46.1%。向之前的表格中添加一个名为 `hit` 的列，表示置信区间是否包含真实比例 \(p=0.482\)。
- en: 4\. For the table you just created, what proportion of confidence intervals
    included \(p\)?
  id: totrans-211
  prefs: []
  type: TYPE_NORMAL
  zh: 4. 对于你刚刚创建的表格，有多少比例的置信区间包含了 \(p\)？
- en: 5\. If these confidence intervals are constructed correctly, and the theory
    holds up, what proportion should include \(p\)?
  id: totrans-212
  prefs: []
  type: TYPE_NORMAL
  zh: 5. 如果这些置信区间构建正确，并且理论成立，那么应该有多少比例包含 \(p\)？
- en: 6\. A much smaller proportion of the polls than expected produce confidence
    intervals containing \(p\). If you look closely at the table, you will see that
    most polls that fail to include \(p\) are underestimating. The reason for this
    is undecided voters, individuals polled that do not yet know who they will vote
    for or do not want to say. Because, historically, undecideds divide evenly between
    the two main candidates on election day, it is more informative to estimate the
    spread or the difference between the proportion of two candidates \(d\), which
    in this election was \(0\. 482 - 0.461 = 0.021\). Assume that there are only two
    parties and that \(d = 2p - 1\), redefine `polls` as below and re-do exercise
    1, but for the difference.
  id: totrans-213
  prefs: []
  type: TYPE_NORMAL
  zh: 6. 与预期相比，只有更小的比例的民意调查产生了包含 \(p\) 的置信区间。如果你仔细查看表格，你会看到大多数未能包含 \(p\) 的民意调查都是低估的。原因是不确定的选民，被调查的个体尚未知道他们将投票给谁，或者不想说。因为，从历史上看，不确定的选民在选举日会平均分配给两个主要候选人，因此估计两个候选人比例之间的差异
    \(d\) 更有信息量，这次选举中 \(d = 0.482 - 0.461 = 0.021\)。假设只有两个政党，且 \(d = 2p - 1\)，重新定义`民意调查`如下，并重新做练习1，但对于差异。
- en: '[PRE22]'
  id: totrans-214
  prefs: []
  type: TYPE_PRE
  zh: '[PRE22]'
- en: 7\. Now repeat exercise 3, but for the difference.
  id: totrans-215
  prefs: []
  type: TYPE_NORMAL
  zh: 7. 现在重复练习3，但对于差异。
- en: 8\. Now repeat exercise 4, but for the difference.
  id: totrans-216
  prefs: []
  type: TYPE_NORMAL
  zh: 8. 现在重复练习4，但对于差异。
- en: 9\. Although the proportion of confidence intervals goes up substantially, it
    is still lower than 0.95\. In the next chapter, we learn the reason for this.
    To motivate this, make a plot of the error, the difference between each poll’s
    estimate and the actual \(d=0.021\). Stratify by pollster.
  id: totrans-217
  prefs: []
  type: TYPE_NORMAL
  zh: 9. 尽管置信区间的比例大幅上升，但它仍然低于0.95。在下一章中，我们将了解这个原因。为了激发这一点，绘制一个误差图，显示每个民意调查估计与实际 \(d=0.021\)
    之间的差异。按民意调查者分层。
- en: 10\. Redo the plot that you made for exercise 9, but only for pollsters that
    took five or more polls.
  id: totrans-218
  prefs: []
  type: TYPE_NORMAL
  zh: 10. 重新绘制你在练习9中制作的图表，但只针对进行了五个或更多民意调查的民意调查员。
- en: 15.8 Power
  id: totrans-219
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 15.8 功率
- en: 'Pollsters are not successful at providing correct confidence intervals, but
    rather at predicting who will win. When we took a 25 bead sample size, the confidence
    interval for the spread:'
  id: totrans-220
  prefs: []
  type: TYPE_NORMAL
  zh: 民意调查员在提供正确的置信区间方面并不成功，而是擅长预测谁会获胜。当我们取25个珠子的样本量时，对于分布的置信区间：
- en: '[PRE23]'
  id: totrans-221
  prefs: []
  type: TYPE_PRE
  zh: '[PRE23]'
- en: includes 0\. If this were a poll and we were forced to make a declaration, we
    would have to say it was a “toss-up”.
  id: totrans-222
  prefs: []
  type: TYPE_NORMAL
  zh: 包含0。如果这是一个民意调查，我们被迫做出声明，我们只能说这是一个“平局”。
- en: A problem with our poll results is that given the sample size and the value
    of \(p\), we would have to sacrifice on the probability of an incorrect call to
    create an interval that does not include 0.
  id: totrans-223
  prefs: []
  type: TYPE_NORMAL
  zh: 我们民意调查结果的一个问题是，给定样本量和 \(p\) 的值，我们不得不牺牲对错误判断的概率，以创建一个不包含0的区间。
- en: This does not mean that the election is close. It only means that we have a
    small sample size. In statistical textbooks this is called lack of *power*. In
    the context of polls, *power* is the probability of detecting spreads different
    from 0.
  id: totrans-224
  prefs: []
  type: TYPE_NORMAL
  zh: 这并不意味着选举很接近。这只意味着我们的样本量很小。在统计学教科书中，这被称为缺乏*功率*。在民意调查的背景下，*功率*是检测与0不同的分布的概率。
- en: By increasing our sample size, we lower our standard error and therefore have
    a much better chance of detecting the direction of the spread.
  id: totrans-225
  prefs: []
  type: TYPE_NORMAL
  zh: 通过增加样本量，我们降低了标准误差，因此有更大的机会检测到分布的方向。
- en: 15.9 p-values
  id: totrans-226
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 15.9 p值
- en: p-values are ubiquitous in the scientific literature. They are related to confidence
    intervals so we introduce the concept here.
  id: totrans-227
  prefs: []
  type: TYPE_NORMAL
  zh: p值在科学文献中无处不在。它们与置信区间相关，所以我们在这里引入这个概念。
- en: 'Let’s consider the blue and red beads. Suppose that rather than wanting an
    estimate of the spread or the proportion of blue, I am interested only in the
    question: are there more blue beads or red beads? I want to know if the spread
    or, equivalently, if \(p > 0.5\).'
  id: totrans-228
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们考虑蓝色和红色珠子。假设我不仅对估计分布或蓝色比例感兴趣，而且只对以下问题感兴趣：蓝色珠子是否比红色珠子多？我想知道分布是否，或者说 \(p >
    0.5\)。
- en: 'Say we take a random sample of \(N=100\) and we observe \(52\) blue beads,
    which gives us \(\bar{X} = 0.52\). This seems to be pointing to the existence
    of more blue than red beads since 0.52 is larger than 0.5\. However, as data scientists
    we need to be skeptical. We know there is chance involved in this process and
    we could get a 52 even when the actual spread is 0. We call the assumption that
    the spread is \(p = 0.5\) a *null hypothesis*. The null hypothesis is the skeptic’s
    hypothesis. We have observed a random variable \(\bar{X} = 0.52\) and the p-value
    is the answer to the question: how likely is it to see a value this large, when
    the null hypothesis is true? So we write:'
  id: totrans-229
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们随机抽取了一个\(N=100\)的样本，并观察到\(52\)个蓝色珠子，这给我们带来了\(\bar{X} = 0.52\)。这似乎表明蓝色珠子比红色珠子多，因为0.52大于0.5。然而，作为数据科学家，我们需要保持怀疑态度。我们知道在这个过程中存在偶然性，即使实际分布是0，我们也可能得到52个。我们将分布是\(p
    = 0.5\)的假设称为*零假设*。零假设是怀疑者的假设。我们已经观察到随机变量\(\bar{X} = 0.52\)，p值是回答以下问题的答案：当零假设为真时，看到这样一个大值的可能性有多大？因此，我们写下：
- en: \[\mbox{Pr}(\mid \bar{X} - 0.5 \mid > 0.02 ) \]
  id: totrans-230
  prefs: []
  type: TYPE_NORMAL
  zh: \[\mbox{Pr}(\mid \bar{X} - 0.5 \mid > 0.02 ) \]
- en: 'assuming the \(p=0.5\). Under the null hypothesis we know that:'
  id: totrans-231
  prefs: []
  type: TYPE_NORMAL
  zh: 假设\(p=0.5\)。在零假设下，我们知道：
- en: \[ \sqrt{N}\frac{\bar{X} - 0.5}{\sqrt{0.5(1-0.5)}} \]
  id: totrans-232
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \sqrt{N}\frac{\bar{X} - 0.5}{\sqrt{0.5(1-0.5)}} \]
- en: is standard normal. We therefore can compute the probability above, which is
    the p-value.
  id: totrans-233
  prefs: []
  type: TYPE_NORMAL
  zh: 是标准正态分布。因此，我们可以计算上面的概率，即p值。
- en: \[\mbox{Pr}\left(\sqrt{N}\frac{\mid \bar{X} - 0.5\mid}{\sqrt{0.5(1-0.5)}} >
    \sqrt{N} \frac{0.02}{ \sqrt{0.5(1-0.5)}}\right)\]
  id: totrans-234
  prefs: []
  type: TYPE_NORMAL
  zh: \[\mbox{Pr}\left(\sqrt{N}\frac{\mid \bar{X} - 0.5\mid}{\sqrt{0.5(1-0.5)}} >
    \sqrt{N} \frac{0.02}{ \sqrt{0.5(1-0.5)}}\right)\]
- en: '[PRE24]'
  id: totrans-235
  prefs: []
  type: TYPE_PRE
  zh: '[PRE24]'
- en: In this case, there is actually a large chance of seeing 52 or larger under
    the null hypothesis.
  id: totrans-236
  prefs: []
  type: TYPE_NORMAL
  zh: 在这种情况下，实际上在零假设下看到52或更大的可能性很大。
- en: Keep in mind that there is a close connection between p-values and confidence
    intervals. If a 95% confidence interval of the spread does not include 0, we know
    that the p-value must be smaller than 0.05.
  id: totrans-237
  prefs: []
  type: TYPE_NORMAL
  zh: 请记住，p值和置信区间之间有一个紧密的联系。如果一个95%的置信区间不包括0，我们知道p值必须小于0.05。
- en: To learn more about p-values, you can consult any statistics textbook. However,
    in general, we prefer reporting confidence intervals over p-values since it gives
    us an idea of the size of the estimate. If we just report the p-value we provide
    no information about the significance of the finding in the context of the problem.
  id: totrans-238
  prefs: []
  type: TYPE_NORMAL
  zh: 要了解更多关于p值的信息，你可以查阅任何统计学教材。然而，一般来说，我们更倾向于报告置信区间而不是p值，因为它能让我们了解估计的大小。如果我们只报告p值，我们无法提供关于在问题背景下发现显著性的任何信息。
- en: 15.10 Association tests
  id: totrans-239
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 15.10 关联测试
- en: The statistical tests we have studied up to now leave out a substantial portion
    of data types. Specifically, we have not discussed inference for binary, categorical,
    and ordinal data. To give a very specific example, consider the following case
    study.
  id: totrans-240
  prefs: []
  type: TYPE_NORMAL
  zh: 我们到目前为止所研究的统计测试忽略了大量数据类型。具体来说，我们还没有讨论二进制、分类和有序数据的推断。为了给出一个非常具体的例子，考虑以下案例研究。
- en: 'A 2014 PNAS paper[^(53)](#fn53) analyzed success rates from funding agencies
    in the Netherlands and concluded that their:'
  id: totrans-241
  prefs: []
  type: TYPE_NORMAL
  zh: 2014年PNAS论文[^(53)](#fn53)分析了荷兰资助机构的成功率，并得出结论，他们的：
- en: results reveal gender bias favoring male applicants over female applicants in
    the prioritization of their “quality of researcher” (but not “quality of proposal”)
    evaluations and success rates, as well as in the language use in instructional
    and evaluation materials.
  id: totrans-242
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 结果揭示性别偏见，有利于男性申请者在“研究者质量”（但不是“提案质量”）评估和成功率方面的优先级，以及在教学和评估材料中的语言使用。
- en: 'The main evidence for this conclusion comes down to a comparison of the percentages.
    Table S1 in the paper includes the information we need. Here are the three columns
    showing the overall outcomes:'
  id: totrans-243
  prefs: []
  type: TYPE_NORMAL
  zh: 这一结论的主要证据来自于百分比的比较。论文中的表S1包含了我们需要的信息。以下是显示总体结果的三个列：
- en: '[PRE25]'
  id: totrans-244
  prefs: []
  type: TYPE_PRE
  zh: '[PRE25]'
- en: 'We have these values for each gender:'
  id: totrans-245
  prefs: []
  type: TYPE_NORMAL
  zh: 我们有这些值针对每个性别：
- en: '[PRE26]'
  id: totrans-246
  prefs: []
  type: TYPE_PRE
  zh: '[PRE26]'
- en: 'We can compute the totals that were successful and the totals that were not
    as follows:'
  id: totrans-247
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以计算成功和未成功的总数如下：
- en: '[PRE27]'
  id: totrans-248
  prefs: []
  type: TYPE_PRE
  zh: '[PRE27]'
- en: 'So we see that a larger percent of men than women received awards:'
  id: totrans-249
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，我们看到男性获得奖项的比例高于女性：
- en: '[PRE28]'
  id: totrans-250
  prefs: []
  type: TYPE_PRE
  zh: '[PRE28]'
- en: But could this be due just to random variability? Here we learn how to perform
    inference for this type of data.
  id: totrans-251
  prefs: []
  type: TYPE_NORMAL
  zh: 但这仅仅是由于随机变异性吗？在这里，我们学习如何对这类数据进行推断。
- en: 15.10.1 Lady Tasting Tea
  id: totrans-252
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 15.10.1 女士品茶
- en: R.A. Fisher[^(54)](#fn54) was one of the first to formalize hypothesis testing.
    The “Lady Tasting Tea” is one of the most famous examples.
  id: totrans-253
  prefs: []
  type: TYPE_NORMAL
  zh: R.A. 费舍尔[^(54)](#fn54) 是最早将假设检验形式化的人之一。“女士品茶”是最著名的例子之一。
- en: 'The story is as follows: an acquaintance of Fisher’s claimed that she could
    tell if milk was added before or after tea was poured. Fisher was skeptical. He
    designed an experiment to test this claim. He gave her four pairs of cups of tea:
    one with milk poured first, the other after. The order was randomized. The null
    hypothesis here is that she is guessing. Fisher derived the distribution for the
    number of correct picks on the assumption that the choices were random and independent.'
  id: totrans-254
  prefs: []
  type: TYPE_NORMAL
  zh: 这个故事是这样的：费舍尔的一个熟人声称她能判断牛奶是在倒茶之前还是之后加入的。费舍尔对此表示怀疑。他设计了一个实验来测试这个说法。他给了她四组茶杯：一组先倒牛奶，另一组后倒。顺序是随机化的。这里的零假设是她是在猜测。费舍尔在假设选择是随机且独立的前提下，推导出了正确选择的数量的分布。
- en: 'As an example, suppose she picked 3 out of 4 correctly. Do we believe she has
    a special ability? The basic question we ask is: if the tester is actually guessing,
    what are the chances that she gets 3 or more correct? Just as we have done before,
    we can compute a probability under the null hypothesis that she is guessing 4
    of each. Under this null hypothesis, we can think of this particular example as
    picking 4 balls out of an urn with 4 blue (correct answer) and 4 red (incorrect
    answer) balls. Remember, she knows that there are four before tea and four after.'
  id: totrans-255
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，假设她正确地选中了4个中的3个。我们是否相信她有特殊的能力？我们提出的基本问题是：如果测试者实际上是在猜测，她得到3个或更多正确答案的概率是多少？就像我们之前做的那样，我们可以在她猜测4个每个的零假设下计算一个概率。在这个零假设下，我们可以将这个特定的例子视为从一个包含4个蓝色（正确答案）和4个红色（错误答案）珠子的罐子中取出4个珠子。记住，她知道有四个先倒牛奶的杯子和四个后倒牛奶的杯子。
- en: Under the null hypothesis that she is simply guessing, each ball has the same
    chance of being picked. We can then use combinations to figure out each probability.
    The probability of picking 3 is \(\binom{4}{3} \binom{4}{1} / \binom{8}{4} = 16/70\).
    The probability of picking all 4 correct is \(\binom{4}{4} \binom{4}{0} / \binom{8}{4}=
    1/70\). Thus, the chance of observing a 3 or something more extreme, under the
    null hypothesis, is \(\approx 0.24\). This is the p-value. The procedure that
    produced this p-value is called *Fisher’s exact test* and it uses the *hypergeometric
    distribution*.
  id: totrans-256
  prefs: []
  type: TYPE_NORMAL
  zh: 在她只是猜测的零假设下，每个球被选中的概率是相同的。然后我们可以使用组合来计算每个概率。选中3个的概率是 \(\binom{4}{3} \binom{4}{1}
    / \binom{8}{4} = 16/70\)。选中所有4个正确的概率是 \(\binom{4}{4} \binom{4}{0} / \binom{8}{4}=
    1/70\)。因此，在零假设下观察到3个或更极端的情况的概率是 \(\approx 0.24\)。这就是p值。产生这个p值的程序被称为**费舍尔精确检验**，它使用**超几何分布**。
- en: 15.10.2 Two-by-two tables
  id: totrans-257
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 15.10.2 二乘二表
- en: 'The data from the experiment is usually summarized by a table like this:'
  id: totrans-258
  prefs: []
  type: TYPE_NORMAL
  zh: 实验数据通常用如下表格来总结：
- en: '[PRE29]'
  id: totrans-259
  prefs: []
  type: TYPE_PRE
  zh: '[PRE29]'
- en: These are referred to as a two-by-two table. For each of the four combinations
    one can get with a pair of binary variables, they show the observed counts for
    each occurrence.
  id: totrans-260
  prefs: []
  type: TYPE_NORMAL
  zh: 这些被称为二乘二表。对于二元变量的一对组合中可以得到的四种组合，它们显示了每种发生的观察计数。
- en: 'The function `fisher.test` performs the inference calculations above:'
  id: totrans-261
  prefs: []
  type: TYPE_NORMAL
  zh: '`fisher.test` 函数执行上述推断计算：'
- en: '[PRE30]'
  id: totrans-262
  prefs: []
  type: TYPE_PRE
  zh: '[PRE30]'
- en: 15.10.3 Chi-square Test
  id: totrans-263
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 15.10.3 卡方检验
- en: Notice that, in a way, our funding rates example is similar to the Lady Tasting
    Tea. However, in the Lady Tasting Tea example, the number of blue and red beads
    is experimentally fixed and the number of answers given for each category is also
    fixed. This is because Fisher made sure there were four cups with milk poured
    before tea and four cups with milk poured after and the lady knew this, so the
    answers would also have to include four befores and four afters. If this is the
    case, the sum of the rows and the sum of the columns are fixed. This defines constraints
    on the possible ways we can fill the two by two table and also permits us to use
    the hypergeometric distribution. In general, this is not the case. Nonetheless,
    there is another approach, the Chi-squared test, which is described below.
  id: totrans-264
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，从某种意义上说，我们的资助率例子与女士品茶例子相似。然而，在女士品茶例子中，蓝色和红色珠子的数量是实验上固定的，每个类别的答案数量也是固定的。这是因为费舍尔确保有四个先倒牛奶的杯子，有四个后倒牛奶的杯子，女士知道这一点，所以答案也必须包括四个先和四个后。如果是这样，行和列的总和是固定的。这定义了我们可以填充二乘二表的可能方式的约束，并允许我们使用超几何分布。通常情况下并非如此。尽管如此，还有另一种方法，即卡方检验，下面将进行描述。
- en: 'Imagine we have 290, 1,345, 177, 1,011 applicants, some are men and some are
    women and some get funded, whereas others don’t. We saw that the success rates
    for men and woman were:'
  id: totrans-265
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们有 290、1,345、177、1,011 名申请人，其中一些是男性，一些是女性，一些获得了资助，而其他人没有。我们看到男性和女性的成功率如下：
- en: '[PRE31]'
  id: totrans-266
  prefs: []
  type: TYPE_PRE
  zh: '[PRE31]'
- en: 'respectively. Would we see this again if we randomly assign funding at the
    overall rate:'
  id: totrans-267
  prefs: []
  type: TYPE_NORMAL
  zh: 分别。如果我们以整体比率随机分配资金，我们会再次看到这种情况吗？
- en: '[PRE32]'
  id: totrans-268
  prefs: []
  type: TYPE_PRE
  zh: '[PRE32]'
- en: 'The Chi-square test answers this question. The first step is to create the
    two-by-two data table:'
  id: totrans-269
  prefs: []
  type: TYPE_NORMAL
  zh: 卡方检验回答了这个问题。第一步是创建二维数据表：
- en: '[PRE33]'
  id: totrans-270
  prefs: []
  type: TYPE_PRE
  zh: '[PRE33]'
- en: 'The general idea of the Chi-square test is to compare this two-by-two table
    to what you expect to see, which would be:'
  id: totrans-271
  prefs: []
  type: TYPE_NORMAL
  zh: 卡方检验的一般思想是将这个二维表与预期的进行比较，预期的是：
- en: '[PRE34]'
  id: totrans-272
  prefs: []
  type: TYPE_PRE
  zh: '[PRE34]'
- en: 'We can see that more men than expected and fewer women than expected received
    funding. However, under the null hypothesis these observations are random variables.
    The Chi-square test tells us how likely it is to see a deviation this large or
    larger. This test uses an asymptotic result, similar to the CLT, related to the
    sums of independent binary outcomes. The R function `chisq.test` takes a two-by-two
    table and returns the results from the test:'
  id: totrans-273
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以看到，比预期的男性更多，比预期的女性更少获得了资助。然而，在零假设下，这些观察结果是随机变量。卡方检验告诉我们看到如此大的偏差或更大偏差的可能性有多大。这种检验使用了一个类似于中心极限定理的渐近结果，与独立二元结果的和有关。R
    函数 `chisq.test` 接收一个二维表并返回测试结果：
- en: '[PRE35]'
  id: totrans-274
  prefs: []
  type: TYPE_PRE
  zh: '[PRE35]'
- en: 'We see that the p-value is 0.0509:'
  id: totrans-275
  prefs: []
  type: TYPE_NORMAL
  zh: 我们看到 p 值为 0.0509：
- en: '[PRE36]'
  id: totrans-276
  prefs: []
  type: TYPE_PRE
  zh: '[PRE36]'
- en: 15.10.4 The odds ratio
  id: totrans-277
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 15.10.4 概率比
- en: 'An informative summary statistic associated with two-by-two tables is the odds
    ratio. Define the two variables as \(X = 1\) if you are a male and 0 otherwise,
    and \(Y=1\) if you are funded and 0 otherwise. The odds of getting funded if you
    are a man is defined:'
  id: totrans-278
  prefs: []
  type: TYPE_NORMAL
  zh: 与二维表相关的一个信息性统计量是概率比。定义两个变量为 \(X = 1\) 如果你是男性，否则为 0，\(Y=1\) 如果你获得了资助，否则为 0。如果你是男性，获得资助的概率定义为：
- en: \[\mbox{Pr}(Y=1 \mid X=1) / \mbox{Pr}(Y=0 \mid X=1)\]
  id: totrans-279
  prefs: []
  type: TYPE_NORMAL
  zh: \[\mbox{Pr}(Y=1 \mid X=1) / \mbox{Pr}(Y=0 \mid X=1)\]
- en: 'and can be computed like this:'
  id: totrans-280
  prefs: []
  type: TYPE_NORMAL
  zh: 并可以按如下方式计算：
- en: '[PRE37]'
  id: totrans-281
  prefs: []
  type: TYPE_PRE
  zh: '[PRE37]'
- en: 'And the odds of being funded if you are a woman is:'
  id: totrans-282
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你是一名女性，获得资助的概率是：
- en: \[\mbox{Pr}(Y=1 \mid X=0) / \mbox{Pr}(Y=0 \mid X=0)\]
  id: totrans-283
  prefs: []
  type: TYPE_NORMAL
  zh: \[\mbox{Pr}(Y=1 \mid X=0) / \mbox{Pr}(Y=0 \mid X=0)\]
- en: 'and can be computed like this:'
  id: totrans-284
  prefs: []
  type: TYPE_NORMAL
  zh: 并可以按如下方式计算：
- en: '[PRE38]'
  id: totrans-285
  prefs: []
  type: TYPE_PRE
  zh: '[PRE38]'
- en: 'The odds ratio is the ratio for these two odds: how many times larger are the
    odds for men than for women?'
  id: totrans-286
  prefs: []
  type: TYPE_NORMAL
  zh: 概率比是这两个概率的比值：男性与女性的概率相比大多少倍？
- en: '[PRE39]'
  id: totrans-287
  prefs: []
  type: TYPE_PRE
  zh: '[PRE39]'
- en: We often see two-by-two tables written out as
  id: totrans-288
  prefs: []
  type: TYPE_NORMAL
  zh: 我们经常看到二维表以如下方式写出
- en: '|  | Men | Women |'
  id: totrans-289
  prefs: []
  type: TYPE_TB
  zh: '|  | 男性 | 女性 |'
- en: '| --- | --- | --- |'
  id: totrans-290
  prefs: []
  type: TYPE_TB
  zh: '| --- | --- | --- |'
- en: '| Awarded | a | b |'
  id: totrans-291
  prefs: []
  type: TYPE_TB
  zh: '| 获奖情况 | a | b |'
- en: '| Not Awarded | c | d |'
  id: totrans-292
  prefs: []
  type: TYPE_TB
  zh: '| 未获奖 | c | d |'
- en: In this case, the odds ratio is \(\frac{a/c}{b/d}\) which is equivalent to \((ad)
    / (bc)\)
  id: totrans-293
  prefs: []
  type: TYPE_NORMAL
  zh: 在这种情况下，概率比是 \(\frac{a/c}{b/d}\)，这相当于 \((ad) / (bc)\)
- en: 15.10.5 Confidence intervals for the odds ratio
  id: totrans-294
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 15.10.5 概率比的置信区间
- en: Computing confidence intervals for the odds ratio is not mathematically straightforward.
    Unlike other statistics, for which we can derive useful approximations of their
    distributions, the odds ratio is not only a ratio, but a ratio of ratios. Therefore,
    there is no simple way of using, for example, the CLT.
  id: totrans-295
  prefs: []
  type: TYPE_NORMAL
  zh: 计算概率比的置信区间在数学上并不简单。与其他统计量不同，对于其他统计量，我们可以推导出它们分布的有用近似，概率比不仅是一个比值，而且是比值的比值。因此，没有简单的方法可以使用，例如，中心极限定理。
- en: However, statistical theory tells us that when all four entries of the two-by-two
    table are large enough, then the log of the odds ratio is approximately normal
    with standard error
  id: totrans-296
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，统计理论告诉我们，当二维表的四个条目都足够大时，概率比的对数近似正态分布，标准误差
- en: \[ \sqrt{1/a + 1/b + 1/c + 1/d} \]
  id: totrans-297
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \sqrt{1/a + 1/b + 1/c + 1/d} \]
- en: 'This implies that a 95% confidence interval for the log odds ratio can be formed
    by:'
  id: totrans-298
  prefs: []
  type: TYPE_NORMAL
  zh: 这意味着可以通过以下方式形成对数概率比的 95% 置信区间：
- en: \[ \log\left(\frac{ad}{bc}\right) \pm 1.96 \sqrt{1/a + 1/b + 1/c + 1/d} \]
  id: totrans-299
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \log\left(\frac{ad}{bc}\right) \pm 1.96 \sqrt{1/a + 1/b + 1/c + 1/d} \]
- en: By exponentiating these two numbers we can construct a confidence interval of
    the odds ratio.
  id: totrans-300
  prefs: []
  type: TYPE_NORMAL
  zh: 通过对这两个数字进行指数化，我们可以构建概率比的置信区间。
- en: 'Using R we can compute this confidence interval as follows:'
  id: totrans-301
  prefs: []
  type: TYPE_NORMAL
  zh: 使用 R，我们可以按如下方式计算这个置信区间：
- en: '[PRE40]'
  id: totrans-302
  prefs: []
  type: TYPE_PRE
  zh: '[PRE40]'
- en: 'If we want to convert it back to the odds ratio scale, we can exponentiate:'
  id: totrans-303
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们想将其转换回概率比尺度，我们可以进行指数化：
- en: '[PRE41]'
  id: totrans-304
  prefs: []
  type: TYPE_PRE
  zh: '[PRE41]'
- en: 'Note that 1 is not included in the confidence interval which must mean that
    the p-value is smaller than 0.05\. We can confirm this using:'
  id: totrans-305
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，1 不包含在置信区间内，这意味着 p 值必须小于 0.05。我们可以使用以下方法来确认：
- en: '[PRE42]'
  id: totrans-306
  prefs: []
  type: TYPE_PRE
  zh: '[PRE42]'
- en: This is a slightly different p-value than that with the Chi-square test. This
    is because we are using a different asymptotic approximation to the null distribution.
    To learn more about inference and asymptotic theory for odds ratio, consult the
    *Generalized Linear Models* book by McCullagh and Nelder.
  id: totrans-307
  prefs: []
  type: TYPE_NORMAL
  zh: 这与卡方检验得到的p值略有不同。这是因为我们正在使用对零分布的不同渐近近似。要了解更多关于几率比推断和渐近理论的信息，请参阅McCullagh和Nelder的《广义线性模型》一书。
- en: 15.10.6 Small count correction
  id: totrans-308
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 15.10.6 小计数校正
- en: Note that the log odds ratio is not defined if any of the cells of the two-by-two
    table is 0\. This is because if \(a\), \(b\), \(c\), or \(d\) is 0, the \(\log(\frac{ad}{bc})\)
    is either the log of 0 or has a 0 in the denominator. For this situation, it is
    common practice to avoid 0s by adding 0.5 to each cell. This is referred to as
    the *Haldane–Anscombe correction* and has been shown, both in practice and theory,
    to work well.
  id: totrans-309
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，如果二维表的任何单元格为0，则对数几率比没有定义。这是因为如果\(a\)、\(b\)、\(c\)或\(d\)为0，则\(\log(\frac{ad}{bc})\)要么是0的对数，要么分母中有0。对于这种情况，通常的做法是通过将每个单元格加0.5来避免0。这被称为*哈达内-安科姆校正*，实践和理论都表明它效果很好。
- en: 15.10.7 Large samples, small p-values
  id: totrans-310
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 15.10.7 大样本，小p值
- en: 'As mentioned earlier, reporting only p-values is not an appropriate way to
    report the results of data analysis. In scientific journals, for example, some
    studies seem to overemphasize p-values. Some of these studies have large sample
    sizes and report impressively small p-values. Yet when one looks closely at the
    results, we realize odds ratios are quite modest: barely bigger than 1\. In this
    case the difference may not be *practically significant* or *scientifically significant*.'
  id: totrans-311
  prefs: []
  type: TYPE_NORMAL
  zh: 如前所述，仅报告p值不是报告数据分析结果的一种适当方式。例如，在科学期刊中，一些研究似乎过分强调p值。其中一些研究样本量很大，报告了令人印象深刻的非常小的p值。然而，当我们仔细查看结果时，我们会发现几率比相当适度：几乎大于1。在这种情况下，这种差异可能不是*实际显著*或*科学显著*。
- en: 'Note that the relationship between odds ratio and p-value is not one-to-one.
    It depends on the sample size. So a very small p-value does not necessarily mean
    a very large odds ratio. Notice what happens to the p-value if we multiply our
    two-by-two table by 10, which does not change the odds ratio:'
  id: totrans-312
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，几率比和p值之间的关系不是一对一的。它取决于样本量。因此，一个非常小的p值并不一定意味着一个非常大的几率比。注意如果我们将我们的二维表乘以10会发生什么，这不会改变几率比：
- en: '[PRE43]'
  id: totrans-313
  prefs: []
  type: TYPE_PRE
  zh: '[PRE43]'
- en: 15.11 Exercises
  id: totrans-314
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 15.11 练习
- en: 1\. A famous athlete has an impressive career, winning 70% of her 500 career
    matches. However, this athlete gets criticized because in important events, such
    as the Olympics, she has a losing record of 8 wins and 9 losses. Perform a Chi-square
    test to determine if this losing record can be simply due to chance as opposed
    to not performing well under pressure.
  id: totrans-315
  prefs: []
  type: TYPE_NORMAL
  zh: 1. 一位著名的运动员有着令人印象深刻的职业生涯，赢得了她500场比赛中的70%。然而，这位运动员因为在大事件中，例如奥运会，她有8胜9负的失利记录而受到批评。请执行卡方检验以确定这种失利记录是否可以简单地归因于偶然，而不是在压力下表现不佳。
- en: 2\. Why did we use the Chi-square test instead of Fisher’s exact test in the
    previous exercise?
  id: totrans-316
  prefs: []
  type: TYPE_NORMAL
  zh: 2. 为什么我们在上一个练习中使用了卡方检验而不是费舍尔精确检验？
- en: It actually does not matter, since they give the exact same p-value.
  id: totrans-317
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 实际上这并不重要，因为它们给出了完全相同的p值。
- en: Fisher’s exact and the Chi-square are different names for the same test.
  id: totrans-318
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 费舍尔精确检验和卡方检验是同一检验的不同名称。
- en: Because the sum of the rows and columns of the two-by-two table are not fixed
    so the hypergeometric distribution is not an appropriate assumption for the null
    hypothesis. For this reason, Fisher’s exact test is rarely applicable with observational
    data.
  id: totrans-319
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 因为二维表的行和列的总和不是固定的，所以超几何分布不是对零假设的适当假设。因此，费舍尔精确检验很少适用于观察数据。
- en: Because the Chi-square test runs faster.
  id: totrans-320
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 因为卡方检验运行得更快。
- en: 3\. Compute the odds ratio of “losing under pressure” along with a confidence
    interval.
  id: totrans-321
  prefs: []
  type: TYPE_NORMAL
  zh: 3. 计算在压力下“失败”的几率比以及置信区间。
- en: 4\. Notice that the p-value is larger than 0.05 but the 95% confidence interval
    does not include 1\. What explains this?
  id: totrans-322
  prefs: []
  type: TYPE_NORMAL
  zh: 4. 注意到p值大于0.05，但95%置信区间不包括1。这怎么解释？
- en: We made a mistake in our code.
  id: totrans-323
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我们在代码中犯了一个错误。
- en: These are based on t-statistics so the connection between p-value and confidence
    intervals does not apply.
  id: totrans-324
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 这些是基于t统计量的，所以p值和置信区间之间的联系不适用。
- en: Different approximations are used for the p-value and the confidence interval
    calculation. If we had a larger sample size the match would be better.
  id: totrans-325
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: p值和置信区间计算使用了不同的近似方法。如果我们有更大的样本量，匹配会更好。
- en: We should use the Fisher exact test to get confidence intervals.
  id: totrans-326
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我们应该使用费舍尔精确检验来获取置信区间。
- en: 5\. Multiply the two-by-two table by 2 and see if the p-value and confidence
    retrieval are a better match.
  id: totrans-327
  prefs: []
  type: TYPE_NORMAL
  zh: 5. 将2x2表格乘以2，看看p值和置信度检索是否更匹配。
