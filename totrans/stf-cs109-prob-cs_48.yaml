- en: Curse of Dimensionality
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 维度诅咒
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/examples/curse_of_dimensionality/](https://chrispiech.github.io/probabilityForComputerScientists/en/examples/curse_of_dimensionality/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/examples/curse_of_dimensionality/](https://chrispiech.github.io/probabilityForComputerScientists/en/examples/curse_of_dimensionality/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '***'
- en: In machine learning, like many fields of computer science, often involves high
    dimensional points, and high dimension spaces have some surprising probabilistic
    properties.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 在机器学习中，就像计算机科学的许多领域一样，经常涉及高维点，高维空间具有一些令人惊讶的概率性质。
- en: A random *value* $X_i$ is a Uni(0, 1).
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 一个随机的 *值* $X_i$ 是一个均匀分布的 Uni(0, 1)。
- en: 'A random *point* of dimension $d$ is a list of $d$ random values: $[X_1 \dots
    X_d]$.'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 一个随机 *点* 的维度为 $d$，是一个 $d$ 个随机值的列表：$[X_1 \dots X_d]$。
- en: '![](../Images/5dff7474c3d062d91ad5577d290f5e5f.png)'
  id: totrans-6
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/5dff7474c3d062d91ad5577d290f5e5f.png)'
- en: A random *value* $X_i$ is close to an edge if $X_i$ is less than 0.01 **or**
    $X_i$ is greater than 0.99\. What is the probability that a random value is close
    to an edge?
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 一个随机 *值* $X_i$ 接近边缘的条件是 $X_i$ 小于 0.01 **或者** $X_i$ 大于 0.99。一个随机值接近边缘的概率是多少？
- en: Let $E$ be the event that a random value is close to an edge. $P(E) = P(X_i
    < 0.01) + P(X_i > 0.99) = 0.02$
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $E$ 为随机值接近边缘的事件。$P(E) = P(X_i < 0.01) + P(X_i > 0.99) = 0.02$
- en: A random *point* $[X_1, X_2, X_3]$ of dimension $3$ is close to an edge if *any*
    of its values are close to an edge. What is the probability that a $3$ dimensional
    point is close to an edge?
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 一个随机 *点* $[X_1, X_2, X_3]$ 的维度为 $3$，如果其 *任何* 值接近边缘，则该点接近边缘。一个三维点接近边缘的概率是多少？
- en: 'The event is equivalent to the complement of none of the dimensions of the
    point is close to an edge, which is: $1 - (1 - P(E))^3 = 1 - 0.98^3 \approx 0.058$'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 该事件等价于点的 *任何* 维度都不接近边缘的补事件，即：$1 - (1 - P(E))^3 = 1 - 0.98^3 \approx 0.058$
- en: A random *point* $[X_1, \dots X_{100}]$ of dimension $100$ is close to an edge
    if *any* of its values are close to an edge. What is the probability that a 100
    dimensional point is close to an edge?
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 一个随机 *点* $[X_1, \dots X_{100}]$ 的维度为 $100$，如果其 *任何* 值接近边缘，则该点接近边缘。一个100维点接近边缘的概率是多少？
- en: 'Similarly, it is: $1 - (1 - P(E))^{100} = 1 - 0.98^{100} \approx 0.867$There
    are many other phenomena of high dimensional points: such as, the euclidean distance
    between points starts to converge.'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 同样地，它是：$1 - (1 - P(E))^{100} = 1 - 0.98^{100} \approx 0.867$。存在许多其他高维点的高维现象：例如，点之间的欧几里得距离开始收敛。
