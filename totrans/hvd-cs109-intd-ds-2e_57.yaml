- en: High Dimensional Data
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 高维数据
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/highdim/intro-highdim.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/highdim/intro-highdim.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/highdim/intro-highdim.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/highdim/intro-highdim.html)
- en: High-dimensional datasets are increasingly common in modern data analysis, especially
    in fields like genomics, image processing, natural language processing, and recommender
    systems. There is a variety of computational techniques and statistical concepts
    that are useful for analyzing datasets in which each observation is associated
    with a large number of numerical variables. In this part of the book, we introduce
    ideas that are useful in the analysis of these high-dimensional datasets. Specifically,
    we provide brief introductions to linear algebra, dimension reduction, matrix
    factorization, and regularization. As motivating examples, we use handwritten
    digit recognition and movie recommendation systems, both of which involve high-dimensional
    datasets with hundreds or thousands of variables per observation. We start this
    part of the book by demonstrating how to work with matrices in R.
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 在现代数据分析中，高维数据集越来越普遍，尤其是在基因组学、图像处理、自然语言处理和推荐系统等领域。存在各种计算技术和统计概念，这些对于分析每个观测值都关联有大量数值变量的数据集非常有用。在本部分书中，我们介绍了在分析这些高维数据集时有用的想法。具体来说，我们提供了对线性代数、降维、矩阵分解和正则化的简要介绍。作为激励示例，我们使用了手写数字识别和电影推荐系统，这两个系统都涉及具有数百或数千个变量的高维数据集。我们通过演示如何在R中处理矩阵来开始本书的这一部分。
- en: One specific task we use to motivate linear algebra is measuring the similarity
    between two handwritten digits. Because each digit is represented by \(28 \times
    28 = 784\) pixel values, we cannot simply subtract two vectors as we would in
    a one-dimensional setting. Instead, we treat each observation as a *point* in
    a *high-dimensional* space and use a mathematical definition of *distance* to
    quantify similarity. Many machine learning techniques introduced later in the
    book rely on this geometric interpretation.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 我们使用的一个特定任务来激发线性代数的应用是测量两个手写数字之间的相似度。因为每个数字都由 \(28 \times 28 = 784\) 个像素值表示，所以我们不能像在一维设置中那样简单地减去两个向量。相反，我们将每个观测值视为一个
    *点* 在一个 *高维* 空间中，并使用 *距离* 的数学定义来量化相似度。书中后面介绍的大多数机器学习技术都依赖于这种几何解释。
- en: 'We also use this high-dimensional concept of distance to motivate dimension
    reduction, a set of techniques that summarize high-dimensional data in lower-dimensional
    representations that are easier to visualize and analyze, while preserving the
    essential *information*. Distance between observations provides a concrete example:
    we aim to reduce the number of variables while preserving the pairwise distances
    between observations as much as possible. This leads naturally to matrix factorization
    methods, which arise from the mathematical structure underlying these techniques.'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 我们还使用这种高维距离概念来激发降维的动机，降维是一组技术，它以低维表示总结高维数据，这些表示更容易可视化和分析，同时保留关键 *信息*。观测值之间的距离提供了一个具体的例子：我们旨在减少变量的数量，同时尽可能多地保留观测值之间的成对距离。这自然地导致了矩阵分解方法，这些方法源于这些技术背后的数学结构。
- en: Finally, we introduce the concept of regularization, which is useful when analyzing
    high-dimensional data. In many applications, the large number of variables increases
    the risk of overfitting or cherry-picking results that appear significant by chance.
    Regularization provides a mathematically principled way to constrain models, improve
    generalization, and avoid misleading conclusions.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 最后，我们引入正则化的概念，这在分析高维数据时非常有用。在许多应用中，大量变量增加了过拟合或选择性地挑选出偶然看似显著的结果的风险。正则化提供了一种数学上原则性的方法来约束模型，提高泛化能力，并避免误导性的结论。
- en: Together, these topics lay the groundwork for understanding and implementing
    many of the machine learning techniques we cover in the next part of the book.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 这些主题共同为理解并实现本书下一部分所涵盖的许多机器学习技术奠定了基础。
