    stretchy="true">⏟</mo></munder><mrow><mtext>方差</mtext><mi>δ</mi><mo stretchy="false">(</mi><mi>x</mi><mo
    stretchy="false">)</mo></mrow></munder><mo>+</mo><mo fence="false" stretchy="true"
    minsize="1.2em" maxsize="1.2em">(</mo><munder><munder><mrow><mover accent="true"><mi>δ</mi><mo>ˉ</mo></mover><mo>−</mo><mi>θ</mi></mrow><mo
    stretchy="true">⏟</mo></munder><mrow><mtext>偏差</mtext><mi>δ</mi><mo stretchy="false">(</mi><mi>x</mi><mo
    stretchy="false">)</mo><mo stretchy="false">)</mo></mrow></munder><msup><mo fence="false"
    stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mn>2</mn></msup></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} R(θ) &= E_{x|θ}\Big[\big( \delta(x)
    - E_{x|θ}[\delta(x)] + E_{x|θ}[\delta(x)] - θ \big)^2\Big] \\ &= E_{x|θ}\Big[\big(
    \delta - \bar{\delta} + \bar{\delta} - θ \big)^2\Big] \\ &= E_{x|θ}\Big[ \big(\delta
    - \bar{\delta}\big)^2 + \underbrace{2\big(\delta - \bar{\delta}\big)\big(\bar{\delta}
    - \theta\big)}_{=0} + \big(\bar{\delta} - \theta\big)^2 \Big] \\ &= E_{x|θ}\Big[\big(\delta
    - \bar{\delta}\big)^2\Big] + E_{x|θ}\Big[\big(\bar{\delta} - \theta\big)^2\Big]
    \\ &= \underbrace{E_{x|θ}\Big[\big(\delta - \bar{\delta}\big)^2\Big]}_{\text{方差
    of }\delta(x)} + \big(\underbrace{\bar{\delta} - \theta}_{\text{偏差 of }\delta(x))}\big)^2
    \\ \end{align}</annotation></semantics>R(θ) = Ex∣θ​[(δ(x)−Ex∣θ​[δ(x)]+Ex∣θ​[δ(x)]−θ)2]=Ex∣θ​[(δ−δˉ+δˉ−θ)2]=Ex∣θ​[(δ−δˉ)2+=02(δ−δˉ)(δˉ−θ)​​+(δˉ−θ)2]=Ex∣θ​[(δ−δˉ)2]+Ex∣θ​[(δˉ−θ)2]=方差
    of δ(x)Ex∣θ​[(δ−δˉ)2]​​+(偏差 of δ(x))δˉ−θ​​)2​​[(8)](#b4pLjFHZaU "链接到这个方程")
- en: We’ve shown that for the <semantics><mrow><msub><mi mathvariant="normal">ℓ</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">\ell_2</annotation></semantics>ℓ2​ loss, the frequentist
    risk is the sum of two terms, called the **variance** and the square of the **bias**.
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: 我们已经证明，对于<semantics><mrow><msub><mi mathvariant="normal">ℓ</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">\ell_2</annotation></semantics>ℓ2​损失，频率主义风险是两个项的和，称为**方差**和**偏差**的平方。
- en: 'The **variance**, <semantics><mrow><msub><mi>E</mi><mrow><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mo
    fence="false" stretchy="true" minsize="1.8em" maxsize="1.8em">[</mo><mo fence="false"
    stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo>−</mo><msub><mi>E</mi><mrow><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mo
    stretchy="false">[</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo
    stretchy="false">]</mo><msup><mo fence="false" stretchy="true" minsize="1.2em"
    maxsize="1.2em">)</mo><mn>2</mn></msup><mo fence="false" stretchy="true" minsize="1.8em"
    maxsize="1.8em">]</mo></mrow><annotation encoding="application/x-tex">E_{x|\theta}\Big[\big(\delta(x)
    - E_{x|\theta}[\delta(x)]\big)^2\Big]</annotation></semantics>Ex∣θ​[(δ(x)−Ex∣θ​[δ(x)])2],
    answers the question: as the data varies, how far away will <semantics><mrow><mi>δ</mi></mrow><annotation
    encoding="application/x-tex">\delta</annotation></semantics>δ be from its average
    value? In general, if your procedure <semantics><mrow><mi>δ</mi></mrow><annotation
    encoding="application/x-tex">\delta</annotation></semantics>δ is very sensitive
    to variations in the data, your variance will be high.'
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
  zh: '**方差**，<semantics><mrow><msub><mi>E</mi><mrow><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mo
    fence="false" stretchy="true" minsize="1.8em" maxsize="1.8em">[</mo><mo fence="false"
    stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo>−</mo><msub><mi>E</mi><mrow><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mo
    stretchy="false">[</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo
    stretchy="false">]</mo><msup><mo fence="false" stretchy="true" minsize="1.2em"
    maxsize="1.2em">)</mo><mn>2</mn></msup><mo fence="false" stretchy="true" minsize="1.8em"
    maxsize="1.8em">]</mo></mrow><annotation encoding="application/x-tex">E_{x|\theta}\Big[\big(\delta(x)
    - E_{x|\theta}[\delta(x)]\big)^2\Big]</annotation></semantics>Ex∣θ​[(δ(x)−Ex∣θ​[δ(x)])2]，回答了这样一个问题：当数据变化时，δ与它的平均值会有多远？一般来说，如果你的程序δ对数据的变动非常敏感，你的方差将会很高。'
- en: 'The **bias**, <semantics><mrow><msub><mi>E</mi><mrow><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mo
    stretchy="false">[</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo
    stretchy="false">]</mo><mo>−</mo><mi>θ</mi></mrow><annotation encoding="application/x-tex">E_{x|\theta}[\delta(x)]
    - \theta</annotation></semantics>Ex∣θ​[δ(x)]−θ, answers the question: how far
    is the average value of <semantics><mrow><mi>δ</mi></mrow><annotation encoding="application/x-tex">\delta</annotation></semantics>δ
    from the true parameter <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ?
    In general, if your procedure <semantics><mrow><mi>δ</mi></mrow><annotation encoding="application/x-tex">\delta</annotation></semantics>δ
    does a good job of capturing the complexity of predicting <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ, your bias will
    be low.'
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: '**偏差**，<semantics><mrow><msub><mi>E</mi><mrow><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mo
    stretchy="false">[</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo
    stretchy="false">]</mo><mo>−</mo><mi>θ</mi></mrow><annotation encoding="application/x-tex">E_{x|\theta}[\delta(x)]
    - \theta</annotation></semantics>Ex∣θ​[δ(x)]−θ，回答了这样一个问题：δ的平均值与真实参数θ的距离有多远？一般来说，如果你的程序δ很好地捕捉了预测θ的复杂性，你的偏差将会很低。'
- en: 'When trying to reduce the risk (average loss), most methods try to reduce the
    variance and/or the bias. Many methods for estimation and prediction try to deal
    with the tradeoff between variance and bias: ideally we’d like both to be as small
    as possible, but we often need to accept a little more of one in order to make
    big reductions in the other.'
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: 当试图降低风险（平均损失）时，大多数方法试图降低方差和/或偏差。许多用于估计和预测的方法试图处理方差和偏差之间的权衡：理想情况下，我们希望两者都尽可能小，但通常我们需要接受其中之一稍微大一些，以换取另一个的大幅减少。
- en: Bayes risk[¶](#bayes-risk "Link to this Section")
  id: totrans-57
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 贝叶斯风险[¶](#bayes-risk "链接到这个部分")
- en: 'The two risks above are obtained by taking the expectation with respect to
    either the data <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x
    or the parameter <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ.
    What if we take the expectation with respect to both? The **Bayes risk** is exactly
    that:'
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 上面的两个风险是通过分别对数据<semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x或参数<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ取期望得到的。如果我们同时对两者取期望呢？**贝叶斯风险**正是这样：
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>R</mi><mo stretchy="false">(</mo><mi>δ</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mrow><mi>x</mi><mo
    separator="true">,</mo><mi>θ</mi></mrow></msub><mo stretchy="false">[</mo><mi
    mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo stretchy="false">)</mo><mo
    stretchy="false">]</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mi>θ</mi></msub><mo stretchy="false">[</mo><mi>R</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mi>x</mi></msub><mo
    stretchy="false">[</mo><mi>R</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo
    stretchy="false">]</mo></mrow></mstyle></mtd></mtr></mtable><annotation encoding="application/x-tex">\begin{align*}
    R(\delta) &= E_{x, \theta} [\ell(\delta(x), \theta)] \\ &= E_\theta [R(\theta)]
    \\ &= E_x [R(x)] \end{align*}</annotation></semantics>R(δ)​=Ex,θ​[ℓ(δ(x),θ)]=Eθ​[R(θ)]=Ex​[R(x)]​[(9)](#XPlJEC9IFx
    "Link to this Equation")
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>R</mi><mo stretchy="false">(</mo><mi>δ</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mrow><mi>x</mi><mo
    separator="true">,</mo><mi>θ</mi></mrow></msub><mo stretchy="false">[</mo><mi
    mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo stretchy="false">)</mo><mo
    stretchy="false">]</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mi>θ</mi></msub><mo stretchy="false">[</mo><mi>R</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mi>x</mi></msub><mo
    stretchy="false">[</mo><mi>R</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo
    stretchy="false">]</mo></mrow></mstyle></mtd></mtr></mtable><annotation encoding="application/x-tex">\begin{align*}
    R(\delta) &= E_{x, \theta} [\ell(\delta(x), \theta)] \\ &= E_\theta [R(\theta)]
    \\ &= E_x [R(x)] \end{align*}</annotation></semantics>R(δ) = Ex,θ[ℓ(δ(x),θ)] =
    Eθ[R(θ)] = Ex[R(x)] [(9)](#XPlJEC9IFx "链接到这个方程")
- en: 'where the last two inequalities follow from Fubini’s theorem (i.e., that we
    can do the integrals for the expectations in either order and get the same result).
    The Bayes risk is a single number that summarizes the procedure <semantics><mrow><mi>δ</mi></mrow><annotation
    encoding="application/x-tex">\delta</annotation></semantics>δ. The name is somewhat
    misleading: it isn’t really Bayesian or frequentist.'
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: 其中最后两个不等式由Fubini定理得出（即，我们可以以任意顺序对期望值进行积分并得到相同的结果）。贝叶斯风险是一个单一数字，它总结了<semantics><mrow><mi>δ</mi></mrow><annotation
    encoding="application/x-tex">\delta</annotation></semantics>δ的过程。这个名字有些误导：它实际上既不是贝叶斯也不是频率主义的。
