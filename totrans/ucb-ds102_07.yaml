    stretchy="true">⏞</mo></mover><mrow><mo>=</mo><mn>0</mn></mrow></mover><mo>−</mo><mi>θ</mi><msup><mo
    fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mn>2</mn></msup><mo
    fence="false" stretchy="true" minsize="1.8em" maxsize="1.8em">]</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mrow><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mo fence="false" stretchy="true"
    minsize="1.8em" maxsize="1.8em">[</mo><mo fence="false" stretchy="true" minsize="1.2em"
    maxsize="1.2em">(</mo><munder><munder><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo>−</mo><msub><mi>E</mi><mrow><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mo
    stretchy="false">[</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo
    stretchy="false">]</mo></mrow><mo stretchy="true">⏟</mo></munder><mtext>prediction minus avg. prediction</mtext></munder><mo>+</mo><munder><munder><mrow><msub><mi>E</mi><mrow><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mo stretchy="false">[</mo><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo><mo>−</mo><mi>θ</mi></mrow><mo
    stretchy="true">⏟</mo></munder><mtext>avg. prediction minus true value</mtext></munder><msup><mo
    fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mn>2</mn></msup><mo
    fence="false" stretchy="true" minsize="1.8em" maxsize="1.8em">]</mo></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} R(\theta) &= E_{x|\theta}\Big[\big(\delta(x)
    - \theta\big)^2\Big] \\ &= E_{x|\theta}\Big[\big( \delta(x) \overbrace{- E_{x|\theta}[\delta(x)]
    + E_{x|\theta}[\delta(x)]}^{=0} - \theta \big)^2\Big] \\ &= E_{x|\theta}\Big[\big(
    \underbrace{\delta(x) - E_{x|\theta}[\delta(x)]}_{\text{prediction minus avg.
    prediction}} + \underbrace{E_{x|\theta}[\delta(x)] - \theta}_{\text{avg. prediction
    minus true value}} \big)^2\Big] \\ \end{align}</annotation></semantics>R(θ)​=Ex∣θ​[(δ(x)−θ)2]=Ex∣θ​[(δ(x)−Ex∣θ​[δ(x)]+Ex∣θ​[δ(x)]​=0​−θ)2]=Ex∣θ​[(prediction minus avg. predictionδ(x)−Ex∣θ​[δ(x)]​​+avg. prediction minus true valueEx∣θ​[δ(x)]−θ​​)2]​​[(7)](#aOoeICnWkO
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'To make the math a little easier to read, we’ll write <semantics><mrow><mi>δ</mi><mo>=</mo><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation
