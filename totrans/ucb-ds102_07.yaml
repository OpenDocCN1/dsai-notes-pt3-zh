- en: Up until now, we’ve used error rates to help us understand tradeoffs in binary
    decision-making. In this section, we’ll introduce a more general theoretical framework
    to understand and quantify errors we make, and start to explore the theoretical
    branch of statistics known as **statistical decision theory**.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 迄今为止，我们一直使用错误率来帮助我们理解二进制决策中的权衡。在本节中，我们将介绍一个更通用的理论框架来理解和量化我们所犯的错误，并开始探索统计学的一个理论分支，即**统计决策理论**。
- en: 'Remember our setup: we have some **unknown quantity** <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ that we’re interested
    in. We collect data <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x.
    Our data are random, and come from the distribution <semantics><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(x|\theta)</annotation></semantics>p(x∣θ).
    We use the data to reason about <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ. Often, we’ll want
    to use the data to compute an estimate for <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ but sometimes, we
    may want to do something slightly different. In order to describe “the thing we
    do to the data”, we’ll use the notation <semantics><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\delta(x)</annotation></semantics>δ(x).
    This represents the result of applying some procedure <semantics><mrow><mi>δ</mi></mrow><annotation
    encoding="application/x-tex">\delta</annotation></semantics>δ to the data. For
    example, <semantics><mrow><mi>δ</mi></mrow><annotation encoding="application/x-tex">\delta</annotation></semantics>δ
    might be the sample average of many data points, or the result of logistic regression.
    The obvious next question is: how do we choose which procedure <semantics><mrow><mi>δ</mi></mrow><annotation
    encoding="application/x-tex">\delta</annotation></semantics>δ to use? We’ll decide
    by quantifying how “good” each <semantics><mrow><mi>δ</mi></mrow><annotation encoding="application/x-tex">\delta</annotation></semantics>δ
    is, and then trying to choose the “best” one.'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 记住我们的设置：我们有一些**未知量**<semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ，这是我们感兴趣的。我们收集数据<semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x。我们的数据是随机的，并来自分布<semantics><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(x|\theta)</annotation></semantics>p(x∣θ)。我们使用数据来推理<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ。通常，我们希望使用数据来计算<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ的估计值，但有时我们可能想做一些不同的事情。为了描述“我们对数据进行的事情”，我们将使用符号<semantics><mrow><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\delta(x)</annotation></semantics>δ(x)。这代表了对数据应用某些程序<semantics><mrow><mi>δ</mi></mrow><annotation
    encoding="application/x-tex">\delta</annotation></semantics>δ的结果。例如，<semantics><mrow><mi>δ</mi></mrow><annotation
    encoding="application/x-tex">\delta</annotation></semantics>δ可能是许多数据点的样本平均值，或者是逻辑回归的结果。显然的下一个问题是：我们如何选择使用哪个程序<semantics><mrow><mi>δ</mi></mrow><annotation
    encoding="application/x-tex">\delta</annotation></semantics>δ？我们将通过量化每个<semantics><mrow><mi>δ</mi></mrow><annotation
    encoding="application/x-tex">\delta</annotation></semantics>δ的“好”程度来决定，然后尝试选择“最好”的一个。
- en: '“Good” is a very abstract notion: to quantify it, we’ll need a quantitative
    measure of how good (or to be more precise, how bad) our procedure <semantics><mrow><mi>δ</mi></mrow><annotation
    encoding="application/x-tex">\delta</annotation></semantics>δ is. We’ll call this
    a **loss function**. Notationally, we’ll write <semantics><mrow><mi mathvariant="normal">ℓ</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mo separator="true">,</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\ell(\theta,
    \delta(x))</annotation></semantics>ℓ(θ,δ(x)) to represent the loss associated
    with the outcome <semantics><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\delta(x)</annotation></semantics>δ(x)
    if the true value is <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ.
    To summarize:'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: “好”是一个非常抽象的概念：为了量化它，我们需要一个量化的指标来衡量我们的程序<semantics><mrow><mi>δ</mi></mrow><annotation
    encoding="application/x-tex">\delta</annotation></semantics>δ的优劣（或者更精确地说，是好坏）。我们将称之为**损失函数**。在符号上，我们将用<semantics><mrow><mi
    mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>θ</mi><mo separator="true">,</mo><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\ell(\theta, \delta(x))</annotation></semantics>ℓ(θ,δ(x))来表示与结果<semantics><mrow><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\delta(x)</annotation></semantics>δ(x)相关的损失，如果真实值是<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ。为了总结：
- en: '<semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"
    rowlines="solid none none none none"><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>Variable/notation</mtext></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mtext>What it means</mtext></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mi>θ</mi></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mtext>unknown quantity/quantities of interest: parameter(s)</mtext></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mi>x</mi></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mtext>observed data</mtext></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mrow><mtext>probability distribution for data </mtext><mstyle
    scriptlevel="0" displaystyle="false"><mi>x</mi></mstyle><mtext> (depends on </mtext><mstyle
    scriptlevel="0" displaystyle="false"><mi>θ</mi></mstyle><mtext>)</mtext></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mrow><mtext>decision or result computed from </mtext><mstyle
    scriptlevel="0" displaystyle="false"><mi>x</mi></mstyle><mtext>, often an estimate of </mtext><mstyle
    scriptlevel="0" displaystyle="false"><mi>θ</mi></mstyle></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mrow><mtext>loss (badness) for output </mtext><mstyle
    scriptlevel="0" displaystyle="false"><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mstyle><mtext> and true parameter(s) </mtext><mstyle
    scriptlevel="0" displaystyle="false"><mi>θ</mi></mstyle></mrow></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} \text{Variable/notation} & \quad \text{What
    it means} \\ \hline \theta & \quad \text{unknown quantity/quantities of interest:
    parameter(s)} \\ x & \quad \text{observed data} \\ p(x|\theta) & \quad \text{probability
    distribution for data $x$ (depends on $\theta$)} \\ \delta(x) & \quad \text{decision
    or result computed from $x$, often an estimate of $\theta$} \\ \ell(\delta(x),
    \theta) & \quad \text{loss (badness) for output $\delta(x)$ and true parameter(s)
    $\theta$} \end{align*}</annotation></semantics>Variable/notationθxp(x∣θ)δ(x)ℓ(δ(x),θ)​What it meansunknown quantity/quantities of interest: parameter(s)observed dataprobability distribution for data x (depends on θ)decision or result computed from x, often an estimate of θloss (badness) for output δ(x) and true parameter(s) θ​​[(1)](#gH2ps2QkLj
    "Link to this Equation")'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"
    rowlines="solid none none none none"><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>变量/符号</mtext></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mtext>它代表什么</mtext></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mi>θ</mi></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mtext>未知量/感兴趣的数量：参数</mtext></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mi>x</mi></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mtext>观测数据</mtext></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mrow><mtext>数据 $x$ 的概率分布</mtext><mstyle
    scriptlevel="0" displaystyle="false"><mi>x</mi></mstyle><mtext>（依赖于 $\theta$）</mtext></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mrow><mtext>从
    $x$ 计算出的决策或结果</mtext><mstyle scriptlevel="0" displaystyle="false"><mi>x</mi></mstyle><mtext>，通常是
    $\theta$ 的估计</mtext></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mi mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mrow><mtext>输出
    $\delta(x)$ 和真实参数 $\theta$ 的损失（坏度）</mtext></mrow></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} \text{变量/符号} & \quad \text{它代表什么}
    \\ \hline \theta & \quad \text{未知量/感兴趣的数量：参数} \\ x & \quad \text{观测数据} \\ p(x|\theta)
    & \quad \text{数据 $x$ 的概率分布（依赖于 $\theta$）} \\ \delta(x) & \quad \text{从 $x$ 计算出的决策或结果，通常是
    $\theta$ 的估计} \\ \ell(\delta(x), \theta) & \quad \text{输出 $\delta(x)$ 和真实参数 $\theta$
    的损失（坏度）} \end{align*}</annotation></semantics>变量/符号θxp(x∣θ)δ(x)ℓ(δ(x),θ)它代表什么未知量/感兴趣的数量：参数观测数据数据
    $x$ 的概率分布（依赖于 $\theta$）从 $x$ 计算出的决策或结果，通常是 $\theta$ 的估计输出 $\delta(x)$ 和真实参数 $\theta$
    的损失（坏度）[(1)](#gH2ps2QkLj "链接到这个方程")
- en: Examples[¶](#examples "Link to this Section")
  id: totrans-7
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 示例[¶](#examples "链接到本节")
- en: 'That’s a very abstract definition: let’s make it more concrete with a few examples.'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 这是一个非常抽象的定义：让我们通过几个例子使其更加具体。
- en: 'Binary decision: 0-1 loss[¶](#binary-decision-0-1-loss "Link to this Section")'
  id: totrans-9
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 二元决策：0-1 损失[¶](#binary-decision-0-1-loss "链接到本节")
- en: 'For our first example, we’ll return to our binary decision-making setting.
    In that case:'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 在我们的第一个例子中，我们将回到我们的二元决策环境。在这种情况下：
- en: Our unknown parameter <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    is binary, and corresponds to reality, which we’ve been calling <semantics><mrow><mi>R</mi></mrow><annotation
    encoding="application/x-tex">R</annotation></semantics>R.
  id: totrans-11
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 我们未知的参数 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    是二元的，并且对应于现实，我们一直称之为 <semantics><mrow><mi>R</mi></mrow><annotation encoding="application/x-tex">R</annotation></semantics>R。
- en: Our data <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x
    were whatever we used to compute the p-value.
  id: totrans-12
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 我们的数据 <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x
    是我们用来计算 p 值的任何数据。
- en: The decision <semantics><mrow><mi>δ</mi></mrow><annotation encoding="application/x-tex">\delta</annotation></semantics>δ
    is a binary decision, which we’ve been calling <semantics><mrow><mi>D</mi></mrow><annotation
    encoding="application/x-tex">D</annotation></semantics>D.
  id: totrans-13
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 决策 <semantics><mrow><mi>δ</mi></mrow><annotation encoding="application/x-tex">\delta</annotation></semantics>δ
    是一个二元决策，我们一直称之为 <semantics><mrow><mi>D</mi></mrow><annotation encoding="application/x-tex">D</annotation></semantics>D。
- en: '|  | D = <semantics><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\delta(x)</annotation></semantics>δ(x) = 0
    | D = <semantics><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\delta(x)</annotation></semantics>δ(x) = 1 |'
  id: totrans-14
  prefs: []
  type: TYPE_TB
  zh: '|  | D = <semantics><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\delta(x)</annotation></semantics>δ(x) = 0
    | D = <semantics><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\delta(x)</annotation></semantics>δ(x) = 1 |'
- en: '| <semantics><mrow><mi>R</mi><mo>=</mo><mi>θ</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">R=\theta=0</annotation></semantics>R=θ=0 | TN loss
    | FP loss |'
  id: totrans-15
  prefs: []
  type: TYPE_TB
  zh: '| <semantics><mrow><mi>R</mi><mo>=</mo><mi>θ</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">R=\theta=0</annotation></semantics>R=θ=0 | TN 损失
    | FP 损失 |'
- en: '| <semantics><mrow><mi>R</mi><mo>=</mo><mi>θ</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">R=\theta=1</annotation></semantics>R=θ=1 | FN loss
    | TP loss |'
  id: totrans-16
  prefs: []
  type: TYPE_TB
  zh: '| <semantics><mrow><mi>R</mi><mo>=</mo><mi>θ</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">R=\theta=1</annotation></semantics>R=θ=1 | FN 损失
    | TP 损失 |'
- en: 'Here are a few concrete examples, and what each of these quantities would represent:'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 这里有一些具体的例子，以及每个这些量代表什么：
- en: '| Example | Unknown <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    / <semantics><mrow><mi>R</mi></mrow><annotation encoding="application/x-tex">R</annotation></semantics>R
    | Data <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x
    | Decision <semantics><mrow><mi>δ</mi></mrow><annotation encoding="application/x-tex">\delta</annotation></semantics>δ
    / <semantics><mrow><mi>D</mi></mrow><annotation encoding="application/x-tex">D</annotation></semantics>D
    |'
  id: totrans-18
  prefs: []
  type: TYPE_TB
  zh: '| 示例 | 未知 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    / <semantics><mrow><mi>R</mi></mrow><annotation encoding="application/x-tex">R</annotation></semantics>R
    | 数据 <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x
    | 决策 <semantics><mrow><mi>δ</mi></mrow><annotation encoding="application/x-tex">\delta</annotation></semantics>δ
    / <semantics><mrow><mi>D</mi></mrow><annotation encoding="application/x-tex">D</annotation></semantics>D
    |'
- en: '| Disease testing | Whether a person has a disease | Collected clinical data
    (blood sample, vital signs, etc.) | Should we give the person treatments for that
    disease? |'
  id: totrans-19
  prefs: []
  type: TYPE_TB
  zh: '| 疾病检测 | 一个人是否有疾病 | 收集的临床数据（血液样本、生命体征等） | 我们是否应该给这个人治疗这种疾病？ |'
- en: '| Finding oil wells | Whether underground oil exists in a certain area | Readings
    from seismic sensors, etc. | Should we drill for oil in this location? |'
  id: totrans-20
  prefs: []
  type: TYPE_TB
  zh: '| 寻找油井 | 某个区域地下是否存在石油 | 地震传感器读数等 | 我们是否应该在这一点上钻油井？ |'
- en: '| Product recommendation | Will a user buy this product? | User behavior, interest
    in similar products, etc. | Should we recommend the product to the user? |'
  id: totrans-21
  prefs: []
  type: TYPE_TB
  zh: '| 产品推荐 | 用户是否会购买此产品？ | 用户行为，对类似产品的兴趣等 | 我们是否应该向用户推荐此产品？ |'
- en: 'Note that we haven’t really talked much about <semantics><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(x|\theta)</annotation></semantics>p(x∣θ),
    since we’ve been working with <semantics><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\delta(x)</annotation></semantics>δ(x)
    directly: we’ll discuss this more in the next chapter.'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，我们并没有真正讨论很多关于<semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(x|\theta)</annotation></semantics>p(x∣θ)，因为我们一直在直接使用<semantics><mrow><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\delta(x)</annotation></semantics>δ(x)：我们将在下一章中进一步讨论这个问题。
- en: 'Our loss function will depend on the problem we’re solving. Since in this case,
    both the inputs (<semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ/<semantics><mrow><mi>R</mi></mrow><annotation
    encoding="application/x-tex">R</annotation></semantics>R and <semantics><mrow><mi>δ</mi></mrow><annotation
    encoding="application/x-tex">\delta</annotation></semantics>δ/<semantics><mrow><mi>D</mi></mrow><annotation
    encoding="application/x-tex">D</annotation></semantics>D) are binary, we can write
    the loss in a 2x2 table that looks exactly like the ones we’ve seen before. If
    both kinds of error (false positive and false negative) are equally bad, we can
    use the simplest loss function, the **0-1 loss**:'
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 我们的目标函数将取决于我们正在解决的问题。由于在这个案例中，输入（<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ/<semantics><mrow><mi>R</mi></mrow><annotation
    encoding="application/x-tex">R</annotation></semantics>R 和 <semantics><mrow><mi>δ</mi></mrow><annotation
    encoding="application/x-tex">\delta</annotation></semantics>δ/<semantics><mrow><mi>D</mi></mrow><annotation
    encoding="application/x-tex">D</annotation></semantics>D）都是二进制的，我们可以将损失写成类似于我们之前见过的2x2表格。如果两种错误（误报和漏报）同样糟糕，我们可以使用最简单的损失函数，即**0-1损失**：
- en: <semantics><mrow><mi mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo
    stretchy="false">)</mo><mo>=</mo><mrow><mo fence="true">{</mo><mtable rowspacing="0.36em"
    columnalign="left left" columnspacing="1em"><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="false"><mn>0</mn></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mtext>if </mtext><mi>θ</mi><mo>=</mo><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="false"><mn>1</mn></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="false"><mrow><mtext>if </mtext><mi>θ</mi><mo mathvariant="normal">≠</mo><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr></mtable></mrow></mrow><annotation
    encoding="application/x-tex">\ell(\delta(x), \theta) = \begin{cases} 0 & \text{if
    }\theta = \delta(x) \\ 1 & \text{if }\theta \neq \delta(x) \end{cases}</annotation></semantics>ℓ(δ(x),θ)={01​if θ=δ(x)if θ=δ(x)​[(2)](#zx5WJvzJH5
    "Link to this Equation")
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo
    stretchy="false">)</mo><mo>=</mo><mrow><mo fence="true">{</mo><mtable rowspacing="0.36em"
    columnalign="left left" columnspacing="1em"><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="false"><mn>0</mn></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mtext>if 
    </mtext><mi>θ</mi><mo>=</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="false"><mn>1</mn></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mtext>if 
    </mtext><mi>θ</mi><mo mathvariant="normal">≠</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd></mtr></mtable></mrow></mrow><annotation
    encoding="application/x-tex">\ell(\delta(x), \theta) = \begin{cases} 0 & \text{if
    }\theta = \delta(x) \\ 1 & \text{if }\theta \neq \delta(x) \end{cases}</annotation></semantics>ℓ(δ(x),θ)={01​if θ=δ(x)if θ=δ(x)​[(2)](#zx5WJvzJH5
    "链接到这个方程")
- en: '**Exercise**: Suppose we have a situation where a false positive is five times
    worse than a false negative. How would you write the loss function?'
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: '**练习**：假设我们有一个情况，误报比漏报糟糕五倍。你会如何编写损失函数？'
- en: 'Continuous decision: <semantics><mrow><msub><mi mathvariant="normal">ℓ</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">\ell_2</annotation></semantics>ℓ2​ loss[¶](#continuous-decision-ell-2-loss
    "Link to this Section")'
  id: totrans-26
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 连续决策：<semantics><mrow><msub><mi mathvariant="normal">ℓ</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">\ell_2</annotation></semantics>ℓ2​损失[¶](#continuous-decision-ell-2-loss
    "链接到这个部分")
- en: 'Now, suppose our parameter<semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    is continuous, and <semantics><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\delta(x)</annotation></semantics>δ(x)
    is our estimate of the parameter from the data. To make things a little more concrete,
    <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    could be the average height of people in a population, and <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x could be the heights
    of people in a random sample from that population. In this case, our loss shouldn’t
    just be right vs wrong: we should use a loss function that’s smaller when our
    estimate is close, and larger when our estimate is far away.'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: 现在，假设我们的参数<semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ是连续的，而<semantics><mrow><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\delta(x)</annotation></semantics>δ(x)是我们从数据中对参数的估计。为了使事情更具体，<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ可以是人群的平均身高，而<semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x可以是来自该人群的随机样本中的人的身高。在这种情况下，我们的损失不应该只是对与错：我们应该使用一个当我们的估计接近时更小，当我们的估计远离时更大的损失函数。
- en: 'You’ve probably already seen one before: the squared error loss, also known
    as the **<semantics><mrow><msub><mi mathvariant="normal">ℓ</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">\ell_2</annotation></semantics>ℓ2​ loss**:'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 你可能之前已经见过一次：平方误差损失，也称为**<semantics><mrow><msub><mi mathvariant="normal">ℓ</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">\ell_2</annotation></semantics>ℓ2损失**：
- en: <semantics><mrow><mi mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo
    stretchy="false">)</mo><mo>=</mo><mo fence="false" stretchy="true" minsize="1.2em"
    maxsize="1.2em">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>−</mo><mi>θ</mi><msup><mo
    fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mn>2</mn></msup></mrow><annotation
    encoding="application/x-tex">\ell(\delta(x), \theta) = \big(\delta(x) - \theta\big)^2</annotation></semantics>ℓ(δ(x),θ)=(δ(x)−θ)2[(3)](#esNOoAdR1S
    "Link to this Equation")
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo
    stretchy="false">)</mo><mo>=</mo><mo fence="false" stretchy="true" minsize="1.2em"
    maxsize="1.2em">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>−</mo><mi>θ</mi><msup><mo
    fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mn>2</mn></msup></mrow><annotation
    encoding="application/x-tex">\ell(\delta(x), \theta) = \big(\delta(x) - \theta\big)^2</annotation></semantics>ℓ(δ(x),θ)=(δ(x)−θ)2[(3)](#esNOoAdR1S
    "链接到此方程")
- en: We’ll analyze the <semantics><mrow><msub><mi mathvariant="normal">ℓ</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">\ell_2</annotation></semantics>ℓ2​ loss a little
    more later.
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将在稍后对<semantics><mrow><msub><mi mathvariant="normal">ℓ</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">\ell_2</annotation></semantics>ℓ2损失进行分析。
- en: '**Exercise**: Suppose we have a situation where it’s much worse to make a guess
    that’s too high, compared to a guess that’s too low. How would you construct a
    loss function for this problem?'
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: '**练习**：假设我们有一个情况，高估比低估更糟糕。你将如何构建这个问题的损失函数？'
- en: Known and unknown[¶](#known-and-unknown "Link to this Section")
  id: totrans-32
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 已知和未知[¶](#known-and-unknown "链接到本节")
- en: 'At this point, you may be wondering: if <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ is unknown, how
    can we ever compute the loss function? It’s important to keep in mind that when
    we apply <semantics><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\delta(x)</annotation></semantics>δ(x) on real data,
    we don’t know <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ.
    But right now, we’re building up some machinery to help us analyze different procedures.
    In other words, we’re trying to get to a place where we can answer questions like
    “what procedures are most likely to give us estimates that are close to <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ?”'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 在这一点上，你可能正在想：如果 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    未知，我们如何计算损失函数呢？重要的是要记住，当我们对真实数据应用 <semantics><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\delta(x)</annotation></semantics>δ(x)
    时，我们并不知道 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ。但此时，我们正在构建一些工具来帮助我们分析不同的过程。换句话说，我们正在努力达到一个可以回答“哪些过程最有可能给出接近
    <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    的估计？”这样的问题的地步。
- en: 'Fixed and random: finding the average loss in Bayesian and frequentist approaches[¶](#fixed-and-random-finding-the-average-loss-in-bayesian-and-frequentist-approaches
    "Link to this Section")'
  id: totrans-34
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 固定与随机：在贝叶斯和经验主义方法中寻找平均损失[¶](#fixed-and-random-finding-the-average-loss-in-bayesian-and-frequentist-approaches
    "链接到本节")
- en: 'The loss function is a function of <semantics><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\delta(x)</annotation></semantics>δ(x),
    which is the procedure result for particular data <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x, and the particular parameter
    <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ.
    This isn’t particularly useful to us: we’d like to understand how the loss does
    “on average”. But in order to compute any kind of averages, we need to decide
    what’s random and what’s fixed. This is an important fork in the road: we can
    either take the Bayesian or the frequentist route. Let’s examine what happens
    if we try each one:'
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: 损失函数是 <semantics><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\delta(x)</annotation></semantics>δ(x) 的函数，它是特定数据
    <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x
    的过程结果，以及特定参数 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ。这对我们来说并不特别有用：我们希望了解损失“平均”情况下的表现。但为了计算任何类型的平均值，我们需要决定什么是随机的，什么是固定的。这是一个重要的分岔点：我们可以选择贝叶斯路线或经验主义路线。让我们看看如果我们尝试每一条路线会发生什么：
- en: Frequentist loss analysis[¶](#frequentist-loss-analysis "Link to this Section")
  id: totrans-36
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 经验主义损失分析[¶](#frequentist-loss-analysis "链接到本节")
- en: 'In the frequentist world, we assume that our unknown <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ is **fixed**. The
    data are the only random piece. So, we’re going to look at the average across
    different possibilities for the data <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x. Since the data comes
    from the distribution <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(x|\theta)</annotation></semantics>p(x∣θ), which
    depends on <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ,
    we should expect that this “averaging” will produce something that depends on
    <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ.
    We’ll call our average the **frequentist risk**:'
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: 在频率派的世界里，我们假设我们的未知 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    是 **固定的**。数据是唯一的随机部分。因此，我们将查看数据不同可能性下的平均值 <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x。由于数据来自分布 <semantics><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(x|\theta)</annotation></semantics>p(x∣θ)，它依赖于
    <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ，我们应该预期这种“平均”会产生依赖于
    <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    的东西。我们将我们的平均值称为 **频率派风险**：
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>R</mi><mo stretchy="false">(</mo><mi>θ</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mrow><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mrow><mo fence="true">[</mo><mi
    mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo stretchy="false">)</mo><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mrow><mo fence="true">{</mo><mtable rowspacing="0.36em"
    columnalign="left left" columnspacing="1em"><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="false"><mstyle scriptlevel="0" displaystyle="true"><munder><mo>∑</mo><mi>x</mi></munder><mi
    mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo stretchy="false">)</mo><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo></mstyle></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mtext>if </mtext><mstyle
    scriptlevel="0" displaystyle="false"><mi>x</mi></mstyle><mtext> discrete</mtext></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="false"><mstyle scriptlevel="0" displaystyle="true"><mo>∫</mo><mi
    mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo stretchy="false">)</mo><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>d</mi><mi>x</mi></mstyle></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="false"><mrow><mtext>if </mtext><mstyle scriptlevel="0"
    displaystyle="false"><mi>x</mi></mstyle><mtext> continuous</mtext></mrow></mstyle></mtd></mtr></mtable></mrow></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} R(\theta) &= E_{x|\theta}\left[\ell(\delta(x),
    \theta)\right] \\ &= \begin{cases} \displaystyle \sum_x \ell(\delta(x), \theta)
    p(x|\theta) & \text{if $x$ discrete} \\ \displaystyle \int \ell(\delta(x), \theta)
    p(x|\theta) dx & \text{if $x$ continuous} \end{cases} \end{align*}</annotation></semantics>R(θ)​=Ex∣θ​[ℓ(δ(x),θ)]=⎩⎨⎧​x∑​ℓ(δ(x),θ)p(x∣θ)∫ℓ(δ(x),θ)p(x∣θ)dx​if x discreteif x continuous​​[(4)](#tquC7seTPa
    "Link to this Equation")
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>R</mi><mo stretchy="false">(</mo><mi>θ</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mrow><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mrow><mo fence="true">[</mo><mi
    mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo stretchy="false">)</mo><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mrow><mo fence="true">{</mo><mtable rowspacing="0.36em"
    columnalign="left left" columnspacing="1em"><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="false"><mstyle scriptlevel="0" displaystyle="true"><munder><mo>∑</mo><mi>x</mi></munder><mi
    mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo stretchy="false">)</mo><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo></mstyle></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mtext>if </mtext><mstyle
    scriptlevel="0" displaystyle="false"><mi>x</mi></mstyle><mtext> discrete</mtext></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="false"><mstyle scriptlevel="0" displaystyle="true"><mo>∫</mo><mi
    mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo stretchy="false">)</mo><mi>p</mi><mo
    stretchy="false">(</mi><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>d</mi><mi>x</mi></mstyle></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="false"><mrow><mtext>if </mtext><mstyle scriptlevel="0"
    displaystyle="false"><mi>x</mi></mstyle><mtext> continuous</mtext></mrow></mstyle></mtd></mtr></mtable></mrow></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} R(\theta) &= E_{x|\theta}\left[\ell(\delta(x),
    \theta)\right] \\ &= \begin{cases} \displaystyle \sum_x \ell(\delta(x), \theta)
    p(x|\theta) & \text{if $x$ discrete} \\ \displaystyle \int \ell(\delta(x), \theta)
    p(x|\theta) dx & \text{if $x$ continuous} \end{cases} \end{align*}</annotation></semantics>R(θ)
    = Ex∣θ[ℓ(δ(x),θ)] = { { ∑xℓ(δ(x),θ)p(x∣θ) & 如果 x 是离散的 { ∫ℓ(δ(x),θ)p(x∣θ)dx & 如果
    x 是连续的 [(4)](#tquC7seTPa "链接到这个方程式")
- en: 'The frequentist risk is a function of <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ. It tells us: for
    a particular value of <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ,
    how poorly does the procedure <semantics><mrow><mi>δ</mi></mrow><annotation encoding="application/x-tex">\delta</annotation></semantics>δ
    do if we average over all possible datasets?'
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: 经验风险是参数 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    的函数。它告诉我们：对于 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    的特定值，如果我们对所有可能的数据集进行平均，那么程序 <semantics><mrow><mi>δ</mi></mrow><annotation encoding="application/x-tex">\delta</annotation></semantics>δ
    会做得有多糟糕？
- en: Bayesian loss analysis[¶](#bayesian-loss-analysis "Link to this Section")
  id: totrans-40
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 贝叶斯损失分析[¶](#bayesian-loss-analysis "链接到本节")
- en: 'In the Bayesian world, we assume that our unknown <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ is **random**. Since
    we observe a particular dataset <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x, we’ll be a lot more
    interested in the randomness in <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ than the randomness
    in <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x.
    So, we’ll condition on the particular dataset we got, and look at the average
    across different possibilities for the unknown parameter <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ. We’ll call our
    average the **Bayesian posterior risk**:'
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: 在贝叶斯世界中，我们假设我们的未知参数 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    是**随机**的。由于我们观察到了特定的数据集 <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x，我们将对
    <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    中的随机性比对 <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x
    中的随机性更感兴趣。因此，我们将基于我们获得的具体数据集进行条件化，并查看未知参数 <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ 在不同可能性下的平均值。我们将我们的平均值称为**贝叶斯后验风险**：
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>ρ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mrow><mi>θ</mi><mi
    mathvariant="normal">∣</mi><mi>x</mi></mrow></msub><mrow><mo fence="true">[</mo><mi
    mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo stretchy="false">)</mo><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mrow><mo fence="true">{</mo><mtable rowspacing="0.36em"
    columnalign="left left" columnspacing="1em"><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="false"><mstyle scriptlevel="0" displaystyle="true"><munder><mo>∑</mo><mi>θ</mi></munder><mi
    mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo stretchy="false">)</mo><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mi mathvariant="normal">∣</mi><mi>x</mi><mo
    stretchy="false">)</mo></mstyle></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mtext>if </mtext><mstyle
    scriptlevel="0" displaystyle="false"><mi>θ</mi></mstyle><mtext> discrete</mtext></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="false"><mstyle scriptlevel="0" displaystyle="true"><mo>∫</mo><mi
    mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo stretchy="false">)</mo><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mi mathvariant="normal">∣</mi><mi>x</mi><mo
    stretchy="false">)</mo><mi>d</mi><mi>θ</mi></mstyle></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="false"><mrow><mtext>if </mtext><mstyle scriptlevel="0"
    displaystyle="false"><mi>θ</mi></mstyle><mtext> continuous</mtext></mrow></mstyle></mtd></mtr></mtable></mrow></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} \rho(x) &= E_{\theta|x}\left[\ell(\delta(x),
    \theta)\right] \\ &= \begin{cases} \displaystyle \sum_\theta \ell(\delta(x), \theta)
    p(\theta|x) & \text{if $\theta$ discrete} \\ \displaystyle \int \ell(\delta(x),
    \theta) p(\theta|x) d\theta & \text{if $\theta$ continuous} \end{cases} \end{align*}</annotation></semantics>ρ(x)​=Eθ∣x​[ℓ(δ(x),θ)]=⎩⎨⎧​θ∑​ℓ(δ(x),θ)p(θ∣x)∫ℓ(δ(x),θ)p(θ∣x)dθ​if θ discreteif θ continuous​​[(5)](#WaXh1BvFYO
    "Link to this Equation")
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
- en: 'The Bayesian risk is a function of <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x. It tells us: given that
    we observed a particular dataset <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x, how poorly does the
    procedure <semantics><mrow><mi>δ</mi></mrow><annotation encoding="application/x-tex">\delta</annotation></semantics>δ
    do, averaged over all possible values of the parameter <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ?'
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: 贝叶斯风险是 <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x
    的函数。它告诉我们：在观察到特定数据集 <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x
    的条件下，程序 <semantics><mrow><mi>δ</mi></mrow><annotation encoding="application/x-tex">\delta</annotation></semantics>δ
    在所有可能的参数 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    值上的平均表现如何？
- en: Comparing frequentist and Bayesian risk[¶](#comparing-frequentist-and-bayesian-risk
    "Link to this Section")
  id: totrans-44
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 比较频率主义和贝叶斯风险[¶](#comparing-frequentist-and-bayesian-risk "链接到本节")
- en: 'Operationally, both of these look kind of similar: we’re averaging the loss
    with respect to some conditional probability distribution. But conceptually, they’re
    very different: the frequentist risk fixes the parameter, and averages over all
    the data; the Bayesian posterior risk fixes the data, and averages over all parameters.'
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: 在操作上，这两者看起来有些相似：我们是在某个条件概率分布上平均损失。但从概念上讲，它们非常不同：频率主义风险固定参数，并对所有数据进行平均；贝叶斯后验风险固定数据，并对所有参数进行平均。
- en: 'Example: frequentist risk for <semantics><mrow><msub><mi mathvariant="normal">ℓ</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">\ell_2</annotation></semantics>ℓ2​ loss and the bias-variance
    tradeoff[¶](#example-frequentist-risk-for-ell-2-loss-and-the-bias-variance-tradeoff
    "Link to this Section")'
  id: totrans-46
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 例子：对于 <semantics><mrow><msub><mi mathvariant="normal">ℓ</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">\ell_2</annotation></semantics>ℓ2 损失和偏差-方差权衡[¶](#example-frequentist-risk-for-ell-2-loss-and-the-bias-variance-tradeoff
    "链接到本节")
- en: Let’s work through an example compuing the frequentist risk using the <semantics><mrow><msub><mi
    mathvariant="normal">ℓ</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">\ell_2</annotation></semantics>ℓ2​
    loss. We’ll find that the result can give us some important insights.
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们通过一个例子来计算使用 <semantics><mrow><msub><mi mathvariant="normal">ℓ</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">\ell_2</annotation></semantics>ℓ2 损失的频率主义风险。我们会发现结果可以给我们一些重要的见解。
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>R</mi><mo stretchy="false">(</mo><mi>θ</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mrow><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mrow><mo fence="true">[</mo><mi
    mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo stretchy="false">)</mo><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mrow><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mo
    fence="false" stretchy="true" minsize="1.8em" maxsize="1.8em">[</mo><mo fence="false"
    stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo>−</mo><mi>θ</mi><msup><mo fence="false" stretchy="true"
    minsize="1.2em" maxsize="1.2em">)</mo><mn>2</mn></msup><mo fence="false" stretchy="true"
    minsize="1.8em" maxsize="1.8em">]</mo></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} R(\theta) &= E_{x|\theta}\left[\ell(\delta(x),
    \theta)\right] \\ &= E_{x|\theta}\Big[\big(\delta(x) - \theta\big)^2\Big] \\ \end{align}</annotation></semantics>R(θ)​=Ex∣θ​[ℓ(δ(x),θ)]=Ex∣θ​[(δ(x)−θ)2]​​[(6)](#Bz97MBAlI9
    "Link to this Equation")
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>R</mi><mo stretchy="false">(</mo><mi>θ</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mrow><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mrow><mo fence="true">[</mo><mi
    mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo separator="true">,</mo><mi>θ</mi><mo stretchy="false">)</mo><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mrow><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mo
    fence="false" stretchy="true" minsize="1.8em" maxsize="1.8em">[</mo><mo fence="false"
    stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo>−</mo><mi>θ</mi><msup><mo fence="false" stretchy="true"
    minsize="1.2em" maxsize="1.2em">)</mo><mn>2</mn></msup><mo fence="false" stretchy="true"
    minsize="1.8em" maxsize="1.8em">]</mo></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} R(\theta) &= E_{x|\theta}\left[\ell(\delta(x),
    \theta)\right] \\ &= E_{x|\theta}\Big[\big(\delta(x) - \theta\big)^2\Big] \\ \end{align}</annotation></semantics>R(θ)
    = Ex∣θ[ℓ(δ(x),θ)] = Ex∣θ[(δ(x)−θ)2] [(6)](链接到这个方程)
- en: 'To make the math work out later, we’ll add and subtract the term <semantics><mrow><msub><mi>E</mi><mrow><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mo stretchy="false">[</mo><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">E_{x|\theta}[\delta(x)]</annotation></semantics>Ex∣θ​[δ(x)].
    Before we work out the result, let’s think about what this term means. It’s the
    average value of the procedure <semantics><mrow><mi>δ</mi></mrow><annotation encoding="application/x-tex">\delta</annotation></semantics>δ:
    in other words, for a particular <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ, it tells us what
    value of <semantics><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\delta(x)</annotation></semantics>δ(x) we should
    expect to get, averaged across different possible values of <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x.'
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: 为了让数学表达式在后续的计算中成立，我们将添加并减去项 <semantics><mrow><msub><mi>E</mi><mrow><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mo stretchy="false">[</mo><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">E_{x|\theta}[\delta(x)]</annotation></semantics>Ex∣θ[δ(x)].
    在我们计算出结果之前，让我们思考一下这个项的含义。它是过程 <semantics><mrow><mi>δ</mi></mrow><annotation encoding="application/x-tex">\delta</annotation></semantics>δ
    的平均值：换句话说，对于特定的 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ，它告诉我们应该期望得到什么样的
    <semantics><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\delta(x)</annotation></semantics>δ(x)，这是在不同可能的 <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x 值上的平均值。
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>R</mi><mo stretchy="false">(</mo><mi>θ</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mrow><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mo fence="false" stretchy="true"
    minsize="1.8em" maxsize="1.8em">[</mo><mo fence="false" stretchy="true" minsize="1.2em"
    maxsize="1.2em">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>−</mo><mi>θ</mi><msup><mo
    fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mn>2</mn></msup><mo
    fence="false" stretchy="true" minsize="1.8em" maxsize="1.8em">]</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mrow><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mo fence="false" stretchy="true"
    minsize="1.8em" maxsize="1.8em">[</mo><mo fence="false" stretchy="true" minsize="1.2em"
    maxsize="1.2em">(</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mover><mover><mrow><mo>−</mo><msub><mi>E</mi><mrow><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mo stretchy="false">[</mo><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo><mo>+</mo><msub><mi>E</mi><mrow><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mo stretchy="false">[</mo><mi>δ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo></mrow><mo
    stretchy="true">⏞</mo></mover><mrow><mo>=</mo><mn>0</mn></mrow></mover><mo>−</mo><mi>θ</mi><msup><mo
    fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mn>2</mn></msup><mo
    fence="false" stretchy="true" minsize="1.8em" maxsize="1.8em">]</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mrow><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi></mrow></msub><mo fence="false" stretchy="true"
    minsize="1.8em" maxsize="1.8em">[</mo><mo fence="false" stretchy="true" minsize="1.2em"
