  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-1/R/intro-to-R.html](https://rafalab.dfci.harvard.edu/dsbook-part-1/R/intro-to-R.html)
- en: In this book, we will be using the R software environment for all our analysis.
    You will learn R and data analysis techniques simultaneously. To follow along
    you will therefore need access to R. We also recommend the use of an *integrated
    development environment* (IDE), such as RStudio, to save your work. Note that
    it is common for a course or workshop to offer access to an R environment and
    an IDE through your web browser, as done by RStudio cloud[¹](#fn1). If you have
    access to such a resource, you don’t need to install R and RStudio. However, if
    you intend on becoming an advanced data analyst, we highly recommend installing
    these tools on your computer. Both R and RStudio are free and available online.
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 在这本书中，我们将使用R软件环境进行所有分析。你将同时学习R和数据分析技术。因此，为了跟上进度，你需要能够访问R。我们还推荐使用一个*集成开发环境*（IDE），例如RStudio，以便保存你的工作。请注意，课程或研讨会通常通过你的网络浏览器提供R环境和IDE的访问权限，就像RStudio云[¹](#fn1)所做的那样。如果你可以访问这样的资源，你就不需要安装R和RStudio。然而，如果你打算成为一名高级数据分析师，我们强烈建议在你的计算机上安装这些工具。R和RStudio都是免费的，并且可以在网上获得。
