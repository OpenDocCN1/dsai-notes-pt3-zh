- en: 16  The Linear Model Framework
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/linear-models/linear-model-framework.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/linear-models/linear-model-framework.html)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '[Linear Models](../linear-models/intro-to-linear-models.html)'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '[16  The Linear Model Framework](../linear-models/linear-model-framework.html)'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: We are now ready to understand the title of this part of the book, and specifically
    the connection between regression and *linear models*. In the previous chapter,
    we showed that if two variables follow a bivariate normal distribution, then the
    conditional expectation of one given the other lies on a straight line, the *regression
    line*. In that setting, the linear relationship was not an assumption, but a mathematical
    consequence of the probability model.
  prefs: []
  type: TYPE_NORMAL
- en: In practice, however, we often adopt the linear relationship as a modeling strategy,
    even when the underlying distributions are not exactly bivariate normal. To work
    with such models, we need a general mathematical approach for estimating the unknown
    coefficients. In this chapter, we introduce the *least squares estimator* (LSE),
    the standard method used to estimate these parameters. The LSE provides a unified
    way to fit linear models across a wide range of applications.
  prefs: []
  type: TYPE_NORMAL
- en: 'We end the chapter presenting one example in which the linear model was historically
    motivated: *measurement error models*. This example is different from the height
    data we studied earlier, but the same linear model framework, the same least squares
    mathematics, and even the same R functions can be used to fit it. Later chapters
    will introduce additional examples in which linear models play a central role.'
  prefs: []
  type: TYPE_NORMAL
- en: 16.1 The linear model representation
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: We note that *linear* here does not refer to lines exclusively, but rather to
    the fact that the conditional expectation is a linear combination of variables.
    In mathematics, when we multiply each variable by a constant and then add them
    together, we say we formed a *linear combination* of the variables. For example,
    \(3x - 4y + 5z\) is a linear combination of \(x\), \(y\), and \(z\). We can also
    add a constant so \(2 + 3x - 4y + 5z\) is also a linear combination of \(x\),
    \(y\), and \(z\).
  prefs: []
  type: TYPE_NORMAL
- en: 'We previously described how if \(X\) and \(Y\) are bivariate normal, then if
    we look at only the pairs with \(X=x\), then \(Y \mid X=x\) follows a normal distribution
    with expected value \(\mu_Y + \rho \frac{x-\mu_X}{\sigma_X}\sigma_Y\), which is
    a linear function of \(x\). Note also that the standard deviation \(\sigma_Y \sqrt{1-\rho^2}\)
    does not depend on \(x\). This implies that we can write:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ Y = \beta_0 + \beta_1 x + \varepsilon \]
  prefs: []
  type: TYPE_NORMAL
- en: 'and assume \(\varepsilon\) follows a normal distribution with expected value
    0 and fixed standard deviation, then \(Y\) has the same properties as the regression
    setup gave us: \(Y\) follows a normal distribution, the expected value is a linear
    function of \(x\), and the standard deviation does not depend on \(x\).'
  prefs: []
  type: TYPE_NORMAL
- en: '*In statistical textbooks, the \(\varepsilon\) terms are referred to as *errors*.
    Historically, this reflected the idea that deviations from the model were due
    to measurement inaccuracies. Today, the term is used more broadly: the \(\varepsilon\)s
    represent all variation in the outcome that is not explained by the predictors
    in the model. This variation may have nothing to do with mistakes. For example,
    if someone is two inches taller than what we would predict based on their parents’
    heights, those two inches are not an error; they are simply natural variation.
    Although the term *error* is not ideal in this sense, it remains standard terminology,
    and we will use it to denote the unexplained variability in the model.*  *If we
    were to specify a linear model for Galton’s data, we would denote the \(N\) observed
    father heights with \(x_1, \dots, x_n\), then we model the \(N\) son heights we
    are trying to predict with:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ Y_i = \beta_0 + \beta_1 x_i + \varepsilon_i, \, i=1,\dots,N. \]
  prefs: []
  type: TYPE_NORMAL
- en: Here \(x_i\) is the father’s height, which is fixed (not random) due to the
    conditioning, and \(Y_i\) is the random son’s height that we want to predict.
    We can further assume that the \(\varepsilon_i\) are independent from each other
    and all have the same standard deviation.
  prefs: []
  type: TYPE_NORMAL
- en: In the linear model framework the \(x_i\) are refereed to as the *explanatory
    variables*, *covariates*, or *predictors*.
  prefs: []
  type: TYPE_NORMAL
- en: In the above model we know the \(x_i\), but to have a useful model for prediction,
    we need \(\beta_0\) and \(\beta_1\). We estimate these from the data. Once we
    do this, we can predict son’s heights for any father’s height \(x\). We show how
    to do this in the next section.
  prefs: []
  type: TYPE_NORMAL
- en: 'Although this model is exactly the same one we derived earlier by assuming
    bivariate normal data, a somewhat nuanced difference is that, in the first approach,
    we assumed the data was bivariate normal and the linear model was derived, not
    assumed. In practice, linear models are just assumed without necessarily assuming
    normality: the distribution of the \(\varepsilon\)s is not necessarily specified.
    Nevertheless, if your data is bivariate normal, the above linear model holds.
    If your data is not bivariate normal, then you will need to have other ways of
    justifying the model.'
  prefs: []
  type: TYPE_NORMAL
- en: 'One reason linear models are popular is that they are easily *interpretable*.
    In the case of Galton’s data, we can interpret the data like this: due to inherited
    genes, the son’s height prediction grows by \(\beta_1\) for each inch we increase
    the father’s height \(x\). Because not all sons with fathers of height \(x\) are
    of equal height, we need the term \(\varepsilon\), which explains the remaining
    variability. This remaining variability includes the mother’s genetic effect,
    environmental factors, and other biological randomness.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Given how we wrote the model above, the intercept \(\beta_0\) is not very interpretable,
    as it is the predicted height of a son of a father with no height. To make the
    slope parameter more interpretable, we can rewrite the model slightly as:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ Y_i = \beta_0 + \beta_1 (x_i - \bar{x}) + \varepsilon_i, \, i=1,\dots,N \]
  prefs: []
  type: TYPE_NORMAL
- en: with \(\bar{x} = 1/N \sum_{i=1}^N x_i\) the average of the \(x\). In this case,
    \(\beta_0\) represents the height when \(x_i = \bar{x}\), which is the height
    of the son of an average father.
  prefs: []
  type: TYPE_NORMAL
- en: Later, specifically in Chapters [17](treatment-effect-models.html) and [20](multivariable-regression.html),
    we will see how the linear model representation permits us to use the same mathematical
    frameworks in other contexts and to achieve more complicated goals than predicting
    one variable from another.*
  prefs: []
  type: TYPE_NORMAL
- en: '*16.2 Least Squares Estimates*'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '*For linear models to be useful, we have to estimate the unknown \(\beta\)s.
    The standard approach is to find the values that minimize the distance of the
    fitted model to the data. Specifically, we find the \(\beta\)s that minimize the
    least squares (LS) equation shown below. For Galton’s data, the LS equation looks
    like this:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ RSS = \sum_{i=1}^n \left\{ y_i - \left(\beta_0 + \beta_1 x_i \right)\right\}^2
    \]
  prefs: []
  type: TYPE_NORMAL
- en: The quantity we try to minimize is called the residual sum of squares (RSS).
  prefs: []
  type: TYPE_NORMAL
- en: Once we find the values that minimize the RSS, we will call the values the least
    squares estimates (LSE) and denote them by placing a *hat* over the parameters.
    In our example we use \(\hat{\beta}_0\) and \(\hat{\beta}_1\).
  prefs: []
  type: TYPE_NORMAL
- en: 'We will demonstrate how we find these values using the previously defined `galton`
    dataset:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: '*Let’s start by writing a function that computes the RSS for any pair of values
    \(\beta_0\) and \(\beta_1\).'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: '*So for any pair of values, we get an RSS. Here is a plot of the RSS as a function
    of \(\beta_1\), when we keep the \(\beta_0\) fixed at 25.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/6a2b5abea08935ad589c71229b28a1c9.png)*  *We can see a clear
    minimum for \(\beta_1\) at around 0.65\. However, this minimum for \(\beta_1\)
    is for when \(\beta_0 = 25\), a value we arbitrarily picked. We don’t know if
    (25, 0.65) is the pair that minimizes the equation across all possible pairs.'
  prefs: []
  type: TYPE_NORMAL
- en: Trial and error is not going to work in this case. We could search for a minimum
    within a fine grid of \(\beta_0\) and \(\beta_1\) values, but this is unnecessarily
    time-consuming since we can use calculus. Specifically, we take the partial derivatives,
    set them to 0, and solve for \(\beta_0\) and \(\beta_1\). Of course, if we have
    many parameters, these equations can get rather complex. But there are functions
    in R that do these calculations for us. We will study these next. To learn the
    mathematics behind this, you can consult one of the books on linear models in
    the Recommended Reading section.****
  prefs: []
  type: TYPE_NORMAL
- en: '****16.3 The `lm` function****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '****In R, we can obtain the least squares estimates for a linear model using
    the `lm` function. To fit the model:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ Y_i = \beta_0 + \beta_1 x_i + \varepsilon_i \]
  prefs: []
  type: TYPE_NORMAL
- en: 'with \(Y_i\) being the son’s height and \(x_i\) being the father’s height,
    we can use this code:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: '*The most common way we use `lm` is by using the character `~` to let `lm`
    know which is the variable we are predicting (left of `~`) and which we are using
    to predict (right of `~`). The intercept is added automatically to the model that
    will be fit.'
  prefs: []
  type: TYPE_NORMAL
- en: 'The object `fit` includes information about the fit. We can use the function
    `summary` to extract a summary of this information:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE4]'
  prefs: []
  type: TYPE_PRE
- en: '*To understand some of the terms included in this summary, we need to remember
    that the LSE are random variables. Mathematical statistics gives us some ideas
    of the distribution of these random variables.'
  prefs: []
  type: TYPE_NORMAL
- en: In [Chapter 20](multivariable-regression.html), after describing a more complex
    case study, we gain further insights into the application of regression in R.
  prefs: []
  type: TYPE_NORMAL
- en: LSE are random variables
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The LSE is derived from the data \(y_1,\dots,y_N\), which are a realization
    of random variables \(Y_1, \dots, Y_N\). This implies that our estimates are random
    variables. To see this, we can run a Monte Carlo simulation in which we assume
    the son and father height data defines a population, take a random sample of size
    \(N=50\), and compute the regression slope coefficient for each one:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE5]'
  prefs: []
  type: TYPE_PRE
- en: '*We can see the variability of the estimates by plotting their distributions:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/958a4a964c6cd459a4258792c3e7227b.png)'
  prefs: []
  type: TYPE_IMG
- en: 'The reason these look normal is because the central limit theorem applies here
    as well: for large enough \(N\), the least squares estimates will be approximately
    normal with expected value \(\beta_0\) and \(\beta_1\), respectively.'
  prefs: []
  type: TYPE_NORMAL
- en: 'The standard errors are a bit complicated to compute, but mathematical theory
    does allow us to compute them and they are included in the summary provided by
    the `lm` function. The function `summary` shows us the standard error estimates:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE6]'
  prefs: []
  type: TYPE_PRE
- en: '*You can see that the standard errors estimates reported above are close to
    the standard errors from the simulation:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE7]'
  prefs: []
  type: TYPE_PRE
- en: '*The `summary` function also reports t-statistics (`t value`) and p-values
    (`Pr(>|t|)`). The t-statistic is not actually based on the central limit theorem,
    but rather on the assumption that the \(\varepsilon\)s follow a normal distribution.
    Under this assumption, mathematical theory tells us that the LSE divided by their
    standard error, \(\hat{\beta}_0 / \widehat{\mathrm{SE}}[\hat{\beta}_0]\) and \(\hat{\beta}_1
    / \widehat{\mathrm{SE}}[\hat{\beta}_1]\), follow a t-distribution with \(N-p\)
    degrees of freedom, with \(p\) the number of parameters in our model. In our example
    \(p=2\), and the two p-values are obtained from testing the null hypothesis that
    \(\beta_0 = 0\) and \(\beta_1=0\), respectively.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Remember that, as we described in [Section 10.2.3](../inference/models.html#sec-t-dist),
    for large enough \(N\), the CLT works and the t-distribution becomes almost the
    same as the normal distribution. Also, notice that we can construct confidence
    intervals using the `confint` function:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE8]'
  prefs: []
  type: TYPE_PRE
- en: '*Although we do not show examples in this book, hypothesis testing with regression
    models is commonly used in epidemiology and economics to make statements such
    as “the effect of A on B was statistically significant after adjusting for X,
    Y, and Z”. However, several assumptions have to hold for these statements to be
    true.****'
  prefs: []
  type: TYPE_NORMAL
- en: '***Predicted values are random variables***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***Once we fit our model, we can obtain a prediction of \(Y\) by plugging the
    estimates into the regression model. For example, if the father’s height is \(x\),
    then our prediction \(\hat{y}\) for the son’s height will be:'
  prefs: []
  type: TYPE_NORMAL
- en: \[\hat{y} = \hat{\beta}_0 + \hat{\beta}_1 x\]
  prefs: []
  type: TYPE_NORMAL
- en: When we plot \(\hat{y}\) versus \(x\), we see the regression line.
  prefs: []
  type: TYPE_NORMAL
- en: 'Keep in mind that the prediction \(\hat{y}\) is also a random variable and
    mathematical theory tells us what the standard errors are. If we assume the errors
    are normal, or have a large enough sample size, we can use theory to construct
    confidence intervals as well. In fact, the **ggplot2** layer `geom_smooth(method
    = "lm")` surrounds the regession line using these confidence intervals:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE9]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/2e761bfe40c162f3684286ce8a1f390f.png)*  *The R function `predict`
    takes an `lm` object as input and returns the prediction. If requested, the standard
    errors and other information from which we can construct confidence intervals
    is provided:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]**********'
  prefs: []
  type: TYPE_NORMAL
- en: '****16.4 Model diagnostics****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '****When we assume a linear model, rather than derive it from theory, all interpretations
    depend on how well the model represents the data. The `lm` function will fit the
    model and produce coefficient estimates, standard errors, and p-values even if
    the model is misspecified. Interpreting such results without verifying assumptions
    can lead to misleading conclusions.'
  prefs: []
  type: TYPE_NORMAL
- en: For this reason, checking model assumptions is a **critical requirement** in
    statistical modeling. Diagnostic plots provide visual tools to assess whether
    the model captures the main structure in the data, whether residuals behave as
    expected, and whether potential outliers or influential points are distorting
    the fit. These checks are especially important when there is no strong theoretical
    justification for the assumed model—such as when the data-generating process is
    unknown or complex. In these cases, diagnostics are our main defense against drawing
    incorrect or overconfident conclusions.
  prefs: []
  type: TYPE_NORMAL
- en: 'Visually inspecting residuals, defined as the difference between observed values
    and predicted values:'
  prefs: []
  type: TYPE_NORMAL
- en: '\[ r = y - \hat{y} = y- \left(\hat{\beta}_0 - \hat{\beta}_1 x_i\right), \]
    and summaries of the residuals, is a powerful way to diagnose if the model is
    useful. Note that the residuals can be thought of estimates of the errors since:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ \varepsilon = Y - \left(\beta_0 + \beta_1 x_i \right). \] In fact residuals
    are often denoted as \(\hat{\varepsilon}\). This motivates several *diagnostic*
    plots. Because we observe \(r\), but don’t observe \(\varepsilon\), we based the
    plots on the residuals.
  prefs: []
  type: TYPE_NORMAL
- en: Because the errors are assumed not to depend on the expected value of \(Y\),
    a plot of \(r\) versus the fitted values \(\hat{y}\) should show no relationship.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: In cases in which we assume the errors follow a normal distribution, a qqplot
    of standardized \(r\) should fall on a line when plotted against theoretical quantiles.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Because we assume the standard deviation of the errors is constant, if we plot
    the absolute value of the residuals, it should appear constant.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: We prefer plots rather than summaries based on, for example, correlation because,
    as noted in [Section 15.2.2](regression.html#sec-ascombe), correlation is not
    always the best summary of association. The function `plot` applied to an `lm`
    object automatically plots these.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/0c32658af2f1b07541b79d8f38b7a0d0.png)*  *This function can produce
    six different plots, and the argument `which` let’s you specify which you want
    to see. You can learn more by reading the `plot.lm` help file. However, some of
    the plots are based on more advanced concepts beyond the scope of this book. To
    learn more, we recommend an advanced book on regression analysis included in the
    Recommended Reading section.'
  prefs: []
  type: TYPE_NORMAL
- en: In Chapters [17](treatment-effect-models.html) and [20](multivariable-regression.html),
    we introduce data analysis challenges in which we may decide to not include certain
    variables in the model. In these cases, an important diagnostic test is to checks
    if the residuals are related to variables not included in the model.*****
  prefs: []
  type: TYPE_NORMAL
- en: '****16.5 Measurement error models****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '****Historically, writing linear models in the form \(Y = \beta_0 + \beta_1
    x + \varepsilon\) originated in contexts where the \(\varepsilon\) term represented
    *measurement error*. Early scientists used least squares to estimate physical
    constants from repeated measurements affected by instrument noise. Later, Galton
    and Pearson extended this framework to study relationships between variables,
    such as the height example we examined earlier.'
  prefs: []
  type: TYPE_NORMAL
- en: 'In this section, we briefly present a setting where the measurement-error interpretation
    is appropriate and show that we can fit the corresponding model using the same
    mathematics and the same R function. This illustrates one of the key advantages
    of the linear model framework: a single set of tools applies across many seemingly
    different situations.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Example: modeling a falling object'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'To understand these models, imagine you are Galileo in the 16th century trying
    to describe the velocity of a falling object. An assistant climbs the Tower of
    Pisa and drops a ball, while several other assistants record the position at different
    times. Let’s simulate some data using the equations we currently know and adding
    some measurement error. The **dslabs** function `rfalling_object` generates these
    simulations:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE12]'
  prefs: []
  type: TYPE_PRE
- en: '*The assistants hand the data to Galileo, and this is what he sees:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/3c22a39efef48861c4d6c082ef3eb1a6.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Galileo does not know the exact equation, but by looking at the plot above,
    he deduces that the position should follow a parabola, which we can write like
    this:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ f(x) = \beta_0 + \beta_1 x + \beta_2 x^2 \]
  prefs: []
  type: TYPE_NORMAL
- en: 'The data does not fall exactly on a parabola. Galileo knows this is due to
    measurement error. His helpers make mistakes when measuring the distance. To account
    for this, he models the data with:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ Y_i = \beta_0 + \beta_1 x_i + \beta_2 x_i^2 + \varepsilon_i, i=1,\dots,n
    \]
  prefs: []
  type: TYPE_NORMAL
- en: 'with \(Y_i\) representing distance in meters, \(x_i\) representing time in
    seconds, and \(\varepsilon_i\) accounting for measurement error. The measurement
    error is assumed to be random, independent from each other, and having the same
    distribution for each \(i\). We also assume that there is no bias, which means
    the expected value of the error terms is 0: \(\mathrm{E}[\varepsilon] = 0\).'
  prefs: []
  type: TYPE_NORMAL
- en: Note that this is a linear model because it is a linear combination of known
    quantities (\(x\) and \(x^2\) are known) and unknown parameters (the \(\beta\)s
    are unknown parameters to Galileo). Unlike our previous examples, here \(x\) is
    a fixed quantity; we are not conditioning.
  prefs: []
  type: TYPE_NORMAL
- en: '*Small discrepancies between a model’s predictions and observations are often
    attributed to measurement error, as in our example. In many cases, this is a useful
    and practical approximation. However, such differences can also reveal limitations
    in the model itself. Galileo’s experiments on gravity showed slight deviations
    from his predicted uniform acceleration, largely due to air resistance rather
    than flawed measurements. Similarly, Newton’s laws of gravity accurately described
    planetary motion, but small discrepancies in Mercury’s orbit, once considered
    observational errors, ultimately led to Einstein’s general theory of relativity.
    While assuming measurement error is often reasonable, it is crucial to recognize
    when discrepancies signal model limitations. The diagnostic plots discussed in
    [Section 16.4](#sec-diagnostic-plots) can help assess such limitations.**'
  prefs: []
  type: TYPE_NORMAL
- en: '**Estimating parameters with least squares**'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '**To pose a new physical theory and start making predictions about other falling
    objects, Galileo needs actual numbers, rather than unknown parameters. Using LSE
    seems like a reasonable approach. How do we find the LSE?'
  prefs: []
  type: TYPE_NORMAL
- en: 'LSE calculations do not require the errors to be approximately normal. The
    `lm` function will find the \(\beta\)s that will minimize the residual sum of
    squares:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE13]'
  prefs: []
  type: TYPE_PRE
- en: '*Let’s check if the estimated parabola fits the data. The **broom** function
    `augment` allows us to do this easily:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE14]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/07c5e764e9dbfdc3c71dc9cb52dfc611.png)*  *The residuals confirm
    that the normal approximation for the errors is reasonable:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE15]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/cde093027594c0e697596d1e72b2f23f.png)*  *Thanks to my high school
    physics teacher, I know that the equation for the trajectory of a falling object
    is:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ d(t) = h_0 + v_0 t - 0.5 \times 9.8 \, t^2 \]
  prefs: []
  type: TYPE_NORMAL
- en: with \(h_0\) and \(v_0\) the starting height and velocity, respectively. The
    data we simulated above followed this equation, adding measurement error to simulate
    `n` observations for dropping the ball \((v_0=0)\) from the tower of Pisa \((h_0=55.86)\).
  prefs: []
  type: TYPE_NORMAL
- en: 'These are consistent with the parameter estimates:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE16]'
  prefs: []
  type: TYPE_PRE
- en: '*The Tower of Pisa height is within the confidence interval for \(\beta_0\),
    the initial velocity 0 is in the confidence interval for \(\beta_1\) (note the
    p-value is larger than 0.05), and the acceleration constant is in a confidence
    interval for \(-2 \times \beta_2\).**********'
