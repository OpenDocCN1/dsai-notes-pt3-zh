- en: '****16.6 Exercises****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '****1\. The `co2` dataset is a time series object of 468 CO2 observations,
    monthly from 1959 to 1997\. Plot CO2 levels for the first 12 months and notice
    it seems to follow a sine wave with a frequency of 1 cycle per year. This means
    that a measurement error model that might work is'
  prefs: []
  type: TYPE_NORMAL
- en: \[ y_i = \mu + A \sin(2\pi \,t_i / 12 + \phi) + \varepsilon_i \] with \(t_i\)
    the month number for observation \(i\). Is this a linear model for the parameters
    \(mu\), \(A\) and \(\phi\)?
  prefs: []
  type: TYPE_NORMAL
- en: '2\. Using trigonometry, we can show that we can rewrite this model as:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ y_i = \beta_0 + \beta_1 \sin(2\pi t_i/12) + \beta_2 \cos(2\pi t_i/12) + \varepsilon_i
    \]
  prefs: []
  type: TYPE_NORMAL
- en: Is this a linear model?
  prefs: []
  type: TYPE_NORMAL
- en: 3\. Find least square estimates for the \(\beta\)s using `lm`. Show a plot of
    \(y_i\) versus \(t_i\) with a curve on the same plot showing \(\hat{y}_i\) versus
    \(t_i\).
  prefs: []
  type: TYPE_NORMAL
- en: 4\. Now fit a measurement error model to the entire `co2` dataset that includes
    a trend term that is a parabola as well as the sine wave model.
  prefs: []
  type: TYPE_NORMAL
- en: 5\. Run diagnostic plots for the fitted model and describe the results.
  prefs: []
  type: TYPE_NORMAL
