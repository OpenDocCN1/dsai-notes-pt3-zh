- en: 2  R basics
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-1/R/R-basics.html](https://rafalab.dfci.harvard.edu/dsbook-part-1/R/R-basics.html)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '[R](../R/intro-to-R.html)'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '[2  R basics](../R/R-basics.html)'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '2.1 Motivating example: US Gun Murders'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'Imagine you live in Europe and are offered a job in a US company with many
    locations across all states. It is a great job, but news with headlines such as
    **US Gun Homicide Rate Higher Than Other Developed Countries**[¹](#fn1) have you
    worried. Charts like this may concern you even more:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/362975da153c13e8c0ca28a927376cfe.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Or even worse, this version from [everytown.org](https://everytownresearch.org)[²](#fn2):'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/1db1b4298845e5e712e7e69af5f8e436.png)'
  prefs: []
  type: TYPE_IMG
- en: But then you remember that the US is a large and diverse country with 50 very
    different states as well as the District of Columbia (DC).
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/1fec464b9fea43d31740b2f7c9b7d015.png)'
  prefs: []
  type: TYPE_IMG
- en: California, for example, has a larger population than Canada, and 20 US states
    have populations larger than that of Norway. In some respects, the variability
    across states in the US is akin to the variability across countries in Europe.
    Furthermore, although not included in the charts above, the murder rates in Lithuania,
    Ukraine, and Russia are higher than 4 per 100,000\. So perhaps the news reports
    that worried you are too superficial. You have options of where to live and want
    to determine the safety of each particular state. We will gain some insights by
    examining data related to gun homicides in the US during 2010 using R.
  prefs: []
  type: TYPE_NORMAL
- en: Before we get started with our example, we need to cover logistics as well as
    some of the very basic building blocks that are required to gain more advanced
    R skills. Be aware that the usefulness of some of these building blocks may not
    be immediately obvious, but later in the book you will appreciate having mastered
    these skills.
  prefs: []
  type: TYPE_NORMAL
- en: 2.2 The very basics
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Before we get started with the motivating dataset, we need to cover the very
    basics of R.
  prefs: []
  type: TYPE_NORMAL
- en: 2.2.1 Objects
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Suppose a high school student asks us for help solving several quadratic equations
    of the form \(ax^2+bx+c = 0\). The quadratic formula gives us the solutions:'
  prefs: []
  type: TYPE_NORMAL
- en: '\[ \frac{-b - \sqrt{b^2 - 4ac}}{2a}\,\, \mbox{ and } \frac{-b + \sqrt{b^2 -
    4ac}}{2a} \] which of course change depending on the values of \(a\), \(b\), and
    \(c\). One advantage of programming languages is that we can define variables
    and write expressions with these variables, similar to how we do so in math, but
    obtain a numeric solution. We will write out general code for the quadratic equation
    below, but if we are asked to solve \(x^2 + x -1 = 0\), then we define the coefficients:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: '*which stores the values for later use. We use `<-` to assign values to the
    variables. We can also assign values using `=` instead of `<-`, but we recommend
    against using `=` to avoid confusion.'
  prefs: []
  type: TYPE_NORMAL
- en: Copy and paste the code above into your console to define the three variables.
    Note that R does not print anything when we make this assignment. This means the
    objects were defined successfully. Had you made a mistake, you would have received
    an error message.
  prefs: []
  type: TYPE_NORMAL
- en: 'To see the value stored in a variable, we simply ask R to evaluate `coef_a`
    and it shows the stored value:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: '*A more explicit way to ask R to show us the value stored in `coef_a` is using
    `print` like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: '*We use the term *object* to describe stuff that is stored in R. Variables
    are examples, but objects can also be more complicated entities such as functions,
    which are described later.***'
  prefs: []
  type: TYPE_NORMAL
- en: '***2.2.2 The workspace***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***As we define objects in the console, we are actually changing the *workspace*.
    You can see all the variables saved in your workspace by typing:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: '*In RStudio, the *Environment* tab shows the values:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/e1278b0fe7bd1c2a986275b0c0b73c2e.png)'
  prefs: []
  type: TYPE_IMG
- en: 'We should see `coef_a`, `coef_b`, and `coef_c`. If you try to recover the value
    of a variable that is not in your workspace, you receive an error. For example,
    if you type `x` you will receive the following message: `Error: object ''x'' not
    found`.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Now since these values are saved in variables, to obtain a solution to our
    equation, we use the quadratic formula:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE4]****'
  prefs: []
  type: TYPE_NORMAL
- en: '***2.2.3 Prebuilt functions***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***Once you define variables, the data analysis process can usually be described
    as a series of *functions* applied to the data. R includes several predefined
    functions and most of the analysis pipelines we construct make extensive use of
    these.'
  prefs: []
  type: TYPE_NORMAL
- en: We already used or discussed the `install.packages`, `library`, and `ls` functions.
    We also used the function `sqrt` to solve the quadratic equation above. There
    are many more prebuilt functions and even more can be added through packages.
    These functions do not appear in the workspace because you did not define them,
    but they are available for immediate use.
  prefs: []
  type: TYPE_NORMAL
- en: In general, we need to use parentheses to evaluate a function. If you type `ls`,
    the function is not evaluated and instead R shows you the code that defines the
    function. If you type `[ls()](https://rdrr.io/r/base/ls.html)` the function is
    evaluated and, as seen above, we see objects in the workspace.
  prefs: []
  type: TYPE_NORMAL
- en: 'Unlike `ls`, most functions require one or more *arguments*. Below is an example
    of how we assign an object to the argument of the function `log`. Remember that
    we earlier defined `coef_a` to be 1:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE5]'
  prefs: []
  type: TYPE_PRE
- en: '*You can find out what the function expects and what it does by reviewing the
    very useful manuals included in R. You can get help by using the `help` function
    like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE6]'
  prefs: []
  type: TYPE_PRE
- en: '*For most functions, we can also use this shorthand:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE7]'
  prefs: []
  type: TYPE_PRE
- en: '*The help page will show you what arguments the function is expecting. For
    example, `log` needs `x` and `base` to run. However, some arguments are required
    and others are optional. You can determine which arguments are optional by noting
    in the help document that a default value is assigned with `=`. Defining these
    is optional. For example, the base of the function `log` defaults to `base = exp(1)`
    making `log` the natural log by default.'
  prefs: []
  type: TYPE_NORMAL
- en: 'If you want a quick look at the arguments without opening the help system,
    you can type:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE8]'
  prefs: []
  type: TYPE_PRE
- en: '*You can change the default values by simply assigning another object:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE9]'
  prefs: []
  type: TYPE_PRE
- en: '*Note that we have not been specifying the argument `x` as such:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]'
  prefs: []
  type: TYPE_PRE
- en: '*The above code works, but we can save ourselves some typing: if no argument
    name is used, R assumes you are entering arguments in the order shown in the help
    file or by `args`. So by not using the names, it assumes the arguments are `x`
    followed by `base`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]'
  prefs: []
  type: TYPE_PRE
- en: '*If using the arguments’ names, then we can include them in whatever order
    we want:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE12]'
  prefs: []
  type: TYPE_PRE
- en: '*To specify arguments, we must use `=`, and cannot use `<-`.'
  prefs: []
  type: TYPE_NORMAL
- en: 'There are some exceptions to the rule that functions need the parentheses to
    be evaluated. Among these, the most commonly used are the arithmetic and relational
    operators. For example:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE13]'
  prefs: []
  type: TYPE_PRE
- en: '*You can see the arithmetic operators by typing:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE14]'
  prefs: []
  type: TYPE_PRE
- en: '*or'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE15]'
  prefs: []
  type: TYPE_PRE
- en: '*and the relational operators by typing:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE16]'
  prefs: []
  type: TYPE_PRE
- en: '*or'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE17]***************'
  prefs: []
  type: TYPE_NORMAL
- en: '***2.2.4 Prebuilt objects***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***There are several datasets that are included for users to practice and test
    out functions. You can see all the available datasets by typing:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE18]'
  prefs: []
  type: TYPE_PRE
- en: '*This shows you the object name for these datasets. These datasets are objects
    that can be used by simply typing the name. For example, if you type:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE19]'
  prefs: []
  type: TYPE_PRE
- en: '*R will show you Mauna Loa atmospheric CO2 concentration data.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Other prebuilt objects are mathematical quantities, such as the constant \(\pi\)
    and \(\infty\):'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE20]*****'
  prefs: []
  type: TYPE_NORMAL
- en: '***2.2.5 Variable names***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***We used `coef_a`, `coef_b`, and `coef_c` as variable names, but variable
    names can be almost anything. When writing code in R, it’s important to choose
    variable names that are both meaningful and avoid conflicts with existing functions
    or reserved words in the language. For example, we did not use `a`, `b` and `c`
    to avoid a conflict with the `[c()](https://rdrr.io/r/base/c.html)` function in
    R, described in [Section 2.4.1](#sec-creating-vectors). If you were to name a
    variable `c`, you would not receive an error or warning, but the conflict can
    lead to unexpected behavior and bugs that are hard to diagnose.'
  prefs: []
  type: TYPE_NORMAL
- en: Some basic rules in R are that variable names have to start with a letter, can’t
    contain spaces, and should not be variables that are predefined in R, such as
    `c`.
  prefs: []
  type: TYPE_NORMAL
- en: 'A nice convention to follow is to use meaningful words that describe what is
    stored, use only lower case, and use underscores as a substitute for spaces. For
    the quadratic equations, we could use something like this for the two roots:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE21]'
  prefs: []
  type: TYPE_PRE
- en: '*For more advice, we highly recommend studying Hadley Wickham’s style guide[³](#fn3).****'
  prefs: []
  type: TYPE_NORMAL
- en: '***2.2.6 Saving your workspace***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***Values remain in the workspace until you end your session or erase them
    with the function `rm`. But workspaces also can be saved for later use. In fact,
    when you quit R, the program asks you if you want to save your workspace. If you
    do save it, the next time you start R, the program will restore the workspace.'
  prefs: []
  type: TYPE_NORMAL
- en: We actually recommend against saving the workspace this way because, as you
    start working on different projects, it will become harder to keep track of what
    is saved. Instead, we recommend you assign the workspace a specific name. You
    can do this by using the function `save` or `save.image`. To load, use the function
    `load`. When saving a workspace, we recommend the suffix `rda` or `RData`. In
    RStudio, you can also do this by navigating to the *Session* tab and choosing
    *Save Workspace as*. You can later load it using the *Load Workspace* options
    in the same tab. You can read the help pages on `save`, `save.image`, and `load`
    to learn more.***
  prefs: []
  type: TYPE_NORMAL
- en: '***2.2.7 Why use scripts?***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***To solve another equation such as \(3x^2 + 2x -1\), we can copy and paste
    the code above and then redefine the variables and recompute the solution:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE22]'
  prefs: []
  type: TYPE_PRE
- en: '*By creating and saving a script with the code above, we would not need to
    retype everything each time and, instead, simply change the variable values. Try
    writing the script above into an editor and notice how easy it is to change the
    variables and receive an answer.****'
  prefs: []
  type: TYPE_NORMAL
- en: '***2.2.8 Commenting your code***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***If a line of R code starts with the symbol `#`, it is a comment and is not
    evaluated. We can use this to write reminders of why we wrote particular code.
    For example, in the script above we could add:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE23]'
  prefs: []
  type: TYPE_PRE
- en: '**You are ready to do exercises 1-5.*****'
  prefs: []
  type: TYPE_NORMAL
- en: '****2.3 Data types****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '****Variables in R can be of different types. For example, we need to distinguish
    numbers from character strings and tables from simple lists of numbers. The function
    `class` helps us determine what type of object we have:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE24]'
  prefs: []
  type: TYPE_PRE
- en: '*To work efficiently in R, it is important to learn the different types of
    variables and what we can do with these.'
  prefs: []
  type: TYPE_NORMAL
- en: 2.3.1 Data frames
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Up to now, the variables we have defined are just one number. This is not very
    useful for storing data. The most common way of storing a dataset in R is in a
    *data frame*. Conceptually, we can think of a data frame as a table with rows
    representing observations and the different variables reported for each observation
    defining the columns. Data frames are particularly useful for datasets because
    we can combine different data types into one object.
  prefs: []
  type: TYPE_NORMAL
- en: 'A large proportion of data analysis challenges start with data stored in a
    data frame. For example, we stored the data for our motivating example in a data
    frame. You can access this dataset by loading the **dslabs** library which provides
    the `murders` dataset:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE25]'
  prefs: []
  type: TYPE_PRE
- en: '*To see that this is in fact a data frame, we type:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE26]*'
  prefs: []
  type: TYPE_NORMAL
- en: '**2.3.2 Examining objects**'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '**The function `str` is useful for finding out more about the structure of
    an object:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE27]'
  prefs: []
  type: TYPE_PRE
- en: '*This tells us much more about the object. We see that the table has 51 rows
    (50 states plus DC) and five variables. We can show the first six lines using
    the function `head`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE28]'
  prefs: []
  type: TYPE_PRE
- en: '*In this dataset, each state is considered an observation and five variables
    are reported for each state.'
  prefs: []
  type: TYPE_NORMAL
- en: Before we go any further in answering our original question about different
    states, let’s learn more about the components of this object.****
  prefs: []
  type: TYPE_NORMAL
- en: '***2.3.3 The accessor: `$`***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***For our analysis, we will need to access the different variables represented
    by columns included in this data frame. To do this, we use the accessor operator
    `$` in the following way:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE29]'
  prefs: []
  type: TYPE_PRE
- en: '*But how did we know to use `population`? Previously, by applying the function
    `str` to the object `murders`, we revealed the names for each of the five variables
    stored in this table. We can quickly access the variable names using:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE30]'
  prefs: []
  type: TYPE_PRE
- en: '*It is important to know that the order of the entries in `murders$population`
    preserves the order of the rows in our data table. This will later permit us to
    manipulate one variable based on the results of another. For example, we will
    be able to order the state names by the number of murders.'
  prefs: []
  type: TYPE_NORMAL
- en: '*R comes with a very nice auto-complete functionality that saves us the trouble
    of typing out all the names. Try typing `murders$p` then hitting the *tab* key
    on your keyboard. This functionality and many other useful auto-complete features
    are available when working in RStudio.******'
  prefs: []
  type: TYPE_NORMAL
- en: '****2.3.4 Vectors****'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '****The object `murders$population` is not one number but several. We call
    these types of objects *vectors*. A single number is technically a vector of length
    1, but in general we use the term vectors to refer to objects with several entries.
    The function `length` tells you how many entries are in the vector:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE31]'
  prefs: []
  type: TYPE_PRE
- en: '*This particular vector is *numeric* since population sizes are numbers:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE32]'
  prefs: []
  type: TYPE_PRE
- en: '*In a numeric vector, every entry must be a number.'
  prefs: []
  type: TYPE_NORMAL
- en: 'To store character strings, vectors can also be of class *character*. For example,
    the state names are characters:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE33]'
  prefs: []
  type: TYPE_PRE
- en: '*As with numeric vectors, all entries in a character vector need to be a character.'
  prefs: []
  type: TYPE_NORMAL
- en: Another important type of vectors are *logical vectors*. These must be either
    `TRUE` or `FALSE`.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE34]'
  prefs: []
  type: TYPE_PRE
- en: '*Here the `==` is a relational operator asking if 3 is equal to 2\. In R, if
    you just use one `=`, you actually assign a variable, but if you use two `==`
    you test for equality.'
  prefs: []
  type: TYPE_NORMAL
- en: 'You can see the other *relational operators* by typing:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE35]'
  prefs: []
  type: TYPE_PRE
- en: '*In future sections, you will see how useful relational operators can be.'
  prefs: []
  type: TYPE_NORMAL
- en: We discuss more important features of vectors after the next set of exercises.
  prefs: []
  type: TYPE_NORMAL
- en: '*Mathematically, the values in `pop` are integers and there is an integer class
    in R. However, by default, numbers are assigned class numeric even when they are
    round integers. For example, `class(1)` returns numeric. You can turn them into
    class integer with the `[as.integer()](https://rdrr.io/r/base/integer.html)` function
    or by adding an `L` like this: `1L`. Note the class by typing: `class(1L)`**********'
  prefs: []
  type: TYPE_NORMAL
- en: '*****2.3.5 Factors*****'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '*****In the `murders` dataset, we might expect the region to also be a character
    vector. However, it is not:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE36]'
  prefs: []
  type: TYPE_PRE
- en: '*It is a *factor*. Factors are useful for storing categorical data. We can
    see that there are only 4 regions by using the `levels` function:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE37]'
  prefs: []
  type: TYPE_PRE
- en: '*In the background, R stores these *levels* as integers and keeps a map to
    keep track of the labels. This is more memory efficient than storing all the characters.'
  prefs: []
  type: TYPE_NORMAL
- en: Note that the levels have an order that is different from the order of appearance
    in the factor object. The default in R is for the levels to follow alphabetical
    order. However, often we want the levels to follow a different order. You can
    specify an order through the `levels` argument when creating the factor with the
    `factor` function. For example, in the murders dataset regions are ordered from
    east to west. The function `reorder` lets us change the order of the levels of
    a factor variable based on a summary computed on a numeric vector. We will demonstrate
    this with a simple example, and will see more advanced ones in the Data Visualization
    part of the book.
  prefs: []
  type: TYPE_NORMAL
- en: Suppose we want the levels of region ordered by the total number of murders
    rather than alphabetically If there are values associated with each level, we
    can use the `reorder` function and specify a data summary to determine the order.
    The following code takes the sum of the total murders in each region, and reorders
    the factor following these sums.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE38]'
  prefs: []
  type: TYPE_PRE
- en: '*The new order is in agreement with the fact that the Northeast has the least
    murders and the South has the most.'
  prefs: []
  type: TYPE_NORMAL
- en: '*Factors can be a source of confusion since sometimes they behave like characters
    and sometimes they do not. As a result, confusing factors and characters are a
    common source of bugs.*********'
  prefs: []
  type: TYPE_NORMAL
- en: '*****2.3.6 Lists*****'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '*****Data frames are a special case of *lists*. Lists are useful because you
    can store any combination of different types. You can create a list using the
    `list` function like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE39]'
  prefs: []
  type: TYPE_PRE
- en: '*The function `c` is described in [Section 2.4](#sec-vectors).'
  prefs: []
  type: TYPE_NORMAL
- en: This list includes a character, a number, a vector with five numbers, and another
    character.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE40]'
  prefs: []
  type: TYPE_PRE
- en: '*As with data frames, you can extract the components of a list with the accessor
    `$`.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE41]'
  prefs: []
  type: TYPE_PRE
- en: '*We can also use double square brackets (`[[`) like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE42]'
  prefs: []
  type: TYPE_PRE
- en: '*You should get used to the fact that in R, there are often several ways to
    do the same thing, such as accessing entries.'
  prefs: []
  type: TYPE_NORMAL
- en: You might also encounter lists without variable names.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE43]'
  prefs: []
  type: TYPE_PRE
- en: '*If a list does not have names, you cannot extract the elements with `$`, but
    you can still use the brackets method and instead of providing the variable name,
    you provide the list index, like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE44]'
  prefs: []
  type: TYPE_PRE
- en: '*We won’t be using lists until later, but you might encounter one in your own
    exploration of R. For this reason, we show you some basics here.***********'
  prefs: []
  type: TYPE_NORMAL
- en: '****2.3.7 Matrices****'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '****Matrices are another type of object that are common in R. Matrices are
    similar to data frames in that they are two-dimensional: they have rows and columns.
    However, like numeric, character and logical vectors, entries in matrices have
    to be all the same type. For this reason data frames are much more useful for
    storing data, since we can have characters, factors, and numbers in them.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Yet matrices have a major advantage over data frames: we can perform matrix
    algebra operations, a powerful type of mathematical technique. We do not describe
    these operations in this book, but much of what happens in the background when
    you perform a data analysis involves matrices. We only cover matrices briefly
    here since some of the functions we will learn return matrices. However, if you
    plan to perform more advanced work, we highly recommend learning more as they
    are widely used in data analysis.'
  prefs: []
  type: TYPE_NORMAL
- en: We can define a matrix using the `matrix` function. We need to specify the data
    in the matrix as well as the number of rows and columns.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE45]'
  prefs: []
  type: TYPE_PRE
- en: '*The shorthand using `:` is described in [Section 2.4](#sec-vectors).'
  prefs: []
  type: TYPE_NORMAL
- en: 'You can access specific entries in a matrix using square brackets (`[`). If
    you want the second row, third column, you use:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE46]'
  prefs: []
  type: TYPE_PRE
- en: '*If you want the entire second row, you leave the column spot empty:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE47]'
  prefs: []
  type: TYPE_PRE
- en: '*Notice that this returns a vector, not a matrix.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Similarly, if you want the entire third column, you leave the row spot empty:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE48]'
  prefs: []
  type: TYPE_PRE
- en: '*This is also a vector, not a matrix.'
  prefs: []
  type: TYPE_NORMAL
- en: You can access more than one column or more than one row if you like. This will
    give you a new matrix.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE49]'
  prefs: []
  type: TYPE_PRE
- en: '*You can subset both rows and columns:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE50]'
  prefs: []
  type: TYPE_PRE
- en: '*We can convert matrices into data frames using the function `as.data.frame`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE51]'
  prefs: []
  type: TYPE_PRE
- en: '*You can also use single square brackets (`[`) to access rows and columns of
    a data frame:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE52]'
  prefs: []
  type: TYPE_PRE
- en: '**You are ready to do exercises 6-11.******************'
  prefs: []
  type: TYPE_NORMAL
- en: '*****2.4 Vectors*****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '*****In R, the most basic objects available to store data are *vectors*. As
    we have seen, complex datasets can usually be broken down into components that
    are vectors. For example, in a data frame, each column is a vector. Here we learn
    more about this important class.'
  prefs: []
  type: TYPE_NORMAL
- en: 2.4.1 Creating vectors
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'We can create vectors using the function `c`, which stands for *concatenate*.
    We use `c` to concatenate entries in the following way:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE53]'
  prefs: []
  type: TYPE_PRE
- en: '*We can also create character vectors. We use the quotes to denote that the
    entries are characters rather than variable names.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE54]'
  prefs: []
  type: TYPE_PRE
- en: '*In R you can also use single quotes:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE55]'
  prefs: []
  type: TYPE_PRE
- en: '*But be careful not to confuse the single quote ’ with the *back quote* `.'
  prefs: []
  type: TYPE_NORMAL
- en: 'By now you should know that if you type:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE56]'
  prefs: []
  type: TYPE_PRE
- en: '*you receive an error because the variables `italy`, `canada`, and `egypt`
    are not defined. If we do not use the quotes, R looks for variables with those
    names and returns an error.****'
  prefs: []
  type: TYPE_NORMAL
- en: '***2.4.2 Names***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***Sometimes it is useful to name the entries of a vector. For example, when
    defining a vector of country codes, we can use the names to connect the two:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE57]'
  prefs: []
  type: TYPE_PRE
- en: '*The object `codes` continues to be a numeric vector:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE58]'
  prefs: []
  type: TYPE_PRE
- en: '*but with names:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE59]'
  prefs: []
  type: TYPE_PRE
- en: '*If the use of strings without quotes looks confusing, know that you can use
    the quotes as well:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE60]'
  prefs: []
  type: TYPE_PRE
- en: '*There is no difference between this function call and the previous one. This
    is one of the many ways in which R is quirky compared to other languages.'
  prefs: []
  type: TYPE_NORMAL
- en: 'We can also assign names using the `names` functions:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE61]*******'
  prefs: []
  type: TYPE_NORMAL
- en: '***2.4.3 Sequences***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***Another useful function for creating vectors generates sequences:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE62]'
  prefs: []
  type: TYPE_PRE
- en: '*The first argument defines the start, and the second defines the end which
    is included. The default is to go up in increments of 1, but a third argument
    lets us tell it how much to jump by:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE63]'
  prefs: []
  type: TYPE_PRE
- en: '*If we want consecutive integers, we can use the following shorthand:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE64]'
  prefs: []
  type: TYPE_PRE
- en: '*When we use these functions, R produces integers, not numerics, because they
    are typically used to index something:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE65]'
  prefs: []
  type: TYPE_PRE
- en: '*However, if we create a sequence including non-integers, the class changes:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE66]*******'
  prefs: []
  type: TYPE_NORMAL
- en: '***2.4.4 Subsetting***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***We use square brackets to access specific elements of a vector. For the
    vector `codes` we defined above, we can access the second element using:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE67]'
  prefs: []
  type: TYPE_PRE
- en: '*You can get more than one entry by using a multi-entry vector as an index:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE68]'
  prefs: []
  type: TYPE_PRE
- en: '*The sequences defined above are particularly useful if we want to access,
    say, the first two elements:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE69]'
  prefs: []
  type: TYPE_PRE
- en: '*If the elements have names, we can also access the entries using these names.
    Below are two examples.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE70]***********'
  prefs: []
  type: TYPE_NORMAL
- en: '****2.5 Coercion****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '****In general, *coercion* is an attempt by R to be flexible with data types.
    When an entry does not match the expected, some of the prebuilt R functions try
    to guess what was meant before throwing an error. This can also lead to confusion.
    Failing to understand *coercion* can drive programmers crazy when attempting to
    code in R since it behaves quite differently from most other languages in this
    regard. Let’s learn about it with some examples.'
  prefs: []
  type: TYPE_NORMAL
- en: 'We said that vectors must be all of the same type. So if we try to combine,
    say, numbers and characters, you might expect an error:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE71]'
  prefs: []
  type: TYPE_PRE
- en: '*But we don’t get one, not even a warning! What happened? Look at `x` and its
    class:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE72]'
  prefs: []
  type: TYPE_PRE
- en: '*R *coerced* the data into characters. It guessed that because you put a character
    string in the vector, you meant the 1 and 3 to actually be character strings `"1"`
    and `"3"`. The fact that not even a warning is issued is an example of how coercion
    can cause many unnoticed errors in R.'
  prefs: []
  type: TYPE_NORMAL
- en: 'R also offers functions to change from one type to another. For example, you
    can turn numbers into characters with:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE73]'
  prefs: []
  type: TYPE_PRE
- en: '*You can turn it back with `as.numeric`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE74]'
  prefs: []
  type: TYPE_PRE
- en: '*This function is actually quite useful since datasets that include numbers
    as character strings are common.********'
  prefs: []
  type: TYPE_NORMAL
- en: '****2.6 Not availables (NA)****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '****When a function tries to coerce one type to another and encounters an impossible
    case, it usually gives us a warning and turns the entry into a special value called
    an `NA` for “not available”. For example:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE75]'
  prefs: []
  type: TYPE_PRE
- en: '*R does not have any guesses for what number you want when you type `b`, so
    it does not try.'
  prefs: []
  type: TYPE_NORMAL
- en: As a data scientist you will encounter the `NA`s often as they are generally
    used for missing data, a common problem in real-world datasets.
  prefs: []
  type: TYPE_NORMAL
- en: '*You are ready to do exercises 12-23.******'
  prefs: []
  type: TYPE_NORMAL
- en: '*****2.7 Sorting*****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '*****Now that we have mastered some basic R knowledge, let’s try to gain some
    insights into the safety of different states in the context of gun murders.'
  prefs: []
  type: TYPE_NORMAL
- en: 2.7.1 `sort`
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Say we want to rank the states from least to most gun murders. The function
    `sort` sorts a vector in increasing order. We can therefore see the largest number
    of gun murders by typing:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE76]'
  prefs: []
  type: TYPE_PRE
- en: '*However, this does not give us information about which states have which murder
    totals. For example, we don’t know which state had 1257.*'
  prefs: []
  type: TYPE_NORMAL
- en: '*2.7.2 `order`*'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '*The function `order` is closer to what we want. It takes a vector as input
    and returns the vector of indexes that sorts the input vector. This may sound
    confusing so let’s look at a simple example. We can create a vector and sort it:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE77]'
  prefs: []
  type: TYPE_PRE
- en: '*Rather than sort the input vector, the function `order` returns the index
    that sorts input vector:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE78]'
  prefs: []
  type: TYPE_PRE
- en: '*This is the same output as that returned by `sort(x)`. If we look at this
    index, we see why it works:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE79]'
  prefs: []
  type: TYPE_PRE
- en: '*The second entry of `x` is the smallest, so `order(x)` starts with `2`. The
    next smallest is the third entry, so the second entry is `3` and so on.'
  prefs: []
  type: TYPE_NORMAL
- en: 'How does this help us order the states by murders? First, remember that the
    entries of vectors you access with `$` follow the same order as the rows in the
    table. For example, these two vectors containing state names and abbreviations,
    respectively, are matched by their order:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE80]'
  prefs: []
  type: TYPE_PRE
- en: '*This means we can order the state names by their total murders. We first obtain
    the index that orders the vectors according to murder totals and then index the
    state names vector:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE81]'
  prefs: []
  type: TYPE_PRE
- en: '*According to the above, California had the most murders.******'
  prefs: []
  type: TYPE_NORMAL
- en: '***2.7.3 `max` and `which.max`***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***If we are only interested in the entry with the largest value, we can use
    `max` for the value:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE82]'
  prefs: []
  type: TYPE_PRE
- en: '*and `which.max` for the index of the largest value:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE83]'
  prefs: []
  type: TYPE_PRE
- en: '*For the minimum, we can use `min` and `which.min` in the same way.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Does this mean California is the most dangerous state? In an upcoming section,
    we argue that we should be considering rates instead of totals. Before doing that,
    we introduce one last order-related function: `rank`.*****'
  prefs: []
  type: TYPE_NORMAL
- en: '***2.7.4 `rank`***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***Although not as frequently used as `order` and `sort`, the function `rank`
    is also related to order and can be useful. For any given vector it returns a
    vector with the rank of the first entry, second entry, etc., of the input vector.
    Here is a simple example:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE84]'
  prefs: []
  type: TYPE_PRE
- en: '*To summarize, let’s look at the results of the three functions we have introduced:'
  prefs: []
  type: TYPE_NORMAL
- en: '| original | sort | order | rank |'
  prefs: []
  type: TYPE_TB
- en: '| --- | --- | --- | --- |'
  prefs: []
  type: TYPE_TB
- en: '| 31 | 4 | 2 | 3 |'
  prefs: []
  type: TYPE_TB
- en: '| 4 | 15 | 3 | 1 |'
  prefs: []
  type: TYPE_TB
- en: '| 15 | 31 | 1 | 2 |'
  prefs: []
  type: TYPE_TB
- en: '| 92 | 65 | 5 | 5 |'
  prefs: []
  type: TYPE_TB
- en: '| 65 | 92 | 4 | 4 |'
  prefs: []
  type: TYPE_TB
- en: '*You are ready to do exercises 24-31**********'
  prefs: []
  type: TYPE_NORMAL
- en: '*****2.8 Vector arithmetics*****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '*****California had the most murders, but does this mean it is the most dangerous
    state? What if it just has many more people than any other state? We can quickly
    confirm that California indeed has the largest population:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE85]'
  prefs: []
  type: TYPE_PRE
- en: '*with over 37 million inhabitants. It is therefore unfair to compare the totals
    if we are interested in learning how safe the state is. What we really should
    be computing is the murders per capita. The reports we describe in the motivating
    section used murders per 100,000 as the unit. To compute this quantity, the powerful
    vector arithmetic capabilities of R come in handy.'
  prefs: []
  type: TYPE_NORMAL
- en: 2.8.1 Rescaling a vector
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'In R, arithmetic operations on vectors occur *element-wise*. For a quick example,
    suppose we have height in inches:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE86]'
  prefs: []
  type: TYPE_PRE
- en: '*and want to convert to centimeters. Notice what happens when we multiply `inches`
    by 2.54:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE87]'
  prefs: []
  type: TYPE_PRE
- en: '*In the line above, we multiplied each element by 2.54\. Similarly, if for
    each entry we want to compute how many inches taller or shorter than 69 inches,
    the average height for males, we can subtract it from every entry like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE88]**'
  prefs: []
  type: TYPE_NORMAL
- en: '**2.8.2 Two vectors**'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '**If we have two vectors of the same length, and we sum them in R, they will
    be added entry by entry as follows:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ \begin{pmatrix} a\\ b\\ c\\ d \end{pmatrix} + \begin{pmatrix} e\\ f\\ g\\
    h \end{pmatrix} = \begin{pmatrix} a +e\\ b + f\\ c + g\\ d + h \end{pmatrix} \]
  prefs: []
  type: TYPE_NORMAL
- en: The same holds for other mathematical operations, such as `-`, `*` and `/`.
  prefs: []
  type: TYPE_NORMAL
- en: 'This implies that to compute the murder rates we can simply type:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE89]'
  prefs: []
  type: TYPE_PRE
- en: '*Once we do this, we notice that California is no longer near the top of the
    list. In fact, we can use what we have learned to order the states by murder rate:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE90]***'
  prefs: []
  type: TYPE_NORMAL
- en: '***2.8.3 Beware of recycling***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***Another common source of unnoticed errors in R is the use of *recycling*.
    We saw that vectors are added elementwise. So if the vectors don’t match in length,
    it is natural to assume that we should get an error. But we don’t. Notice what
    happens:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE91]'
  prefs: []
  type: TYPE_PRE
- en: '*We do get a warning, but no error. For the output, R has recycled the numbers
    in `x`. Notice the last digit of numbers in the output.'
  prefs: []
  type: TYPE_NORMAL
- en: '*You are now ready to do exercises 32-34.***********'
  prefs: []
  type: TYPE_NORMAL
- en: '*****2.9 Indexing*****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '*****R provides a powerful and convenient way of indexing vectors. We can,
    for example, subset a vector based on properties of another vector. In this section,
    we continue working with our US murders example, which we can load like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE92]'
  prefs: []
  type: TYPE_PRE
- en: '*### 2.9.1 Subsetting with logicals'
  prefs: []
  type: TYPE_NORMAL
- en: 'We have now calculated the murder rate using:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE93]'
  prefs: []
  type: TYPE_PRE
- en: '*Imagine you are moving from Italy where, according to an ABC news report,
    the murder rate is only 0.71 per 100,000\. You would prefer to move to a state
    with a similar murder rate. Another powerful feature of R is that we can use logicals
    to index vectors. If we compare a vector to a single number, it actually performs
    the test for each entry. The following is an example related to the question above:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE94]'
  prefs: []
  type: TYPE_PRE
- en: '*If we instead want to know if a value is less or equal, we can use:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE95]'
  prefs: []
  type: TYPE_PRE
- en: '*Note that we get back a logical vector with `TRUE` for each entry smaller
    than or equal to 0.71\. To see which states these are, we can leverage the fact
    that vectors can be indexed with logicals.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE96]'
  prefs: []
  type: TYPE_PRE
- en: '*In order to count how many are TRUE, the function `sum` returns the sum of
    the entries of a vector and logical vectors get *coerced* to numeric with `TRUE`
    coded as 1 and `FALSE` as 0\. Thus we can count the states using:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE97]****'
  prefs: []
  type: TYPE_NORMAL
- en: '***2.9.2 Logical operators***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***Suppose we like the mountains and we want to move to a safe state in the
    western region of the country. We want the murder rate to be at most 1\. In this
    case, we want two different things to be true. Here we can use the logical operator
    *and*, which in R is represented with `&`. This operation results in `TRUE` only
    when both logicals are `TRUE`. To see this, consider this example:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE98]'
  prefs: []
  type: TYPE_PRE
- en: '*For our example, we can form two logicals:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE99]'
  prefs: []
  type: TYPE_PRE
- en: '*and we can use the `&` to get a vector of logicals that tells us which states
    satisfy both conditions:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE100]*****'
  prefs: []
  type: TYPE_NORMAL
- en: '***2.9.3 `which`***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***Suppose we want to look up California’s murder rate. For this type of operation,
    it is convenient to convert vectors of logicals into indexes instead of keeping
    long vectors of logicals. The function `which` tells us which entries of a logical
    vector are TRUE. So we can type:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE101]***'
  prefs: []
  type: TYPE_NORMAL
- en: '***2.9.4 `match`***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***If instead of just one state we want to find out the murder rates for several
    states, say New York, Florida, and Texas, we can use the function `match`. This
    function tells us which indexes of a second vector match each of the entries of
    a first vector:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE102]'
  prefs: []
  type: TYPE_PRE
- en: '*Now we can look at the murder rates:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE103]****'
  prefs: []
  type: TYPE_NORMAL
- en: '***2.9.5 `%in%`***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***If rather than an index we want a logical that tells us whether or not each
    element of a first vector is in a second, we can use the function `%in%`. Let’s
    imagine you are not sure if Boston, Dakota, and Washington are states. You can
    find out like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE104]'
  prefs: []
  type: TYPE_PRE
- en: '*Note that we will be using `%in%` often throughout the book.'
  prefs: []
  type: TYPE_NORMAL
- en: 'There is a connection between `match` and `%in%` through `which`. To see this,
    notice that the following two lines produce the same index (although in different
    order):'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE105]'
  prefs: []
  type: TYPE_PRE
- en: '**You are now ready to do exercises 35-42.************'
  prefs: []
  type: TYPE_NORMAL
- en: '*****2.10 Basic plots*****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '*****In [Chapter 8](../dataviz/ggplot2.html) we describe an add-on package
    that provides a powerful approach to producing plots in R. We then have an entire
    part on Data Visualization in which we provide many examples. Here we briefly
    describe some of the functions that are available in a basic R installation.'
  prefs: []
  type: TYPE_NORMAL
- en: 2.10.1 `plot`
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: The `plot` function can be used to make scatterplots. Here is a plot of total
    murders versus population.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE106]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/237a4b36072052296e2eb679cd3c407e.png)'
  prefs: []
  type: TYPE_NORMAL
- en: 'For a quick plot that avoids accessing variables twice, we can use the `with`
    function:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE107]'
  prefs: []
  type: TYPE_PRE
- en: '*The function `with` lets us use the `murders` column names in the `plot` function.
    It also works with any data frames and any function.**'
  prefs: []
  type: TYPE_NORMAL
- en: '**2.10.2 `hist`**'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '**We will describe histograms as they relate to distributions in the Data Visualization
    part of the book. Here we will simply note that histograms are a powerful graphical
    summary of a list of numbers that gives you a general overview of the types of
    values you have. We can make a histogram of our murder rates by simply typing:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE108]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/f37420e3ca023049e734ff115353b042.png)'
  prefs: []
  type: TYPE_NORMAL
- en: 'We can see that there is a wide range of values with most of them between 2
    and 3 and one very extreme case with a murder rate of more than 15:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE109]***'
  prefs: []
  type: TYPE_NORMAL
- en: '***2.10.3 `boxplot`***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***Boxplots will also be described in the Data Visualization part of the book.
    They provide a more terse summary than histograms, but they are easier to stack
    with other boxplots. For example, here we can use them to compare the different
    regions:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE110]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/5e77e8c87505b14e1d4ba1da7b182fe8.png)'
  prefs: []
  type: TYPE_NORMAL
- en: We can see that the South has higher murder rates than the other three regions.****
  prefs: []
  type: TYPE_NORMAL
- en: '***2.10.4 `image`***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***The image function displays the values in a matrix using color. Here is
    a quick example:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE111]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/b73672aa6da3d55b6b50e5d84dabad6b.png)'
  prefs: []
  type: TYPE_NORMAL
- en: '*You are now ready to do exercises 43-45.**********'
  prefs: []
  type: TYPE_NORMAL
- en: '*****2.11 Exercises*****'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '*****1\. What is the sum of the first 100 positive integers? The formula for
    the sum of integers 1 through n is \(n(n+1)/2\). Define \(n=100\) and then use
    R to compute the sum of 1 through 100 using the formula. What is the sum?'
  prefs: []
  type: TYPE_NORMAL
- en: 2\. Now use the same formula to compute the sum of the integers from 1 through
    1000.
  prefs: []
  type: TYPE_NORMAL
- en: '3\. Look at the result of typing the following code into R:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE112]'
  prefs: []
  type: TYPE_PRE
- en: '*Based on the result, what do you think the functions `seq` and `sum` do? You
    can use `help`.'
  prefs: []
  type: TYPE_NORMAL
- en: '`sum` creates a list of numbers and `seq` adds them up.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`seq` creates a list of numbers and `sum` adds them up.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`seq` creates a random list and `sum` computes the sum of 1 through 1,000.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`sum` always returns the same number.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 4\. In math and programming, we say that we evaluate a function when we replace
    the argument with a given value. So if we type `sqrt(4)`, we evaluate the `sqrt`
    function. In R, you can evaluate a function inside another function. The evaluations
    happen from the inside out. Use one line of code to compute the log, in base 10,
    of the square root of 100.
  prefs: []
  type: TYPE_NORMAL
- en: 5\. Which of the following will always return the numeric value stored in `x`?
    You can try out examples and use the help system if you want.
  prefs: []
  type: TYPE_NORMAL
- en: '`log(10^x)`'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`log10(x^10)`'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`log(exp(x))`'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`exp(log(x, base = 2))`'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 6\. Make sure the US murders dataset is loaded. Use the function `str` to examine
    the structure of the `murders` object. Which of the following best describes the
    variables represented in this data frame?
  prefs: []
  type: TYPE_NORMAL
- en: The 51 states.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: The murder rates for all 50 states and DC.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: The state name, the abbreviation of the state name, the state’s region, and
    the state’s population and total number of murders for 2010.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`str` shows no relevant information.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 7\. What are the column names used by the data frame for these five variables?
  prefs: []
  type: TYPE_NORMAL
- en: 8\. Use the accessor `$` to extract the state abbreviations and assign them
    to the object `a`. What is the class of this object?
  prefs: []
  type: TYPE_NORMAL
- en: 9\. Now use the square brackets to extract the state abbreviations and assign
    them to the object `b`. Use the `identical` function to determine if `a` and `b`
    are the same.
  prefs: []
  type: TYPE_NORMAL
- en: '10\. We saw that the `region` column stores a factor. You can corroborate this
    by typing:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE113]'
  prefs: []
  type: TYPE_PRE
- en: '*With one line of code, use the functions `levels` and `length` to determine
    the number of regions defined by this dataset.'
  prefs: []
  type: TYPE_NORMAL
- en: 11\. The function `table` takes a vector and returns the frequency of each element.
    You can quickly see how many states are in each region by applying this function.
    Use this function in one line of code to create a table of number of states per
    region.
  prefs: []
  type: TYPE_NORMAL
- en: 12\. Use the function `c` to create a vector with the average high temperatures
    in January for Beijing, Lagos, Paris, Rio de Janeiro, San Juan, and Toronto, which
    are 35, 88, 42, 84, 81, and 30 degrees Fahrenheit. Call the object `temp`.
  prefs: []
  type: TYPE_NORMAL
- en: 13\. Now create a vector with the city names and call the object `city`.
  prefs: []
  type: TYPE_NORMAL
- en: 14\. Use the `names` function and the objects defined in the previous exercises
    to associate the temperature data with its corresponding city.
  prefs: []
  type: TYPE_NORMAL
- en: 15\. Use the `[` and `:` operators to access the temperature of the first three
    cities on the list.
  prefs: []
  type: TYPE_NORMAL
- en: 16\. Use the `[` operator to access the temperature of Paris and San Juan.
  prefs: []
  type: TYPE_NORMAL
- en: 17\. Use the `:` operator to create a sequence of numbers \(12,13,14,\dots,73\).
  prefs: []
  type: TYPE_NORMAL
- en: 18\. Create a vector containing all the positive odd numbers smaller than 100.
  prefs: []
  type: TYPE_NORMAL
- en: '19\. Create a vector of numbers that starts at 6, does not pass 55, and adds
    numbers in increments of 4/7: 6, 6 + 4/7, 6 + 8/7, and so on. How many numbers
    does the list have? Hint: use `seq` and `length`.'
  prefs: []
  type: TYPE_NORMAL
- en: 20\. What is the class of the following object `a <- seq(1, 10, 0.5)`?
  prefs: []
  type: TYPE_NORMAL
- en: 21\. What is the class of the following object `a <- seq(1, 10)`?
  prefs: []
  type: TYPE_NORMAL
- en: 22\. The class of `class(a<-1)` is numeric, not integer. R defaults to numeric
    and to force an integer, you need to add the letter `L`. Confirm that the class
    of `1L` is integer.
  prefs: []
  type: TYPE_NORMAL
- en: '23\. Define the following vector:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE114]'
  prefs: []
  type: TYPE_PRE
- en: '*and coerce it to get integers.'
  prefs: []
  type: TYPE_NORMAL
- en: 24\. For exercises 24-31 we will use the US murders dataset. Make sure you load
    it prior to starting. Use the `$` operator to access the population size data
    and store it as the object `pop`. Then use the `sort` function to redefine `pop`
    so that it is sorted. Finally, use the `[` operator to report the smallest population
    size.
  prefs: []
  type: TYPE_NORMAL
- en: '25\. Now instead of the smallest population size, find the index of the entry
    with the smallest population size. Hint: use `order` instead of `sort`.'
  prefs: []
  type: TYPE_NORMAL
- en: 26\. We can actually perform the same operation as in the previous exercise
    using the function `which.min`. Write one line of code that does this.
  prefs: []
  type: TYPE_NORMAL
- en: 27\. Now we know how small the smallest state is and we know which row represents
    it. Which state is it? Define a variable `states` to be the state names from the
    `murders` data frame. Report the name of the state with the smallest population.
  prefs: []
  type: TYPE_NORMAL
- en: '28\. You can create a data frame using the `data.frame` function. Here is a
    quick example:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE115]'
  prefs: []
  type: TYPE_PRE
- en: '*Use the `rank` function to determine the population rank of each state from
    smallest population size to biggest. Save these ranks in an object called `ranks`,
    then create a data frame with the state name and its rank. Call the data frame
    `my_df`.'
  prefs: []
  type: TYPE_NORMAL
- en: '29\. Repeat the previous exercise, but this time order `my_df` so that the
    states are ordered from least populous to most populous. Hint: create an object
    `ind` that stores the indexes needed to order the population values. Then use
    the bracket operator `[` to re-order each column in the data frame.'
  prefs: []
  type: TYPE_NORMAL
- en: '30\. The `na_example` vector represents a series of counts. You can quickly
    examine the object using:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE116]'
  prefs: []
  type: TYPE_PRE
- en: '*However, when we compute the average with the function `mean`, we obtain an
    `NA`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE117]'
  prefs: []
  type: TYPE_PRE
- en: '*The `is.na` function returns a logical vector that tells us which entries
    are `NA`. Assign this logical vector to an object called `ind` and determine how
    many `NA`s does `na_example` have.'
  prefs: []
  type: TYPE_NORMAL
- en: '31\. Now compute the average again, but only for the entries that are not `NA`.
    Hint: remember the `!` operator, which turns `FALSE` into `TRUE` and vice versa.'
  prefs: []
  type: TYPE_NORMAL
- en: '32\. In exercises 28 we created the `temp` data frame:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE118]'
  prefs: []
  type: TYPE_PRE
- en: '*Remake the data frame using the code above, but add a line that converts the
    temperature from Fahrenheit to Celsius. The conversion is \(C = \frac{5}{9} \times
    (F - 32)\).'
  prefs: []
  type: TYPE_NORMAL
- en: '33\. What is the following sum \(1+1/2^2 + 1/3^2 + \dots 1/100^2\)? Hint: thanks
    to Euler, we know it should be close to \(\pi^2/6\).'
  prefs: []
  type: TYPE_NORMAL
- en: 34\. Compute the per 100,000 murder rate for each state and store it in the
    object `murder_rate`. Then compute the average murder rate for the US using the
    function `mean`. What is the average?
  prefs: []
  type: TYPE_NORMAL
- en: 35. For remaining exercises 35-42, start by loading the library and data.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE119]'
  prefs: []
  type: TYPE_PRE
- en: '*Compute the per 100,000 murder rate for each state and store it in an object
    called `murder_rate`. Then use logical operators to create a logical vector named
    `low` that tells us which entries of `murder_rate` are lower than 1.'
  prefs: []
  type: TYPE_NORMAL
- en: 36\. Now use the results from the previous exercise and the function `which`
    to determine the indices of `murder_rate` associated with values lower than 1.
  prefs: []
  type: TYPE_NORMAL
- en: 37\. Use the results from the previous exercise to report the names of the states
    with murder rates lower than 1.
  prefs: []
  type: TYPE_NORMAL
- en: '38\. Now extend the code from the exercise to report the states in the Northeast
    with murder rates lower than 1\. Hint: use the previously defined logical vector
    `low` and the logical operator `&`.'
  prefs: []
  type: TYPE_NORMAL
- en: 39\. In a previous exercise we computed the murder rate for each state and the
    average of these numbers. How many states are below the average?
  prefs: []
  type: TYPE_NORMAL
- en: '40\. Use the match function to identify the states with abbreviations AK, MI,
    and IA. Hint: start by defining an index of the entries of `murders$abb` that
    match the three abbreviations, then use the `[` operator to extract the states.'
  prefs: []
  type: TYPE_NORMAL
- en: '41\. Use the `%in%` operator to create a logical vector that answers the question:
    which of the following are actual abbreviations: MA, ME, MI, MO, MU?'
  prefs: []
  type: TYPE_NORMAL
- en: '42\. Extend the code you used in exercise 41 to report the one entry that is
    **not** an actual abbreviation. Hint: use the `!` operator, which turns `FALSE`
    into `TRUE` and vice versa, then `which` to obtain an index.'
  prefs: []
  type: TYPE_NORMAL
- en: 43\. We made a plot of total murders versus population and noted a strong relationship.
    Not surprisingly, states with larger populations had more murders.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE120]'
  prefs: []
  type: TYPE_PRE
- en: '*Keep in mind that many states have populations below 5 million and are bunched
    up. We may gain further insights from making this plot in the log scale. Transform
    the variables using the `log10` transformation and then plot them.'
  prefs: []
  type: TYPE_NORMAL
- en: 44\. Create a histogram of the state populations.
  prefs: []
  type: TYPE_NORMAL
- en: 45\. Generate boxplots of the state populations by region.**************
