  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 虽然这些绝对不是唯一的常见计数范例，但这是一个有用的集合。
- en: Permutations of Distinct Objects
  id: totrans-11
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 不区分对象的排列
- en: '***Definition***: Permutation Rule'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义***：排列规则'
- en: A permutation is an ordered arrangement of n distinct objects. Those $n$ objects
    can be permuted in $n \cdot (n – 1) \cdot (n – 2) \cdots 2 \cdot 1 = n!$ ways.
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 排列是n个区分开对象的有序排列。这些$n$个对象可以以$n \cdot (n – 1) \cdot (n – 2) \cdots 2 \cdot 1 =
    n!$种方式排列。
- en: This changes slightly if you are permuting a subset of distinct objects, or
    if some of your objects are indistinct. We will handle those cases shortly! Note
    that unique is a synonym for distinct.
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你是在排列一组区分开的对象的子集，或者其中一些对象是不区分的，那么情况会有所不同。我们很快就会处理这些情况！注意，唯一与区分是同义词。
- en: '**Example**: How many unique orderings of characters are possible for the string
    "BAYES"? **Solution**: Since the order of characters is important, we are considering
    all permutations of the 5 distinct characters B, A, Y, E, and S: $5! = 120$. Here
    is the full list:'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: '**示例**：字符串 "BAYES" 有多少种独特的字符排列顺序？**解答**：由于字符的顺序很重要，我们正在考虑5个区分开字符B、A、Y、E和S的所有排列：$5!
    = 120$。以下是完整的列表：'
- en: BAYES, BAYSE, BAEYS, BAESY, BASYE, BASEY, BYAES, BYASE, BYEAS, BYESA, BYSAE,
    BYSEA, BEAYS, BEASY, BEYAS, BEYSA, BESAY, BESYA, BSAYE, BSAEY, BSYAE, BSYEA, BSEAY,
    BSEYA, ABYES, ABYSE, ABEYS, ABESY, ABSYE, ABSEY, AYBES, AYBSE, AYEBS, AYESB, AYSBE,
    AYSEB, AEBYS, AEBSY, AEYBS, AEYSB, AESBY, AESYB, ASBYE, ASBEY, ASYBE, ASYEB, ASEBY,
