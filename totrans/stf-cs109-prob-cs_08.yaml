- en: 'Counting problems can be approached from the basic building blocks described
    in the first section: [Counting](../../part1/counting). However some counting
    problems are so ubiquitous in the world of probability that it is worth knowing
    a few higher level counting abstractions. When solving problems, if you can find
    the analogy from these canonical examples you can build off of the corresponding
    combinatorics formulas:'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 计数问题可以从第一部分描述的基本构建块中解决：[计数](../../part1/counting)。然而，一些计数问题在概率世界的普遍性如此之高，以至于了解一些高级计数抽象是有价值的。在解决问题时，如果你能从这些典型例子中找到类比，你就可以利用相应的组合公式：
- en: '[Permutations of Distinct Objects](#perm_distinct)'
  id: totrans-4
  prefs:
