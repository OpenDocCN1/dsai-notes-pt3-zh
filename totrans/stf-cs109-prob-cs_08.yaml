  type: TYPE_NORMAL
  zh: '[不区分对象的排列](#perm_indisctinct)'
- en: '[Combinations with Distinct Objects](#comb_distinct)'
  id: totrans-6
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[区分对象的组合](#comb_distinct)'
- en: '[Bucketing with Distinct Objects](#bucketing_distinct)'
  id: totrans-7
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[区分对象的分组](#bucketing_distinct)'
- en: '[Bucketing with Indistinct Objects](#bucketing_indistinct)'
  id: totrans-8
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[不区分对象的分组](#bucketing_indistinct)'
- en: '[Bucketing into Fixed Sized Containers](#bucketing_fixed)'
  id: totrans-9
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
