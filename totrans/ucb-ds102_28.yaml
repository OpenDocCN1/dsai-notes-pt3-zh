    must be shared under the same terms</title></svg>](https://creativecommons.org/licenses/by-sa/4.0/)[](https://github.com/ds-102/ds-102-book
    "GitHub Repository: ds-102/ds-102-book")[](https://github.com/ds-102/ds-102-book/edit/main/ds-102-book/content/chapters/04/06_instrumental_variables.ipynb
    "Edit This Page")'
  prefs: []
  type: TYPE_NORMAL
- en: '*Special thanks to [Yan Shuo Tan](https://sites.google.com/view/yanshuotan/home),
    who wrote most of this section’s content.*'
  prefs: []
  type: TYPE_NORMAL
- en: Review and introduction[¶](#review-and-introduction "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'To briefly recap what we have learnt so far:'
  prefs: []
  type: TYPE_NORMAL
- en: 'We defined a superpopulation model, i.e. a distribution for <semantics><mrow><mo
    stretchy="false">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo separator="true">,</mo><msub><mi>Z</mi><mi>i</mi></msub><mo
    separator="true">,</mo><msub><mi>Y</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mn>0</mn><mo
    stretchy="false">)</mo><mo separator="true">,</mo><msub><mi>Y</mi><mi>i</mi></msub><mo
    stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">(X_i,Z_i,Y_i(0),Y_i(1))</annotation></semantics>(Xi​,Zi​,Yi​(0),Yi​(1)):'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    is the (binary) treatment decision,
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>Y</mi><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y(0)</annotation></semantics>Y(0) and <semantics><mrow><mi>Y</mi><mo
    stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y(1)</annotation></semantics>Y(1) are the potential
    outcomes in the universes where the unit wasn’t/was treated,
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X
    is a confounding variable (in other words, it has a causal effect on <semantics><mrow><mi>Z</mi></mrow><annotation
    encoding="application/x-tex">Z</annotation></semantics>Z and on <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y) So far, we haven’t needed
    to make any assumptions about the distribution of these variables in general (only
    that it exists).
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
- en: 'We defined our quantity of interest, the average treatment effect (ATE): <semantics><mrow><mi>τ</mi><mo>=</mo><mi>E</mi><mo
    stretchy="false">[</mo><mi>Y</mi><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo><mo>−</mo><mi>Y</mi><mo
    stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">\tau = E[Y(1) - Y(0)]</annotation></semantics>τ=E[Y(1)−Y(0)],
    which tells us the average effect of the treatment. We saw that this is impossible
    to estimate unless we make further assumptions.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'We saw that in a randomized experiment, we have the following:'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: The treatment decisions are random, and therefore are **independent of the potential
    outcomes**.
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
- en: In other words, <semantics><mrow><mo fence="false" stretchy="true" minsize="1.2em"
    maxsize="1.2em">(</mo><mi>Y</mi><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo
    separator="true">,</mo><mi>Y</mi><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo><mo
    fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mo>⊥</mo><mtext> ⁣</mtext><mtext> ⁣</mtext><mo>⊥</mo><mi>Z</mi></mrow><annotation
    encoding="application/x-tex">\big(Y(0),Y(1)\big)\perp\!\!\perp Z</annotation></semantics>(Y(0),Y(1))⊥⊥Z.
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
- en: In this section, we’ll investigate how we can estimate the ATE in situations
    where we have unknown confounding variables. We’ll rely on **natural experiments**
    to help us. Note that you’ve probably seen [natural experiments before in Data
    8, when learning about John Snow’s study of cholera](https://inferentialthinking.com/chapters/02/2/snow-s-grand-experiment.html).
  prefs: []
  type: TYPE_NORMAL
- en: Linear structural model (LSM)[¶](#linear-structural-model-lsm "Link to this
    Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: In some fields (such as economics), it is typical to work with *structural models*,
    which place some restrictions on the joint distribution of all the variables,
    and in doing so, make it easier to estimate the parameters of the model.
  prefs: []
  type: TYPE_NORMAL
- en: 'We will work with the **linear structural model** relating our outcome <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y to our treatment <semantics><mrow><mi>Z</mi></mrow><annotation
    encoding="application/x-tex">Z</annotation></semantics>Z and confounding variable(s)
    <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>Y</mi><mo>=</mo><mi>α</mi><mo>+</mo><mi>τ</mi><mi>Z</mi><mo>+</mo><msup><mi>β</mi><mi>T</mi></msup><mi>X</mi><mo>+</mo><mi>ϵ</mi><mo
    separator="true">,</mo></mrow><annotation encoding="application/x-tex">Y = \alpha
    + \tau Z + \beta^TX + \epsilon,</annotation></semantics>Y=α+τZ+βTX+ϵ,[(1)](#zs9BGmYrn5
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: where <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ
    has mean zero, and is independent of <semantics><mrow><mi>Z</mi></mrow><annotation
    encoding="application/x-tex">Z</annotation></semantics>Z and <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X (in economics, we say
    that <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ
    is *exogenous*). We sometimes further assume that <semantics><mrow><mi>ϵ</mi><mo>∼</mo><mi
    mathvariant="script">N</mi><mo stretchy="false">(</mo><mn>0</mn><mo separator="true">,</mo><msup><mi>σ</mi><mn>2</mn></msup><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\epsilon
    \sim \mathcal{N}(0,\sigma^2)</annotation></semantics>ϵ∼N(0,σ2), but this is not
    necessary for any of the analysis we’re going to do.
  prefs: []
  type: TYPE_NORMAL
- en: '*Note: in general, we often add the further structural equation <semantics><mrow><mi>Z</mi><mo>=</mo><mi>f</mi><mo
    stretchy="false">(</mo><mi>X</mi><mo separator="true">,</mo><mi>δ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Z = f(X, \delta)</annotation></semantics>Z=f(X,δ)
    where <semantics><mrow><mi>δ</mi></mrow><annotation encoding="application/x-tex">\delta</annotation></semantics>δ
    is an exogenous noise variable, and <semantics><mrow><mi>f</mi></mrow><annotation
    encoding="application/x-tex">f</annotation></semantics>f encodes the structural
    relationship between <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X
    and <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z.
    We won’t go into this level of detail, but when reading this equation, you should
    assume that <semantics><mrow><mtext>Cov</mtext><mo stretchy="false">(</mo><mi>Z</mi><mo
    separator="true">,</mo><mi>X</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\textrm{Cov}(Z,X)</annotation></semantics>Cov(Z,X)
    is not necessarily 0.*'
  prefs: []
  type: TYPE_NORMAL
- en: This is not quite the same as the *linear model* that we have seen when we learned
    about GLMs, and that you’ve seen in previous classes! While it looks very similar,
    the linear model we worked with before is a statement about associations and predictions,
    while this linear structural model is a statement about intervention and action.
  prefs: []
  type: TYPE_NORMAL
- en: Specifically, this model assumes that if for unit <semantics><mrow><mi>i</mi></mrow><annotation
    encoding="application/x-tex">i</annotation></semantics>i, if we could set <semantics><mrow><msub><mi>Z</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">Z_i = 1</annotation></semantics>Zi​=1, we will observe
    <semantics><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mn>1</mn><mo
    stretchy="false">)</mo><mo>=</mo><mi>τ</mi><mo>+</mo><msup><mi>β</mi><mi>T</mi></msup><msub><mi>X</mi><mi>i</mi></msub><mo>+</mo><msub><mi>ϵ</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">Y_i(1) = \tau + \beta^TX_i + \epsilon_i</annotation></semantics>Yi​(1)=τ+βTXi​+ϵi​,
    and if we could set <semantics><mrow><msub><mi>Z</mi><mi>i</mi></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">Z_i = 0</annotation></semantics>Zi​=0, we will observe
    <semantics><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mn>0</mn><mo
    stretchy="false">)</mo><mo>=</mo><msup><mi>β</mi><mi>T</mi></msup><msub><mi>X</mi><mi>i</mi></msub><mo>+</mo><msub><mi>ϵ</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">Y_i(0) = \beta^TX_i + \epsilon_i</annotation></semantics>Yi​(0)=βTXi​+ϵi​.
    (If <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    is not binary, then there will be a potential outcome for each possible value
    of <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z.)
    This is a subtle but important point, that also situates the linear structural
    model as a special case of the potential outcomes framework!
  prefs: []
  type: TYPE_NORMAL
- en: From this, we see that the average treatment effect in this model is <semantics><mrow><mi>τ</mi></mrow><annotation
    encoding="application/x-tex">\tau</annotation></semantics>τ (can you show this
    is true?), and furthermore, that the individual treatment effect for every unit
    is
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mn>1</mn><mo
    stretchy="false">)</mo><mo>−</mo><msub><mi>Y</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mn>0</mn><mo
    stretchy="false">)</mo><mo>=</mo><mi>τ</mi><mi mathvariant="normal">.</mi></mrow><annotation
    encoding="application/x-tex">Y_i(1) - Y_i(0) = \tau.</annotation></semantics>Yi​(1)−Yi​(0)=τ.[(2)](#mRafan2CX7
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: In other words, the linear structural model is making an implicit assumption
    that the treatment effect is constant across all units.
  prefs: []
  type: TYPE_NORMAL
- en: Causal graphs and LSMs[¶](#causal-graphs-and-lsms "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Apart from the causal effect of <semantics><mrow><mi>Z</mi></mrow><annotation
    encoding="application/x-tex">Z</annotation></semantics>Z on <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y, the linear structural
    model also does something new from before. It asserts the causal relationships
    between the other variables, i.e. it tells us how <semantics><mrow><mi>Z</mi></mrow><annotation
    encoding="application/x-tex">Z</annotation></semantics>Z and <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y change if we manipulate
    <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X.
  prefs: []
  type: TYPE_NORMAL
- en: 'The above linear structural model can be represented graphically as follows:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/244a3b0ae034fe40592133e1f56f6784.png)'
  prefs: []
  type: TYPE_IMG
- en: As a reminder, the arrows from <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X into <semantics><mrow><mi>Z</mi></mrow><annotation
    encoding="application/x-tex">Z</annotation></semantics>Z and <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y assert that <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X causes both <semantics><mrow><mi>Z</mi></mrow><annotation
    encoding="application/x-tex">Z</annotation></semantics>Z and <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y (i.e. intervening on
    <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X
    changes the values of <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    and <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y),
    and the arrow from <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    into <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    asserts that <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    causes <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y.
  prefs: []
  type: TYPE_NORMAL
- en: Confounding and omitted variable bias[¶](#confounding-and-omitted-variable-bias
    "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'In many scenarios, confounding is complicated and involves many different variables,
    and it may be impossible to collect, observe, or describe all of them. In that
    case we must assume that <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X
    is unobserved. If this happens, then just as before, we’re in trouble because
    of *confounding*. Here are some examples. In each one, we’ve only listed one possible
    confounder <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X,
    but there are likely many more: can you think of at least one for each example?'
  prefs: []
  type: TYPE_NORMAL
- en: '| Treatment <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    | Outcome <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    | Possible confounder(s) <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X
    |'
  prefs: []
  type: TYPE_TB
- en: '| Health insurance | Health outcomes | Socioeconomic background |'
  prefs: []
  type: TYPE_TB
- en: '| Military service | Salary | Socioeconomic background |'
  prefs: []
  type: TYPE_TB
- en: '| Family size | Whether the mother is in the labor force | Socioeconomic background
    |'
  prefs: []
  type: TYPE_TB
- en: '| Years of schooling | Salary | Socioeconomic background |'
  prefs: []
  type: TYPE_TB
- en: '| Smoking | Lung cancer | Socioeconomic background |'
  prefs: []
  type: TYPE_TB
- en: Note that in most of these examples, socioeconomic background is a confounder.
    This is particularly common in economics and econometrics, where most of the methods
    in this section originated.
  prefs: []
  type: TYPE_NORMAL
- en: Let’s be a bit more precise about quantifying the effect of confounding. Specifically,
    we’ll assume the linear structural model above, and then see what happens when
    we naively try to fit a linear regression to <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y using <semantics><mrow><mi>Z</mi></mrow><annotation
    encoding="application/x-tex">Z</annotation></semantics>Z, without accounting for
    <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X.
  prefs: []
  type: TYPE_NORMAL
- en: Let <semantics><mrow><msub><mover accent="true"><mi>τ</mi><mo>^</mo></mover><mrow><mi>O</mi><mi>L</mi><mi>S</mi></mrow></msub></mrow><annotation
    encoding="application/x-tex">\hat{\tau}_{OLS}</annotation></semantics>τ^OLS​ be
    the solution of the least squares problem <semantics><mrow><msub><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>τ</mi><mo
    separator="true">,</mo><mi>α</mi></mrow></msub><mi mathvariant="double-struck">E</mi><mo
    stretchy="false">[</mo><mo stretchy="false">(</mo><mi>α</mi><mo>+</mo><mi>τ</mi><mi>Z</mi><mo>−</mo><mi>Y</mi><msup><mo
    stretchy="false">)</mo><mn>2</mn></msup><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">\min_{\tau,\alpha} \mathbb{E}[(\alpha + \tau Z -
    Y)^2]</annotation></semantics>minτ,α​E[(α+τZ−Y)2]. We then get
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><msub><mover accent="true"><mi>τ</mi><mo>^</mo></mover><mrow><mi>O</mi><mi>L</mi><mi>S</mi></mrow></msub></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mtext>Cov</mtext><mo
    stretchy="false">(</mo><mi>Y</mi><mo separator="true">,</mo><mi>Z</mi><mo stretchy="false">)</mo></mrow><mrow><mtext>Var</mtext><mo
    stretchy="false">(</mo><mi>Z</mi><mo stretchy="false">)</mo></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mtext>Cov</mtext><mo
    stretchy="false">(</mo><mi>α</mi><mo>+</mo><mi>τ</mi><mi>Z</mi><mo>+</mo><msup><mi>β</mi><mi>T</mi></msup><mi>X</mi><mo>+</mo><mi>ϵ</mi><mo
    separator="true">,</mo><mi>Z</mi><mo stretchy="false">)</mo></mrow><mrow><mtext>Var</mtext><mo
    stretchy="false">(</mo><mi>Z</mi><mo stretchy="false">)</mo></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mtext>Cov</mtext><mo
    stretchy="false">(</mo><mi>τ</mi><mi>Z</mi><mo separator="true">,</mo><mi>Z</mi><mo
    stretchy="false">)</mo></mrow><mrow><mtext>Var</mtext><mo stretchy="false">(</mo><mi>Z</mi><mo
    stretchy="false">)</mo></mrow></mfrac><mo>+</mo><mfrac><mrow><mtext>Cov</mtext><mo
    stretchy="false">(</mo><msup><mi>β</mi><mi>T</mi></msup><mi>X</mi><mo separator="true">,</mo><mi>Z</mi><mo
    stretchy="false">)</mo></mrow><mrow><mtext>Var</mtext><mo stretchy="false">(</mo><mi>Z</mi><mo
    stretchy="false">)</mo></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><munder><munder><mi>τ</mi><mo
    stretchy="true">⏟</mo></munder><mtext>true ATE</mtext></munder><mo>+</mo><munder><munder><mrow><msup><mi>β</mi><mi>T</mi></msup><mfrac><mrow><mtext>Cov</mtext><mo
    stretchy="false">(</mo><mi>X</mi><mo separator="true">,</mo><mi>Z</mi><mo stretchy="false">)</mo></mrow><mrow><mtext>Var</mtext><mo
    stretchy="false">(</mo><mi>Z</mi><mo stretchy="false">)</mo></mrow></mfrac></mrow><mo
    stretchy="true">⏟</mo></munder><mrow><mtext>bias involving </mtext><mi>X</mi></mrow></munder><mi
    mathvariant="normal">.</mi></mrow></mstyle></mtd></mtr></mtable><annotation encoding="application/x-tex">\begin{align}
    \hat{\tau}_{OLS} & = \frac{\text{Cov}(Y,Z)}{\text{Var}(Z)} \\ & = \frac{\text{Cov}(\alpha
    + \tau Z + \beta^TX + \epsilon,Z)}{\text{Var}(Z)} \\ & = \frac{\text{Cov}(\tau
    Z,Z)}{\text{Var}(Z)} + \frac{\text{Cov}(\beta^TX,Z)}{\text{Var}(Z)} \\ & = \underbrace{\tau}_\text{true
    ATE} + \underbrace{\beta^T\frac{\text{Cov}(X,Z)}{\text{Var}(Z)}}_{\text{bias involving
    }X}. \end{align}</annotation></semantics>τ^OLS​​=Var(Z)Cov(Y,Z)​=Var(Z)Cov(α+τZ+βTX+ϵ,Z)​=Var(Z)Cov(τZ,Z)​+Var(Z)Cov(βTX,Z)​=true ATEτ​​+bias involving XβTVar(Z)Cov(X,Z)​​​.​​[(3)](#h50cra254Z
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'The second term is a bias in the <semantics><mrow><msub><mi>τ</mi><mrow><mi>O</mi><mi>L</mi><mi>S</mi></mrow></msub></mrow><annotation
    encoding="application/x-tex">\tau_{OLS}</annotation></semantics>τOLS​ estimator:
    in other words, it’s the difference between the true value and the estimator,
    and it depends on the omitted (i.e., unobserved) variable <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X. So, we’ll call this
    term <semantics><mrow><msup><mi>β</mi><mi>T</mi></msup><mfrac><mrow><mtext>Cov</mtext><mo
    stretchy="false">(</mo><mi>X</mi><mo separator="true">,</mo><mi>Z</mi><mo stretchy="false">)</mo></mrow><mrow><mtext>Var</mtext><mo
    stretchy="false">(</mo><mi>Z</mi><mo stretchy="false">)</mo></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">\beta^T\frac{\text{Cov}(X,Z)}{\text{Var}(Z)}</annotation></semantics>βTVar(Z)Cov(X,Z)​
    the **omitted variable bias**.'
  prefs: []
  type: TYPE_NORMAL
- en: '*Remark: <semantics><mrow><mfrac><mrow><mtext>Cov</mtext><mo stretchy="false">(</mo><mi>Y</mi><mo
    separator="true">,</mo><mi>Z</mi><mo stretchy="false">)</mo></mrow><mrow><mtext>Var</mtext><mo
    stretchy="false">(</mo><mi>Z</mi><mo stretchy="false">)</mo></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">\frac{\text{Cov}(Y,Z)}{\text{Var}(Z)}</annotation></semantics>Var(Z)Cov(Y,Z)​
    is the infinite population version of the typical formula <semantics><mrow><msub><mover
    accent="true"><mi>τ</mi><mo>^</mo></mover><mrow><mi>O</mi><mi>L</mi><mi>S</mi></mrow></msub><mo>=</mo><mo
    stretchy="false">(</mo><msup><mi>Z</mi><mi>T</mi></msup><mi>Z</mi><msup><mo stretchy="false">)</mo><mrow><mo>−</mo><mn>1</mn></mrow></msup><msup><mi>Z</mi><mi>T</mi></msup><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">\hat{\tau}_{OLS} = (Z^TZ)^{-1}Z^TY</annotation></semantics>τ^OLS​=(ZTZ)−1ZTY,
    where we now use <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    and <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    to denote matrices/vectors.*'
  prefs: []
  type: TYPE_NORMAL
- en: '**Why can’t we just adjust for confounding?** Having such confounders is problematic
    because in order to avoid omitted variable bias, we need to have observed them,
    and added them to our regression (collection of such data may not always be feasible
    for a number of reasons.) Furthermore, there could always be *other* confounders
    that we are unaware of, which leaves our causal conclusions under an inescapable
    cloud of doubt.'
  prefs: []
  type: TYPE_NORMAL
- en: Instrumental Variables[¶](#instrumental-variables "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Is there a middle way between a randomized experiment and assuming unconfoundedness,
    which is sometimes unrealistic?
  prefs: []
  type: TYPE_NORMAL
- en: One way forward is when nature provides us with a “partial” natural experiment,
    i.e. we have a truly randomized “instrument” that injects an element of partial
    randomization into the treatment variable of interest. This is the idea of instrumental
    variables. We will first define the concept mathematically, and then illustrate
    what it means for a few examples.
  prefs: []
  type: TYPE_NORMAL
- en: '**Definition:** Assume the linear structural model defined above. We further
    assume a variable <semantics><mrow><mi>W</mi></mrow><annotation encoding="application/x-tex">W</annotation></semantics>W
    such that <semantics><mrow><mi>Z</mi><mo>=</mo><msup><mi>α</mi><mo mathvariant="normal"
    lspace="0em" rspace="0em">′</mo></msup><mo>+</mo><mi>γ</mi><mi>W</mi><mo>+</mo><mo
    stretchy="false">(</mo><msup><mi>β</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><msup><mo
    stretchy="false">)</mo><mi>T</mi></msup><mi>X</mi><mo>+</mo><mi>δ</mi></mrow><annotation
    encoding="application/x-tex">Z = \alpha'' + \gamma W + (\beta'')^TX + \delta</annotation></semantics>Z=α′+γW+(β′)TX+δ,
    with <semantics><mrow><mi>γ</mi><mo mathvariant="normal">≠</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\gamma \neq 0</annotation></semantics>γ=0 (relevance),
    <semantics><mrow><mi>W</mi></mrow><annotation encoding="application/x-tex">W</annotation></semantics>W
    independent of <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X,
    <semantics><mrow><mi>δ</mi></mrow><annotation encoding="application/x-tex">\delta</annotation></semantics>δ
    and <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ
    (exogeneity). Such a <semantics><mrow><mi>W</mi></mrow><annotation encoding="application/x-tex">W</annotation></semantics>W
    is called an *instrumental variable*.'
  prefs: []
  type: TYPE_NORMAL
- en: '*Remark:* This replaces the earlier equation from before that <semantics><mrow><mi>Z</mi><mo>=</mo><mi>f</mi><mo
    stretchy="false">(</mo><mi>X</mi><mo separator="true">,</mo><mi>δ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Z = f(X,\delta)</annotation></semantics>Z=f(X,δ).'
  prefs: []
  type: TYPE_NORMAL
- en: Let us now see how to use <semantics><mrow><mi>W</mi></mrow><annotation encoding="application/x-tex">W</annotation></semantics>W
    to identify the ATE <semantics><mrow><mi>τ</mi></mrow><annotation encoding="application/x-tex">\tau</annotation></semantics>τ.
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mtext>Cov</mtext><mo stretchy="false">(</mo><mi>Y</mi><mo
    separator="true">,</mo><mi>W</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mtext>Cov</mtext><mo stretchy="false">(</mo><mi>α</mi><mo>+</mo><mi>τ</mi><mi>Z</mi><mo>+</mo><msup><mi>β</mi><mi>T</mi></msup><mi>X</mi><mo>+</mo><mi>ϵ</mi><mo
    separator="true">,</mo><mi>W</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>τ</mi><mtext>Cov</mtext><mo
    stretchy="false">(</mo><mi>Z</mi><mo separator="true">,</mo><mi>W</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>τ</mi><mtext>Cov</mtext><mo
    stretchy="false">(</mo><msup><mi>α</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo>+</mo><mi>γ</mi><mi>W</mi><mo>+</mo><mo
    stretchy="false">(</mo><msup><mi>β</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><msup><mo
    stretchy="false">)</mo><mi>T</mi></msup><mi>X</mi><mo>+</mo><mi>δ</mi><mo separator="true">,</mo><mi>W</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mi>τ</mi><mi>γ</mi><mtext>Var</mtext><mo
    stretchy="false">(</mo><mi>W</mi><mo stretchy="false">)</mo><mi mathvariant="normal">.</mi></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} \textrm{Cov}(Y,W) & = \textrm{Cov}(\alpha
    + \tau Z + \beta^TX + \epsilon,W) \\ & = \tau \textrm{Cov}(Z,W) \\ & = \tau \textrm{Cov}(\alpha'
    + \gamma W + (\beta')^TX + \delta, W) \\ & = \tau\gamma \textrm{Var}(W). \end{align}</annotation></semantics>Cov(Y,W)​=Cov(α+τZ+βTX+ϵ,W)=τCov(Z,W)=τCov(α′+γW+(β′)TX+δ,W)=τγVar(W).​​[(4)](#TzspWIcHeX
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: Where the second equality follows from the exogeneity of <semantics><mrow><mi>W</mi></mrow><annotation
    encoding="application/x-tex">W</annotation></semantics>W. Meanwhile, a similar
    computation with <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    and <semantics><mrow><mi>W</mi></mrow><annotation encoding="application/x-tex">W</annotation></semantics>W
    gives us
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mtext>Cov</mtext><mo stretchy="false">(</mo><mi>Z</mi><mo
    separator="true">,</mo><mi>W</mi><mo stretchy="false">)</mo><mo>=</mo><mi>γ</mi><mtext>Var</mtext><mo
    stretchy="false">(</mo><mi>W</mi><mo stretchy="false">)</mo><mi mathvariant="normal">.</mi></mrow><annotation
    encoding="application/x-tex">\textrm{Cov}(Z,W) = \gamma\textrm{Var}(W).</annotation></semantics>Cov(Z,W)=γVar(W).[(5)](#MJuxMLIStz
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: Putting everything together gives
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>τ</mi><mo>=</mo><mfrac><mfrac><mrow><mtext>Cov</mtext><mo
    stretchy="false">(</mo><mi>Y</mi><mo separator="true">,</mo><mi>W</mi><mo stretchy="false">)</mo></mrow><mrow><mtext>Var</mtext><mo
    stretchy="false">(</mo><mi>W</mi><mo stretchy="false">)</mo></mrow></mfrac><mfrac><mrow><mtext>Cov</mtext><mo
    stretchy="false">(</mo><mi>Z</mi><mo separator="true">,</mo><mi>W</mi><mo stretchy="false">)</mo></mrow><mrow><mtext>Var</mtext><mo
    stretchy="false">(</mo><mi>W</mi><mo stretchy="false">)</mo></mrow></mfrac></mfrac><mi
    mathvariant="normal">.</mi></mrow><annotation encoding="application/x-tex">\tau
    = \frac{\frac{\textrm{Cov}(Y,W)}{\textrm{Var}(W)}}{\frac{\textrm{Cov}(Z,W)}{\textrm{Var}(W)}}.</annotation></semantics>τ=Var(W)Cov(Z,W)​Var(W)Cov(Y,W)​​.[(6)](#CoOOEAsohK
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: In other words, <semantics><mrow><mi>τ</mi></mrow><annotation encoding="application/x-tex">\tau</annotation></semantics>τ
    is the ratio between the (infinite population) regression coefficient of <semantics><mrow><mi>W</mi></mrow><annotation
    encoding="application/x-tex">W</annotation></semantics>W on <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y, and that of <semantics><mrow><mi>W</mi></mrow><annotation
    encoding="application/x-tex">W</annotation></semantics>W on <semantics><mrow><mi>Z</mi></mrow><annotation
    encoding="application/x-tex">Z</annotation></semantics>Z.
  prefs: []
  type: TYPE_NORMAL
- en: 'This motivates the **instrumental variable estimator** of the ATE in finite
    samples:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><msub><mover accent="true"><mi>τ</mi><mo>^</mo></mover><mrow><mi>I</mi><mi>V</mi></mrow></msub><mo>=</mo><mfrac><mover><mover><mrow><mo
    stretchy="false">(</mo><msup><mi>W</mi><mi>T</mi></msup><mi>W</mi><msup><mo stretchy="false">)</mo><mrow><mo>−</mo><mn>1</mn></mrow></msup><msup><mi>W</mi><mi>T</mi></msup><mi>Y</mi></mrow><mo
    stretchy="true">⏞</mo></mover><mtext>OLS coeff. of W for Y</mtext></mover><munder><munder><mrow><mo
    stretchy="false">(</mo><msup><mi>W</mi><mi>T</mi></msup><mi>W</mi><msup><mo stretchy="false">)</mo><mrow><mo>−</mo><mn>1</mn></mrow></msup><msup><mi>W</mi><mi>T</mi></msup><mi>Z</mi></mrow><mo
    stretchy="true">⏟</mo></munder><mtext>OLS coeff. of W for Z</mtext></munder></mfrac><mo
    separator="true">,</mo></mrow><annotation encoding="application/x-tex">\hat{\tau}_{IV}
    = \frac{\overbrace{(W^TW)^{-1}W^TY}^{\text{OLS coeff. of W for Y}}}{\underbrace{(W^TW)^{-1}W^TZ}_{\text{OLS
    coeff. of W for Z}}},</annotation></semantics>τ^IV​=OLS coeff. of W for Z(WTW)−1WTZ​​(WTW)−1WTY​OLS coeff. of W for Y​​,[(7)](#HDce2WFnhW
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: where again, abusing notation, <semantics><mrow><mi>W</mi></mrow><annotation
    encoding="application/x-tex">W</annotation></semantics>W, <semantics><mrow><mi>Z</mi></mrow><annotation
    encoding="application/x-tex">Z</annotation></semantics>Z and <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y refer to the vectors
    of observations. If <semantics><mrow><msup><mi>α</mi><mo mathvariant="normal"
    lspace="0em" rspace="0em">′</mo></msup><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\alpha' = 0</annotation></semantics>α′=0, then this
    is a plug-in estimator of <semantics><mrow><mi>τ</mi></mrow><annotation encoding="application/x-tex">\tau</annotation></semantics>τ,
    and is consistent.
  prefs: []
  type: TYPE_NORMAL
- en: '**Further interpretation for binary <semantics><mrow><mi>W</mi></mrow><annotation
    encoding="application/x-tex">W</annotation></semantics>W:** When <semantics><mrow><mi>W</mi></mrow><annotation
    encoding="application/x-tex">W</annotation></semantics>W is binary, we can show
    that'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>τ</mi><mo>=</mo><mfrac><mrow><mi mathvariant="double-struck">E</mi><mo
    stretchy="false">[</mo><mi>Y</mi><mi mathvariant="normal">∣</mi><mi>W</mi><mo>=</mo><mn>1</mn><mo
    stretchy="false">]</mo><mo>−</mo><mi mathvariant="double-struck">E</mi><mo stretchy="false">[</mo><mi>Y</mi><mi
    mathvariant="normal">∣</mi><mi>W</mi><mo>=</mo><mn>0</mn><mo stretchy="false">]</mo></mrow><mrow><mi
    mathvariant="double-struck">E</mi><mo stretchy="false">[</mo><mi>Z</mi><mi mathvariant="normal">∣</mi><mi>W</mi><mo>=</mo><mn>1</mn><mo
    stretchy="false">]</mo><mo>−</mo><mi mathvariant="double-struck">E</mi><mo stretchy="false">[</mo><mi>Z</mi><mi
    mathvariant="normal">∣</mi><mi>W</mi><mo>=</mo><mn>0</mn><mo stretchy="false">]</mo></mrow></mfrac><mi
    mathvariant="normal">.</mi></mrow><annotation encoding="application/x-tex">\tau
    = \frac{\mathbb{E}[Y|W=1] - \mathbb{E}[Y|W=0]}{\mathbb{E}[Z|W=1] - \mathbb{E}[Z|W=0]}.</annotation></semantics>τ=E[Z∣W=1]−E[Z∣W=0]E[Y∣W=1]−E[Y∣W=0]​.[(8)](#MNVgsVUff6
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: Hence, we can think of IV as measuring the ratio of the prima facie treatment
    effect of <semantics><mrow><mi>W</mi></mrow><annotation encoding="application/x-tex">W</annotation></semantics>W
    on <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    and that of <semantics><mrow><mi>W</mi></mrow><annotation encoding="application/x-tex">W</annotation></semantics>W
    on <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z.
  prefs: []
  type: TYPE_NORMAL
- en: Causal graph for instrumental variables[¶](#causal-graph-for-instrumental-variables
    "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The relationships between <semantics><mrow><mi>W</mi><mo separator="true">,</mo><mi>Z</mi><mo
    separator="true">,</mo><mi>X</mi></mrow><annotation encoding="application/x-tex">W,
    Z, X</annotation></semantics>W,Z,X, and <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y can be represented as
    the following causal graph:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/2b9677f72222bb1dba10bdc5317df934.png)'
  prefs: []
  type: TYPE_IMG
- en: 'How to read this graph:'
  prefs: []
  type: TYPE_NORMAL
- en: The arrow from <semantics><mrow><mi>W</mi></mrow><annotation encoding="application/x-tex">W</annotation></semantics>W
    into <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    shows that <semantics><mrow><mi>W</mi></mrow><annotation encoding="application/x-tex">W</annotation></semantics>W
    has a causal effect on <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: The absence of any arrow into <semantics><mrow><mi>W</mi></mrow><annotation
    encoding="application/x-tex">W</annotation></semantics>W means that <semantics><mrow><mi>W</mi></mrow><annotation
    encoding="application/x-tex">W</annotation></semantics>W is exogeneous, i.e. no
    variable in the diagram causes <semantics><mrow><mi>W</mi></mrow><annotation encoding="application/x-tex">W</annotation></semantics>W,
    and in particular <semantics><mrow><mi>W</mi></mrow><annotation encoding="application/x-tex">W</annotation></semantics>W
    is independent of <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: The absence of an arrow from <semantics><mrow><mi>W</mi></mrow><annotation encoding="application/x-tex">W</annotation></semantics>W
    into <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    means that the only effect of <semantics><mrow><mi>W</mi></mrow><annotation encoding="application/x-tex">W</annotation></semantics>W
    on <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    is through <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: We shaded in <semantics><mrow><mi>W</mi></mrow><annotation encoding="application/x-tex">W</annotation></semantics>W,
    <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    and <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    because these nodes are observed, but <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X is unshaded because it
    is latent (unobserved).
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Note that we do not need to know or even be aware of what <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X is in order for instrumental
    variables to work! It doesn’t matter how many confounders there are, or whether
    we’re even able to list all of them: as long as we can guarantee that they do
    not have any causal relationship to the instrument (exclusion restriction), instrumental
    variables will work.'
  prefs: []
  type: TYPE_NORMAL
- en: Examples of instrumental variables[¶](#examples-of-instrumental-variables "Link
    to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'Let’s examine what we might use as instrumental variables for the five examples
    from the table in the previous section. The first four are taken from the econometrics
    literature:'
  prefs: []
  type: TYPE_NORMAL
- en: '**Example 1:** <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    is health insurance, <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    is health outcomes, <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X
    is socioeconomic background. Baicker et al. (2013) used the 2008 expansion of
    Medicaid in Oregon via lottery. The instrument <semantics><mrow><mi>W</mi></mrow><annotation
    encoding="application/x-tex">W</annotation></semantics>W here was the lottery
    assignment. We previously talked about why this was an imperfect experiment because
    of compliance reasons (only a fraction of individuals who won the lottery enrolled
    into Medicaid), so IV provides a way of overcoming this limitation.'
  prefs: []
  type: TYPE_NORMAL
- en: '**Example 2:** <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    is military service, <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    is salary, <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X
    is socioeconomic background. Angrist (1990) used the Vietnam era draft lottery
    as the instrument <semantics><mrow><mi>W</mi></mrow><annotation encoding="application/x-tex">W</annotation></semantics>W,
    and found that among white veterans, there was a 15% drop in earnings compared
    to non-veterans.'
  prefs: []
  type: TYPE_NORMAL
- en: '**Example 3:** <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    is family size, <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    is mother’s employment, <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X
    is socioeconomic background. Angrist and Evans (1998) used sibling sex decomposition
    (in other words, the assigned sexes at birth of a sibling) as the IV. This is
    plausible because of the pseudo randomization of the sibling sex composition.
    This is based on the fact that parents in the US with two children of the same
    sex are more likely to have a third child than those parents with two children
    of different sex.'
  prefs: []
  type: TYPE_NORMAL
- en: '**Example 4:** <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    is years of schooling, <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    is salary, <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X
    is socioeconomic background. Card (1993) used geographical variation in college
    proximity as the instrumental variable.'
  prefs: []
  type: TYPE_NORMAL
- en: '**Example 5:** <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    is smoking, <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    is lung cancer, <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X
    is socioeconomic background. Unfortunately, this example does not lend itself
    well to an instrumental variable: despite decades of searching, nobody has yet
    found one that is convincing. This leads to an important lesson: **not every problem
    is amenable to the use of instrumental variables, or even natural experiments!**'
  prefs: []
  type: TYPE_NORMAL
- en: 'As we see in these examples, sometimes you need to be quite ingenious to come
    up with an appropriate instrumental variable. Joshua Angrist, David Card, and
    Guido Imbens, who is named in several of these examples, are phenomenally good
    at this: in fact, they won the Nobel Prize in economics for their collected body
    of work!'
  prefs: []
  type: TYPE_NORMAL
- en: Extensions[¶](#extensions "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Multiple treatments / instruments, and two-stage least squares.[¶](#multiple-treatments-instruments-and-two-stage-least-squares
    "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: So far, we have considered scalar treatment and instrumental variables <semantics><mrow><mi>Z</mi></mrow><annotation
    encoding="application/x-tex">Z</annotation></semantics>Z and <semantics><mrow><mi>W</mi></mrow><annotation
    encoding="application/x-tex">W</annotation></semantics>W. It is also possible
    to consider vector-valued instruments and treatments. To generalize IV to this
    setting, we need to recast the IV estimator in the previous sections as follows.
  prefs: []
  type: TYPE_NORMAL
- en: First define the conditional expectation <semantics><mrow><mover accent="true"><mi>Z</mi><mo>~</mo></mover><mo>=</mo><mi
    mathvariant="double-struck">E</mi><mo stretchy="false">[</mo><mi>Z</mi><mi mathvariant="normal">∣</mi><mi>W</mi><mo
    stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">\tilde{Z}
    = \mathbb{E}[Z|W]</annotation></semantics>Z~=E[Z∣W], and observe that <semantics><mrow><mover
    accent="true"><mi>Z</mi><mo>~</mo></mover><mo>=</mo><msup><mi>α</mi><mo mathvariant="normal"
    lspace="0em" rspace="0em">′</mo></msup><mo>+</mo><mi>W</mi><mi>γ</mi></mrow><annotation
    encoding="application/x-tex">\tilde{Z} = \alpha' + W\gamma</annotation></semantics>Z~=α′+Wγ.
  prefs: []
  type: TYPE_NORMAL
- en: If we regress <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    on <semantics><mrow><mover accent="true"><mi>Z</mi><mo>~</mo></mover></mrow><annotation
    encoding="application/x-tex">\tilde{Z}</annotation></semantics>Z~, the regression
    coefficient we obtain is $$
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mfrac><mrow><mtext>Cov</mtext><mo stretchy="false">(</mo><mover
    accent="true"><mi>Z</mi><mo>~</mo></mover><mo separator="true">,</mo><mi>Y</mi><mo
    stretchy="false">)</mo></mrow><mrow><mtext>Var</mtext><mo stretchy="false">(</mo><mover
    accent="true"><mi>Z</mi><mo>~</mo></mover><mo stretchy="false">)</mo></mrow></mfrac></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mtext>Cov</mtext><mo
    stretchy="false">(</mo><mover accent="true"><mi>Z</mi><mo>~</mo></mover><mo separator="true">,</mo><mi>α</mi><mo>+</mo><mi>τ</mi><mi>Z</mi><mo>+</mo><msup><mi>β</mi><mi>T</mi></msup><mi>X</mi><mo>+</mo><mi>ϵ</mi><mo
    stretchy="false">)</mo></mrow><mrow><mtext>Var</mtext><mo stretchy="false">(</mo><mover
    accent="true"><mi>Z</mi><mo>~</mo></mover><mo stretchy="false">)</mo></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mtext>Cov</mtext><mo
    stretchy="false">(</mo><mover accent="true"><mi>Z</mi><mo>~</mo></mover><mo separator="true">,</mo><mi>τ</mi><mi>Z</mi><mo
    stretchy="false">)</mo></mrow><mrow><mtext>Var</mtext><mo stretchy="false">(</mo><mover
    accent="true"><mi>Z</mi><mo>~</mo></mover><mo stretchy="false">)</mo></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>τ</mi><mfrac><mrow><mtext>Cov</mtext><mo
    stretchy="false">(</mo><mover accent="true"><mi>Z</mi><mo>~</mo></mover><mo separator="true">,</mo><mi>Z</mi><mo
    stretchy="false">)</mo></mrow><mrow><mtext>Var</mtext><mo stretchy="false">(</mo><mover
    accent="true"><mi>Z</mi><mo>~</mo></mover><mo stretchy="false">)</mo></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>τ</mi><mi mathvariant="normal">.</mi></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} \frac{\textrm{Cov}(\tilde{Z},Y)}{\textrm{Var}(\tilde{Z})}
    & = \frac{\textrm{Cov}(\tilde{Z}, \alpha + \tau Z + \beta^TX + \epsilon)}{\textrm{Var}(\tilde{Z})}
    \\ & = \frac{\textrm{Cov}(\tilde{Z}, \tau Z)}{\textrm{Var}(\tilde{Z})} \\ & =
    \tau\frac{\textrm{Cov}(\tilde{Z}, Z)}{\textrm{Var}(\tilde{Z})} \\ & = \tau. \end{align}</annotation></semantics>Var(Z~)Cov(Z~,Y)​​=Var(Z~)Cov(Z~,α+τZ+βTX+ϵ)​=Var(Z~)Cov(Z~,τZ)​=τVar(Z~)Cov(Z~,Z)​=τ.​​[(9)](#xhPHmx4Ybo
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: $$
  prefs: []
  type: TYPE_NORMAL
- en: Here, the 2nd equality holds because <semantics><mrow><mi>W</mi></mrow><annotation
    encoding="application/x-tex">W</annotation></semantics>W is independent of all
    <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X
    and <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ,
    while the 4th equality holds because of a property of conditional expectations
    (one can also check this by hand by expanding out <semantics><mrow><mi>Z</mi><mo>=</mo><msup><mi>α</mi><mo
    mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo>+</mo><mi>γ</mi><mi>W</mi><mo>+</mo><mo
    stretchy="false">(</mo><msup><mi>β</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><msup><mo
    stretchy="false">)</mo><mi>T</mi></msup><mi>X</mi><mo>+</mo><mi>δ</mi></mrow><annotation
    encoding="application/x-tex">Z = \alpha' + \gamma W + (\beta')^TX + \delta</annotation></semantics>Z=α′+γW+(β′)TX+δ.)
  prefs: []
  type: TYPE_NORMAL
- en: 'In finite samples, we thus arrive at the following algorithm:'
  prefs: []
  type: TYPE_NORMAL
- en: '**Two-stage least squares algorithm (2SLS):**'
  prefs: []
  type: TYPE_NORMAL
- en: 'Step 1: Regress <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    on <semantics><mrow><mi>W</mi></mrow><annotation encoding="application/x-tex">W</annotation></semantics>W
    to get <semantics><mrow><mover accent="true"><mi>Z</mi><mo>~</mo></mover><mo>=</mo><mi>W</mi><mover
    accent="true"><mi>γ</mi><mo>^</mo></mover><mo>=</mo><mi>W</mi><mo stretchy="false">(</mo><msup><mi>W</mi><mi>T</mi></msup><mi>W</mi><msup><mo
    stretchy="false">)</mo><mrow><mo>−</mo><mn>1</mn></mrow></msup><msup><mi>W</mi><mi>T</mi></msup><mi>Z</mi></mrow><annotation
    encoding="application/x-tex">\tilde{Z} = W\hat{\gamma} = W(W^TW)^{-1}W^TZ</annotation></semantics>Z~=Wγ^​=W(WTW)−1WTZ.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Step 2: Regress <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    on <semantics><mrow><mover accent="true"><mi>Z</mi><mo>~</mo></mover></mrow><annotation
    encoding="application/x-tex">\tilde{Z}</annotation></semantics>Z~ to get <semantics><mrow><msub><mover
    accent="true"><mi>τ</mi><mo>^</mo></mover><mrow><mn>2</mn><mi>S</mi><mi>L</mi><mi>S</mi></mrow></msub><mo>=</mo><mo
    stretchy="false">(</mo><msup><mover accent="true"><mi>Z</mi><mo>~</mo></mover><mi>T</mi></msup><mover
    accent="true"><mi>Z</mi><mo>~</mo></mover><msup><mo stretchy="false">)</mo><mrow><mo>−</mo><mn>1</mn></mrow></msup><msup><mover
    accent="true"><mi>Z</mi><mo>~</mo></mover><mi>T</mi></msup><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">\hat{\tau}_{2SLS} = (\tilde{Z}^T\tilde{Z})^{-1}\tilde{Z}^TY</annotation></semantics>τ^2SLS​=(Z~TZ~)−1Z~TY.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: For the scalar setting, it is easy to see that <semantics><mrow><msub><mover
    accent="true"><mi>τ</mi><mo>^</mo></mover><mrow><mn>2</mn><mi>S</mi><mi>L</mi><mi>S</mi></mrow></msub><mo>=</mo><msub><mover
    accent="true"><mi>τ</mi><mo>^</mo></mover><mrow><mi>I</mi><mi>V</mi></mrow></msub></mrow><annotation
    encoding="application/x-tex">\hat{\tau}_{2SLS} = \hat{\tau}_{IV}</annotation></semantics>τ^2SLS​=τ^IV​,
    but the benefit of this formulation is that it directly applies for vector-valued
    <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    and <semantics><mrow><mi>W</mi></mrow><annotation encoding="application/x-tex">W</annotation></semantics>W.
  prefs: []
  type: TYPE_NORMAL
- en: (Optional) A non-parametric perspective on instrumental variables[¶](#id-optional-a-non-parametric-perspective-on-instrumental-variables
    "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: In this notebook, we have introduced instrumental variables in the context of
    structural linear models. What if our model is nonlinear?
  prefs: []
  type: TYPE_NORMAL
- en: In an amazing coincidence, for binary treatment <semantics><mrow><mi>Z</mi></mrow><annotation
    encoding="application/x-tex">Z</annotation></semantics>Z, the expression
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>τ</mi><mo>=</mo><mfrac><mrow><mi mathvariant="double-struck">E</mi><mo
    stretchy="false">[</mo><mi>Y</mi><mi mathvariant="normal">∣</mi><mi>W</mi><mo>=</mo><mn>1</mn><mo
    stretchy="false">]</mo><mo>−</mo><mi mathvariant="double-struck">E</mi><mo stretchy="false">[</mo><mi>Y</mi><mi
    mathvariant="normal">∣</mi><mi>W</mi><mo>=</mo><mn>0</mn><mo stretchy="false">]</mo></mrow><mrow><mi
    mathvariant="double-struck">E</mi><mo stretchy="false">[</mo><mi>Z</mi><mi mathvariant="normal">∣</mi><mi>W</mi><mo>=</mo><mn>1</mn><mo
    stretchy="false">]</mo><mo>−</mo><mi mathvariant="double-struck">E</mi><mo stretchy="false">[</mo><mi>Z</mi><mi
    mathvariant="normal">∣</mi><mi>W</mi><mo>=</mo><mn>0</mn><mo stretchy="false">]</mo></mrow></mfrac><mi
    mathvariant="normal">.</mi></mrow><annotation encoding="application/x-tex">\tau
    = \frac{\mathbb{E}[Y|W=1] - \mathbb{E}[Y|W=0]}{\mathbb{E}[Z|W=1] - \mathbb{E}[Z|W=0]}.</annotation></semantics>τ=E[Z∣W=1]−E[Z∣W=0]E[Y∣W=1]−E[Y∣W=0]​.[(10)](#p9loNxBkav
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: has a meaning beyond the linear model setting. This is the subject of this groundbreaking
    [paper](https://www.jstor.org/stable/2291629?seq=1) by Angrist and Imbens in 1996.
  prefs: []
  type: TYPE_NORMAL
