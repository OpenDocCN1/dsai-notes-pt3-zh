  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://data102.org/ds-102-book/content/chapters/04/instrumental-variables](https://data102.org/ds-102-book/content/chapters/04/instrumental-variables)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '[<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" width="1.25rem"
