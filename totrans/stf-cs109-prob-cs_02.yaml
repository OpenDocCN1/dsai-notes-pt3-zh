- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: '***Definition:*** Empirical Definition of Probability'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义***：概率的经验定义'
- en: 'The probability of any event $E$ can be defined as:'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 任何事件 $E$ 的概率可以这样定义：
- en: $$ \p(E) = \lim_{n \rightarrow \infty} \frac {\text{count}(E)} {n} $$
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: $$ \p(E) = \lim_{n \rightarrow \infty} \frac {\text{count}(E)} {n} $$
- en: Where $\text{count}(E)$ is the number of times that $E$ occured in $n$ experiments.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 其中 $\text{count}(E)$ 是 $E$ 在 $n$ 次实验中发生的次数。
- en: '***Definition:*** Core Identities'
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义：*** 核心恒等式'
- en: For an event $E$ and a sample space $S$
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 对于事件 $E$ 和样本空间 $S$
- en: '| $0 ≤ \p(E) ≤ 1$ | All probabilities are numbers between 0 and 1. |'
  id: totrans-9
  prefs: []
  type: TYPE_TB
  zh: '| $0 ≤ \p(E) ≤ 1$ | 所有概率都是介于 0 和 1 之间的数字。|'
- en: '| **$\p(S) = 1$** | All outcomes must be from the Sample Space. |'
  id: totrans-10
  prefs: []
  type: TYPE_TB
  zh: '| **$\p(S) = 1$** | 所有结果必须来自样本空间。|'
- en: '| $\P(E) = 1 - \P(E^\c)$ | The probability of an event from its complement.
    |'
  id: totrans-11
  prefs: []
  type: TYPE_TB
  zh: '| $\P(E) = 1 - \P(E^\c)$ | 从事件的补集中计算事件发生的概率。|'
- en: '***Definition:*** Probability of Equally Likely Outcomes'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义***：等可能结果的概率'
- en: 'If $S$ is a sample space with equally likely outcomes, for an event $E$ that
    is a subset of the outcomes in $S$: $$ \begin{align} \p(E) &= \frac{\text{number
    of outcomes in $E$}}{\text{number of outcomes in $S$}} = \frac{|E|}{|S|} \end{align}
    $$***Definition***: Conditional Probability.'
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 如果 $S$ 是一个具有等可能结果的样本空间，对于 $S$ 中结果的一个子集事件 $E$：$$ \begin{align} \p(E) &= \frac{\text{在
    $E$ 中的结果数量}}{\text{在 $S$ 中的结果数量}} = \frac{|E|}{|S|} \end{align} $$***定义***：条件概率。
- en: 'The probability of $E$ given that (aka conditioned on) event $F$ already happened:
    $$ \p(E |F) = \frac{\p(E \and F)}{\p(F)} $$'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 在事件 $F$ 已经发生的情况下（即条件为）事件 $E$ 的概率：$$ \p(E |F) = \frac{\p(E \and F)}{\p(F)} $$
- en: '***Definition***: Probability of **or** with Mututally Exclusive Events'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义***：相互独立事件的**或**的概率'
- en: 'If two events $E$ and $F$ are mutually exclusive then the probability of $E$
    ***or*** $F$ occurring is: $$ \p(E \or F) = \p(E) + \p(F) $$'
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 如果两个事件 $E$ 和 $F$ 是互斥的，那么 $E$ 或 $F$ 发生的概率是：$$ \p(E \or F) = \p(E) + \p(F) $$
- en: 'For $n$ events $E_1, E_2, \dots E_n$ where each event is mutually exclusive
    of one another (in other words, no outcome is in more than one event). Then: $$
    \p(E_1 \or E_2 \or \dots \or E_n) = \p(E_1) + \p(E_2) + \dots + \p(E_n) = \sum_{i=1}^n
    \p(E_i) $$'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 对于 $n$ 个事件 $E_1, E_2, \dots E_n$，其中每个事件都是相互独立的（换句话说，没有结果在多个事件中）。那么：$$ \p(E_1
    \or E_2 \or \dots \or E_n) = \p(E_1) + \p(E_2) + \dots + \p(E_n) = \sum_{i=1}^n
    \p(E_i) $$
- en: '***Definition***: General Probability of **or** (Inclusion-Exclusion)'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义***：**或**的通用概率（包含-排除法则）'
- en: 'For any two events $E$ and $F$: $$ \p(E \or F) = \p(E) + \p(F) − \p(E \and
    F) $$'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 对于任意两个事件 $E$ 和 $F$：$$ \p(E \or F) = \p(E) + \p(F) − \p(E \and F) $$
- en: 'For three events, $E$, $F$, and $G$ the formula is: $$ \begin{align} \p(E \or
    F \or G) =& \text{ }\p(E) + \p(F) + \p(G) \\ & −\p(E \and F) − \p(E \and G)−P(F
    \and G) \\ & +\p(E \and F \and G) \end{align} $$'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 对于三个事件，$E$、$F$ 和 $G$，公式如下：$$ \begin{align} \p(E \or F \or G) =& \text{ }\p(E)
    + \p(F) + \p(G) \\ & −\p(E \and F) − \p(E \and G)−\p(F \and G) \\ & +\p(E \and
    F \and G) \end{align} $$
- en: 'For more than three events see the chapter of [probability of or](../../part1/prob_or).***Definition***:
    Probability of **and** for Independent Events.'
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 对于超过三个事件，请参阅[概率或](../../part1/prob_or)章节。***定义***：独立事件的**和**的概率。
- en: 'If two events: $E$, $F$ are independent then the probability of $E$ ***and***
    $F$ occurring is: $$ \p(E \and F) = \p(E) \cdot \p(F) $$'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 如果两个事件：$E$、$F$ 是独立的，那么 $E$ 和 $F$ 同时发生的概率是：$$ \p(E \and F) = \p(E) \cdot \p(F)
    $$
- en: 'For $n$ events $E_1, E_2, \dots E_n$ that are independent of one another: $$
    \p(E_1 \and E_2 \and \dots \and E_n) = \prod_{i=1}^n \p(E_i) $$'
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 对于 $n$ 个相互独立的事件 $E_1, E_2, \dots E_n$：$$ \p(E_1 \and E_2 \and \dots \and E_n)
    = \prod_{i=1}^n \p(E_i) $$
- en: '***Definition***: General Probability of **and** (The Chain Rule)'
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义***：**和**的通用概率（链式法则）'
- en: 'For any two events $E$ and $F$: $$ \p(E \and F) = \p(E | F) \cdot \p(F) $$'
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: 对于任意两个事件 $E$ 和 $F$：$$ \p(E \and F) = \p(E | F) \cdot \p(F) $$
- en: 'For $n$ events $E_1, E_2, \dots E_n$: $$ \begin{align} \p(E_1 \and E_2 \and
    \dots \and E_n) = &\p(E_1) \cdot \p(E_2|E_1) \cdot \p(E_3 |E_1 \and E_2) \dots
    \\ &\p(E_n|E_1 \dots E_{n−1}) \end{align} $$'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 对于 $n$ 个事件 $E_1, E_2, \dots E_n$：$$ \begin{align} \p(E_1 \and E_2 \and \dots
    \and E_n) = &\p(E_1) \cdot \p(E_2|E_1) \cdot \p(E_3 |E_1 \and E_2) \dots \\ &\p(E_n|E_1
    \dots E_{n−1}) \end{align} $$
- en: '***Definition***: The Law of Total Probability'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义***：全概率公式'
- en: 'For any two events $E$ and $F$: $$ \begin{align} \p(E) &= \p(E \and F) + \p(E
    \and F\c)\\ &=\p(E | F) \p(F) + \p(E | F\c) \p(F\c) \end{align} $$'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 对于任意两个事件 $E$ 和 $F$：$$ \begin{align} \p(E) &= \p(E \and F) + \p(E \and F\c)\\
    &=\p(E | F) \p(F) + \p(E | F\c) \p(F\c) \end{align} $$
- en: 'For [mutually exclusive](../../part1/prob_or/) events: $B_1, B_2, \dots B_n$
    such that every outcome in the sample space falls into one of those events: $$
    \begin{align} \p(E) &= \sum_{i=1}^n \p(E \and B_i) && \text{Extension of our observation}\\
    &= \sum_{i=1}^n \p(E | B_i) \p(B_i) && \text{Using chain rule on each term} \end{align}
    $$'
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: 对于[互斥](../../part1/prob_or/)事件：$B_1, B_2, \dots B_n$，其中样本空间中的每个结果都落在这些事件之一中：$$
    \begin{align} \p(E) &= \sum_{i=1}^n \p(E \and B_i) && \text{扩展我们的观察}\\ &= \sum_{i=1}^n
    \p(E | B_i) \p(B_i) && \text{对每个项使用链式法则} \end{align} $$
- en: '***Definition***: Bayes'' Theorem'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义***：贝叶斯定理'
- en: 'The most common form of Bayes'' Theorem is **Bayes'' Theorem Classic**: $$
    \p(B|E) = \frac{\p(E | B) \cdot \p(B)}{\p(E)} $$'
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: 贝叶斯定理最常见的形式是**贝叶斯定理经典版**：$$ \p(B|E) = \frac{\p(E | B) \cdot \p(B)}{\p(E)} $$
- en: 'Bayes'' Theorem combined with the Law of Total Probability: $$ \p(B|E) = \frac{\p(E
    | B) \cdot \p(B)}{\p(E|B)\cdot \p(B) + \p(E|B\c) \cdot \p(B\c)} $$'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 贝叶斯定理与全概率定律相结合：$$ \p(B|E) = \frac{\p(E | B) \cdot \p(B)}{\p(E|B)\cdot \p(B)
    + \p(E|B\c) \cdot \p(B\c)} $$
