    "Edit This Page")'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: Bayesian Inference with Sampling[¶](#bayesian-inference-with-sampling "Link
    to this Section")
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: Approximating a Known Distribution with Samples[¶](#approximating-a-known-distribution-with-samples
    "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: We’ve seen before that we can compute an empirical distribution from a sample
    of data points. In this section, we’ll use samples to approximate distributions.
  prefs: []
  type: TYPE_NORMAL
- en: 'Let’s start by using samples to approximate a known, easy-to-compute distribution:
    Beta<semantics><mrow><mo stretchy="false">(</mo><mn>3</mn><mo separator="true">,</mo><mn>4</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(3, 4)</annotation></semantics>(3,4).
    While this is a somewhat silly example because the distribution is easy to reason
    about, it will help us see how samples can provide a useful approximation to a
    distribution.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 640x480 with 1 Axes>](../Images/e56dc94fc08b6fa23b83ddfbb7648db0.png)'
  prefs: []
  type: TYPE_IMG
- en: 'We can see that the samples are a good representation for the distribution,
    as long as we have enough. We can use the mean of the samples to approximate the
    mean of the distribution:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE4]'
  prefs: []
  type: TYPE_PRE
- en: Similarly, we could use the variance of the samples to estimate the variance
    of the distribution, and so on.
  prefs: []
  type: TYPE_NORMAL
- en: 'While this method was extremely easy to implement, it’s also somewhat silly:
    for this distribution, anything that we can do with samples can also be done analytically.
    Usually, we want to approximate difficult, intractable distributions that involve
    impossible-to-compute normalization constants. So, that’s what we’ll do next.'
  prefs: []
  type: TYPE_NORMAL
- en: Rejection Sampling[¶](#rejection-sampling "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Rejection sampling works by generating a large number of proposals, and then
    rejecting those that are unlikely or impossible.
  prefs: []
  type: TYPE_NORMAL
- en: 'As a warm-up, consider a distribution over two dimensions, <semantics><mrow><msub><mi>θ</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">\theta_1</annotation></semantics>θ1​ and <semantics><mrow><msub><mi>θ</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">\theta_2</annotation></semantics>θ2​, that’s uniform
    over the unit circle:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mi
    mathvariant="normal">∣</mi><mi>x</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>∝</mo><mrow><mo fence="true">{</mo><mtable
    rowspacing="0.36em" columnalign="left left" columnspacing="1em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="false"><mn>1</mn></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="false"><mrow><mtext>if </mtext><msubsup><mi>θ</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>θ</mi><mn>2</mn><mn>2</mn></msubsup><mo>≤</mo><mn>1</mn></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="false"><mn>0</mn></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="false"><mtext>otherwise</mtext></mstyle></mtd></mtr></mtable></mrow></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} p(\theta|x) &\propto \begin{cases}
    1 & \text{if } \theta_1^2 + \theta_2^2 \leq 1 \\ 0 & \text{otherwise} \end{cases}
    \end{align*}</annotation></semantics>p(θ∣x)​∝{10​if θ12​+θ22​≤1otherwise​​[(1)](#OX8miyOKgh
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'Suppose we want to sample from this distribution: in other words, we want to
    sample a pair of random variables (<semantics><mrow><msub><mi>θ</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">\theta_1</annotation></semantics>θ1​, <semantics><mrow><msub><mi>θ</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">\theta_2</annotation></semantics>θ2​) drawn uniformly
    from the unit circle, shown as the blue region below.'
  prefs: []
  type: TYPE_NORMAL
- en: How can we go about doing this?
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE5]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 400x400 with 1 Axes>](../Images/3c59444ccd21120254e6b80898a1ce6c.png)'
  prefs: []
  type: TYPE_IMG
- en: In the previous example, we could easily sample from the beta distribution using
    `stats.beta.rvs`. Unfortunately, there’s no equivalent for the distribution shown
    above.
  prefs: []
  type: TYPE_NORMAL
- en: 'But, we can sample from the unit square by drawing two independent Uniform<semantics><mrow><mo
    stretchy="false">(</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">(0, 1)</annotation></semantics>(0,1) samples. We
    can easily check whether the sample falls within the unit circle or not, and then
    throw it away (or **reject** it) if it falls outside. Here’s what it would look
    like to do that for many samples:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE6]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE7]'
  prefs: []
  type: TYPE_PRE
- en: <details class="myst-dropdown rounded-md my-5 shadow dark:shadow-2xl dark:shadow-neutral-900
    overflow-hidden bg-gray-50 dark:bg-stone-800"><summary class="myst-dropdown-header
    m-0 text-lg font-medium py-1 min-h-[2em] pl-3 cursor-pointer hover:shadow-[inset_0_0_0px_30px_#00000003]
    dark:hover:shadow-[inset_0_0_0px_30px_#FFFFFF03] bg-gray-100 dark:bg-slate-900">Source</summary>
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE8]</details> ![<Figure size 400x400 with 1 Axes>](../Images/b3a8190c9825f9aea7019d39a1b25006.png)'
  prefs: []
  type: TYPE_NORMAL
- en: Here, samples in purple (darker) are rejected, so that we are left with the
    yellow (lighter) samples that represent the distribution from above.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE9]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: 'Next, let’s think about sampling from a distribution with a complicated density.
    Suppose we want to sample from the distribution with density <semantics><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mi mathvariant="normal">∣</mi><mi>x</mi><mo
    stretchy="false">)</mo><mo>∝</mo><mi>θ</mi><mo>⋅</mo><mo stretchy="false">(</mo><mn>1.5</mn><mo>−</mo><mi>θ</mi><mo
    stretchy="false">)</mo><mo>⋅</mo><mi>sin</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>θ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(\theta|x)
    \propto \theta \cdot (1.5-\theta) \cdot \sin(\theta)</annotation></semantics>p(θ∣x)∝θ⋅(1.5−θ)⋅sin(θ)
    for <semantics><mrow><mi>θ</mi><mo>∈</mo><mo stretchy="false">[</mo><mn>0</mn><mo
    separator="true">,</mo><mn>1.5</mn><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">\theta \in [0,1.5]</annotation></semantics>θ∈[0,1.5]:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]'
  prefs: []
  type: TYPE_PRE
- en: <details class="myst-dropdown rounded-md my-5 shadow dark:shadow-2xl dark:shadow-neutral-900
    overflow-hidden bg-gray-50 dark:bg-stone-800"><summary class="myst-dropdown-header
    m-0 text-lg font-medium py-1 min-h-[2em] pl-3 cursor-pointer hover:shadow-[inset_0_0_0px_30px_#00000003]
    dark:hover:shadow-[inset_0_0_0px_30px_#FFFFFF03] bg-gray-100 dark:bg-slate-900">Source</summary>
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]</details> ![<Figure size 500x300 with 1 Axes>](../Images/cb641f3020c9236e61761bd0c5d23e3f.png)'
  prefs: []
  type: TYPE_NORMAL
- en: 'How can we make this look like the geometry-based example from before? The
    solution is an algorithm called **rejection sampling**. There are two ways of
    understanding how it works:'
  prefs: []
  type: TYPE_NORMAL
- en: The first is to start by generating samples from a uniform distribution. We’ll
    then throw some away at random (instead of deterministically like in the previous
    example). Intuitively, looking at the diagram below that compares our target to
    the Uniform<semantics><mrow><mo stretchy="false">(</mo><mn>0</mn><mo separator="true">,</mo><mn>1.5</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(0, 1.5)</annotation></semantics>(0,1.5)
    distribution, we should try to throw away more samples for very small values of
    <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ,
    and we should try to keep more samples between 0.5 and 1\. In other words, our
    probability of rejecting each sample should depend on how likely it is according
    to the target.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: The second is to change our one-dimensional sampling problem (i.e., generate
    samples for <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ)
    into a two-dimensional sampling problem, where we start by sampling from the orange
    rectangle in the graph below, and then throw away samples that don’t fall under
    the blue curve. In order to do this, we must first sample <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ values between 0
    and 1.5, and then sample heights for each one. If the height is too large (i.e.,
    it falls above the corresponding target height for that value of <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ), then we will reject
    the sample.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '[PRE12]'
  prefs: []
  type: TYPE_PRE
- en: <details class="myst-dropdown rounded-md my-5 shadow dark:shadow-2xl dark:shadow-neutral-900
    overflow-hidden bg-gray-50 dark:bg-stone-800"><summary class="myst-dropdown-header
    m-0 text-lg font-medium py-1 min-h-[2em] pl-3 cursor-pointer hover:shadow-[inset_0_0_0px_30px_#00000003]
    dark:hover:shadow-[inset_0_0_0px_30px_#FFFFFF03] bg-gray-100 dark:bg-slate-900">Source</summary>
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE13]</details> ![<Figure size 500x300 with 1 Axes>](../Images/89b420d2330b93a59608c0b5a4e732d1.png)'
  prefs: []
  type: TYPE_NORMAL
- en: 'To be more precise, rejection sampling works as follows: given an unnormalized
    target distribution and proposal distribution, we generate samples from the normalized
    version of the target distribution by:'
  prefs: []
  type: TYPE_NORMAL
- en: Generate samples from the proposal distribution.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'For each generated sample from the previous step, compute the ratio of the
    target divided by the proposal. This represents the probability that we’ll accept
    the sample: larger values of the target will lead to higher acceptance probability,
    and smaller values of the target will lead to lower acceptance probability. In
    order for this ratio to be treated as a probability, we require that the target
    always be less than (or equal to) the proposal: this can always be achieved through
    a good choice of proposal and appropriate scaling of the target distribution.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Randomly accept or reject each sample from step 1, with probability determined
    by its ratio from step 2\. This can be done by generating a Uniform<semantics><mrow><mo
    stretchy="false">(</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">(0, 1)</annotation></semantics>(0,1) random variable
    for each sample, and accepting the sample that random variable is less than the
    acceptance probability. **Stop and convince yourself that this is true before
    continuing!** Discard all rejected samples.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: The accepted samples will be true samples from the normalized density corresponding
    to the unnormalized target.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'The following code implements rejection sampling. Note that there are only
    four (substantive) lines of code in this function, corresponding to the four steps
    above:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE14]'
  prefs: []
  type: TYPE_PRE
- en: 'Let’s apply it to our target distribution from above, using `rejection_sample_uniform(num_proposals=500)`
    and `rejection_sample_uniform(num_proposals=10000)`:'
  prefs: []
  type: TYPE_NORMAL
- en: <details class="myst-dropdown rounded-md my-5 shadow dark:shadow-2xl dark:shadow-neutral-900
    overflow-hidden bg-gray-50 dark:bg-stone-800"><summary class="myst-dropdown-header
    m-0 text-lg font-medium py-1 min-h-[2em] pl-3 cursor-pointer hover:shadow-[inset_0_0_0px_30px_#00000003]
    dark:hover:shadow-[inset_0_0_0px_30px_#FFFFFF03] bg-gray-100 dark:bg-slate-900">Source</summary>
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE15]</details>'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE16]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 800x300 with 2 Axes>](../Images/c2c5d296ceff86bc940cdca502db235e.png)'
  prefs: []
  type: TYPE_IMG
- en: 'From the results, we can see that rejection sampling, when run with enough
    proposals, correctly and accurately gives us samples from the target distribution.
    But, it can be **inefficient**: we accepted less than half of the samples each
    time! Indeed, even with 10,000 proposals (right), the samples don’t perfectly
    represent the target distribution.'
  prefs: []
  type: TYPE_NORMAL
- en: This problem of inefficiency is caused by rejecting samples. Note that the maximum
    acceptance probability was only around 0.64\. If we were to scale the proposal
    distribution by a factor of <semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mn>0.64</mn><mo>≈</mo><mn>1.56</mn></mrow><annotation
    encoding="application/x-tex">1/0.64 \approx 1.56</annotation></semantics>1/0.64≈1.56,
    then we’d reject fewer samples overall, while still ensuring that the probabilities
    never went above 1.
  prefs: []
  type: TYPE_NORMAL
- en: Unfortunately, the inefficiency problem starts to get much worse when working
    in high dimensions! When dealing with high-dimensional distributions, there is
    often much more of the space with relatively low density, which means many more
    samples being rejected.
  prefs: []
  type: TYPE_NORMAL
- en: As a second example, what happens if we want to sample from a target distribution
    that takes on values in <semantics><mrow><mo stretchy="false">[</mo><mn>0</mn><mo
    separator="true">,</mo><mi mathvariant="normal">∞</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">[0, \infty)</annotation></semantics>[0,∞)? For instance,
    suppose our density is <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mi
    mathvariant="normal">∣</mi><mi>x</mi><mo stretchy="false">)</mo><mo>∝</mo><mi>exp</mi><mo>⁡</mo><mo
    stretchy="false">(</mo><mo>−</mo><mi>θ</mi><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi><mi>sin</mi><mo>⁡</mo><mo
    stretchy="false">(</mo><mn>2</mn><mi>θ</mi><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi></mrow><annotation
    encoding="application/x-tex">p(\theta|x) \propto \exp(-\theta) |\sin(2\theta)|</annotation></semantics>p(θ∣x)∝exp(−θ)∣sin(2θ)∣
    for <semantics><mrow><mi>θ</mi><mo>∈</mo><mo stretchy="false">[</mo><mn>0</mn><mo
    separator="true">,</mo><mi mathvariant="normal">∞</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\theta \in [0, \infty)</annotation></semantics>θ∈[0,∞).
    We can’t use a Uniform<semantics><mrow><mo stretchy="false">(</mo><mi>a</mi><mo
    separator="true">,</mo><mi>b</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">(a, b)</annotation></semantics>(a,b) proposal distribution.
    Why not? For any value of <semantics><mrow><mi>b</mi></mrow><annotation encoding="application/x-tex">b</annotation></semantics>b,
    we’ll never generate a sample greater than <semantics><mrow><mi>b</mi></mrow><annotation
    encoding="application/x-tex">b</annotation></semantics>b, so our samples won’t
    match the true distribution.
  prefs: []
  type: TYPE_NORMAL
- en: 'Instead, we could use the normal or exponential distribution:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE17]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE18]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 640x480 with 1 Axes>](../Images/4c9631b1ce2795562fa5de28084383ad.png)'
  prefs: []
  type: TYPE_IMG
- en: To summarize, we saw that rejection sampling can be used to draw samples given
    only an unnormalized target distribution. Even though it can be used to draw samples
    from any unnormalized target, we most often will use it (and other sampling methods)
    with the unnormalized target distribution being the numerator of a posterior distribution
    <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mi mathvariant="normal">∣</mi><mi>x</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(\theta|x)p(\theta)</annotation></semantics>p(θ∣x)p(θ).
  prefs: []
  type: TYPE_NORMAL
- en: 'Rejection sampling works by using a proposal distribution that’s easy to sample
    from: while the normal and uniform distributions are most common, we can use any
    distribution as long as (a) we can draw samples from it, and (b) we can guarantee
    that it will always be greater than (or equal to) a scaled version of our target
    distribution. It works by (1) generating proposals from the proposal distribution,
    (2) computing the ratio of target divided by proposal as the acceptance probability,
    and (3) accepting each sample with its acceptance probability. It’s typically
    inefficient, especially in high dimensions.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE19]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: Markov Chain Monte Carlo[¶](#markov-chain-monte-carlo "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: We noticed that the inefficiency of rejection sampling was due to the large
    number of proposals that we rejected and discarded. Indeed, rejection sampling
    generates each sample independently, without using any information from previously
    generated samples about which areas have lower and higher probability.
  prefs: []
  type: TYPE_NORMAL
- en: '**Markov chain Monte Carlo (MCMC)** methods take a different approach by generating
    a sequence of samples. Each sample depends on the previous one, which lets us
    generate better samples. We’ll construct the sequence of samples in such a way
    that they form a Markov chain whose steady state distribution is the true normalized
    version of the target distribution.'
  prefs: []
  type: TYPE_NORMAL
- en: Markov Chains[¶](#markov-chains "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: See [Chapter 10 of the Data 140 textbook](https://data140.org/textbook/content/Chapter_10/00_Markov_Chains.html)
    for a discussion of Markov Chains.
  prefs: []
  type: TYPE_NORMAL
- en: Metropolis-Hastings (Optional)[¶](#metropolis-hastings-optional "Link to this
    Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '*Work in progress*'
  prefs: []
  type: TYPE_NORMAL
- en: Gibbs sampling[¶](#gibbs-sampling "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Gibbs sampling is an algorithm designed to work with high-dimensional posterior
    distributions. It works by iteratively resampling each individual variable conditioned
    on the data and all other random variables. For example, let’s revisit the uniform
    distribution over the unit circle from above:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mi
    mathvariant="normal">∣</mi><mi>x</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>∝</mo><mrow><mo fence="true">{</mo><mtable
    rowspacing="0.36em" columnalign="left left" columnspacing="1em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="false"><mn>1</mn></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="false"><mrow><mtext>if </mtext><msubsup><mi>θ</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>θ</mi><mn>2</mn><mn>2</mn></msubsup><mo>≤</mo><mn>1</mn></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="false"><mn>0</mn></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="false"><mtext>otherwise</mtext></mstyle></mtd></mtr></mtable></mrow></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} p(\theta|x) &\propto \begin{cases}
    1 & \text{if } \theta_1^2 + \theta_2^2 \leq 1 \\ 0 & \text{otherwise} \end{cases}
    \end{align*}</annotation></semantics>p(θ∣x)​∝{10​if θ12​+θ22​≤1otherwise​​[(2)](#sKmz0UEnpw
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'Suppose that we are given a particular value of <semantics><mrow><msub><mi>θ</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">\theta_1</annotation></semantics>θ1​, say <semantics><mrow><msub><mi>θ</mi><mn>1</mn></msub><mo>=</mo><mn>0.5</mn></mrow><annotation
    encoding="application/x-tex">\theta_1 = 0.5</annotation></semantics>θ1​=0.5. Conditioned
    on this value, we can easily reason about the distribution of <semantics><mrow><msub><mi>θ</mi><mn>2</mn></msub><mi
    mathvariant="normal">∣</mi><msub><mi>θ</mi><mn>1</mn></msub><mo>=</mo><mn>0.5</mn></mrow><annotation
    encoding="application/x-tex">\theta_2|\theta_1=0.5</annotation></semantics>θ2​∣θ1​=0.5:
    it’s uniform over the vertical line shown below:'
  prefs: []
  type: TYPE_NORMAL
- en: <details class="myst-dropdown rounded-md my-5 shadow dark:shadow-2xl dark:shadow-neutral-900
    overflow-hidden bg-gray-50 dark:bg-stone-800"><summary class="myst-dropdown-header
    m-0 text-lg font-medium py-1 min-h-[2em] pl-3 cursor-pointer hover:shadow-[inset_0_0_0px_30px_#00000003]
    dark:hover:shadow-[inset_0_0_0px_30px_#FFFFFF03] bg-gray-100 dark:bg-slate-900">Source</summary>
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE20]</details> ![<Figure size 400x400 with 1 Axes>](../Images/9a3a53c5ee5a42674408463538844efb.png)'
  prefs: []
  type: TYPE_NORMAL
- en: 'So, given any particular value of <semantics><mrow><msub><mi>θ</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">\theta_1</annotation></semantics>θ1​, we could easily
    draw a sample for <semantics><mrow><msub><mi>θ</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">\theta_2</annotation></semantics>θ2​ conditioned
    on that value by sampling out of a uniform distribution. With a bit of algebra,
    we can write this as:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><msub><mi>θ</mi><mn>2</mn></msub><mo>∣</mo><msub><mi>θ</mi><mn>1</mn></msub><mo>∼</mo><mrow><mi
    mathvariant="normal">U</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">i</mi><mi
    mathvariant="normal">f</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">r</mi><mi
    mathvariant="normal">m</mi></mrow><mrow><mo fence="true">(</mo><mo>−</mo><msqrt><mrow><mn>1</mn><mo>−</mo><msubsup><mi>θ</mi><mn>1</mn><mn>2</mn></msubsup></mrow></msqrt><mo
    separator="true">,</mo><msqrt><mrow><mn>1</mn><mo>−</mo><msubsup><mi>θ</mi><mn>1</mn><mn>2</mn></msubsup></mrow></msqrt><mo
    fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">\theta_2
    \mid \theta_1 \sim \mathrm{Uniform}\left(-\sqrt{1-\theta_1^2}, \sqrt{1-\theta_1^2}\right)</annotation></semantics>θ2​∣θ1​∼Uniform(−1−θ12​​,1−θ12​​)[(3)](#rBWHd6C5Ki
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: And by symmetry
  prefs: []
  type: TYPE_NORMAL
- en: Note that even though we made reference to posterior distributions and conditioning
    on data throughout this section, Gibbs sampling is a general method that can be
    used to sample from any high-dimensional target where the conditional distributions
    <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>θ</mi><mi>i</mi></msub><mi
    mathvariant="normal">∣</mi><msub><mi>θ</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>θ</mi><mrow><mi>i</mi><mo>−</mo><mn>1</mn></mrow></msub><mo
    separator="true">,</mo><msub><mi>θ</mi><mrow><mi>i</mi><mo>+</mo><mn>1</mn></mrow></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>θ</mi><mi>n</mi></msub><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(\theta_i
    | \theta_1, \ldots, \theta_{i-1}, \theta_{i+1}, \ldots, \theta_n)</annotation></semantics>p(θi​∣θ1​,…,θi−1​,θi+1​,…,θn​)
    are easy to sample from.
  prefs: []
  type: TYPE_NORMAL
- en: Implementing models in PyMC[¶](#implementing-models-in-pymc "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'We spent a lot of time doing algebra to derive the posterior distributions
    and estimates for the review model. At this point, you might be asking: couldn’t
    we do a lot of that work computationally? It turns out the answer is yes! PyMC
    is a Python library for Bayesian inference. In order to use it, you must specify
    a probabilistic model (like the three we’ve just seen) and observed data, and
    it will compute the posterior distribution over all unknown variables.'
  prefs: []
  type: TYPE_NORMAL
- en: Product Review Model in PyMC[¶](#product-review-model-in-pymc "Link to this
    Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Let’s try it out on the product review model:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><msub><mi>x</mi><mi>i</mi></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>∼</mo><mrow><mi mathvariant="normal">B</mi><mi mathvariant="normal">e</mi><mi
    mathvariant="normal">r</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">o</mi><mi
    mathvariant="normal">u</mi><mi mathvariant="normal">l</mi><mi mathvariant="normal">l</mi><mi
    mathvariant="normal">i</mi></mrow><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mi>θ</mi></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>∼</mo><mrow><mi mathvariant="normal">B</mi><mi mathvariant="normal">e</mi><mi
    mathvariant="normal">t</mi><mi mathvariant="normal">a</mi></mrow><mo stretchy="false">(</mo><mi>α</mi><mo
    separator="true">,</mo><mi>β</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} x_i | \theta &\sim \mathrm{Bernoulli}(\theta)
    \\ \theta &\sim \mathrm{Beta}(\alpha, \beta) \end{align}</annotation></semantics>xi​∣θθ​∼Bernoulli(θ)∼Beta(α,β)​​[(4)](#FzOQRfRfEa
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
