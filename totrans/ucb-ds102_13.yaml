    encoding="application/x-tex">\theta_2</annotation></semantics>θ2​ conditioned
    on that value by sampling out of a uniform distribution. With a bit of algebra,
    we can write this as:'
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，给定 <semantics><mrow><msub><mi>θ</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">\theta_1</annotation></semantics>θ1​
    的任意特定值，我们可以通过从均匀分布中采样，轻松地基于该值为 <semantics><mrow><msub><mi>θ</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">\theta_2</annotation></semantics>θ2​ 抽取一个条件样本。经过一些代数运算，我们可以将其写为：
- en: <semantics><mrow><msub><mi>θ</mi><mn>2</mn></msub><mo>∣</mo><msub><mi>θ</mi><mn>1</mn></msub><mo>∼</mo><mrow><mi
