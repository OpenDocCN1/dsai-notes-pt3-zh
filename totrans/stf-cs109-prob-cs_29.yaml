- en: Expectation
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part2/expectation/](https://chrispiech.github.io/probabilityForComputerScientists/en/part2/expectation/)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
- en: A random variable is fully represented by its probability mass function (PMF),
    which represents each of the values the random variable can take on, and the corresponding
    probabilities. A PMF can be a lot of information. Sometimes it is useful to summarize
    the random variable! The most common, and arguably the most useful, summary of
    a random variable is its "**Expectation**".
  prefs: []
  type: TYPE_NORMAL
- en: '***Definition***: Expectation'
  prefs: []
  type: TYPE_NORMAL
- en: The expectation of a random variable $X$, written $\E[X]$ is the average of
    all the values the random variable can take on, each weighted by the probability
    that the random variable will take on that value. $$ \E[X] = \sum_x x \cdot \p(X=x)
    $$
  prefs: []
  type: TYPE_NORMAL
- en: 'Expectation goes by many other names: Mean, Weighted Average, Center of Mass,
    1st Moment. All of which are calculated using the same formula.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Recall that $\p(X=x)$, also written as $\p(x)$, is the probability mass function
    of the random variable $X$. Here is code that calculates the expectation of the
    sum of two dice, based off the probability mass function:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: 'If we worked it out manually we would get that if $X$ is the sum of two dice,
    $\E[X] = 7$: $$ \E[X] = \sum_x x \cdot \p(X=x) = 2 \cdot \frac{1}{36} + 3 \cdot
    \frac{2}{36} + \dots + 12 \frac{1}{36} = 7 $$ 7 is the "average" number you expect
    to get if you took the sum of two dice near infinite times. In this case it also
    happens to be the same as the mode, the most likely value of the sum of two dice,
    but this is not always the case!'
  prefs: []
  type: TYPE_NORMAL
- en: Properties of Expectation
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '***Property***: Linearity of Expectation'
  prefs: []
  type: TYPE_NORMAL
- en: $$E[aX + b] = a\E[X]+b$$ Where $a$ and $b$ are constants and not random variables.
  prefs: []
  type: TYPE_NORMAL
- en: '***Property***: Expectation of the Sum of Random Variables'
  prefs: []
  type: TYPE_NORMAL
- en: $$E[X+Y] = E[X] +E[Y]$$ This is true regardless of the relationship between
    $X$ and $Y$. They can be dependent, and they can have different distributions.
    This also applies with more than two random variables. $$E\Big[\sum_{i=1}^n X_i\Big]
    = \sum_{i=1}^n E[X_i]$$
  prefs: []
  type: TYPE_NORMAL
- en: '***Property***: Law of The Unconcious Statistician (LOTUS)'
  prefs: []
  type: TYPE_NORMAL
- en: $$E[g(X)] = \sum_x g(x)\p(X=x)$$
  prefs: []
  type: TYPE_NORMAL
- en: One can also calculate the expected value of a function g(X) of a random variable
    X when one knows the probability distribution of X but one does not explicitly
    know the distribution of g(X). This theorem has the humorous name of "the Law
    of the Unconscious Statistician" (LOTUS), because it is so useful that you should
    be able to employ it unconciously.
  prefs: []
  type: TYPE_NORMAL
- en: '***Property***: Expectation of a Constant'
  prefs: []
  type: TYPE_NORMAL
- en: $$E[a] = a$$
  prefs: []
  type: TYPE_NORMAL
- en: Sometimes in proofs, you will end up with the expectation of a constant (rather
    than a random variable). For example what does the $\E[5]$ mean? Since 5 is not
    a random variable, it does not change, and will always be 5, $\E[5] = 5$.
  prefs: []
  type: TYPE_NORMAL
- en: Expectation of Sums Proof
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'One of the most useful properties of expectation is that the sum of expectation
    of random variables can be calculated by summing the expectations of each random
    variable on its own. Later in [Adding Random Variables](../../part4/summation_vars/)
    we will learn that computing the full probability mass function (or probability
    density function) when adding random variables is quite hard, especially when
    the random variables are dependent. However the expectation of sums is always
    decomposable: $$E[X+Y] = E[X] + E[Y]$$ This very useful result is somewhat suprising.
    I believe that the best way to understand this result is via a proof. This proof,
    however, will use some concepts from the next section in the course reader, Probabilistic
    Models. Once you have learned how to think about random variables jointly you
    will be able to understand this proof. There is a section of the reader that goes
    over the proof in details and gives of visualization for why it is true! [Proof
    of Expectation of Sum of Random Variables](../../examples/expectation_of_sums/).'
  prefs: []
  type: TYPE_NORMAL
- en: Example of Law of Unconcious Statistician
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'The property of expectation: $$E[g(X)] = \sum_x g(x)\p(X=x)$$ is both useful
    and hard to understand just by reading the equation. It allows us to calculate
    the expectation of a function of any function applied to a random variable! One
    function that will turn out to be very useful when computing [Variance](../../part2/variance)
    is $E[X^2]$. According to the Law of Unconcious Statistician: \begin{align*} E[X^2]
    &= \sum_x x^2 \p(X=x) \end{align*} In this case $g$ is the squaring function.
    To calculate $E[X^2]$ we calculate expectation in a way similar to $E[X]$ with
    the exception that we square the value of $x$ before multiplying by the probability
    mass function. Here is code that calculates $E[X^2]$ for the sum of two dice:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: Expectation with Continuous Random Variables
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Later in the course reader we will learn about continuous random variables.
    Expectation for those types of random variables is very similar. See [Continuos
    Random Variables]({pathToLang}part2/continuous#ex_continuous) for details
  prefs: []
  type: TYPE_NORMAL
