- en: 6.5 Exercises
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: For these exercises, we will be using the **NHANES** data.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE35]'
  prefs: []
  type: TYPE_PRE
- en: 1\. We will provide some basic facts about blood pressure. First let’s select
    a group to set the standard. We will use 20-to-29-year-old females. `AgeDecade`
    is a categorical variable with these ages. Note that the category is coded like
    ” 20-29”, with a space in front! Use the **data.table** package to compute the
    average and standard deviation of systolic blood pressure as saved in the `BPSysAve`
    variable. Save it to a variable called `ref`.
  prefs: []
  type: TYPE_NORMAL
- en: 2\. Report the min and max values for the same group.
  prefs: []
  type: TYPE_NORMAL
- en: 3\. Compute the average and standard deviation for females, but for each age
    group separately rather than a selected decade as in question 1\. Note that the
    age groups are defined by `AgeDecade`.
  prefs: []
  type: TYPE_NORMAL
- en: 4\. Repeat exercise 3 for males.
  prefs: []
  type: TYPE_NORMAL
- en: 5\. For males between the ages of 40-49, compare systolic blood pressure across
    race as reported in the `Race1` variable. Order the resulting table from lowest
    to highest average systolic blood pressure.
  prefs: []
  type: TYPE_NORMAL
