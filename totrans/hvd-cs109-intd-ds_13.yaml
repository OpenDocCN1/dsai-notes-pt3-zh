  zh: '[PRE5]'
- en: '**data.table** uses an approach that avoids a new assignment (update by reference).
    This can help with large datasets that take up most of your computer’s memory.
    The **data.table** :=` function permits us to do this:'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: '**data.table**采用一种避免新赋值（通过引用更新）的方法。这有助于处理占用你电脑大部分内存的大型数据集。**data.table** :=`函数使我们能够这样做：'
- en: '[PRE6]'
