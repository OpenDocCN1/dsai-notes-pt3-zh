  zh: '[PRE8]'
- en: '6.1.3 Technical detail: reference versus copy'
  id: totrans-27
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 6.1.3 技术细节：引用与复制
- en: 'The **data.table** package is designed to avoid wasting memory. So if you make
    a copy of a table, like this:'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: '**data.table**包旨在避免浪费内存。因此，如果你复制了一个表，如下所示：'
- en: '[PRE9]'
  id: totrans-29
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: '`y` is actually referencing `x`, it is not an new opject: it’s just another
    name for `x`. Until you change `y`, a new object will not be made. However, the
    `:=` function changes *by reference* so if you change `x`, a new object is not
    made and `y` continues to be just another name for `x`:'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: '`y`实际上引用了`x`，它不是一个新对象：它只是`x`的另一个名称。直到你更改`y`，不会创建新对象。然而，`:=`函数通过引用进行更改，所以如果你更改`x`，不会创建新对象，`y`继续只是`x`的另一个名称：'
- en: '[PRE10]'
  id: totrans-31
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: 'You can also change `x` like this:'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 你也可以这样更改`x`：
- en: '[PRE11]'
  id: totrans-33
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: 'To avoid this, you can use the `copy` function which forces the creation of
    an actual copy:'
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: 为了避免这种情况，你可以使用`copy`函数，该函数强制创建一个实际的副本：
