- en: Chapter 6 data.table
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook/data.html](https://rafalab.dfci.harvard.edu/dsbook/data.html)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: In this book, we use tidyverse packages to illustrate because beginners find
    the code readable and this permits us to focus on data analysis and statistical
    concepts. However, there are other approaches to wrangling and analyzing data
    in R that are faster and better at handling large objects. The **data.table**
    package, for example, is one of the most popular and we therefore provide a very
    quick introduction in this chapter . There are several online resources, including
    this introduction[^(15)](#fn15) for those wanting to learn more.
  prefs: []
  type: TYPE_NORMAL
- en: 6.1 Manipulating data tables
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '`data.table` is a separate package that needs to be installed. Once installed,
    we then need to load it:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: 'We will provide example code showing the **data.table** approaches to **dplyr**’s
    `mutate`, `filter`, `select`, `group_by`, and `summarize` shown in Chapter [4](tidyverse.html#tidyverse).
    As in that chapter, we will use the `murders` dataset:'
  prefs: []
  type: TYPE_NORMAL
- en: 'The first step when using **data.table** is to convert the data frame into
    a `data.table` object using the `setDT` function:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: Without this initial step, most of the approaches shown below will not work.
  prefs: []
  type: TYPE_NORMAL
