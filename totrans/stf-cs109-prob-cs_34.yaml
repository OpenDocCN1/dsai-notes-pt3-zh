- en: '**Geometric Random Variable**'
  prefs: []
  type: TYPE_NORMAL
- en: '| Notation: | $X \sim \Geo(p)$ |'
  prefs: []
  type: TYPE_TB
- en: '| Description: | Number of experiments until a success. Assumes independent
    experiments each with probability of success $p$. |'
  prefs: []
  type: TYPE_TB
- en: '| Parameters: | $p \in [0, 1]$, the probability that a single experiment gives
    a "success". |'
  prefs: []
  type: TYPE_TB
- en: '| Support: | $x \in \{1, \dots, \infty\}$ |'
  prefs: []
  type: TYPE_TB
- en: '| PMF equation: | $$\p(X=x) = (1-p)^{x-1} p$$ |'
  prefs: []
  type: TYPE_TB
- en: '| Expectation: | $\E[X] = \frac{1}{p}$ |'
  prefs: []
  type: TYPE_TB
- en: '| Variance: | $\var(X) = \frac{1-p}{p^2}$ |'
  prefs: []
  type: TYPE_TB
- en: '| PMF graph: |'
  prefs: []
  type: TYPE_TB
- en: 'Parameter $p$:'
  prefs: []
  type: TYPE_NORMAL
- en: '<canvas id="geometricPmf" style="max-height: 400px"></canvas>'
  prefs: []
  type: TYPE_NORMAL
- en: '**Negative Binomial Random Variable**'
  prefs: []
  type: TYPE_NORMAL
- en: '| Notation: | $X \sim \NegBin(r, p)$ |'
  prefs: []
  type: TYPE_TB
- en: '| Description: | Number of experiments until $r$ successes. Assumes each experiment
    is independent with probability of success $p$. |'
  prefs: []
  type: TYPE_TB
- en: '| Parameters: | $r > 0$, the number of success we are waiting for. $p \in [0,
    1]$, the probability that a single experiment gives a "success". |'
  prefs: []
  type: TYPE_TB
- en: '| Support: | $x \in \{r, \dots, \infty\}$ |'
  prefs: []
  type: TYPE_TB
- en: '| PMF equation: | $$\p(X=x) = {x - 1 \choose r - 1}p^r(1-p)^{x-r}$$ |'
  prefs: []
  type: TYPE_TB
- en: '| Expectation: | $\E[X] = \frac{r}{p}$ |'
  prefs: []
  type: TYPE_TB
- en: '| Variance: | $\var(X) = \frac{r \cdot (1-p)}{p^2}$ |'
  prefs: []
  type: TYPE_TB
- en: '| PMF graph: |'
  prefs: []
  type: TYPE_TB
- en: 'Parameter $r$: Parameter $p$:'
  prefs: []
  type: TYPE_NORMAL
- en: '<canvas id="negBinomialPmf" style="max-height: 400px"></canvas>'
  prefs: []
  type: TYPE_NORMAL
