    viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" width="1.25rem" height="1.25rem"
    class="myst-fm-license-cc-icon myst-fm-license-cc-icon-sa inline-block mr-1"><title>Adaptations
    must be shared under the same terms</title></svg>](https://creativecommons.org/licenses/by-sa/4.0/)[](https://github.com/ds-102/ds-102-book
    "GitHub Repository: ds-102/ds-102-book")[](https://github.com/ds-102/ds-102-book/edit/main/ds-102-book/content/chapters/03/04_model_checking.ipynb
    "Edit This Page")'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: 'When fitting a model to data, it’s important to ask the question: **is this
    model a good representation of the data**?'
  prefs: []
  type: TYPE_NORMAL
- en: In this section, we’ll answer this question from frequentist and Bayesian perspectives.
  prefs: []
  type: TYPE_NORMAL
- en: 'We’ll consider model evaluation from two viewpoints:'
  prefs: []
  type: TYPE_NORMAL
- en: Are our models a good fit for the data we used to fit them (in the case of prediction,
    our training data)?
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Will our models (particularly prediction models) generalize well to new, previously
    unseen data?
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: When formulating and fitting a model, it’s important to answer both of these
    questions. In practice, it’s often easier to answer (and debug/iterate) the first
    question before moving on to the second.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: Frequentist Model Checking[¶](#frequentist-model-checking "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'In the frequentist setting, we often use **goodness-of-fit** measures to evaluate
    our models. Let’s return to the three different models we used to predict the
    number of turbines in Oklahoma:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE4]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE5]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE6]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE7]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE8]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE9]'
  prefs: []
  type: TYPE_PRE
- en: Model comparison with log-likelihood[¶](#model-comparison-with-log-likelihood
    "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: The first way we’ll compare these three models is by looking at the **log-likelihood**,
    <semantics><mrow><mi>log</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>p</mi><mo
    stretchy="false">(</mo><mi>y</mi><mi mathvariant="normal">∣</mi><mi>β</mi><mo
    separator="true">,</mo><mi>x</mi><mo stretchy="false">)</mo><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\log(p(y|\beta, x))</annotation></semantics>log(p(y∣β,x)).
    We’ve already seen this quantity before when we looked at simpler frequentist
    models. It describes how likely the observed <semantics><mrow><mi>y</mi></mrow><annotation
    encoding="application/x-tex">y</annotation></semantics>y-values are, given particular
    coefficients <semantics><mrow><mi>β</mi></mrow><annotation encoding="application/x-tex">\beta</annotation></semantics>β
    and predictors <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x.
    For
  prefs: []
  type: TYPE_NORMAL
- en: 'For each of these three models, the specific form of the likelihood function
    is different:'
  prefs: []
  type: TYPE_NORMAL
- en: The first log-likelihood describes the **density** of observing the log-transformed
    <semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y-values,
    assuming linear regression
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: The second log-likelihood describes the **probability** of observing the original
    <semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y-values
    as counts, assuming a Poisson model with an exponential inverse link function
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: The third log-likelihood describes the **probability** of observing the original
    <semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y-values
    as counts, assuming a negative binomial model with an exponential inverse link
    function
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'So, we can interpret the log-likelihood as: “how likely are the data, according
    to a specific model?”'
  prefs: []
  type: TYPE_NORMAL
- en: Note that because of two key differences (continuous vs discrete likelihoods
    and log-transformed data), we cannot directly compare the log-likelihood from
    the first model with the second two. But, we can compare the second two log-likelihoods
    directly, since they each describe how likely **the same observations** <semantics><mrow><msub><mi>y</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>y</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">y_1, \ldots, y_n</annotation></semantics>y1​,…,yn​
    are, according to two different models. Just as we saw with maximum likelihood,
    it is reasonable to assume that the model with a higher log-likelihood is a better
    fit for the data.
  prefs: []
  type: TYPE_NORMAL
- en: Comparing the models, we see that the Poisson model has a log-likelihood of
    -755, while the negative binomial model has a log-likelihood around -134\. We
    also know that because of how the models are fit, that these represent the best
    possible log-likelihood values for each model family. So, we can reasonably conclude
    that under a negative binomial GLM, the data are much more likely than they are
    under a Poisson GLM.
  prefs: []
  type: TYPE_NORMAL
- en: 'Intuitively, this aligns with what we saw in the Bayesian setting: because
    the variance of the Poisson likelihood is too low, values far away from the predicted
    average <semantics><mrow><mover accent="true"><mi>y</mi><mo>^</mo></mover></mrow><annotation
    encoding="application/x-tex">\hat{y}</annotation></semantics>y^​ are very unlikely,
    and so the model assigns low probability to the turbine counts that we actually
    observed.'
  prefs: []
  type: TYPE_NORMAL
- en: Note that the log-likelihood for any model by itself does not tell us anything
    about that model’s performance. Rather, it is useful as a **relative measure when
    comparing different models applied to the same dataset.** So, in general, the
    log-likelihood tells us how well a model does on a particular dataset, and can
    be used to compare how well different models fit the same dataset.
  prefs: []
  type: TYPE_NORMAL
- en: Model evaluation with chi-squared statistic[¶](#model-evaluation-with-chi-squared-statistic
    "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'We can also use the chi-squared (<semantics><mrow><msup><mi>χ</mi><mn>2</mn></msup></mrow><annotation
    encoding="application/x-tex">\chi^2</annotation></semantics>χ2) statistic to evaluate
    models: here, larger values are better. While the full details are beyond the
    scope of this class, in general, we should expect the Chi-squared statistic to
    roughly be equal to the number of data points minus the number of parameters.
    In the examples above, we have 17 data points (observations), and two parameters
    (slope and intercept), so we should expect a value close to 15.'
  prefs: []
  type: TYPE_NORMAL
- en: We can see that the linear model (with log-transformed <semantics><mrow><mi>y</mi></mrow><annotation
    encoding="application/x-tex">y</annotation></semantics>y-values) has a Chi-squared
    value of 17.7, fairly close to 15, indicating that the model fits the data well.
    The Poisson model, on the other hand, has a much higher value of 1200, indicating
    a very poor fit.
  prefs: []
  type: TYPE_NORMAL
- en: Intuition behind the chi-squared statistic[¶](#intuition-behind-the-chi-squared-statistic
    "Link to this Section")
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: '*Coming soon: see video*'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: Bayesian Model Checking[¶](#bayesian-model-checking "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Posterior Predictive Distributions[¶](#posterior-predictive-distributions "Link
    to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Consider a model with observed data points <semantics><mrow><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo>=</mo><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">x_{1:n} = x_1, \ldots, x_n</annotation></semantics>x1:n​=x1​,…,xn​
    and an unknown parameter, with a likelihood <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(x_{1:n}|\theta)</annotation></semantics>p(x1:n​∣θ)
    and a prior <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(\theta)</annotation></semantics>p(θ).
    As usual, we’ll assume that the data points are conditionally i.i.d. given <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ. So far, we’ve focused
    on obtaining the posterior distribution <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mi
    mathvariant="normal">∣</mi><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(\theta|x_{1:n})</annotation></semantics>p(θ∣x1:n​).
  prefs: []
  type: TYPE_NORMAL
- en: 'We can also consider the distribution for a new data point, given all the previous
    data points (after marginalizing out the unknown parameter <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ). This is called
    the **posterior predictive distribution (PPD)**, and will be our primary tool
    for model checking:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mi
    mathvariant="normal">∣</mi><msub><mi>x</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(x_{n+1} | x_1, \ldots, x_n)</annotation></semantics>p(xn+1​∣x1​,…,xn​)[(1)](#BIh2Wttd2r
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'How do we go about computing the PPD? Looking at the previous paragraph, we
    know more about the distribution of <semantics><mrow><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation
    encoding="application/x-tex">x_{n+1}</annotation></semantics>xn+1​ given <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ, so we can use total
    probability:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mi
    mathvariant="normal">∣</mi><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo
    stretchy="false">)</mo><mo>=</mo><mo>∫</mo><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mi
    mathvariant="normal">∣</mi><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo
    separator="true">,</mo><mi>θ</mi><mo stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mi
    mathvariant="normal">∣</mi><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo
    stretchy="false">)</mo><mi>d</mi><mi>θ</mi></mrow><annotation encoding="application/x-tex">p(x_{n+1}|x_{1:n})
    = \int p(x_{n+1}|x_{1:n}, \theta)p(\theta|x_{1:n})\, d\theta</annotation></semantics>p(xn+1​∣x1:n​)=∫p(xn+1​∣x1:n​,θ)p(θ∣x1:n​)dθ[(2)](#C950pyA4AJ
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'We can simplify the first conditional distribution because <semantics><mrow><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation
    encoding="application/x-tex">x_{n+1}</annotation></semantics>xn+1​ and <semantics><mrow><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub></mrow><annotation
    encoding="application/x-tex">x_{1:n}</annotation></semantics>x1:n​ are conditionally
    independent given <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ:
    in other words, <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mi
    mathvariant="normal">∣</mi><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo
    separator="true">,</mo><mi>θ</mi><mo stretchy="false">)</mo><mo>=</mo><mi>p</mi><mo
    stretchy="false">(</mo><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(x_{n+1}|x_{1:n}, \theta) = p(x_{n+1}|\theta)</annotation></semantics>p(xn+1​∣x1:n​,θ)=p(xn+1​∣θ).
    The second conditional distribution is the posterior distribution for <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ. So:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mi
    mathvariant="normal">∣</mi><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mo>∫</mo><mi>p</mi><mo
    stretchy="false">(</mo><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mi
    mathvariant="normal">∣</mi><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo
    separator="true">,</mo><mi>θ</mi><mo stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mi
    mathvariant="normal">∣</mi><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo
    stretchy="false">)</mo><mi>d</mi><mi>θ</mi></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mo>∫</mo><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mi mathvariant="normal">∣</mi><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo
    stretchy="false">)</mo><mi>d</mi><mi>θ</mi></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msub><mi mathvariant="double-struck">E</mi><mrow><mi>θ</mi><mi
    mathvariant="normal">∣</mi><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub></mrow></msub><mrow><mo
    fence="true">[</mo><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo><mo fence="true">]</mo></mrow></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} p(x_{n+1}|x_{1:n}) &= \int p(x_{n+1}|x_{1:n},
    \theta)p(\theta|x_{1:n})\, d\theta \\ &= \int p(x_{n+1}|\theta)p(\theta|x_{1:n})\,
    d\theta \\ &= \mathbb{E}_{\theta|x_{1:n}}\left[p(x_{n+1}|\theta)\right] \end{align*}</annotation></semantics>p(xn+1​∣x1:n​)​=∫p(xn+1​∣x1:n​,θ)p(θ∣x1:n​)dθ=∫p(xn+1​∣θ)p(θ∣x1:n​)dθ=Eθ∣x1:n​​[p(xn+1​∣θ)]​[(3)](#DnjzR1gUGZ
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: In practice, computing this integral exactly is just as hard as computing the
    denominator in Bayes’ rule, because we have to integrate out over all possible
    <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ.
    In the case of high-dimensional <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ, as before, the
    integral can be impossible! In practice, we usually approximate the posterior
    with samples, and then use that to approximate the PPD.
  prefs: []
  type: TYPE_NORMAL
- en: Specifically, to compute the PPD for a new data point, we compute the expectation
    above using the empirical distribution for <semantics><mrow><mi>θ</mi><mi mathvariant="normal">∣</mi><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub></mrow><annotation
    encoding="application/x-tex">\theta|x_{1:n}</annotation></semantics>θ∣x1:n​ as
    defined by the samples.
  prefs: []
  type: TYPE_NORMAL
- en: 'In other words, given samples <semantics><mrow><msup><mi>θ</mi><mrow><mo stretchy="false">(</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow></msup><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msup><mi>θ</mi><mrow><mo stretchy="false">(</mo><mi>t</mi><mo
    stretchy="false">)</mo></mrow></msup></mrow><annotation encoding="application/x-tex">\theta^{(1)},
    \ldots, \theta^{(t)}</annotation></semantics>θ(1),…,θ(t) that approximate <semantics><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mi mathvariant="normal">∣</mi><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(\theta|x_{1:n})</annotation></semantics>p(θ∣x1:n​),
    we can:'
  prefs: []
  type: TYPE_NORMAL
- en: '**compute the PPD for a specific value** <semantics><mrow><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation
    encoding="application/x-tex">x_{n+1}</annotation></semantics>xn+1​ by averaging
    <semantics><mrow><mo stretchy="false">(</mo><mn>1</mn><mi mathvariant="normal">/</mi><mi>t</mi><mo
    stretchy="false">)</mo><msubsup><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>t</mi></msubsup><mi>p</mi><mo
    stretchy="false">(</mo><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mi
    mathvariant="normal">∣</mi><msup><mi>θ</mi><mrow><mo stretchy="false">(</mo><mi>t</mi><mo
    stretchy="false">)</mo></mrow></msup><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">(1/t)\sum_{i=1}^t p(x_{n+1}|\theta^{(t)})</annotation></semantics>(1/t)∑i=1t​p(xn+1​∣θ(t))'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**draw a sample from the PPD** by:'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: first, drawing a sample uniformly at random from <semantics><mrow><msup><mi>θ</mi><mrow><mo
    stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo></mrow></msup><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msup><mi>θ</mi><mrow><mo
    stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow></msup></mrow><annotation
    encoding="application/x-tex">\theta^{(1)}, \ldots, \theta^{(t)}</annotation></semantics>θ(1),…,θ(t),
    calling it <semantics><mrow><msup><mi>θ</mi><mo>∗</mo></msup></mrow><annotation
    encoding="application/x-tex">\theta^*</annotation></semantics>θ∗;
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
- en: and then drawing from the likelihood conditioned on that sample, <semantics><mrow><mi>p</mi><mo
    stretchy="false">(</mo><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mi
    mathvariant="normal">∣</mi><msup><mi>θ</mi><mo>∗</mo></msup><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(x_{n+1}|\theta^*)</annotation></semantics>p(xn+1​∣θ∗)
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
- en: Using the PPD to check regression[¶](#using-the-ppd-to-check-regression "Link
    to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: In a Bayesian GLM, our observed data points are the <semantics><mrow><mi>y</mi></mrow><annotation
    encoding="application/x-tex">y</annotation></semantics>y-values <semantics><mrow><msub><mi>y</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>y</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">y_1, \ldots, y_n</annotation></semantics>y1​,…,yn​.
    So, the PPD is <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>y</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mi
    mathvariant="normal">∣</mi><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo
    separator="true">,</mo><msub><mi>y</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>y</mi><mi>n</mi></msub><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(y_{n+1} | x_{n+1}, y_1, \ldots, y_n)</annotation></semantics>p(yn+1​∣xn+1​,y1​,…,yn​).
    Note that we condition on the corresponding <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x-value because of the
    nature of a prediction/regression problem. <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x is fixed and known, and
    <semantics><mrow><msub><mi>y</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation
    encoding="application/x-tex">y_{n+1}</annotation></semantics>yn+1​ will depend
    on <semantics><mrow><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation
    encoding="application/x-tex">x_{n+1}</annotation></semantics>xn+1​. Another way
    of seeing this is by trying to answer the question of “how would you predict <semantics><mrow><msub><mi>y</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation
    encoding="application/x-tex">y_{n+1}</annotation></semantics>yn+1​ without knowing
    <semantics><mrow><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation
    encoding="application/x-tex">x_{n+1}</annotation></semantics>xn+1​, and would
    that prediction even be useful?”
  prefs: []
  type: TYPE_NORMAL
- en: PyMC handles all the details of setting up the posterior predictive check for
    us, so we can define the following function to help us visualizes the samples
    that it draws. The most important line is `model.predict(trace, kind='response')`,
    which tells PyMC to generate predictions for each <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x-value by sampling from
    the posterior predictive distribution.
  prefs: []
  type: TYPE_NORMAL
- en: '*Exercise: what are the other possible values of `kind=` that you can pass
    to the `model.predict()` function, and what do they do?*'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]'
  prefs: []
  type: TYPE_PRE
- en: Now, let’s use this function to visualize a PPC for the three models we looked
    at in the previous section.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE12]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 1000x500 with 3 Axes>](../Images/67608581d6772670a70484e1fe26096e.png)'
  prefs: []
  type: TYPE_IMG
- en: Each green line represents one sample from the PPD. We can think of these as
    possible sequences of data that are dreamt up by the models, based on their representation.
  prefs: []
  type: TYPE_NORMAL
- en: 'Looking at the results, we can immediately make a few observations:'
  prefs: []
  type: TYPE_NORMAL
- en: 'We can see again that Poisson regression is overconfident: every single one
    of the PPD samples is on (or extremely close to) the regression line, with little
    observed variability around it.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'The other two models both have trajectories that go up and down, while the
    true pattern is monotonically nondecreasing. This is a weakness of our models:
    specifically, we assume that the <semantics><mrow><mi>y</mi></mrow><annotation
    encoding="application/x-tex">y</annotation></semantics>y-values are conditionally
    i.i.d.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'The samples from the linear regression have an enormous amount of variability:
    we can see that many of them make predictions well over 15,000 turbines starting
    in 2015, which is far more than the actual observed values. This tells us that
    the model allows for too much variability.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: The negative binomial model has a much more reasonable range of values, at least
    before 2018\. One could imagine that under different political and economic circumstances,
    Oklahoma might have built more or fewer turbines in accordance with these predictions.
    While the model still has a little too much variability, it’s still much more
    reasonable than the
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Note that all of the above required some subjective evaluation and a bit of
    domain knowledge! In many cases, where we have not just one observed <semantics><mrow><mi>y</mi></mrow><annotation
    encoding="application/x-tex">y</annotation></semantics>y-value per unique value
    of <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x
    but instead a cloud of points, we can produce quantitative evaluations from the
    PPC, such as comparing the variance of the observed <semantics><mrow><mi>y</mi></mrow><annotation
    encoding="application/x-tex">y</annotation></semantics>y-values to the variance
    of the PPC samples, but the details of such procedures are beyond the scope of
    this class.
  prefs: []
  type: TYPE_NORMAL
- en: '*Exercise: Recall that the outlier in 2000 (<semantics><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">t=0</annotation></semantics>t=0) affected our predictions,
    likely causing the slope to be too high across all three models. Try fitting the
    three models above after removing that outlier from the dataset. Do the results
    change? How and why?*'
  prefs: []
  type: TYPE_NORMAL
