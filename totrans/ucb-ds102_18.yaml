- en: '[PRE0]'
  id: totrans-3
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: 'When fitting a model to data, it’s important to ask the question: **is this
    model a good representation of the data**?'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 将模型拟合到数据时，一个重要的问题是：**这个模型能很好地代表数据吗**？
- en: In this section, we’ll answer this question from frequentist and Bayesian perspectives.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 在本节中，我们将从频率派和贝叶斯的角度来回答这个问题。
- en: 'We’ll consider model evaluation from two viewpoints:'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将从两个角度考虑模型评估：
- en: Are our models a good fit for the data we used to fit them (in the case of prediction,
    our training data)?
  id: totrans-7
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我们的模型是否很好地拟合了我们用来拟合它们的数据（在预测的情况下，即我们的训练数据）？
- en: Will our models (particularly prediction models) generalize well to new, previously
    unseen data?
  id: totrans-8
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我们的模型（尤其是预测模型）能否很好地泛化到新的、以前未见过的数据？
- en: When formulating and fitting a model, it’s important to answer both of these
    questions. In practice, it’s often easier to answer (and debug/iterate) the first
    question before moving on to the second.
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 在制定和拟合模型时，回答这两个问题都很重要。在实践中，通常更容易先回答（并调试/迭代）第一个问题，然后再处理第二个问题。
- en: '[PRE1]'
  id: totrans-10
