- en: 4  Connecting Data and Probability
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 4  连接数据和概率
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/prob/connecting-data-and-probability.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/prob/connecting-data-and-probability.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/prob/connecting-data-and-probability.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/prob/connecting-data-and-probability.html)
- en: '[Probability](../prob/intro-to-prob.html)'
  id: totrans-2
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[概率](../prob/intro-to-prob.html)'
- en: '[4  Connecting Data and Probability](../prob/connecting-data-and-probability.html)'
  id: totrans-3
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[4  连接数据和概率](../prob/connecting-data-and-probability.html)'
- en: In this part of the book, we use games of chance, tossing coins, drawing beads,
    spinning a roulette wheel, to illustrate the principles of probability. These
    examples are valuable because the probabilistic mechanism is perfectly known.
    We can compute exact probabilities, repeat experiments as many times as we like,
    and verify the results mathematically or by simulation.
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 在本书的这一部分，我们使用机会游戏、抛硬币、抽珠子、旋转轮盘赌来阐述概率原理。这些例子很有价值，因为概率机制是完美已知的。我们可以计算确切的概率，重复实验任意多次，并通过数学或模拟来验证结果。
- en: In real-world data analysis, the connection between probability and observation
    is rarely so clear. The systems we study, such as, people, hospitals, weather,
    economies, and biological processes, are complex. We use probability not because
    these systems are necessarily truly random, but because probabilistic models provide
    a practical way to describe and reason about unexplained variability and uncertainty.
    In this chapter, we introduce some of the ways real-world problems can be connected
    to probabilistic models, so you can begin to recognize these connections as you
    learn about probability theory in the following chapters.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 在现实世界的数据分析中，概率与观察之间的联系很少如此清晰。我们研究的系统，如人、医院、天气、经济和生物过程，都是复杂的。我们使用概率并不是因为这些系统必然是真正随机的，而是因为概率模型提供了一种实用的方法来描述和推理未解释的变异和不确定性。在本章中，我们介绍了一些将现实世界问题与概率模型联系起来的方法，这样你可以在学习以下章节的概率理论时开始识别这些联系。
- en: 4.1 Probability models in the real world
  id: totrans-6
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 4.1 现实世界中的概率模型
- en: Today, probability underlies far more than gambling. We use it to describe the
    likelihood of rain, the risk of disease, or the uncertainty in an election forecast.
    Yet, outside of games of chance, the meaning of *probability* is often less obvious.
    In practice, when we use probability to analyze data, we are almost always assuming
    that a probabilistic model applies. Sometimes this assumption is well motivated;
    other times, it is simply a convenient approximation.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 今天，概率不仅仅基于赌博。我们用它来描述降雨的可能性、疾病的危险或选举预报的不确定性。然而，在机会游戏之外，*概率*的含义往往不那么明显。在实践中，当我们使用概率来分析数据时，我们几乎总是假设一个概率模型适用。有时这种假设有很好的动机；其他时候，它仅仅是一个方便的近似。
- en: 'It is important to keep this in mind: when our probability model is wrong,
    our conclusions may be wrong as well.'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 重要的是要记住这一点：当我们的概率模型错误时，我们的结论也可能错误。
- en: Below we go over the five main ways we connect probability to data.
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 下面我们将介绍五种主要方式，我们将概率与数据联系起来。
- en: Random sampling
  id: totrans-10
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 随机抽样
- en: In polling, we often assume that the people we answer our questions are a random
    sample from the population of interest. For example, imagine putting the phone
    numbers of all eligible voters into a large bag and drawing 1,000 at random, then
    calling them and asking who they support. If this process were truly random, the
    statistical methods we will introduce will apply directly.
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 在民意调查中，我们通常假设回答我们问题的人是感兴趣人群的随机样本。例如，想象将所有有资格选民的电话号码放入一个大袋子中，随机抽取1,000个，然后打电话给他们，询问他们支持谁。如果这个过程真正是随机的，我们将介绍的那些统计方法将直接适用。
- en: This assumption is also common in animal or laboratory studies. When a researcher
    orders mice from a breeding facility, the supplier’s shipment is often treated
    as a random sample from all possible mice in that strain. This makes it possible
    to apply probability models in a way very similar to our games of chance.
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 这种假设在动物或实验室研究中也很常见。当研究人员从繁殖设施订购小鼠时，供应商的货物通常被视为从该品系所有可能小鼠中随机抽取的样本。这使得我们可以以与我们机会游戏非常相似的方式应用概率模型。
- en: Random assignment
  id: totrans-13
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 随机分配
- en: 'A second setting where probability connects directly to data is *randomized
    experiments*. In clinical trials, for instance, patients are assigned to a treatment
    or control group by chance, often by flipping a coin. This ensures that, on average,
    the groups are comparable, and that any difference in outcomes can be attributed
    to the treatment itself. The same logic underlies what is today called A/B testing,
    widely used in technology and business settings to compare two versions of a product,
    website, or algorithm. Whether in medicine or online platforms, these experiments
    rely on the same fundamental idea: random assignment creates conditions where
    probability can be used to infer causation. In these examples, as in urn or coin
    examples, the link between probability and data is clear.'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 概率直接与数据相连的第二个场景是*随机实验*。例如，在临床试验中，患者通常通过掷硬币等方式随机分配到治疗组或对照组。这确保了两组在平均意义上是可比的，并且任何结果差异都可以归因于治疗本身。同样的逻辑也适用于今天被称为A/B测试的方法，它在技术和商业环境中广泛用于比较两个版本的产品、网站或算法。无论是在医学还是在线平台上，这些实验都依赖于同样的基本思想：随机分配创造了可以使用概率来推断因果关系的条件。在这些例子中，就像在罐子或硬币的例子中一样，概率与数据之间的联系是明显的。
- en: When randomness is assumed
  id: totrans-15
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 当假设存在随机性时
- en: In many real-world analyses, data are not collected through random sampling
    or controlled experiments. Instead, most datasets we work with are convenience
    samples, collected from individuals who are easy to reach rather than randomly
    selected from a well-defined population. Examples include participants in online
    surveys, patients from a particular hospital, students in a specific class, or
    volunteers in a research study.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 在许多现实世界的分析中，数据不是通过随机抽样或控制实验收集的。相反，我们大多数使用的数据集都是便利样本，这些样本是从容易接触到的个体中收集的，而不是从定义良好的总体中随机选择的。例如，包括在线调查的参与者、特定医院的病人、特定班级的学生或研究中的志愿者。
- en: When we fit probability models to such data, we implicitly make an assumption
    that the sample behaves as if it were random. This assumption is rarely stated
    explicitly, yet it underlies many analyses that report results such as \(p\)-values,
    confidence intervals, or predicted probabilities. These quantities all rely on
    probabilistic reasoning, which presumes that the data can be treated as draws
    from a random process.
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 当我们将概率模型拟合到这样的数据时，我们隐含地做出了一个假设，即样本的行为就像它是随机的。这个假设很少被明确陈述，但它却是许多报告结果如\(p\)-值、置信区间或预测概率的分析的基础。这些量都依赖于概率推理，它假定数据可以被视为来自随机过程的抽取。
- en: The same assumption appears in machine learning. When we train a model, we use
    only a subset of available data and expect the model to generalize to unseen cases.
    This expectation depends on the idea that the training data are, for all practical
    purposes, a random sample from the same population as the future data. In practice,
    however, these training sets are often convenience samples as well.
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 同样的假设出现在机器学习中。当我们训练一个模型时，我们只使用可用数据的一个子集，并期望模型能够推广到未见过的案例。这种期望依赖于这样一个观点：训练数据在所有实际意义上都是来自与未来数据相同总体的随机样本。然而，在实践中，这些训练集通常是便利样本。
- en: Despite this, such models and analyses often work remarkably well and have provided
    valuable insights. For example, studies using observational data have convincingly
    shown that smoking harms health and that regular exercise and good diet extend
    life. But when data come from convenience samples, extra care is needed. The assumptions
    behind our probability models become especially important. Treating a convenience
    sample as if it were a simple random sample can lead to biased and misleading
    conclusions.
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 尽管如此，这样的模型和分析通常工作得非常出色，并提供了宝贵的见解。例如，使用观察数据的研究有力地表明吸烟有害健康，而定期锻炼和良好的饮食可以延长寿命。但是，当数据来自便利样本时，需要格外小心。我们概率模型背后的假设变得尤为重要。将便利样本当作简单随机样本处理可能会导致有偏和误导性的结论。
- en: These biases can sometimes be corrected with statistical techniques, but doing
    so requires making additional assumptions. Understanding what those assumptions
    are, and thinking critically about whether they are reasonable, is essential for
    sound data analysis. Later in the book (see [Chapter 19](../linear-models/association-not-causation.html)),
    we will revisit this topic and show concrete examples of how unexamined assumptions
    about randomness can distort results.
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 这些偏差有时可以通过统计技术纠正，但这样做需要做出额外的假设。理解这些假设是什么，并批判性地思考它们是否合理，对于进行可靠的数据分析至关重要。本书稍后（见[第19章](../linear-models/association-not-causation.html)）将重新探讨这个主题，并展示未经检验的随机性假设如何扭曲结果的实例。
- en: Natural variation
  id: totrans-21
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 自然变异
- en: 'Finally, many natural processes appear random even when no measurement error
    or sampling is involved. Which genes are inherited, small biometric differences
    between genetically identical organisms, variation in the stock market, the number
    of earthquakes in a year, whether a particular cell becomes cancerous, or the
    number of photons striking a telescope’s detector, all vary in ways that seem
    unpredictable. In these situations, probability serves as a modeling tool: a concise
    way to describe complex systems whose underlying mechanisms are too intricate,
    chaotic, or numerous to predict exactly.'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 最后，许多自然过程即使在没有测量误差或抽样的情况下也看似随机。哪些基因会被继承，基因相同生物体之间的小生物测量差异，股市的波动，一年中的地震次数，某个细胞是否癌变，或者撞击望远镜探测器的光子数量，所有这些都在以看似不可预测的方式变化。在这些情况下，概率作为一种建模工具：一种简洁地描述复杂系统的方法，这些系统的潜在机制过于复杂、混乱或数量众多，无法精确预测。
- en: In such cases, probabilistic models do not imply that nature itself is random.
    Rather, they acknowledge our limited ability to predict and give us a useful way
    to summarize uncertainty.
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 在这些情况下，概率模型并不暗示自然本身是随机的。相反，它们承认我们预测能力的局限性，并为我们提供了一种有用的方法来总结不确定性。
- en: 4.2 The role of design
  id: totrans-24
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 4.2 设计的作用
- en: Because most real-world data do not arise from ideal random processes, our ability
    to draw valid conclusions depends critically on the design of studies and experiments.
    As the statistician Ronald Fisher famously remarked, “To consult the statistician
    after an experiment is finished is often merely to ask him to perform a post-mortem
    examination.” Design is what connects the mathematics of probability to the messy
    realities of data collection.
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: 由于大多数现实世界的数据并非来自理想的随机过程，我们得出有效结论的能力在很大程度上取决于研究和实验的设计。正如统计学家罗纳德·费希尔著名地指出：“实验结束后咨询统计学家，通常只是要求他进行尸检。”设计是将概率数学与数据收集的混乱现实联系起来的桥梁。
- en: A well-designed study, one that uses randomization, proper sampling, and consistent
    measurement, creates conditions under which probabilistic reasoning is meaningful.
    Without this foundation, even the most sophisticated analyses can produce misleading
    results. Random assignment helps isolate cause and effect. Random sampling helps
    ensure representativeness. Standardized procedures reduce bias and make uncertainty
    quantifiable.
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 一个设计良好的研究，即使用随机化、适当的抽样和一致的测量，创造了概率推理有意义的条件。没有这个基础，即使是最复杂的分析也可能产生误导性的结果。随机分配有助于隔离因果关系。随机抽样有助于确保代表性。标准化程序减少偏差并使不确定性可量化。
- en: 'This book does not cover experimental design in detail, but in the Further
    Reading section we recommend several excellent introductions. For now, the key
    idea is this: when we use probability to reason about data, we are implicitly
    assuming a connection between a mathematical model and a real process. The stronger
    that connection, through careful design, random sampling, or random assignment,
    the more trustworthy our conclusions will be. Poor design, on the other hand,
    weakens this bridge and makes uncertainty far harder to interpret.'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: 本书没有详细涵盖实验设计，但在进一步阅读部分我们推荐了几本优秀的入门书籍。目前的关键思想是：当我们使用概率来推理数据时，我们隐含地假设数学模型与实际过程之间存在联系。通过仔细设计、随机抽样或随机分配，这种联系越强，我们的结论就越可靠。另一方面，设计不当会削弱这座桥梁，使不确定性难以解释。
- en: 4.3 Exercises
  id: totrans-28
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 4.3 练习
- en: 1\. Suppose a national poll reports that 52% of voters support a candidate,
    based on a random sample of 1,000 people. a. Explain what “random sample” means
    in this context. b. Describe at least two ways the real sampling process might
    deviate from true randomness.
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: 1. 假设一项全国性民意调查显示，基于对1,000人的随机抽样，52%的选民支持某位候选人。a. 解释在这个背景下“随机抽样”的含义。b. 描述至少两种现实抽样过程可能偏离真正随机性的方式。
- en: 2\. A clinical trial randomly assigns 500 participants to treatment and 500
    to control. a. Is this an example of random sampling or random assignment? b.
    How does random assignment help us draw causal conclusions? c. What assumptions
    must still hold for the trial’s conclusions to generalize to the broader population?
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: 2\. 一项临床试验随机将500名参与者分配到治疗组和500名分配到对照组。a. 这是不是一个随机抽样的例子？b. 随机分配如何帮助我们得出因果结论？c.
    为了使试验结论可以推广到更广泛的群体，必须仍然保持哪些假设？
- en: 3\. A researcher records each patient’s blood pressure twice and finds that
    the two measurements differ by about 5 mmHg on average. Explain how measurement
    error can be viewed as a source of randomness.
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: 3\. 一位研究人员记录了每位患者的血压两次，并发现两次测量的平均值差异约为5毫米汞柱。解释如何将测量误差视为随机性的来源。
- en: 4\. You are studying caffeine consumption among college students, but your survey
    responses come primarily from biology majors. a. Why might treating this sample
    as “random” lead to misleading conclusions? b. Suggest at least one way to improve
    the representativeness of the data collection process. c. Describe a real-world
    scenario where improving representativeness might be difficult or impossible.
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 4\. 你正在研究大学生对咖啡因的摄入量，但你的调查回应主要来自生物专业学生。a. 为什么将这个样本视为“随机”可能会导致误导性的结论？b. 建议至少一种改进数据收集过程代表性的方法。c.
    描述一个在提高代表性可能困难或不可能的真实世界场景。
- en: '5\. For each of the following, identify the primary source of randomness being
    modeled, *sampling variation*, *measurement error*, *natural variation*, or *random
    assignment*: a. Estimating unemployment from a household survey. b. Measuring
    air temperature every hour for a week. c. Testing whether a fertilizer increases
    crop yield. d. Comparing test scores from different schools. e. Predicting how
    many hurricanes will form next year.'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 5\. 对于以下每一项，确定正在模拟的主要随机来源，是*抽样变异*、*测量误差*、*自然变异*还是*随机分配*：a. 从家庭调查中估计失业率。b. 每小时测量一周的空气温度。c.
    测试肥料是否增加作物产量。d. 比较不同学校的考试成绩。e. 预测明年将形成多少次飓风。
