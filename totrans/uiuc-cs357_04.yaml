- en: Learning Objectives
  id: totrans-4
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 学习目标
- en: Represent numbers in floating point systems
  id: totrans-5
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在浮点数系中表示数字
- en: Evaluate the range, precision, and accuracy of different representations
  id: totrans-6
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 评估不同表示的范围、精度和准确性
- en: Define Machine Epsilon
  id: totrans-7
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 定义机器精度
- en: Identify the smallest and largest representable floating point number
  id: totrans-8
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 识别可表示的最小和最大浮点数
- en: Handle special cases and subnormal numbers
  id: totrans-9
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 处理特殊情况和非正常数值
- en: Number Systems and Bases
  id: totrans-10
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 数制与基数
- en: There are a variety of number systems in which a number can be represented.
    In the common base 10 (decimal) system each digit takes on one of 10 values, from
    0 to 9\. In base 2 (binary), each digit takes on one of 2 values, 0 or 1.
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 存在着多种数制，可以用来表示一个数。在常见的基数10（十进制）系统中，每个数字可以取0到9之间的10个值。在基数2（二进制）中，每个数字可以取0或1之间的2个值。
- en: 'For a given \(\beta\), in the \(\beta\)-system we have:'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 对于给定的\(\beta\)，在\(\beta\)进制中，我们有：
- en: \[(a_n \ldots a_2 a_1 a_0 . b_1 b_2 b_3 b_4 \dots)_{\beta} = \sum_{k=0}^{n}
    a_k \beta^k + \sum_{k=1}^\infty b_k \beta^{-k}.\]
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: \[(a_n \ldots a_2 a_1 a_0 . b_1 b_2 b_3 b_4 \dots)_{\beta} = \sum_{k=0}^{n}
    a_k \beta^k + \sum_{k=1}^\infty b_k \beta^{-k}.\]
- en: 'Some common bases used for numbering systems are:'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 一些常用的编号系统基数包括：
- en: 'decimal: \(\beta=10\)'
  id: totrans-15
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 十进制：\(\beta=10\)
- en: 'binary: \(\beta=2\)'
  id: totrans-16
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 二进制：\(\beta=2\)
- en: 'octal: \(\beta=8\)'
  id: totrans-17
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 八进制：\(\beta=8\)
- en: hexadecimal \(\beta=16\)
  id: totrans-18
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 十六进制 \(\beta=16\)
- en: 'Example:'
  id: totrans-19
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例：
- en: 'Decimal base: \((426.97)_{10}\)'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 十进制基数：\((426.97)_{10}\)
- en: <details><summary>**Answer**</summary>
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: <details><summary>**答案**</summary>
- en: \(\begin{equation}(426.97)_{10} = 4 \times 10^2 + 2 \times 10^1 + 6 \times 10^0
    + 9 \times 10^{-1} + 7 \times 10^{-2} \end{equation}\)</details>
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: \(\begin{equation}(426.97)_{10} = 4 \times 10^2 + 2 \times 10^1 + 6 \times 10^0
    + 9 \times 10^{-1} + 7 \times 10^{-2} \end{equation}\)</details>
- en: 'Binary base: \((1011.001)_{2}\)'
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 二进制基数：\((1011.001)_{2}\)
- en: <details><summary>**Answer**</summary>
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: <details><summary>**答案**</summary>
- en: \((1011.001)_{2} = 1 \times 2^3 + 0 \times 2^2 + 1 \times 2^1 + 1 \times 2^0
    + 0 \times 2^{-1} + 0 \times 2^{-2} + 1 \times 2^{-3} = (11.125)_{10}\)</details>
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: \((1011.001)_{2} = 1 \times 2^3 + 0 \times 2^2 + 1 \times 2^1 + 1 \times 2^0
    + 0 \times 2^{-1} + 0 \times 2^{-2} + 1 \times 2^{-3} = (11.125)_{10}\)</details>
- en: Converting Integers Between Decimal and Binary
  id: totrans-26
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 在十进制和二进制之间转换整数
- en: Modern computers use transistors to store data. These transistors can either
    be ON (1) or OFF (0). In order to store integers in a computer, we must first
    convert them to binary. For example, the binary representation of 23 is \((10111)_2\).
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: 现代计算机使用晶体管来存储数据。这些晶体管可以是开启状态（1）或关闭状态（0）。为了在计算机中存储整数，我们必须首先将它们转换为二进制。例如，23的二进制表示为\((10111)_2\)。
- en: 'Converting an integer from binary representation (base 2) to decimal representation
    (base 10) is easy. Simply multiply each digit by increasing powers of 2 like so:'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 将整数从二进制表示（基数2）转换为十进制表示（基数10）是很容易的。只需将每个数字乘以2的递增幂，如下所示：
- en: \[(10111)_2 = 1 \cdot 2^4 + 0 \cdot 2^3 + 1 \cdot 2^2 + 1 \cdot 2^1 + 1 \cdot
    2^0 = 23\]
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: \[(10111)_2 = 1 \cdot 2^4 + 0 \cdot 2^3 + 1 \cdot 2^2 + 1 \cdot 2^1 + 1 \cdot
    2^0 = 23\]
- en: 'Converting an integer from decimal to binary is a similar process, except instead
    of multiplying by 2 we will be dividing by 2 and keeping track of the remainder:'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: 将整数从十进制转换为二进制是一个类似的过程，除了不是乘以2，而是除以2并记录余数：
- en: \[\begin{align} 23 // 2 &= 11\ \mathrm{rem}\ 1 \\ 11 // 2 &= 5\ \mathrm{rem}\
    1 \\ 5 // 2 &= 2\ \mathrm{rem}\ 1 \\ 2 // 2 &= 1\ \mathrm{rem}\ 0 \\ 1 // 2 &=
    0\ \mathrm{rem}\ 1 \\ \end{align}\]
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{align} 23 // 2 &= 11\ \mathrm{余}\ 1 \\ 11 // 2 &= 5\ \mathrm{余}\ 1
    \\ 5 // 2 &= 2\ \mathrm{余}\ 1 \\ 2 // 2 &= 1\ \mathrm{余}\ 0 \\ 1 // 2 &= 0\ \mathrm{余}\
    1 \\ \end{align}\]
- en: Thus, \((23)_{10}\) becomes \((10111)_2\) in binary.
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，\((23)_{10}\)在二进制中表示为\((10111)_2\)。
- en: 'You may find these additional resources helpful for review: [Decimal to Binary
    1](https://www.wikihow.com/Convert-from-Decimal-to-Binary) and [Decimal to Binary
    2](http://interactivepython.org/courselib/static/pythonds/BasicDS/ConvertingDecimalNumberstoBinaryNumbers.html)'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 您可能发现以下额外资源对复习有帮助：[十进制转二进制1](https://www.wikihow.com/Convert-from-Decimal-to-Binary)
    和 [十进制转二进制2](http://interactivepython.org/courselib/static/pythonds/BasicDS/ConvertingDecimalNumberstoBinaryNumbers.html)
- en: Converting Fractions Between Decimal and Binary
  id: totrans-34
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 在十进制和二进制之间转换分数
- en: Real numbers add an extra level of complexity. Not only do they have a leading
    integer, they also have a fractional part. For now, we will represent a decimal
    number like 23.375 as \((10111.011)_2\). Of course, the actual machine representation
    depends on whether we are using a fixed point or a floating point representation,
    but we will get to that in later sections.
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: 实数增加了额外的复杂性。它们不仅有一个前导整数，还有一个小数部分。现在，我们将十进制数23.375表示为 \((10111.011)_2\)。当然，实际的机器表示取决于我们使用的是定点表示还是浮点表示，但这一点将在后面的章节中讨论。
- en: 'Converting a number with a fractional portion from binary to decimal is similar
    to converting to an integer, except that we continue into negative powers of 2
    for the fractional part:'
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 将具有小数部分的数字从二进制转换为十进制与转换为整数类似，不同之处在于我们继续对分数部分使用2的负幂：
- en: \[(10111.011)_2 = 1 \cdot 2^4 + 0 \cdot 2^3 + 1 \cdot 2^2 + 1 \cdot 2^1 + 1
    \cdot 2^0 + 0 \cdot 2^{-1} + 1 \cdot 2^{-2} + 1 \cdot 2^{-3} = 23.375\]
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: \[(10111.011)_2 = 1 \cdot 2^4 + 0 \cdot 2^3 + 1 \cdot 2^2 + 1 \cdot 2^1 + 1
    \cdot 2^0 + 0 \cdot 2^{-1} + 1 \cdot 2^{-2} + 1 \cdot 2^{-3} = 23.375\]
- en: 'To convert a decimal fraction to binary, first convert the integer part to
    binary as previously discussed. Then, take the fractional part (ignoring the integer
    part) and multiply it by 2\. The resulting integer part will be the binary digit.
    Throw away the integer part and continue the process of multiplying by 2 until
    the fractional part becomes 0\. For example:'
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: 将十进制小数转换为二进制，首先将整数部分转换为二进制，如前所述。然后，取小数部分（忽略整数部分）并将其乘以2。得到的整数部分将是二进制位。丢弃整数部分，并继续乘以2的过程，直到小数部分变为0。例如：
- en: \[\begin{align} 23 &= (10111)_2 \\ 2 \cdot .375 &= 0.75 \\ 2 \cdot .75 &= 1.5
    \\ 2 \cdot .5 &= 1.0 \\ \end{align}\]
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{align} 23 &= (10111)_2 \\ 2 \cdot .375 &= 0.75 \\ 2 \cdot .75 &= 1.5
    \\ 2 \cdot .5 &= 1.0 \\ \end{align}\]
- en: By combining the integer and fractional parts, we find that \(23.375 = (10111.011)_2\).
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 通过组合整数部分和小数部分，我们发现 \(23.375 = (10111.011)_2\)。
- en: 'Not all fractions can be represented in binary using a finite number of digits.
    For example, if you try the above technique on a number like 0.1, you will find
    that the remaining fraction begins to repeat:'
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: 并非所有分数都可以使用有限位数的二进制表示。例如，如果您尝试使用上述技术对0.1这样的数字进行处理，您会发现剩余的分数开始重复：
- en: \[\begin{align} 2 \cdot .1 &= 0.2 \\ 2 \cdot .2 &= 0.4 \\ 2 \cdot .4 &= 0.8
    \\ 2 \cdot .8 &= 1.6 \\ 2 \cdot .6 &= 1.2 \\ 2 \cdot .2 &= 0.4 \\ 2 \cdot .4 &=
    0.8 \\ 2 \cdot .8 &= 1.6 \\ 2 \cdot .6 &= 1.2 \\ \end{align}\]
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{align} 2 \cdot .1 &= 0.2 \\ 2 \cdot .2 &= 0.4 \\ 2 \cdot .4 &= 0.8
    \\ 2 \cdot .8 &= 1.6 \\ 2 \cdot .6 &= 1.2 \\ 2 \cdot .2 &= 0.4 \\ 2 \cdot .4 &=
    0.8 \\ 2 \cdot .8 &= 1.6 \\ 2 \cdot .6 &= 1.2 \\ \end{align}\]
- en: As you can see, the decimal 0.1 will be represented in binary as the infinitely
    repeating series \((0.00011001100110011…)_2\). The exact number of digits that
    get stored in a floating point number depends on whether we are using single precision
    or double precision.
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: 如您所见，十进制数0.1在二进制中表示为无限重复的小数序列 \((0.00011001100110011…)_2\)。浮点数中存储的确切位数取决于我们使用的是单精度还是双精度。
- en: (Unsigned) Fixed-Point Representation
  id: totrans-44
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: (无符号)定点表示
- en: In fixed-point representation, numbers are stored with a fixed number of bits
    for the integer part and a fixed number of bits for the fractional part.
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: 在定点表示中，数字使用固定数量的位来存储整数部分，以及固定数量的位来存储小数部分。
- en: Suppose we have 64 bits to store a real number, where 32 bits store the integer
    part and 32 bits store the fractional part.
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们用64位来存储一个实数，其中32位存储整数部分，32位存储小数部分。
- en: \[(a_{31}...a_2a_1a_0.b_1b_2b_3...b_{32}) = \sum_{k=0}^{31} a_k 2^k + \sum_{k=1}^{32}
    b_k 2^{-k}\] \[\begin{eqnarray} = &a_{31}& \times 2^{31}\ + ... + a_1 \times 2^1
    + a_0 \times 2^0 \\ + &b_1& \times 2^{-1} + b_2 \times 2^{-2}+ ... +\ b_{32} \times
    2^{-32} \end{eqnarray}\]
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: \[(a_{31}...a_2a_1a_0.b_1b_2b_3...b_{32}) = \sum_{k=0}^{31} a_k 2^k + \sum_{k=1}^{32}
    b_k 2^{-k}\] \[\begin{eqnarray} = &a_{31}& \times 2^{31}\ + ... + a_1 \times 2^1
    + a_0 \times 2^0 \\ + &b_1& \times 2^{-1} + b_2 \times 2^{-2}+ ... +\ b_{32} \times
    2^{-32} \end{eqnarray}\]
- en: '**Smallest Number**'
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: '**最小数字**'
- en: We get the smallest representable number when all of the values of \(a_i\) and
    \(b_i\) are \(0\), except for \(b_{32}\).
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: 当 \(a_i\) 和 \(b_i\) 的所有值都是 \(0\) 时，我们得到可表示的最小数字，除了 \(b_{32}\)。
- en: \[\begin{eqnarray} &a_i =& 0 \ \forall i,\ b_1,\ b_2, ...,\ b_{31} = 0,\ and
    \ b_{32} = 1 \\ &\implies& 2^{-32} \approx 10^{-9} \end{eqnarray}\]
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{eqnarray} &a_i =& 0 \ \forall i,\ b_1,\ b_2, ...,\ b_{31} = 0,\ and
    \ b_{32} = 1 \\ &\implies& 2^{-32} \approx 10^{-9} \end{eqnarray}\]
- en: '**Largest Number**'
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: '**最大数字**'
- en: We get the largest representable number when all of the values of \(a_i\) and
    \(b_i\) are \(1\).
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: 当 \(a_i\) 和 \(b_i\) 的所有值都是 \(1\) 时，我们得到可表示的最大数字。
- en: \[\begin{eqnarray} &a_i =& 1 \ \forall i \ and \ b_i = 1 \ \forall i \\ &\implies&
    2^{31}\ + ... + 2^1 + 2^0 + 2^{-1} + 2^{-2}+ ... +\ 2^{-32} \approx 10^9 \end{eqnarray}\]
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{eqnarray} &a_i =& 1 \ \forall i \ and \ b_i = 1 \ \forall i \\ &\implies&
    2^{31}\ + ... + 2^1 + 2^0 + 2^{-1} + 2^{-2}+ ... +\ 2^{-32} \approx 10^9 \end{eqnarray}\]
- en: Binary Point Placement
  id: totrans-54
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 二进制小数点位置
- en: We consider the range and precision when evaluating a representation.
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: 我们在评估表示时考虑范围和精度。
- en: '**Range:** Difference between the largest and smallest numbers possible.'
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: '**范围:** 可能的最大数和最小数之间的差值。'
- en: '**Precision:** Smallest possible difference between any two numbers.'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: '**精度:** 任意两个数之间可能的最小差值。'
- en: Consider an 8 bit system where 6 bits store the integer part and 2 bits store
    the fractional part. What are its range and precision?
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 考虑一个8位系统，其中6位存储整数部分，2位存储小数部分。它的范围和精度是多少？
- en: <details><summary>**Answer**</summary>
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: <details><summary>**答案**</summary>
- en: '**Smallest Numbers**'
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: '**最小的数**'
- en: \(000000.01 = 0.25\)
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: \(000000.01 = 0.25\)
- en: \(000000.10 = 0.5\)
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: \(000000.10 = 0.5\)
- en: '**Largest Numbers**'
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: '**最大的数**'
- en: \(111111.10 = 63.5\)
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: \(111111.10 = 63.5\)
- en: \(111111.11 = 63.75\)
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
  zh: \(111111.11 = 63.75\)
- en: '**Range**'
  id: totrans-66
  prefs: []
  type: TYPE_NORMAL
  zh: '**范围**'
- en: \(63.75 - 0.25 = 63.5\)
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
  zh: \(63.75 - 0.25 = 63.5\)
- en: '**Precision**'
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
  zh: '**精度**'
- en: \(0.5 - 0.25 = 63.75 - 63.5 = 0.25\)</details>
  id: totrans-69
  prefs: []
  type: TYPE_NORMAL
  zh: \(0.5 - 0.25 = 63.75 - 63.5 = 0.25\)</details>
- en: How about for an 8 bit system where 2 bits store the integer part and 6 bits
    store the fractional part?
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
  zh: 对于一个8位系统，其中2位存储整数部分，6位存储小数部分，情况如何？
- en: <details><summary>**Answer**</summary>
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: <details><summary>**答案**</summary>
- en: '**Smallest Numbers**'
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: '**最小的数**'
- en: \(00.000001 = 0.015625\)
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: \(00.000001 = 0.015625\)
- en: \(00.000010 = 0.03125\)
  id: totrans-74
  prefs: []
  type: TYPE_NORMAL
  zh: \(00.000010 = 0.03125\)
- en: '**Largest Numbers**'
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: '**最大的数**'
- en: \(11.111110 = 3.96875\)
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: \(11.111110 = 3.96875\)
- en: \(11.111111 = 3.984375\)
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: \(11.111111 = 3.984375\)
- en: '**Range**'
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: '**范围**'
- en: \(3.984375 - 0.015625 = 3.96875\)
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
  zh: \(3.984375 - 0.015625 = 3.96875\)
- en: '**Precision**'
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
  zh: '**精度**'
- en: \(0.03125 - 0.015625 = 3.984375 - 3.96875 = 0.015625\)</details>
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
  zh: \(0.03125 - 0.015625 = 3.984375 - 3.96875 = 0.015625\)</details>
- en: We see that having more **integer** bits increases **range** and more bits for
    the **fractional** part increases **precision**. It can be hard to decide how
    much precision and range you need.
  id: totrans-82
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以看到，增加**整数**位会增加**范围**，而增加**小数**位会增加**精度**。很难决定你需要多少精度和范围。
- en: '**Fix: Let the binary point "float"**'
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
  zh: '**修正：让二进制小数点“浮动”**'
- en: Floating Point Numbers
  id: totrans-84
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 浮点数
- en: The floating point representation of a binary number is similar to scientific
    notation for decimals. Similar to how you can represent 23.375 as
  id: totrans-85
  prefs: []
  type: TYPE_NORMAL
  zh: 二进制数的浮点表示类似于十进制的科学记数法。类似于你可以将23.375表示为
- en: \[2.3375 \cdot 10^1,\]
  id: totrans-86
  prefs: []
  type: TYPE_NORMAL
  zh: \[2.3375 \cdot 10^1,\]
- en: you can represent \((10111.011)_2\) as
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: 你可以将 \((10111.011)_2\) 表示为
- en: \[1.0111011 \cdot 2^4.\]
  id: totrans-88
  prefs: []
  type: TYPE_NORMAL
  zh: \[1.0111011 \cdot 2^4.\]
- en: A floating-point number can represent numbers of different orders of magnitude(very
    large and very small) with the same number of fixed digits.
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
  zh: 浮点数可以用相同的固定位数表示不同数量级的数（非常大和非常小）。
- en: More formally, we can define a floating point number \(x\) as
  id: totrans-90
  prefs: []
  type: TYPE_NORMAL
  zh: 更正式地说，我们可以将一个浮点数 \(x\) 定义为
- en: \[x = \pm q \cdot 2^m,\]
  id: totrans-91
  prefs: []
  type: TYPE_NORMAL
  zh: \[x = \pm q \cdot 2^m,\]
- en: 'where:'
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: 其中：
- en: \(\pm\) is the sign
  id: totrans-93
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: \(\pm\) 是符号
- en: \(q\) is the significand
  id: totrans-94
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: \(q\) 是尾数
- en: \(m\) is the exponent
  id: totrans-95
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: \(m\) 是指数
- en: Aside from the special case of zero and subnormal numbers (discussed below),
    the significand is always in normalized form
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: 除了零和下溢数（下面讨论）的特殊情况外，尾数总是以归一化形式存在
- en: \[q = 1.f,\]
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
  zh: \[q = 1.f,\]
- en: 'where:'
  id: totrans-98
  prefs: []
  type: TYPE_NORMAL
  zh: 其中：
- en: \(f\) is the fractional part of the significand
  id: totrans-99
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: \(f\) 是尾数的小数部分
- en: Whenever we store a normalized floating point number, the 1 is assumed. We don't
    store the entire significand, just the fractional part. This is called the "hidden
    bit representation", which gives one additional bit of precision.
  id: totrans-100
  prefs: []
  type: TYPE_NORMAL
  zh: 每次我们存储一个归一化浮点数时，都假设1存在。我们不存储整个尾数，只存储小数部分。这被称为“隐藏位表示”，它提供了额外的精度位。
- en: Properties of Normalized Floating-Point Systems
  id: totrans-101
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 归一化浮点数系统的性质
- en: A number \(x\) in a normalized binary floating-point system has the form
  id: totrans-102
  prefs: []
  type: TYPE_NORMAL
  zh: 在归一化的二进制浮点数系统中，一个数 \(x\) 的形式为
- en: \[ \begin{equation} x = \pm 1.b_1b_2b_3...b_n \times 2^m = \pm 1.f \times 2^m
    \end{equation} \]
  id: totrans-103
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \begin{equation} x = \pm 1.b_1b_2b_3...b_n \times 2^m = \pm 1.f \times 2^m
    \end{equation} \]
- en: '**Digits:** \(b_i \in {0, 1}\)'
  id: totrans-104
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**数字:** \(b_i \in {0, 1}\)'
- en: '**Exponent range:** Integer \(m \in [L,U]\)'
  id: totrans-105
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**指数范围:** 整数 \(m \in [L,U]\)'
- en: '**Precision:** \(p = n + 1\)'
  id: totrans-106
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**精度:** \(p = n + 1\)'
- en: '**Smallest positive normalized floating-point number:** \( 2^L\)'
  id: totrans-107
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**最小的正归一化浮点数:** \( 2^L\)'
- en: '**Largest positive normalized floating-point number:** \( 2^{U+1}(1-2^{-p})\)'
  id: totrans-108
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**最大的正归一化浮点数:** \( 2^{U+1}(1-2^{-p})\)'
- en: Example
  id: totrans-109
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '**示例**'
- en: \[\begin{equation} x = \pm 1.b_1b_2 \times 2^m \text{ for } m \in [-4,4] \text{
    and } b_i \in \{0,1\} \end{equation} \]<details><summary>**Answer**</summary>
  id: totrans-110
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{equation} x = \pm 1.b_1b_2 \times 2^m \text{ for } m \in [-4,4] \text{
    and } b_i \in \{0,1\} \end{equation} \]
- en: 'Smallest normalized positive number:'
  id: totrans-111
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 任何大于 -28.0 且小于 +28.0 的数都会溢出到无穷大。</details>
- en: \[ \begin{equation} (1.00)_2 \times 2^{-4} = 0.0625 \end{equation} \]
  id: totrans-112
  prefs: []
  type: TYPE_NORMAL
  zh: 任何比 0.0625 更接近零的数都会下溢到零。
- en: 'Largest normalized positive number:'
  id: totrans-113
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 最大的规范化正数：
- en: \[ \begin{equation} (1.11)_2 \times 2^4 = 28.0 \end{equation} \]
  id: totrans-114
  prefs: []
  type: TYPE_NORMAL
  zh: <details><summary>**答案**</summary>
- en: Any number \(x\) closer to zero than 0.0625 would underflow to zero.
  id: totrans-115
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 整数范围
- en: Any number \(x\) outside the range -28.0 and +28.0 would overflow to infinity.</details>
  id: totrans-116
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在这种表示法中，可以精确表示的整数范围是多少？
- en: Machine Epsilon
  id: totrans-117
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 机器精度
- en: '***Machine epsilon*** (\(\epsilon_m\)) is defined as the distance (gap) between
    \(1\) and the next largest floating point number.'
  id: totrans-118
  prefs: []
  type: TYPE_NORMAL
  zh: 或者对于一般的规范化浮点系统 \(1.f \times 2^m\)，其中 \(f\) 用 \(n\) 位表示，机器精度定义为：
- en: \[\pm 1.b_1b_2 \times 2^m\ for \ m \in [-4,4]\ and\ b_i \in \{0, 1\}\] \[(1.00)_2
    \times 2^0 = 1 \hspace{1.8cm} (1.01)_2 \times 2^0 = 1.25\] \[\epsilon_m = (0.01)_2
    \times 2^0 = 0.25\]
  id: totrans-119
  prefs: []
  type: TYPE_NORMAL
  zh: 在编程语言中，这些值通常作为预定义的常量可用。例如，在 C 语言中，这些常量是 `FLT_EPSILON` 和 `DBL_EPSILON`，并在 `float.h`
    库中定义。在 Python 中，您可以使用以下代码片段访问这些值。
- en: 'Or for a general normalized floating point system \(1.f \times 2^m\), where
    \(f\) is represented with \(n\) bits, machine epsilon is defined as:'
  id: totrans-120
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \begin{equation} (1.00)_2 \times 2^{-4} = 0.0625 \end{equation} \]
- en: \[\epsilon_m = 2^{-n}\]
  id: totrans-121
  prefs: []
  type: TYPE_NORMAL
  zh: \[\epsilon_m = 2^{-n}\]
- en: In programming languages these values are typically available as predefined
    constants. For example, in C, these constants are `FLT_EPSILON` and `DBL_EPSILON`
    and are defined in the `float.h` library. In Python you can access these values
    with the code snippet below.
  id: totrans-122
  prefs: []
  type: TYPE_NORMAL
  zh: 最小的规范化正数：
- en: '[PRE0]'
  id: totrans-123
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: '*Note:* There are many definitions of machine epsilon that are used in various
    resources, such as the smallest number such that \(\text{fl}(1 + \epsilon_m) \ne
    1\). These other definitions may give slightly different values from the definition
    above depending on the rounding mode (next topic). In this course, we will always
    use the values from the "gap" definition above.'
  id: totrans-124
  prefs: []
  type: TYPE_NORMAL
  zh: '*注意:* 在各种资源中，机器精度的定义有很多，例如，最小的数，使得 \(\text{fl}(1 + \epsilon_m) \ne 1\)。这些其他定义可能根据舍入模式（下一个主题）的不同而给出与上述定义略有不同的值。在本课程中，我们将始终使用上述“间隙”定义中的值。'
- en: Range of Integer Numbers
  id: totrans-125
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: \[\pm 1.b_1b_2 \times 2^m\ for \ m \in [-4,4]\ and\ b_i \in \{0, 1\}\] \[(1.00)_2
    \times 2^0 = 1 \hspace{1.8cm} (1.01)_2 \times 2^0 = 1.25\] \[\epsilon_m = (0.01)_2
    \times 2^0 = 0.25\]
- en: What is the range of integer numbers that can be represented exactly in this
    representation?
  id: totrans-126
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以看到，在这个浮点系统中，我们可以表示从 \((1)_{10}\) 到 \((8)_{10}\) 的每一个整数。然而，为了表示 \((9)_{10}\)
    或 \((1001)_{2}\)，我们需要在分数部分中超过两个位。这种精度限制导致整数范围以上的整数出现跳跃。
- en: \[\pm 1.b_1b_2 \times 2^m\ for \ m \in [-4,4]\ and\ b_i \in \{0, 1\}\] \[\begin{eqnarray}
    (1)_2 &=& 1.00 \times 2^0 &=& 1_{10} \\ (10)_2 &=& 1.00 \times 2^1 &=& 2_{10}
    \\ (11)_2 &=& 1.10 \times 2^1 &=& 3_{10} \\ (100)_2 &=& 1.00 \times 2^2 &=& 4_{10}
    \\ (101)_2 &=& 1.01 \times 2^2 &=& 5_{10} \\ (110)_2 &=& 1.10 \times 2^2 &=& 6_{10}
    \\ (111)_2 &=& 1.11 \times 2^2 &=& 7_{10} \\ (1000)_2 &=& 1.00 \times 2^3 &=&
    8_{10} \\ (1001)_2 &=& \_\_\_\_?\_\_\_\_ &=& 9_{10} \\ (1010)_2 &=& 1.01 \times
    2^3 &=& 10_{10} \\ \end{eqnarray}\]
  id: totrans-127
  prefs: []
  type: TYPE_NORMAL
  zh: \[\pm 1.b_1b_2 \times 2^m\ for \ m \in [-4,4]\ and\ b_i \in \{0, 1\}\] \[\begin{eqnarray}
    (1)_2 &=& 1.00 \times 2^0 &=& 1_{10} \\ (10)_2 &=& 1.00 \times 2^1 &=& 2_{10}
    \\ (11)_2 &=& 1.10 \times 2^1 &=& 3_{10} \\ (100)_2 &=& 1.00 \times 2^2 &=& 4_{10}
    \\ (101)_2 &=& 1.01 \times 2^2 &=& 5_{10} \\ (110)_2 &=& 1.10 \times 2^2 &=& 6_{10}
    \\ (111)_2 &=& 1.11 \times 2^2 &=& 7_{10} \\ (1000)_2 &=& 1.00 \times 2^3 &=&
    8_{10} \\ (1001)_2 &=& \_\_\_\_?\_\_\_\_ &=& 9_{10} \\ (1010)_2 &=& 1.01 \times
    2^3 &=& 10_{10} \\ \end{eqnarray}\]
- en: We see that we can represent every integer from \((1)_{10}\) to \((8)_{10}\)
    in this floating point system. However, in order to represent \((9)_{10}\) or
    \((1001)_{2}\), we would need more than two bits in the fractional part. This
    limit in precision causes skips in integers above an integer range.
  id: totrans-128
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \begin{equation} (1.11)_2 \times 2^4 = 28.0 \end{equation} \]
- en: Notice the upper bound of this range assumes the form \(1.00 \times 2^3\), where
    \(3\) represents the precision of the floating point system. Therefore, this upper
    bound is given by \(2^p\).
  id: totrans-129
  prefs: []
  type: TYPE_NORMAL
  zh: '***机器精度*** (\(\epsilon_m\)) 被定义为 1 和下一个最大的浮点数之间的距离（间隙）。注意这个范围的上线假设为 \(1.00
    \times 2^3\) 的形式，其中 3 代表浮点系统的精度。因此，这个上限由 \(2^p\) 给出。'
- en: IEEE-754 Single Precision
  id: totrans-130
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: IEEE-754 单精度
- en: '![Single Precision](../Images/86b1d68046a956c55c7981c1cc0b8eeb.png) ^(Image
    source: [Fresheneesz at the English Wikipedia project](https://commons.wikimedia.org/wiki/File:Float_example.svg).)'
  id: totrans-131
  prefs: []
  type: TYPE_IMG
  zh: '![单精度](../Images/86b1d68046a956c55c7981c1cc0b8eeb.png) ^(图片来源：[Fresheneesz
    在英语维基百科项目](https://commons.wikimedia.org/wiki/File:Float_example.svg).)'
- en: \(x = (-1)^s 1.f \times 2^m\)
  id: totrans-132
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: \(x = (-1)^s 1.f \times 2^m\)
- en: '1-bit sign, s = 0: positive sign, s = 1: negative sign'
  id: totrans-133
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 1-bit 符号，s = 0：正号，s = 1：负号
- en: 8-bit exponent \(c\), where \(c = m + 127\), we need to reserve exponent number
    for special cases \( c = (11111111)_2 = 255, c = (00000000)_2 = 0\), therefore
    \(0 < c < 255\)
  id: totrans-134
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 8-bit 指数 \(c\)，其中 \(c = m + 127\)，我们需要为特殊情况保留指数数 \( c = (11111111)_2 = 255,
    c = (00000000)_2 = 0\)，因此 \(0 < c < 255\)
- en: 23-bit fractional part \(f\)
  id: totrans-135
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 23-bit 小数部分 \(f\)
- en: 'Machine epsilon:'
  id: totrans-136
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 计算机epsilon：
- en: 'For IEEE-754 **single precision**, \(\epsilon_m = 2^{-23}\), as shown by:'
  id: totrans-137
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 对于 IEEE-754 **单精度**，\(\epsilon_m = 2^{-23}\)，如下所示：
- en: \[\epsilon_m = 1.\underbrace{000000...000}_{\text{22 bits}}{\bf 1} - 1.\underbrace{000000...000}_{\text{22
    bits}}{\bf 0} = 2^{-23}\]
  id: totrans-138
  prefs:
  - PREF_IND
  - PREF_IND
  type: TYPE_NORMAL
  zh: \[\epsilon_m = 1.\underbrace{000000...000}_{\text{22 bits}}{\bf 1} - 1.\underbrace{000000...000}_{\text{22
    bits}}{\bf 0} = 2^{-23}\]
- en: 'Smallest positive normalized FP number: \(UFL = 2^L = 2^{-126} \approx 1.2
    \times 10^{-38}\)'
  id: totrans-139
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 最小的正规范化浮点数：\(UFL = 2^L = 2^{-126} \approx 1.2 \times 10^{-38}\)
- en: 'Largest positive normalized FP number: \(OFL = 2^{U+1}(1 - 2^{-p}) = 2^{128}(1
    - 2^{-24}) \approx 3.4 \times 10^{38}\)'
  id: totrans-140
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 最大的正规范化浮点数：\(OFL = 2^{U+1}(1 - 2^{-p}) = 2^{128}(1 - 2^{-24}) \approx 3.4 \times
    10^{38}\)
- en: The exponent is shifted by 127 to avoid storing a negative sign. Instead of
    storing \(m\), we store \(c = m + 127\). Thus, the largest possible exponent is
    127, and the smallest possible exponent is -126.
  id: totrans-141
  prefs: []
  type: TYPE_NORMAL
  zh: 指数被移位127以避免存储负号。我们不是存储 \(m\)，而是存储 \(c = m + 127\)。因此，可能的最大指数是127，可能的最小指数是-126。
- en: 'Example:'
  id: totrans-142
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例：
- en: Convert the binary number \((100101.101)_2\) to the normalized FP representation
  id: totrans-143
  prefs: []
  type: TYPE_NORMAL
  zh: 将二进制数 \((100101.101)_2\) 转换为规范化浮点数表示
- en: \[1.f \times 2^m\] <details><summary>**Answer**</summary>
  id: totrans-144
  prefs: []
  type: TYPE_NORMAL
  zh: \[1.f \times 2^m\] <details><summary>**答案**</summary>
- en: \((100101.101)_2 = (1.00101101)_2 \times 2^5\) \(s = 0,\quad f = 00101101…00,\quad
    m = 5\) \(c=m + 127 = 132 = (10000100)_2\)
  id: totrans-145
  prefs: []
  type: TYPE_NORMAL
  zh: \((100101.101)_2 = (1.00101101)_2 \times 2^5\) \(s = 0,\quad f = 00101101…00,\quad
    m = 5\) \(c=m + 127 = 132 = (10000100)_2\)
- en: 'Normalized FP representations: \(0 \; 10000100 \; 00101101000000000000000\)</details>'
  id: totrans-146
  prefs: []
  type: TYPE_NORMAL
  zh: 规范化浮点数表示：\(0 \; 10000100 \; 00101101000000000000000\)</details>
- en: For additional reading about [IEEE Floating Point Numbers](http://steve.hollasch.net/cgindex/coding/ieeefloat.html)
  id: totrans-147
  prefs: []
  type: TYPE_NORMAL
  zh: 关于 [IEEE 浮点数](http://steve.hollasch.net/cgindex/coding/ieeefloat.html) 的更多信息
- en: IEEE-754 Double Precision
  id: totrans-148
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: IEEE-754 双精度
- en: '![Double Precision](../Images/dc27ccd2240385961659cceb62e82d18.png) ^(Image
    source: [Codekaizen](https://commons.wikimedia.org/wiki/File:IEEE_754_Double_Floating_Point_Format.svg).)'
  id: totrans-149
  prefs: []
  type: TYPE_IMG
  zh: '![双精度](../Images/dc27ccd2240385961659cceb62e82d18.png) ^(图片来源：[Codekaizen](https://commons.wikimedia.org/wiki/File:IEEE_754_Double_Floating_Point_Format.svg).)'
- en: \(x = (-1)^s 1.f \times 2^m\)
  id: totrans-150
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: \(x = (-1)^s 1.f \times 2^m\)
- en: '1-bit sign, s = 0: positive sign, s = 1: negative sign'
  id: totrans-151
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 1-bit 符号，s = 0：正号，s = 1：负号
- en: 11-bit exponent \(c\), where \( c = m + 1023\), we need to reserve exponent
    number for special cases \( c = (11111111111)_2 = 2047, c = (00000000000)_2 =
    0\), therefore \(0 < c < 2047\)
  id: totrans-152
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 11-bit 指数 \(c\)，其中 \( c = m + 1023\)，我们需要为特殊情况保留指数数 \( c = (11111111111)_2 =
    2047, c = (00000000000)_2 = 0\)，因此 \(0 < c < 2047\)
- en: 52-bit fractional part \(f\)
  id: totrans-153
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 52-bit 小数部分 \(f\)
- en: 'Machine epsilon:'
  id: totrans-154
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 计算机epsilon：
- en: For IEEE-754 **double precision**, \(\epsilon_m = 2^{-52}\), as shown by:\[\epsilon_m
    = 1.\underbrace{000000...000}_{\text{51 bits}}{\bf 1} - 1.\underbrace{000000...000}_{\text{51
    bits}}{\bf 0} = 2^{-52}\]
  id: totrans-155
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 对于 IEEE-754 **双精度**，\(\epsilon_m = 2^{-52}\)，如下所示：\[\epsilon_m = 1.\underbrace{000000...000}_{\text{51
    bits}}{\bf 1} - 1.\underbrace{000000...000}_{\text{51 bits}}{\bf 0} = 2^{-52}\]
- en: 'Smallest positive normalized FP number: \(UFL = 2^L = 2^{-1022} \approx 2.2
    \times 10^{-308}\)'
  id: totrans-156
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 最小的正规范化浮点数：\(UFL = 2^L = 2^{-1022} \approx 2.2 \times 10^{-308}\)
- en: 'Largest positive normalized FP number: \(OFL = 2^{U+1}(1 - 2^{-p}) = 2^{1024}(1
    - 2^{-53}) \approx 1.8 \times 10^{308}\)'
  id: totrans-157
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 最大的正规范化浮点数：\(OFL = 2^{U+1}(1 - 2^{-p}) = 2^{1024}(1 - 2^{-53}) \approx 1.8 \times
    10^{308}\)
- en: The exponent is shifted by 1023 to avoid storing a negative sign. Instead of
    storing \(m\), we store \(c = m + 1023\). Thus, the largest possible exponent
    is 1023, and the smallest possible exponent is -1022.
  id: totrans-158
  prefs: []
  type: TYPE_NORMAL
  zh: 指数被移位1023以避免存储负号。我们不是存储 \(m\)，而是存储 \(c = m + 1023\)。因此，可能的最大指数是1023，可能的最小指数是-1022。
- en: Special Cases in IEEE-754
  id: totrans-159
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: IEEE-754 中的特殊情况
- en: There are several corner cases that arise in floating point representations.
  id: totrans-160
  prefs: []
  type: TYPE_NORMAL
  zh: 在浮点数表示中会出现几个边缘情况。
- en: Zero
  id: totrans-161
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 零
- en: In our definition of floating point numbers above, we said that there is always
    a leading 1 assumed. This is true for most floating point numbers. A notable exception
    is zero. In order to store zero as a floating point number, we store all zeros
    for the exponent and all zeros for the fractional part. Note that there can be
    both +0 and -0 depending on the sign bit.
  id: totrans-162
  prefs: []
  type: TYPE_NORMAL
  zh: 在我们上面关于浮点数的定义中，我们说总是假设有一个前导1。这对于大多数浮点数来说是正确的。一个值得注意的例外是零。为了将零存储为浮点数，我们存储指数位和分数位全为0。请注意，根据符号位，可以有+0和-0。
- en: Infinity
  id: totrans-163
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 无穷大
- en: If a floating point calculation results in a number that is beyond the range
    of possible numbers in floating point, it is considered to be infinity. We store
    infinity with all ones in the exponent and all zeros in the fractional. \(+\infty\)
    and \(-\infty\) are distinguished by the sign bit.
  id: totrans-164
  prefs: []
  type: TYPE_NORMAL
  zh: 如果浮点计算的结果超出了浮点数可能表示的范围，则该数被认为是无穷大。我们使用指数位全为1和分数位全为0来存储无穷大。\(+\infty\) 和 \(-\infty\)
    通过符号位来区分。
- en: NaN
  id: totrans-165
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: NaN
- en: Arithmetic operations that result in something that is not a number are represented
    in floating point with all ones in the exponent and a non-zero fractional part.
  id: totrans-166
  prefs: []
  type: TYPE_NORMAL
  zh: 导致非数值结果的操作在浮点数中以指数位全为1和非零分数位表示。
- en: Floating Point Number Line
  id: totrans-167
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 浮点数数轴
- en: '![Number Line](../Images/fb2e7757d83efcf97a18a49f409a1fba.png) ^(Image source:
    [Unavoidable Errors in Computing](https://www.physics.udel.edu/~bnikolic/teaching/phys660/PDF/unavoidable_errors.pdf).)'
  id: totrans-168
  prefs: []
  type: TYPE_IMG
  zh: '![数轴](../Images/fb2e7757d83efcf97a18a49f409a1fba.png) ^（图片来源：[计算中的不可避免错误](https://www.physics.udel.edu/~bnikolic/teaching/phys660/PDF/unavoidable_errors.pdf)。)'
- en: The above image shows the number line for the IEEE-754 floating point system.
  id: totrans-169
  prefs: []
  type: TYPE_NORMAL
  zh: 上图显示了 IEEE-754 浮点数系统的数轴。
- en: Subnormal Numbers
  id: totrans-170
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 子规格化数
- en: As mentioned above, a ***normal number*** is defined as a floating point number
    with a 1 at the start of the significand, and the smallest normal number in double
    precision is \(1.000… \times 2^{-1022}\). The smallest representable *normal*
    number is called the ***underflow level***, or ***UFL***.
  id: totrans-171
  prefs: []
  type: TYPE_NORMAL
  zh: 如上所述，一个***正常数***被定义为尾数以1开头的浮点数，双精度中最小的正常数是 \(1.000… \times 2^{-1022}\)。可以表示的最小*正常*数被称为***下溢水平***，或***UFL***。
- en: However, we can go even smaller than this by removing the restriction that the
    first number of the significand must be a 1\. These numbers are known as ***subnormal***,
    and are stored with all zeros in the exponent. Technically, zero is also a subnormal
    number.
  id: totrans-172
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，我们可以通过移除尾数必须以1开头的限制来进一步减小数值。这些数被称为***子规格化数***，并且以指数位全为0来存储。技术上，零也是一个子规格化数。
- en: It is important to note that subnormal numbers do not have as many significant
    digits as normal numbers.
  id: totrans-173
  prefs: []
  type: TYPE_NORMAL
  zh: 重要的是要注意，子规格化数没有正常数那么多有效数字。
- en: '**IEEE-754 Single precision (32 bits):**'
  id: totrans-174
  prefs: []
  type: TYPE_NORMAL
  zh: '**IEEE-754 单精度（32位）：**'
- en: \( c = (00000000)_2 = 0 \)
  id: totrans-175
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: \( c = (00000000)_2 = 0 \)
- en: Exponent set to \(m\) = -126
  id: totrans-176
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 指数设置为 \(m\) = -126
- en: 'Smallest positive subnormal FP number: \(2^{-23} \times 2^{-126} \approx 1.4
    \times 10^{-45}\)'
  id: totrans-177
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 最小的正子规格化浮点数：\(2^{-23} \times 2^{-126} \approx 1.4 \times 10^{-45}\)
- en: '**IEEE-754 Double precision (64 bits):**'
  id: totrans-178
  prefs: []
  type: TYPE_NORMAL
  zh: '**IEEE-754 双精度（64位）：**'
- en: \( c = (00000000000)_2 = 0 \)
  id: totrans-179
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: \( c = (00000000000)_2 = 0 \)
- en: Exponent set to \(m\) = -1022
  id: totrans-180
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 指数设置为 \(m\) = -1022
- en: 'Smallest positive subnormal FP number: \(2^{-52} \times 2^{-1022} \approx 4.9
    \times 10^{-324}\)'
  id: totrans-181
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 最小的正子规格化浮点数：\(2^{-52} \times 2^{-1022} \approx 4.9 \times 10^{-324}\)
- en: The use of subnormal numbers allows for more gradual underflow to zero (however
    subnormal numbers don't have as many accurate bits as normalized numbers).
  id: totrans-182
  prefs: []
  type: TYPE_NORMAL
  zh: 使用非规格化数允许更渐进地向零下溢（然而，非规格化数没有规格化数那么多精确位）。
- en: 'Example:'
  id: totrans-183
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例：
- en: Suppose you are given a (binary) floating point system of the form
  id: totrans-184
  prefs: []
  type: TYPE_NORMAL
  zh: 假设你被给定一个形式为（二进制）浮点数系统
- en: \[(-1)^s(1.b_1b_2)_2 \times 2^E\]
  id: totrans-185
  prefs: []
  type: TYPE_NORMAL
  zh: \[(-1)^s(1.b_1b_2)_2 \times 2^E\]
- en: that has an exponent range from -2 to 5.
  id: totrans-186
  prefs: []
  type: TYPE_NORMAL
  zh: 其指数范围从 -2 到 5。
- en: 'We use this floating point system to represent the following subnormal number:'
  id: totrans-187
  prefs: []
  type: TYPE_NORMAL
  zh: 我们使用这个浮点数系统来表示以下子规格化数：
- en: \[s = 1\] \[b_1b_2 = (11)_2\]
  id: totrans-188
  prefs: []
  type: TYPE_NORMAL
  zh: \[s = 1\] \[b_1b_2 = (11)_2\]
- en: Convert this subnormal number into a decimal number.
  id: totrans-189
  prefs: []
  type: TYPE_NORMAL
  zh: 将这个子规格化数转换为十进制数。
- en: <details><summary>**Answer**</summary>
  id: totrans-190
  prefs: []
  type: TYPE_NORMAL
  zh: <details><summary>**答案**</summary>
- en: In this floating point system, subnormal numbers will be represented as
  id: totrans-191
  prefs: []
  type: TYPE_NORMAL
  zh: 在这个浮点数系统中，子规格化数将表示为
- en: \[x = (-1)^s(0.f)\times2^L.\]
  id: totrans-192
  prefs: []
  type: TYPE_NORMAL
  zh: \[x = (-1)^s(0.f)\times2^L.\]
- en: We convert the fractional part \((11)_2\) into a decimal number and use the
    lower bound of the exponent range \(L = -2\).
  id: totrans-193
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将分数部分 \((11)_2\) 转换为十进制数，并使用指数范围的下限 \(L = -2\)。
- en: \[\begin{eqnarray} x &=& (-1)^1 \times (0.11)_2 \times 2^{-2} \\ &=& (-1) \times
    (0.11)_2 \times 2^{-2} \\ &=& (-1) \times (0.75)_{10} \times 2^{-2} \\ &=& -0.1875
    \end{eqnarray}\]</details>
  id: totrans-194
  prefs: []
  type: TYPE_NORMAL
  zh: \[\begin{eqnarray} x &=& (-1)^1 \times (0.11)_2 \times 2^{-2} \\ &=& (-1) \times
    (0.11)_2 \times 2^{-2} \\ &=& (-1) \times (0.75)_{10} \times 2^{-2} \\ &=& -0.1875
    \end{eqnarray}\]</details>
- en: Review Questions
  id: totrans-195
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 复习问题
- en: Convert a decimal number to binary.
  id: totrans-196
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 将十进制数转换为二进制。
- en: Convert a binary number to decimal.
  id: totrans-197
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 将二进制数转换为十进制。
- en: What are the differences between floating point and fixed point representation?
  id: totrans-198
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 浮点数和固定点表示有什么区别？
- en: Given a real number, how would you store it as a machine number?
  id: totrans-199
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 给定一个实数，你将如何将其存储为机器数？
- en: Given a real number, what is the rounding error involved in storing it as a
    machine number? What is the relative error?
  id: totrans-200
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 给定一个实数，将其存储为机器数时涉及到的舍入误差是什么？相对误差是什么？
- en: 'Explain the different parts of a floating-point number: sign, significand,
    and exponent.'
  id: totrans-201
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 解释浮点数的不同部分：符号、尾数和指数。
- en: How is the exponent of a machine number actually stored?
  id: totrans-202
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 机器数的指数实际上是如何存储的？
- en: What is machine epsilon?
  id: totrans-203
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 什么是机器精度？
- en: What is underflow (UFL)?
  id: totrans-204
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 什么是下溢（UFL）？
- en: What is overflow?
  id: totrans-205
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 什么是溢出？
- en: Why is underflow sometimes not a problem?
  id: totrans-206
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 为什么下溢有时不是问题？
- en: Given a toy floating-point system, determine machine epsilon and UFL for that
    system.
  id: totrans-207
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 给定一个玩具浮点系统，确定该系统的机器精度和UFL。
- en: How do you store zero as a machine number?
  id: totrans-208
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 如何将零存储为机器数？
- en: What are subnormal numbers?
  id: totrans-209
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 什么是亚正常数？
- en: How are subnormal numbers represented in a machine?
  id: totrans-210
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 机器中如何表示亚正常数？
- en: Why are subnormal numbers sometimes helpful?
  id: totrans-211
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 为什么亚正常数有时有帮助？
- en: What are some drawbacks to using subnormal numbers?
  id: totrans-212
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 使用亚正常数有哪些缺点？
