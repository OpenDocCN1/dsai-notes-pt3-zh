    to download the PDF.</details>
  prefs: []
  type: TYPE_NORMAL
- en: Learning Objectives
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Represent numbers in floating point systems
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Evaluate the range, precision, and accuracy of different representations
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Define Machine Epsilon
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
