- en: Number Systems and Bases
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: There are a variety of number systems in which a number can be represented.
    In the common base 10 (decimal) system each digit takes on one of 10 values, from
    0 to 9\. In base 2 (binary), each digit takes on one of 2 values, 0 or 1.
  prefs: []
  type: TYPE_NORMAL
- en: 'For a given \(\beta\), in the \(\beta\)-system we have:'
  prefs: []
  type: TYPE_NORMAL
- en: \[(a_n \ldots a_2 a_1 a_0 . b_1 b_2 b_3 b_4 \dots)_{\beta} = \sum_{k=0}^{n}
    a_k \beta^k + \sum_{k=1}^\infty b_k \beta^{-k}.\]
  prefs: []
  type: TYPE_NORMAL
- en: 'Some common bases used for numbering systems are:'
  prefs: []
  type: TYPE_NORMAL
- en: 'decimal: \(\beta=10\)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'binary: \(\beta=2\)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'octal: \(\beta=8\)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: hexadecimal \(\beta=16\)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Example:'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Decimal base: \((426.97)_{10}\)'
  prefs: []
  type: TYPE_NORMAL
- en: <details><summary>**Answer**</summary>
  prefs: []
  type: TYPE_NORMAL
- en: \(\begin{equation}(426.97)_{10} = 4 \times 10^2 + 2 \times 10^1 + 6 \times 10^0
    + 9 \times 10^{-1} + 7 \times 10^{-2} \end{equation}\)</details>
  prefs: []
  type: TYPE_NORMAL
- en: 'Binary base: \((1011.001)_{2}\)'
  prefs: []
  type: TYPE_NORMAL
- en: <details><summary>**Answer**</summary>
  prefs: []
  type: TYPE_NORMAL
- en: \((1011.001)_{2} = 1 \times 2^3 + 0 \times 2^2 + 1 \times 2^1 + 1 \times 2^0
    + 0 \times 2^{-1} + 0 \times 2^{-2} + 1 \times 2^{-3} = (11.125)_{10}\)</details>
  prefs: []
  type: TYPE_NORMAL
- en: Converting Integers Between Decimal and Binary
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Modern computers use transistors to store data. These transistors can either
    be ON (1) or OFF (0). In order to store integers in a computer, we must first
    convert them to binary. For example, the binary representation of 23 is \((10111)_2\).
  prefs: []
  type: TYPE_NORMAL
- en: 'Converting an integer from binary representation (base 2) to decimal representation
    (base 10) is easy. Simply multiply each digit by increasing powers of 2 like so:'
  prefs: []
  type: TYPE_NORMAL
- en: \[(10111)_2 = 1 \cdot 2^4 + 0 \cdot 2^3 + 1 \cdot 2^2 + 1 \cdot 2^1 + 1 \cdot
    2^0 = 23\]
  prefs: []
  type: TYPE_NORMAL
- en: 'Converting an integer from decimal to binary is a similar process, except instead
    of multiplying by 2 we will be dividing by 2 and keeping track of the remainder:'
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{align} 23 // 2 &= 11\ \mathrm{rem}\ 1 \\ 11 // 2 &= 5\ \mathrm{rem}\
    1 \\ 5 // 2 &= 2\ \mathrm{rem}\ 1 \\ 2 // 2 &= 1\ \mathrm{rem}\ 0 \\ 1 // 2 &=
    0\ \mathrm{rem}\ 1 \\ \end{align}\]
  prefs: []
  type: TYPE_NORMAL
- en: Thus, \((23)_{10}\) becomes \((10111)_2\) in binary.
  prefs: []
  type: TYPE_NORMAL
- en: 'You may find these additional resources helpful for review: [Decimal to Binary
    1](https://www.wikihow.com/Convert-from-Decimal-to-Binary) and [Decimal to Binary
    2](http://interactivepython.org/courselib/static/pythonds/BasicDS/ConvertingDecimalNumberstoBinaryNumbers.html)'
  prefs: []
  type: TYPE_NORMAL
- en: Converting Fractions Between Decimal and Binary
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Real numbers add an extra level of complexity. Not only do they have a leading
    integer, they also have a fractional part. For now, we will represent a decimal
    number like 23.375 as \((10111.011)_2\). Of course, the actual machine representation
    depends on whether we are using a fixed point or a floating point representation,
    but we will get to that in later sections.
  prefs: []
  type: TYPE_NORMAL
- en: 'Converting a number with a fractional portion from binary to decimal is similar
    to converting to an integer, except that we continue into negative powers of 2
    for the fractional part:'
  prefs: []
  type: TYPE_NORMAL
- en: \[(10111.011)_2 = 1 \cdot 2^4 + 0 \cdot 2^3 + 1 \cdot 2^2 + 1 \cdot 2^1 + 1
    \cdot 2^0 + 0 \cdot 2^{-1} + 1 \cdot 2^{-2} + 1 \cdot 2^{-3} = 23.375\]
  prefs: []
  type: TYPE_NORMAL
- en: 'To convert a decimal fraction to binary, first convert the integer part to
    binary as previously discussed. Then, take the fractional part (ignoring the integer
    part) and multiply it by 2\. The resulting integer part will be the binary digit.
    Throw away the integer part and continue the process of multiplying by 2 until
    the fractional part becomes 0\. For example:'
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{align} 23 &= (10111)_2 \\ 2 \cdot .375 &= 0.75 \\ 2 \cdot .75 &= 1.5
    \\ 2 \cdot .5 &= 1.0 \\ \end{align}\]
  prefs: []
  type: TYPE_NORMAL
- en: By combining the integer and fractional parts, we find that \(23.375 = (10111.011)_2\).
  prefs: []
  type: TYPE_NORMAL
- en: 'Not all fractions can be represented in binary using a finite number of digits.
    For example, if you try the above technique on a number like 0.1, you will find
    that the remaining fraction begins to repeat:'
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{align} 2 \cdot .1 &= 0.2 \\ 2 \cdot .2 &= 0.4 \\ 2 \cdot .4 &= 0.8
    \\ 2 \cdot .8 &= 1.6 \\ 2 \cdot .6 &= 1.2 \\ 2 \cdot .2 &= 0.4 \\ 2 \cdot .4 &=
    0.8 \\ 2 \cdot .8 &= 1.6 \\ 2 \cdot .6 &= 1.2 \\ \end{align}\]
  prefs: []
  type: TYPE_NORMAL
- en: As you can see, the decimal 0.1 will be represented in binary as the infinitely
    repeating series \((0.00011001100110011…)_2\). The exact number of digits that
    get stored in a floating point number depends on whether we are using single precision
    or double precision.
  prefs: []
  type: TYPE_NORMAL
- en: (Unsigned) Fixed-Point Representation
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: In fixed-point representation, numbers are stored with a fixed number of bits
    for the integer part and a fixed number of bits for the fractional part.
  prefs: []
  type: TYPE_NORMAL
- en: Suppose we have 64 bits to store a real number, where 32 bits store the integer
    part and 32 bits store the fractional part.
  prefs: []
  type: TYPE_NORMAL
- en: \[(a_{31}...a_2a_1a_0.b_1b_2b_3...b_{32}) = \sum_{k=0}^{31} a_k 2^k + \sum_{k=1}^{32}
    b_k 2^{-k}\] \[\begin{eqnarray} = &a_{31}& \times 2^{31}\ + ... + a_1 \times 2^1
    + a_0 \times 2^0 \\ + &b_1& \times 2^{-1} + b_2 \times 2^{-2}+ ... +\ b_{32} \times
    2^{-32} \end{eqnarray}\]
  prefs: []
  type: TYPE_NORMAL
- en: '**Smallest Number**'
  prefs: []
  type: TYPE_NORMAL
- en: We get the smallest representable number when all of the values of \(a_i\) and
    \(b_i\) are \(0\), except for \(b_{32}\).
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{eqnarray} &a_i =& 0 \ \forall i,\ b_1,\ b_2, ...,\ b_{31} = 0,\ and
    \ b_{32} = 1 \\ &\implies& 2^{-32} \approx 10^{-9} \end{eqnarray}\]
  prefs: []
  type: TYPE_NORMAL
- en: '**Largest Number**'
  prefs: []
  type: TYPE_NORMAL
- en: We get the largest representable number when all of the values of \(a_i\) and
    \(b_i\) are \(1\).
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{eqnarray} &a_i =& 1 \ \forall i \ and \ b_i = 1 \ \forall i \\ &\implies&
    2^{31}\ + ... + 2^1 + 2^0 + 2^{-1} + 2^{-2}+ ... +\ 2^{-32} \approx 10^9 \end{eqnarray}\]
  prefs: []
  type: TYPE_NORMAL
- en: Binary Point Placement
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: We consider the range and precision when evaluating a representation.
  prefs: []
  type: TYPE_NORMAL
- en: '**Range:** Difference between the largest and smallest numbers possible.'
  prefs: []
  type: TYPE_NORMAL
- en: '**Precision:** Smallest possible difference between any two numbers.'
  prefs: []
  type: TYPE_NORMAL
- en: Consider an 8 bit system where 6 bits store the integer part and 2 bits store
    the fractional part. What are its range and precision?
  prefs: []
  type: TYPE_NORMAL
- en: <details><summary>**Answer**</summary>
  prefs: []
  type: TYPE_NORMAL
- en: '**Smallest Numbers**'
  prefs: []
  type: TYPE_NORMAL
- en: \(000000.01 = 0.25\)
  prefs: []
  type: TYPE_NORMAL
- en: \(000000.10 = 0.5\)
  prefs: []
  type: TYPE_NORMAL
- en: '**Largest Numbers**'
  prefs: []
  type: TYPE_NORMAL
- en: \(111111.10 = 63.5\)
  prefs: []
  type: TYPE_NORMAL
- en: \(111111.11 = 63.75\)
  prefs: []
  type: TYPE_NORMAL
- en: '**Range**'
  prefs: []
  type: TYPE_NORMAL
- en: \(63.75 - 0.25 = 63.5\)
  prefs: []
  type: TYPE_NORMAL
- en: '**Precision**'
  prefs: []
  type: TYPE_NORMAL
- en: \(0.5 - 0.25 = 63.75 - 63.5 = 0.25\)</details>
  prefs: []
  type: TYPE_NORMAL
- en: How about for an 8 bit system where 2 bits store the integer part and 6 bits
    store the fractional part?
  prefs: []
  type: TYPE_NORMAL
- en: <details><summary>**Answer**</summary>
  prefs: []
  type: TYPE_NORMAL
- en: '**Smallest Numbers**'
  prefs: []
  type: TYPE_NORMAL
- en: \(00.000001 = 0.015625\)
  prefs: []
  type: TYPE_NORMAL
- en: \(00.000010 = 0.03125\)
  prefs: []
  type: TYPE_NORMAL
- en: '**Largest Numbers**'
  prefs: []
  type: TYPE_NORMAL
- en: \(11.111110 = 3.96875\)
  prefs: []
  type: TYPE_NORMAL
- en: \(11.111111 = 3.984375\)
  prefs: []
  type: TYPE_NORMAL
- en: '**Range**'
  prefs: []
  type: TYPE_NORMAL
- en: \(3.984375 - 0.015625 = 3.96875\)
  prefs: []
  type: TYPE_NORMAL
- en: '**Precision**'
  prefs: []
  type: TYPE_NORMAL
- en: \(0.03125 - 0.015625 = 3.984375 - 3.96875 = 0.015625\)</details>
  prefs: []
  type: TYPE_NORMAL
- en: We see that having more **integer** bits increases **range** and more bits for
    the **fractional** part increases **precision**. It can be hard to decide how
    much precision and range you need.
  prefs: []
  type: TYPE_NORMAL
- en: '**Fix: Let the binary point "float"**'
  prefs: []
  type: TYPE_NORMAL
- en: Floating Point Numbers
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: The floating point representation of a binary number is similar to scientific
    notation for decimals. Similar to how you can represent 23.375 as
  prefs: []
  type: TYPE_NORMAL
- en: \[2.3375 \cdot 10^1,\]
  prefs: []
  type: TYPE_NORMAL
- en: you can represent \((10111.011)_2\) as
  prefs: []
  type: TYPE_NORMAL
- en: \[1.0111011 \cdot 2^4.\]
  prefs: []
  type: TYPE_NORMAL
- en: A floating-point number can represent numbers of different orders of magnitude(very
    large and very small) with the same number of fixed digits.
  prefs: []
  type: TYPE_NORMAL
- en: More formally, we can define a floating point number \(x\) as
  prefs: []
  type: TYPE_NORMAL
- en: \[x = \pm q \cdot 2^m,\]
  prefs: []
  type: TYPE_NORMAL
- en: 'where:'
  prefs: []
  type: TYPE_NORMAL
- en: \(\pm\) is the sign
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: \(q\) is the significand
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: \(m\) is the exponent
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Aside from the special case of zero and subnormal numbers (discussed below),
    the significand is always in normalized form
  prefs: []
  type: TYPE_NORMAL
- en: \[q = 1.f,\]
  prefs: []
  type: TYPE_NORMAL
- en: 'where:'
  prefs: []
  type: TYPE_NORMAL
- en: \(f\) is the fractional part of the significand
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Whenever we store a normalized floating point number, the 1 is assumed. We don't
    store the entire significand, just the fractional part. This is called the "hidden
    bit representation", which gives one additional bit of precision.
  prefs: []
  type: TYPE_NORMAL
- en: Properties of Normalized Floating-Point Systems
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: A number \(x\) in a normalized binary floating-point system has the form
  prefs: []
  type: TYPE_NORMAL
- en: \[ \begin{equation} x = \pm 1.b_1b_2b_3...b_n \times 2^m = \pm 1.f \times 2^m
    \end{equation} \]
  prefs: []
  type: TYPE_NORMAL
- en: '**Digits:** \(b_i \in {0, 1}\)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Exponent range:** Integer \(m \in [L,U]\)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Precision:** \(p = n + 1\)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Smallest positive normalized floating-point number:** \( 2^L\)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Largest positive normalized floating-point number:** \( 2^{U+1}(1-2^{-p})\)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Example
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: \[\begin{equation} x = \pm 1.b_1b_2 \times 2^m \text{ for } m \in [-4,4] \text{
    and } b_i \in \{0,1\} \end{equation} \]<details><summary>**Answer**</summary>
  prefs: []
  type: TYPE_NORMAL
- en: 'Smallest normalized positive number:'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: \[ \begin{equation} (1.00)_2 \times 2^{-4} = 0.0625 \end{equation} \]
  prefs: []
  type: TYPE_NORMAL
- en: 'Largest normalized positive number:'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: \[ \begin{equation} (1.11)_2 \times 2^4 = 28.0 \end{equation} \]
  prefs: []
  type: TYPE_NORMAL
- en: Any number \(x\) closer to zero than 0.0625 would underflow to zero.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Any number \(x\) outside the range -28.0 and +28.0 would overflow to infinity.</details>
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Machine Epsilon
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***Machine epsilon*** (\(\epsilon_m\)) is defined as the distance (gap) between
    \(1\) and the next largest floating point number.'
  prefs: []
  type: TYPE_NORMAL
- en: \[\pm 1.b_1b_2 \times 2^m\ for \ m \in [-4,4]\ and\ b_i \in \{0, 1\}\] \[(1.00)_2
    \times 2^0 = 1 \hspace{1.8cm} (1.01)_2 \times 2^0 = 1.25\] \[\epsilon_m = (0.01)_2
    \times 2^0 = 0.25\]
  prefs: []
  type: TYPE_NORMAL
- en: 'Or for a general normalized floating point system \(1.f \times 2^m\), where
    \(f\) is represented with \(n\) bits, machine epsilon is defined as:'
  prefs: []
  type: TYPE_NORMAL
- en: \[\epsilon_m = 2^{-n}\]
  prefs: []
  type: TYPE_NORMAL
- en: In programming languages these values are typically available as predefined
    constants. For example, in C, these constants are `FLT_EPSILON` and `DBL_EPSILON`
    and are defined in the `float.h` library. In Python you can access these values
    with the code snippet below.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: '*Note:* There are many definitions of machine epsilon that are used in various
    resources, such as the smallest number such that \(\text{fl}(1 + \epsilon_m) \ne
    1\). These other definitions may give slightly different values from the definition
    above depending on the rounding mode (next topic). In this course, we will always
    use the values from the "gap" definition above.'
  prefs: []
  type: TYPE_NORMAL
- en: Range of Integer Numbers
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: What is the range of integer numbers that can be represented exactly in this
    representation?
  prefs: []
  type: TYPE_NORMAL
- en: \[\pm 1.b_1b_2 \times 2^m\ for \ m \in [-4,4]\ and\ b_i \in \{0, 1\}\] \[\begin{eqnarray}
    (1)_2 &=& 1.00 \times 2^0 &=& 1_{10} \\ (10)_2 &=& 1.00 \times 2^1 &=& 2_{10}
    \\ (11)_2 &=& 1.10 \times 2^1 &=& 3_{10} \\ (100)_2 &=& 1.00 \times 2^2 &=& 4_{10}
    \\ (101)_2 &=& 1.01 \times 2^2 &=& 5_{10} \\ (110)_2 &=& 1.10 \times 2^2 &=& 6_{10}
    \\ (111)_2 &=& 1.11 \times 2^2 &=& 7_{10} \\ (1000)_2 &=& 1.00 \times 2^3 &=&
    8_{10} \\ (1001)_2 &=& \_\_\_\_?\_\_\_\_ &=& 9_{10} \\ (1010)_2 &=& 1.01 \times
    2^3 &=& 10_{10} \\ \end{eqnarray}\]
  prefs: []
  type: TYPE_NORMAL
- en: We see that we can represent every integer from \((1)_{10}\) to \((8)_{10}\)
    in this floating point system. However, in order to represent \((9)_{10}\) or
    \((1001)_{2}\), we would need more than two bits in the fractional part. This
    limit in precision causes skips in integers above an integer range.
  prefs: []
  type: TYPE_NORMAL
- en: Notice the upper bound of this range assumes the form \(1.00 \times 2^3\), where
    \(3\) represents the precision of the floating point system. Therefore, this upper
    bound is given by \(2^p\).
  prefs: []
  type: TYPE_NORMAL
- en: IEEE-754 Single Precision
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '![Single Precision](../Images/86b1d68046a956c55c7981c1cc0b8eeb.png) ^(Image
    source: [Fresheneesz at the English Wikipedia project](https://commons.wikimedia.org/wiki/File:Float_example.svg).)'
  prefs: []
  type: TYPE_IMG
- en: \(x = (-1)^s 1.f \times 2^m\)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '1-bit sign, s = 0: positive sign, s = 1: negative sign'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 8-bit exponent \(c\), where \(c = m + 127\), we need to reserve exponent number
    for special cases \( c = (11111111)_2 = 255, c = (00000000)_2 = 0\), therefore
    \(0 < c < 255\)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 23-bit fractional part \(f\)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Machine epsilon:'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'For IEEE-754 **single precision**, \(\epsilon_m = 2^{-23}\), as shown by:'
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
- en: \[\epsilon_m = 1.\underbrace{000000...000}_{\text{22 bits}}{\bf 1} - 1.\underbrace{000000...000}_{\text{22
    bits}}{\bf 0} = 2^{-23}\]
  prefs:
  - PREF_IND
  - PREF_IND
  type: TYPE_NORMAL
- en: 'Smallest positive normalized FP number: \(UFL = 2^L = 2^{-126} \approx 1.2
    \times 10^{-38}\)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Largest positive normalized FP number: \(OFL = 2^{U+1}(1 - 2^{-p}) = 2^{128}(1
    - 2^{-24}) \approx 3.4 \times 10^{38}\)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: The exponent is shifted by 127 to avoid storing a negative sign. Instead of
    storing \(m\), we store \(c = m + 127\). Thus, the largest possible exponent is
    127, and the smallest possible exponent is -126.
  prefs: []
  type: TYPE_NORMAL
- en: 'Example:'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Convert the binary number \((100101.101)_2\) to the normalized FP representation
  prefs: []
  type: TYPE_NORMAL
- en: \[1.f \times 2^m\] <details><summary>**Answer**</summary>
  prefs: []
  type: TYPE_NORMAL
- en: \((100101.101)_2 = (1.00101101)_2 \times 2^5\) \(s = 0,\quad f = 00101101…00,\quad
    m = 5\) \(c=m + 127 = 132 = (10000100)_2\)
  prefs: []
  type: TYPE_NORMAL
- en: 'Normalized FP representations: \(0 \; 10000100 \; 00101101000000000000000\)</details>'
  prefs: []
  type: TYPE_NORMAL
- en: For additional reading about [IEEE Floating Point Numbers](http://steve.hollasch.net/cgindex/coding/ieeefloat.html)
  prefs: []
  type: TYPE_NORMAL
- en: IEEE-754 Double Precision
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '![Double Precision](../Images/dc27ccd2240385961659cceb62e82d18.png) ^(Image
    source: [Codekaizen](https://commons.wikimedia.org/wiki/File:IEEE_754_Double_Floating_Point_Format.svg).)'
  prefs: []
  type: TYPE_IMG
- en: \(x = (-1)^s 1.f \times 2^m\)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '1-bit sign, s = 0: positive sign, s = 1: negative sign'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 11-bit exponent \(c\), where \( c = m + 1023\), we need to reserve exponent
    number for special cases \( c = (11111111111)_2 = 2047, c = (00000000000)_2 =
    0\), therefore \(0 < c < 2047\)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 52-bit fractional part \(f\)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Machine epsilon:'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: For IEEE-754 **double precision**, \(\epsilon_m = 2^{-52}\), as shown by:\[\epsilon_m
    = 1.\underbrace{000000...000}_{\text{51 bits}}{\bf 1} - 1.\underbrace{000000...000}_{\text{51
    bits}}{\bf 0} = 2^{-52}\]
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Smallest positive normalized FP number: \(UFL = 2^L = 2^{-1022} \approx 2.2
    \times 10^{-308}\)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Largest positive normalized FP number: \(OFL = 2^{U+1}(1 - 2^{-p}) = 2^{1024}(1
    - 2^{-53}) \approx 1.8 \times 10^{308}\)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: The exponent is shifted by 1023 to avoid storing a negative sign. Instead of
    storing \(m\), we store \(c = m + 1023\). Thus, the largest possible exponent
    is 1023, and the smallest possible exponent is -1022.
  prefs: []
  type: TYPE_NORMAL
- en: Special Cases in IEEE-754
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: There are several corner cases that arise in floating point representations.
  prefs: []
  type: TYPE_NORMAL
- en: Zero
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: In our definition of floating point numbers above, we said that there is always
    a leading 1 assumed. This is true for most floating point numbers. A notable exception
    is zero. In order to store zero as a floating point number, we store all zeros
    for the exponent and all zeros for the fractional part. Note that there can be
    both +0 and -0 depending on the sign bit.
  prefs: []
  type: TYPE_NORMAL
- en: Infinity
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: If a floating point calculation results in a number that is beyond the range
    of possible numbers in floating point, it is considered to be infinity. We store
    infinity with all ones in the exponent and all zeros in the fractional. \(+\infty\)
    and \(-\infty\) are distinguished by the sign bit.
  prefs: []
  type: TYPE_NORMAL
- en: NaN
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Arithmetic operations that result in something that is not a number are represented
    in floating point with all ones in the exponent and a non-zero fractional part.
  prefs: []
  type: TYPE_NORMAL
- en: Floating Point Number Line
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '![Number Line](../Images/fb2e7757d83efcf97a18a49f409a1fba.png) ^(Image source:
    [Unavoidable Errors in Computing](https://www.physics.udel.edu/~bnikolic/teaching/phys660/PDF/unavoidable_errors.pdf).)'
  prefs: []
  type: TYPE_IMG
- en: The above image shows the number line for the IEEE-754 floating point system.
  prefs: []
  type: TYPE_NORMAL
- en: Subnormal Numbers
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: As mentioned above, a ***normal number*** is defined as a floating point number
    with a 1 at the start of the significand, and the smallest normal number in double
    precision is \(1.000… \times 2^{-1022}\). The smallest representable *normal*
    number is called the ***underflow level***, or ***UFL***.
  prefs: []
  type: TYPE_NORMAL
- en: However, we can go even smaller than this by removing the restriction that the
    first number of the significand must be a 1\. These numbers are known as ***subnormal***,
    and are stored with all zeros in the exponent. Technically, zero is also a subnormal
    number.
  prefs: []
  type: TYPE_NORMAL
- en: It is important to note that subnormal numbers do not have as many significant
    digits as normal numbers.
  prefs: []
  type: TYPE_NORMAL
- en: '**IEEE-754 Single precision (32 bits):**'
  prefs: []
  type: TYPE_NORMAL
- en: \( c = (00000000)_2 = 0 \)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Exponent set to \(m\) = -126
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Smallest positive subnormal FP number: \(2^{-23} \times 2^{-126} \approx 1.4
    \times 10^{-45}\)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**IEEE-754 Double precision (64 bits):**'
  prefs: []
  type: TYPE_NORMAL
- en: \( c = (00000000000)_2 = 0 \)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Exponent set to \(m\) = -1022
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Smallest positive subnormal FP number: \(2^{-52} \times 2^{-1022} \approx 4.9
    \times 10^{-324}\)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: The use of subnormal numbers allows for more gradual underflow to zero (however
    subnormal numbers don't have as many accurate bits as normalized numbers).
  prefs: []
  type: TYPE_NORMAL
- en: 'Example:'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Suppose you are given a (binary) floating point system of the form
  prefs: []
  type: TYPE_NORMAL
- en: \[(-1)^s(1.b_1b_2)_2 \times 2^E\]
  prefs: []
  type: TYPE_NORMAL
- en: that has an exponent range from -2 to 5.
  prefs: []
  type: TYPE_NORMAL
- en: 'We use this floating point system to represent the following subnormal number:'
  prefs: []
  type: TYPE_NORMAL
- en: \[s = 1\] \[b_1b_2 = (11)_2\]
  prefs: []
  type: TYPE_NORMAL
- en: Convert this subnormal number into a decimal number.
  prefs: []
  type: TYPE_NORMAL
- en: <details><summary>**Answer**</summary>
  prefs: []
  type: TYPE_NORMAL
- en: In this floating point system, subnormal numbers will be represented as
  prefs: []
  type: TYPE_NORMAL
- en: \[x = (-1)^s(0.f)\times2^L.\]
  prefs: []
  type: TYPE_NORMAL
- en: We convert the fractional part \((11)_2\) into a decimal number and use the
    lower bound of the exponent range \(L = -2\).
  prefs: []
  type: TYPE_NORMAL
- en: \[\begin{eqnarray} x &=& (-1)^1 \times (0.11)_2 \times 2^{-2} \\ &=& (-1) \times
    (0.11)_2 \times 2^{-2} \\ &=& (-1) \times (0.75)_{10} \times 2^{-2} \\ &=& -0.1875
    \end{eqnarray}\]</details>
  prefs: []
  type: TYPE_NORMAL
