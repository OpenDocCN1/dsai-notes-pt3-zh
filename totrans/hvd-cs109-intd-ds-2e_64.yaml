  type: TYPE_NORMAL
  zh: 机器学习
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/ml/intro-ml.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/ml/intro-ml.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/ml/intro-ml.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/ml/intro-ml.html)
- en: Machine learning has achieved remarkable successes in a variety of applications.
    These range from the postal service’s use of machine learning for reading handwritten
    zip codes to the development of voice recognition systems like Apple’s Siri. Other
    significant advances include spam and malware detection, housing price prediction
    algorithms, and the ongoing development of autonomous vehicles.
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 机器学习在各种应用中取得了显著的成功。这些应用范围从邮局使用机器学习读取手写邮编到开发像苹果的Siri这样的语音识别系统。其他重要的进步包括垃圾邮件和恶意软件检测、房价预测算法，以及自动驾驶汽车的持续发展。
- en: The field of *Artificial Intelligence (AI)* has been evolving for several decades.
    Traditional AI systems, including some chess-playing machines, often relied on
    decision-making based on preset rules and knowledge representation. However, with
    the advent of data availability, machine learning has gained prominence. It focuses
    on decision-making through algorithms trained with data. In recent years, the
    terms AI and Machine Learning have been used interchangeably in many contexts,
    though they have distinct meanings. AI broadly refers to systems or applications
    that exhibit intelligent behavior, encompassing both rule-based approaches and
    machine learning. Machine Learning specifically involves learning from data to
    make decisions or predictions.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: '*人工智能（AI）* 领域已经发展了几十年。传统的AI系统，包括一些下棋机器，通常依赖于基于预设规则和知识表示的决策。然而，随着数据可用性的出现，机器学习变得突出。它侧重于通过用数据训练的算法进行决策。近年来，在许多情况下，AI和机器学习这两个术语被互换使用，尽管它们有明显的区别。AI广泛地指代表现出智能行为的系统或应用，包括基于规则的途径和机器学习。机器学习专门涉及从数据中学习以做出决策或预测。'
- en: In this part of the book, we will delve into the concepts, ideas, and methodologies
    of machine learning. We will also demonstrate their practical application, using
    the example of recognizing handwritten digits, a classic problem that exemplifies
    the power and utility of machine learning techniques.
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 在本书的这一部分，我们将深入探讨机器学习的概念、思想和方法论。我们还将通过识别手写数字的例子来展示它们的实际应用，这是一个经典问题，它展示了机器学习技术的力量和实用性。
