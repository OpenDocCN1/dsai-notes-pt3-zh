- en: 'Causal Inference in Observational Studies: Unconfoundedness'
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://data102.org/ds-102-book/content/chapters/04/observational-studies-unconfoundedness](https://data102.org/ds-102-book/content/chapters/04/observational-studies-unconfoundedness)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '[<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" width="1.25rem"
    height="1.25rem" class="myst-fm-license-cc-icon myst-fm-license-cc-icon-main inline-block
    mx-1"><title>Content License: Creative Commons Attribution Share Alike 4.0 International
    (CC-BY-SA-4.0)</title></svg><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
    width="1.25rem" height="1.25rem" class="myst-fm-license-cc-icon myst-fm-license-cc-icon-by
    inline-block mr-1"><title>Credit must be given to the creator</title></svg><svg
    viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" width="1.25rem" height="1.25rem"
    class="myst-fm-license-cc-icon myst-fm-license-cc-icon-sa inline-block mr-1"><title>Adaptations
    must be shared under the same terms</title></svg>](https://creativecommons.org/licenses/by-sa/4.0/)[](https://github.com/ds-102/ds-102-book
    "GitHub Repository: ds-102/ds-102-book")[](https://github.com/ds-102/ds-102-book/edit/main/ds-102-book/content/chapters/04/05_observational_studies_unconfoundedness.ipynb
    "Edit This Page")'
  prefs: []
  type: TYPE_NORMAL
- en: 'So far, we’ve looked at ways of measuring association in any dataset. We’ve
    also looked at how we can draw conclusions about causality in randomized controlled
    trials. But in many cases, randomized controlled trials are not viable. Some reasons
    for that might be:'
  prefs: []
  type: TYPE_NORMAL
- en: '**Ethical considerations**: suppose we believe that a certain treatment might
    harm people. In order to test this belief in a randomized controlled trial, we
    would have to subject people to a treatment that we believe would harm them, which
    is profoundly unethical. In such cases, we need alternative ways of drawing causal
    conclusions: we have an obligation as data scientists and researchers to avoid
    making [the mistakes of the past](https://en.wikipedia.org/wiki/Unethical_human_experimentation_in_the_United_States).'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Cost**: Randomized controlled trials can be expensive to run: we must find
    randomly chosen individuals that are representative the population; apply a treatment
    to half of them; and measure the outcomes, potentially over a long range of time.
    In some cases, this may be infeasible.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Sample size**: due to cost considerations, randomized controlled trials may
    not have enough subjects to draw strong statistical conclusions.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: There is a wealth of data available on observational studies. In this section,
    we’ll look at ways we can use this data to draw causal conclusions. As we saw
    when looking at association, the most common problem when trying to draw conclusions
    about causality is the presence of confounding variables. We’ll focus our attention
    on methods that try to account for these confounding variables.
  prefs: []
  type: TYPE_NORMAL
- en: Why it’s hard[¶](#why-its-hard "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: When dealing with data from observational studies, we can’t just take the simple
    difference in means anymore. To see why not, let’s return to our restaurants example.
    We’ll do the same computations we did before, but this time from the potential
    outcomes perspective.
  prefs: []
  type: TYPE_NORMAL
- en: 'Consider the science table version of the data (where we’ve converted 👍 to
    1 and 👎 to 0, so that averages correspond to percentages liked):'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: 'The `NaN` values indicate missing counterfactual outcomes that we don’t get
    to observe: for example, dish 0 was ordered from Restaurant A, so we don’t know
    what rating the critics would have given a dish from Restaurant B on that day.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Displaying the data this way requires us to think about it slightly differently,
    and highlights the implications of the potential outcomes framework! In particular:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><msub><mi>Z</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">Z_i</annotation></semantics>Zi​
    corresponds to whether the critic ordered dish <semantics><mrow><mi>i</mi></mrow><annotation
    encoding="application/x-tex">i</annotation></semantics>i from restaurant A or
    B.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '<semantics><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mi>A</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">Y_i(A)</annotation></semantics>Yi​(A)
    and <semantics><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mi>B</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">Y_i(B)</annotation></semantics>Yi​(B)
    represent what-ifs: *if* the critics had ordered dish <semantics><mrow><mi>i</mi></mrow><annotation
    encoding="application/x-tex">i</annotation></semantics>i from a particular restaurant,
    would they have liked it?'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'The year is our confounder (or confounding variable): we’ll use <semantics><mrow><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">X_i</annotation></semantics>Xi​ to denote the year
    that dish <semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics>i
    was ordered in.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Our representation of the data this way makes it clear that we can’t compute
    the ATE:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: '`nan`'
  prefs: []
  type: TYPE_NORMAL
- en: 'In trying to understand a causal relationship between choice of restaurant
    and liking the food, naively using the simple difference in observed means (SDO)
    can mislead us, as we already saw:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: '`np.float64(0.20000000000000007)`'
  prefs: []
  type: TYPE_NORMAL
- en: Confounding variables and the superpopulation model[¶](#confounding-variables-and-the-superpopulation-model
    "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: In the case of a randomized controlled trial, we saw that we could use the difference
    in means estimator because of the independence between the treatment assignment
    <semantics><mrow><msub><mi>Z</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">Z_i</annotation></semantics>Zi​
    and the potential outcomes <semantics><mrow><mo fence="false" stretchy="true"
    minsize="1.2em" maxsize="1.2em">(</mo><msub><mi>Y</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mn>0</mn><mo
    stretchy="false">)</mo><mo separator="true">,</mo><msub><mi>Y</mi><mi>i</mi></msub><mo
    stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo><mo fence="false"
    stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo></mrow><annotation encoding="application/x-tex">\big(Y_i(0),
    Y_i(1)\big)</annotation></semantics>(Yi​(0),Yi​(1)). But, in the case of an observational
    study, this independence assumption no longer holds. We’ve seen a few examples
    of this in the last few sections, where confounding variables affect both the
    treatment and the outcome.
  prefs: []
  type: TYPE_NORMAL
- en: 'In this section, we’ll focus on a few methods that answer the question: if
    we also observe the confounding variable, can we determine whether the treatment
    has an effect on the outcome?'
  prefs: []
  type: TYPE_NORMAL
- en: Our notation will be similar to what we’ve used before, and we’ll add a new
    variable <semantics><mrow><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">X_i</annotation></semantics>Xi​ for each unit that
    represents the confounding information. We have tuples <semantics><mrow><mo stretchy="false">(</mo><msub><mi>Z</mi><mi>i</mi></msub><mo
    separator="true">,</mo><msub><mi>Y</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mn>0</mn><mo
    stretchy="false">)</mo><mo separator="true">,</mo><msub><mi>Y</mi><mi>i</mi></msub><mo
    stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo><mo separator="true">,</mo><msub><mi>X</mi><mi>i</mi></msub><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(Z_i, Y_i(0),
    Y_i(1), X_i)</annotation></semantics>(Zi​,Yi​(0),Yi​(1),Xi​) for each unit that
    are i.i.d. (that is, the tuple for one unit is independent from the tuple for
    the next unit). This is called the **superpopulation model**.
  prefs: []
  type: TYPE_NORMAL
- en: Conditional average treatment effect and unconfoundedness[¶](#conditional-average-treatment-effect-and-unconfoundedness
    "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'We’ll define a new quantity called the **conditional average treatment effect
    (CATE)**. This is like the ATE we saw before, but conditioned on a particular
    value of <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mtext>CATE</mtext><mo>=</mo><mi>τ</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>E</mi><mo stretchy="false">[</mo><mi>Y</mi><mo
    stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo><mo>−</mo><mi>Y</mi><mo
    stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi><mi>X</mi><mo>=</mo><mi>x</mi><mo
    stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">\text{CATE}
    = \tau(x) = E[Y(1) - Y(0) | X = x]</annotation></semantics>CATE=τ(x)=E[Y(1)−Y(0)∣X=x][(1)](#vQzp03TqGh
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'Introducing the conditioning alone doesn’t help us: if we were to expand this
    using the tower property to condition on <semantics><mrow><mi>Z</mi></mrow><annotation
    encoding="application/x-tex">Z</annotation></semantics>Z, we’ll still have counterfactual
    terms. So why did we do it? It turns out that we only need to make one assumption
    for this to help us. This assumption is called **unconfoundedness**:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mi>Y</mi><mo
    stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo separator="true">,</mo><mi>Y</mi><mo
    stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo><mo fence="false"
    stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mo>⊥</mo><mtext> ⁣</mtext><mtext> ⁣</mtext><mtext> ⁣</mtext><mo>⊥</mo><mi>Z</mi><mo>∣</mo><mi>X</mi></mrow><annotation
    encoding="application/x-tex">\big(Y(0), Y(1)\big) \perp \!\!\! \perp Z \mid X</annotation></semantics>(Y(0),Y(1))⊥⊥Z∣X[(2)](#aLnnZOsh1M
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: This is a statement of conditional independence. The potential outcomes <semantics><mrow><mi>Y</mi><mo
    stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y(0)</annotation></semantics>Y(0) and <semantics><mrow><mi>Y</mi><mo
    stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y(1)</annotation></semantics>Y(1) might not be independent
    of the treatment decision <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z,
    but this assumption states that they are conditionally independent *if* we know
    the value of a confounding variable <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X.
  prefs: []
  type: TYPE_NORMAL
- en: 'In the restaurant example above, unconfoundedness would mean that within each
    year, the decision whether to order from A or B (treatment) is independent of
    the ratings that dishes from A and B would get (potential outcomes). It does *not*
    state that the restaurant is conditionally independent of the rating: this is
    a subtle but important distinction.'
  prefs: []
  type: TYPE_NORMAL
- en: 'If we assume unconfoundedness, then we can safely estimate the CATE using the
    difference in conditional means:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left right" columnspacing="0em
    1em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mi>τ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>E</mi><mo stretchy="false">[</mo><mi>Y</mi><mo
    stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo><mo>−</mo><mi>Y</mi><mo
    stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi><mi>X</mi><mo>=</mo><mi>x</mi><mo
    stretchy="false">]</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mi>E</mi><mo stretchy="false">[</mo><mi>Y</mi><mo
    stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi><mi>X</mi><mo>=</mo><mi>x</mi><mo
    stretchy="false">]</mo><mo>−</mo><mi>E</mi><mo stretchy="false">[</mo><mi>Y</mi><mo
    stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi><mi>X</mi><mo>=</mo><mi>x</mi><mo
    stretchy="false">]</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mstyle
    mathsize="0.5em"><mtext>(linearity of (conditional) expectation)</mtext></mstyle></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>E</mi><mo stretchy="false">[</mo><mi>Y</mi><mo
    stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi><mi>X</mi><mo>=</mo><mi>x</mi><mo
    separator="true">,</mo><mi>Z</mi><mo>=</mo><mn>1</mn><mo stretchy="false">]</mo><mo>−</mo><mi>E</mi><mo
    stretchy="false">[</mo><mi>Y</mi><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mi
    mathvariant="normal">∣</mi><mi>X</mi><mo>=</mo><mi>x</mi><mo separator="true">,</mo><mi>Z</mi><mo>=</mo><mn>0</mn><mo
    stretchy="false">]</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mstyle
    mathsize="0.5em"><mtext>(unconfoundedness)</mtext></mstyle></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} \tau(x) &= E[Y(1) - Y(0) | X = x] &\\
    &= E[Y(1) | X = x] - E[Y(0) | X = x] & {\tiny\text{(linearity of (conditional)
    expectation)}}\\ &= E[Y(1) | X = x, Z = 1] - E[Y(0) | X = x, Z = 0] & {\tiny\text{(unconfoundedness)}}
    \end{align}</annotation></semantics>τ(x)​=E[Y(1)−Y(0)∣X=x]=E[Y(1)∣X=x]−E[Y(0)∣X=x]=E[Y(1)∣X=x,Z=1]−E[Y(0)∣X=x,Z=0]​(linearity of (conditional) expectation)(unconfoundedness)​​[(3)](#MdGRFYoato
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: From CATE to ATE[¶](#from-cate-to-ate "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'In most cases, what we’re really interested in is the ATE. How do we get from
    the CATE to the ATE? We can use the law of iterated expectation (tower property):'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>E</mi><mo stretchy="false">[</mo><mi>Y</mi><mo stretchy="false">(</mo><mn>1</mn><mo
    stretchy="false">)</mo><mo>−</mo><mi>Y</mi><mo stretchy="false">(</mo><mn>0</mn><mo
    stretchy="false">)</mo><mo stretchy="false">]</mo><mo>=</mo><msub><mi>E</mi><mi>X</mi></msub><mo
    stretchy="false">[</mo><msub><mi>E</mi><mi>Y</mi></msub><mo stretchy="false">[</mo><mi>Y</mi><mo
    stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo><mo>−</mo><mi>Y</mi><mo
    stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi><mi>X</mi><mo
    stretchy="false">]</mo><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">E[Y(1)
    - Y(0)] = E_X[E_Y[Y(1)-Y(0) | X]]</annotation></semantics>E[Y(1)−Y(0)]=EX​[EY​[Y(1)−Y(0)∣X]][(4)](#JmjHRYEddG
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: In other words,
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>A</mi><mi>T</mi><mi>E</mi></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>E</mi><mo stretchy="false">[</mo><mi>τ</mi><mo
    stretchy="false">(</mo><mi>X</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><munder><mo>∑</mo><mi>x</mi></munder><mi>τ</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>=</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd></mtr></mtable><annotation encoding="application/x-tex">\begin{align}
    ATE &= E[\tau(X)] \\ &= \sum_x \tau(x) P(X=x) \end{align}</annotation></semantics>ATE​=E[τ(X)]=x∑​τ(x)P(X=x)​​[(5)](#FzwtpRjxCu
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: (where we would use an integral instead of a sum if <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X is continuous).
  prefs: []
  type: TYPE_NORMAL
- en: 'What does this look like in practice? Let’s go back to the restaurant example.
    Instead of computing the difference in means for the entire dataset, we’ll do
    it separately, once for 2020 and once for 2019:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE4]'
  prefs: []
  type: TYPE_PRE
- en: 'These correspond to the CATEs <semantics><mrow><mi>τ</mi><mo stretchy="false">(</mo><mn>2020</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\tau(2020)</annotation></semantics>τ(2020)
    and <semantics><mrow><mi>τ</mi><mo stretchy="false">(</mo><mn>2019</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\tau(2019)</annotation></semantics>τ(2019) respectively.
    We can interpret <semantics><mrow><mi>τ</mi><mo stretchy="false">(</mo><mn>2019</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\tau(2019)</annotation></semantics>τ(2019)
    in English as: “given that a dish was ordered in 2019, what is the causal effect
    of choosing restaurant B (rather than A) on the probability of the critics liking
    their food?”, and similarly for <semantics><mrow><mi>τ</mi><mo stretchy="false">(</mo><mn>2020</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\tau(2020)</annotation></semantics>τ(2020).'
  prefs: []
  type: TYPE_NORMAL
- en: 'Just like earlier, we see that these values have the opposite sign from the
    SDO computed on the entire data: Restaurant A was better-liked in 2020 and 2019\.
    But, because the critics ordered from Restaurant A more in 2020 (which had lower
    ratings overall), Restaurant A looks worse in the aggregate data.'
  prefs: []
  type: TYPE_NORMAL
- en: 'How do we combine these to estimate the ATE? We need the marginal probabilities
    <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mn>2020</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">P(2020)</annotation></semantics>P(2020) and <semantics><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mn>2019</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">P(2019)</annotation></semantics>P(2019):'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE5]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE6]'
  prefs: []
  type: TYPE_PRE
- en: 'This is our first causal inference from observational data! To state it formally:'
  prefs: []
  type: TYPE_NORMAL
- en: '**If we assume that the year is the only confounder for the effect of restaurant
    choice on reviews, then choosing Restaurant A causes the critics to like dishes
    about 8% more**.'
  prefs: []
  type: TYPE_NORMAL
- en: 'When we assume that the year is the only confounder, we’re assuming **unconfoundedness*:
    that the pair of potential outcomes (i.e., the what-ifs for their reviews) are
    independent of which restaurant they actually chose, given the year.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Note that we can’t just make a blanket statement about causality: this statement
    depends heavily on our use of the unconfoundedness assumption. This is true in
    general: in order to draw causal inferences outside of randomized controlled experiments,
    we need to make assumptions. When reporting your causal conclusions, it’s always
    important to communicate the assumptions you made!'
  prefs: []
  type: TYPE_NORMAL
- en: Outcome Regression[¶](#outcome-regression "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '*Coming soon*'
  prefs: []
  type: TYPE_NORMAL
- en: Inverse propensity weighting[¶](#inverse-propensity-weighting "Link to this
    Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'In inverse propensity weighting, we’re intuitively trying to undo or compensate
    for the effect of the confounder by reweighting the outcome variables based on
    the treatment and confounders. To illustrate the effect, we’ll use a synthetic
    dataset from a treatment for high blood pressure for twenty people. The data contain
    three columns:'
  prefs: []
  type: TYPE_NORMAL
- en: '`treated`, which says whether or not each person received the treatment'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`is_old`, whether the patient is older than 45 (1) or not (0)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`bp_change`, how much the person’s (systolic) blood pressure dropped (in mm
    Hg)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '[PRE7]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE8]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: 'From a quick look at the data, we can see a few facts:'
  prefs: []
  type: TYPE_NORMAL
- en: Most of the people who received the treatment were older
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Almost all the younger peoples’ BP improved (i.e., went down)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Most of the older peoples’ BP did not improve
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: We have very few data points. There are only twenty people overall, and even
    fewer once we slice the data up. For example, there are only two older people
    who took the treatment.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'We’ll ignore the last point for now, for the sake of illustration. The first
    three points make it very clear that *age is a confounding variable* for the effect
    of the treatment. One way to quantify the degree of confounding is using the conditional
    probability of receving the treatment given the confounder: this is called the
    **propensity score**.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE9]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: 'For the older group, the probability of receiving the treatment is <semantics><mrow><mn>7</mn><mi
    mathvariant="normal">/</mi><mn>9</mn><mo>≈</mo><mn>0.78</mn></mrow><annotation
    encoding="application/x-tex">7/9 \approx 0.78</annotation></semantics>7/9≈0.78.
    For the younger group, the probability is <semantics><mrow><mn>4</mn><mi mathvariant="normal">/</mi><mn>11</mn><mo>≈</mo><mn>0.36</mn></mrow><annotation
    encoding="application/x-tex">4/11 \approx 0.36</annotation></semantics>4/11≈0.36.
    We can add these into the table:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: This tells us that person 0 had a 0.36 probability of receiving the treatment,
    given that they were younger, and so on.
  prefs: []
  type: TYPE_NORMAL
- en: Reweighting[¶](#reweighting "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'If we try to naively compute a causal effect using the data above, we’ll be
    led astray:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]'
  prefs: []
  type: TYPE_PRE
- en: '`np.float64(-0.6797979797979803)`'
  prefs: []
  type: TYPE_NORMAL
- en: 'The effect appears to be very small: only a drop of 0.68mm Hg. This is because
    of the confounding effect: younger people are overrepresented in the control group,
    and underrepresented in the treatment group (and vice versa for older people).'
  prefs: []
  type: TYPE_NORMAL
- en: 'What if we try to adjust for the overrepresentation/underrepresentation by
    re-weighting each data point? Let’s start by looking at the treatment group. For
    this group, we should **increase** the weight on the younger people (because there
    are too few of them). There are many ways we could do this: one is to divide by
    the propensity score. In particular, the approach we’re going to take will give
    us an **unbiased estimate of the ATE**, even in the presence of confounding!'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE12]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: This gives a significantly increased weight to the improvements from the younger
    group (and only a very slightly increased weight to the improvements from the
    older group).
  prefs: []
  type: TYPE_NORMAL
- en: 'What about the control group? There, we want to increase the weight on the
    older people. Dividing by the propensity score would have the opposite effect
    from what we want: instead, we’ll divide by 1 minus the propensity score.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE13]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: 'Now, we can compare the difference in reweighted means:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE14]'
  prefs: []
  type: TYPE_PRE
- en: '`np.float64(-1.857142857142857)`'
  prefs: []
  type: TYPE_NORMAL
- en: We can see that this does a much better job of capturing the real effect!
  prefs: []
  type: TYPE_NORMAL
- en: Inverse Propensity Score Weighting (IPW)[¶](#inverse-propensity-score-weighting-ipw
    "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Using the logic above, and our ad hoc processing of the table, we’re now ready
    to define the IPW (inverse propensity weighted) estimator for the ATE:'
  prefs: []
  type: TYPE_NORMAL
- en: '<semantics><mrow><msub><mover accent="true"><mi>τ</mi><mo>^</mo></mover><mrow><mi>I</mi><mi>P</mi><mi>W</mi></mrow></msub><mo>=</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><munder><munder><mrow><munder><mo>∑</mo><mrow><mi>i</mi><mo>:</mo><msub><mi>Z</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow></munder><mfrac><msub><mi>Y</mi><mi>i</mi></msub><mrow><mi>e</mi><mo
    stretchy="false">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo stretchy="false">)</mo></mrow></mfrac></mrow><mo
    stretchy="true">⏟</mo></munder><mtext>reweighted treated rows</mtext></munder><mo>−</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><munder><munder><mrow><munder><mo>∑</mo><mrow><mi>i</mi><mo>:</mo><msub><mi>Z</mi><mi>i</mi></msub><mo>=</mo><mn>0</mn></mrow></munder><mfrac><msub><mi>Y</mi><mi>i</mi></msub><mrow><mn>1</mn><mo>−</mo><mi>e</mi><mo
    stretchy="false">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo stretchy="false">)</mo></mrow></mfrac></mrow><mo
    stretchy="true">⏟</mo></munder><mtext>reweighted control rows</mtext></munder></mrow><annotation
    encoding="application/x-tex">\hat{\tau}_{IPW} = \frac{1}{n} \underbrace{% \sum_{i:
    Z_i = 1} \frac{Y_i}{e(X_i)} }_{\text{reweighted treated rows}} - \frac{1}{n} \underbrace{%
    \sum_{i: Z_i = 0} \frac{Y_i}{1-e(X_i)} }_{\text{reweighted control rows}}</annotation></semantics>τ^IPW​=n1​reweighted treated rowsi:Zi​=1∑​e(Xi​)Yi​​​​−n1​reweighted control rowsi:Zi​=0∑​1−e(Xi​)Yi​​​​[(6)](#usAmwEdhW9
    "Link to this Equation")'
  prefs: []
  type: TYPE_NORMAL
- en: 'This is a particularly useful estimator because **if the unconfoundedness assumption**
    (also known as the conditional independence assumption or CIA) **is true, then
    this will be an unbiased estimate of the true ATE**: <semantics><mrow><mi>E</mi><mo
    stretchy="false">[</mo><msub><mover accent="true"><mi>τ</mi><mo>^</mo></mover><mrow><mi>I</mi><mi>P</mi><mi>W</mi></mrow></msub><mo
    stretchy="false">]</mo><mo>=</mo><mi>τ</mi></mrow><annotation encoding="application/x-tex">E[\hat{\tau}_{IPW}]
    = \tau</annotation></semantics>E[τ^IPW​]=τ.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Intuitively, why does it make sense to divide by the propensity score (for
    the treatment group) and one minus the propensity score (for the control group)?
    We’re trying to find units that were less likely to end up in the group that they
    did, and give those higher weight. Recall that the propensity score and its complement
    are conditional probabilities:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>e</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>P</mi><mo
    stretchy="false">(</mo><mi>Z</mi><mo>=</mo><mn>1</mn><mi mathvariant="normal">∣</mi><mi>X</mi><mo>=</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mn>1</mn><mo>−</mo><mi>e</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>P</mi><mo
    stretchy="false">(</mo><mi>Z</mi><mo>=</mo><mn>0</mn><mi mathvariant="normal">∣</mi><mi>X</mi><mo>=</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd></mtr></mtable><annotation encoding="application/x-tex">\begin{align*}
    e(x) &= P(Z=1 | X=x) \\ 1 - e(x) &= P(Z=0 | X=x) \end{align*}</annotation></semantics>e(x)1−e(x)​=P(Z=1∣X=x)=P(Z=0∣X=x)​[(7)](#SrYeRkV3m1
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: For the treatment group, we want to find units that, because of confounding,
    were unlikely to end up in the treatment group (in the example above, this corresponds
    to finding younger people). Those units will have a very small propensity score,
    so we can divide by it to increase the weight on them.
  prefs: []
  type: TYPE_NORMAL
- en: For the control group, we want to find units that, because of confounding, were
    unlikely to end up in the control group (in the example above, this corresponds
    to finding older people). Those units will have a very **large** propensity score
    (close to 1), so we can divide by 1 minus the propensity score to increase the
    weight on them.
  prefs: []
  type: TYPE_NORMAL
- en: The same process will give **less** weight to units that are overrepresented
    in their group.
  prefs: []
  type: TYPE_NORMAL
- en: For a proof that the IPW estimator above gives an **unbiased estimate** of the
    true ATE, see one of these sources. Try the proof yourself as an exercise before
    looking at the answer!
  prefs: []
  type: TYPE_NORMAL
- en: '[A First Course in Causal Inference](https://arxiv.org/pdf/2305.18793) by Peng
    Ding (Section 11.2.1, pg. 159) has a proof that uses the same notation as this
    book.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '[Causal Inference: The Mixtape](https://mixtape.scunning.com/05-matching_and_subclassification#weighting-on-the-propensity-score)
    by Scott Cunningham has a proof that uses slightly different notation.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Computing propensity scores using logistic regression[¶](#computing-propensity-scores-using-logistic-regression
    "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: In this example, our confounder was binary, which made it very easy to compute
    the propensity scores using simple arithmetic. But in many applications, our confounders
    could be continuous, or we could have multiple confounders. In such cases, computing
    propensity scores is not as trivial.
  prefs: []
  type: TYPE_NORMAL
- en: 'In these cases, we typically use logistic regression to predict them. Note
    that although this is the same logistic regression you’re familiar with, the purpose
    of using it is very different: here, we aren’t trying to make predictions, or
    achieve high prediction accuracy. We’re instead just using it to determine for
    each row, what is the probability (based on the confounders) of that row ending
    up in the treatment group?'
  prefs: []
  type: TYPE_NORMAL
- en: 'This means that we don’t have to worry about splitting our data into testing
    and training sets: instead, we fit the model on our entire dataset, and use the
    predicted probabilities as propensity scores.'
  prefs: []
  type: TYPE_NORMAL
