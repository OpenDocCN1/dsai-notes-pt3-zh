- en: 'Explanation:'
  id: totrans-10
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 说明：
- en: Technically, since jurors are selected without replacement, you should represent
    the number of under-representative jurors as being a Hyper Geometric Random Variable
    (a random variable we don't look at explicitely in CS109) st
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 从技术上讲，由于陪审员是随机选择的，你应该将代表性不足的陪审员数量表示为超几何随机变量（在 CS109 中我们不明确考虑的随机变量）。
- en: \begin{align*}X \sim \text{HypGeo}(n=12, N = 1000, m = 60)\end{align*}
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: \begin{align*}X \sim \text{HypGeo}(n=12, N = 1000, m = 60)\end{align*}
- en: \begin{align*} P(X \geq 1) &= 1 - P(X = 0) \\ &= 1 - \frac{ {60 \choose 0}{940
    \choose 12} }{1000 \choose 12} \\ &\approx 0.5261 \end{align*}
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: \begin{align*} P(X \geq 1) &= 1 - P(X = 0) \\ &= 1 - \frac{ {60 \choose 0}{940
    \choose 12} }{1000 \choose 12} \\ &\approx 0.5261 \end{align*}
- en: However Justic Breyer made his case by citing a Binomial distribution. This
    isn't a perfect use of binomial, because the binomial assumes that each experiment
    has equal likelihood ($p$) of success. Because the jurors are selected without
    replacement, the probability of getting a minority juror changes slightly after
    each selection (and depending on what the selection was). However, as we will
    see, because the probabilities don't change too much the binomial distribution
    is not too far off.
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，法官 Breyer 通过引用二项式分布来论证。这不是二项式分布的完美应用，因为二项式分布假设每个实验成功的可能性（$p$）是相等的。由于陪审员是随机选择的，每次选择后得到少数族裔陪审员的可能性都会略有变化（并取决于选择的结果）。然而，正如我们将看到的，由于概率变化不大，二项式分布并不太偏离。
- en: \begin{align*} X \sim \text{Binomial}(n=12, p = 60/1000) \end{align*}
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: \begin{align*} X \sim \text{Binomial}(n=12, p = 60/1000) \end{align*}
- en: \begin{align*} P(X \geq 1) &= 1 - P(X = 0) \\ &= 1 - {60 \choose 0}(1- 0.06)^{12}
    \\ &\approx 0.5241 \end{align*}
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: \begin{align*} P(X \geq 1) &= 1 - P(X = 0) \\ &= 1 - {60 \choose 0}(1- 0.06)^{12}
    \\ &\approx 0.5241 \end{align*}
