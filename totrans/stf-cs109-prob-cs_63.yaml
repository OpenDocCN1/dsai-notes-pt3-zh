- en: '| Name | Age with max prob | Prob of most likely age |'
  prefs: []
  type: TYPE_TB
- en: '| --- | --- | --- |'
  prefs: []
  type: TYPE_TB
- en: '| Debbie | 62 | 0.104 |'
  prefs: []
  type: TYPE_TB
- en: '| Whitney | 35 | 0.098 |'
  prefs: []
  type: TYPE_TB
- en: '| Chelsea | 29 | 0.103 |'
