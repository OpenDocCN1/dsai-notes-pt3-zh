- en: Name to Age
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/examples/name2age/](https://chrispiech.github.io/probabilityForComputerScientists/en/examples/name2age/)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
- en: 'Because of shifting patterns in name popularity, a person''s name is a hint
    as to their age. The United States publishes a data which contains counts of how
    many US residents were born with a given name in a given year, based off Social
    Security applications. We can use inference to compute the reverse probability
    distribution: an updated belief in a person''s age, given their name. As a reminder,
    if I know the year someone was born, I can calculate their age within one year.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Query Name:'
  prefs: []
  type: TYPE_NORMAL
- en: '<canvas id="babyNamePMF" style="max-height: 400px;display:none">'
  prefs: []
  type: TYPE_NORMAL
- en: 'Records with name:'
  prefs: []
  type: TYPE_NORMAL
- en: This demo is based on real data from US Social Security applications between
    1914 and 2014\. Thank you to [https://www.kaggle.com/kaggle/us-baby-names](https://www.kaggle.com/kaggle/us-baby-names)
    for compiling the data. [Download Data](../../../data/babyNames/count_map.json).
  prefs: []
  type: TYPE_NORMAL
- en: Computation
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The US Social Security applications data provides you with a function: `count(year,
    name)` which returns the number of US citizens, born in a given year with a given
    name. You also have access to a list `names` which has each name ever given in
    the US and `years` which has all the years. This function is implicitly giving
    us the joint probability over names and birth year. The probability of a joint
    assignment to name and birth year can be estimated as the count of people with
    that name, born on that year, over the total number of people in the dataset.
    Let $B$ be the year someone is born, and let $N$ be their name. We will use $k$
    to denote the number of entries in the dataset: $ P(B = b,N = n) \approx \frac{\text{count}(b,
    n)} {k} $'
  prefs: []
  type: TYPE_NORMAL
- en: 'The question we would really like to answer is: what is your belief that a
    resident was born in 1950, given that their name is Gary?'
  prefs: []
  type: TYPE_NORMAL
- en: 'We can get started by applying the definition of conditional probability for
    random variables: \begin{align*} \P( B = 1950 | N = \text{Gary} ) = \frac{\P(N
    = \text{Gary} , B = 1950)}{\P(N = \text{Gary})} \end{align*} Note: Bayes'' Theorem
    is a more typical choice for inference tasks like this one. However, in this case
    its was necessary because it is easier to compute $P(B = b, N=n)$ than $P(N=n
    | B=b)$. That is why we used the definition of conditional probability instead.
    The conditional probability approach this leaves one term to compute: $\P(N =
    \text{Gary})$ which we can compute using marginalization: \begin{align*} \P( N
    = \text{Gary}) &= \sum_{y \in \text{years}} P(B = y,N = \text{Gary})\\ &\approx
    \sum\limits_{y \in \text{years}} \frac{\text{count}(y, \text{Gary})}{k} \end{align*}'
  prefs: []
  type: TYPE_NORMAL
- en: 'Putting this all together we have: \begin{align*} \P( B = 1950 | N = \text{Gary}
    ) &= \frac{\P(N = \text{Gary} , B = 1950)}{\P(N = \text{Gary})} \\ &\approx \frac
    { \Big( \frac{\text{count}(1950, \text{Gary})} {k} \Big) } { \Big( \frac{ \sum\limits_{y
    \in \text{years}} \text{count}(y, \text{Gary})}{k} \Big) } \\ &\approx \frac {
    \text{count}(1950, \text{Gary}) } { \sum\limits_{y \in \text{years}} \text{count}(y,
    \text{Gary}) } \end{align*}'
  prefs: []
  type: TYPE_NORMAL
- en: 'More generally, for any name, we can compute the conditional probability mass
    function over birth year $B$: \begin{align*} \P( B = b | N = n ) &\approx \frac
    { \text{count}(b, n) } { \sum\limits_{y \in \text{years}} \text{count}(y, n) }
    \end{align*}'
  prefs: []
  type: TYPE_NORMAL
- en: From Birth Year to Age
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Of course, if $B$ is the birth year of a person, their age, $A$ is approximately
    the current year minus $B$. This could be off by one if someone has a birth day
    later in the year, but we will ignore this small deviation for now. So for example,
    if we think that a person was born in 1988, since the current year is then their
    age is - 1988 =
  prefs: []
  type: TYPE_NORMAL
- en: Assumptions
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'This problem makes many assumptions which are worth highlighting. In fact,
    any time we make generalizations (especially about demographics) based on sparse
    information we should tread lightly. Here are the assumptions that I can think
    of:'
  prefs: []
  type: TYPE_NORMAL
- en: This data only is accurate for names of people in the US. The probability of
    age given names could be very different in other countries.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: The US census is not perfect. It does not capture all people who are resident
    in the US, and there are demographics which are underrepresented. This will also
    skew our results.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Names that Give Away Your Age
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Some names have certain years where they were exceptionally popular. These names
    provide quite a lot of information about birth year. Let's look at some of the
    names with the highest max probability.
  prefs: []
  type: TYPE_NORMAL
- en: '**Medium Popularity (>10,000 people with the name)**'
  prefs: []
  type: TYPE_NORMAL
- en: '| Name | Age with max prob | Prob of most likely age |'
  prefs: []
  type: TYPE_TB
- en: '| --- | --- | --- |'
  prefs: []
  type: TYPE_TB
- en: '| Katina | 49 | 0.245 |'
  prefs: []
