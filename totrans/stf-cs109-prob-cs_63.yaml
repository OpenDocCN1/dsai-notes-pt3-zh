- en: A search for "Katina 1972" brought up this interesting article about a baby
    named Katina in a 1972 [CBS Soap Opera](http://www.nancy.cc/2012/01/25/baby-name-katina/).
    Marquita's popularity was likely from a 1983 [toothpase add](https://www.youtube.com/watch?v=K2LcWa4G0W4).
    [Ashanti Douglas](https://en.wikipedia.org/wiki/Ashanti_(singer)) and [Miley Cirus](https://en.wikipedia.org/wiki/Miley_Cyrus)
    were popular singers in 2002 and 2008 respectively.
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: 搜索“Katina 1972”显示了一篇关于1972年一个名叫Katina的婴儿的有趣文章，这篇文章来自[CBS肥皂剧](http://www.nancy.cc/2012/01/25/baby-name-katina/)。[Marquita](https://www.youtube.com/watch?v=K2LcWa4G0W4)的流行可能源于1983年的一个[牙膏广告](https://www.youtube.com/watch?v=K2LcWa4G0W4)。[Ashanti
    Douglas](https://en.wikipedia.org/wiki/Ashanti_(singer))和[Miley Cirus](https://en.wikipedia.org/wiki/Miley_Cyrus)分别在2002年和2008年成为了流行的歌手。
- en: Futher Reading
  id: totrans-39
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 进一步阅读
- en: 'Some names don''t seem to have enough data to make good probability estimates.
    Can we quantify our uncertainty in such probability estimates? For example, if
    a name has only 10,000 entries in the database, of which only 100 were born in
    the year 1950, how confident are we that the true probability for 1950 is $\frac{100}{10000}
    = 0.01$? One way to express our uncertainty would be through a [Beta Distribution](../../part4/beta).
    In this scenario we could represent our belief in the probability for 1950 as
    $X \sim \Beta(a=101, b=9901)$ reflecting that we have seen 100 people born in
    1950 and 9900 people who were not. We can plot that belief, zoomed into the range
    [0, 0.03]:'
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 一些名字似乎没有足够的数据来做出良好的概率估计。我们能否量化这种概率估计的不确定性？例如，如果一个名字在数据库中只有10,000条记录，其中只有100人在1950年出生，我们对于1950年真实概率为$\frac{100}{10000}
    = 0.01$的信心有多大？表达我们不确定性的方法之一是通过[贝塔分布](../../part4/beta)。在这种情况下，我们可以将我们对1950年概率的信念表示为$X
    \sim \Beta(a=101, b=9901)$，这反映了我们看到了100个在1950年出生的人，以及9900个不是在1950年出生的人。我们可以绘制这种信念，并聚焦于范围[0,
    0.03]：
- en: '<canvas id="betaPdfnameBeta" style="max-height: 400px"></canvas>'
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: '<canvas id="betaPdfnameBeta" style="max-height: 400px"></canvas>'
- en: We can now ask questions such as, what is the probability that $X$ is within
    0.002 of 0.01?
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: 现在，我们可以提出一些问题，例如，$X$在0.01附近0.002的概率是多少？
- en: \begin{align*} P(&0.008 < X < 0.012) \\ &= P(X < 0.012) - P(X < 0.008) \\ &=
    F_X(0.012) - F_X(0.008) \\ &= 0.966 - 0.013 \\ &= 0.953 \end{align*}
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: \begin{align*} P(&0.008 < X < 0.012) \\ &= P(X < 0.012) - P(X < 0.008) \\ &=
    F_X(0.012) - F_X(0.008) \\ &= 0.966 - 0.013 \\ &= 0.953 \end{align*}
- en: Semantically this leads to the claim that, after observing 100 births with a
    name in 1950, out of 10,000 births with that name over the whole dataset, there
    is a 95% chance that the probability of someone being born in 1950 is 0.010 $\pm$
    0.002.
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 从语义上讲，这导致了一个断言：在观察了100个在1950年出生的名字后，在整个数据集中，该名字有10,000个出生记录，有95%的把握认为某人在1950年出生的概率是0.010
    $\pm$ 0.002。
