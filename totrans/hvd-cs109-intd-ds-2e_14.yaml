- en: 10  Data visualization in practice
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-1/dataviz/dataviz-in-practice.html](https://rafalab.dfci.harvard.edu/dsbook-part-1/dataviz/dataviz-in-practice.html)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '[Data Visualization](../dataviz/intro-dataviz.html)'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '[10  Data visualization in practice](../dataviz/dataviz-in-practice.html)'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: In this chapter, we will demonstrate how relatively simple **ggplot2** code
    can create insightful and aesthetically pleasing plots. As motivation we will
    create plots that help us better understand trends in world health and economics.
    We will implement what we learned in [Chapter 8](ggplot2.html) and [Chapter 9](dataviz-principles.html)
    and learn how to augment the code to perfect the plots. As we go through our case
    study, we will describe relevant general data visualization principles and learn
    concepts such as *faceting*, *time series plots*, *transformations*, and *ridge
    plots*.
  prefs: []
  type: TYPE_NORMAL
- en: '10.1 Case study 1: new insights on poverty'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'Hans Rosling[¹](#fn1) was the co-founder of the Gapminder Foundation[²](#fn2),
    an organization dedicated to educating the public by using data to dispel common
    myths about the so-called developing world. The organization uses data to show
    how actual trends in health and economics contradict the narratives that emanate
    from sensationalist media coverage of catastrophes, tragedies, and other unfortunate
    events. As stated in the Gapminder Foundation’s website:'
  prefs: []
  type: TYPE_NORMAL
- en: 'Journalists and lobbyists tell dramatic stories. That’s their job. They tell
    stories about extraordinary events and unusual people. The piles of dramatic stories
    pile up in peoples’ minds into an over-dramatic worldview and strong negative
    stress feelings: “The world is getting worse!”, “It’s we vs. them!”, “Other people
    are strange!”, “The population just keeps growing!” and “Nobody cares!”'
  prefs:
  - PREF_BQ
  - PREF_BQ
  - PREF_BQ
  type: TYPE_NORMAL
- en: 'Hans Rosling conveyed actual data-based trends in a dramatic way of his own,
    using effective data visualization. This section is based on two talks that exemplify
    this approach to education: New Insights on Poverty[³](#fn3) and The Best Stats
    You’ve Ever Seen[⁴](#fn4). Specifically, in this section, we use data to attempt
    to answer the following two questions:'
  prefs: []
  type: TYPE_NORMAL
- en: Is it a fair characterization of today’s world to say it is divided into western
    rich nations and the developing world in Africa, Asia, and Latin America?
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Has income inequality across countries worsened during the last 40 years?
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'To answer these questions, we will be using the `gapminder` dataset provided
    in **dslabs**. This dataset was created using a number of spreadsheets available
    from the Gapminder Foundation. You can access the table like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: '*As done in the *New Insights on Poverty* video, we start by testing our knowledge
    regarding differences in child mortality across different countries. For each
    of the six pairs of countries below, which country do you think had the highest
    child mortality rates in 2015? Which pairs do you think are most similar?'
  prefs: []
  type: TYPE_NORMAL
- en: Sri Lanka or Turkey
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Poland or South Korea
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Malaysia or Russia
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Pakistan or Vietnam
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Thailand or South Africa
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'When answering these questions without data, the non-European countries are
    typically picked as having higher child mortality rates: Sri Lanka over Turkey,
    South Korea over Poland, and Malaysia over Russia. It is also common to assume
    that countries considered to be part of the developing world: Pakistan, Vietnam,
    Thailand, and South Africa, have similarly high mortality rates.'
  prefs: []
  type: TYPE_NORMAL
- en: 'To answer these questions **with data**, we can use **dplyr**. For example,
    for the first comparison we see that:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: '*Turkey has the higher infant mortality rate.'
  prefs: []
  type: TYPE_NORMAL
- en: 'We can use this code on all comparisons and find the following:'
  prefs: []
  type: TYPE_NORMAL
- en: '| country | infant_mortality | country | infant_mortality |'
  prefs: []
  type: TYPE_TB
- en: '| --- | --- | --- | --- |'
  prefs: []
  type: TYPE_TB
- en: '| Sri Lanka | 8.4 | Turkey | 11.6 |'
  prefs: []
  type: TYPE_TB
- en: '| Poland | 4.5 | South Korea | 2.9 |'
  prefs: []
  type: TYPE_TB
- en: '| Malaysia | 6.0 | Russia | 8.2 |'
  prefs: []
  type: TYPE_TB
- en: '| Pakistan | 65.8 | Vietnam | 17.3 |'
  prefs: []
  type: TYPE_TB
- en: '| Thailand | 10.5 | South Africa | 33.6 |'
  prefs: []
  type: TYPE_TB
- en: 'We see that the European countries on this list have higher child mortality
    rates: Poland has a higher rate than South Korea, and Russia has a higher rate
    than Malaysia. We also see that Pakistan has a much higher rate than Vietnam,
    and South Africa has a much higher rate than Thailand. It turns out that when
    Hans Rosling gave this quiz to educated groups of people, the average score was
    less than 2.5 out of 5, worse than what they would have obtained had they guessed
    randomly. This implies that more than ignorant, we are misinformed. In this chapter
    we see how data visualization helps inform us.**'
  prefs: []
  type: TYPE_NORMAL
- en: '**10.2 Scatterplots**'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '**The reason for the misconception described in the previous section stems
    from the preconceived notion that the world is divided into two groups: the western
    world (Western Europe and North America), characterized by long life spans and
    small families, versus the developing world (Africa, Asia, and Latin America)
    characterized by short life spans and large families. But do the data support
    this dichotomous view?'
  prefs: []
  type: TYPE_NORMAL
- en: The necessary data to answer this question is also available in our `gapminder`
    table. Using our newly learned data visualization skills, we will be able to tackle
    this challenge.
  prefs: []
  type: TYPE_NORMAL
- en: In order to analyze this world view, our first plot is a scatterplot of life
    expectancy versus fertility rates (average number of children per woman). We start
    by looking at data from about 50 years ago, when perhaps this view was first cemented
    in our minds.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/c4a1702fc6d07160280a120f299db599.png)*  *Most points fall into
    two distinct categories:'
  prefs: []
  type: TYPE_NORMAL
- en: Life expectancy around 70 years and 3 or fewer children per family.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Life expectancy lower than 65 years and more than 5 children per family.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: To confirm that indeed these countries are from the regions we expect, we can
    use color to represent continent.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/1dd8cf9e23050ee91380d6b717c3988e.png)*  *In 1962, “the West
    versus developing world” view was grounded in some reality. Is this still the
    case 50 years later?****'
  prefs: []
  type: TYPE_NORMAL
- en: '***10.3 Faceting***'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '***We could easily plot the 2012 data in the same way we did for 1962\. To
    make comparisons, however, side by side plots are preferable. In **ggplot2**,
    we can achieve this by *faceting* variables: we stratify the data by some variable
    and make the same plot for each strata.'
  prefs: []
  type: TYPE_NORMAL
- en: 'To achieve faceting, we add a layer with the function `facet_grid`, which automatically
    separates the plots. This function lets you facet by up to two variables using
    columns to represent one variable and rows to represent the other. The function
    expects the row and column variables to be separated by a `~`. Here is an example
    of a scatterplot with `facet_grid` added as the last layer:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE4]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/6efbff95215eefb7b50c44ed75812fcd.png)*  *We see a plot for each
    continent/year pair. However, this is just an example and more than what we want,
    which is simply to compare 1962 and 2012\. In this case, there is just one variable
    and we use `.` to let facet know that we are not using a second variable:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE5]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/838c00a177bdd5429c830bbe4179c979.png)*  *This plot clearly shows
    that the majority of countries have moved from the *developing world* cluster
    to the *western world* one. In 2012, the western versus developing world view
    no longer makes sense. This is particularly clear when comparing Europe to Asia,
    the latter of which includes several countries that have made great improvements.'
  prefs: []
  type: TYPE_NORMAL
- en: 10.3.1 `facet_wrap`
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'To explore how this transformation happened through the years, we can make
    the plot for several years. For example, we can add 1970, 1980, 1990, and 2000\.
    If we do this, we will not want all the plots on the same row, the default behavior
    of `facet_grid`, since they will become too thin to show the data. Instead, we
    will want to use multiple rows and columns. The function `facet_wrap` permits
    us to do this by automatically wrapping the series of plots so that each display
    has viewable dimensions:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE6]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/8bc149825ddbc800c8d9f26c6c5146c8.png)*  *This plot clearly shows
    how most Asian countries have improved at a much faster rate than European ones.*'
  prefs: []
  type: TYPE_NORMAL
- en: '*10.3.2 Fixed scales for better comparisons*'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '*The default choice of the range of the axes is important. When not using `facet`,
    this range is determined by the data shown in the plot. When using `facet`, this
    range is determined by the data shown in all plots and therefore kept fixed across
    plots. This makes comparisons across plots much easier. For example, in the above
    plot, we can see that life expectancy has increased and the fertility has decreased
    across most countries. We see this because the cloud of points moves. This is
    not the case if we adjust the scales:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE7]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/1f16159baccb7a32d70af6837b9937de.png)*  *In the plot above,
    we have to pay special attention to the range to notice that the plot on the right
    has a larger life expectancy.*******'
  prefs: []
  type: TYPE_NORMAL
- en: '***10.4 Time series plots***'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '***The visualizations above effectively illustrate that data no longer supports
    the western versus developing world view. Once we see these plots, new questions
    emerge. For example, which countries are improving more and which ones less? Was
    the improvement constant during the last 50 years or was it more accelerated during
    certain periods? For a closer look that may help answer these questions, we introduce
    *time series plots*.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Time series plots have time in the x-axis and an outcome or measurement of
    interest on the y-axis. For example, here is a trend plot of United States fertility
    rates:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE8]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/11524c31ada4fc80dc40d372e18be5e5.png)*  *We see that the trend
    is not linear at all. Instead there is sharp drop during the 1960s and 1970s to
    below 2\. Then the trend comes back to 2 and stabilizes during the 1990s.'
  prefs: []
  type: TYPE_NORMAL
- en: When the points are regularly and densely spaced, as they are here, we create
    curves by joining the points with lines, to convey that these data are from a
    single series, here a country. To do this, we use the `geom_line` function instead
    of `geom_point`.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE9]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/08acbdfce7381508a5acb768f429a1bf.png)*  *This is particularly
    helpful when we look at two countries. We can subset the data to include two countries,
    one from Europe and one from Asia, then adapt the code above:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/20ed97a53c3a07e18c82ac55684cb483.png)*  *Unfortunately, this
    is **not** the plot that we want. Rather than a line for each country, the points
    for both countries are joined. This is actually expected since we have not told
    `ggplot` anything about wanting two separate lines. To let `ggplot` know that
    there are two curves that need to be made separately, we assign each point to
    a `group`, one for each country:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/6c841c83a28ec055813731e56efbd5ab.png)*  *But which line goes
    with which country? We can assign colors to make this distinction. A useful side-effect
    of using the `color` argument to assign different colors to the different countries
    is that the data is automatically grouped:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE12]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/544de6b1c922c16e2631cbd0652be74f.png)*  *The plot clearly shows
    how South Korea’s fertility rate dropped drastically during the 1960s and 1970s,
    and by 1990 had a similar rate to that of Germany.'
  prefs: []
  type: TYPE_NORMAL
- en: 'For trend plots we recommend labeling the lines rather than using legends since
    the viewer can quickly see which line is which country. This suggestion actually
    applies to most plots: labeling is usually preferred over legends.'
  prefs: []
  type: TYPE_NORMAL
- en: 'We demonstrate how we can do this using the `geomtextpath` package. We define
    a data table with the label locations and then use a second mapping just for these
    labels:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE13]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/0614f53ec0ab27cd217bb31edb874dc9.png)*  *The plot clearly shows
    how an improvement in life expectancy followed the drops in fertility rates. In
    1960, Germans lived 15 years longer than South Koreans, although by 2010 the gap
    is completely closed. It exemplifies the improvement that many non-western countries
    have achieved in the last 40 years.*********'
  prefs: []
  type: TYPE_NORMAL
- en: '***10.5 Data transformations***'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '***We now shift our attention to the second question related to the commonly
    held notion that wealth distribution across the world has become worse during
    the last decades. When general audiences are asked if poor countries have become
    poorer and rich countries become richer, the majority answers yes. By using stratification,
    histograms, smooth densities, and boxplots, we will be able to understand if this
    is in fact the case. First we learn how transformations can sometimes help provide
    more informative summaries and plots.'
  prefs: []
  type: TYPE_NORMAL
- en: 'The `gapminder` data table includes a column with the countries’ gross domestic
    product (GDP). GDP measures the market value of goods and services produced by
    a country in a year. The GDP per person is often used as a rough summary of a
    country’s wealth. Here we divide this quantity by 365 to obtain the more interpretable
    measure *dollars per day*. Using current US dollars as a unit, a person surviving
    on an income of less than $2 a day is defined to be living in *absolute poverty*.
    We add this variable to the data table:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE14]'
  prefs: []
  type: TYPE_PRE
- en: '*The GDP values are adjusted for inflation and represent current US dollars,
    so these values are meant to be comparable across the years. Of course, these
    are country averages and within each country there is much variability. All the
    graphs and insights described below relate to country averages and not to individuals.'
  prefs: []
  type: TYPE_NORMAL
- en: 10.5.1 Log transformation
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Here is a histogram of per day incomes from 1970:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE15]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/002c5e319f3b7adf6ff545d8e4caada6.png)*  *We use the `color =
    "black"` argument to draw a boundary and clearly distinguish the bins.'
  prefs: []
  type: TYPE_NORMAL
- en: In this plot, we see that for the majority of countries, averages are below
    $10 a day. However, the majority of the x-axis is dedicated to the 35 countries
    with averages above $10\. So the plot is not very informative about countries
    with values below $10 a day.
  prefs: []
  type: TYPE_NORMAL
- en: 'It might be more informative to quickly be able to see how many countries have
    average daily incomes of about $1 (extremely poor), $2 (very poor), $4 (poor),
    $8 (middle), $16 (well off), $32 (rich), $64 (very rich) per day. These changes
    are multiplicative, and log transformations convert multiplicative changes into
    additive ones: when using base 2, a doubling of a value turns into an increase
    by 1.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Here is the distribution if we apply a log base 2 transform:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE16]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/f75504b40188305e38477c969f1e6c92.png)*  *In a way, this provides
    a *close-up* of the mid to lower income countries.**'
  prefs: []
  type: TYPE_NORMAL
- en: '**10.5.2 Which base?**'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '**In the case above, we used base 2 in the log transformations. Other common
    choices are base \(\mathrm{e}\) (the natural log) and base 10.'
  prefs: []
  type: TYPE_NORMAL
- en: In general, we do not recommend using the natural log for data exploration and
    visualization. This is because while \(2^2, 2^3, 2^4, \dots\) or \(10^2, 10^3,
    \dots\) are easy to mentally compute, but the same is not true for \(\mathrm{e}^2,
    \mathrm{e}^3, \dots\). The natural log scale is not intuitive or easy to interpret.
  prefs: []
  type: TYPE_NORMAL
- en: In the dollars per day example, we used base 2 instead of base 10 because the
    resulting range is easier to interpret. The range of the untransformed values
    is 0.3269426, 48.8852142.
  prefs: []
  type: TYPE_NORMAL
- en: 'In base 10, this turns into a range that includes very few integers: just 0
    and 1\. With base 2, our range includes -2, -1, 0, 1, 2, 3, 4, and 5\. It is easier
    to compute \(2^x\) and \(10^x\) when \(x\) is an integer and between -10 and 10,
    so we prefer to have smaller integers in the scale. Another consequence of a limited
    range is that choosing the binwidth is more challenging. With log base 2, we know
    that a binwidth of 1 will translate to a bin with range \(x\) to \(2x\).'
  prefs: []
  type: TYPE_NORMAL
- en: 'For an example in which base 10 makes more sense, consider population sizes.
    A log base 10 is preferable since the range for these is:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE17]'
  prefs: []
  type: TYPE_PRE
- en: '*Here is the histogram of the transformed values:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE18]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/db0239a08503a8d8f7a0b9ff69e1ea6b.png)*  *In the above, we quickly
    see that country populations range between ten thousand and ten billion.****'
  prefs: []
  type: TYPE_NORMAL
- en: '***10.5.3 Transform the values or the scale?***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***There are two ways we can use log transformations in plots. We can log the
    values before plotting them or use log scales in the axes. The plot will look
    the same, except for the numbers in the axes. Both approaches are useful and have
    different strengths. If we log the data, we can more easily interpret intermediate
    values in the scale. For example, if we see:'
  prefs: []
  type: TYPE_NORMAL
- en: '`----1----x----2--------3----`'
  prefs: []
  type: TYPE_NORMAL
- en: 'for log transformed data, we know that the value of \(x\) is about 1.5\. If
    the scales are logged:'
  prefs: []
  type: TYPE_NORMAL
- en: '`----10---x---100------1000---`'
  prefs: []
  type: TYPE_NORMAL
- en: then, to determine `x`, we need to compute \(10^{1.5}\), which is not easy to
    do in our heads. However, the advantage of showing logged scales is that the original
    values are displayed in the plot, which are easier to interpret. For example,
    we would see “32 dollars a day” instead of “5 log base 2 dollars a day”.
  prefs: []
  type: TYPE_NORMAL
- en: 'As we learned earlier, if we want to scale the axis with logs, we can use the
    `scale_x_continuous` function. Instead of logging the values first, we apply this
    layer:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE19]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/a9131d0b50294ed0cf1e864198b4a20b.png)*  *Note that the log base
    10 transformation has its own function: `[scale_x_log10()](https://ggplot2.tidyverse.org/reference/scale_continuous.html)`,
    but currently base 2 does not, although we could easily define our own.'
  prefs: []
  type: TYPE_NORMAL
- en: There are other transformations available through the `trans` argument. As we
    learn later on, the square root (`sqrt`) transformation is useful when considering
    counts. The logistic transformation (`logit`) is useful when plotting proportions
    between 0 and 1\. The `reverse` transformation is useful when we want smaller
    values to be on the right or on top.********
  prefs: []
  type: TYPE_NORMAL
- en: '***10.6 Multimodal distributions***'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '***In the histogram above we see two *bumps*: one at about 4 and another at
    about 32\. In statistics these bumps are sometimes referred to as *modes*. The
    mode of a distribution is the value with the highest frequency. The mode of the
    normal distribution is the average. When a distribution, like the one above, doesn’t
    monotonically decrease from the mode, we call the locations where it goes up and
    down again *local modes* and say that the distribution has *multiple modes*.'
  prefs: []
  type: TYPE_NORMAL
- en: 'The histogram above suggests that the 1970 country income distribution has
    two modes: one at about 2 dollars per day (1 in the log 2 scale) and another at
    about 32 dollars per day (5 in the log 2 scale). This *bimodality* is consistent
    with a dichotomous world made up of countries with average incomes less than 8
    dollars per day (3 in the log 2 scale) and countries above that.***'
  prefs: []
  type: TYPE_NORMAL
- en: '***10.7 Comparing distributions***'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '***A histogram showed us that the 1970 income distribution values show a dichotomy.
    However, the histogram does not show us if the two groups of countries are *west*
    versus the *developing* world.'
  prefs: []
  type: TYPE_NORMAL
- en: Let’s start by quickly examining the data by region. We reorder the regions
    by the median value and use a log scale.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE20]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/aa4dca439d022570a54e385b302d2bb7.png)*  *We can already see
    that there is indeed a “west versus the rest” dichotomy: we see two clear groups,
    with the rich group composed of North America, Northern and Western Europe, and
    New Zealand and Australia. We define groups based on this observation:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE21]'
  prefs: []
  type: TYPE_PRE
- en: '*We turn this `group` variable into a factor to control the order of the levels:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE22]'
  prefs: []
  type: TYPE_PRE
- en: '*In the next section we demonstrate how to visualize and compare distributions
    across groups.'
  prefs: []
  type: TYPE_NORMAL
- en: 10.7.1 Boxplots
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: The exploratory data analysis above has revealed two characteristics about average
    income distribution in 1970\. Using a histogram, we found a bimodal distribution
    with the modes relating to poor and rich countries. We now want to compare the
    distribution across these five groups to confirm the “west versus the rest” dichotomy.
    The number of points in each category is large enough that a summary plot may
    be useful. We could generate five histograms or five density plots, but it may
    be more practical to have all the visual summaries in one plot. We therefore start
    by stacking boxplots next to each other. Note that we add the layer `theme(axis.text.x
    = element_text(angle = 90, hjust = 1))` to turn the group labels vertical, since
    they do not fit if we show them horizontally, and we remove the axis label to
    make space.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE23]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/e81ce75beec65b7c7e853f77c4d069a1.png)*  *Boxplots have the limitation
    that by summarizing the data into five numbers, we might miss important characteristics
    of the data. One way to avoid this is by showing the data.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE24]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/6987a7a4fd1fb21c60ef70721605ca06.png)**'
  prefs: []
  type: TYPE_NORMAL
- en: '**10.7.2 Ridge plots**'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '**Showing each individual point does not always reveal important characteristics
    of the distribution. Although not the case here, when the number of data points
    is so large that there is over-plotting, showing the data can be counterproductive.
    Boxplots help with this by providing a five-number summary, but this has limitations
    too. For example, boxplots will not permit us to discover bimodal distributions.
    To see this, note that the two plots below are summarizing the same dataset:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/8b467d54f40aee0a30cde542b12431a2.png)'
  prefs: []
  type: TYPE_IMG
- en: In cases in which we are concerned that the boxplot summary is too simplistic,
    we can show stacked smooth densities or histograms. We refer to these as *ridge
    plots*. Because we are used to visualizing densities with values in the x-axis,
    we stack them vertically. Also, because more space is needed in this approach,
    it is convenient to overlay them. The package **ggridges** provides a convenient
    function for doing this. Here is the income data shown above with boxplots but
    with a *ridge plot*.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE25]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/138ecbab77a585b23769915a90143185.png)*  *Note that we have to
    invert the `x` and `y` used for the boxplot. A useful `geom_density_ridges` parameter
    is `scale`, which lets you determine the amount of overlap, with `scale = 1` meaning
    no overlap and larger values resulting in more overlap.'
  prefs: []
  type: TYPE_NORMAL
- en: 'If the number of data points is small enough, we can add them to the ridge
    plot using the following code:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE26]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/5a98f314bb7476536d1fdcc51d4054f6.png)*  *By default, the height
    of the points is jittered and should not be interpreted in any way. To show data
    points, but without using jitter we can use the following code to add what is
    referred to as a *rug representation* of the data.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE27]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/fb532ad409e029a0480d9123414cc179.png)*****'
  prefs: []
  type: TYPE_NORMAL
- en: '***10.7.3 Example: 1970 versus 2010 income distributions***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***Data exploration clearly shows that in 1970 there was a “west versus the
    rest” dichotomy. But does this dichotomy persist? Let’s use `facet_grid` and see
    how the distributions have changed. To start, we will focus on two groups: the
    west and the rest. We make four histograms. We make this plot only for countries
    with data in both 1970 and 2010\. Note that several countries were founded after
    1970; for example, the Soviet Union divided into several countries during the
    1990s. We also note that that data was available for more countries in 2010.'
  prefs: []
  type: TYPE_NORMAL
- en: 'We therefore make the plot only for countries with data in both years:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE28]'
  prefs: []
  type: TYPE_PRE
- en: '*These 108 countries account for 86% of the world population, so this subset
    should be representative. We can compare the distributions using this code:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE29]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/c644fd9efd1ece580f2af364869ebe26.png)*  *We now see that the
    rich countries have become a bit richer, but percentage-wise, the poor countries
    appear to have improved more. In particular, we see that the proportion of *developing*
    countries earning more than $16 a day increased substantially.'
  prefs: []
  type: TYPE_NORMAL
- en: To see which specific regions improved the most, we can remake the boxplots
    we made above, but now adding the year 2010 and then using facet to compare the
    two years.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE30]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/5f4612c047e783c8aeb6f92b28b3b070.png)*  *Here, we pause to introduce
    another powerful **ggplot2** feature. Because we want to compare each region before
    and after, it would be convenient to have the 1970 boxplot next to the 2010 boxplot
    for each region. In general, comparisons are easier when data are plotted next
    to each other.'
  prefs: []
  type: TYPE_NORMAL
- en: So instead of faceting, we keep the data from each year together and ask to
    color (or fill) them depending on the year. Note that groups are automatically
    separated by year and each pair of boxplots drawn next to each other. Because
    the year column is a number, we have to convert it into a factor since **ggplot2**
    automatically assigns a color to each category of a factor.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE31]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/9b1e2eccc0bf4c2febdce0cc525e10e1.png)*  *The previous data exploration
    suggested that the income gap between rich and poor countries has narrowed considerably
    during the last 40 years. We used a series of histograms and boxplots to see this.
    We suggest a succinct way to convey this message with just one plot.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Let’s start by noting that density plots for income distribution in 1970 and
    2010 deliver the message that the gap is closing:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE32]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/c5a3edcb8b7e68f21c4ba5112a48f133.png)*  *In the 1970 plot, we
    see two clear modes: poor and rich countries. In 2010, it appears that some of
    the poor countries have shifted towards the right, closing the gap.'
  prefs: []
  type: TYPE_NORMAL
- en: The next message we need to convey is that the reason for this change in distribution
    is that several poor countries became richer, rather than some rich countries
    becoming poorer. To do this, we can assign a color to the groups we identified
    during data exploration.
  prefs: []
  type: TYPE_NORMAL
- en: However, because when we overlay two densities, the default is to have the area
    under the distribution curve add up to 1 for each group, regardless of the size
    of each group, we first need to learn how to make these smooth densities in a
    way that preserves information on the number of countries in each group. To do
    this, we will need to learn to access computed variables with the `geom_density`
    function.********
  prefs: []
  type: TYPE_NORMAL
- en: '***10.7.4 Accessing computed variables***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***To have the areas of these densities be proportional to the size of the
    groups, we can simply multiply the y-axis values by the size of the group. From
    the `geom_density` help file, we see that the functions compute a variable called
    `count` that does exactly this. We want this variable to be on the y-axis rather
    than the density.'
  prefs: []
  type: TYPE_NORMAL
- en: 'In **ggplot2**, we access these variables using the function `after_stat`.
    We will therefore use the following mapping:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE33]'
  prefs: []
  type: TYPE_PRE
- en: '*We can now create the desired plot by simply changing the mapping in the previous
    code chunk. We will also expand the limits of the x-axis.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE34]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/a85e45a92ef16fac08e6d1093397d98c.png)*  *If we want the densities
    to be smoother, we use the `bw` argument so that the same bandwidth is used in
    each density. We selected 0.75 after trying out several values.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE35]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/2555d723a10de9662c7edd4539b0f385.png)*  *This plot now shows
    what is happening very clearly. The developing world distribution is changing.
    A third mode appears consisting of the countries that most narrowed the gap.'
  prefs: []
  type: TYPE_NORMAL
- en: 'To visualize if any of the groups defined above are driving this we can quickly
    make a ridge plot:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE36]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/1b320c68fa5bf7ba58e211c44f30e4c3.png)*  *Another way to achieve
    this is by stacking the densities on top of each other:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE37]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/aaf10299edbbeb0ab3aa47e1707f1641.png)*  *Here we can clearly
    see how the distributions for East Asia, Latin America, and others shift markedly
    to the right while Sub-Saharan Africa remains stagnant.'
  prefs: []
  type: TYPE_NORMAL
- en: Notice that we order the levels of the group so that the West’s density is plotted
    first, then Sub-Saharan Africa. Having the two extremes plotted first allows us
    to see the remaining bimodality better.********
  prefs: []
  type: TYPE_NORMAL
- en: '***10.7.5 Weighted densities***'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '***As a final point, we note that these distributions weigh every country the
    same. So if most of the population is improving, but living in a very large country,
    such as China, we might not appreciate this. We can actually weight the smooth
    densities using the `weight` mapping argument. The plot then looks like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/11776373ba473ba72fac39b9c6167da0.png)'
  prefs: []
  type: TYPE_IMG
- en: This particular figure shows very clearly how the income distribution gap is
    closing with most of the poor remaining in Sub-Saharan Africa.*********
  prefs: []
  type: TYPE_NORMAL
- en: '***10.8 Case study 2: the ecological fallacy***'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '***Throughout this section, we have been comparing regions of the world. We
    have seen that, on average, some regions do better than others. In this section,
    we focus on describing the importance of variability within the groups when examining
    the relationship between a country’s infant mortality rates and average income.'
  prefs: []
  type: TYPE_NORMAL
- en: 'We define a few more regions and compare the averages across regions:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/36464006b24ea283a7d802c38547f26e.png)'
  prefs: []
  type: TYPE_IMG
- en: The relationship between these two variables is almost perfectly linear with
    the chosen axis transformations, and the graph shows a dramatic difference. While
    in the West less than 0.5% of infants die, in Sub-Saharan Africa the rate is higher
    than 6%!
  prefs: []
  type: TYPE_NORMAL
- en: Note that the plot uses a new transformation, the logistic transformation.
  prefs: []
  type: TYPE_NORMAL
- en: 10.8.1 Logistic transformation
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The logistic or logit transformation for a proportion or rate \(p\) is defined
    as:'
  prefs: []
  type: TYPE_NORMAL
- en: \[f(p) = \log \left( \frac{p}{1-p} \right)\]
  prefs: []
  type: TYPE_NORMAL
- en: When \(p\) is a proportion or probability, the quantity that is being logged,
    \(p/(1-p)\), is called the *odds*. In this case \(p\) is the proportion of infants
    that survived. The odds tell us how many more infants are expected to survive
    than to die. The log transformation makes this symmetric. If the rates are the
    same, then the log odds is 0\. Fold increases or decreases turn into positive
    and negative increments, respectively.
  prefs: []
  type: TYPE_NORMAL
- en: This scale is useful when we want to highlight differences near 0 or 1\. For
    survival rates this is important because a survival rate of 90% is unacceptable,
    while a survival of 99% is relatively good. We would much prefer a survival rate
    closer to 99.9%. We want our scale to highlight these difference and the logit
    does this. Note that 99.9/0.1 is about 10 times bigger than 99/1 which is about
    10 times larger than 90/10\. By using the log, these fold changes turn into constant
    increases.
  prefs: []
  type: TYPE_NORMAL
- en: 10.8.2 Show the data
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Now, back to our plot. Based on the plot above, do we conclude that a country
    with a low income is destined to have low survival rate? Do we conclude that survival
    rates in Sub-Saharan Africa are all lower than in Southern Asia, which in turn
    are lower than in the Pacific Islands, and so on?
  prefs: []
  type: TYPE_NORMAL
- en: 'Jumping to this conclusion based on a plot showing averages is referred to
    as the *ecological fallacy*. The almost perfect relationship between survival
    rates and income is only observed for the averages at the region level. Once we
    show all the data, we see a somewhat more complicated story:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/5611d4b12bccd58c08540f4d88d1799c.png)'
  prefs: []
  type: TYPE_IMG
- en: Specifically, we see that there is a large amount of variability. We see that
    countries from the same regions can be quite different and that countries with
    the same income can have different survival rates. For example, while on average
    Sub-Saharan Africa had the worse health and economic outcomes, there is wide variability
    within that group. Mauritius and Botswana are doing better than Angola and Sierra
    Leone, with Mauritius comparable to Western countries.***
  prefs: []
  type: TYPE_NORMAL
- en: '***10.9 Case study 3: vaccines and infectious diseases***'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '***Vaccines have helped save millions of lives. In the 19th century, before
    herd immunization was achieved through vaccination programs, deaths from infectious
    diseases, such as smallpox and polio, were common. Today however, vaccination
    programs have become somewhat controversial despite all the scientific evidence
    for their importance.'
  prefs: []
  type: TYPE_NORMAL
- en: 'The controversy started with a paper[⁵](#fn5) published in 1988 and led by
    Andrew Wakefield claiming there was a link between the administration of the measles,
    mumps, and rubella (MMR) vaccine and the appearance of autism and bowel disease.
    Despite much scientific evidence contradicting this finding, sensationalist media
    reports and fear-mongering from conspiracy theorists led parts of the public into
    believing that vaccines were harmful. As a result, many parents ceased to vaccinate
    their children. This dangerous practice can be potentially disastrous given that
    the Centers for Disease Control (CDC) estimates that vaccinations will prevent
    more than 21 million hospitalizations and 732,000 deaths among children born in
    the last 20 years (see Benefits from Immunization during the Vaccines for Children
    Program Era — United States, 1994-2013, MMWR[⁶](#fn6)). The 1988 paper has since
    been retracted and Andrew Wakefield was eventually “struck off the UK medical
    register, with a statement identifying deliberate falsification in the research
    published in The Lancet, and was thereby barred from practicing medicine in the
    UK.” (source: Wikipedia[⁷](#fn7)). Yet misconceptions persist, in part due to
    self-proclaimed activists who continue to disseminate misinformation about vaccines.'
  prefs: []
  type: TYPE_NORMAL
- en: Effective communication of data is a strong antidote to misinformation and fear-mongering.
    In the introduction to this part of the book we showed an example, provided by
    a Wall Street Journal article[⁸](#fn8), showing data related to the impact of
    vaccines on battling infectious diseases. Here we reconstruct that example.
  prefs: []
  type: TYPE_NORMAL
- en: 10.9.1 Vaccine data
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The data used for these plots were collected, organized, and distributed by
    the Tycho Project[⁹](#fn9). They include weekly reported counts for seven diseases
    from 1928 to 2011, from all fifty states. We include the yearly totals in the
    **dslabs** package:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE38]'
  prefs: []
  type: TYPE_PRE
- en: '*We create a temporary object `dat` that stores only the measles data, includes
    a per 100,000 rate, orders states by average value of disease and removes Alaska
    and Hawaii since they only became states in the late 1950s. Note that there is
    a `weeks_reporting` column that tells us for how many weeks of the year data was
    reported. We have to adjust for that value when computing the rate.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE39]*'
  prefs: []
  type: TYPE_NORMAL
- en: '**10.9.2 Trend plots**'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '**We can now easily plot disease rates per year. Here are the measles data
    from California:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE40]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/c9532af778625beb64702eb0d4ff77f9.png)*  *We add a vertical line
    at 1963 since this is when the vaccine was introduced [^(10)](#fn10).******'
  prefs: []
  type: TYPE_NORMAL
- en: '***10.10 Heatmaps***'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '***Now can we show data for all states in one plot? We have three variables
    to show: year, state, and rate. In the WSJ figure, they use the x-axis for year,
    the y-axis for state, and color hue to represent rates. However, the color scale
    they use, which goes from yellow to blue to green to orange to red, can be improved.'
  prefs: []
  type: TYPE_NORMAL
- en: In our example, we want to use a sequential palette since there is no meaningful
    center, just low and high rates.
  prefs: []
  type: TYPE_NORMAL
- en: We use the geometry `geom_tile` to tile the region with colors representing
    disease rates. We use a square root transformation to avoid having the really
    high counts dominate the plot. Notice that missing values are shown in grey. Note
    that once a disease was pretty much eradicated, some states stopped reporting
    cases all together. This is why we see so much grey after 1980.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE41]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/557ca4d7978ff90f28a6fb5ae20283bf.png)*  *This plot makes a very
    striking argument for the contribution of vaccines. However, one limitation of
    this plot is that it uses color to represent quantity, which we earlier explained
    makes it harder to know exactly how high values are going. Position and lengths
    are better cues. If we are willing to lose state information, we can make a version
    of the plot that shows the values with position. We can also show the average
    for the US, which we compute like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE42]'
  prefs: []
  type: TYPE_PRE
- en: '*Now to make the plot we simply use the `geom_line` geometry:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE43]'
  prefs: []
  type: TYPE_PRE
- en: '*![](../Images/0705112b9ca3f4433207b40d6853e23f.png)*  *In theory, we could
    use color to represent the categorical value state, but it is hard to pick 50
    distinct colors.******'
  prefs: []
  type: TYPE_NORMAL
- en: '***10.11 Exercises***'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '***1.  Reproduce the image plot we previously made but for smallpox. For this
    plot, do not include years in which cases were not reported in 10 or more weeks.'
  prefs: []
  type: TYPE_NORMAL
- en: Now reproduce the time series plot we previously made, but this time following
    the instructions of the previous question for smallpox.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: For the state of California, make a time series plot showing rates for all diseases.
    Include only years with 10 or more weeks reporting. Use a different color for
    each disease.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'Now do the same for the rates for the US. Hint: compute the US rate as the
    total divided by total population using `summarize`.***'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
