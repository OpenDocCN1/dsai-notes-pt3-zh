- en: Chapter 8 ggplot2
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 第8章 ggplot2
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook/ggplot2.html](https://rafalab.dfci.harvard.edu/dsbook/ggplot2.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook/ggplot2.html](https://rafalab.dfci.harvard.edu/dsbook/ggplot2.html)
- en: Exploratory data visualization is perhaps the greatest strength of R. One can
    quickly go from idea to data to plot with a unique balance of flexibility and
    ease. For example, Excel may be easier than R for some plots, but it is nowhere
    near as flexible. D3.js may be more flexible and powerful than R, but it takes
    much longer to generate a plot.
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 探索性数据可视化可能是R的最大优势。人们可以快速从想法到数据再到图表，这种灵活性与易用性的独特平衡。例如，对于某些图表，Excel可能比R更容易使用，但它的灵活性远远不如R。D3.js可能比R更灵活和强大，但生成图表需要更长的时间。
- en: Throughout the book, we will be creating plots using the **ggplot2**[^(22)](#fn22)
    package.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 在整本书中，我们将使用**ggplot2**[^(22)](#fn22)包创建图表。
- en: '[PRE0]'
  id: totrans-4
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: Many other approaches are available for creating plots in R. In fact, the plotting
    capabilities that come with a basic installation of R are already quite powerful.
    There are also other packages for creating graphics such as **grid** and **lattice**.
    We chose to use **ggplot2** in this book because it breaks plots into components
    in a way that permits beginners to create relatively complex and aesthetically
    pleasing plots using syntax that is intuitive and comparatively easy to remember.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: R中创建图表的许多其他方法都是可用的。实际上，R的基本安装已经提供了相当强大的绘图功能。还有其他用于创建图形的包，如**grid**和**lattice**。我们选择在这本书中使用**ggplot2**，因为它以允许初学者使用直观且相对容易记忆的语法创建相对复杂且美观的图表的方式将图表分解成组件。
- en: One reason **ggplot2** is generally more intuitive for beginners is that it
    uses a grammar of graphics[^(23)](#fn23), the *gg* in **ggplot2**. This is analogous
    to the way learning grammar can help a beginner construct hundreds of different
    sentences by learning just a handful of verbs, nouns and adjectives without having
    to memorize each specific sentence. Similarly, by learning a handful of **ggplot2**
    building blocks and its grammar, you will be able to create hundreds of different
    plots.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: '**ggplot2**对初学者来说通常更直观的一个原因是，它使用图形语法[^(23)](#fn23)，即**ggplot2**中的*gg*。这类似于学习语法可以帮助初学者通过学习少量动词、名词和形容词来构建数百种不同的句子，而无需记住每个具体的句子。同样，通过学习少量**ggplot2**构建块及其语法，您将能够创建数百种不同的图表。'
- en: Another reason **ggplot2** is easy for beginners is that its default behavior
    is carefully chosen to satisfy the great majority of cases and is visually pleasing.
    As a result, it is possible to create informative and elegant graphs with relatively
    simple and readable code.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: '**ggplot2**对初学者来说容易的另一个原因是，它的默认行为是精心选择的，以满足大多数情况，并且视觉效果令人愉悦。因此，使用相对简单和可读的代码就可以创建信息丰富且优雅的图表。'
- en: One limitation is that **ggplot2** is designed to work exclusively with data
    tables in tidy format (where rows are observations and columns are variables).
    However, a substantial percentage of datasets that beginners work with are in,
    or can be converted into, this format. An advantage of this approach is that,
    assuming that our data is tidy, **ggplot2** simplifies plotting code and the learning
    of grammar for a variety of plots.
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 一个限制是**ggplot2**设计为仅与整洁格式的数据表（其中行是观测值，列是变量）一起工作。然而，初学者使用的相当一部分数据集都是这种格式，或者可以转换成这种格式。这种方法的优点是，假设我们的数据是整洁的，**ggplot2**简化了绘图代码和多种图表的语法学习。
- en: 'To use **ggplot2** you will have to learn several functions and arguments.
    These are hard to memorize, so we highly recommend you have the ggplot2 cheat
    sheet handy. You can get a copy here: [https://www.rstudio.com/wp-content/uploads/2015/03/ggplot2-cheatsheet.pdf](https://www.rstudio.com/wp-content/uploads/2015/03/ggplot2-cheatsheet.pdf)
    or simply perform an internet search for “ggplot2 cheat sheet”.'
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 要使用**ggplot2**，您将不得不学习几个函数和参数。这些很难记住，所以我们强烈建议您手头备有ggplot2速查表。您可以在以下链接获取一份副本：[https://www.rstudio.com/wp-content/uploads/2015/03/ggplot2-cheatsheet.pdf](https://www.rstudio.com/wp-content/uploads/2015/03/ggplot2-cheatsheet.pdf)或者简单地在网上搜索“ggplot2
    cheat sheet”。
- en: 8.1 The components of a graph
  id: totrans-10
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 8.1 图形的组成部分
- en: 'We will construct a graph that summarizes the US murders dataset that looks
    like this:'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将构建一个总结美国谋杀数据集的图表，看起来像这样：
- en: '![](../Images/8e3e305141e862980406e5311f56daef.png)'
  id: totrans-12
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/8e3e305141e862980406e5311f56daef.png)'
- en: We can clearly see how much states vary across population size and the total
    number of murders. Not surprisingly, we also see a clear relationship between
    murder totals and population size. A state falling on the dashed grey line has
    the same murder rate as the US average. The four geographic regions are denoted
    with color, which depicts how most southern states have murder rates above the
    average.
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以清楚地看到各州在人口规模和谋杀总数上的差异。不出所料，我们还看到了谋杀总数和人口规模之间的明显关系。位于虚线灰色线上的州具有与美国平均相同的谋杀率。四个地理区域用颜色表示，这描绘了大多数南部州的谋杀率高于平均水平。
- en: This data visualization shows us pretty much all the information in the data
    table. The code needed to make this plot is relatively simple. We will learn to
    create the plot part by part.
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 这份数据可视化几乎展示了数据表中所有的信息。制作这个图表所需的代码相对简单。我们将学习逐步创建图表。
- en: 'The first step in learning **ggplot2** is to be able to break a graph apart
    into components. Let’s break down the plot above and introduce some of the **ggplot2**
    terminology. The main three components to note are:'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 学习**ggplot2**的第一步是能够将图表分解成组件。让我们分解上面的图表并介绍一些**ggplot2**术语。需要注意的主要三个组件是：
- en: '**Data**: The US murders data table is being summarized. We refer to this as
    the **data** component.'
  id: totrans-16
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**数据**：正在汇总美国谋杀数据表。我们将其称为**数据**组件。'
- en: '**Geometry**: The plot above is a scatterplot. This is referred to as the **geometry**
    component. Other possible geometries are barplot, histogram, smooth densities,
    qqplot, and boxplot. We will learn more about these in the Data Visualization
    part of the book.'
  id: totrans-17
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**几何形状**：上面的图表是一个散点图。这被称为**几何形状**组件。其他可能的几何形状包括条形图、直方图、平滑密度、QQ图和箱线图。我们将在本书的数据可视化部分了解更多关于这些内容。'
- en: '**Aesthetic mapping**: The plot uses several visual cues to represent the information
    provided by the dataset. The two most important cues in this plot are the point
    positions on the x-axis and y-axis, which represent population size and the total
    number of murders, respectively. Each point represents a different observation,
    and we *map* data about these observations to visual cues like x- and y-scale.
    Color is another visual cue that we map to region. We refer to this as the **aesthetic
    mapping** component. How we define the mapping depends on what **geometry** we
    are using.'
  id: totrans-18
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**美学映射**：该图表使用几个视觉线索来表示数据集提供的信息。在这个图表中，最重要的两个线索是x轴和y轴上的点位置，分别代表人口规模和谋杀总数。每个点代表一个不同的观察结果，我们将这些观察结果的数据映射到x和y刻度等视觉线索上。颜色是另一个映射到区域的视觉线索，我们将其称为**美学映射**组件。我们定义映射的方式取决于我们使用的**几何形状**。'
- en: 'We also note that:'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 我们还注意到：
- en: The points are labeled with the state abbreviations.
  id: totrans-20
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 点被标记为州简称。
- en: The range of the x-axis and y-axis appears to be defined by the range of the
    data. They are both on log-scales.
  id: totrans-21
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: x轴和y轴的范围似乎由数据的范围定义。它们都使用对数刻度。
- en: There are labels, a title, a legend, and we use the style of The Economist magazine.
  id: totrans-22
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 有标签、标题、图例，我们使用了《经济学人》杂志的风格。
- en: We will now construct the plot piece by piece.
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 我们现在将逐步构建这个图表。
- en: 'We start by loading the dataset:'
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: 我们首先加载数据集：
- en: '[PRE1]'
  id: totrans-25
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: 8.2 `ggplot` objects
  id: totrans-26
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 8.2 `ggplot`对象
- en: 'The first step in creating a **ggplot2** graph is to define a `ggplot` object.
    We do this with the function `ggplot`, which initializes the graph. If we read
    the help file for this function, we see that the first argument is used to specify
    what data is associated with this object:'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: 创建**ggplot2**图表的第一步是定义一个`ggplot`对象。我们使用`ggplot`函数来完成这个操作，该函数初始化图表。如果我们阅读这个函数的帮助文件，我们会看到第一个参数用于指定与该对象关联的数据：
- en: '[PRE2]'
  id: totrans-28
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: 'We can also pipe the data in as the first argument. So this line of code is
    equivalent to the one above:'
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: 我们也可以将数据作为第一个参数传入。所以这一行代码与上面的一行等价：
- en: '[PRE3]'
  id: totrans-30
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: '![](../Images/268c6aea44a2342addbeeb193d804526.png)'
  id: totrans-31
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/268c6aea44a2342addbeeb193d804526.png)'
- en: It renders a plot, in this case a blank slate since no geometry has been defined.
    The only style choice we see is a grey background.
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 它渲染了一个图表，在这种情况下是一个空白画布，因为没有定义几何形状。我们看到的唯一样式选择是灰色背景。
- en: 'What has happened above is that the object was created and, because it was
    not assigned, it was automatically evaluated. But we can assign our plot to an
    object, for example like this:'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 上面发生的事情是对象被创建，因为它没有被分配，所以它被自动评估。但我们可以将我们的图表分配给一个对象，例如像这样：
- en: '[PRE4]'
  id: totrans-34
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: 'To render the plot associated with this object, we simply print the object
    `p`. The following two lines of code each produce the same plot we see above:'
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: 要渲染与此对象关联的图表，我们只需打印对象 `p`。以下两行代码各自产生我们上面看到的相同图表：
- en: '[PRE5]'
  id: totrans-36
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: 8.3 Geometries
  id: totrans-37
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 8.3 几何形状
- en: 'In `ggplot2` we create graphs by adding *layers*. Layers can define geometries,
    compute summary statistics, define what scales to use, or even change styles.
    To add layers, we use the symbol `+`. In general, a line of code will look like
    this:'
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: 在 `ggplot2` 中，我们通过添加 *层* 来创建图表。层可以定义几何形状、计算汇总统计量、定义要使用的刻度，或者甚至更改样式。要添加层，我们使用符号
    `+`。一般来说，一行代码将看起来像这样：
- en: DATA |> `ggplot()` + LAYER 1 + LAYER 2 + … + LAYER N
  id: totrans-39
  prefs:
  - PREF_BQ
  - PREF_BQ
  type: TYPE_NORMAL
  zh: DATA |> `ggplot()` + LAYER 1 + LAYER 2 + … + LAYER N
- en: Usually, the first added layer defines the geometry. We want to make a scatterplot.
    What geometry do we use?
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 通常，第一个添加的层定义了几何形状。我们想制作一个散点图。我们使用什么几何形状？
- en: Taking a quick look at the cheat sheet, we see that the function used to create
    plots with this geometry is `geom_point`.
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: 快速浏览一下速查表，我们可以看到用于创建这种几何图形的函数是 `geom_point`。
- en: '![](../Images/b177b692360a8ded975bbd64e8514610.png)![](../Images/42d7e365d69f4d65e51bf4682d79a6d0.png)'
  id: totrans-42
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/b177b692360a8ded975bbd64e8514610.png)![图片](../Images/42d7e365d69f4d65e51bf4682d79a6d0.png)'
- en: (Image courtesy of RStudio[^(24)](#fn24). CC-BY-4.0 license[^(25)](#fn25).)
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: （图片由 RStudio 提供[^(24)](#fn24)。CC-BY-4.0 许可证[^(25)](#fn25)。）
- en: 'Geometry function names follow the pattern: `geom_X` where X is the name of
    the geometry. Some examples include `geom_point`, `geom_bar`, and `geom_histogram`.'
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 几何函数名称遵循模式：`geom_X`，其中 X 是几何形状的名称。一些例子包括 `geom_point`、`geom_bar` 和 `geom_histogram`。
- en: 'For `geom_point` to run properly we need to provide data and a mapping. We
    have already connected the object `p` with the `murders` data table, and if we
    add the layer `geom_point` it defaults to using this data. To find out what mappings
    are expected, we read the **Aesthetics** section of the help file `geom_point`
    help file:'
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: 为了使 `geom_point` 正确运行，我们需要提供数据和映射。我们已将对象 `p` 与 `murders` 数据表连接起来，如果我们添加层 `geom_point`，它默认使用这些数据。要找出预期的映射，我们阅读
    `geom_point` 帮助文件中的 **美学** 部分：
- en: '[PRE6]'
  id: totrans-46
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: and, as expected, we see that at least two arguments are required `x` and `y`.
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: 如预期的那样，我们看到至少需要两个参数 `x` 和 `y`。
- en: 8.4 Aesthetic mappings
  id: totrans-48
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 8.4 美学映射
- en: '**Aesthetic mappings** describe how properties of the data connect with features
    of the graph, such as distance along an axis, size, or color. The `aes` function
    connects data with what we see on the graph by defining aesthetic mappings and
    will be one of the functions you use most often when plotting. The outcome of
    the `aes` function is often used as the argument of a geometry function. This
    example produces a scatterplot of total murders versus population in millions:'
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: '**美学映射** 描述了数据属性如何与图表特征（如轴上的距离、大小或颜色）相关联。`aes` 函数通过定义美学映射将数据与我们在图表上看到的内容连接起来，将是您在绘图时最常使用的函数之一。`aes`
    函数的结果通常用作几何函数的参数。此示例产生了一个总谋杀数与百万人口之间的散点图：'
- en: '[PRE7]'
  id: totrans-50
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: We can drop the `x =` and `y =` if we wanted to since these are the first and
    second expected arguments, as seen in the help page.
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们想省略 `x =` 和 `y =`，也是可以的，因为它们是前两个预期的参数，正如帮助页面中所示。
- en: 'Instead of defining our plot from scratch, we can also add a layer to the `p`
    object that was defined above as `p <- ggplot(data = murders)`:'
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: 除了从头开始定义我们的图表外，我们还可以向上面定义的 `p` 对象添加一个层：
- en: '[PRE8]'
  id: totrans-53
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: '![](../Images/386827274d3fa4320b91fc25872c63c9.png)'
  id: totrans-54
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/386827274d3fa4320b91fc25872c63c9.png)'
- en: 'The scale and labels are defined by default when adding this layer. Like **dplyr**
    functions, `aes` also uses the variable names from the object component: we can
    use `population` and `total` without having to call them as `murders$population`
    and `murders$total`. The behavior of recognizing the variables from the data component
    is quite specific to `aes`. With most functions, if you try to access the values
    of `population` or `total` outside of `aes` you receive an error.'
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: 添加此层时，刻度和标签默认定义。与 **dplyr** 函数一样，`aes` 也使用对象组件中的变量名称：我们可以使用 `population` 和 `total`，而无需将它们作为
    `murders$population` 和 `murders$total` 调用。从数据组件中识别变量的行为对 `aes` 来说是相当具体的。在大多数函数中，如果您尝试在
    `aes` 之外访问 `population` 或 `total` 的值，您将收到错误。
- en: 8.5 Layers
  id: totrans-56
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 8.5 层
- en: A second layer in the plot we wish to make involves adding a label to each point
    to identify the state. The `geom_label` and `geom_text` functions permit us to
    add text to the plot with and without a rectangle behind the text, respectively.
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: 我们希望在图表中添加的第二层涉及为每个点添加标签以识别州。`geom_label` 和 `geom_text` 函数允许我们在有和无矩形背景的情况下将文本添加到图表中。
- en: 'Because each point (each state in this case) has a label, we need an aesthetic
    mapping to make the connection between points and labels. By reading the help
    file, we learn that we supply the mapping between point and label through the
    `label` argument of `aes`. So the code looks like this:'
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 因为每个点（在这个例子中是每个状态）都有一个标签，我们需要一个美学映射来在点和标签之间建立联系。通过阅读帮助文件，我们了解到我们通过`aes`函数的`label`参数提供点与标签之间的映射。所以代码看起来是这样的：
- en: '[PRE9]'
  id: totrans-59
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: '![](../Images/33d613ec9b953d3a3c5eb4189aaa53d8.png)'
  id: totrans-60
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/33d613ec9b953d3a3c5eb4189aaa53d8.png)'
- en: We have successfully added a second layer to the plot.
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: 我们已经成功地为图表添加了第二层。
- en: 'As an example of the unique behavior of `aes` mentioned above, note that this
    call:'
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: 作为上述`aes`独特行为的例子，请注意以下调用：
- en: '[PRE10]'
  id: totrans-63
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: 'is fine, whereas this call:'
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: 是可以的，而第二个调用：
- en: '[PRE11]'
  id: totrans-65
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: will give you an error since `abb` is not found because it is outside of the
    `aes` function. The layer `geom_text` does not know where to find `abb` since
    it is a column name and not a global variable.
  id: totrans-66
  prefs: []
  type: TYPE_NORMAL
  zh: 将会给出错误，因为`abb`没有找到，因为它在`aes`函数之外。层`geom_text`不知道在哪里找到`abb`，因为它是一个列名，而不是全局变量。
- en: 8.5.1 Tinkering with arguments
  id: totrans-67
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 8.5.1 参数调整
- en: 'Each geometry function has many arguments other than `aes` and `data`. They
    tend to be specific to the function. For example, in the plot we wish to make,
    the points are larger than the default size. In the help file we see that `size`
    is an aesthetic and we can change it like this:'
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
  zh: 每个几何函数都有许多除了`aes`和`data`之外的参数。它们通常特定于该函数。例如，在我们想要制作的图表中，点的大小比默认大小要大。在帮助文件中我们看到`size`是一个美学参数，我们可以这样更改它：
- en: '[PRE12]'
  id: totrans-69
  prefs: []
  type: TYPE_PRE
  zh: '[PRE12]'
- en: '![](../Images/8828f704be1c414e5cf4e07c634fac08.png)'
  id: totrans-70
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/8828f704be1c414e5cf4e07c634fac08.png)'
- en: '`size` is **not** a mapping: whereas mappings use data from specific observations
    and need to be inside `aes()`, operations we want to affect all the points the
    same way do not need to be included inside `aes`.'
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: '`size`不是一个映射：映射使用特定观察的数据，需要包含在`aes()`中，而我们要影响所有点相同方式的操作则不需要包含在`aes`中。'
- en: 'Now because the points are larger it is hard to see the labels. If we read
    the help file for `geom_text`, we see the `nudge_x` argument, which moves the
    text slightly to the right or to the left:'
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: 现在因为点变大了，标签就难以看到了。如果我们阅读`geom_text`的帮助文件，我们会看到`nudge_x`参数，它可以稍微将文本向右或向左移动：
- en: '[PRE13]'
  id: totrans-73
  prefs: []
  type: TYPE_PRE
  zh: '[PRE13]'
- en: '![](../Images/025635373efb57faa8137bf99d36d570.png)'
  id: totrans-74
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/025635373efb57faa8137bf99d36d570.png)'
- en: This is preferred as it makes it easier to read the text. In Section [8.11](ggplot2.html#add-on-packages)
    we learn a better way of assuring we can see the points and the labels.
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: 这样做更易于阅读。在[8.11](ggplot2.html#add-on-packages)节中，我们了解到一种更好的确保我们可以看到点和标签的方法。
- en: 8.6 Global versus local aesthetic mappings
  id: totrans-76
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 8.6 全局与局部美学映射
- en: 'In the previous line of code, we define the mapping `aes(population/10^6, total)`
    twice, once in each geometry. We can avoid this by using a *global* aesthetic
    mapping. We can do this when we define the blank slate `ggplot` object. Remember
    that the function `ggplot` contains an argument that permits us to define aesthetic
    mappings:'
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: 在上一行代码中，我们定义了映射`aes(population/10^6, total)`两次，一次在每个几何图形中。我们可以通过使用*全局*美学映射来避免这种情况。我们可以在定义空白`ggplot`对象时这样做。记住，`ggplot`函数包含一个允许我们定义美学映射的参数：
- en: '[PRE14]'
  id: totrans-78
  prefs: []
  type: TYPE_PRE
  zh: '[PRE14]'
- en: 'If we define a mapping in `ggplot`, all the geometries that are added as layers
    will default to this mapping. We redefine `p`:'
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们在`ggplot`中定义一个映射，所有作为层添加的几何图形都将默认使用此映射。我们重新定义`p`：
- en: '[PRE15]'
  id: totrans-80
  prefs: []
  type: TYPE_PRE
  zh: '[PRE15]'
- en: 'and then we can simply write the following code to produce the previous plot:'
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
  zh: 然后我们可以简单地写下以下代码来生成之前的图表：
- en: '[PRE16]'
  id: totrans-82
  prefs: []
  type: TYPE_PRE
  zh: '[PRE16]'
- en: We keep the `size` and `nudge_x` arguments in `geom_point` and `geom_text`,
    respectively, because we want to only increase the size of points and only nudge
    the labels. If we put those arguments in `aes` then they would apply to both plots.
    Also note that the `geom_point` function does not need a `label` argument and
    therefore ignores that aesthetic.
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
  zh: 我们在`geom_point`和`geom_text`中保留了`size`和`nudge_x`参数，因为我们只想增加点的大小，并且只想微调标签。如果我们将这些参数放在`aes`中，那么它们将应用于两个图表。另外，请注意，`geom_point`函数不需要`label`参数，因此忽略了这个美学参数。
- en: 'If necessary, we can override the global mapping by defining a new mapping
    within each layer. These *local* definitions override the *global*. Here is an
    example:'
  id: totrans-84
  prefs: []
  type: TYPE_NORMAL
  zh: 如果需要，我们可以在每个层内部定义一个新的映射来覆盖全局映射。这些*局部*定义会覆盖*全局*定义。以下是一个例子：
- en: '[PRE17]'
  id: totrans-85
  prefs: []
  type: TYPE_PRE
  zh: '[PRE17]'
- en: '![](../Images/73ad88f042857bc6a8cf74fdc7178246.png)'
  id: totrans-86
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/73ad88f042857bc6a8cf74fdc7178246.png)'
- en: Clearly, the second call to `geom_text` does not use `population` and `total`.
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: 明显地，第二个`geom_text`调用没有使用`population`和`total`。
- en: 8.7 Scales
  id: totrans-88
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 8.7 规模
- en: 'First, our desired scales are in log-scale. This is not the default, so this
    change needs to be added through a *scales* layer. A quick look at the cheat sheet
    reveals the `scale_x_continuous` function lets us control the behavior of scales.
    We use them like this:'
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
  zh: 首先，我们想要的尺度是对数尺度。这不是默认设置，因此这个更改需要通过一个 *scales* 层来添加。快速查看速查表显示 `scale_x_continuous`
    函数让我们可以控制尺度的行为。我们像这样使用它们：
- en: '[PRE18]'
  id: totrans-90
  prefs: []
  type: TYPE_PRE
  zh: '[PRE18]'
- en: '![](../Images/923b8abe8cb2ecb7de56db357f0dfcc5.png)'
  id: totrans-91
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/923b8abe8cb2ecb7de56db357f0dfcc5.png)'
- en: Because we are in the log-scale now, the *nudge* must be made smaller.
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: 因为我们现在处于对数尺度，所以 *nudge* 必须更小。
- en: 'This particular transformation is so common that **ggplot2** provides the specialized
    functions `scale_x_log10` and `scale_y_log10`, which we can use to rewrite the
    code like this:'
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: 这种特定的转换非常常见，因此 **ggplot2** 提供了专门的函数 `scale_x_log10` 和 `scale_y_log10`，我们可以用以下方式重写代码：
- en: '[PRE19]'
  id: totrans-94
  prefs: []
  type: TYPE_PRE
  zh: '[PRE19]'
- en: 8.8 Labels and titles
  id: totrans-95
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 8.8 标签和标题
- en: 'Similarly, the cheat sheet quickly reveals that to change labels and add a
    title, we use the following functions:'
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: 类似地，速查表迅速显示，要更改标签并添加标题，我们使用以下函数：
- en: '[PRE20]'
  id: totrans-97
  prefs: []
  type: TYPE_PRE
  zh: '[PRE20]'
- en: '![](../Images/17c21a7b69cbbfa52d068ebd5f9894e8.png)'
  id: totrans-98
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/17c21a7b69cbbfa52d068ebd5f9894e8.png)'
- en: We are almost there! All we have left to do is add color, a legend, and optional
    changes to the style.
  id: totrans-99
  prefs: []
  type: TYPE_NORMAL
  zh: 我们几乎完成了！我们剩下要做的就是添加颜色、图例以及可选的样式更改。
- en: 8.9 Categories as colors
  id: totrans-100
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 8.9 类别作为颜色
- en: 'We can change the color of the points using the `col` argument in the `geom_point`
    function. To facilitate demonstration of new features, we will redefine `p` to
    be everything except the points layer:'
  id: totrans-101
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以使用 `geom_point` 函数中的 `col` 参数更改点的颜色。为了便于演示新功能，我们将重新定义 `p` 为除了点层之外的所有内容：
- en: '[PRE21]'
  id: totrans-102
  prefs: []
  type: TYPE_PRE
  zh: '[PRE21]'
- en: 'and then test out what happens by adding different calls to `geom_point`. We
    can make all the points blue by adding the `color` argument:'
  id: totrans-103
  prefs: []
  type: TYPE_NORMAL
  zh: 然后，通过添加不同的 `geom_point` 调用来测试会发生什么。我们可以通过添加 `color` 参数将所有点变为蓝色：
- en: '[PRE22]'
  id: totrans-104
  prefs: []
  type: TYPE_PRE
  zh: '[PRE22]'
- en: '![](../Images/f8a48d7321d07cc6a1c5c7e86d901543.png)'
  id: totrans-105
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/f8a48d7321d07cc6a1c5c7e86d901543.png)'
- en: This, of course, is not what we want. We want to assign color depending on the
    geographical region. A nice default behavior of **ggplot2** is that if we assign
    a categorical variable to color, it automatically assigns a different color to
    each category and also adds a legend.
  id: totrans-106
  prefs: []
  type: TYPE_NORMAL
  zh: 当然，这并不是我们想要的。我们想要根据地理区域分配颜色。**ggplot2** 的一个很好的默认行为是，如果我们将一个分类变量分配给颜色，它将自动为每个类别分配不同的颜色，并添加一个图例。
- en: 'Since the choice of color is determined by a feature of each observation, this
    is an aesthetic mapping. To map each point to a color, we need to use `aes`. We
    use the following code:'
  id: totrans-107
  prefs: []
  type: TYPE_NORMAL
  zh: 由于颜色的选择是由每个观察到的特征决定的，这是一个美学映射。为了将每个点映射到颜色，我们需要使用 `aes`。我们使用以下代码：
- en: '[PRE23]'
  id: totrans-108
  prefs: []
  type: TYPE_PRE
  zh: '[PRE23]'
- en: '![](../Images/538e41381f4fec10745c98cfdc5cf936.png)'
  id: totrans-109
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/538e41381f4fec10745c98cfdc5cf936.png)'
- en: The `x` and `y` mappings are inherited from those already defined in `p`, so
    we do not redefine them. We also move `aes` to the first argument since that is
    where mappings are expected in this function call.
  id: totrans-110
  prefs: []
  type: TYPE_NORMAL
  zh: '`x` 和 `y` 映射是从 `p` 中继承的，因此我们不需要重新定义它们。我们还把 `aes` 移到第一个参数，因为在这个函数调用中期望映射在那里。'
- en: 'Here we see yet another useful default behavior: **ggplot2** automatically
    adds a legend that maps color to region. To avoid adding this legend we set the
    `geom_point` argument `show.legend = FALSE`.'
  id: totrans-111
  prefs: []
  type: TYPE_NORMAL
  zh: 在这里，我们看到了另一种有用的默认行为：**ggplot2** 自动添加一个图例，将颜色映射到区域。为了避免添加这个图例，我们设置 `geom_point`
    参数 `show.legend = FALSE`。
- en: 8.10 Annotation, shapes, and adjustments
  id: totrans-112
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 8.10 注释、形状和调整
- en: We often want to add shapes or annotation to figures that are not derived directly
    from the aesthetic mapping; examples include labels, boxes, shaded areas, and
    lines.
  id: totrans-113
  prefs: []
  type: TYPE_NORMAL
  zh: 我们经常想要向不是直接从美学映射中导出的图形添加形状或注释；例如，包括标签、框、阴影区域和线条。
- en: 'Here we want to add a line that represents the average murder rate for the
    entire country. Once we determine the per million rate to be \(r\), this line
    is defined by the formula: \(y = r x\), with \(y\) and \(x\) our axes: total murders
    and population in millions, respectively. In the log-scale this line turns into:
    \(\log(y) = \log(r) + \log(x)\). So in our plot it’s a line with slope 1 and intercept
    \(\log(r)\). To compute this value, we use our **dplyr** skills:'
  id: totrans-114
  prefs: []
  type: TYPE_NORMAL
  zh: 在这里，我们想要添加一条代表整个国家平均谋杀率的线。一旦我们确定每百万的比率是 \(r\)，这条线就由以下公式定义：\(y = r x\)，其中 \(y\)
    和 \(x\) 是我们的坐标轴：总谋杀数和百万人口，分别。在对数尺度上，这条线变成：\(\log(y) = \log(r) + \log(x)\)。因此，在我们的图表中，它是一条斜率为
    1，截距为 \(\log(r)\) 的线。为了计算这个值，我们使用我们的 **dplyr** 技能：
- en: '[PRE24]'
  id: totrans-115
  prefs: []
  type: TYPE_PRE
  zh: '[PRE24]'
- en: 'To add a line we use the `geom_abline` function. **ggplot2** uses `ab` in the
    name to remind us we are supplying the intercept (`a`) and slope (`b`). The default
    line has slope 1 and intercept 0 so we only have to define the intercept:'
  id: totrans-116
  prefs: []
  type: TYPE_NORMAL
  zh: 要添加一行，我们使用`geom_abline`函数。**ggplot2**在名称中使用`ab`是为了提醒我们我们正在提供截距（`a`）和斜率（`b`）。默认线具有斜率1和截距0，因此我们只需定义截距：
- en: '[PRE25]'
  id: totrans-117
  prefs: []
  type: TYPE_PRE
  zh: '[PRE25]'
- en: '![](../Images/b72572cca75cb99fdb04e2edb051cb9f.png)'
  id: totrans-118
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/b72572cca75cb99fdb04e2edb051cb9f.png)'
- en: Here `geom_abline` does not use any information from the data object.
  id: totrans-119
  prefs: []
  type: TYPE_NORMAL
  zh: 在这里，`geom_abline`没有使用数据对象中的任何信息。
- en: We can change the line type and color of the lines using arguments. Also, we
    draw it first so it doesn’t go over our points.
  id: totrans-120
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以使用参数更改线的类型和颜色。此外，我们首先绘制它，这样它就不会覆盖我们的点。
- en: '[PRE26]'
  id: totrans-121
  prefs: []
  type: TYPE_PRE
  zh: '[PRE26]'
- en: Note that we have redefined `p` and used this new `p` below and in the next
    section.
  id: totrans-122
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，我们已经重新定义了`p`并在此以及下一节中使用了这个新的`p`。
- en: The default plots created by **ggplot2** are already very useful. However, we
    frequently need to make minor tweaks to the default behavior. Although it is not
    always obvious how to make these even with the cheat sheet, **ggplot2** is very
    flexible.
  id: totrans-123
  prefs: []
  type: TYPE_NORMAL
  zh: '**ggplot2**创建的默认图表已经非常有用。然而，我们经常需要对默认行为进行微调。尽管即使有作弊表，这些调整也不总是显而易见，但**ggplot2**非常灵活。'
- en: 'For example, we can make changes to the legend via the `scale_color_discrete`
    function. In our plot the word *region* is capitalized and we can change it like
    this:'
  id: totrans-124
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，我们可以通过`scale_color_discrete`函数更改图例。在我们的图中，“区域”一词被大写，我们可以这样更改它：
- en: '[PRE27]'
  id: totrans-125
  prefs: []
  type: TYPE_PRE
  zh: '[PRE27]'
- en: 8.11 Add-on packages
  id: totrans-126
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 8.11 添加包
- en: The power of **ggplot2** is augmented further due to the availability of add-on
    packages. The remaining changes needed to put the finishing touches on our plot
    require the **ggthemes** and **ggrepel** packages.
  id: totrans-127
  prefs: []
  type: TYPE_NORMAL
  zh: '**ggplot2**的强大功能因附加包的可用性而进一步增强。为了给我们的图表添加最后的修饰，我们需要**ggthemes**和**ggrepel**包。'
- en: 'The style of a **ggplot2** graph can be changed using the `theme` functions.
    Several themes are included as part of the **ggplot2** package. In fact, for most
    of the plots in this book, we use a function in the **dslabs** package that automatically
    sets a default theme:'
  id: totrans-128
  prefs: []
  type: TYPE_NORMAL
  zh: '**ggplot2**图形的样式可以使用`theme`函数进行更改。**ggplot2**包中包含几个主题。事实上，对于本书中的大多数图表，我们使用**dslabs**包中的一个函数来自动设置默认主题：'
- en: '[PRE28]'
  id: totrans-129
  prefs: []
  type: TYPE_PRE
  zh: '[PRE28]'
- en: 'Many other themes are added by the package **ggthemes**. Among those are the
    `theme_economist` theme that we used. After installing the package, you can change
    the style by adding a layer like this:'
  id: totrans-130
  prefs: []
  type: TYPE_NORMAL
  zh: '**ggthemes**包添加了许多其他主题。其中之一是我们使用的`theme_economist`主题。安装包后，您可以通过添加一个类似这样的层来更改样式：'
- en: '[PRE29]'
  id: totrans-131
  prefs: []
  type: TYPE_PRE
  zh: '[PRE29]'
- en: You can see how some of the other themes look by simply changing the function.
    For instance, you might try the `theme_fivethirtyeight()` theme instead.
  id: totrans-132
  prefs: []
  type: TYPE_NORMAL
  zh: 您可以通过简单地更改函数来查看其他主题的外观。例如，您可能会尝试使用`theme_fivethirtyeight()`主题。
- en: The final difference has to do with the position of the labels. In our plot,
    some of the labels fall on top of each other. The add-on package **ggrepel** includes
    a geometry that adds labels while ensuring that they don’t fall on top of each
    other. We simply change `geom_text` with `geom_text_repel`.
  id: totrans-133
  prefs: []
  type: TYPE_NORMAL
  zh: 最终的区别在于标签的位置。在我们的图表中，一些标签重叠在一起。附加包**ggrepel**包含一个几何形状，在添加标签的同时确保它们不会重叠。我们只需将`geom_text`更改为`geom_text_repel`。
- en: 8.12 Putting it all together
  id: totrans-134
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 8.12 将所有内容组合在一起
- en: Now that we are done testing, we can write one piece of code that produces our
    desired plot from scratch.
  id: totrans-135
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们完成了测试，我们可以编写一段代码，从头开始生成我们想要的图表。
- en: '[PRE30]'
  id: totrans-136
  prefs: []
  type: TYPE_PRE
  zh: '[PRE30]'
- en: '![](../Images/0c03cbf96dcf02ebcda923bb50b689ce.png)'
  id: totrans-137
  prefs: []
  type: TYPE_IMG
