- en: 8.13 Quick plots with `qplot`
  id: totrans-138
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 8.13 使用`qplot`快速绘图
- en: We have learned the powerful approach to generating visualization with ggplot.
    However, there are instances in which all we want is to make a quick plot of,
    for example, a histogram of the values in a vector, a scatterplot of the values
    in two vectors, or a boxplot using categorical and numeric vectors. We demonstrated
    how to generate these plots with `hist`, `plot`, and `boxplot`. However, if we
    want to keep consistent with the ggplot style, we can use the function `qplot`.
  id: totrans-139
  prefs: []
  type: TYPE_NORMAL
  zh: 我们已经学习了使用ggplot生成可视化的强大方法。然而，有些情况下我们只想快速绘制，例如，一个向量的值的直方图，两个向量的值的散点图，或使用分类和数值向量的箱线图。我们展示了如何使用`hist`、`plot`和`boxplot`生成这些图表。然而，如果我们想与ggplot风格保持一致，我们可以使用`qplot`函数。
- en: 'If we have values in two vectors, say:'
  id: totrans-140
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们在两个向量中有值，比如说：
- en: '[PRE31]'
  id: totrans-141
  prefs: []
  type: TYPE_PRE
  zh: '[PRE31]'
- en: 'and we want to make a scatterplot with ggplot, we would have to type something
    like:'
  id: totrans-142
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们想使用ggplot制作散点图，我们就必须输入类似以下的内容：
- en: '[PRE32]'
  id: totrans-143
  prefs: []
  type: TYPE_PRE
  zh: '[PRE32]'
- en: This seems like too much code for such a simple plot. The `qplot` function sacrifices
    the flexibility provided by the `ggplot` approach, but allows us to generate a
    plot quickly.
  id: totrans-144
  prefs: []
  type: TYPE_NORMAL
  zh: 这似乎为这样一个简单的图表编写了太多的代码。`qplot` 函数牺牲了 `ggplot` 方法提供的灵活性，但允许我们快速生成图表。
- en: '[PRE33]'
  id: totrans-145
  prefs: []
  type: TYPE_PRE
  zh: '[PRE33]'
- en: We will learn more about `qplot` in Section [9.8](dataviz-distributions.html#other-geometries)
  id: totrans-146
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将在第 [9.8](dataviz-distributions.html#other-geometries) 节中了解更多关于 `qplot` 的信息。
- en: 8.14 Grids of plots
  id: totrans-147
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 8.14 图表网格
- en: 'There are often reasons to graph plots next to each other. The **gridExtra**
    package permits us to do that:'
  id: totrans-148
  prefs: []
  type: TYPE_NORMAL
  zh: 经常会有理由将图表并排放置。`gridExtra` 包允许我们这样做：
