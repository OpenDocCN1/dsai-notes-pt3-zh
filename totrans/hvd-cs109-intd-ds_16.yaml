- en: 8.15 Exercises
  id: totrans-151
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 8.15 练习
- en: Start by loading the **dplyr** and **ggplot2** library as well as the `murders`
    and `heights` data.
  id: totrans-152
  prefs: []
  type: TYPE_NORMAL
  zh: 首先，加载 **dplyr** 和 **ggplot2** 库以及 `murders` 和 `heights` 数据。
- en: '[PRE35]'
  id: totrans-153
  prefs: []
  type: TYPE_PRE
  zh: '[PRE35]'
- en: 1\. With **ggplot2** plots can be saved as objects. For example we can associate
    a dataset with a plot object like this
  id: totrans-154
  prefs: []
  type: TYPE_NORMAL
  zh: 1. 使用 **ggplot2**，可以将图表保存为对象。例如，我们可以将数据集与图表对象关联起来，如下所示
- en: '[PRE36]'
  id: totrans-155
  prefs: []
  type: TYPE_PRE
  zh: '[PRE36]'
- en: Because `data` is the first argument we don’t need to spell it out
  id: totrans-156
  prefs: []
  type: TYPE_NORMAL
  zh: 因为 `data` 是第一个参数，所以我们不需要明确写出。
- en: '[PRE37]'
  id: totrans-157
  prefs: []
  type: TYPE_PRE
  zh: '[PRE37]'
- en: 'and we can also use the pipe:'
  id: totrans-158
  prefs: []
  type: TYPE_NORMAL
  zh: 我们也可以使用管道：
- en: '[PRE38]'
  id: totrans-159
  prefs: []
  type: TYPE_PRE
  zh: '[PRE38]'
- en: What is class of the object `p`?
  id: totrans-160
  prefs: []
  type: TYPE_NORMAL
  zh: 对象 `p` 的类是什么？
- en: 2\. Remember that to print an object you can use the command `print` or simply
    type the object. Print the object `p` defined in exercise one and describe what
    you see.
  id: totrans-161
  prefs: []
  type: TYPE_NORMAL
  zh: 2. 记住，要打印一个对象，可以使用 `print` 命令或简单地键入对象。打印第一题中定义的对象 `p` 并描述你所看到的。
- en: Nothing happens.
  id: totrans-162
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 没有任何反应。
- en: A blank slate plot.
  id: totrans-163
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 一个空白图表。
- en: A scatterplot.
  id: totrans-164
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 散点图。
- en: A histogram.
  id: totrans-165
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 直方图。
- en: 3\. Using the pipe `|>`, create an object `p` but this time associated with
    the `heights` dataset instead of the `murders` dataset.
  id: totrans-166
  prefs: []
  type: TYPE_NORMAL
  zh: 3. 使用管道 `|>` 创建一个对象 `p`，但这次与 `heights` 数据集相关联，而不是 `murders` 数据集。
- en: 4\. What is the class of the object `p` you have just created?
  id: totrans-167
  prefs: []
  type: TYPE_NORMAL
  zh: 4. 你刚刚创建的对象 `p` 的类是什么？
- en: '5\. Now we are going to add a layer and the corresponding aesthetic mappings.
    For the murders data we plotted total murders versus population sizes. Explore
    the `murders` data frame to remind yourself what are the names for these two variables
    and select the correct answer. **Hint**: Look at `?murders`.'
  id: totrans-168
  prefs: []
  type: TYPE_NORMAL
  zh: 5. 现在我们将添加一个层和相应的美学映射。对于谋杀数据，我们绘制了总谋杀数与人口规模的关系。探索 `murders` 数据框以提醒自己这两个变量的名称，并选择正确的答案。**提示**：查看
    `?murders`。
- en: '`state` and `abb`.'
  id: totrans-169
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`state` 和 `abb`。'
- en: '`total_murders` and `population_size`.'
  id: totrans-170
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`total_murders` 和 `population_size`。'
- en: '`total` and `population`.'
  id: totrans-171
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`total` 和 `population`。'
- en: '`murders` and `size`.'
  id: totrans-172
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`murders` 和 `size`。'
- en: '6\. To create the scatterplot we add a layer with `geom_point`. The aesthetic
    mappings require us to define the x-axis and y-axis variables, respectively. So
    the code looks like this:'
  id: totrans-173
  prefs: []
  type: TYPE_NORMAL
  zh: 6. 要创建散点图，我们添加一个带有 `geom_point` 的层。美学映射要求我们分别定义 x 轴和 y 轴变量。所以代码看起来是这样的：
- en: '[PRE39]'
  id: totrans-174
  prefs: []
  type: TYPE_PRE
  zh: '[PRE39]'
- en: except we have to define the two variables `x` and `y`. Fill this out with the
    correct variable names.
  id: totrans-175
  prefs: []
  type: TYPE_NORMAL
  zh: 除了我们必须定义两个变量 `x` 和 `y`。用正确的变量名填写。
- en: '7\. Note that if we don’t use argument names, we can obtain the same plot by
    making sure we enter the variable names in the right order like this:'
  id: totrans-176
  prefs: []
  type: TYPE_NORMAL
  zh: 7. 注意，如果我们不使用参数名称，我们可以确保以正确的顺序输入变量名称，从而获得相同的图表，如下所示：
- en: '[PRE40]'
  id: totrans-177
  prefs: []
  type: TYPE_PRE
  zh: '[PRE40]'
- en: Remake the plot but now with total in the x-axis and population in the y-axis.
  id: totrans-178
  prefs: []
  type: TYPE_NORMAL
  zh: 重新绘制图表，但现在将总数放在 x 轴上，人口放在 y 轴上。
- en: 8\. If instead of points we want to add text, we can use the `geom_text()` or
    `geom_label()` geometries. The following code
  id: totrans-179
  prefs: []
  type: TYPE_NORMAL
  zh: 8. 如果我们想添加文本而不是点，我们可以使用 `geom_text()` 或 `geom_label()` 几何体。以下代码
- en: '[PRE41]'
  id: totrans-180
  prefs: []
  type: TYPE_PRE
  zh: '[PRE41]'
- en: 'will give us the error message: `Error: geom_label requires the following missing
    aesthetics: label`'
  id: totrans-181
  prefs: []
  type: TYPE_NORMAL
  zh: 将显示错误信息：`错误：geom_label需要以下缺失的美学属性：label`
- en: Why is this?
  id: totrans-182
  prefs: []
  type: TYPE_NORMAL
  zh: 为什么会这样？
- en: We need to map a character to each point through the label argument in aes.
  id: totrans-183
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我们需要通过 `aes` 中的标签参数将字符映射到每个点上。
- en: We need to let `geom_label` know what character to use in the plot.
  id: totrans-184
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我们需要让 `geom_label` 知道在图中使用什么字符。
- en: The `geom_label` geometry does not require x-axis and y-axis values.
  id: totrans-185
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`geom_label` 几何体不需要 x 轴和 y 轴值。'
- en: '`geom_label` is not a ggplot2 command.'
  id: totrans-186
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`geom_label` 不是一个 ggplot2 命令。'
- en: 9\. Rewrite the code above to use abbreviation as the label through `aes`
  id: totrans-187
  prefs: []
  type: TYPE_NORMAL
  zh: 9. 将上面的代码重写为使用缩写作为标签通过 `aes`
- en: 10\. Change the color of the labels to blue. How will we do this?
  id: totrans-188
  prefs: []
  type: TYPE_NORMAL
  zh: 10. 将标签的颜色改为蓝色。我们将如何做到这一点？
- en: Adding a column called `blue` to `murders`.
  id: totrans-189
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 向 `murders` 添加一个名为 `blue` 的列。
- en: Because each label needs a different color we map the colors through `aes`.
  id: totrans-190
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 因为每个标签需要不同的颜色，所以我们通过 `aes` 映射颜色。
- en: Use the `color` argument in `ggplot`.
  id: totrans-191
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 在 `ggplot` 中使用 `color` 参数。
- en: Because we want all colors to be blue, we do not need to map colors, just use
    the color argument in `geom_label`.
  id: totrans-192
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 因为我们想让所有颜色都是蓝色，所以我们不需要映射颜色，只需在`geom_label`中使用颜色参数即可。
- en: 11\. Rewrite the code above to make the labels blue.
  id: totrans-193
  prefs: []
  type: TYPE_NORMAL
  zh: 11. 将上面的代码重写，使标签颜色为蓝色。
- en: '12\. Now suppose we want to use color to represent the different regions. In
    this case which of the following is most appropriate:'
  id: totrans-194
  prefs: []
  type: TYPE_NORMAL
  zh: 12. 现在假设我们想用颜色来表示不同的区域。在这种情况下，以下哪个选项最合适：
- en: Adding a column called `color` to `murders` with the color we want to use.
  id: totrans-195
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 在`murders`中添加一个名为`color`的列，使用我们想要的颜色。
- en: Because each label needs a different color we map the colors through the color
    argument of `aes` .
  id: totrans-196
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 因为我们需要为每个标签指定不同的颜色，所以我们通过`aes`的颜色参数来映射颜色。
- en: Use the `color` argument in `ggplot`.
  id: totrans-197
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 在`ggplot`中使用`color`参数。
- en: Because we want all colors to be blue, we do not need to map colors, just use
    the color argument in `geom_label`.
  id: totrans-198
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 因为我们想让所有颜色都是蓝色，所以我们不需要映射颜色，只需在`geom_label`中使用颜色参数即可。
- en: 13\. Rewrite the code above to make the labels’ color be determined by the state’s
    region.
  id: totrans-199
  prefs: []
  type: TYPE_NORMAL
  zh: 13. 将上面的代码重写，使标签的颜色由州的区域决定。
- en: 14\. Now we are going to change the x-axis to a log scale to account for the
    fact the distribution of population is skewed. Let’s start by defining an object
    `p` holding the plot we have made up to now
  id: totrans-200
  prefs: []
  type: TYPE_NORMAL
  zh: 14. 现在我们将把x轴改为对数尺度，以考虑到人口分布是偏斜的事实。让我们首先定义一个对象`p`，它包含我们到目前为止制作的图表。
- en: '[PRE42]'
  id: totrans-201
  prefs: []
  type: TYPE_PRE
  zh: '[PRE42]'
- en: To change the y-axis to a log scale we learned about the `scale_x_log10()` function.
    Add this layer to the object `p` to change the scale and render the plot.
  id: totrans-202
  prefs: []
  type: TYPE_NORMAL
  zh: 要将y轴改为对数尺度，我们学习了`scale_x_log10()`函数。将这一层添加到对象`p`中，以更改尺度并渲染图表。
- en: 15\. Repeat the previous exercise but now change both axes to be in the log
    scale.
  id: totrans-203
  prefs: []
  type: TYPE_NORMAL
  zh: 15. 重复之前的练习，但现在将两个轴都改为对数尺度。
- en: '16\. Now edit the code above to add the title “Gun murder data” to the plot.
    Hint: use the `ggtitle` function.'
  id: totrans-204
  prefs: []
  type: TYPE_NORMAL
  zh: 16. 现在编辑上面的代码，向图表添加标题“枪支谋杀数据”。提示：使用`ggtitle`函数。
