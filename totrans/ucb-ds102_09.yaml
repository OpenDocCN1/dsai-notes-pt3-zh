- en: '*You may find it helpful to read [Chapter 20](http://prob140.org/textbook/content/Chapter_20/00_Approaches_to_Estimation.html)
    and [Chapter 21](http://prob140.org/textbook/content/Chapter_21/00_The_Beta_and_the_Binomial.html)
    of the Data 140 textbook, which present a different exposition of similar material,
    but are **not** required prerequisites for this chapter.*'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: '*您可能发现阅读数据140教科书的第20章（[链接](http://prob140.org/textbook/content/Chapter_20/00_Approaches_to_Estimation.html)）和第21章（[链接](http://prob140.org/textbook/content/Chapter_21/00_The_Beta_and_the_Binomial.html)）会有所帮助，这两章提供了类似材料的另一种阐述，但它们**不是**本章的先决条件。*'
- en: 'We’ll begin our exploration of Bayesian and frequentist modeling with a simple
    example that highlights some key differences between the two approaches. Recall
    our setup: we observe some data <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">x_1, \ldots, x_n</annotation></semantics>x1​,…,xn​,
    and we’ll use them to estimate some parameter <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ of interest. In
    this and the following sections, we’ll focus on two simple examples to help us
    build intuition:'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将从一个简单的例子开始，这个例子突出了贝叶斯和频率主义方法之间的关键差异。回忆我们的设置：我们观察了一些数据 <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">x_1, \ldots, x_n</annotation></semantics>x1​,…,xn​，我们将使用它们来估计一些感兴趣的参数
    <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ。在本节和接下来的几节中，我们将关注两个简单的例子，以帮助我们建立直觉：
- en: '**Estimating product quality**: <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">x_1, \ldots, x_n</annotation></semantics>x1​,…,xn​
    are the reviews (👍/1 or 👎/0) for a product being sold online, and <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ is a number between
    0 and 1 that represents the probability of someone leaving a good review. Intuitively,
    <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    represents our estimate of the quality of the product.'
  id: totrans-6
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**估计产品质量**： <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">x_1,
    \ldots, x_n</annotation></semantics>x1​,…,xn​ 是在线销售产品的评价（👍/1 或 👎/0），而 <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ 是介于0和1之间的一个数字，代表某人留下好评的概率。直观上，<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ 代表我们对产品质量的估计。'
- en: '**Estimating average height**: <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">x_1, \ldots, x_n</annotation></semantics>x1​,…,xn​
    are the heights of <semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics>n
    individuals in a random sample, and <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ is the average height
    of individuals in the population.'
  id: totrans-7
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**估计平均身高**： <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">x_1,
    \ldots, x_n</annotation></semantics>x1​,…,xn​ 是随机样本中 <semantics><mrow><mi>n</mi></mrow><annotation
    encoding="application/x-tex">n</annotation></semantics>n 个个体的身高，而 <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ 是该群体中个体的平均身高。'
- en: We’ll start with the first example.
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 我们从第一个例子开始。
- en: Intuition and computation[¶](#intuition-and-computation "Link to this Section")
  id: totrans-9
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 直觉和计算[¶](#intuition-and-computation "链接到本节")
- en: 'Suppose you’re shopping for a new microwave. You find two choices, both of
    which cost about the same amount:'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 假设你在寻找一款新的微波炉。你找到了两个选择，它们的价格大致相同：
- en: Microwave A has three positive reviews and no negative reviews
  id: totrans-11
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 微波A有三个正面评价，没有负面评价
- en: Microwave B has 19 positive reviews and 1 negative review
  id: totrans-12
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 微波B有19个正面评价和1个负面评价
- en: Which one should you buy?
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 你应该买哪一个？
- en: Intuitively, there isn’t necessarily a right or wrong answer. But, in a scenario
    like this, most shoppers would probably prefer microwave B. Seeing more data points,
    even if one is negative, reassures us that the results we’re seeing in the reviews
    are consistent.
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 直观上，并不一定有正确或错误的答案。但在这种情况下，大多数购物者可能会更倾向于购买微波B。看到更多的数据点，即使有一个是负面的，也能让我们确信我们在评价中看到的结果是一致的。
- en: We’ll approach this question computationally from a frequentist and then a Bayesian
    perspective, and see how well each one can incorporate the intuition above.
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将从频率派和贝叶斯派的角度计算性地处理这个问题，并看看每个方法如何很好地结合上述直觉。
- en: 'When formulating a statistical model (regardless of choosing a Bayesian or
    frequentist approach), it’s important to choose a model so that the parameter
    we’re estimating satisfies the following criteria:'
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 当制定一个统计模型（无论选择贝叶斯派还是频率派方法）时，选择一个模型非常重要，以确保我们估计的参数满足以下标准：
- en: The parameter should reflect the underlying quantity that we’re interested in
    estimating. In this case, we’ll quantify how “good” each microwave is using <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ, and then we can
    just pick the microwave that’s “better” (i.e., has a higher value of <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ). Our choice above,
    the probability of leaving a positive review, satisfies this, since better products
    should be more likely to get positive reviews than worse products.
  id: totrans-17
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 参数应该反映我们感兴趣估计的潜在数量。在这种情况下，我们将使用 <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ 来量化每款微波炉的“好”程度，然后我们可以简单地选择“更好”的微波炉（即具有更高
    <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    值的微波炉）。我们上面的选择，留下正面评价的概率，满足这个条件，因为更好的产品应该比更差的产品更有可能获得正面评价。
- en: 'The parameter should fit clearly within our probability model: in other words,
    our probability model should relate the observed data and the parameter. We’ll
    see more about how this works shortly.'
  id: totrans-18
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 参数应该清楚地符合我们的概率模型：换句话说，我们的概率模型应该将观测数据与参数联系起来。我们很快就会看到这是如何工作的。
- en: Our goal will be to estimate and draw conclusions about the parameter <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ based on the observed
    data <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">x_1,
    \ldots, x_n</annotation></semantics>x1​,…,xn​.
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 我们的目标将是根据观测数据 <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">x_1,
    \ldots, x_n</annotation></semantics>x1​,…,xn​来估计和得出关于参数 <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ的结论。
- en: '[PRE1]'
  id: totrans-20
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: 'Frequentist parameter estimation: maximum likelihood[¶](#frequentist-parameter-estimation-maximum-likelihood
    "Link to this Section")'
  id: totrans-21
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 频率派参数估计：最大似然[¶](#frequentist-parameter-estimation-maximum-likelihood "链接到这个部分")
- en: Before we can actually do any parameter estimation, we need to first specify
    the relevant probability distributions. Recall that in the frequentist setting,
    we’re assuming that the data (our binary reviews, <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">x_1, \ldots, x_n</annotation></semantics>x1​,…,xn​)
    are random, but that the parameter (the probability of generating a positive review
    <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ)
    is fixed and unknown.
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 在我们实际上进行任何参数估计之前，我们首先需要指定相关的概率分布。回想一下，在频率派设定中，我们假设数据（我们的二元评论，<semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">x_1, \ldots, x_n</annotation></semantics>x1​,…,xn​）是随机的，但参数（生成正面评论的概率
    <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ）是固定且未知的。
- en: 'To set up a probability model in the frequentist setting, all we need is a
    **likelihood** <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(x_i|\theta)</annotation></semantics>p(xi​∣θ). This
    tells us how likely a data point is, given a certain value of <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ. Since our data
    are binary and our parameter is a number between 0 and 1, a natural choice is
    a **Bernoulli distribution** (for more on Bernoulli distributions, see the [Data
    140 textbook](http://prob140.org/textbook/content/Chapter_03/02_Distributions.html#named-distributions)
    or [Wikipedia](https://en.wikipedia.org/wiki/Bernoulli_distribution)):'
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 在频率派设定中建立概率模型，我们需要的只是一个**似然函数** <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(x_i|\theta)</annotation></semantics>p(xi​∣θ)。这告诉我们，在给定的<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ值下，数据点出现的可能性。由于我们的数据是二元的，而参数是介于0和1之间的一个数字，一个自然的选择是**伯努利分布**（有关伯努利分布的更多信息，请参阅[数据140教科书](http://prob140.org/textbook/content/Chapter_03/02_Distributions.html#named-distributions)或[维基百科](https://en.wikipedia.org/wiki/Bernoulli_distribution))：
- en: <semantics><mrow><msub><mi>x</mi><mi>i</mi></msub><mi mathvariant="normal">∣</mi><mi>θ</mi><mo>∼</mo><mrow><mi
    mathvariant="normal">B</mi><mi mathvariant="normal">e</mi><mi mathvariant="normal">r</mi><mi
    mathvariant="normal">n</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">u</mi><mi
    mathvariant="normal">l</mi><mi mathvariant="normal">l</mi><mi mathvariant="normal">i</mi></mrow><mo
    stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">x_i | \theta \sim \mathrm{Bernoulli}(\theta)</annotation></semantics>xi​∣θ∼Bernoulli(θ)[(1)](#BIhxXQDa3R
    "Link to this Equation")
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><msub><mi>x</mi><mi>i</mi></msub><mi mathvariant="normal">∣</mi><mi>θ</mi><mo>∼</mo><mrow><mi
    mathvariant="normal">B</mi><mi mathvariant="normal">e</mi><mi mathvariant="normal">r</mi><mi
    mathvariant="normal">n</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">u</mi><mi
    mathvariant="normal">l</mi><mi mathvariant="normal">l</mi><mi mathvariant="normal">i</mi></mrow><mo
    stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">x_i | \theta \sim \mathrm{Bernoulli}(\theta)</annotation></semantics>xi​∣θ∼Bernoulli(θ)[(1)](#BIhxXQDa3R
    "链接到这个方程")
- en: 'This notation means “conditioned on <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ, <semantics><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">x_i</annotation></semantics>xi​ follows a Bernoulli
    distribution with parameter <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ”.
    In other words:'
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: 这种符号表示“在<semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ的条件下，<semantics><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">x_i</annotation></semantics>xi​遵循参数为<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ的伯努利分布”。换句话说：
- en: <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo><mo>=</mo><mrow><mo
    fence="true">{</mo><mtable rowspacing="0.36em" columnalign="left left" columnspacing="1em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="false"><mi>θ</mi></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="false"><mrow><mtext> if </mtext><msub><mi>x</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="false"><mrow><mn>1</mn><mo>−</mo><mi>θ</mi></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="false"><mrow><mtext> if </mtext><msub><mi>x</mi><mi>i</mi></msub><mo>=</mo><mn>0</mn></mrow></mstyle></mtd></mtr></mtable></mrow></mrow><annotation
    encoding="application/x-tex">p(x_i|\theta) = \begin{cases} \theta & \text{ if
    }x_i = 1 \\ 1-\theta & \text{ if }x_i = 0 \end{cases}</annotation></semantics>p(xi​∣θ)={θ1−θ​ if xi​=1 if xi​=0​[(2)](#QIRW5T5Ir4
    "Link to this Equation")
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo><mo>=</mo><mrow><mo
    fence="true">{</mo><mtable rowspacing="0.36em" columnalign="left left" columnspacing="1em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="false"><mi>θ</mi></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="false"><mrow><mtext> if </mtext><msub><mi>x</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="false"><mrow><mn>1</mn><mo>−</mo><mi>θ</mi></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="false"><mrow><mtext> if </mtext><msub><mi>x</mi><mi>i</mi></msub><mo>=</mo><mn>0</mn></mrow></mstyle></mtd></mtr></mtable></mrow></mrow><annotation
    encoding="application/x-tex">p(x_i|\theta) = \begin{cases} \theta & \text{ if
    }x_i = 1 \\ 1-\theta & \text{ if }x_i = 0 \end{cases}</annotation></semantics>p(xi​∣θ)={θ1−θ​ if xi​=1 if xi​=0​[(2)](#QIRW5T5Ir4
    "Link to this Equation")
- en: '[PRE2]'
  id: totrans-27
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: Loading...
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: 'While the underlying probability should be familiar to you, there are some
    important conceptual leaps that we’ve taken:'
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: 虽然基础概率对你来说应该很熟悉，但我们已经进行了一些重要的概念跳跃：
- en: 'This notation represents a **parametric family** of distributions: different
    values of <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    lead to different distributions for <semantics><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">x_i</annotation></semantics>xi​, but they all fall
    within the Bernoulli family of distributions.'
  id: totrans-30
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 这种符号表示一个**参数族**分布：不同的<semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ值会导致<semantics><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">x_i</annotation></semantics>xi​的不同分布，但它们都属于伯努利分布族。
- en: 'Since our goal in this process is to find a “good” value of <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ using the observed
    data <semantics><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">x_i</annotation></semantics>xi​,
    we can view this as a function of <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ: for any value of
    <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    that we consider, we can plug in our data and get the probability of observing
    it, if that value of <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    were true.'
  id: totrans-31
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 由于我们在这个过程中旨在通过观察到的数据<semantics><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">x_i</annotation></semantics>xi​找到“良好”的<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ值，我们可以将其视为一个关于<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ的函数：对于任何我们考虑的<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ值，我们可以将我们的数据代入并得到如果该值是真实的，观察它的概率。
- en: 'The simplest way to estimate <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ in the frequentist
    setting is to use **maximum likelihood estimation (MLE)** and choose the value
    of <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    that maximizes the likelihood: in other words, we’ll pick the value of <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ that makes our data
    look as likely as possible.'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 在频率主义设定中，估计<semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ的最简单方法是使用**最大似然估计（MLE**）并选择使<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ最大化的值：换句话说，我们将选择使我们的数据看起来尽可能可能性的<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ的值。
- en: 'Here’s how we’ll go about it:'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将这样进行：
- en: We’ll write the likelihood for all the data points, <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">x_1, \ldots, x_n</annotation></semantics>x1​,…,xn​
    (we already did it for a single point above)
  id: totrans-34
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我们将写出所有数据点的似然，<semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">x_1,
    \ldots, x_n</annotation></semantics>x1​,…,xn​（我们已经在上面为单个点做了这件事）
- en: We’ll use the log-likelihood instead of the likelihood. This will make things
    a little easier computationally. Why is this okay? Because <semantics><mrow><mi>log</mi><mo>⁡</mo></mrow><annotation
    encoding="application/x-tex">\log</annotation></semantics>log is a monotonically
    increasing function, so the same value of <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ that maximizes <semantics><mrow><mi>log</mi><mo>⁡</mo><mo
    stretchy="false">(</mo><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\log(p(x|\theta))</annotation></semantics>log(p(x∣θ))
    also maximizes <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(x|\theta)</annotation></semantics>p(x∣θ).
  id: totrans-35
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我们将使用对数似然而不是似然。这会使计算稍微容易一些。为什么这是可以接受的？因为<semantics><mrow><mi>log</mi><mo>⁡</mo></mrow><annotation
    encoding="application/x-tex">\log</annotation></semantics>对数是一个单调递增函数，所以最大化<semantics><mrow><mi>log</mi><mo>⁡</mo><mo
    stretchy="false">(</mo><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\log(p(x|\theta))</annotation></semantics>对数(p(x∣θ))的相同<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ值也最大化了<semantics><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(x|\theta)</annotation></semantics>p(x∣θ)。
- en: To find the best value of <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ,
    we’ll take the derivative of the log-likelihood with respect to <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ, set it equal to
    0, and solve.
  id: totrans-36
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 为了找到<semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ的最佳值，我们将对对数似然相对于<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ的导数进行求导，将其设置为0，并求解。
- en: We’ll confirm that step 3 gave us a maximum (rather than a minimum) by computing
    the second derivative and confirming that it’s negative, and checking the boundaries.
  id: totrans-37
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我们将通过计算二阶导数并确认其为负值，以及检查边界来确认第3步给出了最大值（而不是最小值）。
- en: 1\. Writing the likelihood[¶](#id-1-writing-the-likelihood "Link to this Section")
  id: totrans-38
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '1. 编写似然[¶](#id-1-writing-the-likelihood "链接到本节") '
- en: 'Our likelihood for all the data points is:'
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: 我们所有数据点的似然是：
- en: <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(x_1, \ldots, x_n | \theta)</annotation></semantics>p(x1​,…,xn​∣θ)[(3)](#iv3UyIB13K
    "Link to this Equation")
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(x_1, \ldots, x_n | \theta)</annotation></semantics>p(x1​,…,xn​∣θ)[(3)](#iv3UyIB13K
    "链接到这个方程")
- en: 'We’ll assume that our samples are conditionally i.i.d. (independent and identically
    distributed) given the parameter <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ. In our example,
    this means that **if** we know how good the product is, then knowing one review
    doesn’t tell us anything about the other reviews. This means we can simplify our
    likelihood:'
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: 我们假设我们的样本在参数<semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ的条件下是条件独立同分布的（i.i.d.）。在我们的例子中，这意味着如果我们知道产品的质量如何，那么知道一条评论并不会告诉我们关于其他评论的任何信息。这意味着我们可以简化我们的似然函数：
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mi>p</mi><mo
    stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd></mtr></mtable><annotation encoding="application/x-tex">\begin{align}
    p(x_1, \ldots, x_n|\theta) &= \prod_{i=1}^n p(x_i|\theta) \end{align}</annotation></semantics>p(x1​,…,xn​∣θ)​=i=1∏n​p(xi​∣θ)​​[(4)](#SUpuhY5HRj
    "Link to this Equation")
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mi>p</mi><mo
    stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd></mtr></mtable><annotation encoding="application/x-tex">\begin{align}
    p(x_1, \ldots, x_n|\theta) &= \prod_{i=1}^n p(x_i|\theta) \end{align}</annotation></semantics>p(x1​,…,xn​∣θ)​=i=1∏n​p(xi​∣θ)​​[(4)](#SUpuhY5HRj
    "Link to this Equation")
- en: 'Next, we need to figure out a more mathematically convenient way to write the
    likelihood for an individual point, <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(x_i|\theta)</annotation></semantics>p(xi​∣θ), than
    the version we wrote in the previous section. Here’s an alternative way of writing
    it that means the same thing:'
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: 接下来，我们需要找出一种更便于数学表达的方式来书写单个点的似然函数，即<semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(x_i|\theta)</annotation></semantics>p(xi​∣θ)，比我们在上一节中写的那一种版本更方便。这里有一个表达相同意思的替代方法：
- en: <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>θ</mi><msub><mi>x</mi><mi>i</mi></msub></msup><mo
    stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>θ</mi><msup><mo stretchy="false">)</mo><mrow><mn>1</mn><mo>−</mo><msub><mi>x</mi><mi>i</mi></msub></mrow></msup></mrow><annotation
    encoding="application/x-tex">p(x_i|\theta) = \theta^{x_i}(1-\theta)^{1-x_i}</annotation></semantics>p(xi​∣θ)=θxi​(1−θ)1−xi​[(5)](#V7kp0iteCI
    "Link to this Equation")
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>θ</mi><msub><mi>x</mi><mi>i</mi></msub></msup><mo
    stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>θ</mi><msup><mo stretchy="false">)</mo><mrow><mn>1</mn><mo>−</mo><msub><mi>x</mi><mi>i</mi></msub></mrow></msup></mrow><annotation
    encoding="application/x-tex">p(x_i|\theta) = \theta^{x_i}(1-\theta)^{1-x_i}</annotation></semantics>p(xi​∣θ)=θxi​(1−θ)1−xi​[(5)](#V7kp0iteCI
    "Link to this Equation")
- en: Convince yourself that this is the same by plugging in <semantics><mrow><msub><mi>x</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">x_i=1</annotation></semantics>xi​=1 and <semantics><mrow><msub><mi>x</mi><mi>i</mi></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_i=0</annotation></semantics>xi​=0.
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: 通过将<semantics><mrow><msub><mi>x</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">x_i=1</annotation></semantics>xi​=1和<semantics><mrow><msub><mi>x</mi><mi>i</mi></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_i=0</annotation></semantics>xi​=0代入，来让自己相信这是相同的。
- en: 'Now that we have this notationally convenient way of writing it, when we multiply
    all of them together, the exponents add:'
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们有了这种便于书写的表达方式，当我们把它们全部相乘时，指数会相加：
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mi>p</mi><mo
    stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><msup><mi>θ</mi><msub><mi>x</mi><mi>i</mi></msub></msup><mo
    stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>θ</mi><msup><mo stretchy="false">)</mo><mrow><mn>1</mn><mo>−</mo><msub><mi>x</mi><mi>i</mi></msub></mrow></msup></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msup><mi>θ</mi><mrow><mo
    fence="true">[</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>x</mi><mi>i</mi></msub><mo
    fence="true">]</mo></mrow></msup><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>θ</mi><msup><mo
    stretchy="false">)</mo><mrow><mo fence="true">[</mo><munder><mo>∑</mo><mi>i</mi></munder><mo
    stretchy="false">(</mo><mn>1</mn><mo>−</mo><msub><mi>x</mi><mi>i</mi></msub><mo
    stretchy="false">)</mo><mo fence="true">]</mo></mrow></msup></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} p(x_1, \ldots, x_n|\theta) &= \prod_{i=1}^n
    p(x_i|\theta) \\ &= \prod_{i=1}^n \theta^{x_i}(1-\theta)^{1-x_i} \\ &= \theta^{\left[\sum_i
    x_i\right]}(1-\theta)^{\left[\sum_i (1-x_i)\right]} \\ \end{align}</annotation></semantics>p(x1​,…,xn​∣θ)​=i=1∏n​p(xi​∣θ)=i=1∏n​θxi​(1−θ)1−xi​=θ[∑i​xi​](1−θ)[∑i​(1−xi​)]​​[(6)](#o3KJBvNL6M
    "Link to this Equation")
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mi>p</mi><mo
    stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><msup><mi>θ</mi><msub><mi>x</mi><mi>i</mi></msub></msup><mo
    stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>θ</mi><msup><mo stretchy="false">)</mo><mrow><mn>1</mn><mo>−</mo><msub><mi>x</mi><mi>i</mi></msub></mrow></msup></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msup><mi>θ</mi><mrow><mo
    fence="true">[</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>x</mi><mi>i</mi></msub><mo
    fence="true">]</mo></mrow></msup><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>θ</mi><msup><mo
    stretchy="false">)</mo><mrow><mo fence="true">[</mo><munder><mo>∑</mo><mi>i</mi></munder><mo
    stretchy="false">(</mo><mn>1</mn><mo>−</mo><msub><mi>x</mi><mi>i</mi></msub><mo
    stretchy="false">)</mo><mo fence="true">]</mo></mrow></msup></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} p(x_1, \ldots, x_n|\theta) &= \prod_{i=1}^n
    p(x_i|\theta) \\ &= \prod_{i=1}^n \theta^{x_i}(1-\theta)^{1-x_i} \\ &= \theta^{\left[\sum_i
    x_i\right]}(1-\theta)^{\left[\sum_i (1-x_i)\right]} \\ \end{align}</annotation></semantics>概率分布函数
    p(x1​,…,xn​∣θ) 等于 i=1∏n​p(xi​∣θ)，等于 i=1∏n​θxi​(1−θ)1−xi​，等于 θ[∑i​xi​](1−θ)[∑i​(1−xi​)]，其中
    [(6)](#o3KJBvNL6M "Link to this Equation") 是方程的引用链接。
- en: 'The first exponent is simply the number of positive reviews, and the second
    exponent is simply the number of negative reviews. To simplify our expression,
    we’ll **let <semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k
    be the number of positive reviews** <semantics><mrow><mo fence="true">(</mo><mi>k</mi><mo>=</mo><msub><mo>∑</mo><mi>i</mi></msub><msub><mi>x</mi><mi>i</mi></msub><mo
    fence="true">)</mo></mrow><annotation encoding="application/x-tex">\left(k = \sum_i
    x_i\right)</annotation></semantics>(k=∑i​xi​), so that this becomes:'
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: 第一个指数简单表示正面评价的数量，第二个指数简单表示负面评价的数量。为了简化我们的表达式，我们将 **将 <semantics><mrow><mi>k</mi></mrow><annotation
    encoding="application/x-tex">k</annotation></semantics>k 定义为正面评价的数量** <semantics><mrow><mo
    fence="true">(</mo><mi>k</mi><mo>=</mo><msub><mo>∑</mo><mi>i</mi></msub><msub><mi>x</mi><mi>i</mi></msub><mo
    fence="true">)</mo></mrow><annotation encoding="application/x-tex">\left(k = \sum_i
    x_i\right)</annotation></semantics>(k=∑i​xi​)，因此表达式变为：
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msup><mi>θ</mi><mi>k</mi></msup><mo
    stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>θ</mi><msup><mo stretchy="false">)</mo><mrow><mi>n</mi><mo>−</mo><mi>k</mi></mrow></msup></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} p(x_1, \ldots, x_n|\theta) &= \theta^{k}(1-\theta)^{n-k}
    \\ \end{align}</annotation></semantics>p(x1​,…,xn​∣θ)​=θk(1−θ)n−k​​[(7)](#VQ9rBtrZaU
    "Link to this Equation")
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
