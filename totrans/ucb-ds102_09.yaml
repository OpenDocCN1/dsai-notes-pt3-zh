  type: TYPE_NORMAL
  zh: '**可选练习**：既然你已经看到了在正常先验 + 正态似然模型中先验参数的影响，现在请对上述后验分布中参数如何相互作用给出一个直观的解释，对于 <semantics><mrow><mi>p</mi><mo
