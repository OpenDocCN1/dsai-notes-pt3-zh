- en: 'Just as before, we can observe that the prior has a stronger effect when we
    have less data. We can also see that the posterior distribution becomes narrower
    as the amount of data increases. This is another general fact: **the more data
    we observe, the narrower our posterior distribution becomes.**'
  id: totrans-184
  prefs: []
  type: TYPE_NORMAL
  zh: 就像之前一样，我们可以观察到，当我们拥有较少数据时，先验参数的影响更强烈。我们还可以看到，随着数据量的增加，后验分布变得更加狭窄。这是另一个普遍的事实：**观察到的数据越多，我们的后验分布就越狭窄。**
- en: '**Optional Exercise**: now that you’ve seen the effect of the prior parameters
    in a normal prior + normal likelihood model, give an intuitive explanation of
    how the parameters interact in the posterior distribution above for <semantics><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mi mathvariant="normal">∣</mi><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><msub><mi>x</mi><mi>n</mi></msub><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(\theta | x_1, \ldots x_n)</annotation></semantics>p(θ∣x1​,…xn​).'
  id: totrans-185
