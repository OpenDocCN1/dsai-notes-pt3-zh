- en: Generalized Linear Models
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://data102.org/ds-102-book/content/chapters/03/glms](https://data102.org/ds-102-book/content/chapters/03/glms)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '[<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" width="1.25rem"
    height="1.25rem" class="myst-fm-license-cc-icon myst-fm-license-cc-icon-main inline-block
    mx-1"><title>Content License: Creative Commons Attribution Share Alike 4.0 International
    (CC-BY-SA-4.0)</title></svg><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
    width="1.25rem" height="1.25rem" class="myst-fm-license-cc-icon myst-fm-license-cc-icon-by
    inline-block mr-1"><title>Credit must be given to the creator</title></svg><svg
    viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" width="1.25rem" height="1.25rem"
    class="myst-fm-license-cc-icon myst-fm-license-cc-icon-sa inline-block mr-1"><title>Adaptations
    must be shared under the same terms</title></svg>](https://creativecommons.org/licenses/by-sa/4.0/)[](https://github.com/ds-102/ds-102-book
    "GitHub Repository: ds-102/ds-102-book")[](https://github.com/ds-102/ds-102-book/edit/main/ds-102-book/content/chapters/03/03_glms.ipynb
    "Edit This Page")'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: Generalized Linear Models[¶](#generalized-linear-models "Link to this Section")
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 'In this section, we’ll learn about an extension to linear regression called
    **generalized linear models**, or GLMs. In particular, GLMs are similar to linear
    regression, with two important extensions:'
  prefs: []
  type: TYPE_NORMAL
- en: Instead of using the result of <semantics><mrow><mi>X</mi><mi>β</mi></mrow><annotation
    encoding="application/x-tex">X\beta</annotation></semantics>Xβ as the average
    prediction, we’ll apply a nonlinear function called the inverse link function
    or <semantics><mrow><msup><mi>g</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow><annotation
    encoding="application/x-tex">g^{-1}</annotation></semantics>g−1 first, so that
    our average prediction becomes <semantics><mrow><msup><mi>g</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo
    stretchy="false">(</mo><mi>X</mi><mi>β</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">g^{-1}(X\beta)</annotation></semantics>g−1(Xβ). While
    we can use any arbitrary function here, we’ll see several examples that are particularly
    useful.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Instead of assuming a normal distribution around the average prediction as our
    model for the likelihood of the data, we’ll allow for arbitrary likelihood distributions
    (but still centered around the average prediction <semantics><mrow><msup><mi>g</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo
    stretchy="false">(</mo><mi>X</mi><mi>β</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">g^{-1}(X\beta)</annotation></semantics>g−1(Xβ)).
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: We’ll work through an example that demonstrates why these kinds of models are
    useful, and how choosing different inverse link functions and likelihood models
    can change the prediction results we get.
  prefs: []
  type: TYPE_NORMAL
- en: Linear Regression from Bayesian and frequentist perspectives[¶](#linear-regression-from-bayesian-and-frequentist-perspectives
    "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'For the rest of this section, we’ll work with a dataset that contains the number
    of wind turbines built in each state since the year 2000, focusing on Oklahoma.
    It contains the following columns:'
  prefs: []
  type: TYPE_NORMAL
- en: '`t_built`: the number of turbines built each year'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`t_cap`: the power capacity added that year'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`year`: the year, stored as the number of years since 2000'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`totals`: the total number of turbines in the state built since 2000'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`log_totals`: the log of the total.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: <details class="myst-dropdown rounded-md my-5 shadow dark:shadow-2xl dark:shadow-neutral-900
    overflow-hidden bg-gray-50 dark:bg-stone-800"><summary class="myst-dropdown-header
    m-0 text-lg font-medium py-1 min-h-[2em] pl-3 cursor-pointer hover:shadow-[inset_0_0_0px_30px_#00000003]
    dark:hover:shadow-[inset_0_0_0px_30px_#FFFFFF03] bg-gray-100 dark:bg-slate-900">Source</summary>
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]</details> Loading...'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 640x480 with 1 Axes>](../Images/5a2dc8011bb27ed9a3eff06ed206bd12.png)'
  prefs: []
  type: TYPE_IMG
- en: 'From looking at this data, we can immediately see that linear regression might
    not be a good fit: the relationship between the two variables seems exponential
    rather than linear. We can address this in one of two ways:'
  prefs: []
  type: TYPE_NORMAL
- en: Log-transform our output data, so that we’re predicting <semantics><mrow><mi>log</mi><mo>⁡</mo><mo
    stretchy="false">(</mo></mrow><annotation encoding="application/x-tex">\log(</annotation></semantics>log(turbine
    count<semantics><mrow><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">)</annotation></semantics>),
    and then use a linear model.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Incorporate the exponential relationship into our model.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: We’ll start with the first approach and see that it does reasonably well, and
    then see how GLMs can help us do even better by taking the second approach.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 640x480 with 1 Axes>](../Images/81aadc03c25922fb6eca67f9b845441e.png)'
  prefs: []
  type: TYPE_IMG
- en: With the exception of the outlier at the first year (<semantics><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">t=0</annotation></semantics>t=0, at the year 2000),
    a linear model seems like a good fit here.
  prefs: []
  type: TYPE_NORMAL
- en: Since linear regression is a statistical model where we are estimating an unknown
    (model coefficients) from random data, we can approach it from either a frequentist
    or Bayesian paradigm. Let’s see how a linear model for the log-counts will work
    under each of these settings.
  prefs: []
  type: TYPE_NORMAL
- en: 'Turbine Data Linear Regression: Frequentist Approach[¶](#turbine-data-linear-regression-frequentist-approach
    "Link to this Section")'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: In the frequentist paradigm, we treat our unknown coefficients as fixed, and
    estimate them using maximum likelihood (or similar techniques). While using `scikit-learn`
    as we saw in the previous section was a perfectly valid way to implement linear
    regression in a frequentist paradigm, it doesn’t support many of the generalized
    linear models we’ll want to use throughout this chapter. So, we’ll instead use
    the `statsmodels` package in this chapter (imported using `import statsmodels
    as sm`).
  prefs: []
  type: TYPE_NORMAL
- en: 'We’ll primarily use the `sm.GLM` class, which takes in an array or series for
    `y`, an array or dataframe for `X`, and a model family: we’ll explore more of
    these families later, but for now we’ll stick to OLS, which we can implement with
    `sm.families.Gaussian()`. In order include an intercept in our model, we need
    to augment our data by applying the `sm.add_constant()` function.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Here’s what the model above would look like:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE4]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE5]'
  prefs: []
  type: TYPE_PRE
- en: 'The model output shows us some useful information about the model at the top,
    and then information about the estimated coefficient(s) at the bottom:'
  prefs: []
  type: TYPE_NORMAL
- en: '`coef`, the coefficient itself,'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`std err`, the [standard error](https://en.wikipedia.org/wiki/Standard_error)
    (i.e., standard deviation of the estimator)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`z`, the <semantics><mrow><mi>z</mi></mrow><annotation encoding="application/x-tex">z</annotation></semantics>z-score
    for the coefficient for a hypothesis test where the null hypothesis states that
    it is 0,'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`P>|z|`, the <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p-value
    for the hypothesis test above, and'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`[0.025` and `0.975]`, the lower and upper bounds for a <semantics><mrow><mn>95</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">95\%</annotation></semantics>95%
    confidence interval for the estimated coefficient.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'This model tells us that we can predict the log of the number of turbines <semantics><mrow><mi>N</mi></mrow><annotation
    encoding="application/x-tex">N</annotation></semantics>N in any year <semantics><mrow><mi>t</mi></mrow><annotation
    encoding="application/x-tex">t</annotation></semantics>t as follows:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>log</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>N</mi><mo
    stretchy="false">)</mo><mo>=</mo><mn>3.26</mn><mo>+</mo><mn>0.30</mn><mo>×</mo><mi>t</mi></mrow><annotation
    encoding="application/x-tex">\log(N) = 3.26 + 0.30 \times t</annotation></semantics>log(N)=3.26+0.30×t[(1)](#fNH2RFSkBU
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: 'In most cases, we’re more interested in the actual turbine count, rather than
    the log: so, we can exponentiate both sides to obtain:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><mi>N</mi><mo>=</mo><msup><mi>e</mi><mn>3.26</mn></msup><msup><mi>e</mi><mrow><mn>0.3</mn><mi>t</mi></mrow></msup></mrow><annotation
    encoding="application/x-tex">N = e^{3.26} e^{0.3t}</annotation></semantics>N=e3.26e0.3t[(2)](#MmJOxRIjMG
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: This also tells us that according to this model, each year, the number of turbines
    is multiplied by <semantics><mrow><msup><mi>e</mi><mn>0.3</mn></msup></mrow><annotation
    encoding="application/x-tex">e^{0.3}</annotation></semantics>e0.3, or roughly
    1.35.
  prefs: []
  type: TYPE_NORMAL
- en: 'We can also visualize this prediction:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE6]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 640x480 with 1 Axes>](../Images/96fc0b2e9699ec8e9110fed72e68db4f.png)'
  prefs: []
  type: TYPE_IMG
- en: We can see that the predictions from this model are reasonable from 2000-2016,
    but then start to diverge from reality after that.
  prefs: []
  type: TYPE_NORMAL
- en: 'Turbine Data Linear Regression: Bayesian Approach[¶](#turbine-data-linear-regression-bayesian-approach
    "Link to this Section")'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '[PRE7]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: 'In the Bayesian paradigm, we treat our unknown coefficients as random, and
    compute the posterior distribution over them, conditioned on the data we observe.
    While we could implement the entire model in PyMC, the Bambi package provides
    a convenient layer on top of PyMC that lets us specify our models with less code.
    We’ll use the `bmb.Model` class, which takes a formula, a dataframe, and a model
    family (for now, we’ll stick with the `gaussian` family for OLS). The formula
    takes the form `y ~ predictor1 + predictor2 + ...`, where each variables is a
    column names from the provided dataframe. Here’s how we implement the model from
    above:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE8]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE9]'
  prefs: []
  type: TYPE_PRE
- en: Loading...Loading...
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]'
  prefs: []
  type: TYPE_PRE
- en: 'We can see the results using the `arviz` function `plot_posterior`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 2208x552 with 3 Axes>](../Images/99d9a8bd50ce36efa30a1578e5b8a56c.png)'
  prefs: []
  type: TYPE_IMG
- en: The first two rows each represent one coefficient. The third row, `log_totals_sigma`,
    is the estimated standard deviation of the data points around the average prediction.
    The left column shows the posterior distribution for that coefficient (by using
    [KDE](https://en.wikipedia.org/wiki/Kernel_density_estimation) on the histogram
    of samples), and the right shows the trajectory of samples obtained during HMC.
  prefs: []
  type: TYPE_NORMAL
- en: 'Looking at the posterior distribution for the coefficient of `year` (second
    row), we see that the results are similar to the frequentist version: the MAP
    and LMSE estimates are around 0.3, By examining the histogram, we should expect
    that under the posterior, this coefficient will usually be between 0.2 to 0.4,
    with values outside this range fairly unlikely. This uncertainty is reasonable:
    since we’re only estimating these coefficients from seventeen data points, it
    makes sense to have some uncertainty in the coefficients we estimate. Just as
    before, we can interpret these estimates in the context of the data: each year,
    the number of turbines increases by a multiplicative factor of about 1.3.'
  prefs: []
  type: TYPE_NORMAL
- en: 'When we use sampling for inference, we can think of each sample as one regression
    line: each sample has a value of `intercept`, a value of the coefficient for `year`,
    and an estimated <semantics><mrow><mi>σ</mi></mrow><annotation encoding="application/x-tex">\sigma</annotation></semantics>σ
    for the residuals. We can therefore plot each sample as a line:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE12]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE13]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 640x480 with 1 Axes>](../Images/613d6d6fa11d74708694b5c33e10e2d5.png)'
  prefs: []
  type: TYPE_IMG
- en: '[PRE14]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE15]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 640x480 with 1 Axes>](../Images/46bc131c377f6431203be7aea3322ec4.png)'
  prefs: []
  type: TYPE_IMG
- en: These plots help us see that many of the lines have too high of a slope in the
    log-scale, likely due to the outlier at <semantics><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">t=0</annotation></semantics>t=0. This corresponds
    to a too-fast exponential rise after 2016 when looking at the counts.
  prefs: []
  type: TYPE_NORMAL
- en: 'It’s important to note that this only shows us the uncertainty in the **average**
    prediction `intercept + coefficient * year`: it doesn’t show us the uncertainty
    in the variation around the average prediction. Specifically, remember that we
    obtain predictions in linear regression by assuming <semantics><mrow><mi>y</mi><mo>∼</mo><mi
    mathvariant="script">N</mi><mo stretchy="false">(</mo><mi>X</mi><mi>β</mi><mo
    separator="true">,</mo><msup><mi>σ</mi><mn>2</mn></msup><mi>I</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">y \sim \mathcal{N}(X\beta, \sigma^2 I)</annotation></semantics>y∼N(Xβ,σ2I).
    These lines show us the uncertainty in the average prediction <semantics><mrow><mi>X</mi><mi>β</mi></mrow><annotation
    encoding="application/x-tex">X\beta</annotation></semantics>Xβ, but don’t show
    us how large the estimated variance <semantics><mrow><mi>σ</mi></mrow><annotation
    encoding="application/x-tex">\sigma</annotation></semantics>σ is: we’ll come back
    to that later.'
  prefs: []
  type: TYPE_NORMAL
- en: '**Exercise**: *How might you construct similar plots to visualize the uncertainty
    for the frequentist results from earlier?*'
  prefs: []
  type: TYPE_NORMAL
- en: Where are the Priors?[¶](#where-are-the-priors "Link to this Section")
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
- en: You may have noticed that we just implemented a Bayesian model, but never specified
    any priors. In this case, Bambi chooses “sensible” defaults for us, inspired by
    the R library `rstanarm`. These defaults are chosen to be weak, uninformative
    priors that don’t encode much information about what the coefficients should be.
  prefs: []
  type: TYPE_NORMAL
- en: You can read more about these default choices at the [`rstanarm` documentation](https://cran.r-project.org/web/packages/rstanarm/vignettes/priors.html#default-weakly-informative-prior-distributions).
  prefs: []
  type: TYPE_NORMAL
- en: Linear regression summary[¶](#linear-regression-summary "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'We saw that linear regression can be implemented in both frequentist and Bayesian
    paradigms: at the end of the day, both approaches give us estimated coefficients,
    along with some measure of uncertainty. We can use those coefficients to interpret
    the model (as we saw above), and to make predictions for new data points.'
  prefs: []
  type: TYPE_NORMAL
- en: We saw that when making predictions with linear regression, we start by multiplying
    each feature by its corresponding coefficient, adding them all up to obtain an
    average prediction, and assuming some randomness around that average.
  prefs: []
  type: TYPE_NORMAL
- en: In order to determine the coefficients from data, we can take either a frequentist
    or Bayesian approach. In the frequentist paradigm, we estimated them using frequentist
    methods like MLE, and in the Bayesian paradigm we approximated the posterior distribution
    over the coefficients (conditioned on the observed data) using samples.
  prefs: []
  type: TYPE_NORMAL
- en: For the remainder of this chapter, we’ll move back and forth between frequentist
    and Bayesian paradigms to illustrate ideas in each one.
  prefs: []
  type: TYPE_NORMAL
- en: 'Beyond Linear Regression: GLMs[¶](#beyond-linear-regression-glms "Link to this
    Section")'
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'The regression model above works somewhat well for years before 2016, but it
    doesn’t account for the fact that the variable we’re predicting is a whole number
    (meaning that it takes values <semantics><mrow><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo
    separator="true">,</mo><mn>2</mn><mo separator="true">,</mo><mn>3</mn><mo separator="true">,</mo><mo>…</mo></mrow><annotation
    encoding="application/x-tex">0, 1, 2, 3, \ldots</annotation></semantics>0,1,2,3,…).
    When we say that <semantics><mrow><mi>y</mi><mi mathvariant="normal">∣</mi><mi>β</mi><mo>∼</mo><mi>N</mi><mo
    stretchy="false">(</mo><mi>X</mi><mi>β</mi><mo separator="true">,</mo><msup><mi>σ</mi><mn>2</mn></msup><mi>I</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">y|\beta
    \sim N(X\beta, \sigma^2 I)</annotation></semantics>y∣β∼N(Xβ,σ2I), and use log-transformed
    data for <semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y,
    we’re implicitly saying that <semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y
    can never be 0\. We’ll start by asking the question: can we use a different likelihood
    that is designed specifically for this kind of data? In answering this, we’ll
    explore two examples of generalized linear models: Poisson regression and negative
    binomial regression.'
  prefs: []
  type: TYPE_NORMAL
- en: Poisson regression[¶](#poisson-regression "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '*You may find it helpful to review [Section 7.1 of the Data 140 textbook](http://prob140.org/textbook/content/Chapter_07/01_Poisson_Distribution.html),
    which covers the Poisson distribution.*'
  prefs: []
  type: TYPE_NORMAL
- en: Recall that the [Poisson distribution](https://en.wikipedia.org/wiki/Poisson_distribution)
    is a distribution over counts and count-like values. It has one *positive* parameter
    <semantics><mrow><mi>λ</mi></mrow><annotation encoding="application/x-tex">\lambda</annotation></semantics>λ
    that represents its mean (and variance, too).
  prefs: []
  type: TYPE_NORMAL
- en: In Poisson regression, we’re going to assume a Poisson likelihood for each <semantics><mrow><msub><mi>y</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">y_i</annotation></semantics>yi​, and we’ll use the
    linear combination <semantics><mrow><msubsup><mi>x</mi><mi>i</mi><mi>T</mi></msubsup><mi>β</mi></mrow><annotation
    encoding="application/x-tex">x_i^T\beta</annotation></semantics>xiT​β to help
    determine the parameter. The Poisson distribution is only defined for positive
    values of the parameter, but <semantics><mrow><msubsup><mi>x</mi><mi>i</mi><mi>T</mi></msubsup><mi>β</mi></mrow><annotation
    encoding="application/x-tex">x_i^T\beta</annotation></semantics>xiT​β could be
    negative. There are several ways to make the possibly-negative value into a positive
    one so we can use it for the parameter (e.g., take absolute value, square, etc.),
    but inspired by our log-transformation of the outputs in the previous section,
    we’ll exponentiate.
  prefs: []
  type: TYPE_NORMAL
- en: 'So, we’ll use <semantics><mrow><mi>exp</mi><mo>⁡</mo><mo stretchy="false">(</mo><msubsup><mi>x</mi><mi>i</mi><mi>T</mi></msubsup><mi>β</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\exp(x_i^T
    \beta)</annotation></semantics>exp(xiT​β) as the mean. We can write out our likelihood
    for the observed data points <semantics><mrow><msub><mi>y</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">y_i</annotation></semantics>yi​:'
  prefs: []
  type: TYPE_NORMAL
- en: <semantics><mrow><msub><mi>y</mi><mi>i</mi></msub><mi mathvariant="normal">∣</mi><mi>β</mi><mo>∼</mo><mtext>Poisson</mtext><mo
    stretchy="false">(</mo><mi>exp</mi><mo>⁡</mo><mo stretchy="false">(</mo><msubsup><mi>x</mi><mi>i</mi><mi>T</mi></msubsup><mi>β</mi><mo
    stretchy="false">)</mo><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">y_i
    | \beta \sim \text{Poisson}(\exp(x_i^T \beta))</annotation></semantics>yi​∣β∼Poisson(exp(xiT​β))[(3)](#cOQTKqZPqd
    "Link to this Equation")
  prefs: []
  type: TYPE_NORMAL
- en: As before, we can use this likelihood model to estimate the coefficients <semantics><mrow><mi>β</mi></mrow><annotation
    encoding="application/x-tex">\beta</annotation></semantics>β in either a frequentist
    or Bayesian setting. In this section, we’ll choose to take a Bayesian approach,
    mostly so that we can take advantage of the function `plot_posterior_samples`
    that we wrote in the last section to help us visualize the uncertainty in our
    model.
  prefs: []
  type: TYPE_NORMAL
- en: 'Using Bambi, switching from linear regression to Poisson regression is quite
    straightforward:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE16]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE17]'
  prefs: []
  type: TYPE_PRE
- en: Loading...Loading...
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE18]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE19]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 1472x552 with 2 Axes>](../Images/3f307a3167c0017f20736334472b71f9.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Comparing this to the results from the Gaussian model, we can see that the
    posterior distributions for the two coefficients are **much** narrower. On top
    of that, the values of the coefficient for `year` seem much smaller: whereas before
    the posterior was centered around 0.3, now it looks like the entire distribution
    is narrowly distributed around 0.183.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE20]'
  prefs: []
  type: TYPE_PRE
- en: '`1.2008144080808307`'
  prefs: []
  type: TYPE_NORMAL
- en: 'This corresponds to only a <semantics><mrow><mn>20</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">20\%</annotation></semantics>20% average growth rate,
    compared to our <semantics><mrow><mn>35</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">35\%</annotation></semantics>35% average growth rate
    from the earlier model. The lower growth rate seems reasonable: recall that the
    resulting curve(s) from linear regression grew too fast, especially after 2016\.
    But, the degree of certainty in the results is concerning: given that we only
    have 17 data points, our results should have a lot more uncertainty in them. We
    can visualize how “overconfident” the model is by plotting each sample as a line/curve
    using the `plot_posterior_samples` function:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE21]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 640x480 with 1 Axes>](../Images/80ec845e3dfff799af61ff32b41b3907.png)'
  prefs: []
  type: TYPE_IMG
- en: '[PRE22]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 640x480 with 1 Axes>](../Images/c573b3e99375314e182204a095b772ec.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Just as before, it’s important to remember that these lines only show us the
    estimated uncertainty in the average prediction <semantics><mrow><mi>X</mi><mi>β</mi></mrow><annotation
    encoding="application/x-tex">X\beta</annotation></semantics>Xβ: we aren’t visualizing
    any of the uncertainty shown by the Poisson model itself.'
  prefs: []
  type: TYPE_NORMAL
- en: Why are the results so different?
  prefs: []
  type: TYPE_NORMAL
- en: Let’s think about the implicit assumptions we’re making when choosing a Poisson
    likelihood. In particular, one important property of the Poisson distribution
    is that its mean is equal to its variance. So, while the linear model could allow
    for an average prediction of <semantics><mrow><mi>log</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>N</mi><mo
    stretchy="false">)</mo><mo>=</mo><mn>4</mn></mrow><annotation encoding="application/x-tex">\log(N)
    = 4</annotation></semantics>log(N)=4 with a variance of 1.5, the Poisson distribution
    requires that the mean and variance must be the same.
  prefs: []
  type: TYPE_NORMAL
- en: 'This problem is compounded by the fact that the Poisson distribution is modeling
    the true counts rather than the log-counts: in other words, consider 2018, when
    the number of turbines was about 4000\. A Poisson distribution with mean 4000
    has a variance of 4000, or in other words, a standard deviation of only around
    63.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Clearly, the Poisson is a poor choice for fitting this data! When a model assumes
    a lower variance than is actually present in the data, like this Poisson model
    does, we say that the data are **overdispersed**: this means that they’re too
    spread out relative to the model’s assumptions). In order to solve this problem,
    we should choose a different distribution that gives us the ability to control
    the variance as well as the mean.'
  prefs: []
  type: TYPE_NORMAL
- en: 'This wasn’t a problem with the normal likelihood earlier: because the normal
    distribution has two separate parameters for mean and variance, we can choose
    them separately to reflect the fact that the variance may be higher than the mean.'
  prefs: []
  type: TYPE_NORMAL
- en: Negative binomial regression[¶](#negative-binomial-regression "Link to this
    Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The [negative binomial distribution](https://en.wikipedia.org/wiki/Negative_binomial_distribution)
    is also a distribution over counts, but it allows for more complexity than the
    Poisson distribution. We can think of it one of two ways:'
  prefs: []
  type: TYPE_NORMAL
- en: It’s the sum of <semantics><mrow><mi>r</mi></mrow><annotation encoding="application/x-tex">r</annotation></semantics>r
    [Geometric random variables], each with parameter <semantics><mrow><mi>p</mi></mrow><annotation
    encoding="application/x-tex">p</annotation></semantics>p (success probability).
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: It’s like a Poisson distribution if the mean parameter (<semantics><mrow><mi>λ</mi></mrow><annotation
    encoding="application/x-tex">\lambda</annotation></semantics>λ above) were also
    random.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'There are several different ways to parametrize the negative binomial. How
    do we choose which one to use? There are two answers:'
  prefs: []
  type: TYPE_NORMAL
- en: We want a parametrization that lets us choose the mean, since we want the mean
    value for <semantics><mrow><msub><mi>y</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">y_i</annotation></semantics>yi​ to be <semantics><mrow><mi>exp</mi><mo>⁡</mo><mo
    stretchy="false">(</mo><msubsup><mi>x</mi><mi>i</mi><mi>T</mi></msubsup><mi>β</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\exp(x_i^T
    \beta)</annotation></semantics>exp(xiT​β) (in other words, we want to do almost
    the same thing as we just did with Poisson regression, but we want to use a negative
    binomial distribution instead of a Poisson distribution for the observed values).
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Since we’re using PyMC through Bambi, we’re limited to whichever parametrization(s)
    it supports.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'Even though the form of the distribution is significantly more complex and
    manipulating it involves more work, using it in our regression model requires
    only a tiny change to what we were doing before:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE23]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE24]'
  prefs: []
  type: TYPE_PRE
- en: Loading...Loading...
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE25]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE26]'
  prefs: []
  type: TYPE_PRE
- en: '`63.245553203367585`'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE27]'
  prefs: []
  type: TYPE_PRE
- en: Loading...
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE28]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 2208x552 with 3 Axes>](../Images/f5403174c4c2c66066796ea46632b885.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Here, the posterior distribution for the `year` coefficient has a wider spread,
    and the mean is around 0.24:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE29]'
  prefs: []
  type: TYPE_PRE
- en: '`1.2712491503214047`'
  prefs: []
  type: TYPE_NORMAL
- en: 'This corresponds to a growth rate around 27%. We can visualize the uncertainty
    in our inference for the coefficients:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE30]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 640x480 with 1 Axes>](../Images/72d145ed19aed414a8ab915efb3deb63.png)'
  prefs: []
  type: TYPE_IMG
- en: '[PRE31]'
  prefs: []
  type: TYPE_PRE
- en: '![<Figure size 640x480 with 1 Axes>](../Images/0ffd2cf42b64e18b4acda3c8c586a4c0.png)'
  prefs: []
  type: TYPE_IMG
- en: 'This seems to be a much better overall fit: the uncertainty in the various
    lines/curves matches up with the observed data, indicating that most of the prediction
    lines are somewhat reasonable given the observed data. It’s important once again
    to remember that the uncertainty visualized here is only in the average prediction,
    and that we aren’t visualizing the uncertainty in the estimated variance from
    the negative binomial model.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Comparing the Poisson model and the negative binomial model, both are very
    similar:'
  prefs: []
  type: TYPE_NORMAL
- en: oth models took a linear combination of the features and coefficients, with
    somewhat similar coefficient values
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Both models transformed the result of the linear combination using an exponential
    function
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'The key difference was our likelihood model for the observed data points around
    the average prediction: the Poisson model assumed a Poisson distribution, whose
    variance is determined by the mean. The negative binomial model, on the other
    hand, assumed a negative binomial distribution, whose variance could be inferred
    from the data as a separate variable in our model. This enabled the negative binomial
    model to better capture the uncertainty in the average prediction.'
  prefs: []
  type: TYPE_NORMAL
- en: '**Exercise**: *Implement Poisson and negative binomial regression in the frequentist
    paradigm using `statsmodels`. Are the results similar?*'
  prefs: []
  type: TYPE_NORMAL
- en: '*Hint: you may find it helpful to use `sm.families.Poisson()` and `sm.families.NegativeBinomial()`.*'
  prefs: []
  type: TYPE_NORMAL
- en: Generalized Linear Models[¶](#generalized-linear-models-1 "Link to this Section")
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'By now, you’ve seen four different versions of regression in the Bayesian setting:'
  prefs: []
  type: TYPE_NORMAL
- en: Linear regression, for predicting real-valued outputs
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Logistic regression, for predicting binary outputs (classification)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Poisson regression, for predicting counts
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Negative binomial regression, for predicting counts
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Let’s review what they had in common and what was different between them:'
  prefs: []
  type: TYPE_NORMAL
- en: For all four, computing our prediction for <semantics><mrow><msub><mi>y</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">y_i</annotation></semantics>yi​ begins with computing
    <semantics><mrow><msubsup><mi>x</mi><mi>i</mi><mi>T</mi></msubsup><mi>β</mi></mrow><annotation
    encoding="application/x-tex">x_i^T \beta</annotation></semantics>xiT​β. This part
    is a *linear* function of <semantics><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">x_i</annotation></semantics>xi​, even if we do something
    nonlinear with it later.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'Each one had a different function that we used to compute the average value
    of <semantics><mrow><msub><mi>y</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">y_i</annotation></semantics>yi​
    from <semantics><mrow><msubsup><mi>x</mi><mi>i</mi><mi>T</mi></msubsup><mi>β</mi></mrow><annotation
    encoding="application/x-tex">x_i^T \beta</annotation></semantics>xiT​β. Since
    this function links the linearly transformed input <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x to the output <semantics><mrow><mi>y</mi></mrow><annotation
    encoding="application/x-tex">y</annotation></semantics>y, you might expect us
    to call it the **link function**: this would make a lot of sense. However, the
    convention is to do the opposite, and call it the **inverse link function**. As
    you might expect from this name, the **link function** is the inverse of the inverse
    link function.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: For each one, we used a different distribution for the likelihood of the data
    points. In all cases, the the mean of this distribution was always output of the
    inverse link function above.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'The following table summarizes the different choices of likelihood and link
    function for the four versions that we’ve seen:'
  prefs: []
  type: TYPE_NORMAL
- en: '| Regression | Inverse link function | Link function | Likelihood |'
  prefs: []
  type: TYPE_TB
- en: '| Linear | identity | identity | Gaussian |'
  prefs: []
  type: TYPE_TB
- en: '| Logistic | sigmoid | [logit](https://en.wikipedia.org/wiki/Logit) | Bernoulli
    |'
  prefs: []
  type: TYPE_TB
- en: '| Poisson | exponential | log | Poisson |'
  prefs: []
  type: TYPE_TB
- en: '| Negative binomial | exponential | log | Negative binomial |'
  prefs: []
  type: TYPE_TB
- en: These ideas form the basis for what are known as Generalized Linear Models,
    or GLMs. Once we choose a link function and a likelihood distribution, our model
    is fully specified, and we can approximate the posterior distribution over the
    coefficients in <semantics><mrow><mi>β</mi></mrow><annotation encoding="application/x-tex">\beta</annotation></semantics>β.
  prefs: []
  type: TYPE_NORMAL
- en: GLM Workflow[¶](#glm-workflow "Link to this Section")
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'When making predictions with a GLM, here’s a general sequence to follow:'
  prefs: []
  type: TYPE_NORMAL
- en: '**Formulate your prediction problem** by determining what you’re trying to
    predict (<semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y)
    and what you’re using to predict it (<semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x). This depends on the
    real-world problem that you’re trying to solve, and what data might be available
    to help you solve it.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '**Gather training data** in the form of <semantics><mrow><mo stretchy="false">(</mo><mi>x</mi><mo
    separator="true">,</mo><mi>y</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">(x, y)</annotation></semantics>(x,y) pairs. This
    may require searching through publicly available data, private or proprietary
    datasets you have access to, or even going out and gathering new data or paying
    for data to be gathered. It’s important to make sure that any data <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x that you gather will
    be useful in predicting <semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y.
    At this step, it’s also helpful to determine any features you may want to compute,
    especially features that might be derived from existing columns in <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '**Choose a link function and likelihood model** that make sense for your data.
    For example, if your output is binary, then logistic regression might make sense.
    If your outputs are count-valued, then Poisson or negative binomial regression
    might be a good fit. You can see more possibilities at the [Wikipedia page for
    generalized linear models](https://en.wikipedia.org/wiki/Generalized_linear_model#Link_function).'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '**Fit the model using training data**: this usually involves using Bambi, statsmodels,
    or `scikit-learn` or another package to computationally determine the coefficients
    of the model that work on the training dataset.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '**Check that your model is actually a good fit for the data**: this step, often
    called model checking, involves making sure that the model makes and will make
    good predictions on your dataset. We’ll spend the next section exploring model
    checking.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '**Interpret the coefficients**: one benefit of GLMs is that the coefficients
    have an intuitive interpretation. In linear regression, a coefficient tells us
    how much the output is predicted to increase if the corresponding predictor increases
    by a certain amount. We saw earlier in this section that in Poisson and negative
    binomial regression (or in linear regression with log-transformed <semantics><mrow><mi>y</mi></mrow><annotation
    encoding="application/x-tex">y</annotation></semantics>y-values), the coefficients
    indicate a multiplicative increase by a factor of <semantics><mrow><mi>exp</mi><mo>⁡</mo><mo
    stretchy="false">(</mo><mi>β</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\exp(\beta)</annotation></semantics>exp(β). In logistic
    regression, the coefficients tell us how much the log-odds increases.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '**Generate new predictions** from new <semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x-values for new data where
    <semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y
    is unknown. Usually, we use prediction models to help us make predictions for
    future data points. These predictions are made by multiplying the coefficients
    that we learned in step 4 by the predictors for the new points and applying the
    inverse link function. This is usually handled computationally: most packages
    that you can use to fit models also have the ability to predict for new data points.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '**Report uncertainty** for coefficients and new predictions: since we fit our
    models using random data that come with some inherent uncertainty, anything we
    derive from that data also has uncertainty. This includes the estimated coefficients
    that we fit in step 4 and interpreted in step 6, as well as the new predictions
    that we made in step 7\. We’ll spend more time on quantifying uncertainty later
    this chapter.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
