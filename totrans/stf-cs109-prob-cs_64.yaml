- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
- en: This demo used to be live. We now know that the delivery happened on Jan 23rd.
    Lets go back in time to Jan 1st and see what the probability looked like at that
    point.
  prefs: []
  type: TYPE_NORMAL
- en: What is the probability that Laura gives birth today (given that she hasn't
    given birth up until today)?
  prefs: []
  type: TYPE_NORMAL
- en: Today's DateDue Date
  prefs: []
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
- en: 'Probability of delivery today: **Probability of delivery in next 7 days: **Current
    days past due date: **days'
  prefs: []
  type: TYPE_NORMAL
- en: Unconditioned probability mass before today:******
  prefs: []
  type: TYPE_NORMAL
- en: '********How likely is delivery, in humans, relative to the due date? There
    have been millions of births which gives us a relatively good picture [[1](#cite1)].
    The length of human pregnancy varies by quite a lot! Have you heard that it is
    9 months? That is a rough, point estimate. The mean duration of pregnancy is 278.6
    days, and pregnancy length has a standard deviation (SD) of 12.5 days. This distribution
    is not normal, but roughly matches a "[skewed normal](https://en.wikipedia.org/wiki/Skew_normal_distribution)".
    This is a general probability mass function for the first pregnancy collected
    from hundreds of thousands of women (this PMF is very similar across demographics,
    but changes based on whether the woman has given birth before):'
  prefs: []
  type: TYPE_NORMAL
- en: '<canvas id="unconditionalPMF" style="max-height: 400px"></canvas>'
  prefs: []
  type: TYPE_NORMAL
- en: 'Of course, we have more information. Specifically, we know that Laura **hasn''t**
    given birth up until today (we will update this example when that changes). We
    also know that babies which are over 14 days late are "[induced](https://en.wikipedia.org/wiki/Labor_induction)"
    on day 14\. How likely is delivery given that we haven''t delivered up until today?
    Note that the y-axis is scalled differently:'
  prefs: []
  type: TYPE_NORMAL
- en: '<canvas id="conditionalPMF" style="max-height: 400px"></canvas>'
  prefs: []
  type: TYPE_NORMAL
- en: 'Let''s approach this problem formally using inference. First we introduce a
    random variable $D$ to represent the days after delivery that the baby is born.
    Note that $D$ can be negative if the baby is due before the due date. We can use
    Inference to update our belief in $D$ given our observation that we have not delivered
    yet: $$ \begin{align} \P(D = i | \text{No Baby Yet}) &= \frac{\P(\text{No Baby
    Yet} | D = i) \P(D = i)}{\P(\text{No Baby Yet})} \\ \end{align} $$'
  prefs: []
  type: TYPE_NORMAL
- en: $\P(\text{No Baby Yet} | D = i)$ is always either 1 or 0\. Note that conditioning
    on $D=i$ means we are being told the actual date of delivery. If the delivery
    hasn't happened yet (eg today is before $i$) then the probability of No Baby Yet
    is 1\. If the delivery has already happened (eg today is after $i$) then the probability
    of No Baby Yet is 0.
  prefs: []
  type: TYPE_NORMAL
- en: '$\P(D = i)$ is our prior belief (the probability of delivery dates based off
    historical data). $\P(\text{No Baby Yet})$ is the normalization constant. Instead
    of calculating it explicity, we can compute the numerators for each value of $i$.
    We can then normalize the distribution (compute the sum of the numerators, and
    divide every probability by this sum) in order to implicitly compute it. An equivalent
    (but more compute heavy) solution would be to expand $\P(\text{No Baby Yet})$
    using the law of total probability: $$ \P(\text{No Baby Yet}) = \sum_i \P(\text{No
    Baby Yet} | D = i) \P(D = i) $$'
  prefs: []
  type: TYPE_NORMAL
- en: 'How do we deal with the fact that babies are induced after $D = 14$? Well we
    can adjust our prior so that all of the probability for days 14 and on is shifted
    to day 14\. This is equivalent to the following calculation: $$ \P(D = 14) = \sum_{i
    \geq 14} \P(D = i) $$'
  prefs: []
  type: TYPE_NORMAL
