- en: Extension Problem
  id: totrans-19
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 扩展问题
- en: Chris had two other good friends who had babies with the exact same due date
    (Really! This actually happened). What is the probability that all three babies
    are delivered on the exact same day?
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 克里斯还有两个其他的好朋友，他们的婴儿与他的预产期完全相同（真的！这确实发生了）。三个婴儿都在同一天出生的概率是多少？
- en: 'Probability of three couples on the same day:'
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 三对夫妇在同一天的概率：
- en: '**How did we get that number? Let $p_i$ be the probability that one baby is
    delivered on day $i$ -- this number can be read off the probability mass function.
    Let $D_i$ be the event that all three babies are delivered on day $i$. Note that
    the event $D_i$ is [mutually exclusive](../../part1/prob_or/) with the event that
    all three babies are born on another day (So for example, $D_1$ is mutually exclusive
    with $D_2$, $D_3$ etc). Let $N=3$ be the event that all babies are born on the
    same day: $$ \begin{align} \p(N=3) &= \sum_i \p(D_i) && \text{Since days are mutually
    exclusive} \\ &= \sum_i p_i^3 && \text{Since the three couples are independent}
    \end{align} $$**  *** * *'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: '**我们是如何得到这个数字的？设 $p_i$ 为一个婴儿在 $i$ 天出生的概率——这个数字可以从概率质量函数中读出。设 $D_i$ 为三个婴儿都在
    $i$ 天出生的事件。注意事件 $D_i$ 与三个婴儿在另一天出生的事件是[互斥的](../../part1/prob_or/)（例如，$D_1$ 与 $D_2$，$D_3$
    等等是互斥的）。设 $N=3$ 为所有婴儿在同一天出生的事件：$$ \begin{align} \p(N=3) &= \sum_i \p(D_i) && \text{因为天数是互斥的}
    \\ &= \sum_i p_i^3 && \text{因为三对夫妇是独立的} \end{align} $$**  *** * *'
