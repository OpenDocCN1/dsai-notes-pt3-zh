  prefs: []
  type: TYPE_TB
- en: '| The impact of vaccines on infectious disease rates | Data Visualization |  |'
  prefs: []
  type: TYPE_TB
- en: '| The financial crisis of 2007-2008 | Probability |  |'
  prefs: []
  type: TYPE_TB
- en: '| Election forecasting | Statistical Inference |  |'
  prefs: []
  type: TYPE_TB
- en: '| Reported student heights | Data Wrangling |  |'
