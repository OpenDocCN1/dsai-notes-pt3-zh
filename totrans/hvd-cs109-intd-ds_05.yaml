- en: Introduction
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook/introduction.html](https://rafalab.dfci.harvard.edu/dsbook/introduction.html)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: 'The demand for skilled data science practitioners in industry, academia, and
    government is rapidly growing. This book introduces concepts and skills that can
    help you tackle real-world data analysis challenges. It covers concepts from probability,
    statistical inference, linear regression, and machine learning. It also helps
    you develop skills such as R programming, data wrangling with **dplyr**, data
    visualization with **ggplot2**, algorithm building with **caret**, file organization
    with UNIX/Linux shell, version control with Git and GitHub, and reproducible document
    preparation with **knitr** and R markdown. The book is divided into six parts:
    **R**, **Data Visualization**, **Data Wrangling**, **Statistics with R**, **Machine
    Learning**, and **Productivity Tools**. Each part has several chapters meant to
    be presented as one lecture and includes dozens of exercises distributed across
    chapters.'
  prefs: []
  type: TYPE_NORMAL
- en: Case studies
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'Throughout the book, we use motivating case studies. In each case study, we
    try to realistically mimic a data scientist’s experience. For each of the concepts
    covered, we start by asking specific questions and answer these through data analysis.
    We learn the concepts as a means to answer the questions. Examples of the case
    studies included in the book are:'
  prefs: []
  type: TYPE_NORMAL
- en: '| Case Study | Concept |  |'
  prefs: []
  type: TYPE_TB
- en: '| --- | --- | --- |'
  prefs: []
  type: TYPE_TB
