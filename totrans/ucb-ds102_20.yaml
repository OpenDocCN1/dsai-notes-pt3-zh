- en: Definitions[¶](#definitions "Link to this Section")
  id: totrans-3
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 定义[¶](#definitions "链接至此章节")
- en: 'The terms “parametric” and “nonparametric” have several different meanings.
    We’ll define two, and only focus on one of them:'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: “参数化”和“非参数化”这两个术语有多种不同的含义。我们将定义其中两种，并只关注其中之一：
- en: '**Definition 1 (more often used in statistics): this is the version we’ll focus
    on in Data 102**'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: '**定义 1（统计学中更常用）：这是我们在 Data 102 课程中重点关注的定义**'
- en: 'A **parametric** method is one where we make specific assumptions about the
    relationships between data points: for example, in linear regression, we assume
    that the target variable <semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y
    is a linear function of the input predictors <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">x_1, \ldots, x_n</annotation></semantics>x1​,…,xn​'
  id: totrans-6
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 一种**参数化**方法是指我们对数据点之间的关系做出特定假设：例如，在线性回归中，我们假设目标变量 <semantics><mrow><mi>y</mi></mrow><annotation
    encoding="application/x-tex">y</annotation></semantics>y 是输入预测变量 <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">x_1, \ldots, x_n</annotation></semantics>x1​,…,xn​
    的线性函数。
- en: 'A **nonparametric** method is one where we do not make any assumptions about
    the relationships between the target and predictor variables: instead, we only
    aim to find the best possible way to make predictions.'
  id: totrans-7
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 一种**非参数化**方法是指我们不对目标变量与预测变量之间的关系做任何假设：相反，我们只致力于找到进行预测的最佳可能方式。
- en: 'According to this definition, linear regression is an example of a parametric
    method, because we assume (a) a linear relationship between predictors, coefficients,
    and outcome, and (b) [homoscedastic](https://en.wikipedia.org/wiki/Homoscedasticity_and_heteroscedasticity)
    normally-distributed noise around the average prediction. On the other hand, <semantics><mrow><mi>k</mi></mrow><annotation
    encoding="application/x-tex">k</annotation></semantics>k-nearest neighbors is
    an example of a nonparametric method: instead of making any assumptions about
    the distribution of <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x
    or <semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y,
    our prediction is based only on the <semantics><mrow><mi>k</mi></mrow><annotation
    encoding="application/x-tex">k</annotation></semantics>k nearest neighbors in
    the training set.'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 根据此定义，线性回归是参数方法的一个例子，因为我们假设（a）预测变量、系数和结果之间存在线性关系，并且（b）平均预测周围存在[同方差性](https://en.wikipedia.org/wiki/Homoscedasticity_and_heteroscedasticity)的正态分布噪声。另一方面，<semantics><mrow><mi>k</mi></mrow><annotation
    encoding="application/x-tex">k</annotation></semantics>k近邻是非参数方法的一个例子：我们不对<semantics><mrow><mi>x</mi></mrow><annotation
    encoding="application/x-tex">x</annotation></semantics>x或<semantics><mrow><mi>y</mi></mrow><annotation
    encoding="application/x-tex">y</annotation></semantics>y的分布做任何假设，我们的预测仅基于训练集中的<semantics><mrow><mi>k</mi></mrow><annotation
    encoding="application/x-tex">k</annotation></semantics>k个最近邻。
- en: '**Definition 2 (more often used in computer science):**'
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: '**定义2（计算机科学中更常用）：**'
- en: A **parametric** model is one where the number of parameters (e.g., number of
    regression coefficients, etc.) is finite, and does not change with the size of
    the input data.
  id: totrans-10
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**参数**模型是指参数数量（例如回归系数数量等）有限，且不随输入数据规模变化的模型。'
- en: A **nonparametric** model is one where the number of parameters is either infinite,
    or increases with the number of data points.
  id: totrans-11
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**非参数**模型是指参数数量无限，或随数据点数量增加的模型。'
- en: Before we learn more about nonparametric methods, we’ll start by putting them
    in context against the backdrop of the parametric methods that we’ve discussed
    so far in this book (and that you’ve likely spent a lot of time learning about
    in your previous statistics and data science courses).
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 在深入了解非参数方法之前，我们将首先将它们置于本书迄今为止讨论过的参数方法（以及你可能在之前的统计学和数据科学课程中花费大量时间学习的参数方法）的背景下。
- en: '[PRE0]'
  id: totrans-13
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: Loading...
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: 'Comparing and Contrasting: Logistic Regression and <semantics><mrow><mi>k</mi></mrow><annotation
    encoding="application/x-tex">k</annotation></semantics>k-Nearest Neighbors[¶](#comparing-and-contrasting-logistic-regression-and-k-nearest-neighbors
    "Link to this Section")'
  id: totrans-15
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 比较与对比：逻辑回归与<semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k近邻[¶](#comparing-and-contrasting-logistic-regression-and-k-nearest-neighbors
    "Link to this Section")
- en: 'To understand the strengths and weaknesses of the two different approaches
    for classification, we’ll create a simple synthetic dataset and compare two models
    that we’re already familiar with: logistic regression (parametric) and <semantics><mrow><mi>k</mi></mrow><annotation
    encoding="application/x-tex">k</annotation></semantics>k-nearest neighbor classification
    (nonparametric).'
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 为了理解这两种不同分类方法的优缺点，我们将创建一个简单的合成数据集，并比较两个我们已经熟悉的模型：逻辑回归（参数方法）和<semantics><mrow><mi>k</mi></mrow><annotation
    encoding="application/x-tex">k</annotation></semantics>k近邻分类（非参数方法）。
- en: A Toy Dataset[¶](#a-toy-dataset "Link to this Section")
  id: totrans-17
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 一个玩具数据集[¶](#a-toy-dataset "Link to this Section")
- en: We’ll set up a training dataset with points in a smaller range, and a test dataset
    with points in a larger range, to help us understand how well the methods generalize.
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将设置一个训练数据集，其点位于较小范围内，以及一个测试数据集，其点位于较大范围内，以帮助我们理解这些方法的泛化能力。
- en: '[PRE1]'
  id: totrans-19
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: '[PRE2]'
  id: totrans-20
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: '[PRE3]'
  id: totrans-21
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: '![<Figure size 640x480 with 2 Axes>](../Images/3222146b1dd589ece1f4a78c508b0687.png)![<Figure
    size 640x480 with 2 Axes>](../Images/4032ee151dad42bf669b20f0415ee851.png)'
  id: totrans-22
  prefs: []
  type: TYPE_IMG
  zh: '![<Figure size 640x480 with 2 Axes>](../Images/3222146b1dd589ece1f4a78c508b0687.png)![<Figure
    size 640x480 with 2 Axes>](../Images/4032ee151dad42bf669b20f0415ee851.png)'
- en: 'We often call datasets like these “toy datasets”: they’re helpful for illustrating
    a problem, but they’re oversimplified. Real datasets are usually noiser, higher-dimensional,
    and more complex. Whenever you see an example on toy datasets, it’s important
    to keep in mind that there may be additional complications in your dataset.'
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 我们常称此类数据集为“玩具数据集”：它们有助于说明问题，但过于简化。真实数据集通常噪声更多、维度更高且更复杂。每当看到玩具数据集的示例时，务必记住你的数据集中可能存在额外的复杂性。
- en: Applying Logistic Regression to the Toy Dataset[¶](#applying-logistic-regression-to-the-toy-dataset
    "Link to this Section")
  id: totrans-24
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 将逻辑回归应用于玩具数据集[¶](#applying-logistic-regression-to-the-toy-dataset "链接到此章节")
- en: 'Let <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p
    be our predicted probability that <semantics><mrow><mi>y</mi></mrow><annotation
    encoding="application/x-tex">y</annotation></semantics>y is 1 based on <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1</annotation></semantics>x1​ and <semantics><mrow><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_2</annotation></semantics>x2​. Then logistic regression
    says:'
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: 令 <semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics>p
    为基于 <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">x_1</annotation></semantics>x1​
    和 <semantics><mrow><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">x_2</annotation></semantics>x2​
    预测 <semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y
    为1的概率。那么逻辑回归的公式是：
- en: '<semantics><mrow><mi>p</mi><mo>=</mo><mi>σ</mi><mo stretchy="false">(</mo><msub><mi>β</mi><mn>1</mn></msub><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><msub><mi>β</mi><mn>2</mn></msub><msub><mi>x</mi><mn>2</mn></msub><mo
    stretchy="false">)</mo><munder><munder><mrow><mi>log</mi><mo>⁡</mo><mrow><mo fence="true">(</mo><mfrac><mi>p</mi><mrow><mn>1</mn><mo>−</mo><mi>p</mi></mrow></mfrac><mo
    fence="true">)</mo></mrow></mrow><mo stretchy="true">⏟</mo></munder><mtext>logit: inverse sigmoid</mtext></munder><mo>=</mo><msub><mi>β</mi><mn>1</mn></msub><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><msub><mi>β</mi><mn>2</mn></msub><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">p = \sigma(\beta_1 x_1 + \beta_2 x_2) \\ \underbrace{\log\left(\frac{p}{1-p}\right)}_{\text{logit:
    inverse sigmoid}} = \beta_1 x_1 + \beta_2 x_2</annotation></semantics>p=σ(β1​x1​+β2​x2​)logit: inverse sigmoidlog(1−pp​)​​=β1​x1​+β2​x2​[(1)](#IgCpsQWEbt
    "Link to this Equation")'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: '<semantics><mrow><mi>p</mi><mo>=</mo><mi>σ</mi><mo stretchy="false">(</mo><msub><mi>β</mi><mn>1</mn></msub><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><msub><mi>β</mi><mn>2</mn></msub><msub><mi>x</mi><mn>2</mn></msub><mo
    stretchy="false">)</mo><munder><munder><mrow><mi>log</mi><mo>⁡</mo><mrow><mo fence="true">(</mo><mfrac><mi>p</mi><mrow><mn>1</mn><mo>−</mo><mi>p</mi></mrow></mfrac><mo
    fence="true">)</mo></mrow></mrow><mo stretchy="true">⏟</mo></munder><mtext>logit：逆sigmoid函数</mtext></munder><mo>=</mo><msub><mi>β</mi><mn>1</mn></msub><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><msub><mi>β</mi><mn>2</mn></msub><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">p = \sigma(\beta_1 x_1 + \beta_2 x_2) \\ \underbrace{\log\left(\frac{p}{1-p}\right)}_{\text{logit:
    inverse sigmoid}} = \beta_1 x_1 + \beta_2 x_2</annotation></semantics>p=σ(β1​x1​+β2​x2​)logit：逆sigmoid函数log(1−pp​)​​=β1​x1​+β2​x2​[(1)](#IgCpsQWEbt
    "链接到此方程")'
- en: 'Recall that logistic regression tries to find a linear function of <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1</annotation></semantics>x1​ and <semantics><mrow><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_2</annotation></semantics>x2​ to use as the decision
    boundary. In this case, that corresponds to drawing a line on the graph above.
    Unfortunately, for this dataset it’s nearly impossible to find any linear decision
    boundary with an accuracy greater than <semantics><mrow><mn>50</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">50\%</annotation></semantics>50% (i.e., random chance
    guessing): take a moment to convince yourself this is true by mentally drawing
    lines on the graph above.'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: 回想一下，逻辑回归试图找到一个关于 <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1</annotation></semantics>x1​ 和 <semantics><mrow><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_2</annotation></semantics>x2​ 的线性函数作为决策边界。在这种情况下，这对应于在上图中画一条线。不幸的是，对于这个数据集，几乎不可能找到任何准确率超过
    <semantics><mrow><mn>50</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">50\%</annotation></semantics>50%（即随机猜测）的线性决策边界：花点时间，通过在上图中想象画线来让自己确信这一点。
- en: '[PRE4]'
  id: totrans-28
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: '[PRE5]'
  id: totrans-29
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: '[PRE6]'
  id: totrans-30
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: '![<Figure size 1000x450 with 4 Axes>](../Images/8071a2a274d9af86670297ab8fd2f0f1.png)'
  id: totrans-31
  prefs: []
  type: TYPE_IMG
  zh: '![<尺寸为1000x450的图表，包含4个子图>](../Images/8071a2a274d9af86670297ab8fd2f0f1.png)'
- en: As expected, the overall accuracy is close to 0.5 (which is what we’d get if
    we predicted completely at random). Logistic regression (without any feature engineering)
    is a poor choice for this data.
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 正如预期的那样，整体准确率接近0.5（如果我们完全随机预测，也会得到这个结果）。对于这些数据，逻辑回归（不做任何特征工程）是一个*糟糕的*选择。
- en: Applying a <semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k-Nearest
    Neighbor Classifier to the Toy Dataset[¶](#applying-a-k-nearest-neighbor-classifier-to-the-toy-dataset
    "Link to this Section")
  id: totrans-33
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 将<semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k近邻分类器应用于玩具数据集[¶](#applying-a-k-nearest-neighbor-classifier-to-the-toy-dataset
    "Link to this Section")
- en: Recall that a <semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k-nearest
    neighbor classifier classifies each point based on the label of the <semantics><mrow><mi>k</mi></mrow><annotation
    encoding="application/x-tex">k</annotation></semantics>k nearest points in the
    training set.
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: 回想一下，<semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k近邻分类器根据训练集中<semantics><mrow><mi>k</mi></mrow><annotation
    encoding="application/x-tex">k</annotation></semantics>个最近邻点的标签对每个点进行分类。
- en: '[PRE7]'
  id: totrans-35
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: '[PRE8]'
  id: totrans-36
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: '![<Figure size 1000x450 with 4 Axes>](../Images/98c8b878f9f4e624085e74e855c6b6f8.png)'
  id: totrans-37
  prefs: []
  type: TYPE_IMG
  zh: '![<尺寸为1000x450，包含4个坐标轴的图>](../Images/98c8b878f9f4e624085e74e855c6b6f8.png)'
- en: 'The kNN model does much better on this dataset. Best of all, we didn’t have
    to do any feature engineering or parameter tuning: it just worked out of the box.'
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: kNN模型在这个数据集上表现好得多。最棒的是，我们无需进行任何特征工程或参数调优：它开箱即用。
- en: '[PRE9]'
  id: totrans-39
  prefs: []
