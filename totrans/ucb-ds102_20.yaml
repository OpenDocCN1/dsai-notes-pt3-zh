- en: Pros and Cons of Logistic Regression and <semantics><mrow><mi>k</mi></mrow><annotation
    encoding="application/x-tex">k</annotation></semantics>k-Nearest Neighbors[¶](#pros-and-cons-of-logistic-regression-and-k-nearest-neighbors
    "Link to this Section")
  id: totrans-43
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 逻辑回归与<semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k近邻的优缺点[¶](#pros-and-cons-of-logistic-regression-and-k-nearest-neighbors
    "Link to this Section")
- en: Let’s walk through a few of the pros and cons of these two methods. Note that
    this is far from an exhaustive list!
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们来探讨这两种方法的一些优缺点。请注意，这远非详尽列表！
- en: Logistic regression[¶](#logistic-regression "Link to this Section")
  id: totrans-45
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 逻辑回归[¶](#logistic-regression "Link to this Section")
- en: '**PROS**:'
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: '**优点**：'
- en: Simple model with only one parameter per input feature (in this case, 2).
  id: totrans-47
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 简单模型，每个输入特征只有一个参数（本例中为2个）。
- en: 'Parameters can be easily interpreted in a meaningful way: a coefficient <semantics><mrow><msub><mi>β</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">\beta_2</annotation></semantics>β2​ tells you “If
    feature <semantics><mrow><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">x_2</annotation></semantics>x2​
    increases by a certain amount <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a,
    the log-odds of <semantics><mrow><mi>y</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">y=1</annotation></semantics>y=1 increase by <semantics><mrow><msub><mi>β</mi><mn>2</mn></msub><mi>a</mi></mrow><annotation
    encoding="application/x-tex">\beta_2 a</annotation></semantics>β2​a.”'
  id: totrans-48
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 参数可以很容易地用有意义的方式解释：系数<semantics><mrow><msub><mi>β</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">\beta_2</annotation></semantics>β2​告诉你“如果特征<semantics><mrow><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_2</annotation></semantics>x2​增加一定量<semantics><mrow><mi>a</mi></mrow><annotation
    encoding="application/x-tex">a</annotation></semantics>a，则<semantics><mrow><mi>y</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">y=1</annotation></semantics>y=1的对数几率增加<semantics><mrow><msub><mi>β</mi><mn>2</mn></msub><mi>a</mi></mrow><annotation
    encoding="application/x-tex">\beta_2 a</annotation></semantics>β2​a。”
- en: The loss function is convex, so there’s one best answer and we’re guaranteed
    to get to it.
  id: totrans-49
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 损失函数是凸函数，因此存在一个最佳答案，并且我们保证能够找到它。
- en: Storing/saving the model is cheap, since there are only a few parameters
  id: totrans-50
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 存储/保存模型的成本很低，因为只有少数几个参数。
- en: '**CONS**'
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: '**缺点**'
- en: Makes an implicit assumption of linear interactions between the inputs (e.g.,
    can’t model something like <semantics><mrow><mi>y</mi><mo>=</mo><mtext>sign</mtext><mo
    stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><msub><mi>x</mi><mn>2</mn></msub><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">y = \text{sign}(x_1
    x_2)</annotation></semantics>y=sign(x1​x2​) as above)
  id: totrans-52
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 隐含地假设输入之间存在线性交互（例如，无法建模像<semantics><mrow><mi>y</mi><mo>=</mo><mtext>sign</mtext><mo
    stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><msub><mi>x</mi><mn>2</mn></msub><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">y = \text{sign}(x_1
    x_2)</annotation></semantics>y=sign(x1​x2​)这样的关系）。
- en: Modeling complex or nonlinear interactions requires good feature engineering
  id: totrans-53
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 建模复杂或非线性交互需要良好的特征工程。
- en: 'Base model is limited in complexity: any complex/nonlinear interactions require
    lots of feature engineering'
  id: totrans-54
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 基础模型的复杂度有限：任何复杂/非线性交互都需要大量的特征工程。
- en: <semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k-Nearest
    Neighbors[¶](#k-nearest-neighbors "Link to this Section")
  id: totrans-55
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k-最近邻[¶](#k-nearest-neighbors
    "Link to this Section")
- en: '**PROS**:'
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: '**优点**：'
- en: Makes no assumptions whatsoever about the data (other than that the training
    data is a representative sample)
  id: totrans-57
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 对数据不做任何假设（除了训练数据是代表性样本）
- en: Easy to implement and understand how it works
  id: totrans-58
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 易于实现和理解其工作原理
- en: '**CONS**'
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: '**缺点**'
- en: Predictions can be interpreted, but we can’t do any more meaningful analysis
    than “this new point looks like these 5 points I saw before, and 3 of those had
    <semantics><mrow><mi>y</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">y=1</annotation></semantics>y=1,
    so that’s why I predicted <semantics><mrow><mi>y</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">y=1</annotation></semantics>y=1”.
  id: totrans-60
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 预测结果可以解释，但我们无法进行比“这个新点看起来像我之前见过的这5个点，其中3个有 <semantics><mrow><mi>y</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">y=1</annotation></semantics>y=1，所以我预测 <semantics><mrow><mi>y</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">y=1</annotation></semantics>y=1”更有意义的分析。
- en: Doesn’t work as well in high dimensions (but there are some ways around this)
  id: totrans-61
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在高维空间中效果不佳（但有一些解决方法）
- en: Saving the model requires saving all the training points (but there are some
    ways around this)
  id: totrans-62
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 保存模型需要保存所有训练点（但有一些解决方法）
- en: '[PRE11]'
  id: totrans-63
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: Loading...
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: Decision trees and random forests[¶](#decision-trees-and-random-forests "Link
    to this Section")
  id: totrans-65
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 决策树和随机森林[¶](#decision-trees-and-random-forests "Link to this Section")
- en: Decision trees[¶](#decision-trees "Link to this Section")
  id: totrans-66
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 决策树[¶](#decision-trees "Link to this Section")
- en: A decision tree is a method for classification and regression that uses a tree-like
    structure to decide what value to predict for a point. We’ll start by taking the
    entire data. At the root of the tree, we’ll split the data based on a particular
    value of either <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1</annotation></semantics>x1​ or <semantics><mrow><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_2</annotation></semantics>x2​. We’ll then repeat
    the process for each split, building the tree as deep as we see fit. Our goal
    in splitting the points is to create as homogeneous a group as possible (in terms
    of <semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y)
    at the leaves of the tree. Let’s look at how we might construct a decision tree
    for this problem.
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
  zh: 决策树是一种用于分类和回归的方法，它使用树状结构来决定对某个点预测什么值。我们从整个数据开始。在树的根节点，我们将根据 <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1</annotation></semantics>x1​ 或 <semantics><mrow><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_2</annotation></semantics>x2​ 的特定值来分割数据。然后，我们对每个分割重复这个过程，根据需要构建尽可能深的树。我们分割点的目标是在树的叶子节点处创建尽可能同质的组（就
    <semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y
    而言）。让我们看看如何为这个问题构建决策树。
- en: 'Our first split is the hardest: we can see that no matter which value of <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1</annotation></semantics>x1​ (or <semantics><mrow><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_2</annotation></semantics>x2​ we choose, both sides
    of the split will have half yellow points and half purple points. But, we know
    that there’s a meaningful difference between points where <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>></mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_1 > 0</annotation></semantics>x1​>0 and points
    where <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo><</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_1 < 0</annotation></semantics>x1​<0, so let’s choose
    our first split at <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_1 = 0</annotation></semantics>x1​=0. (We could
    have just as well chosen <semantics><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_2 = 0</annotation></semantics>x2​=0 too: the choice
    of <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">x_1</annotation></semantics>x1​
    is arbitrary even though the choice of threshold value 0 was not).'
  id: totrans-68
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我们的第一次分割是最困难的：我们可以看到，无论选择<semantics><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1</annotation></semantics>x1​（或<semantics><mrow><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_2</annotation></semantics>x2​）的哪个值，分割的两边都会有一半黄点和一半紫点。但是，我们知道在<semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>></mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_1 > 0</annotation></semantics>x1​>0的点和<semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo><</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_1 < 0</annotation></semantics>x1​<0的点之间存在有意义的差异，因此我们选择在<semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_1 = 0</annotation></semantics>x1​=0处进行第一次分割。（我们同样可以选择<semantics><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_2 = 0</annotation></semantics>x2​=0：选择<semantics><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1</annotation></semantics>x1​是任意的，尽管阈值0的选择并非如此）。
- en: 'Let’s start by considering one half of the above split: points where <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>></mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_1 > 0</annotation></semantics>x1​>0, the right
    half of the plots above. For these points, there’s a very natural split at <semantics><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_2 = 0</annotation></semantics>x2​=0 that gives
    us completely homogeneous groups: everything above the split is yellow (<semantics><mrow><mi>y</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">y=1</annotation></semantics>y=1), and everything
    below is purple (<semantics><mrow><mi>y</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">y=0</annotation></semantics>y=0). At this point,
    we’re done splitting this branch of the tree: both sub-branches are completely
    homogeneous.'
  id: totrans-69
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 让我们从考虑上述分割的一半开始：即<semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>></mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_1 > 0</annotation></semantics>x1​>0的点，也就是上面图中的右半部分。对于这些点，在<semantics><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_2 = 0</annotation></semantics>x2​=0处有一个非常自然的分割，能给我们完全同质的组：分割线上方的所有点都是黄色的（<semantics><mrow><mi>y</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">y=1</annotation></semantics>y=1），下方的所有点都是紫色的（<semantics><mrow><mi>y</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">y=0</annotation></semantics>y=0）。至此，我们完成了树这一分支的分割：两个子分支都是完全同质的。
- en: Next, we’ll go back to the points where <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo><</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_1 < 0</annotation></semantics>x1​<0. It turns out
    that we can use the same split as before, at <semantics><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_2 = 0</annotation></semantics>x2​=0. In general,
    decision trees give us the flexibility to make a different split on this side
    of the tree! It just so happens with this toy dataset that the same sub-split
    (<semantics><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_2 = 0</annotation></semantics>x2​=0) works on both
    sides of our original split (<semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_1 = 0</annotation></semantics>x1​=0).
  id: totrans-70
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 接下来，我们将回到 <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo><</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_1 < 0</annotation></semantics>x1​<0 的区域。结果表明，我们可以使用与之前相同的分割点，即在
    <semantics><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_2 = 0</annotation></semantics>x2​=0 处。通常，决策树赋予我们在树的这一侧进行不同分割的灵活性！只是在这个玩具数据集中，相同的子分割（<semantics><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_2 = 0</annotation></semantics>x2​=0）在我们原始分割（<semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">x_1 = 0</annotation></semantics>x1​=0）的两侧都适用。
- en: 'And now, we’re done. Here’s the entire tree:'
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: 现在，我们完成了。这是整棵树：
- en: '![](../Images/5a1ddaac9c4adb12a5277dcde7f705f5.png)'
  id: totrans-72
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/5a1ddaac9c4adb12a5277dcde7f705f5.png)'
- en: To predict the <semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y-value
    for a new point, we start at the root (top), and continue down until we reach
    a leaf node. This tree ended up very symmetric, but in many problems that won’t
    be the case.
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: 要预测一个新点的 <semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y
    值，我们从根节点（顶部）开始，持续向下直到到达叶节点。这棵树最终非常对称，但在许多问题中情况并非如此。
- en: '[PRE12]'
  id: totrans-74
  prefs: []
  type: TYPE_PRE
  zh: '[PRE12]'
- en: Loading...
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: 'Here’s how it works in scikit-learn:'
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: 在 scikit-learn 中的实现方式如下：
- en: '[PRE13]'
  id: totrans-77
  prefs: []
  type: TYPE_PRE
  zh: '[PRE13]'
- en: '[PRE14]'
  id: totrans-78
  prefs: []
  type: TYPE_PRE
  zh: '[PRE14]'
- en: '![<Figure size 1000x450 with 4 Axes>](../Images/b6a941f7aa37fdc52bdb58bb942e318c.png)'
  id: totrans-79
  prefs: []
  type: TYPE_IMG
  zh: '![<尺寸为 1000x450 包含 4 个坐标轴的图>](../Images/b6a941f7aa37fdc52bdb58bb942e318c.png)'
- en: The decision tree is almost perfect.
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
  zh: 该决策树近乎完美。
- en: 'Noisy Data: When Decision Trees Fail[¶](#noisy-data-when-decision-trees-fail
    "Link to this Section")'
  id: totrans-81
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 噪声数据：决策树何时失效[¶](#noisy-data-when-decision-trees-fail "链接到此章节")
- en: 'Small decision trees work great for problems where the underlying structure
    is simple. But what if we our data are noisier? Let’s randomly flip a few data
    points (<semantics><mrow><mn>10</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">10\%</annotation></semantics>10% of our training
    data) and see what happens:'
  id: totrans-82
  prefs: []
  type: TYPE_NORMAL
  zh: 对于底层结构简单的问题，小型决策树效果很好。但如果我们的数据噪声更多呢？让我们随机翻转一些数据点（训练数据的 <semantics><mrow><mn>10</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">10\%</annotation></semantics>10%），看看会发生什么：
- en: '[PRE15]'
  id: totrans-83
  prefs: []
  type: TYPE_PRE
  zh: '[PRE15]'
- en: '![<Figure size 640x480 with 2 Axes>](../Images/f7c41448918e05e5c375957fcfd63a9b.png)'
  id: totrans-84
  prefs: []
  type: TYPE_IMG
  zh: '![<尺寸为 640x480 包含 2 个坐标轴的图>](../Images/f7c41448918e05e5c375957fcfd63a9b.png)'
- en: 'Now there are a small handful of points where the training label is wrong.
    Let’s try fitting a decision tree again: we’ll train on the noisy data, but we’ll
    test on the good data, so that we can evaluate whether the model learns the true
    pattern despite the noise.'
  id: totrans-85
  prefs: []
  type: TYPE_NORMAL
  zh: 现在有少数几个点的训练标签是错误的。让我们再次尝试拟合一个决策树：我们将在噪声数据上训练，但会在干净数据上测试，以便评估模型是否能克服噪声学习到真实模式。
- en: '[PRE16]'
  id: totrans-86
  prefs: []
  type: TYPE_PRE
  zh: '[PRE16]'
- en: '[PRE17]'
  id: totrans-87
  prefs: []
  type: TYPE_PRE
  zh: '[PRE17]'
- en: '![<Figure size 1000x450 with 4 Axes>](../Images/6000e323cbb57177af1fb80145fcca76.png)'
  id: totrans-88
  prefs: []
  type: TYPE_IMG
  zh: '![<尺寸为 1000x450 包含 4 个坐标轴的图>](../Images/6000e323cbb57177af1fb80145fcca76.png)'
- en: Changing just <semantics><mrow><mn>10</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">10\%</annotation></semantics>10% of the points completely
    wrecked the tree! Our accuracy dropped to around <semantics><mrow><mn>75</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">75\%</annotation></semantics>75%.
    While this is a toy dataset, it’s not uncommon in real-world datasets to see <semantics><mrow><mn>10</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">10\%</annotation></semantics>10%
    of the data be corrupted by noise.
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
  zh: 仅仅改变 <semantics><mrow><mn>10</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">10\%</annotation></semantics>10% 的数据点就完全破坏了这棵树！我们的准确率下降到了大约
    <semantics><mrow><mn>75</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">75\%</annotation></semantics>75%。虽然这是一个示例数据集，但在现实世界的数据集中，看到
    <semantics><mrow><mn>10</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">10\%</annotation></semantics>10% 的数据被噪声污染并不罕见。
- en: Random Forests[¶](#random-forests "Link to this Section")
  id: totrans-90
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 随机森林[¶](#random-forests "Link to this Section")
- en: 'We’ll solve this problem by using a random forest instead of a decision tree.
    Random forests use are built using decision trees, and apply two key ideas: **bootstrap
    aggregation, or bagging** and **random feature selection**.'
  id: totrans-91
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将通过使用随机森林而非决策树来解决这个问题。随机森林基于决策树构建，并应用了两个关键思想：**自助聚合（Bagging）** 和**随机特征选择**。
- en: Bootstrap Aggregation (Bagging)[¶](#bootstrap-aggregation-bagging "Link to this
    Section")
  id: totrans-92
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 自助聚合（Bagging）[¶](#bootstrap-aggregation-bagging "Link to this Section")
- en: 'We’ll fix this by using many trees instead of just one: this is known as an
    **ensemble**. We’ll train each tree separately, and then combine their decisions
    when making a prediction. Ideally, we would get a fresh dataset for each one,
    and train each tree separately. outUnfortunately, we usually can’t get that many
    separate datasets, and if we divide our training dataset into 100, we’re losing
    out on valuable data we could use to train each of the trees.'
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将通过使用多棵树而非仅一棵树来解决这个问题：这被称为**集成学习**。我们将分别训练每棵树，然后在进行预测时结合它们的决策。理想情况下，我们会为每棵树获取一个全新的数据集并分别训练。不幸的是，我们通常无法获得那么多独立的数据集，而且如果我们将训练数据集分成100份，就会损失可用于训练每棵树的宝贵数据。
- en: 'But, we’ve already seen a way around this: we can use the bootstrap! Notice
    that here, we’re using bootstrap for a completely different purpose than before:
    instead of using it to quantify uncertainty, we’re using it to mitigate the effect
    of noise in our data. This is called **Bootstrap AGGregation**, or **bagging**.'
  id: totrans-94
  prefs: []
  type: TYPE_NORMAL
  zh: 但是，我们已经知道了一种解决方法：可以使用自助法！请注意，这里我们使用自助法的目的与之前完全不同：不是用它来量化不确定性，而是用它来减轻数据中噪声的影响。这被称为**自助聚合（Bootstrap
    AGGregation）**，简称**Bagging**。
- en: Random feature selection[¶](#random-feature-selection "Link to this Section")
  id: totrans-95
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 随机特征选择[¶](#random-feature-selection "Link to this Section")
- en: The second big idea is **random feature selection**. In this toy example, we’ve
    been working with 2 features <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1</annotation></semantics>x1​ and <semantics><mrow><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_2</annotation></semantics>x2​. But in many real
    problems, you may have hundreds or even thousands of features. Using the algorithm
    we have above, for a decision tree to properly deal with that many features, it
    would have to be extremely deep (since we’d need one node/split for every feature
    that’s relevant). Since we’re using multiple trees, we don’t need each tree to
    be perfect. So, we’ll just choose a subset of the features for each tree.
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: 第二个重要思想是**随机特征选择**。在这个示例中，我们一直使用两个特征 <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1</annotation></semantics>x1​ 和 <semantics><mrow><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_2</annotation></semantics>x2​。但在许多实际问题中，你可能拥有数百甚至数千个特征。使用我们上面的算法，要让决策树正确处理这么多特征，它必须非常深（因为每个相关特征都需要一个节点/分裂点）。由于我们使用多棵树，我们不需要每棵树都完美。因此，我们将为每棵树只选择一个特征子集。
- en: In practice, for <semantics><mrow><mi>K</mi></mrow><annotation encoding="application/x-tex">K</annotation></semantics>K
    features, people use <semantics><mrow><mi>K</mi><mi mathvariant="normal">/</mi><mn>3</mn></mrow><annotation
    encoding="application/x-tex">K/3</annotation></semantics>K/3 features per tree
    for **regression** and <semantics><mrow><msqrt><mi>K</mi></msqrt></mrow><annotation
    encoding="application/x-tex">\sqrt{K}</annotation></semantics>K​ features per
    tree for **classification**.
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
  zh: 在实践中，对于 <semantics><mrow><mi>K</mi></mrow><annotation encoding="application/x-tex">K</annotation></semantics>K
    个特征，人们通常在**回归**任务中每棵树使用 <semantics><mrow><mi>K</mi><mi mathvariant="normal">/</mi><mn>3</mn></mrow><annotation
    encoding="application/x-tex">K/3</annotation></semantics>K/3 个特征，而在**分类**任务中每棵树使用
    <semantics><mrow><msqrt><mi>K</mi></msqrt></mrow><annotation encoding="application/x-tex">\sqrt{K}</annotation></semantics>K​
    个特征。
- en: 'So, here’s how the random forest algorithm works: we train a large number of
    trees independently, where each one is trained on a bootstrap sample of the data
    and on a smaller number of features.'
  id: totrans-98
  prefs: []
  type: TYPE_NORMAL
  zh: 那么，随机森林算法的工作原理如下：我们独立训练大量决策树，其中每棵树都在数据的自助采样样本和较少的特征子集上进行训练。
- en: '[PRE18]'
  id: totrans-99
  prefs: []
  type: TYPE_PRE
  zh: '[PRE18]'
- en: '`(150, 2)`'
  id: totrans-100
  prefs: []
  type: TYPE_NORMAL
  zh: '`(150, 2)`'
- en: '[PRE19]'
  id: totrans-101
  prefs: []
  type: TYPE_PRE
  zh: '[PRE19]'
- en: '[PRE20]'
  id: totrans-102
  prefs: []
  type: TYPE_PRE
  zh: '[PRE20]'
- en: '![<Figure size 1000x450 with 4 Axes>](../Images/56ada163d958933032ab4c65bffd9889.png)'
  id: totrans-103
  prefs: []
  type: TYPE_IMG
  zh: '![<Figure size 1000x450 with 4 Axes>](../Images/56ada163d958933032ab4c65bffd9889.png)'
- en: The random forest achieves <semantics><mrow><mn>95</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">95\%</annotation></semantics>95% training accuracy.
    Remember that the labels in our training data was only <semantics><mrow><mn>90</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">90\%</annotation></semantics>90%
    accurate, so <semantics><mrow><mn>95</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">95\%</annotation></semantics>95% here is very impressive!
  id: totrans-104
  prefs: []
  type: TYPE_NORMAL
  zh: 随机森林达到了 <semantics><mrow><mn>95</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">95\%</annotation></semantics>95% 的训练准确率。请记住，我们训练数据中的标签准确率仅为
    <semantics><mrow><mn>90</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">90\%</annotation></semantics>90%，因此这里的 <semantics><mrow><mn>95</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">95\%</annotation></semantics>95%
    非常令人印象深刻！
- en: There are a lot of important details that we haven’t covered here. Some of these
    (e.g., choosing the number of trees) are hyperparameters that we have to decide
    on using something like cross-validation, while others (e.g., how we decide the
    best place to split at each iteration while building a tree) are an important
    part of the algorithm that’s beyond what we’ll cover in this class.
  id: totrans-105
  prefs: []
  type: TYPE_NORMAL
  zh: 这里有很多重要的细节我们尚未涉及。其中一些（例如，选择树的数量）是我们必须通过交叉验证等方法决定的超参数，而另一些（例如，在建树过程中每次迭代时如何决定最佳分割点）是算法的重要组成部分，超出了本课程的范围。
- en: '[PRE21]'
  id: totrans-106
  prefs: []
  type: TYPE_PRE
  zh: '[PRE21]'
- en: Loading...
  id: totrans-107
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: Interpretability[¶](#interpretability "Link to this Section")
  id: totrans-108
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 可解释性[¶](#interpretability "Link to this Section")
- en: How do we interpret the models we’ve developed? Let’s look at the results we
    already computed before, but now we’ll also interpret the models themselves.
  id: totrans-109
  prefs: []
  type: TYPE_NORMAL
  zh: 我们如何解释我们开发的模型？让我们看看之前已经计算出的结果，但现在我们也将解释模型本身。
- en: Interpreting logistic regression[¶](#interpreting-logistic-regression "Link
    to this Section")
  id: totrans-110
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 解释逻辑回归[¶](#interpreting-logistic-regression "Link to this Section")
- en: 'In logistic regression (or any GLM), the main way we interpret the model is
    by looking at the coefficients. As discussed in previous sections, we can interpret
    a coefficient <semantics><mrow><msub><mi>β</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">\beta_i</annotation></semantics>βi​ by saying "if
    <semantics><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">x_i</annotation></semantics>xi​
    increases by <semantics><mrow><mi>t</mi></mrow><annotation encoding="application/x-tex">t</annotation></semantics>t,
    then <semantics><mrow><mi>L</mi><mi>i</mi><mi>n</mi><mi>k</mi><mi>F</mi><mi>u</mi><mi>n</mi><mi>c</mi><mi>t</mi><mi>i</mi><mi>o</mi><mi>n</mi><mo
    stretchy="false">(</mo><mi>y</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">LinkFunction(y)</annotation></semantics>LinkFunction(y)
    increases by <semantics><mrow><msub><mi>β</mi><mi>i</mi></msub><mo>×</mo><mi>t</mi></mrow><annotation
    encoding="application/x-tex">\beta_i \times t</annotation></semantics>βi​×t. In
    the case of logistic regression, this corresopnds to the log-odds increasing by
    <semantics><mrow><mi>t</mi><mo>×</mo><msub><mi>β</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">t \times \beta_i</annotation></semantics>t×βi​. So,
    let’s look at the coefficients for our logistic regression model, by using the
    `.coef_` attribute of `sklearn` linear models:'
  id: totrans-111
  prefs: []
  type: TYPE_NORMAL
  zh: 在逻辑回归（或任何广义线性模型）中，我们解释模型的主要方式是查看系数。如前面章节所讨论的，我们可以通过“如果 <semantics><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">x_i</annotation></semantics>xi​ 增加 <semantics><mrow><mi>t</mi></mrow><annotation
    encoding="application/x-tex">t</annotation></semantics>t，那么 <semantics><mrow><mi>L</mi><mi>i</mi><mi>n</mi><mi>k</mi><mi>F</mi><mi>u</mi><mi>n</mi><mi>c</mi><mi>t</mi><mi>i</mi><mi>o</mi><mi>n</mi><mo
    stretchy="false">(</mo><mi>y</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">LinkFunction(y)</annotation></semantics>LinkFunction(y)
    增加 <semantics><mrow><msub><mi>β</mi><mi>i</mi></msub><mo>×</mo><mi>t</mi></mrow><annotation
    encoding="application/x-tex">\beta_i \times t</annotation></semantics>βi​×t”来解释系数
    <semantics><mrow><msub><mi>β</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">\beta_i</annotation></semantics>βi​。在逻辑回归的情况下，这对应于对数几率增加
    <semantics><mrow><mi>t</mi><mo>×</mo><msub><mi>β</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">t \times \beta_i</annotation></semantics>t×βi​。因此，让我们通过使用
    `sklearn` 线性模型的 `.coef_` 属性来查看逻辑回归模型的系数：
- en: '[PRE22]'
  id: totrans-112
  prefs: []
  type: TYPE_PRE
  zh: '[PRE22]'
- en: '[PRE23]'
  id: totrans-113
  prefs: []
  type: TYPE_PRE
  zh: '[PRE23]'
- en: '![<Figure size 1000x450 with 4 Axes>](../Images/8071a2a274d9af86670297ab8fd2f0f1.png)'
  id: totrans-114
  prefs: []
  type: TYPE_IMG
  zh: '![<Figure size 1000x450 with 4 Axes>](../Images/8071a2a274d9af86670297ab8fd2f0f1.png)'
- en: 'This tells us that for an increase of 1 in <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1</annotation></semantics>x1​, the log-odds decreases
    by 0.03. Unfortunately, this interpretion is meaningless, because the model does
    not accurately reflect the patterns in the data! This is an important lesson:
    the interpretation of a model is, at best, only as good as the model itself.'
  id: totrans-115
  prefs: []
  type: TYPE_NORMAL
  zh: 这告诉我们，对于 <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1</annotation></semantics>x1​ 增加 1，对数几率减少 0.03。不幸的是，这种解释毫无意义，因为模型并未准确反映数据中的模式！这是一个重要的教训：模型的解释，充其量，只能和模型本身一样好。
- en: Interpreting logistic regression with feature engineering[¶](#interpreting-logistic-regression-with-feature-engineering
    "Link to this Section")
  id: totrans-116
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 使用特征工程解释逻辑回归[¶](#interpreting-logistic-regression-with-feature-engineering "Link
    to this Section")
- en: 'Up until now, we’ve painted logistic regression as being a poor choice for
    this problem. But in reality, linear models are more than capable of making predictions
    when there are nonlinear patterns: we just need to use **feature engineering**
    to define good features.'
  id: totrans-117
  prefs: []
  type: TYPE_NORMAL
  zh: 到目前为止，我们一直将逻辑回归描绘成对此问题的一个糟糕选择。但实际上，线性模型完全有能力在存在非线性模式时进行预测：我们只需要使用**特征工程**来定义好的特征。
- en: 'For this particular problem, the feature <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>×</mo><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1 \times x_2</annotation></semantics>x1​×x2​ would
    be particularly useful, since it captures the nonlinear interaction that’s most
    important to the problem. We’ll add this as a third column in our matrix of predictors,
    and then try logistic regression:'
  id: totrans-118
  prefs: []
  type: TYPE_NORMAL
  zh: 对于这个特定问题，特征 <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>×</mo><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1 \times x_2</annotation></semantics>x1​×x2​ 将特别有用，因为它捕捉了对问题最重要的非线性交互作用。我们将其作为预测变量矩阵的第三列添加，然后尝试逻辑回归：
- en: '[PRE24]'
  id: totrans-119
  prefs: []
  type: TYPE_PRE
  zh: '[PRE24]'
- en: '[PRE25]'
  id: totrans-120
  prefs: []
  type: TYPE_PRE
  zh: '[PRE25]'
- en: '![<Figure size 1000x450 with 4 Axes>](../Images/7dffa9fb37b761633a71a45d78098b84.png)'
  id: totrans-121
  prefs: []
  type: TYPE_IMG
  zh: '![<Figure size 1000x450 with 4 Axes>](../Images/7dffa9fb37b761633a71a45d78098b84.png)'
- en: 'Unsurprisingly, this model does *much* better! Now that we’ve resolved our
    issues with the model’s accuracy, let’s see if we can interpret the coefficients:'
  id: totrans-122
  prefs: []
  type: TYPE_NORMAL
  zh: 不出所料，这个模型的表现*好得多*！既然我们已经解决了模型准确性的问题，现在来看看是否能解释这些系数：
- en: '[PRE26]'
  id: totrans-123
  prefs: []
  type: TYPE_PRE
  zh: '[PRE26]'
- en: '`array([[ 277.36746859, -56.97829336, 19397.32580951]])`'
  id: totrans-124
  prefs: []
  type: TYPE_NORMAL
  zh: '`array([[ 277.36746859, -56.97829336, 19397.32580951]])`'
- en: 'This tells us that increases in <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1</annotation></semantics>x1​ or <semantics><mrow><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_2</annotation></semantics>x2​ by themselves result
    in relatively small changes in the log-odds. But, the third feature, <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>×</mo><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1 \times x_2</annotation></semantics>x1​×x2​, has
    a coefficient that’s three orders of magnitude larger! We can interpret this as
    saying that an increase in <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>×</mo><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1 \times x_2</annotation></semantics>x1​×x2​ leads
    to very large increases in the log-odds, which is exactly the pattern we observe
    when looking at the data: positive values of <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>×</mo><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1 \times x_2</annotation></semantics>x1​×x2​ are
    labeled with “1”, while negative values are labeled with “0”.'
  id: totrans-125
  prefs: []
  type: TYPE_NORMAL
  zh: 这告诉我们，<semantics><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">x_1</annotation></semantics>x1​或<semantics><mrow><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_2</annotation></semantics>x2​单独增加只会导致对数几率发生相对较小的变化。但是，第三个特征<semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>×</mo><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1 \times x_2</annotation></semantics>x1​×x2​的系数却大了三个数量级！我们可以将其解释为：<semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>×</mo><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1 \times x_2</annotation></semantics>x1​×x2​的增加会导致对数几率大幅增加，这正是我们观察数据时发现的模式：<semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>×</mo><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1 \times x_2</annotation></semantics>x1​×x2​为正值时标记为“1”，为负值时标记为“0”。
- en: Explaining Predictions from k-Nearest Neighbors[¶](#explaining-predictions-from-k-nearest-neighbors
    "Link to this Section")
  id: totrans-126
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 解释k-最近邻的预测[¶](#explaining-predictions-from-k-nearest-neighbors "链接到此章节")
- en: When looking at a prediction from a kNN model, it’s much harder to draw the
    same broad conclusions we did above by using the GLM coefficients. To make general
    statements about what the kNN classifier will do, we’d have to be able to understand
    all the training data points. In this simple two-dimensional example, this might
    be feasible by looking at the decision boundaries. But, in higher dimensions,
    this is much more difficult! Because of this, we say that kNN classifiers are
    less easily **interpretable**.
  id: totrans-127
  prefs: []
  type: TYPE_NORMAL
  zh: 观察kNN模型的预测结果时，要得出与之前使用GLM系数时相同的广泛结论要困难得多。要对kNN分类器的行为做出一般性陈述，我们必须能够理解所有的训练数据点。在这个简单的二维示例中，或许可以通过观察决策边界来实现。但在更高维度中，这就困难得多了！正因如此，我们说kNN分类器的**可解释性**较差。
- en: Instead of trying to interpret the model holistically, we’ll focus only on individual
    predictions. For any individual prediction made by a kNN classifier, we can always
    provide the <semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k
    nearest neighbors in the training set that contributed to that decision, along
    with the labels for each. This can often provide important insights into why a
    prediction was made in a particular way. We’ll call these **explanations** for
    each individual prediction.
  id: totrans-128
  prefs: []
  type: TYPE_NORMAL
  zh: 与其试图整体解释模型，我们不如只关注单个预测。对于kNN分类器做出的任何单个预测，我们总是可以提供促成该决策的训练集中<semantics><mrow><mi>k</mi></mrow><annotation
    encoding="application/x-tex">k</annotation></semantics>k个最近邻点及其各自的标签。这通常能为了解预测为何以特定方式做出提供重要见解。我们将这些称为针对每个单独预测的**解释**。
- en: '[PRE27]'
  id: totrans-129
  prefs: []
  type: TYPE_PRE
  zh: '[PRE27]'
- en: '[PRE28]'
  id: totrans-130
  prefs: []
  type: TYPE_PRE
  zh: '[PRE28]'
- en: '![<Figure size 1000x450 with 4 Axes>](../Images/98c8b878f9f4e624085e74e855c6b6f8.png)'
  id: totrans-131
  prefs: []
  type: TYPE_IMG
  zh: '![<尺寸为1000x450且包含4个坐标轴的图形>](../Images/98c8b878f9f4e624085e74e855c6b6f8.png)'
- en: Consider the misclassified point around <semantics><mrow><mo stretchy="false">(</mo><mn>0.2</mn><mo
    separator="true">,</mo><mo>−</mo><mn>2.9</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">(0.2, -2.9)</annotation></semantics>(0.2,−2.9). If
    we ask why this point has been misclassified, the answer is in the training set.
  id: totrans-132
  prefs: []
  type: TYPE_NORMAL
  zh: 考虑在 <semantics><mrow><mo stretchy="false">(</mo><mn>0.2</mn><mo separator="true">,</mo><mo>−</mo><mn>2.9</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(0.2, -2.9)</annotation></semantics>(0.2,−2.9)
    附近被错误分类的点。如果我们问为什么这个点被错误分类，答案就在训练集中。
- en: '[PRE29]'
  id: totrans-133
  prefs: []
  type: TYPE_PRE
  zh: '[PRE29]'
- en: '![<Figure size 640x480 with 2 Axes>](../Images/3222146b1dd589ece1f4a78c508b0687.png)'
  id: totrans-134
  prefs: []
  type: TYPE_IMG
  zh: '![<Figure size 640x480 with 2 Axes>](../Images/3222146b1dd589ece1f4a78c508b0687.png)'
- en: We can see that the bottom-left portion of quadrant IV is rather sparse in our
    training datsaset. If we consider the point at <semantics><mrow><mo stretchy="false">(</mo><mn>0.2</mn><mo
    separator="true">,</mo><mo>−</mo><mn>2.9</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">(0.2, -2.9)</annotation></semantics>(0.2,−2.9), we
    can see that it’s likely to be equidistant to the “1” (yellow) points toward the
    bottom of quadrant III! This is the cause of the misclassification.
  id: totrans-135
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以看到，在我们的训练数据集中，第四象限的左下部分相当稀疏。如果我们考虑 <semantics><mrow><mo stretchy="false">(</mo><mn>0.2</mn><mo
    separator="true">,</mo><mo>−</mo><mn>2.9</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">(0.2, -2.9)</annotation></semantics>(0.2,−2.9) 处的点，我们可以看到它很可能与第三象限底部附近的“1”（黄色）点等距！这就是导致错误分类的原因。
- en: So, for any prediction obtained from a k-nearest neighbors classifier, we can
    obtain an **explanation**, even if the model itself isn’t as amenable to **interpretation**.
  id: totrans-136
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，对于从 k-近邻分类器获得的任何预测，我们都可以得到一个**解释**，即使模型本身并不那么易于**解释**。
- en: Interpeting a Decision Tree[¶](#interpeting-a-decision-tree "Link to this Section")
  id: totrans-137
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 解释决策树[¶](#interpeting-a-decision-tree "Link to this Section")
- en: 'Are decision trees interpretable? We’ll see that the answer depends on the
    size of the tree. We’ll start with the tree trained on the clean (non-noisy) dataset:'
  id: totrans-138
  prefs: []
  type: TYPE_NORMAL
  zh: 决策树是可解释的吗？我们会看到答案取决于树的大小。我们将从在干净（无噪声）数据集上训练的树开始：
- en: '[PRE30]'
  id: totrans-139
  prefs: []
  type: TYPE_PRE
  zh: '[PRE30]'
- en: '[PRE31]'
  id: totrans-140
  prefs: []
  type: TYPE_PRE
  zh: '[PRE31]'
- en: '![<Figure size 1000x450 with 4 Axes>](../Images/b6a941f7aa37fdc52bdb58bb942e318c.png)'
  id: totrans-141
  prefs: []
  type: TYPE_IMG
  zh: '![<Figure size 1000x450 with 4 Axes>](../Images/b6a941f7aa37fdc52bdb58bb942e318c.png)'
- en: '[PRE32]'
  id: totrans-142
  prefs: []
  type: TYPE_PRE
  zh: '[PRE32]'
- en: '![<Figure size 1200x800 with 1 Axes>](../Images/0a7fad02c7f485cd3d8c9be864fd0e78.png)'
  id: totrans-143
  prefs: []
  type: TYPE_IMG
  zh: '![<Figure size 1200x800 with 1 Axes>](../Images/0a7fad02c7f485cd3d8c9be864fd0e78.png)'
- en: 'While the top of the tree is somewhat counterintuitive due to the arbitrary
    nature of the initial split, we can see that the lower layers are easy to interpret:
    we split at <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1</annotation></semantics>x1​ and <semantics><mrow><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_2</annotation></semantics>x2​ values close to 0.'
  id: totrans-144
  prefs: []
  type: TYPE_NORMAL
  zh: 虽然由于初始分割的任意性，树的顶部有些反直觉，但我们可以看到较低的层很容易解释：我们在接近 0 的 <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">x_1</annotation></semantics>x1​ 和 <semantics><mrow><msub><mi>x</mi><mn>2</mn></msub></mrow><annotation
    encoding="application/x-tex">x_2</annotation></semantics>x2​ 值处进行分割。
- en: What about the tree that was trained on the noisy version of the data?
  id: totrans-145
  prefs: []
  type: TYPE_NORMAL
  zh: 那么，在数据的噪声版本上训练的树呢？
- en: '[PRE33]'
  id: totrans-146
  prefs: []
  type: TYPE_PRE
  zh: '[PRE33]'
- en: '[PRE34]'
  id: totrans-147
  prefs: []
  type: TYPE_PRE
  zh: '[PRE34]'
- en: '![<Figure size 1000x450 with 4 Axes>](../Images/86c953888f1c2c369dd31461fb41f0f5.png)'
  id: totrans-148
  prefs: []
  type: TYPE_IMG
  zh: '![<Figure size 1000x450 with 4 Axes>](../Images/86c953888f1c2c369dd31461fb41f0f5.png)'
- en: '[PRE35]'
  id: totrans-149
  prefs: []
  type: TYPE_PRE
  zh: '[PRE35]'
- en: '![<Figure size 2000x2000 with 1 Axes>](../Images/bdb392c96e142337002a98eaa4b76369.png)'
  id: totrans-150
  prefs: []
  type: TYPE_IMG
  zh: '![<Figure size 2000x2000 with 1 Axes>](../Images/bdb392c96e142337002a98eaa4b76369.png)'
- en: 'This tree is **much** more difficult to interpret! Tracing any individual prediction
    may require us to go down up to 15 levels deep: and, this is just for a simple
    two-dimensional toy dataset! In real-world datasets in higher dimensions, trees
    can be even deeper.'
  id: totrans-151
  prefs: []
  type: TYPE_NORMAL
  zh: 这棵树**非常**难以解释！追踪任何单个预测都可能需要我们向下深入多达 15 层：而且，这仅仅是一个简单的二维玩具数据集！在更高维度的真实世界数据集中，树可能更深。
- en: Interpreting Random Forests[¶](#interpreting-random-forests "Link to this Section")
  id: totrans-152
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 解释随机森林[¶](#interpreting-random-forests "Link to this Section")
- en: 'Unfortunately, random forests are even worse: instead of interpreting one potentially
    large tree, we must simultaneously interpret hundreds of them! This is a critical
    weakness of random forests: while they often achieve excellent accuracy, they
    are often difficult to interpret.'
  id: totrans-153
  prefs: []
  type: TYPE_NORMAL
  zh: 不幸的是，随机森林甚至更糟：我们不是解释一个可能很大的树，而是必须同时解释数百棵树！这是随机森林的一个关键弱点：虽然它们通常能达到很高的准确率，但往往难以解释。
- en: '[PRE36]'
  id: totrans-154
  prefs: []
  type: TYPE_PRE
  zh: '[PRE36]'
