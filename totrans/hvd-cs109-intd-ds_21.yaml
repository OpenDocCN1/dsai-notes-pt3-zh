  type: TYPE_NORMAL
  zh: 使用R的统计学简介
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook/introduction-to-statistics-with-r.html](https://rafalab.dfci.harvard.edu/dsbook/introduction-to-statistics-with-r.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: '[https://rafalab.dfci.harvard.edu/dsbook/introduction-to-statistics-with-r.html](https://rafalab.dfci.harvard.edu/dsbook/introduction-to-statistics-with-r.html)'
- en: Data analysis is one of the main focuses of this book. While the computing tools
    we have introduced are relatively recent developments, data analysis has been
    around for over a century. Throughout the years, data analysts working on specific
    projects have come up with ideas and concepts that generalize across many applications.
    They have also identified common ways to get fooled by apparent patterns in the
    data and important mathematical realities that are not immediately obvious. The
    accumulation of these ideas and insights has given rise to the discipline of statistics,
    which provides a mathematical framework that greatly facilitates the description
    and formal evaluation of these ideas.
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 数据分析是本书的主要关注点之一。虽然我们介绍的计算工具是相对较新的发展，但数据分析已经存在一个多世纪了。多年来，从事特定项目的数据分析师们提出了许多跨多个应用领域的一般性想法和概念。他们还确定了在数据中容易被明显模式欺骗的常见方式以及一些重要的数学现实，这些现实并不立即明显。这些想法和洞察的积累催生了统计学这一学科，它提供了一个数学框架，极大地促进了这些想法的描述和正式评估。
- en: To avoid repeating common mistakes and wasting time reinventing the wheel, it
    is important for a data analyst to have an in-depth understanding of statistics.
    However, due to the maturity of the discipline, there are dozens of excellent
    books already published on this topic and we therefore do not focus on describing
    the mathematical framework here. Instead, we introduce concepts briefly and then
    provide detailed case studies demonstrating how statistics is used in data analysis
    along with R code implementing these ideas. We also use R code to help elucidate
    some of the main statistical concepts that are usually described using mathematics.
    We highly recommend complementing this part of the book with a basic statistics
    textbook. Two examples are *Statistics* by Freedman, Pisani, and Purves and *Statistical
    Inference* by Casella and Berger. The specific concepts covered in this part are
    Summary Statistics, Probability, Statistical Inference, Statistical Models, Regression,
    and Linear Models, which are major topics covered in a statistics course. The
    case studies we present relate to the financial crisis, forecasting election results,
    understanding heredity, and building a baseball team.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 为了避免重复常见的错误和浪费时间重新发明轮子，数据分析师对统计学有深入理解是非常重要的。然而，由于这个学科的成熟，已经有数十本关于这个主题的优秀书籍出版，因此我们在此不专注于描述数学框架。相反，我们简要介绍概念，然后提供详细的案例研究，展示统计学在数据分析中的应用，以及实现这些想法的R代码。我们还使用R代码来帮助阐明一些通常使用数学描述的主要统计概念。我们强烈建议用一本基本的统计学教科书来补充这本书的这一部分。本部分涵盖的具体概念包括描述性统计、概率、统计推断、统计模型、回归和线性模型，这些都是统计学课程中的主要主题。我们提供的案例研究涉及金融危机、预测选举结果、理解遗传以及组建棒球队。
