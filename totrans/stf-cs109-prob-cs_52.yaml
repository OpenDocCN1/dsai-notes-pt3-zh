- en: Marginalization
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part3/marginalization/](https://chrispiech.github.io/probabilityForComputerScientists/en/part3/marginalization/)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
- en: An important insight regarding probabilistic models with many random variables
    is that "the joint distribution is complete information." From the joint distribution
    you can compute all probability questions involving those random variables in
    the model. This chapter is an example of that insight.
  prefs: []
  type: TYPE_NORMAL
- en: 'The central question of this chapter is: Given a joint distribution, how can
    you compute the probability of random variables on their own?'
  prefs: []
  type: TYPE_NORMAL
- en: Marginalization From Two Random Variables
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'To start, consider two random variables $X$ and $Y$. If you are given the joint
    how can you compute $\p(X=x)$? Recall that if you have the joint you have a way
    to know the probability $\p(X=x,Y=y)$ for any value $x$ and $y$ . We already have
    a technique for computing $\p(X=x)$ from the joint. We can use the [Law of Total
    Probability](../../part1/law_total) (LOTP)! In this case the events $Y = y$ make
    up the "background events": \begin{align*} P(X=x) &= \sum_y \p(X=x, Y=y) \\ \end{align*}
    Note that to apply the LOTP it must be the case that the different events $Y=i$
    must be mutually exclusvie and it must be the case that $\sum_y \p(Y=y) = 1$.
    Both are true.'
  prefs: []
  type: TYPE_NORMAL
- en: 'If we wanted $\p(Y=y)$ we could again use the Law of Total Probability, this
    time with $X$ taking on each of its possible values as the background events:
    \begin{align*} P(Y=y) &= \sum_x \p(X=x, Y=y) \\ \end{align*}'
  prefs: []
  type: TYPE_NORMAL
- en: 'Example: Favorite Number'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Consider the following joint distribution for $X$ and $Y$ where $X$ is a person''s
    favorite binary digit and $Y$ is their year at Stanford. Here is a real joint
    distribution form a past class:'
  prefs: []
  type: TYPE_NORMAL
- en: '| Variable | Symbol | Type |'
  prefs: []
  type: TYPE_TB
- en: '| Favorite Digit | $X$ | Discrete number {0, 1} |'
  prefs: []
  type: TYPE_TB
- en: '| Year in School | $Y$ | Categorical {Frosh, Soph, Junior, Senior, 5+} |'
  prefs: []
  type: TYPE_TB
- en: 'What is the probability that a student''s favorite digit is 0, $\p(X=0)$? We
    can use the LOTP to compute this probability: \begin{align*} \p(X=0) = &\sum_y
    \p(X=0, Y=y) \\ = &+ \p(X=0, Y=\text{Frosh}) \\ &+ \p(X=0, Y=\text{Soph}) \\ &+
    \p(X=0, Y=\text{Junior}) \\ &+ \p(X=0, Y=\text{Senior}) \\ &+ \p(X=0, Y=\text{5+})
    \\ = &0.01 + 0.05 + 0.04 + 0.03 + 0.02 \\ = &0.15 \end{align*}'
  prefs: []
  type: TYPE_NORMAL
- en: Marginalization with More Variables
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The idea of marginalization can be extended to joint distributions with more
    than two random variables. Consider having three random variables $X$, $Y$, and
    $Z$, we could marginalize out any of the variables: \begin{align*} P(X=x) &= \sum_{y,z}
    \p(X=x, Y=y, Z=z) \\ P(Y=y) &= \sum_{x,z} \p(X=x, Y=y, Z=z) \\ P(Z=z) &= \sum_{x,y}
    \p(X=x, Y=y, Z=z) \\ \end{align*}'
  prefs: []
  type: TYPE_NORMAL
- en: '***Notation:* Double Sum**'
  prefs: []
  type: TYPE_NORMAL
- en: 'In this case the double sum notation: $$\sum\limits_{y, z}$$ Also written equivalently
    as: $$\sum_y \sum_z$$ means that we are summing over all possible values of $y$
    and $z$. For example, if $Y$ is a random variable with 3 possible values and $Z$
    is a random variable with 4 possible values, then $\sum_{y, z}$ means that we
    are summing over all 12 possible combinations of $y$ and $z$.'
  prefs: []
  type: TYPE_NORMAL
- en: Here is an example in code. Assume we have a function `joint(x, y, z)` and that
    all $X$, $Y$ and $Z$ can take on values in the set $\{0, 1, 2, 3, 4\}$
  prefs: []
  type: TYPE_NORMAL
