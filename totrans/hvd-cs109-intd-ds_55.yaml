  id: totrans-118
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[https://github.com/rairizarry/murders](https://github.com/rairizarry/murders)[↩︎](reproducible-projects-with-rstudio-and-r-markdown.html#fnref123)'
