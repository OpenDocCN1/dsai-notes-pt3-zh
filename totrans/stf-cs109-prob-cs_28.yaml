- en: Probability Mass Functions
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 概率质量函数
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part2/pmf/](https://chrispiech.github.io/probabilityForComputerScientists/en/part2/pmf/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part2/pmf/](https://chrispiech.github.io/probabilityForComputerScientists/en/part2/pmf/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: 'For a random variable, the most important thing to know is: how likely is each
    outcome? For a discrete random variable, this information is called the "**probability
    mass function**". The probability mass function (PMF) provides the "mass" (i.e.
    amount) of "probability" for each possible assignment of the random variable.'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 对于一个随机变量，最重要的信息是：每个结果的可能性有多大？对于离散随机变量，这种信息被称为“**概率质量函数**”。概率质量函数（PMF）提供了随机变量每个可能赋值的“质量”（即数量）的概率。
- en: 'Formally, the probability mass function is a mapping between the values that
    the random variable could take on and the probability of the random variable taking
    on said value. In mathematics, we call these associations functions. There are
    many different ways of representing functions: you can write an equation, you
    can make a graph, you can even store many samples in a list. Let''s start by looking
    at PMFs as graphs where the $x$-axis is the values that the random variable could
    take on and the $y$-axis is the probability of the random variable taking on said
    value.'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 形式上，概率质量函数是随机变量可能取的值和随机变量取该值的概率之间的映射。在数学中，我们称这些关联为函数。表示函数的方法有很多：你可以写一个方程，你可以画一个图，你甚至可以在列表中存储许多样本。让我们先从将
    PMF 视为图表开始，其中 $x$ 轴是随机变量可能取的值，$y$ 轴是随机变量取该值的概率。
- en: 'In the following example, on the left we show a PMF, as a graph, for the random
    variable: $X$ = the value of a six-sided die roll. On the right we show a contrasting
    example of a PMF for the random variable $X$ = value of the sum of two dice rolls:'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 在下面的例子中，左侧我们展示了一个概率质量函数（PMF），以图表的形式表示随机变量：$X$ = 六面骰子掷出的值。右侧我们展示了一个对比示例，即随机变量
    $X$ = 两个骰子之和的 PMF：
- en: '![](../Images/60f3f34fb4b084086e8ad11e04d790c2.png)![](../Images/9f59b44ae86fdce12055ef67f2195632.png)*Left:
    the PMF of a single six-sided die roll. Right: the PMF of the sum of two dice
    rolls.*'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: '![左：单个六面骰子掷出的 PMF](../Images/60f3f34fb4b084086e8ad11e04d790c2.png)![右：两个骰子之和的
    PMF](../Images/9f59b44ae86fdce12055ef67f2195632.png)*左：单个六面骰子掷出的 PMF。右：两个骰子之和的
    PMF*。'
- en: 'The [sum of two dice example](../../part1/equally_likely/#sum_dice) in the
    equally likely probability section. Again, the information that is provided in
    these graphs is the likelihood of a random variable taking on different values.
    In the graph on the right, the value "$6$" on the $x$-axis is associated with
    the probability $\frac{5}{36}$ on the $y$-axis. This $x$-axis refers to the event
    "the sum of two dice is 6" or $Y=6$. The $y$-axis tells us that the probability
    of that event is $\frac{5}{36}$. In full: $\p(Y=6) = \frac{5}{36}$. The value
    "$2$" is associated with "$\frac{1}{36}$" which tells us that, $\p(Y=2) = \frac{1}{36}$,
    the probability that two dice sum to 2 is $\frac{1}{36}$. There is no value associated
    with "$1$" because the sum of two dice can not be 1\. If you find this notation
    confusing, revisit the [random variables](../../part2/rvs/#rv_vs_event) section.'
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 在等可能概率部分中的[两个骰子之和的例子](../../part1/equally_likely/#sum_dice)。再次强调，这些图中提供的信息是随机变量取不同值的可能性。在右侧的图中，$x$
    轴上的值 "$6$" 与 $y$ 轴上的概率 $\frac{5}{36}$ 相关联。这个 $x$ 轴指的是事件“两个骰子之和为 6”或 $Y=6$。$y$
    轴告诉我们该事件的概率是 $\frac{5}{36}$。完整地说：$\p(Y=6) = \frac{5}{36}$。值 "$2$" 与 "$\frac{1}{36}$"
    相关联，这告诉我们 $\p(Y=2) = \frac{1}{36}$，两个骰子之和为 2 的概率是 $\frac{1}{36}$。没有与 "$1$" 相关联的值，因为两个骰子之和不能为
    1。如果你觉得这种表示法令人困惑，请回顾[随机变量](../../part2/rvs/#rv_vs_event)部分。
- en: 'Here is the exact same information in equation form:'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 这里是相同信息以方程形式表示：
- en: $$ \begin{align} \p(X=x) = \frac{1}{6} && \text{ if } 1 \leq x \leq 6 \end{align}
    $$$$ \p(Y=y) = \begin{cases} \frac{(y-1)}{36} && \text{ if } 1 \leq y \leq 7\\
    \frac{(13-y)}{36} && \text{ if } 8 \leq y \leq 12 \end{cases} $$
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: $$ \begin{align} \p(X=x) = \frac{1}{6} && \text{ if } 1 \leq x \leq 6 \end{align}
    $$$$ \p(Y=y) = \begin{cases} \frac{(y-1)}{36} && \text{ if } 1 \leq y \leq 7\\
    \frac{(13-y)}{36} && \text{ if } 8 \leq y \leq 12 \end{cases} $$
- en: 'As a final example, here is the PMF for $Y$, the sum of two dice, in Python
    code:'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 作为最后的例子，这里是用 Python 代码表示的 $Y$ 的概率质量函数（PMF），即两个骰子之和：
- en: '[PRE0]'
  id: totrans-11
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: Notation
  id: totrans-12
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 符号
- en: You may feel that $\p(Y=y)$ is redundant notation. In probability research papers
    and higher-level work, mathematicians often use the shorthand $\p(y)$ to mean
    $\p(Y=y)$. This shorthand assumes that the lowercase value (e.g. $y$) has a capital
    letter counterpart (e.g. $Y$) that represents a random variable even though it's
    not written explicitly. In this book, we will often use the full form of the event
    $\P(Y=y)$, but we will occasionally use the shorthand $\p(y)$.
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 你可能会觉得 $\p(Y=y)$ 的表示法是多余的。在概率研究论文和更高级的工作中，数学家们经常使用缩写 $\p(y)$ 来表示 $\p(Y=y)$。这种缩写假设小写值（例如
    $y$）有一个大写字母对应物（例如 $Y$），即使它没有明确写出，也代表一个随机变量。在这本书中，我们将经常使用事件 $\P(Y=y)$ 的完整形式，但偶尔也会使用缩写
    $\p(y)$。
- en: Probabilities Must Sum to 1
  id: totrans-14
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 概率之和必须为 1
- en: 'For a variable (call it $X$) to be a proper random variable it must be the
    case that if you summed up the values of $\p(X = k)$ for all possible values $k$
    that $X$ can take on, the result must be 1: $$ \sum_{k} \p(X = k) = 1 $$'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 对于一个变量（称之为 $X$）要成为合适的随机变量，它必须满足的条件是：如果你将 $\p(X = k)$ 的值对所有可能的值 $k$ 进行求和，结果必须是
    1：$$ \sum_{k} \p(X = k) = 1 $$
- en: For further understanding, let's derive why this is the case. A random variable
    taking on a value is an event (for example $X = 2$). Each of those events is mutually
    exclusive because a random variable will take on exactly one value. Those mutually
    exclusive cases define an entire sample space. Why? Because $X$ must take on *some*
    value.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 为了进一步理解这一点，让我们推导一下为什么是这样。一个随机变量取某个值是一个事件（例如 $X = 2$）。这些事件中的每一个都是互斥的，因为随机变量将取恰好一个值。这些互斥的情况定义了整个样本空间。为什么？因为
    $X$ 必须取 *某个* 值。
- en: Data to Histograms to Probability Mass Functions
  id: totrans-17
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 数据到直方图到概率质量函数
- en: 'One surprising way to store a likelihood function (recall that a PMF is the
    name of the likelihood function for *discrete* random variables) is simply a list
