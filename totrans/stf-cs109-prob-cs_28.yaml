- en: 'Note that this data, on its own, represents an approximation for the probability
    mass function. If you wanted to approximate $\p(Y=3)$ you could simply count the
    number of times that "3" occurs in your data. This is an approximation based on
    the definition of probability. Here is the full [histogram](https://en.wikipedia.org/wiki/Histogram)
    of the data, a count of times each value occurs:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/185cc842659370d2a6a9cfc1bf196804.png)'
  prefs: []
  type: TYPE_IMG
- en: 'A normalized histogram (where each value is divided by the length of your data
    list) is an approximation of the PMF. For a dataset of discrete numbers, a histogram
    shows the count of each value (in this case $y$). By the definition of probability,
    if you divide this count by the number of experiments run, you arrive at an approximation
    of the probability of the event $\p(Y=y)$. In our example, we have 10,000 elements
    in our dataset. The count of times that 3 occurs is 552\. Note that: $$\begin{align}
    \frac{\text{count}(Y=3)}{n} &= \frac{552}{10000} = 0.0552 \\ \p(Y=3) &= \frac{4}{36}
    = 0.0555 \end{align} $$'
  prefs: []
  type: TYPE_NORMAL
- en: In this case, since we ran 10,000 trials, the histogram is a very good approximation
    of the PMF. We use the sum of dice as an example because it is easy to understand.
    Datasets in the real world often represent more exciting events.
  prefs: []
  type: TYPE_NORMAL
