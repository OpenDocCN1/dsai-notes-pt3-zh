- en: Probability of and
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: “和”的概率
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part1/prob_and/](https://chrispiech.github.io/probabilityForComputerScientists/en/part1/prob_and/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part1/prob_and/](https://chrispiech.github.io/probabilityForComputerScientists/en/part1/prob_and/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: The probability of the ***and*** of two events, say $E$ and $F$, written $\p(E
    \and F)$, is the probability of both events happening. You might see equivalent
    notations $\p(EF)$, $\p(E ∩ F)$ and $\p(E,F)$ to mean the probability of and.
    How you calculate the probability of event $E$ and event $F$ happening depends
    on whether or not the events are "independent". In the same way that mutual exclusion
    makes it easy to calculate the probability of the ***or*** of events, independence
    is a property that makes it easy to calculate the probability of the ***and***
    of events.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 两个事件（例如 $E$ 和 $F$）的“和”的概率，记作 $\p(E \and F)$，是两个事件同时发生的概率。你可能还会看到等价记法 $\p(EF)$，$\p(E
    ∩ F)$ 和 $\p(E,F)$ 来表示“和”的概率。计算事件 $E$ 和事件 $F$ 同时发生的概率取决于事件是否“独立”。与互斥事件使得计算事件的“或”的概率变得容易一样，独立性是一种使得计算事件的“和”的概率变得容易的性质。
- en: '**And** with Independent Events'
  id: totrans-4
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '**与独立事件相关**'
- en: 'If events are [**independent**](../../part1/independence) then calculating
    the probability of ***and*** becomes simple multiplication:'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 如果事件是 [**独立的**](../../part1/independence)，那么计算“和”的概率就变得简单，即乘法：
- en: '***Definition***: Probability of ***and*** for independent events.'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义***：独立事件的“和”的概率。'
- en: 'If two events: $E$, $F$ are independent then the probability of $E$ ***and***
    $F$ occurring is: $$ \p(E \and F) = \p(E) \cdot \p(F) $$'
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 如果两个事件：$E$，$F$ 是独立的，那么 $E$ 和 $F$ 同时发生的概率是：$$ \p(E \and F) = \p(E) \cdot \p(F)
    $$
- en: This property applies regardless of how the probabilities of $E$ and $F$ were
    calculated and whether or not the events are mutually exclusive.
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 这个性质与 $E$ 和 $F$ 的概率是如何计算的以及事件是否互斥无关。
- en: The independence principle extends to more than two events. For $n$ events $E_1,
    E_2, \dots E_n$ that are ***mutually*** independent of one another -- the independence
    equation also holds for all subsets of the events. $$ \p(E_1 \and E_2 \and \dots
    \and E_n) = \prod_{i=1}^n \p(E_i) $$
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 独立性原理不仅适用于两个事件，也适用于更多事件。对于 $n$ 个相互之间是 ***相互独立**的**事件 $E_1, E_2, \dots E_n$，事件的独立性方程也适用于所有事件的子集。$$
    \p(E_1 \and E_2 \and \dots \and E_n) = \prod_{i=1}^n \p(E_i) $$
- en: We can prove this equation by combining the definition of conditional probability
    and the definition of independence.
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以通过结合条件概率的定义和独立性定义来证明这个方程。
- en: '***Proof***: If $E$ is independent of $F$ then $\p(E \and F) = \p(E) \cdot
    \p(F)$'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: '***证明***：如果 $E$ 与 $F$ 独立，那么 $\p(E \and F) = \p(E) \cdot \p(F)$'
- en: $$ \begin{align} \p(E|F) &= \frac{\p(E \and F)}{\p(F)} && \text{Definition of
    } \href{ ../../part1/cond_prob/}{\text{conditional probability}} \\ \p(E) &= \frac{\p(E
    \and F)}{\p(F)} && \text{Definition of } \href{ ../../part1/independence/}{\text{independence}}
    \\ \p(E \and F) &= \p(E) \cdot \p(F) && \text{Rearranging terms} \end{align} $$
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: $$ \begin{align} \p(E|F) &= \frac{\p(E \and F)}{\p(F)} && \text{条件概率的定义} \\
    \p(E) &= \frac{\p(E \and F)}{\p(F)} && \text{独立性的定义} \\ \p(E \and F) &= \p(E)
    \cdot \p(F) && \text{重新排列项} \end{align} $$
- en: See the chapter on [independence](../../part1/independence) to learn about when
    you can assume that two events are independent
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 参见 [独立性](../../part1/independence) 章节了解何时可以假设两个事件是独立的
- en: '**And** with Dependent Events'
  id: totrans-14
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '**与相关事件相关**'
- en: 'Events which are not independent are called ***dependent*** events. How can
    you calculate the probability of the **and** of dependent events? If your events
    are mutually exclusive you might be able to use a technique called DeMorgan''s
    law, which we cover in a later chapter. For the probability of and in dependent
    events there is a direct formula called the chain rule which can be directly derived
    from the definition of conditional probability:'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 不独立的事件称为 ***相关**事件。如何计算相关事件的“和”的概率？如果你的事件是互斥的，你可能能够使用称为德摩根定律的技术，我们将在后面的章节中介绍。对于相关事件的“和”的概率，有一个直接公式称为链式法则，可以直接从条件概率的定义中推导出来：
- en: '***Definition***: The chain rule.'
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义***：链式法则。'
- en: 'The formula in the definition of conditional probability can be re-arranged
    to derive a general way of calculating the probability of the ***and*** of any
    two events: $$ \p(E \and F) = \p(E | F) \cdot \p(F) $$'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 条件概率定义中的公式可以重新排列，以推导出计算任何两个事件“和”的概率的通用方法：$$ \p(E \and F) = \p(E | F) \cdot \p(F)
    $$
- en: 'Of course there is nothing special about $E$ that says it should go first.
    Equivalently: $$ \p(E \and F) = \p(F \and E) = \p(F | E) \cdot \p(E) $$'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 当然，$E$ 没有什么特殊之处表明它应该先出现。等价地：$$ \p(E \and F) = \p(F \and E) = \p(F | E) \cdot
    \p(E) $$
- en: 'We call this formula the "chain rule." Intuitively it states that the probability
    of observing events $E$ ***and*** $F$ is the probability of observing $F$, multiplied
    by the probability of observing $E$, given that you have observed $F$. It generalizes
    to more than two events: $$ \begin{align} \p(E_1 \and E_2 \and \dots \and E_n)
    = &\p(E_1) \cdot \p(E_2|E_1) \cdot \p(E_3 |E_1 \and E_2) \dots \\ &\p(E_n|E_1
    \dots E_{n−1}) \end{align} $$'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 我们称这个公式为“链式法则”。直观上，它表明观察事件 $E$ 和 $F$ 的概率是观察 $F$ 的概率，乘以在观察到 $F$ 的条件下观察 $E$ 的概率。它可以推广到超过两个事件：$$
    \begin{align} \p(E_1 \and E_2 \and \dots \and E_n) = &\p(E_1) \cdot \p(E_2|E_1)
    \cdot \p(E_3 |E_1 \and E_2) \dots \\ &\p(E_n|E_1 \dots E_{n−1}) \end{align} $$
