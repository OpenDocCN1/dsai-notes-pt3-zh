  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: '<canvas id="uniPdf" style="max-height: 400px"></canvas>'
- en: '**Example:** You are running to the bus stop. You don’t know exactly when the
    bus arrives. You believe all times between 2 and 2:30 are equally likely. You
    show up at 2:15pm. What is P(wait < 5 minutes)?'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: '**示例:** 你正在跑向公交车站。你不知道公交车确切什么时候到达。你认为2点到2:30之间的任何时间到达的可能性都是相同的。你在下午2:15到达。等待时间小于5分钟的概率是多少？'
- en: 'Let $T$ be the time, in minutes after 2pm that the bus arrives. Because we
    think that all times are equally likely in this range, $T \sim \Uni(\alpha = 0,
    \beta = 30)$. The probability that you wait 5 minutes is equal to the probability
    that the bus shows up between 2:15 and 2:20\. In other words $\p(15 < T < 20)$:
    \begin{align*} \p(\text{Wait under 5 mins}) &= \p(15 < T < 20) \\ &= \int_{15}^{20}
    f_T(x) \partial x \\ &= \int_{15}^{20} \frac{1}{\beta - \alpha} \partial x \\
    \\ &= \frac{1}{30} \partial x \\ \\ &= \frac{x}{30}\bigg\rvert_{15}^{20} \\ &=
    \frac{20}{30} - \frac{15}{30} = \frac{5}{30} \end{align*}'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: '设 $T$ 为公交车在下午2点后到达的时间（以分钟计）。因为我们认为在这个范围内所有时间到达的可能性都是相同的，所以 $T \sim \Uni(\alpha
    = 0, \beta = 30)$。等待5分钟的概率等于公交车在2:15到2:20之间到达的概率。换句话说 $\p(15 < T < 20)$: \begin{align*}
    \p(\text{Wait under 5 mins}) &= \p(15 < T < 20) \\ &= \int_{15}^{20} f_T(x) \partial
    x \\ &= \int_{15}^{20} \frac{1}{\beta - \alpha} \partial x \\ \\ &= \frac{1}{30}
    \partial x \\ \\ &= \frac{x}{30}\bigg\rvert_{15}^{20} \\ &= \frac{20}{30} - \frac{15}{30}
    = \frac{5}{30} \end{align*}'
- en: 'We can come up with a closed form for the probability that a uniform random
    variable $X$ is in the range $a$ to $b$, assuming that $\alpha \leq a \leq b \leq
    \beta$: \begin{align*} \P(a \leq X \leq b) &= \int_a^b f(x) \d x \\ &= \int_a^b
    \frac{1}{\beta - \alpha} \d x \\ &= \frac{ b - a }{ \beta - \alpha } \end{align*}'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以求出均匀随机变量 $X$ 在范围 $a$ 到 $b$ 内的概率的封闭形式，假设 $\alpha \leq a \leq b \leq \beta$：\begin{align*}
    \P(a \leq X \leq b) &= \int_a^b f(x) \d x \\ &= \int_a^b \frac{1}{\beta - \alpha}
    \d x \\ &= \frac{ b - a }{ \beta - \alpha } \end{align*}
