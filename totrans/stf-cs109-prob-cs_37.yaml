- en: Uniform Distribution
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 均匀分布
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part2/uniform/](https://chrispiech.github.io/probabilityForComputerScientists/en/part2/uniform/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part2/uniform/](https://chrispiech.github.io/probabilityForComputerScientists/en/part2/uniform/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: 'The most basic of all the continuous random variables is the uniform random
    variable, which is equally likely to take on any value in its range ($\alpha,
    \beta$). $X$ is a *uniform random variable* ($X \sim \Uni(\alpha, \beta)$) if
    it has PDF: \begin{align*} f(x) = \begin{cases} \frac{1}{\beta - \alpha} &\text{when
    } \alpha \leq x \leq \beta \\ 0 & \text{otherwise} \end{cases} \end{align*}'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 所有连续随机变量中最基本的是均匀随机变量，它在范围（$\alpha, \beta$）内以相同的可能性取任何值。$X$ 是一个 *均匀随机变量*（$X \sim
    \Uni(\alpha, \beta)$），如果它具有以下概率密度函数：\begin{align*} f(x) = \begin{cases} \frac{1}{\beta
    - \alpha} &\text{when } \alpha \leq x \leq \beta \\ 0 & \text{otherwise} \end{cases}
    \end{align*}
- en: Notice how the density $1/(\beta - \alpha$) is exactly the same regardless of
    the value for $x$. That makes the density uniform. So why is the PDF $1/(\beta
    - \alpha)$ and not 1? That is the constant that makes it such that the integral
    over all possible inputs evaluates to 1.
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 注意密度 $1/(\beta - \alpha$) 不论 $x$ 的值如何都是相同的。这使得密度均匀。那么为什么概率密度函数是 $1/(\beta -
    \alpha)$ 而不是 1 呢？这就是使得对所有可能输入的积分等于 1 的常数。
- en: '**Uniform Random Variable**'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: '**均匀随机变量**'
- en: '| Notation: | $X \sim \Uni(\alpha, \beta)$ |'
  id: totrans-6
  prefs: []
  type: TYPE_TB
  zh: '| 符号: | $X \sim \Uni(\alpha, \beta)$ |'
- en: '| Description: | A continuous random variable that takes on values, with equal
    likelihood, between $\alpha$ and $\beta$ |'
  id: totrans-7
  prefs: []
  type: TYPE_TB
  zh: '| 描述: | 一个连续随机变量，其值在 $\alpha$ 和 $\beta$ 之间以相同的可能性出现 |'
- en: '| Parameters: | $\alpha \in \R$, the minimum value of the variable. $\beta
    \in \R$, $\beta > \alpha$, the maximum value of the variable. |'
  id: totrans-8
  prefs: []
  type: TYPE_TB
  zh: '| 参数: | $\alpha \in \R$, 变量的最小值。$\beta \in \R$, $\beta > \alpha$, 变量的最大值。 |'
- en: '| Support: | $x \in [\alpha, \beta]$ |'
  id: totrans-9
  prefs: []
  type: TYPE_TB
  zh: '| 支持集: | $x \in [\alpha, \beta]$ |'
- en: '| PDF equation: | $$f(x) = \begin{cases} \frac{1}{\beta - \alpha} && \text{for
    }x \in [\alpha, \beta]\\ 0 && \text{else} \end{cases}$$ |'
  id: totrans-10
  prefs: []
  type: TYPE_TB
  zh: '| 概率密度函数方程: | $$f(x) = \begin{cases} \frac{1}{\beta - \alpha} && \text{for
    }x \in [\alpha, \beta]\\ 0 && \text{else} \end{cases}$$ |'
- en: '| CDF equation: | $$F(x) = \begin{cases} \frac{x - \alpha}{\beta - \alpha}
    && \text{for }x \in [\alpha, \beta]\\ 0 && \text{for } x < \alpha \\ 1 && \text{for
    } x > \beta \end{cases}$$ |'
  id: totrans-11
  prefs: []
  type: TYPE_TB
  zh: '| 累积分布函数方程: | $$F(x) = \begin{cases} \frac{x - \alpha}{\beta - \alpha} && \text{for
    }x \in [\alpha, \beta]\\ 0 && \text{for } x < \alpha \\ 1 && \text{for } x > \beta
    \end{cases}$$ |'
- en: '| Expectation: | $\E[X] = \frac{1}{2}(\alpha + \beta)$ |'
  id: totrans-12
  prefs: []
  type: TYPE_TB
  zh: '| 期望值: | $\E[X] = \frac{1}{2}(\alpha + \beta)$ |'
- en: '| Variance: | $\var(X) = \frac{1}{12}(\beta - \alpha)^2$ |'
  id: totrans-13
  prefs: []
  type: TYPE_TB
  zh: '| 方差: | $\var(X) = \frac{1}{12}(\beta - \alpha)^2$ |'
