- en: Chapter 5 Importing data
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook/importing-data.html](https://rafalab.dfci.harvard.edu/dsbook/importing-data.html)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: We have been using data sets already stored as R objects. A data scientist will
    rarely have such luck and will have to import data into R from either a file,
    a database, or other sources. Currently, one of the most common ways of storing
    and sharing data for analysis is through electronic spreadsheets. A spreadsheet
    stores data in rows and columns. It is basically a file version of a data frame.
    When saving such a table to a computer file, one needs a way to define when a
    new row or column ends and the other begins. This in turn defines the cells in
    which single values are stored.
  prefs: []
  type: TYPE_NORMAL
- en: 'When creating spreadsheets with text files, like the ones created with a simple
    text editor, a new row is defined with return and columns are separated with some
    predefined special character. The most common characters are comma (`,`), semicolon
    (`;`), space ( ), and tab (a preset number of spaces or `\t`). Here is an example
    of what a comma separated file looks like if we open it with a basic text editor:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/885aaed1f16b6e35b69a850b0fd2cdfe.png)'
  prefs: []
  type: TYPE_IMG
- en: The first row contains column names rather than data. We call this a *header*,
    and when we read-in data from a spreadsheet it is important to know if the file
    has a header or not. Most reading functions assume there is a header. To know
    if the file has a header, it helps to look at the file before trying to read it.
    This can be done with a text editor or with RStudio. In RStudio, we can do this
    by either opening the file in the editor or navigating to the file location, double
    clicking on the file, and hitting *View File*.
  prefs: []
  type: TYPE_NORMAL
- en: However, not all spreadsheet files are in a text format. Google Sheets, which
    are rendered on a browser, are an example. Another example is the proprietary
    format used by Microsoft Excel. These can’t be viewed with a text editor. Despite
    this, due to the widespread use of Microsoft Excel software, this format is widely
    used.
  prefs: []
  type: TYPE_NORMAL
- en: We start this chapter by describing the difference between text (ASCII), Unicode,
    and binary files and how this affects how we import them. We then explain the
    concepts of file paths and working directories, which are essential to understand
    how to import data effectively. We then introduce the **readr** and **readxl**
    package and the functions that are available to import spreadsheets into R. Finally,
    we provide some recommendations on how to store and organize data in files. More
    complex challenges such as extracting data from web pages or PDF documents are
    left for the Data Wrangling part of the book.
  prefs: []
  type: TYPE_NORMAL
- en: 5.1 Paths and the working directory
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: The first step when importing data from a spreadsheet is to locate the file
    containing the data. Although we do not recommend it, you can use an approach
    similar to what you do to open files in Microsoft Excel by clicking on the RStudio
    “File” menu, clicking “Import Dataset”, then clicking through folders until you
    find the file. We want to be able to write code rather than use the point-and-click
    approach. The keys and concepts we need to learn to do this are described in detail
    in the Productivity Tools part of this book. Here we provide an overview of the
    very basics.
  prefs: []
  type: TYPE_NORMAL
- en: The main challenge in this first step is that we need to let the R functions
    doing the importing know where to look for the file containing the data. The simplest
    way to do this is to have a copy of the file in the folder in which the importing
    functions look by default. Once we do this, all we have to supply to the importing
    function is the filename.
  prefs: []
  type: TYPE_NORMAL
- en: A spreadsheet containing the US murders data is included as part of the **dslabs**
    package. Finding this file is not straightforward, but the following lines of
    code copy the file to the folder in which R looks in by default. We explain how
    these lines work below.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: This code does not read the data into R, it just copies a file. But once the
    file is copied, we can import the data with a simple line of code. Here we use
    the `read_csv` function from the **readr** package, which is part of the tidyverse.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: The data is imported and stored in `dat`. The rest of this section defines some
    important concepts and provides an overview of how we write code that tells R
    how to find the files we want to import. Chapter [38](unix.html#unix) provides
    more details on this topic.
  prefs: []
  type: TYPE_NORMAL
- en: 5.1.1 The filesystem
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'You can think of your computer’s filesystem as a series of nested folders,
    each containing other folders and files. Data scientists refer to folders as *directories*.
    We refer to the folder that contains all other folders as the *root directory*.
    We refer to the directory in which we are currently located as the *working directory*.
    The working directory therefore changes as you move through folders: think of
    it as your current location.'
  prefs: []
  type: TYPE_NORMAL
- en: 5.1.2 Relative and full paths
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: The *path* of a file is a list of directory names that can be thought of as
    instructions on what folders to click on, and in what order, to find the file.
    If these instructions are for finding the file from the root directory we refer
    to it as the *full path*. If the instructions are for finding the file starting
    in the working directory we refer to it as a *relative path*. Section [38.3](unix.html#filesystem)
    provides more details on this topic.
  prefs: []
  type: TYPE_NORMAL
- en: 'To see an example of a full path on your system type the following:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: The strings separated by slashes are the directory names. The first slash represents
    the root directory and we know this is a full path because it starts with a slash.
    If the first directory name appears without a slash in front, then the path is
    assumed to be relative. We can use the function `list.files` to see examples of
    relative paths.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: These relative paths give us the location of the files or directories if we
    start in the directory with the full path. For example, the full path to the `help`
    directory in the example above is `/Library/Frameworks/R.framework/Versions/3.5/Resources/library/dslabs/help`.
  prefs: []
  type: TYPE_NORMAL
- en: '**Note**: You will probably not make much use of the `system.file` function
    in your day-to-day data analysis work. We introduce it in this section because
    it facilitates the sharing of spreadsheets by including them in the **dslabs**
    package. You will rarely have the luxury of data being included in packages you
    already have installed. However, you will frequently need to navigate full and
    relative paths and import spreadsheet formatted data.'
  prefs: []
  type: TYPE_NORMAL
- en: 5.1.3 The working directory
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: We highly recommend only writing relative paths in your code. The reason is
    that full paths are unique to your computer and you want your code to be portable.
    You can get the full path of your working directory without writing out explicitly
    by using the `getwd` function.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE4]'
  prefs: []
  type: TYPE_PRE
- en: If you need to change your working directory, you can use the function `setwd`
    or you can change it through RStudio by clicking on “Session”.
  prefs: []
  type: TYPE_NORMAL
- en: 5.1.4 Generating path names
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Another example of obtaining a full path without writing out explicitly was
    given above when we created the object `fullpath` like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE5]'
  prefs: []
  type: TYPE_PRE
- en: 'The function `system.file` provides the full path of the folder containing
    all the files and directories relevant to the package specified by the `package`
    argument. By exploring the directories in `dir` we find that the `extdata` contains
    the file we want:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE6]'
  prefs: []
  type: TYPE_PRE
- en: 'The `system.file` function permits us to provide a subdirectory as a first
    argument, so we can obtain the fullpath of the `extdata` directory like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE7]'
  prefs: []
  type: TYPE_PRE
- en: The function `file.path` is used to combine directory names to produce the full
    path of the file we want to import.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE8]'
  prefs: []
  type: TYPE_PRE
- en: 5.1.5 Copying files using paths
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: The final line of code we used to copy the file into our home directory used
  prefs: []
  type: TYPE_NORMAL
- en: 'the function `file.copy`. This function takes two arguments: the file to copy
    and the name to give it in the new directory.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE9]'
  prefs: []
  type: TYPE_PRE
- en: If a file is copied successfully, the `file.copy` function returns `TRUE`. Note
    that we are giving the file the same name, `murders.csv`, but we could have named
    it anything. Also note that by not starting the string with a slash, R assumes
    this is a relative path and copies the file to the working directory.
  prefs: []
  type: TYPE_NORMAL
- en: 'You should be able to see the file in your working directory and can check
    by using:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]'
  prefs: []
  type: TYPE_PRE
- en: 5.2 The readr and readxl packages
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'In this section we introduce the main tidyverse data importing functions. We
    will use the `murders.csv` file provided by the **dslabs** package as an example.
    To simplify the illustration we will copy the file to our working directory using
    the following code:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]'
  prefs: []
  type: TYPE_PRE
- en: 5.2.1 readr
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The **readr** library includes functions for reading data stored in text file
    spreadsheets into R. **readr** is part of the **tidyverse** package, or you can
    load it directly:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE12]'
  prefs: []
  type: TYPE_PRE
- en: 'The following functions are available to read-in spreadsheets:'
  prefs: []
  type: TYPE_NORMAL
- en: '| Function | Format | Typical suffix |'
  prefs: []
  type: TYPE_TB
- en: '| --- | --- | --- |'
  prefs: []
  type: TYPE_TB
- en: '| read_table | white space separated values | txt |'
  prefs: []
  type: TYPE_TB
- en: '| read_csv | comma separated values | csv |'
  prefs: []
  type: TYPE_TB
- en: '| read_csv2 | semicolon separated values | csv |'
  prefs: []
  type: TYPE_TB
- en: '| read_tsv | tab delimited separated values | tsv |'
  prefs: []
  type: TYPE_TB
- en: '| read_delim | general text file format, must define delimiter | txt |'
  prefs: []
  type: TYPE_TB
- en: 'Although the suffix usually tells us what type of file it is, there is no guarantee
    that these always match. We can open the file to take a look or use the function
    `read_lines` to look at a few lines:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE13]'
  prefs: []
  type: TYPE_PRE
- en: 'This also shows that there is a header. Now we are ready to read-in the data
    into R. From the .csv suffix and the peek at the file, we know to use `read_csv`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE14]'
  prefs: []
  type: TYPE_PRE
- en: 'Note that we receive a message letting us know what data types were used for
    each column. Also note that `dat` is a `tibble`, not just a data frame. This is
    because `read_csv` is a **tidyverse** parser. We can confirm that the data has
    in fact been read-in with:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE15]'
  prefs: []
  type: TYPE_PRE
- en: 'Finally, note that we can also use the full path for the file:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE16]'
  prefs: []
  type: TYPE_PRE
- en: 5.2.2 readxl
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: You can load the **readxl** package using
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE17]'
  prefs: []
  type: TYPE_PRE
- en: 'The package provides functions to read-in Microsoft Excel formats:'
  prefs: []
  type: TYPE_NORMAL
- en: '| Function | Format | Typical suffix |'
  prefs: []
  type: TYPE_TB
- en: '| --- | --- | --- |'
  prefs: []
  type: TYPE_TB
- en: '| read_excel | auto detect the format | xls, xlsx |'
  prefs: []
  type: TYPE_TB
- en: '| read_xls | original format | xls |'
  prefs: []
  type: TYPE_TB
- en: '| read_xlsx | new format | xlsx |'
  prefs: []
  type: TYPE_TB
- en: The Microsoft Excel formats permit you to have more than one spreadsheet in
    one file. These are referred to as *sheets*. The functions listed above read the
    first sheet by default, but we can also read the others. The `excel_sheets` function
    gives us the names of all the sheets in an Excel file. These names can then be
    passed to the `sheet` argument in the three functions above to read sheets other
    than the first.
  prefs: []
  type: TYPE_NORMAL
- en: 5.3 Exercises
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '1\. Use the `read_csv` function to read each of the files that the following
    code saves in the `files` object:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE18]'
  prefs: []
  type: TYPE_PRE
- en: 2\. Note that the last one, the `olive` file, gives us a warning. This is because
    the first line of the file is missing the header for the first column.
  prefs: []
  type: TYPE_NORMAL
- en: Read the help file for `read_csv` to figure out how to read in the file without
    reading this header. If you skip the header, you should not get this warning.
    Save the result to an object called `dat`.
  prefs: []
  type: TYPE_NORMAL
- en: '3\. A problem with the previous approach is that we don’t know what the columns
    represent. Type:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE19]'
  prefs: []
  type: TYPE_PRE
- en: to see that the names are not informative.
  prefs: []
  type: TYPE_NORMAL
- en: Use the `readLines` function to read in just the first line (we later learn
    how to extract values from the output).
  prefs: []
  type: TYPE_NORMAL
- en: 5.4 Downloading files
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'Another common place for data to reside is on the internet. When these data
    are in files, we can download them and then import them or even read them directly
    from the web. For example, we note that because our **dslabs** package is on GitHub,
    the file we downloaded with the package has a url:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE20]'
  prefs: []
  type: TYPE_PRE
- en: 'The `read_csv` file can read these files directly:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE21]'
  prefs: []
  type: TYPE_PRE
- en: 'If you want to have a local copy of the file, you can use the `download.file`
    function:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE22]'
  prefs: []
  type: TYPE_PRE
- en: This will download the file and save it on your system with the name `murders.csv`.
    You can use any name here, not necessarily `murders.csv`. Note that when using
    `download.file` you should be careful as **it will overwrite existing files without
    warning**.
  prefs: []
  type: TYPE_NORMAL
- en: 'Two functions that are sometimes useful when downloading data from the internet
    are `tempdir` and `tempfile`. The first creates a directory with a random name
    that is very likely to be unique. Similarly, `tempfile` creates a character string,
    not a file, that is likely to be a unique filename. So you can run a command like
    this which erases the temporary file once it imports the data:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE23]'
  prefs: []
  type: TYPE_PRE
- en: 5.5 R-base importing functions
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'R-base also provides import functions. These have similar names to those in
    the **tidyverse**, for example `read.table`, `read.csv` and `read.delim`. You
    can obtain an data frame like `dat` using:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE24]'
  prefs: []
  type: TYPE_PRE
- en: 'An often useful R-base importing function is `scan`, as it provides much flexibility.
    When reading in spreadsheets many things can go wrong. The file might have a multiline
    header, be missing cells, or it might use an unexpected encoding[^(13)](#fn13).
    We recommend you read this post about common issues found here: [https://www.joelonsoftware.com/2003/10/08/the-absolute-minimum-every-software-developer-absolutely-positively-must-know-about-unicode-and-character-sets-no-excuses/](https://www.joelonsoftware.com/2003/10/08/the-absolute-minimum-every-software-developer-absolutely-positively-must-know-about-unicode-and-character-sets-no-excuses/).'
  prefs: []
  type: TYPE_NORMAL
- en: 'With experience you will learn how to deal with different challenges. Carefully
    reading the help files for the functions discussed here will be useful. With scan
    you can read-in each cell of a file. Here is an example:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE25]'
  prefs: []
  type: TYPE_PRE
- en: Note that the tidyverse provides `read_lines`, a similarly useful function.
  prefs: []
  type: TYPE_NORMAL
- en: 5.6 Text versus binary files
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'For data science purposes, files can generally be classified into two categories:
    text files (also known as ASCII files) and binary files. You have already worked
    with text files. All your R scripts are text files and so are the R markdown files
    used to create this book. The csv tables you have read are also text files. One
    big advantage of these files is that we can easily “look” at them without having
    to purchase any kind of special software or follow complicated instructions. Any
    text editor can be used to examine a text file, including freely available editors
    such as RStudio, Notepad, textEdit, vi, emacs, nano, and pico. To see this, try
    opening a csv file using the “Open file” RStudio tool. You should be able to see
    the content right on your editor. However, if you try to open, say, an Excel xls
    file, jpg or png file, you will not be able to see anything immediately useful.
    These are binary files. Excel files are actually compressed folders with several
    text files inside. But the main distinction here is that text files can be easily
    examined.'
  prefs: []
  type: TYPE_NORMAL
- en: Although R includes tools for reading widely used binary files, such as xls
    files, in general you will want to find data sets stored in text files. Similarly,
    when sharing data you want to make it available as text files as long as storage
    is not an issue (binary files are much more efficient at saving space on your
    disk). In general, plain-text formats make it easier to share data since commercial
    software is not required for working with the data.
  prefs: []
  type: TYPE_NORMAL
- en: Extracting data from a spreadsheet stored as a text file is perhaps the easiest
    way to bring data from a file to an R session. Unfortunately, spreadsheets are
    not always available and the fact that you can look at text files does not necessarily
    imply that extracting data from them will be straightforward. In the Data Wrangling
    part of the book we learn to extract data from more complex text files such as
    html files.
  prefs: []
  type: TYPE_NORMAL
- en: 5.7 Unicode versus ASCII
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'A pitfall in data science is assuming a file is an ASCII text file when, in
    fact, it is something else that can look a lot like an ASCII text file: a Unicode
    text file.'
  prefs: []
  type: TYPE_NORMAL
- en: 'To understand the difference between these, remember that everything on a computer
    needs to eventually be converted to 0s and 1s. ASCII is an *encoding* that maps
    characters to numbers. ASCII uses 7 bits (0s and 1s) which results in \(2^7 =
    128\) unique items, enough to encode all the characters on an English language
    keyboard. However, other languages use characters not included in this encoding.
    For example, the é in México is not encoded by ASCII. For this reason, a new encoding,
    using more than 7 bits, was defined: Unicode. When using Unicode, one can chose
    between 8, 16, and 32 bits abbreviated UTF-8, UTF-16, and UTF-32 respectively.
    RStudio actually defaults to UTF-8 encoding.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Although we do not go into the details of how to deal with the different encodings
    here, it is important that you know these different encodings exist so that you
    can better diagnose a problem if you encounter it. One way problems manifest themselves
    is when you see “weird looking” characters you were not expecting. This StackOverflow
    discussion is an example: [https://stackoverflow.com/questions/18789330/r-on-windows-character-encoding-hell](https://stackoverflow.com/questions/18789330/r-on-windows-character-encoding-hell).'
  prefs: []
  type: TYPE_NORMAL
- en: 5.8 Organizing data with spreadsheets
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Although this book focuses almost exclusively on data analysis, data management
    is also an important part of data science. As explained in the introduction, we
    do not cover this topic. However, quite often data analysts needs to collect data,
    or work with others collecting data, in a way that is most conveniently stored
    in a spreadsheet. Although filling out a spreadsheet by hand is a practice we
    highly discourage, we instead recommend the process be automatized as much as
    possible, sometimes you just have to do it. Therefore, in this section, we provide
    recommendations on how to organize data in a spreadsheet. Although there are R
    packages designed to read Microsoft Excel spreadsheets, we generally want to avoid
    this format. Instead, we recommend Google Sheets as a free software tool. Below
    we summarize the recommendations made in paper by Karl Broman and Kara Woo[^(14)](#fn14).
    Please read the paper for important details.
  prefs: []
  type: TYPE_NORMAL
- en: '**Be Consistent** - Before you commence entering data, have a plan. Once you
    have a plan, be consistent and stick to it.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Choose Good Names for Things** - You want the names you pick for objects,
    files, and directories to be memorable, easy to spell, and descriptive. This is
    actually a hard balance to achieve and it does require time and thought. One important
    rule to follow is **do not use spaces**, use underscores `_` or dashes instead
    `-`. Also, avoid symbols; stick to letters and numbers.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Write Dates as YYYY-MM-DD** - To avoid confusion, we strongly recommend using
    this global ISO 8601 standard.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**No Empty Cells** - Fill in all cells and use some common code for missing
    data.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Put Just One Thing in a Cell** - It is better to add columns to store the
    extra information rather than having more than one piece of information in one
    cell.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Make It a Rectangle** - The spreadsheet should be a rectangle.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Create a Data Dictionary** - If you need to explain things, such as what
    the columns are or what the labels used for categorical variables are, do this
    in a separate file.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**No Calculations in the Raw Data Files** - Excel permits you to perform calculations.
    Do not make this part of your spreadsheet. Code for calculations should be in
    a script.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Do Not Use Font Color or Highlighting as Data** - Most import functions are
    not able to import this information. Encode this information as a variable instead.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Make Backups** - Make regular backups of your data.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Use Data Validation to Avoid Errors** - Leverage the tools in your spreadsheet
    software so that the process is as error-free and repetitive-stress-injury-free
    as possible.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Save the Data as Text Files** - Save files for sharing in comma or tab delimited
    format.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 5.9 Exercises
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 1\. Pick a measurement you can take on a regular basis. For example, your daily
    weight or how long it takes you to run 5 miles. Keep a spreadsheet that includes
    the date, the hour, the measurement, and any other informative variable you think
    is worth keeping. Do this for 2 weeks. Then make a plot.
  prefs: []
  type: TYPE_NORMAL
- en: '* * *'
