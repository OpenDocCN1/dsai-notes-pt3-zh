- en: Chapter 36 Installing R and RStudio
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook/installing-r-rstudio.html](https://rafalab.dfci.harvard.edu/dsbook/installing-r-rstudio.html)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: 'The instructions below include screen shots from the installation process in
    which we used the Chrome browser which, although not necessary, you can freely
    download and install from here: [https://www.google.com/chrome/](https://www.google.com/chrome/).'
  prefs: []
  type: TYPE_NORMAL
- en: 36.1 Installing R
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: RStudio is an interactive desktop environment, but it is not R, nor does it
    include R when you download and install it. Therefore, to use RStudio, we first
    need to install R.
  prefs: []
  type: TYPE_NORMAL
- en: 'You can download R from the Comprehensive R Archive Network (CRAN)[^(112)](#fn112).
    Search for CRAN on your browser:'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/86ba0258737cf73d4c74cb6c36c6590f.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Once on the CRAN page, select the version for your operating system: Linux,
    Mac OS X, or Windows.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/d8c1109f9388f9c79b2a39c961da9f07.png)'
  prefs: []
  type: TYPE_IMG
- en: Here we show screenshots for Windows, but the process is similar for the other
    platforms. When they differ, we will also show screenshots for Mac OS X.
  prefs: []
  type: TYPE_NORMAL
- en: Once at the CRAN download page, you will have several choices. You want to install
    the *base* subdirectory. This installs the basic packages you need to get started.
    We will later learn how to install other needed packages from within R, rather
    than from this webpage.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/d060a1f1fb5f6c03653e67f85b17a75d.png)'
  prefs: []
  type: TYPE_IMG
- en: Click on the link for the latest version to start the download.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/73d20adb8e3bb621865f5b6d14a64187.png)'
  prefs: []
  type: TYPE_IMG
- en: If you are using Chrome, at the bottom of your browser you should see a tab
    that shows you the progress of the download. Once the installer file downloads,
    you can click on that tab to start the installation process. Other browsers may
    be different, so you will have to find where they store downloaded files and click
    on them to get the process started.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/78f2bce6bcba7b75f4075222f675fc5b.png)'
  prefs: []
  type: TYPE_IMG
- en: If using Safari on a Mac, you can access the download through the download button.
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/37f5d87cd17878d70ebfc2bae9beca8a.png)'
  prefs: []
  type: TYPE_IMG
- en: You can now click through different choices to finish the installation. We recommend
    you select all the default choices.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/11e78052519f7c2cfbbe4b81e4de2044.png)'
  prefs: []
  type: TYPE_IMG
- en: Select the default even when you get an ominous warning.
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/ddf9b1bd239689d435c2555300ad15ef.png)'
  prefs: []
  type: TYPE_IMG
- en: When selecting the language, consider that it will be easier to follow this
    book if you select English.
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/738822bc921e96d6f6cb793c4a8f1486.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Continue to select all the defaults:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/d199a56edacf27d0ff261b28701e2a05.png)![](../Images/b1d2403c5690ee01a54581950bbfc9f8.png)![](../Images/b22d951dbfda8663f080bbfc333511bd.png)![](../Images/60cec3770a0f2c1760ccdb9e97055e74.png)'
  prefs: []
  type: TYPE_IMG
- en: '![](../Images/ea00e7db750a5869602be42af46acc58.png)![](../Images/8f26c7b536389542e66e5a46c7983ae8.png)![](../Images/de75edcfe2e472359a97684d88339ae5.png)'
  prefs: []
  type: TYPE_IMG
- en: 'On the Mac it looks different, but you are also accepting the defaults:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/457b309c3e19a311663d7f0f4f47615f.png)![](../Images/7f1bf08363f96afe4743f897a9dbb60b.png)![](../Images/5a9e3f5d998227ffa951eca8111c1f68.png)![](../Images/00a9a20fcd044ec61f56eb6be5206875.png)'
  prefs: []
  type: TYPE_IMG
- en: '![](../Images/616197c8caa0c581cb80da5f25bbef87.png)![](../Images/7649e58c0ae1cf56361bdabcd2229d95.png)![](../Images/41f0c8b84b6c4159604c392e9d67321a.png)![](../Images/ff7a79f9073732497d138d8f7be8f0ae.png)![](../Images/c9cfdc29d79cf8c335a016138d32550b.png)'
  prefs: []
  type: TYPE_IMG
- en: Congratulations! You have installed R.
  prefs: []
  type: TYPE_NORMAL
- en: 36.2 Installing RStudio
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'You can start by searching for RStudio on your browser:'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/c4a2563702f26202e62fccaa1bb02aaa.png)'
  prefs: []
  type: TYPE_IMG
- en: You should find the RStudio website as shown above. Once there, click on *Download
    RStudio*.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/41b0cb72de6f3ab6b8652c82bcd32186.png)'
  prefs: []
  type: TYPE_IMG
- en: 'This will give you several options. For what we do in this book, it is more
    than enough to use the free Desktop version:'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/94a732e024e30c08293dffcc8c4c0691.png)'
  prefs: []
  type: TYPE_IMG
- en: Once you select this option, it will take you to a page in which the operating
    system options are provided. Click the link showing your operating system.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/ecae07cacbbbd670daa253a75a68c562.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Once the installation file is downloaded, click on the downloaded file to start
    the installation process:'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/cd51bf1dcc1c7a7ec41efa94c8e95aa4.png)'
  prefs: []
  type: TYPE_IMG
- en: We recommend clicking yes on all the defaults.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '![](../Images/d390a9bb7b7770c5a05aca191799c0ab.png)![](../Images/d43491495726ba52fe3de13b1d0760ef.png)![](../Images/ecde10c9ef06b55e3c470c60c351adb2.png)'
  prefs: []
  type: TYPE_IMG
- en: '![](../Images/45a45bc48c2d3ee91934fd293a8d436c.png)![](../Images/c9daa478e0286f52308578648b4e26c4.png)![](../Images/92dc492236a8afbac5ba6335281a325f.png)'
  prefs: []
  type: TYPE_IMG
- en: 'On the Mac, there are fewer clicks. You basically drag and drop the RStudio
    icon into the Applications folder icon here:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/7269eee4972ee01bfb8fb1e2ef6a0753.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Congratulations! You have installed RStudio. You can now get started as you
    do on any other program in your computer. On Windows, you can open RStudio from
    the *Start* menu. If RStudio does not appear, you can search for it:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/234f056d14352a27e7bf9c84337a3fdc.png)'
  prefs: []
  type: TYPE_IMG
- en: 'On the Mac, it will be in the Applications folder:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/b085c13db64656776f408e71d28a42dc.png)![](../Images/2a75183ae59531446fbf079bdf146d15.png)'
  prefs: []
  type: TYPE_IMG
- en: '**Pro tip for the Mac**: To avoid using the mouse to open RStudio, hit command+spacebar
    to open *Spotlight Search* and type RStudio into that search bar, then hit enter.'
  prefs: []
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
