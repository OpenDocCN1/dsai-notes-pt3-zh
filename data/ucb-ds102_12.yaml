    stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>π</mi><msup><mo stretchy="false">)</mo><mrow><mn>1</mn><mo>−</mo><msub><mi>z</mi><mi>i</mi></msub></mrow></msup></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>μ</mi><mi>k</mi></msub><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi
    mathvariant="script">N</mi><mo stretchy="false">(</mo><msub><mi>μ</mi><mi>k</mi></msub><mo
    separator="true">;</mo><msub><mi>μ</mi><mi>p</mi></msub><mo separator="true">,</mo><msub><mi>σ</mi><mi>p</mi></msub><mo
    stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mi
    mathvariant="normal">∣</mi><msub><mi>z</mi><mi>i</mi></msub><mo separator="true">,</mo><msub><mi>μ</mi><mn>0</mn></msub><mo
    separator="true">,</mo><msub><mi>μ</mi><mn>1</mn></msub><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi mathvariant="script">N</mi><mo
    stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo separator="true">;</mo><msub><mi>μ</mi><msub><mi>z</mi><mi>i</mi></msub></msub><mo
    separator="true">,</mo><mi>σ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} p(z_i) &= \pi^{z_i}(1-\pi)^{1-z_i}
    \\ p(\mu_k) &= \mathcal{N}(\mu_k; \mu_p, \sigma_p) \\ p(x_i | z_i, \mu_0, \mu_1)
    &= \mathcal{N}(x_i; \mu_{z_i}, \sigma) \end{align}</annotation></semantics>p(zi​)p(μk​)p(xi​∣zi​,μ0​,μ1​)​=πzi​(1−π)1−zi​=N(μk​;μp​,σp​)=N(xi​;μzi​​,σ)​​[(8)](#Tqt6q2Dr6G
    "链接到此方程")
- en: We can try computing the posterior over the hidden variables <semantics><mrow><msub><mi>z</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">z_i</annotation></semantics>zi​, <semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation
    encoding="application/x-tex">\mu_0</annotation></semantics>μ0​, and <semantics><mrow><msub><mi>μ</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">\mu_1</annotation></semantics>μ1​. We’ll use the
    notation <semantics><mrow><msub><mi>z</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub></mrow><annotation
    encoding="application/x-tex">z_{1:n}</annotation></semantics>z1:n​ to represent
    <semantics><mrow><msub><mi>z</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>z</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">z_1,
    \dots, z_n</annotation></semantics>z1​,…,zn​ (and similarly for <semantics><mrow><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub></mrow><annotation
    encoding="application/x-tex">x_{1:n}</annotation></semantics>x1:n​).
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以尝试计算关于隐藏变量 <semantics><mrow><msub><mi>z</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">z_i</annotation></semantics>zi​、<semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation
    encoding="application/x-tex">\mu_0</annotation></semantics>μ0​ 和 <semantics><mrow><msub><mi>μ</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">\mu_1</annotation></semantics>μ1​ 的后验分布。我们将使用符号 <semantics><mrow><msub><mi>z</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub></mrow><annotation
    encoding="application/x-tex">z_{1:n}</annotation></semantics>z1:n​ 来表示 <semantics><mrow><msub><mi>z</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>z</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">z_1, \dots, z_n</annotation></semantics>z1​,…,zn​（对于
    <semantics><mrow><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub></mrow><annotation
    encoding="application/x-tex">x_{1:n}</annotation></semantics>x1:n​ 同理）。
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>z</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo
    separator="true">,</mo><msub><mi>μ</mi><mn>0</mn></msub><mo separator="true">,</mo><msub><mi>μ</mi><mn>1</mn></msub><mi
    mathvariant="normal">∣</mi><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>∝</mo><mi>p</mi><mo
    stretchy="false">(</mo><msub><mi>μ</mi><mn>0</mn></msub><mo stretchy="false">)</mo><mi>p</mi><mo
    stretchy="false">(</mo><msub><mi>μ</mi><mn>1</mn></msub><mo stretchy="false">)</mo><munder><mo>∏</mo><mi>i</mi></munder><mrow><mo
    fence="true">[</mo><mi>p</mi><mo stretchy="false">(</mo><msub><mi>z</mi><mi>i</mi></msub><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mi
    mathvariant="normal">∣</mi><msub><mi>z</mi><mi>i</mi></msub><mo separator="true">,</mo><msub><mi>μ</mi><mn>0</mn></msub><mo
    separator="true">,</mo><msub><mi>μ</mi><mn>1</mn></msub><mo stretchy="false">)</mo><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd></mtr></mtable><annotation encoding="application/x-tex">\begin{align}
    p(z_{1:n}, \mu_0, \mu_1 | x_{1:n}) &\propto p(\mu_0)p(\mu_1)\prod_i \left[p(z_i)
    p(x_i | z_i, \mu_0, \mu_1)\right] \end{align}</annotation></semantics>p(z1:n​,μ0​,μ1​∣x1:n​)​∝p(μ0​)p(μ1​)i∏​[p(zi​)p(xi​∣zi​,μ0​,μ1​)]​​[(9)](#eYhX5JlzSt
    "Link to this Equation")
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>z</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo
    separator="true">,</mo><msub><mi>μ</mi><mn>0</mn></msub><mo separator="true">,</mo><msub><mi>μ</mi><mn>1</mn></msub><mi
    mathvariant="normal">∣</mi><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>∝</mo><mi>p</mi><mo
    stretchy="false">(</mo><msub><mi>μ</mi><mn>0</mn></msub><mo stretchy="false">)</mo><mi>p</mi><mo
    stretchy="false">(</mo><msub><mi>μ</mi><mn>1</mn></msub><mo stretchy="false">)</mo><munder><mo>∏</mo><mi>i</mi></munder><mrow><mo
    fence="true">[</mo><mi>p</mi><mo stretchy="false">(</mo><msub><mi>z</mi><mi>i</mi></msub><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mi
    mathvariant="normal">∣</mi><msub><mi>z</mi><mi>i</mi></msub><mo separator="true">,</mo><msub><mi>μ</mi><mn>0</mn></msub><mo
    separator="true">,</mo><msub><mi>μ</mi><mn>1</mn></msub><mo stretchy="false">)</mo><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd></mtr></mtable><annotation encoding="application/x-tex">\begin{align}
    p(z_{1:n}, \mu_0, \mu_1 | x_{1:n}) &\propto p(\mu_0)p(\mu_1)\prod_i \left[p(z_i)
    p(x_i | z_i, \mu_0, \mu_1)\right] \end{align}</annotation></semantics>p(z1:n​,μ0​,μ1​∣x1:n​)​∝p(μ0​)p(μ1​)i∏​[p(zi​)p(xi​∣zi​,μ0​,μ1​)]​​[(9)](#eYhX5JlzSt
    "链接到此方程")
- en: This distribution is more complicated than anything we’ve seen up until now.
    It’s the joint distribution over <semantics><mrow><mi>n</mi><mo>+</mo><mn>2</mn></mrow><annotation
    encoding="application/x-tex">n+2</annotation></semantics>n+2 random variables
    (the group labels <semantics><mrow><msub><mi>z</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>z</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">z_1,
    \ldots, z_n</annotation></semantics>z1​,…,zn​ and the two group means <semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation
    encoding="application/x-tex">\mu_0</annotation></semantics>μ0​ and <semantics><mrow><msub><mi>μ</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">\mu_1</annotation></semantics>μ1​).
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: 这个分布比我们目前所见过的任何分布都要复杂。它是关于 **n+2** 个随机变量（组标签 <semantics><mrow><msub><mi>z</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>z</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">z_1, \ldots, z_n</annotation></semantics>z1​,…,zn​
    以及两个组均值 <semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation encoding="application/x-tex">\mu_0</annotation></semantics>μ0​
    和 <semantics><mrow><msub><mi>μ</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">\mu_1</annotation></semantics>μ1​）的联合分布。
- en: 'Computing the normalization constant <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(x_{1:n})</annotation></semantics>p(x1:n​)
    requires a complicated combination of sums and integrals:'
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: 计算归一化常数 <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(x_{1:n})</annotation></semantics>p(x1:n​)
    需要复杂的求和与积分组合：
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><munderover><mo>∑</mo><mrow><msub><mi>z</mi><mn>1</mn></msub><mo>=</mo><mn>0</mn></mrow><mn>1</mn></munderover><munderover><mo>∑</mo><mrow><msub><mi>z</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn></mrow><mn>1</mn></munderover><mo>…</mo><munderover><mo>∑</mo><mrow><msub><mi>z</mi><mi>n</mi></msub><mo>=</mo><mn>0</mn></mrow><mn>1</mn></munderover><mo>∫</mo><mo>∫</mo><mi>p</mi><mo
    stretchy="false">(</mo><msub><mi>μ</mi><mn>0</mn></msub><mo stretchy="false">)</mo><mi>p</mi><mo
    stretchy="false">(</mo><msub><mi>μ</mi><mn>1</mn></msub><mo stretchy="false">)</mo><munder><mo>∏</mo><mi>i</mi></munder><mrow><mo
    fence="true">[</mo><mi>p</mi><mo stretchy="false">(</mo><msub><mi>z</mi><mi>i</mi></msub><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mi
    mathvariant="normal">∣</mi><msub><mi>z</mi><mi>i</mi></msub><mo separator="true">,</mo><msub><mi>μ</mi><mn>0</mn></msub><mo
    separator="true">,</mo><msub><mi>μ</mi><mn>1</mn></msub><mo stretchy="false">)</mo><mo
    fence="true">]</mo></mrow><mi>d</mi><msub><mi>μ</mi><mn>0</mn></msub><mi>d</mi><msub><mi>μ</mi><mn>1</mn></msub></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} p(x_{1:n}) &= \sum_{z_1=0}^1 \sum_{z_2=0}^1
    \ldots \sum_{z_n=0}^1 \int \int p(\mu_0)p(\mu_1)\prod_i \left[p(z_i) p(x_i | z_i,
    \mu_0, \mu_1)\right] d\mu_0 d\mu_1 \end{align}</annotation></semantics>p(x1:n​)​=z1​=0∑1​z2​=0∑1​…zn​=0∑1​∫∫p(μ0​)p(μ1​)i∏​[p(zi​)p(xi​∣zi​,μ0​,μ1​)]dμ0​dμ1​​​[(10)](#XLdn19lhCQ
    "Link to this Equation")
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mrow><mn>1</mn><mo>:</mo><mi>n</mi></mrow></msub><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><munderover><mo>∑</mo><mrow><msub><mi>z</mi><mn>1</mn></msub><mo>=</mo><mn>0</mn></mrow><mn>1</mn></munderover><munderover><mo>∑</mo><mrow><msub><mi>z</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn></mrow><mn>1</mn></munderover><mo>…</mo><munderover><mo>∑</mo><mrow><msub><mi>z</mi><mi>n</mi></msub><mo>=</mo><mn>0</mn></mrow><mn>1</mn></munderover><mo>∫</mo><mo>∫</mo><mi>p</mi><mo
    stretchy="false">(</mo><msub><mi>μ</mi><mn>0</mn></msub><mo stretchy="false">)</mo><mi>p</mi><mo
    stretchy="false">(</mo><msub><mi>μ</mi><mn>1</mn></msub><mo stretchy="false">)</mo><munder><mo>∏</mo><mi>i</mi></munder><mrow><mo
    fence="true">[</mo><mi>p</mi><mo stretchy="false">(</mo><msub><mi>z</mi><mi>i</mi></msub><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mi
    mathvariant="normal">∣</mi><msub><mi>z</mi><mi>i</mi></msub><mo separator="true">,</mo><msub><mi>μ</mi><mn>0</mn></msub><mo
    separator="true">,</mo><msub><mi>μ</mi><mn>1</mn></msub><mo stretchy="false">)</mo><mo
    fence="true">]</mo></mrow><mi>d</mi><msub><mi>μ</mi><mn>0</mn></msub><mi>d</mi><msub><mi>μ</mi><mn>1</mn></msub></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} p(x_{1:n}) &= \sum_{z_1=0}^1 \sum_{z_2=0}^1
    \ldots \sum_{z_n=0}^1 \int \int p(\mu_0)p(\mu_1)\prod_i \left[p(z_i) p(x_i | z_i,
    \mu_0, \mu_1)\right] d\mu_0 d\mu_1 \end{align}</annotation></semantics>p(x1:n​)​=z1​=0∑1​z2​=0∑1​…zn​=0∑1​∫∫p(μ0​)p(μ1​)i∏​[p(zi​)p(xi​∣zi​,μ0​,μ1​)]dμ0​dμ1​​​[(10)](#XLdn19lhCQ
    "链接到此方程")
- en: 'For our dataset of over 500 planets, the sums alone would require a completely
    intractable amount of computation:'
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: 对于我们包含超过 500 颗行星的数据集，仅求和运算就需要完全无法承受的计算量：
- en: '[PRE2]'
  id: totrans-54
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: '`429049853758163107186368799942587076079339706258956588087153966199096448962353503257659977541340909686081019461967553627320124249982290238285876768194691072`'
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: '`429049853758163107186368799942587076079339706258956588087153966199096448962353503257659977541340909686081019461967553627320124249982290238285876768194691072`'
- en: 'Worse still, we can’t even compute the MAP estimate for the labels <semantics><mrow><msub><mi>z</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">z_i</annotation></semantics>zi​: in order to find
    the one that maximizes the numerator, we’d have to search over all 2^(517) combinations,
    which is also completely intractable.'
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: 更糟糕的是，我们甚至无法计算标签 <semantics><mrow><msub><mi>z</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">z_i</annotation></semantics>zi​ 的**最大后验概率估计**：为了找到使分子最大化的那个，我们必须搜索所有
    2^(517) 种组合，这同样是完全不可行的。
- en: 'Even in this fairly simple model, with two groups, we’ve found that exact inference
    is completely hopeless: there’s no way we can compute the exact posterior for
    all our unknowns. In the rest of this section, we’ll talk about ways to get around
    this problem using approximations to the posterior distribution.'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: 即使在这个相当简单的、只有两个组的模型中，我们也发现精确推断是完全无望的：我们无法计算所有未知量的精确后验概率。在本节的剩余部分，我们将讨论如何通过后验分布的近似方法来绕过这个问题。
- en: Specifically, our approximation methods will take advantage of what we’ve learned.
    We know that the hardest part of computing posterior distributions is computing
    the normalization constant <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(x)</annotation></semantics>p(x).
    So, we’ll build methods that start with the unnormalized posterior <semantics><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(x|\theta)p(\theta)</annotation></semantics>p(x∣θ)p(θ)
    and use that to give us an approximation of the actual posterior <semantics><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mi mathvariant="normal">∣</mi><mi>x</mi><mo
    stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">p(\theta|x) = \frac{p(x|\theta)p(\theta)}{p(x)}</annotation></semantics>p(θ∣x)=p(x)p(x∣θ)p(θ)​.
    While there are multiple families of methods to provide such approximations, in
    this textbook we’ll focus on ones that use **samples** to approximate the distribution.
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 具体而言，我们的近似方法将利用已掌握的知识。我们知道，计算后验分布最困难的部分在于计算归一化常数 <semantics><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(x)</annotation></semantics>p(x)。因此，我们将构建从非归一化后验
    <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(x|\theta)p(\theta)</annotation></semantics>p(x∣θ)p(θ)
    入手的方法，并利用它来给出实际后验 <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mi
    mathvariant="normal">∣</mi><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
