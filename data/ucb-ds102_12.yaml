- en: We can write the likelihood and prior. To simplify, we’ll write <semantics><mrow><mi
    mathvariant="script">N</mi><mo stretchy="false">(</mo><mi>y</mi><mo separator="true">;</mo><mi>m</mi><mo
    separator="true">,</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mi>s</mi><msqrt><mrow><mn>2</mn><mi>π</mi></mrow></msqrt></mrow></mfrac><mi>exp</mi><mo>⁡</mo><mrow><mo
    fence="true">{</mo><mo>−</mo><mfrac><mn>1</mn><mrow><mn>2</mn><msup><mi>s</mi><mn>2</mn></msup></mrow></mfrac><mo
    stretchy="false">(</mo><mi>y</mi><mo>−</mo><mi>m</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo
    fence="true">}</mo></mrow></mrow><annotation encoding="application/x-tex">\mathcal{N}(y;
    m, s) = \frac{1}{s \sqrt{2\pi}} \exp\left\{-\frac{1}{2s^2}(y - m)^2\right\}</annotation></semantics>N(y;m,s)=s2π​1​exp{−2s21​(y−m)2}
