- en: '[PRE0]'
  id: totrans-3
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: Bayesian Inference[¶](#bayesian-inference "Link to this Section")
  id: totrans-4
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 贝叶斯推断[¶](#bayesian-inference "Link to this Section")
- en: In this section, we’ll focus on computing and using posterior distributions
    in more sophisticated Bayesian models. We’ll start by discussing why posterior
    distributions are useful in Bayesian inference, and then explain why they’re hard.
    Then, in the next section, we’ll learn about approximating distributions using
    sampling.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 在本节中，我们将重点讨论如何在更复杂的贝叶斯模型中计算和使用后验分布。我们将首先讨论后验分布在贝叶斯推断中的用处，然后解释为何它们难以计算。接着，在下一节中，我们将学习如何使用抽样来近似分布。
- en: Why we need posterior distributions[¶](#why-we-need-posterior-distributions
    "Link to this Section")
  id: totrans-6
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 为何我们需要后验分布[¶](#why-we-need-posterior-distributions "Link to this Section")
- en: In general, we need the posterior distribution so that we can make statements
    and decisions about our unknown quantity of interest, <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ. We saw that for
    simple models like the product review model or the model for heights, it was easy
    to compute the posterior exactly, because we chose a conjugate prior.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 通常，我们需要后验分布以便能够对我们感兴趣的未知量 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    进行陈述和决策。我们看到，对于像产品评价模型或身高模型这样的简单模型，由于我们选择了共轭先验，精确计算后验分布很容易。
- en: 'In the product review example:'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 在产品评价示例中：
- en: Our parameter of interest <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    represents the probability of a positive review.
  id: totrans-9
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 我们感兴趣的参数 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    代表获得正面评价的概率。
- en: 'If we chose a Beta prior, i.e., <semantics><mrow><mi>θ</mi><mo>∼</mo><mrow><mi
    mathvariant="normal">B</mi><mi mathvariant="normal">e</mi><mi mathvariant="normal">t</mi><mi
    mathvariant="normal">a</mi></mrow><mo stretchy="false">(</mo><mi>α</mi><mo separator="true">,</mo><mi>β</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\theta
    \sim \mathrm{Beta}(\alpha, \beta)</annotation></semantics>θ∼Beta(α,β), then the
    posterior distribution also belonged to the Beta family: <semantics><mrow><mi>θ</mi><mi
    mathvariant="normal">∣</mi><mi>x</mi><mo>∼</mo><mrow><mi mathvariant="normal">B</mi><mi
    mathvariant="normal">e</mi><mi mathvariant="normal">t</mi><mi mathvariant="normal">a</mi></mrow><mrow><mo
    fence="true">(</mo><mi>α</mi><mo>+</mo><mo>∑</mo><msub><mi>x</mi><mi>i</mi></msub><mo
    separator="true">,</mo><mi>β</mi><mo>+</mo><mi>n</mi><mo>−</mo><mo>∑</mo><msub><mi>x</mi><mi>i</mi></msub><mo
    fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">\theta
    | x \sim \mathrm{Beta}\left(\alpha + \sum x_i, \beta + n - \sum x_i\right)</annotation></semantics>θ∣x∼Beta(α+∑xi​,β+n−∑xi​).'
  id: totrans-10
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 如果我们选择 Beta 先验，即 <semantics><mrow><mi>θ</mi><mo>∼</mo><mrow><mi mathvariant="normal">B</mi><mi
    mathvariant="normal">e</mi><mi mathvariant="normal">t</mi><mi mathvariant="normal">a</mi></mrow><mo
    stretchy="false">(</mo><mi>α</mi><mo separator="true">,</mo><mi>β</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\theta \sim \mathrm{Beta}(\alpha, \beta)</annotation></semantics>θ∼Beta(α,β)，那么后验分布也属于
    Beta 分布族：<semantics><mrow><mi>θ</mi><mi mathvariant="normal">∣</mi><mi>x</mi><mo>∼</mo><mrow><mi
    mathvariant="normal">B</mi><mi mathvariant="normal">e</mi><mi mathvariant="normal">t</mi><mi
    mathvariant="normal">a</mi></mrow><mrow><mo fence="true">(</mo><mi>α</mi><mo>+</mo><mo>∑</mo><msub><mi>x</mi><mi>i</mi></msub><mo
    separator="true">,</mo><mi>β</mi><mo>+</mo><mi>n</mi><mo>−</mo><mo>∑</mo><msub><mi>x</mi><mi>i</mi></msub><mo
    fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">\theta
    | x \sim \mathrm{Beta}\left(\alpha + \sum x_i, \beta + n - \sum x_i\right)</annotation></semantics>θ∣x∼Beta(α+∑xi​,β+n−∑xi​)。
- en: This made it easy to determine things like the MAP estimate or LMSE estimate,
    simply by using known properties of the Beta distribution.
  id: totrans-11
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 这使得确定诸如最大后验估计或最小均方误差估计等值变得容易，只需利用 Beta 分布的已知性质即可。
- en: 'But what if our posterior distribution didn’t have such a convenient form?
    In that case, we would have to compute the posterior (and any estimates from it)
    ourselves:'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 但如果我们的后验分布不具备如此便利的形式呢？在这种情况下，我们就必须自行计算后验分布（以及从中得出的任何估计值）：
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mi
    mathvariant="normal">∣</mi><mi>x</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow><mrow><mo>∫</mo><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo><mi>d</mi><mi>θ</mi></mrow></mfrac></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} p(\theta|x) &= \frac{p(x|\theta)p(\theta)}{p(x)}
    \\ &= \frac{p(x|\theta)p(\theta)}{\int p(x|\theta)p(\theta)\,d\theta} \\ \end{align}</annotation></semantics>p(θ∣x)​=p(x)p(x∣θ)p(θ)​=∫p(x∣θ)p(θ)dθp(x∣θ)p(θ)​​​[(1)](#gydV4BSpve
    "Link to this Equation")
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mi
    mathvariant="normal">∣</mi><mi>x</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow><mrow><mo>∫</mo><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo><mi>d</mi><mi>θ</mi></mrow></mfrac></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} p(\theta|x) &= \frac{p(x|\theta)p(\theta)}{p(x)}
    \\ &= \frac{p(x|\theta)p(\theta)}{\int p(x|\theta)p(\theta)\,d\theta} \\ \end{align}</annotation></semantics>p(θ∣x)​=p(x)p(x∣θ)p(θ)​=∫p(x∣θ)p(θ)dθp(x∣θ)p(θ)​​​[(1)](#gydV4BSpve
    "Link to this Equation")
- en: 'In general, the integral in the denominator could be impossible to compute.
    We call the denominator the **normalizing constant**: it’s a constant because
    it doesn’t depend on <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ,
    and it’s normalizing because we need it for the distribution or density to sum
    or integrate to 1.'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 通常，分母中的积分可能无法计算。我们称分母为**归一化常数**：它是一个常数，因为它不依赖于<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ，并且它是归一化的，因为我们需要它来使分布或密度函数的总和或积分等于1。
- en: In the next section, we’ll see a few examples that illustrate why computing
    the normalizing constant is hard, but first, let’s look at three examples of why
    we might need to know it in the first place.
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 在下一节中，我们将看到几个例子来说明为什么计算归一化常数很困难，但首先，让我们看看三个例子，说明为什么我们首先可能需要知道它。
- en: Computing probabilities[¶](#computing-probabilities "Link to this Section")
  id: totrans-16
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 计算概率[¶](#computing-probabilities "Link to this Section")
- en: 'Suppose we want to know the probability that <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ is greater than
    0.7, given the observed data. In this case, we can set up an integral to compute
    this:'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们想知道在给定观测数据的情况下，<semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ大于0.7的概率。在这种情况下，我们可以建立一个积分来计算：
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>θ</mi><mo>></mo><mn>0.7</mn><mi
    mathvariant="normal">∣</mi><mi>x</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msubsup><mo>∫</mo><mn>0.7</mn><mn>1</mn></msubsup><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mi mathvariant="normal">∣</mi><mi>x</mi><mo
    stretchy="false">)</mo><mi>d</mi><mi>x</mi></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msubsup><mo>∫</mo><mn>0.7</mn><mn>1</mn></msubsup><mfrac><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac><mi>d</mi><mi>x</mi></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mn>1</mn><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac><msubsup><mo>∫</mo><mn>0.7</mn><mn>1</mn></msubsup><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo><mi>d</mi><mi>x</mi></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} P(\theta > 0.7 | x) &= \int_{0.7}^1
    p(\theta|x) \, dx \\ &= \int_{0.7}^1 \frac{p(x|\theta)p(\theta)}{p(x)} \, dx \\
    &= \frac{1}{p(x)} \int_{0.7}^1 p(x|\theta)p(\theta) \, dx \end{align}</annotation></semantics>P(θ>0.7∣x)​=∫0.71​p(θ∣x)dx=∫0.71​p(x)p(x∣θ)p(θ)​dx=p(x)1​∫0.71​p(x∣θ)p(θ)dx​​[(2)](#qt7NANmbSO
    "Link to this Equation")
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>θ</mi><mo>></mo><mn>0.7</mn><mi
    mathvariant="normal">∣</mi><mi>x</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msubsup><mo>∫</mo><mn>0.7</mn><mn>1</mn></msubsup><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mi mathvariant="normal">∣</mi><mi>x</mi><mo
    stretchy="false">)</mo><mi>d</mi><mi>x</mi></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msubsup><mo>∫</mo><mn>0.7</mn><mn>1</mn></msubsup><mfrac><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac><mi>d</mi><mi>x</mi></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mn>1</mn><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac><msubsup><mo>∫</mo><mn>0.7</mn><mn>1</mn></msubsup><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo><mi>d</mi><mi>x</mi></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} P(\theta > 0.7 | x) &= \int_{0.7}^1
    p(\theta|x) \, dx \\ &= \int_{0.7}^1 \frac{p(x|\theta)p(\theta)}{p(x)} \, dx \\
    &= \frac{1}{p(x)} \int_{0.7}^1 p(x|\theta)p(\theta) \, dx \end{align}</annotation></semantics>P(θ>0.7∣x)​=∫0.71​p(θ∣x)dx=∫0.71​p(x)p(x∣θ)p(θ)​dx=p(x)1​∫0.71​p(x∣θ)p(θ)dx​​[(2)](#qt7NANmbSO
    "Link to this Equation")
- en: In the last step, we used the fact that p(x) doesn’t depend on <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ.
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 在最后一步中，我们利用了 p(x) 不依赖于 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    这一事实。
- en: 'If we don’t know <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(x)</annotation></semantics>p(x),
    then our probability will be off by an unknown factor. For example, suppose the
    true probability is 0.9, the integral is 0.0009, and the normally-unknown denominator
    <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(x)</annotation></semantics>p(x) is 0.001. In this
    case, if we don’t know the normalizing constant, there’s no way we can determine
    the probability: we’ll always be wrong by an unknown factor, which means that
    our answer is useless.'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们不知道 <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(x)</annotation></semantics>p(x)，那么我们的概率将相差一个未知因子。例如，假设真实概率是
    0.9，积分结果是 0.0009，而通常未知的分母 <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(x)</annotation></semantics>p(x)
    是 0.001。在这种情况下，如果我们不知道归一化常数，就无法确定概率：我们总是会相差一个未知因子，这意味着我们的答案是无用的。
- en: '[PRE1]'
  id: totrans-21
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: Loading...
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 正在加载...
- en: MAP Estimation[¶](#map-estimation "Link to this Section")
  id: totrans-23
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 最大后验估计[¶](#map-estimation "链接至此章节")
- en: 'Suppose we want to compute the MAP estimate:'
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们想要计算最大后验估计：
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><msub><mover accent="true"><mi>θ</mi><mo>^</mo></mover><mrow><mi>M</mi><mi>A</mi><mi>P</mi></mrow></msub></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi><munder><mo><mi mathvariant="normal">argmax</mi><mo>⁡</mo></mo><mi>θ</mi></munder></mi><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mi mathvariant="normal">∣</mi><mi>x</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mi><munder><mo><mi mathvariant="normal">argmax</mi><mo>⁡</mo></mo><mi>θ</mi></munder></mi><mfrac><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi><munder><mo><mi mathvariant="normal">argmax</mi><mo>⁡</mo></mo><mi>θ</mi></munder></mi><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} \hat{\theta}_{MAP} &= \underset{\theta}{\operatorname{argmax}}
    p(\theta|x) \\ &= \underset{\theta}{\operatorname{argmax}} \frac{p(x|\theta)p(\theta)}{p(x)}
    \\ &= \underset{\theta}{\operatorname{argmax}} p(x|\theta)p(\theta) \\ \end{align}</annotation></semantics>θ^MAP​​=θargmax​p(θ∣x)=θargmax​p(x)p(x∣θ)p(θ)​=θargmax​p(x∣θ)p(θ)​​[(3)](#rPJLURgfb7
    "Link to this Equation")
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><msub><mover accent="true"><mi>θ</mi><mo>^</mo></mover><mrow><mi>M</mi><mi>A</mi><mi>P</mi></mrow></msub></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi><munder><mo><mi mathvariant="normal">argmax</mi><mo>⁡</mo></mo><mi>θ</mi></munder></mi><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mi mathvariant="normal">∣</mi><mi>x</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mi><munder><mo><mi mathvariant="normal">argmax</mi><mo>⁡</mo></mo><mi>θ</mi></munder></mi><mfrac><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi><munder><mo><mi mathvariant="normal">argmax</mi><mo>⁡</mo></mo><mi>θ</mi></munder></mi><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} \hat{\theta}_{MAP} &= \underset{\theta}{\operatorname{argmax}}
    p(\theta|x) \\ &= \underset{\theta}{\operatorname{argmax}} \frac{p(x|\theta)p(\theta)}{p(x)}
    \\ &= \underset{\theta}{\operatorname{argmax}} p(x|\theta)p(\theta) \\ \end{align}</annotation></semantics>θ^MAP​​=θargmax​p(θ∣x)=θargmax​p(x)p(x∣θ)p(θ)​=θargmax​p(x∣θ)p(θ)​​[(3)](#rPJLURgfb7
    "链接至此方程")
- en: In the last step, we used the fact that p(x) doesn’t depend on <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ.
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 在最后一步中，我们利用了 p(x) 不依赖于 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    这一事实。
- en: If <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    is low-dimensional and continuous, we can often optimize this either analytically
    or sometimes numerically. If <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    is discrete and doesn’t take on too many different values, we can search over
    all possible values. However, if <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ is discrete and
    takes on an intractably large number of possible values, then we’d need to search
    over all of them, which would be impossible. Similarly, if <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ is high-dimensional,
    then the search can also be intractable.
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: 如果 <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    是低维且连续的，我们通常可以通过解析方法或有时通过数值方法进行优化。如果 <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ 是离散的且取值可能性不多，我们可以搜索所有可能的值。然而，如果
    <semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ
    是离散的且可能取值的数量庞大到难以处理，那么我们需要搜索所有这些值，这将是不可行的。同样，如果 <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ 是高维的，那么搜索也可能变得难以处理。
- en: 'To summarize: for low-dimensional continuous variables, or discrete random
    variables with a low number of possible values, we can compute the MAP estimate
    without needing to know the exact posterior. For higher-dimensional random variables
    and/or discrete random variables with many possible values, this won’t work.'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 总结来说：对于低维连续变量，或可能取值较少的离散随机变量，我们可以在不需要知道确切后验分布的情况下计算 MAP 估计。对于高维随机变量和/或可能取值众多的离散随机变量，这种方法将不再适用。
- en: LMSE Estimation[¶](#lmse-estimation "Link to this Section")
  id: totrans-29
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: LMSE 估计[¶](#lmse-estimation "链接至此节")
- en: 'Suppose we want to compute the LMSE estimate. Recall the definition of conditional
    expectation (see Data 140 textbook, [Chapter 9](http://prob140.org/textbook/content/Chapter_09/02_Expectation_by_Conditioning.html)
    and [Chapter 15](http://prob140.org/textbook/content/Chapter_15/03_Expectation.html)):'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们想要计算 LMSE 估计。回顾条件期望的定义（参见 Data 140 教科书，[第 9 章](http://prob140.org/textbook/content/Chapter_09/02_Expectation_by_Conditioning.html)
    和 [第 15 章](http://prob140.org/textbook/content/Chapter_15/03_Expectation.html)）：
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><msub><mover accent="true"><mi>θ</mi><mo>^</mo></mover><mrow><mi>L</mi><mi>M</mi><mi>S</mi><mi>E</mi></mrow></msub></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mrow><mi>θ</mi><mi
    mathvariant="normal">∣</mi><mi>x</mi></mrow></msub><mo stretchy="false">[</mo><mi>θ</mi><mo
    stretchy="false">]</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mo>∫</mo><mi>θ</mi><mo>⋅</mo><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mi mathvariant="normal">∣</mi><mi>x</mi><mo
    stretchy="false">)</mo><mi>d</mi><mi>θ</mi></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mo>∫</mo><mi>θ</mi><mo>⋅</mo><mfrac><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac><mi>d</mi><mi>θ</mi></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mn>1</mn><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac><mo>∫</mo><mi>θ</mi><mo>⋅</mo><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo><mi>d</mi><mi>θ</mi></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} \hat{\theta}_{LMSE} &= E_{\theta|x}[\theta]
    \\ &= \int \theta \cdot p(\theta|x) \, d\theta \\ &= \int \theta \cdot \frac{p(x|\theta)p(\theta)}{p(x)}
    \, d\theta \\ &= \frac{1}{p(x)} \int \theta \cdot p(x|\theta)p(\theta)\, d\theta
    \end{align}</annotation></semantics>θ^LMSE​​=Eθ∣x​[θ]=∫θ⋅p(θ∣x)dθ=∫θ⋅p(x)p(x∣θ)p(θ)​dθ=p(x)1​∫θ⋅p(x∣θ)p(θ)dθ​​[(4)](#AEKQ3ST87L
    "Link to this Equation")
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><msub><mover accent="true"><mi>θ</mi><mo>^</mo></mover><mrow><mi>L</mi><mi>M</mi><mi>S</mi><mi>E</mi></mrow></msub></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msub><mi>E</mi><mrow><mi>θ</mi><mi
    mathvariant="normal">∣</mi><mi>x</mi></mrow></msub><mo stretchy="false">[</mo><mi>θ</mi><mo
    stretchy="false">]</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mo>∫</mo><mi>θ</mi><mo>⋅</mo><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mi mathvariant="normal">∣</mi><mi>x</mi><mo
    stretchy="false">)</mo><mi>d</mi><mi>θ</mi></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mo>∫</mo><mi>θ</mi><mo>⋅</mo><mfrac><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac><mi>d</mi><mi>θ</mi></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mn>1</mn><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac><mo>∫</mo><mi>θ</mi><mo>⋅</mo><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mi>θ</mi><mo
    stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo><mi>d</mi><mi>θ</mi></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} \hat{\theta}_{LMSE} &= E_{\theta|x}[\theta]
    \\ &= \int \theta \cdot p(\theta|x) \, d\theta \\ &= \int \theta \cdot \frac{p(x|\theta)p(\theta)}{p(x)}
    \, d\theta \\ &= \frac{1}{p(x)} \int \theta \cdot p(x|\theta)p(\theta)\, d\theta
    \end{align}</annotation></semantics>θ^LMSE​​=Eθ∣x​[θ]=∫θ⋅p(θ∣x)dθ=∫θ⋅p(x)p(x∣θ)p(θ)​dθ=p(x)1​∫θ⋅p(x∣θ)p(θ)dθ​​[(4)](#AEKQ3ST87L
    "Link to this Equation")
- en: In order to compute the LMSE estimate, we need to compute the denominator, <semantics><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(x)</annotation></semantics>p(x). If we don’t know
    it, then our estimate will be off by a multiplicative factor that we don’t know,
    making it effectively useless.
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 为了计算LMSE估计，我们需要计算分母<semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(x)</annotation></semantics>p(x)。如果我们不知道它，那么我们的估计将会被一个未知的乘法因子所影响，从而使其实际上变得无用。
- en: The same is true for computing the expected value of any other function of <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ, or any other probability
    involving the posterior distribution. For example, answering the question “according
    to the posterior distribution, what is the variance of <semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ?” will lead to the
    same problem.
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 对于计算<semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics>θ的任何其他函数的期望值，或者涉及后验分布的任何其他概率，情况也是如此。例如，回答“根据后验分布，<semantics><mrow><mi>θ</mi></mrow><annotation
    encoding="application/x-tex">\theta</annotation></semantics>θ的方差是多少？”这个问题，也会导致同样的问题。
- en: 'To summarize: any computations involving the posteriors (probabilities, expectations,
    etc.) require us to have the full normalized distribution: the numerator in Bayes’
    rule isn’t enough.'
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: 总结来说：任何涉及后验分布的计算（概率、期望值等）都需要我们掌握完整的归一化分布：贝叶斯定理中的分子部分是不够的。
- en: Why computing posterior distributions is hard[¶](#why-computing-posterior-distributions-is-hard
    "Link to this Section")
  id: totrans-35
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 为何计算后验分布如此困难[¶](#why-computing-posterior-distributions-is-hard "Link to this
    Section")
- en: 'In simple models like our product review model or our model for heights, it
    was easy to compute the exact posterior for the unknown variable that we were
    interested in. This happened because we chose a conjugate prior. In most other
    cases, computing the exact posterior is hard! Here are two examples:'
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 在我们之前的产品评价模型或身高模型这类简单模型中，计算我们感兴趣的未知变量的精确后验分布是容易的。这是因为我们选择了*共轭先验*。但在大多数其他情况下，计算精确后验分布是困难的！以下是两个例子：
- en: One-dimensional non-conjugate prior[¶](#one-dimensional-non-conjugate-prior
    "Link to this Section")
  id: totrans-37
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 一维非共轭先验[¶](#one-dimensional-non-conjugate-prior "Link to this Section")
- en: Let’s return to the product review example, but this time, instead of a Beta
    prior, we choose <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo
    stretchy="false">)</mo><mo>=</mo><mfrac><mn>2</mn><mi>π</mi></mfrac><mi>cos</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mfrac><mi>π</mi><mn>2</mn></mfrac><mi>θ</mi><mo fence="true">)</mo></mrow></mrow><annotation
    encoding="application/x-tex">p(\theta) = \frac{2}{\pi}\cos\left(\frac{\pi}{2}
    \theta\right)</annotation></semantics>p(θ)=π2​cos(2π​θ) for <semantics><mrow><mi>θ</mi><mo>∈</mo><mo
    stretchy="false">[</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">\theta \in [0, 1]</annotation></semantics>θ∈[0,1].
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们回到产品评价的例子，但这次，我们不使用 Beta 先验，而是选择 <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mo
    stretchy="false">)</mo><mo>=</mo><mfrac><mn>2</mn><mi>π</mi></mfrac><mi>cos</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mfrac><mi>π</mi><mn>2</mn></mfrac><mi>θ</mi><mo fence="true">)</mo></mrow></mrow><annotation
    encoding="application/x-tex">p(\theta) = \frac{2}{\pi}\cos\left(\frac{\pi}{2}
    \theta\right)</annotation></semantics>p(θ)=π2​cos(2π​θ)，其中 <semantics><mrow><mi>θ</mi><mo>∈</mo><mo
    stretchy="false">[</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">\theta \in [0, 1]</annotation></semantics>θ∈[0,1]。
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mi
    mathvariant="normal">∣</mi><mi>x</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>∝</mo><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>∝</mo><mo fence="false" stretchy="true"
    minsize="1.8em" maxsize="1.8em">[</mo><msup><mi>θ</mi><mrow><mo fence="true">[</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>x</mi><mi>i</mi></msub><mo
    fence="true">]</mo></mrow></msup><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>θ</mi><msup><mo
    stretchy="false">)</mo><mrow><mo fence="true">[</mo><munder><mo>∑</mo><mi>i</mi></munder><mo
    stretchy="false">(</mo><mn>1</mn><mo>−</mo><msub><mi>x</mi><mi>i</mi></msub><mo
    stretchy="false">)</mo><mo fence="true">]</mo></mrow></msup><mo fence="false"
    stretchy="true" minsize="1.8em" maxsize="1.8em">]</mo><mi>cos</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mfrac><mi>π</mi><mn>2</mn></mfrac><mi>θ</mi><mo fence="true">)</mo></mrow></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} p(\theta|x) &\propto p(x|\theta)p(\theta)
    \\ &\propto \Big[\theta^{\left[\sum_i x_i\right]}(1-\theta)^{\left[\sum_i (1-x_i)\right]}\Big]\cos\left(\frac{\pi}{2}\theta\right)
    \end{align}</annotation></semantics>p(θ∣x)​∝p(x∣θ)p(θ)∝[θ[∑i​xi​](1−θ)[∑i​(1−xi​)]]cos(2π​θ)​​[(5)](#o5HgS3UKsO
    "Link to this Equation")
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mi
    mathvariant="normal">∣</mi><mi>x</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>∝</mo><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mi
    mathvariant="normal">∣</mi><mi>θ</mi><mo stretchy="false">)</mo><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>∝</mo><mo fence="false" stretchy="true"
    minsize="1.8em" maxsize="1.8em">[</mo><msup><mi>θ</mi><mrow><mo fence="true">[</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>x</mi><mi>i</mi></msub><mo
    fence="true">]</mo></mrow></msup><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>θ</mi><msup><mo
    stretchy="false">)</mo><mrow><mo fence="true">[</mo><munder><mo>∑</mo><mi>i</mi></munder><mo
    stretchy="false">(</mo><mn>1</mn><mo>−</mo><msub><mi>x</mi><mi>i</mi></msub><mo
    stretchy="false">)</mo><mo fence="true">]</mo></mrow></msup><mo fence="false"
    stretchy="true" minsize="1.8em" maxsize="1.8em">]</mo><mi>cos</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mfrac><mi>π</mi><mn>2</mn></mfrac><mi>θ</mi><mo fence="true">)</mo></mrow></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} p(\theta|x) &\propto p(x|\theta)p(\theta)
    \\ &\propto \Big[\theta^{\left[\sum_i x_i\right]}(1-\theta)^{\left[\sum_i (1-x_i)\right]}\Big]\cos\left(\frac{\pi}{2}\theta\right)
    \end{align}</annotation></semantics>p(θ∣x)​∝p(x∣θ)p(θ)∝[θ[∑i​xi​](1−θ)[∑i​(1−xi​)]]cos(2π​θ)​​[(5)](#o5HgS3UKsO
    "链接到此方程")
- en: 'This distribution looks much more complicated: we can’t reduce it to a known
    distribution at all. So, in order to properly compute <semantics><mrow><mi>p</mi><mo
    stretchy="false">(</mo><mi>θ</mi><mi mathvariant="normal">∣</mi><mi>x</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p(\theta|x)</annotation></semantics>p(θ∣x),
    we’d need to figure out the normalizing constant. This requires solving the integral:'
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 这个分布看起来要复杂得多：我们完全无法将其简化为一个已知的分布。因此，为了正确计算 <semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>θ</mi><mi
    mathvariant="normal">∣</mi><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">p(\theta|x)</annotation></semantics>p(θ∣x)，我们需要找出归一化常数。这需要求解以下积分：
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msubsup><mo>∫</mo><mn>0</mn><mn>1</mn></msubsup><mo
    fence="false" stretchy="true" minsize="1.8em" maxsize="1.8em">[</mo><msup><mi>θ</mi><mrow><mo
    fence="true">[</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>x</mi><mi>i</mi></msub><mo
    fence="true">]</mo></mrow></msup><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>θ</mi><msup><mo
    stretchy="false">)</mo><mrow><mo fence="true">[</mo><munder><mo>∑</mo><mi>i</mi></munder><mo
    stretchy="false">(</mo><mn>1</mn><mo>−</mo><msub><mi>x</mi><mi>i</mi></msub><mo
    stretchy="false">)</mo><mo fence="true">]</mo></mrow></msup><mo fence="false"
    stretchy="true" minsize="1.8em" maxsize="1.8em">]</mo><mi>cos</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mfrac><mi>π</mi><mn>2</mn></mfrac><mi>θ</mi><mo fence="true">)</mo></mrow><mi>d</mi><mi>θ</mi></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} p(x) &= \int_0^1 \Big[\theta^{\left[\sum_i
    x_i\right]}(1-\theta)^{\left[\sum_i (1-x_i)\right]}\Big]\cos\left(\frac{\pi}{2}\theta\right)\,d\theta
    \end{align}</annotation></semantics>p(x)​=∫01​[θ[∑i​xi​](1−θ)[∑i​(1−xi​)]]cos(2π​θ)dθ​​[(6)](#GOrY7tRB7t
    "Link to this Equation")
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><msubsup><mo>∫</mo><mn>0</mn><mn>1</mn></msubsup><mo
    fence="false" stretchy="true" minsize="1.8em" maxsize="1.8em">[</mo><msup><mi>θ</mi><mrow><mo
    fence="true">[</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>x</mi><mi>i</mi></msub><mo
    fence="true">]</mo></mrow></msup><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>θ</mi><msup><mo
    stretchy="false">)</mo><mrow><mo fence="true">[</mo><munder><mo>∑</mo><mi>i</mi></munder><mo
    stretchy="false">(</mo><mn>1</mn><mo>−</mo><msub><mi>x</mi><mi>i</mi></msub><mo
    stretchy="false">)</mo><mo fence="true">]</mo></mrow></msup><mo fence="false"
    stretchy="true" minsize="1.8em" maxsize="1.8em">]</mo><mi>cos</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mfrac><mi>π</mi><mn>2</mn></mfrac><mi>θ</mi><mo fence="true">)</mo></mrow><mi>d</mi><mi>θ</mi></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} p(x) &= \int_0^1 \Big[\theta^{\left[\sum_i
    x_i\right]}(1-\theta)^{\left[\sum_i (1-x_i)\right]}\Big]\cos\left(\frac{\pi}{2}\theta\right)\,d\theta
    \end{align}</annotation></semantics>p(x)​=∫01​[θ[∑i​xi​](1−θ)[∑i​(1−xi​)]]cos(2π​θ)dθ​​[(6)](#GOrY7tRB7t
    "Link to this Equation")
- en: This integral is difficult to solve in closed form. In this specific example,
    since this is a one-dimensional problem, we could take advantage of numerical
    integration. In other words, for a particular sequence of values <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">x_1, \ldots, x_n</annotation></semantics>x1​,…,xn​,
    we can plug them in and compute a numerical approximation to the integral, and
    then find the normalizing constant that way. As we saw above, we don’t need the
    normalizing constant if we’re only interested in the MAP estimate, but we can’t
    compute the LMSE estimate without it.
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: 这个积分难以用闭合形式求解。在这个具体例子中，由于是一维问题，我们可以利用数值积分。换句话说，对于特定的值序列 <semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">x_1, \ldots, x_n</annotation></semantics>x1​,…,xn​，我们可以将它们代入并计算积分的数值近似值，然后以此求出归一化常数。如上所述，如果我们只关心最大后验估计，则不需要归一化常数，但如果没有它，我们就无法计算最小均方误差估计。
- en: Multi-dimensional example[¶](#multi-dimensional-example "Link to this Section")
  id: totrans-43
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 多维示例[¶](#multi-dimensional-example "Link to this Section")
- en: 'Consider the exoplanet model from last time: <semantics><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">x_i</annotation></semantics>xi​ is the (observed)
    radius of planet <semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics>i,
    <semantics><mrow><msub><mi>z</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">z_i</annotation></semantics>zi​
    is whether the planet belongs to group 0 (small, possibly habitable planets) or
    group 1 (large, possibly inhabitable planets), and <semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation
    encoding="application/x-tex">\mu_0</annotation></semantics>μ0​ and <semantics><mrow><msub><mi>μ</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">\mu_1</annotation></semantics>μ1​ are the mean radii
    of those two groups, respectively.'
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 考虑上次的系外行星模型：<semantics><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">x_i</annotation></semantics>xi​ 是行星 <semantics><mrow><mi>i</mi></mrow><annotation
    encoding="application/x-tex">i</annotation></semantics>i 的（观测到的）半径，<semantics><mrow><msub><mi>z</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">z_i</annotation></semantics>zi​ 表示该行星属于第 0 组（小型，可能宜居的行星）还是第
    1 组（大型，可能不宜居的行星），而 <semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation
    encoding="application/x-tex">\mu_0</annotation></semantics>μ0​ 和 <semantics><mrow><msub><mi>μ</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">\mu_1</annotation></semantics>μ1​ 分别是这两组的平均半径。
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left right" columnspacing="0em
    1em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><msub><mi>z</mi><mi>i</mi></msub></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>∼</mo><mrow><mi mathvariant="normal">B</mi><mi
    mathvariant="normal">e</mi><mi mathvariant="normal">r</mi><mi mathvariant="normal">n</mi><mi
    mathvariant="normal">o</mi><mi mathvariant="normal">u</mi><mi mathvariant="normal">l</mi><mi
    mathvariant="normal">l</mi><mi mathvariant="normal">i</mi></mrow><mo stretchy="false">(</mo><mi>π</mi><mo
    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mi>i</mi><mo>=</mo><mn>1</mn><mo
    separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><mi>n</mi></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><msub><mi>μ</mi><mi>k</mi></msub></mstyle></mtd><mtd><mstyle
