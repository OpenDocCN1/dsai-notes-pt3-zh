    stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mi>k</mi><mo>=</mo><mn>0</mn><mo
    separator="true">,</mo><mn>1</mn></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><msub><mi>x</mi><mi>i</mi></msub><mi
    mathvariant="normal">∣</mi><msub><mi>z</mi><mi>i</mi></msub><mo separator="true">,</mo><msub><mi>μ</mi><mn>0</mn></msub><mo
    separator="true">,</mo><msub><mi>μ</mi><mn>1</mn></msub></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>∼</mo><mi mathvariant="script">N</mi><mo
    stretchy="false">(</mo><msub><mi>μ</mi><msub><mi>z</mi><mi>i</mi></msub></msub><mo
    separator="true">,</mo><mi>σ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>i</mi><mo>=</mo><mn>1</mn><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><mi>n</mi></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align} z_i &\sim \mathrm{Bernoulli}(\pi) &
    i = 1, \ldots, n \\ \mu_k &\sim \mathcal{N}(\mu_p, \sigma_p) & k =0, 1 \\ x_i
    | z_i, \mu_0, \mu_1 &\sim \mathcal{N}(\mu_{z_i}, \sigma) & i = 1, \ldots, n\\
    \end{align}</annotation></semantics>zi​μk​xi​∣zi​,μ0​,μ1​​∼Bernoulli(π)∼N(μp​,σp​)∼N(μzi​​,σ)​i=1,…,nk=0,1i=1,…,n​​[(7)](#Ey66nptGD4
    "Link to this Equation")
