    P(X \geq \alpha) &= P(X - E[X] \geq \alpha - E[X]) \\ &\leq P(|X - E[X]| \geq
    \alpha - E[X]) \\ &\leq \frac{\mathrm{var}(X)}{(\alpha - E[X])^2}, \end{align*}</annotation></semantics>P(X≥α)​=P(X−E[X]≥α−E[X])≤P(∣X−E[X]∣≥α−E[X])≤(α−E[X])2var(X)​,​[(10)](#viPn0ZnQC2
    "链接到此方程")
- en: 'So, we have <semantics><mrow><mi>ϵ</mi><mo>=</mo><mfrac><mrow><mrow><mi mathvariant="normal">v</mi><mi
    mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo stretchy="false">(</mo><mi>X</mi><mo
    stretchy="false">)</mo></mrow><mrow><mo stretchy="false">(</mo><mi>α</mi><mo>−</mo><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">\epsilon = \frac{\mathrm{var}(X)}{(\alpha - E[X])^2}</annotation></semantics>ϵ=(α−E[X])2var(X)​.
    While we could use the quadratic formula to obtain an expression for <semantics><mrow><mi>α</mi><mo
    stretchy="false">(</mo><mi>ϵ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ), the
    most important observations here are:'
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，我们有 <semantics><mrow><mi>ϵ</mi><mo>=</mo><mfrac><mrow><mrow><mi mathvariant="normal">v</mi><mi
    mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo stretchy="false">(</mo><mi>X</mi><mo
    stretchy="false">)</mo></mrow><mrow><mo stretchy="false">(</mo><mi>α</mi><mo>−</mo><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">\epsilon = \frac{\mathrm{var}(X)}{(\alpha - E[X])^2}</annotation></semantics>ϵ=(α−E[X])2var(X)​。虽然我们可以使用二次公式来得到
    <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ) 的表达式，但这里最重要的观察是：
- en: The bound <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ)
    is directly proportional to the variance of <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X
  id: totrans-72
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 界限 <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ) 与 <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X 的方差成正比。
- en: '*How fast does our bound increase as <semantics><mrow><mi>ϵ</mi></mrow><annotation
    encoding="application/x-tex">\epsilon</annotation></semantics>ϵ gets small?* The
    bound <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ) is
    proportional to <semantics><mrow><msup><mi>ϵ</mi><mrow><mo>−</mo><mn>1</mn><mi
    mathvariant="normal">/</mi><mn>2</mn></mrow></msup></mrow><annotation encoding="application/x-tex">\epsilon^{-1/2}</annotation></semantics>ϵ−1/2
    (i.e., it increases as <semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><msup><mi>ϵ</mi><mrow><mo>−</mo><mn>1</mn><mi
    mathvariant="normal">/</mi><mn>2</mn></mrow></msup><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">O(\epsilon^{-1/2})</annotation></semantics>O(ϵ−1/2),
    which is a significant improvement over what we saw with Markov’s inequality.
    The question remains: can we do better?'
  id: totrans-73
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '*当 <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ
    变小时，我们的界限增长有多快？* 界限 <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ)
    与 <semantics><mrow><msup><mi>ϵ</mi><mrow><mo>−</mo><mn>1</mn><mi mathvariant="normal">/</mi><mn>2</mn></mrow></msup></mrow><annotation
    encoding="application/x-tex">\epsilon^{-1/2}</annotation></semantics>ϵ−1/2 成正比（即，它以
    <semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><msup><mi>ϵ</mi><mrow><mo>−</mo><mn>1</mn><mi
    mathvariant="normal">/</mi><mn>2</mn></mrow></msup><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">O(\epsilon^{-1/2})</annotation></semantics>O(ϵ−1/2)
    的速度增长），这比我们在马尔可夫不等式中看到的有了显著改进。问题依然存在：我们能做得更好吗？'
- en: 'Example: Sample Mean with Chebyshev’s Inequality[¶](#example-sample-mean-with-chebyshevs-inequality
    "Link to this Section")'
  id: totrans-74
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例：使用切比雪夫不等式的样本均值[¶](#example-sample-mean-with-chebyshevs-inequality "链接至此章节")
- en: Given <semantics><mrow><msub><mi>X</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>X</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">X_1,
    \ldots, X_n</annotation></semantics>X1​,…,Xn​ and their sample mean <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y, how well does Chebyshev’s
    inequality answer the question of whether <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y can be far from the true
    mean <semantics><mrow><mi>μ</mi></mrow><annotation encoding="application/x-tex">\mu</annotation></semantics>μ?
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: 给定 <semantics><mrow><msub><mi>X</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>X</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">X_1,
    \ldots, X_n</annotation></semantics>X1​,…,Xn​ 及其样本均值 <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y，切比雪夫不等式在回答 **Y** 是否可能远离真实均值
    **μ** 这一问题上表现如何？
- en: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi mathvariant="normal">∣</mi><mi>Y</mi><mo>−</mo><mi>μ</mi><mi
    mathvariant="normal">∣</mi><mo>></mo><mi>α</mi><mo stretchy="false">)</mo><mo>≤</mo><mfrac><mrow><mrow><mi
    mathvariant="normal">v</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo
    stretchy="false">(</mo><mi>Y</mi><mo stretchy="false">)</mo></mrow><msup><mi>α</mi><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mrow><mrow><mi
    mathvariant="normal">v</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo
    stretchy="false">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo stretchy="false">)</mo></mrow><mrow><mi>n</mi><msup><mi>α</mi><mn>2</mn></msup></mrow></mfrac><mo
    separator="true">,</mo></mrow><annotation encoding="application/x-tex">P(|Y -
    \mu| > \alpha) \leq \frac{\mathrm{var}(Y)}{\alpha^2} = \frac{\mathrm{var}(X_i)}{n\alpha^2},</annotation></semantics>P(∣Y−μ∣>α)≤α2var(Y)​=nα2var(Xi​)​,[(11)](#eWo9w2PhFP
    "Link to this Equation")
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi mathvariant="normal">∣</mi><mi>Y</mi><mo>−</mo><mi>μ</mi><mi
    mathvariant="normal">∣</mi><mo>></mo><mi>α</mi><mo stretchy="false">)</mo><mo>≤</mo><mfrac><mrow><mrow><mi
    mathvariant="normal">v</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo
    stretchy="false">(</mo><mi>Y</mi><mo stretchy="false">)</mo></mrow><msup><mi>α</mi><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mrow><mrow><mi
    mathvariant="normal">v</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo
    stretchy="false">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo stretchy="false">)</mo></mrow><mrow><mi>n</mi><msup><mi>α</mi><mn>2</mn></msup></mrow></mfrac><mo
    separator="true">,</mo></mrow><annotation encoding="application/x-tex">P(|Y -
    \mu| > \alpha) \leq \frac{\mathrm{var}(Y)}{\alpha^2} = \frac{\mathrm{var}(X_i)}{n\alpha^2},</annotation></semantics>P(∣Y−μ∣>α)≤α2var(Y)​=nα2var(Xi​)​,[(11)](#eWo9w2PhFP
    "链接到此方程")
- en: where we use the fact that the <semantics><mrow><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">X_i</annotation></semantics>Xi​ are independent to
    derive <semantics><mrow><mrow><mi mathvariant="normal">v</mi><mi mathvariant="normal">a</mi><mi
    mathvariant="normal">r</mi></mrow><mo stretchy="false">(</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><msup><mi>n</mi><mn>2</mn></msup></mfrac><mo>∑</mo><mrow><mi
    mathvariant="normal">v</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo
    stretchy="false">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mo>=</mo><mrow><mi
    mathvariant="normal">v</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo
    stretchy="false">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mi
    mathvariant="normal">/</mi><mi>n</mi></mrow><annotation encoding="application/x-tex">\mathrm{var}(Y)
    = \frac{1}{n^2} \sum \mathrm{var}(X_i) = \mathrm{var}(X_i)/n</annotation></semantics>var(Y)=n21​∑var(Xi​)=var(Xi​)/n.
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: 这里我们利用 <semantics><mrow><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">X_i</annotation></semantics>Xi​ 相互独立这一事实推导出 <semantics><mrow><mrow><mi
    mathvariant="normal">v</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo
    stretchy="false">(</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><msup><mi>n</mi><mn>2</mn></msup></mfrac><mo>∑</mo><mrow><mi
    mathvariant="normal">v</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo
    stretchy="false">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mo>=</mo><mrow><mi
    mathvariant="normal">v</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo
    stretchy="false">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mi
    mathvariant="normal">/</mi><mi>n</mi></mrow><annotation encoding="application/x-tex">\mathrm{var}(Y)
    = \frac{1}{n^2} \sum \mathrm{var}(X_i) = \mathrm{var}(X_i)/n</annotation></semantics>var(Y)=n21​∑var(Xi​)=var(Xi​)/n。
- en: 'This is significantly better than the bound from Markov’s inequality: it tells
    us that as <semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics>n
    increases, the probability decreases proportional to <semantics><mrow><mn>1</mn><mi
    mathvariant="normal">/</mi><mi>n</mi></mrow><annotation encoding="application/x-tex">1/n</annotation></semantics>1/n.
    What if we were to ask for an upper confidence bound <semantics><mrow><mi>α</mi><mo
    stretchy="false">(</mo><mi>ϵ</mi><mo separator="true">,</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\alpha(\epsilon, n)</annotation></semantics>α(ϵ,n)
    at a given level of confidence <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ,
    for a given number of samples <semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics>n?'
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: 这显著优于马尔可夫不等式给出的界：它告诉我们，随着<semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics>n的增加，概率按<semantics><mrow><mn>1</mn><mi
    mathvariant="normal">/</mi><mi>n</mi></mrow><annotation encoding="application/x-tex">1/n</annotation></semantics>1/n的比例减小。如果我们想针对给定的置信水平<semantics><mrow><mi>ϵ</mi></mrow><annotation
    encoding="application/x-tex">\epsilon</annotation></semantics>ϵ和给定的样本数量<semantics><mrow><mi>n</mi></mrow><annotation
    encoding="application/x-tex">n</annotation></semantics>n，求一个上置信界<semantics><mrow><mi>α</mi><mo
    stretchy="false">(</mo><mi>ϵ</mi><mo separator="true">,</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\alpha(\epsilon, n)</annotation></semantics>α(ϵ,n)，情况会如何？
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mi>ϵ</mi></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mrow><mi mathvariant="normal">v</mi><mi
    mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo stretchy="false">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo
    stretchy="false">)</mo></mrow><mrow><mi>n</mi><msup><mi>α</mi><mn>2</mn></msup></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mi>α</mi></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mfrac><msub><mi>σ</mi><msub><mi>X</mi><mi>i</mi></msub></msub><msqrt><mrow><mi>n</mi><mi>ϵ</mi></mrow></msqrt></mfrac></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} \epsilon &= \frac{\mathrm{var}(X_i)}{n\alpha^2}
    \\ \alpha &= \frac{\sigma_{X_i}}{\sqrt{n\epsilon}} \end{align*}</annotation></semantics>ϵα​=nα2var(Xi​)​=nϵ​σXi​​​​[(12)](#QeQXkVSbGw
    "Link to this Equation")
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mi>ϵ</mi></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mrow><mi mathvariant="normal">v</mi><mi
    mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow><mo stretchy="false">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo
    stretchy="false">)</mo></mrow><mrow><mi>n</mi><msup><mi>α</mi><mn>2</mn></msup></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mi>α</mi></mstyle></mtd><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mfrac><msub><mi>σ</mi><msub><mi>X</mi><mi>i</mi></msub></msub><msqrt><mrow><mi>n</mi><mi>ϵ</mi></mrow></msqrt></mfrac></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} \epsilon &= \frac{\mathrm{var}(X_i)}{n\alpha^2}
    \\ \alpha &= \frac{\sigma_{X_i}}{\sqrt{n\epsilon}} \end{align*}</annotation></semantics>ϵα​=nα2var(Xi​)​=nϵ​σXi​​​​[(12)](#QeQXkVSbGw
    "Link to this Equation")
- en: We see a dependence on <semantics><mrow><mfrac><mn>1</mn><msqrt><mi>n</mi></msqrt></mfrac></mrow><annotation
    encoding="application/x-tex">\frac{1}{\sqrt{n}}</annotation></semantics>n​1​,
    which tells us how fast our bound shrinks as the number of samples increases.
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
  zh: 我们看到对<semantics><mrow><mfrac><mn>1</mn><msqrt><mi>n</mi></msqrt></mfrac></mrow><annotation
    encoding="application/x-tex">\frac{1}{\sqrt{n}}</annotation></semantics>n​1​的依赖，这告诉我们随着样本数量的增加，我们的界以多快的速度缩小。
- en: '**Exercise**: Consider again the i.i.d. Poisson random variables <semantics><mrow><msub><mi>T</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">T_i</annotation></semantics>Ti​ and their sample
    mean <semantics><mrow><mi>S</mi></mrow><annotation encoding="application/x-tex">S</annotation></semantics>S.
    Use Chebyshev’s inequality to find the smallest value <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α such that <semantics><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>S</mi><mo>≥</mo><mi>α</mi><mo stretchy="false">)</mo><mo>≤</mo><mn>0.05</mn></mrow><annotation
    encoding="application/x-tex">P(S \geq \alpha) \leq 0.05</annotation></semantics>P(S≥α)≤0.05.
    How does your result compare to the true probability and to the Markov bound?'
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
  zh: '**练习**：再次考虑独立同分布的泊松随机变量 <semantics><mrow><msub><mi>T</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">T_i</annotation></semantics>Ti​ 及其样本均值 <semantics><mrow><mi>S</mi></mrow><annotation
    encoding="application/x-tex">S</annotation></semantics>S。使用切比雪夫不等式找出最小的 <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α 值，使得 <semantics><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>S</mi><mo>≥</mo><mi>α</mi><mo stretchy="false">)</mo><mo>≤</mo><mn>0.05</mn></mrow><annotation
    encoding="application/x-tex">P(S \geq \alpha) \leq 0.05</annotation></semantics>P(S≥α)≤0.05。你的结果与真实概率以及马尔可夫界相比如何？'
- en: 'Video example: flipping biased coins with Chebyshev’s inequality[¶](#video-example-flipping-biased-coins-with-chebyshevs-inequality
    "Link to this Section")'
  id: totrans-82
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 视频示例：使用切比雪夫不等式抛掷有偏硬币[¶](#video-example-flipping-biased-coins-with-chebyshevs-inequality
    "Link to this Section")
- en: '[PRE5]'
  id: totrans-83
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: Loading...
  id: totrans-84
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: Higher moment bounds[¶](#higher-moment-bounds "Link to this Section")
  id: totrans-85
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 高阶矩界[¶](#higher-moment-bounds "Link to this Section")
- en: 'Chebyshev’s inequality uses the first and second moments (<semantics><mrow><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">E[X]</annotation></semantics>E[X] and <semantics><mrow><mi>E</mi><mo
    stretchy="false">[</mo><msup><mi>X</mi><mn>2</mn></msup><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">E[X^2]</annotation></semantics>E[X2]). For any nonnegative
    random variable <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X
    and for any natural number <semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k,
    we can apply Markov’s inequality to <semantics><mrow><msup><mi>X</mi><mi>k</mi></msup></mrow><annotation
    encoding="application/x-tex">X^k</annotation></semantics>Xk, obtaining higher
    **moment bounds**:'
  id: totrans-86
  prefs: []
  type: TYPE_NORMAL
  zh: 切比雪夫不等式使用一阶矩和二阶矩（<semantics><mrow><mi>E</mi><mo stretchy="false">[</mo><mi>X</mi><mo
    stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">E[X]</annotation></semantics>E[X]
    和 <semantics><mrow><mi>E</mi><mo stretchy="false">[</mo><msup><mi>X</mi><mn>2</mn></msup><mo
    stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">E[X^2]</annotation></semantics>E[X2]）。对于任何非负随机变量
    <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X
    和任何自然数 <semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k，我们可以对
    <semantics><mrow><msup><mi>X</mi><mi>k</mi></msup></mrow><annotation encoding="application/x-tex">X^k</annotation></semantics>Xk
    应用马尔可夫不等式，从而得到高阶**矩界**：
- en: <semantics><mrow><mi mathvariant="double-struck">P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>≥</mo><mi>α</mi><mo
    stretchy="false">)</mo><mo>≤</mo><mfrac><mrow><mi>E</mi><mo stretchy="false">[</mo><msup><mi>X</mi><mi>k</mi></msup><mo
    stretchy="false">]</mo></mrow><msup><mi>α</mi><mi>k</mi></msup></mfrac></mrow><annotation
    encoding="application/x-tex">\mathbb{P}(X \geq \alpha) \leq \frac{E[X^k]}{\alpha^k}</annotation></semantics>P(X≥α)≤αkE[Xk]​[(13)](#QfAizRYgPz
    "Link to this Equation")
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi mathvariant="double-struck">P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>≥</mo><mi>α</mi><mo
    stretchy="false">)</mo><mo>≤</mo><mfrac><mrow><mi>E</mi><mo stretchy="false">[</mo><msup><mi>X</mi><mi>k</mi></msup><mo
    stretchy="false">]</mo></mrow><msup><mi>α</mi><mi>k</mi></msup></mfrac></mrow><annotation
    encoding="application/x-tex">\mathbb{P}(X \geq \alpha) \leq \frac{E[X^k]}{\alpha^k}</annotation></semantics>P(X≥α)≤αkE[Xk]​[(13)](#QfAizRYgPz
    "Link to this Equation")
- en: 'Some important observations:'
  id: totrans-88
  prefs: []
  type: TYPE_NORMAL
  zh: 一些重要的观察：
- en: If we use this to find an upper confidence bound <semantics><mrow><mi>α</mi><mo
    stretchy="false">(</mo><mi>ϵ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ) as
    above, we can derive that the bound increases as <semantics><mrow><mi>O</mi><mo
    stretchy="false">(</mo><msup><mi>ϵ</mi><mrow><mo>−</mo><mn>1</mn><mi mathvariant="normal">/</mi><mi>k</mi></mrow></msup><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(\epsilon^{-1/k})</annotation></semantics>O(ϵ−1/k),
    which for large values of <semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k
    can be very small.
  id: totrans-89
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 如果我们用此方法寻找如上所述的上置信界 <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ)，可以推导出该界以
    <semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><msup><mi>ϵ</mi><mrow><mo>−</mo><mn>1</mn><mi
    mathvariant="normal">/</mi><mi>k</mi></mrow></msup><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">O(\epsilon^{-1/k})</annotation></semantics>O(ϵ−1/k)
    的速率增长，这对于较大的 <semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics>k
    值来说可能非常小。
- en: 'Using such bounds requires additional information about the random variable
    <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X:
    in fact, if we knew exactly all the moments <semantics><mrow><mi>E</mi><mo stretchy="false">[</mo><msup><mi>X</mi><mi>k</mi></msup><mo
    stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">E[X^k]</annotation></semantics>E[Xk]
    for <semantics><mrow><mi>k</mi><mo>=</mo><mn>1</mn><mo separator="true">,</mo><mn>2</mn><mo
    separator="true">,</mo><mo>…</mo></mrow><annotation encoding="application/x-tex">k
    = 1, 2, \ldots</annotation></semantics>k=1,2,…, then we would most likely also
    know the CDF.'
  id: totrans-90
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用这类界需要关于随机变量 <semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics>X
    的额外信息：事实上，如果我们确切知道所有 <semantics><mrow><mi>k</mi><mo>=</mo><mn>1</mn><mo separator="true">,</mo><mn>2</mn><mo
    separator="true">,</mo><mo>…</mo></mrow><annotation encoding="application/x-tex">k
    = 1, 2, \ldots</annotation></semantics>k=1,2,… 时的矩 <semantics><mrow><mi>E</mi><mo
    stretchy="false">[</mo><msup><mi>X</mi><mi>k</mi></msup><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">E[X^k]</annotation></semantics>E[Xk]，那么我们很可能也就知道了其累积分布函数。
- en: Moment generating function and Chernoff’s method[¶](#moment-generating-function-and-chernoffs-method
    "Link to this Section")
  id: totrans-91
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 矩母函数与切尔诺夫方法[¶](#moment-generating-function-and-chernoffs-method "Link to this
    Section")
- en: '*You may find it helpful to review [Section 19.2 of the Data 140 textbook](https://data140.org/textbook/content/Chapter_19/02_Moment_Generating_Functions.html).*'
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: '*您可能会发现复习[《Data 140》教材第19.2节](https://data140.org/textbook/content/Chapter_19/02_Moment_Generating_Functions.html)会有所帮助。*'
- en: 'Recall from calculus that we can write the exponential function <semantics><mrow><msup><mi>e</mi><mi>x</mi></msup></mrow><annotation
    encoding="application/x-tex">e^x</annotation></semantics>ex using aa Taylor series
    as:'
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: 回顾微积分知识，我们可以用泰勒级数将指数函数 <semantics><mrow><msup><mi>e</mi><mi>x</mi></msup></mrow><annotation
    encoding="application/x-tex">e^x</annotation></semantics>ex 表示为：
- en: <semantics><mrow><msup><mi>e</mi><mi>x</mi></msup><mo>=</mo><mn>1</mn><mo>+</mo><mi>x</mi><mo>+</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mo
    stretchy="false">!</mo></mrow></mfrac><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mrow><mn>3</mn><mo
    stretchy="false">!</mo></mrow></mfrac><msup><mi>x</mi><mn>3</mn></msup><mo>+</mo><mfrac><mn>1</mn><mrow><mn>4</mn><mo
    stretchy="false">!</mo></mrow></mfrac><msup><mi>x</mi><mn>4</mn></msup><mo>+</mo><mo>⋯</mo><mo
    separator="true">,</mo></mrow><annotation encoding="application/x-tex">e^x = 1
    + x + \frac{1}{2!} x^2 + \frac{1}{3!} x^3 + \frac{1}{4!} x^4 + \cdots,</annotation></semantics>ex=1+x+2!1​x2+3!1​x3+4!1​x4+⋯,[(14)](#EVuzSmkOoh
    "Link to this Equation")
  id: totrans-94
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><msup><mi>e</mi><mi>x</mi></msup><mo>=</mo><mn>1</mn><mo>+</mo><mi>x</mi><mo>+</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mo
    stretchy="false">!</mo></mrow></mfrac><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mrow><mn>3</mn><mo
    stretchy="false">!</mo></mrow></mfrac><msup><mi>x</mi><mn>3</mn></msup><mo>+</mo><mfrac><mn>1</mn><mrow><mn>4</mn><mo
    stretchy="false">!</mo></mrow></mfrac><msup><mi>x</mi><mn>4</mn></msup><mo>+</mo><mo>⋯</mo><mo
    separator="true">,</mo></mrow><annotation encoding="application/x-tex">e^x = 1
    + x + \frac{1}{2!} x^2 + \frac{1}{3!} x^3 + \frac{1}{4!} x^4 + \cdots,</annotation></semantics>ex=1+x+2!1​x2+3!1​x3+4!1​x4+⋯,[(14)](#EVuzSmkOoh
    "Link to this Equation")
- en: 'Motivated by this, and by our observation earlier that we can use the higher
    moments of a random variable to establish better tail bounds, we’ll examine the
    **moment-generating function** (or MGF) of a random variable <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X:'
  id: totrans-95
  prefs: []
  type: TYPE_NORMAL
  zh: 受此启发，并结合我们之前观察到的可以利用随机变量的高阶矩来建立更好的尾界，我们将研究随机变量 <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X 的**矩母函数**（或称 MGF）：
- en: <semantics><mrow><msub><mi>M</mi><mi>X</mi></msub><mo stretchy="false">(</mo><mi>λ</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>E</mi><mo stretchy="false">[</mo><msup><mi>e</mi><mrow><mi>λ</mi><mi>X</mi></mrow></msup><mo
    stretchy="false">]</mo><mo>=</mo><mn>1</mn><mo>+</mo><mi>λ</mi><mi>E</mi><mo stretchy="false">[</mo><mi>X</mi><mo
    stretchy="false">]</mo><mo>+</mo><mfrac><msup><mi>λ</mi><mn>2</mn></msup><mrow><mn>2</mn><mo
    stretchy="false">!</mo></mrow></mfrac><mi>E</mi><mo stretchy="false">[</mo><msup><mi>X</mi><mn>2</mn></msup><mo
    stretchy="false">]</mo><mo>+</mo><mfrac><msup><mi>λ</mi><mn>3</mn></msup><mrow><mn>3</mn><mo
    stretchy="false">!</mo></mrow></mfrac><mi>E</mi><mo stretchy="false">[</mo><msup><mi>X</mi><mn>3</mn></msup><mo
    stretchy="false">]</mo><mo>+</mo><mo>⋯</mo></mrow><annotation encoding="application/x-tex">M_X(\lambda)
    = E[e^{\lambda X}] = 1 + \lambda E[X] + \frac{\lambda^2}{2!} E[X^2] + \frac{\lambda^3}{3!}
    E[X^3] + \cdots</annotation></semantics>MX​(λ)=E[eλX]=1+λE[X]+2!λ2​E[X2]+3!λ3​E[X3]+⋯[(15)](#KCp9hjxex3
    "Link to this Equation")
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><msub><mi>M</mi><mi>X</mi></msub><mo stretchy="false">(</mo><mi>λ</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>E</mi><mo stretchy="false">[</mo><msup><mi>e</mi><mrow><mi>λ</mi><mi>X</mi></mrow></msup><mo
    stretchy="false">]</mo><mo>=</mo><mn>1</mn><mo>+</mo><mi>λ</mi><mi>E</mi><mo stretchy="false">[</mo><mi>X</mi><mo
    stretchy="false">]</mo><mo>+</mo><mfrac><msup><mi>λ</mi><mn>2</mn></msup><mrow><mn>2</mn><mo
    stretchy="false">!</mo></mrow></mfrac><mi>E</mi><mo stretchy="false">[</mo><msup><mi>X</mi><mn>2</mn></msup><mo
    stretchy="false">]</mo><mo>+</mo><mfrac><msup><mi>λ</mi><mn>3</mn></msup><mrow><mn>3</mn><mo
    stretchy="false">!</mo></mrow></mfrac><mi>E</mi><mo stretchy="false">[</mo><msup><mi>X</mi><mn>3</mn></msup><mo
    stretchy="false">]</mo><mo>+</mo><mo>⋯</mo></mrow><annotation encoding="application/x-tex">M_X(\lambda)
    = E[e^{\lambda X}] = 1 + \lambda E[X] + \frac{\lambda^2}{2!} E[X^2] + \frac{\lambda^3}{3!}
    E[X^3] + \cdots</annotation></semantics>MX​(λ)=E[eλX]=1+λE[X]+2!λ2​E[X2]+3!λ3​E[X3]+⋯[(15)](#KCp9hjxex3
    "链接至此方程")
- en: 'A very important fact about MGFs is that for a sum of independent random variables
    <semantics><mrow><mi>Y</mi><mo>=</mo><msub><mi>X</mi><mn>1</mn></msub><mo>+</mo><mo>⋯</mo><mo>+</mo><msub><mi>X</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">Y = X_1 + \cdots + X_n</annotation></semantics>Y=X1​+⋯+Xn​,
    the MGF of <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    is equal to the product of the MGFs for each <semantics><mrow><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">X_i</annotation></semantics>Xi​:'
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
  zh: 关于矩母函数的一个非常重要的事实是：对于独立随机变量的和 <semantics><mrow><mi>Y</mi><mo>=</mo><msub><mi>X</mi><mn>1</mn></msub><mo>+</mo><mo>⋯</mo><mo>+</mo><msub><mi>X</mi><mi>n</mi></msub></mrow><annotation
    encoding="application/x-tex">Y = X_1 + \cdots + X_n</annotation></semantics>Y=X1​+⋯+Xn​，其矩母函数
    <semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics>Y
    等于每个 <semantics><mrow><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">X_i</annotation></semantics>Xi​
    的矩母函数的乘积：
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left right" columnspacing="0em
    1em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><msub><mi>M</mi><mi>Y</mi></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>E</mi><mrow><mo fence="true">[</mo><msup><mi>e</mi><mrow><mi>λ</mi><mi>Y</mi></mrow></msup><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mi>E</mi><mrow><mo fence="true">[</mo><msup><mi>e</mi><mrow><munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mi>λ</mi><msub><mi>X</mi><mi>i</mi></msub></mrow></msup><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mi>E</mi><mrow><mo fence="true">[</mo><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><msup><mi>e</mi><mrow><mi>λ</mi><msub><mi>X</mi><mi>i</mi></msub></mrow></msup><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mi>E</mi><mrow><mo
    fence="true">[</mo><msup><mi>e</mi><mrow><mi>λ</mi><msub><mi>X</mi><mi>i</mi></msub></mrow></msup><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>(by independence)</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><msub><mi>M</mi><msub><mi>X</mi><mi>i</mi></msub></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} M_Y(\lambda) &= E\left[e^{\lambda
    Y}\right] \\ &= E\left[e^{\sum_{i=1}^n \lambda X_i}\right] \\ &= E\left[\prod_{i=1}^n
    e^{\lambda X_i}\right] \\ &= \prod_{i=1}^n E\left[e^{\lambda X_i}\right] & \text{(by
    independence)} \\ &= \prod_{i=1}^n M_{X_i}(\lambda) \end{align*}</annotation></semantics>MY​(λ)​=E[eλY]=E[e∑i=1n​λXi​]=E[i=1∏n​eλXi​]=i=1∏n​E[eλXi​]=i=1∏n​MXi​​(λ)​(by independence)​[(16)](#Bu7p9bCIK4
    "Link to this Equation")
  id: totrans-98
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left right" columnspacing="0em
    1em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><msub><mi>M</mi><mi>Y</mi></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>E</mi><mrow><mo fence="true">[</mo><msup><mi>e</mi><mrow><mi>λ</mi><mi>Y</mi></mrow></msup><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mi>E</mi><mrow><mo fence="true">[</mo><msup><mi>e</mi><mrow><munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mi>λ</mi><msub><mi>X</mi><mi>i</mi></msub></mrow></msup><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><mi>E</mi><mrow><mo fence="true">[</mo><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><msup><mi>e</mi><mrow><mi>λ</mi><msub><mi>X</mi><mi>i</mi></msub></mrow></msup><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0"
    displaystyle="true"><mrow><mo>=</mo><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mi>E</mi><mrow><mo
    fence="true">[</mo><msup><mi>e</mi><mrow><mi>λ</mi><msub><mi>X</mi><mi>i</mi></msub></mrow></msup><mo
    fence="true">]</mo></mrow></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>(by independence)</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><msub><mi>M</mi><msub><mi>X</mi><mi>i</mi></msub></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} M_Y(\lambda) &= E\left[e^{\lambda
    Y}\right] \\ &= E\left[e^{\sum_{i=1}^n \lambda X_i}\right] \\ &= E\left[\prod_{i=1}^n
    e^{\lambda X_i}\right] \\ &= \prod_{i=1}^n E\left[e^{\lambda X_i}\right] & \text{(by
    independence)} \\ &= \prod_{i=1}^n M_{X_i}(\lambda) \end{align*}</annotation></semantics>MY​(λ)​=E[eλY]=E[e∑i=1n​λXi​]=E[i=1∏n​eλXi​]=i=1∏n​E[eλXi​]=i=1∏n​MXi​​(λ)​(基于独立性)​[(16)](#Bu7p9bCIK4
    "链接到此方程")
- en: Chernoff Bound[¶](#chernoff-bound "Link to this Section")
  id: totrans-99
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: Chernoff 界[¶](#chernoff-bound "链接到此章节")
- en: 'Since <semantics><mrow><msup><mi>e</mi><mrow><mi>λ</mi><mi>X</mi></mrow></msup></mrow><annotation
    encoding="application/x-tex">e^{\lambda X}</annotation></semantics>eλX is a nonnegative
    random variable, we can again use Markov’s inequality to find a bound:'
  id: totrans-100
  prefs: []
  type: TYPE_NORMAL
  zh: 由于 <semantics><mrow><msup><mi>e</mi><mrow><mi>λ</mi><mi>X</mi></mrow></msup></mrow><annotation
    encoding="application/x-tex">e^{\lambda X}</annotation></semantics>eλX 是一个非负随机变量，我们可以再次使用**马尔可夫不等式**来找到一个界：
- en: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>≥</mo><mi>α</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>P</mi><mo stretchy="false">(</mo><mi>E</mi><mo
    stretchy="false">[</mo><msup><mi>e</mi><mrow><mi>λ</mi><mi>X</mi></mrow></msup><mo
    stretchy="false">]</mo><mo>≥</mo><msup><mi>e</mi><mrow><mi>λ</mi><mi>α</mi></mrow></msup><mo
    stretchy="false">)</mo><mo>≤</mo><mfrac><mrow><mi>E</mi><mo stretchy="false">[</mo><msup><mi>e</mi><mrow><mi>λ</mi><mi>X</mi></mrow></msup><mo
    stretchy="false">]</mo></mrow><msup><mi>e</mi><mrow><mi>λ</mi><mi>α</mi></mrow></msup></mfrac><mo>=</mo><mfrac><mrow><msub><mi>M</mi><mi>X</mi></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow><msup><mi>e</mi><mrow><mi>λ</mi><mi>α</mi></mrow></msup></mfrac></mrow><annotation
    encoding="application/x-tex">P(X \geq \alpha) = P(E[e^{\lambda X}] \geq e^{\lambda
    \alpha}) ~ \leq ~ \frac{E[e^{\lambda X}]}{e^{\lambda \alpha}} ~ = ~ \frac{M_X(\lambda)}{e^{\lambda
    \alpha}}</annotation></semantics>P(X≥α)=P(E[eλX]≥eλα) ≤ eλαE[eλX]​ = eλαMX​(λ)​[(17)](#KfpQZ3X5xW
    "Link to this Equation")
  id: totrans-101
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>≥</mo><mi>α</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>P</mi><mo stretchy="false">(</mo><mi>E</mi><mo
    stretchy="false">[</mo><msup><mi>e</mi><mrow><mi>λ</mi><mi>X</mi></mrow></msup><mo
    stretchy="false">]</mo><mo>≥</mo><msup><mi>e</mi><mrow><mi>λ</mi><mi>α</mi></mrow></msup><mo
    stretchy="false">)</mo><mo>≤</mo><mfrac><mrow><mi>E</mi><mo stretchy="false">[</mo><msup><mi>e</mi><mrow><mi>λ</mi><mi>X</mi></mrow></msup><mo
    stretchy="false">]</mo></mrow><msup><mi>e</mi><mrow><mi>λ</mi><mi>α</mi></mrow></msup></mfrac><mo>=</mo><mfrac><mrow><msub><mi>M</mi><mi>X</mi></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow><msup><mi>e</mi><mrow><mi>λ</mi><mi>α</mi></mrow></msup></mfrac></mrow><annotation
    encoding="application/x-tex">P(X \geq \alpha) = P(E[e^{\lambda X}] \geq e^{\lambda
    \alpha}) ~ \leq ~ \frac{E[e^{\lambda X}]}{e^{\lambda \alpha}} ~ = ~ \frac{M_X(\lambda)}{e^{\lambda
    \alpha}}</annotation></semantics>P(X≥α)=P(E[eλX]≥eλα) ≤ eλαE[eλX]​ = eλαMX​(λ)​[(17)](#KfpQZ3X5xW
    "链接到此方程")
- en: 'This is a family of bounds, one for each positive <semantics><mrow><mi>λ</mi></mrow><annotation
    encoding="application/x-tex">\lambda</annotation></semantics>λ. To get the best
    possible one (i.e., the smallest), we should minimize over all nonnegative <semantics><mrow><mi>λ</mi></mrow><annotation
    encoding="application/x-tex">\lambda</annotation></semantics>λ:'
  id: totrans-102
  prefs: []
  type: TYPE_NORMAL
  zh: 这是一族界限，每个正的 <semantics><mrow><mi>λ</mi></mrow><annotation encoding="application/x-tex">\lambda</annotation></semantics>λ
    对应一个。为了得到可能的最佳界限（即最小的），我们应该对所有非负的 <semantics><mrow><mi>λ</mi></mrow><annotation
    encoding="application/x-tex">\lambda</annotation></semantics>λ 进行最小化：
- en: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>≥</mo><mi>α</mi><mo
    stretchy="false">)</mo><mo>≤</mo><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>λ</mi><mo>≥</mo><mn>0</mn></mrow></munder><mfrac><mrow><msub><mi>M</mi><mi>X</mi></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow><msup><mi>e</mi><mrow><mi>λ</mi><mi>α</mi></mrow></msup></mfrac></mrow><annotation
    encoding="application/x-tex">P(X \geq \alpha) ~ \leq ~ \min_{\lambda \ge 0} \frac{M_X(\lambda)}{e^{\lambda
    \alpha}}</annotation></semantics>P(X≥α) ≤ λ≥0min​eλαMX​(λ)​[(18)](#WlnHla1PiJ
    "Link to this Equation")
  id: totrans-103
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>≥</mo><mi>α</mi><mo
    stretchy="false">)</mo><mo>≤</mo><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>λ</mi><mo>≥</mo><mn>0</mn></mrow></munder><mfrac><mrow><msub><mi>M</mi><mi>X</mi></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow><msup><mi>e</mi><mrow><mi>λ</mi><mi>α</mi></mrow></msup></mfrac></mrow><annotation
    encoding="application/x-tex">P(X \geq \alpha) ~ \leq ~ \min_{\lambda \ge 0} \frac{M_X(\lambda)}{e^{\lambda
    \alpha}}</annotation></semantics>P(X≥α) ≤ λ≥0min​eλαMX​(λ)​[(18)](#WlnHla1PiJ
    "链接到此方程")
- en: This is the **Chernoff bound.**
  id: totrans-104
  prefs: []
  type: TYPE_NORMAL
  zh: 这就是**切尔诺夫界**。
- en: '[PRE6]'
  id: totrans-105
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: Loading...
  id: totrans-106
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: 'Some important observations:'
  id: totrans-107
  prefs: []
  type: TYPE_NORMAL
  zh: 一些重要的观察：
- en: 'This requires significantly more information about the distribution than the
    earlier two bounds we saw. Specifically, if we know all the moments of a distribution,
    in most cases we effectively know the distribution. But, as we’ll see shortly,
    it can still be useful if we can bound the MGF for an entire class of distributions:
    in that case, we can replace <semantics><mrow><msub><mi>M</mi><mi>X</mi></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">M_X(\lambda)</annotation></semantics>MX​(λ) with
    an upper bound on it.'
  id: totrans-108
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 与之前我们看到的两个界限相比，这需要关于分布的更多信息。具体来说，如果我们知道一个分布的所有矩，在大多数情况下我们实际上就知道了这个分布。但是，我们很快会看到，如果我们能为一整类分布的矩母函数找到一个上界，它仍然是有用的：在这种情况下，我们可以用其上界来替换
    <semantics><mrow><msub><mi>M</mi><mi>X</mi></msub><mo stretchy="false">(</mo><mi>λ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">M_X(\lambda)</annotation></semantics>MX​(λ)。
- en: '*How fast does our bound increase as <semantics><mrow><mi>ϵ</mi></mrow><annotation
    encoding="application/x-tex">\epsilon</annotation></semantics>ϵ gets small?* Solving
    for an upper confidence bound <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ),
    we see that <semantics><mrow><mi>ϵ</mi><mo>=</mo><mfrac><mrow><msub><mi>M</mi><mi>X</mi></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow><msup><mi>e</mi><mrow><mi>λ</mi><mi>α</mi></mrow></msup></mfrac></mrow><annotation
    encoding="application/x-tex">\epsilon = \frac{M_X(\lambda)}{e^{\lambda \alpha}}</annotation></semantics>ϵ=eλαMX​(λ)​.
    If we were to for <semantics><mrow><mi>α</mi></mrow><annotation encoding="application/x-tex">\alpha</annotation></semantics>α,
    we would see that it grows as <semantics><mrow><mi>log</mi><mo>⁡</mo><mo stretchy="false">(</mo><msup><mi>ϵ</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\log(\epsilon^{-1})</annotation></semantics>log(ϵ−1):
    this is much, much slower than our previous two results! So, if we can find a
    class of random variables where the MGF is known (or bounded, as in the previous
    observation), then we can place much tighter bounds on those random variables.'
  id: totrans-109
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '*当 <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ
    变小时，我们的界增长得有多快？* 求解上置信界 <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\alpha(\epsilon)</annotation></semantics>α(ϵ)，我们看到
    <semantics><mrow><mi>ϵ</mi><mo>=</mo><mfrac><mrow><msub><mi>M</mi><mi>X</mi></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow><msup><mi>e</mi><mrow><mi>λ</mi><mi>α</mi></mrow></msup></mfrac></mrow><annotation
    encoding="application/x-tex">\epsilon = \frac{M_X(\lambda)}{e^{\lambda \alpha}}</annotation></semantics>ϵ=eλαMX​(λ)​。如果我们求解
    <semantics><mrow><mi>α</mi></mrow><annotation encoding="application/x-tex">\alpha</annotation></semantics>α，会发现它随着
    <semantics><mrow><mi>log</mi><mo>⁡</mo><mo stretchy="false">(</mo><msup><mi>ϵ</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\log(\epsilon^{-1})</annotation></semantics>log(ϵ−1)
    增长：这比我们之前的两个结果要慢得多！因此，如果我们能找到一类矩母函数已知（或有界，如之前的观察所示）的随机变量，那么我们就能对这些随机变量施加更紧的界。'
- en: 'Example: Sample Mean with Chernoff Bound[¶](#example-sample-mean-with-chernoff-bound
    "Link to this Section")'
  id: totrans-110
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例：使用切尔诺夫界的样本均值[¶](#example-sample-mean-with-chernoff-bound "Link to this Section")
- en: 'Given <semantics><mrow><msub><mi>X</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>X</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">X_1,
    \ldots, X_n</annotation></semantics>X1​,…,Xn​ and their sample mean <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y, how well does Chernoff’s
    bound answer the question of whether <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y can be far from the true
    mean <semantics><mrow><mi>μ</mi></mrow><annotation encoding="application/x-tex">\mu</annotation></semantics>μ?
    Because we know about the MGF of a sum of random variables, we’ll bound the variable
    <semantics><mrow><mi>n</mi><mi>Y</mi><mo>=</mo><mo>∑</mo><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">nY = \sum X_i</annotation></semantics>nY=∑Xi​:'
  id: totrans-111
  prefs: []
  type: TYPE_NORMAL
  zh: 给定 <semantics><mrow><msub><mi>X</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo
    separator="true">,</mo><msub><mi>X</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">X_1,
    \ldots, X_n</annotation></semantics>X1​,…,Xn​ 及其样本均值 <semantics><mrow><mi>Y</mi></mrow><annotation
    encoding="application/x-tex">Y</annotation></semantics>Y，切尔诺夫界在回答 *Y* 是否可能远离真实均值
    <semantics><mrow><mi>μ</mi></mrow><annotation encoding="application/x-tex">\mu</annotation></semantics>μ
    的问题上表现如何？由于我们知道随机变量和的矩母函数，我们将对变量 <semantics><mrow><mi>n</mi><mi>Y</mi><mo>=</mo><mo>∑</mo><msub><mi>X</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">nY = \sum X_i</annotation></semantics>nY=∑Xi​ 进行界定：
- en: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>Y</mi><mo>−</mo><mi>μ</mi><mo>≥</mo><mi>α</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>P</mi><mo stretchy="false">(</mo><mi>n</mi><mi>Y</mi><mo>−</mo><mi>n</mi><mi>μ</mi><mo>≥</mo><mi>n</mi><mi>α</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>P</mi><mo stretchy="false">(</mo><mi>n</mi><mi>Y</mi><mo>≥</mo><mi>n</mi><mo
    stretchy="false">(</mo><mi>μ</mi><mo>+</mo><mi>α</mi><mo stretchy="false">)</mo><mo
    stretchy="false">)</mo><mo>≤</mo><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>λ</mi><mo>></mo><mn>0</mn></mrow></munder><mfrac><msup><mrow><mo
    fence="true">[</mo><msub><mi>M</mi><msub><mi>X</mi><mi>i</mi></msub></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo><mo fence="true">]</mo></mrow><mi>n</mi></msup><msup><mi>e</mi><mrow><mi>λ</mi><mi>n</mi><mo
    stretchy="false">(</mo><mi>μ</mi><mo>+</mo><mi>α</mi><mo stretchy="false">)</mo></mrow></msup></mfrac></mrow><annotation
    encoding="application/x-tex">P(Y - \mu \geq \alpha) = P(nY - n\mu \geq n\alpha)
    = P(nY \geq n(\mu + \alpha)) \leq \min_{\lambda > 0} \frac{\left[M_{X_i}(\lambda)\right]^n}{e^{\lambda
    n(\mu+\alpha)}}</annotation></semantics>P(Y−μ≥α)=P(nY−nμ≥nα)=P(nY≥n(μ+α))≤λ>0min​eλn(μ+α)[MXi​​(λ)]n​[(19)](#OVZ6uOFkan
    "Link to this Equation")
  id: totrans-112
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>Y</mi><mo>−</mo><mi>μ</mi><mo>≥</mo><mi>α</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>P</mi><mo stretchy="false">(</mo><mi>n</mi><mi>Y</mi><mo>−</mo><mi>n</mi><mi>μ</mi><mo>≥</mo><mi>n</mi><mi>α</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>P</mi><mo stretchy="false">(</mo><mi>n</mi><mi>Y</mi><mo>≥</mo><mi>n</mi><mo
    stretchy="false">(</mo><mi>μ</mi><mo>+</mo><mi>α</mi><mo stretchy="false">)</mo><mo
    stretchy="false">)</mo><mo>≤</mo><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>λ</mi><mo>></mo><mn>0</mn></mrow></munder><mfrac><msup><mrow><mo
    fence="true">[</mo><msub><mi>M</mi><msub><mi>X</mi><mi>i</mi></msub></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo><mo fence="true">]</mo></mrow><mi>n</mi></msup><msup><mi>e</mi><mrow><mi>λ</mi><mi>n</mi><mo
    stretchy="false">(</mo><mi>μ</mi><mo>+</mo><mi>α</mi><mo stretchy="false">)</mo></mrow></msup></mfrac></mrow><annotation
    encoding="application/x-tex">P(Y - \mu \geq \alpha) = P(nY - n\mu \geq n\alpha)
    = P(nY \geq n(\mu + \alpha)) \leq \min_{\lambda > 0} \frac{\left[M_{X_i}(\lambda)\right]^n}{e^{\lambda
    n(\mu+\alpha)}}</annotation></semantics>P(Y−μ≥α)=P(nY−nμ≥nα)=P(nY≥n(μ+α))≤λ>0min​eλn(μ+α)[MXi​​(λ)]n​[(19)](#OVZ6uOFkan
    "Link to this Equation")
- en: 'This is even better than the Chebyshev bound: as <semantics><mrow><mi>n</mi></mrow><annotation
    encoding="application/x-tex">n</annotation></semantics>n increases, the probability
    decreases proportional to <semantics><mrow><msup><mi>e</mi><mrow><mo>−</mo><mi>n</mi></mrow></msup></mrow><annotation
    encoding="application/x-tex">e^{-n}</annotation></semantics>e−n.'
  id: totrans-113
  prefs: []
  type: TYPE_NORMAL
  zh: 这甚至比切比雪夫界更好：随着<semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics>n的增加，概率按<semantics><mrow><msup><mi>e</mi><mrow><mo>−</mo><mi>n</mi></mrow></msup></mrow><annotation
    encoding="application/x-tex">e^{-n}</annotation></semantics>e−n的比例下降。
- en: What if we were to ask for an upper confidence bound <semantics><mrow><mi>α</mi><mo
    stretchy="false">(</mo><mi>ϵ</mi><mo separator="true">,</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\alpha(\epsilon, n)</annotation></semantics>α(ϵ,n)
    at a given level of confidence <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ
    and a given number of samples <semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics>n?
    Doing the computation properly would require some more extensive computation due
    to the implicit optimization over <semantics><mrow><mi>λ</mi></mrow><annotation
    encoding="application/x-tex">\lambda</annotation></semantics>λ (specifically,
    the optimal value of <semantics><mrow><mi>λ</mi></mrow><annotation encoding="application/x-tex">\lambda</annotation></semantics>λ
    will depend on <semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics>n),
    but we would see that the dependence on the confidence level <semantics><mrow><mi>ϵ</mi></mrow><annotation
    encoding="application/x-tex">\epsilon</annotation></semantics>ϵ is <semantics><mrow><mi>O</mi><mo
    stretchy="false">(</mo><mi>log</mi><mo>⁡</mo><mo stretchy="false">(</mo><msup><mi>ϵ</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo
    stretchy="false">)</mo><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(\log(\epsilon^{-1}))</annotation></semantics>O(log(ϵ−1))
    , and the dependence on the number of samples is (just as with Chebyshev’s inequality)
    <semantics><mrow><msup><mi>n</mi><mrow><mo>−</mo><mn>1</mn><mi mathvariant="normal">/</mi><mn>2</mn></mrow></msup></mrow><annotation
    encoding="application/x-tex">n^{-1/2}</annotation></semantics>n−1/2.
  id: totrans-114
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们要求一个在给定置信水平 <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ
    和给定样本数量 <semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics>n
    下的置信上限 <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo separator="true">,</mo><mi>n</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\alpha(\epsilon,
    n)</annotation></semantics>α(ϵ,n) 呢？由于需要对 <semantics><mrow><mi>λ</mi></mrow><annotation
    encoding="application/x-tex">\lambda</annotation></semantics>λ 进行隐式优化（具体来说，<semantics><mrow><mi>λ</mi></mrow><annotation
    encoding="application/x-tex">\lambda</annotation></semantics>λ 的最优值将取决于 <semantics><mrow><mi>n</mi></mrow><annotation
    encoding="application/x-tex">n</annotation></semantics>n），正确计算需要更大量的计算。但我们会看到，对置信水平
    <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ
    的依赖是 <semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>log</mi><mo>⁡</mo><mo
    stretchy="false">(</mo><msup><mi>ϵ</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo
    stretchy="false">)</mo><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(\log(\epsilon^{-1}))</annotation></semantics>O(log(ϵ−1))，而对样本数量的依赖（与切比雪夫不等式一样）是
    <semantics><mrow><msup><mi>n</mi><mrow><mo>−</mo><mn>1</mn><mi mathvariant="normal">/</mi><mn>2</mn></mrow></msup></mrow><annotation
    encoding="application/x-tex">n^{-1/2}</annotation></semantics>n−1/2。
- en: '**Exercise**: Consider once more the i.i.d. Poisson random variables <semantics><mrow><msub><mi>T</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">T_i</annotation></semantics>Ti​ and their sample
    mean <semantics><mrow><mi>S</mi></mrow><annotation encoding="application/x-tex">S</annotation></semantics>S.
    Use the Chernoff bound to find the smallest value <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α such that <semantics><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>S</mi><mo>≥</mo><mi>α</mi><mo stretchy="false">)</mo><mo>≤</mo><mn>0.05</mn></mrow><annotation
    encoding="application/x-tex">P(S \geq \alpha) \leq 0.05</annotation></semantics>P(S≥α)≤0.05.
    How does your result compare to the true probability, to the Markov bound, and
    to the Chebyshev bound? *Hint: you can easily look up the MGF for the Poisson
    distribution.*'
  id: totrans-115
  prefs: []
  type: TYPE_NORMAL
  zh: '**练习**：再次考虑独立同分布的泊松随机变量 <semantics><mrow><msub><mi>T</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">T_i</annotation></semantics>Ti​ 及其样本均值 <semantics><mrow><mi>S</mi></mrow><annotation
    encoding="application/x-tex">S</annotation></semantics>S。使用切尔诺夫边界求最小的 <semantics><mrow><mi>α</mi></mrow><annotation
    encoding="application/x-tex">\alpha</annotation></semantics>α 值，使得 <semantics><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>S</mi><mo>≥</mo><mi>α</mi><mo stretchy="false">)</mo><mo>≤</mo><mn>0.05</mn></mrow><annotation
    encoding="application/x-tex">P(S \geq \alpha) \leq 0.05</annotation></semantics>P(S≥α)≤0.05。你的结果与真实概率、马尔可夫边界以及切比雪夫边界相比如何？*提示：你可以轻松查到泊松分布的矩母函数。*'
- en: 'Video example: flipping biased coins with the Chernoff bound[¶](#video-example-flipping-biased-coins-with-the-chernoff-bound
    "Link to this Section")'
  id: totrans-116
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 视频示例：使用切尔诺夫边界翻转有偏硬币[¶](#video-example-flipping-biased-coins-with-the-chernoff-bound
    "Link to this Section")
- en: '[PRE7]'
  id: totrans-117
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: Loading...
  id: totrans-118
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: '(Optional) Example: comparing bounds on a known Gaussian random variable[¶](#id-optional-example-comparing-bounds-on-a-known-gaussian-random-variable
    "Link to this Section")'
  id: totrans-119
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: （可选）示例：比较已知高斯随机变量的界[¶](#id-optional-example-comparing-bounds-on-a-known-gaussian-random-variable
    "Link to this Section")
- en: Bounding the probability for a given threshold[¶](#bounding-the-probability-for-a-given-threshold
    "Link to this Section")
  id: totrans-120
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 给定阈值的概率界[¶](#bounding-the-probability-for-a-given-threshold "Link to this Section")
- en: We now apply each of the bounds we’ve learned about to a Gaussian random variable
    with known mean <semantics><mrow><mi>μ</mi></mrow><annotation encoding="application/x-tex">\mu</annotation></semantics>μ
    and variance <semantics><mrow><msup><mi>σ</mi><mn>2</mn></msup></mrow><annotation
    encoding="application/x-tex">\sigma^2</annotation></semantics>σ2, <semantics><mrow><mi>X</mi><mo>∼</mo><mi
    mathvariant="script">N</mi><mo stretchy="false">(</mo><mi>μ</mi><mo separator="true">,</mo><msup><mi>σ</mi><mn>2</mn></msup><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">X \sim
    \mathcal{N}(\mu, \sigma^2)</annotation></semantics>X∼N(μ,σ2). For this example,
    we can also compute exact bounds and compare them.
  id: totrans-121
  prefs: []
  type: TYPE_NORMAL
  zh: 现在，我们将已学的每个界应用于一个已知均值 <semantics><mrow><mi>μ</mi></mrow><annotation encoding="application/x-tex">\mu</annotation></semantics>μ
    和方差 <semantics><mrow><msup><mi>σ</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">\sigma^2</annotation></semantics>σ2
    的高斯随机变量，<semantics><mrow><mi>X</mi><mo>∼</mo><mi mathvariant="script">N</mi><mo
    stretchy="false">(</mo><mi>μ</mi><mo separator="true">,</mo><msup><mi>σ</mi><mn>2</mn></msup><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">X \sim
    \mathcal{N}(\mu, \sigma^2)</annotation></semantics>X∼N(μ,σ2)。对于此示例，我们还可以计算精确的界并进行比较。
- en: We cannot use Markov’s inequality, since this random variable can take on negative
    values.
  id: totrans-122
  prefs: []
  type: TYPE_NORMAL
  zh: 我们不能使用马尔可夫不等式，因为这个随机变量可以取负值。
- en: 'Because <semantics><mrow><mi>X</mi><mo>−</mo><mi>μ</mi></mrow><annotation encoding="application/x-tex">X
    - \mu</annotation></semantics>X−μ is symmetric about zero, the Chebyshev bound
    for a single tail is:'
  id: totrans-123
  prefs: []
  type: TYPE_NORMAL
  zh: 因为 <semantics><mrow><mi>X</mi><mo>−</mo><mi>μ</mi></mrow><annotation encoding="application/x-tex">X
    - \mu</annotation></semantics>X−μ 关于零对称，所以单侧的切比雪夫界为：
- en: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>−</mo><mi>μ</mi><mo>≥</mo><mi>t</mi><mo
    stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>P</mi><mo
    stretchy="false">(</mo><mi mathvariant="normal">∣</mi><mi>X</mi><mo>−</mo><mi>μ</mi><mi
    mathvariant="normal">∣</mi><mo>≥</mo><mi>t</mi><mo stretchy="false">)</mo><mo>≤</mo><mfrac><msup><mi>σ</mi><mn>2</mn></msup><mrow><mn>2</mn><msup><mi>t</mi><mn>2</mn></msup></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">P(X - \mu \geq t) = \frac{1}{2}P(|X - \mu| \geq t)
    \leq \frac{\sigma^2}{2t^2}</annotation></semantics>P(X−μ≥t)=21​P(∣X−μ∣≥t)≤2t2σ2​[(20)](#Q78iqYYq89
    "Link to this Equation")
  id: totrans-124
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>−</mo><mi>μ</mi><mo>≥</mo><mi>t</mi><mo
    stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>P</mi><mo
    stretchy="false">(</mo><mi mathvariant="normal">∣</mi><mi>X</mi><mo>−</mo><mi>μ</mi><mi
    mathvariant="normal">∣</mi><mo>≥</mo><mi>t</mi><mo stretchy="false">)</mo><mo>≤</mo><mfrac><msup><mi>σ</mi><mn>2</mn></msup><mrow><mn>2</mn><msup><mi>t</mi><mn>2</mn></msup></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">P(X - \mu \geq t) = \frac{1}{2}P(|X - \mu| \geq t)
    \leq \frac{\sigma^2}{2t^2}</annotation></semantics>P(X−μ≥t)=21​P(∣X−μ∣≥t)≤2t2σ2​[(20)](#Q78iqYYq89
    "Link to this Equation")
- en: Next, let’s apply Chernoff’s method. Let <semantics><mrow><mi>Z</mi><mo>=</mo><mi>X</mi><mo>−</mo><mi>μ</mi><mo>∼</mo><mi
    mathvariant="script">N</mi><mo stretchy="false">(</mo><mn>0</mn><mo separator="true">,</mo><msup><mi>σ</mi><mn>2</mn></msup><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">Z = X -
    \mu \sim \mathcal{N}(0, \sigma^2)</annotation></semantics>Z=X−μ∼N(0,σ2). Then
    <semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics>Z
    has MGF <semantics><mrow><msub><mi>M</mi><mi>Z</mi></msub><mo stretchy="false">(</mo><mi>λ</mi><mo
    stretchy="false">)</mo><mo>=</mo><msup><mi>e</mi><mrow><msup><mi>σ</mi><mn>2</mn></msup><msup><mi>λ</mi><mn>2</mn></msup><mi
    mathvariant="normal">/</mi><mn>2</mn></mrow></msup></mrow><annotation encoding="application/x-tex">M_Z(\lambda)
    = e^{\sigma^2 \lambda^2/2}</annotation></semantics>MZ​(λ)=eσ2λ2/2. So for <semantics><mrow><mi>λ</mi><mo>≥</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\lambda \ge 0</annotation></semantics>λ≥0,
  id: totrans-125
  prefs: []
  type: TYPE_NORMAL
  zh: 接下来，让我们应用切尔诺夫方法。令 <semantics><mrow><mi>Z</mi><mo>=</mo><mi>X</mi><mo>−</mo><mi>μ</mi><mo>∼</mo><mi
    mathvariant="script">N</mi><mo stretchy="false">(</mo><mn>0</mn><mo separator="true">,</mo><msup><mi>σ</mi><mn>2</mn></msup><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">Z = X -
    \mu \sim \mathcal{N}(0, \sigma^2)</annotation></semantics>Z=X−μ∼N(0,σ2)。那么 <semantics><mrow><mi>Z</mi></mrow><annotation
    encoding="application/x-tex">Z</annotation></semantics>Z 的矩母函数为 <semantics><mrow><msub><mi>M</mi><mi>Z</mi></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>e</mi><mrow><msup><mi>σ</mi><mn>2</mn></msup><msup><mi>λ</mi><mn>2</mn></msup><mi
    mathvariant="normal">/</mi><mn>2</mn></mrow></msup></mrow><annotation encoding="application/x-tex">M_Z(\lambda)
    = e^{\sigma^2 \lambda^2/2}</annotation></semantics>MZ​(λ)=eσ2λ2/2。因此对于 <semantics><mrow><mi>λ</mi><mo>≥</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\lambda \ge 0</annotation></semantics>λ≥0，
- en: <semantics><mrow><mi mathvariant="double-struck">P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>−</mo><mi>μ</mi><mo>></mo><mi>t</mi><mo
    stretchy="false">)</mo><mo>≤</mo><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>λ</mi><mo>≥</mo><mn>0</mn></mrow></munder><mi>exp</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mfrac><mrow><msup><mi>σ</mi><mn>2</mn></msup><msup><mi>λ</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>−</mo><mi>λ</mi><mi>t</mi><mo
    fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">\mathbb{P}(X
    - \mu > t) ~ \le ~ \min_{\lambda \geq 0} \exp \left( \frac{\sigma^2 \lambda^2}{2}
    - \lambda t \right)</annotation></semantics>P(X−μ>t) ≤ λ≥0min​exp(2σ2λ2​−λt)[(21)](#MZjKcZtmpW
    "Link to this Equation")
  id: totrans-126
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi mathvariant="double-struck">P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>−</mo><mi>μ</mi><mo>></mo><mi>t</mi><mo
    stretchy="false">)</mo><mo>≤</mo><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>λ</mi><mo>≥</mo><mn>0</mn></mrow></munder><mi>exp</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mfrac><mrow><msup><mi>σ</mi><mn>2</mn></msup><msup><mi>λ</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>−</mo><mi>λ</mi><mi>t</mi><mo
    fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">\mathbb{P}(X
    - \mu > t) ~ \le ~ \min_{\lambda \geq 0} \exp \left( \frac{\sigma^2 \lambda^2}{2}
    - \lambda t \right)</annotation></semantics>P(X−μ>t) ≤ λ≥0min​exp(2σ2λ2​−λt)[(21)](#MZjKcZtmpW
    "链接至此方程")
- en: How do we optimize this in <semantics><mrow><mi>λ</mi></mrow><annotation encoding="application/x-tex">\lambda</annotation></semantics>λ?
    Recognize that since <semantics><mrow><mi>exp</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\exp(x)</annotation></semantics>exp(x)
    is an increasing function, we have
  id: totrans-127
  prefs: []
  type: TYPE_NORMAL
  zh: 我们如何对 <semantics><mrow><mi>λ</mi></mrow><annotation encoding="application/x-tex">\lambda</annotation></semantics>λ
    进行优化？认识到由于 <semantics><mrow><mi>exp</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>x</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\exp(x)</annotation></semantics>exp(x)
    是一个递增函数，我们有
- en: <semantics><mrow><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>λ</mi><mo>≥</mo><mn>0</mn></mrow></munder><mi>exp</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mfrac><mrow><msup><mi>σ</mi><mn>2</mn></msup><msup><mi>λ</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>−</mo><mi>λ</mi><mi>t</mi><mo
    fence="true">)</mo></mrow><mo>=</mo><mi>exp</mi><mo>⁡</mo><mrow><mo fence="true">(</mo><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>λ</mi><mo>≥</mo><mn>0</mn></mrow></munder><mrow><mo
    fence="true">{</mo><mfrac><mrow><msup><mi>σ</mi><mn>2</mn></msup><msup><mi>λ</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>−</mo><mi>λ</mi><mi>t</mi><mo
    fence="true">}</mo></mrow><mo fence="true">)</mo></mrow><mi mathvariant="normal">.</mi></mrow><annotation
    encoding="application/x-tex">\min_{\lambda \geq 0} \exp \left( \frac{\sigma^2
    \lambda^2}{2} - \lambda t \right) = \exp \left(\min_{\lambda \geq 0} \left\{\frac{\sigma^2
    \lambda^2}{2} - \lambda t \right\} \right).</annotation></semantics>λ≥0min​exp(2σ2λ2​−λt)=exp(λ≥0min​{2σ2λ2​−λt}).[(22)](#T7lejrdrc0
    "Link to this Equation")
  id: totrans-128
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>λ</mi><mo>≥</mo><mn>0</mn></mrow></munder><mi>exp</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mfrac><mrow><msup><mi>σ</mi><mn>2</mn></msup><msup><mi>λ</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>−</mo><mi>λ</mi><mi>t</mi><mo
    fence="true">)</mo></mrow><mo>=</mo><mi>exp</mi><mo>⁡</mo><mrow><mo fence="true">(</mo><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>λ</mi><mo>≥</mo><mn>0</mn></mrow></munder><mrow><mo
    fence="true">{</mo><mfrac><mrow><msup><mi>σ</mi><mn>2</mn></msup><msup><mi>λ</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>−</mo><mi>λ</mi><mi>t</mi><mo
    fence="true">}</mo></mrow><mo fence="true">)</mo></mrow><mi mathvariant="normal">.</mi></mrow><annotation
    encoding="application/x-tex">\min_{\lambda \geq 0} \exp \left( \frac{\sigma^2
    \lambda^2}{2} - \lambda t \right) = \exp \left(\min_{\lambda \geq 0} \left\{\frac{\sigma^2
    \lambda^2}{2} - \lambda t \right\} \right).</annotation></semantics>λ≥0min​exp(2σ2λ2​−λt)=exp(λ≥0min​{2σ2λ2​−λt}).[(22)](#T7lejrdrc0
    "Link to this Equation")
- en: The quantity in the exponent is a quadratic function <semantics><mrow><mi>f</mi><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">f(\lambda)</annotation></semantics>f(λ), and can
    be minimized using the quadratic formula to get <semantics><mrow><msup><mi>λ</mi><mo>∗</mo></msup><mo>=</mo><mfrac><mi>t</mi><msup><mi>σ</mi><mn>2</mn></msup></mfrac></mrow><annotation
    encoding="application/x-tex">\lambda^* = \frac{t}{\sigma^2}</annotation></semantics>λ∗=σ2t​,
    and <semantics><mrow><mi>f</mi><mo stretchy="false">(</mo><msup><mi>λ</mi><mo>∗</mo></msup><mo
    stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mo>−</mo><msup><mi>t</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><msup><mi>σ</mi><mn>2</mn></msup></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">f(\lambda^*) = \frac{-t^2}{2\sigma^2}</annotation></semantics>f(λ∗)=2σ2−t2​.
  id: totrans-129
  prefs: []
  type: TYPE_NORMAL
  zh: 指数中的量是一个二次函数 <semantics><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>λ</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">f(\lambda)</annotation></semantics>f(λ)，可以使用二次公式求其最小值，得到
    <semantics><mrow><msup><mi>λ</mi><mo>∗</mo></msup><mo>=</mo><mfrac><mi>t</mi><msup><mi>σ</mi><mn>2</mn></msup></mfrac></mrow><annotation
    encoding="application/x-tex">\lambda^* = \frac{t}{\sigma^2}</annotation></semantics>λ∗=σ2t​，以及
    <semantics><mrow><mi>f</mi><mo stretchy="false">(</mo><msup><mi>λ</mi><mo>∗</mo></msup><mo
    stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mo>−</mo><msup><mi>t</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><msup><mi>σ</mi><mn>2</mn></msup></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">f(\lambda^*) = \frac{-t^2}{2\sigma^2}</annotation></semantics>f(λ∗)=2σ2−t2​。
- en: Putting everything together, we get
  id: totrans-130
  prefs: []
  type: TYPE_NORMAL
  zh: 综合以上，我们得到
- en: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>−</mo><mi>μ</mi><mo>></mo><mi>t</mi><mo
    stretchy="false">)</mo><mo>≤</mo><mi>exp</mi><mo>⁡</mo><mrow><mo fence="true">(</mo><mo>−</mo><mfrac><msup><mi>t</mi><mn>2</mn></msup><mrow><mn>2</mn><msup><mi>σ</mi><mn>2</mn></msup></mrow></mfrac><mo
    fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">P(X-\mu
    > t) ~\leq ~\exp\left(-\frac{t^2}{2\sigma^2}\right)</annotation></semantics>P(X−μ>t) ≤ exp(−2σ2t2​)[(23)](#OACwQQ7NGh
    "Link to this Equation")
  id: totrans-131
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>X</mi><mo>−</mo><mi>μ</mi><mo>></mo><mi>t</mi><mo
    stretchy="false">)</mo><mo>≤</mo><mi>exp</mi><mo>⁡</mo><mrow><mo fence="true">(</mo><mo>−</mo><mfrac><msup><mi>t</mi><mn>2</mn></msup><mrow><mn>2</mn><msup><mi>σ</mi><mn>2</mn></msup></mrow></mfrac><mo
    fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">P(X-\mu
    > t) ~\leq ~\exp\left(-\frac{t^2}{2\sigma^2}\right)</annotation></semantics>P(X−μ>t) ≤ exp(−2σ2t2​)[(23)](#OACwQQ7NGh
    "Link to this Equation")
- en: 'Let’s visualize these two bounds along with the exact probability (which we
    can calculate using the CDF):'
  id: totrans-132
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们将这两个边界与精确概率（我们可以使用累积分布函数计算）一起可视化：
- en: '[PRE8]'
  id: totrans-133
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: '![<Figure size 800x300 with 2 Axes>](../Images/8222ce80d529f6cef46b49239a149e01.png)'
  id: totrans-134
  prefs: []
  type: TYPE_IMG
  zh: '![<尺寸为 800x300 且包含 2 个坐标轴的图形>](../Images/8222ce80d529f6cef46b49239a149e01.png)'
- en: Bounding the threshold for a given probability[¶](#bounding-the-threshold-for-a-given-probability
    "Link to this Section")
  id: totrans-135
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: '[为给定概率设定阈值边界](#bounding-the-threshold-for-a-given-probability "Link to this
    Section")'
- en: 'Suppose that instead of being given a threshold and asked for the probability
    of exceeding it, we instead want the opposite: we want to know, given a desired
    probability, a bound or threshold such that the probability of exceeding that
    bound is small. This is the **upper confidence bound** we described earlier. To
    simplify our calculations, and without loss of generality, we’ll assume that <semantics><mrow><mi>μ</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">\mu = 0</annotation></semantics>μ=0. If we go about
    computing this for the normal distribution, we find that:'
  id: totrans-136
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们不是给定一个阈值并要求计算超出该阈值的概率，而是想要相反的情况：我们想知道，给定一个期望的概率，一个边界或阈值，使得超出该边界的概率很小。这就是我们之前描述的**上置信界**。为了简化计算且不失一般性，我们假设
    <semantics><mrow><mi>μ</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\mu
    = 0</annotation></semantics>μ=0。如果我们为正态分布计算这个值，会发现：
- en: For Chebyshev’s inequality, we have that <semantics><mrow><mi>ϵ</mi><mo>=</mo><mfrac><msup><mi>σ</mi><mn>2</mn></msup><mrow><mn>2</mn><msup><mi>α</mi><mn>2</mn></msup></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">\epsilon = \frac{\sigma^2}{2\alpha^2}</annotation></semantics>ϵ=2α2σ2​,
    or that <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mi>σ</mi><msqrt><mrow><mn>2</mn><mi>ϵ</mi></mrow></msqrt></mfrac></mrow><annotation
    encoding="application/x-tex">\alpha(\epsilon) = \frac{\sigma}{\sqrt{2\epsilon}}</annotation></semantics>α(ϵ)=2ϵ​σ​.
  id: totrans-137
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 对于切比雪夫不等式，我们有 <semantics><mrow><mi>ϵ</mi><mo>=</mo><mfrac><msup><mi>σ</mi><mn>2</mn></msup><mrow><mn>2</mn><msup><mi>α</mi><mn>2</mn></msup></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">\epsilon = \frac{\sigma^2}{2\alpha^2}</annotation></semantics>ϵ=2α2σ2​，或者说
    <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mi>σ</mi><msqrt><mrow><mn>2</mn><mi>ϵ</mi></mrow></msqrt></mfrac></mrow><annotation
    encoding="application/x-tex">\alpha(\epsilon) = \frac{\sigma}{\sqrt{2\epsilon}}</annotation></semantics>α(ϵ)=2ϵ​σ​。
- en: For Chernoff’s bound, we have that <semantics><mrow><mi>ϵ</mi><mo>=</mo><mi>exp</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mo>−</mo><mfrac><msup><mi>α</mi><mn>2</mn></msup><mrow><mn>2</mn><msup><mi>σ</mi><mn>2</mn></msup></mrow></mfrac><mo
    fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">\epsilon
    = \exp\left(-\frac{\alpha^2}{2\sigma^2}\right)</annotation></semantics>ϵ=exp(−2σ2α2​),
    or equivalently <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>σ</mi><msqrt><mrow><mn>2</mn><mi>log</mi><mo>⁡</mo><mo
    stretchy="false">(</mo><mn>1</mn><mi mathvariant="normal">/</mi><mi>ϵ</mi><mo
    stretchy="false">)</mo></mrow></msqrt></mrow><annotation encoding="application/x-tex">\alpha(\epsilon)
    = \sigma\sqrt{2\log(1/\epsilon)}</annotation></semantics>α(ϵ)=σ2log(1/ϵ)​.
  id: totrans-138
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 对于切尔诺夫界，我们有 <semantics><mrow><mi>ϵ</mi><mo>=</mo><mi>exp</mi><mo>⁡</mo><mrow><mo
    fence="true">(</mo><mo>−</mo><mfrac><msup><mi>α</mi><mn>2</mn></msup><mrow><mn>2</mn><msup><mi>σ</mi><mn>2</mn></msup></mrow></mfrac><mo
    fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">\epsilon
    = \exp\left(-\frac{\alpha^2}{2\sigma^2}\right)</annotation></semantics>ϵ=exp(−2σ2α2​)，或者等价地
    <semantics><mrow><mi>α</mi><mo stretchy="false">(</mo><mi>ϵ</mi><mo stretchy="false">)</mo><mo>=</mo><mi>σ</mi><msqrt><mrow><mn>2</mn><mi>log</mi><mo>⁡</mo><mo
    stretchy="false">(</mo><mn>1</mn><mi mathvariant="normal">/</mi><mi>ϵ</mi><mo
    stretchy="false">)</mo></mrow></msqrt></mrow><annotation encoding="application/x-tex">\alpha(\epsilon)
    = \sigma\sqrt{2\log(1/\epsilon)}</annotation></semantics>α(ϵ)=σ2log(1/ϵ)​。
- en: As we saw before, the exact probability is <semantics><mrow><msup><mi>F</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo
    stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>ϵ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">F^{-1}(1-\epsilon)</annotation></semantics>F−1(1−ϵ).
  id: totrans-139
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 正如我们之前所见，精确概率是 <semantics><mrow><msup><mi>F</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo
    stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>ϵ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">F^{-1}(1-\epsilon)</annotation></semantics>F−1(1−ϵ)。
- en: '[PRE9]'
  id: totrans-140
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: '![<Figure size 800x300 with 2 Axes>](../Images/6335459126d5c49ee9132ca70f793965.png)'
  id: totrans-141
  prefs: []
  type: TYPE_IMG
  zh: '![<Figure size 800x300 with 2 Axes>](../Images/6335459126d5c49ee9132ca70f793965.png)'
- en: Both bounds are clearly loose (i.e., too large compared to the true value),
    but the Chernoff bound is much tighter for larger values of <semantics><mrow><mi>t</mi></mrow><annotation
    encoding="application/x-tex">t</annotation></semantics>t (or equivalently, for
    small values of <semantics><mrow><mi>ϵ</mi></mrow><annotation encoding="application/x-tex">\epsilon</annotation></semantics>ϵ.
  id: totrans-142
  prefs: []
  type: TYPE_NORMAL
  zh: 两个边界显然都是宽松的（即与真实值相比过大），但对于较大的 <semantics><mrow><mi>t</mi></mrow><annotation
    encoding="application/x-tex">t</annotation></semantics>t 值（或者等价地，对于较小的 <semantics><mrow><mi>ϵ</mi></mrow><annotation
    encoding="application/x-tex">\epsilon</annotation></semantics>ϵ 值），切尔诺夫界要紧密得多。
- en: It’s a bit silly to compute Chernoff and Chebyshev tail bounds this way for
    normal random variables, because we already know the true probabilities. Still,
    this helps us understand how good those bounds are, and we’ll see in the next
    section that we can apply these same bounds even in cases where we don’t know
    the MGF exactly.
  id: totrans-143
  prefs: []
  type: TYPE_NORMAL
  zh: 对于正态随机变量，以这种方式计算切尔诺夫界和切比雪夫界有点多余，因为我们已经知道真实的概率。尽管如此，这有助于我们理解这些界的优劣程度，并且我们将在下一节中看到，即使在我们不完全知道矩母函数的情况下，我们也可以应用这些相同的界。
- en: Hoeffding’s Inequality[¶](#hoeffdings-inequality "Link to this Section")
  id: totrans-144
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: Hoeffding 不等式[¶](#hoeffdings-inequality "Link to this Section")
- en: So far, we’ve seen that using the MGF of a random variable can give us excellent
    tail bounds. But, if we know the MGF exactly, then we also know the distribution
    of the random variable, and in that case we might as well use the CDF to find
    tail bounds. As we saw in the previous example, even the Chernoff bound was not
    as good as using the actual CDF.
  id: totrans-145
  prefs: []
  type: TYPE_NORMAL
  zh: 到目前为止，我们已经看到利用随机变量的矩母函数可以得到极佳的尾概率界。但是，如果我们确切地知道矩母函数，那么我们也知道该随机变量的分布，在这种情况下，我们不妨直接使用累积分布函数（CDF）来求尾概率界。正如我们在前面的例子中看到的，即使是切尔诺夫界也不如使用实际的累积分布函数精确。
- en: 'In that case, what’s the point of the Chernoff bound? In many cases, we may
    not know the MGF, but we can **bound** it: in other words, we can find some function
    of <semantics><mrow><mi>λ</mi></mrow><annotation encoding="application/x-tex">\lambda</annotation></semantics>λ,
    <semantics><mrow><mi>h</mi><mo stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">h(\lambda)</annotation></semantics>h(λ), such that
    <semantics><mrow><msub><mi>M</mi><mi>X</mi></msub><mo stretchy="false">(</mo><mi>λ</mi><mo
    stretchy="false">)</mo><mo>≤</mo><mi>λ</mi><mi mathvariant="normal">∀</mi><mi>λ</mi></mrow><annotation
    encoding="application/x-tex">M_X(\lambda) \leq \lambda ~ ~ \forall \lambda</annotation></semantics>MX​(λ)≤λ  ∀λ.'
  id: totrans-146
  prefs: []
  type: TYPE_NORMAL
  zh: 那么，切尔诺夫界（Chernoff bound）的意义何在？在许多情况下，我们可能不知道矩母函数的确切形式，但我们可以**界定**它：换句话说，我们可以找到关于
    <semantics><mrow><mi>λ</mi></mrow><annotation encoding="application/x-tex">\lambda</annotation></semantics>λ
    的某个函数 <semantics><mrow><mi>h</mi><mo stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">h(\lambda)</annotation></semantics>h(λ)，使得 <semantics><mrow><msub><mi>M</mi><mi>X</mi></msub><mo
    stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo><mo>≤</mo><mi>λ</mi><mi
    mathvariant="normal">∀</mi><mi>λ</mi></mrow><annotation encoding="application/x-tex">M_X(\lambda)
    \leq \lambda ~ ~ \forall \lambda</annotation></semantics>MX​(λ)≤λ  ∀λ。
- en: 'One such example is that of **bounded** random variables: that is, random variables
    that only take on values between some lower bound <semantics><mrow><mi>a</mi></mrow><annotation
    encoding="application/x-tex">a</annotation></semantics>a and some upper bound
    <semantics><mrow><mi>b</mi></mrow><annotation encoding="application/x-tex">b</annotation></semantics>b.'
  id: totrans-147
  prefs: []
  type: TYPE_NORMAL
  zh: 其中一个例子是**有界**随机变量：即随机变量的取值仅在下界 <semantics><mrow><mi>a</mi></mrow><annotation
    encoding="application/x-tex">a</annotation></semantics>a 和上界 <semantics><mrow><mi>b</mi></mrow><annotation
    encoding="application/x-tex">b</annotation></semantics>b 之间。
- en: Hoeffding’s Lemma[¶](#hoeffdings-lemma "Link to this Section")
  id: totrans-148
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: Hoeffding 引理[¶](#hoeffdings-lemma "Link to this Section")
- en: Hoeffding’s lemma gives us an upper bound on the MGF for any bounded random
    variable. Specifically, given a random variable <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X with mean <semantics><mrow><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">E[X]</annotation></semantics>E[X] that is bounded
    between <semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics>a
    and <semantics><mrow><mi>b</mi></mrow><annotation encoding="application/x-tex">b</annotation></semantics>b,
    we have that
  id: totrans-149
  prefs: []
  type: TYPE_NORMAL
  zh: Hoeffding 引理给出了任意有界随机变量的矩母函数（MGF）的上界。具体来说，给定一个随机变量 <semantics><mrow><mi>X</mi></mrow><annotation
    encoding="application/x-tex">X</annotation></semantics>X，其均值为 <semantics><mrow><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo></mrow><annotation
    encoding="application/x-tex">E[X]</annotation></semantics>E[X]，且取值在 <semantics><mrow><mi>a</mi></mrow><annotation
    encoding="application/x-tex">a</annotation></semantics>a 和 <semantics><mrow><mi>b</mi></mrow><annotation
    encoding="application/x-tex">b</annotation></semantics>b 之间，我们有
- en: <semantics><mrow><msub><mi>M</mi><mi>X</mi></msub><mo stretchy="false">(</mo><mi>λ</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>E</mi><mo stretchy="false">[</mo><msup><mi>e</mi><mrow><mi>λ</mi><mi>X</mi></mrow></msup><mo
    stretchy="false">]</mo><mo>≤</mo><mi>exp</mi><mo>⁡</mo><mrow><mo fence="true">{</mo><mi>λ</mi><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo><mo>+</mo><mfrac><mrow><msup><mi>λ</mi><mn>2</mn></msup><mo
    stretchy="false">(</mo><mi>b</mi><mo>−</mo><mi>a</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow><mn>8</mn></mfrac><mo
    fence="true">}</mo></mrow></mrow><annotation encoding="application/x-tex">M_X(\lambda)
    = E[e^{\lambda X}] \leq \exp\left\{\lambda E[X] + \frac{\lambda^2(b-a)^2}{8}\right\}</annotation></semantics>MX​(λ)=E[eλX]≤exp{λE[X]+8λ2(b−a)2​}[(24)](#w0rHfAxkOq
    "Link to this Equation")
  id: totrans-150
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><msub><mi>M</mi><mi>X</mi></msub><mo stretchy="false">(</mo><mi>λ</mi><mo
    stretchy="false">)</mo><mo>=</mo><mi>E</mi><mo stretchy="false">[</mo><msup><mi>e</mi><mrow><mi>λ</mi><mi>X</mi></mrow></msup><mo
    stretchy="false">]</mo><mo>≤</mo><mi>exp</mi><mo>⁡</mo><mrow><mo fence="true">{</mo><mi>λ</mi><mi>E</mi><mo
    stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo><mo>+</mo><mfrac><mrow><msup><mi>λ</mi><mn>2</mn></msup><mo
    stretchy="false">(</mo><mi>b</mi><mo>−</mo><mi>a</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow><mn>8</mn></mfrac><mo
    fence="true">}</mo></mrow></mrow><annotation encoding="application/x-tex">M_X(\lambda)
    = E[e^{\lambda X}] \leq \exp\left\{\lambda E[X] + \frac{\lambda^2(b-a)^2}{8}\right\}</annotation></semantics>MX​(λ)=E[eλX]≤exp{λE[X]+8λ2(b−a)2​}[(24)](#w0rHfAxkOq
    "Link to this Equation")
- en: For the proof and more on the lemma, see [the Hoeffding’s lemma Wikipedia article](https://en.wikipedia.org/wiki/Hoeffding%27s_lemma).
  id: totrans-151
  prefs: []
  type: TYPE_NORMAL
  zh: 关于该引理的证明和更多信息，请参阅[霍夫丁引理维基百科文章](https://en.wikipedia.org/wiki/Hoeffding%27s_lemma)。
