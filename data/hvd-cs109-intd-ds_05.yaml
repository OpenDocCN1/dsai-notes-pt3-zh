- en: Who will find this book useful?
  id: totrans-17
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 谁会发现这本书有用？
- en: This book is meant to be a textbook for a first course in Data Science. No previous
    knowledge of R is necessary, although some experience with programming may be
    helpful. The statistical concepts used to answer the case study questions are
    only briefly introduced, so a Probability and Statistics textbook is highly recommended
    for in-depth understanding of these concepts. If you read and understand all the
    chapters and complete all the exercises, you will be well-positioned to perform
    basic data analysis tasks and you will be prepared to learn the more advanced
    concepts and skills needed to become an expert.
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 本书旨在作为数据科学入门课程的教科书。不需要R的先验知识，尽管一些编程经验可能会有所帮助。用于回答案例研究问题的统计概念仅简要介绍，因此强烈建议阅读概率和统计学教科书以深入了解这些概念。如果你阅读并理解了所有章节并完成了所有练习，你将能够执行基本的数据分析任务，并准备好学习成为专家所需的更高级的概念和技能。
- en: What does this book cover?
  id: totrans-19
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 本书涵盖了哪些内容？
- en: We start by going over the **basics of R** and the **tidyverse**. You learn
    R throughout the book, but in the first part we go over the building blocks needed
    to keep learning.
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 我们首先回顾R和tidyverse的**基础**。你将在整本书中学习R，但在第一部分，我们回顾了继续学习所需的构建块。
- en: The growing availability of informative datasets and software tools has led
    to increased reliance on **data visualizations** in many fields. In the second
    part we demonstrate how to use **ggplot2** to generate graphs and describe important
    data visualization principles.
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 信息数据集和软件工具的日益可用导致许多领域对**数据可视化**的依赖性增加。在第二部分，我们展示了如何使用**ggplot2**生成图表并描述重要的数据可视化原则。
- en: In the third part we demonstrate the importance of statistics in data analysis
    by answering case study questions using **probability, inference, and regression**
    with R.
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 在第三部分，我们通过使用R语言中的**概率、推断和回归**来回答案例研究问题，展示了统计学在数据分析中的重要性。
- en: The fourth part uses several examples to familiarize the reader with **data
    wrangling**. Among the specific skills we learn are web scraping, using regular
    expressions, and joining and reshaping data tables. We do this using **tidyverse**
    tools.
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 第四部分通过几个例子使读者熟悉**数据处理**。我们学习的具体技能包括网络爬虫、使用正则表达式以及合并和重塑数据表。我们使用**tidyverse**工具来完成这些工作。
- en: In the fifth part we present several challenges that lead us to introduce **machine
    learning**. We learn to use the **caret** package to build prediction algorithms
    including K-nearest neighbors and random forests.
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: 在第五部分，我们提出了几个挑战，这些挑战引导我们引入**机器学习**。我们学习使用**caret**包来构建预测算法，包括K最近邻和随机森林。
- en: In the final part, we provide a brief introduction to the **productivity tools**
    we use on a day-to-day basis in data science projects. These are RStudio, UNIX/Linux
    shell, Git and GitHub, and **knitr** and R Markdown.
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: 在最后一部分，我们简要介绍了我们在数据科学项目中日常使用的**生产力工具**。这些工具包括RStudio、UNIX/Linux shell、Git和GitHub，以及**knitr**和R
    Markdown。
- en: What is not covered by this book?
  id: totrans-26
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 本书没有涵盖哪些内容？
- en: This book focuses on the data analysis aspects of data science. We therefore
    do not cover aspects related to data management or engineering. Although R programming
    is an essential part of the book, we do not teach more advanced computer science
    topics such as data structures, optimization, and algorithm theory. Similarly,
    we do not cover topics such as web services, interactive graphics, parallel computing,
    and data streaming processing. The statistical concepts are presented mainly as
    tools to solve problems and in-depth theoretical descriptions are not included
    in this book.
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: 本书专注于数据科学的数据分析方面。因此，我们不涉及与数据管理或工程相关的方面。尽管R编程是本书的重要组成部分，但我们不教授更高级的计算机科学主题，例如数据结构、优化和算法理论。同样，我们也不涵盖诸如网络服务、交互式图形、并行计算和数据流处理等主题。统计概念主要作为解决问题的工具来介绍，本书中不包括深入的理论描述。
