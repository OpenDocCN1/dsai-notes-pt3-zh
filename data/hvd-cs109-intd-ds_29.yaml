- en: Chapter 19 Association is not causation
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 第19章 关联不是因果关系
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook/association-is-not-causation.html](https://rafalab.dfci.harvard.edu/dsbook/association-is-not-causation.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook/association-is-not-causation.html](https://rafalab.dfci.harvard.edu/dsbook/association-is-not-causation.html)
- en: '*Association is not causation* is perhaps the most important lesson one learns
    in a statistics class. *Correlation is not causation* is another way to say this.
    Throughout the Statistics part of the book, we have described tools useful for
    quantifying associations between variables. However, we must be careful not to
    over-interpret these associations.'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '*关联不是因果关系*可能是你在统计学课程中学到的最重要的课程。*相关性不是因果关系*是另一种说法。在本书的统计学部分，我们描述了用于量化变量之间关联的有用工具。然而，我们必须小心不要过度解释这些关联。'
- en: There are many reasons that a variable \(X\) can be correlated with a variable
    \(Y\) without having any direct effect on \(Y\). Here we examine four common ways
    that can lead to misinterpreting data.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 有许多原因会导致变量 \(X\) 与变量 \(Y\) 相关，而 \(X\) 对 \(Y\) 没有任何直接影响。我们在此检查四种常见的方式，这些方式可能导致误解数据。
- en: 19.1 Spurious correlation
  id: totrans-4
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 19.1 虚假的相关性
- en: The following comical example underscores that correlation is not causation.
    It shows a very strong correlation between divorce rates and margarine consumption.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 以下这个有趣的例子强调了相关性不是因果关系。它显示了离婚率和黄油消费之间非常强的相关性。
- en: '![](../Images/4fabe5ac3dfd044b5cf20d83f6c6d5e2.png)'
  id: totrans-6
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/4fabe5ac3dfd044b5cf20d83f6c6d5e2.png)'
- en: Does this mean that margarine causes divorces? Or do divorces cause people to
    eat more margarine? Of course the answer to both these questions is no. This is
    just an example of what we call a *spurious correlation*.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 这是否意味着黄油导致离婚？或者离婚导致人们吃更多的黄油？当然，这两个问题的答案都是否定的。这只是一个我们称之为*虚假相关性*的例子。
- en: You can see many more absurd examples on the Spurious Correlations website[^(70)](#fn70).
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 你可以在Spurious Correlations网站上看到更多荒谬的例子[^(70)](#fn70)。
- en: The cases presented in the spurious correlation site are all instances of what
    is generally called *data dredging*, *data fishing*, or *data snooping*. It’s
    basically a form of what in the US they call *cherry picking*. An example of data
    dredging would be if you look through many results produced by a random process
    and pick the one that shows a relationship that supports a theory you want to
    defend.
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 在虚假相关性网站上展示的案例都是通常所说的*数据挖掘*、*数据钓鱼*或*数据侦察*的实例。这基本上是美国所说的*选择性抽样*的一种形式。数据挖掘的一个例子是，如果你查看由随机过程产生的许多结果，并选择显示支持你想要捍卫的理论的关联关系的那一个。
- en: 'A Monte Carlo simulation can be used to show how data dredging can result in
    finding high correlations among uncorrelated variables. We will save the results
    of our simulation into a tibble:'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 可以使用蒙特卡洛模拟来展示数据挖掘如何导致在非相关变量中找到高相关性。我们将把我们的模拟结果保存到一个tibble中：
- en: '[PRE0]'
  id: totrans-11
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: The first column denotes group. We created groups and for each one we generated
    a pair of independent vectors, \(X\) and \(Y\), with 25 observations each, stored
    in the second and third columns. Because we constructed the simulation, we know
    that \(X\) and \(Y\) are not correlated.
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 第一列表示组。我们创建了组，并为每个组生成了一对独立的向量，\(X\) 和 \(Y\)，每个向量包含25个观测值，分别存储在第二列和第三列。因为我们构建了模拟，所以我们知道
    \(X\) 和 \(Y\) 是不相关的。
- en: 'Next, we compute the correlation between `X` and `Y` for each group and look
    at the max:'
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 接下来，我们计算每个组中 \(X\) 和 \(Y\) 之间的相关性，并查看最大值：
- en: '[PRE1]'
  id: totrans-14
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: 'We see a maximum correlation of 0.77 and if you just plot the data from the
    group achieving this correlation, it shows a convincing plot that \(X\) and \(Y\)
    are in fact correlated:'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 我们看到最大相关性为0.77，如果你只绘制实现这一相关性的组的数据，它显示了一个令人信服的图表，表明 \(X\) 和 \(Y\) 实际上是相关的：
- en: '[PRE2]'
  id: totrans-16
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: '![](../Images/0a2070f2c52c75bc75fb9eae29078139.png)'
  id: totrans-17
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/0a2070f2c52c75bc75fb9eae29078139.png)'
- en: 'Remember that the correlation summary is a random variable. Here is the distribution
    generated by the Monte Carlo simulation:'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 记住，相关性总结是一个随机变量。以下是蒙特卡洛模拟生成的分布：
- en: '[PRE3]'
  id: totrans-19
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: '![](../Images/0b7dee8f34294149e0df4e20356b9d33.png)'
  id: totrans-20
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/0b7dee8f34294149e0df4e20356b9d33.png)'
- en: It’s just a mathematical fact that if we observe random correlations that are
    expected to be 0, but have a standard error of 0.204, the largest one will be
    close to 1.
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 这只是一个数学事实：如果我们观察到预期为0的随机相关性，但标准误差为0.204，最大的一个将接近1。
- en: 'If we performed regression on this group and interpreted the p-value, we would
    incorrectly claim this was a statistically significant relation:'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们对这个群体进行回归并解释p值，我们会错误地声称这是一个具有统计学意义的关联：
- en: '[PRE4]'
  id: totrans-23
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: This particular form of data dredging is referred to as *p-hacking*. P-hacking
    is a topic of much discussion because it is a problem in scientific publications.
    Because publishers tend to reward statistically significant results over negative
    results, there is an incentive to report significant results. In epidemiology
    and the social sciences, for example, researchers may look for associations between
    an adverse outcome and several exposures and report only the one exposure that
    resulted in a small p-value. Furthermore, they might try fitting several different
    models to account for confounding and pick the one that yields the smallest p-value.
    In experimental disciplines, an experiment might be repeated more than once, yet
    only the results of the one experiment with a small p-value reported. This does
    not necessarily happen due to unethical behavior, but rather as a result of statistical
    ignorance or wishful thinking. In advanced statistics courses, you can learn methods
    to adjust for these multiple comparisons.
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: 这种特定形式的数据挖掘被称为 *p-hacking*。p-hacking 是一个讨论很多的话题，因为它在科学出版物中是一个问题。因为出版商倾向于奖励统计上显著的结果而不是负面结果，因此存在报告显著结果的激励。例如，在流行病学和社会科学中，研究人员可能会寻找不良结果与几个暴露之间的关联，并仅报告导致小p值的那一个暴露。此外，他们可能会尝试拟合几个不同的模型来解释混杂因素，并选择产生最小p值的那个模型。在实验学科中，一个实验可能会重复多次，但只有具有小p值的那个实验的结果被报告。这并不一定是因为不道德的行为，而是由于统计的无知或愿望思考。在高级统计学课程中，你可以学习调整这些多重比较的方法。
- en: 19.2 Outliers
  id: totrans-25
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 19.2 异常值
- en: 'Suppose we take measurements from two independent outcomes, \(X\) and \(Y\),
    and we standardize the measurements. However, imagine we make a mistake and forget
    to standardize entry 23\. We can simulate such data using:'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们从两个独立的结果，\(X\) 和 \(Y\)，中取测量值，并对这些测量值进行标准化。然而，想象一下我们犯了一个错误，忘记了标准化第23条记录。我们可以使用以下方法来模拟这样的数据：
- en: '[PRE5]'
  id: totrans-27
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: 'The data look like this:'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 数据看起来是这样的：
- en: '[PRE6]'
  id: totrans-29
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: '![](../Images/a18ebbe828029c07d8390b1eac9ce70c.png)'
  id: totrans-30
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/a18ebbe828029c07d8390b1eac9ce70c.png)'
- en: 'Not surprisingly, the correlation is very high:'
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: 毫不奇怪，相关性非常高：
- en: '[PRE7]'
  id: totrans-32
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: 'But this is driven by the one outlier. If we remove this outlier, the correlation
    is greatly reduced to almost 0, which is what it should be:'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 但这是由一个异常值驱动的。如果我们移除这个异常值，相关性将大大降低，几乎接近0，这正是它应该有的：
- en: '[PRE8]'
  id: totrans-34
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: 'There is an alternative to the sample correlation for estimating the population
    correlation that is robust to outliers. It is called *Spearman correlation*. The
    idea is simple: compute the correlation on the ranks of the values. Here is a
    plot of the ranks plotted against each other:'
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: 对于估计对异常值稳健的总体相关系数，有一种替代样本相关系数的方法。它被称为 *斯皮尔曼相关系数*。这个想法很简单：计算值排名之间的相关性。以下是值排名相互对比的图示：
- en: '[PRE9]'
  id: totrans-36
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: '![](../Images/815583871cae4e0d14465270ae6fc9cc.png)'
  id: totrans-37
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/815583871cae4e0d14465270ae6fc9cc.png)'
- en: 'The outlier is no longer associated with a very large value and the correlation
    comes way down:'
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: 异常值不再与一个非常大的值相关联，相关性大幅下降：
- en: '[PRE10]'
  id: totrans-39
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: 'Spearman correlation can also be calculated like this:'
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 斯皮尔曼相关系数也可以这样计算：
- en: '[PRE11]'
  id: totrans-41
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: 'There are also methods for robust fitting of linear models which you can learn
    about in, for instance, this book: Robust Statistics: Edition 2 by Peter J. Huber
    & Elvezio M. Ronchetti.'
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: 还有用于稳健拟合线性模型的方法，你可以在例如这本书中了解这些方法：Peter J. Huber 和 Elvezio M. Ronchetti 著的《稳健统计：第2版》。
- en: 19.3 Reversing cause and effect
  id: totrans-43
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 19.3 原因和效果的颠倒
- en: Another way association is confused with causation is when the cause and effect
    are reversed. An example of this is claiming that tutoring makes students perform
    worse because they test lower than peers that are not tutored. In this case, the
    tutoring is not causing the low test scores, but the other way around.
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 另一种将关联与因果关系混淆的方式是当原因和效果颠倒时。一个例子是声称辅导使学生表现更差，因为他们测试成绩低于未接受辅导的同伴。在这种情况下，辅导并不是导致低测试成绩的原因，而是相反。
- en: 'A form of this claim actually made it into an op-ed in the New York Times titled
    Parental Involvement Is Overrated[^(71)](#fn71). Consider this quote from the
    article:'
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: 实际上，这种说法的一种形式被发表在《纽约时报》的一篇社论中，标题为《家长的参与被高估了》[^(71)](#fn71)。考虑以下文章中的这句话：
- en: When we examined whether regular help with homework had a positive impact on
    children’s academic performance, we were quite startled by what we found. Regardless
    of a family’s social class, racial or ethnic background, or a child’s grade level,
    consistent homework help almost never improved test scores or grades… Even more
    surprising to us was that when parents regularly helped with homework, kids usually
    performed worse.
  id: totrans-46
  prefs:
  - PREF_BQ
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 当我们检查定期帮助做作业是否对儿童的学业表现有积极影响时，我们发现的结果让我们非常震惊。无论家庭的社会阶级、种族或民族背景，或孩子的年级水平如何，一致的作业帮助几乎从未提高过测试分数或成绩……更令人惊讶的是，当父母定期帮助做作业时，孩子们通常表现得更差。
- en: A very likely possibility is that the children needing regular parental help,
    receive this help because they don’t perform well in school.
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: 一个非常可能的情况是，需要经常得到父母帮助的孩子，之所以得到这种帮助是因为他们在学校表现不佳。
- en: 'We can easily construct an example of cause and effect reversal using the father
    and son height data. If we fit the model:'
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以很容易地使用父亲和儿子的身高数据构建一个因果倒置的例子。如果我们拟合以下模型：
- en: \[X_i = \beta_0 + \beta_1 y_i + \varepsilon_i, i=1, \dots, N\]
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: \[X_i = \beta_0 + \beta_1 y_i + \varepsilon_i, i=1, \dots, N\]
- en: 'to the father and son height data, with \(X_i\) the father height and \(y_i\)
    the son height, we do get a statistically significant result. We use the `galton_heights`
    dataset defined in Section [17.1](regression.html#galton):'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: 对于父亲和儿子的身高数据，其中 \(X_i\) 是父亲身高，\(y_i\) 是儿子身高，我们确实得到了一个具有统计学意义的显著结果。我们使用了第 [17.1](regression.html#galton)
    节中定义的 `galton_heights` 数据集：
- en: '[PRE12]'
  id: totrans-51
  prefs: []
  type: TYPE_PRE
  zh: '[PRE12]'
- en: The model fits the data very well. If we look at the mathematical formulation
    of the model above, it could easily be incorrectly interpreted so as to suggest
    that the son being tall caused the father to be tall. But given what we know about
    genetics and biology, we know it’s the other way around. The model is technically
    correct. The estimates and p-values were obtained correctly as well. What is wrong
    here is the interpretation.
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: 该模型很好地拟合了数据。如果我们观察上述模型的数学公式，它很容易被错误地解释，以至于暗示儿子的高个子导致了父亲的高个子。但鉴于我们对遗传和生物学的了解，我们知道情况正好相反。该模型在技术上正确。估计值和p值也正确获得。这里的问题在于解释。
- en: 19.4 Confounders
  id: totrans-53
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 19.4 混杂因素
- en: Confounders are perhaps the most common reason that leads to associations begin
    misinterpreted.
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
  zh: 混杂因素可能是导致关联被错误解释的最常见原因。
- en: If \(X\) and \(Y\) are correlated, we call \(Z\) a *confounder* if changes in
    \(Z\) causes changes in both \(X\) and \(Y\). Earlier, when studying baseball
    data, we saw how Home Runs was a confounder that resulted in a higher correlation
    than expected when studying the relationship between Bases on Balls and Runs.
    In some cases, we can use linear models to account for confounders. However, this
    is not always the case.
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: 如果 \(X\) 和 \(Y\) 相关，我们称 \(Z\) 为 *混杂因素*，如果 \(Z\) 的变化导致 \(X\) 和 \(Y\) 都发生变化。在之前研究棒球数据时，我们看到了本垒打是如何成为一个混杂因素，导致在研究保送和得分之间的关系时，相关性比预期更高。在某些情况下，我们可以使用线性模型来解释混杂因素。然而，这并不总是适用。
- en: Incorrect interpretation due to confounders is ubiquitous in the lay press and
    they are often hard to detect. Here, we present a widely used example related
    to college admissions.
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: 由于混杂因素导致的错误解释在大众媒体中普遍存在，并且它们往往难以检测。在这里，我们提供了一个与大学招生相关广泛使用的例子。
- en: '19.4.1 Example: UC Berkeley admissions'
  id: totrans-57
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 19.4.1 示例：加州大学伯克利分校的招生
- en: 'Admission data from six U.C. Berkeley majors, from 1973, showed that more men
    were being admitted than women: 44% men were admitted compared to 30% women. PJ
    Bickel, EA Hammel, and JW O’Connell. Science (1975). We can load the data and
    a statistical test, which clearly rejects the hypothesis that gender and admission
    are independent:'
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 来自1973年六个加州大学伯克利分校专业的招生数据表明，被录取的男性比女性多：男性录取率为44%，女性为30%。PJ Bickel，EA Hammel，和
    JW O’Connell。科学（1975）。我们可以加载这些数据和统计检验，这明显拒绝了性别和录取独立性的假设：
- en: '[PRE13]'
  id: totrans-59
  prefs: []
  type: TYPE_PRE
  zh: '[PRE13]'
- en: 'But closer inspection shows a paradoxical result. Here are the percent admissions
    by major:'
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: 但更仔细的检查显示了一个矛盾的结果。以下是按专业划分的录取百分比：
- en: '[PRE14]'
  id: totrans-61
  prefs: []
  type: TYPE_PRE
  zh: '[PRE14]'
- en: Four out of the six majors favor women. More importantly, all the differences
    are much smaller than the 14.2 difference that we see when examining the totals.
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: 六个专业中有四个倾向于女性。更重要的是，所有差异都远小于我们在检查总数时看到的14.2的差异。
- en: The paradox is that analyzing the totals suggests a dependence between admission
    and gender, but when the data is grouped by major, this dependence seems to disappear.
    What’s going on? This actually can happen if an uncounted confounder is driving
    most of the variability.
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: 悖论在于，分析总数似乎表明录取和性别之间存在依赖关系，但当数据按专业分组时，这种依赖关系似乎消失了。发生了什么事？实际上，如果未计数的混杂因素驱动了大部分变异性，这种情况就会发生。
- en: 'So let’s define three variables: \(X\) is 1 for men and 0 for women, \(Y\)
    is 1 for those admitted and 0 otherwise, and \(Z\) quantifies the selectivity
    of the major. A gender bias claim would be based on the fact that \(\mbox{Pr}(Y=1
    | X = x)\) is higher for \(x=1\) than \(x=0\). However, \(Z\) is an important
    confounder to consider. Clearly \(Z\) is associated with \(Y\), as the more selective
    a major, the lower \(\mbox{Pr}(Y=1 | Z = z)\). But is major selectivity \(Z\)
    associated with gender \(X\)?'
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，让我们定义三个变量：\(X\) 对于男性为 1，对于女性为 0，\(Y\) 对于被录取者为 1，否则为 0，\(Z\) 量化专业的选择性。性别偏见的主张将基于
    \(\mbox{Pr}(Y=1 | X = x)\) 对于 \(x=1\) 比对于 \(x=0\) 更高的事实。然而，\(Z\) 是一个重要的混杂因素需要考虑。显然，\(Z\)
    与 \(Y\) 相关，因为越具选择性的专业，\(\mbox{Pr}(Y=1 | Z = z)\) 越低。但是，专业选择性 \(Z\) 与性别 \(X\) 是否相关？
- en: 'One way to see this is to plot the total percent admitted to a major versus
    the percent of women that made up the applicants:'
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
  zh: 一种方法是绘制一个专业录取总百分比与申请者中女性百分比的关系图：
- en: '[PRE15]'
  id: totrans-66
  prefs: []
  type: TYPE_PRE
  zh: '[PRE15]'
- en: '![](../Images/20eab9514e2e68909adb1dca84e73bb4.png)'
  id: totrans-67
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/20eab9514e2e68909adb1dca84e73bb4.png)'
- en: 'There seems to be association. The plot suggests that women were much more
    likely to apply to the two “hard” majors: gender and major’s selectivity are confounded.
    Compare, for example, major B and major E. Major E is much harder to enter than
    major B and over 60% of applicants to major E were women, while less than 30%
    of the applicants of major B were women.'
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
  zh: 看起来存在关联。图表表明，女性更有可能申请两个“硬”专业：性别和专业选择性是混杂因素。例如，比较专业 B 和专业 E。专业 E 比专业 B 更难进入，而且超过
    60% 的专业 E 申请者是女性，而专业 B 的申请者中女性不到 30%。
- en: 19.4.2 Confounding explained graphically
  id: totrans-69
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 19.4.2 图形解释混杂因素
- en: 'The following plot shows the number of applicants that were admitted and those
    that were not by major:'
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
  zh: 下面的图表显示了按专业录取和未录取的申请人数：
- en: '![](../Images/433eafdae9d59928c9bf2f0627eff747.png)'
  id: totrans-71
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/433eafdae9d59928c9bf2f0627eff747.png)'
- en: 'It also breaks down the acceptances by major. This breakdown allows us to see
    that the majority of accepted men came from two majors: A and B. It also lets
    us see that few women applied to these majors.'
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: 它还按专业分解了录取情况。这种分解使我们能够看到，大多数被录取的男性来自两个专业：A 和 B。它还让我们看到，很少有女性申请这些专业。
- en: 19.4.3 Average after stratifying
  id: totrans-73
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 19.4.3 分层后的平均数
- en: 'In this plot, we can see that if we condition or stratify by major, and then
    look at differences, we control for the confounder and this effect goes away:'
  id: totrans-74
  prefs: []
  type: TYPE_NORMAL
  zh: 在这个图表中，我们可以看到，如果我们按专业进行条件化或分层，然后观察差异，我们就控制了混杂因素，这种效应就会消失：
- en: '[PRE16]'
  id: totrans-75
  prefs: []
  type: TYPE_PRE
  zh: '[PRE16]'
- en: '![](../Images/d34fc98ced8686edcb3fe36303599d80.png)'
  id: totrans-76
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/d34fc98ced8686edcb3fe36303599d80.png)'
- en: 'Now we see that major by major, there is not much difference. The size of the
    dot represents the number of applicants, and explains the paradox: we see large
    red dots and small blue dots for the easiest majors, A and B.'
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们看到，按专业来看，差异并不大。点的尺寸代表申请人数，解释了悖论：对于最容易的专业 A 和 B，我们看到大红色点和小蓝色点。
- en: If we average the difference by major, we find that the percent is actually
    3.5% higher for women.
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们按专业平均差异，我们会发现女性的百分比实际上比男性高 3.5%。
- en: '[PRE17]'
  id: totrans-79
  prefs: []
  type: TYPE_PRE
  zh: '[PRE17]'
- en: 19.5 Simpson’s paradox
  id: totrans-80
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 19.5 辛普森悖论
- en: 'The case we have just covered is an example of Simpson’s paradox. It is called
    a paradox because we see the sign of the correlation flip when comparing the entire
    publication and specific strata. As an illustrative example, suppose you have
    three random variables \(X\), \(Y\), and \(Z\) and that we observe realizations
    of these. Here is a plot of simulated observations for \(X\) and \(Y\) along with
    the sample correlation:'
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
  zh: 我们刚刚讨论的案例是辛普森悖论的例子。它被称为悖论，因为我们比较整个出版物和特定层时，会看到相关性的符号翻转。作为一个说明性的例子，假设你有三个随机变量
    \(X\)、\(Y\) 和 \(Z\)，并且我们观察了这些变量的实现。以下是 \(X\) 和 \(Y\) 的模拟观察结果以及样本相关性的图表：
- en: '![](../Images/7ac6d2abf6bfd8b3377e9bf1771b07a2.png)'
  id: totrans-82
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/7ac6d2abf6bfd8b3377e9bf1771b07a2.png)'
- en: 'You can see that \(X\) and \(Y\) are negatively correlated. However, once we
    stratify by \(Z\) (shown in different colors below) another pattern emerges:'
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
  zh: 你可以看到 \(X\) 和 \(Y\) 是负相关的。然而，一旦我们按 \(Z\) 分层（如下面的不同颜色所示），另一种模式就会出现：
- en: '![](../Images/595bb7ae4e02ae056a60063e1dda8e01.png)'
  id: totrans-84
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/595bb7ae4e02ae056a60063e1dda8e01.png)'
- en: It is really \(Z\) that is negatively correlated with \(X\). If we stratify
    by \(Z\), the \(X\) and \(Y\) are actually positively correlated as seen in the
    plot above.
  id: totrans-85
  prefs: []
  type: TYPE_NORMAL
  zh: 实际上，是\(Z\)与\(X\)呈负相关。如果我们按\(Z\)分层，\(X\)和\(Y\)实际上如上图所示呈正相关。
- en: 19.6 Exercises
  id: totrans-86
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 19.6 练习
- en: 'For the next set of exercises, we examine the data from a 2014 PNAS paper[^(72)](#fn72)
    that analyzed success rates from funding agencies in the Netherlands and concluded:'
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: 对于下一组练习，我们检查了2014年PNAS论文[^(72)](#fn72)中的数据，该论文分析了荷兰资助机构的成功率，并得出以下结论：
- en: Our results reveal gender bias favoring male applicants over female applicants
    in the prioritization of their “quality of researcher” (but not “quality of proposal”)
    evaluations and success rates, as well as in the language used in instructional
    and evaluation materials.
  id: totrans-88
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 我们的结果揭示了性别偏见，这种偏见在评估“研究人员的质量”（但不是“提案的质量”）和成功率方面，以及在教学和评估材料中使用的语言上，都倾向于男性申请人而不是女性申请人。
- en: 'A response[^(73)](#fn73) was published a few months later titled *No evidence
    that gender contributes to personal research funding success in The Netherlands:
    A reaction to Van der Lee and Ellemers* which concluded:'
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
  zh: 几个月后，发表了一篇回应[^(73)](#fn73)，标题为《没有证据表明性别对荷兰个人研究资金成功有贡献：对范德利和埃勒梅斯的回应》，该回应得出以下结论：
- en: However, the overall gender effect borders on statistical significance, despite
    the large sample. Moreover, their conclusion could be a prime example of Simpson’s
    paradox; if a higher percentage of women apply for grants in more competitive
    scientific disciplines (i.e., with low application success rates for both men
    and women), then an analysis across all disciplines could incorrectly show “evidence”
    of gender inequality.
  id: totrans-90
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 然而，尽管样本量很大，整体性别效应几乎达到统计显著性。此外，他们的结论可能是辛普森悖论的一个典型例子；如果女性在更具竞争力的科学学科中申请资助的比例更高（即男性和女性的申请成功率都很低），那么对所有学科的分析可能会错误地显示“证据”表明性别不平等。
- en: Who is right here? The original paper or the response? Here, you will examine
    the data and come to your own conclusion.
  id: totrans-91
  prefs: []
  type: TYPE_NORMAL
  zh: 谁是对的？原始论文还是回应？在这里，你将检查数据并得出自己的结论。
- en: '1\. The main evidence for the conclusion of the original paper comes down to
    a comparison of the percentages. Table S1 in the paper includes the information
    we need:'
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: 1. 原始论文结论的主要证据归结为百分比的比较。论文中的表S1包含了我们需要的信息：
- en: '[PRE18]'
  id: totrans-93
  prefs: []
  type: TYPE_PRE
  zh: '[PRE18]'
- en: Construct the two-by-two table used for the conclusion about differences in
    awards by gender.
  id: totrans-94
  prefs: []
  type: TYPE_NORMAL
  zh: 构建用于关于性别奖项差异结论的二维二维表。
- en: 2\. Compute the difference in percentage from the two-by-two table.
  id: totrans-95
  prefs: []
  type: TYPE_NORMAL
  zh: 2. 计算二维二维表中的百分比差异。
- en: 3\. In the previous exercise, we noticed that the success rate is lower for
    women. But is it significant? Compute a p-value using a Chi-square test.
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: 3. 在上一个练习中，我们注意到女性的成功率较低。但这是否具有统计学意义？使用卡方检验计算p值。
- en: '4\. We see that the p-value is about 0.05\. So there appears to be some evidence
    of an association. But can we infer causation here? Is gender bias causing this
    observed difference? The response to the original paper claims that what we see
    here is similar to the UC Berkeley admissions example. Specifically they state
    that this “could be a prime example of Simpson’s paradox; if a higher percentage
    of women apply for grants in more competitive scientific disciplines, then an
    analysis across all disciplines could incorrectly show ‘evidence’ of gender inequality.”
    To settle this dispute, create a dataset with number of applications, awards,
    and success rate for each gender. Re-order the disciplines by their overall success
    rate. Hint: use the `reorder` function to re-order the disciplines in a first
    step, then use `pivot_longer`, `separate`, and `pivot_wider` to create the desired
    table.'
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
  zh: 4. 我们看到p值大约是0.05。因此，似乎有一些证据表明存在某种关联。但在这里我们能推断因果关系吗？性别偏见是否导致了这种观察到的差异？对原始论文的回应声称，我们在这里看到的情况与加州大学伯克利分校的招生例子相似。具体来说，他们指出这“可能是辛普森悖论的一个典型例子；如果女性在更具竞争力的科学学科中申请资助的比例更高，那么对所有学科的分析可能会错误地显示性别不平等的‘证据’。”为了解决这一争议，创建一个包含每个性别申请数量、奖项和成功率的数据集。按整体成功率重新排序学科。提示：首先使用`reorder`函数重新排序学科，然后使用`pivot_longer`、`separate`和`pivot_wider`创建所需的表格。
- en: 5\. To check if this is a case of Simpson’s paradox, plot the success rates
    versus disciplines, which have been ordered by overall success, with colors to
    denote the genders and size to denote the number of applications.
  id: totrans-98
  prefs: []
  type: TYPE_NORMAL
  zh: 5. 要检查这是否是辛普森悖论的一个案例，绘制成功率与学科的对比图，这些学科已按整体成功率排序，用颜色表示性别，用大小表示申请数量。
- en: 6\. We definitely do not see the same level of confounding as in the UC Berkeley
    example. It is hard to say there is a confounder here. However, we do see that,
    based on the observed rates, some fields favor men and others favor women and
    we do see that the two fields with the largest difference favoring men are also
    the fields with the most applications. But, unlike the UC Berkeley example, women
    are not more likely to apply for the harder subjects. So perhaps some of the selection
    committees are biased and others are not.
  id: totrans-99
  prefs: []
  type: TYPE_NORMAL
  zh: 6. 我们确实没有看到像加州大学伯克利分校例子中那样的混杂程度。很难说这里存在混杂因素。然而，我们确实看到，根据观察到的比率，一些领域倾向于男性，而其他领域倾向于女性，我们也看到，两个差异最大的领域——即男性申请最多的领域——也是申请最多的领域。但与加州大学伯克利分校的例子不同，女性不太可能申请难度较大的科目。因此，也许一些选拔委员会存在偏见，而另一些则没有。
- en: 'But, before we conclude this, we must check if these differences are any different
    than what we get by chance. Are any of the differences seen above statistically
    significant? Keep in mind that even when there is no bias, we will see differences
    due to random variability in the review process as well as random variability
    across candidates. Perform a Chi-square test for each discipline. Hint: define
    a function that receives the total of a two-by-two table and returns a data frame
    with the p-value. Use the 0.5 correction. Then use the `summarize` function.'
  id: totrans-100
  prefs: []
  type: TYPE_NORMAL
  zh: 但在得出结论之前，我们必须检查这些差异是否与偶然得到的结果有任何不同。上述差异中，是否有任何差异在统计学上具有显著性？请记住，即使没有偏差，我们也会在评审过程中的随机变异性以及候选人之间的随机变异性中看到差异。为每个学科进行卡方检验。提示：定义一个函数，该函数接收一个2x2表的总量，并返回一个包含p值的data
    frame。使用0.5校正。然后使用`summarize`函数。
- en: '7\. For the medical sciences, there appears to be a statistically significant
    difference. But is this a spurious correlation? We performed 9 tests. Reporting
    only the one case with a p-value less than 0.05 might be considered an example
    of cherry picking. Repeat the exercise above, but instead of a p-value, compute
    a log odds ratio divided by their standard error. Then use qq-plot to see how
    much these log odds ratios deviate from the normal distribution we would expect:
    a standard normal distribution.'
  id: totrans-101
  prefs: []
  type: TYPE_NORMAL
  zh: 7. 对于医学科学，似乎存在统计学上的显著差异。但这是一种虚假的相关性吗？我们进行了9次测试。仅报告p值小于0.05的一个案例可能被认为是 cherry
    picking 的例子。重复上述练习，但不是计算p值，而是计算对数优势比除以其标准误差。然后使用qq-plot来查看这些对数优势比与预期标准正态分布的偏离程度：一个标准正态分布。
- en: '* * *'
  id: totrans-102
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
