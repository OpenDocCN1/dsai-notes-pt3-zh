  type: TYPE_NORMAL
  zh: '[推荐阅读](../highdim/reading-highdim.html)'
- en: '**Hefferon, J. (2017). *Linear Algebra*.**'
  id: totrans-4
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Hefferon, J. (2017). *线性代数*.**'
- en: A free and accessible open-source textbook designed for beginners, with clear
    explanations, worked examples, and plenty of exercises. Ideal for self-learners
    or students seeking to build both intuition and practical skills.
  id: totrans-5
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 一本为初学者设计的免费且易于获取的开源教科书，包含清晰的解释、示例和大量练习。非常适合自学者和寻求建立直觉和实际技能的学生。
- en: '[Available online](http://joshua.smcvt.edu/linearalgebra/)'
  id: totrans-6
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: '[在线可用](http://joshua.smcvt.edu/linearalgebra/)'
- en: '**Strang, G. (2019). *Linear Algebra and Learning from Data*.**'
  id: totrans-7
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Strang, G. (2019). *线性代数与数据学习*.**'
- en: Focuses on the role of linear algebra in modern machine learning and data science.
    A practical companion to statistical and algorithmic methods.
  id: totrans-8
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 专注于线性代数在现代机器学习和数据科学中的作用。是统计和算法方法的实用伴侣。
- en: '**Seber, G. A. F. (2003). *Linear Regression Analysis* (2nd ed.).**'
  id: totrans-9
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Seber, G. A. F. (2003). *线性回归分析* (第2版).**'
- en: A concise and mathematically rigorous exploration of regression, grounded in
    matrix algebra. Offers expanded coverage of diagnostics, model fitting, selection,
    and prediction.
  id: totrans-10
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 对回归的简洁且数学上严谨的探索，基于矩阵代数。提供了对诊断、模型拟合、选择和预测的扩展覆盖。
- en: '**James, G., Witten, D., Hastie, T., & Tibshirani, R. (2021). *An Introduction
    to Statistical Learning* (2nd ed.).**'
  id: totrans-11
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**James, G., Witten, D., Hastie, T., & Tibshirani, R. (2021). *统计学习导论* (第2版).**'
- en: A highly accessible introduction to statistical learning, including clear explanations
    and examples of regularization techniques such as ridge regression and the lasso.
    Available [online for free](https://www.statlearning.com/).
  id: totrans-12
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 一本高度易读的统计学习入门书籍，包括对正则化技术（如岭回归和Lasso）的清晰解释和示例。可在[网上免费获取](https://www.statlearning.com/)。
- en: '**Hastie, T., Tibshirani, R., & Friedman, J. (2009). *The Elements of Statistical
    Learning: Data Mining, Inference, and Prediction* (2nd ed.).**'
  id: totrans-13
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Hastie, T., Tibshirani, R., & Friedman, J. (2009). *统计学习的要素：数据挖掘、推理与预测* (第2版).**'
- en: The authoritative reference on regularization and other machine learning techniques.
    More theoretical and in-depth, suited for readers looking for a deeper mathematical
    understanding.
  id: totrans-14
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 正则化和其他机器学习技术的权威参考书。更理论化和深入，适合寻求更深入数学理解的读者。
- en: '**Koren, Y., Bell, R., & Volinsky, C. (2009). *The BellKor Solution to the
    Netflix Prize*.** A technical yet accessible explanation of the ensemble of models
    that won the Netflix Prize, detailing matrix factorization, neighborhood models,
    and hybrid ensemble techniques.'
  id: totrans-15
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Koren, Y., Bell, R., & Volinsky, C. (2009). *Netflix Prize的BellKor解决方案*.**
    对赢得Netflix Prize的模型集进行了技术性但易于理解的解释，详细介绍了矩阵分解、邻域模型和混合集成技术。'
- en: '[Available online](https://www.netflixprize.com/assets/GrandPrize2009_BPC_BellKor.pdf)'
  id: totrans-16
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: '[在线可用](https://www.netflixprize.com/assets/GrandPrize2009_BPC_BellKor.pdf)'
