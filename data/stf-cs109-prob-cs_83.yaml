- en: Night Sight
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 夜视功能
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/examples/night_sight/](https://chrispiech.github.io/probabilityForComputerScientists/en/examples/night_sight/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/examples/night_sight/](https://chrispiech.github.io/probabilityForComputerScientists/en/examples/night_sight/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: In this problem we explore how to use probability theory to take photos in the
    dark. Digital cameras have a sensor that capture photons over the duration of
    a photo shot to produce pictures. However, these sensors are subject to “shot
    noise” which are random fluctuations in the amount of photons that hit the lens.
    In the scope of this problem, we only consider a single pixel. The arrival of
    shot noise photons on a surface is independent with constant rate.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 在这个问题中，我们探讨如何使用概率论在黑暗中拍照。数码相机有一个传感器，在照片拍摄的持续时间中捕获光子以生成图片。然而，这些传感器容易受到“噪声”的影响，即撞击镜头的光子数量的随机波动。在问题的范围内，我们只考虑单个像素。噪声光子到达表面的到达率是恒定的。
- en: '![](../Images/464549ccdffff654b25343b4794ae65a.png)'
  id: totrans-4
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/464549ccdffff654b25343b4794ae65a.png)'
- en: '*Left: photo captured using a standard photo. Right: the same photo using a
    shot burst [[1](https://ai.googleblog.com/2018/11/night-sight-seeing-in-dark-on-pixel.html)].*'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: '*左：使用标准照片捕获的照片。右：使用快门连拍的同张照片 [[1](https://ai.googleblog.com/2018/11/night-sight-seeing-in-dark-on-pixel.html)].*'
- en: For shot noise, standard deviation is what matters! Why? Because if the camera
    can compute the expected amount of noise, it can simply subtract it out. But the
    fluctuations around the mean (measured as standard deviation) lead to changes
    in measurement that the camera can't simply subtract out.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 对于噪声，标准差是关键！为什么？因为如果相机可以计算预期的噪声量，它可以直接减去它。但是围绕平均值的波动（以标准差衡量）会导致相机无法简单减去的测量变化。
- en: 'Part 1: A Standard Photo'
  id: totrans-7
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 第一部分：标准照片
- en: First lets calculate the amount of noise if we take a photo the standard way.
    If the time duration of a photo shot is 1000 𝜇s, what is the standard deviation
    of the amount of photons captured by the pixel during a single photo? Note that
    shot noise photons land on a particular pixel at a rate of 10 photons per microsecond
    (𝜇s).
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 首先，让我们计算以标准方式拍照时的噪声量。如果照片拍摄的持续时间是1000 𝜇s，那么像素在单次拍照中捕获的光子数量的标准差是多少？请注意，噪声光子以每微秒10光子的速率（𝜇s）落在特定的像素上。
- en: '**Noise in a standard photo:** As you may have guessed, because photos hit
    the camera at a constant rate, and independent of one another, the number of shot
    noise photos hitting any pixel is modelled as a Poisson! For the given rate of
    noise, let $X$ be the amount of shot noise photos that hit the pixel: $$X \sim
    \Poi(\lambda = 10,000).$$ Note that 10,000 is the average number of photons that
    hit in 1000𝜇s (duration in microseconds multiplied by photons per microsecond).
    The standard of a Poisson is simply equal to the square root of its parameter,
    $\sqrt{\lambda}$. Thus the standard deviation of the shot noise photons captured
    is 100 (quite high).'
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: '**标准照片中的噪声：**正如你可能猜到的，因为照片以恒定的速率撞击相机，并且彼此独立，所以撞击任何像素的噪声照片数量被建模为泊松分布！对于给定的噪声率，设$X$为撞击像素的噪声照片数量：$$X
    \sim \Poi(\lambda = 10,000).$$ 注意，10,000是1000𝜇s内撞击的平均光子数（持续时间以微秒为单位乘以每微秒的光子数）。泊松的标准差简单地等于其参数的平方根，$\sqrt{\lambda}$。因此，捕获的噪声光子的标准差为100（相当高）。'
- en: 'Part 2: A Shutter Shot'
  id: totrans-10
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 第二部分：快门拍摄
- en: To mitigate shot noise, Stanford graduates realized that you can take a shutter
    shot (many camera shots in quick succession) and sum the number of photons captured.
    Because of limitations in cell phone cameras, the largest number of photos a camera
    can take in 1000$\mu$s is 15 photos, each with a duration of 66$\mu$s. What is
    the standard deviation of shot noise if we average the photons across a shutter
    shot of 15 photos?
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 为了减轻噪声，斯坦福大学的毕业生意识到你可以进行快门拍摄（连续快速拍摄多张照片）并累加捕获的光子数量。由于手机相机的限制，相机在1000μs内最多可以拍摄15张照片，每张照片的持续时间为66μs。如果我们对15张照片的快门拍摄进行平均，光子数量的标准差是多少？
- en: '**Noise with a shutter shot:**'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: '**快门拍摄中的噪声：**'
- en: 'Let $Y$ be the average quantity of shot noise photons across the 15 photos,
    captured by the single pixel. We want to calculate the $\text{Var}(Y)$. Specifically,
    $Y = \frac{1}{15}\sum_{i=1}^{15} X_i$ where $X_i$ is the amount of shot noise
    photons in the ith photo. Similar to the previous part: $$X_i \sim \Poi(\lambda
    = 66 \cdot 10)$$ and since $X_i$ is a Poisson, $\E[X_i] = 660$ and $\Var(X_i)
    = 660$.'
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $Y$ 为单个像素捕获的15张照片中光子散粒噪声的平均数量。我们想要计算 $\text{Var}(Y)$。具体来说，$Y = \frac{1}{15}\sum_{i=1}^{15}
    X_i$，其中 $X_i$ 是第i张照片中的散粒噪声光子数量。类似于前一部分：$$X_i \sim \Poi(\lambda = 66 \cdot 10)$$
    由于 $X_i$ 是泊松分布，$\E[X_i] = 660$ 和 $\Var(X_i) = 660$。
- en: Since $Y$ is the average of IID random variables, the Central Limit Theorem
    will kick in. Moreover, by the CLT rule $Y$ will have variance equal to ${1}/{n}\cdot
    \Var(X_i)$. \begin{align*} \Var(Y) &= {1}/{n}\cdot \Var(X_i) \\ &= 1/15 \cdot
    660 = 44 \end{align*} The standard deviation will then be the square root of this
    variance $\Std(Y) = \sqrt{44}$ which is approximately 6.6\. That is a huge reduction
    in shot noise!
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 由于 $Y$ 是独立同分布随机变量的平均值，中心极限定理将会发挥作用。此外，根据中心极限定理的规则，$Y$ 的方差将等于 ${1}/{n}\cdot \Var(X_i)$。
    \begin{align*} \Var(Y) &= {1}/{n}\cdot \Var(X_i) \\ &= 1/15 \cdot 660 = 44 \end{align*}
    因此，标准差将是这个方差的平方根 $\Std(Y) = \sqrt{44}$，这大约是 6.6。这是一个巨大的散粒噪声减少！
- en: '* * *'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: '*Problem by Will Song and Chris Piech. Night Sight by Google.*'
  id: totrans-16
