- en: Chapter 20 Introduction to data wrangling
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 第20章 数据整理简介
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook/introduction-to-data-wrangling.html](https://rafalab.dfci.harvard.edu/dsbook/introduction-to-data-wrangling.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook/introduction-to-data-wrangling.html](https://rafalab.dfci.harvard.edu/dsbook/introduction-to-data-wrangling.html)
- en: The datasets used in this book have been made available to you as R objects,
    specifically as data frames. The US murders data, the reported heights data, and
    the Gapminder data were all data frames. These datasets come included in the **dslabs**
    package and we loaded them using the `data` function. Furthermore, we have made
    the data available in what is referred to as `tidy` form. The tidyverse packages
    and functions assume that the data is `tidy` and this assumption is a big part
    of the reason these packages work so well together.
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 本书使用的数据集已经以R对象的形式提供给你，具体来说是数据框。美国谋杀数据、报告身高数据和Gapminder数据都是数据框。这些数据集包含在**dslabs**包中，我们使用`data`函数加载了它们。此外，我们还以所谓的`整洁`形式提供了数据。tidyverse包和函数假设数据是`整洁`的，这个假设是这些包能够如此良好协作的重要原因之一。
- en: However, very rarely in a data science project is data easily available as part
    of a package. We did quite a bit of work “behind the scenes” to get the original
    raw data into the *tidy* tables you worked with. Much more typical is for the
    data to be in a file, a database, or extracted from a document, including web
    pages, tweets, or PDFs. In these cases, the first step is to import the data into
    R and, when using the **tidyverse**, tidy the data. This initial step in the data
    analysis process usually involves several, often complicated, steps to convert
    data from its raw form to the *tidy* form that greatly facilitates the rest of
    the analysis. We refer to this process as `data wrangling`.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，在数据科学项目中，数据作为包的一部分轻松可用的情况非常罕见。我们做了大量“幕后”工作，将原始的原始数据整理成你使用的*整洁*表格。更典型的情况是，数据存储在文件、数据库中，或者是从文档中提取出来的，包括网页、推文或PDF文件。在这些情况下，第一步是将数据导入R，当使用**tidyverse**时，整理数据。数据分析过程中的这一初始步骤通常涉及多个步骤，通常是复杂的步骤，以将数据从其原始形式转换为*整洁*形式，这极大地简化了后续的分析。我们将这个过程称为`数据整理`。
- en: Here we cover several common steps of the data wrangling process including tidying
    data, string processing, html parsing, working with dates and times, and text
    mining. Rarely are all these wrangling steps necessary in a single analysis, but
    data scientists will likely face them all at some point. Some of the examples
    we use to demonstrate data wrangling techniques are based on the work we did to
    convert raw data into the tidy datasets provided by the **dslabs** package and
    used in the book as examples.
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 在这里，我们涵盖了数据整理过程中的几个常见步骤，包括整理数据、字符串处理、HTML解析、处理日期和时间以及文本挖掘。在单一分析中，通常不需要所有这些整理步骤，但数据科学家可能会在某个时刻遇到它们。我们用来展示数据整理技术的某些示例是基于我们将原始数据转换为**dslabs**包提供的整洁数据集的工作，这些数据集在书中作为示例使用。
