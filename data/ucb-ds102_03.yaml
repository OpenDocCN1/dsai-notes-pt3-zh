- en: 'Many real-world data science problems boil down to making binary decisions.
    For example:'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 许多现实世界的数据科学问题最终归结为做出二元决策。例如：
- en: Given the outcome of medical tests for some disease on a population of patients,
    which patients have that disease?
  id: totrans-4
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 基于对某疾病在患者群体中的医学测试结果，哪些患者患有该疾病？
- en: Given the results of experimenting with a new version of my website, does that
    version increase the chances that a customer will stay on my website longer and/or
    buy something?
  id: totrans-5
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在测试我网站新版本的结果中，这个版本是否会增加客户在我网站上停留更长时间和/或购买东西的机会？
- en: Are there “statistically significant” associations between certain pairs of
    variables in my dataset?
  id: totrans-6
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在我的数据集中，某些变量对之间是否存在“统计上显著的”关联？
- en: 'In particular, in most real-world settings, we don’t just want to analyze a
    single decision: we want to evaluate what happens when making multiple decisions.
    Toward that end, we’ll focus on frameworks we can use that help us understand
    the consequences of making multiple (usually related) decisions.'
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 尤其是在大多数现实世界的场景中，我们不仅仅想要分析一个单一的决策：我们想要评估在做出多个决策时会发生什么。为此，我们将关注我们可以使用的框架，这些框架帮助我们理解做出多个（通常是相关）决策的后果。
- en: '[PRE0]'
  id: totrans-8
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: 'In this chapter, we’ll focus on the case of making binary (0/1) decisions.
    For each decision we make, we’ll assume there’s some *Reality* or truth that’s
    either 0 or 1\. We gather data, and make a binary *Decision* based on the data:
    the decision is our best guess for reality. We’ll abbreviate Reality and Decision
    with <semantics><mrow><mi>R</mi></mrow><annotation encoding="application/x-tex">R</annotation></semantics>R
    and <semantics><mrow><mi>D</mi></mrow><annotation encoding="application/x-tex">D</annotation></semantics>D
    respectively. Since both are binary, we can visualize all possible outcomes using
    a 2 x 2 table:'
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 在本章中，我们将关注做出二元（0/1）决策的情况。对于我们所做的每一个决策，我们假设存在某种*现实*或真相，它要么是0要么是1。我们收集数据，并根据数据做出二元*决策*：决策是我们对现实的最佳猜测。我们将现实和决策分别缩写为<semantics><mrow><mi>R</mi></mrow><annotation
    encoding="application/x-tex">R</annotation></semantics>R和<semantics><mrow><mi>D</mi></mrow><annotation
    encoding="application/x-tex">D</annotation></semantics>D。由于两者都是二元的，我们可以使用2 x 2表格来可视化所有可能的结果：
- en: '|  | <semantics><mrow><mi>D</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">D=0</annotation></semantics>D=0
    | <semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">D=1</annotation></semantics>D=1
    |'
  id: totrans-10
  prefs: []
  type: TYPE_TB
  zh: '|  | <semantics><mrow><mi>D</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">D=0</annotation></semantics>D=0
    | <semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">D=1</annotation></semantics>D=1
    |'
- en: '| <semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">R=0</annotation></semantics>R=0
    |  |  |'
  id: totrans-11
  prefs: []
  type: TYPE_TB
  zh: '| <semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">R=0</annotation></semantics>R=0
    |  |  |'
- en: '| <semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">R=1</annotation></semantics>R=1
    |  |  |'
  id: totrans-12
  prefs: []
  type: TYPE_TB
  zh: '| <semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">R=1</annotation></semantics>R=1
    |  |  |'
- en: 'Each decision we make must fall into one of the four cells of this table. In
    most real-world settings, we don’t actually know which *row* our decision lands
    up in: we know whether we decided <semantics><mrow><mi>D</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">D=0</annotation></semantics>D=0 or <semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">D=1</annotation></semantics>D=1 (i.e., which column
    it’s in), but we don’t know the state of reality.'
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 我们所做的每一个决策都必须落在表格的四个单元格之一。在大多数现实世界的场景中，我们实际上不知道我们的决策最终落在哪一行：我们知道是否决定 <semantics><mrow><mi>D</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">D=0</annotation></semantics>D=0 或 <semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">D=1</annotation></semantics>D=1（即它位于哪一列），但我们不知道现实的状态。
- en: This kind of table is often called a **confusion matrix**. There isn’t a standard
    convention about whether to put reality in the rows or columns, so you may see
    them flipped in other places. In this book, we’ll always use reality in the rows
    and the decision in the columns.
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 这种表格通常被称为**混淆矩阵**。关于是否将现实放在行或列中，并没有一个标准的约定，所以你可能会在其他地方看到它们被翻转。在这本书中，我们始终将现实放在行中，将决策放在列中。
- en: 'We use the following names for each of the four cases: **true positive** (TP),
    **false positive** (FP), **true negative** (TN), and **false negative** (FN).'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 我们为这四种情况分别使用了以下名称：**真阳性**（TP）、**假阳性**（FP）、**真阴性**（TN）和**假阴性**（FN）。
- en: '|  | <semantics><mrow><mi>D</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">D=0</annotation></semantics>D=0
    | <semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">D=1</annotation></semantics>D=1
    |'
  id: totrans-16
  prefs: []
  type: TYPE_TB
  zh: '|  | <semantics><mrow><mi>D</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">D=0</annotation></semantics>D=0
    | <semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">D=1</annotation></semantics>D=1
    |'
- en: '| <semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">R=0</annotation></semantics>R=0
    | <semantics><mrow><mi>T</mi><mi>N</mi></mrow><annotation encoding="application/x-tex">TN</annotation></semantics>TN
    | <semantics><mrow><mi>F</mi><mi>P</mi></mrow><annotation encoding="application/x-tex">FP</annotation></semantics>FP
    |'
  id: totrans-17
  prefs: []
  type: TYPE_TB
  zh: '| <semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">R=0</annotation></semantics>R=0
    | <semantics><mrow><mi>T</mi><mi>N</mi></mrow><annotation encoding="application/x-tex">TN</annotation></semantics>TN
    | <semantics><mrow><mi>F</mi><mi>P</mi></mrow><annotation encoding="application/x-tex">FP</annotation></semantics>FP
    |'
- en: '| <semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">R=1</annotation></semantics>R=1
    | <semantics><mrow><mi>F</mi><mi>N</mi></mrow><annotation encoding="application/x-tex">FN</annotation></semantics>FN
    | <semantics><mrow><mi>T</mi><mi>P</mi></mrow><annotation encoding="application/x-tex">TP</annotation></semantics>TP
    |'
  id: totrans-18
  prefs: []
  type: TYPE_TB
  zh: '| <semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">R=1</annotation></semantics>R=1
    | <semantics><mrow><mi>F</mi><mi>N</mi></mrow><annotation encoding="application/x-tex">FN</annotation></semantics>FN
    | <semantics><mrow><mi>T</mi><mi>P</mi></mrow><annotation encoding="application/x-tex">TP</annotation></semantics>TP
    |'
- en: The first word in each name tells us whether or not the decision was correct
    (“true”) or incorrect (“false”). The second word tells us whether the decision
    was a 1 (“positive”) or 0 (“negative”). For example, a “false positive” is a decision
    where <semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">D=1</annotation></semantics>D=1
    (because it was a ‘positive’) and was incorrect, so <semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">R=0</annotation></semantics>R=0 (because it was ‘false’).
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 每个名称的第一个词告诉我们决策是否正确（“真”）或错误（“假”）。第二个词告诉我们决策是1（“阳性”）还是0（“阴性”）。例如，“假阳性”是指决策 <semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">D=1</annotation></semantics>D=1（因为它是一个“阳性”），但实际上是错误的，所以
    <semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">R=0</annotation></semantics>R=0（因为它是一个“假”的）。
- en: 'Ideally, our decisions would always match reality, and land in the top left
    (true negatives) or bottom right (false positives) cells of our table. In the
    real world, this is not always possible: we may make errors. Depending on the
    problem, we may prefer to avoid one kind of error more than the other. In the
    rest of this section, we’ll define several different ways to quantify the errors
    we make, and understand the relationship between them.'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 理想情况下，我们的决策始终与现实相符，并落在表格的右上角（真阴性）或左下角（假阳性）的单元格中。在现实世界中，这并不总是可能的：我们可能会犯错误。根据问题，我们可能更倾向于避免一种错误而不是另一种。在本节的其余部分，我们将定义几种不同的方法来量化我们犯的错误，并了解它们之间的关系。
- en: There’s a lot of rich analysis we can do on a single decision, which we’ll explore
    in the next section on hypothesis testing. For now, we’ll start with the case
    of making multiple decisions, which will be our focus for most of this chapter.
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以对单个决策进行很多丰富的分析，我们将在下一节关于假设检验的章节中探讨。现在，我们将从做出多个决策的情况开始，这将是本章的重点。
- en: '[PRE1]'
  id: totrans-22
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: Making multiple decisions[¶](#making-multiple-decisions "Link to this Section")
  id: totrans-23
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 做出多个决策[¶](#making-multiple-decisions "链接到本节")
- en: 'Suppose now that we make multiple decisions, and we want to look at all of
    them collectively. There are several ways this situation could arise:'
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们现在做出多个决策，并希望从整体上审视它们。这种情况可能以几种方式出现：
- en: '*Testing multiple hypotheses on a single dataset*: we could be interested in
    asking multiple questions from a single dataset. For example, suppose we examine
    a genomics dataset in an Alzheimer’s study. For each of thousands of genetic markers,
    we would like to ask whether a mutation at that location is associated with a
    higher risk of Alzheimer’s.'
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: '*在单个数据集上测试多个假设*：我们可能对从单个数据集中提出多个问题感兴趣。例如，假设我们在阿尔茨海默病研究中检查一个基因组学数据集。对于成千上万的遗传标记，我们希望了解该位置的突变是否与阿尔茨海默病的更高风险相关。'
- en: '*Testing one hypothesis on multiple datasets*: suppose we’re interested in
    studying whether there is an association between the use of statin drugs and the
    rate of heart attacks. We could conduct a meta-analysis of many studies that look
    at this question: each study tests the same hypothesis (i.e., is taking statin
    drugs associated with lower risk of heart attack?) with a different set of subjects.
    By looking at the studies as a collection, we can try to draw a stronger conclusion
    about the presence (or absence) of such a link.'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: '*在多个数据集上测试一个假设*：假设我们感兴趣的是研究使用他汀类药物与心脏病发作率之间是否存在关联。我们可以对许多研究进行荟萃分析，这些研究探讨了这个问题：每个研究都测试了相同的一个假设（即，服用他汀类药物是否与心脏病发作风险降低有关？），但研究对象不同。通过将研究视为一个集合来观察，我们可以尝试得出关于这种联系存在（或不存在）的更强结论。'
- en: Modifying the 2x2 table[¶](#modifying-the-2x2-table "Link to this Section")
  id: totrans-27
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '修改2x2表格[¶](#modifying-the-2x2-table "链接到本节") '
- en: 'When we make multiple decisions, we may have multiple false positives, true
    negatives, and so on. So, we’ll use the same 2x2 table, but now each cell will
    contain a count of how many times that condition happened:'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 当我们做出多个决策时，我们可能会有多个假阳性、真阴性等等。因此，我们将使用相同的2x2表格，但现在每个单元格将包含该条件发生的次数计数：
- en: '|  | <semantics><mrow><mi>D</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">D=0</annotation></semantics>D=0
    | <semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">D=1</annotation></semantics>D=1
    |'
  id: totrans-29
  prefs: []
  type: TYPE_TB
  zh: '|  | <semantics><mrow><mi>D</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">D=0</annotation></semantics>D=0
    | <semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">D=1</annotation></semantics>D=1
    |'
- en: '| <semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">R=0</annotation></semantics>R=0
    | <semantics><mrow><msub><mi>n</mi><mn>00</mn></msub></mrow><annotation encoding="application/x-tex">n_{00}</annotation></semantics>n00​
    | <semantics><mrow><msub><mi>n</mi><mn>01</mn></msub></mrow><annotation encoding="application/x-tex">n_{01}</annotation></semantics>n01​
    |'
  id: totrans-30
  prefs: []
  type: TYPE_TB
  zh: '| <semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">R=0</annotation></semantics>R=0
    | <semantics><mrow><msub><mi>n</mi><mn>00</mn></msub></mrow><annotation encoding="application/x-tex">n_{00}</annotation></semantics>n00​
    | <semantics><mrow><msub><mi>n</mi><mn>01</mn></msub></mrow><annotation encoding="application/x-tex">n_{01}</annotation></semantics>n01​
    |'
- en: '| <semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">R=1</annotation></semantics>R=1
    | <semantics><mrow><msub><mi>n</mi><mn>10</mn></msub></mrow><annotation encoding="application/x-tex">n_{10}</annotation></semantics>n10​
    | <semantics><mrow><msub><mi>n</mi><mn>11</mn></msub></mrow><annotation encoding="application/x-tex">n_{11}</annotation></semantics>n11​
    |'
  id: totrans-31
  prefs: []
  type: TYPE_TB
  zh: '| <semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">R=1</annotation></semantics>R=1
    | <semantics><mrow><msub><mi>n</mi><mn>10</mn></msub></mrow><annotation encoding="application/x-tex">n_{10}</annotation></semantics>n10​
    | <semantics><mrow><msub><mi>n</mi><mn>11</mn></msub></mrow><annotation encoding="application/x-tex">n_{11}</annotation></semantics>n11​
    |'
- en: For example, <semantics><mrow><msub><mi>n</mi><mn>01</mn></msub></mrow><annotation
    encoding="application/x-tex">n_{01}</annotation></semantics>n01​ is the number
    of times reality was 0 and we made a decision of 1.
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，<semantics><mrow><msub><mi>n</mi><mn>01</mn></msub></mrow><annotation encoding="application/x-tex">n_{01}</annotation></semantics>n01​
    是现实为0而我们做出决策为1的次数。
- en: There are many ways to quantify how well (or how badly) our decisions match
    up with reality. In this book, we’ll focus on **row-wise rates**, which quantify
    our performance in each row (i.e., when reality is 0 and when reality is 1), and
    **column-wise rates**, which quantify our performance in each column (i.e., when
    the decision is 0 or the decision is 1).
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 有许多方法可以量化我们的决策与现实匹配得有多好（或有多坏）。在这本书中，我们将重点关注**行级率**，它量化我们在每一行中的表现（即，当现实为0和当现实为1时），以及**列级率**，它量化我们在每一列中的表现（即，当决策为0或决策为1时）。
- en: 'Row-wise rates: quantifying how well we do when reality is known[¶](#row-wise-rates-quantifying-how-well-we-do-when-reality-is-known
    "Link to this Section")'
  id: totrans-34
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 行级率：量化当现实已知时我们的表现如何[¶](#行级率-量化当现实已知时我们的表现如何 "链接到本节")
- en: 'Suppose we want to evaluate how good our decision-making process is in cases
    where reality is 0\. In this case, we’re interested in the top row of the 2x2
    table above. In particular, we can quantify how often we’re correct in this situation
    using the fraction <semantics><mrow><mfrac><msub><mi>n</mi><mn>00</mn></msub><mrow><msub><mi>n</mi><mn>00</mn></msub><mo>+</mo><msub><mi>n</mi><mn>01</mn></msub></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">\frac{n_{00}}{n_{00} + n_{01}}</annotation></semantics>n00​+n01​n00​​.
    We’ll call this row-wise rate the **true negative rate** (TNR): it quantifies
    how often we make true negative decisions in cases where reality is 0.'
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们想要评估在现实为0的情况下我们的决策过程有多好。在这种情况下，我们感兴趣的是上述2x2表格的上行。特别是，我们可以使用分数 <semantics><mrow><mfrac><msub><mi>n</mi><mn>00</mn></msub><mrow><msub><mi>n</mi><mn>00</mn></msub><mo>+</mo><msub><mi>n</mi><mn>01</mn></msub></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">\frac{n_{00}}{n_{00} + n_{01}}</annotation></semantics>n00​+n01​n00​​
    来量化我们在这个情况下正确的频率。我们将这个行级率称为**真阴性率**（TNR）：它量化在现实为0的情况下我们做出真阴性决策的频率。
- en: 'We can also evaluate our decision-making process in cases where reality is
    1\. In this case, we can quantify how often we’re correct using <semantics><mrow><mfrac><msub><mi>n</mi><mn>11</mn></msub><mrow><msub><mi>n</mi><mn>10</mn></msub><mo>+</mo><msub><mi>n</mi><mn>11</mn></msub></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">\frac{n_{11}}{n_{10} + n_{11}}</annotation></semantics>n10​+n11​n11​​.
    This is called the **true positive rate** (TPR): it measures how often we make
    true positive decisions in cases where reality is 1.'
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 我们还可以评估在现实为1的情况下的决策过程。在这种情况下，我们可以使用 <semantics><mrow><mfrac><msub><mi>n</mi><mn>11</mn></msub><mrow><msub><mi>n</mi><mn>10</mn></msub><mo>+</mo><msub><mi>n</mi><mn>11</mn></msub></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">\frac{n_{11}}{n_{10} + n_{11}}</annotation></semantics>n10​+n11​n11​​
    来量化我们正确的频率。这被称为**真阳性率**（TPR）：它衡量在现实为1的情况下我们做出真阳性决策的频率。
- en: 'We can define corresponding **error rates** for the two cases above, which
    we’ll call false positive rate (FPR) and false negative rate (FNR):'
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以为上述两种情况定义相应的**错误率**，我们将称之为假阳性率（FPR）和假阴性率（FNR）：
- en: <semantics><mrow><mi>F</mi><mi>P</mi><mi>R</mi><mo>=</mo><mfrac><msub><mi>n</mi><mn>01</mn></msub><mrow><msub><mi>n</mi><mn>00</mn></msub><mo>+</mo><msub><mi>n</mi><mn>01</mn></msub></mrow></mfrac><mi>F</mi><mi>N</mi><mi>R</mi><mo>=</mo><mfrac><msub><mi>n</mi><mn>10</mn></msub><mrow><msub><mi>n</mi><mn>10</mn></msub><mo>+</mo><msub><mi>n</mi><mn>11</mn></msub></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">FPR = \frac{n_{01}}{n_{00} + n_{01}} \\ FNR = \frac{n_{10}}{n_{10}
    + n_{11}}</annotation></semantics>FPR=n00​+n01​n01​​FNR=n10​+n11​n10​​[(1)](#p7PBp5CxTW
    "Link to this Equation")
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi>F</mi><mi>P</mi><mi>R</mi><mo>=</mo><mfrac><msub><mi>n</mi><mn>01</mn></msub><mrow><msub><mi>n</mi><mn>00</mn></msub><mo>+</mo><msub><mi>n</mi><mn>01</mn></msub></mrow></mfrac><mi>F</mi><mi>N</mi><mi>R</mi><mo>=</mo><mfrac><msub><mi>n</mi><mn>10</mn></msub><mrow><msub><mi>n</mi><mn>10</mn></msub><mo>+</mo><msub><mi>n</mi><mn>11</mn></msub></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">FPR = \frac{n_{01}}{n_{00} + n_{01}} \\ FNR = \frac{n_{10}}{n_{10}
    + n_{11}}</annotation></semantics>FPR=n00​+n01​n01​​FNR=n10​+n11​n10​​[(1)](#p7PBp5CxTW
    "链接到这个公式")
- en: 'We can visualize these rates with the rows that they correspond to in our 2x2
    table:'
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以用它们在2x2表中的对应行来可视化这些率：
- en: '![row_wise_rates.png](../Images/09718410b67d25c8e8a19676bb1db944.png)'
  id: totrans-40
  prefs: []
  type: TYPE_IMG
  zh: '![row_wise_rates.png](../Images/09718410b67d25c8e8a19676bb1db944.png)'
- en: 'As an example, suppose we’re predicting whether or not a customer will buy
    a product. In this case, 0 corresponds to a customer not buying, and 1 corresponds
    to the customer buying. Here’s how we’d interpret the four rates defined above:'
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: 作为例子，假设我们正在预测客户是否会购买产品。在这种情况下，0对应于客户没有购买，1对应于客户购买。以下是解释上述四个率的方法：
- en: 'TNR: when the customer **did not** buy the product, how often did we (correctly)
    predict that they would not?'
  id: totrans-42
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: TNR：当客户**没有**购买产品时，我们（正确地）预测他们不会购买的频率是多少？
- en: 'FPR: when the customer **did not** buy the product, how often did we (incorrectly)
    predict that they would buy it?'
  id: totrans-43
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: FPR：当客户**没有**购买产品时，我们（错误地）预测他们会购买的频率是多少？
- en: 'TPR: when the customer **did** buy the product, how often did we (correctly)
    predict that they would buy it?'
  id: totrans-44
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: TPR：当客户**确实**购买产品时，我们（正确地）预测他们会购买的频率是多少？
- en: 'FNR: when the customer **did** buy the product, how often did we (incorrectly)
    predict that they would not?'
  id: totrans-45
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: FNR：当客户**确实**购买产品时，我们（错误地）预测他们不会购买的频率是多少？
- en: '[PRE2]'
  id: totrans-46
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: Column-wise rates[¶](#column-wise-rates "Link to this Section")
  id: totrans-47
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 列级率[¶](#column-wise-rates "链接到这个部分")
- en: 'Row-wise rates measure how well we do in each case of reality: in other words,
    in each row of the table. We can also quantify our performance when we make specific
    decisions. We’ll focus on the **false discovery proportion** (FDP), which quantifies
    how often we’re wrong when we make a decision of 1:'
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: 行级率衡量我们在现实中的每个案例中的表现如何：换句话说，在表格的每一行中。我们还可以量化我们在做出特定决策时的表现。我们将重点关注**错误发现比例**（FDP），它量化了我们做出1的决策时出错频率：
- en: '![fdp.png](../Images/b70a4f6f3194c6f53e7bc0a1196e5d0e.png)'
  id: totrans-49
  prefs: []
  type: TYPE_IMG
  zh: '![fdp.png](../Images/b70a4f6f3194c6f53e7bc0a1196e5d0e.png)'
- en: 'We also define the **false omission proportion** (FOP), which quantifies how
    often we’re wrong when we make a decision of 0:'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: 我们还定义了**错误遗漏比例**（FOP），它量化了我们做出0的决策时出错频率：
- en: <semantics><mrow><mi>F</mi><mi>O</mi><mi>P</mi><mo>=</mo><mfrac><msub><mi>n</mi><mn>10</mn></msub><mrow><msub><mi>n</mi><mn>00</mn></msub><mo>+</mo><msub><mi>n</mi><mn>10</mn></msub></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">FOP = \frac{n_{10}}{n_{00} + n_{10}}</annotation></semantics>FOP=n00​+n10​n10​​[(2)](#i1G4dDsI7k
    "Link to this Equation")
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi>F</mi><mi>O</mi><mi>P</mi><mo>=</mo><mfrac><msub><mi>n</mi><mn>10</mn></msub><mrow><msub><mi>n</mi><mn>00</mn></msub><mo>+</mo><msub><mi>n</mi><mn>10</mn></msub></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">FOP = \frac{n_{10}}{n_{00} + n_{10}}</annotation></semantics>FOP=n00​+n10​n10​​[(2)](#i1G4dDsI7k
    "链接到这个公式")
- en: For each of these two, we can define their opposites (true omission proportion
    and true discovery proportion), but these are rarely called by these names.
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: 对于这两个，我们可以定义它们的对立面（真正的遗漏比例和真正的发现比例），但很少用这些名称来称呼它们。
- en: 'Returning to our product purchase prediction example, here’s how we’d interpret
    the column-wise rates:'
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: 回到我们的产品购买预测示例，以下是解释列级率的方法：
- en: 'FDP: when we predicted the customer **would buy** the product, how often did
    they end up not buying it?'
  id: totrans-54
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: FDP：当我们预测客户**会购买**产品时，他们最终没有购买产品的频率是多少？
- en: 'FOP: when we predicted the customer **would not buy** the product, how often
    did they end up buying it?'
  id: totrans-55
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: FOP：当我们预测客户**不会购买**产品时，他们最终购买产品的频率是多少？
- en: Throughout this book, we’ll focus primarily on FDP as the column-wise rate we’re
    most interested in.
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: 在整本书中，我们将主要关注FDP作为我们最感兴趣的列级率。
- en: Precision[¶](#precision "Link to this Section")
  id: totrans-57
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 精确度[¶](#precision "链接到这个部分")
- en: 'A closely related and widely used column-wise rate is the **precision**:'
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 一个与之密切相关且广泛使用的列比率是**精确度**：
- en: <semantics><mrow><mtext>Precision</mtext><mo>=</mo><mfrac><msub><mi>n</mi><mn>11</mn></msub><mrow><msub><mi>n</mi><mn>01</mn></msub><mo>+</mo><msub><mi>n</mi><mn>11</mn></msub></mrow></mfrac><mo>=</mo><mn>1</mn><mo>−</mo><mi>F</mi><mi>D</mi><mi>P</mi></mrow><annotation
    encoding="application/x-tex">\text{Precision} = \frac{n_{11}}{n_{01} + n_{11}}
    = 1 - FDP</annotation></semantics>Precision=n01​+n11​n11​​=1−FDP[(3)](#nEBckzrgvY
    "Link to this Equation")
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mtext>精确度</mtext><mo>=</mo><mfrac><msub><mi>n</mi><mn>11</mn></msub><mrow><msub><mi>n</mi><mn>01</mn></msub><mo>+</mo><msub><mi>n</mi><mn>11</mn></msub></mrow></mfrac><mo>=</mo><mn>1</mn><mo>−</mo><mi>F</mi><mi>D</mi><mi>P</mi></mrow><annotation
    encoding="application/x-tex">\text{精确度} = \frac{n_{11}}{n_{01} + n_{11}} = 1 -
    FDP</annotation></semantics>精确度=n01​+n11​n11​​=1−FDP[(3)](#nEBckzrgvY "链接到这个方程式")
- en: 'Precision tells us out of the times we made a decision of 1, how often we were
    correct. In the product purchase prediction example, we’d interpret it as: when
    we predicted the customer **would buy** the product, how often did they end up
    buying it?'
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: 精确度告诉我们，在我们做出决策为1的次数中，我们有多大的正确率。在产品购买预测的例子中，我们会这样解释：当我们预测客户**会购买**产品时，他们最终购买产品的频率是多少？
- en: '[PRE3]'
  id: totrans-61
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: 'Example: interpreting row-wise and column-wise rates[¶](#example-interpreting-row-wise-and-column-wise-rates
    "Link to this Section")'
  id: totrans-62
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例：解释行和列的比率[¶](#example-interpreting-row-wise-and-column-wise-rates "链接到本节")
- en: Suppose we’re testing a large number of patients for a disease. We’ll use 1
    to indicate that a patient has the disease, and 0 to indicate that they don’t.
    This corresponds to standard medical terminology, where a “positive” test indicates
    that we think someone has the disease, while a “negative” test means we think
    they don’t have it.
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们正在测试大量患者的疾病。我们将使用1表示患者有疾病，使用0表示他们没有。这对应于标准的医疗术语，其中“阳性”测试表示我们认为某人患有疾病，而“阴性”测试表示我们认为他们没有疾病。
- en: Let’s interpret some of the definitions we’ve learned for this specific example.
    Recall that for this example, a **false positive** occurs when the test comes
    back positive (i.e., the test says the patient has the disease), but the patient
    is healthy.
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们为这个特定例子解释一些我们学到的定义。回想一下，对于这个例子，**假阳性**发生在测试结果为阳性（即测试表明患者有疾病），但实际上患者是健康的情况。
- en: 'The false positive rate (FPR) is the percentage of healthy patients that test
    positive. It tells us: **when we test healthy patients, how often is the test
    wrong?**'
  id: totrans-65
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 假阳性率（FPR）是指测试结果为阳性的健康患者的百分比。它告诉我们：**当我们测试健康患者时，测试有多大的可能是错误的？**
- en: 'The false negative rate (FNR) is the percentage of sick patients that test
    negative. It tells us: **when we test sick patients, how often is the test wrong?**'
  id: totrans-66
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 假阴性率（FNR）是指测试结果为阴性的患病患者的百分比。它告诉我们：**当我们测试患病患者时，测试有多大的可能是错误的？**
- en: 'The false discovery proportion (FDP) is the percentage of positive tests that
    are from healthy patients. It tells us: **when the test results are positive,
    how often are they wrong?**'
  id: totrans-67
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 假设发现比例（FDP）是指来自健康患者的阳性测试的百分比。它告诉我们：**当测试结果为阳性时，它们有多大的可能是错误的？**
- en: 'The false omission proportion (FOP) is the percentage of negative tests that
    are from sick patients. It tells us: **when the test results are negative, how
    often are they wrong?**'
  id: totrans-68
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 假遗漏比例（FOP）是指来自患病患者的阴性测试的百分比。它告诉我们：**当测试结果为阴性时，它们有多大的可能是错误的？**
- en: 'Intuitively, the row-wise error rates (FPR and FNR) describe properties of
    the test itself: they tell us how well the test does on healthy patients and sick
    patients, respectively. As a specific example, the COVID-19 rapid (antigen) tests
    have an estimated FPR of 0.2% and an FNR of 38% for the Omicron BA.1 variant ([source](https://doi.org/10.1101/2022.06.13.22276325)).
    The FPR and FNR are a property of the testing technique and the disease itself,
    and are the same regardless of whether the test is used during a surge in cases
    or during a low period (fewer cases), as long as the test technology and variant
    are the same.'
  id: totrans-69
  prefs: []
  type: TYPE_NORMAL
  zh: 直观地说，行错误率（FPR和FNR）描述了测试本身的特性：它们告诉我们测试在健康患者和患病患者身上的表现如何。作为一个具体例子，COVID-19快速（抗原）测试对Omicron
    BA.1变种的估计FPR为0.2%，FNR为38% ([来源](https://doi.org/10.1101/2022.06.13.22276325))。FPR和FNR是测试技术和疾病本身的特性，无论测试是在病例激增期间还是低发期（病例较少）进行，只要测试技术和变种相同，这些特性都是相同的。
- en: On the other hand, the column-wise rates must depend on the population. As a
    specific example, let’s examine the FDP for COVID-19 rapid (antigen) tests. During
    a lull, when the virus is less common in the population, we should expect a relatively
    small number of people with COVID, and a relatively large number of healthy patients.
    This means that some moderate percentage of positive tests will be incorrect (false
    positives), and so our FDR could be moderately high. But during a surge in cases,
    many more people are sick, and we should expect more of the positive tests to
    come from people with COVID rather than healthy people. Therefore, our FDP will
    be lower, even if the test itself stays exactly the same.
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
  zh: 另一方面，列向的比率必须依赖于总体。作为一个具体的例子，让我们来考察COVID-19快速（抗原）检测的FDP。在病毒在人群中较少见的低谷期，我们应该预期有相对较少的COVID-19患者，以及相对较多的健康患者。这意味着一些适度的百分比的正测试结果将是错误的（假阳性），因此我们的FDR可能会适度较高。但在病例激增期间，更多的人生病，我们应该预期更多的阳性测试结果来自COVID-19患者而不是健康人。因此，即使测试本身保持完全相同，我们的FDP也会更低。
- en: Next, we’ll quantify this intuition for the relationship between row-wise rates
    and column-wise rates.
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: 接下来，我们将量化行向比率与列向比率之间关系的这种直觉。
- en: '[PRE4]'
  id: totrans-72
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: Conditional probabilities[¶](#conditional-probabilities "Link to this Section")
  id: totrans-73
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 条件概率[¶](#conditional-probabilities "链接到本节")
- en: Each of the rates defined above was based on the idea of limiting ourselves
    to half of the table. In the case of row-wise rates, we defined quantities based
    on looking only at <semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">R=0</annotation></semantics>R=0 (FPR and TNR) or
    <semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">R=1</annotation></semantics>R=1
    (TPR and FNR). In the case of column-wise rates, we defined FDP based only on
    <semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">D=1</annotation></semantics>D=1.
  id: totrans-74
  prefs: []
  type: TYPE_NORMAL
  zh: 上述定义的每个比率都是基于限制自己只看表格一半的想法。在行向比率的案例中，我们定义了基于只看 <semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">R=0</annotation></semantics>R=0（FPR和TNR）或 <semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">R=1</annotation></semantics>R=1（TPR和FNR）的量。在列向比率的案例中，我们只基于
    <semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">D=1</annotation></semantics>D=1
    定义FDP。
- en: 'This idea, of making computations based on a limited set of outcomes, should
    be familiar: it’s an idea you’ve likely seen before when thinking about conditional
    probabilities. Consider events <semantics><mrow><mi>A</mi></mrow><annotation encoding="application/x-tex">A</annotation></semantics>A
    and <semantics><mrow><mi>B</mi></mrow><annotation encoding="application/x-tex">B</annotation></semantics>B.
    While <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>A</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">P(A)</annotation></semantics>P(A) describes the probability
    that event <semantics><mrow><mi>A</mi></mrow><annotation encoding="application/x-tex">A</annotation></semantics>A
    occurs, <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>A</mi><mi mathvariant="normal">∣</mi><mi>B</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(A|B)</annotation></semantics>P(A∣B)
    describes the conditional probability of event <semantics><mrow><mi>A</mi></mrow><annotation
    encoding="application/x-tex">A</annotation></semantics>A given event <semantics><mrow><mi>B</mi></mrow><annotation
    encoding="application/x-tex">B</annotation></semantics>B: in other words, if we
    restrict ourselves to the case where event <semantics><mrow><mi>B</mi></mrow><annotation
    encoding="application/x-tex">B</annotation></semantics>B has occurred, what is
    the probability of event <semantics><mrow><mi>A</mi></mrow><annotation encoding="application/x-tex">A</annotation></semantics>A
    occuring?'
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: 这种基于有限结果集进行计算的想法应该很熟悉：这是一个你可能在考虑条件概率时已经见过的想法。考虑事件 <semantics><mrow><mi>A</mi></mrow><annotation
    encoding="application/x-tex">A</annotation></semantics>A 和 <semantics><mrow><mi>B</mi></mrow><annotation
    encoding="application/x-tex">B</annotation></semantics>B。虽然 <semantics><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>A</mi><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">P(A)</annotation></semantics>P(A) 描述了事件 <semantics><mrow><mi>A</mi></mrow><annotation
    encoding="application/x-tex">A</annotation></semantics>A 发生的概率，<semantics><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>A</mi><mi mathvariant="normal">∣</mi><mi>B</mi><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(A|B)</annotation></semantics>P(A∣B)
    描述了事件 <semantics><mrow><mi>A</mi></mrow><annotation encoding="application/x-tex">A</annotation></semantics>A
    在事件 <semantics><mrow><mi>B</mi></mrow><annotation encoding="application/x-tex">B</annotation></semantics>B
    发生条件下的条件概率：换句话说，如果我们限制自己只考虑事件 <semantics><mrow><mi>B</mi></mrow><annotation encoding="application/x-tex">B</annotation></semantics>B
    已经发生的情况，事件 <semantics><mrow><mi>A</mi></mrow><annotation encoding="application/x-tex">A</annotation></semantics>A
    发生的概率是多少？
- en: 'From this idea, we can interpret our row-wise rates as conditional probabilities.
    Since each is defined within a particular case for reality, we know that they
    are probabilities of particular decisions conditioned on reality: for example,
    the true positive rate (TPR) is <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mi
    mathvariant="normal">∣</mi><mi>R</mi><mo>=</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">P(D=1|R=1)</annotation></semantics>P(D=1∣R=1).'
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: 从这个想法出发，我们可以将我们的行率解释为条件概率。由于每个都是在特定现实情况下定义的，我们知道它们是特定决策在现实条件下的概率：例如，真正阳性率（TPR）是
    <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mi
    mathvariant="normal">∣</mi><mi>R</mi><mo>=</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">P(D=1|R=1)</annotation></semantics>P(D=1∣R=1)。
- en: Similarly, the false positive rate (FPR), which measures how often our answers
    are incorrect (<semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">D=1</annotation></semantics>D=1) when reality is
    0 (<semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">R
    = 0</annotation></semantics>R=0), can be interpreted as the conditional probability
    <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mi
    mathvariant="normal">∣</mi><mi>R</mi><mo>=</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">P(D=1|R=0)</annotation></semantics>P(D=1∣R=0).
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: 类似地，假阳性率（FPR），它衡量我们的答案在现实为0（<semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">D=1</annotation></semantics>D=1）时错误的频率，可以解释为条件概率
    <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mi
    mathvariant="normal">∣</mi><mi>R</mi><mo>=</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">P(D=1|R=0)</annotation></semantics>P(D=1∣R=0)。
- en: Column-wise rates, on the other hand, are defined conditioned on a particular
    decision. The false discovery proportion, which looks at our positive decisions
    (<semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">D=1</annotation></semantics>D=1)
    and measures how often they are incorrect (<semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">R=0</annotation></semantics>R=0), can be interpreted
    as the conditional probability <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>0</mn><mi
    mathvariant="normal">∣</mi><mi>D</mi><mo>=</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">P(R=0|D=1)</annotation></semantics>P(R=0∣D=1). Similarly,
    the false omission proportion (FOP) is <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>1</mn><mi
    mathvariant="normal">∣</mi><mi>D</mi><mo>=</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">P(R=1|D=0)</annotation></semantics>P(R=1∣D=0).
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: 另一方面，列向率是在特定决策条件下定义的。假发现比例，它关注我们的阳性决策（<semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">D=1</annotation></semantics>D=1）并衡量它们错误发生的频率（<semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">R=0</annotation></semantics>R=0），可以解释为条件概率 <semantics><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>0</mn><mi mathvariant="normal">∣</mi><mi>D</mi><mo>=</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(R=0|D=1)</annotation></semantics>P(R=0∣D=1)。同样，假遗漏比例
    (FOP) 是 <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>1</mn><mi
    mathvariant="normal">∣</mi><mi>D</mi><mo>=</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">P(R=1|D=0)</annotation></semantics>P(R=1∣D=0).
- en: 'To summarize:'
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
  zh: 总结如下：
- en: '| Error rate | Conditional probability |'
  id: totrans-80
  prefs: []
  type: TYPE_TB
  zh: '| 错误率 | 条件概率 |'
- en: '| **True negative rate (TNR)** | <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>0</mn><mo>∣</mo><mi>R</mi><mo>=</mo><mn>0</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(D=0\mid
    R=0)</annotation></semantics>P(D=0∣R=0) |'
  id: totrans-81
  prefs: []
  type: TYPE_TB
  zh: '| **真阴性率 (TNR)** | <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>0</mn><mo>∣</mo><mi>R</mi><mo>=</mo><mn>0</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(D=0\mid
    R=0)</annotation></semantics>P(D=0∣R=0) |'
- en: '| **False positive rate (FPR)** | <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mo>∣</mo><mi>R</mi><mo>=</mo><mn>0</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(D=1\mid
    R=0)</annotation></semantics>P(D=1∣R=0) |'
  id: totrans-82
  prefs: []
  type: TYPE_TB
  zh: '| **假阳性率 (FPR)** | <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mo>∣</mo><mi>R</mi><mo>=</mo><mn>0</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(D=1\mid
    R=0)</annotation></semantics>P(D=1∣R=0) |'
- en: '| **True positive rate (TPR)** | <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mo>∣</mo><mi>R</mi><mo>=</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(D=1\mid
    R=1)</annotation></semantics>P(D=1∣R=1) |'
  id: totrans-83
  prefs: []
  type: TYPE_TB
  zh: '| **真阳性率 (TPR)** | <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mo>∣</mo><mi>R</mi><mo>=</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(D=1\mid
    R=1)</annotation></semantics>P(D=1∣R=1) |'
- en: '| **False negative rate (FNR)** | <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>0</mn><mo>∣</mo><mi>R</mi><mo>=</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(D=0\mid
    R=1)</annotation></semantics>P(D=0∣R=1) |'
  id: totrans-84
  prefs: []
  type: TYPE_TB
  zh: '| **假阴性率 (FNR)** | <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>0</mn><mo>∣</mo><mi>R</mi><mo>=</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(D=0\mid
    R=1)</annotation></semantics>P(D=0∣R=1) |'
- en: '| **False discovery proportion (FDP)** | <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>0</mn><mo>∣</mo><mi>D</mi><mo>=</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(R=0\mid
    D=1)</annotation></semantics>P(R=0∣D=1) |'
  id: totrans-85
  prefs: []
  type: TYPE_TB
  zh: '| **假发现比例 (FDP)** | <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>0</mn><mo>∣</mo><mi>D</mi><mo>=</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(R=0\mid
    D=1)</annotation></semantics>P(R=0∣D=1) |'
- en: '| **False omission proportion (FOP)** | <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>1</mn><mo>∣</mo><mi>D</mi><mo>=</mo><mn>0</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(R=1\mid
    D=0)</annotation></semantics>P(R=1∣D=0) |'
  id: totrans-86
  prefs: []
  type: TYPE_TB
  zh: '| **假遗漏比例 (FOP)** | <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>1</mn><mo>∣</mo><mi>D</mi><mo>=</mo><mn>0</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(R=1\mid
    D=0)</annotation></semantics>P(R=1∣D=0) |'
- en: Interpreting these row-wise and column-wise rates as conditional probabilities
    is useful because it lets us apply everything we know about conditional probability
    to better our understanding of these rates. Earlier, with our COVID-19 testing
    example, we explored an intuitive connection between the row-wise rates and column-wise
    rates, and introduced the idea that the connection also depends on how common
    “<semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">R=1</annotation></semantics>R=1”
    is. We can formalize this intuition by applying Bayes’ rule.
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: 将这些行和列的比率解释为条件概率是有用的，因为它让我们能够将我们对条件概率的所有知识应用到更好地理解这些比率上。在之前的COVID-19检测示例中，我们探讨了行和列比率之间的直观联系，并引入了这种联系也取决于“<semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">R=1</annotation></semantics>R=1”有多普遍的想法。我们可以通过应用贝叶斯定理来形式化这种直觉。
- en: '[PRE5]'
  id: totrans-88
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: Relating row-wise and column-wise error rates[¶](#relating-row-wise-and-column-wise-error-rates
    "Link to this Section")
  id: totrans-89
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 将行和列错误率相关联[¶](#relating-row-wise-and-column-wise-error-rates "链接到本节")
- en: 'Consider the false discovery proportion (FDP), <semantics><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>0</mn><mi mathvariant="normal">∣</mi><mi>D</mi><mo>=</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(R=0|D=1)</annotation></semantics>P(R=0∣D=1)
    and false positive rate (FPR), <semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mi
    mathvariant="normal">∣</mi><mi>R</mi><mo>=</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">P(D=1|R=0)</annotation></semantics>P(D=1∣R=0). In
    order to quantify the connection between them, we can apply Bayes’ rule. As we’ll
    see, the connection depends on how common it is for reality to be “1”. We’ll call
    this quantity the **prevalence** or **base rate**, and use the notation <semantics><mrow><msub><mi>π</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">\pi_1</annotation></semantics>π1​: <semantics><mrow><msub><mi>π</mi><mn>1</mn></msub><mo>=</mo><mi>P</mi><mo
    stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\pi_1 = P(R=1)</annotation></semantics>π1​=P(R=1).
    We’ll also define <semantics><mrow><msub><mi>π</mi><mn>0</mn></msub><mo>=</mo><mi>P</mi><mo
    stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn><mo>−</mo><msub><mi>π</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">\pi_0 = P(R=0) = 1 - \pi_1</annotation></semantics>π0​=P(R=0)=1−π1​.'
  id: totrans-90
  prefs: []
  type: TYPE_NORMAL
  zh: 考虑假发现比例（FDP），<semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>0</mn><mi
    mathvariant="normal">∣</mi><mi>D</mi><mo>=</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">P(R=0|D=1)</annotation></semantics>P(R=0∣D=1)和假阳性率（FPR），<semantics><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mi mathvariant="normal">∣</mi><mi>R</mi><mo>=</mo><mn>0</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(D=1|R=0)</annotation></semantics>P(D=1∣R=0)。为了量化它们之间的联系，我们可以应用贝叶斯定理。正如我们将看到的，这种联系取决于现实世界中“1”有多普遍。我们将称这个量为**患病率**或**基础率**，并使用符号<semantics><mrow><msub><mi>π</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">\pi_1</annotation></semantics>π1​：<semantics><mrow><msub><mi>π</mi><mn>1</mn></msub><mo>=</mo><mi>P</mi><mo
    stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">\pi_1 = P(R=1)</annotation></semantics>π1​=P(R=1)。我们还将定义<semantics><mrow><msub><mi>π</mi><mn>0</mn></msub><mo>=</mo><mi>P</mi><mo
    stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn><mo>−</mo><msub><mi>π</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">\pi_0 = P(R=0) = 1 - \pi_1</annotation></semantics>π0​=P(R=0)=1−π1​。
- en: 'Now we can quantify the relationship between these two rates that we began
    exploring earlier. We’ll use Bayes’ rule and the law of total probability:'
  id: totrans-91
  prefs: []
  type: TYPE_NORMAL
  zh: 现在，我们可以量化我们之前开始探索的这两个比率之间的关系。我们将使用贝叶斯定理和全概率定律：
- en: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>F</mi><mi>D</mi><mi>P</mi></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>P</mi><mo stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>0</mn><mi
    mathvariant="normal">∣</mi><mi>D</mi><mo>=</mo><mn>1</mn><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mstyle mathsize="0.7em"><mtext>(using Bayes’ rule)</mtext></mstyle></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mi mathvariant="normal">∣</mi><mi>R</mi><mo>=</mo><mn>0</mn><mo
    stretchy="false">)</mo><mi>P</mi><mo stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>0</mn><mo
    stretchy="false">)</mo></mrow><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mstyle mathsize="0.7em"><mtext>(Law of total probability)</mtext></mstyle></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mi mathvariant="normal">∣</mi><mi>R</mi><mo>=</mo><mn>0</mn><mo
    stretchy="false">)</mo><mi>P</mi><mo stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>0</mn><mo
    stretchy="false">)</mo></mrow><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mi
    mathvariant="normal">∣</mi><mi>R</mi><mo>=</mo><mn>0</mn><mo stretchy="false">)</mo><mi>P</mi><mo
    stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>0</mn><mo stretchy="false">)</mo><mo>+</mo><mi>P</mi><mo
    stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mi mathvariant="normal">∣</mi><mi>R</mi><mo>=</mo><mn>1</mn><mo
    stretchy="false">)</mo><mi>P</mi><mo stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mstyle mathsize="0.7em"><mtext>(applying definitions)</mtext></mstyle></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mi>F</mi><mi>P</mi><mi>R</mi><mo>⋅</mo><msub><mi>π</mi><mn>0</mn></msub></mrow><mrow><mi>F</mi><mi>P</mi><mi>R</mi><mo>⋅</mo><msub><mi>π</mi><mn>0</mn></msub><mo>+</mo><mi>T</mi><mi>P</mi><mi>R</mi><mo>⋅</mo><msub><mi>π</mi><mn>1</mn></msub></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mstyle mathsize="0.7em"><mtext>(dividing by the numerator)</mtext></mstyle></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mi>T</mi><mi>P</mi><mi>R</mi></mrow><mrow><mi>F</mi><mi>P</mi><mi>R</mi></mrow></mfrac><mfrac><msub><mi>π</mi><mn>1</mn></msub><msub><mi>π</mi><mn>0</mn></msub></mfrac></mrow></mfrac></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} FDP &= P(R=0|D=1) \\ {\scriptsize{\text{(using
    Bayes' rule)}}} &= \frac{P(D=1|R=0)P(R=0)}{P(D=1)} \\ {\scriptsize{\text{(Law
    of total probability)}}} &= \frac{P(D=1|R=0)P(R=0)}{P(D=1|R=0)P(R=0) + P(D=1|R=1)P(R=1)}
    \\ {\scriptsize{\text{(applying definitions)}}} &= \frac{FPR \cdot \pi_0}{FPR
    \cdot \pi_0 + TPR \cdot \pi_1} \\ {\scriptsize{\text{(dividing by the numerator)}}}
    &= \frac{1}{1 + \frac{TPR}{FPR} \frac{\pi_1}{\pi_0}} \end{align*}</annotation></semantics>FDP(using Bayes’ rule)(Law of total probability)(applying definitions)(dividing by the numerator)​=P(R=0∣D=1)=P(D=1)P(D=1∣R=0)P(R=0)​=P(D=1∣R=0)P(R=0)+P(D=1∣R=1)P(R=1)P(D=1∣R=0)P(R=0)​=FPR⋅π0​+TPR⋅π1​FPR⋅π0​​=1+FPRTPR​π0​π1​​1​​[(4)](#x2irYLoLcK
    "Link to this Equation")
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mi>F</mi><mi>D</mi><mi>P</mi></mrow></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mi>P</mi><mo stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>0</mn><mi
    mathvariant="normal">∣</mi><mi>D</mi><mo>=</mo><mn>1</mn><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mstyle mathsize="0.7em"><mtext>(使用贝叶斯定理)</mtext></mstyle></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mi mathvariant="normal">∣</mi><mi>R</mi><mo>=</mo><mn>0</mn><mo
    stretchy="false">)</mo><mi>P</mi><mo stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>0</mn><mo
    stretchy="false">)</mo></mrow><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mstyle mathsize="0.7em"><mtext>(全概率公式)</mtext></mstyle></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mi>P</mi><mo
    stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mi mathvariant="normal">∣</mi><mi>R</mi><mo>=</mo><mn>0</mn><mo
    stretchy="false">)</mo><mi>P</mi><mo stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>0</mn><mo
    stretchy="false">)</mo></mrow><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mi
    mathvariant="normal">∣</mi><mi>R</mi><mo>=</mo><mn>0</mn><mo stretchy="false">)</mo><mi>P</mi><mo
    stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>0</mn><mo stretchy="false">)</mo><mo>+</mo><mi>P</mi><mo
    stretchy="false">(</mo><mi>D</mi><mo>=</mo><mn>1</mn><mi mathvariant="normal">∣</mi><mi>R</mi><mo>=</mo><mn>1</mn><mo
    stretchy="false">)</mo><mi>P</mi><mo stretchy="false">(</mo><mi>R</mi><mo>=</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mstyle mathsize="0.7em"><mtext>(应用定义)</mtext></mstyle></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mrow><mi>F</mi><mi>P</mi><mi>R</mi><mo>⋅</mo><msub><mi>π</mi><mn>0</mn></msub></mrow><mrow><mi>F</mi><mi>P</mi><mi>R</mi><mo>⋅</mo><msub><mi>π</mi><mn>0</mn></msub><mo>+</mo><mi>T</mi><mi>P</mi><mi>R</mi><mo>⋅</mo><msub><mi>π</mi><mn>1</mn></msub></mrow></mfrac></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mstyle mathsize="0.7em"><mtext>(分子除法)</mtext></mstyle></mstyle></mtd><mtd><mstyle
    scriptlevel="0" displaystyle="true"><mrow><mo>=</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mi>T</mi><mi>P</mi><mi>R</mi></mrow><mrow><mi>F</mi><mi>P</mi><mi>R</mi></mrow></mfrac><mfrac><msub><mi>π</mi><mn>1</mn></msub><msub><mi>π</mi><mn>0</mn></msub></mfrac></mrow></mfrac></mrow></mstyle></mtd></mtr></mtable><annotation
    encoding="application/x-tex">\begin{align*} FDP &= P(R=0|D=1) \\ {\scriptsize{\text{(using
    Bayes’ rule)}}} &= \frac{P(D=1|R=0)P(R=0)}{P(D=1)} \\ {\scriptsize{\text{(Law
    of total probability)}}} &= \frac{P(D=1|R=0)P(R=0)}{P(D=1|R=0)P(R=0) + P(D=1|R=1)P(R=1)}
    \\ {\scriptsize{\text{(applying definitions)}}} &= \frac{FPR \cdot \pi_0}{FPR
    \cdot \pi_0 + TPR \cdot \pi_1} \\ {\scriptsize{\text{(dividing by the numerator)}}}
    &= \frac{1}{1 + \frac{TPR}{FPR} \frac{\pi_1}{\pi_0}} \end{align*}</annotation></semantics>FDP(使用贝叶斯定理)(全概率公式)(应用定义)(分子除法)
    = P(R=0|D=1) = P(D=1) / P(D=1|R=0)P(R=0) = P(D=1|R=0)P(R=0) + P(D=1|R=1)P(R=1)
    / P(D=1|R=0)P(R=0) = FPR⋅π0 / (FPR⋅π0 + TPR⋅π1) = 1 + FPR / TPRπ0 / π1 / 1 [(4)](#x2irYLoLcK
    "链接到这个方程")
- en: For a refresher on calculations like these, you can refer to [Section 2.5 of
    the Data 140 textbook](http://prob140.org/textbook/content/Chapter_02/05_Updating_Probabilities.html).
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你想复习这类计算，可以参考[《数据140教科书》第2.5节](http://prob140.org/textbook/content/Chapter_02/05_Updating_Probabilities.html)。
- en: '[PRE6]'
  id: totrans-94
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: 'Example: relating row-wise and column-wise rates quantitatively[¶](#example-relating-row-wise-and-column-wise-rates-quantitatively
    "Link to this Section")'
  id: totrans-95
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 示例：定量关联行率和列率[¶](#example-relating-row-wise-and-column-wise-rates-quantitatively
    "链接到本节")
- en: Suppose we’re trying to build a model that predicts whether or not it will rain.
    To ensure it performs well, we’ll apply our algorithm in Berkeley (where it almost
    never rains in the summer) and in Miami, FL (where it rains about half the time
    in the summer).
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们正在尝试构建一个预测是否下雨的模型。为了确保其性能良好，我们将在伯克利（那里夏天几乎不下雨）和佛罗里达州的迈阿密（那里夏天大约有一半的时间下雨）应用我们的算法。
- en: 'You work with a team of data scientists, and one of them provides you with
    a good prediction model: on days that it rains, the model gets it right <semantics><mrow><mn>97</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">97\%</annotation></semantics>97%
    of the time, and on days that it doesn’t rain, the model gets it right <semantics><mrow><mn>96</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">96\%</annotation></semantics>96%
    of the time. You present the model to a meteorologist, who tells you that the
    question they’re really interested in is: **when the model predicts rain, how
    often is it right**? This is important for people to trust the model: if the model’s
    rainy-day predictions are mostly incorrect, then people won’t believe it.'
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
  zh: 你与一组数据科学家合作，其中一位提供了一个好的预测模型：在下雨的日子里，模型正确预测的次数是<semantics><mrow><mn>97</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">97\%</annotation></semantics>97%，而在不下雨的日子里，模型正确预测的次数是<semantics><mrow><mn>96</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">96\%</annotation></semantics>96%。你将这个模型展示给一位气象学家，他告诉你他们真正感兴趣的问题是：**当模型预测下雨时，它有多准确**？这对于人们信任模型很重要：如果模型对下雨天的预测大多不正确，那么人们就不会相信它。
- en: We start by interpreting these three quantities into the framework that we’ve
    already built up. We’ll use 1 to indicate rain, and 0 to indicate no rain.
  id: totrans-98
  prefs: []
  type: TYPE_NORMAL
  zh: 我们首先将这些三个量解释到我们已建立起来的框架中。我们将用1表示下雨，用0表示没有下雨。
- en: '“on days that it rains, the model gets it right <semantics><mrow><mn>97</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">97\%</annotation></semantics>97%
    of the time”: this is a row-wise rate describing how well we do when <semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">R=1</annotation></semantics>R=1. In other words,
    this tells us that <semantics><mrow><mi>T</mi><mi>P</mi><mi>R</mi><mo>=</mo><mn>0.97</mn></mrow><annotation
    encoding="application/x-tex">TPR=0.97</annotation></semantics>TPR=0.97 (and <semantics><mrow><mi>F</mi><mi>N</mi><mi>R</mi><mo>=</mo><mn>1</mn><mo>−</mo><mi>T</mi><mi>P</mi><mi>R</mi><mo>=</mo><mn>0.03</mn></mrow><annotation
    encoding="application/x-tex">FNR = 1 - TPR = 0.03</annotation></semantics>FNR=1−TPR=0.03.'
  id: totrans-99
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: “在下雨的日子里，模型正确预测的次数是<semantics><mrow><mn>97</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">97\%</annotation></semantics>97%”：这是一个行率，描述了当<semantics><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">R=1</annotation></semantics>R=1时我们做得有多好。换句话说，这告诉我们<semantics><mrow><mi>T</mi><mi>P</mi><mi>R</mi><mo>=</mo><mn>0.97</mn></mrow><annotation
    encoding="application/x-tex">TPR=0.97</annotation></semantics>TPR=0.97（并且<semantics><mrow><mi>F</mi><mi>N</mi><mi>R</mi><mo>=</mo><mn>1</mn><mo>−</mo><mi>T</mi><mi>P</mi><mi>R</mi><mo>=</mo><mn>0.03</mn></mrow><annotation
    encoding="application/x-tex">FNR = 1 - TPR = 0.03</annotation></semantics>FNR=1−TPR=0.03）。
- en: '“on days that it doesn’t rain, the model gets it right <semantics><mrow><mn>96</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">96\%</annotation></semantics>96%
    of the time”: this is a row-wise rate describing how well we do when <semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">R=0</annotation></semantics>R=0. In other words,
    this tells us that <semantics><mrow><mi>T</mi><mi>N</mi><mi>R</mi><mo>=</mo><mn>0.96</mn></mrow><annotation
    encoding="application/x-tex">TNR=0.96</annotation></semantics>TNR=0.96 (and <semantics><mrow><mi>F</mi><mi>P</mi><mi>R</mi><mo>=</mo><mn>1</mn><mo>−</mo><mi>T</mi><mi>N</mi><mi>R</mi><mo>=</mo><mn>0.04</mn></mrow><annotation
    encoding="application/x-tex">FPR = 1 - TNR = 0.04</annotation></semantics>FPR=1−TNR=0.04).'
  id: totrans-100
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: “在不下雨的日子里，模型正确率高达<semantics><mrow><mn>96</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">96\%</annotation></semantics>96%”：这是行率，描述了当<semantics><mrow><mi>R</mi><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">R=0</annotation></semantics>R=0时我们的表现。换句话说，这告诉我们<semantics><mrow><mi>T</mi><mi>N</mi><mi>R</mi><mo>=</mo><mn>0.96</mn></mrow><annotation
    encoding="application/x-tex">TNR=0.96</annotation></semantics>TNR=0.96（并且<semantics><mrow><mi>F</mi><mi>P</mi><mi>R</mi><mo>=</mo><mn>1</mn><mo>−</mo><mi>T</mi><mi>N</mi><mi>R</mi><mo>=</mo><mn>0.04</mn></mrow><annotation
    encoding="application/x-tex">FPR = 1 - TNR = 0.04</annotation></semantics>FPR=1−TNR=0.04）。
- en: '“when the model predicts rain, how often is it right?”: this is a column-wise
    rate describing how well we do when <semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">D=1</annotation></semantics>D=1. In other words,
    the meteorologist is interested in minimizing the FDP.'
  id: totrans-101
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: “当模型预测下雨时，它有多正确？”：这是一个列率，描述了当<semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">D=1</annotation></semantics>D=1时我们的表现。换句话说，气象学家感兴趣的是最小化FDP。
- en: 'So, in order to meet the meteorologist’s requirements, we need to compute the
    FDP from the quantities that the data scientists have provided us. This is precisely
    what the computation above using Bayes’ rule tells us. We’ll start by defining
    a function to compute FDP from TPR, FPR, and prevalence:'
  id: totrans-102
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，为了满足气象学家的要求，我们需要从数据科学家提供的数据中计算出FDP。这正是上述使用贝叶斯定理的计算所告诉我们的。我们将首先定义一个函数，用于从TPR、FPR和患病率中计算FDP：
- en: '[PRE7]'
  id: totrans-103
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: What is the FDP for the model when used in Miami?
  id: totrans-104
  prefs: []
  type: TYPE_NORMAL
  zh: 当模型在迈阿密使用时，FDP是多少？
- en: '[PRE8]'
  id: totrans-105
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: '`0.039603960396039604`'
  id: totrans-106
  prefs: []
  type: TYPE_NORMAL
  zh: '`0.039603960396039604`'
- en: 'This is quite small: in Miami, when we predict rain, we can expect to be right
    about <semantics><mrow><mn>96</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">96\%</annotation></semantics>96% of the time. What
    about in Berkeley?'
  id: totrans-107
  prefs: []
  type: TYPE_NORMAL
  zh: 这相当小：在迈阿密，当我们预测下雨时，我们可以期望大约<semantics><mrow><mn>96</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">96\%</annotation></semantics>96%的时间是正确的。那么在伯克利呢？
- en: '[PRE9]'
  id: totrans-108
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: '`0.8032454361054766`'
  id: totrans-109
  prefs: []
  type: TYPE_NORMAL
  zh: '`0.8032454361054766`'
- en: This tells us that in Berkeley in the summer, when we predict rain with this
    model, we can expect to be right only about <semantics><mrow><mn>20</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">20\%</annotation></semantics>20% of the time. Even
    though our model is over <semantics><mrow><mn>95</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">95\%</annotation></semantics>95% accurate in each
    case, the low prevalence of rain in Berkeley means that we have very few rainy
    days. This means that we have lots of opportunities for false positives (on dry
    days), and very few opportunities for true positives (on rainy days). Therefore,
    our false discovery proportion is quite high.
  id: totrans-110
  prefs: []
  type: TYPE_NORMAL
  zh: 这告诉我们，在伯克利夏天，当我们用这个模型预测下雨时，我们只能期望大约<semantics><mrow><mn>20</mn><mi mathvariant="normal">%</mi></mrow><annotation
    encoding="application/x-tex">20\%</annotation></semantics>20%的时间是正确的。尽管我们的模型在每个案例中都有超过<semantics><mrow><mn>95</mn><mi
    mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">95\%</annotation></semantics>95%的准确性，但伯克利雨的患病率很低意味着我们很少下雨。这意味着我们有大量机会出现假阳性（在干燥的日子里），而真正阳性（在下雨的日子里）的机会却很少。因此，我们的假发现比例相当高。
- en: 'We can also see this by analyzing the asymptotic behavior of the equation above:'
  id: totrans-111
  prefs: []
  type: TYPE_NORMAL
  zh: 我们也可以通过分析上述方程的渐近行为来看到这一点：
- en: <semantics><mrow><mi>F</mi><mi>D</mi><mi>P</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mi>T</mi><mi>P</mi><mi>R</mi></mrow><mrow><mi>F</mi><mi>P</mi><mi>R</mi></mrow></mfrac><mfrac><msub><mi>π</mi><mn>1</mn></msub><msub><mi>π</mi><mn>0</mn></msub></mfrac></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">FDP = \frac{1}{1 + \frac{TPR}{FPR} \frac{\pi_1}{\pi_0}}</annotation></semantics>FDP=1+FPRTPR​π0​π1​​1​[(5)](#yPVmdDcIV1
    "Link to this Equation")
  id: totrans-112
  prefs: []
  type: TYPE_NORMAL
  zh: <semantics><mrow><mi>F</mi><mi>D</mi><mi>P</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mi>T</mi><mi>P</mi><mi>R</mi></mrow><mrow><mi>F</mi><mi>P</mi><mi>R</mi></mrow></mfrac><mfrac><msub><mi>π</mi><mn>1</mn></msub><msub><mi>π</mi><mn>0</mn></msub></mfrac></mrow></mfrac></mrow><annotation
    encoding="application/x-tex">FDP = \frac{1}{1 + \frac{TPR}{FPR} \frac{\pi_1}{\pi_0}}</annotation></semantics>FDP=1+FPRTPR​π0​π1​​1​[(5)](#yPVmdDcIV1
    "链接到这个公式")
- en: As the prevalence <semantics><mrow><msub><mi>π</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">\pi_1</annotation></semantics>π1​ becomes very small
    (close to 0), the fraction <semantics><mrow><msub><mi>π</mi><mn>1</mn></msub><mi
    mathvariant="normal">/</mi><msub><mi>π</mi><mn>0</mn></msub></mrow><annotation
    encoding="application/x-tex">\pi_1/\pi_0</annotation></semantics>π1​/π0​ approaches
    0, and the FDP approaches <semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mo
    stretchy="false">(</mo><mn>1</mn><mo>+</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">1/(1+0) = 1</annotation></semantics>1/(1+0)=1.
  id: totrans-113
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 随着患病率<semantics><mrow><msub><mi>π</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">\pi_1</annotation></semantics>π1​变得非常小（接近0），分数<semantics><mrow><msub><mi>π</mi><mn>1</mn></msub><mi
    mathvariant="normal">/</mi><msub><mi>π</mi><mn>0</mn></msub></mrow><annotation
    encoding="application/x-tex">\pi_1/\pi_0</annotation></semantics>π1​/π0​趋近于0，FDP趋近于<semantics><mrow><mn>1</mn><mi
    mathvariant="normal">/</mi><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mn>0</mn><mo
    stretchy="false">)</mo><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">1/(1+0)
    = 1</annotation></semantics>1/(1+0)=1.
- en: As the prevalence <semantics><mrow><msub><mi>π</mi><mn>1</mn></msub></mrow><annotation
    encoding="application/x-tex">\pi_1</annotation></semantics>π1​ becomes very big
    (close to 1), the fraction <semantics><mrow><msub><mi>π</mi><mn>1</mn></msub><mi
    mathvariant="normal">/</mi><msub><mi>π</mi><mn>0</mn></msub></mrow><annotation
    encoding="application/x-tex">\pi_1/\pi_0</annotation></semantics>π1​/π0​ approaches
    <semantics><mrow><mi mathvariant="normal">∞</mi></mrow><annotation encoding="application/x-tex">\infty</annotation></semantics>∞,
    and the FDP approaches 0.
  id: totrans-114
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 随着患病率<semantics><mrow><msub><mi>π</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">\pi_1</annotation></semantics>π1​变得非常大（接近1），分数<semantics><mrow><msub><mi>π</mi><mn>1</mn></msub><mi
    mathvariant="normal">/</mi><msub><mi>π</mi><mn>0</mn></msub></mrow><annotation
    encoding="application/x-tex">\pi_1/\pi_0</annotation></semantics>π1​/π0​趋近于<semantics><mrow><mi
    mathvariant="normal">∞</mi></mrow><annotation encoding="application/x-tex">\infty</annotation></semantics>∞，FDP趋近于0。
- en: Similarly, we can see that larger values of the true positive rate (TPR) and
    smaller values of the false positive rate (FPR) lead to a lower false discovery
    proportion (FDP).
  id: totrans-115
  prefs: []
  type: TYPE_NORMAL
  zh: 同样，我们可以看到，真正阳性率（TPR）的较大值和假阳性率（FPR）的较小值会导致较低的假发现比例（FDP）。
- en: '[PRE10]'
  id: totrans-116
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: 'Different error types: is one worse than the other?[¶](#different-error-types-is-one-worse-than-the-other
    "Link to this Section")'
  id: totrans-117
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 不同的错误类型：哪一个更糟糕？[¶](#different-error-types-is-one-worse-than-the-other "链接到这个部分")
- en: False positives and false negatives are both errors. In general, we’d like to
    make as few errors as possible, but as we’ll see later, we often end up in situations
    where we must trade off between making more false positives and fewer false negatives,
    or vice versa. In such cases, it’s important to understand which one is preferable
    (or “less bad”).
  id: totrans-118
  prefs: []
  type: TYPE_NORMAL
  zh: 假阳性和假阴性都是错误。通常，我们希望犯的错误尽可能少，但正如我们稍后将会看到的，我们经常陷入必须在这两种错误之间权衡的情况，即更多的假阳性和更少的假阴性，或者反之。在这种情况下，了解哪一个更可取（或“更不好”）是很重要的。
- en: 'For example: suppose Spotify is trying to predict which customers will renew
    their subscriptions (1 corresponds to renewing, 0 corresponds to not renewing).
    For customers predicted to not renew, they plan to send a $1 coupon off their
    next month’s subscription. In this case:'
  id: totrans-119
  prefs: []
  type: TYPE_NORMAL
  zh: 例如：假设Spotify正在尝试预测哪些客户将续订他们的订阅（1表示续订，0表示不续订）。对于预测不会续订的客户，他们计划发送一张1美元的优惠券，用于下个月的订阅。在这种情况下：
- en: A false positive corresponds to predicting a customer will renew (and therefore
    not sending a coupon), but then the customer doesn’t renew (and Spotify loses
    a customer paying $12 per month, every month).
  id: totrans-120
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 假阳性对应于预测客户将续订（因此不发送优惠券），但随后客户没有续订（Spotify失去了一个每月支付12美元的客户）。
- en: A false negative corresponds to predicting a customer won’t renew (and therefore
    sending them a coupon), but then the customer would have renewed anyway (and so
    the coupon was unnecessary, costing Spotify $1).
  id: totrans-121
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 假阴性意味着预测客户不会续订（因此向他们发送优惠券），但客户实际上还是会续订（因此优惠券变得不必要，导致Spotify损失1美元）。
- en: 'In this example, we could probably argue that a false positive is worse than
    a false negative: a false negative means that Spotify will waste $1, but a false
    positive means that they will lose a paying customer who they might have been
    able to retain with a coupon.'
  id: totrans-122
  prefs: []
  type: TYPE_NORMAL
  zh: 在这个例子中，我们可能会认为假阳性比假阴性更糟糕：假阴性意味着Spotify会浪费1美元，但假阳性意味着他们将会失去一个付费客户，而这个客户他们本可以用优惠券留住。
