- en: Log Probabilities
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 对数概率
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part1/log_probabilities/](https://chrispiech.github.io/probabilityForComputerScientists/en/part1/log_probabilities/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part1/log_probabilities/](https://chrispiech.github.io/probabilityForComputerScientists/en/part1/log_probabilities/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: 'A log probability $\log \p(E)$ is simply the log function applied to a probability.
    For example if $\p(E) = 0.00001$ then $\log \p(E) = \log(0.00001) \approx -11.51$.
    Note that in this book, the default base is the natural base $e$. There are many
    reasons why log probabilities are an essential tool for digital probability: (a)
    computers can be rather limited when representing [very small numbers](https://en.wikipedia.org/wiki/Floating-point_arithmetic)
    and (b) logs have the wonderful ability to turn multiplication into addition,
    and computers are much faster at addition.'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 对数概率 $\log \p(E)$ 简单来说就是对数函数应用于概率。例如，如果 $\p(E) = 0.00001$，那么 $\log \p(E) = \log(0.00001)
    \approx -11.51$。注意，在这本书中，默认的底数是自然底数 $e$。对数概率之所以是数字概率的一个基本工具，有许多原因：(a) 计算机在表示[非常小的数](https://en.wikipedia.org/wiki/Floating-point_arithmetic)时可能相当有限；(b)
    对数有将乘法转换为加法的神奇能力，而计算机在加法上要快得多。
- en: 'You may have noticed that the log in the above example produced a negative
    number. Recall that $\log b = c$, with the implied natural base $e$ is the same
    as the statement $e ^ c = b$. It says that $c$ is the exponent of $e$ that produces
    $b$. If $b$ is a number between 0 and 1, what power should you raise $e$ to in
    order to produce $b$? If you raise $e^0$ it produces 1\. To produce a number less
    than 1, you must raise $e$ to a power less than 0\. That is a long way of saying:
    if you take the log of a probability, the result will be a negative number. $$
    \begin{align} 0 &\leq \p(E) \leq 1 && \text{Axiom 1 of probability} \\ -\infty
    &\leq \log \p(E) \leq 0 && \text{Rule for log probabilities} \end{align} $$'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 你可能已经注意到上述例子中的对数产生了负数。回想一下，$\log b = c$，其中隐含的自然底数 $e$ 与陈述 $e^c = b$ 是相同的。它说
    $c$ 是 $e$ 的指数，产生 $b$。如果 $b$ 是介于 0 和 1 之间的数，你应该将 $e$ 提到什么幂次才能产生 $b$？如果你将 $e^0$
    提到幂次，它会产生 1。要产生一个小于 1 的数，你必须将 $e$ 提到一个小于 0 的幂次。这就是说：如果你对一个概率取对数，结果将是一个负数。$$ \begin{align}
    0 &\leq \p(E) \leq 1 && \text{概率的第一公理} \\ -\infty &\leq \log \p(E) \leq 0 && \text{对数概率的规则}
    \end{align} $$
- en: Products become Addition
  id: totrans-5
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 产品成为加法
- en: 'The product of probabilities $\p(E)$ and $\p(F)$ becomes addition in logarithmic
    space: $$ \log (\p(E) \cdot \p(F) ) = \log \p(E) + \log \p(F) $$'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 概率 $\p(E)$ 和 $\p(F)$ 的乘积在对数空间中变为加法：$$ \log (\p(E) \cdot \p(F) ) = \log \p(E)
    + \log \p(F) $$
- en: 'This is especially convenient because computers are much more efficient when
    adding than when multiplying. It can also make derivations easier to write. This
    is especially true when you need to multiply many probabilities together: $$ \log
    \prod_i \p(E_i) = \sum_i \log \p(E_i) $$'
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 这特别方便，因为计算机在加法上比在乘法上更有效率。它还可以使推导更容易书写。这在你需要将许多概率相乘时尤其正确：$$ \log \prod_i \p(E_i)
    = \sum_i \log \p(E_i) $$
- en: Representing Very Small Probabilities
  id: totrans-8
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 表示非常小的概率
- en: Computers have the power to process many events and consider the probability
    of very unlikely situations. While computers are capable of doing all the computation,
    the floating point representation means that computers can not represent decimals
    to perfect precision. In fact, python is unable to represent any probability smaller
    than 2.225e-308\. On the other hand the log of that same number is -307.652 is
    very easy for a computer to store.
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 计算机具有处理许多事件并考虑非常不可能的情况的概率的能力。虽然计算机能够完成所有的计算，但浮点表示意味着计算机不能以完美的精度表示小数。实际上，Python
    无法表示小于 2.225e-308 的任何概率。另一方面，那个数字的对数是 -307.652，对计算机来说很容易存储。
- en: Why would you care? Often in the digital world, computers are asked to reason
    about the probability of data, or a whole dataset. For example, perhaps your data
    is words and you want to reason about the probability that a given author would
    write these specific words. While this probability is very small (we are talking
    about an exact document) it might be larger than the probability that a different
    author would write a specific document with specific words. For these sort of
    small probabilities, if you use computers, you would need to use log probabilities.
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 你为什么会关心这个问题呢？在数字世界中，计算机经常被要求对数据的概率进行推理，或者对整个数据集进行推理。例如，也许你的数据是单词，你想要推理一个特定的作者写出这些特定单词的概率。虽然这个概率非常小（我们谈论的是一个精确的文档），但它可能比不同作者用特定单词写出特定文档的概率要大。对于这类小的概率，如果你使用计算机，你将需要使用对数概率。
