- en: Serendipity
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 偶然
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/examples/serendipity/](https://chrispiech.github.io/probabilityForComputerScientists/en/examples/serendipity/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/examples/serendipity/](https://chrispiech.github.io/probabilityForComputerScientists/en/examples/serendipity/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '***'
- en: '![](../Images/980c7c4993ba0a002f5fce8a52a31edd.png)*The word serendipity comes
    from the Persian fairy tale of the [Three Princes of Serendip](https://en.wikipedia.org/wiki/The_Three_Princes_of_Serendip)*'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: '![图片](../Images/980c7c4993ba0a002f5fce8a52a31edd.png)“偶然”这个词来源于波斯童话故事《[三个幸运王子](https://en.wikipedia.org/wiki/The_Three_Princes_of_Serendip)》'
- en: Problem
  id: totrans-4
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 问题
- en: What is the probability of a seredipitous encounter with a friend? Imagine you
    are live in an area with a large general population (eg Stanford with 17,000 students).
    A small subset of the population are friends. What are the chances that you run
    into at least one friend if you see a handful of people from the population? Assume
    that seeing each person from the population is equally likely.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 与朋友偶然相遇的概率是多少？想象你生活在一个拥有大量普通人口（例如，有 17,000 名学生的斯坦福大学）。人口中有一小部分是你的朋友。如果你从这个人口中看到一些人，你遇到至少一个朋友的机会有多大？假设从人口中看到每个人都是等可能的。
- en: '* * *'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: '***'
- en: Answer
  id: totrans-7
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 答案
- en: 'The probability that you see at least one friend is:'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 你看到至少一个朋友的概率是：
- en: Terms
  id: totrans-9
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 术语
- en: 'First lets define some useful terms:'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 首先，让我们定义一些有用的术语：
- en: $p$ = total population = $s$ = people seen = $f$ = num friends =
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: $p$ = 总人口 = $s$ = 看到的人数 = $f$ = 朋友数量 =
- en: '* * *'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: '***'
- en: Approach
  id: totrans-13
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 方法
- en: 'Since each way of seeing $s$ people is equally likely, we can use the "[Equally
    Likely Events](//web.stanford.edu/class/cs109/pdfs/HO06 Probability.pdf)" probability
    calculation:'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 由于看到 $s$ 个人的每一种方式都是等可能的，我们可以使用“[等可能事件](//web.stanford.edu/class/cs109/pdfs/HO06
    Probability.pdf)”概率计算方法：
- en: $P(E) = \frac{|E|}{|S|}$
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: $P(E) = \frac{|E|}{|S|}$
- en: Where $S$ is the sample set (all the ways of seing $s$ people) and $E$ is the
    event set (all the ways of seing $s$ people where at least one is a friend).
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 其中 $S$ 是样本集（所有看到 $s$ 个人的方式）和 $E$ 是事件集（所有看到 $s$ 个人的方式，其中至少有一个人是朋友）。
- en: One way to approach this problem is to directly count all ways you see 1 or
    more friends. That is hard. You would have to count the ways you could see exactly
    one friend, then exactly two friends and so on. It is much easier to calculate
    the ways that you see zero friends. If we can calculate the probability of seeing
    zero friends our answer is just one minus that number.
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 解决这个问题的方法之一是直接计算你看到 1 个或更多朋友的所有方式。这很困难。你需要计算你看到正好一个朋友的方式，然后是正好两个朋友，以此类推。计算你没有看到朋友的方式要容易得多。如果我们能计算出看到零个朋友的概率，我们的答案就是那个数字减去
    1。
- en: '* * *'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: '***'
- en: Prob that you don't see friends
  id: totrans-19
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 没有看到朋友的概率
- en: 'Let the sample space ($S$) be the set of ways that you could see $s$ people.
    The size of the sample space is: the total population choose the number of people
    seen.'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 让样本空间 ($S$) 是你可以看到 $s$ 个人的方式集合。样本空间的大小是：总人口中选择看到的人数。
- en: 'The event space ($E$) is the set of ways that you could see no friends. The
    size of the event space is: the number of non friends (aka population - friends)
    choose the number of people seen.'
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 事件空间 ($E$) 是你可以看到没有朋友的方式集合。事件空间的大小是：非朋友的数量（即人口 - 朋友）中选择看到的人数。
- en: 'Thus the probability of not seeing a friend is:'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，没有看到朋友的概率是：
- en: $\text{prob(not seen)} = \frac{ \left( {\begin{array}{*{20}c} p - f \\ s \\
    \end{array}} \right) } { \left( {\begin{array}{*{20}c} p \\ s \\ \end{array}}
    \right) } $
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: $\text{prob(not seen)} = \frac{ \left( {\begin{array}{*{20}c} p - f \\ s \\
    \end{array}} \right) } { \left( {\begin{array}{*{20}c} p \\ s \\ \end{array}}
    \right) } $
- en: '* * *'
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: '***'
- en: Prob that you see friends
  id: totrans-25
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 看到朋友的概率
- en: Now the probability that you see at least one friend is 1 minus the probability
    that you see no friends.
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 现在，你看到至少一个朋友的概率是 1 减去你没有看到朋友的概率。
- en: $\text{prob(seen)} = 1 - \frac{ \left( {\begin{array}{*{20}c} p - f \\ s \\
    \end{array}} \right) } { \left( {\begin{array}{*{20}c} p \\ s \\ \end{array}}
    \right) } $
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: $\text{prob(seen)} = 1 - \frac{ \left( {\begin{array}{*{20}c} p - f \\ s \\
    \end{array}} \right) } { \left( {\begin{array}{*{20}c} p \\ s \\ \end{array}}
    \right) } $
- en: That is equal to
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 那等于
- en: '* * *'
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: '***'
- en: Isn't that suprising?
  id: totrans-30
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 这不是令人惊讶的吗？
