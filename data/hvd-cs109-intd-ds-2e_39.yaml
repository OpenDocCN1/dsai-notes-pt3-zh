- en: 8  Sampling Models and the Central Limit Theorem
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 8  抽样模型和中心极限定理
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/prob/sampling-models-and-clt.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/prob/sampling-models-and-clt.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/prob/sampling-models-and-clt.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/prob/sampling-models-and-clt.html)
- en: '[Probability](../prob/intro-to-prob.html)'
  id: totrans-2
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[概率](../prob/intro-to-prob.html)'
- en: '[8  Sampling Models and the Central Limit Theorem](../prob/sampling-models-and-clt.html)'
  id: totrans-3
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[8  抽样模型和中心极限定理](../prob/sampling-models-and-clt.html)'
- en: In the previous chapter, we introduced random variables and saw how their distributions,
    expected values, and standard errors describe uncertainty. In this chapter, we
    build on those ideas by introducing *sampling models*, which are mathematical
    abstractions of how data are generated. We then use the Central Limit Theorem
    (CLT) to approximate the distribution of sums and averages of independent draws.
    Through a concrete example based on playing roulette in a casino, we show how
    the CLT can be used to answer practical questions such as “What is the chance
    of losing money?”
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 在上一章中，我们介绍了随机变量，并看到了它们的分布、期望值和标准误差如何描述不确定性。在本章中，我们通过引入**抽样模型**来构建这些想法，这些模型是数据生成过程的数学抽象。然后我们使用中心极限定理（CLT）来近似独立抽取的总和和平均值的分布。通过基于在赌场玩轮盘赌的具体例子，我们展示了如何使用CLT来回答诸如“输钱的可能性有多大？”等实际问题。
- en: 8.1 Sampling models
  id: totrans-5
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 8.1 抽样模型
- en: 'Many data-generating processes can be effectively modeled as *draws from an
    urn*. For example, polling likely voters can be viewed as drawing 0s (Republicans)
    and 1s (Democrats) from an urn containing the preferences of the entire population.
    In epidemiology, we often assume that individuals in a study are random draws
    from a larger population, where each draw corresponds to an individual’s outcome.
    Similarly, in experimental research, we treat subjects (worms, flies, mice, or
    humans, for exmaple) as random draws from a broader population. Randomized experiments
    follow the same logic: each participant’s assignment to treatment or control can
    be seen as a random draw from an urn.'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 许多数据生成过程可以有效地建模为从**抽屉中抽取**。例如，对可能投票者的民意调查可以看作是从包含整个人口偏好的抽屉中抽取0（共和党人）和1（民主党人）。在流行病学中，我们通常假设研究中的个体是从更大的群体中随机抽取的，其中每个抽取对应于个体的结果。同样，在实验研究中，我们将受试者（如蠕虫、苍蝇、老鼠或人类，例如）视为从更广泛的群体中随机抽取的。随机实验遵循相同的逻辑：每个参与者分配到治疗或对照组可以看作是从抽屉中随机抽取。
- en: Because random sampling and random assignment are fundamental to data analysis,
    *sampling models* appear everywhere in statistics. To build intuition, we start
    with *games of chance*, where randomness is explicit and the link between probability
    and real outcomes is perfectly clear. We now define a specific example.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 由于随机抽样和随机分配是数据分析的基础，**抽样模型**在统计学中无处不在。为了建立直观感觉，我们从一个**机会游戏**开始，其中随机性是明确的，概率与实际结果之间的联系是完美的。我们现在定义一个具体的例子。
- en: Roullete example
  id: totrans-8
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 轮盘赌例子
- en: Suppose a small casino hires you to decide whether it should install roulette
    wheels. To keep things simple, imagine 1,000 people each place a single bet on
    black. The casino wants you to estimate how much money it can expect to make,
    or lose, and, most importantly, the probability of losing money. If that probability
    is too high, they’ll skip installing the wheels.
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 假设一家小赌场雇佣你来决定它是否应该安装轮盘赌。为了简化问题，想象1,000个人每人下注一次黑。赌场希望你估计它能期望赚多少钱，或者会损失多少钱，最重要的是，输钱的可能性。如果这个可能性太高，他们将放弃安装轮盘赌。
- en: 'We define a random variable \(S_n\) to represent the casino’s total winnings
    after \(n\) games. A roulette wheel has 18 red pockets, 18 black pockets, and
    2 green ones. The outcome is equivalent to drawing a ball from this urn:'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 我们定义一个随机变量 \(S_n\) 来表示在 \(n\) 场游戏后赌场的总赢利。一个轮盘有18个红色口袋，18个黑色口袋和2个绿色口袋。结果等同于从这个抽屉中抽取一个球：
- en: '[PRE0]'
  id: totrans-11
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: '*Each of the 1,000 outcomes is an independent draw from this urn. If black
    comes up, the gambler wins and the casino loses $1 (recorded as −1). Otherwise,
    the casino wins $1.'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: '*每个1,000个结果都是从这个抽屉中独立抽取的。如果出现黑色，赌徒赢，赌场输1美元（记录为-1）。否则，赌场赢1美元。'
- en: '[PRE1]'
  id: totrans-13
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: '*Since we already know the proportions of 1s and −1s, we can simplify:'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: '*既然我们已经知道了1和-1的比例，我们可以简化：'
- en: '[PRE2]'
  id: totrans-15
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: '*We call this a *sampling model* because it represents random behavior through
    repeated sampling from an urn. The casino’s total winnings, define it as \(S_n\),
    are simply the sum of these independent draws:'
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: '*我们称之为*采样模型*，因为它通过从容器中重复抽取来表示随机行为。赌场的总赢利，定义为 \(S_n\)，仅仅是这些独立抽取的总和：'
- en: '[PRE3]'
  id: totrans-17
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: '*Before deriving the distribution of total winnings \(S_n\), it’s worth pausing
    to ask *why* we study problems like roulette in the first place.****'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: '*在推导总赢利分布 \(S_n\) 之前，值得停下来问问我们最初为什么研究像轮盘赌这样的问题。****'
- en: '***Connecting sampling models to real data***'
  id: totrans-19
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '***将采样模型与实际数据联系起来***'
- en: '***Thinking in terms of a sampling model is central to data analysis under
    uncertainty. It connects the random variables we study in probability to the datasets
    we analyze in practice. By imagining data as random draws, from an urn, a population,
    or a randomization procedure, we clarify what our models represent and what assumptions
    they rely on.'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: '***在不确定性数据分析中，从采样模型的角度思考是至关重要的。它将我们在概率中研究的随机变量与我们实际分析的数据集联系起来。通过将数据想象为从容器、群体或随机化程序中抽取的随机抽取，我们阐明了我们的模型代表什么以及它们依赖于哪些假设。***'
- en: This perspective also underpins much of modern statistics. Tools like confidence
    intervals, hypothesis tests, and regression all depend on assumptions derived
    from sampling models. Understanding these assumptions helps us apply these methods
    thoughtfully and recognize their limits.
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 这种观点也支撑了现代统计学的大部分内容。像置信区间、假设检验和回归这样的工具都依赖于从采样模型中推导出的假设。理解这些假设有助于我们深思熟虑地应用这些方法，并认识到它们的局限性。
- en: Casino games make these ideas tangible because their sampling models are fully
    known. The probabilities, such as the number of red, black, and green pockets,
    are explicit and easy to simulate. In contrast, real-world data come from more
    complex “urns”, such as populations of individuals with varying heights, incomes,
    or health outcomes. When we collect data, we are effectively drawing a random
    sample from such a population.
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 赌场游戏使这些想法变得具体，因为它们的采样模型是完全已知的。例如，红色、黑色和绿色口袋的数量是明确的，并且容易模拟。相比之下，现实世界的数据来自更复杂的“容器”，例如身高、收入或健康结果各不相同的人群。当我们收集数据时，我们实际上是从这样的群体中抽取一个随机样本。
- en: 'This way of thinking builds statistical intuition: every dataset represents
    a sample from some underlying process, and the validity of our conclusions depends
    on how well our assumptions about that process hold.***'
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 这种思维方式构建了统计直觉：每个数据集代表某个潜在过程的样本，我们结论的有效性取决于我们对该过程的假设有多好。***
- en: '***8.2 A Monte Carlo Simulation***'
  id: totrans-24
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '***8.2 蒙特卡洛模拟***'
- en: '***To find the probability that the casino loses money, we need to estimate
    the distribution of \(S_n\). In the language of probability, this is \(\Pr(S_n
    < 0)\). If we define the distribution function \(F(a) = \Pr(S_n \leq a)\), we
    can answer any question about probabilities involving \(S_n\).'
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: '***为了找到赌场亏损的概率，我们需要估计 \(S_n\) 的分布。在概率的语言中，这是 \(\Pr(S_n < 0)\)。如果我们定义分布函数 \(F(a)
    = \Pr(S_n \leq a)\)，我们就可以回答任何关于 \(S_n\) 概率的任何问题。***'
- en: 'We can estimate \(F(a)\) with a Monte Carlo simulation, generating many realizations
    of \(S_n\). The following code simulates 1,000 people playing roulette and repeats
    the process 100,000 times:'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以通过蒙特卡洛模拟来估计 \(F(a)\)，生成许多 \(S_n\) 的实现。以下代码模拟了1,000人玩轮盘赌，并重复了100,000次这个过程：
- en: '[PRE4]'
  id: totrans-27
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: '*The fraction of simulations in which \(S_n \leq a\) approximates \(F(a)\):'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: '*在模拟中，\(S_n \leq a\) 的比例近似于 \(F(a)\)：'
- en: '[PRE5]'
  id: totrans-29
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: '*For instance, the probability of losing money is:'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: '*例如，亏损的概率是：'
- en: '[PRE6]'
  id: totrans-31
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: '*A histogram and qqplot of \(S_n\) shows that the distribution is approximately
    normal, an observation that the **Central Limit Theorem** will soon explain.'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: '*\(S_n\) 的直方图和qqplot显示分布近似正态分布，这是一个**中心极限定理**很快将解释的观察结果。'
- en: '![](../Images/81fda875a17883eb3170b8d81954f5a6.png)******'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: '![](../Images/81fda875a17883eb3170b8d81954f5a6.png)******'
- en: '***8.3 The Central Limit Theorem***'
  id: totrans-34
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '***8.3 中心极限定理***'
- en: '***The Central Limit Theorem (CLT) states that when the number of draws (the
    *sample size*) is large, the distribution of the sum of independent draws is approximately
    normal. Because sampling models describe so many data-generating processes, the
    CLT is one of the most important results in statistics.'
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: '***中心极限定理（CLT）表明，当抽取次数（样本大小）很大时，独立抽取之和的分布近似正态分布。由于采样模型描述了如此多的数据生成过程，CLT 是统计学中最重要的结果之一。'
- en: 'In the roulette example, the urn contains 20 $1 gains and 18 $1 losses, giving
    an expected value of:'
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 在轮盘赌的例子中，容器包含20美元的收益和18美元的损失，期望值为：
- en: \[ \mathrm{E}[X] = (20 -18)/38 = 1/19 \approx 0.05. \]
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mathrm{E}[X] = (20 -18)/38 = 1/19 \approx 0.05. \]
- en: In general, for two possible outcomes \(a\) and \(b\) with probabilities \(p\)
    and \((1-p)\),
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: 一般而言，对于两个可能的结果 \(a\) 和 \(b\) 以及概率 \(p\) 和 \((1-p)\)，
- en: \[ \mathrm{E}[X] = ap + b(1-p). \]
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mathrm{E}[X] = ap + b(1-p). \]
- en: 'By the properties introduced in [Section 7.5](random-variables.html#sec-key-properties),
    the expected total winnings are:'
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 根据第7.5节中引入的性质，期望总收益为：
- en: \[ \mathrm{E}[S_n] = n\,\mathrm{E}[X]. \]
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mathrm{E}[S_n] = n\,\mathrm{E}[X]. \]
- en: So if 1,000 people play, the casino expects to win about $50 on average.
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，如果有1000人玩，赌场预计平均会赢大约50美元。
- en: 'To quantify uncertainty, we compute the standard error, which measures how
    much \(S_n\) varies around its expected value. For an urn with two outcomes \(a\)
    and \(b\), the standard deviation can be shown to be:'
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: 为了量化不确定性，我们计算标准误差，它衡量 \(S_n\) 围绕其期望值的波动程度。对于一个有两个结果 \(a\) 和 \(b\) 的罐子，标准差可以证明为：
- en: \[ \mathrm{SE}[X] = |b - a|\sqrt{p(1-p)}. \]
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mathrm{SE}[X] = |b - a|\sqrt{p(1-p)}. \]
- en: 'In the roulette example we obtain:'
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: 在轮盘赌的例子中，我们得到：
- en: '[PRE7]'
  id: totrans-46
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: '*Thus, the standard error of the sum is:'
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: '*因此，总和的标准误差为：'
- en: \[ \mathrm{SE}[S_n] = \sqrt{n}\,\mathrm{SD}[X], \]
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mathrm{SE}[S_n] = \sqrt{n}\,\mathrm{SD}[X], \]
- en: 'which in this case is:'
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: 在这种情况下是：
- en: '[PRE8]'
  id: totrans-50
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: '*These theoretical values agree closely with the Monte Carlo results:'
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: '*这些理论值与蒙特卡洛结果非常吻合：'
- en: '[PRE9]'
  id: totrans-52
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: '*Using the CLT, we can now compute the probability that the casino loses money
    without simulation:'
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: '*使用中心极限定理（CLT），我们现在可以计算赌场不亏损的概率，而无需模拟：'
- en: '[PRE10]'
  id: totrans-54
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: '*which matches our earlier estimate:'
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: '*这与我们之前的估计相匹配：'
- en: '[PRE11]'
  id: totrans-56
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: '**The quantity \((S_n + n)/2\) represents the number of wins for the casino
    and follows a *binomial distribution*. Thus, the probability \(\Pr(S_n < 0)\)
    can also be computed directly:'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: '**量 \((S_n + n)/2\) 代表赌场的获胜次数，并遵循**二项分布**。因此，可以直接计算 \(\Pr(S_n < 0)\) 的概率：'
- en: '[PRE12]'
  id: totrans-58
  prefs: []
  type: TYPE_PRE
  zh: '[PRE12]'
- en: '*However, the binomial result applies only to Bernoulli trials. In many real-world
    settings, data are not binomial, yet we still want to approximate the distribution
    of sums or averages. For those cases, the CLT provides a general framework that
    extends far beyond Bernoulli trials.**********'
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，二项式结果仅适用于伯努利试验。在许多现实世界的场景中，数据并非二项式分布，但我们仍然希望近似总和或平均值的分布。对于这些情况，中心极限定理（CLT）提供了一个超越伯努利试验的通用框架。**********
- en: '****8.4 How large is large?****'
  id: totrans-60
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '****8.4 多大才算大？****'
- en: '****The CLT applies when the number of draws is “large”, but *large* depends
    on context. In many cases, 30 draws are enough for a good approximation, sometimes
    even fewer. In the roullette example, when the probabilities of success is very
    small, much larger samples may be required.'
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: '****中心极限定理（CLT）适用于抽取次数“大”时，但“大”取决于上下文。在许多情况下，30次抽取就足够得到良好的近似，有时甚至更少。在轮盘赌的例子中，当成功的概率非常小的时候，可能需要更大的样本。'
- en: For example, in a lottery where the chance of winning is less than one in a
    million, even millions of tickets result in only a few winners. In such highly
    skewed cases, the *Poisson distribution* offers a better approximation than the
    normal. While we do not cover its theory here, it is discussed in most probability
    textbooks and on [Wikipedia](https://en.wikipedia.org/wiki/Poisson_distribution).
    You can explore the Poisson distribution in R with `dpois`, `ppois`, and `rpois`.
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，在一个中奖概率小于百万分之一的彩票中，即使有数百万张彩票，也只会产生少数几个赢家。在这种情况下，**泊松分布**比正态分布提供了更好的近似。虽然我们在这里不涉及其理论，但它通常在概率论教科书中以及维基百科[泊松分布](https://en.wikipedia.org/wiki/Poisson_distribution)上讨论。您可以使用R中的`dpois`、`ppois`和`rpois`探索泊松分布。
- en: 'In summary, the CLT explains why the normal distribution appears so often in
    statistics and why many methods work well in practice. But it has limits: when
    probabilities are extremely small or distributions are highly skewed, other models,
    such as the Poisson or binomial, are more appropriate. Developing intuition for
    when the CLT applies is essential for principled, thoughtful data analysis.****'
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: 总结来说，中心极限定理（CLT）解释了为什么正态分布在统计学中如此常见，以及为什么许多方法在实践中效果良好。但CLT也有局限性：当概率极小或分布高度偏斜时，其他模型，如泊松分布或二项分布，可能更合适。对CLT何时适用有直觉是进行原则性、深思熟虑的数据分析的关键。****
- en: '****8.5 Exercises****'
  id: totrans-64
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '****8.5 练习****'
- en: '****1\. In American Roulette, you can also bet on green. There are 18 reds,
    18 blacks, and 2 greens (0 and 00). Create a random variable \(S_n\) that is the
    sum of your winnings after betting on green 1,000 times.'
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
  zh: '****1\. 在美国轮盘赌中，你也可以赌绿色。有18个红色，18个黑色和2个绿色（0和00）。创建一个随机变量 \(S_n\)，表示你赌绿色1000次后的总收益。'
- en: 2\. Compute the expected value of \(S_n\)?
  id: totrans-66
  prefs: []
  type: TYPE_NORMAL
  zh: 2\. 计算 \(S_n\) 的期望值？
- en: 3\. Compute the standard error of \(S_n\)?
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
  zh: 3. 如何计算 \(S_n\) 的标准误差？
- en: '4\. Use the CLT to estimate the probability that you end up winning money?
    Hint: Use the CLT.'
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
  zh: 4. 使用 CLT 估计你最终赢钱的概率？提示：使用 CLT。
- en: 5\. Create a Monte Carlo simulation that generates 10,000 outcomes of \(S_n\).
    Compute the average and standard deviation of the resulting list to confirm the
    results of 2 and 3\. Start your code by setting the seed to 1 with `set.seed(1)`.
  id: totrans-69
  prefs: []
  type: TYPE_NORMAL
  zh: 5. 创建一个生成 10,000 个 \(S_n\) 结果的蒙特卡洛模拟。计算结果列表的平均值和标准差以确认 2 和 3 的结果。开始你的代码时，使用
    `set.seed(1)` 将种子设置为 1。
- en: 6\. Now check your answer to 4 using the Monte Carlo result.
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
  zh: 6. 现在用蒙特卡洛结果检查你的 4 的答案。
- en: 7\. The Monte Carlo result and the CLT approximation are close, but not that
    close. What could account for this?
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: 7. 蒙特卡洛结果和 CLT 近似很接近，但并不那么接近。这可能是怎么回事？
- en: 10,000 simulations is not enough. If we do more, they match.
  id: totrans-72
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 10,000 次模拟还不够。如果我们做得更多，它们就会匹配。
- en: The CLT does not work as well when the probability of success is small. In this
    case, it was 1/19\. If we make the number of roulette plays bigger, they will
    match better.
  id: totrans-73
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 当成功的概率较小时，CLT 工作得不是很好。在这种情况下，它是 1/19。如果我们使轮盘赌的次数更多，它们会更好地匹配。
- en: The difference is within rounding error.
  id: totrans-74
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 差异在舍入误差范围内。
- en: The CLT only works for averages.
  id: totrans-75
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: CLT 只适用于平均值。
- en: Now create a random variable \(\bar{X}_n\) that is your average winnings per
    bet defined as \(X_n = S_n/n\). Keep \(n\) = 1,000.
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: 现在创建一个随机变量 \(\bar{X}_n\)，它是每场赌注的平均收益，定义为 \(X_n = S_n/n\)。保持 \(n\) = 1,000。
- en: 8\. What is the expected value of \(\bar{X}_n\)?
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: 8. \(\bar{X}_n\) 的期望值是多少？
- en: 9\. What is the standard error of \(\bar{X}_n\)?
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: 9. \(\bar{X}_n\) 的标准误差是多少？
- en: '10\. What is the probability that you end up with winnings per game that are
    positive? Hint: Use the CLT.'
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
  zh: 10. 你最终每场比赛的收益为正的概率是多少？提示：使用 CLT。
- en: 11\. Create a Monte Carlo simulation that generates 25,000 outcomes of \(\bar{X}_n\),
    instead of \(1,000\). Compute the average and standard deviation of the resulting
    list to confirm the results of 13 and 14\. Start your code by setting the seed
    to 1 with `set.seed(1)`.
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
  zh: 11. 创建一个蒙特卡洛模拟，生成 25,000 个 \(\bar{X}_n\) 的结果，而不是 1,000 个。计算结果列表的平均值和标准差以确认 13
    和 14 的结果。开始你的代码时，使用 `set.seed(1)` 将种子设置为 1。
- en: 12\. Now compare your answer to 14 using the Monte Carlo result. What can you
    say about the CLT approximation for \(\mathrm{Pr}(\bar{X}_n>0)\) compared for
    \(\mathrm{Pr}(S_n>0)\).
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
  zh: 12. 现在将你的答案与 14 使用蒙特卡洛结果进行比较。你能对 \(\mathrm{Pr}(\bar{X}_n>0)\) 与 \(\mathrm{Pr}(S_n>0)\)
    的 CLT 近似进行比较吗？
- en: We are now computing averages instead of sums so they are very different.
  id: totrans-82
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我们现在正在计算平均值而不是总和，所以它们非常不同。
- en: 25,000 Monte Carlo simulations is not better than 10,000 and provides a much
    closer estimate.
  id: totrans-83
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 25,000 次蒙特卡洛模拟并不比 10,000 次好，并且提供了更接近的估计。
- en: The CLT works better when the sample size is larger. We increased from 10,000
    to 25,000.
  id: totrans-84
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 当样本量较大时，CLT 工作得更好。我们从 10,000 增加到 25,000。
- en: The difference is within rounding error.
  id: totrans-85
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 差异在舍入误差范围内。
- en: The following exercises are inspired by the events surrounding the financial
    crisis of 2007-2008[¹](#fn1). This financial crisis was in part caused by underestimating
    the risk of certain securities[²](#fn2) sold by financial institutions. Specifically,
    the risks of mortgage-backed securities (MBS) and collateralized debt obligations
    (CDO) were grossly underestimated. These assets were sold at prices that assumed
    most homeowners would make their monthly payments, and the probability of this
    not occurring was calculated as being low. A combination of factors resulted in
    many more defaults than were expected, which led to a price crash of these securities.
    As a consequence, banks lost so much money that they required government bailouts
    to avoid complete closure.
  id: totrans-86
  prefs: []
  type: TYPE_NORMAL
  zh: 以下练习受到了 2007-2008 年金融危机周围事件的影响[¹](#fn1)。这场金融危机部分是由金融机构出售的某些证券的风险被低估造成的。具体来说，抵押贷款支持证券（MBS）和担保债务凭证（CDO）的风险被严重低估。这些资产以假设大多数房主会按时支付月供的价格出售，而这种情况不会发生的概率被计算为很低。一系列因素导致违约数量远多于预期，这导致了这些证券的价格暴跌。因此，银行损失了大量资金，需要政府救助以避免完全关闭。
- en: 13\. More complex versions of the sampling models we have discussed are also
    used by banks to determine interest rates and insurance companies to determine
    premiums. To understand this, suppose you run a small bank that has a history
    of identifying potential homeowners that can be trusted to make payments. In fact,
    historically, only 2% of your customers default in a given year, meaning that
    they don’t pay back the money that you lent them. Suppose your bank will give
    out \(n\) = 1,000 loans for $180,000 this year. Also, after adding up all costs,
    suppose your bank loses \(l\)= $200,000 per foreclosure. For simplicity, we assume
    this includes all operational costs. What is the expected profit \(S_n\) for you
    bank under this scenario?
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: 13. 我们讨论过的采样模型更复杂版本也被银行用来确定利率，以及保险公司用来确定保费。为了理解这一点，假设你经营一家小银行，该银行有识别出可以信赖支付款项的潜在房主的记录。事实上，从历史数据来看，你只有2%的客户在特定年份违约，这意味着他们没有偿还你借给他们的钱。假设你的银行今年将发放
    \(n\) = 1,000 份贷款，总额为180,000美元。此外，在加上所有成本后，假设你的银行每笔房屋查封损失 \(l\) = 200,000美元。为了简化，我们假设这包括所有运营成本。在这种情况下，你银行的预期利润
    \(S_n\) 是多少？
- en: 14\. Note that the total loss defined by the final sum in the previous exercise
    is a random variable. Every time you run the sampling model code, you obtain a
    different number of people defaulting which results in a different loss. Code
    a sampling model for the random variable representing your banks profit \(S_n\)
    under scenario described in 13.
  id: totrans-88
  prefs: []
  type: TYPE_NORMAL
  zh: 14. 注意，之前练习中定义的总损失是由最终求和得到的，这是一个随机变量。每次你运行采样模型代码时，你都会得到不同数量的违约人数，从而导致不同的损失。编写一个采样模型来表示你在第13节描述的场景下银行利润
    \(S_n\) 的随机变量。
- en: 15\. The previous exercise demonstrates that if you simply loan money to everybody
    without interest, you will end up losing money due to the 2% that defaults. Although
    you know 2% of your clients will probably default, you don’t know which ones,
    so you can’t remove them. Yet by charging everybody just a bit extra in interest,
    you can make up the losses incurred due to that 2%, and also cover your operating
    costs. What quantity \(x\) would you have to charge each borrower so that your
    bank’s expected profit is 0? Assume that you don’t get \(x\) from the borrowers
    that default. Also, note \(x\) is not the interest rate, but the total you add
    meaning \(x/180000\) is the *interest rate*.
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
  zh: 15. 之前的练习表明，如果你只是无息贷款给每个人，你最终会因为2%的违约者而亏损。尽管你知道2%的客户可能会违约，但你不知道是哪些客户，因此你不能将他们剔除。然而，通过向每个人收取一点点额外的利息，你可以弥补由于这2%造成的损失，并覆盖你的运营成本。你需要向每个借款人收取多少数量
    \(x\)，才能使你银行的预期利润为0？假设你不会从违约的借款人那里得到 \(x\)。此外，请注意 \(x\) 不是利率，而是你额外收取的总金额，即 \(x/180000\)
    是*利率*。
- en: 16\. Rewrite the sample model from exercise 14 to account for the interest you
    are charging and run a Monte Carlo simulation to get an idea of the distribution
    of your profit when you charge interest rates.
  id: totrans-90
  prefs: []
  type: TYPE_NORMAL
  zh: 16. 将练习14中的样本模型重写，以考虑你收取的利息，并运行蒙特卡洛模拟，以了解当你收取不同利率时利润的分布情况。
- en: 17\. We don’t actually need a Monte Carlo simulation. Based on what we have
    learned, the CLT informs us that, since our losses are a sum of independent draws,
    its distribution is approximately normal. What are the expected value and standard
    errors of the profit \(S_n\)? Write these as functions of the probability of foreclosure
    \(p\), the number of loans \(n\), the loss per foreclosure \(l\), and the quantity
    you charge each borrower \(x\).
  id: totrans-91
  prefs: []
  type: TYPE_NORMAL
  zh: 17. 我们实际上不需要蒙特卡洛模拟。根据我们所学到的，中心极限定理（CLT）告诉我们，由于我们的损失是独立抽取的总和，其分布大约是正态分布。利润 \(S_n\)
    的期望值和标准误差是多少？将这些值表示为查封概率 \(p\)、贷款数量 \(n\)、每笔查封损失 \(l\) 以及你向每个借款人收取的数量 \(x\) 的函数。
- en: 18\. If you set \(x\) to assure your bank breaks even (expected profit is 0),
    what is the probability that your bank loses money?
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: 18. 如果你将 \(x\) 设置为使你的银行收支平衡（预期利润为0），那么你的银行亏损的概率是多少？
- en: '19\. Suppose that if your bank has negative profit, it has to close. Therefore,
    you need to increase \(x\) to minimize this risk. However, setting the interest
    rates too high may lead your clients to choose another bank. So, let’s say that
    we want our chances of losing money to be 1 in 100\. What does the \(x\) quantity
    need to be now? Hint: We want \(\mathrm{Pr}(S_n<0) = 0.01\). Note that you can
    add subtract constants to both side of an inequality, and the probability does
    not change: \(\mathrm{Pr}(S_n<0) = \mathrm{Pr}(S_n+k<0+k)\), Similarly, with division
    of positive constants: \(\mathrm{Pr}(S_n+k<0+k) = \mathrm{Pr}((S_n+k)/m <k/m)\).
    Use this fact and the CLT to transform the left side of the inequality in \(\mathrm{Pr}(S_n<0)\)
    into a standard normal.'
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: 19. 假设如果你的银行有负利润，它就必须关闭。因此，你需要提高 \(x\) 来最小化这种风险。然而，设定过高的利率可能会导致你的客户选择另一家银行。所以，让我们说，我们希望亏损的概率是
    1 比 100。现在 \(x\) 的数量需要是多少？提示：我们希望 \(\mathrm{Pr}(S_n<0) = 0.01\)。注意，你可以向不等式的两边添加或减去常数，概率不会改变：\(\mathrm{Pr}(S_n<0)
    = \mathrm{Pr}(S_n+k<0+k)\)，同样，用正常数的除法：\(\mathrm{Pr}(S_n+k<0+k) = \mathrm{Pr}((S_n+k)/m
    <k/m)\)。使用这个事实和中心极限定理（CLT）将 \(\mathrm{Pr}(S_n<0)\) 中的不等式左侧转换为标准正态分布。
- en: 20\. Our interest rate now increases. But it is still a very competitive interest
    rate. For the \(x\) you obtained in exercise 20, what is expected profit per loan
    and the expected total profit?
  id: totrans-94
  prefs: []
  type: TYPE_NORMAL
  zh: 20. 我们现在的利率提高了。但这仍然是一个非常具有竞争力的利率。对于你在第 20 题中获得的 \(x\)，每笔贷款的预期利润和预期总利润是多少？
- en: 21\. Run run a Monte Carlo simulation to double check the theoretical approximation
    used in 19 and 20.
  id: totrans-95
  prefs: []
  type: TYPE_NORMAL
  zh: 21. 运行一个蒙特卡洛模拟来双重检查 19 和 20 中使用的理论近似。
- en: 22\. One of your employees points out that, since the bank is making a profit
    per loan, the bank should give out more loans! Why limit it to just \(n\)? You
    explain that finding those \(n\) clients was work. You need a group that is predictable
    and that keeps the chances of defaults low. The employee then points out that
    even if the probability of default is higher, as long as our expected value is
    positive, you can minimize your chances of losses by increasing \(n\) and relying
    on the law of large numbers. Suppose the default probability is twice as high,
    or 4%, and you set the interest rate to 5%, or \(x\) = $9,000, what is your expected
    profit per loan?
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: 22. 你的一个员工指出，由于银行每笔贷款都在盈利，银行应该发放更多贷款！为什么只限制在 \(n\) 上？你解释说找到那些 \(n\) 个客户是项工作。你需要一个可预测的群体，以保持违约的可能性低。然后员工指出，即使违约的可能性更高，只要我们的预期值是正的，通过增加
    \(n\) 并依赖大数定律，你可以最小化亏损的可能性。假设违约概率是两倍高，即 4%，你将利率设定为 5%，即 \(x\) = $9,000，每笔贷款的预期利润是多少？
- en: 23\. How much do we have to increase \(n\) by to assure the probability of losing
    money is still less than 0.01?
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
  zh: 23. 我们需要将 \(n\) 增加多少才能确保亏损的概率仍然小于 0.01？
- en: 24\. Confirm the result in exercise 23 with a Monte Carlo simulation.
  id: totrans-98
  prefs: []
  type: TYPE_NORMAL
  zh: 24. 使用蒙特卡洛模拟确认第 23 题的结果。
- en: 25\. According to this equation, giving out more loans increases your expected
    profit and lowers the chances of losing money! Giving out more loans seems like
    a no-brainier. As a result, your colleague decides to leave your bank and start
    his own high-risk mortgage company. A few months later, your colleague’s bank
    has gone bankrupt. A book is written, and eventually, the movies “The Big Short”
    and “Margin Call” are made, recounting the mistake your friend, and many others,
    made. What happened?
  id: totrans-99
  prefs: []
  type: TYPE_NORMAL
  zh: 25. 根据这个公式，发放更多贷款会增加你的预期利润并降低亏损的可能性！发放更多贷款似乎是个不言而喻的选择。因此，你的同事决定离开你的银行，自己创办一家高风险的抵押贷款公司。几个月后，你的同事的银行破产了。一本书被写出来，最终，电影《大空头》和《大额交易》被制作出来，回顾了你的朋友以及许多其他人犯下的错误。发生了什么？
- en: 'Your colleague’s scheme was mainly based on this mathematical formula \(\mathrm{SE}[\bar{X}]=
    \sigma_X / \sqrt{n}\). By making \(n\) large, we minimize the standard error of
    our per-loan profit. However, for this rule to hold, the \(X\)s must be independent
    draws: one person defaulting must be independent of others defaulting.'
  id: totrans-100
  prefs: []
  type: TYPE_NORMAL
  zh: 你的同事的方案主要基于这个数学公式 \(\mathrm{SE}[\bar{X}]= \sigma_X / \sqrt{n}\)。通过使 \(n\) 变大，我们最小化了每笔贷款利润的标准误差。然而，为了使这个规则成立，\(X\)
    必须是独立的抽取：一个人的违约必须与其他人的违约独立。
- en: To construct a more realistic simulation than the original one your colleague
    ran, let’s assume there is a global event affecting everybody with high-risk mortgages
    and altering their probability simultaneously. We will assume that with a 50-50
    chance all the default probabilities slightly increase or decrease to somewhere
    between 0.03 and 0.05\. However, this change occurs universally, impacting everybody
    at once, not just one person. As these draws are no longer independent, our equation
    for the standard error of the sum of random variables does not apply. Write a
    Monte Carlo simulation for your total profit with this model.
  id: totrans-101
  prefs: []
  type: TYPE_NORMAL
  zh: 要构建一个比你的同事运行的原版更现实的模拟，让我们假设有一个全球事件影响所有高风险抵押贷款持有者，并同时改变他们的违约概率。我们将假设有50-50的几率，所有违约概率略微增加或减少到0.03和0.05之间。然而，这种变化是普遍发生的，影响所有人，而不仅仅是某一个人。由于这些抽取不再独立，我们用于随机变量总和标准误差的方程不再适用。使用这个模型为你的总利润编写一个蒙特卡洛模拟。
- en: 26\. Use the simulation results of exercise 25 to report the expected profit,
    the probability of losing money, and the probability of losing more than $10,000,000\.
    Study the distribution of profit and discuss how making the wrong assumption lead
    to a catastrophic result.****
  id: totrans-102
  prefs: []
  type: TYPE_NORMAL
  zh: 26. 使用第25题的模拟结果来报告预期利润、亏损的概率以及亏损超过1000万美元的概率。研究利润的分布，并讨论错误的假设如何导致灾难性的结果。
- en: '* * *'
  id: totrans-103
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: '****1.  https://en.wikipedia.org/w/index.php?title=Financial_crisis_of_2007%E2%80%932008[↩︎](#fnref1)'
  id: totrans-104
  prefs: []
  type: TYPE_NORMAL
  zh: '****1.  https://en.wikipedia.org/w/index.php?title=Financial_crisis_of_2007%E2%80%932008[↩︎](#fnref1)'
- en: https://en.wikipedia.org/w/index.php?title=Security_(finance)[↩︎](#fnref2)****
  id: totrans-105
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: https://en.wikipedia.org/w/index.php?title=Security_(finance)[↩︎](#fnref2)****
