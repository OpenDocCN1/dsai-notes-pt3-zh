- en: Joint Probability
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 联合概率
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part3/joint/](https://chrispiech.github.io/probabilityForComputerScientists/en/part3/joint/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part3/joint/](https://chrispiech.github.io/probabilityForComputerScientists/en/part3/joint/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: Many interesting problems involve not one random variable, but rather several
    interacting with one another. In order to create interesting probabilistic *models*
    and to reason in real world situations, we are going to need to learn how to consider
    several random variables jointly.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 许多有趣的问题涉及的不是单个随机变量，而是相互作用的多个变量。为了创建有趣的概率**模型**并在现实世界中进行推理，我们需要学习如何联合考虑多个随机变量。
- en: 'In this section we are going to use disease prediction as a working example
    to introduce you to the concepts involved in probabilistic models. The general
    question is: a person has a set of observed symptoms. Given the symptoms what
    is the probability over each possible disease?'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 在本节中，我们将使用疾病预测作为一个工作示例，向您介绍概率模型中涉及的概念。一般问题是：一个人有一组观察到的症状。给定这些症状，每种可能的疾病发生的概率是多少？
- en: We have already considered events that co-occur and covered concepts such as
    independence and conditional probability. What is new about this section is (1)
    we are going to cover how to handle *random variables* which co-occur and (2)
    we are going to talk about how computers can reason under large probabilistic
    models.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 我们已经考虑了同时发生的事件，并涵盖了独立性、条件概率等概念。本节的新颖之处在于（1）我们将介绍如何处理同时发生的**随机变量**，以及（2）我们将讨论计算机如何在大型概率模型下进行推理。
- en: Joint Probability Functions
  id: totrans-6
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 联合概率函数
- en: 'For single random variables, the most important information was the PMF or,
    if the variable was continuous, the PDF. When dealing with two or more variables,
    the equivalent function is called the Joint function. For discrete random variables,
    it is a function which takes in a value for each variable and returns the probability
    (or probability density for continuous variables) that each variable takes on
    its value. For example if you had two *discrete* variables the Joint function
    is: $$ \begin{align} \p(X=x,Y=y) && \text{Joint function for $X$ and $Y$} \end{align}
    $$'
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 对于单个随机变量，最重要的信息是概率质量函数（PMF）或者，如果变量是连续的，概率密度函数（PDF）。当处理两个或更多变量时，等效的函数称为联合函数。对于离散随机变量，它是一个函数，接受每个变量的值，并返回每个变量取其值的概率（对于连续变量是概率密度）。例如，如果你有两个**离散**变量，联合函数是：$$
    \begin{align} \p(X=x,Y=y) && \text{X和Y的联合函数} \end{align} $$
- en: You should read the comma as an "and" and as such this is saying the probability
    that $X=x$ and $Y=y$. Again like for single variables, as shorthand, we often
    write just the values and it implies that we are talking about the probability
    of the random variables taking on those values. This notation is convenient because
    it is shorter, and it makes it explicit that the function is operating over two
    parameters. It requires to recall that the event is a *random variable* taking
    on the given value. $$ \begin{align} \p(x,y) && \text{Shorthand for }\p(X=x,Y=y)
    \end{align} $$
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 你应该将逗号读作“和”，因此这表示X=x和Y=y的概率。同样，对于单个变量，为了简便起见，我们经常只写值，这暗示我们在谈论随机变量取这些值的概率。这种符号方便，因为它更短，并且明确指出该函数是在两个参数上操作的。需要记住的是，该事件是一个取给定值的**随机变量**。$$
    \begin{align} \p(x,y) && \text{是 }\p(X=x,Y=y) 的简写} \end{align} $$
- en: 'If any of the variables are continuous we use different notation to make it
    clear that we need a probability density function, something we can integrate
    over to get a probability. We will cover this in detail: $$ \begin{align} f(X=x,Y=y)
    && \text{Joint density function if $X$ or $Y$ are continuous} \end{align} $$'
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 如果任何变量是连续的，我们使用不同的符号来清楚地表明我们需要一个概率密度函数，这是我们可以在其上积分以得到概率的函数。我们将详细介绍这一点：$$ \begin{align}
    f(X=x,Y=y) && \text{如果X或Y是连续的，则为联合密度函数} \end{align} $$
- en: 'The same idea extends to as many variables as you have in your model. For example
    if you had three discrete random variables $X$, $Y$, and $Z$, the joint probability
    function would state the likelihood of an assignment to all three: $\p(X=x,Y=y,Z=z)$.'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 同样的思想可以扩展到模型中的任意多个变量。例如，如果你有三个离散随机变量X、Y和Z，联合概率函数将说明将所有三个变量分配给某个值的可能性：$\p(X=x,Y=y,Z=z)$。
- en: Joint Probability Tables
  id: totrans-11
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 联合概率表
- en: '***Definition***: Joint Probability Table'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义***：联合概率表'
- en: A joint probability table is a way of specifying the "joint" distribution between
    multiple random variables. It does so by keeping a multi-dimensional lookup table
    (one dimension per variable) so that the probability mass of any assignment, eg
    $\p(X=x,Y=y, \dots$), can be directly looked up.
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 联合概率表是指定多个随机变量之间“联合”分布的一种方式。它通过保持一个多维查找表（每个变量一个维度）来实现，这样就可以直接查找任何赋值的概率质量，例如
    $\p(X=x,Y=y, \dots$)。
- en: Let us start with an example. In 2020 the Covid-19 pandemic disrupted lives
    around the world. Many people were unable to get tested and had to determine whether
    or not they were sick based on home diagnosis. Let's build a very simple probabilistic
    model to enable us to make a tool which can predict the probability of having
    the illness given observed symptoms. To make it clear that this is a pedagogical
    example, let's consider a made up illness called Determinitis. The two main symptoms
    are fever and loss of smell.
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们从例子开始。2020 年，新冠疫情大流行扰乱了全球的生活。许多人无法进行检测，不得不根据家庭诊断来确定他们是否生病。让我们构建一个非常简单的概率模型，以便我们能够制作一个可以预测给定观察症状的疾病发生概率的工具。为了明确这是一个教学示例，让我们考虑一个虚构的疾病，称为
    Determinitis。两种主要症状是发烧和嗅觉丧失。
- en: '| Variable | Symbol | Type |'
  id: totrans-15
  prefs: []
  type: TYPE_TB
  zh: '| 变量 | 符号 | 类型 |'
- en: '| Has Determinitis | $D$ | Bernoulli (1 indicates has Determinitis) |'
  id: totrans-16
  prefs: []
  type: TYPE_TB
  zh: '| 有 Determinitis | $D$ | 二项式（1 表示有 Determinitis）|'
- en: '| Fever | $F$ | Categorical (none, low, high) |'
  id: totrans-17
  prefs: []
  type: TYPE_TB
  zh: '| 发烧 | $F$ | 分类（无、低、高）|'
- en: '| Can Smell | $S$ | Bernoulli (1 indicates can smell) |'
  id: totrans-18
  prefs: []
  type: TYPE_TB
  zh: '| 能闻到气味 | $S$ | 二项式（1 表示能闻到气味）|'
- en: 'A joint probability table is a brute force way to store the probability mass
    of a particular assignment of values to our variables. Here is a probabilistic
    model for our three random variables (aside: the values in this joint are realistic
    and based on reasearch, but are primarily for teaching. Consult a doctor before
    making medical decisions).'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 联合概率表是存储我们对变量赋值特定概率质量的一种暴力方法。以下是我们三个随机变量的概率模型（顺便说一句，这个联合中的值是现实的，基于研究，但主要是为了教学。在做出医疗决策之前请咨询医生）。
- en: $D=0$
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: $D=0$
- en: $D=1$
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: $D=1$
- en: 'A few key observations:'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 一些关键观察：
- en: 'Each cell in this table represents the probability of one assignment of variables.
    For example the probability that someone can''t smell, $S=0$, has a low fever,
    $F=\text{low}$, and has the illness, $D=1$, can be directly read off the table:
    $P(D=1,S=0,F=\text{low}) = 0.005$.'
  id: totrans-23
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 表中的每个单元格代表一个变量赋值的概率。例如，某人不能闻到气味，$S=0$，有低烧，$F=\text{low}$，并且有疾病，$D=1$ 的概率可以直接从表中读出：$P(D=1,S=0,F=\text{low})
    = 0.005$。
- en: These are joint probabilities *not* conditional probabilities. The value 0.005
    is the value of illness, no smell and low fever. It is not the probability of
    no smell and low fever given illness. A table which stored conditional probabilities
    would be called a conditional probability table, this is a joint probability table.
  id: totrans-24
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 这些是联合概率，而不是条件概率。数值 0.005 是疾病、无嗅觉和低烧的值，而不是无嗅觉和低烧给定疾病的概率。存储条件概率的表将称为条件概率表，这是一个联合概率表。
- en: If you sum over all cells, the total will be 1\. Each cell is a mutually exclusive
    combination of events and the cells are meant to span the entire space of possible
    outcomes.
  id: totrans-25
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 如果对所有单元格求和，总和将是 1。每个单元格是事件的互斥组合，单元格旨在涵盖所有可能的结果空间。
- en: This table is large! We can count the number of cells using the [step rule of
    counting](../../part1/counting). If $n_i$ is the number of different values that
    random variable $i$ can take on, the number of cells in the joint table is $\prod_i
    n_i$.
  id: totrans-26
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 这个表很大！我们可以使用 [计数步骤规则](../../part1/counting) 来计算单元格数。如果 $n_i$ 是随机变量 $i$ 可以取的不同值的数量，那么联合表中的单元格数是
    $\prod_i n_i$。
- en: Properties of Joint Distributions
  id: totrans-27
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 联合分布的性质
- en: 'There are many properties of a random variable of any joint distribution some
    of which we will dive into extensively. Here is a brief summary. Each random variable
    has:'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 任何联合分布的随机变量都有许多属性，其中一些我们将深入探讨。以下是一个简要总结。每个随机变量都有：
- en: '| Property | Notation Example | Description |'
  id: totrans-29
  prefs: []
  type: TYPE_TB
  zh: '| 属性 | 符号示例 | 描述 |'
- en: '| --- | --- | --- |'
  id: totrans-30
  prefs: []
  type: TYPE_TB
  zh: '| --- | --- | --- |'
- en: '| Distribution Function (PMF or PDF) | $\P(X=x,Y=y,\dots)$ or $f(X=x,Y=y,\dots)$
    | A function which maps values the RV can take on to likelihood. |'
  id: totrans-31
  prefs: []
  type: TYPE_TB
  zh: '| 分布函数（PMF 或 PDF） | $\P(X=x,Y=y,\dots)$ 或 $f(X=x,Y=y,\dots)$ | 一个将随机变量可以取的值映射到似然度的函数。|'
- en: '| Cumulative Distribution Function (CDF) | $F(X < x,Y < y, \dots)$ | Probability
    that each variable is less than its corresponding parameter |'
  id: totrans-32
  prefs: []
  type: TYPE_TB
  zh: '| 累积分布函数（CDF） | $F(X < x,Y < y, \dots)$ | 每个变量小于其对应参数的概率 |'
- en: '| Covariance | $\sigma_{X,Y}$ | A measure of how much two random variables
    vary together. |'
  id: totrans-33
  prefs: []
  type: TYPE_TB
  zh: '| 协方差 | $\sigma_{X,Y}$ | 两个随机变量共同变化的度量。 |'
- en: '| Correlation | $\rho_{X,Y}$ | Normalized co-variance |'
  id: totrans-34
  prefs: []
  type: TYPE_TB
  zh: '| 相关系数 | $\rho_{X,Y}$ | 标准化协方差 |'
