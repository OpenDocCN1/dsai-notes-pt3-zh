- en: 29  Resampling and Model Assessment
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 29 重采样与模型评估
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/ml/resampling-methods.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/ml/resampling-methods.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/ml/resampling-methods.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/ml/resampling-methods.html)
- en: '[Machine Learning](../ml/intro-ml.html)'
  id: totrans-2
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[机器学习](../ml/intro-ml.html)'
- en: '[29  Resampling and Model Assessment](../ml/resampling-methods.html)'
  id: totrans-3
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[29 重采样与模型评估](../ml/resampling-methods.html)'
- en: In this chapter, we introduce resampling, one of the most important ideas in
    machine learning. Here we focus on the conceptual and mathematical aspects. We
    will describe how to implement resampling methods in practice with the **caret**
    package later in [Section 31.2](ml-in-practice.html#sec-caret). To motivate the
    concept, we will use the two predictor digits data presented in [Section 28.3.1](conditionals-and-smoothing.html#sec-two-or-seven)
    and introduce k-nearest neighbors (kNN), to demonstrate the ideas.
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 在本章中，我们介绍了重采样，这是机器学习中最重要思想之一。在这里，我们关注概念和数学方面。我们将在[第31.2节](ml-in-practice.html#sec-caret)中稍后描述如何在实践中实现重采样方法。为了激发这个概念，我们将使用[第28.3.1节](conditionals-and-smoothing.html#sec-two-or-seven)中提出的两个预测数字数据，并介绍
    k 近邻（kNN），以展示这些思想。
- en: 29.1 Motivation with k-nearest neighbors
  id: totrans-5
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 29.1 使用 k 近邻的动机
- en: 'We are interested in estimating the conditional probability function:'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 我们感兴趣的是估计条件概率函数：
- en: \[ p(\mathbf{x}) = \mathrm{Pr}(Y = 1 \mid X_1 = x_1 , X_2 = x_2). \]
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: \[ p(\mathbf{x}) = \mathrm{Pr}(Y = 1 \mid X_1 = x_1 , X_2 = x_2). \]
- en: as defined in [Section 28.5](conditionals-and-smoothing.html#sec-smoothing-ml-connection).
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 如在[第28.5节](conditionals-and-smoothing.html#sec-smoothing-ml-connection)中定义。
- en: With k-nearest neighbors (kNN) we estimate \(p(\mathbf{x})\) in a similar way
    to bin smoothing. First, we define the distance between all observations based
    on the features. Then, for any point \(\mathbf{x}_0\), we estimate \(p(\mathbf{x}_0)\)
    by identifying the \(k\) nearest points to \(\mathbf{x}_0\) and taking an average
    of the \(y\)s associated with these points. We refer to the set of points used
    to compute the average as the *neighborhood*.
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 在 k 近邻（kNN）中，我们以与箱式平滑类似的方式估计 \(p(\mathbf{x})\)。首先，我们根据特征定义所有观察值之间的距离。然后，对于任何点
    \(\mathbf{x}_0\)，我们通过识别 \(\mathbf{x}_0\) 的 \(k\) 个最近点并取这些点相关的 \(y\) 值的平均值来估计 \(p(\mathbf{x}_0)\)。我们将用于计算平均值的点集称为
    *邻域*。
- en: 'Due to the connection we described earlier between conditional expectations
    and conditional probabilities, this gives us \(\hat{p}(\mathbf{x}_0)\), just like
    the bin smoother gave us an estimate of a trend. As with bin smoothers, we can
    control the flexibility of our estimate through a parameter, in the case the number
    o neighbors \(k\): larger \(k\)s result in smoother estimates, while smaller \(k\)s
    result in more flexible and wiggly estimates.'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 由于我们之前描述的关于条件期望和条件概率之间的联系，这给我们提供了 \(\hat{p}(\mathbf{x}_0)\)，就像箱式平滑器给我们提供了一个趋势的估计。与箱式平滑器一样，我们可以通过一个参数来控制我们估计的灵活性，在这种情况下是邻居的数量
    \(k\)：较大的 \(k\) 值会导致更平滑的估计，而较小的 \(k\) 值会导致更灵活和波动的估计。
- en: To fit a \(k\)-nearest neighbors model, we use the `knn3` function from the
    **caret** package. The help file shows two ways to call this function; we will
    use the *formula interface*, which lets us write the model in the form
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 为了拟合 \(k\) 近邻模型，我们使用来自 **caret** 包的 `knn3` 函数。帮助文件显示了调用此函数的两种方式；我们将使用 *公式接口*，它允许我们将模型写成以下形式
- en: '[PRE0]'
  id: totrans-12
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: Because our training set is stored in a data frame, we can use the shorthand
    `y ~ .` to mean “use `y` as the outcome and all other columns as predictors.”
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 由于我们的训练集存储在数据框中，我们可以使用缩写 `y ~ .` 来表示“使用 `y` 作为结果，所有其他列作为预测变量。”
- en: 'We must also choose the number of neighbors \(k\). The default is `k = 5`,
    which we will use here. Putting this together, our call looks like:'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 我们还必须选择邻居的数量 \(k\)。默认值是 `k = 5`，我们将在这里使用。将这一点结合起来，我们的调用看起来像：
- en: '[PRE1]'
  id: totrans-15
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: '*In this case, since our dataset is balanced and we care just as much about
    sensitivity as we do about specificity, we will use accuracy to quantify performance.'
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: '*在这种情况下，由于我们的数据集是平衡的，我们同样关心敏感性和特异性，我们将使用准确率来量化性能。'
- en: 'The `predict` function for `knn3` returns estimes of \(p(\mathbf{x})\) (`type
    = "prob"`) or the prediction (`type = "class"`):'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: '`knn3` 的 `predict` 函数返回 \(p(\mathbf{x})\) 的估计（`type = "prob"`）或预测（`type = "class"`）：'
- en: '[PRE2]'
  id: totrans-18
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: '*We see that kNN, with the default parameter, already beats GLM:'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: '*我们看到，默认参数的 kNN 已经击败了 GLM：'
- en: '[PRE3]'
  id: totrans-20
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: '*To see why this is the case, we plot \(\hat{p}(\mathbf{x})\) and compare it
    to the true conditional probability \(p(\mathbf{x})\):'
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: '*为了了解为什么是这样，我们绘制 \(\hat{p}(\mathbf{x})\) 并将其与真实的条件概率 \(p(\mathbf{x})\) 进行比较：'
- en: '![](../Images/f6ac9ff5b91d158a635029d40f3059bc.png)'
  id: totrans-22
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/f6ac9ff5b91d158a635029d40f3059bc.png)'
- en: 'We see that kNN adapts better to the non-linear shape of \(p(\mathbf{x})\).
    However, our estimate has some islands of blue in the red area, which intuitively
    does not make much sense. We notice that we have higher accuracy in the train
    set compared to the test set:'
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 我们看到kNN更好地适应了\(p(\mathbf{x})\)的非线性形状。然而，我们的估计在红色区域中有一些蓝色的孤岛，这在直观上并不合理。我们注意到，与测试集相比，我们在训练集中有更高的准确率：
- en: '[PRE4]'
  id: totrans-24
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: '*This is due to what we call *over-training*.****'
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: '*这是由于我们所说的*过拟合*。****'
- en: '***29.2 Over-training***'
  id: totrans-26
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '***29.2 过拟合***'
- en: '***With kNN, over-training is at its worst when we set \(k = 1\). With \(k
    = 1\), the estimate for each \(\mathbf{x}\) in the training set is obtained with
    just the \(y\) corresponding to that point. In this case, if the \(x_1\) and \(x_2\)
    are unique, we will obtain perfect accuracy in the training set because each point
    is used to predict itself (if the predictors are not unique and have different
    outcomes for at least one set of predictors, then it is impossible to predict
    perfectly).'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: '***使用kNN时，当我们将\(k\)设置为1时，过拟合问题最为严重。当\(k = 1\)时，训练集中每个\(\mathbf{x}\)的估计值仅通过该点的\(y\)值获得。在这种情况下，如果\(x_1\)和\(x_2\)是唯一的，我们将在训练集中获得完美的准确率，因为每个点都用于预测自身（如果预测因子不是唯一的，并且至少有一组预测因子有不同的结果，那么无法完美预测）。'
- en: 'Here we fit a kNN model with \(k = 1\) and confirm we get near perfect accuracy
    in the training set:'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 在这里，我们使用\(k = 1\)拟合kNN模型，并确认我们在训练集中获得了接近完美的准确率：
- en: '[PRE5]'
  id: totrans-29
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: '*But in the test set, accuracy is actually worse than what we obtained with
    regression:'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: '*但在测试集中，准确率实际上比我们使用回归得到的准确率还要差：'
- en: '[PRE6]'
  id: totrans-31
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: '*We can see the over-fitting problem by plotting the decision rule boundaries
    produced by \(\hat{p}(\mathbf{x})\):'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: '*我们可以通过绘制\(\hat{p}(\mathbf{x})\)产生的决策规则边界来看到过拟合问题：'
- en: '![](../Images/d63028b45edd58804b15a7fa8a06ed75.png)'
  id: totrans-33
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/d63028b45edd58804b15a7fa8a06ed75.png)'
- en: The estimate \(\hat{p}(\mathbf{x})\) follows the training data too closely (left).
    You can see that, in the training set, boundaries have been drawn to perfectly
    surround a single red point in a sea of blue. Because most points \(\mathbf{x}\)
    are unique, the prediction is either 1 or 0 and the prediction for that point
    is the associated label. However, once we introduce the test set (right), we see
    that many of these small islands now have the opposite color and we end up making
    several incorrect predictions.*****
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: 估计\(\hat{p}(\mathbf{x})\)与训练数据过于接近（左）。您可以看到，在训练集中，边界被绘制以完美地包围蓝色海洋中的单个红色点。由于大多数点\(\mathbf{x}\)是唯一的，预测结果要么是1要么是0，该点的预测就是其关联的标签。然而，一旦我们引入测试集（右），我们会看到许多这些小岛现在具有相反的颜色，我们最终做出了几个错误的预测。*****
- en: '***29.3 Over-smoothing***'
  id: totrans-35
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '***29.3 过平滑***'
- en: '***Although not as badly as with \(k=1\), we saw that with \(k = 5\) we also
    over-trained. Hence, we should consider a larger \(k\). Let’s try, as an example,
    a much larger number: \(k = 401\).'
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: '***尽管不如\(k=1\)时严重，但我们看到当\(k = 5\)时，我们也出现了过拟合。因此，我们应该考虑一个更大的\(k\)。让我们尝试一个更大的数字，例如\(k
    = 401\)。'
- en: '[PRE7]'
  id: totrans-37
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: '*The estimate turns out to be similar to the one obtained with regression:'
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: '*估计结果与使用回归得到的估计相似：'
- en: '![](../Images/6eed22ecd59bb52b4928fdc9c606f9fd.png)'
  id: totrans-39
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/6eed22ecd59bb52b4928fdc9c606f9fd.png)'
- en: In this case, \(k\) is so large that it does not permit enough flexibility.
    We call this *over-smoothing*.****
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 在这种情况下，\(k\)值太大，不允许足够的灵活性。我们称之为*过平滑*。****
- en: '***29.4 Tuning parameters***'
  id: totrans-41
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '***29.4 调参参数***'
- en: '***It is very common for machine learning algorithms to require that we set
    one or more values *before* fitting the model. A simple example is the choice
    of \(k\) in k-Nearest Neighbors (kNN). In [Chapter 30](algorithms.html), we will
    see additional examples. These values are referred to as *tuning parameters*,
    and an important part of applying machine learning in practice is choosing them,
    often called *tuning the model*.'
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: '***机器学习算法通常需要我们在拟合模型之前设置一个或多个值。一个简单的例子是在k-Nearest Neighbors (kNN)中选择\(k\)。在[第30章](algorithms.html)中，我们将看到更多的例子。这些值被称为*调参参数*，将机器学习应用于实践的一个重要部分是选择它们，通常称为*调参模型*。'
- en: So how do we pick tuning parameters? For instance, how do we decide on the best
    \(k\) in kNN? In principle, we want the value of \(k\) that maximizes accuracy
    or, equivalently, minimizes the expected MSE as defined in [Section 27.8](evaluation-metrics.html#sec-mse).
    The challenge is that we do not know the true expected error. The goal of *resampling
    methods* is to estimate this error for any given algorithm and set of tuning parameters,
    such as \(k\).
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: 那么，我们如何选择调整参数呢？例如，我们如何决定 kNN 中的最佳 \(k\) 值？原则上，我们希望 \(k\) 的值最大化准确率，或者等价地，最小化[第27.8节](evaluation-metrics.html#sec-mse)中定义的预期均方误差。挑战在于我们不知道真正的预期误差。*重采样方法*的目标是估计任何给定算法和调整参数集（如
    \(k\)）的此误差。
- en: 'To see why we need resampling, let’s repeat what we did earlier: compare training
    and test set accuracy, but now for a range of \(k\) values. We can then plot the
    accuracy estimates for each choice of \(k\):'
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 为了了解为什么我们需要重采样，让我们重复我们之前所做的事情：比较训练集和测试集的准确率，但现在对于一系列的 \(k\) 值。然后我们可以绘制每个 \(k\)
    值选择的准确率估计：
- en: '![](../Images/bdd94c6029bace6af0568b0de1fc54a5.png)'
  id: totrans-45
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/bdd94c6029bace6af0568b0de1fc54a5.png)'
- en: First, note that the estimate obtained from the training set is generally more
    optimistic, higher accuracy, than the estimate from the test set, with the gap
    being larger for smaller values of \(k\). This is a classic symptom of *overfitting*.
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: 首先，请注意，从训练集获得的估计通常比测试集的估计更乐观，准确率更高，对于较小的 \(k\) 值，差距更大。这是*过拟合*的经典症状。
- en: 'Should we simply choose the value of \(k\) that gives the highest accuracy
    on the test set and report its accuracy? This approach has two important drawbacks:'
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: 我们是否应该简单地选择在测试集上给出最高准确率的 \(k\) 值并报告其准确率？这种方法有两个重要的缺点：
- en: '**The accuracy–versus–(k) curve is noisy.** We do not expect small changes
    in \(k\) to cause large changes in accuracy or MSE. The jagged pattern occurs
    because each accuracy estimate is based on a finite test sample, so it fluctuates
    due to random variation. As a result, the “best” \(k\) may appear best just by
    chance.'
  id: totrans-48
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '**准确率与（k）曲线是嘈杂的。** 我们不期望 \(k\) 的小幅度变化会导致准确率或 MSE 的大幅度变化。锯齿状模式发生是因为每个准确率估计都是基于有限的测试样本，因此由于随机变化而波动。因此，“最佳”
    \(k\) 可能只是偶然看起来最好。'
- en: '**We are using the test set twice.** Although we are not fitting the model
    on the test set, we *are* using it to choose \(k\) and then using it again to
    report accuracy. This leads to an optimistic estimate of performance that will
    typically not hold up on truly new data.'
  id: totrans-49
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '**我们正在两次使用测试集。** 虽然我们没有在测试集上拟合模型，但我们*正在*使用它来选择 \(k\)，然后再次使用它来报告准确率。这会导致对性能的乐观估计，通常在真正新的数据上不会成立。'
- en: '*Resampling methods* provide a principled solution to both problems by reducing
    variability and ensuring that test data are not used twice, once for evaluation
    and again for tuning.***'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: '*重采样方法*通过减少变异性并确保测试数据不重复使用（一次用于评估，一次用于调整）来提供解决这两个问题的原则性解决方案。***'
- en: '***29.5 Mathematical description of resampling methods***'
  id: totrans-51
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '***29.5 重采样方法的数学描述***'
- en: '***In [Section 29.1](#sec-knn-cv-intro) we introduced \(k\)-nearest neighbors
    (kNN) as a simple example to motivate this chapter. In that setting, the algorithm
    depends on only one tuning parameter, \(k\), which directly affects performance.
    More generally, machine learning algorithms often involve *multiple* tuning parameters.
    Here we use the notation \(\lambda\) to represent the full set of parameters that
    define the algorithm.'
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: '***在第29.1节[第29.1节](#sec-knn-cv-intro)中，我们介绍了 \(k\)-最近邻（kNN）作为本章的一个简单示例，以激发对该章节的兴趣。在那个设置中，算法只依赖于一个调整参数
    \(k\)，它直接影响性能。更一般地，机器学习算法通常涉及*多个*调整参数。在这里，我们使用符号 \(\lambda\) 来表示定义算法的全部参数集。***'
- en: To keep track of how these choices affect performance, we write the predictions
    produced by a given parameter set for observation \(i\) as \(\hat{y}_i(\lambda)\)
    and the corresponding mean squared error as \(\mathrm{MSE}(\lambda)\). Our goal
    is to find the value of \(\lambda\) that minimizes \(\mathrm{MSE}(\lambda)\).
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: 为了跟踪这些选择如何影响性能，我们将给定参数集对观测 \(i\) 生成的预测写成 \(\hat{y}_i(\lambda)\)，相应的均方误差为 \(\mathrm{MSE}(\lambda)\)。我们的目标是找到使
    \(\mathrm{MSE}(\lambda)\) 最小的 \(\lambda\) 值。
- en: Resampling methods provide practical ways to estimate \(\mathrm{MSE}(\lambda)\)
    and therefore guide us toward the best tuning parameters.
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
  zh: 重采样方法提供了估计 \(\mathrm{MSE}(\lambda)\) 的实用方法，因此引导我们找到最佳的调整参数。
- en: 'An intuitive first attempt is the apparent error defined in [Section 27.8](evaluation-metrics.html#sec-mse)
    and used in the previous section:'
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: 直观的第一种尝试是[第27.8节](evaluation-metrics.html#sec-mse)中定义的明显误差，并在上一节中使用：
- en: \[ \hat{\mbox{MSE}}(\lambda) = \frac{1}{N}\sum_{i = 1}^N \left\{\hat{y}_i(\lambda)
    - y_i\right\}^2 \]
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \hat{\mbox{MSE}}(\lambda) = \frac{1}{N}\sum_{i = 1}^N \left\{\hat{y}_i(\lambda)
    - y_i\right\}^2 \]
- en: As noted in the previous section, this estimate is a random variable, based
    on just one test set, with enough variability to affect the choice of the best
    \(\lambda\) substantially.
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: 如前节所述，这个估计是一个随机变量，基于仅一个测试集，具有足够的变异性，可以显著影响最佳 \(\lambda\) 的选择。
- en: 'Now imagine a world in which we could obtain data repeatedly, say from new
    random samples. We could take a very large number \(B\) of new samples, split
    each of them into training and test sets, and define:'
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 现在想象一个我们可以反复获取数据的世界，比如来自新的随机样本。我们可以获取一个非常大的新样本数量 \(B\)，将每个样本分成训练集和测试集，并定义：
- en: \[ \frac{1}{B} \sum_{b=1}^B \frac{1}{N}\sum_{i=1}^N \left\{\hat{y}_i^b(\lambda)
    - y_i^b\right\}^2 \]
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \frac{1}{B} \sum_{b=1}^B \frac{1}{N}\sum_{i=1}^N \left\{\hat{y}_i^b(\lambda)
    - y_i^b\right\}^2 \]
- en: with \(y_i^b\) the \(i\)th observation in test sample \(b\) and \(\hat{y}_{i}^b(\lambda)\)
    the prediction obtained with the algorithm defined by parameter \(\lambda\) and
    trained on train set \(b\). The law of large numbers tells us that as \(B\) becomes
    larger, this quantity gets closer and closer to \(\mbox{MSE}(\lambda)\). This
    is of course a theoretical consideration as we rarely get access to more than
    one dataset for algorithm development, but the concept inspires resampling methods.
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: 其中 \(y_i^b\) 是测试样本 \(b\) 中的第 \(i\) 个观测值，\(\hat{y}_{i}^b(\lambda)\) 是使用参数 \(\lambda\)
    定义并由训练集 \(b\) 训练的算法获得的预测。大数定律告诉我们，随着 \(B\) 的增大，这个量越来越接近 \(\mbox{MSE}(\lambda)\)。这当然是一个理论上的考虑，因为我们很少能接触到超过一个数据集来开发算法，但这个概念启发了重采样方法。
- en: The general idea behind resampling methods is to generate a series of different
    random samples from the data at hand. There are several approaches to doing this,
    but all randomly generate several smaller datasets that are not used for training,
    and instead are used to estimate MSE. Next, we describe *cross validation*, one
    of the most widely used resampling methods.***
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: 重采样方法背后的基本思想是从现有数据生成一系列不同的随机样本。有几种实现这种方法的方法，但所有方法都是随机生成几个较小的数据集，这些数据集不用于训练，而是用于估计
    MSE。接下来，我们将描述 *交叉验证*，这是最广泛使用的重采样方法之一。
- en: '***29.6 Cross validation***'
  id: totrans-62
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '***29.6 交叉验证***'
- en: '***Overall, we are provided a dataset (blue) and we need to build an algorithm,
    using this dataset, that will eventually be used in completely independent datasets
    (yellow) that we might not even see.'
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: '***总体而言，我们得到了一个数据集（蓝色）并需要构建一个算法，使用这个数据集，该算法最终将用于完全独立的（黄色）数据集，我们甚至可能看不到。'
- en: '![](../Images/09a8cce2ef742d06c6e8d6cc220415f8.png)'
  id: totrans-64
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/09a8cce2ef742d06c6e8d6cc220415f8.png)'
- en: 'So to imitate this situation, we start by carving out a piece of our dataset
    and pretend it is an independent dataset: we divide the dataset into a *training
    set* (blue) and a *test set* (red). We will train the entirety of our algorithm,
    including the choice of parameter \(\lambda\), exclusively on the training set
    and use the test set only for evaluation purposes.'
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，为了模仿这种情况，我们首先从我们的数据集中划分出一部分，并假装它是一个独立的数据集：我们将数据集划分为一个 *训练集*（蓝色）和一个 *测试集*（红色）。我们将完全在训练集上训练我们的算法，包括参数
    \(\lambda\) 的选择，并仅将测试集用于评估目的。
- en: We usually try to select a small piece of the dataset so that we have as much
    data as possible to train. However, we also want the test set to be large so that
    we obtain a stable estimate of the MSE without fitting an impractical number of
    models. Typical choices are to use 10%-20% of the data for testing.
  id: totrans-66
  prefs: []
  type: TYPE_NORMAL
  zh: 我们通常尝试选择数据集的一小部分，以便尽可能多地拥有数据来训练。然而，我们还想让测试集足够大，以便在不拟合不切实际数量的模型的情况下获得稳定的 MSE
    估计。典型的选择是使用 10%-20% 的数据用于测试。
- en: '![](../Images/72e0d81cf3ea9577299af81f6ac07dd3.png)'
  id: totrans-67
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/72e0d81cf3ea9577299af81f6ac07dd3.png)'
- en: 'Let’s reiterate that it is indispensable that we not use the test set at all:
    not for filtering out rows, not for selecting features, not for anything!'
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们重申，我们绝对不能使用测试集：无论是用于过滤行、选择特征还是用于任何其他目的！
- en: 'But then how do we optimize \(\lambda\)? In cross validation, we achieve this
    by splitting the training set into two: the training and validation sets.'
  id: totrans-69
  prefs: []
  type: TYPE_NORMAL
  zh: 但然后我们如何优化 \(\lambda\)？在交叉验证中，我们通过将训练集分成两部分：训练集和验证集来实现这一点。
- en: '![](../Images/c3e8a6c1a7a703872868a9123202cf16.png)'
  id: totrans-70
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/c3e8a6c1a7a703872868a9123202cf16.png)'
- en: We will do this many times assuring that the estimates of MSE obtained in each
    dataset are independent from each other. There are several proposed methods for
    doing this. Here we describe one of these approaches, K-fold cross validation,
    in detail to provide the general idea used in all approaches.
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将多次进行此操作，以确保每个数据集中获得的多项式均方误差（MSE）估计相互独立。为此，已经提出了几种方法。在这里，我们详细描述其中一种方法，即K折交叉验证，以提供所有方法中使用的通用思路。
- en: K-fold cross validation
  id: totrans-72
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: K折交叉验证
- en: 'As a reminder, we are going to imitate the concept used when introducing this
    version of the MSE:'
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: 作为提醒，我们将模仿在介绍这种MSE版本时所使用的概念：
- en: \[ \mbox{MSE}(\lambda) \approx\frac{1}{B} \sum_{b = 1}^B \frac{1}{N}\sum_{i
    = 1}^N \left(\hat{y}_i^b(\lambda) - y_i^b\right)^2 \]
  id: totrans-74
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mbox{MSE}(\lambda) \approx\frac{1}{B} \sum_{b = 1}^B \frac{1}{N}\sum_{i
    = 1}^N \left(\hat{y}_i^b(\lambda) - y_i^b\right)^2 \]
- en: We want to generate a dataset that can be thought of as independent random sample,
    and do this \(B\) times. The K in K-fold cross validation, represents the number
    of time \(B\). In the illustrations below we show an example that uses \(B = 5\).
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: 我们希望生成一个可以被视为独立随机样本的数据集，并重复此操作\(B\)次。K折交叉验证中的K代表\(B\)的次数。在下面的示例中，我们展示了使用\(B
    = 5\)的例子。
- en: 'We will eventually end up with \(B\) samples, but let’s start by describing
    how to construct the first: we simply pick \(M = N/B\) observations at random
    (we round if \(M\) is not a round number) and think of these as a random sample
    \(y_1^b, \dots, y_M^b\), with \(b = 1\). We call this the validation set.'
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: 我们最终将得到\(B\)个样本，但让我们先描述如何构建第一个：我们简单地随机选择\(M = N/B\)个观察值（如果\(M\)不是整数，则进行四舍五入），并将这些视为一个随机样本\(y_1^b,
    \dots, y_M^b\)，其中\(b = 1\)。我们称这为验证集。
- en: 'Now we can fit the model in the training set, then compute the apparent error
    on the independent set:'
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们可以将模型拟合到训练集中，然后在独立集上计算明显的误差：
- en: \[ \hat{\mbox{MSE}}_b(\lambda) = \frac{1}{M}\sum_{i = 1}^M \left(\hat{y}_i^b(\lambda)
    - y_i^b\right)^2 \]
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \hat{\mbox{MSE}}_b(\lambda) = \frac{1}{M}\sum_{i = 1}^M \left(\hat{y}_i^b(\lambda)
    - y_i^b\right)^2 \]
- en: 'As a reminder, this is just one sample and will therefore return a noisy estimate
    of the true error. In K-fold cross validation, we randomly split the observations
    into \(B\) non-overlapping sets:'
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
  zh: 作为提醒，这只是一个样本，因此将返回一个关于真实错误的噪声估计。在K折交叉验证中，我们将观察随机分成\(B\)个非重叠集：
- en: '![](../Images/8d8563b489515561d2d85110e7783a82.png)'
  id: totrans-80
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/8d8563b489515561d2d85110e7783a82.png)'
- en: 'Now we repeat the calculation above for each of these sets \(b = 1,\dots,B\)
    and obtain \(\hat{\mbox{MSE}}_1(\lambda),\dots, \hat{\mbox{MSE}}_B(\lambda)\).
    Then, for our final estimate, we compute the average:'
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
  zh: 现在，我们为这些集合中的每一个重复上述计算\(b = 1,\dots,B\)，并得到\(\hat{\mbox{MSE}}_1(\lambda),\dots,
    \hat{\mbox{MSE}}_B(\lambda)\)。然后，为了我们的最终估计，我们计算平均值：
- en: \[ \hat{\mbox{MSE}}(\lambda) = \frac{1}{B} \sum_{b = 1}^B \hat{\mbox{MSE}}_b(\lambda)
    \]
  id: totrans-82
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \hat{\mbox{MSE}}(\lambda) = \frac{1}{B} \sum_{b = 1}^B \hat{\mbox{MSE}}_b(\lambda)
    \]
- en: and obtain an estimate of our loss. A final step would be to select the \(\lambda\)
    that minimizes the MSE.
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
  zh: 并获得我们损失的估计。最后一步将是选择使MSE最小的\(\lambda\)。
- en: How many folds?
  id: totrans-84
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 有多少折？
- en: 'Now how do we pick the cross validation fold? Large values of \(B\) are preferable
    because the training data better imitates the original dataset. However, larger
    values of \(B\) will have much slower computation time: for example, 100-fold
    cross validation will be 10 times slower than 10-fold cross validation. For this
    reason, the choices of \(B = 5\) and \(B = 10\) are popular.'
  id: totrans-85
  prefs: []
  type: TYPE_NORMAL
  zh: 现在如何选择交叉验证的折数？较大的\(B\)值更可取，因为训练数据更好地模仿原始数据集。然而，较大的\(B\)值将导致计算时间大大减慢：例如，100折交叉验证将比10折交叉验证慢10倍。因此，\(B
    = 5\)和\(B = 10\)的选择很受欢迎。
- en: Estimate MSE of our optimized algorithm
  id: totrans-86
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 估计优化算法的MSE
- en: 'We have described how to use cross validation to optimize parameters. However,
    we now have to take into account the fact that the optimization occurred on the
    training data and we therefore need an estimate of our final algorithm based on
    data that was not used to optimize the choice. Here is where we use the test set
    we separated early on:'
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: 我们已经描述了如何使用交叉验证来优化参数。然而，我们现在必须考虑优化是在训练数据上进行的，因此我们需要基于未用于优化选择的数据来估计我们的最终算法。这就是我们使用早期分离的测试集的地方：
- en: '![](../Images/2922dd44ed216b648c549b9c36504015.png)'
  id: totrans-88
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/2922dd44ed216b648c549b9c36504015.png)'
- en: 'We can actually do cross validation again, say five times:'
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
  zh: 实际上，我们可以再次进行交叉验证，比如五次：
- en: '![](../Images/c60c15f78285f503618bd6e167ac7e0c.png)'
  id: totrans-90
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/c60c15f78285f503618bd6e167ac7e0c.png)'
- en: and obtain a final estimate of our expected loss by averaging the five MSE estimates.
    However, note that last cross validation iteration means that our entire compute
    time gets multiplied by the number of repetitions. You will soon learn that fitting
    each algorithm takes time because we are performing many complex computations.
    As a result, we are always looking for ways to reduce this time. For the final
    evaluation, we often just use the one test set.
  id: totrans-91
  prefs: []
  type: TYPE_NORMAL
  zh: 通过平均五个MSE估计值，我们获得我们预期损失的最终估计。然而，请注意，最后一个交叉验证迭代意味着我们的整个计算时间乘以重复次数。你很快就会了解到，拟合每个算法都需要时间，因为我们正在执行许多复杂的计算。因此，我们总是在寻找减少这种时间的方法。对于最终评估，我们通常只使用一个测试集。
- en: Once we are satisfied with this model and want to make it available to others,
    we could refit the model on the entire dataset, without changing the optimized
    parameters.
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: 一旦我们对这个模型感到满意并希望将其提供给他人，我们可以在不改变优化参数的情况下，在整个数据集上重新拟合模型。
- en: '![](../Images/81be2db212d5f4a32c921d75176e02f9.png)***'
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: '![图片](../Images/81be2db212d5f4a32c921d75176e02f9.png)*'
- en: '***29.7 Boostrap resampling***'
  id: totrans-94
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '**29.7 自助重采样**'
- en: '***Typically, cross-validation involves partitioning the original dataset into
    a training set to train the model and a testing set to evaluate it. With the bootstrap
    approach, based on the ideas described in [Chapter 14](../inference/bootstrap.html),
    you can create multiple different training datasets via bootstrapping. This method
    is sometimes called bootstrap aggregating or bagging.'
  id: totrans-95
  prefs: []
  type: TYPE_NORMAL
  zh: '**通常，交叉验证涉及将原始数据集划分为训练集以训练模型和测试集以评估它。根据第14章中描述的思想，使用自助方法可以创建多个不同的训练数据集。这种方法有时被称为自助聚合或袋装。**'
- en: In bootstrap resampling, we create a large number of bootstrap samples from
    the original training dataset. Each bootstrap sample is created by randomly selecting
    observations with replacement, usually the same size as the original training
    dataset. For each bootstrap sample, we fit the model and compute the MSE estimate
    on the observations not selected in the random sampling, referred to as the *out-of-bag
    observations*. These out-of-bag observations serve a similar role to a validation
    set in standard cross-validation.
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: 在自助重采样中，我们从原始训练数据集中创建大量自助样本。每个自助样本是通过随机选择观察值并替换它们创建的，通常与原始训练数据集的大小相同。对于每个自助样本，我们在随机采样中未选择的观察值上拟合模型并计算MSE估计值，这些观察值被称为*袋外观察值*。这些袋外观察值在标准交叉验证中起着类似验证集的作用。
- en: We then average the MSEs obtained in the out-of-bag observations from each bootstrap
    sample to estimate the model’s performance.
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
  zh: 我们然后将从每个自助样本中获得的袋外观察到的均方误差（MSEs）进行平均，以估计模型的表现。
- en: This approach is actually the default approach in the **caret** package. We
    describe how to implement resampling methods with the **caret** package in [Chapter
    31](ml-in-practice.html).***
  id: totrans-98
  prefs: []
  type: TYPE_NORMAL
  zh: 这种方法实际上是**caret**包中的默认方法。我们将在第31章[Chapter 31](ml-in-practice.html)中描述如何使用**caret**包实现重采样方法。
- en: '***29.8 Comparison of MSE estimates***'
  id: totrans-99
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '**29.8 MSE估计比较**'
- en: '***In [Section 29.1](#sec-knn-cv-intro), we computed an estimate of MSE based
    just on the provided test set (shown in red in the plot below). Here we show how
    the cross-validation techniques described above help reduce variability. The green
    curve below shows the results of applying K-fold cross validation with 10 folds,
    leaving out 10% of the data for validation. We can see that the variance is reduced
    substantially. The blue curve is the result of using 100 bootstrap samples to
    estimate MSE. The variability is reduced even further, but at the cost of a 10
    fold increase in computation time.'
  id: totrans-100
  prefs: []
  type: TYPE_NORMAL
  zh: '**在第29.1节[Section 29.1](#sec-knn-cv-intro)中，我们仅基于提供的测试集（在下面的图中以红色显示）计算了MSE的估计值。这里我们展示了上述交叉验证技术如何帮助减少变异性。下面的绿色曲线显示了应用10折交叉验证的结果，留出10%的数据用于验证。我们可以看到，方差显著降低。蓝色曲线是使用100个自助样本估计MSE的结果。变异性进一步降低，但代价是计算时间增加了10倍。**'
- en: '![](../Images/6c60e4167848339a43785dad2fbea2c9.png)'
  id: totrans-101
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/6c60e4167848339a43785dad2fbea2c9.png)'
- en: 'Note that the three resampling approaches lead to different choices of \(\lambda\).
    Using the accuracy curves:'
  id: totrans-102
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，三种重采样方法导致不同的\(\lambda\)选择。使用准确度曲线：
- en: The naive approach selects \(\lambda =\) 9.
  id: totrans-103
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 简单方法选择 \(\lambda =\) 9。
- en: The 10-fold cross-validation approach selects \(\lambda =\) 55.
  id: totrans-104
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 10折交叉验证方法选择 \(\lambda =\) 55。
- en: The bootstrap approach selects \(\lambda =\) 65.
  id: totrans-105
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 自助方法选择 \(\lambda =\) 65。
- en: 'These differences highlight an important point: your choice of \(\lambda\)
    is only as good as your estimate of the test error. Reliable resampling methods
    are essential for finding a tuning parameter that truly generalizes well.***'
  id: totrans-106
  prefs: []
  type: TYPE_NORMAL
  zh: 这些差异突出了一个重要观点：你选择的\(\lambda\)的好坏取决于你对测试误差的估计。可靠的重采样方法是找到真正泛化良好的调整参数所必需的。***
- en: '***29.9 Exercises***'
  id: totrans-107
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '***29.9练习***'
- en: '***Below is a **cleaner, clearer, student-friendly version** of the exercise
    set, expanded to a total of **10 exercises**, with tightened wording, improved
    motivation, and careful explanations of what students are expected to do.'
  id: totrans-108
  prefs: []
  type: TYPE_NORMAL
  zh: '***以下是练习集的**更清晰、更易于学生理解**的版本，扩展到总共**10个练习**，语言更加严谨，动机更佳，并对学生期望完成的内容进行了仔细的解释。'
- en: I also added one more exercise (now Exercise 7) so that the set flows logically
    and reaches 10 total.
  id: totrans-109
  prefs: []
  type: TYPE_NORMAL
  zh: 我还增加了一个额外的练习（现在是练习7），使得整个练习集逻辑连贯，达到总共10个练习。
- en: '* * ****'
  id: totrans-110
  prefs: []
  type: TYPE_NORMAL
  zh: '* * ****'
- en: '***30 **Exercises: Overfitting, Feature Selection, and Resampling*****'
  id: totrans-111
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: '***30 **练习：过度拟合、特征选择和重采样***** '
- en: '***We will work with a dataset in which **the predictors and the outcome are
    entirely unrelated**. This setting helps us understand how misleading results
    can arise when we accidentally “peek” at the test set or use the full dataset
    to perform feature selection.'
  id: totrans-112
  prefs: []
  type: TYPE_NORMAL
  zh: '***我们将处理一个**预测因子和结果完全无关**的数据集。这种设置有助于我们理解当我们意外地“窥视”测试集或使用完整数据集进行特征选择时，误导性结果是如何产生的。'
- en: 'Generate the dataset:'
  id: totrans-113
  prefs: []
  type: TYPE_NORMAL
  zh: 生成数据集：
- en: '[PRE8]'
  id: totrans-114
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: '*Because `x` and `y` are independent, no classifier should achieve an accuracy
    much larger than 0.5.'
  id: totrans-115
  prefs: []
  type: TYPE_NORMAL
  zh: '*因为`x`和`y`是独立的，没有分类器应该达到比0.5大得多的精度。'
- en: 1\. Using only `x_subset`, randomly split the data into 80% training and 20%
    test.
  id: totrans-116
  prefs: []
  type: TYPE_NORMAL
  zh: 1. 使用仅`x_subset`，随机将数据分割为80%训练和20%测试。
- en: Fit a logistic regression model (`glm`, family = “binomial”) on the training
    set and compute the test-set accuracy.
  id: totrans-117
  prefs: []
  type: TYPE_NORMAL
  zh: 在训练集上拟合逻辑回归模型（`glm`，family = “binomial”），并计算测试集的精度。
- en: Repeat this entire procedure **five times** with new random splits and report
    the **average test accuracy**.
  id: totrans-118
  prefs: []
  type: TYPE_NORMAL
  zh: 重复此整个程序**五次**，使用新的随机分割，并报告**平均测试精度**。
- en: '2\. We now pick predictors using t-tests, even though all predictors are noise.
    For each column of `x`, compute a t-test comparing values in the `y = 1` group
    to `y = 0`, and extract p-values:'
  id: totrans-119
  prefs: []
  type: TYPE_NORMAL
  zh: 2. 我们现在使用t检验来选择预测因子，尽管所有预测因子都是噪声。对于`x`的每一列，计算一个t检验，比较`y = 1`组中的值与`y = 0`组中的值，并提取p值：
- en: '[PRE9]'
  id: totrans-120
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: '*Create an index `ind` with the predictors whose p-values are < 0.01\. How
    many predictors survive this cutoff?'
  id: totrans-121
  prefs: []
  type: TYPE_NORMAL
  zh: '*创建一个索引`ind`，包含p值小于0.01的预测因子。有多少个预测因子通过了这个截止值？'
- en: '3\. Define:'
  id: totrans-122
  prefs: []
  type: TYPE_NORMAL
  zh: 3. 定义：
- en: '[PRE10]'
  id: totrans-123
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: '*Repeat Exercise 1 but using this new `x_subset`.'
  id: totrans-124
  prefs: []
  type: TYPE_NORMAL
  zh: '*重复练习1，但使用这个新的`x_subset`。'
- en: What is the **average test accuracy** now? Is it above 0.5?
  id: totrans-125
  prefs: []
  type: TYPE_NORMAL
  zh: 现在的**平均测试精度**是多少？它是否高于0.5？
- en: 4\. Why is accuracy > 0.5 if the data are independent?
  id: totrans-126
  prefs: []
  type: TYPE_NORMAL
  zh: 4. 为什么数据独立时精度大于0.5？
- en: 'Choose the *best* explanation:'
  id: totrans-127
  prefs: []
  type: TYPE_NORMAL
  zh: 选择**最佳**的解释：
- en: The function `train` estimates accuracy on the same data used to train the model.
  id: totrans-128
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 函数`train`估计模型训练数据上的精度。
- en: We are over-fitting because the model uses 100 predictors.
  id: totrans-129
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我们过度拟合，因为模型使用了100个预测因子。
- en: We used the **entire dataset** to perform feature selection, but cross-validation
    was done **after** selecting predictors.
  id: totrans-130
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我们使用了**整个数据集**进行特征选择，但在选择预测因子后进行了交叉验证。
- en: High accuracy is simply random variation.
  id: totrans-131
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 高精度仅仅是随机变化。
- en: 5\. Redo the analysis, but this time perform **feature selection *within* each
    resampling split**.
  id: totrans-132
  prefs: []
  type: TYPE_NORMAL
  zh: 5. 重新进行分析，但这次在每个重采样分割中进行**特征选择**。
- en: 'This means:'
  id: totrans-133
  prefs: []
  type: TYPE_NORMAL
  zh: 这意味着：
- en: For each fold or resample,
  id: totrans-134
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 对于每个折或重采样，
- en: select predictors using *only* the training portion,
  id: totrans-135
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 仅使用训练部分选择预测因子，
- en: fit the model using those selected predictors,
  id: totrans-136
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用所选预测因子拟合模型，
- en: evaluate on the corresponding test/validation portion.
  id: totrans-137
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在相应的测试/验证部分进行评估。
- en: You should now obtain an accuracy close to 0.5\. Explain why.
  id: totrans-138
  prefs: []
  type: TYPE_NORMAL
  zh: 你现在应该获得接近0.5的精度。解释原因。
- en: 6\. Load the `tissue_gene_expression` dataset.
  id: totrans-139
  prefs: []
  type: TYPE_NORMAL
  zh: 6. 加载`tissue_gene_expression`数据集。
- en: 'Split the data:'
  id: totrans-140
  prefs: []
  type: TYPE_NORMAL
  zh: 分割数据：
- en: 80% training
  id: totrans-141
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 80%训练
- en: 20% test
  id: totrans-142
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 20%测试
- en: 'Then, within the training set, repeatedly split into:'
  id: totrans-143
  prefs: []
  type: TYPE_NORMAL
  zh: 然后，在训练集中，反复分割为：
- en: 90% training
  id: totrans-144
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 90%训练
- en: 10% validation
  id: totrans-145
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 10%验证
- en: Use these validation splits to choose the best **k** for a kNN classifier (using
    `train`).
  id: totrans-146
  prefs: []
  type: TYPE_NORMAL
  zh: 使用这些验证分割来选择kNN分类器中最佳的**k**值（使用`train`）。
- en: Report the value of `k` that performs best.
  id: totrans-147
  prefs: []
  type: TYPE_NORMAL
  zh: 报告表现最佳的`k`值。
- en: 7\. Using the best `k` found in Exercise 6, retrain the kNN model on the entire
    training set, and evaluate its accuracy on the held-out test set.
  id: totrans-148
  prefs: []
  type: TYPE_NORMAL
  zh: 7. 使用在练习6中找到的最佳`k`值，在整个训练集上重新训练kNN模型，并在保留的测试集上评估其精度。
- en: Is the accuracy much worse, much better, or roughly the same as what you observed
    on the validation sets? Explain why this comparison matters.
  id: totrans-149
  prefs: []
  type: TYPE_NORMAL
  zh: 与你在验证集上观察到的准确性相比，是差得多、好得多，还是大致相同？请解释为什么这个比较很重要。
- en: 8\. We can create bootstrap samples using `createResample`.
  id: totrans-150
  prefs: []
  type: TYPE_NORMAL
  zh: 8. 我们可以使用 `createResample` 创建重采样样本。
- en: '[PRE11]'
  id: totrans-151
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: '*In the first bootstrap sample, how many times do the indices 3, 4, and 7 appear?'
  id: totrans-152
  prefs: []
  type: TYPE_NORMAL
  zh: '*在第一个重采样样本中，索引 3、4 和 7 出现了多少次？'
- en: 9\. Repeat the previous exercise for all 10 bootstrap samples.
  id: totrans-153
  prefs: []
  type: TYPE_NORMAL
  zh: 9. 对所有 10 个重采样样本重复之前的练习。
- en: Which indices never appear at all in each sample? How many observations on average
    get omitted?
  id: totrans-154
  prefs: []
  type: TYPE_NORMAL
  zh: 哪些索引在每个样本中根本不会出现？平均有多少个观察结果被省略？
- en: '10\. Explain in your own words why a bootstrap sample (sampling with replacement):'
  id: totrans-155
  prefs: []
  type: TYPE_NORMAL
  zh: 10. 用你自己的话解释为什么重采样样本（带替换的抽样）：
- en: must include some observations multiple times,
  id: totrans-156
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 必须包含一些观察结果多次出现，
- en: must omit others entirely, and
  id: totrans-157
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 必须完全省略其他所有内容，并且
- en: is still considered a valid “resampled dataset.”
  id: totrans-158
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 仍然被认为是一个有效的“重采样数据集”。
- en: Relate this explanation to the idea of using bootstrap samples to estimate prediction
    error.*******
  id: totrans-159
  prefs: []
  type: TYPE_NORMAL
  zh: 将这个解释与使用重采样样本来估计预测误差的想法联系起来。*******
