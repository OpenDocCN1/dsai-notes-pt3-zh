- en: 'In reality, we never get to observe the entire table. Instead, the data we
    observe look more like:'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: 实际上，我们永远无法观察到完整的表格。相反，我们观察到的数据看起来更像是：
- en: '| Unit | Outcome if not treated | Outcome if treated | Treated or not? |'
  id: totrans-51
  prefs: []
  type: TYPE_TB
  zh: '| 单元 | 未处理时的结果 | 处理后的结果 | 是否处理？ |'
- en: '| 1 | ? | <semantics><mrow><msub><mi>Y</mi><mn>1</mn></msub><mo stretchy="false">(</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">Y_1(1)</annotation></semantics>Y1​(1)
    | <semantics><mrow><msub><mi>Z</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn></mrow><annotation
