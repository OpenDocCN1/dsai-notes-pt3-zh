- en: 'Now that we understand association and correlation (and their limitations),
    we are ready to begin our journey into causal inference. We’ll start with a discussion
    of the concept of causality: what it means, and why it matters. Then, we’ll define
    a specific way of thinking about causality, using counterfactual reasoning, that
    will guide the remainder of our study of causal inference.'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 既然我们已经理解了关联和相关（及其局限性），现在就可以开始我们的因果推断之旅了。我们将从讨论因果关系的概念开始：它意味着什么，以及为什么重要。然后，我们将定义一种基于反事实推理的特定思考因果关系的方式，这将指导我们后续对因果推断的研究。
- en: What is causality? (Optional)[¶](#what-is-causality-optional "Link to this Section")
  id: totrans-4
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 什么是因果关系？（可选）[¶](#what-is-causality-optional "链接到此章节")
- en: 'To understand causality, let’s explore the meaning of the word “cause”. Consider
    the following sentences: all of them use words like “causes” or “because”, and
    they are all valid sentences in modern English, but the meaning of “cause” is
    slightly different in each one:'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 要理解因果关系，让我们先探讨“原因”这个词的含义。请看以下句子：它们都使用了“导致”或“因为”这类词语，并且都是现代英语中的有效句子，但“原因”在每句话中的含义略有不同：
- en: The soccer ball moved because I kicked it.
  id: totrans-6
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 足球移动是因为我踢了它。
- en: The couple broke up because one of them moved to another country.
  id: totrans-7
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 这对情侣分手是因为其中一方搬到了另一个国家。
- en: I am who I am today because of my parents.
  id: totrans-8
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我之所以成为今天的我，是因为我的父母。
- en: Gravity causes objects to fall to the Earth.
  id: totrans-9
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 重力导致物体落向地球。
- en: Down Syndrome is caused by having 3 copies of chromosome 21.
  id: totrans-10
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 唐氏综合征是由第21号染色体多出一条拷贝引起的。
- en: Humans burning fossil fuels is causing climate change.
  id: totrans-11
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 人类燃烧化石燃料正在导致气候变化。
- en: Barbarian invasions caused the Roman Empire to fall.
  id: totrans-12
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 蛮族入侵导致了罗马帝国的灭亡。
- en: Smoking causes lung cancer.
  id: totrans-13
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 吸烟会导致肺癌。
- en: 'Most modern understanding of the word “cause” aligns with what the Greek philosopher
    Aristotle called “agent” or “efficient” cause: where one agent or object brings
    about change in another. Taking a closer look at the examples above, if we limit
    ourselves to this understanding, we should eliminate sentences 3 and 4\. In sentence
    3, the thing being “caused” is “who I am today”, which doesn’t fall under the
    idea of a “change”. Similarly, in sentence 4, the thing doing the causing is “gravity”,
    which isn’t a specific thing or object, but rather a conceptual physical theory.
    Note that this is a subjective determination!'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 现代对“原因”一词的理解大多与希腊哲学家亚里士多德所称的“动因”或“有效因”一致：即一个动因或物体引发了另一个的变化。仔细观察上面的例子，如果我们局限于这种理解，就应该排除第3和第4句。在第3句中，被“导致”的是“今天的我”，这并不属于“变化”的范畴。同样，在第4句中，起“导致”作用的是“重力”，它不是一个具体的事物或物体，而是一个概念性的物理理论。请注意，这是一个主观判断！
- en: 'One way to think about cause is to divide the statements above into *deterministic*
    and *probabilistic* cause. What do these mean? If A is a deterministic cause of
    B, then whenever A happens, B must happen. In contrast, if A is a probabilistic
    cause of B, then whenever A happens, the probability of B increases. Going back
    to our examples above, sentences 1, 5, and 6 are all statements of deterministic
    causality. This doesn’t mean that the causality in the remaining sentences (2,
    7, and 8) isn’t real! For example, consider statement 7: most historians believe
    that the Roman Empire was in a prolonged state of decline before the barbarian
    invasions. However, those invasions still had a real, tangible impact on the empire’s
    fall.'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 理解因果关系的一种方式是将上述陈述分为*确定性*原因和*概率性*原因。这些意味着什么？如果A是B的确定性原因，那么每当A发生时，B必然发生。相反，如果A是B的概率性原因，那么每当A发生时，B发生的概率会增加。回到我们上面的例子，句子1、5和6都是确定性因果关系的陈述。这并不意味着其余句子（2、7和8）中的因果关系不真实！例如，考虑陈述7：大多数历史学家认为，在蛮族入侵之前，罗马帝国已处于长期的衰落状态。然而，这些入侵仍然对帝国的覆灭产生了真实而具体的影响。
- en: 'There are many other ways of thinking about causality: for example, we can
    divide the statements above into instance causality and class causality; single
    cause and multiple cause; simple action and compound action; and much more.'
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 还有许多其他思考因果关系的方式：例如，我们可以将上述陈述分为实例因果关系和类别因果关系；单一原因和多重原因；简单行为和复合行为；等等。
- en: Why does causality matter?[¶](#why-does-causality-matter "Link to this Section")
  id: totrans-17
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 因果关系为何重要？[¶](#why-does-causality-matter "Link to this Section")
- en: 'Understanding causality is important because it affects decisions people make
    in the real world. For example:'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 理解因果关系很重要，因为它影响着人们在现实世界中做出的决策。例如：
- en: In health, understanding causal links is critical for practicing evidence-based
    medicine. If we know that a certain behavior causes an illness, then doctors and/or
    public health officials should recommend that people avoid that behavior. Similarly,
    if a drug causes people to recover from a certain medical condition, then it should
    be best practice to use that drug to treat people with the condition.
  id: totrans-19
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在健康领域，理解因果联系对于实践循证医学至关重要。如果我们知道某种行为会导致疾病，那么医生和/或公共卫生官员应建议人们避免该行为。同样，如果某种药物能使人们从某种疾病中康复，那么使用该药物治疗患有该疾病的人应成为最佳实践。
- en: On the other hand, if we observe an association between a certain behavior and
    some kinds of illness, it’s important to understand whether that association is
    due to a causal link. For example, suppose a study shows an association between
    taking expensive multivitamins and lower risk of cancer. If there is in fact a
    causal link, then doctors should recommend the multivitamins. But, if the association
    is due to a confounding factor (e.g., wealthier people have access to better healthcare
    which causes lower cancer, and also have access to expensive multivitamins), then
    doctors should **not** recommend them.
  id: totrans-20
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 另一方面，如果我们观察到某种行为与某些疾病之间存在关联，那么理解这种关联是否由因果联系引起就很重要。例如，假设一项研究显示服用昂贵的复合维生素与降低癌症风险之间存在关联。如果确实存在因果联系，那么医生应推荐服用复合维生素。但是，如果这种关联是由于混杂因素造成的（例如，更富裕的人能够获得更好的医疗保健，从而降低了癌症风险，并且也能获得昂贵的复合维生素），那么医生就**不应**推荐它们。
- en: In economics and social sciences, understanding causality has important effects
    on policy choices. For example, conventional wisdom states that increasing the
    minimum wage will cause lower employment, and so any policy that increases minimum
    wage should carefully consider the tradeoffs between increased wages and lower
    overall employment. However, a [landmark 1992 study by David Card](https://doi.org/10.1177/001979399204600103)
    showed that a national minimum wage increase did not cause any changes in the
    employment rate, which motivates a change in policy in favor of higher minimum
    wages.
  id: totrans-21
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在经济学和社会科学中，理解因果关系对政策选择具有重要影响。例如，传统观点认为提高最低工资会导致就业率下降，因此任何提高最低工资的政策都应仔细权衡工资增长与整体就业下降之间的利弊。然而，[大卫·卡德在1992年的一项里程碑式研究](https://doi.org/10.1177/001979399204600103)表明，全国性最低工资的提高并未引起就业率的任何变化，这推动了支持提高最低工资的政策转变。
- en: In business, understanding causality is critical to good decision making. For
    example, knowing whether a certain advertising or marketing change will cause
    changes in consumer behavior can be a very useful factor in evaluating whether
    a business should spend money on that change.
  id: totrans-22
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在商业领域，理解因果关系对于做出良好决策至关重要。例如，了解某项广告或营销策略的改变是否会导致消费者行为的变化，是评估企业是否应该为该改变投入资金的一个非常有用的因素。
- en: Why is causality hard?[¶](#why-is-causality-hard "Link to this Section")
  id: totrans-23
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 为什么因果关系难以确定？[¶](#why-is-causality-hard "Link to this Section")
- en: As we saw in section 4.1, causality is often hard because of **confounding variables**.
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: 正如我们在第4.1节中所见，由于**混杂变量**的存在，因果关系通常很难确定。
- en: '[PRE0]'
  id: totrans-25
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: Loading...
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 正在加载...
- en: Potential outcomes and counterfactuals[¶](#potential-outcomes-and-counterfactuals
    "Link to this Section")
  id: totrans-27
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 潜在结果与反事实[¶](#potential-outcomes-and-counterfactuals "Link to this Section")
- en: '*Some of this material is covered in [Section 12.2 of the Data 8 textbook](https://inferentialthinking.com/chapters/12/2/Causality.html#potential-outcomes)
    from a more conceptual lens.*'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: '*这部分内容在[《数据8》教材第12.2节](https://inferentialthinking.com/chapters/12/2/Causality.html#potential-outcomes)中从更概念化的角度有所涉及。*'
- en: 'Suppose you have a fever, and you decide to take an aspirin. If your fever
    went away an hour later, how can we know whether the aspirin *caused* your fever
    to go down? To help us answer this question, consider the following thought experiment:
    imagine yourself in two parallel universes. In Universe 1, you took the aspirin.
    In Universe 0, you didn’t take the aspirin. If your fever improved by the same
    amount in both universes, then that seems like strong evidence that the aspirin
    did *not* cause your fever to go down. On the other hand, if your fever went down
    in Universe 1 and not in Universe 0, then that seems like strong evidence that
    the aspirin *did* cause your fever to go down.'
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: 假设你发烧了，并决定服用一片阿司匹林。如果一小时后你的烧退了，我们如何知道是否是阿司匹林*导致*了你的退烧？为了帮助我们回答这个问题，请考虑以下思想实验：想象自己身处两个平行宇宙中。在宇宙1中，你服用了阿司匹林。在宇宙0中，你没有服用阿司匹林。如果你的发烧情况在两个宇宙中改善的程度相同，那么这似乎是强有力的证据，表明阿司匹林*没有*导致你退烧。另一方面，如果你的发烧在宇宙1中退了而在宇宙0中没有，那么这似乎是强有力的证据，表明阿司匹林*确实*导致了你的退烧。
- en: 'Notationally, we’ll use <semantics><mrow><mi>Y</mi><mo stretchy="false">(</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">Y(1)</annotation></semantics>Y(1)
    to denote the outcome (in this case, your temperature) in Universe 1, and <semantics><mrow><mi>Y</mi><mo
    stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y(0)</annotation></semantics>Y(0) for the outcome
    in Universe 0 (*Note: You may also see people use superscripts, e.g., <semantics><mrow><msup><mi>Y</mi><mn>0</mn></msup></mrow><annotation
    encoding="application/x-tex">Y^0</annotation></semantics>Y0 and <semantics><mrow><msup><mi>Y</mi><mn>1</mn></msup></mrow><annotation
    encoding="application/x-tex">Y^1</annotation></semantics>Y1, but in this class
    we’ll consistently use <semantics><mrow><mi>Y</mi><mo stretchy="false">(</mo><mn>0</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">Y(0)</annotation></semantics>Y(0)
    and <semantics><mrow><mi>Y</mi><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y(1)</annotation></semantics>Y(1))*. In any real-world
    data, we only get to observe one of these: in the example above, if you decided
    to take the aspirin, then you would only ever observe <semantics><mrow><mi>Y</mi><mo
    stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y(1)</annotation></semantics>Y(1). For this reason,
    the other universe is often called the **counterfactual** universe. This brings
    us to the **fundamental problem of causal inference**: that we can never observe
    both <semantics><mrow><mi>Y</mi><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y(1)</annotation></semantics>Y(1) and <semantics><mrow><mi>Y</mi><mo
    stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y(0)</annotation></semantics>Y(0) for the same individual.'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: 在符号上，我们将使用 <semantics><mrow><mi>Y</mi><mo stretchy="false">(</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">Y(1)</annotation></semantics>Y(1)
    表示宇宙 1 中的结果（在本例中是你的体温），用 <semantics><mrow><mi>Y</mi><mo stretchy="false">(</mo><mn>0</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">Y(0)</annotation></semantics>Y(0)
    表示宇宙 0 中的结果（*注：你可能也会看到人们使用上标，例如 <semantics><mrow><msup><mi>Y</mi><mn>0</mn></msup></mrow><annotation
    encoding="application/x-tex">Y^0</annotation></semantics>Y0 和 <semantics><mrow><msup><mi>Y</mi><mn>1</mn></msup></mrow><annotation
    encoding="application/x-tex">Y^1</annotation></semantics>Y1，但在本课程中，我们将始终使用 <semantics><mrow><mi>Y</mi><mo
    stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y(0)</annotation></semantics>Y(0) 和 <semantics><mrow><mi>Y</mi><mo
    stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y(1)</annotation></semantics>Y(1)*）。在任何现实世界的数据中，我们只能观察到其中之一：在上面的例子中，如果你决定服用阿司匹林，那么你将只能观察到
    <semantics><mrow><mi>Y</mi><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y(1)</annotation></semantics>Y(1)。因此，另一个宇宙通常被称为**反事实**宇宙。这引出了**因果推断的根本问题**：我们永远无法为同一个个体同时观察到
    <semantics><mrow><mi>Y</mi><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y(1)</annotation></semantics>Y(1) 和 <semantics><mrow><mi>Y</mi><mo
    stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y(0)</annotation></semantics>Y(0)。
- en: '[PRE1]'
  id: totrans-31
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: Loading...
  id: totrans-32
  prefs: []
