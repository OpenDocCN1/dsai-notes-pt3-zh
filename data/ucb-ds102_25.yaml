    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">Y_4(1)</annotation></semantics>Y4​(1)
    | <semantics><mrow><msub><mi>Z</mi><mn>4</mn></msub><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">Z_4=1</annotation></semantics>Z4​=1 |'
  id: totrans-55
  prefs: []
  type: TYPE_TB
  zh: '| 4 | ? | <semantics><mrow><msub><mi>Y</mi><mn>4</mn></msub><mo stretchy="false">(</mo><mn>1</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">Y_4(1)</annotation></semantics>Y4​(1)
    | <semantics><mrow><msub><mi>Z</mi><mn>4</mn></msub><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">Z_4=1</annotation></semantics>Z4​=1 |'
- en: '| 5 | <semantics><mrow><msub><mi>Y</mi><mn>5</mn></msub><mo stretchy="false">(</mo><mn>0</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">Y_5(0)</annotation></semantics>Y5​(0)
    | ? | <semantics><mrow><msub><mi>Z</mi><mn>5</mn></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">Z_5=0</annotation></semantics>Z5​=0 |'
  id: totrans-56
  prefs: []
  type: TYPE_TB
  zh: '| 5 | <semantics><mrow><msub><mi>Y</mi><mn>5</mn></msub><mo stretchy="false">(</mo><mn>0</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">Y_5(0)</annotation></semantics>Y5​(0)
    | ? | <semantics><mrow><msub><mi>Z</mi><mn>5</mn></msub><mo>=</mo><mn>0</mn></mrow><annotation
    encoding="application/x-tex">Z_5=0</annotation></semantics>Z5​=0 |'
- en: 'It’s important to keep the right intuition in mind for <semantics><mrow><msub><mi>Z</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">Z_i</annotation></semantics>Zi​: this variable does
    not represent the treatment itself; instead, it represents the decision on whether
    or not to treat unit <semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics>i.
    The effect of the treatment itself is captured in the difference between <semantics><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo
    stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y_i(0)</annotation></semantics>Yi​(0) and <semantics><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo
    stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y_i(1)</annotation></semantics>Yi​(1). Let’s look
    at two examples that make this distinction clearer. These examples also preview
    some of the insights we’ll develop further in the next two sections.'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: 对于 <semantics><mrow><msub><mi>Z</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">Z_i</annotation></semantics>Zi​
    保持正确的直觉理解非常重要：这个变量并不代表处理本身；相反，它代表是否对单元 <semantics><mrow><mi>i</mi></mrow><annotation
    encoding="application/x-tex">i</annotation></semantics>i 进行处理的决策。处理本身的效果体现在 <semantics><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo
    stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y_i(0)</annotation></semantics>Yi​(0) 和 <semantics><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo
    stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y_i(1)</annotation></semantics>Yi​(1) 之间的差异上。我们来看两个例子，它们能让这个区别更加清晰。这些例子也预示了我们在接下来两节中将要进一步阐述的一些见解。
- en: In a randomized controlled trial, we randomly assign units to the treatment
    and control groups. Because the trial is randomized, the treatment/control assignment
    <semantics><mrow><msub><mi>Z</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">Z_i</annotation></semantics>Zi​
    is independent of the potential outcomes <semantics><mrow><mo stretchy="false">(</mo><msub><mi>Y</mi><mi>i</mi></msub><mo
    stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo separator="true">,</mo><msub><mi>Y</mi><mi>i</mi></msub><mo
    stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">(Y_i(0), Y_i(1))</annotation></semantics>(Yi​(0),Yi​(1)).
    This doesn’t mean that the treatment is independent of the outcome we observe!
    (Remeber, the observed outcome is <semantics><mrow><msub><mi>Y</mi><mrow><mi>i</mi><mo
    separator="true">,</mo><mi>o</mi><mi>b</mi><mi>s</mi></mrow></msub><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mo
    stretchy="false">(</mo><msub><mi>Z</mi><mi>i</mi></msub><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y_{i,obs} = Y_i(Z_i)</annotation></semantics>Yi,obs​=Yi​(Zi​))
    It only means that in a randomized controlled trial, the *decision* on whether
    or not to treat is independent of the potential outcomes. We’ll see in this next
    section how this fact can be very useful.
  id: totrans-58
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在随机对照试验中，我们将受试单位随机分配到处理组和对照组。由于试验是随机的，处理/控制分配 <semantics><mrow><msub><mi>Z</mi><mi>i</mi></msub></mrow><annotation
    encoding="application/x-tex">Z_i</annotation></semantics>Zi​ 与潜在结果 <semantics><mrow><mo
    stretchy="false">(</mo><msub><mi>Y</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mn>0</mn><mo
    stretchy="false">)</mo><mo separator="true">,</mo><msub><mi>Y</mi><mi>i</mi></msub><mo
    stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">(Y_i(0), Y_i(1))</annotation></semantics>(Yi​(0),Yi​(1))
    相互独立。这并不意味着处理与我们观察到的结果独立！（记住，观察到的结果是 <semantics><mrow><msub><mi>Y</mi><mrow><mi>i</mi><mo
    separator="true">,</mo><mi>o</mi><mi>b</mi><mi>s</mi></mrow></msub><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mo
    stretchy="false">(</mo><msub><mi>Z</mi><mi>i</mi></msub><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y_{i,obs} = Y_i(Z_i)</annotation></semantics>Yi,obs​=Yi​(Zi​)）它仅意味着在随机对照试验中，*决定*是否进行处理与潜在结果独立。我们将在下一节中看到这一事实如何非常有用。
- en: Suppose we look at an observational study measuring the effect of yacht ownership
    on attitudes toward taxation. Here, <semantics><mrow><msub><mi>Z</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">Z_i = 1</annotation></semantics> Zi​=1 if respondent
    <semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics>i
    owns a yacht; <semantics><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mn>0</mn><mo
    stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">Y_i(0)</annotation></semantics>Yi​(0)
    represents respondent <semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics>i’s
    attitude toward taxation if they *did not* own a yacht; and <semantics><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo
    stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y_i(0)</annotation></semantics>Yi​(0) represents
    respondent <semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics>i’s
    attitude toward taxation if they *did* own a yacht. In this case, we can intuitively
    see that if someone is wealthy enough to own a yacht, regardless of whether they
    do or not (i.e., whether they’re in Universe 1 or Universe 0), they will probably
    prefer lower taxes.
  id: totrans-59
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 假设我们观察一项测量游艇拥有权对税收态度影响的观察性研究。这里，<semantics><mrow><msub><mi>Z</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow><annotation
    encoding="application/x-tex">Z_i = 1</annotation></semantics> Zi​=1 表示受访者 <semantics><mrow><mi>i</mi></mrow><annotation
    encoding="application/x-tex">i</annotation></semantics>i 拥有一艘游艇；<semantics><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo
    stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y_i(0)</annotation></semantics>Yi​(0) 表示受访者 <semantics><mrow><mi>i</mi></mrow><annotation
    encoding="application/x-tex">i</annotation></semantics>i *没有*游艇时对税收的态度；而 <semantics><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo
    stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation
    encoding="application/x-tex">Y_i(0)</annotation></semantics>Yi​(0) 表示受访者 <semantics><mrow><mi>i</mi></mrow><annotation
    encoding="application/x-tex">i</annotation></semantics>i *拥有*游艇时对税收的态度。在这种情况下，我们可以直观地看到，如果某人足够富有到能拥有一艘游艇，无论他们是否真的拥有（即，无论他们处于宇宙1还是宇宙0），他们可能都倾向于更低的税收。
- en: '[PRE2]'
  id: totrans-60
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
