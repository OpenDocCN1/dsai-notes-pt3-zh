- en: Definition of Probability
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 概率的定义
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part1/probability/](https://chrispiech.github.io/probabilityForComputerScientists/en/part1/probability/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part1/probability/](https://chrispiech.github.io/probabilityForComputerScientists/en/part1/probability/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: What does it mean when someone makes a claim like "the probability that you
    find a pearl in an oyster is 1 in 5,000?" or "the probability that it will rain
    tomorrow is 52%"?
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 当有人说“你在一枚珍珠贝中找到珍珠的概率是1/5,000？”或者“明天降雨的概率是52%”时，这意味着什么？
- en: Events and Experiments
  id: totrans-4
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 事件和实验
- en: 'When we speak about probabilities, there is always an implied context, which
    we formally call the "experiment". For example: flipping two coins is something
    that probability folks would call an experiment. In order to precisely speak about
    probability, we must first define two sets: the set of all possible outcomes of
    an experiment, and the subset that we consider to be our event ([what is a set?](https://en.wikipedia.org/wiki/Set_(mathematics))).'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 当我们谈论概率时，总有一个隐含的上下文，我们正式称之为“实验”。例如：抛两个硬币是概率学家称之为实验的事情。为了精确地谈论概率，我们必须首先定义两个集合：实验所有可能结果的集合，以及我们认为是事件的子集（[什么是集合？](https://en.wikipedia.org/wiki/Set_(mathematics))）。
- en: '**Definition: Sample Space, $S$**'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: '**定义：样本空间，$S$**'
- en: 'A Sample Space is the set of all possible outcomes of an experiment. For example:'
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 样本空间是实验所有可能结果的集合。例如：
- en: 'Coin flip: $S$ = {Heads, Tails}'
  id: totrans-8
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 抛硬币：$S$ = {正面, 反面}
- en: 'Flipping two coins: $S$ = {(H, H), (H, T), (T, H), (T, T)}'
  id: totrans-9
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 抛两个硬币：$S$ = {(H, H), (H, T), (T, H), (T, T)}
- en: 'Roll of 6-sided die: $S$ = {1, 2, 3, 4, 5, 6}'
  id: totrans-10
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 掷一个六面的骰子：$S$ = {1, 2, 3, 4, 5, 6}
- en: 'The number of emails you receive in a day: $S = \{x|x ∈ ℤ, x ≥ 0\}$ (non-neg.
    ints)'
  id: totrans-11
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 你一天收到的电子邮件数量：$S = \{x|x ∈ ℤ, x ≥ 0\}$（非负整数）
- en: 'YouTube hours in a day: $S = \{x|x ∈ ℝ,0 ≤ x ≤ 24\}$'
  id: totrans-12
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 一天中的YouTube小时数：$S = \{x|x ∈ ℝ,0 ≤ x ≤ 24\}$
- en: '**Definition: Event, $E$**'
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: '**定义：事件，$E$**'
- en: 'An Event is some subset of $S$ that we ascribe meaning to. In set notation
    ($E ⊆ S$).For example:'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 事件是$S$的某个子集，我们为其赋予意义。在集合表示法中（$E ⊆ S$）。例如：
- en: 'Coin flip is heads: $E$ = {Heads}'
  id: totrans-15
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 硬币正面朝上：$E$ = {正面}
- en: At least 1 head on 2 coin flips = {(H, H), (H, T), (T, H)}
  id: totrans-16
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在两次抛硬币中至少出现一次正面 = {(H, H), (H, T), (T, H)}
- en: 'Roll of die is 3 or less: E = {1, 2, 3}'
  id: totrans-17
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 骰子掷出3或更小的点数：E = {1, 2, 3}
- en: 'You receive less than 20 emails in a day: $E = \{x|x ∈ ℤ,0 ≤ x < 20\}$ (non-neg.
    ints)'
  id: totrans-18
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 你一天收到的电子邮件少于20封：$E = \{x|x ∈ ℤ,0 ≤ x < 20\}$（非负整数）
- en: 'Wasted day (≥ 5 YouTube hours): $E = \{x|x ∈ ℝ, 5 ≤ x ≤ 24\}$'
  id: totrans-19
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 浪费的一天（≥ 5 个YouTube小时）：$E = \{x|x ∈ ℝ, 5 ≤ x ≤ 24\}$
- en: Events can be represented as capital letters such as $E$ or $F$.
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 事件可以用大写字母表示，如$E$或$F$。
- en: '[todo] In the world of probability, events are binary: they either happen or
    they don''t.'
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: '[待办] 在概率的世界里，事件是二元的：要么发生，要么不发生。'
- en: Definition of Probability
  id: totrans-22
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 概率的定义
- en: 'It wasn''t until the 20th century that humans figured out a way to precisely
    define what the word probability means:'
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 直到20世纪，人类才找到了精确定义“概率”这个词的方法：
- en: $$ \p(\text{Event}) = \lim_{n \rightarrow \infty} \frac {\text{count}(\text{Event})}
    {n} $$
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: $$ \p(\text{Event}) = \lim_{n \rightarrow \infty} \frac {\text{count}(\text{Event})}
    {n} $$
- en: 'In English this reads: let''s say you perform $n$ trials of an "experiment"
    which could result in a particular "[Event](#events)" occurring. The probability
    of the event occurring, $\p(\text{Event})$, is the ratio of trials that result
    in the event, written as $\text{count}(\text{Event})$, to the number of trials
    performed, $n$. In the limit, as your number of trials approaches infinity, the
    ratio will converge to the true probability. People also apply other semantics
    to the concept of a probability. One common meaning ascribed is that $\p(E)$ is
    a measure of the chance of event E occurring.'
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: 用英语来说，就是：假设你进行$n$次“实验”的试验，这个“实验”可能导致特定的“[事件](#events)”发生。事件发生的概率，$\p(\text{Event})$，是导致事件发生的试验次数，即$\text{count}(\text{Event})$，与进行的试验次数$n$的比值。在极限情况下，当你的试验次数趋向于无穷大时，这个比值将收敛到真正的概率。人们也将其他语义应用于概率的概念。一个常见的意义是，$\p(E)$是事件E发生的可能性的度量。
- en: '***Example***: Probability in the limit'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: '**示例**：极限情况下的概率'
- en: Here we use the definition of probability to calculate the probability of event
    $E$, rolling a "5" or a "6" on a fair [six-sided dice](https://www.google.com/search?q=dice+roller).
    Hit the "Run trials" button to start running trials of the experiment "roll dice".
    Notice how $\p(E)$, converges to $2/6$ or 0.33 repeating.
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: 这里我们使用概率的定义来计算事件$E$发生的概率，即在一个公平的[六面骰子](https://www.google.com/search?q=dice+roller)上掷出“5”或“6”。点击“运行试验”按钮开始运行实验“掷骰子”。注意$\p(E)$如何收敛到$2/6$或0.33循环。
- en: 'Event $E$: Rolling a 5 or 6 on a six-sided dice.'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 事件 $E$：掷一个六面骰子得到5或6。
- en: '* * *'
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: '*Dice outcome:****$n= $ 0 $\text{count}(E) = $ 0 $ \p(E) \approx \frac {\text{count}(E)}
    {n} = $'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: '*骰子结果：****$n= $ 0 $\text{count}(E) = $ 0 $ \p(E) \approx \frac {\text{count}(E)}
    {n} = $'
- en: '<canvas id="observed" style="max-height: 400px"></canvas>'
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: '<canvas id="observed" style="max-height: 400px"></canvas>'
- en: '<canvas id="trueProb" style="max-height: 400px"></canvas>***  *****Measure
    of uncertainty**: It is tempting to think of probability as representing some
    natural randomness in the world. That might be the case. But perhaps the world
    isn''t random. I propose a deeper way of thinking about probability. There is
    so much that we as humans don''t know, and probability is our robust language
    for expressing our belief that an event will happen given our limited knowledge.
    This interpretation acknowledges your own uncertainty of an event. Perhaps if
    you knew the position of every water molecule, you could perfectly predict tomorrow''s
    weather. But we don''t have such knowledge and as such we use probability to talk
    about the chance of rain tomorrow given the information that we have access to.'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: '<canvas id="trueProb" style="max-height: 400px"></canvas>***  *****不确定性的度量**：人们可能会倾向于认为概率代表了世界中的某种自然随机性。这可能是有道理的。但也许世界并不随机。我提出了一种更深入的概率思考方式。作为人类，我们不知道的事情太多了，而概率是我们用有限的知识表达对事件发生信念的强大语言。这种解释承认了你对事件的自身不确定性。也许如果你知道每个水分子的位置，你就能完美预测明天的天气。但我们没有这样的知识，因此我们使用概率来谈论根据我们所拥有的信息明天降雨的可能性。'
- en: '**Origins of probabilities**: The different interpretations of probability
    are reflected in the many origins of probabilities that you will encounter in
    the wild (and not so wild) world. Some probabilities are calculated analytically
    using mathematical proofs. Some probabilities are calculated from data, experiments
    or simulations. Some probabilities are just made up to represent a belief. Most
    probabilities are generated from a combination of the above. For example, someone
    will make up a prior belief, that belief will be mathematically updated using
    data and evidence. Here is an example of calculating a probability from data:'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: '**概率的起源**：概率的不同解释反映在你在现实世界（无论是多么不寻常的世界）中遇到的概率的多种来源中。有些概率是通过数学证明进行解析计算的。有些概率是从数据、实验或模拟中计算得出的。有些概率只是被编造出来以代表一种信念。大多数概率是从上述方法的组合中产生的。例如，有人会提出一个先验信念，然后使用数据和证据对这个信念进行数学更新。以下是从数据计算概率的一个例子：'
- en: '**Probabilities and simulations**: Another way to compute probabilities is
    via simulation. For some complex problems where the probabilities are too hard
    to compute analytically you can run simulations using your computer. If your simulations
    generate believable trials from the sample space, then the probability of an event
    E is approximately equal to the fraction of simulations that produced an outcome
    from E. Again, by the definition of probability, as your number of simulations
    approaches infinity, the estimate becomes more accurate.'
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: '**概率和模拟**：计算概率的另一种方式是通过模拟。对于一些复杂的问题，其中概率很难通过解析方法计算，你可以使用计算机进行模拟。如果你的模拟能够从样本空间中生成可信的试验，那么事件E的概率大约等于产生E结果的模拟次数的比例。再次强调，根据概率的定义，随着模拟次数接近无穷大，估计值会变得更加准确。'
- en: '**Probabilities and percentages**: You might hear people refer to a probability
    as a percent. That the probability of rain tomorrow is 32%. The proper way to
    state this would be to say that 0.32 is the probability of rain. Percentages are
    simply probabilities multiplied by 100\. "Percent" is Latin for "out of one hundred".'
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: '**概率和百分比**：你可能会听到人们将概率称为百分比。比如说，明天下雨的概率是32%。正确的说法应该是，0.32是降雨的概率。百分比仅仅是概率乘以100。在拉丁语中，“percent”意为“每百”。'
- en: '***Problem:*** Use the definition of probability to approximate the answer
    to the question: "What is the probability a newborn elephant child is male?" Contrary
    to what you might think the gender outcomes of a newborn elephant are not equally
    likely between male and female. You have data from a report in Animal Reproductive
    Science which states that 3,070 elephants were born in Myanmar of which 2,180
    were male [[1](https://www.sciencedirect.com/science/article/pii/S0378432008004442?casa_token=ZTNldN7tjWQAAAAA:4lqVmht0l5ZWe0IsmUFei9VnYrtMAdQ9v4SAEkNCdOh6BBgFFesmlF6YQytPwVNrfrrPxNjbRoE)].
    Humans also don''t have a 50/50 sex ratio at birth [[2](https://www.aihw.gov.au/getmedia/2a0c22a2-ba27-4ba0-ad47-ebbe51854cd6/aihw-per-100-in-brief.pdf.aspx)].'
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: '***问题：*** 使用概率的定义来近似回答问题：“新生象崽为雄性的概率是多少？” 与你想象的相反，新生象的性别结果在雄性和雌性之间并不等可能。你从《动物繁殖科学》报告中有数据，其中指出在缅甸出生的象有
    3,070 头，其中 2,180 头是雄性 [[1](https://www.sciencedirect.com/science/article/pii/S0378432008004442?casa_token=ZTNldN7tjWQAAAAA:4lqVmht0l5ZWe0IsmUFei9VnYrtMAdQ9v4SAEkNCdOh6BBgFFesmlF6YQytPwVNrfrrPxNjbRoE)]。人类出生时的性别比例也不是
    50/50 [[2](https://www.aihw.gov.au/getmedia/2a0c22a2-ba27-4ba0-ad47-ebbe51854cd6/aihw-per-100-in-brief.pdf.aspx)]。'
- en: '***Answer:*** The Experiment is: A single elephant birth in Myanmar.'
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案：*** 实验是：缅甸的一次单独象出生。'
- en: The sample space is the set of possible sexes assigned at birth, {Male, Female,
    Intersex}.
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: 样本空间是出生时可能分配的性别的集合，$\{Male, Female, Intersex\}$。
- en: $E$ is the event that a new-born elephant child is male, which in set notation
    is the subset {Male} of the sample space. The outcomes are not equally likely.
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: $E$ 是新生象崽为雄性的事件，在集合表示法中是样本空间 $\{Male\}$ 的子集。结果并不等可能。
- en: 'By the definition of probability, the ratio — of trials that result in the
    event, to the total number of trials — will tend to our desired probability:'
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 根据概率的定义，试验结果与总试验次数的比率将趋向于我们期望的概率：
- en: $$ \begin{aligned} \p(\text{Born Male}) &= \p(E) \\ &= \lim_{n \rightarrow \infty}\frac{\text{count}(E)}{n}
    \\ &\approx \frac{2,180}{3,070} \\ &\approx 0.710\end{aligned}$$
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: $$ \begin{aligned} \p(\text{Born Male}) &= \p(E) \\ &= \lim_{n \rightarrow \infty}\frac{\text{count}(E)}{n}
    \\ &\approx \frac{2,180}{3,070} \\ &\approx 0.710\end{aligned}$$
- en: 'Since 3,000 is quite a bit less than infinity, this is an approximation. It
    turns out, however, to be a rather good one. A few important notes: there is no
    guarantee that our estimate applies to elephants outside Myanmar. Later in the
    class we will develop language for "how confident we can be in a number like 0.71
    after 3,000 trials?" Using tools from later in class we can say that we have 98%
    confidence that the true probability is within 0.02 of 0.710.'
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: 由于 3,000 相当小于无穷大，这是一个近似值。然而，结果却相当好。一些重要的注意事项：我们的估计并不保证适用于缅甸以外的象。在接下来的课程中，我们将发展用于“在
    3,000 次试验后，我们可以在数字 0.71 的情况下有多大的信心？”的语言。使用课程后面的工具，我们可以说，我们有 98% 的信心，真实概率在 0.710
    的 0.02 范围内。
- en: Axioms of Probability
  id: totrans-43
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 概率公理
- en: 'Here are some basic truths about probabilities that we accept as axioms:'
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 这里有一些关于概率的基本真理，我们将其作为公理接受：
- en: '| **Axiom 1**: $0 ≤ \p(E) ≤ 1$ | All probabilities are numbers between 0 and
    1. |'
  id: totrans-45
  prefs: []
  type: TYPE_TB
  zh: '| **公理 1**: $0 ≤ \p(E) ≤ 1$ | 所有概率都是介于 0 和 1 之间的数字。 |'
- en: '| **Axiom 2**: $\p(S) = 1$ | All outcomes must be from the [Sample Space](#sampleSpace).
    |'
  id: totrans-46
  prefs: []
  type: TYPE_TB
  zh: '| **公理 2**: $\p(S) = 1$ | 所有结果都必须来自 [样本空间](#sampleSpace)。 |'
- en: '| **Axiom 3**: If $E$ and $F$ are mutually exclusive, then $\p(E \text{ or
    } F) = \p(E) + \p(F)$ | The probability of "or" for mutually exclusive events
    |'
  id: totrans-47
  prefs: []
  type: TYPE_TB
  zh: '| **公理 3**: 如果 $E$ 和 $F$ 是互斥的，那么 $\p(E \text{ 或 } F) = \p(E) + \p(F)$ | 互斥事件的“或”的概率
    |'
- en: These three axioms are formally called the [Kolmogorov axioms](https://en.wikipedia.org/wiki/Probability_axioms)
    and they are considered to be the foundation of probability theory. They are also
    useful identities!
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: 这三个公理正式称为 [柯尔莫哥洛夫公理](https://en.wikipedia.org/wiki/Probability_axioms)，并被认为概率论的基础。它们也是非常有用的恒等式！
- en: 'You can convince yourself of the first axiom by thinking about the math definition
    of probability. As you perform trials of an experiment it is not possible to get
    more events than trials (thus probabilities are less than 1) and it''s not possible
    to get less than 0 occurrences of the event (thus probabilities are greater than
    0). The second axiom makes sense too. If your event is the sample space, then
    each trial must produce the event. This is sort of like saying; the probability
    of you eating cake (event) if you eat cake (sample space that is the same as the
    event) is 1. The third axiom is more complex and in this textbook we dedicate
    an entire chapter to understanding it: Probability of or. It applies to events
    that have a special property called "mutual exclusion": the events do not share
    any outcomes.'
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: 你可以通过思考概率的数学定义来确信第一个公理。当你进行实验的试验时，不可能得到比试验更多的事件（因此概率小于1），也不可能得到事件发生的次数少于0（因此概率大于0）。第二个公理也是有意义的。如果你的事件是样本空间，那么每个试验都必须产生该事件。这有点像说；如果你吃蛋糕（事件），那么你吃蛋糕（与事件相同的样本空间）的概率是1。第三个公理更复杂，在这本教科书中，我们专门用一章来理解它：或的概率。它适用于具有特殊属性“互斥”的事件：事件不共享任何结果。
- en: These axioms have great historical significance. In the early 1900s it was not
    clear if probability was somehow different than other fields of math -- perhaps
    the set of techniques and systems of proofs from other fields of mathematics couldn't
    apply. Kolmogorov's great success was to show to the world that the tools of mathematics
    did in fact apply to probability. From the foundation provided by this set of
    axioms mathematicians built the edifice of probability theory.
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: 这些公理具有重大的历史意义。在20世纪初，人们并不清楚概率是否与其他数学领域有所不同——也许其他数学领域的技巧和证明系统无法适用。科尔莫哥洛夫的巨大成功在于向世界展示，数学的工具实际上适用于概率。基于这一套公理，数学家们构建了概率理论的体系。
- en: Provable Identities
  id: totrans-51
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 可证明的推论
- en: We often refer to these as corollaries that are directly provable from the three
    axioms given above.
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: 我们通常将这些称为可以直接从上述三个公理中证明的推论。
- en: '| **Identity 1**: $\p(E\c) = 1 - \p(E)$ | The probability of event E not happening
    |'
  id: totrans-53
  prefs: []
  type: TYPE_TB
  zh: '| **身份 1**: $\p(E\c) = 1 - \p(E)$ | 事件 E 不发生的概率 |'
- en: '| **Identity 2**: If $E ⊆ F$, then $\p(E) ≤ \p(F)$ | Events which are subsets
    |'
  id: totrans-54
  prefs: []
  type: TYPE_TB
  zh: '| **身份 2**: 如果 $E ⊆ F$，那么 $\p(E) ≤ \p(F)$ | 子事件 |'
- en: This first identity is especially useful. For any event, you can calculate the
    probability of the event *not* occurring which we write in probability notation
    as $E\c$, if you know the probability of it occurring -- and vice versa. We can
    also use this identity to show you what it looks like to prove a theorem in probability.
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: 这个第一个推论特别有用。对于任何事件，如果你知道它发生的概率，你可以计算出它不发生的概率，我们用概率符号写作 $E\c$，反之亦然。我们还可以使用这个推论向你展示如何证明概率论中的定理。
- en: '***Proof:*** $\p(E\c) = 1 - \p(E)$ $$ \begin{align} \p(S) &= \p(E \or E\c)
    && \text{$E$ or $E\c$ covers every outcome in the sample space} \\ \p(S) &= \p(E)
    + \p(E\c) && \text{Events $E$ and $E\c$ are mututally exclusive} \\ 1 &= \p(E)
    + \p(E\c) && \text{Axiom 2 of probability} \\ \p(E\c) &= 1 - \p(E) && \text{By
    re-arranging} \end{align} $$***'
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: '***证明：*** $\p(E\c) = 1 - \p(E)$ $$ \begin{align} \p(S) &= \p(E \or E\c) &&
    \text{事件 $E$ 或 $E\c$ 覆盖样本空间中的每个结果} \\ \p(S) &= \p(E) + \p(E\c) && \text{事件 $E$
    和 $E\c$ 是互斥的} \\ 1 &= \p(E) + \p(E\c) && \text{概率公理 2} \\ \p(E\c) &= 1 - \p(E)
    && \text{通过重新排列} \end{align} $$***'
