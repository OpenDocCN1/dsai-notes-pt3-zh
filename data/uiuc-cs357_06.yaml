  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用泰勒级数近似一个函数
- en: Approximate function derivatives using a Taylor series
  id: totrans-4
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用泰勒级数近似函数导数
