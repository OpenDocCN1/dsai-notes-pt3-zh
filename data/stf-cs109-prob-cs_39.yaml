- en: '[PRE0]'
  id: totrans-38
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: It is important to note that in the python library, the second parameter for
    the Normal distribution is standard deviation **not** variance, as it is typically
    defined in math notation. Recall that standard deviation is the square root of
    variance.
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: 重要的是要注意，在Python库中，正态分布的第二个参数是标准差**而不是**方差，正如它在数学符号中通常定义的那样。回想一下，标准差是方差的平方根。
