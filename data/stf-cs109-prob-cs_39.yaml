- en: Linear Transform
  id: totrans-21
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 线性变换
- en: 'If $X$ is a Normal such that $X \sim N(\mu, \sigma^2)$ and $Y$ is a linear
    transform of $X$ such that $Y = aX + b$ then $Y$ is also a Normal where: \begin{align*}
    Y \sim N(a\mu + b, a^2\sigma^2) \end{align*}'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 如果 $X$ 是一个正态分布，即 $X \sim N(\mu, \sigma^2)$，且 $Y$ 是 $X$ 的线性变换，即 $Y = aX + b$，那么
    $Y$ 也是一个正态分布，其中：\begin{align*} Y \sim N(a\mu + b, a^2\sigma^2) \end{align*}
- en: Projection to Standard Normal
  id: totrans-23
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 投影到标准正态
- en: 'For any Normal $X$ we can find a linear transform from $X$ to the standard
    normal $Z \sim N(0, 1)$. Note that $Z$ is the typical notation choice for the
    standard normal. For any normal, if you subtract the mean ($\mu$) of the normal
    and divide by the standard deviation ($\sigma$) the result is always the standard
    normal. We can prove this mathematically. Let $W = \frac{X - \mu}{\sigma}$: \begin{align*}
    W &= \frac{X -\mu}{\sigma} && \text{ Transform X: Subtract by $\mu$ and diving
    by $\sigma$} \\ & = \frac{1}{\sigma}X - \frac{\mu}{\sigma} && \text{ Use algebra
    to rewrite the equation}\\ & = aX + b && \text{ Linear transform where $a = \frac{1}{\sigma}$,
    $b = - \frac{\mu}{\sigma}$ }\\ &\sim N(a\mu + b, a^2\sigma^2) && \text{ The linear
    transform of a Normal is another Normal}\\ &\sim N(\frac{\mu}{\sigma} - \frac{\mu}{\sigma},
    \frac{\sigma^2}{\sigma^2}) && \text{ Substituting values in for $a$ and $b$}\\
    &\sim N(0, 1) && \text{ The standard normal} \end{align*}'
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: 对于任何正态变量 $X$，我们可以找到一个从 $X$ 到标准正态变量 $Z \sim N(0, 1)$ 的线性变换。注意，$Z$ 是标准正态的典型表示法。对于任何正态变量，如果你从正态变量中减去均值（$\mu$）并除以标准差（$\sigma$），结果总是标准正态。我们可以用数学方法证明这一点。设
    $W = \frac{X - \mu}{\sigma}$：\begin{align*} W &= \frac{X -\mu}{\sigma} && \text{
    对 $X$ 进行变换：减去 $\mu$ 并除以 $\sigma$} \\ & = \frac{1}{\sigma}X - \frac{\mu}{\sigma}
    && \text{ 使用代数重写方程}\\ & = aX + b && \text{ 线性变换，其中 $a = \frac{1}{\sigma}$，$b =
    - \frac{\mu}{\sigma}$ }\\ &\sim N(a\mu + b, a^2\sigma^2) && \text{ 正态变量的线性变换是另一个正态}\\
    &\sim N(\frac{\mu}{\sigma} - \frac{\mu}{\sigma}, \frac{\sigma^2}{\sigma^2}) &&
    \text{ 代入 $a$ 和 $b$ 的值}\\ &\sim N(0, 1) && \text{ 标准正态} \end{align*}
- en: 'Using this transform we can express $F_X(x)$, the CDF of $X$, in terms of the
    known CDF of $Z$, $F_Z(x)$. Since the CDF of $Z$ is so common it gets its own
    Greek symbol: $\Phi(x)$ \begin{align*} F_X(x) &= P(X \leq x) \\ &= P\left(\frac{X
    - \mu}{\sigma} \leq \frac{x - \mu}{\sigma}\right) \\ &= P\left(Z \leq \frac{x
    - \mu}{\sigma}\right)\\ &= \Phi\left(\frac{x - \mu}{\sigma}\right) \end{align*}'
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: 使用这个变换，我们可以用已知的 $Z$ 的累积分布函数 $F_Z(x)$ 来表示 $X$ 的累积分布函数 $F_X(x)$。由于 $Z$ 的累积分布函数非常常见，它得到了自己的希腊符号：$\Phi(x)$
    \begin{align*} F_X(x) &= P(X \leq x) \\ &= P\left(\frac{X - \mu}{\sigma} \leq
    \frac{x - \mu}{\sigma}\right) \\ &= P\left(Z \leq \frac{x - \mu}{\sigma}\right)\\
    &= \Phi\left(\frac{x - \mu}{\sigma}\right) \end{align*}
- en: The values of $\Phi(x)$ can be looked up in a table. Every modern programming
    language also has the ability to calculate the CDF of a normal random variable!
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 可以在表中查找 $\Phi(x)$ 的值。每种现代编程语言也都有计算正态随机变量累积分布函数（CDF）的能力！
- en: '***Example***: Let $X\sim \mathcal{N}(3, 16)$, what is $P(X > 0)$? \begin{align*}
    P(X > 0) &= P\left(\frac{X-3}{4} > \frac{0-3}{4}\right) = P\left(Z > -\frac{3}{4}\right)
    = 1 - P\left(Z \leq -\frac{3}{4}\right)\\ &= 1 - \Phi(-\frac{3}{4}) = 1 - (1-
    \Phi(\frac{3}{4})) = \Phi(\frac{3}{4}) = 0.7734 \end{align*} What is $P(2 < X
    < 5)$? \begin{align*} P(2 < X < 5) &= P\left(\frac{2 - 3}{4} < \frac{X-3}{4} <
    \frac{5-3}{4}\right) = P\left(-\frac{1}{4} < Z < \frac{2}{4}\right)\\ &= \Phi(\frac{2}{4})-\Phi(-\frac{1}{4})
    = \Phi(\frac{1}{2})-(1 - \Phi(\frac{1}{4})) = 0.2902 \end{align*}'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: '***示例***：设 $X\sim \mathcal{N}(3, 16)$，$P(X > 0)$ 是多少？\begin{align*} P(X > 0)
    &= P\left(\frac{X-3}{4} > \frac{0-3}{4}\right) = P\left(Z > -\frac{3}{4}\right)
    = 1 - P\left(Z \leq -\frac{3}{4}\right)\\ &= 1 - \Phi(-\frac{3}{4}) = 1 - (1-
    \Phi(\frac{3}{4})) = \Phi(\frac{3}{4}) = 0.7734 \end{align*} $P(2 < X < 5)$ 是多少？\begin{align*}
    P(2 < X < 5) &= P\left(\frac{2 - 3}{4} < \frac{X-3}{4} < \frac{5-3}{4}\right)
    = P\left(-\frac{1}{4} < Z < \frac{2}{4}\right)\\ &= \Phi(\frac{2}{4})-\Phi(-\frac{1}{4})
    = \Phi(\frac{1}{2})-(1 - \Phi(\frac{1}{4})) = 0.2902 \end{align*}'
- en: '***Example***: You send voltage of 2 or -2 on a wire to denote 1 or 0\. Let
    $X$ = voltage sent and let $R$ = voltage received. $R = X + Y$, where $Y \sim
    \mathcal{N}(0, 1)$ is noise. When decoding, if $R \geq 0.5$ we interpret the voltage
    as 1, else 0\. What is $P(\text{error after decoding}|\text{original bit} = 1)$?
    \begin{align*} P(X + Y < 0.5) &= P(2 + Y < 0.5) \\ &= P(Y < -1.5) \\ &= \Phi(-1.5)
    \\ &\approx 0.0668 \end{align*}'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: '***示例***：你可以在导线上发送2或-2伏特的电压来表示1或0。设 $X$ = 发送的电压，设 $R$ = 接收到的电压。$R = X + Y$，其中
    $Y \sim \mathcal{N}(0, 1)$ 是噪声。在解码时，如果 $R \geq 0.5$，我们解释电压为1，否则为0。解码后原比特为1的情况下发生错误的概率
    $P(\text{error after decoding}|\text{original bit} = 1)$ 是多少？\begin{align*} P(X
    + Y < 0.5) &= P(2 + Y < 0.5) \\ &= P(Y < -1.5) \\ &= \Phi(-1.5) \\ &\approx 0.0668
    \end{align*}'
- en: '***Example***: The 67% rule of a normal within one standard deviation. What
    is the probability that a normal variable $X \sim \N(\mu, \sigma)$ has a value
    within one standard deviation of its mean?'
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: '***示例***：在标准差内的67%规则。一个正态变量 $X \sim \N(\mu, \sigma)$ 的值在其均值的一个标准差内的概率是多少？'
- en: $$ \begin{align} \p(\text{Within one }\sigma \text{ of } \mu) &= \p(\mu - \sigma
    < X < \mu + \sigma) \\ &= \p(X < \mu + \sigma) - \p(X < \mu - \sigma) && \text{Prob
    of a range} \\ &= \Phi\Big(\frac{(\mu + \sigma)-\mu}{\sigma}\Big) - \Phi\Big(\frac{(\mu
    - \sigma)-\mu}{\sigma}\Big) && \text{CDF of Normal} \\ &= \Phi\Big(\frac{\sigma}{\sigma}\Big)
    - \Phi\Big(\frac{- \sigma}{\sigma}\Big) && \text{Cancel $\mu$s} \\ &= \Phi(1)
    - \Phi(-1) && \text{Cancel $\sigma$s} \\ &\approx 0.8413 - 0.1587 \approx 0.683
    && \text{Plug into $\Phi$} \end{align} $$ We made no assumption about the value
    of $\mu$ or the value of $\sigma$ so this will apply to every single normal random
    variable. Since it uses the Normal CDF this doesn't apply to other types of random
    variables.
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: $$ \begin{align} \text{在} \mu \text{的一个} \sigma \text{范围内} \text{的概率} &= \p(\mu
    - \sigma < X < \mu + \sigma) \\ &= \p(X < \mu + \sigma) - \p(X < \mu - \sigma)
    && \text{范围的概率} \\ &= \Phi\Big(\frac{(\mu + \sigma)-\mu}{\sigma}\Big) - \Phi\Big(\frac{(\mu
    - \sigma)-\mu}{\sigma}\Big) && \text{正态分布的CDF} \\ &= \Phi\Big(\frac{\sigma}{\sigma}\Big)
    - \Phi\Big(\frac{- \sigma}{\sigma}\Big) && \text{消去} \mu \text{项} \\ &= \Phi(1)
    - \Phi(-1) && \text{消去} \sigma \text{项} \\ &\approx 0.8413 - 0.1587 \approx 0.683
    && \text{代入} \Phi \text{函数} \end{align} $$ 我们没有对 $\mu$ 或 $\sigma$ 的值做出任何假设，因此这适用于每一个正态随机变量。由于它使用了正态CDF，所以这不适用于其他类型的随机变量。
- en: CDF Calculator
  id: totrans-31
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: CDF计算器
- en: 'To calculate the Cumulative Density Function (CDF) for a normal (aka Gaussian)
    random variable at a value $x$, also writen as $F(x)$, you can transform your
    distribution to the "standard normal" and look up the corresponding value in the
    standard normal CDF. However, most programming libraries will provide a normal
    cdf funciton:'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 要计算正态分布（也称为高斯分布）随机变量在值 $x$ 处的累积密度函数（CDF），也写作 $F(x)$，你可以将你的分布转换为“标准正态分布”并在标准正态CDF中查找相应的值。然而，大多数编程库都会提供一个正态CDF函数：
- en: '**Norm CDF Calculator**'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: '**正态分布累积密度函数计算器**'
