- en: Normal Distribution
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 正态分布
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part2/normal/](https://chrispiech.github.io/probabilityForComputerScientists/en/part2/normal/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part2/normal/](https://chrispiech.github.io/probabilityForComputerScientists/en/part2/normal/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: 'The single most important random variable type is the Normal (aka Gaussian)
    random variable, parametrized by a mean ($\mu$) and variance ($\sigma^2$), or
    sometimes equivalently written as mean and variance ($\sigma^2$). If $X$ is a
    normal variable we write $X \sim N(\mu, \sigma^2)$. The normal is important for
    many reasons: it is generated from the summation of independent random variables
    and as a result it occurs often in nature. Many things in the world are not distributed
    normally but data scientists and computer scientists model them as Normal distributions
    anyways. Why? Because it is the most entropic (conservative) modelling decision
    that we can make for a random variable while still matching a particular expectation
    (average value) and variance (spread).'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 最重要的随机变量类型是正态（又称高斯）随机变量，它由均值（$\mu$）和方差（$\sigma^2$）参数化，有时也可以等价地写成均值和方差（$\sigma^2$）。如果
    $X$ 是一个正态变量，我们写成 $X \sim N(\mu, \sigma^2)$。正态分布之所以重要，是因为它是由独立随机变量的和生成的，因此它在自然界中很常见。世界上许多事物并非呈正态分布，但数据科学家和计算机科学家仍然将它们建模为正态分布。为什么？因为它是在匹配特定期望（平均值）和方差（分散度）的同时，我们能为随机变量做出的最熵（保守）的建模决策。
- en: 'The Probability Density Function (PDF) for a Normal $X \sim N(\mu, \sigma^2)$
    is: \begin{align*} f_X(x) = \frac{1}{\sigma \sqrt{2\pi} } e ^{\frac{-(x-\mu)^2}{2\sigma^2}}
    \end{align*} Notice the $x$ in the exponent of the PDF function. When $x$ is equal
    to the mean ($\mu$) then e is raised to the power of $0$ and the PDF is maximized.'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 正态分布的概率密度函数（PDF）对于 $X \sim N(\mu, \sigma^2)$ 是：\begin{align*} f_X(x) = \frac{1}{\sigma
    \sqrt{2\pi} } e ^{\frac{-(x-\mu)^2}{2\sigma^2}} \end{align*} 注意 PDF 函数指数中的 $x$。当
    $x$ 等于均值 ($\mu$) 时，e 的指数为 $0$，PDF 达到最大值。
- en: By definition a Normal has $\E[X] = \mu$ and $\var(X) = \sigma^2$.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 根据定义，正态分布有 $\E[X] = \mu$ 和 $\var(X) = \sigma^2$。
- en: 'There is no closed form for the integral of the Normal PDF, and as such there
    is no closed form CDF. However we can use a transformation of any normal to a
    normal with a precomputed CDF. The result of this mathematical gymnastics is that
    the CDF for a Normal $X \sim N(\mu, \sigma^2)$ is: \begin{align*} F_X(x) = \Phi\left(\frac{x
    - \mu}{\sigma}\right) \end{align*}'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 正态 PDF 的积分没有封闭形式，因此也没有封闭形式的 CDF。然而，我们可以将任何正态分布转换为具有预计算 CDF 的正态分布。这种数学技巧的结果是，正态分布
    $X \sim N(\mu, \sigma^2)$ 的 CDF 为：\begin{align*} F_X(x) = \Phi\left(\frac{x -
    \mu}{\sigma}\right) \end{align*}
- en: Where $\Phi$ is a precomputed function that represents that CDF of the Standard
    Normal.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 其中 $\Phi$ 是一个预计算的函数，表示标准正态的 CDF。
- en: '**Normal (aka Gaussian) Random Variable**'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: '**正态（又称高斯）随机变量**'
- en: '| Notation: | $X \sim \N(\mu, \sigma^2)$ |'
  id: totrans-9
  prefs: []
  type: TYPE_TB
  zh: '| 符号：| $X \sim \N(\mu, \sigma^2)$ |'
- en: '| Description: | A common, naturally occurring distribution. |'
  id: totrans-10
  prefs: []
  type: TYPE_TB
  zh: '| 描述：| 一种常见且自然发生的分布。 |'
- en: '| Parameters: | $\mu \in \mathbb{R}$, the mean. $\sigma^2 \in \mathbb{R}$,
    the variance.'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: '| 参数：| $\mu \in \mathbb{R}$，均值。$\sigma^2 \in \mathbb{R}$，方差。'
- en: '|'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: '|'
- en: '| Support: | $x \in \mathbb{R}$ |'
  id: totrans-13
  prefs: []
  type: TYPE_TB
  zh: '| 支持集：| $x \in \mathbb{R}$ |'
- en: '| PDF equation: | $$f(x) = \frac{1}{\sigma \sqrt{2 \pi}} e^{-\frac{1}{2}\Big(\frac{x-\mu}{\sigma}\Big)^2}$$
    |'
  id: totrans-14
  prefs: []
  type: TYPE_TB
  zh: '| PDF 方程：| $$f(x) = \frac{1}{\sigma \sqrt{2 \pi}} e^{-\frac{1}{2}\Big(\frac{x-\mu}{\sigma}\Big)^2}$$
    |'
- en: '| CDF equation: | $$\begin{align} F(x) &= \phi(\frac{x-\mu}{\sigma}) && \text{Where
    $\phi$ is the CDF of the standard normal} \end{align}$$ |'
  id: totrans-15
  prefs: []
  type: TYPE_TB
  zh: '| CDF 方程：| $$\begin{align} F(x) &= \phi(\frac{x-\mu}{\sigma}) && \text{其中 $\phi$
    是标准正态的 CDF} \end{align}$$ |'
- en: '| Expectation: | $\E[X] = \mu$ |'
  id: totrans-16
  prefs: []
  type: TYPE_TB
  zh: '| 期望：| $\E[X] = \mu$ |'
- en: '| Variance: | $\var(X) = \sigma^2$ |'
  id: totrans-17
  prefs: []
  type: TYPE_TB
  zh: '| 方差：| $\var(X) = \sigma^2$ |'
