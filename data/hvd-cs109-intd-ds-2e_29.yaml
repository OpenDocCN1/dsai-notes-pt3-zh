- en: Summary Statistics
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 摘要统计
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/summaries/intro-summaries.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/summaries/intro-summaries.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/summaries/intro-summaries.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/summaries/intro-summaries.html)
- en: 'We begin with one of the simplest and most powerful tools in data analysis:
    summarizing data. This part of the book introduces techniques that help us describe
    and understand datasets without relying on probability models. These summaries
    will later provide the intuition needed to understand statistical modeling and
    inference.'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 我们从数据分析中最简单、最强大的工具之一开始：数据摘要。本书的这一部分介绍了帮助我们描述和理解数据集的技术，而不依赖于概率模型。这些摘要将后来提供理解统计建模和推断所需的直觉。
- en: In the first chapter, we focus on distributions, visual representations such
    as histograms and density plots, that reveal patterns of variation, symmetry,
    and outliers. In the second chapter, we move from pictures to numbers, introducing
    numerical summaries such as the average and standard deviation, which quantify
    the center and spread of a distribution. To motivate these summaries, we introduce
    the normal distribution.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 在第一章中，我们关注分布、如直方图和密度图这样的视觉表示，它们揭示了变化的模式、对称性和异常值。在第二章中，我们从图像转向数字，介绍了如平均值和标准差这样的数值摘要，它们量化了分布的中心和范围。为了激发这些摘要，我们引入了正态分布。
- en: 'However, these summarize are not ideal for all datasets. Outliers and skewed
    distributions can make certain summaries, like the average and standard deviation,
    less appropriate or cause them to no longer represent what we think they do. For
    this reason, we also introduce rank-based summaries such as the median and interquartile
    range, which are more robust to outliers and provide complementary perspectives
    on data. Together, these ideas form the foundation of data analysis: describing
    what we see before we attempt to model why it happens.'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，这些摘要并不适用于所有数据集。异常值和偏斜分布可能会使某些摘要，如平均值和标准差，变得不太合适，或者导致它们不再代表我们原本认为它们所代表的内容。因此，我们也介绍了基于排名的摘要，如中位数和四分位数范围，这些摘要对异常值更加稳健，并提供了对数据的补充视角。这些想法共同构成了数据分析的基础：在我们尝试建模为什么会出现这些现象之前，描述我们所看到的内容。
