- en: Bayes' Theorem
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 贝叶斯定理
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part1/bayes_theorem/](https://chrispiech.github.io/probabilityForComputerScientists/en/part1/bayes_theorem/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part1/bayes_theorem/](https://chrispiech.github.io/probabilityForComputerScientists/en/part1/bayes_theorem/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: Bayes' Theorem is one of the most ubiquitous results in probability for computer
    scientists. In a nutshell, Bayes' theorem provides a way to convert a conditional
    probability from one direction, say $\p(E|F)$, to the other direction, $\p(F|E)$.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 贝叶斯定理是计算机科学家在概率论中最普遍的结果之一。简而言之，贝叶斯定理提供了一种将一个方向的条件概率（例如 $\p(E|F)$）转换为另一个方向（例如
    $\p(F|E)$）的方法。
- en: 'Bayes'' theorem is a mathematical identity which we can derive ourselves. Start
    with the definition of conditional probability and then expand the $\and$ term
    using the chain rule: $$ \begin{align} \p(F|E) &= \frac{\p(F \and E)}{\p(E)} &&
    \text{Def of } \href{ ../../part1/cond_prob/}{\text{conditional probability}}
    \\ &= \frac{\p(E | F) \cdot \p(F)}{\p(E)} && \text{Substitute the } \href{ ../../part1/cond_prob/#chain_rule}{\text{chain
    rule}} \text{ for $\p(F \and E)$} \end{align} $$'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 贝叶斯定理是一个我们可以自己推导的数学恒等式。从条件概率的定义开始，然后使用链式法则展开 $\and$ 项：$$ \begin{align} \p(F|E)
    &= \frac{\p(F \and E)}{\p(E)} && \text{条件概率的定义} \\\ &= \frac{\p(E | F) \cdot \p(F)}{\p(E)}
    && \text{用链式法则替换 $\p(F \and E)$} \end{align} $$
- en: 'This theorem makes no assumptions about $E$ or $F$ so it will apply for any
    two events. Bayes'' theorem is exceptionally useful because it turns out to be
    the ubiquitous way to answer the question: "how can I update a belief about something,
    which is not directly observable, given evidence." This is for good reason. For
    many "noisy" measurements it is straightforward to estimate the probability of
    the noisy observation given the true state of the world. However, what you would
    really like to know is the conditional probability the other way around: what
    is the probability of the true state of the world given evidence. There are countless
    real world situations that fit this situation:'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 这个定理对 $E$ 或 $F$ 没有任何假设，因此它适用于任何两个事件。贝叶斯定理非常有用，因为它实际上是一种普遍的方式来回答问题：“我如何根据证据更新对某事的信念，而这件事不是直接可观察的。”这是有充分理由的。对于许多“噪声”测量，根据世界的真实状态估计噪声观察的概率是直接的。然而，你真正想了解的是相反的条件概率：给定证据，世界的真实状态的概率是什么。有无数的现实世界情况符合这种情况：
- en: '**Example 1: Medical tests**'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: '**示例 1：医学测试**'
- en: '*What you want to know:* Probability of a disease given a test result'
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: '*你想知道的是什么：给定测试结果，疾病的可能性'
- en: '*What is easy to know:* Probability of a test result given the true state of
    disease'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: '*容易知道的是什么：在给定疾病的真实状态下，测试结果的可能性'
- en: '*Causality:* We believe that diseases influences test results'
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: '*因果关系：我们相信疾病影响测试结果'
- en: '**Example 2: Student ability**'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: '**示例 2：学生能力**'
- en: '*What you want to know:* Student knowledge of a subject given their answers'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: '*你想知道的是什么：给定他们的答案，学生对某一学科的知识'
- en: '*What is easy to know:* Likelihood of answers given a student''s knowledge
    of a subject'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: '*容易知道的是什么：在给定学生对某一学科的知识的情况下，答案的可能性'
- en: '*Causality:* We believe that ability influences answers'
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: '*因果关系：我们相信能力影响答案'
- en: '**Example 3: Cell phone location**'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: '**示例 3：手机位置**'
- en: '*What you want to know:* Where is a cell phone, given noisy measure of distance
    to tower'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: '*你想知道的是什么：给定到塔的噪声距离测量，手机在哪里'
- en: '*What is easy to know:* Error in noisy measure, given the true distance to
    tower'
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: '*容易知道的是什么：在给定到塔的真实距离的情况下，噪声测量中的误差'
- en: '*Causality:* We believe that cell phone location influences distance measure'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: '*因果关系：我们相信手机位置影响距离测量'
- en: 'There is a pattern here: in each example we care about knowing some unobservable
    -- or hard to observe -- state of the world. This state of the world "causes"
    some easy-to-observe evidence. For example: having the flu (something we would
    like to know) ***causes*** a fever (something we can easily observe), not the
    other way around. We often call the unobservable state the "belief" and the observable
    state the "evidence". For that reason lets rename the events! Lets call the unobservable
    thing we want to know $B$ for belief. Lets call the thing we have evidence of
    $E$ for evidence. This makes it clear that Bayes'' theorem allows us to calculate
    an updated belief given evidence: $\p(B | E)$'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 这里有一个模式：在每个例子中，我们关心的是了解一些不可观察的——或者难以观察的——世界状态。这种世界状态“导致”了一些容易观察到的证据。例如：有流感（我们想了解的事情）***导致***发烧（我们可以轻易观察到的），而不是反过来。我们通常将不可观察的状态称为“信念”，可观察的状态称为“证据”。因此，让我们重新命名事件！让我们将我们想了解的不可观察事物称为$B$（信念）。让我们将我们有证据的事物称为$E$（证据）。这使得贝叶斯定理允许我们根据证据计算更新的信念：$\p(B
    | E)$
- en: '***Definition***: Bayes'' Theorem'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义***：贝叶斯定理'
- en: 'The most common form of Bayes'' Theorem is **Bayes'' Theorem Classic**: $$
    \p(B|E) = \frac{\p(E | B) \cdot \p(B)}{\p(E)} $$'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 贝叶斯定理最常见的形式是**贝叶斯定理经典版**：$$ \p(B|E) = \frac{\p(E | B) \cdot \p(B)}{\p(E)} $$
- en: 'There are names for the different terms in the Bayes'' Rule formula. The term
    $\p(B|E)$ is often called the "posterior": it is your updated belief of $B$ after
    you take into account evidence $E$. The term $\p(B)$ is often called the "prior":
    it was your belief before seeing any evidence. The term $\p(E|B)$ is called the
    update and $\p(E)$ is often called the normalization constant.'
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 贝叶斯规则公式中的不同项有不同的名称。项$\p(B|E)$通常称为“后验”：这是你在考虑证据$E$后对$B$的更新信念。项$\p(B)$通常称为“先验”：这是你在看到任何证据之前的信念。项$\p(E|B)$称为更新，$\p(E)$通常称为归一化常数。
- en: 'There are several techniques for handling the case where the denominator is
    not known. One technique is to use the law of total probability to expand out
    the term, resulting in another formula, called **Bayes'' Theorem with Law of Total
    Probability**: $$ \p(B|E) = \frac{\p(E | B) \cdot \p(B)}{\p(E|B)\cdot \p(B) +
    \p(E|B\c) \cdot \p(B\c)} $$'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 当分母未知时，有几种处理这种情况的技术。一种技术是使用全概率定律展开项，从而得到另一个公式，称为**带有全概率定律的贝叶斯定理**：$$ \p(B|E)
    = \frac{\p(E | B) \cdot \p(B)}{\p(E|B)\cdot \p(B) + \p(E|B\c) \cdot \p(B\c)} $$
- en: 'Recall the law of total probability which is responsible for our new denominator:
    $$ \begin{align} \p(E) = \p(E|B)\cdot \p(B) + \p(E|B\c) \cdot \p(B\c) \end{align}
    $$'
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 回想一下全概率定律，它是我们新分母的原因：$$ \begin{align} \p(E) = \p(E|B)\cdot \p(B) + \p(E|B\c)
    \cdot \p(B\c) \end{align} $$
- en: A common scenario for applying the Bayes' Rule formula is when you want to know
    the probability of something “unobservable” given an “observed” event! For example,
    you want to know the probability that a student understands a concept, given that
    you observed them solving a particular problem. It turns out it is much easier
    to first estimate the probability that a student can solve a problem given that
    they understand the concept and then to apply Bayes' Theorem. Intuitively, you
    can think about this as updating a belief given evidence.
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: 应用贝叶斯规则公式的常见场景是当你想了解在观察到某个“已观察”事件的情况下，“不可观察”事件的概率！例如，你想知道一个学生在观察到他们解决特定问题后理解某个概念的概率。结果发现，首先估计学生在理解概念的情况下解决问题的概率，然后应用贝叶斯定理要容易得多。直观上，你可以将这视为根据证据更新信念。
- en: Bayes' Theorem Applied
  id: totrans-25
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 贝叶斯定理应用
- en: 'Sometimes the (correct) results from Bayes'' Theorem can be counter intuitive.
    Here we work through a classic result: Bayes'' applied to medical tests. We show
    a dynamic solution and present a visualization for understanding what is happening.'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 有时，贝叶斯定理（correct）的结果可能会让人感到反直觉。在这里，我们将通过一个经典的结果来进行分析：贝叶斯定理在医学测试中的应用。我们展示了一个动态解决方案，并提供了可视化工具来理解所发生的情况。
- en: '***Example:*** Probability of a disease given a noisy test'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: '***示例：*** 基于噪声测试的疾病概率'
- en: 'In this problem we are going to calculate the probability that a patient has
    an illness given test-result for the illness. A positive test result means the
    test thinks the patient has the illness. You know the following information, which
    is typical for medical tests:'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 在这个问题中，我们将计算患者有疾病给定疾病测试结果的概率。阳性测试结果意味着测试认为患者有疾病。你知道以下信息，这在医学测试中很典型：
- en: The numbers in this example are from the Mammogram test for breast cancer. The
    seriousness of cancer underscores the potential for bayesian probability to be
    applied to important contexts. The natural occurrence of breast cancer is 8%.
    The mammogram test returns a positive result 95% of the time for patients who
    have breast cancer. The test resturns a positive result 7% of the time for people
    who do not have breast cancer. In this demo you can enter different input numbers
    and it will recalculate.
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: 本例中的数字来自乳腺钼靶检查。癌症的严重性凸显了贝叶斯概率在重要场景中的应用潜力。乳腺癌的自然发生率为8%。对于患有乳腺癌的患者，钼靶检查有95%的概率返回阳性结果。对于没有乳腺癌的人，测试有7%的概率返回阳性结果。在这个演示中，您可以输入不同的输入数字，它将重新计算。
- en: '* * *'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: '***Answer***'
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: '***答案***'
- en: 'The probability that the patient has the illness given a positive test result
    is:'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 在测试结果为阳性时，患者患有疾病的发生概率是：
- en: '**Terms:**'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: '**术语：**'
- en: Let $I$ be the event that the patient has the illness
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $I$ 为患者患有疾病的事件
- en: Let $E$ be the event that the test result is positive
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $E$ 为测试结果为阳性的事件
- en: $\p(I|E)$ = probability of the illness given a positive test. This is the number
    we want to calculate.
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: $\p(I|E)$ = 阳性测试结果下患病的概率。这是我们想要计算的数字。
- en: $\p(E|I)$ = probability of a positive result given illness = $\p(E|I\c)$ = probability
    of a positive result given no illness = $\p(I)$ = natural probability of the illness
    =
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: $\p(E|I)$ = 患有疾病时阳性结果的概率 = $\p(E|I\c)$ = 无疾病时阳性结果的概率 = $\p(I)$ = 疾病的自然概率 =
- en: '**Bayes Theorem:**'
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: '**贝叶斯定理：**'
- en: In this problem we know $\p(E|I)$ and $\p(E|I\c)$ but we want to know $\p(I|E)$.
    We can apply Bayes Theorem to turn our knowledge of one conditional into knowledge
    of the reverse.
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: 在这个问题中，我们知道 $\p(E|I)$ 和 $\p(E|I\c)$，但我们想了解 $\p(I|E)$。我们可以应用贝叶斯定理将我们对一个条件的了解转化为对反向条件的了解。
- en: $$\begin{align}\p(I|E) &= \frac{\p(E|I)P(I)}{\p(E|I)\p(I) + \p(E|I\c)\p(I\c)}
    && \text{Bayes' Theorem with Total Prob.}\end{align}$$
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: $$\begin{align}\p(I|E) &= \frac{\p(E|I)P(I)}{\p(E|I)\p(I) + \p(E|I\c)\p(I\c)}
    && \text{贝叶斯定理与总概率}\end{align}$$
- en: 'Now all we need to do is plug values into this formula. The only value we don''t
    explicitly have is $\p(I\c)$. But we can simply calculate it since $\p(I\c) =
    1 - \p(I)$. Thus:'
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: 现在我们只需要将数值代入这个公式。我们唯一没有明确知道的是 $\p(I\c)$。但我们可以简单地计算它，因为 $\p(I\c) = 1 - \p(I)$。因此：
- en: Natural Frequency Intuition
  id: totrans-42
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 自然频率直觉
- en: One way to build intuition for Bayes Theorem is to think about "natural frequences".
    Let's take another approach to answer the probability question in the above example
    on belief of illness given a test. In this take, we are going to imagine we have
    a population of 1000 people. Let's think about how many of those have the illness
    and test positive and how many don't have the illness and test positive. This
    visualization is based off the numbers in the fields above. Feel free to change
    them!
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: 建立贝叶斯定理直觉的一种方法是通过考虑“自然频率”。让我们采取另一种方法来回答上述关于给定测试结果对疾病信念的概率问题。在这种情况下，我们将想象我们有一个1000人的群体。让我们考虑其中有多少人患有疾病并测试呈阳性，以及有多少人没有疾病但测试呈阳性。这种可视化是基于上面的数字。您可以随意更改它们！
- en: There are many possibilities for how many people have the illness, but one very
    plausible number is 1000, the number of people in our population, multiplied by
    the probability of the disease.
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 有许多关于患有疾病的人数可能性，但一个非常合理的数字是1000，这是我们的总人口数乘以疾病的发生概率。
- en: $1000 \times \p(\text{Illness})$ people have the illness
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: $1000 \times \p(\text{Illness})$ 患有疾病的人。
- en: $1000 \times (1- \p(\text{Illness}))$ people do not have the illness.
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: $1000 \times (1- \p(\text{Illness}))$ 没有疾病的人。
- en: We are going to color people who **have the illness** in blue and those **without
    the illness** in pink (those colors do not imply gender!).
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将用蓝色标记**患有疾病**的人，用粉色标记**没有疾病**的人（这些颜色不表示性别！）。
- en: 'A certain number of people **with the illness will test positive** (which we
    will draw in Dark Blue) and a certain number of people **without the illness will
    test positive** (which we will draw in Dark Pink):'
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: 某些**患有疾病**的人将测试呈阳性（我们将用深蓝色表示），以及某些**没有疾病**的人将测试呈阳性（我们将用深粉色表示）：
- en: $1000 \times \p(\text{Illness}) \times \p(\text{Positive}|\text{Illness})$ people
    have the illness and test positive
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: $1000 \times \p(\text{Illness}) \times \p(\text{Positive}|\text{Illness})$ 患有疾病并测试呈阳性的人。
- en: $1000 \times \p(\text{Illness}\c) \times \p(\text{Positive}|\text{Illness}\c)$
    people do not have the illness and test positive.
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: $1000 \times \p(\text{Illness}\c) \times \p(\text{Positive}|\text{Illness}\c)$
    没有疾病但测试呈阳性的人。
- en: 'Here is the whole population of 1000 people:'
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: 这里是整个1000人的群体：
- en: <canvas style="width:100%; height:370px;" id="naturalFrequencyCanvas"></canvas>
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: <canvas style="width:100%; height:370px;" id="naturalFrequencyCanvas"></canvas>
- en: The number of people who **test positive and have the illness** is ?.
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: '**测试呈阳性且患有疾病**的人数是？'
- en: The number of people who **test positive and don't have the illness** is ?.
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
  zh: '**测试呈阳性但未患病**的人数是？'
- en: The total number of people who test positive is ?.
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: 测试呈阳性的总人数是？
- en: Out of the subset of people who test positive, the fraction that have the illness
    is ?/? = ? which is a close approximation of the answer. If instead of using 1000
    imaginary people, we had used more, the approximation would have been even closer
    to the actual answer (which we calculated using Bayes Theorem).
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: 在测试呈阳性的子集中，患病的人数的比例是 ?/? = ?，这是答案的一个近似。如果我们不是使用1000个假设的人，而是使用更多的人，那么近似值将更接近实际答案（我们使用贝叶斯定理计算出的答案）。
- en: Bayes with the General Law of Total Probability
  id: totrans-57
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 贝叶斯与全概率公式
- en: 'A classic challenge when applying Bayes'' theorem is to calculate the probability
    of the normalization constant $\p(E)$ in the denominator of Bayes'' Theorem. One
    common strategy for calculating this probability is to use the law of total probability.
    Our expanded version of Bayes'' Theorem uses the simple version of the total law
    of probability: $\p(E) = \p(E|F)\p(F) + \p(E|F^c) \p(F^c)$. Sometimes you will
    want the more expanded version of the [law of total probability](../../part1/law_total):
    $\p(E) = \sum_i\p(E|B_i)\p(B_i)$. Recall that this only works if the events $B_i$
    are mutually exclusive and cover the sample space.'
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 应用贝叶斯定理时，一个经典的挑战是计算贝叶斯定理分母中的归一化常数 $\p(E)$ 的概率。计算这个概率的一种常见策略是使用全概率公式。我们扩展的贝叶斯定理使用了全概率公式的简单版本：$\p(E)
    = \p(E|F)\p(F) + \p(E|F^c) \p(F^c)$。有时你可能需要更扩展的全概率公式 [law of total probability](../../part1/law_total)：$\p(E)
    = \sum_i\p(E|B_i)\p(B_i)$。回想一下，这只有在事件 $B_i$ 互斥且覆盖样本空间时才有效。
- en: For example say we are trying to track a phone which could be in any one of
    $n$ discrete locations and we have prior beliefs $\p(B_1) \dots \p(B_n)$ as to
    whether the phone is in location $B_i$. Now we gain some evidence (such as a particular
    signal strength from a particular cell tower) that we call $E$ and we need to
    update all of our probabilities to be $\p(B_i |E)$. We should use Bayes' Theorem!
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，假设我们正在尝试追踪一部电话，这部电话可能位于 $n$ 个离散位置中的任何一个，并且我们有关于电话是否位于位置 $B_i$ 的先验信念 $\p(B_1)
    \dots \p(B_n)$。现在我们获得了一些证据（例如来自特定基站的特定信号强度），我们称之为 $E$，我们需要更新所有概率以成为 $\p(B_i |E)$。我们应该使用贝叶斯定理！
- en: The probability of the observation, assuming that the the phone is in location
    $B_i$, $\p(E|B_i)$, is something that can be given to you by an expert. In this
    case the probability of getting a particular signal strength given a location
    $B_i$ will be determined by the distance between the cell tower and location $B_i$
    .
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: 假设电话在位置 $B_i$，观察到的概率 $\p(E|B_i)$，这是专家可以提供给你的。在这种情况下，给定位置 $B_i$ 的特定信号强度将由基站与位置
    $B_i$ 之间的距离决定。
- en: 'Since we are assuming that the phone must be in *exactly* one of the locations,
    we can find the probability of any of the event $B_i$ given $E$ by first applying
    Bayes'' Theorem and then applying the general version of the law of total probability:'
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: 由于我们假设电话必须在确切的一个位置，我们可以通过首先应用贝叶斯定理，然后应用全概率公式的通用版本来找到给定 $E$ 的任何事件 $B_i$ 的概率：
- en: $$ \begin{align} \p(B_i | E) &= \frac{\p(E|B_i) \cdot \p(B_i)}{\p(E)} && \text{Bayes
    Theorem. What to do about $\p(E)$?} \\ &= \frac{\p(E|B_i) \cdot \p(B_i)}{\sum_{j=1}^n
    \p(E|B_j) \cdot \p(B_j)} && \text{Use General Law of Total Probability for $\p(E)$}
    \\ \end{align} $$
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: $$ \begin{align} \p(B_i | E) &= \frac{\p(E|B_i) \cdot \p(B_i)}{\p(E)} && \text{贝叶斯定理。关于
    $\p(E)$ 该怎么办？} \\ &= \frac{\p(E|B_i) \cdot \p(B_i)}{\sum_{j=1}^n \p(E|B_j) \cdot
    \p(B_j)} && \text{使用全概率公式计算 $\p(E)$} \\ \end{align} $$
- en: Unknown Normalization Constant
  id: totrans-63
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 未知归一化常数
- en: 'There are times when we would like to use Bayes'' Theorem to update a belief,
    but we don''t know the probability of $E$, $\p(E)$. All hope is not lost. This
    term is called the "normalization constant" because it is the same regardless
    of whether or not the event $B$ happens. The solution that we used above was the
    law of total probability: $\p(E) = \p(E |B) \p(B) + \p(E|B\c)\p(B\c)$. This allows
    us to calculate $\p(E)$.'
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: 有时候我们想使用贝叶斯定理来更新信念，但我们不知道 $E$ 的概率，$\p(E)$。希望并未完全丧失。这个术语被称为“归一化常数”，因为它与事件 $B$
    是否发生无关。我们上面使用的解决方案是全概率公式：$\p(E) = \p(E |B) \p(B) + \p(E|B\c)\p(B\c)$。这允许我们计算 $\p(E)$。
- en: 'Here is another strategy for dealing with an unknown $\p(E)$. We can make it
    cancel out by calculating the ratio of $\frac{\p(B|E)}{\p(B\c|E)}$. This fraction
    tells you how many times more likely it is that $B$ will happen given $E$ than
    not $B$: $$ \begin{align} \frac{\p(B|E)}{\p(B\c|E)} &= \frac{ \frac{\p(E|B)\p(B)}{\p(E)}
    }{ \frac{\p(E|B\c)\p(B\c)}{\p(E)} } && \text{Apply Bayes'' Theorem to both terms}
    \\ &= \frac{ \p(E|B)\p(B) }{ \p(E|B\c)\p(B\c) } && \text{The term $\p(E)$ cancels}
    \end{align} $$'
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
  zh: 这里是处理未知概率 $\p(E)$ 的另一种策略。我们可以通过计算 $\frac{\p(B|E)}{\p(B\c|E)}$ 的比值来使其抵消。这个比值告诉你，在给定
    $E$ 的情况下，$B$ 发生的可能性比不发生 $B$ 的可能性多多少倍：$$ \begin{align} \frac{\p(B|E)}{\p(B\c|E)}
    &= \frac{ \frac{\p(E|B)\p(B)}{\p(E)} }{ \frac{\p(E|B\c)\p(B\c)}{\p(E)} } && \text{将贝叶斯定理应用于两个项}
    \\ &= \frac{ \p(E|B)\p(B) }{ \p(E|B\c)\p(B\c) } && \text{项 $\p(E)$ 相互抵消} \end{align}
    $$
