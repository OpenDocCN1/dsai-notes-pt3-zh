- en: Chapter 33 Large datasets
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook/large-datasets.html](https://rafalab.dfci.harvard.edu/dsbook/large-datasets.html)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: Machine learning problems often involve datasets that are as large or larger
    than the MNIST dataset. There is a variety of computational techniques and statistical
    concepts that are useful for the analysis of large datasets. In this chapter we
    scratch the surface of these techniques and concepts by describing matrix algebra,
    dimension reduction, regularization and matrix factorization. We use recommendation
    systems related to movie ratings as a motivating example.
  prefs: []
  type: TYPE_NORMAL
- en: 33.1 Matrix algebra
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'In machine learning, situations in which all predictors are numeric, or can
    be converted to numeric in a meaningful way, are common. The digits data set is
    an example: every pixel records a number between 0 and 255\. Let’s load the data:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: 'In these cases, it is often convenient to save the predictors in a matrix and
    the outcome in a vector rather than using a data frame. You can see that the predictors
    are saved as a matrix:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: 'This matrix represents 60,000 digits, so for the examples in this chapter,
    we will take a more manageable subset. We will take the first 1,000 predictors
    `x` and labels `y`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: The main reason for using matrices is that certain mathematical operations needed
    to develop efficient code can be performed using techniques from a branch of mathematics
    called *linear algebra*. In fact, linear algebra and matrix notation are key elements
    of the language used in academic papers describing machine learning techniques.
    We will not cover linear algebra in detail here, but will demonstrate how to use
    matrices in R so that you can apply the linear algebra techniques already implemented
    in base R or other packages.
  prefs: []
  type: TYPE_NORMAL
- en: 'To motivate the use of matrices, we will pose five questions/challenges:'
  prefs: []
  type: TYPE_NORMAL
- en: 1\. Do some digits require more ink than others? Study the distribution of the
    total pixel darkness and how it varies by digits.
  prefs: []
  type: TYPE_NORMAL
- en: 2\. Are some pixels uninformative? Study the variation of each pixel and remove
    predictors (columns) associated with pixels that don’t change much and thus can’t
    provide much information for classification.
  prefs: []
  type: TYPE_NORMAL
- en: 3\. Can we remove smudges? First, look at the distribution of all pixel values.
    Use this to pick a cutoff to define unwritten space. Then, set anything below
    that cutoff to 0.
  prefs: []
  type: TYPE_NORMAL
- en: 4\. Binarize the data. First, look at the distribution of all pixel values.
    Use this to pick a cutoff to distinguish between writing and no writing. Then,
    convert all entries into either 1 or 0, respectively.
  prefs: []
  type: TYPE_NORMAL
- en: 5\. Scale each of the predictors in each entry to have the same average and
    standard deviation.
  prefs: []
  type: TYPE_NORMAL
- en: To complete these, we will have to perform mathematical operations involving
    several variables. The **tidyverse** is not developed to perform these types of
    mathematical operations. For this task, it is convenient to use matrices.
  prefs: []
  type: TYPE_NORMAL
- en: Before we do this, we will introduce matrix notation and basic R code to define
    and operate on matrices.
  prefs: []
  type: TYPE_NORMAL
- en: 33.1.1 Notation
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'In matrix algebra, we have three main types of objects: scalars, vectors, and
    matrices. A scalar is just one number, for example \(a = 1\). To denote scalars
    in matrix notation, we usually use a lower case letter and do not bold.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Vectors are like the numeric vectors we define in R: they include several scalar
    entries. For example, the column containing the first pixel:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: 'has 1,000 entries. In matrix algebra, we use the following notation for a vector
    representing a feature/predictor:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ \begin{pmatrix} x_1\\\ x_2\\\ \vdots\\\ x_N \end{pmatrix} \]
  prefs: []
  type: TYPE_NORMAL
- en: 'Similarly, we can use math notation to represent different features mathematically
    by adding an index:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ \mathbf{X}_1 = \begin{pmatrix} x_{1,1}\\ \vdots\\ x_{N,1} \end{pmatrix} \mbox{
    and } \mathbf{X}_2 = \begin{pmatrix} x_{1,2}\\ \vdots\\ x_{N,2} \end{pmatrix}
    \]
  prefs: []
  type: TYPE_NORMAL
- en: 'If we are writing out a column, such as \(\mathbf{X}_1\), in a sentence we
    often use the notation: \(\mathbf{X}_1 = ( x_{1,1}, \dots x_{N,1})^\top\) with
    \(^\top\) the transpose operation that converts columns into rows and rows into
    columns.'
  prefs: []
  type: TYPE_NORMAL
- en: 'A matrix can be defined as a series of vectors of the same size joined together
    as columns:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE4]'
  prefs: []
  type: TYPE_PRE
- en: 'Mathematically, we represent them with bold upper case letters:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ \mathbf{X} = [ \mathbf{X}_1 \mathbf{X}_2 ] = \begin{pmatrix} x_{1,1}&x_{1,2}\\
    \vdots\\ x_{N,1}&x_{N,2} \end{pmatrix} \]
  prefs: []
  type: TYPE_NORMAL
- en: 'The *dimension* of a matrix is often an important characteristic needed to
    assure that certain operations can be performed. The dimension is a two-number
    summary defined as the number of rows \(\times\) the number of columns. In R,
    we can extract the dimension of a matrix with the function `dim`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE5]'
  prefs: []
  type: TYPE_PRE
- en: 'Vectors can be thought of as \(N\times 1\) matrices. However, in R, a vector
    does not have dimensions:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE6]'
  prefs: []
  type: TYPE_PRE
- en: 'Yet we explicitly convert a vector into a matrix using the function `as.matrix`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE7]'
  prefs: []
  type: TYPE_PRE
- en: 'We can use this notation to denote an arbitrary number of predictors with the
    following \(N\times p\) matrix, for example, with \(p=784\):'
  prefs: []
  type: TYPE_NORMAL
- en: \[ \mathbf{X} = \begin{pmatrix} x_{1,1}&\dots & x_{1,p} \\ x_{2,1}&\dots & x_{2,p}
    \\ & \vdots & \\ x_{N,1}&\dots & x_{N,p} \end{pmatrix} \]
  prefs: []
  type: TYPE_NORMAL
- en: 'We stored this matrix in x:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE8]'
  prefs: []
  type: TYPE_PRE
- en: We will now learn several useful operations related to matrix algebra. We use
    three of the motivating questions listed above.
  prefs: []
  type: TYPE_NORMAL
- en: 33.1.2 Converting a vector to a matrix
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: It is often useful to convert a vector to a matrix. For example, because the
    variables are pixels on a grid, we can convert the rows of pixel intensities into
    a matrix representing this grid.
  prefs: []
  type: TYPE_NORMAL
- en: 'We can convert a vector into a matrix with the `matrix` function and specifying
    the number of rows and columns that the resulting matrix should have. The matrix
    is filled in **by column**: the first column is filled first, then the second
    and so on. This example helps illustrate:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE9]'
  prefs: []
  type: TYPE_PRE
- en: 'We can fill by row by using the `byrow` argument. So, for example, to *transpose*
    the matrix `mat`, we can use:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]'
  prefs: []
  type: TYPE_PRE
- en: 'When we turn the columns into rows, we refer to the operations as *transposing*
    the matrix. The function `t` can be used to directly transpose a matrix:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]'
  prefs: []
  type: TYPE_PRE
- en: '**Warning**: The `matrix` function recycles values in the vector **without
    warning** if the product of columns and rows does not match the length of the
    vector:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE12]'
  prefs: []
  type: TYPE_PRE
- en: 'To put the pixel intensities of our, say, 3rd entry, which is a 4 into grid,
    we can use:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE13]'
  prefs: []
  type: TYPE_PRE
- en: 'To confirm that in fact we have done this correctly, we can use the function
    `image`, which shows an image of its third argument. The top of this plot is pixel
    1, which is shown at the bottom so the image is flipped. To code below includes
    code showing how to flip it back:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE14]'
  prefs: []
  type: TYPE_PRE
- en: '![](../Images/38ac390ce971fce842c875147da4639e.png)'
  prefs: []
  type: TYPE_IMG
- en: 33.1.3 Row and column summaries
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: For the first task, related to total pixel darkness, we want to sum the values
    of each row and then visualize how these values vary by digit.
  prefs: []
  type: TYPE_NORMAL
- en: 'The function `rowSums` takes a matrix as input and computes the desired values:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE15]'
  prefs: []
  type: TYPE_PRE
- en: 'We can also compute the averages with `rowMeans` if we want the values to remain
    between 0 and 255:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE16]'
  prefs: []
  type: TYPE_PRE
- en: 'Once we have this, we can simply generate a boxplot:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE17]'
  prefs: []
  type: TYPE_PRE
- en: '![](../Images/9501a7a53f837ce43e188c7f2876f1ae.png)'
  prefs: []
  type: TYPE_IMG
- en: From this plot we see that, not surprisingly, 1s use less ink than the other
    digits.
  prefs: []
  type: TYPE_NORMAL
- en: We can compute the column sums and averages using the function `colSums` and
    `colMeans`, respectively.
  prefs: []
  type: TYPE_NORMAL
- en: The **matrixStats** package adds functions that performs operations on each
    row or column very efficiently, including the functions `rowSds` and `colSds`.
  prefs: []
  type: TYPE_NORMAL
- en: 33.1.4 `apply`
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The functions just described are performing an operation similar to what `sapply`
    and the **purrr** function `map` do: apply the same function to a part of your
    object. In this case, the function is applied to either each row or each column.
    The `apply` function lets you apply any function, not just `sum` or `mean`, to
    a matrix. The first argument is the matrix, the second is the dimension, 1 for
    rows, 2 for columns, and the third is the function. So, for example, `rowMeans`
    can be written as:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE18]'
  prefs: []
  type: TYPE_PRE
- en: 'But notice that just like with `sapply` and `map`, we can perform any function.
    So if we wanted the standard deviation for each column, we could write:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE19]'
  prefs: []
  type: TYPE_PRE
- en: The tradeoff for this flexibility is that these operations are not as fast as
    dedicated functions such as `rowMeans`.
  prefs: []
  type: TYPE_NORMAL
- en: 33.1.5 Filtering columns based on summaries
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'We now turn to task 2: studying the variation of each pixel and removing columns
    associated with pixels that don’t change much and thus do not inform the classification.
    Although a simplistic approach, we will quantify the variation of each pixel with
    its standard deviation across all entries. Since each column represents a pixel,
    we use the `colSds` function from the **matrixStats** package:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE20]'
  prefs: []
  type: TYPE_PRE
- en: 'A quick look at the distribution of these values shows that some pixels have
    very low entry to entry variability:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE21]'
  prefs: []
  type: TYPE_PRE
- en: '![](../Images/bc3bebea88c004ec393e3fc8dfe5d020.png)'
  prefs: []
  type: TYPE_IMG
- en: 'This makes sense since we don’t write in some parts of the box. Here is the
    variance plotted by location:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE22]'
  prefs: []
  type: TYPE_PRE
- en: '![](../Images/00f8964b71a51dd6d3f4d2c5e4f34c59.png)'
  prefs: []
  type: TYPE_IMG
- en: We see that there is little variation in the corners.
  prefs: []
  type: TYPE_NORMAL
- en: 'We could remove features that have no variation since these can’t help us predict.
    We can extract columns from matrices using the following code:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE23]'
  prefs: []
  type: TYPE_PRE
- en: 'and rows like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE24]'
  prefs: []
  type: TYPE_PRE
- en: 'We can also use logical indexes to determine which columns or rows to keep.
    So if we wanted to remove uninformative predictors from our matrix, we could write
    this one line of code:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE25]'
  prefs: []
  type: TYPE_PRE
- en: Only the columns for which the standard deviation is above 60 are kept, which
    removes over half the predictors.
  prefs: []
  type: TYPE_NORMAL
- en: 'Here we add an important warning related to subsetting matrices: if you select
    one column or one row, the result is no longer a matrix but a vector.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE26]'
  prefs: []
  type: TYPE_PRE
- en: 'However, we can preserve the matrix class by using the argument `drop=FALSE`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE27]'
  prefs: []
  type: TYPE_PRE
- en: 33.1.6 Indexing with matrices
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'We can quickly make a histogram of all the values in our dataset. We saw how
    we can turn vectors into matrices. We can also undo this and turn matrices into
    vectors. The operation will happen by row:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE28]'
  prefs: []
  type: TYPE_PRE
- en: 'To see a histogram of all our predictor data, we can use:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE29]'
  prefs: []
  type: TYPE_PRE
- en: '![](../Images/069ad32398780207f3843db46d323f52.png)'
  prefs: []
  type: TYPE_IMG
- en: 'We notice a clear dichotomy which is explained as parts of the image with ink
    and parts without. If we think that values below, say, 50 are smudges, we can
    quickly make them zero using:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE30]'
  prefs: []
  type: TYPE_PRE
- en: 'To see what this does, we look at a smaller matrix:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE31]'
  prefs: []
  type: TYPE_PRE
- en: 'We can also use logical operations with matrix logical:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE32]'
  prefs: []
  type: TYPE_PRE
- en: 33.1.7 Binarizing the data
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The histogram above seems to suggest that this data is mostly binary. A pixel
    either has ink or does not. Using what we have learned, we can binarize the data
    using just matrix operations:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE33]'
  prefs: []
  type: TYPE_PRE
- en: 'We can also convert to a matrix of logicals and then coerce to numbers like
    this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE34]'
  prefs: []
  type: TYPE_PRE
- en: 33.1.8 Vectorization for matrices
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'In R, if we subtract a vector from a matrix, the first element of the vector
    is subtracted from the first row, the second element from the second row, and
    so on. Using mathematical notation, we would write it as follows:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ \begin{pmatrix} X_{1,1}&\dots & X_{1,p} \\ X_{2,1}&\dots & X_{2,p} \\ & \vdots
    & \\ X_{N,1}&\dots & X_{N,p} \end{pmatrix} - \begin{pmatrix} a_1\\\ a_2\\\ \vdots\\\
    a_N \end{pmatrix} = \begin{pmatrix} X_{1,1}-a_1&\dots & X_{1,p} -a_1\\ X_{2,1}-a_2&\dots
    & X_{2,p} -a_2\\ & \vdots & \\ X_{N,1}-a_n&\dots & X_{N,p} -a_n \end{pmatrix}
    \]
  prefs: []
  type: TYPE_NORMAL
- en: 'The same holds true for other arithmetic operations. This implies that we can
    scale each row of a matrix like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE35]'
  prefs: []
  type: TYPE_PRE
- en: 'If you want to scale each column, be careful since this approach does not work
    for columns. To perform a similar operation, we convert the columns to rows using
    the transpose `t`, proceed as above, and then transpose back:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE36]'
  prefs: []
  type: TYPE_PRE
- en: We can also use a function called `sweep` that works similarly to `apply`. It
    takes each entry of a vector and subtracts it from the corresponding row or column.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE37]'
  prefs: []
  type: TYPE_PRE
- en: 'The function `sweep` actually has another argument that lets you define the
    arithmetic operation. So to divide by the standard deviation, we do the following:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE38]'
  prefs: []
  type: TYPE_PRE
- en: 33.1.9 Matrix algebra operations
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Finally, although we do not cover matrix algebra operations such as matrix
    multiplication, we share here the relevant commands for those that know the mathematics
    and want to learn the code:'
  prefs: []
  type: TYPE_NORMAL
- en: '1\. Matrix multiplication is done with `%*%`. For example, the cross product
    is:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE39]'
  prefs: []
  type: TYPE_PRE
- en: '2\. We can compute the cross product directly with the function:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE40]'
  prefs: []
  type: TYPE_PRE
- en: '3\. To compute the inverse of a function, we use `solve`. Here it is applied
    to the cross product:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE41]'
  prefs: []
  type: TYPE_PRE
- en: '4\. The QR decomposition is readily available by using the `qr` function:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE42]'
  prefs: []
  type: TYPE_PRE
- en: 33.2 Exercises
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 1\. Create a 100 by 10 matrix of randomly generated normal numbers. Put the
    result in `x`.
  prefs: []
  type: TYPE_NORMAL
- en: 2\. Apply the three R functions that give you the dimension of `x`, the number
    of rows of `x`, and the number of columns of `x`, respectively.
  prefs: []
  type: TYPE_NORMAL
- en: 3\. Add the scalar 1 to row 1, the scalar 2 to row 2, and so on, to the matrix
    `x`.
  prefs: []
  type: TYPE_NORMAL
- en: '4\. Add the scalar 1 to column 1, the scalar 2 to column 2, and so on, to the
    matrix `x`. Hint: use `sweep` with `FUN = "+"`.'
  prefs: []
  type: TYPE_NORMAL
- en: 5\. Compute the average of each row of `x`.
  prefs: []
  type: TYPE_NORMAL
- en: 6\. Compute the average of each column of `x`.
  prefs: []
  type: TYPE_NORMAL
- en: '7\. For each digit in the MNIST training data, compute the proportion of pixels
    that are in a *grey area*, defined as values between 50 and 205. Make boxplot
    by digit class. Hint: use logical operators and `rowMeans`.'
  prefs: []
  type: TYPE_NORMAL
- en: 33.3 Distance
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Many of the analyses we perform with high-dimensional data relate directly or
    indirectly to distance. Most clustering and machine learning techniques rely on
    being able to define distance between observations, using features or predictors.
  prefs: []
  type: TYPE_NORMAL
- en: 33.3.1 Euclidean distance
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: As a review, let’s define the distance between two points, \(A\) and \(B\),
    on a Cartesian plane.
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/1ffb47ee8fc359228438222bfb6c6389.png)'
  prefs: []
  type: TYPE_IMG
- en: 'The Euclidean distance between \(A\) and \(B\) is simply:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ \mbox{dist}(A,B) = \sqrt{ (A_x-B_x)^2 + (A_y-B_y)^2} \]
  prefs: []
  type: TYPE_NORMAL
- en: 'This definition applies to the case of one dimension, in which the distance
    between two numbers is simply the absolute value of their difference. So if our
    two one-dimensional numbers are \(A\) and \(B\), the distance is:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ \mbox{dist}(A,B) = \sqrt{ (A - B)^2 } = | A - B | \]
  prefs: []
  type: TYPE_NORMAL
- en: 33.3.2 Distance in higher dimensions
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Earlier we introduced a training dataset with feature matrix measurements for
    784 features. For illustrative purposes, we will look at a random sample of 2s
    and 7s.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE43]'
  prefs: []
  type: TYPE_PRE
- en: The predictors are in `x` and the labels in `y`.
  prefs: []
  type: TYPE_NORMAL
- en: For the purposes of, for example, smoothing, we are interested in describing
    distance between observation; in this case, digits. Later, for the purposes of
    selecting features, we might also be interested in finding pixels that *behave
    similarly* across samples.
  prefs: []
  type: TYPE_NORMAL
- en: 'To define distance, we need to know what *points* are since mathematical distance
    is computed between points. With high dimensional data, points are no longer on
    the Cartesian plane. Instead, points are in higher dimensions. We can no longer
    visualize them and need to think abstractly. For example, predictors \(\mathbf{X}_i\)
    are defined as a point in 784 dimensional space: \(\mathbf{X}_i = (x_{i,1},\dots,x_{i,784})^\top\).'
  prefs: []
  type: TYPE_NORMAL
- en: 'Once we define points this way, the Euclidean distance is defined very similarly
    as it was for two dimensions. For example, the distance between the predictors
    for two observations, say observations \(i=1\) and \(i=2\), is:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ \mbox{dist}(1,2) = \sqrt{ \sum_{j=1}^{784} (x_{1,j}-x_{2,j })^2 } \]
  prefs: []
  type: TYPE_NORMAL
- en: This is just one non-negative number, just as it is for two dimensions.
  prefs: []
  type: TYPE_NORMAL
- en: 33.3.3 Euclidean distance example
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The labels for the first three observations are:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE44]'
  prefs: []
  type: TYPE_PRE
- en: 'The vectors of predictors for each of these observations are:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE45]'
  prefs: []
  type: TYPE_PRE
- en: 'The first and third numbers are sevens and the second one is a two. We expect
    the distances between the same number:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE46]'
  prefs: []
  type: TYPE_PRE
- en: 'to be smaller than between different numbers:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE47]'
  prefs: []
  type: TYPE_PRE
- en: As expected, the 7s are closer to each other.
  prefs: []
  type: TYPE_NORMAL
- en: 'A faster way to compute this is using matrix algebra:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE48]'
  prefs: []
  type: TYPE_PRE
- en: 'We can also compute **all** the distances at once relatively quickly using
    the function `dist`, which computes the distance between each row and produces
    an object of class `dist`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE49]'
  prefs: []
  type: TYPE_PRE
- en: 'There are several machine learning related functions in R that take objects
    of class `dist` as input. To access the entries using row and column indices,
    we need to coerce it into a matrix. We can see the distance we calculated above
    like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE50]'
  prefs: []
  type: TYPE_PRE
- en: 'We can quickly see an image of these distances using this code:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE51]'
  prefs: []
  type: TYPE_PRE
- en: 'If we order this distance by the labels, we can see that, in general, the twos
    are closer to each other and the sevens are closer to each other:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE52]'
  prefs: []
  type: TYPE_PRE
- en: '![](../Images/b4b985a64b13ff625cbaadf3695680bb.png)'
  prefs: []
  type: TYPE_IMG
- en: One thing we notice here is that there appears to be more uniformity in how
    the sevens are drawn, since they appear to be closer (more red) to other sevens
    than twos are to other twos.
  prefs: []
  type: TYPE_NORMAL
- en: 33.3.4 Predictor space
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '*Predictor space* is a concept that is often used to describe machine learning
    algorithms. The term *space* refers to a mathematical definition that we don’t
    describe in detail here. Instead, we provide a simplified explanation to help
    understand the term predictor space when used in the context of machine learning
    algorithms.'
  prefs: []
  type: TYPE_NORMAL
- en: The predictor space can be thought of as the collection of all possible vectors
    of predictors that should be considered for the machine learning challenge in
    question. Each member of the space is referred to as a *point*. For example, in
    the 2 or 7 dataset, the predictor space consists of all pairs \((x_1, x_2)\) such
    that both \(x_1\) and \(x_2\) are within 0 and 1\. This particular *space* can
    be represented graphically as a square. In the MNIST dataset the predictor space
    consists of all 784-th dimensional vectors with each vector element an integer
    between 0 and 256\. An essential element of a predictor space is that we need
    to define a function that provides the distance between any two points. In most
    cases we use Euclidean distance, but there are other possibilities. A particular
    case in which we can’t simply use Euclidean distance is when we have categorical
    predictors.
  prefs: []
  type: TYPE_NORMAL
- en: Defining a predictor space is useful in machine learning because we do things
    like define neighborhoods of points, as required by many smoothing techniques.
    For example, we can define a neighborhood as all the points that are within 2
    units away from a predefined center. If the points are two-dimensional and we
    use Euclidean distance, this neighborhood is graphically represented as a circle
    with radius 2\. In three dimensions the neighborhood is a sphere. We will soon
    learn about algorithms that partition the space into non-overlapping regions and
    then make different predictions for each region using the data in the region.
  prefs: []
  type: TYPE_NORMAL
- en: 33.3.5 Distance between predictors
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'We can also compute distances between predictors. If \(N\) is the number of
    observations, the distance between two predictors, say 1 and 2, is:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ \mbox{dist}(1,2) = \sqrt{ \sum_{i=1}^{N} (x_{i,1}-x_{i,2})^2 } \]
  prefs: []
  type: TYPE_NORMAL
- en: 'To compute the distance between all pairs of the 784 predictors, we can transpose
    the matrix first and then use `dist`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE53]'
  prefs: []
  type: TYPE_PRE
- en: 33.4 Exercises
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '1\. Load the following dataset:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE54]'
  prefs: []
  type: TYPE_PRE
- en: This dataset includes a matrix `x`
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE55]'
  prefs: []
  type: TYPE_PRE
- en: with the gene expression measured on 500 genes for 189 biological samples representing
    seven different tissues. The tissue type is stored in `y`
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE56]'
  prefs: []
  type: TYPE_PRE
- en: Compute the distance between each observation and store it in an object `d`.
  prefs: []
  type: TYPE_NORMAL
- en: 2\. Compare the distance between the first two observations (both cerebellums),
    the 39th and 40th (both colons), and the 73rd and 74th (both endometriums). See
    if the observations of the same tissue type are closer to each other.
  prefs: []
  type: TYPE_NORMAL
- en: '3\. We see that indeed observations of the same tissue type are closer to each
    other in the six tissue examples we just examined. Make a plot of all the distances
    using the `image` function to see if this pattern is general. Hint: convert `d`
    to a matrix first.'
  prefs: []
  type: TYPE_NORMAL
- en: 33.5 Dimension reduction
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: A typical machine learning challenge will include a large number of predictors,
    which makes visualization somewhat challenging. We have shown methods for visualizing
    univariate and paired data, but plots that reveal relationships between many variables
    are more complicated in higher dimensions. For example, to compare each of the
    784 features in our predicting digits example, we would have to create, for example,
    306,936 scatterplots. Creating one single scatter-plot of the data is impossible
    due to the high dimensionality.
  prefs: []
  type: TYPE_NORMAL
- en: Here we describe powerful techniques useful for exploratory data analysis, among
    other things, generally referred to as *dimension reduction*. The general idea
    is to reduce the dimension of the dataset while preserving important characteristics,
    such as the distance between features or observations. With fewer dimensions,
    visualization then becomes more feasible. The technique behind it all, the singular
    value decomposition, is also useful in other contexts. Principal component analysis
    (PCA) is the approach we will be showing. Before applying PCA to high-dimensional
    datasets, we will motivate the ideas behind with a simple example.
  prefs: []
  type: TYPE_NORMAL
- en: 33.5.1 Preserving distance
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: We consider an example with twin heights. Some pairs are adults, the others
    are children. Here we simulate 100 two-dimensional points that represent the number
    of standard deviations each individual is from the mean height. Each point is
    a pair of twins. We use the `mvrnorm` function from the **MASS** package to simulate
    bivariate normal data.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE57]'
  prefs: []
  type: TYPE_PRE
- en: 'A scatterplot quickly reveals that the correlation is high and that there are
    two groups of twins, the adults (upper right points) and the children (lower left
    points):'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/fb528e2943d02515c59243d348654c38.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Our features are \(N\) two-dimensional points, the two heights, and, for illustrative
    purposes, we will act as if visualizing two dimensions is too challenging. We
    therefore want to reduce the dimensions from two to one, but still be able to
    understand important characteristics of the data, for example that the observations
    cluster into two groups: adults and children.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Let’s consider a specific challenge: we want a one-dimensional summary of our
    predictors from which we can approximate the distance between any two observations.
    In the figure above we show the distance between observation 1 and 2 (blue), and
    observation 1 and 51 (red). Note that the blue line is shorter, which implies
    1 and 2 are closer.'
  prefs: []
  type: TYPE_NORMAL
- en: 'We can compute these distances using `dist`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE58]'
  prefs: []
  type: TYPE_PRE
- en: This distance is based on two dimensions and we need a distance approximation
    based on just one.
  prefs: []
  type: TYPE_NORMAL
- en: 'Let’s start with the naive approach of simply removing one of the two dimensions.
    Let’s compare the actual distances to the distance computed with just the first
    dimension:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE59]'
  prefs: []
  type: TYPE_PRE
- en: 'Here are the approximate distances versus the original distances: ![](../Images/00dc3b46fad50fb19cbc67c9f857a2e9.png)'
  prefs: []
  type: TYPE_NORMAL
- en: The plot looks about the same if we use the second dimension. We obtain a general
    underestimation. This is to be expected because we are adding more positive quantities
    in the distance calculation as we increase the number of dimensions. If instead
    we use an average, like this
  prefs: []
  type: TYPE_NORMAL
- en: \[\sqrt{ \frac{1}{2} \sum_{j=1}^2 (X_{1,j}-X_{2,j})^2 },\]
  prefs: []
  type: TYPE_NORMAL
- en: then the underestimation goes away. We divide the distance by \(\sqrt{2}\) to
    achieve the correction.
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/79d8f1b32189638a3967de6584c89ea2.png)'
  prefs: []
  type: TYPE_IMG
- en: 'This actually works pretty well and we get a typical difference of:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE60]'
  prefs: []
  type: TYPE_PRE
- en: Now, can we pick a one-dimensional summary that makes this approximation even
    better?
  prefs: []
  type: TYPE_NORMAL
- en: 'If we look back at the previous scatterplot and visualize a line between any
    pair of points, the length of this line is the distance between the two points.
    These lines tend to go along the direction of the diagonal. Notice that if we
    instead plot the difference versus the average:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE61]'
  prefs: []
  type: TYPE_PRE
- en: 'we can see how the distance between points is mostly explained by the first
    dimension: the average.'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/59c29b04199d8700164856295f183fe1.png)'
  prefs: []
  type: TYPE_IMG
- en: 'This means that we can ignore the second dimension and not lose too much information.
    If the line is completely flat, we lose no information at all. Using the first
    dimension of this transformed matrix we obtain an even better approximation:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/7a89c4e18cbe85f62d5e39ec6bf0bf52.png)'
  prefs: []
  type: TYPE_IMG
- en: 'with the typical difference improved by about 35%:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE62]'
  prefs: []
  type: TYPE_PRE
- en: Later we learn that `z[,1]` is the first principal component of the matrix `x`.
  prefs: []
  type: TYPE_NORMAL
- en: 33.5.2 Linear transformations (advanced)
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Note that each row of \(X\) was transformed using a linear transformation.
    For any row \(i\), the first entry was:'
  prefs: []
  type: TYPE_NORMAL
- en: \[Z_{i,1} = a_{1,1} X_{i,1} + a_{2,1} X_{i,2}\]
  prefs: []
  type: TYPE_NORMAL
- en: with \(a_{1,1} = 0.5\) and \(a_{2,1} = 0.5\).
  prefs: []
  type: TYPE_NORMAL
- en: 'The second entry was also a linear transformation:'
  prefs: []
  type: TYPE_NORMAL
- en: \[Z_{i,2} = a_{1,2} X_{i,1} + a_{2,2} X_{i,2}\]
  prefs: []
  type: TYPE_NORMAL
- en: with \(a_{1,2} = 1\) and \(a_{2,2} = -1\).
  prefs: []
  type: TYPE_NORMAL
- en: 'We can also use linear transformation to get \(X\) back from \(Z\):'
  prefs: []
  type: TYPE_NORMAL
- en: \[X_{i,1} = b_{1,1} Z_{i,1} + b_{2,1} Z_{i,2}\]
  prefs: []
  type: TYPE_NORMAL
- en: with \(b_{1,2} = 1\) and \(b_{2,1} = 0.5\) and
  prefs: []
  type: TYPE_NORMAL
- en: \[X_{i,2} = b_{2,1} Z_{i,1} + b_{2,2} Z_{i,2}\]
  prefs: []
  type: TYPE_NORMAL
- en: with \(b_{2,1} = 1\) and \(a_{1,2} = -0.5\).
  prefs: []
  type: TYPE_NORMAL
- en: 'If you are familiar with linear algebra, we can write the operation we just
    performed like this:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ Z = X A \mbox{ with } A = \, \begin{pmatrix} 1/2&1\\ 1/2&-1\\ \end{pmatrix}.
    \]
  prefs: []
  type: TYPE_NORMAL
- en: 'And that we can transform back by simply multiplying by \(A^{-1}\) as follows:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ X = Z A^{-1} \mbox{ with } A^{-1} = \, \begin{pmatrix} 1&1\\ 1/2&-1/2\\ \end{pmatrix}.
    \]
  prefs: []
  type: TYPE_NORMAL
- en: Dimension reduction can often be described as applying a transformation \(A\)
    to a matrix \(X\) with many columns that *moves* the information contained in
    \(X\) to the first few columns of \(Z=AX\), then keeping just these few informative
    columns, thus reducing the dimension of the vectors contained in the rows.
  prefs: []
  type: TYPE_NORMAL
- en: 33.5.3 Orthogonal transformations (advanced)
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Note that we divided the above by \(\sqrt{2}\) to account for the differences
    in dimensions when comparing a 2 dimension distance to a 1 dimension distance.
    We can actually guarantee that the distance scales remain the same if we re-scale
    the columns of \(A\) to assure that the sum of squares is 1
  prefs: []
  type: TYPE_NORMAL
- en: \[a_{1,1}^2 + a_{2,1}^2 = 1\mbox{ and } a_{1,2}^2 + a_{2,2}^2=1,\]
  prefs: []
  type: TYPE_NORMAL
- en: 'and that the correlation of the columns is 0:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ a_{1,1} a_{1,2} + a_{2,1} a_{2,2} = 0. \]
  prefs: []
  type: TYPE_NORMAL
- en: Remember that if the columns are centered to have average 0, then the sum of
    squares is equivalent to the variance or standard deviation squared.
  prefs: []
  type: TYPE_NORMAL
- en: 'In our example, to achieve orthogonality, we multiply the first set of coefficients
    (first column of \(A\)) by \(\sqrt{2}\) and the second by \(1/\sqrt{2}\), then
    we get the same exact distance if we use both dimensions:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE63]'
  prefs: []
  type: TYPE_PRE
- en: 'This gives us a transformation that preserves the distance between any two
    points:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE64]'
  prefs: []
  type: TYPE_PRE
- en: 'and an improved approximation if we use just the first dimension:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE65]'
  prefs: []
  type: TYPE_PRE
- en: 'In this case \(Z\) is called an orthogonal rotation of \(X\): it preserves
    the distances between rows.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Note that by using the transformation above we can summarize the distance between
    any two pairs of twins with just one dimension. For example, one-dimensional data
    exploration of the first dimension of \(Z\) clearly shows that there are two groups,
    adults and children:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE66]'
  prefs: []
  type: TYPE_PRE
- en: '![](../Images/b0e8f312956a0e696b6700dd6989fce6.png)'
  prefs: []
  type: TYPE_IMG
- en: We successfully reduced the number of dimensions from two to one with very little
    loss of information.
  prefs: []
  type: TYPE_NORMAL
- en: 'The reason we were able to do this is because the columns of \(X\) were very
    correlated:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE67]'
  prefs: []
  type: TYPE_PRE
- en: 'and the transformation produced uncorrelated columns with “independent” information
    in each column:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE68]'
  prefs: []
  type: TYPE_PRE
- en: One way this insight may be useful in a machine learning application is that
    we can reduce the complexity of a model by using just \(Z_1\) rather than both
    \(X_1\) and \(X_2\).
  prefs: []
  type: TYPE_NORMAL
- en: It is actually common to obtain data with several highly correlated predictors.
    In these cases PCA, which we describe next, can be quite useful for reducing the
    complexity of the model being fit.
  prefs: []
  type: TYPE_NORMAL
- en: 33.5.4 Principal component analysis
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'In the computation above, the total variability in our data can be defined
    as the sum of the sum of squares of the columns. We assume the columns are centered,
    so this sum is equivalent to the sum of the variances of each column:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ v_1 + v_2, \mbox{ with } v_1 = \frac{1}{N}\sum_{i=1}^N X_{i,1}^2 \mbox{ and
    } v_2 = \frac{1}{N}\sum_{i=1}^N X_{i,2}^2 \]
  prefs: []
  type: TYPE_NORMAL
- en: 'We can compute \(v_1\) and \(v_2\) using:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE69]'
  prefs: []
  type: TYPE_PRE
- en: 'and we can show mathematically that if we apply an orthogonal transformation
    as above, then the total variation remains the same:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE70]'
  prefs: []
  type: TYPE_PRE
- en: 'However, while the variability in the two columns of `X` is about the same,
    in the transformed version \(Z\) 99% of the variability is included in just the
    first dimension:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE71]'
  prefs: []
  type: TYPE_PRE
- en: 'The *first principal component (PC)* of a matrix \(X\) is the linear orthogonal
    transformation of \(X\) that maximizes this variability. The function `prcomp`
    provides this info:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE72]'
  prefs: []
  type: TYPE_PRE
- en: Note that the first PC is almost the same as that provided by the \((X_1 + X_2)
    / \sqrt{2}\) we used earlier (except perhaps for a sign change that is arbitrary).
  prefs: []
  type: TYPE_NORMAL
- en: The function PCA returns both the rotation needed to transform \(X\) so that
    the variability of the columns is decreasing from most variable to least (accessed
    with `$rotation`) as well as the resulting new matrix (accessed with `$x`). By
    default the columns of \(X\) are first centered.
  prefs: []
  type: TYPE_NORMAL
- en: 'So, using the matrix multiplication shown above, we have that the following
    are the same (demonstrated by a difference between elements of essentially zero):'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE73]'
  prefs: []
  type: TYPE_PRE
- en: 'The rotation is orthogonal which means that the inverse is its transpose. So
    we also have that these two are identical:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE74]'
  prefs: []
  type: TYPE_PRE
- en: 'We can visualize these to see how the first component summarizes the data.
    In the plot below red represents high values and blue negative values (later,
    in Section [33.11.1](large-datasets.html#factor-analysis), we learn why we call
    these weights and patterns):'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/9286ee4fdfa186da557eb2c60d9a7390.png)'
  prefs: []
  type: TYPE_IMG
- en: It turns out that we can find this linear transformation not just for two dimensions
    but for matrices of any dimension \(p\).
  prefs: []
  type: TYPE_NORMAL
- en: For a multidimensional matrix with \(X\) with \(p\) columns, we can find a transformation
    that creates \(Z\) that preserves distance between rows, but with the variance
    of the columns in decreasing order. The second column is the second principal
    component, the third column is the third principal component, and so on. As in
    our example, if after a certain number of columns, say \(k\), the variances of
    the columns of \(Z_j\), \(j>k\) are very small, it means these dimensions have
    little to contribute to the distance and we can approximate distance between any
    two points with just \(k\) dimensions. If \(k\) is much smaller than \(p\), then
    we can achieve a very efficient summary of our data.
  prefs: []
  type: TYPE_NORMAL
- en: 33.5.5 Iris example
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The iris data is a widely used example in data analysis courses. It includes
    four botanical measurements related to three flower species:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE75]'
  prefs: []
  type: TYPE_PRE
- en: If you print `iris$Species` you will see that the data is ordered by the species.
  prefs: []
  type: TYPE_NORMAL
- en: 'Let’s compute the distance between each observation. You can clearly see the
    three species with one species very different from the other two:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE76]'
  prefs: []
  type: TYPE_PRE
- en: '![](../Images/74cca155d0b90f02be904e1801543f29.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Our predictors here have four dimensions, but three are very correlated:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE77]'
  prefs: []
  type: TYPE_PRE
- en: 'If we apply PCA, we should be able to approximate this distance with just two
    dimensions, compressing the highly correlated dimensions. Using the `summary`
    function we can see the variability explained by each PC:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE78]'
  prefs: []
  type: TYPE_PRE
- en: 'The first two dimensions account for 97% of the variability. Thus we should
    be able to approximate the distance very well with two dimensions. We can visualize
    the results of PCA:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/c37bc3010ae7a1fc8398dca4280be65e.png)'
  prefs: []
  type: TYPE_IMG
- en: And see that the first pattern is sepal length, petal length, and petal width
    (red) in one direction and sepal width (blue) in the other. The second pattern
    is the sepal length and petal width in one direction (blue) and petal length and
    petal width in the other (red). You can see from the weights that the first PC1
    drives most of the variability and it clearly separates the first third of samples
    (setosa) from the second two thirds (versicolor and virginica). If you look at
    the second column of the weights, you notice that it somewhat separates versicolor
    (red) from virginica (blue).
  prefs: []
  type: TYPE_NORMAL
- en: 'We can see this better by plotting the first two PCs with color representing
    the species:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE79]'
  prefs: []
  type: TYPE_PRE
- en: '![](../Images/9a5a35b318db1867caba029a1b6e1f01.png)'
  prefs: []
  type: TYPE_IMG
- en: 'We see that the first two dimensions preserve the distance:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE80]'
  prefs: []
  type: TYPE_PRE
- en: '![](../Images/509bb3d20556314c1fd7d804ec8eaada.png)'
  prefs: []
  type: TYPE_IMG
- en: This example is more realistic than the first artificial example we used, since
    we showed how we can visualize the data using two dimensions when the data was
    four-dimensional.
  prefs: []
  type: TYPE_NORMAL
- en: 33.5.6 MNIST example
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: The written digits example has 784 features. Is there any room for data reduction?
    Can we create simple machine learning algorithms using fewer features?
  prefs: []
  type: TYPE_NORMAL
- en: 'Let’s load the data:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE81]'
  prefs: []
  type: TYPE_PRE
- en: Because the pixels are so small, we expect pixels close to each other on the
    grid to be correlated, meaning that dimension reduction should be possible.
  prefs: []
  type: TYPE_NORMAL
- en: Let’s try PCA and explore the variance of the PCs. This will take a few seconds
    as it is a rather large matrix.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE82]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE83]'
  prefs: []
  type: TYPE_PRE
- en: '![](../Images/9bd298a5dfcc575816cac7f2536fc477.png)'
  prefs: []
  type: TYPE_IMG
- en: 'We can see that the first few PCs already explain a large percent of the variability:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE84]'
  prefs: []
  type: TYPE_PRE
- en: 'And just by looking at the first two PCs we see information about the class.
    Here is a random sample of 2,000 digits:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE85]'
  prefs: []
  type: TYPE_PRE
- en: '![](../Images/c0b7113cc6307863cefcfd4537874a09.png)'
  prefs: []
  type: TYPE_IMG
- en: 'We can also *see* the linear combinations on the grid to get an idea of what
    is getting weighted:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/a87434775b999ffa43a98c60b11347ef.png)'
  prefs: []
  type: TYPE_IMG
- en: 'The lower variance PCs appear related to unimportant variability in the corners:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/5b10d3e3ee62e4971858953b1da35dd5.png)'
  prefs: []
  type: TYPE_IMG
- en: Now let’s apply the transformation we learned with the training data to the
    test data, reduce the dimension and run knn on just a small number of dimensions.
  prefs: []
  type: TYPE_NORMAL
- en: 'We try 36 dimensions since this explains about 80% of the data. First fit the
    model:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE86]'
  prefs: []
  type: TYPE_PRE
- en: 'Now transform the test set:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE87]'
  prefs: []
  type: TYPE_PRE
- en: 'And we are ready to predict and see how we do:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE88]'
  prefs: []
  type: TYPE_PRE
- en: With just 36 dimensions we get an accuracy well above 0.95.
  prefs: []
  type: TYPE_NORMAL
- en: 33.6 Exercises
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 1\. We want to explore the `tissue_gene_expression` predictors by plotting them.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE89]'
  prefs: []
  type: TYPE_PRE
- en: We want to get an idea of which observations are close to each other, but the
    predictors are 500-dimensional so plotting is difficult. Plot the first two principal
    components with color representing tissue type.
  prefs: []
  type: TYPE_NORMAL
- en: 2\. The predictors for each observation are measured on the same measurement
    device (a gene expression microarray) after an experimental procedure. A different
    device and procedure is used for each observation. This may introduce biases that
    affect all predictors for each observation in the same way. To explore the effect
    of this potential bias, for each observation, compute the average across all predictors
    and then plot this against the first PC with color representing tissue. Report
    the correlation.
  prefs: []
  type: TYPE_NORMAL
- en: 3\. We see an association with the first PC and the observation averages. Redo
    the PCA but only after removing the center.
  prefs: []
  type: TYPE_NORMAL
- en: 4\. For the first 10 PCs, make a boxplot showing the values for each tissue.
  prefs: []
  type: TYPE_NORMAL
- en: '5\. Plot the percent variance explained by PC number. Hint: use the `summary`
    function.'
  prefs: []
  type: TYPE_NORMAL
- en: 33.7 Recommendation systems
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Recommendation systems use ratings that *users* have given *items* to make specific
    recommendations. Companies that sell many products to many customers and permit
    these customers to rate their products, like Amazon, are able to collect massive
    datasets that can be used to predict what rating a particular user will give a
    specific item. Items for which a high rating is predicted for a given user are
    then recommended to that user.
  prefs: []
  type: TYPE_NORMAL
- en: Netflix uses a recommendation system to predict how many *stars* a user will
    give a specific movie. One star suggests it is not a good movie, whereas five
    stars suggests it is an excellent movie. Here, we provide the basics of how these
    recommendations are made, motivated by some of the approaches taken by the winners
    of the *Netflix challenges*.
  prefs: []
  type: TYPE_NORMAL
- en: 'In October 2006, Netflix offered a challenge to the data science community:
    improve our recommendation algorithm by 10% and win a million dollars. In September
    2009, the winners were announced[^(108)](#fn108). You can read a good summary
    of how the winning algorithm was put together here: [http://blog.echen.me/2011/10/24/winning-the-netflix-prize-a-summary/](http://blog.echen.me/2011/10/24/winning-the-netflix-prize-a-summary/)
    and a more detailed explanation here: [https://www2.seas.gwu.edu/~simhaweb/champalg/cf/papers/KorenBellKor2009.pdf](https://www2.seas.gwu.edu/~simhaweb/champalg/cf/papers/KorenBellKor2009.pdf).
    We will now show you some of the data analysis strategies used by the winning
    team.'
  prefs: []
  type: TYPE_NORMAL
- en: 33.7.1 Movielens data
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The Netflix data is not publicly available, but the GroupLens research lab[^(109)](#fn109)
    generated their own database with over 20 million ratings for over 27,000 movies
    by more than 138,000 users. We make a small subset of this data available via
    the **dslabs** package:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE90]'
  prefs: []
  type: TYPE_PRE
- en: 'We can see this table is in tidy format with thousands of rows:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE91]'
  prefs: []
  type: TYPE_PRE
- en: Each row represents a rating given by one user to one movie.
  prefs: []
  type: TYPE_NORMAL
- en: 'We can see the number of unique users that provided ratings and how many unique
    movies were rated:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE92]'
  prefs: []
  type: TYPE_PRE
- en: If we multiply those two numbers, we get a number larger than 5 million, yet
    our data table has about 100,000 rows. This implies that not every user rated
    every movie. So we can think of these data as a very large matrix, with users
    on the rows and movies on the columns, with many empty cells. The `pivot_wider`
    function permits us to convert it to this format, but if we try it for the entire
    matrix, it will crash R. Let’s show the matrix for six users and four movies.
  prefs: []
  type: TYPE_NORMAL
- en: '| userId | Pulp Fiction | Shawshank Redemption | Forrest Gump | Silence of
    the Lambs |'
  prefs: []
  type: TYPE_TB
- en: '| --- | --- | --- | --- | --- |'
  prefs: []
  type: TYPE_TB
- en: '| 13 | 3.5 | 4.5 | 5.0 | NA |'
  prefs: []
  type: TYPE_TB
- en: '| 15 | 5.0 | 2.0 | 1.0 | 5.0 |'
  prefs: []
  type: TYPE_TB
- en: '| 16 | NA | 4.0 | NA | NA |'
  prefs: []
  type: TYPE_TB
- en: '| 17 | 5.0 | 5.0 | 2.5 | 4.5 |'
  prefs: []
  type: TYPE_TB
- en: '| 19 | 5.0 | 4.0 | 5.0 | 3.0 |'
  prefs: []
  type: TYPE_TB
- en: '| 20 | 0.5 | 4.5 | 2.0 | 0.5 |'
  prefs: []
  type: TYPE_TB
- en: You can think of the task of a recommendation system as filling in the `NA`s
    in the table above. To see how *sparse* the matrix is, here is the matrix for
    a random sample of 100 movies and 100 users with yellow indicating a user/movie
    combination for which we have a rating.
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/22da3838dac0232da62a803ace9c4749.png)'
  prefs: []
  type: TYPE_IMG
- en: This machine learning challenge is more complicated than what we have studied
    up to now because each outcome \(Y\) has a different set of predictors. To see
    this, note that if we are predicting the rating for movie \(i\) by user \(u\),
    in principle, all other ratings related to movie \(i\) and by user \(u\) may be
    used as predictors, but different users rate different movies and a different
    number of movies. Furthermore, we may be able to use information from other movies
    that we have determined are similar to movie \(i\) or from users determined to
    be similar to user \(u\). In essence, the entire matrix can be used as predictors
    for each cell.
  prefs: []
  type: TYPE_NORMAL
- en: Let’s look at some of the general properties of the data to better understand
    the challenges.
  prefs: []
  type: TYPE_NORMAL
- en: 'The first thing we notice is that some movies get rated more than others. Below
    is the distribution. This should not surprise us given that there are blockbuster
    movies watched by millions and artsy, independent movies watched by just a few.
    Our second observation is that some users are more active than others at rating
    movies:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/bc42e3483009d052609a3f83e31e906b.png)'
  prefs: []
  type: TYPE_IMG
- en: 33.7.2 Recommendation systems as a machine learning challenge
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: To see how this is a type of machine learning, notice that we need to build
    an algorithm with data we have collected that will then be applied outside our
    control, as users look for movie recommendations. So let’s create a test set to
    assess the accuracy of the models we implement. We only consider movies rated
    five times or more, and users that have rated more than 100 of these movies.
  prefs: []
  type: TYPE_NORMAL
- en: 'We then split the data into a training set and test set by assiging 20% of
    the ratings made by each user to the test set:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE93]'
  prefs: []
  type: TYPE_PRE
- en: 'To make sure we don’t include movies that are not in both test and train sets,
    we remove entries using the `semi_join` function:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE94]'
  prefs: []
  type: TYPE_PRE
- en: Finally we use `pivot_wider` to make a matrix with users represented by rows
    and movies by the columns
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE95]'
  prefs: []
  type: TYPE_PRE
- en: 'along with a table to map movie ids to titles:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE96]'
  prefs: []
  type: TYPE_PRE
- en: 33.7.3 Loss function
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The Netflix challenge used the typical error loss: they decided on a winner
    based on the residual mean squared error (RMSE) on a test set. We define \(y_{u,i}\)
    as the rating for movie \(i\) by user \(u\) and denote our prediction with \(\hat{y}_{u,i}\).
    The RMSE is then defined as:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ \mbox{RMSE} = \sqrt{\frac{1}{N} \sum_{u,i}^{} \left( \hat{y}_{u,i} - y_{u,i}
    \right)^2 } \] with \(N\) being the number of user/movie combinations and the
    sum occurring over all these combinations.
  prefs: []
  type: TYPE_NORMAL
- en: 'Remember that we can interpret the RMSE similarly to a standard deviation:
    it is the typical error we make when predicting a movie rating. If this number
    is larger than 1, it means our typical error is larger than one star, which is
    not good.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Let’s write a function that computes the RMSE for vectors of ratings and their
    corresponding predictors:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE97]'
  prefs: []
  type: TYPE_PRE
- en: 33.7.4 A first model
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Let’s start by building the simplest possible recommendation system: we predict
    the same rating for all movies regardless of user. What number should this prediction
    be? We can use a model based approach to answer this. A model that assumes the
    same rating for all movies and users with all the differences explained by random
    variation would look like this:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ Y_{u,i} = \mu + \varepsilon_{u,i} \]
  prefs: []
  type: TYPE_NORMAL
- en: 'with \(\varepsilon_{i,u}\) independent errors sampled from the same distribution
    centered at 0 and \(\mu\) the “true” rating for all movies. We know that the estimate
    that minimizes the RMSE is the least squares estimate of \(\mu\) and, in this
    case, is the average of all ratings:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE98]'
  prefs: []
  type: TYPE_PRE
- en: 'If we predict all unknown ratings with \(\hat{\mu}\) we obtain the following
    RMSE:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE99]'
  prefs: []
  type: TYPE_PRE
- en: 'Keep in mind that if you plug in any other number, you get a higher RMSE. For
    example:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE100]'
  prefs: []
  type: TYPE_PRE
- en: From looking at the distribution of ratings, we can visualize that this is the
    standard deviation of that distribution. We get a RMSE of about 1\. To win the
    grand prize of $1,000,000, a participating team had to get an RMSE of about 0.857\.
    So we can definitely do better!
  prefs: []
  type: TYPE_NORMAL
- en: 'As we go along, we will be comparing different approaches. Let’s start by creating
    a results table with this naive approach:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE101]'
  prefs: []
  type: TYPE_PRE
- en: 33.7.5 Modeling movie effects
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'We know from experience that some movies are just generally rated higher than
    others. This intuition, that different movies are rated differently, is confirmed
    by data. We can augment our previous model by adding the term \(b_i\) to represent
    average ranking for movie \(i\):'
  prefs: []
  type: TYPE_NORMAL
- en: \[ Y_{u,i} = \mu + b_i + \varepsilon_{u,i} \]
  prefs: []
  type: TYPE_NORMAL
- en: Statistics textbooks refer to the \(b\)s as effects. However, in the Netflix
    challenge papers, they refer to them as *bias*, thus the \(b\) notation.
  prefs: []
  type: TYPE_NORMAL
- en: 'We can again use least squares to estimate the \(b_i\) in the following way:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE102]'
  prefs: []
  type: TYPE_PRE
- en: 'Because there are thousands of \(b_i\) as each movie gets one, the `lm()` function
    will be very slow here. We therefore don’t recommend running the code above. But
    in this particular situation, we know that the least squares estimate \(\hat{b}_i\)
    is just the average of \(Y_{u,i} - \hat{\mu}\) for each movie \(i\). So we can
    compute them this way (we will drop the `hat` notation in the code to represent
    estimates going forward):'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE103]'
  prefs: []
  type: TYPE_PRE
- en: 'We can see that these estimates vary substantially:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE104]'
  prefs: []
  type: TYPE_PRE
- en: '![](../Images/98f533225e5d1f301cfc7c5d63c0efca.png)'
  prefs: []
  type: TYPE_IMG
- en: Remember \(\hat{\mu}=3.5\) so a \(b_i = 1.5\) implies a perfect five star rating.
  prefs: []
  type: TYPE_NORMAL
- en: 'Let’s see how much our prediction improves once we use \(\hat{y}_{u,i} = \hat{\mu}
    + \hat{b}_i\):'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE105]'
  prefs: []
  type: TYPE_PRE
- en: We already see an improvement. But can we make it better?
  prefs: []
  type: TYPE_NORMAL
- en: 33.7.6 User effects
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Let’s compute the average rating for user \(u\) for those that have rated 100
    or more movies:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE106]'
  prefs: []
  type: TYPE_PRE
- en: '![](../Images/1fc5b103b40351c2a01a957df9c9402e.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Notice that there is substantial variability across users as well: some users
    are very cranky and others love every movie. This implies that a further improvement
    to our model may be:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ Y_{u,i} = \mu + b_i + b_u + \varepsilon_{u,i} \]
  prefs: []
  type: TYPE_NORMAL
- en: where \(b_u\) is a user-specific effect. Now if a cranky user (negative \(b_u\))
    rates a great movie (positive \(b_i\)), the effects counter each other and we
    may be able to correctly predict that this user gave this great movie a 3 rather
    than a 5.
  prefs: []
  type: TYPE_NORMAL
- en: 'To fit this model, we could again use `lm` like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE107]'
  prefs: []
  type: TYPE_PRE
- en: 'but, for the reasons described earlier, we won’t. Instead, we will compute
    an approximation by computing \(\hat{\mu}\) and \(\hat{b}_i\) and estimating \(\hat{b}_u\)
    as the average of \(y_{u,i} - \hat{\mu} - \hat{b}_i\):'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE108]'
  prefs: []
  type: TYPE_PRE
- en: 'We can now construct predictors and see how much the RMSE improves:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE109]'
  prefs: []
  type: TYPE_PRE
- en: 33.8 Exercises
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 1\. Load the `movielens` data.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE110]'
  prefs: []
  type: TYPE_PRE
- en: Compute the number of ratings for each movie and then plot it against the year
    the movie came out. Use the square root transformation on the counts.
  prefs: []
  type: TYPE_NORMAL
- en: '2\. We see that, on average, movies that came out after 1993 get more ratings.
    We also see that with newer movies, starting in 1993, the number of ratings decreases
    with year: the more recent a movie is, the less time users have had to rate it.'
  prefs: []
  type: TYPE_NORMAL
- en: Among movies that came out in 1993 or later, what are the 25 movies with the
    most ratings per year? Also report their average rating.
  prefs: []
  type: TYPE_NORMAL
- en: '3\. From the table constructed in the previous example, we see that the most
    rated movies tend to have above average ratings. This is not surprising: more
    people watch popular movies. To confirm this, stratify the post 1993 movies by
    ratings per year and compute their average ratings. Make a plot of average rating
    versus ratings per year and show an estimate of the trend.'
  prefs: []
  type: TYPE_NORMAL
- en: 4\. In the previous exercise, we see that the more a movie is rated, the higher
    the rating. Suppose you are doing a predictive analysis in which you need to fill
    in the missing ratings with some value. Which of the following strategies would
    you use?
  prefs: []
  type: TYPE_NORMAL
- en: Fill in the missing values with average rating of all movies.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Fill in the missing values with 0.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Fill in the value with a lower value than the average since lack of rating is
    associated with lower ratings. Try out different values and evaluate prediction
    in a test set.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: None of the above.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '5\. The `movielens` dataset also includes a time stamp. This variable represents
    the time and data in which the rating was provided. The units are seconds since
    January 1, 1970\. Create a new column `date` with the date. Hint: use the `as_datetime`
    function in the **lubridate** package.'
  prefs: []
  type: TYPE_NORMAL
- en: '6\. Compute the average rating for each week and plot this average against
    day. Hint: use the `round_date` function before you `group_by`.'
  prefs: []
  type: TYPE_NORMAL
- en: '7\. The plot shows some evidence of a time effect. If we define \(d_{u,i}\)
    as the day for user’s \(u\) rating of movie \(i\), which of the following models
    is most appropriate:'
  prefs: []
  type: TYPE_NORMAL
- en: \(Y_{u,i} = \mu + b_i + b_u + d_{u,i} + \varepsilon_{u,i}\).
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: \(Y_{u,i} = \mu + b_i + b_u + d_{u,i}\beta + \varepsilon_{u,i}\).
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: \(Y_{u,i} = \mu + b_i + b_u + d_{u,i}\beta_i + \varepsilon_{u,i}\).
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: \(Y_{u,i} = \mu + b_i + b_u + f(d_{u,i}) + \varepsilon_{u,i}\), with \(f\) a
    smooth function of \(d_{u,i}\).
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 8\. The `movielens` data also has a `genres` column. This column includes every
    genre that applies to the movie. Some movies fall under several genres. Define
    a category as whatever combination appears in this column. Keep only categories
    with more than 1,000 ratings. Then compute the average and standard error for
    each category. Plot these as error bar plots.
  prefs: []
  type: TYPE_NORMAL
- en: '9\. The plot shows strong evidence of a genre effect. If we define \(g_{u,i}\)
    as the genre for user’s \(u\) rating of movie \(i\), which of the following models
    is most appropriate:'
  prefs: []
  type: TYPE_NORMAL
- en: \(Y_{u,i} = \mu + b_i + b_u + d_{u,i} + \varepsilon_{u,i}\).
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: \(Y_{u,i} = \mu + b_i + b_u + d_{u,i}\beta + \varepsilon_{u,i}\).
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: \(Y_{u,i} = \mu + b_i + b_u + \sum_{k=1}^K x_{u,i} \beta_k + \varepsilon_{u,i}\),
    with \(x^k_{u,i} = 1\) if \(g_{u,i}\) is genre \(k\).
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: \(Y_{u,i} = \mu + b_i + b_u + f(d_{u,i}) + \varepsilon_{u,i}\), with \(f\) a
    smooth function of \(d_{u,i}\).
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 33.9 Regularization
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 33.9.1 Motivation
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Let’s look at the top 3 movies, based on our estimates of the movie effect
    \(b_i\), along with the number of ratings this rating was based on. Several movies
    get a perfect score. Here are the ones with more than 1 rating:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE111]'
  prefs: []
  type: TYPE_PRE
- en: These all seem like obscure movies. Do we really think these are the top 3 movies
    in our database? Will this prediction hold on the test set? Note that all, except
    one, are lower in the test, some considerable lower.
  prefs: []
  type: TYPE_NORMAL
- en: These supposed *best* movies were rated by very few users and small sample sizes
    lead to uncertainty. Therefore, larger estimates of \(b_i\), negative or positive,
    are more likely. Therefore, these are noisy estimates that we should not trust,
    especially when it comes to prediction. Large errors can increase our RMSE, so
    we would rather be conservative when unsure.
  prefs: []
  type: TYPE_NORMAL
- en: In previous sections, we computed standard error and constructed confidence
    intervals to account for different levels of uncertainty. However, when making
    predictions, we need one number, one prediction, not an interval. For this, we
    introduce the concept of regularization.
  prefs: []
  type: TYPE_NORMAL
- en: Regularization permits us to penalize large estimates that are formed using
    small sample sizes. It has commonalities with the Bayesian approach that shrunk
    predictions described in Section [16.4](models.html#bayesian-statistics).
  prefs: []
  type: TYPE_NORMAL
- en: 33.9.2 Penalized least squares
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: The general idea behind regularization is to constrain the total variability
    of the effect sizes. Why does this help? Consider a case in which we have movie
    \(i=1\) with 100 user ratings and 4 movies \(i=2,3,4,5\) with just one user rating.
    We intend to fit the model
  prefs: []
  type: TYPE_NORMAL
- en: \[ Y_{u,i} = \mu + b_i + \varepsilon_{u,i} \]
  prefs: []
  type: TYPE_NORMAL
- en: 'Suppose we know the average rating is, say, \(\mu = 3\). If we use least squares,
    the estimate for the first movie effect \(b_1\) is the average of the 100 user
    ratings, \(1/100 \sum_{i=1}^{100} (Y_{i,1} - \mu)\), which we expect to be a quite
    precise. However, the estimate for movies 2, 3, 4, and 5 will simply be the observed
    deviation from the average rating \(\hat{b}_i = Y_{u,i} - \hat{\mu}\) which is
    an estimate based on just one number so it won’t be precise at all. Note these
    estimates make the error \(Y_{u,i} - \mu + \hat{b}_i\) equal to 0 for \(i=2,3,4,5\),
    but this is a case of over-training. In fact, ignoring the one user and guessing
    that movies 2,3,4, and 5 are just average movies (\(b_i = 0\)) might provide a
    better prediction. The general idea of penalized regression is to control the
    total variability of the movie effects: \(\sum_{i=1}^5 b_i^2\). Specifically,
    instead of minimizing the least squares equation, we minimize an equation that
    adds a penalty:'
  prefs: []
  type: TYPE_NORMAL
- en: '\[ \sum_{u,i} \left(y_{u,i} - \mu - b_i\right)^2 + \lambda \sum_{i} b_i^2 \]
    The first term is just the sum of squares and the second is a penalty that gets
    larger when many \(b_i\) are large. Using calculus we can actually show that the
    values of \(b_i\) that minimize this equation are:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ \hat{b}_i(\lambda) = \frac{1}{\lambda + n_i} \sum_{u=1}^{n_i} \left(Y_{u,i}
    - \hat{\mu}\right) \]
  prefs: []
  type: TYPE_NORMAL
- en: 'where \(n_i\) is the number of ratings made for movie \(i\). This approach
    will have our desired effect: when our sample size \(n_i\) is very large, a case
    which will give us a stable estimate, then the penalty \(\lambda\) is effectively
    ignored since \(n_i+\lambda \approx n_i\). However, when the \(n_i\) is small,
    then the estimate \(\hat{b}_i(\lambda)\) is shrunken towards 0\. The larger \(\lambda\),
    the more we shrink.'
  prefs: []
  type: TYPE_NORMAL
- en: 'To select \(\lambda\), we can use cross validation:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE112]'
  prefs: []
  type: TYPE_PRE
- en: 'We can then select the value that minimizes the RMSE:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE113]'
  prefs: []
  type: TYPE_PRE
- en: '![](../Images/afae3088209d969e3b94e49448dc3771.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Once we select a \(\lambda\) we can compute the regularized estimates and add
    to our table of estimates:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE114]'
  prefs: []
  type: TYPE_PRE
- en: To see how the estimates shrink, let’s make a plot of the regularized estimates
    versus the least squares estimates.
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/d29aea0fa18f327361c17cb0b199c361.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Now, let’s look at the top 5 best movies based on the penalized estimates \(\hat{b}_i(\lambda)\):'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE115]'
  prefs: []
  type: TYPE_PRE
- en: These make much more sense! These movies are watched more and have more ratings.
  prefs: []
  type: TYPE_NORMAL
- en: 'Do we improve our results? Let’s estimate the user effects with the new movie
    effect estimates and compute the new RMSE:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE116]'
  prefs: []
  type: TYPE_PRE
- en: 'The penalized estimates provide an improvement over the least squares estimates:'
  prefs: []
  type: TYPE_NORMAL
- en: '| method | RMSE |'
  prefs: []
  type: TYPE_TB
- en: '| --- | --- |'
  prefs: []
  type: TYPE_TB
- en: '| Just the average | 1.051 |'
  prefs: []
  type: TYPE_TB
- en: '| Movie Effect Model | 0.991 |'
  prefs: []
  type: TYPE_TB
- en: '| Movie + User Effects Model | 0.910 |'
  prefs: []
  type: TYPE_TB
- en: '| Regularized Movie + User Effect Model | 0.887 |'
  prefs: []
  type: TYPE_TB
- en: 33.10 Exercises
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: An education expert is advocating for smaller schools. The expert bases this
    recommendation on the fact that among the best performing schools, many are small
    schools. Let’s simulate a dataset for 100 schools. First, let’s simulate the number
    of students in each school.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE117]'
  prefs: []
  type: TYPE_PRE
- en: Now let’s assign a *true* quality for each school completely independent from
    size. This is the parameter we want to estimate.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE118]'
  prefs: []
  type: TYPE_PRE
- en: 'We can see that the top 10 schools are:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE119]'
  prefs: []
  type: TYPE_PRE
- en: 'Now let’s have the students in the school take a test. There is random variability
    in test taking so we will simulate the test scores as normally distributed with
    the average determined by the school quality and standard deviations of 30 percentage
    points:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE120]'
  prefs: []
  type: TYPE_PRE
- en: 1\. What are the top schools based on the average score? Show just the ID, size,
    and the average score.
  prefs: []
  type: TYPE_NORMAL
- en: 2\. Compare the median school size to the median school size of the top 10 schools
    based on the score.
  prefs: []
  type: TYPE_NORMAL
- en: 3\. According to this test, it appears small schools are better than large schools.
    Five out of the top 10 schools have 100 or fewer students. But how can this be?
    We constructed the simulation so that quality and size are independent. Repeat
    the exercise for the worst 10 schools.
  prefs: []
  type: TYPE_NORMAL
- en: 4\. The same is true for the worst schools! They are small as well. Plot the
    average score versus school size to see what’s going on. Highlight the top 10
    schools based on the *true* quality. Use the log scale transform for the size.
  prefs: []
  type: TYPE_NORMAL
- en: 5\. We can see that the standard error of the score has larger variability when
    the school is smaller. This is a basic statistical reality we learned in the probability
    and inference sections. In fact, note that 4 of the top 10 schools are in the
    top 10 schools based on the exam score.
  prefs: []
  type: TYPE_NORMAL
- en: 'Let’s use regularization to pick the best schools. Remember regularization
    *shrinks* deviations from the average towards 0\. So to apply regularization here,
    we first need to define the overall average for all schools:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE121]'
  prefs: []
  type: TYPE_PRE
- en: and then define, for each school, how it deviates from that average. Write code
    that estimates the score above average for each school but dividing by \(n + \lambda\)
    instead of \(n\), with \(n\) the school size and \(\lambda\) a regularization
    parameter. Try \(\lambda = 3\).
  prefs: []
  type: TYPE_NORMAL
- en: 6\. Notice that this improves things a bit. The number of small schools that
    are not highly ranked is now 4\. Is there a better \(\lambda\)? Find the \(\lambda\)
    that minimizes the RMSE = \(1/100 \sum_{i=1}^{100} (\mbox{quality} - \mbox{estimate})^2\).
  prefs: []
  type: TYPE_NORMAL
- en: 7\. Rank the schools based on the average obtained with the best \(\alpha\).
    Note that no small school is incorrectly included.
  prefs: []
  type: TYPE_NORMAL
- en: 8\. A common mistake to make when using regularization is shrinking values towards
    0 that are not centered around 0\. For example, if we don’t subtract the overall
    average before shrinking, we actually obtain a very similar result. Confirm this
    by re-running the code from exercise 6 but without removing the overall mean.
  prefs: []
  type: TYPE_NORMAL
- en: 33.11 Matrix factorization
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Matrix factorization is a widely used concept in machine learning. It is very
    much related to factor analysis, singular value decomposition (SVD), and principal
    component analysis (PCA). Here we describe the concept in the context of movie
    recommendation systems.
  prefs: []
  type: TYPE_NORMAL
- en: 'We have described how the model:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ Y_{u,i} = \mu + b_i + b_u + \varepsilon_{u,i} \]
  prefs: []
  type: TYPE_NORMAL
- en: 'accounts for movie to movie differences through the \(b_i\) and user to user
    differences through the \(b_u\). But this model leaves out an important source
    of variation related to the fact that groups of movies have similar rating patterns
    and groups of users have similar rating patterns as well. We will discover these
    patterns by studying the residuals:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ r_{u,i} = y_{u,i} - \hat{b}_i - \hat{b}_u \]
  prefs: []
  type: TYPE_NORMAL
- en: 'We can compute these residuals for the model we fit in the previous section:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE122]'
  prefs: []
  type: TYPE_PRE
- en: 'If the movie and user effect model explains all the signal, and the \(\varepsilon\)
    are just noise, then the residuals for different movies should be independent
    from each other. But they are not. Here are some examples:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/29a8d3f675429b590c2ac827f725a233.png)'
  prefs: []
  type: TYPE_IMG
- en: This plot says that users that liked The Godfather more than what the model
    expects them to, based on the movie and user effects, also liked The Godfather
    II more than expected. A similar relationship is seen when comparing The Godfather
    and Goodfellas. Although not as strong, there is still correlation. We see correlations
    between You’ve Got Mail and Sleepless in Seattle as well
  prefs: []
  type: TYPE_NORMAL
- en: 'By looking at the correlation between movies, we can see a pattern (we rename
    the columns to save print space):'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE123]'
  prefs: []
  type: TYPE_PRE
- en: There seems to be people that like romantic comedies more than expected, while
    others that like gangster movies more than expected.
  prefs: []
  type: TYPE_NORMAL
- en: These results tell us that there is structure in the data. But how can we model
    this?
  prefs: []
  type: TYPE_NORMAL
- en: 33.11.1 Factor analysis
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Here is an illustration, using a simulation, of how we can use some structure
    to predict the \(r_{u,i}\). Suppose our residuals `r` look like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE124]'
  prefs: []
  type: TYPE_PRE
- en: 'There seems to be a pattern here. In fact, we can see very strong correlation
    patterns:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE125]'
  prefs: []
  type: TYPE_PRE
- en: 'We can create vectors `q` and `p`, that can explain much of the structure we
    see. The `q` would look like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE126]'
  prefs: []
  type: TYPE_PRE
- en: 'and it narrows down movies to two groups: gangster (coded with 1) and romance
    (coded with -1). We can also reduce the users to three groups:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE127]'
  prefs: []
  type: TYPE_PRE
- en: those that like gangster movies and dislike romance movies (coded as 2), those
    that like romance movies and dislike gangster movies (coded as -2), and those
    that don’t care (coded as 0). The main point here is that we can almost reconstruct
    \(r\), which has 60 values, with a couple of vectors totaling 17 values. Note
    that `p` and `q` are equivalent to the patterns and weights we described in Section
    [33.5.4](large-datasets.html#pca).
  prefs: []
  type: TYPE_NORMAL
- en: If \(r\) contains the residuals for users \(u=1,\dots,12\) for movies \(i=1,\dots,5\)
    we can write the following mathematical formula for our residuals \(r_{u,i}\).
  prefs: []
  type: TYPE_NORMAL
- en: \[ r_{u,i} \approx p_u q_i \]
  prefs: []
  type: TYPE_NORMAL
- en: 'This implies that we can explain more variability by modifying our previous
    model for movie recommendations to:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ Y_{u,i} = \mu + b_i + b_u + p_u q_i + \varepsilon_{u,i} \]
  prefs: []
  type: TYPE_NORMAL
- en: However, we motivated the need for the \(p_u q_i\) term with a simple simulation.
    The structure found in data is usually more complex. For example, in this first
    simulation we assumed there were was just one factor \(p_u\) that determined which
    of the two genres movie \(u\) belongs to. But the structure in our movie data
    seems to be much more complicated than gangster movie versus romance. We may have
    many other factors. Here we present a slightly more complex simulation. We now
    add a sixth movie, Scent of Woman.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE128]'
  prefs: []
  type: TYPE_PRE
- en: By exploring the correlation structure of this new dataset
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE129]'
  prefs: []
  type: TYPE_PRE
- en: 'we note that perhaps we need a second factor to account for the fact that some
    users like Al Pacino, while others dislike him or don’t care. Notice that the
    overall structure of the correlation obtained from the simulated data is not that
    far off the real correlation:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE130]'
  prefs: []
  type: TYPE_PRE
- en: 'To explain this more complicated structure, we need two factors. For example
    something like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE131]'
  prefs: []
  type: TYPE_PRE
- en: 'With the first factor (the first column of `q`) used to code the gangster versus
    romance groups and a second factor (the second column of `q`) to explain the Al
    Pacino versus no Al Pacino groups. We will also need two sets of coefficients
    to explain the variability introduced by the \(3\times 3\) types of groups:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE132]'
  prefs: []
  type: TYPE_PRE
- en: 'The model with two factors has 36 parameters that can be used to explain much
    of the variability in the 72 ratings:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ Y_{u,i} = \mu + b_i + b_u + p_{u,1} q_{1,i} + p_{u,2} q_{2,i} + \varepsilon_{u,i}
    \]
  prefs: []
  type: TYPE_NORMAL
- en: Note that in an actual data application, we need to fit this model to data.
    To explain the complex correlation we observe in real data, we usually permit
    the entries of \(p\) and \(q\) to be continuous values, rather than discrete ones
    as we used in the simulation. For example, rather than dividing movies into gangster
    or romance, we define a continuum. Also note that this is not a linear model and
    to fit it we need to use an algorithm other than the one used by `lm` to find
    the parameters that minimize the least squares. The winning algorithms for the
    Netflix challenge fit a model similar to the above and used regularization to
    penalize for large values of \(p\) and \(q\), rather than using least squares.
    Implementing this approach is beyond the scope of this book.
  prefs: []
  type: TYPE_NORMAL
- en: 33.11.2 Connection to SVD and PCA
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'The decomposition:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ r_{u,i} \approx p_{u,1} q_{1,i} + p_{u,2} q_{2,i} \]
  prefs: []
  type: TYPE_NORMAL
- en: 'is very much related to SVD and PCA. SVD and PCA are complicated concepts,
    but one way to understand them is that SVD is an algorithm that finds the vectors
    \(p\) and \(q\) that permit us to rewrite the matrix \(\mbox{r}\) with \(m\) rows
    and \(n\) columns as:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ r_{u,i} = p_{u,1} q_{1,i} + p_{u,2} q_{2,i} + \dots + p_{u,n} q_{n,i} \]
  prefs: []
  type: TYPE_NORMAL
- en: 'with the variability of each term decreasing and with the \(p\)s uncorrelated.
    The algorithm also computes this variability so that we can know how much of the
    matrices, total variability is explained as we add new terms. This may permit
    us to see that, with just a few terms, we can explain most of the variability.
    To illustrate this we will only consider a small subset of movies with many ratings
    and users that have rated many movies:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE133]'
  prefs: []
  type: TYPE_PRE
- en: 'We first remove the overall movie and user effects as we are interested in
    the variability not explained by these. We start by removing the movie effects:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE134]'
  prefs: []
  type: TYPE_PRE
- en: 'Because for the techniques shown here we can’t have missing values we need
    to replace the missing ratings. There are advanced techniques for doing this,
    some are explained in the description of the winning entry for the Netflix competition.
    Here we will use a simple approach: replace with a constant. Now because an unrated
    movie is more likely to be a movie the user does not want to see, we will replace
    the missing ratings with -1 rather than a 0, which represents a neutral rating.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE135]'
  prefs: []
  type: TYPE_PRE
- en: 'Finally we will remove the overall user effect:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE136]'
  prefs: []
  type: TYPE_PRE
- en: 'Now we can perform principal component analysis:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE137]'
  prefs: []
  type: TYPE_PRE
- en: 'The \(q\) vectors are called the principal components and they are stored in
    this matrix:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE138]'
  prefs: []
  type: TYPE_PRE
- en: 'While the \(p\), or the user effects, are here:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE139]'
  prefs: []
  type: TYPE_PRE
- en: 'We can see the variability of each of the vectors:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE140]'
  prefs: []
  type: TYPE_PRE
- en: '![](../Images/d17ad3e511de4a4f3ad3258d3506f0c2.png)'
  prefs: []
  type: TYPE_IMG
- en: 'We also notice that the first two principal components are related to the structure
    in opinions about movies:'
  prefs: []
  type: TYPE_NORMAL
- en: '![](../Images/3d61a806c47d8162de83ecc95d960a4b.png)'
  prefs: []
  type: TYPE_IMG
- en: 'Just by looking at the top 10 in each direction, we see a meaningful patterns.
    The first PC shows the difference between Hollywood blockbusters on one side:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE141]'
  prefs: []
  type: TYPE_PRE
- en: 'and critically acclaimed movies on the other:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE142]'
  prefs: []
  type: TYPE_PRE
- en: While the second PC seems to be related to nerd favorites or violent movies
    on one side
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE143]'
  prefs: []
  type: TYPE_PRE
- en: 'and romantic movies on the other:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE144]'
  prefs: []
  type: TYPE_PRE
- en: Fitting a model that incorporates these estimates is complicated. For those
    interested in implementing an approach that incorporates these ideas, we recommend
    trying the **recommenderlab** package. The details are beyond the scope of this
    book.
  prefs: []
  type: TYPE_NORMAL
- en: 33.12 Exercises
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'In this exercise set, we will be covering a topic useful for understanding
    matrix factorization: the singular value decomposition (SVD). SVD is a mathematical
    result that is widely used in machine learning, both in practice and to understand
    the mathematical properties of some algorithms. This is a rather advanced topic
    and to complete this exercise set you will have to be familiar with linear algebra
    concepts such as matrix multiplication, orthogonal matrices, and diagonal matrices.'
  prefs: []
  type: TYPE_NORMAL
- en: The SVD tells us that we can *decompose* an \(N\times p\) matrix \(Y\) with
    \(p < N\) as
  prefs: []
  type: TYPE_NORMAL
- en: \[ Y = U D V^{\top} \]
  prefs: []
  type: TYPE_NORMAL
- en: 'With \(U\) and \(V\) *orthogonal* of dimensions \(N\times p\) and \(p\times
    p\), respectively, and \(D\) a \(p \times p\) *diagonal* matrix with the values
    of the diagonal decreasing:'
  prefs: []
  type: TYPE_NORMAL
- en: \[d_{1,1} \geq d_{2,2} \geq \dots d_{p,p}.\]
  prefs: []
  type: TYPE_NORMAL
- en: 'In this exercise, we will see one of the ways that this decomposition can be
    useful. To do this, we will construct a dataset that represents grade scores for
    100 students in 24 different subjects. The overall average has been removed so
    this data represents the percentage point each student received above or below
    the average test score. So a 0 represents an average grade (C), a 25 is a high
    grade (A+), and a -25 represents a low grade (F). You can simulate the data like
    this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE145]'
  prefs: []
  type: TYPE_PRE
- en: Our goal is to describe the student performances as succinctly as possible.
    For example, we want to know if these test results are all just random independent
    numbers. Are all students just about as good? Does being good in one subject imply
    you will be good in another? How does the SVD help with all this? We will go step
    by step to show that with just three relatively small pairs of vectors we can
    explain much of the variability in this \(100 \times 24\) dataset.
  prefs: []
  type: TYPE_NORMAL
- en: 'You can visualize the 24 test scores for the 100 students by plotting an image:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE146]'
  prefs: []
  type: TYPE_PRE
- en: 1\. How would you describe the data based on this figure?
  prefs: []
  type: TYPE_NORMAL
- en: The test scores are all independent of each other.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: The students that test well are at the top of the image and there seem to be
    three groupings by subject.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: The students that are good at math are not good at science.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: The students that are good at math are not good at humanities.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '2\. You can examine the correlation between the test scores directly like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE147]'
  prefs: []
  type: TYPE_PRE
- en: Which of the following best describes what you see?
  prefs: []
  type: TYPE_NORMAL
- en: The test scores are independent.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Math and science are highly correlated but the humanities are not.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: There is high correlation between tests in the same subject but no correlation
    across subjects.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: There is a correlation among all tests, but higher if the tests are in science
    and math and even higher within each subject.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 3\. Remember that orthogonality means that \(U^{\top}U\) and \(V^{\top}V\) are
    equal to the identity matrix. This implies that we can also rewrite the decomposition
    as
  prefs: []
  type: TYPE_NORMAL
- en: \[ Y V = U D \mbox{ or } U^{\top}Y = D V^{\top}\]
  prefs: []
  type: TYPE_NORMAL
- en: We can think of \(YV\) and \(U^{\top}V\) as two transformations of Y that preserve
    the total variability of \(Y\) since \(U\) and \(V\) are orthogonal.
  prefs: []
  type: TYPE_NORMAL
- en: Use the function `svd` to compute the SVD of `y`. This function will return
    \(U\), \(V\) and the diagonal entries of \(D\).
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE148]'
  prefs: []
  type: TYPE_PRE
- en: 'You can check that the SVD works by typing:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE149]'
  prefs: []
  type: TYPE_PRE
- en: Compute the sum of squares of the columns of \(Y\) and store them in `ss_y`.
    Then compute the sum of squares of columns of the transformed \(YV\) and store
    them in `ss_yv`. Confirm that `sum(ss_y)` is equal to `sum(ss_yv)`.
  prefs: []
  type: TYPE_NORMAL
- en: 4\. We see that the total sum of squares is preserved. This is because \(V\)
    is orthogonal. Now to start understanding how \(YV\) is useful, plot `ss_y` against
    the column number and then do the same for `ss_yv`. What do you observe?
  prefs: []
  type: TYPE_NORMAL
- en: 5\. We see that the variability of the columns of \(YV\) is decreasing. Furthermore,
    we see that, relative to the first three, the variability of the columns beyond
    the third is almost 0\. Now notice that we didn’t have to compute `ss_yv` because
    we already have the answer. How? Remember that \(YV = UD\) and because \(U\) is
    orthogonal, we know that the sum of squares of the columns of \(UD\) are the diagonal
    entries of \(D\) squared. Confirm this by plotting the square root of `ss_yv`
    versus the diagonal entries of \(D\).
  prefs: []
  type: TYPE_NORMAL
- en: 6\. From the above we know that the sum of squares of the columns of \(Y\) (the
    total sum of squares) add up to the sum of `s$d^2` and that the transformation
    \(YV\) gives us columns with sums of squares equal to `s$d^2`. Now compute what
    percent of the total variability is explained by just the first three columns
    of \(YV\).
  prefs: []
  type: TYPE_NORMAL
- en: 7\. We see that almost 99% of the variability is explained by the first three
    columns of \(YV = UD\). So we get the sense that we should be able to explain
    much of the variability and structure we found while exploring the data with a
    few columns. Before we continue, let’s show a useful computational trick to avoid
    creating the matrix `diag(s$d)`. To motivate this, we note that if we write \(U\)
    out in its columns \([U_1, U_2, \dots, U_p]\) then \(UD\) is equal to
  prefs: []
  type: TYPE_NORMAL
- en: \[UD = [U_1 d_{1,1}, U_2 d_{2,2}, \dots, U_p d_{p,p}]\]
  prefs: []
  type: TYPE_NORMAL
- en: Use the `sweep` function to compute \(UD\) without constructing `diag(s$d)`
    nor matrix multiplication.
  prefs: []
  type: TYPE_NORMAL
- en: '8\. We know that \(U_1 d_{1,1}\), the first column of \(UD\), has the most
    variability of all the columns of \(UD\). Earlier we saw an image of \(Y\):'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE150]'
  prefs: []
  type: TYPE_PRE
- en: in which we can see that the student to student variability is quite large and
    that it appears that students that are good in one subject are good in all. This
    implies that the average (across all subjects) for each student should explain
    a lot of the variability. Compute the average score for each student and plot
    it against \(U_1 d_{1,1}\) and describe what you find.
  prefs: []
  type: TYPE_NORMAL
- en: '9\. We note that the signs in SVD are arbitrary because:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ U D V^{\top} = (-U) D (-V)^{\top} \]
  prefs: []
  type: TYPE_NORMAL
- en: With this in mind we see that the first column of \(UD\) is almost identical
    to the average score for each student except for the sign.
  prefs: []
  type: TYPE_NORMAL
- en: This implies that multiplying \(Y\) by the first column of \(V\) must be performing
    a similar operation to taking the average. Make an image plot of \(V\) and describe
    the first column relative to others and how this relates to taking an average.
  prefs: []
  type: TYPE_NORMAL
- en: 10\. We already saw that we can rewrite \(UD\) as
  prefs: []
  type: TYPE_NORMAL
- en: \[U_1 d_{1,1} + U_2 d_{2,2} + \dots + U_p d_{p,p}\]
  prefs: []
  type: TYPE_NORMAL
- en: 'with \(U_j\) the j-th column of \(U\). This implies that we can rewrite the
    entire SVD as:'
  prefs: []
  type: TYPE_NORMAL
- en: \[Y = U_1 d_{1,1} V_1 ^{\top} + U_2 d_{2,2} V_2 ^{\top} + \dots + U_p d_{p,p}
    V_p ^{\top}\]
  prefs: []
  type: TYPE_NORMAL
- en: 'with \(V_j\) the jth column of \(V\). Plot \(U_1\), then plot \(V_1^{\top}\)
    using the same range for the y-axis limits, then make an image of \(U_1 d_{1,1}
    V_1 ^{\top}\) and compare it to the image of \(Y\). Hint: use the `my_image` function
    defined above and use the `drop=FALSE` argument to assure the subsets of matrices
    are matrices.'
  prefs: []
  type: TYPE_NORMAL
- en: '11\. We see that with just a vector of length 100, a scalar, and a vector of
    length 24, we actually come close to reconstructing the original \(100 \times
    24\) matrix. This is our first matrix factorization:'
  prefs: []
  type: TYPE_NORMAL
- en: '\[ Y \approx d_{1,1} U_1 V_1^{\top}\] We know it explains `s$d[1]^2/sum(s$d^2)
    * 100` percent of the total variability. Our approximation only explains the observation
    that good students tend to be good in all subjects. But another aspect of the
    original data that our approximation does not explain was the higher similarity
    we observed within subjects. We can see this by computing the difference between
    our approximation and original data and then computing the correlations. You can
    see this by running this code:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE151]'
  prefs: []
  type: TYPE_PRE
- en: 'Now that we have removed the overall student effect, the correlation plot reveals
    that we have not yet explained the within subject correlation nor the fact that
    math and science are closer to each other than to the arts. So let’s explore the
    second column of the SVD. Repeat the previous exercise but for the second column:
    Plot \(U_2\), then plot \(V_2^{\top}\) using the same range for the y-axis limits,
    then make an image of \(U_2 d_{2,2} V_2 ^{\top}\) and compare it to the image
    of `resid`.'
  prefs: []
  type: TYPE_NORMAL
- en: '12\. The second column clearly relates to a student’s difference in ability
    in math/science versus the arts. We can see this most clearly from the plot of
    `s$v[,2]`. Adding the matrix we obtain with these two columns will help with our
    approximation:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ Y \approx d_{1,1} U_1 V_1^{\top} + d_{2,2} U_2 V_2^{\top} \]
  prefs: []
  type: TYPE_NORMAL
- en: We know it will explain
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE152]'
  prefs: []
  type: TYPE_PRE
- en: 'percent of the total variability. We can compute new residuals like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE153]'
  prefs: []
  type: TYPE_PRE
- en: and see that the structure that is left is driven by the differences between
    math and science. Confirm this by plotting \(U_3\), then plot \(V_3^{\top}\) using
    the same range for the y-axis limits, then make an image of \(U_3 d_{3,3} V_3
    ^{\top}\) and compare it to the image of `resid`.
  prefs: []
  type: TYPE_NORMAL
- en: '13\. The third column clearly relates to a student’s difference in ability
    in math and science. We can see this most clearly from the plot of `s$v[,3]`.
    Adding the matrix we obtain with these two columns will help with our approximation:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ Y \approx d_{1,1} U_1 V_1^{\top} + d_{2,2} U_2 V_2^{\top} + d_{3,3} U_3 V_3^{\top}\]
  prefs: []
  type: TYPE_NORMAL
- en: 'We know it will explain:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE154]'
  prefs: []
  type: TYPE_PRE
- en: 'percent of the total variability. We can compute new residuals like this:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE155]'
  prefs: []
  type: TYPE_PRE
- en: 'We no longer see structure in the residuals: they seem to be independent of
    each other. This implies that we can describe the data with the following model:'
  prefs: []
  type: TYPE_NORMAL
- en: \[ Y = d_{1,1} U_1 V_1^{\top} + d_{2,2} U_2 V_2^{\top} + d_{3,3} U_3 V_3^{\top}
    + \varepsilon\]
  prefs: []
  type: TYPE_NORMAL
- en: 'with \(\varepsilon\) a matrix of independent identically distributed errors.
    This model is useful because we summarize of \(100 \times 24\) observations with
    \(3 \times (100+24+1) = 375\) numbers. Furthermore, the three components of the
    model have useful interpretations: 1) the overall ability of a student, 2) the
    difference in ability between the math/sciences and arts, and 3) the remaining
    differences between the three subjects. The sizes \(d_{1,1}, d_{2,2}\) and \(d_{3,3}\)
    tell us the variability explained by each component. Finally, note that the components
    \(d_{j,j} U_j V_j^{\top}\) are equivalent to the jth principal component.'
  prefs: []
  type: TYPE_NORMAL
- en: Finish the exercise by plotting an image of \(Y\), an image of \(d_{1,1} U_1
    V_1^{\top} + d_{2,2} U_2 V_2^{\top} + d_{3,3} U_3 V_3^{\top}\) and an image of
    the residuals, all with the same `zlim`.
  prefs: []
  type: TYPE_NORMAL
- en: 14\. Advanced. The `movielens` dataset included in the **dslabs** package is
    a small subset of a larger dataset with millions of ratings. You can find the
    entire latest dataset here [https://grouplens.org/datasets/movielens/20m/](https://grouplens.org/datasets/movielens/20m/).
    Create your own recommendation system using all the tools we have shown you.
  prefs: []
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
