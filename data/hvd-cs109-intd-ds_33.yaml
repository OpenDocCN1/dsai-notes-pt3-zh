- en: Chapter 22 Joining tables
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 第22章 表格连接
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook/joining-tables.html](https://rafalab.dfci.harvard.edu/dsbook/joining-tables.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook/joining-tables.html](https://rafalab.dfci.harvard.edu/dsbook/joining-tables.html)
- en: The information we need for a given analysis may not be just in one table. For
    example, when forecasting elections we used the function `left_join` to combine
    the information from two tables. Here we use a simpler example to illustrate the
    general challenge of combining tables.
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 对于一个特定的分析，所需的信息可能不仅仅在一个表格中。例如，在预测选举时，我们使用了`left_join`函数来合并两个表格的信息。在这里，我们用一个更简单的例子来说明合并表格的一般挑战。
- en: 'Suppose we want to explore the relationship between population size for US
    states and electoral votes. We have the population size in this table:'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们想探究美国各州人口规模与选举人票数之间的关系。我们在这个表格中找到了人口规模：
- en: '[PRE0]'
  id: totrans-4
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: 'and electoral votes in this one:'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 以及这个表格中的选举人票数：
- en: '[PRE1]'
  id: totrans-6
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: Just concatenating these two tables together will not work since the order of
    the states is not the same.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 直接将这两个表格连接起来是不行的，因为州的顺序不同。
- en: '[PRE2]'
  id: totrans-8
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: The *join* functions, described below, are designed to handle this challenge.
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 下面描述的*连接*函数旨在处理这个挑战。
- en: 22.1 Joins
  id: totrans-10
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 22.1 连接
- en: 'The *join* functions in the **dplyr** package make sure that the tables are
    combined so that matching rows are together. If you know SQL, you will see that
    the approach and syntax is very similar. The general idea is that one needs to
    identify one or more columns that will serve to match the two tables. Then a new
    table with the combined information is returned. Notice what happens if we join
    the two tables above by state using `left_join` (we will remove the `others` column
    and rename `electoral_votes` so that the tables fit on the page):'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: '**dplyr**包中的*连接*函数确保表格被合并，使得匹配的行在一起。如果你知道SQL，你会看到方法和语法非常相似。一般思路是，需要确定一个或多个列，这些列将用于匹配两个表格。然后返回一个新的包含合并信息的表格。注意，如果我们使用`left_join`通过州连接上述两个表格会发生什么（我们将移除`others`列并将`electoral_votes`重命名，以便表格适合页面）：'
- en: '[PRE3]'
  id: totrans-12
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: 'The data has been successfully joined and we can now, for example, make a plot
    to explore the relationship:'
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 数据已成功连接，现在我们可以，例如，绘制一个图来探索这种关系：
- en: '[PRE4]'
  id: totrans-14
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: '![](../Images/32ca03fdc5377353a6fc267281c8a3bb.png)'
  id: totrans-15
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/32ca03fdc5377353a6fc267281c8a3bb.png)'
- en: We see the relationship is close to linear with about 2 electoral votes for
    every million persons, but with very small states getting higher ratios.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 我们看到关系接近线性，大约每百万人口有2张选举人票，但小州的比率更高。
- en: 'In practice, it is not always the case that each row in one table has a matching
    row in the other. For this reason, we have several versions of join. To illustrate
    this challenge, we will take subsets of the tables above. We create the tables
    `tab1` and `tab2` so that they have some states in common but not all:'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 在实践中，一个表格中的每一行并不总是与另一个表格中的行匹配。因此，我们有几种连接版本。为了说明这个挑战，我们将从上面的表格中取子集。我们创建了`tab1`和`tab2`这两个表格，它们有一些共同的状态，但不是全部：
- en: '[PRE5]'
  id: totrans-18
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: We will use these two tables as examples in the next sections.
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将在下一节中使用这两个表格作为例子。
- en: 22.1.1 Left join
  id: totrans-20
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 22.1.1 左连接
- en: Suppose we want a table like `tab_1`, but adding electoral votes to whatever
    states we have available. For this, we use `left_join` with `tab_1` as the first
    argument. We specify which column to use to match with the `by` argument.
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们想要一个像`tab_1`这样的表格，但为所有可用的州添加选举人票数。为此，我们使用`left_join`，并将`tab_1`作为第一个参数。我们通过`by`参数指定要匹配的列。
- en: '[PRE6]'
  id: totrans-22
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: 'Note that `NA`s are added to the two states not appearing in `tab_2`. Also,
    notice that this function, as well as all the other joins, can receive the first
    arguments through the pipe:'
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，`NA`s被添加到`tab_2`中未出现的两个州。此外，请注意，这个函数以及所有其他连接函数都可以通过管道接收第一个参数：
- en: '[PRE7]'
  id: totrans-24
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: 22.1.2 Right join
  id: totrans-25
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 22.1.2 右连接
- en: 'If instead of a table with the same rows as first table, we want one with the
    same rows as second table, we can use `right_join`:'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们想要一个与第二个表格具有相同行的表格，而不是与第一个表格具有相同行的表格，我们可以使用`right_join`：
- en: '[PRE8]'
  id: totrans-27
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: Now the NAs are in the column coming from `tab_1`.
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 现在，缺失值（NAs）出现在来自`tab_1`的列中。
- en: 22.1.3 Inner join
  id: totrans-29
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 22.1.3 内连接
- en: 'If we want to keep only the rows that have information in both tables, we use
    `inner_join`. You can think of this as an intersection:'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们只想保留两个表格中都有信息的行，我们使用`inner_join`。你可以将其视为一个交集：
- en: '[PRE9]'
  id: totrans-31
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: 22.1.4 Full join
  id: totrans-32
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 22.1.4 全连接
- en: 'If we want to keep all the rows and fill the missing parts with NAs, we can
    use `full_join`. You can think of this as a union:'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们想要保留所有行并用NAs填充缺失的部分，我们可以使用`full_join`。你可以将其视为一个并集：
- en: '[PRE10]'
  id: totrans-34
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: 22.1.5 Semi join
  id: totrans-35
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 22.1.5 半连接
- en: 'The `semi_join` function lets us keep the part of first table for which we
    have information in the second. It does not add the columns of the second:'
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: '`semi_join` 函数允许我们保留第一表中在第二表中具有信息的部分。它不会添加第二表的列：'
- en: '[PRE11]'
  id: totrans-37
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: 22.1.6 Anti join
  id: totrans-38
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 22.1.6 反连接
- en: 'The function `anti_join` is the opposite of `semi_join`. It keeps the elements
    of the first table for which there is no information in the second:'
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: 函数 `anti_join` 是 `semi_join` 的反函数。它保留第一表中第二表中没有信息的元素：
- en: '[PRE12]'
  id: totrans-40
  prefs: []
  type: TYPE_PRE
  zh: '[PRE12]'
- en: 'The following diagram summarizes the above joins:'
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: 以下图表总结了上述连接：
- en: '![](../Images/fde9a09426419086c0d16eb27d33e64a.png) (Image courtesy of RStudio[^(74)](#fn74).
    CC-BY-4.0 license[^(75)](#fn75). Cropped from original.)'
  id: totrans-42
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/fde9a09426419086c0d16eb27d33e64a.png)（图片由 RStudio 提供[^(74)](#fn74)。CC-BY-4.0
    许可[^(75)](#fn75)。从原始图片裁剪而来。）'
- en: 22.2 Binding
  id: totrans-43
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 22.2 绑定
- en: Although we have yet to use it in this book, another common way in which datasets
    are combined is by *binding* them. Unlike the join function, the binding functions
    do not try to match by a variable, but instead simply combine datasets. If the
    datasets don’t match by the appropriate dimensions, one obtains an error.
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 尽管我们在这本书中还没有使用它，但合并数据集的另一种常见方式是通过 *绑定*。与连接函数不同，绑定函数不是通过变量进行匹配，而是简单地合并数据集。如果数据集在适当的维度上不匹配，则会得到一个错误。
- en: 22.2.1 Binding columns
  id: totrans-45
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 22.2.1 按列绑定
- en: The **dplyr** function *bind_cols* binds two objects by making them columns
    in a tibble. For example, we quickly want to make a data frame consisting of numbers
    we can use.
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: '**dplyr** 函数 *bind_cols* 通过将它们作为 tibble 中的列来绑定两个对象。例如，我们很快就想创建一个由我们可以使用的数字组成的数据框。'
- en: '[PRE13]'
  id: totrans-47
  prefs: []
  type: TYPE_PRE
  zh: '[PRE13]'
- en: This function requires that we assign names to the columns. Here we chose `a`
    and `b`.
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: 此函数要求我们为列分配名称。这里我们选择了 `a` 和 `b`。
- en: Note that there is an R-base function `cbind` with the exact same functionality.
    An important difference is that `cbind` can create different types of objects,
    while `bind_cols` always produces a data frame.
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，有一个具有完全相同功能性的 R-base 函数 `cbind`。一个重要的区别是 `cbind` 可以创建不同类型的对象，而 `bind_cols`
    总是产生数据框。
- en: '`bind_cols` can also bind two different data frames. For example, here we break
    up the `tab` data frame and then bind them back together:'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: '`bind_cols` 也可以绑定两个不同的数据框。例如，这里我们拆分 `tab` 数据框，然后将其重新绑定在一起：'
- en: '[PRE14]'
  id: totrans-51
  prefs: []
  type: TYPE_PRE
  zh: '[PRE14]'
- en: 22.2.2 Binding by rows
  id: totrans-52
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 22.2.2 按行绑定
- en: 'The `bind_rows` function is similar to `bind_cols`, but binds rows instead
    of columns:'
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: '`bind_rows` 函数与 `bind_cols` 类似，但绑定的是行而不是列：'
- en: '[PRE15]'
  id: totrans-54
  prefs: []
  type: TYPE_PRE
  zh: '[PRE15]'
- en: This is based on an R-base function `rbind`.
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: 这基于 R-base 函数 `rbind`。
- en: 22.3 Set operators
  id: totrans-56
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 22.3 集合运算符
- en: Another set of commands useful for combining datasets are the set operators.
    When applied to vectors, these behave as their names suggest. Examples are `intersect`,
    `union`, `setdiff`, and `setequal`. However, if the **tidyverse**, or more specifically
    **dplyr**, is loaded, these functions can be used on data frames as opposed to
    just on vectors.
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: 另一组用于合并数据集的命令是集合运算符。当应用于向量时，它们的行为如它们的名称所暗示。例如，有 `intersect`、`union`、`setdiff`
    和 `setequal`。然而，如果加载了 **tidyverse**，或者更具体地说 **dplyr**，则这些函数可以用于数据框，而不仅仅是向量。
- en: 22.3.1 Intersect
  id: totrans-58
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 22.3.1 交集
- en: 'You can take intersections of vectors of any type, such as numeric:'
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: 您可以对任何类型的向量取交集，例如数值型：
- en: '[PRE16]'
  id: totrans-60
  prefs: []
  type: TYPE_PRE
  zh: '[PRE16]'
- en: 'or characters:'
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: 或者字符：
- en: '[PRE17]'
  id: totrans-62
  prefs: []
  type: TYPE_PRE
  zh: '[PRE17]'
- en: 'The **dplyr** package includes an `intersect` function that can be applied
    to tables with the same column names. This function returns the rows in common
    between two tables. To make sure we use the **dplyr** version of `intersect` rather
    than the base package version, we can use `dplyr::intersect` like this:'
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: '**dplyr** 包含一个 `intersect` 函数，可以应用于具有相同列名的表。此函数返回两个表之间的公共行。为了确保我们使用 **dplyr**
    版本的 `intersect` 而不是基础包版本，我们可以使用 `dplyr::intersect` 如此：'
- en: '[PRE18]'
  id: totrans-64
  prefs: []
  type: TYPE_PRE
  zh: '[PRE18]'
- en: 22.3.2 Union
  id: totrans-65
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 22.3.2 并集
- en: 'Similarly *union* takes the union of vectors. For example:'
  id: totrans-66
  prefs: []
  type: TYPE_NORMAL
  zh: 类似地，*并集* 取向量的并集。例如：
- en: '[PRE19]'
  id: totrans-67
  prefs: []
  type: TYPE_PRE
  zh: '[PRE19]'
- en: The **dplyr** package includes a version of `union` that combines all the rows
    of two tables with the same column names.
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
  zh: '**dplyr** 包含一个 `union` 版本，可以将两个具有相同列名的表的行合并在一起。'
- en: '[PRE20]'
  id: totrans-69
  prefs: []
  type: TYPE_PRE
  zh: '[PRE20]'
- en: 22.3.3 `setdiff`
  id: totrans-70
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 22.3.3 `setdiff`
- en: 'The set difference between a first and second argument can be obtained with
    `setdiff`. Unlike `intersect` and `union`, this function is not symmetric:'
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: 使用 `setdiff` 可以获得第一个和第二个参数之间的集合差。与 `intersect` 和 `union` 不同，此函数不是对称的：
- en: '[PRE21]'
  id: totrans-72
  prefs: []
  type: TYPE_PRE
  zh: '[PRE21]'
- en: 'As with the functions shown above, **dplyr** has a version for data frames:'
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: 与上面显示的函数一样，**dplyr** 为数据框提供了一个版本：
- en: '[PRE22]'
  id: totrans-74
  prefs: []
  type: TYPE_PRE
  zh: '[PRE22]'
- en: 22.3.4 `setequal`
  id: totrans-75
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 22.3.4 `setequal`
- en: 'Finally, the function `setequal` tells us if two sets are the same, regardless
    of order. So notice that:'
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: 最后，函数 `setequal` 告诉我们两个集合是否相同，无论顺序如何。所以请注意：
- en: '[PRE23]'
  id: totrans-77
  prefs: []
  type: TYPE_PRE
  zh: '[PRE23]'
- en: 'but:'
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: 但：
- en: '[PRE24]'
  id: totrans-79
  prefs: []
  type: TYPE_PRE
  zh: '[PRE24]'
- en: 'When applied to data frames that are not equal, regardless of order, the **dplyr**
    version provides a useful message letting us know how the sets are different:'
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
  zh: 当应用于不等的DataFrame时（无论顺序如何），**dplyr**版本提供了一个有用的消息，让我们知道集合之间的差异：
- en: '[PRE25]'
  id: totrans-81
  prefs: []
  type: TYPE_PRE
  zh: '[PRE25]'
- en: 22.4 Exercises
  id: totrans-82
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 22.4 练习
- en: 1\. Install and load the **Lahman** library. This database includes data related
    to baseball teams. It includes summary statistics about how the players performed
    on offense and defense for several years. It also includes personal information
    about the players.
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
  zh: 1. 安装并加载**Lahman**库。这个数据库包括与棒球队相关的数据。它包括关于球员在进攻和防守方面多年表现的总结统计信息。还包括球员的个人资料。
- en: 'The `Batting` data frame contains the offensive statistics for all players
    for many years. You can see, for example, the top 10 hitters by running this code:'
  id: totrans-84
  prefs: []
  type: TYPE_NORMAL
  zh: '`Batting`数据框包含所有球员多年来的进攻统计数据。例如，你可以通过运行以下代码看到前10名打击者：'
- en: '[PRE26]'
  id: totrans-85
  prefs: []
  type: TYPE_PRE
  zh: '[PRE26]'
- en: But who are these players? We see an ID, but not the names. The player names
    are in this table
  id: totrans-86
  prefs: []
  type: TYPE_NORMAL
  zh: 但这些球员是谁呢？我们看到的是一个ID，而不是名字。球员的名字在这个表格中
- en: '[PRE27]'
  id: totrans-87
  prefs: []
  type: TYPE_PRE
  zh: '[PRE27]'
- en: We can see column names `nameFirst` and `nameLast`. Use the `left_join` function
    to create a table of the top home run hitters. The table should have `playerID`,
    first name, last name, and number of home runs (HR). Rewrite the object `top`
    with this new table.
  id: totrans-88
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以看到列名`nameFirst`和`nameLast`。使用`left_join`函数创建一个关于最高全垒打打击者的表格。该表格应包含`playerID`、名字、姓氏和全垒打次数（HR）。用这个新表格重写对象`top`。
- en: 2\. Now use the `Salaries` data frame to add each player’s salary to the table
    you created in exercise 1\. Note that salaries are different every year so make
    sure to filter for the year 2016, then use `right_join`. This time show first
    name, last name, team, HR, and salary.
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
  zh: 2. 现在使用`Salaries`数据框将每个球员的薪水添加到你在练习1中创建的表格中。注意，薪水每年都不同，所以请确保筛选出2016年的数据，然后使用`right_join`。这次显示名字、姓氏、球队、HR和薪水。
- en: '3\. In a previous exercise, we created a tidy version of the `co2` dataset:'
  id: totrans-90
  prefs: []
  type: TYPE_NORMAL
  zh: 3. 在之前的练习中，我们创建了`co2`数据集的整洁版本：
- en: '[PRE28]'
  id: totrans-91
  prefs: []
  type: TYPE_PRE
  zh: '[PRE28]'
- en: We want to see if the monthly trend is changing so we are going to remove the
    year effects and then plot the results. We will first compute the year averages.
    Use the `group_by` and `summarize` to compute the average co2 for each year. Save
    in an object called `yearly_avg`.
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: 我们想看看月度趋势是否在变化，所以我们将移除年度影响，然后绘制结果。我们首先计算年度平均值。使用`group_by`和`summarize`计算每年的平均二氧化碳排放量。保存到一个名为`yearly_avg`的对象中。
- en: '4\. Now use the `left_join` function to add the yearly average to the `co2_wide`
    dataset. Then compute the residuals: observed co2 measure - yearly average.'
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: 4. 现在使用`left_join`函数将年度平均值添加到`co2_wide`数据集中。然后计算残差：观测到的二氧化碳测量值减去年度平均值。
- en: 5\. Make a plot of the seasonal trends by year but only after removing the year
    effect.
  id: totrans-94
  prefs: []
  type: TYPE_NORMAL
  zh: 5. 在移除年度影响后，按年份绘制季节性趋势图。
