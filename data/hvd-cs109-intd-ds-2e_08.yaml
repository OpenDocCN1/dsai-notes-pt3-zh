  prefs: []
  type: TYPE_NORMAL
  zh: 7. 假设你想要住在东北部或西部**并且**谋杀率要低于1。我们想要查看满足这些选项的州的资料。注意，你可以使用逻辑运算符与`filter`一起使用。以下是一个示例，其中我们过滤以仅保留东北地区的较小州。
- en: '[PRE36]'
  id: totrans-100
  prefs: []
  type: TYPE_PRE
  zh: '[PRE36]'
- en: '*Make sure `murders` has been defined with `rate` and `rank` and still has
    all states. Create a table called `my_states` that contains rows for states satisfying
    both the conditions: they are in the Northeast or West and the murder rate is
    less than 1\. Show only the state name, the rate, and the rank.'
  id: totrans-101
  prefs: []
  type: TYPE_NORMAL
  zh: '*确保`murders`已经被定义为带有`rate`和`rank`，并且仍然包含所有州。创建一个名为`my_states`的表格，包含满足以下两个条件的行的州：它们位于东北部或西部，谋杀率低于1。只显示州名、率和排名。'
- en: For exercises 8-12, we will be using the **NHANES** data.
  id: totrans-102
  prefs: []
  type: TYPE_NORMAL
  zh: 对于第8-12题，我们将使用**NHANES**数据。
- en: '[PRE37]'
  id: totrans-103
  prefs: []
  type: TYPE_PRE
  zh: '[PRE37]'
- en: '*8\. We will provide some basic facts about blood pressure. First let’s select
    a group to set the standard. We will use 20-to-29-year-old females. `AgeDecade`
    is a categorical variable with these ages. Note that the category is coded like
    `" 20-29"`, with a space in front! Use the **data.table** package to compute the
    average and standard deviation of systolic blood pressure as saved in the `BPSysAve`
    variable. Save it to a variable called `ref`.'
  id: totrans-104
  prefs: []
  type: TYPE_NORMAL
  zh: '*8. 我们将提供一些关于血压的基本事实。首先，让我们选择一个组来设定标准。我们将使用20至29岁的女性。`AgeDecade`是一个具有这些年龄的类别变量。请注意，类别编码为`"
    20-29"`，前面有一个空格！使用**data.table**包计算存储在`BPSysAve`变量中的收缩压的平均值和标准差。将其保存到名为`ref`的变量中。'
- en: 9\. Report the min and max values for the same group.
  id: totrans-105
  prefs: []
  type: TYPE_NORMAL
  zh: 9. 报告同一组的最大和最小值。
- en: 10\. Compute the average and standard deviation for females, but for each age
    group separately rather than a selected decade as in exercise 8\. Note that the
    age groups are defined by `AgeDecade`.
  id: totrans-106
  prefs: []
  type: TYPE_NORMAL
  zh: 10. 计算女性的平均值和标准差，但对于每个年龄组分别计算，而不是像第8题那样选择一个十年为一个组。注意，年龄组由`AgeDecade`定义。请注意，类别编码为`"
    20-29"`，前面有一个空格！使用**data.table**包计算存储在`BPSysAve`变量中的收缩压的平均值和标准差。将其保存到名为`ref`的变量中。
- en: 11\. Repeat exercise 10 for males.
  id: totrans-107
  prefs: []
  type: TYPE_NORMAL
  zh: 11. 为男性重复第10题的练习。
- en: 12\. For males between the ages of 40-49, compare systolic blood pressure across
    race as reported in the `Race1` variable. Order the resulting table from lowest
    to highest average systolic blood pressure.*************
  id: totrans-108
  prefs: []
  type: TYPE_NORMAL
  zh: 12. 对于40-49岁的男性，比较在`Race1`变量中报告的种族间收缩压。将结果表按最低到最高的平均收缩压排序。*************
