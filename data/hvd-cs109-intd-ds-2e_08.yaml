  zh: '[5  data.table](../R/data-table.html)'
- en: In this book, we use tidyverse packages, primarily because they offer readability
    that is beneficial for beginners. This readability allows us to emphasize data
    analysis and statistical concepts. However, while tidyverse is beginner-friendly,
    there are other methods in R that are more efficient and can handle larger datasets
    more effectively. One such package is **data.table**, which is widely used in
    the R community. We’ll briefly introduce **data.table** in this chapter. For those
    interested in diving deeper, there are numerous online resources, including the
    mentioned introduction[¹](#fn1).
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 在这本书中，我们使用 tidyverse 包，主要是因为它们提供了对初学者有益的易读性。这种易读性使我们能够强调数据分析与统计概念。然而，虽然 tidyverse
    对初学者友好，但 R 中还有其他更高效的方法，可以更有效地处理更大的数据集。其中一个这样的包是 **data.table**，它在 R 社区中得到了广泛的应用。我们将在本章简要介绍
    **data.table**。对于那些想要深入了解的人，有大量的在线资源，包括提到的介绍[¹](#fn1)。
