- en: Continuous Distribution
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 连续分布
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part2/continuous/](https://chrispiech.github.io/probabilityForComputerScientists/en/part2/continuous/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part2/continuous/](https://chrispiech.github.io/probabilityForComputerScientists/en/part2/continuous/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: So far, all random variables we have seen have been *discrete*. In all the cases
    we have seen in CS109 this meant that our RVs could only take on integer values.
    Now it's time for *continuous* random variables which can take on values in the
    real number domain ($\R$). Continuous random variables can be used to represent
    measurements with arbitrary precision (eg height, weight, time).
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 到目前为止，我们看到的所有随机变量都是**离散**的。在CS109中我们看到的所有情况下，这意味着我们的随机变量只能取整数值。现在是我们考虑**连续**随机变量的时候了，这些随机变量可以在实数域（$\R$）中取值。连续随机变量可以用来表示具有任意精度的测量（例如身高、体重、时间）。
- en: From Discrete to Continuous
  id: totrans-4
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 从离散到连续
- en: 'To make our transition from thinking about discrete random variables, to thinking
    about continuous random variables, lets start with a thought experiment: Imagine
    you are running to catch the bus. You know that you will arrive at 2:15pm but
    you don''t know exactly when the bus will arrive, and want to think of the arrival
    time in minutes past 2pm as a random variable $T$ so that you can calculate the
    probability that you will have to wait more than five minutes $P(15 < T < 20)$.'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 为了从考虑离散随机变量的思维过渡到考虑连续随机变量的思维，让我们从一个思想实验开始：想象你正在跑着去赶公交车。你知道你将在下午2:15到达，但你不知道公交车何时到达，并想将下午2点之后的分钟数视为一个随机变量
    $T$，这样你就可以计算你需要等待超过五分钟的概率 $P(15 < T < 20)$。
- en: 'We immediately face a problem. For discrete distributions we would describe
    the probability that a random variable takes on exact values. This doesn''t make
    sense for continuous values, like the time the bus arrives. As an example, what
    is the probability that the bus arrives at exactly 2:17pm and 12.12333911102389234
    seconds? Similarly, if I were to ask you: what is the probability of a child being
    born with weight *exactly* equal to 3.523112342234 kilos, you might recognize
    that question as ridiculous. No child will have precisely that weight. Real values
    can have infinite precision and as such it is a bit mind boggling to think about
    the probability that a random variable takes on a specific value.'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 我们立即面临一个问题。对于离散分布，我们会描述随机变量取特定值的概率。对于连续值，如公交车到达的时间，这没有意义。例如，如果我问你：公交车在下午2:17正好到达，以及12.12333911102389234秒的概率是多少？同样，如果我问你：一个孩子出生时体重恰好等于3.523112342234公斤的概率是多少，你可能会认为这个问题很荒谬。没有孩子的体重会精确到那个程度。实数可以有无限精度，因此考虑随机变量取特定值的概率有点令人困惑。
- en: Instead, let's start by discretizing time, our continuous variable, by breaking
    it into 5 minute chunks. We can now think about something like, the probability
    that the bus arrives between 2:00p and 2:05 as an event with some probability
    (see figure below on the left). Five minute chunks seem a bit coarse. You could
    imagine that instead, we could have discretized time into 2.5 minute chunks (figure
    in the center). In this case the probability that the bus shows up between 15
    mins and 20 mins after 2pm is the sum of two chunks, shown in orange. Why stop
    there? In the limit we could keep breaking time down into smaller and smaller
    pieces. Eventually we will be left with a derivative of probability at each moment
    of time, where the probability that $P(15 < T < 20)$ is the integral of that derivative
    between 15 and 20 (figure on the right).
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 相反，让我们先通过将时间，我们的连续变量，分成5分钟的时间段来进行离散化。现在我们可以考虑类似的事情，比如，公交车在下午2:00到2:05之间到达的概率作为一个具有某种概率的事件（见下图中左边的图）。五分钟的时间段似乎有点粗糙。你可以想象，相反，我们可以将时间离散化成2.5分钟的时间段（中间的图）。在这种情况下，公交车在下午2点后15分钟到20分钟之间出现的概率是两个时间段的和，用橙色表示。为什么停止在这里呢？在极限情况下，我们可以不断地将时间分解成越来越小的片段。最终，我们将在每个时间点留下概率的导数，其中
    $P(15 < T < 20)$ 的概率是那个导数在15到20之间的积分（右边的图）。
- en: '![](../Images/16f2820b59716b8348cf3989bf56681a.png)'
  id: totrans-8
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/16f2820b59716b8348cf3989bf56681a.png)'
- en: Probability Density Functions
  id: totrans-9
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 概率密度函数
- en: 'In the world of discrete random variables, the most important property of a
    random variable was its probability mass function (PMF) that would tell you the
    probability of the random variable taking on any value. When we move to the world
    of continuous random variables, we are going to need to rethink this basic concept.
    In the continuous world, every random variable instead has a Probability *Density*
    Function (PDF) which defines the relative likelihood that a random variable takes
    on a particular value. We traditionally use the symbol $f$ for the probability
    density function and write it in one of two ways: $$ f(X=x) \quad \or \quad f(x)
    $$ Where the notation on the right hand side is shorthand and the lowercase $x$
    implies that we are talking about the relative likelihood of a continuous random
    variable which is the upper case $X$. Like in the bus example, the PDF is the
    derivative of probability at all points of the random variable. This means that
    the PDF has the important property that you can integrate over it to find the
    probability that the random variable takes on values within a range $(a, b)$.'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 在离散随机变量的世界中，一个随机变量最重要的性质是其概率质量函数（PMF），它会告诉你随机变量取任何值的概率。当我们进入连续随机变量的世界时，我们需要重新思考这个基本概念。在连续世界中，每个随机变量都有一个概率密度函数（PDF），它定义了随机变量取特定值的相对可能性。我们传统上用符号$f$表示概率密度函数，并以两种方式之一来表示它：$$
    f(X=x) \quad \or \quad f(x) $$ 其中右侧的符号是简写，小写$x$表示我们正在讨论连续随机变量的相对可能性，而大写$X$表示随机变量。就像在公交车例子中，PDF是概率在随机变量所有点的导数。这意味着PDF有一个重要的特性，即你可以对其积分以找到随机变量在范围$(a,
    b)$内取值的概率。
- en: '***Definition***: Continuous Random Variable'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义***：连续随机变量'
- en: '$X$ is a Continuous Random Variable if there is a Probability Density Function
    (PDF) $f(x)$ that takes in real valued numbers $x$ such that: $$ \begin{align*}
    &\P(a \leq X \leq b) = \int_a^b f(x) \d x \end{align*} $$ The following properties
    must also hold. These preserve the axiom that $P(a \leq X \leq b)$ is a probability:
    $$ \begin{align*} &0 \leq \P(a \leq X \leq b) \leq 1 \\ &\P(-\infty < X < \infty)
    = 1 \end{align*} $$'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 如果存在一个概率密度函数（PDF）$f(x)$，它接受实数值$x$，那么$X$是一个连续随机变量：$$ \begin{align*} &\P(a \leq
    X \leq b) = \int_a^b f(x) \d x \end{align*} $$ 以下性质也必须成立。这些性质保持了公理，即$\P(a \leq
    X \leq b)$是一个概率：$$ \begin{align*} &0 \leq \P(a \leq X \leq b) \leq 1 \\ &\P(-\infty
    < X < \infty) = 1 \end{align*} $$
- en: A common misconception is to think of $f(x)$ as a probability. It is instead
    what we call a probability density. It represents probability/unit of $X$. Generally
    this is only meaningful when we either take an integral over the PDF **or** we
    compare probability densities. As we mentioned when motivating probability densities,
    the probability that a continuous random variable takes on a specific value (to
    infinite precision) is 0.
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 一个常见的误解是将$f(x)$视为一个概率。它实际上是所谓的概率密度。它表示概率/单位$X$。通常，这只有在我们对PDF进行积分或比较概率密度时才有意义。正如我们讨论概率密度时所提到的，一个连续随机变量取特定值（无限精度）的概率是0。
- en: $$ \P(X = a) = \int_a^a f(x) \d x = 0 $$
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: $$ \P(X = a) = \int_a^a f(x) \d x = 0 $$
- en: That is pretty different than in the discrete world where we often talked about
    the probability of a random variable taking on a particular value.
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 这与在离散世界中我们经常讨论的随机变量取特定值的概率大不相同。
- en: Cumulative Distribution Function
  id: totrans-16
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 累积分布函数
- en: Having a probability density is great, but it means we are going to have to
    solve an integral every single time we want to calculate a probability. To avoid
    this unfortunate fate, we are going to use a standard called a cumulative distribution
    function (CDF). The CDF is a function which takes in a number and returns the
    probability that a random variable takes on a value less than that number. It
    has the pleasant property that, if we have a CDF for a random variable, we don't
    need to integrate to answer probability questions!
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 拥有一个概率密度函数是很好的，但这意味着我们每次想要计算一个概率时都必须求解一个积分。为了避免这种不幸的命运，我们将使用一个称为累积分布函数（CDF）的标准。累积分布函数是一个函数，它接受一个数字并返回随机变量取值小于该数字的概率。它有一个令人愉快的特性，即如果我们有一个随机变量的累积分布函数，我们就不需要积分来回答概率问题！
- en: 'For a continuous random variable $X$ the Cumulative Distribution Function,
    written $F(x)$ is: $$ \begin{align*} &F(x) = P(X \leq x) = \int_{-\infty}^{x}
    f(x)\d x \end{align*} $$'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 对于连续随机变量$X$，累积分布函数，记作$F(x)$，为：$$ \begin{align*} &F(x) = P(X \leq x) = \int_{-\infty}^{x}
    f(x)\d x \end{align*} $$
- en: 'Why is the CDF the probability that a random variable takes on a value **less
    than** the input value as opposed to greater than? It is a matter of convention.
    But it is a useful convention. Most probability questions can be solved simply
    by knowing the CDF (and taking advantage of the fact that the integral over the
    range $-\infty$ to $\infty$ is 1\. Here are a few examples of how you can answer
    probability questions by just using a CDF: \begin{align*} &\text{Probability Query}
    && \text{Solution} && \text{Explanation} \\ &\P(X < a) && F(a) && \text{That is
    the definition of the CDF}\\ &\P(X \leq a) && F(a) && \text{Trick question. }\P(X
    = a) = 0\\ &\P(X > a) && 1 - F(a) && \P(X < a) + \P(X > a) = 1 \\ &\P(a < X <
    b) && F(b) - F(a) && F(a) + \P(a < X < b) = F(b)\\ \end{align*}'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 为什么CDF是随机变量取值小于输入值而不是大于的概率？这是一个惯例问题。但这是一个有用的惯例。大多数概率问题都可以通过了解CDF（并利用积分从$-\infty$到$\infty$的结果为1的事实）简单解决。以下是一些仅使用CDF回答概率问题的例子：\begin{align*}
    &\text{概率查询} && \text{解决方案} && \text{解释} \\ &\P(X < a) && F(a) && \text{这是CDF的定义}\\
    &\P(X \leq a) && F(a) && \text{技巧问题。 }\P(X = a) = 0\\ &\P(X > a) && 1 - F(a) &&
    \P(X < a) + \P(X > a) = 1 \\ &\P(a < X < b) && F(b) - F(a) && F(a) + \P(a < X
    < b) = F(b)\\ \end{align*}
- en: 'The continuous distribution also exists for discrete random variables, but
    there is less utility to a CDF in the discrete world as none of our discrete random
    variables had "closed form" (eg without any summation) functions for the CDF:
    \begin{align*} F_X(a) = \sum_{i = 1}^a P(X = i) \end{align*}'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 连续分布也适用于离散随机变量，但在离散世界中CDF的效用较小，因为我们的离散随机变量没有“封闭形式”的CDF函数（例如，没有任何求和）：\begin{align*}
    F_X(a) = \sum_{i = 1}^a P(X = i) \end{align*}
- en: Solving for Constants
  id: totrans-21
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 求解常数
- en: 'Let $X$ be a continuous random variable with PDF: \begin{align*} f(x) = \begin{cases}
    C(4x - 2x^2) &\text{when } 0 < x < 2 \\ 0 & \text{otherwise} \end{cases} \end{align*}
    In this function, $C$ is a constant. What value is $C$? Since we know that the
    PDF must sum to 1: \begin{align*} &\int_0^2 C(4x - 2x^2) \d x = 1 \\ &C\left(2x^2
    - \frac{2x^3}{3}\right)\bigg|_0^2 = 1 \\ &C\left(\left(8 - \frac{16}{3}\right)
    - 0 \right) = 1 \\ &C = 3/8 \end{align*} Now that we know $C$, what is $\P(X >
    1)$? \begin{align*} \P(X > 1) &=\int_1^{\infty}f(x) \d x \\ &= \int_1^2 \frac{3}{8}(4x
    - 2x^2) \d x \\ &= \frac{3}{8}\left(2x^2 - \frac{2x^3}{3}\right)\bigg|_1^2 \\
    &= \frac{3}{8}\left[\left(8 - \frac{16}{3}\right) - \left(2 - \frac{2}{3}\right)\right]
    = \frac{1}{2} \end{align*}'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 设$X$为一个具有PDF的连续随机变量：\begin{align*} f(x) = \begin{cases} C(4x - 2x^2) &\text{当
    } 0 < x < 2 \\ 0 & \text{否则} \end{cases} \end{align*} 在这个函数中，$C$是一个常数。$C$的值是多少？由于我们知道PDF必须加起来为1：\begin{align*}
    &\int_0^2 C(4x - 2x^2) \d x = 1 \\ &C\left(2x^2 - \frac{2x^3}{3}\right)\bigg|_0^2
    = 1 \\ &C\left(\left(8 - \frac{16}{3}\right) - 0 \right) = 1 \\ &C = \frac{3}{8}
    \end{align*} 现在我们知道了$C$，$\P(X > 1)$是多少？\begin{align*} \P(X > 1) &=\int_1^{\infty}f(x)
    \d x \\ &= \int_1^2 \frac{3}{8}(4x - 2x^2) \d x \\ &= \frac{3}{8}\left(2x^2 -
    \frac{2x^3}{3}\right)\bigg|_1^2 \\ &= \frac{3}{8}\left[\left(8 - \frac{16}{3}\right)
    - \left(2 - \frac{2}{3}\right)\right] = \frac{1}{2} \end{align*}
- en: Expectation and Variance of Continuous Variables
  id: totrans-23
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 连续变量的期望和方差
- en: 'For continuous RV $X$: \begin{align*} &E[X] = \int_{-\infty}^{\infty} x f(x)
    dx \\ &E[g(X)] = \int_{-\infty}^{\infty} g(x) f(x) dx \\ &E[X^n] = \int_{-\infty}^{\infty}
    x^n f(x) dx \end{align*}'
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: 对于连续随机变量$X$：\begin{align*} &E[X] = \int_{-\infty}^{\infty} x f(x) dx \\ &E[g(X)]
    = \int_{-\infty}^{\infty} g(x) f(x) dx \\ &E[X^n] = \int_{-\infty}^{\infty} x^n
    f(x) dx \end{align*}
- en: 'For both continuous and discrete RVs: \begin{align*} &E[aX + b] = aE[X] + b\\
    &\text{Var}(X) = E[(X - \mu)^2] = E[X^2] - (E[X])^2 \\ &\text{Var}(aX + b) = a^2
    \text{Var}(X) \end{align*}'
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: 对于连续和离散随机变量：\begin{align*} &E[aX + b] = aE[X] + b\\ &\text{Var}(X) = E[(X -
    \mu)^2] = E[X^2] - (E[X])^2 \\ &\text{Var}(aX + b) = a^2 \text{Var}(X) \end{align*}
