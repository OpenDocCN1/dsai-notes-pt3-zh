    4.0 International [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0).
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 本作品根据 Creative Commons Attribution-NonCommercial-ShareAlike 4.0 国际 [CC BY-NC-SA
    4.0](https://creativecommons.org/licenses/by-nc-sa/4.0) 许可协议授权。
- en: We make announcements related to the book on X. For updates follow [@rafalab](https://x.com/rafalab).
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 我们在 X 上发布与本书相关的公告。请关注 [@rafalab](https://x.com/rafalab) 以获取更新。
- en: Acknowledgments
  id: totrans-14
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 致谢
- en: A special thanks to Amy Gill, Jorge Cornick, Barry MacLean, and Robert Gentleman
    for dozens of comments, edits, and suggestions. Also, many thanks to Stephanie
    Hicks who twice served as a co-instructor in my data science classes and Yihui
    Xie who patiently put up with my many questions about bookdown. Thanks also to
    Héctor Corrada-Bravo, for advice on how to best teach machine learning. Thanks
    to Alyssa Frazee for helping create the homework problem that became the Recommendation
    Systems case study. Also, many thanks to Hadley Wickham, Mine Çetinkaya-Rundel,
    and Garrett Grolemund for making the Quarto code for their R for Data Science
    book open. Finally, thanks to Alex Nones for proofreading the manuscript during
    its various stages.
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 特别感谢艾米·吉尔（Amy Gill）、豪尔赫·康尼克（Jorge Cornick）、巴里·麦克莱恩（Barry MacLean）和罗伯特· gentleman（Robert
    Gentleman）对数十条评论、编辑和建议。还要感谢斯蒂芬妮·希克斯（Stephanie Hicks），她两次担任我的数据科学课程助教，以及耐心回答我关于
    bookdown 的许多问题的谢一辉（Yihui Xie）。还要感谢赫克托·科拉德-布拉沃（Héctor Corrada-Bravo），他提供了关于如何最好地教授机器学习的建议。感谢阿莉萨·弗拉齐（Alyssa
    Frazee）帮助创建成为推荐系统案例研究的家庭作业问题。还要感谢哈代·维克汉姆（Hadley Wickham）、米内·切廷卡亚-朗德尔（Mine Çetinkaya-Rundel）和加勒特·格罗勒蒙德（Garrett
    Grolemund）使他们的《R for Data Science》一书的 Quarto 代码开源。最后，感谢亚历克斯·诺恩斯（Alex Nones）在各个阶段校对稿件。
- en: This book was conceived during the teaching of several applied statistics courses,
    starting over fifteen years ago. The teaching assistants working with me throughout
    the years made important indirect contributions to this book. The latest iteration
    of this course is a HarvardX series coordinated by Heather Sternshein and Zofia
    Gajdos. We thank them for their contributions. We are also grateful to all the
    students whose questions and comments helped us improve the book. The courses
    were partially funded by NIH grant R25GM114818\. We are very grateful to the National
    Institutes of Health for its support.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 本书是在过去十五年中教授几门应用统计学课程的过程中构思的。多年来与我合作的助教对本书做出了重要的间接贡献。本课程的最新版本是由希瑟·斯滕申（Heather
    Sternshein）和佐菲亚·加约多斯（Zofia Gajdos）协调的哈佛X系列。我们感谢他们的贡献。我们还要感谢所有提出问题和评论的学生，他们的帮助使我们改进了本书。这些课程部分由
    NIH 奖学金 R25GM114818 资助。我们非常感谢美国国立卫生研究院的支持。
