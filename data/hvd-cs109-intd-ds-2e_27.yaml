  - PREF_H1
  type: TYPE_NORMAL
  zh: 序言
- en: This is the website for the **Statistics and Prediction Algorithms Through Case
    Studies**, the second part of **Introduction to Data Science**.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 这是《通过案例研究学习统计与预测算法》（Statistics and Prediction Algorithms Through Case Studies）的第二个部分《数据科学导论》的网站。
- en: The website for the first part, **Data Wrangling and Visualization with R**,
    is [here](http://rafalab.dfci.harvard.edu/dsbook-part-1/).
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 第一部分《使用 R 进行数据整理和可视化》的网站[在这里](http://rafalab.dfci.harvard.edu/dsbook-part-1/)。
- en: This book started out as part of the class notes used in the HarvardX [Data
    Science Series](https://www.edx.org/professional-certificate/harvardx-data-science).
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 本书最初是哈佛X [数据科学系列](https://www.edx.org/professional-certificate/harvardx-data-science)
    中使用的课堂笔记的一部分。
- en: A hardcopy version of the first edition of the book, which combined both parts,
    is available from [CRC Press](https://www.routledge.com/Introduction-to-Data-Science-Data-Wrangling-and-Visualization-with-R/Irizarry/p/book/9781032116556).
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 可以从 [CRC Press](https://www.routledge.com/Introduction-to-Data-Science-Data-Wrangling-and-Visualization-with-R/Irizarry/p/book/9781032116556)
    获取本书第一版的印刷版，该版结合了两个部分。
- en: A free PDF of the October 24, 2019 version of the book, which combined both
    parts, is available from [Leanpub](https://leanpub.com/datasciencebook).
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 可以从 [Leanpub](https://leanpub.com/datasciencebook) 获取 2019 年 10 月 24 日版本的免费
    PDF，该版本结合了两个部分。
- en: The Quarto code used to generate the book is available on [GitHub](https://github.com/rafalab/dsbook-part-2).
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 生成本书的 Quarto 代码可在 [GitHub](https://github.com/rafalab/dsbook-part-2) 上找到。
