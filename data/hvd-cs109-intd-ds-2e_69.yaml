  zh: '[PRE37]'
- en: '*Fit a random forest using the `randomForest` function in the package **randomForest**.
    Then use the `varImp` function to see which are the top 10 most predictive genes.
    Make a histogram of the reported importance to get an idea of the distribution
    of the importance values.*****************'
  id: totrans-306
  prefs: []
  type: TYPE_NORMAL
  zh: '*使用包 **randomForest** 中的 `randomForest` 函数拟合随机森林。然后使用 `varImp` 函数查看哪些是前 10
