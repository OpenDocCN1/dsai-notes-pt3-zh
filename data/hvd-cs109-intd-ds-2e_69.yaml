  id: totrans-303
  prefs: []
  type: TYPE_PRE
  zh: '[PRE36]'
- en: '*with the gene expression measured on 500 genes for 189 biological samples
    representing seven different tissues. The tissue type is stored in `tissue_gene_expression$y`.'
  id: totrans-304
  prefs: []
  type: TYPE_NORMAL
  zh: '*使用在 189 个生物样本上测量的 500 个基因的表达来表示七个不同的组织。组织类型存储在 `tissue_gene_expression$y`
    中。'
- en: '[PRE37]'
  id: totrans-305
  prefs: []
