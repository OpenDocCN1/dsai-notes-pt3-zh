- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: 'Machine Learning is the subfield of computer science that gives computers the
    ability to perform tasks without being explicitly programmed. There are several
    different tasks that fall under the domain of machine learning and several different
    algorithms for "learning". In this chapter, we are going to focus on Classification
    and two classic Classification algorithms: Naive Bayes and Logistic Regression.'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 机器学习是计算机科学的一个子领域，它使计算机能够在没有明确编程的情况下执行任务。机器学习领域包含多个不同的任务，以及多种不同的“学习”算法。在本章中，我们将重点关注分类以及两种经典的分类算法：朴素贝叶斯和逻辑回归。
- en: Classification
  id: totrans-4
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 分类
- en: In classification tasks, your job is to use training data with feature/label
    pairs ($\mathbf{x}$, y) in order to estimate a function $\hat{y} = g(\mathbf{x})$.
    This function can then be used to make a prediction. In classification the value
    of $y$ takes on one of a \textbf{discrete} number of values. As such we often
    chose $g(\mathbf{x}) = \underset{y}{\operatorname{argmax }}\text{ }\hat{P}(Y=y|\mathbf{X}
    = \mathbf{x})$.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 在分类任务中，你的任务是使用带有特征/标签对 ($\mathbf{x}$, y) 的训练数据来估计一个函数 $\hat{y} = g(\mathbf{x})$。这个函数可以用来进行预测。在分类中，$y$
    的值取自一个 \textbf{离散} 的数值集合。因此，我们通常选择 $g(\mathbf{x}) = \underset{y}{\operatorname{argmax
    }}\text{ }\hat{P}(Y=y|\mathbf{X} = \mathbf{x})$。
- en: 'In the classification task you are given $N$ training pairs: $(\mathbf{x}^{(1)},y^{(1)}),
    (\mathbf{x}^{(2)},y^{(2)}), \dots , (\mathbf{x}^{(N)},y^{(N)})$ Where $\mathbf{x}^{(i)}$
    is a vector of $m$ discrete features for the $i$th training example and $y^{(i)}$
    is the discrete label for the $i$th training example.'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 在分类任务中，你将得到 $N$ 个训练对：$(\mathbf{x}^{(1)},y^{(1)}), (\mathbf{x}^{(2)},y^{(2)}),
    \dots , (\mathbf{x}^{(N)},y^{(N)})$ 其中 $\mathbf{x}^{(i)}$ 是第 $i$ 个训练示例的 $m$ 个离散特征向量，而
    $y^{(i)}$ 是第 $i$ 个训练示例的离散标签。
- en: In our introduction to machine learning, we are going to assume that all values
    in our training data-set are binary. While this is not a necessary assumption,
    it makes it much easier to learn the core concepts. Specifically we assume that
    all labels are binary $y^{(i)} \in \{0, 1\} \text{ }\forall i$ and all features
    are binary $x^{(i)}_j \in \{0, 1\} \text{ }\forall i, j$.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 在我们介绍机器学习时，我们将假设训练数据集中的所有值都是二元的。虽然这不是一个必要的假设，但它使得学习核心概念变得容易得多。具体来说，我们假设所有标签都是二元的
    $y^{(i)} \in \{0, 1\} \text{ }\forall i$，并且所有特征都是二元的 $x^{(i)}_j \in \{0, 1\} \text{
    }\forall i, j$。
