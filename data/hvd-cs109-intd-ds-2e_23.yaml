- en: Productivity Tools
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 生产力工具
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-1/productivity/intro-productivity.html](https://rafalab.dfci.harvard.edu/dsbook-part-1/productivity/intro-productivity.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-1/productivity/intro-productivity.html](https://rafalab.dfci.harvard.edu/dsbook-part-1/productivity/intro-productivity.html)
- en: Generally speaking, we do not recommend using point-and-click approaches for
    data analysis. Instead, we recommend scripting languages, such as R, since they
    are more flexible and greatly facilitate reproducibility. Similarly, we recommend
    against the use of point-and-click approaches to organizing files and document
    preparation. In this part of the book, we demonstrate alternative approaches.
    Specifically, we will learn to use freely available tools that, although at first
    may seem cumbersome and non-intuitive, will eventually make you a much more efficient
    and productive data scientist.
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 通常来说，我们不推荐使用点选式方法进行数据分析。相反，我们推荐使用脚本语言，例如 R，因为它们更加灵活，并且极大地促进了可重复性。同样，我们也反对使用点选式方法来组织文件和文档准备。在本书的这一部分，我们将展示替代方法。具体来说，我们将学习如何使用免费工具，虽然一开始可能感觉笨拙且不直观，但最终会使你成为一个更加高效和富有成效的数据科学家。
- en: Three general guiding principles that motivate what we learn here are 1) be
    systematic when organizing your filesystem, 2) automate when possible, and 3)
    minimize the use of the mouse. As you become more proficient at coding, you will
    find that 1) you want to minimize the time you spend remembering what you called
    a file or where you put it, 2) if you find yourself repeating the same task over
    and over, there is probably a way to automate, and 3) anytime your fingers leave
    the keyboard, it results in loss of productivity.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 激励我们在这里学习的三项基本原则是：1）在组织文件系统时要系统化，2）尽可能自动化，3）最小化鼠标的使用。随着你在编码方面变得更加熟练，你会发现：1）你希望最小化花费在记住文件名或放置位置上的时间，2）如果你发现自己反复执行相同的任务，可能有一种方法可以自动化，3）任何时候你的手指离开键盘，都会导致生产力下降。
- en: A data analysis project is not always a dataset and a script. A typical data
    analysis challenge may involve several parts, each involving several data files,
    including files containing the scripts we use to analyze data. Keeping all this
    organized can be challenging. We will learn to use the *Unix shell* as a tool
    for managing files and directories on your computer system. Using Unix will permit
    you to use the keyboard, rather than the mouse, when creating folders, moving
    from directory to directory, and renaming, deleting, or moving files. We also
    provide specific suggestions on how to keep the filesystem organized.
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 数据分析项目并不总是由数据集和脚本组成。典型的数据分析挑战可能涉及多个部分，每个部分都包含多个数据文件，包括包含我们用于数据分析的脚本的文件。保持所有这些内容井然有序可能是一项挑战。我们将学习如何使用
    *Unix shell* 作为管理计算机系统上文件和目录的工具。使用 Unix 将允许你在创建文件夹、从一个目录移动到另一个目录、重命名、删除或移动文件时使用键盘，而不是鼠标。我们还提供了一些具体的建议，说明如何保持文件系统井然有序。
- en: The data analysis process is also iterative and adaptive. As a result, we are
    constantly editing our scripts and reports. In this chapter, we introduce you
    to the version control system *Git*, which is a powerful tool for keeping track
    of these changes. We also introduce you to GitHub[¹](#fn1), a service that permits
    you to host and share your code. We will demonstrate how you can use this service
    to facilitate collaborations. Another positive benefit of using GitHub is that
    you can easily showcase your work to potential employers.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 数据分析过程也是迭代和自适应的。因此，我们不断地编辑我们的脚本和报告。在本章中，我们向您介绍版本控制系统 *Git*，这是一个跟踪这些更改的强大工具。我们还向您介绍
    GitHub[¹](#fn1)，这是一个允许你托管和分享代码的服务。我们将演示如何使用这项服务来促进协作。使用 GitHub 的另一个积极好处是，你可以轻松地向潜在雇主展示你的工作。
- en: Finally, we learn to write reports in R markdown, which permits you to incorporate
    text and code into a single document. We will demonstrate how, using the `knitr`
    package, we can write reproducible and aesthetically pleasing reports by running
    the analysis and generating the report simultaneously.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 最后，我们将学习如何使用 R markdown 编写报告，这允许你将文本和代码合并到单个文档中。我们将演示如何使用 `knitr` 包，通过同时运行分析和生成报告，来编写可重复和美观的报告。
- en: We will put all this together using the powerful integrated desktop environment
    RStudio[²](#fn2). Throughout the chapter we will be building up an example on
    US gun murders. The final project, which includes several files and folders, can
    be seen in the GitHub repository *rairizarry/murders*[³](#fn3).
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将使用强大的集成桌面环境 RStudio[²](#fn2) 将所有这些内容整合在一起。在整个章节中，我们将构建一个关于美国枪支谋杀的示例。最终项目，包括多个文件和文件夹，可以在
    GitHub 仓库 *rairizarry/murders*[³](#fn3) 中查看。
