- en: Thompson Sampling
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: Thompson 采样
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/examples/thompson/](https://chrispiech.github.io/probabilityForComputerScientists/en/examples/thompson/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/examples/thompson/](https://chrispiech.github.io/probabilityForComputerScientists/en/examples/thompson/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: '![](../Images/45877de51a46765b5fd6227b88a79024.png)'
  id: totrans-3
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/45877de51a46765b5fd6227b88a79024.png)'
- en: Imagine having to make the following series of decisions. You have two drugs
    you can administer, drug 1, or drug 2\. Initially you have no idea which drug
    is better. You want to know which drug is the most effective, but at the same
    time, there are costs to *exploration* — the stakes are high.
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 想象一下你必须做出以下一系列决定。你有两种药物可以给药，药物 1 或药物 2。最初你不知道哪种药物更好。你想要知道哪种药物最有效，但与此同时，探索的成本很高。
- en: 'Here is an example:'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 这里有一个例子：
- en: '[PRE0]'
  id: totrans-6
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: This problem is suprisingly complex. It sometimes goes by the name "the [multi-armed
    bandit](https://en.wikipedia.org/wiki/Multi-armed_bandit) problem!" In fact, the
    perfect answer to this question can be exponentially hard to calculate. There
    are many approximate solutions and it is an active area of research.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 这个问题出奇地复杂。有时它被称为“[多臂老虎机问题](https://en.wikipedia.org/wiki/Multi-armed_bandit)！”事实上，对这个问题的完美答案可能非常难以计算。有许多近似解，并且这是一个活跃的研究领域。
- en: 'One solution has risen to be a rather popular option: Thompson Sampling. It
    is easy to implement, elegant to understand, has provable garuntees [[1](https://www.jmlr.org/papers/volume17/14-087/14-087.pdf)],
    and in practice does very well [[2](https://proceedings.neurips.cc/paper/2011/file/e53a0a2978c28872a4505bdb51db06dc-Paper.pdf)].'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 一种解决方案已经变得相当受欢迎：Thompson 采样。它易于实现，易于理解，有可证明的保证 [[1](https://www.jmlr.org/papers/volume17/14-087/14-087.pdf)]，并且在实践中表现良好
    [[2](https://proceedings.neurips.cc/paper/2011/file/e53a0a2978c28872a4505bdb51db06dc-Paper.pdf)]。
- en: What You Know About The Choices
  id: totrans-9
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 你对选择的了解
- en: The first step in Thompson sampling is to express what you know (and what you
    do not know) about your choices. Let us revisit the example of the two drugs in
    the previous section. By the end we had tested drug 1 four times (with 1 success)
    and we had tested drug 2 four times (with 2 successes). A sophisticated way to
    represent our belief in the two hidden probabilites behind drug 1 and drug 2 is
    to use the Beta distribution. Let $X_1$ be the belief in the probability for drug
    1 and let $X_2$ be the belief in the probability for drug 2. $$ \begin{align*}
    X_1 \sim \Beta(a = 2, b = 4)\\ X_2 \sim \Beta(a = 3, b = 3) \end{align*} $$
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: Thompson 采样的第一步是表达你对选择（以及你不知道的）的了解。让我们回顾一下上一节中提到的两种药物。到结束时，我们测试了药物 1 四次（1 次成功）和药物
    2 四次（2 次成功）。一种复杂的方式来表示我们对药物 1 和药物 2 后面隐藏的概率的信念是使用 Beta 分布。让 $X_1$ 表示对药物 1 概率的信念，让
    $X_2$ 表示对药物 2 概率的信念。$$ \begin{align*} X_1 \sim \Beta(a = 2, b = 4)\\ X_2 \sim
    \Beta(a = 3, b = 3) \end{align*} $$
- en: 'Recall that in the Beta distribution with a uniform prior the first parameter,
    $a$, is number of observed successes + 1\. The second parameter, $b$, is the number
    of observed fails + 1\. It is helpful to look at these two distributions graphically:'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 回想一下，在具有均匀先验的 Beta 分布中，第一个参数 $a$ 是观察到的成功次数 + 1。第二个参数 $b$ 是观察到的失败次数 + 1。从图形上观察这两个分布是有帮助的：
- en: '<canvas id="betaExamplePdf" style="max-height: 400px"></canvas>'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: '<canvas id="betaExamplePdf" style="max-height: 400px"></canvas>'
- en: If we had to guess, drug 2 is looking better, but there is still a lot of uncertainty,
    represented by the high variance in these beliefs. That is a helpful representation.
    But how can we use this information to make a good decision of the next drug.
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们不得不猜测，药物 2 看起来更好，但仍然有很多不确定性，这体现在这些信念的高方差中。这是一个有用的表示。但我们如何利用这些信息来做出下一个药物的好决定。
- en: Making a Choice
  id: totrans-14
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 做出选择
- en: It is hard to know what is the right choice! If you only had one more patient,
    then it is clear what you should do. You should calculate the probability that
    $X_2 > X_1$ and if that probability is over 0.5 then you should chose $a$. However,
    if you need to continually administer the pills then it is less clear what is
    the right choice. If you chose 1, you miss out on the chance to learn more about
    2\. What should we do? We need to balance this need for "exploring" and the need
    to take advantage of what we already know.
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 确定正确的选择很难！如果你只有一个更多的病人，那么你该做什么就很明确了。你应该计算 $X_2 > X_1$ 的概率，如果这个概率超过 0.5，那么你应该选择
    $a$。然而，如果你需要持续给药，那么正确的选择就不那么明确了。如果你选择 1，你将错过了解 2 的机会。我们该怎么办？我们需要平衡“探索”的需求和利用已知信息的需要。
- en: The simple idea behind Thompson Sampling is to randomly make your choice according
    to its probability of being optimal. In this case we should chose drug 1 with
    the probability that 1 is > 2\. How do people do this in practice? They have a
    very simple formula. Take a random sample from each Beta distribution. Chose the
    option which has a larger value for its sample.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 汤普森采样的简单思想是随机地根据其成为最优选择的概率来做出选择。在这种情况下，我们应该选择药物1，其选择的概率是1大于2。人们在实践中是如何做到这一点的呢？他们有一个非常简单的公式。从每个Beta分布中随机采样。选择其采样值较大的选项。
- en: '[PRE1]'
  id: totrans-17
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: What does it mean to take a sample? It means to chose a value according to the
    probability density (or probability mass) function. So in our example above, we
    might sample 0.4 for drug 1, and sample 0.35 for drug 2\. In which case we would
    go with drug 1\.
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 采样意味着什么？这意味着根据概率密度函数（或概率质量函数）选择一个值。所以在我们上面的例子中，我们可能会为药物1采样0.4，为药物2采样0.35。在这种情况下，我们会选择药物1。
- en: At the start Thompson Sampling "explores" quite a lot of time. As it gets more
    confident that one drug is better than another, it will start to chose that drug
    most of the time. Eventually it will converge to knowing which drug is best, and
    it will always chose that drug.
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 在开始时，汤普森采样“探索”了相当长的时间。随着它越来越确信一种药物比另一种药物更好，它将开始大多数时候选择那种药物。最终，它将收敛到知道哪种药物最好，并且它将始终选择那种药物。
