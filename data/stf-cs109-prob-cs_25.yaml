- en: Bacteria Evolution
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 细菌进化
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/examples/bacteria_evolution/](https://chrispiech.github.io/probabilityForComputerScientists/en/examples/bacteria_evolution/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/examples/bacteria_evolution/](https://chrispiech.github.io/probabilityForComputerScientists/en/examples/bacteria_evolution/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: A wonderful property of modern life is that we have anti-biotics to kill bacterial
    infections. However, we only have a fixed number of anti-biotic medicines, and
    bacteria are evolving to become resistent to our anti-biotics. In this example
    we are going to use probability to understand evolution of anti-biotic resistence
    in bacteria.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 现代生活的美妙之处在于我们有抗生素来杀死细菌感染。然而，我们只有有限数量的抗生素药物，而细菌正在进化以对我们抗生素产生抵抗力。在这个例子中，我们将使用概率来理解细菌中抗生素耐药性的进化。
- en: Imagine you have a population of 1 million infectious bacteria in your gut,
    10% of which have a mutation that makes them slightly more resistant to anti-biotics.
    You take a course of anti-biotics. The probability that bacteria with the mutation
    survives is 20%. The probability that bacteria without the mutation survives is
    1%.
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 假设你肠道中有100万感染性细菌，其中10%的细菌发生了使它们对抗生素略微具有抵抗力的突变。你服用了一疗程的抗生素。具有突变基因的细菌存活的概率是20%，而没有突变基因的细菌存活的概率是1%。
- en: What is the probability that a randomly chosen bacterium survives the anti-biotics?
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 随机选择的细菌在抗生素中存活的概率是多少？
- en: 'Let $E$ be the event that our bacterium survives. Let $M$ be the event that
    a bacteria has the mutation. By the [Law of Total Probability](../../en/part1/law_total)
    (LOTP): $$ \begin{align} \p(E) &= \p(E \and M) + \p(E \and M\c) && \text{LOTP}
    \\ &= \p(E | M)\p(M) + \p(E | M\c)\p(M\c) && \text{Chain Rule} \\ &= 0.20 \cdot
    0.10 + 0.01 \cdot 0.90 && \text{Substituting} \\ &= 0.029 \end{align} $$'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $E$ 为细菌存活的事件，设 $M$ 为细菌发生突变的事件。根据[总概率定律](../../en/part1/law_total)（LOTP）：
- en: What is the probability that a surviving bacterium has the mutation?
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 存活的细菌具有突变基因的概率是多少？
- en: 'Using the same events in the last section, this question is asking for $\p(M
    | E)$. We aren''t giving the conditional probability in that direction, instead
    we know $P(E|M)$. Such situations call for [Bayes'' Theorem](../../en/part1/bayes_theorem):
    $$ \begin{align} \p(M | E) &= \frac{\p(E|M)\p(M)}{\p(E)} && \text{Bayes} \\ &=
    \frac{0.20 \cdot 0.10}{\p(E)} && \text{Given} \\ &= \frac{0.20 \cdot 0.10}{0.029}
    && \text{Calculated} \\ &\approx 0.69 \end{align} $$'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 使用上一节中的相同事件，这个问题要求的是 $\p(M | E)$。我们没有给出这个方向的条件概率，而是知道 $P(E|M)$。这种情况下需要用到[贝叶斯定理](../../en/part1/bayes_theorem)：
- en: After the course of anti-biotics, 69% of bacteria have the mutation, up from
    10% before. If this population is allowed to reproduce you will have a much more
    resistent set of bacteria!
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 在抗生素疗程结束后，69%的细菌具有突变基因，比之前的10%显著增加。如果这个种群被允许繁殖，你将拥有一个对抗生素具有高度抵抗力的细菌群体！
