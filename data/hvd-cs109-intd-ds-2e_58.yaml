  zh: '*这是一个常见的操作，我们有一个 **matrixStats** 函数来更快地完成它：'
- en: '[PRE27]******'
  id: totrans-103
  prefs: []
  type: TYPE_NORMAL
  zh: '[PRE27]******'
- en: '****Indexing with matrices****'
  id: totrans-104
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '****使用矩阵进行索引****'
- en: '****An operation that facilitates efficient coding is that we can change entries
    of a matrix based on conditionals applied to that same matrix. Here is a simple
    example:'
  id: totrans-105
  prefs: []
  type: TYPE_NORMAL
  zh: '****一种便于高效编码的操作是，我们可以根据应用于同一矩阵的条件来更改矩阵的条目。以下是一个简单的示例：'
- en: '[PRE28]'
  id: totrans-106
  prefs: []
  type: TYPE_PRE
  zh: '[PRE28]'
- en: '*A useful application of this approach is that we can change all the `NA` entries
    of a matrix to something else:'
  id: totrans-107
  prefs: []
  type: TYPE_NORMAL
  zh: '*这种方法的实用应用之一是，我们可以将矩阵中所有的 `NA` 条目更改为其他值：'
- en: '[PRE29]*********'
  id: totrans-108
  prefs: []
  type: TYPE_NORMAL
  zh: '[PRE29]*********'
- en: '****21.4 Vectorization for matrices****'
  id: totrans-109
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '****21.4 矩阵的向量化****'
- en: '****Vectorization is one of the main reasons R is so efficient for numerical
    computation with data. Many operations that would otherwise require explicit loops
    can instead be applied directly to entire matrices or vectors, making the code
    both faster and easier to read.'
  id: totrans-110
  prefs: []
  type: TYPE_NORMAL
  zh: '****向量化是 R 在数值计算中如此高效的主要原因之一。许多原本需要显式循环的操作可以直接应用于整个矩阵或向量，这使得代码既更快又更容易阅读。'
- en: Matrix–vector operations
  id: totrans-111
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 矩阵-向量操作
- en: 'A common example of matrix vectorization is centering rows: subtracting the
    mean of each row from its corresponding entries. Although this can be done with
    the `[scale()](https://rdrr.io/r/base/scale.html)` function'
  id: totrans-112
  prefs: []
  type: TYPE_NORMAL
  zh: 矩阵向量化的一个常见例子是行中心化：从每行的对应元素中减去该行的平均值。尽管这可以通过 `[scale()](https://rdrr.io/r/base/scale.html)`
    函数来完成
- en: '[PRE30]'
  id: totrans-113
  prefs: []
  type: TYPE_PRE
  zh: '[PRE30]'
- en: '*R’s vectorization rules make it possible to achieve this more directly and
    efficiently. We use row centering as an example, but this approach applies broadly
    to many operations discussed throughout this chapter.'
  id: totrans-114
  prefs: []
  type: TYPE_NORMAL
  zh: '*R 的向量化规则使得我们可以更直接、更高效地实现这一点。我们以行中心化为例，但这种方法适用于本章讨论的许多操作。'
- en: 'In R, if we subtract a vector `a` from a matrix `x`: `x-a`, the first element
    of `a` is subtracted from the first row, the second element from the second row,
    and so on. Mathematically, this operation can be written as:'
  id: totrans-115
  prefs: []
  type: TYPE_NORMAL
  zh: 在 R 中，如果我们从矩阵 `x` 中减去向量 `a`：`x-a`，则 `a` 的第一个元素从第一行减去，第二个元素从第二行减去，依此类推。从数学上讲，这个操作可以写成：
- en: \[ \begin{bmatrix} X_{11}&\dots & X_{1p} \\ X_{21}&\dots & X_{2p} \\ \vdots
    & \ddots & \vdots \\ X_{n1}&\dots & X_{np} \end{bmatrix} - \begin{bmatrix} a_1\\
    a_2\\ \vdots \\ a_n \end{bmatrix} = \begin{bmatrix} X_{11}-a_1&\dots & X_{1p}-a_1\\
    X_{21}-a_2&\dots & X_{2p}-a_2\\ \vdots & \ddots & \vdots\\ X_{n1}-a_n&\dots &
    X_{np}-a_n \end{bmatrix} \]
  id: totrans-116
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \begin{bmatrix} X_{11}&\dots & X_{1p} \\ X_{21}&\dots & X_{2p} \\ \vdots
    & \ddots & \vdots \\ X_{n1}&\dots & X_{np} \end{bmatrix} - \begin{bmatrix} a_1\\
    a_2\\ \vdots \\ a_n \end{bmatrix} = \begin{bmatrix} X_{11}-a_1&\dots & X_{1p}-a_1\\
    X_{21}-a_2&\dots & X_{2p}-a_2\\ \vdots & \ddots & \vdots\\ X_{n1}-a_n&\dots &
    X_{np}-a_n \end{bmatrix} \]
- en: 'This means we can center each row of `x` with this single line of code:'
  id: totrans-117
  prefs: []
  type: TYPE_NORMAL
  zh: 这意味着我们可以用这一行代码来对 `x` 的每一行进行中心化：
- en: '[PRE31]'
  id: totrans-118
  prefs: []
  type: TYPE_PRE
  zh: '[PRE31]'
- en: '*The same vectorization applies to other arithmetic operations, such as division.
    For example, we can both center and scale the rows with:'
  id: totrans-119
  prefs: []
  type: TYPE_NORMAL
  zh: '*相同的向量化也适用于其他算术操作，例如除法。例如，我们可以使用以下方法同时中心化和缩放行：'
- en: '[PRE32]'
  id: totrans-120
  prefs: []
  type: TYPE_PRE
  zh: '[PRE32]'
- en: '*This is equivalent to `scale(x)`, but done explicitly to show the underlying
    vectorized operations.***'
  id: totrans-121
  prefs: []
  type: TYPE_NORMAL
  zh: '*这相当于 `scale(x)`，但这里显式地执行以展示底层的向量化操作。***'
- en: '***The `sweep` function***'
  id: totrans-122
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '***`sweep` 函数***'
- en: '***If we instead want to scale the columns, the following code will not work
    as expected because subtraction is applied row-wise:'
  id: totrans-123
  prefs: []
  type: TYPE_NORMAL
  zh: '***如果我们想缩放列，以下代码将不会按预期工作，因为减法是按行应用的：'
- en: '[PRE33]'
  id: totrans-124
  prefs: []
  type: TYPE_PRE
  zh: '[PRE33]'
- en: '*One workaround is to transpose the matrix, apply the operation, and transpose
    back:'
  id: totrans-125
  prefs: []
  type: TYPE_NORMAL
  zh: '*一种解决方案是将矩阵转置，应用操作，然后再转置回来：'
- en: '[PRE34]'
  id: totrans-126
  prefs: []
  type: TYPE_PRE
  zh: '[PRE34]'
- en: '*This works, but it’s cumbersome and inefficient for large matrices due to
    repeated transpositions.'
  id: totrans-127
  prefs: []
  type: TYPE_NORMAL
  zh: '*这可行，但对于大型矩阵来说，由于重复转置，操作繁琐且效率低下。'
- en: The `sweep` function provides a clearer and more general solution for performing
    vectorized operations on matrices. It is similar to `apply`, but designed specifically
    for array-like data and elementwise arithmetic.
  id: totrans-128
  prefs: []
  type: TYPE_NORMAL
  zh: '`sweep` 函数为在矩阵上执行矢量化操作提供了一个更清晰、更通用的解决方案。它与 `apply` 类似，但专门为类似数组的数据和逐元素算术设计。'
- en: 'When used with a matrix `x`, `sweep` takes three main arguments:'
  id: totrans-129
  prefs: []
  type: TYPE_NORMAL
  zh: 当与矩阵 `x` 一起使用时，`sweep` 函数有三个主要参数：
- en: '`MARGIN` - which dimension to operate over (`1` for rows, `2` for columns)'
  id: totrans-130
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`MARGIN` - 要操作的维度（`1` 表示行，`2` 表示列）'
- en: '`STATS` - the vector of values to *sweep out* (e.g., means or standard deviations)'
  id: totrans-131
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`STATS` - 用于*扫除*（例如，均值或标准差）的值向量'
- en: '`FUN` - the operation to apply (default is subtraction `"-"`)'
  id: totrans-132
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`FUN` - 要应用的运算（默认为减法 `"-"`)'
- en: 'For example, to subtract each column’s mean we write:'
  id: totrans-133
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，要减去每一列的均值，我们编写：
- en: '[PRE35]'
  id: totrans-134
  prefs: []
  type: TYPE_PRE
  zh: '[PRE35]'
- en: '*This centers each column so that its average is zero. Because R allows omitting
    argument names when defaults are clear, a concise and common shorthand is:'
  id: totrans-135
  prefs: []
  type: TYPE_NORMAL
  zh: '*这使每一列居中，使其平均值为零。因为 R 允许在默认值明确时省略参数名称，所以一个简洁且常见的缩写是：'
- en: '[PRE36]'
  id: totrans-136
  prefs: []
  type: TYPE_PRE
  zh: '[PRE36]'
- en: '*Similarly, to center rows we write:'
  id: totrans-137
  prefs: []
  type: TYPE_NORMAL
  zh: '*同样，为了居中行，我们编写：'
- en: '[PRE37]'
  id: totrans-138
  prefs: []
  type: TYPE_PRE
  zh: '[PRE37]'
- en: '*(Though note that `x - rowMeans(x)` is typically faster for this specific
    operation.)'
  id: totrans-139
  prefs: []
  type: TYPE_NORMAL
  zh: '*(尽管请注意，对于这个特定操作，`x - rowMeans(x)` 通常更快。)'
- en: 'To scale rather than center, simply change the operation:'
  id: totrans-140
  prefs: []
  type: TYPE_NORMAL
  zh: 要进行缩放而不是居中，只需更改操作：
- en: '[PRE38]'
  id: totrans-141
  prefs: []
  type: TYPE_PRE
  zh: '[PRE38]'
- en: '*The `sweep` function also generalizes beyond matrices, it can handle arrays
    with more than two dimensions and statistics vectors (`STATS`) of matching dimension.*********'
  id: totrans-142
  prefs: []
  type: TYPE_NORMAL
  zh: '*`sweep` 函数也超越了矩阵的范畴，它可以处理超过两个维度的数组以及匹配维度的统计向量 (`STATS`)。*********'
- en: '***Matrix-matrix operations***'
  id: totrans-143
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '***矩阵-矩阵运算***'
- en: '***In R, if you add, subtract, multiple or divide two matrices, the operation
    is done element-wise. For example, if two matrices are stored in `x` and `y`,
    then `x*y` does not result in matrix multiplication as defined in [Section 22.1](linear-algebra.html#sec-matrix-mult).
    Instead, the entry in row \(i\) and column \(j\) of this product is the product
    of the entry in row \(i\) and column \(j\) of `x` and `y`, respectively.*******'
  id: totrans-144
  prefs: []
  type: TYPE_NORMAL
  zh: '***在 R 中，如果你对两个矩阵进行加、减、乘或除运算，操作是逐元素进行的。例如，如果两个矩阵存储在 `x` 和 `y` 中，那么 `x*y` 并不导致
    [第22.1节](linear-algebra.html#sec-matrix-mult) 中定义的矩阵乘法。相反，这个乘积的行 \(i\) 和列 \(j\)
    的条目是 `x` 中行 \(i\) 和列 \(j\) 的条目与 `y` 中相应条目的乘积。*******'
- en: '****21.5 Motivating tasks****'
  id: totrans-145
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '****21.5 激励任务****'
- en: '****To motivate the use of matrices in R, we will pose six tasks that illustrate
    how matrix operations can help with data exploration of the handwritten digits
    dataset. Each task highlights a basic matrix operation that is commonly used in
    R. By seeing how these operations can be implemented with fast and simple code,
    you will gain hands-on experience with the kinds of computations that arise frequently
    in high-dimensional data analysis. The primary goal of these tasks is to help
    you learn how matrix operations work in practice.'
  id: totrans-146
  prefs: []
  type: TYPE_NORMAL
  zh: '****为了激励在 R 中使用矩阵，我们将提出六个任务，说明矩阵运算如何帮助探索手写数字数据集。每个任务突出显示了一个在 R 中常用的基本矩阵运算。通过看到这些操作如何以快速简单的方式实现，你将获得在处理高维数据分析中经常出现的计算的实际经验。这些任务的主要目标是帮助你了解矩阵运算在实际中的工作方式。'
- en: Visualize the original image
  id: totrans-147
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 可视化原始图像
- en: 'The pixel intensities are provided as rows in a matrix. Using what we learned
    in [Section 21.3.1](#sec-creating-a-matrix), we can convert each row into a \(28
    \times 28\) matrix that we can visualize as an image. As an example, we will use
    the third observation. From the label, we know this is a:'
  id: totrans-148
  prefs: []
  type: TYPE_NORMAL
  zh: 像素强度以矩阵的行提供。使用我们在[第21.3.1节](#sec-creating-a-matrix)中学到的知识，我们可以将每一行转换成一个 \(28
    \times 28\) 的矩阵，我们可以将其可视化为图像。作为一个例子，我们将使用第三个观测值。从标签中，我们知道这是一个：
- en: '[PRE39]'
  id: totrans-149
  prefs: []
  type: TYPE_PRE
  zh: '[PRE39]'
- en: '*The third row of the matrix `x[3,]` contains the 784 pixel intensities. If
    we assume these were entered in order, we can convert them back to a \(28 \times
    28\) matrix using:'
  id: totrans-150
  prefs: []
  type: TYPE_NORMAL
  zh: '*矩阵 `x[3,]` 的第三行包含 784 个像素强度。如果我们假设这些是按顺序输入的，我们可以使用以下方式将它们转换回一个 \(28 \times
    28\) 的矩阵：'
- en: '[PRE40]'
  id: totrans-151
  prefs: []
  type: TYPE_PRE
  zh: '[PRE40]'
- en: '*To visualize the data, we can use `image` in the following way:'
  id: totrans-152
  prefs: []
  type: TYPE_NORMAL
  zh: '*为了可视化数据，我们可以使用以下方式 `image`：'
- en: '[PRE41]'
  id: totrans-153
  prefs: []
  type: TYPE_PRE
  zh: '[PRE41]'
- en: '*However, because the y-axis in `image` goes bottom to top and `x` stores pixels
    top to bottom the code above shows shows a flipped image. To flip it back we can
    use:'
  id: totrans-154
  prefs: []
  type: TYPE_NORMAL
  zh: '*然而，因为 `image` 中的 y 轴是从下到上，而 `x` 存储像素是从上到下，上面的代码显示了翻转的图像。要将其翻转回来，我们可以使用：'
- en: '[PRE42]'
  id: totrans-155
  prefs: []
  type: TYPE_PRE
  zh: '[PRE42]'
- en: '*![](../Images/e0ea9c432457f578b5e84b182b8ff147.png)****'
  id: totrans-156
  prefs: []
  type: TYPE_NORMAL
  zh: '*![](../Images/e0ea9c432457f578b5e84b182b8ff147.png)****'
- en: '***Do some digits require more ink to write than others?***'
  id: totrans-157
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '***有些数字需要比其他数字更多的墨水来书写吗？***'
- en: '***Let’s study the distribution of the total pixel darkness and how it varies
    by digits.'
  id: totrans-158
  prefs: []
  type: TYPE_NORMAL
  zh: '***让我们研究总像素黑暗度的分布以及它如何随数字而变化。***'
- en: 'We can use what we learned in [Section 21.3.5](#sec-row-col-summaries) to computed
    this average for each pixel and the display the values for each digit using a
    boxplot:'
  id: totrans-159
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以使用我们在[第21.3.5节](#sec-row-col-summaries)中学到的知识计算每个像素的平均值，并使用箱线图显示每个数字的值：
- en: '[PRE43]'
  id: totrans-160
  prefs: []
  type: TYPE_PRE
  zh: '[PRE43]'
- en: '*![](../Images/04b79ce3241f7f178f372f21c505e916.png)*  *From this plot we see
    that, not surprisingly, 1s use less ink than other digits.****'
  id: totrans-161
  prefs: []
  type: TYPE_NORMAL
  zh: '*![](../Images/04b79ce3241f7f178f372f21c505e916.png)*  *从这个图中我们可以看到，不出所料，1s使用的墨水比其他数字少。****'
- en: '***Are some pixels uninformative?***'
  id: totrans-162
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '***有些像素是无信息的吗？***'
- en: '***We now examine the variation of each pixel across digits to identify and
    remove those that provide little information for classification. Pixels that show
    little variation across images do not help distinguish between digits and can
    safely be excluded. In many cases, removing uninformative features not only simplifies
    the analysis but also reduces the dataset’s size substantially, improving computational
    speed.'
  id: totrans-163
  prefs: []
  type: TYPE_NORMAL
  zh: '***我们现在将检查每个像素在数字之间的变异性，以识别和移除那些对分类提供很少信息的像素。在图像之间变异性小的像素无法帮助区分数字，可以安全地排除。在许多情况下，移除无信息特征不仅简化了分析，而且大大减少了数据集的大小，提高了计算速度。'
- en: 'Using what we learned in Sections [21.3.5](#sec-row-col-summaries) and [21.3.6](#sec-conditional-filtering),
    we can efficiently compute and filter out such columns. To quantify each pixel’s
    variability, we calculate its standard deviation across all images using the `colSds`
    function from the **matrixStats** package:'
  id: totrans-164
  prefs: []
  type: TYPE_NORMAL
  zh: 使用我们在[第21.3.5节](#sec-row-col-summaries)和[第21.3.6节](#sec-conditional-filtering)中学到的知识，我们可以有效地计算和过滤出这样的列。为了量化每个像素的可变性，我们使用**matrixStats**包中的`colSds`函数计算其在所有图像中的标准差：
- en: '[PRE44]'
  id: totrans-165
  prefs: []
  type: TYPE_PRE
  zh: '[PRE44]'
- en: '*A quick look at the distribution of these values shows that some pixels have
    very low entry to entry variability:'
  id: totrans-166
  prefs: []
  type: TYPE_NORMAL
  zh: '*快速查看这些值的分布显示，一些像素的逐个值变异性非常低：'
- en: '[PRE45]'
  id: totrans-167
  prefs: []
  type: TYPE_PRE
  zh: '[PRE45]'
- en: '*![](../Images/ae2f4139eb9408614ba34b1dcf94de2b.png)*  *This makes sense since
    we don’t write in some parts of the box. Here is the variance plotted by location
    after using what we learned in [Section 21.3.1](#sec-creating-a-matrix) to creat
    a \(28 \times 28\) matrix:'
  id: totrans-168
  prefs: []
  type: TYPE_NORMAL
  zh: '*![](../Images/ae2f4139eb9408614ba34b1dcf94de2b.png)*  *这很合理，因为我们不写盒子的某些部分。这里是我们使用我们在[第21.3.1节](#sec-creating-a-matrix)中学到的知识创建的
    \(28 \times 28\) 矩阵后按位置绘制的方差：'
- en: '[PRE46]'
  id: totrans-169
  prefs: []
  type: TYPE_PRE
  zh: '[PRE46]'
- en: '*![](../Images/603f55282784651f921ac283071fb1b6.png)*  *We see that there is
    little variation in the corners.'
  id: totrans-170
  prefs: []
  type: TYPE_NORMAL
  zh: '*![](../Images/603f55282784651f921ac283071fb1b6.png)*  *我们看到角落的变异性很小。'
- en: We could remove features that have no variation since these can’t help us predict.
  id: totrans-171
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以移除没有变化的特征，因为这些特征无法帮助我们预测。
- en: 'So if we wanted to remove uninformative predictors from our matrix, we could
    write this one line of code:'
  id: totrans-172
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，如果我们想从矩阵中移除无信息预测因子，我们可以写这一行代码：
- en: '[PRE47]'
  id: totrans-173
  prefs: []
  type: TYPE_PRE
  zh: '[PRE47]'
- en: '*Only the columns for which the standard deviation is above 60 are kept, which
    removes over half the predictors.*******'
  id: totrans-174
  prefs: []
  type: TYPE_NORMAL
  zh: '*只有标准差高于60的列被保留，这移除了超过一半的预测因子。*******'
- en: '***Can we remove smudges?***'
  id: totrans-175
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '***我们可以移除模糊吗？***'
- en: '***We will first look at the distribution of all pixel values.'
  id: totrans-176
  prefs: []
  type: TYPE_NORMAL
  zh: '***我们将首先查看所有像素值的分布。'
- en: '[PRE48]'
  id: totrans-177
  prefs: []
  type: TYPE_PRE
  zh: '[PRE48]'
- en: '*![](../Images/ae1b84eb0e681f79e7a08f6d1bdda0ba.png)*  *This shows a clear
    dichotomy which is explained as parts of the image with ink and parts without.
    If we think that values below, say, 50 are smudges, we can quickly make them zero
    using what we learned in [Section 21.3.7](#sec-indexing-matrices):'
  id: totrans-178
  prefs: []
  type: TYPE_NORMAL
  zh: '*![](../Images/ae1b84eb0e681f79e7a08f6d1bdda0ba.png)*  *这显示了一个明显的二分法，它被解释为有墨水的图像部分和无墨水的图像部分。如果我们认为低于，比如说，50的值是模糊的，我们可以快速将它们设置为0，使用我们在[第21.3.7节](#sec-indexing-matrices)中学到的知识：'
- en: '[PRE49]****'
  id: totrans-179
  prefs: []
  type: TYPE_NORMAL
  zh: '[PRE49]****'
- en: '***Binarize the data***'
  id: totrans-180
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '***二值化数据***'
- en: '***The histogram above seems to suggest that this data is mostly binary. A
    pixel either has ink or does not. Applying what we learned in [Section 21.3.7](#sec-indexing-matrices),
    we can binarize the data using just matrix operations:'
  id: totrans-181
  prefs: []
  type: TYPE_NORMAL
  zh: '***上面的直方图似乎表明这些数据大多是二进制的。一个像素要么有墨水，要么没有。应用我们在[第21.3.7节](#sec-indexing-matrices)中学到的知识，我们可以仅使用矩阵运算来二值化数据：'
- en: '[PRE50]'
  id: totrans-182
  prefs: []
  type: TYPE_PRE
  zh: '[PRE50]'
- en: '*We can also convert to a matrix of logicals and then coerce to numbers using
    what we learned in [Section 21.4](#sec-vectorization-for-matrices):'
  id: totrans-183
  prefs: []
  type: TYPE_NORMAL
  zh: '*我们还可以将它们转换为逻辑矩阵，然后使用我们在[第21.4节](#sec-vectorization-for-matrices)中学到的知识将它们强制转换为数字：'
- en: '[PRE51]****'
  id: totrans-184
  prefs: []
  type: TYPE_NORMAL
  zh: '[PRE51]****'
- en: '***Standardize the digits***'
  id: totrans-185
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: '***标准化数字***'
- en: '***Finally, we will scale each column to have the same average and standard
    deviation.'
  id: totrans-186
  prefs: []
  type: TYPE_NORMAL
  zh: '***最后，我们将对每一列进行缩放，使其具有相同的平均值和标准差。'
- en: 'Using what we learned in [Section 21.4](#sec-vectorization-for-matrices) implies
    that we can scale each row of a matrix as follows:'
  id: totrans-187
  prefs: []
  type: TYPE_NORMAL
  zh: 使用我们在[第21.4节](#sec-vectorization-for-matrices)中学到的知识意味着我们可以按如下方式缩放矩阵的每一行：
- en: '[PRE52]'
  id: totrans-188
  prefs: []
  type: TYPE_PRE
  zh: '[PRE52]'
- en: '*And for the columns we can combine two calls to `sweep`:'
  id: totrans-189
  prefs: []
  type: TYPE_NORMAL
  zh: '*对于列，我们可以组合两次调用`sweep`：*'
- en: '[PRE53]'
  id: totrans-190
  prefs: []
  type: TYPE_PRE
  zh: '[PRE53]'
- en: '*Note we can use this to standardize rows as well by replacing `2` with `1`
    and use `rowMeans` and `rowSds`.'
  id: totrans-191
  prefs: []
  type: TYPE_NORMAL
  zh: '*注意我们可以通过将`2`替换为`1`并使用`rowMeans`和`rowSds`来标准化行。*'
- en: 'Finally, note that equivalent functionality can often be achieved with:'
  id: totrans-192
  prefs: []
  type: TYPE_NORMAL
  zh: 最后，请注意，通常可以通过以下方式实现等效功能：
- en: '[PRE54]'
  id: totrans-193
  prefs: []
  type: TYPE_PRE
  zh: '[PRE54]'
- en: '*This version can be faster for large matrices, though it’s less explicit about
    what’s happening.**********'
  id: totrans-194
  prefs: []
  type: TYPE_NORMAL
  zh: '*这种版本对于大型矩阵可能更快，尽管它对正在发生的事情的描述不够明确。*'
- en: '****21.6 Exercises****'
  id: totrans-195
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '****21.6 练习****'
- en: '****1\. Create a 100 by 10 matrix of randomly generated normal numbers. Put
    the result in `x`.'
  id: totrans-196
  prefs: []
  type: TYPE_NORMAL
  zh: '****1. 创建一个100行10列的随机正态数矩阵。将结果放入`x`中。*'
- en: 2\. Apply the three R functions that give you the dimension of `x`, the number
    of rows of `x`, and the number of columns of `x`, respectively.
  id: totrans-197
  prefs: []
  type: TYPE_NORMAL
  zh: 2. 应用三个R函数，分别给出`x`的维度、`x`的行数和`x`的列数。
- en: 3\. Add the scalar 1 to row 1, the scalar 2 to row 2, and so on, to the matrix
    `x`.
  id: totrans-198
  prefs: []
  type: TYPE_NORMAL
  zh: 3. 将标量1加到矩阵`x`的第一行，标量2加到第二行，依此类推。
- en: '4\. Add the scalar 1 to column 1, the scalar 2 to column 2, and so on, to the
    matrix `x`. Hint: Use `sweep` with `FUN = "+"`.'
  id: totrans-199
  prefs: []
  type: TYPE_NORMAL
  zh: 4. 将标量1加到矩阵`x`的第一列，标量2加到第二列，依此类推。提示：使用`sweep`函数，`FUN = "+"`。
- en: 5\. Compute the average of each row of `x`.
  id: totrans-200
  prefs: []
  type: TYPE_NORMAL
  zh: 5. 计算`x`每一行的平均值。
- en: 6\. Compute the average of each column of `x`.
  id: totrans-201
  prefs: []
  type: TYPE_NORMAL
  zh: 6. 计算`x`每一列的平均值。
- en: '7\. For each digit in the MNIST training data, compute the proportion of pixels
    that are in a *grey area*, defined as values between 50 and 205\. Make a boxplot
    by digit class. Hint: Use logical operators and `rowMeans`.****'
  id: totrans-202
  prefs: []
  type: TYPE_NORMAL
  zh: 7. 对于MNIST训练数据中的每个数字，计算处于*灰色区域*的像素比例，定义为介于50和205之间的值。按数字类别制作箱线图。提示：使用逻辑运算符和`rowMeans`。
