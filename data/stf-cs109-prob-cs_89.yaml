- en: Maximum A Posteriori
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 最大后验概率
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part5/map/](https://chrispiech.github.io/probabilityForComputerScientists/en/part5/map/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: '[https://chrispiech.github.io/probabilityForComputerScientists/en/part5/map/](https://chrispiech.github.io/probabilityForComputerScientists/en/part5/map/)'
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: 'MLE is great, but it is not the only way to estimate parameters! This section
    introduces an alternate algorithm, Maximum A Posteriori (MAP).The paradigm of
    MAP is that we should chose the value for our parameters that is the most likely
    given the data. At first blush this might seem the same as MLE, however notice
    that MLE chooses the value of parameters that makes the \emph{data} most likely.
    Formally, for IID random variables $X_1, \dots, X_n$: \begin{align*} \theta_{\text{MAP}}
    =& \underset{\theta}{\operatorname{argmax }} \text{ } f(\Theta = \theta | X_1=x_1,
    X_2=x_2, \dots X_n=x_n) \end{align*} In the equation above we trying to calculate
    the conditional probability of unobserved random variables given observed random
    variables. When that is the case, think Bayes Theorem! Expand the function $f$
    using the continuous version of Bayes Theorem. \begin{align*} \theta_{\text{MAP}}
    =& \underset{\theta}{\operatorname{argmax }} \text{ } f(\Theta = \theta | X_1=x_1,
    X_2=x_2, \dots X_n=x_n) \\ =& \underset{\theta}{\operatorname{argmax }} \text{
    } \frac{f(X_1=x_1, X_2=x_2, \dots, X_n=x_n |\Theta = \theta) f(\Theta = \theta)}{f(X_1=x_1,
    X_2=x_2, \dots X_n=x_n)} && \text{Bayes} \end{align*} Note that $f$ are all probability
    densities or probability mass functions. Now we are going to leverage two observations.
    First, the data is assumed to be IID so we can decompose the density of the data
    given $\theta$. Second, the denominator is a constant with respect to $\theta$.
    As such its value does not affect the argmax and we can drop that term. Mathematically:
    \begin{align*} \theta_{\text{MAP}} =& \underset{\theta}{\operatorname{argmax }}
    \text{ } \frac{f(\Theta = \theta) \cdot \prod_{i=1}^n f(X_i =x_i| \Theta = \theta)
    }{f(X_1 = x_1, X_2 = x_2, \dots X_n = x_n)} && \text{Since the samples are IID}\\
    =& \underset{\theta}{\operatorname{argmax }} \text{ } f(\Theta = \theta) \cdot\prod_{i=1}^n
    f(X_i =x_i |\Theta = \theta) && \text{Denom. is constant with respect to $\theta$}
    \end{align*} As before, it will be more convenient to find the argmax of the log
    of the MAP function, which gives us the final form for MAP estimation of parameters.
    \begin{align*} \theta_{\text{MAP}} =& \underset{\theta}{\operatorname{argmax }}
    \text{ } \left( \log f(\Theta = \theta) + \sum_{i=1}^n \log(f(X_i =x_i|\Theta
    = \theta)) \right) \end{align*} Using Bayesian terminology, the MAP estimate is
    the mode of the "posterior" distribution for $\theta$. If you look at this equation
    side by side with the MLE equation you will notice that MAP is the argmax of the
    exact same function \emph{plus} a term for the log of the prior.'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: MLE（最大似然估计）很棒，但它并不是估计参数的唯一方法！本节介绍另一种算法，最大后验概率（Maximum A Posteriori，MAP）。MAP的范式是我们应该选择最有可能的数据对应的参数值。乍一看，这似乎与MLE相同，然而请注意，MLE选择的是使数据最有可能的参数值。形式上，对于独立同分布（IID）的随机变量
    $X_1, \dots, X_n$：\begin{align*} \theta_{\text{MAP}} =& \underset{\theta}{\operatorname{argmax
    }} \text{ } f(\Theta = \theta | X_1=x_1, X_2=x_2, \dots X_n=x_n) \end{align*}在上面的方程中，我们试图计算给定观测随机变量的未观测随机变量的条件概率。当这种情况发生时，想想贝叶斯定理！使用贝叶斯定理的连续版本展开函数
    $f$。\begin{align*} \theta_{\text{MAP}} =& \underset{\theta}{\operatorname{argmax
    }} \text{ } f(\Theta = \theta | X_1=x_1, X_2=x_2, \dots X_n=x_n) \\ =& \underset{\theta}{\operatorname{argmax
    }} \text{ } \frac{f(X_1=x_1, X_2=x_2, \dots, X_n=x_n |\Theta = \theta) f(\Theta
    = \theta)}{f(X_1=x_1, X_2=x_2, \dots X_n=x_n)} && \text{贝叶斯定理} \end{align*}请注意，$f$
    都是概率密度函数或概率质量函数。现在我们将利用两个观察结果。首先，假设数据是IID的，因此我们可以分解给定 $\theta$ 的数据密度。其次，分母相对于
    $\theta$ 是常数。因此，它的值不影响 argmax，我们可以省略这一项。数学上：\begin{align*} \theta_{\text{MAP}}
    =& \underset{\theta}{\operatorname{argmax }} \text{ } \frac{f(\Theta = \theta)
    \cdot \prod_{i=1}^n f(X_i =x_i| \Theta = \theta) }{f(X_1 = x_1, X_2 = x_2, \dots
    X_n = x_n)} && \text{由于样本是IID的}\\ =& \underset{\theta}{\operatorname{argmax }}
    \text{ } f(\Theta = \theta) \cdot\prod_{i=1}^n f(X_i =x_i |\Theta = \theta) &&
    \text{分母相对于 $\theta$ 是常数} \end{align*}与之前一样，找到MAP函数的对数的argmax将更方便，这给出了参数MAP估计的最终形式。
    \begin{align*} \theta_{\text{MAP}} =& \underset{\theta}{\operatorname{argmax }}
    \text{ } \left( \log f(\Theta = \theta) + \sum_{i=1}^n \log(f(X_i =x_i|\Theta
    = \theta)) \right) \end{align*}使用贝叶斯术语，MAP估计是 $\theta$ 的“后验”分布的众数。如果你将这个方程与MLE方程并排放置，你会注意到MAP是相同函数的argmax加上一个对数先验项。
- en: Parameter Priors
  id: totrans-4
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 参数先验
- en: In order to get ready for the world of MAP estimation, we are going to need
    to brush up on our distributions. We will need reasonable distributions for each
    of our different parameters. For example, if you are predicting a Poisson distribution,
    what is the right random variable type for the prior of $\lambda$?
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 为了准备好 MAP 估计的世界，我们需要复习我们的分布。我们需要为我们的不同参数中的每一个找到一个合理的分布。例如，如果你正在预测泊松分布，$\lambda$
    的先验分布应该选择哪种合适的随机变量类型？
- en: A desiderata for prior distributions is that the resulting posterior distribution
    has the same functional form. We call these "conjugate" priors. In the case where
    you are updating your belief many times, conjugate priors makes programming in
    the math equations much easier.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 对于先验分布的一个期望是，得到的后验分布具有相同的函数形式。我们称这些为“共轭”先验。在你多次更新你的信念的情况下，共轭先验使得在数学方程中进行编程变得容易得多。
- en: 'Here is a list of different parameters and the distributions most often used
    for their priors: \begin{align*} &\text{Parameter }&& \text{Distribution}\\ &\text{Bernoulli
    } p && \text{Beta}\\ &\text{Binomial } p && \text{Beta}\\ &\text{Poisson } \lambda
    && \text{Gamma}\\ &\text{Exponential } \lambda && \text{Gamma}\\ &\text{Multinomial
    } p_i && \text{Dirichlet}\\ &\text{Normal } \mu && \text{Normal}\\ &\text{Normal
    } \sigma^2 && \text{Inverse Gamma} \end{align*} You are only expected to know
    the new distributions on a high level. You do not need to know Inverse Gamma.
    I included it for completeness.'
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 这里是一个不同参数及其通常用于其先验分布的分布列表：\begin{align*} &\text{参数 }&& \text{分布}\\ &\text{伯努利
    } p && \text{Beta}\\ &\text{二项式 } p && \text{Beta}\\ &\text{泊松 } \lambda && \text{Gamma}\\
    &\text{指数 } \lambda && \text{Gamma}\\ &\text{多项式 } p_i && \text{Dirichlet}\\ &\text{正态
    } \mu && \text{Normal}\\ &\text{正态 } \sigma^2 && \text{Inverse Gamma} \end{align*}
    你只需要对新的分布有一个高层次的理解。你不需要了解逆伽马分布。我包括它是为了完整性。
- en: The distributions used to represent your "prior" belief about a random variable
    will often have their own parameters. For example, a Beta distribution is defined
    using two parameters $(a, b)$. Do we have to use parameter estimation to evaluate
    $a$ and $b$ too? No. Those parameters are called "hyperparameters". That is a
    term we reserve for parameters in our model that we fix before running parameter
    estimate. Before you run MAP you decide on the values of $(a, b)$.
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 用于表示你对随机变量“先验”信念的分布通常会具有自己的参数。例如，Beta 分布使用两个参数 $(a, b)$ 定义。我们是否必须使用参数估计来评估 $a$
    和 $b$？不。这些参数被称为“超参数”。这是一个我们保留用于在运行参数估计之前固定的模型参数的术语。在你运行 MAP 之前，你将决定 $(a, b)$ 的值。
- en: Dirichlet
  id: totrans-9
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: Dirichlet
- en: 'The Dirichlet distribution generalizes Beta in same way Multinomial generalizes
    Bernoulli. A random variable $X$ that is Dirichlet is parametrized as $X \sim
    \text{Dirichlet}(a_1, a_2, \dots, a_m)$. The PDF of the distribution is: \begin{align*}
    f(X_1 = x_1, X_2 = x_2, \dots, X_m = x_m) = K \prod_{i=1}^m x_i^{a_i - 1} \end{align*}
    Where $K$ is a normalizing constant.'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: Dirichlet 分布以与多项式分布推广伯努利分布相同的方式推广了 Beta 分布。一个服从 Dirichlet 分布的随机变量 $X$ 被参数化为
    $X \sim \text{Dirichlet}(a_1, a_2, \dots, a_m)$。该分布的 PDF 为：\begin{align*} f(X_1
    = x_1, X_2 = x_2, \dots, X_m = x_m) = K \prod_{i=1}^m x_i^{a_i - 1} \end{align*}
    其中 $K$ 是归一化常数。
- en: 'You can intuitively understand the hyperparameters of a Dirichlet distribution:
    imagine you have seen $\sum_{i=1}^m a_i - m$ imaginary trials. In those trials
    you had $(a_i - 1)$ outcomes of value $i$. As an example consider estimating the
    probability of getting different numbers on a six-sided Skewed Dice (where each
    side is a different shape). We will estimate the probabilities of rolling each
    side of this dice by repeatedly rolling the dice $n$ times. This will produce
    $n$ IID samples. For the MAP paradigm, we are going to need a prior on our belief
    of each of the parameters $p_1 \dots p_6$. We want to express that we lightly
    believe that each roll is equally likely.'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 你可以直观地理解 Dirichlet 分布的超参数：想象你已经看到了 $\sum_{i=1}^m a_i - m$ 个虚拟试验。在这些试验中，你有 $(a_i
    - 1)$ 个值为 $i$ 的结果。作为一个例子，考虑估计一个六面偏斜骰子（每个面是不同形状）得到不同数字的概率。我们将通过反复掷骰子 $n$ 次来估计掷出每个面的概率。这将产生
    $n$ 个独立同分布的样本。对于 MAP 模式，我们需要为每个参数 $p_1 \dots p_6$ 的信念设定一个先验。我们希望表达出我们轻信每次掷骰子的概率是相等的。
- en: Before you roll, let's imagine you had rolled the dice six times and had gotten
    one of each possible values. Thus the "prior" distribution would be Dirichlet($2,
    2, 2, 2, 2, 2$). After observing $n_1 + n_2 + \dots + n_6$ new trials with $n_i$
    results of outcome $i$, the "posterior" distribution is Dirichlet($2 + n_1, \dots
    2 + n_6$). Using a prior which represents one imagined observation of each outcome
    is called "Laplace smoothing" and it guarantees that none of your probabilities
    are 0 or 1.
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 在你掷骰子之前，让我们想象你已经掷了六次骰子，并且得到了每种可能值的一个。因此，“先验”分布将是 Dirichlet($2, 2, 2, 2, 2, 2$)。在观察到
    $n_1 + n_2 + \dots + n_6$ 个新的试验结果，其中 $n_i$ 是结果 $i$ 的次数后，“后验”分布是 Dirichlet($2 +
    n_1, \dots 2 + n_6$)。使用代表每个结果的一个想象观察的先验称为“拉普拉斯平滑”，并且它保证了你的概率不会是 0 或 1。
- en: Gamma
  id: totrans-13
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: Gamma
- en: The Gamma($k, \theta$) distribution is the conjugate prior for the $\lambda$
    parameter of the Poisson distribution (It is also the conjugate for Exponential,
    but we won't delve into that).
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: Gamma($k, \theta$) 分布是泊松分布 $\lambda$ 参数的共轭先验分布（它也是指数分布的共轭分布，但我们将不会深入探讨这一点）。
- en: 'The hyperparameters can be interpreted as: you saw $k$ total imaginary events
    during $\theta$ imaginary time periods. After observing $n$ events during the
    next $t$ time periods the posterior distribution is Gamma($k + n, \theta + t$).'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 超参数可以被解释为：你在 $\theta$ 个想象的时间段内观察到了 $k$ 个总想象事件。在接下来的 $t$ 个时间段内观察到 $n$ 个事件后，后验分布是
    Gamma($k + n, \theta + t$)。
- en: For example Gamma(10, 5) would represent having seen 10 imaginary events in
    5 time periods. It is like imagining a rate of 2 with some degree of confidence.
    If we start with that Gamma as a prior and then see 11 events in the next 2 time
    periods our posterior is Gamma(21,7) which is equivalent to an updated rate of
    3\.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，Gamma(10, 5) 将代表在 5 个时间段内观察到 10 个想象事件。这就像想象一个有某种置信度的 2 的速率。如果我们以那个 Gamma
    作为先验，然后在接下来的 2 个时间段内观察到 11 个事件，我们的后验是 Gamma(21,7)，这相当于一个更新的速率为 3。
