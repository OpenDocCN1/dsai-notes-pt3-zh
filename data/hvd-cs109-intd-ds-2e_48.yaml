- en: '[Statistical Inference](../inference/intro-inference.html)'
  id: totrans-2
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[统计推理](../inference/intro-inference.html)'
- en: '[Recommended Reading](../inference/reading-inference.html)'
  id: totrans-3
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[推荐阅读](../inference/reading-inference.html)'
- en: '**Freedman, D., Pisani, R., & Purves, R. (2007). *Statistics* (4th ed.).**'
  id: totrans-4
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**弗里德曼，D.，皮萨尼，R.，珀维斯，R. (2007). *统计学* (第4版).**'
- en: Emphasizes conceptual understanding of estimation and uncertainty. Especially
    strong on interpreting standard errors and margins of error.
  id: totrans-5
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 强调对估计和不确定性的概念理解。特别是在解释标准误差和误差范围方面表现突出。
- en: '**Moore, D. S., McCabe, G. P., & Craig, B. A. (2017). *Introduction to the
    Practice of Statistics* (9th ed.).**'
  id: totrans-6
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**摩尔，D. S.，麦卡布，G. P.，克雷格，B. A. (2017). *统计学实践导论* (第9版).**'
- en: A classic intro text that develops inference from sampling distributions through
    confidence intervals and practical interpretation.
  id: totrans-7
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 一本经典的入门文本，从抽样分布通过置信区间到实际解释，发展了推理。
- en: '**Berger, J. O. (1985). *Statistical Decision Theory and Bayesian Analysis*
    (2nd ed.). Springer-Verlag.**'
  id: totrans-8
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**伯格，J. O. (1985). *统计决策理论与贝叶斯分析* (第2版). Springer-Verlag.**'
- en: A classic and comprehensive reference that develops Bayesian methods from first
    principles of decision theory. Recommended for readers who wish to explore the
    mathematical foundations in more depth.
  id: totrans-9
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 一本经典和全面的参考书，从决策理论的第一原理出发发展贝叶斯方法。推荐给希望更深入探索数学基础的读者。
- en: '**Nate Silver (2016).** *How FiveThirtyEight’s Election Forecast Works.*'
  id: totrans-10
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**内特·西尔弗 (2016).** *五三八大联盟的选举预测如何工作.*'
- en: FiveThirtyEight’s official explanation of the 2016 model, including poll weighting,
    correlated errors, and simulation methodology.
  id: totrans-11
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 五三八大联盟对2016模型的官方解释，包括民意调查加权、相关误差和模拟方法。
- en: '[https://fivethirtyeight.com/features/how-fivethirtyeights-election-forecast-works/](https://fivethirtyeight.com/features/how-fivethirtyeights-election-forecast-works/)'
  id: totrans-12
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: '[https://fivethirtyeight.com/features/how-fivethirtyeights-election-forecast-works/](https://fivethirtyeight.com/features/how-fivethirtyeights-election-forecast-works/)'
- en: '**FiveThirtyEight (2020).** *How Our Presidential Forecast Works (2020 Edition).*'
  id: totrans-13
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**五三八大联盟 (2020).** *我们的总统预测如何工作 (2020版).*'
- en: Details updates to the 2020 model, including adjustments for state and national
    polling correlation, house effects, and uncertainty in turnout and the Electoral
    College.
  id: totrans-14
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 2020模型细节更新，包括对州和国家民意调查相关性的调整、房屋效应以及投票率和选举人团的不确定性。
- en: '[https://fivethirtyeight.com/features/how-our-presidential-forecast-works/](https://fivethirtyeight.com/features/how-our-presidential-forecast-works/)'
  id: totrans-15
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: '[https://fivethirtyeight.com/features/how-our-presidential-forecast-works/](https://fivethirtyeight.com/features/how-our-presidential-forecast-works/)'
- en: '**Andrew Gelman (2020).** *Election Forecasting: Why We’re Not as Sure as We
    Think.*'
  id: totrans-16
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**安德鲁·格尔曼 (2020).** *选举预测：我们并不像我们想象的那么确定.*'
- en: A statistical perspective on model uncertainty, correlated polling errors, and
    the interpretation of forecast probabilities.
  id: totrans-17
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 对模型不确定性、相关民意调查误差以及预测概率解释的统计视角。
- en: '[https://statmodeling.stat.columbia.edu/2020/11/02/election-forecasting-why-were-not-as-sure-as-we-think/](https://statmodeling.stat.columbia.edu/2020/11/02/election-forecasting-why-were-not-as-sure-as-we-think/)'
  id: totrans-18
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: '[https://statmodeling.stat.columbia.edu/2020/11/02/election-forecasting-why-were-not-as-sure-as-we-think/](https://statmodeling.stat.columbia.edu/2020/11/02/election-forecasting-why-were-not-as-sure-as-we-think/)'
- en: '**James, G., Witten, D., Hastie, T., & Tibshirani, R. (2021). *An Introduction
    to Statistical Learning* (2nd ed.). Springer.**'
  id: totrans-19
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**詹姆斯，G.，温滕，D.，哈斯蒂，T.，蒂布希拉尼，R. (2021). *统计学习导论* (第2版). Springer.**'
- en: See the chapter on resampling methods for a clear, concise introduction to the
    bootstrap with intuitive examples and code.
  id: totrans-20
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 查看关于重采样方法的章节，以直观的示例和代码介绍自助法。
- en: '**Efron, B., & Tibshirani, R. J. (1993). *An Introduction to the Bootstrap*.
    Chapman & Hall/CRC.**'
  id: totrans-21
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**埃弗龙，B.，蒂布希拉尼，R. J. (1993). *自助法导论*. Chapman & Hall/CRC.**'
- en: The classic, authoritative treatment. Develops the bootstrap from first principles,
    with theory, practical guidance, and many examples.
  id: totrans-22
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 经典、权威的处理方式。从第一原理发展出自助法，包括理论、实用指导和许多示例。
