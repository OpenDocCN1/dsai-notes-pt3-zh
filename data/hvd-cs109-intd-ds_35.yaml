  id: totrans-369
  prefs: []
  type: TYPE_PRE
  zh: '[PRE110]'
- en: 'Here we want to trim the leading space and then split by space as we did for
    the first line:'
  id: totrans-370
  prefs: []
  type: TYPE_NORMAL
  zh: 在这里，我们想要去除前导空格，然后像处理第一行那样通过空格进行分割：
- en: '[PRE111]'
  id: totrans-371
  prefs: []
  type: TYPE_PRE
  zh: '[PRE111]'
- en: 'We can then join these to generate one name for each column:'
  id: totrans-372
  prefs: []
  type: TYPE_NORMAL
  zh: 然后，我们可以将这些分割后的字符串连接起来，为每一列生成一个名称：
- en: '[PRE112]'
