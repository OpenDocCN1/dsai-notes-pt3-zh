- en: 24.13 Recoding
  id: totrans-378
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 24.13 重新编码
- en: 'Another common operation involving strings is recoding the names of categorical
    variables. Let’s say you have really long names for your levels and you will be
    displaying them in plots, you might want to use shorter versions of these names.
    For example, in character vectors with country names, you might want to change
    “United States of America” to “USA” and “United Kingdom” to UK, and so on. We
    can do this with `case_when`, although the **tidyverse** offers an option that
    is specifically designed for this task: the `recode` function.'
  id: totrans-379
  prefs: []
  type: TYPE_NORMAL
  zh: 另一个常见的涉及字符串的操作是重新编码分类变量的名称。假设你的水平名称很长，你将在图表中显示它们，你可能希望使用这些名称的较短版本。例如，在包含国家名称的字符向量中，你可能希望将“United
    States of America”改为“USA”，将“United Kingdom”改为 UK，等等。我们可以使用 `case_when` 来完成这个任务，尽管
    **tidyverse** 提供了一个专门为此任务设计的选项：`recode` 函数。
- en: 'Here is an example that shows how to rename countries with long names:'
  id: totrans-380
  prefs: []
  type: TYPE_NORMAL
  zh: 下面是一个示例，展示了如何重命名具有长名称的国家：
- en: '[PRE115]'
  id: totrans-381
  prefs: []
  type: TYPE_PRE
  zh: '[PRE115]'
- en: 'Suppose we want to show life expectancy time series by country for the Caribbean:'
  id: totrans-382
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们想要展示加勒比地区的国家预期寿命时间序列：
- en: '[PRE116]'
  id: totrans-383
  prefs: []
  type: TYPE_PRE
  zh: '[PRE116]'
- en: '![](../Images/182f7b434ee3182133a28bff88991746.png)'
  id: totrans-384
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/182f7b434ee3182133a28bff88991746.png)'
- en: 'The plot is what we want, but much of the space is wasted to accommodate some
    of the long country names. We have four countries with names longer than 12 characters.
    These names appear once for each year in the Gapminder dataset. Once we pick nicknames,
    we need to change them all consistently. The `recode` function can be used to
    do this:'
  id: totrans-385
  prefs: []
  type: TYPE_NORMAL
  zh: 我们想要的图表就是这样的，但为了适应一些较长的国家名称，浪费了很多空间。我们有四个国家名称超过 12 个字符。这些名称在 Gapminder 数据集中每年出现一次。一旦我们选择了昵称，就需要一致地更改它们。`recode`
    函数可以用来完成这个任务：
- en: '[PRE117]'
  id: totrans-386
  prefs: []
  type: TYPE_PRE
  zh: '[PRE117]'
- en: '![](../Images/32fc7a2719a657686e25a8d99103e5de.png)'
  id: totrans-387
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/32fc7a2719a657686e25a8d99103e5de.png)'
- en: There are other similar functions in other R packages, such as `recode_factor`
    and `fct_recoder` in the **forcats** package.
  id: totrans-388
  prefs: []
  type: TYPE_NORMAL
  zh: 其他R包中也有类似的函数，例如 **forcats** 包中的 `recode_factor` 和 `fct_recoder`。
- en: 24.14 Exercises
  id: totrans-389
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 24.14 练习
- en: 1\. Complete all lessons and exercises in the [https://regexone.com/](https://regexone.com/)
    online interactive tutorial.
  id: totrans-390
  prefs: []
  type: TYPE_NORMAL
  zh: 1\. 完成所有在 [https://regexone.com/](https://regexone.com/) 在线交互教程中的课程和练习。
- en: '2\. In the `extdata` directory of the **dslabs** package, you will find a PDF
    file containing daily mortality data for Puerto Rico from Jan 1, 2015 to May 31,
    2018\. You can find the file like this:'
  id: totrans-391
  prefs: []
  type: TYPE_NORMAL
  zh: 2\. 在 **dslabs** 包的 `extdata` 目录中，您将找到一个包含从2015年1月1日到2018年5月31日波多黎各每日死亡率数据的PDF文件。您可以通过以下方式找到该文件：
- en: '[PRE118]'
  id: totrans-392
  prefs: []
  type: TYPE_PRE
  zh: '[PRE118]'
- en: 'Find and open the file or open it directly from RStudio. On a Mac, you can
    type:'
  id: totrans-393
  prefs: []
  type: TYPE_NORMAL
  zh: 查找并打开文件或直接从RStudio中打开。在Mac上，您可以输入：
- en: '[PRE119]'
  id: totrans-394
  prefs: []
  type: TYPE_PRE
  zh: '[PRE119]'
- en: 'and on Windows, you can type:'
  id: totrans-395
  prefs: []
  type: TYPE_NORMAL
  zh: 在Windows上，您可以输入：
- en: '[PRE120]'
  id: totrans-396
  prefs: []
  type: TYPE_PRE
  zh: '[PRE120]'
- en: 'Which of the following best describes this file:'
  id: totrans-397
  prefs: []
  type: TYPE_NORMAL
  zh: 以下哪个选项最能描述这个文件：
- en: It is a table. Extracting the data will be easy.
  id: totrans-398
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 它是一个表格。提取数据将很容易。
- en: It is a report written in prose. Extracting the data will be impossible.
  id: totrans-399
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 这是一篇用散文写成的报告。提取数据将是不可能的。
- en: It is a report combining graphs and tables. Extracting the data seems possible.
  id: totrans-400
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 这是一篇结合图表和表格的报告。提取数据似乎是可能的。
- en: It shows graphs of the data. Extracting the data will be difficult.
  id: totrans-401
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 它显示了数据的图表。提取数据将很困难。
- en: '3\. We are going to create a tidy dataset with each row representing one observation.
    The variables in this dataset will be year, month, day, and deaths. Start by installing
    and loading the **pdftools** package:'
  id: totrans-402
  prefs: []
  type: TYPE_NORMAL
  zh: 3\. 我们将创建一个整洁的数据集，其中每一行代表一个观测值。这个数据集中的变量将是年份、月份、日期和死亡人数。首先安装并加载 **pdftools**
    包：
- en: '[PRE121]'
  id: totrans-403
  prefs: []
  type: TYPE_PRE
  zh: '[PRE121]'
- en: Now read-in `fn` using the `pdf_text` function and store the results in an object
    called `txt`. Which of the following best describes what you see in `txt`?
  id: totrans-404
  prefs: []
  type: TYPE_NORMAL
  zh: 现在用 `pdf_text` 函数读取 `fn` 并将结果存储在一个名为 `txt` 的对象中。以下哪个选项最能描述您在 `txt` 中看到的内容？
- en: A table with the mortality data.
  id: totrans-405
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 一个包含死亡率数据的表格。
- en: A character string of length 12\. Each entry represents the text in each page.
    The mortality data is in there somewhere.
  id: totrans-406
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 一个长度为12的字符字符串。每个条目代表每一页中的文本。死亡率数据就在其中某个地方。
- en: A character string with one entry containing all the information in the PDF
    file.
  id: totrans-407
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 一个包含PDF文件中所有信息的条目字符字符串。
- en: An html document.
  id: totrans-408
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 一个HTML文档。
- en: 4\. Extract the ninth page of the PDF file from the object `txt`, then use the
    `str_split` from the **stringr** package so that you have each line in a different
    entry. Call this string vector `s`. Then look at the result and choose the one
    that best describes what you see.
  id: totrans-409
  prefs: []
  type: TYPE_NORMAL
  zh: 4\. 从对象 `txt` 中提取PDF文件的第九页，然后使用 **stringr** 包中的 `str_split` 函数，以便每行都在不同的条目中。将这个字符串向量命名为
    `s`。然后查看结果并选择最能描述您所看到的内容的选项。
- en: It is an empty string.
  id: totrans-410
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 它是一个空字符串。
- en: I can see the figure shown in page 1.
  id: totrans-411
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我能看到第1页显示的图形。
- en: It is a tidy table.
  id: totrans-412
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 它是一个整洁的表格。
- en: I can see the table! But there is a bunch of other stuff we need to get rid
    of.
  id: totrans-413
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 我能看到表格！但还有一大堆其他东西我们需要去除。
- en: 5\. What kind of object is `s` and how many entries does it have?
  id: totrans-414
  prefs: []
  type: TYPE_NORMAL
  zh: 5\. `s` 是什么类型的对象，它有多少条记录？
- en: 6\. We see that the output is a list with one component. Redefine `s` to be
    the first entry of the list. What kind of object is `s` and how many entries does
    it have?
  id: totrans-415
  prefs: []
  type: TYPE_NORMAL
  zh: 6\. 我们看到输出是一个只有一个组件的列表。将 `s` 重新定义为列表的第一个条目。`s` 是什么类型的对象，它有多少条记录？
- en: '7\. When inspecting the string we obtained above, we see a common problem:
    white space before and after the other characters. Trimming is a common first
    step in string processing. These extra spaces will eventually make splitting the
    strings hard so we start by removing them. We learned about the command `str_trim`
    that removes spaces at the start or end of the strings. Use this function to trim
    `s`.'
  id: totrans-416
  prefs: []
  type: TYPE_NORMAL
  zh: 7\. 当检查我们获得的字符串时，我们看到一个常见问题：其他字符前后有空格。修剪是字符串处理中的常见第一步。这些额外的空格最终会使字符串分割变得困难，所以我们首先去除它们。我们学习了如何使用
    `str_trim` 命令去除字符串开头或结尾的空格。使用此函数修剪 `s`。
- en: '8\. We want to extract the numbers from the strings stored in `s`. However,
    there are many non-numeric characters that will get in the way. We can remove
    these, but before doing this we want to preserve the string with the column header,
    which includes the month abbreviation. Use the `str_which` function to find the
    rows with a header. Save these results to `header_index`. Hint: find the first
    string that matches the pattern `2015` using the `str_which` function.'
  id: totrans-417
  prefs: []
  type: TYPE_NORMAL
  zh: 8. 我们想要从存储在 `s` 中的字符串中提取数字。然而，有许多非数字字符会妨碍这个过程。我们可以移除这些字符，但在这样做之前，我们想要保留包含列标题的字符串，该标题包括月份缩写。使用
    `str_which` 函数来找到包含标题的行。将这些结果保存到 `header_index`。提示：使用 `str_which` 函数找到第一个匹配模式
    `2015` 的字符串。
- en: '9\. Now we are going to define two objects: `month` will store the month and
    `header` will store the column names. Identify which row contains the header of
    the table. Save the content of the row into an object called `header`, then use
    `str_split` to help define the two objects we need. Hints: the separator here
    is one or more spaces. Also, consider using the `simplify` argument.'
  id: totrans-418
  prefs: []
  type: TYPE_NORMAL
  zh: 9. 现在我们将定义两个对象：`month` 将存储月份，`header` 将存储列名。确定包含表格标题的行。将行的内容保存到名为 `header` 的对象中，然后使用
    `str_split` 来帮助定义我们需要的两个对象。提示：这里的分隔符是一个或多个空格。同时，考虑使用 `simplify` 参数。
- en: 10\. Notice that towards the end of the page you see a *totals* row followed
    by rows with other summary statistics. Create an object called `tail_index` with
    the index of the *totals* entry.
  id: totrans-419
  prefs: []
  type: TYPE_NORMAL
  zh: 10. 注意到页面末尾有一行名为 *总计* 的行，后面跟着其他摘要统计行的行。创建一个名为 `tail_index` 的对象，用于存储 *总计* 条目的索引。
- en: '11\. Because our PDF page includes graphs with numbers, some of our rows have
    just one number (from the y-axis of the plot). Use the `str_count` function to
    create an object `n` with the number of numbers in each each row. Hint: you can
    write a regex for number like this `\\d+`.'
  id: totrans-420
  prefs: []
  type: TYPE_NORMAL
  zh: 11. 由于我们的PDF页面包含带数字的图表，因此我们的某些行只有一个数字（来自图表的y轴）。使用 `str_count` 函数创建一个名为 `n` 的对象，其中包含每行的数字数量。提示：你可以编写一个像这样的正则表达式来表示数字
    `\\d+`。
- en: 12\. We are now ready to remove entries from rows that we know we don’t need.
    The entry `header_index` and everything before it should be removed. Entries for
    which `n` is 1 should also be removed, and the entry `tail_index` and everything
    that comes after it should be removed as well.
  id: totrans-421
  prefs: []
  type: TYPE_NORMAL
  zh: 12. 我们现在准备从不需要的行中删除条目。`header_index` 以及它之前的内容应该被删除。对于 `n` 为1的条目也应该被删除，以及 `tail_index`
    以及它之后的内容也应该被删除。
- en: '13\. Now we are ready to remove all the non-numeric entries. Do this using
    regex and the `str_remove_all` function. Hint: remember that in regex, using the
    upper case version of a special character usually means the opposite. So `\\D`
    means “not a digit”. Remember you also want to keep spaces.'
  id: totrans-422
  prefs: []
  type: TYPE_NORMAL
  zh: 13. 现在我们准备删除所有非数字条目。使用正则表达式和 `str_remove_all` 函数来完成此操作。提示：记住，在正则表达式中，特殊字符的大写版本通常表示相反的含义。所以
    `\\D` 表示“不是数字”。记住你还需要保留空格。
- en: '14\. To convert the strings into a table, use the `str_split_fixed` function.
    Convert `s` into a data matrix with just the day and death count data. Hints:
    note that the separator is one or more spaces. Make the argument `n` a value that
    limits the number of columns to the values in the 4 columns and the last column
    captures all the extra stuff. Then keep only the first four columns.'
  id: totrans-423
  prefs: []
  type: TYPE_NORMAL
  zh: 14. 要将字符串转换为表格，使用 `str_split_fixed` 函数。将 `s` 转换为仅包含日期和死亡计数数据的数据矩阵。提示：注意分隔符是一个或多个空格。将参数
    `n` 设置为一个限制列数为4列和最后一列捕获所有额外内容的值。然后只保留前四列。
- en: '15\. Now you are almost ready to finish. Add column names to the matrix, including
    one called `day`. Also, add a column with the month. Call the resulting object
    `dat`. Finally, make sure the day is an integer not a character. Hint: use only
    the first five columns.'
  id: totrans-424
  prefs: []
  type: TYPE_NORMAL
  zh: 15. 现在你几乎可以完成工作了。向矩阵中添加列名，包括一个名为 `day` 的列。还要添加一个包含月份的列。将结果对象命名为 `dat`。最后，确保日期是一个整数而不是字符。提示：只使用前五列。
- en: 16\. Now finish it up by tidying `tab` with the `pivot_longer_ function.
  id: totrans-425
  prefs: []
  type: TYPE_NORMAL
  zh: 16. 现在通过使用 `pivot_longer_` 函数整理 `tab`。
- en: 17\. Make a plot of deaths versus day with color to denote year. Exclude 2018
    since we do not have data for the entire year.
  id: totrans-426
  prefs: []
  type: TYPE_NORMAL
  zh: 17. 绘制死亡人数与日期的关系图，用颜色表示年份。排除2018年，因为我们没有整年的数据。
- en: '18\. Now that we have wrangled this data step-by-step, put it all together
    in one R chunk, using the pipe as much as possible. Hint: first define the indexes,
    then write one line of code that does all the string processing.'
  id: totrans-427
  prefs: []
  type: TYPE_NORMAL
  zh: 18. 现在我们已经逐步整理了这些数据，将它们全部放在一个R代码块中，尽可能多地使用管道。提示：首先定义索引，然后写一行代码来完成所有的字符串处理。
- en: '19\. Advanced: let’s return to the MLB Payroll example from the web scraping
    section. Use what you have learned in the web scraping and string processing chapters
    to extract the payroll for the New York Yankees, Boston Red Sox, and Oakland A’s
    and plot them as a function of time.'
  id: totrans-428
  prefs: []
  type: TYPE_NORMAL
  zh: 19. 高级：让我们回到网络爬取部分中的MLB薪资示例。运用你在网络爬取和字符串处理章节中学到的知识，提取纽约洋基队、波士顿红袜队和奥克兰运动家的薪资，并将它们作为时间的函数进行绘图。
