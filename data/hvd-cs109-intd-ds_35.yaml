  type: TYPE_PRE
  zh: '[PRE108]'
- en: We want to create one vector with one name for each column. Using some of the
    functions we have just learned, we do this. Let’s start with `the_names_1`, shown
    above. We want to remove the leading space and anything following the comma. We
    use regex for the latter. Then we can obtain the elements by splitting strings
