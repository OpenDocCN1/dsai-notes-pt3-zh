    splitting `Success rates`. So we use the regex `\\s{2,}`
  id: totrans-366
  prefs: []
  type: TYPE_NORMAL
  zh: 我们想要创建一个向量，其中包含每一列的一个名称。使用我们刚刚学到的某些函数，我们这样做。让我们从上面的 `the_names_1` 开始。我们想要去除前导空格和逗号后面的任何内容。我们使用正则表达式来处理后者。然后我们可以通过分割由空格分隔的字符串来获取元素。我们只想在有两个或更多空格时分割，以避免分割
    `Success rates`。因此，我们使用正则表达式 `\\s{2,}`
- en: '[PRE109]'
  id: totrans-367
  prefs: []
  type: TYPE_PRE
  zh: '[PRE109]'
- en: 'Now we will look at `the_names_2`:'
  id: totrans-368
  prefs: []
  type: TYPE_NORMAL
  zh: 现在，我们将查看 `the_names_2`：
