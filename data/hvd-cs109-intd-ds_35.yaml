  zh: 数据来自发表在国家科学院院刊（PNAS）[^(88)](#fn88)的一篇论文。这是一份广受欢迎的科学期刊。然而，数据不是以电子表格的形式提供的；它是在一个PDF文档中的表格中。以下是表格的截图：
