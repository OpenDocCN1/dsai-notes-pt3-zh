- en: Variance
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 方差
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part2/variance/](https://chrispiech.github.io/probabilityForComputerScientists/en/part2/variance/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part2/variance/](https://chrispiech.github.io/probabilityForComputerScientists/en/part2/variance/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: '***Definition***: Variance of a Random Variable'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义***：随机变量的方差'
- en: 'The variance is a measure of the "spread" of a random variable around the mean.
    Variance for a random variable, X, with expected value $\E[X] = µ$ is: $$ \var(X)
    = \E[(X–µ)^2] $$ Semantically, this is the average distance of a sample from the
    distribution to the mean. When computing the variance often we use a different
    (equivalent) form of the variance equation: $$ \begin{align} \var(X) &= \E[X^2]
    - \E[X]^2 \end{align} $$'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 方差是衡量随机变量围绕均值的“分散”程度的度量。对于期望值 $\E[X] = µ$ 的随机变量 X，其方差为：$$ \var(X) = \E[(X–µ)^2]
    $$ 从语义上讲，这是样本与分布均值的平均距离。在计算方差时，我们通常使用方差方程的不同（等价）形式：$$ \begin{align} \var(X) &=
    \E[X^2] - \E[X]^2 \end{align} $$
- en: 'In the [last section](../../part2/expectation) we showed that Expectation was
    a useful summary of a random variable (it calculates the "weighted average" of
    the random variable). One of the next most important properties of random variables
    to understand is variance: the measure of spread.'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 在[上一节](../../part2/expectation)中，我们展示了期望是随机变量的一个有用总结（它计算随机变量的“加权平均”）。接下来要理解随机变量的最重要的属性之一是方差：即分散程度的度量。
- en: To start, let's consider probability mass functions for three sets of graders.
    When each of them grades an assigment, meant to receive a 70/100, they each have
    a probability distribution of grades that they could give.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 首先，让我们考虑三组评分者的概率质量函数。当每个评分者对一个旨在获得70/100分的作业进行评分时，他们各自都有可能给出的评分的概率分布。
- en: '![](../Images/49f8e5f1269b7ce5f16da8fdf2238437.png) *Distributions of three
    types of peer graders. Data is from a massive online course.*'
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: '![](../Images/49f8e5f1269b7ce5f16da8fdf2238437.png) *三种类型同行评分者的分布。数据来自一个大规模在线课程。*'
- en: 'The distribution for graders in group $C$ has a different *expectation*. The
    average grade that they give when grading an assignment worth 70 is a 55/100\.
    That is clearly not great! But what is the difference between graders $A$ and
    $B$? Both of them have the same expected value (which is equal to the correct
    grade). The graders in group $A$ have a higher "spread". When grading an assignment
    worth 70, they have a reasonable chance of giving it a 100, or of giving it a
    40\. Graders in group $B$ have much less spread. Most of the probability mass
    is close to 70\. You want graders like those in group $B$: in expectation they
    give the correct grade, and they have low spread. As an aside: scores in group
    $B$ came from a probabilistic algorithm over peer grades.'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 组 $C$ 中评分者的分布有不同的*期望值*。他们在评分一个价值70分的作业时给出的平均分数是55/100。这显然不是很好！但评分者 $A$ 和 $B$
    之间的区别是什么？他们都有相同的期望值（等于正确分数）。组 $A$ 中的评分者有更高的“分散”。在评分一个价值70分的作业时，他们有合理的可能性给出100分，或者给出40分。组
    $B$ 中的评分者分散度较小。大部分概率质量都接近70。你希望有像组 $B$ 那样的评分者：在期望上他们给出正确分数，并且他们有较低的分散度。顺便说一句：组
    $B$ 的分数来自一个基于同行评分的概率算法。
- en: 'Theorists wanted a number to describe spread. They invented variance to be
    the average of the distance between values that the random variable could take
    on and the mean of the random variable. There are many reasonable choices for
    the distance function, probability theorists chose squared deviation from the
    mean: $$ \var(X) = \E[(X–µ)^2] $$'
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 理论家想要一个数字来描述分散程度。他们发明了方差，它是随机变量可能取的值与随机变量均值之间的距离的平均值。对于距离函数有许多合理的选择，概率理论家选择了均值的平方偏差：$$
    \var(X) = \E[(X–µ)^2] $$
- en: '***Proof***: $\var(X) = \E[X^2] - \E[X]^2$'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: '***证明***：$\var(X) = \E[X^2] - \E[X]^2$'
- en: It is much easier to compute variance using $\E[X^2] - \E[X]^2$. You certainly
    don't need to know why its an equivalent expression, but in case you were wondering,
    here is the proof.
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 使用 $\E[X^2] - \E[X]^2$ 来计算方差要容易得多。你当然不需要知道为什么它是一个等价的表达式，但如果你想知道，这里是有证明。
- en: '$$ \begin{align} \var(X) &= \E[(X–µ)^2] && \text{Note: } \mu = \E[X]\\ &= \sum_x(x-\mu)^2
    \p(x) && \text{Definition of Expectation}\\ &= \sum_x (x^2 -2\mu x + \mu^2) \P(x)
    && \text{Expanding the square}\\ &= \sum_x x^2\P(x)- 2\mu \sum_x x \P(x) + \mu^2
    \sum_x \P(x) && \text{Propagating the sum}\\ &= \sum_x x^2\P(x)- 2\mu \E[X] +
    \mu^2 \sum_x \P(x) && \text{Substitute def of expectation}\\ &= \E[X^2]- 2\mu
    \E[X] + \mu^2 \sum_x \P(x) && \text{LOTUS } g(x) = x^2 \\ &= \E[X^2]- 2\mu \E[X]
    + \mu^2 && \text{Since }\sum_x \P(x) = 1\\ &= \E[X^2]- 2\E[X]^2 + \E[X]^2 && \text{Since
    }\mu = \E[X]\\ &= \E[X^2]- \E[X]^2 && \text{Cancelation}\\ \end{align} $$'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: $$ \begin{align} \var(X) &= \E[(X–µ)^2] && \text{注意：} \mu = \E[X]\\ &= \sum_x(x-\mu)^2
    \p(x) && \text{期望的定义}\\ &= \sum_x (x^2 -2\mu x + \mu^2) \P(x) && \text{展开平方}\\
    &= \sum_x x^2\P(x)- 2\mu \sum_x x \P(x) + \mu^2 \sum_x \P(x) && \text{传播求和}\\
    &= \sum_x x^2\P(x)- 2\mu \E[X] + \mu^2 \sum_x \P(x) && \text{代入期望的定义}\\ &= \E[X^2]-
    2\mu \E[X] + \mu^2 && \text{因为 } g(x) = x^2 \\ &= \E[X^2]- 2\mu^2 + \mu^2 && \text{因为
    }\sum_x \P(x) = 1\\ &= \E[X^2]- \mu^2 && \text{消去}\\ \end{align} $$
- en: Standard Deviation
  id: totrans-13
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 标准差
- en: Variance is especially useful for comparing the "spread" of two distributions
    and it has the useful property that it is easy to calculate. In general a larger
    variance means that there is more deviation around the mean — more spread. However,
    if you look at the leading example, the units of variance are the square of points.
    This makes it hard to interpret the numerical value. What does it mean that the
    spread is 52 points$^2$? A more interpretable measure of spread is the square
    root of Variance, which we call the Standard Deviation $\std(X) = \sqrt{\var(X)}$.
    The standard deviation of our grader is 7.2 points. In this example folks find
    it easier to think of spread in points rather than points$^2$. As an aside, the
    standard deviation is the average distance of a sample (from the distribution)
    to the mean, using the [euclidean distance](https://en.wikipedia.org/wiki/Euclidean_distance)
    function.
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 方差在比较两个分布的“分散程度”时特别有用，并且它有一个有用的特性，即易于计算。一般来说，较大的方差意味着围绕平均值的偏差更多——分散程度更大。然而，如果你看前面的例子，方差的单位是点的平方。这使得数值难以解释。52点$^2$的分散程度意味着什么？一个更可解释的分散程度度量是方差的平方根，我们称之为标准差
    $\std(X) = \sqrt{\var(X)}$。我们评分者的标准差是7.2点。在这个例子中，人们发现用点而不是点$^2$来考虑分散程度更容易。顺便说一下，标准差是样本（从分布中）到平均值的平均距离，使用的是[欧几里得距离](https://en.wikipedia.org/wiki/Euclidean_distance)函数。
- en: Variance with Continuous Random Variables
  id: totrans-15
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 连续随机变量中的方差
- en: Later in the course reader we will learn about continuous random variables.
    Variance for those types of random variables is very similar. See [Continuos Random
    Variables]({pathToLang}part2/continuous#ex_continuous) for details.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 在课程阅读的后期，我们将学习连续随机变量。这些类型随机变量的方差非常相似。有关详细信息，请参阅[连续随机变量]({pathToLang}part2/continuous#ex_continuous)。
