- en: Exponential Distribution
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 指数分布
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part2/exponential/](https://chrispiech.github.io/probabilityForComputerScientists/en/part2/exponential/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part2/exponential/](https://chrispiech.github.io/probabilityForComputerScientists/en/part2/exponential/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: An exponential distribution measures the **amount** of time until a next event
    occurs. It assumes that the events occur via a poisson process. Note that this
    is different from the Poisson Random Variable which measures number of events
    in a fixed amount of time.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 指数分布衡量的是从下一个事件发生所需的时间**量**。它假设事件通过泊松过程发生。请注意，这与衡量固定时间段内事件数量的泊松随机变量不同。
- en: '**Exponential Random Variable**'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: '**指数随机变量**'
- en: '| Notation: | $X \sim \Exp(\lambda)$ |'
  id: totrans-5
  prefs: []
  type: TYPE_TB
  zh: '| 符号： | $X \sim \Exp(\lambda)$ |'
- en: '| Description: | Time until next events if (a) the events occur with a constant
    mean rate and (b) they occur independently of time since last event. |'
  id: totrans-6
  prefs: []
  type: TYPE_TB
  zh: '| 描述： | 如果（a）事件以恒定的平均速率发生，并且（b）它们与上次事件发生的时间无关，则下一个事件发生的时间。 |'
- en: '| Parameters: | $\lambda \in \mathbb{R}^{+}$, the constant average rate. |'
  id: totrans-7
  prefs: []
  type: TYPE_TB
  zh: '| 参数： | $\lambda \in \mathbb{R}^{+}$，恒定的平均速率。 |'
- en: '| Support: | $x \in \mathbb{R}^+$ |'
  id: totrans-8
  prefs: []
  type: TYPE_TB
  zh: '| 支持集： | $x \in \mathbb{R}^+$ |'
- en: '| PDF equation: | $$f(x) = \lambda e^{-\lambda x}$$ |'
  id: totrans-9
  prefs: []
  type: TYPE_TB
  zh: '| PDF 方程： | $$f(x) = \lambda e^{-\lambda x}$$ |'
- en: '| CDF equation: | $$F(x) = 1 - e^{-\lambda x}$$ |'
  id: totrans-10
  prefs: []
  type: TYPE_TB
  zh: '| CDF 方程： | $$F(x) = 1 - e^{-\lambda x}$$ |'
- en: '| Expectation: | $\E[X] = 1/\lambda$ |'
  id: totrans-11
  prefs: []
  type: TYPE_TB
  zh: '| 期望： | $\E[X] = 1/\lambda$ |'
- en: '| Variance: | $\var(X) = 1/\lambda^2$ |'
  id: totrans-12
  prefs: []
  type: TYPE_TB
  zh: '| 方差： | $\var(X) = 1/\lambda^2$ |'
- en: '| PDF graph: |'
  id: totrans-13
  prefs: []
  type: TYPE_TB
  zh: '| PDF 图： |'
