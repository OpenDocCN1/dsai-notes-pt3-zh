  zh: '<canvas id="exponentialPdf" style="max-height: 400px"></canvas>'
- en: An exponential distribution is a great example of a continuous distribution
    where the [cumulative distribution function (CDF)](../../part2/continuous#cdf)
    is much easier to work with as it allows you to answer probability questions without
    using integrals.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 指数分布是连续分布的一个很好的例子，其中累积分布函数（CDF）更容易处理，因为它允许你回答概率问题而不需要使用积分。
- en: '**Example:** Based on historical data from the USGS, earthquakes of magnitude
    8.0+ happen in a certain location at a rate of 0.002 per year. Earthquakes are
    known to occur via a poisson process. What is the probability of a major earthquake
    in the next 4 years?'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: '**示例：**根据美国地质调查局的历史数据，8.0+ 级别的地震在某个地点以每年 0.002 的速率发生。已知地震是通过泊松过程发生的。在接下来的 4
    年内发生大地震的概率是多少？'
- en: 'Let $Y$ be the years until the next major earthquake. Because $Y$ measures
    time *until* the next event it fits the description of an exponential random variable:
    $Y \sim \Exp(\lambda = 0.002)$. The question is asking, what is $\p(Y < 4)$? \begin{align*}
    \p(Y < 4) &= F_Y(4) && \text{The CDF measures $\p(Y < y)$} \\ &= 1 - e^{- \lambda
    \cdot y} && \text{The CDF of an Exp} \\ &= 1 - e^{- 0.002 \cdot 4} && \text{The
    CDF of an Exp} \\ &\approx 0.008 \end{align*} Note that it is possible to answer
    this question using the PDF, but it will require solving an integral.'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 设 $Y$ 为下一次大地震的年数。因为 $Y$ 衡量的是下一个事件发生的时间，所以它符合指数随机变量的描述：$Y \sim \Exp(\lambda =
    0.002)$。问题是询问 $\p(Y < 4)$？ \begin{align*} \p(Y < 4) &= F_Y(4) && \text{CDF 衡量
    $\p(Y < y)$} \\ &= 1 - e^{- \lambda \cdot y} && \text{指数的 CDF} \\ &= 1 - e^{-
    0.002 \cdot 4} && \text{指数的 CDF} \\ &\approx 0.008 \end{align*} 注意，使用 PDF 也可以回答这个问题，但需要求解一个积分。
- en: Exponential is Memoryless
  id: totrans-19
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 指数分布是无记忆的
- en: 'One way to gain intuition for what is meant by the "poisson process" is through
    the proof that the exponential distribution is ["memoryless"](https://en.wikipedia.org/wiki/Memorylessness).
    That means that the occurrence (or lack of occurrence) of events in the past does
    not change our belief as to how long until the next occurrence. This can be stated
    formally. If $X \sim \Exp(\lambda)$ then for an interval of time until the start
    $s$, and a proceeding, query, interval of time $t$: $$\p(X > s + t | X > s) =
    \p(X > t) $$ Which is something we can prove: \begin{align*} \p(X > s + t | X
    > s) &= \frac{\p(X > s + t \and X > s)}{\p(X > s)} && \text{Def of conditional
    prob.} \\ &= \frac{\p(X > s + t )}{\p(X > s)} && \text{Because $X>s+t$ implies
    $X>s$} \\ &= \frac{1 - F_X(s + t )}{1 - F_X(s)} && \text{Def of CDF} \\ &= \frac{e^{-\lambda
    (s + t)}}{e^{-\lambda s}} && \text{By CDF of Exp} \\ &= e^{-\lambda t} && \text{Simplify}
    \\ &= 1 - F_X(t) && \text{By CDF of Exp} \\ &= \p(X > t) && \text{Def of CDF}
    \\ \end{align*}'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 获取对“泊松过程”含义直观理解的一种方法是通过证明指数分布是["无记忆性"](https://en.wikipedia.org/wiki/Memorylessness)。这意味着过去事件的发生（或未发生）不会改变我们对下一次发生所需时间的信念。这可以正式表述如下。如果
    $X \sim \Exp(\lambda)$，那么对于从开始到 $s$ 的时间间隔，以及随后的查询时间间隔 $t$：$$\p(X > s + t | X >
    s) = \p(X > t) $$ 这是我们能够证明的：\begin{align*} \p(X > s + t | X > s) &= \frac{\p(X
    > s + t \and X > s)}{\p(X > s)} && \text{条件概率的定义} \\ &= \frac{\p(X > s + t )}{\p(X
    > s)} && \text{因为 $X>s+t$ 意味着 $X>s$} \\ &= \frac{1 - F_X(s + t )}{1 - F_X(s)}
    && \text{累积分布函数的定义} \\ &= \frac{e^{-\lambda (s + t)}}{e^{-\lambda s}} && \text{通过指数分布的累积分布函数}
    \\ &= e^{-\lambda t} && \text{简化} \\ &= 1 - F_X(t) && \text{通过指数分布的累积分布函数} \\
    &= \p(X > t) && \text{累积分布函数的定义} \\ \end{align*}
