- en: Random Variables
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 随机变量
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part2/rvs/](https://chrispiech.github.io/probabilityForComputerScientists/en/part2/rvs/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part2/rvs/](https://chrispiech.github.io/probabilityForComputerScientists/en/part2/rvs/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: A Random Variable (RV) is a variable that probabilistically takes on a value
    and they are one of the most important constructs in all of probability theory.
    You can think of an RV as being like a variable in a programming language, and
    in fact random variables are just as important to probability theory as variables
    are to programming. Random Variables take on values, have types and have domains
    over which they are applicable.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 随机变量（RV）是一个以概率取值的变量，它们是概率理论中最重要的结构之一。你可以把 RV 视为编程语言中的一个变量，实际上随机变量对概率理论的重要性与变量对编程的重要性一样。随机变量取值，有类型，并且在其适用范围内有域。
- en: Random variables work with all of the foundational theory we have built up to
    this point. We can define events that occur if the random variable takes on values
    that satisfy a numerical test (eg does the variable equal 5, is the variable less
    than 8).
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 随机变量与我们所建立的所有基础理论都有关。我们可以定义当随机变量取满足数值测试的值时发生的事件（例如，变量是否等于 5，变量是否小于 8）。
- en: 'Lets look at a first example of a random variable. Say we flip three fair coins.
    We can define a random variable Y to be the total number of “heads” on the three
    coins. We can ask about the probability of Y taking on different values using
    the following notation:'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们来看一个随机变量的第一个例子。假设我们抛三枚公平的硬币。我们可以定义一个随机变量 Y，表示三枚硬币上“正面”的总数。我们可以使用以下符号来询问 Y
    取不同值的概率：
- en: '| Let $Y$ be the number of heads on three coin flips |'
  id: totrans-6
  prefs: []
  type: TYPE_TB
  zh: '| 设 $Y$ 为三次抛硬币的正面数 |'
- en: '| $\p(Y = 0)$ = 1/8 | (T, T, T) |'
  id: totrans-7
  prefs: []
  type: TYPE_TB
  zh: '| $\p(Y = 0)$ = 1/8 | (T, T, T) |'
- en: '| $\p(Y = 1)$ = 3/8 | (H, T, T), (T, H, T), (T, T, H) |'
  id: totrans-8
  prefs: []
  type: TYPE_TB
  zh: '| $\p(Y = 1)$ = 3/8 | (H, T, T), (T, H, T), (T, T, H) |'
- en: '| $\p(Y = 2)$ = 3/8 | (H, H, T), (H, T, H), (T, H, H) |'
  id: totrans-9
  prefs: []
  type: TYPE_TB
  zh: '| $\p(Y = 2)$ = 3/8 | (H, H, T), (H, T, H), (T, H, H) |'
- en: '| $\p(Y = 3)$ = 1/8 | (H, H, H) |'
  id: totrans-10
  prefs: []
  type: TYPE_TB
  zh: '| $\p(Y = 3)$ = 1/8 | (H, H, H) |'
- en: '| $\p(Y ≥ 4)$ = 0 |'
  id: totrans-11
  prefs: []
  type: TYPE_TB
  zh: '| $\p(Y ≥ 4)$ = 0 |'
- en: Even though we use the same notation for random variables and for events (both
    use capital letters) they are distinct concepts. An event is a scenario, a random
    variable is an object. The scenario where a random variable takes on a particular
    value (or range of values) is an event. When possible, I will try and use letters
    E,F,G for events and X,Y,Z for random variables.
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 尽管我们为随机变量和事件使用相同的符号（两者都使用大写字母），但它们是不同的概念。事件是一个场景，随机变量是一个对象。随机变量取特定值（或值范围）的场景是一个事件。当可能时，我将尝试使用字母
    E、F、G 表示事件，用 X、Y、Z 表示随机变量。
- en: Using random variables is a convenient notation technique that assists in decomposing
    problems. There are many different types of random variables (indicator, binary,
    choice, Bernoulli, etc). The two main families of random variable types are discrete
    and continuous. Discrete random variables can only take on integer values. Continuous
    random variables can take on decimal values. We are going to develop our intuitions
    using discrete random variable and then introduce continuous.
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 使用随机变量是一种方便的符号技术，有助于分解问题。存在许多不同类型的随机变量（指示符、二元、选择、伯努利等）。随机变量类型的主要两大类是离散型和连续型。离散随机变量只能取整数值。连续随机变量可以取小数值。我们将通过离散随机变量来发展我们的直觉，然后介绍连续型。
- en: Properties of random variables
  id: totrans-14
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 随机变量的性质
- en: 'There are many properties of a random variable some of which we will dive into
    extensively. Here is a brief summary. Each random variable has:'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 随机变量有许多性质，其中一些我们将深入探讨。以下是一个简要总结。每个随机变量都有：
- en: '| Property | Notation Example | Description |'
  id: totrans-16
  prefs: []
  type: TYPE_TB
  zh: '| 属性 | 符号示例 | 描述 |'
- en: '| --- | --- | --- |'
  id: totrans-17
  prefs: []
  type: TYPE_TB
  zh: '| --- | --- | --- |'
- en: '| Meaning |  | A semantic description of the random variable |'
  id: totrans-18
  prefs: []
  type: TYPE_TB
  zh: '| 意义 | | 随机变量的语义描述 |'
- en: '| Symbol | $X$ | A letter used to denote the random variable |'
  id: totrans-19
  prefs: []
  type: TYPE_TB
  zh: '| 符号 | $X$ | 用于表示随机变量的字母 |'
- en: '| Support or Range | $\{0, 1, \dots, 3\}$ | the values the random variable
    can take on |'
  id: totrans-20
  prefs: []
  type: TYPE_TB
  zh: '| 支持集或值域 | $\{0, 1, \dots, 3\}$ | 随机变量可以取的值 |'
- en: '| [Distribution Function](../../part2/pmf) (PMF or PDF) | $\P(X=x)$ | A function
    which maps values the RV can take on to likelihood. |'
  id: totrans-21
  prefs: []
  type: TYPE_TB
  zh: '| [分布函数](../../part2/pmf)（PMF 或 PDF）| $\P(X=x)$ | 一个函数，将 RV 可以取的值映射到可能性。 |'
- en: '| [Expectation](../../part2/expectation) | $\E[X]$ | A weighted average |'
  id: totrans-22
  prefs: []
  type: TYPE_TB
  zh: '| [期望](../../part2/expectation) | $\E[X]$ | 加权平均值 |'
- en: '| [Variance](../../part2/variance) | $\var(X)$ | A measure of spread |'
  id: totrans-23
  prefs: []
  type: TYPE_TB
  zh: '| [方差](../../part2/variance) | $\var(X)$ | 测量分散程度的指标 |'
- en: '| [Standard Deviation](../../part2/variance/#standard_deviation) | $\std(X)$
    | The square root of variance |'
  id: totrans-24
  prefs: []
  type: TYPE_TB
  zh: '| [标准差](../../part2/variance/#standard_deviation) | $\std(X)$ | 方差的平方根 |'
- en: '| Mode |  | The most likely value of the random variable |'
  id: totrans-25
  prefs: []
  type: TYPE_TB
  zh: '| 频率 |  | 随机变量的最可能值 |'
- en: 'You should set a goal of deeply understanding what each of these properties
    mean. There are many more properties than the ones in the table above: properties
    like [entropy](https://en.wikipedia.org/wiki/Entropy_(information_theory)), [median](https://en.wikipedia.org/wiki/Median),
    [skew](https://en.wikipedia.org/wiki/Skewness), [kurtosis](https://en.wikipedia.org/wiki/Kurtosis).'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 你应该设定一个目标，深入理解这些属性的含义。除了上表中的属性之外，还有许多其他属性：如 [熵](https://en.wikipedia.org/wiki/Entropy_(information_theory))、[中位数](https://en.wikipedia.org/wiki/Median)、[偏度](https://en.wikipedia.org/wiki/Skewness)、[峰度](https://en.wikipedia.org/wiki/Kurtosis)。
- en: Random variables vs Events
  id: totrans-27
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 随机变量与事件
- en: 'Random variables and events are two different concepts. An event is an outcome,
    or a set of outcomes, to an experiment. A random variable is a more like an experiment
    -- it will take on an outcome eventually. Probabilities are over events, so if
    you want to talk about probability in the context of a random variable, you must
    construct an event. You can make events by using any of the [Relational Operators](https://en.wikipedia.org/wiki/Relational_operator):
    <, ≤, >, ≥, =, or ≠ (not equal to). This is analogous to coding where you can
    use relational operators to create boolean expressions from numbers.'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 随机变量和事件是两个不同的概念。事件是实验的一个结果，或一组结果。随机变量更像是实验——它最终会得到一个结果。概率是关于事件的，所以如果你想在随机变量的上下文中谈论概率，你必须构造一个事件。你可以使用任何[关系运算符](https://en.wikipedia.org/wiki/Relational_operator)：<,
    ≤, >, ≥, =, 或 ≠（不等于）来构造事件。这类似于编码，你可以使用关系运算符从数字创建布尔表达式。
- en: 'Lets continue our example of the random variable $Y$ which represents the number
    of heads on three coin flips. Here are some events using the variable $Y$:'
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们继续我们的随机变量 $Y$ 的例子，它代表三次抛硬币中正面的数量。以下是使用变量 $Y$ 的一些事件：
- en: '| Event | Meaning | Probability Statement |'
  id: totrans-30
  prefs: []
  type: TYPE_TB
  zh: '| 事件 | 含义 | 概率陈述 |'
- en: '| --- | --- | --- |'
  id: totrans-31
  prefs: []
  type: TYPE_TB
  zh: '| --- | --- | --- |'
- en: '| $Y= 1$ | $Y$ takes on the value 1 (there was one heads) | $\p(Y=1)$ |'
  id: totrans-32
  prefs: []
  type: TYPE_TB
  zh: '| $Y= 1$ | $Y$ 取值为 1（出现了一次正面） | $\p(Y=1)$ |'
- en: '| $Y< 2$ | $Y$ takes on 0 or 1 (note this $Y$ can''t be negative) | $\p(Y<2)$
    |'
  id: totrans-33
  prefs: []
  type: TYPE_TB
  zh: '| $Y< 2$ | $Y$ 取值为 0 或 1（注意这个 $Y$ 不能是负数） | $\p(Y<2)$ |'
- en: '| $X > Y$ | $X$ takes on a value greater than the value $Y$ takes on. | $\p(X>Y)$
    |'
  id: totrans-34
  prefs: []
  type: TYPE_TB
  zh: '| $X > Y$ | $X$ 取的值大于 $Y$ 取的值。 | $\p(X>Y)$ |'
- en: '| $Y= y$ | $Y$ takes on a value represented by non-random variable $y$ | $\p(Y
    = y)$ |'
  id: totrans-35
  prefs: []
  type: TYPE_TB
  zh: '| $Y= y$ | $Y$ 取的值由非随机变量 $y$ 表示 | $\p(Y = y)$ |'
- en: 'You will see many examples like this last one, $\p(Y=y)$, in this text book
    as well as in scientific and math research papers. It allows us to talk about
    the likelihood of $Y$ taking on a value, in general. For example, later in this
    book we will derive that for three coin flips where $Y$ is the number of heads,
    the probability of getting exactly $y$ heads is: $$ \begin{align} \P(Y = y) =
    \frac{0.75}{y!(3-y)!} && \text{If } 0 \leq y \leq 3 \end{align} $$ This statement
    above is a function which takes in a parameter $y$ as input and returns the numeric
    probability $\P(Y=y)$ as output. This particular expression allows us to talk
    about the probability that the number of heads is 0, 1, 2 or 3 all in one expression.
    You can plug in any one of those values for $y$ to get the corresponding probability.
    It is customary to use lower-case symbols for non-random values. The use of an
    equals sign in the "event" can be confusing. For example what does this expression
    say $\P(Y = 1) = 0.375$? It says that the probability that "$Y$ takes on the value
    1" is 0.375\. For discrete random variables this function is called the "[probability
    mass function](../../part2/pmf)" and it is the topic of our next chapter.'
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 你将在本教材以及科学和数学研究论文中看到许多类似最后一个例子，$\p(Y=y)$，的例子。这允许我们一般地讨论 $Y$ 取某个值的可能性。例如，在本书的后面部分，我们将推导出对于三次抛硬币，其中
    $Y$ 是正面的数量，得到恰好 $y$ 个正面的概率是：$$ \begin{align} \P(Y = y) = \frac{0.75}{y!(3-y)!}
    && \text{If } 0 \leq y \leq 3 \end{align} $$ 上面的陈述是一个函数，它接受参数 $y$ 作为输入，并返回数值概率
    $\P(Y=y)$ 作为输出。这个特定的表达式允许我们用一个表达式讨论正面数量为 0、1、2 或 3 的概率。你可以将 $y$ 的任何一个值代入以获得相应的概率。对于非随机值，通常使用小写符号。在“事件”中使用等号可能会令人困惑。例如，这个表达式
    $\P(Y = 1) = 0.375$ 表示什么？它表示“$Y$ 取值为 1”的概率是 0.375。对于离散随机变量，这个函数被称为“[概率质量函数](../../part2/pmf)”并且是我们下一章的主题。
