- en: Counting
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 计数
- en: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part1/counting/](https://chrispiech.github.io/probabilityForComputerScientists/en/part1/counting/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://chrispiech.github.io/probabilityForComputerScientists/en/part1/counting/](https://chrispiech.github.io/probabilityForComputerScientists/en/part1/counting/)
- en: '* * *'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: Although you may have thought you had a pretty good grasp on the notion of counting
    at the age of three, it turns out that you had to wait until now to learn how
    to really count. Aren’t you glad you took this class now?! But seriously, counting
    is like the foundation of a house (where the house is all the great things we
    will do later in this book, such as machine learning). Houses are awesome. Foundations,
    on the other hand, are pretty much just concrete in a hole. But don’t make a house
    without a foundation. It won’t turn out well.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 虽然你可能认为你在三岁时已经很好地掌握了计数的概念，但事实是你必须等到现在才能学会真正计数。你现在上这门课是不是很高兴？！但说真的，计数就像房子的基础（房子是我们将在本书后面做的所有伟大事情，比如机器学习）。房子很棒。另一方面，基础基本上只是洞里的混凝土。但不要没有基础就建房子。那样不会好。
- en: Counting with Steps
  id: totrans-4
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 步骤计数
- en: '***Definition***: Step Rule of Counting (aka Product Rule of Counting)'
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义***：计数步骤规则（又称乘法计数规则）'
- en: If an experiment has two parts, where the first part can result in one of $m$
    outcomes and the second part can result in one of $n$ outcomes regardless of the
    outcome of the first part, then the total number of outcomes for the experiment
    is $m \cdot n$.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 如果一个实验有两个部分，第一部分可以产生 $m$ 种结果之一，而第二部分无论第一部分的结果如何都可以产生 $n$ 种结果之一，那么实验的总结果数是 $m
    \cdot n$。
- en: Rewritten using set notation, the Step Rule of Counting states that if an experiment
    with two parts has an outcome from set $A$ in the first part, where $|A| = m$,
    and an outcome from set $B$ in the second part (where the number of outcomes in
    $B$ is the same regardless of the outcome of the first part), where $|B| = n$,
    then the total number of outcomes of the experiment is $|A||B| = m \cdot n $.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 使用集合符号重写，计数步骤规则表明，如果一个有两个部分的实验在第一部分有来自集合 $A$ 的结果，其中 $|A| = m$，在第二部分有来自集合 $B$
    的结果（无论第一部分的结果如何，$B$ 中的结果数量都是相同的），其中 $|B| = n$，那么实验的总结果数是 $|A||B| = m \cdot n $。
- en: '***Simple Example***: Consider a hash table with 100 buckets. Two arbitrary
    strings are independently hashed and added to the table. How many possible ways
    are there for the strings to be stored in the table? Each string can be hashed
    to one of 100 buckets. Since the results of hashing the first string do not impact
    the hash of the second, there are 100 * 100 = 10,000 ways that the two strings
    may be stored in the hash table.'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: '***简单示例***：考虑一个有 100 个桶的哈希表。两个任意字符串独立地散列并添加到表中。字符串存储在表中的可能方式有多少种？每个字符串可以被散列到
    100 个桶中的任何一个。由于第一个字符串散列的结果不会影响第二个字符串的散列，因此两个字符串存储在哈希表中的方式有 100 * 100 = 10,000
    种。'
- en: '[Peter Norvig](https://en.wikipedia.org/wiki/Peter_Norvig), the author of the
    canonical textbook "Artificial Intelligence" made the following compelling point
    on why computer scientists need to know how to count. To start, let''s set a baseline
    for a really big number: The number of atoms in the observable universe, often
    estimated to be around 10 to the 80th power ($10^{80}$). There certainly are a
    lot of atoms in the universe. As a leading expert said,'
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: '[彼得·诺维格](https://en.wikipedia.org/wiki/Peter_Norvig)，《人工智能》这一经典教科书的作者，提出了以下令人信服的观点，说明了为什么计算机科学家需要知道如何计数。首先，让我们为一个大数设定一个基准：可观测宇宙中原子的数量，通常估计为
    $10^{80}$。宇宙中肯定有很多原子。正如一位领先专家所说，'
- en: “Space is big. Really big. You just won’t believe how vastly, hugely, mind-bogglingly
    big it is. I mean, you may think it’s a long way down the road to the chemist,
    but that’s just peanuts to space.” - Douglas Adams
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: “空间很大。真的很大。你简直无法相信它有多么广大，多么令人难以置信的大。我的意思是，你可能认为化学家在路上的距离很远，但与空间相比，那只是小菜一碟。”
    - 道格拉斯·亚当斯
- en: This number is often used to demonstrate tasks that computers will never be
    able to solve. Problems can quickly grow to an absurd size, and we can understand
    why using the Step Rule of Counting.
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 这个数字经常被用来展示计算机永远无法解决的问题。问题可以迅速增长到荒谬的大小，我们可以通过使用计数步骤规则来理解这一点。
- en: There is an art project to display every possible picture. Surely that would
    take a long time, because there must be many possible pictures. But how many?
    We will assume the color model known as [True Color](https://en.wikipedia.org/wiki/Color_depth#True_color_(24-bit)),
    in which each [pixel](https://en.wikipedia.org/wiki/Pixel) can be one of $2^{24}$
    ≈ 17 million distinct colors.
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 有一个艺术项目旨在展示所有可能的图片。这肯定需要很长时间，因为必须有很多可能的图片。但有多少呢？我们将假设一个名为[真彩色](https://en.wikipedia.org/wiki/Color_depth#True_color_(24-bit))的颜色模型，其中每个[像素](https://en.wikipedia.org/wiki/Pixel)可以是
    $2^{24}$ ≈ 1700万种不同颜色中的一种。
- en: How many distinct pictures can you generate from (a) a smartphone camera shown
    with 12 million pixels, (b) a grid with 300 pixels, and (c) a grid with just 12
    pixels?
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 你可以从以下哪些中生成多少不同的图片：(a) 1200万像素的手机相机，(b) 300像素的网格，和(c) 只有12像素的网格？
- en: '![](../Images/02a00bb8e3001521e71972abe87fd520.png)'
  id: totrans-14
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/02a00bb8e3001521e71972abe87fd520.png)'
- en: 'Answer: We can use the step rule of counting. An image can be created one pixel
    at a time, step by step. Each time we choose a pixel you can select its color
    out of 17 million choices. An array of $n$ pixels produces (17 million)$^n$ different
    pictures. (17 million)$^{12}$ ≈ $10^{86}$, so the tiny 12-pixel grid produces
    a million times more pictures than the number of atoms in the universe! How about
    the 300 pixel array? It can produce $10^{2167}$ pictures. You may think the number
    of atoms in the universe is big, but that’s just peanuts to the number of pictures
    in a 300-pixel array. And 12M pixels? $10^{86696638}$ pictures.'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 答案：我们可以使用计数步骤规则。图像可以逐个像素、逐步创建。每次选择一个像素时，你可以在1700万种颜色中选择其颜色。一个包含 $n$ 个像素的数组可以产生
    $(17 million)^n$ 种不同的图片。$(17 million)^{12}$ ≈ $10^{86}$，所以这个12像素的小网格产生的图片数量比宇宙中原子数量多一百万倍！那么300像素的网格呢？它可以产生
    $10^{2167}$ 张图片。你可能认为宇宙中原子的数量很大，但与300像素网格中的图片数量相比，那只是小菜一碟。12M像素呢？$10^{86696638}$
    张图片。
- en: '***Example***: Unique states of Go'
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: '***示例***：围棋的独特状态'
- en: For example, a Go board has 19 × 19 points where a user can place a stone. Each
    of the points can be empty or occupied by black or white stone. By the Step Rule
    of Counting, we can compute the number of unique board configurations.
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，围棋棋盘有19×19个点，用户可以在这些点上放置棋子。每个点可以是空的，或者被黑子或白子占据。通过计数步骤规则，我们可以计算出独特的棋盘配置数量。
- en: '![](../Images/ebe162d4539435e74065f899e2ce1536.png)'
  id: totrans-18
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/ebe162d4539435e74065f899e2ce1536.png)'
- en: '*In Go there are 19x19 points. Each point can have a black stone, white stone,
    or no stone at all.*'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: '*在围棋中，有19×19个点。每个点可以放置黑子、白子，或者完全不放子。*'
- en: 'Here we are going to construct the board one point at a time, step by step.
    Each time we add a point we have a unique choice where we can decide to make the
    point one of three options: {Black, White, No Stone}. Using this construction
    we can apply the Step Rule of Counting. If there was only one point, there would
    be three unique board configurations. If there were four points you would have
    $3 \cdot 3 \cdot 3 \cdot 3 = 81$ unique combinations. In Go there are $3^{(19×19)}
    ≈ 10^{172}$ possible board positions. The way we constructed our board didn''t
    take into account which ones were illegal by the rules of Go. It turns out that
    "only" about $10^{170}$ of those positions are legal. That is about the square
    of the number of atoms in the universe. In other words: if there was another universe
    of atoms for every single atom, only then would there be as many atoms in the
    universe as there are unique configurations of a Go board.'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 在这里，我们将一步一步地构建棋盘，每次添加一个点，我们都有一个独特的选择，可以决定将该点设置为三种选项之一：{黑子，白子，无子}。使用这种构建方法，我们可以应用计数步骤规则。如果只有一个点，就会有三种独特的棋盘配置。如果有四个点，你会有
    $3 \cdot 3 \cdot 3 \cdot 3 = 81$ 种独特的组合。在围棋中，有 $3^{(19×19)} ≈ 10^{172}$ 种可能的棋盘位置。我们构建棋盘的方式没有考虑到哪些是违反围棋规则的非法位置。结果是，“只有”大约
    $10^{170}$ 个位置是合法的。这大约是宇宙中原子数量的平方。换句话说：如果每个原子都有一个原子组成的另一个宇宙，那么宇宙中的原子数量才会和围棋棋盘的独特配置数量一样多。
- en: As a computer scientist this sort of result can be very important. While computers
    are powerful, an algorithm which needed to store each configuration of the board
    would not be a reasonable approach. No computer can store more information than
    atoms in the universe squared!
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 作为一名计算机科学家，这类结果可能非常重要。虽然计算机很强大，但需要存储棋盘每种配置的算法并不是一个合理的方案。没有计算机能存储比宇宙中原子数量平方还多的信息！
- en: The above argument might leave you feeling like some problems are incredibly
    hard as a result of the product rule of counting. Let’s take a moment to talk
    about how the product rule of counting can help! Most logarithmic time algorithms
    leverage this principle.
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 上述论点可能会让你觉得一些问题由于计数法则的乘积规则而变得极其困难。让我们花一点时间来谈谈计数法则的乘积规则是如何帮助我们的！大多数对数时间算法都利用了这个原则。
- en: Imagine you are building a machine learning system that needs to learn from
    data and you want to synthetically generate 10 million unique data points for
    it. How many steps would you need to encode to get to 10 million? Assuming that
    at each step you have a binary choice, the number of unique data points you produce
    will be $2^n$ by the Step Rule of counting. If we chose $n$ such that $\log_{2}
    10,000,000 < n$. You would only need to encode $n=24$ binary decisions.
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 想象一下，你正在构建一个需要从数据中学习的机器学习系统，并且你想要为它合成生成一千万个独特的数据点。你需要编码多少步才能达到一千万？假设在每一步你都有一个二选一的选择，根据计数法则的步数规则，你产生的独特数据点的数量将是
    $2^n$。如果我们选择 $n$ 使得 $\log_{2} 10,000,000 < n$。你只需要编码 $n=24$ 个二进制决策。
- en: '***Example***: Rolling two dice. Two 6-sided dice, with faces numbered 1 through
    6, are rolled. How many possible outcomes of the roll are there?'
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: '***示例***：掷两个骰子。两个六面的骰子，面数为1到6，被掷出。掷骰子的可能结果有多少种？'
- en: '* * *'
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: '***Solution***: Note that we are not concerned with the total value of the
    two die ("die" is the singular form of "dice"), but rather the set of all explicit
    outcomes of the rolls. Since the first die can come up with 6 possible values
    and the second die similarly can have 6 possible values (regardless of what appeared
    on the first die), the total number of potential outcomes is 36 (= 6 × 6). These
    possible outcomes are explicitly listed below as a series of pairs, denoting the
    values rolled on the pair of dice:'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: '***解答***：注意，我们并不关心两个骰子的总数值（“die”是“dice”的单数形式），而是关心所有掷骰子的明确结果集合。由于第一个骰子可以出现6种可能值，第二个骰子也有6种可能值（无论第一个骰子出现了什么），所以潜在的结果总数是36（=
    6 × 6）。这些可能的结果明确地列在下面，作为一系列的配对，表示这对骰子掷出的数值：'
- en: Counting with **or**
  id: totrans-27
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 使用 **或** 进行计数
- en: If you want to consider the total number of unique outcomes, when outcomes can
    come from source $A$ **or** source $B$, then the equation you use depends on whether
    or not there are outcomes which are both in $A$ and $B$. If not, you can use the
    simpler "Mutually Exclusive Counting" rule. Otherwise you need to use the slightly
    more involved Inclusion Exclusion rule.
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你想要考虑所有独特结果的总数，当结果可以来自源 $A$ **或**源 $B$ 时，你使用的方程取决于是否有一些结果同时存在于 $A$ 和 $B$ 中。如果没有，你可以使用更简单的“互斥计数”规则。否则，你需要使用稍微复杂一些的包含排除规则。
- en: '***Definition***: Mutually Exclusive Counting'
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义***：互斥计数'
- en: If the outcome of an experiment can either be drawn from set $A$ or set $B$,
    where none of the outcomes in set $A$ are the same as any of the outcomes in set
    $B$ (called mutual exclusion), then there are $|A \or B| = |A|+|B|$ possible outcomes
    of the experiment.
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: 如果一个实验的结果可以来自集合 $A$ 或集合 $B$，其中集合 $A$ 中的任何结果都不与集合 $B$ 中的任何结果相同（称为互斥），那么实验的可能结果有
    $|A \or B| = |A|+|B|$ 种。
- en: '***Example***: Sum of Routes. A route finding algorithm needs to find routes
    from Nairobi to Dar Es Salaam. It finds routes that either pass through Mt Kilimanjaro
    or Mombasa. There are 20 routes that pass through Mt Kilimanjaro, 15 routes that
    pass through Mombasa and 0 routes which pass through both Mt Kilimanjaro and Mombasa.
    How many routes are there total?'
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: '***示例***：路线总和。一个路线查找算法需要找到从内罗毕到达累斯萨拉姆的路线。它找到了通过乞力马扎罗山或蒙巴萨的路线。有20条通过乞力马扎罗山的路线，15条通过蒙巴萨的路线，以及0条同时通过乞力马扎罗山和蒙巴萨的路线。总共有多少条路线？'
- en: '* * *'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: '***Solution***: Routes can come from either Mt Kilimanjaro **or** Mombasa.
    The two sets of routes are mutually exclusive as there are zero routes which are
    in both groups. As such the total number of routes is addition: 20 + 15 = 35.'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: '***解答***：路线可以来自乞力马扎罗山 **或** 蒙巴萨。这两组路线是互斥的，因为两组中都没有共同的路线。因此，路线的总数是加法：20 + 15
    = 35。'
- en: If you can show that two groups are mutually exclusive counting becomes simple
    addition. Of course not all sets are mutually exclusive. In the example above,
    imagine there had been a single route which went through both Mt Kilimanjaro and
    Mombasa. We would have double counted that route because it would be included
    in both the sets. If sets are not mutually exclusive, counting the **or** is still
    addition, we simply need to take into account any double counting.
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你能够证明两个组是互斥的，计数就变得简单了，只需要进行加法。当然，并不是所有的集合都是互斥的。在上面的例子中，假设有一条路线穿过乞力马扎罗山和蒙巴萨。我们会重复计算这条路线，因为它会被包含在这两个集合中。如果集合不是互斥的，计数“或”仍然是加法，我们只需要考虑任何重复计数。
- en: '***Definition***: Inclusion-Exclusion Counting'
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: '***定义***：包含-排除计数'
- en: If the outcome of an experiment can either be drawn from set $A$ or set $B$,
    and sets $A$ and $B$ may potentially overlap (i.e., it is not the case that $A$
    and $B$ are mutually exclusive), then the number of outcomes of the experiment
    is $|A \or B| = |A|+|B| −|A \and B|$.
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 如果实验的结果可以来自集合 $A$ 或集合 $B$，并且集合 $A$ 和 $B$ 可能重叠（即 $A$ 和 $B$ 不是互斥的），那么实验的结果数量是
    $|A \or B| = |A|+|B| −|A \and B|$。
- en: Note that the Inclusion-Exclusion Principle generalizes the Sum Rule of Counting
    for arbitrary sets $A$ and $B$. In the case where $A \and B = ∅$, the Inclusion-Exclusion
    Principle gives the same result as the Sum Rule of Counting since $|A \and B|
    = 0$.
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，包含-排除原理推广了任意集合 $A$ 和 $B$ 的计数求和规则。在 $A \and B = ∅$ 的情况下，包含-排除原理给出了与计数求和规则相同的结果，因为
    $|A \and B| = 0$。
- en: '***Example***: An 8-bit string (one byte) is sent over a network. The valid
    set of strings recognized by the receiver must either start with "01" or end with
    "10". How many such strings are there?'
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: '***示例***：一个8位字符串（一个字节）通过网络发送。接收者识别的有效字符串集合必须以 "01" 开头或以 "10" 结尾。有多少这样的字符串？'
- en: '* * *'
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: '***Solution***: The potential bit strings that match the receiver’s criteria
    can either be the 64 strings that start with "01" (since that last 6 bits are
    left unspecified, allowing for $2^6 = 64$ possibilities) or the 64 strings that
    end with "10" (since the first 6 bits are unspecified). Of course, these two sets
    overlap, since strings that start with "01" and end with "10" are in both sets.
    There are $2^4$ = 16 such strings (since the middle 4 bits can be arbitrary).
    Casting this description into corresponding set notation, we have: $|A|$ = 64,
    $|B|$ = 64, and $|A \and B|$ = 16, so by the Inclusion-Exclusion Principle, there
    are 64 + 64 − 16 = 112 strings that match the specified receiver’s criteria.'
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: '***解答***：符合接收者标准的潜在位串可以是以 "01" 开头的64个字符串（因为最后6位是未指定的，允许有 $2^6 = 64$ 种可能性）或者以
    "10" 结尾的64个字符串（因为前6位是未指定的）。当然，这两个集合是重叠的，因为以 "01" 开头并以 "10" 结尾的字符串同时存在于这两个集合中。有
    $2^4$ = 16 个这样的字符串（因为中间的4位可以是任意的）。将这个描述转换为相应的集合表示法，我们有：$|A|$ = 64，$|B|$ = 64，$|A
    \and B|$ = 16，所以根据包含-排除原理，有 64 + 64 − 16 = 112 个字符串符合指定的接收者标准。'
- en: Overcounting and Correcting
  id: totrans-41
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 过度计数和纠正
- en: One strategy for counting is sometimes to overcount a solution and then correct
    for any duplicates. This is especially common when it is easier to generate all
    outcomes under some relaxed assumptions, or someone introduces contraints. If
    you can argue that you have over-counted each element the same multiple number
    of times, you can simply correct by using division. If you can count exactly how
    many elements were over-counted you can correct using subtraction.
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: 计数的一个策略有时是先对解决方案进行过度计数，然后纠正任何重复的计数。这在更容易在放宽的假设下生成所有结果，或者有人引入约束时尤其常见。如果你能论证你过度计数的每个元素都是相同多次数，你可以简单地通过除法来纠正。如果你能精确地计算出有多少元素被过度计数，你可以通过减法来纠正。
- en: 'As a simple example to demonstrate the point, lets revisit the problem of generating
    all images, but this time lets just have 4 pixels (2x2) and each pixel can only
    be **blue** or white. How many unique images are there? Generating any image is
    a four step process where you choose each pixel one at a time. Since each pixel
    has two choices there are $2^4 = 16$ unique images (they are not exactly Picasso
    — but hey, it''s 4 pixels):'
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: 作为证明这个观点的简单例子，让我们重新审视生成所有图像的问题，但这次我们只有4个像素（2x2），每个像素只能是**蓝色**或白色。有多少种独特的图像？生成任何图像是一个四步过程，你一次选择一个像素。由于每个像素有两个选择，所以有
    $2^4 = 16$ 种独特的图像（它们并不完全是毕加索的作品——但嘿，这是4个像素）：
- en: 'Now lets say we add in a new "constraint" that we only want to accept pictures
    which have an odd number of pixels turned blue. There are two ways of getting
    to the answer. You could start out with the original 16 and work out that you
    need to subtract off 8 images that have either 0, 2 or 4 blue pixels (which is
    easier to work out after the next chapter). Or you could have counted up using
    Mutually Exclusive Counting: there are 4 ways of making an image with 1 pixel
    and 4 ways of making an image with 3\. Both approaches lead to the same answer,
    8.'
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 现在假设我们增加一个新的“约束”条件，即我们只想接受那些蓝色像素数量为奇数的图片。有两种方法可以得到答案。你可以从最初的16张图片开始，计算出你需要减去8张图片，这些图片要么有0个、2个或4个蓝色像素（这在下一章之后更容易计算）。或者你可以使用互斥计数法进行计数：有4种方法可以制作出只有1个蓝色像素的图片，有4种方法可以制作出有3个蓝色像素的图片。两种方法都会得到相同的答案，即8。
- en: 'Next lets add a much harder constraint: mirror indistinction. If you can flip
    any image horizontally to create another, they are no longer considered unique.
    For example these two both show up in our set of 8 odd-blue pixel images, but
    they are now considered to be the same (they are indistinct after a horizontal
    flip):'
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: 接下来，让我们添加一个更难的约束条件：镜像不可区分性。如果你可以水平翻转任何图片以创建另一个，它们就不再被认为是独特的。例如，这两张图片都出现在我们的8张奇数蓝色像素图片集中，但现在它们被认为是相同的（在水平翻转后它们是不可区分的）：
- en: 'How many images have an odd number of pixels taking into account mirror indistinction?
    The answer is that for each unique image with odd numbers of blue pixels, under
    this new constraint, you have counted it twice: itself and its horizonal flip.
    To convince yourself that each image has been counted *exactly* twice you can
    look at all of the examples in the set of 8 images with an odd number of blue
    pixels. Each image is next to one which is indistinct after a horizontal flip.
    Since each image was counted exactly twice in the set of 8, we can divide by two
    to get the updated count. If we list them out we can confirm that there are 8/2=4
    images left after this last constraint:'
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: 考虑到镜像不可区分性，有多少图片的蓝色像素数量为奇数？答案是，对于每个具有奇数蓝色像素的独特图片，在这个新的约束条件下，你已经将其计算了两次：本身和它的水平翻转。为了让你确信每个图片都被精确地计算了两次，你可以查看包含8张具有奇数蓝色像素的图片集中的所有示例。每个图片旁边都有一个在水平翻转后不可区分的图片。由于每个图片在8张图片集中都被精确地计算了两次，我们可以除以2来得到更新后的计数。如果我们列出它们，我们可以确认在最后一个约束条件之后，剩下8/2=4张图片。
- en: Applying any math (counting included) to novel contexts can be as much an art
    as it is a science. In the next chapter we will build a useful toolset from the
    basic first principles of counting by steps, and counting by "or".
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: 将任何数学（包括计数）应用于新颖的情境，可以像是一门艺术，也可以是一门科学。在下一章中，我们将通过逐步计数和“或”计数的基本第一原理构建一个有用的工具集。
