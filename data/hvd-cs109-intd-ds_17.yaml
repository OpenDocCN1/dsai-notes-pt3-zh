- en: 9.8.4 Boxplots
  id: totrans-128
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 9.8.4 箱线图
- en: The geometry for boxplot is `geom_boxplot`. As discussed, boxplots are useful
    for comparing distributions. For example, below are the previously shown heights
    for women, but compared to men. For this geometry, we need arguments `x` as the
    categories, and `y` as the values.
  id: totrans-129
  prefs: []
  type: TYPE_NORMAL
  zh: 箱线图的几何形状是`geom_boxplot`。正如讨论的那样，箱线图用于比较分布。例如，下面是之前展示的女性身高，但与男性相比。对于这个几何形状，我们需要`x`作为类别，`y`作为值的参数。
