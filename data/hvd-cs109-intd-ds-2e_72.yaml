- en: '[Recommended reading](../ml/reading-ml.html)'
  id: totrans-3
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[推荐阅读](../ml/reading-ml.html)'
- en: '**Hastie, T., Tibshirani, R., & Friedman, J. (2009). *The Elements of Statistical
    Learning: Data Mining, Inference, and Prediction* (2nd ed.). Springer.**'
  id: totrans-4
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Hastie, T., Tibshirani, R., & Friedman, J. (2009). *The Elements of Statistical
    Learning: Data Mining, Inference, and Prediction* (2nd ed.). Springer.**'
- en: A foundational text covering the theory and mathematics behind modern machine
    learning methods, including regression, classification, and ensemble techniques.
  id: totrans-5
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 这是一本基础教材，涵盖了现代机器学习方法的背后理论和数学，包括回归、分类和集成技术。
- en: '**James, G., Witten, D., Hastie, T., & Tibshirani, R. (2023). *An Introduction
    to Statistical Learning with Applications in R* (3rd ed.). Springer.**'
  id: totrans-6
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**James, G., Witten, D., Hastie, T., & Tibshirani, R. (2023). *An Introduction
    to Statistical Learning with Applications in R* (3rd ed.). Springer.** '
- en: A more accessible companion to *The Elements of Statistical Learning*, focused
    on practical implementation in R with extensive code examples.
  id: totrans-7
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 这本书是《统计学习基础》的更易读的伴侣，专注于在R中的实际应用，并提供了大量的代码示例。
- en: '**Bishop, C. M. (2006). *Pattern Recognition and Machine Learning*. Springer.**'
  id: totrans-8
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Bishop, C. M. (2006). *Pattern Recognition and Machine Learning*. Springer.**'
- en: A comprehensive reference for probabilistic and Bayesian approaches to machine
    learning, suitable for readers seeking a deeper mathematical understanding.
  id: totrans-9
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 这是一本全面介绍概率和贝叶斯方法在机器学习中的应用的参考书，适合寻求更深入数学理解的读者。
- en: '**Ripley, B. D. (1996). *Pattern Recognition and Neural Networks*. Cambridge
    University Press.**'
  id: totrans-10
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Ripley, B. D. (1996). *Pattern Recognition and Neural Networks*. Cambridge
    University Press.**'
- en: A classic text that bridges traditional statistical modeling with early neural
    network methods, emphasizing connections between machine learning and statistics.
  id: totrans-11
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 这是一本经典教材，将传统统计建模与早期神经网络方法联系起来，强调机器学习与统计学之间的联系。
- en: '**Wood, S. N. (2017). *Generalized Additive Models: An Introduction with R*
    (2nd ed.). CRC Press.**'
  id: totrans-12
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Wood, S. N. (2017). *Generalized Additive Models: An Introduction with R*
    (2nd ed.). CRC Press.**'
- en: The definitive reference for understanding and applying GAMs using the **mgcv**
    package. Wood introduces spline-based smoothing, penalization, model selection,
    and diagnostics with clear R examples.
  id: totrans-13
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 这本书是理解和应用GAMs（广义加性模型）使用**mgcv**包的权威参考。Wood通过清晰的R示例介绍了基于样条的光滑、惩罚、模型选择和诊断。
- en: '**Wand, M. P. & Jones, M. C. (1995). *Kernel Smoothing*. Chapman & Hall/CRC.**'
  id: totrans-14
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Wand, M. P. & Jones, M. C. (1995). *Kernel Smoothing*. Chapman & Hall/CRC.**'
- en: A classic text offering a rigorous treatment of kernel smoothing methods, bandwidth
    selection, and bias-variance trade-offs, suitable for readers seeking a mathematical
    foundation.
  id: totrans-15
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 一本经典教材，对核平滑方法、带宽选择和偏差-方差权衡进行了严谨的论述，适合寻求数学基础的读者。
- en: '**Simonoff, J. S. (1996). *Smoothing Methods in Statistics*. Springer.**'
  id: totrans-16
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Simonoff, J. S. (1996). *Smoothing Methods in Statistics*. Springer.**'
- en: A comprehensive overview of smoothing techniques across regression, density
    estimation, and nonparametric modeling, with intuitive explanations and numerous
    examples.
  id: totrans-17
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 这本书全面概述了回归、密度估计和非参数模型中的平滑技术，提供了直观的解释和大量的示例。
- en: '**Kaufman, L. & Rousseeuw, P. J. (2005). *Finding Groups in Data: An Introduction
    to Cluster Analysis.* Wiley.** — A foundational text on clustering, introducing
    key methods such as partitioning, hierarchical clustering, and density-based approaches,
    with practical insights and examples.'
  id: totrans-18
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Kaufman, L. & Rousseeuw, P. J. (2005). *Finding Groups in Data: An Introduction
    to Cluster Analysis.* Wiley.** — 这是一本关于聚类的奠基性教材，介绍了诸如划分、层次聚类和基于密度的方法等关键方法，并提供了实用的见解和示例。'
- en: '**Maechler, M., Rousseeuw, P., Struyf, A., Hubert, M., & Hornik, K. (2025).
    *cluster: Cluster Analysis Basics and Extensions.* R package version 2.1.8.**
    Available at: [https://cran.r-project.org/package=cluster](https://cran.r-project.org/package=cluster)'
  id: totrans-19
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Maechler, M., Rousseeuw, P., Struyf, A., Hubert, M., & Hornik, K. (2025).
    *cluster: Cluster Analysis Basics and Extensions.* R包版本2.1.8。** 可在：[https://cran.r-project.org/package=cluster](https://cran.r-project.org/package=cluster)'
- en: — The main R package for clustering, providing implementations of many of the
    methods described in Kaufman & Rousseeuw (2005), along with practical extensions
    and tools for applied work.
  id: totrans-20
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 这是R语言中用于聚类的核心包，提供了Kaufman & Rousseeuw (2005)中描述的许多方法的实现，以及实际应用工作的扩展工具和工具。
- en: '**Kuhn, M. & Johnson, K. (2013). *Applied Predictive Modeling*. Springer.**'
  id: totrans-21
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Kuhn, M. & Johnson, K. (2013). *Applied Predictive Modeling*. Springer.**'
- en: A practical guide to building, tuning, and evaluating predictive models in R,
    with extensive coverage of the **caret** package.
  id: totrans-22
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: R语言中构建、调整和评估预测模型的实用指南，全面涵盖**caret**包的内容。
