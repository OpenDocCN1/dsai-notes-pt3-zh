- en: 11  Bayesian Statistics
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 11 贝叶斯统计
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/inference/bayes.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/inference/bayes.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook-part-2/inference/bayes.html](https://rafalab.dfci.harvard.edu/dsbook-part-2/inference/bayes.html)
- en: '[Statistical Inference](../inference/intro-inference.html)'
  id: totrans-2
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[统计推断](../inference/intro-inference.html)'
- en: '[11  Bayesian Statistics](../inference/bayes.html)'
  id: totrans-3
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[11 贝叶斯统计](../inference/bayes.html)'
- en: 'In 2016, FiveThirtyEight showed this chart depicting distributions for the
    percent of the popular vote for each candidate:'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 在2016年，FiveThirtyEight展示了这张图表，描绘了每位候选人的得票率分布：
- en: '![](../Images/a7e758dfce18ed3fed30083bdf344783.png)'
  id: totrans-5
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/a7e758dfce18ed3fed30083bdf344783.png)'
- en: The colored areas represent values with an 80% chance of including the actual
    result, according to the FiveThirtyEight model.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 彩色区域表示根据FiveThirtyEight模型，有80%的概率包含实际结果。
- en: But what does this mean in the context of the theory we have previously covered,
    in which these percentages are considered fixed? Furthermore, election forecasters
    make probabilistic statements such as “Obama has a 90% chance of winning the election.”
    Note that in the context of an urn model, this would be equivalent to stating
    that the probability of \(p>0.5\) is 90%. However, in the urn model \(p\) is a
    fixed parameter and it does not make sense to talk about probability. With Bayesian
    statistics, we assume \(p\) is a random variable, and thus, a statement such as
    “90% chance of winning” is consistent with the mathematical approach. Forecasters
    also use models to describe variability at different levels. For example, sampling
    variability, pollster to pollster variability, day to day variability, and election
    to election variability. One of the most successful approaches used for this are
    hierarchical models, which can be explained in the context of Bayesian statistics.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 但在我们之前讨论的理论背景下，这些百分比被认为是固定的，这又意味着什么呢？此外，选举预测者会做出概率性陈述，例如“奥巴马有90%的胜选概率。”请注意，在抽屉模型中，这相当于说\(p>0.5\)的概率是90%。然而，在抽屉模型中\(p\)是一个固定参数，谈论概率是没有意义的。在贝叶斯统计中，我们假设\(p\)是一个随机变量，因此，“90%的胜选概率”与数学方法是一致的。预测者还使用模型来描述不同层面的变异性。例如，抽样变异性、民意调查员之间的变异性、日日变异性以及选举之间的变异性。用于此目的的最成功的方法之一是层次模型，这可以在贝叶斯统计的背景下进行解释。
- en: 'In this chapter, we will briefly describe Bayesian statistics. We use three
    cases studies: 1) interpreting diagnostic tests for a rare disease, and 2) estimating
    the probability of Hillary Clinton winning the popular vote in 2016 using pre-election
    poll data.'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 在本章中，我们将简要介绍贝叶斯统计。我们使用三个案例研究：1）解释罕见疾病的诊断测试，2）使用选举前的民意调查数据估计希拉里·克林顿在2016年赢得普选票的概率。
- en: '*The approach described in the previous chapters, where parameters are treated
    as fixed, is known as the *frequentist approach*. The term frequentist comes from
    the idea that probability is interpreted as the long-run *frequency* of events.
    Parameters are considered fixed and unknown, while data is seen as random. Frequentist
    methods rely on how often an outcome would occur if an experiment were repeated
    many times, focusing on the frequency of observed results rather than assigning
    probabilities to the parameters themselves.*  *## 11.1 Bayes theorem'
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: '*前几章中描述的方法，其中参数被视为固定，被称为频率派方法。频率派这个术语来源于概率被解释为事件长期频率的思想。参数被认为是固定和未知的，而数据被视为随机的。频率派方法依赖于如果实验重复多次，结果出现的频率，关注观察到的结果的频率，而不是对参数本身分配概率。*  *##
    11.1 贝叶斯定理'
- en: We start by describing Bayes theorem, using a hypothetical cystic fibrosis test
    as an example.
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 我们首先通过一个假设的囊性纤维化测试的例子来描述贝叶斯定理。
- en: 'Suppose a test for cystic fibrosis has an accuracy of 99%. We will use the
    following notation:'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 假设一项囊性纤维化测试的准确率为99%。我们将使用以下符号：
- en: \[ \mathrm{Pr}(+ \mid D=1)=0.99, \mathrm{Pr}(- \mid D=0)=0.99 \]
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mathrm{Pr}(+ \mid D=1)=0.99, \mathrm{Pr}(- \mid D=0)=0.99 \]
- en: with \(+\) meaning a positive test and \(D\) representing if you actually have
    the disease (1) or not (0).
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 其中“+”表示阳性测试，“D”表示你是否真的患有疾病（1）或不是（0）。
- en: Imagine we select a random person and they test positive. What is the probability
    that they have the disease? We write this probability as \(\mathrm{Pr}(D=1 \mid
    +)\).
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们随机选择一个人，他们测试呈阳性。他们患有疾病的概率是多少？我们把这个概率写成\(\mathrm{Pr}(D=1 \mid +)\)。
- en: 'To answer this question, we will use Bayes theorem, which tells us that:'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 为了回答这个问题，我们将使用贝叶斯定理，它告诉我们：
- en: \[ \mathrm{Pr}(A \mid B) = \frac{\mathrm{Pr}(B \mid A)\mathrm{Pr}(A)}{\mathrm{Pr}(B)}
    \]
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mathrm{Pr}(A \mid B) = \frac{\mathrm{Pr}(B \mid A)\mathrm{Pr}(A)}{\mathrm{Pr}(B)}
    \]
- en: 'This equation, when applied to our problem, becomes:'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 当将此方程应用于我们的问题时，它变为：
- en: \[ \begin{aligned} \mathrm{Pr}(D=1 \mid +) & = \frac{ \mathrm{Pr}(+ \mid D=1)
    \, \mathrm{Pr}(D=1)} {\mathrm{Pr}(+)} \\ & = \frac{\mathrm{Pr}(+ \mid D=1) \,
    \mathrm{Pr}(D=1)} {\mathrm{Pr}(+ \mid D=1) \, \mathrm{Pr}(D=1) + \mathrm{Pr}(+
    \mid D=0) \mathrm{Pr}( D=0)} \end{aligned} \]
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \begin{aligned} \mathrm{Pr}(D=1 \mid +) & = \frac{ \mathrm{Pr}(+ \mid D=1)
    \, \mathrm{Pr}(D=1)} {\mathrm{Pr}(+)} \\ & = \frac{\mathrm{Pr}(+ \mid D=1) \,
    \mathrm{Pr}(D=1)} {\mathrm{Pr}(+ \mid D=1) \, \mathrm{Pr}(D=1) + \mathrm{Pr}(+
    \mid D=0) \mathrm{Pr}( D=0)} \end{aligned} \]
- en: 'The cystic fibrosis rate is 1 in 3,900, which implies that \(\mathrm{Pr}(D=1)\approx0.00025\).
    Plugging in the numbers, we get:'
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 胆囊纤维症的患病率为3900人中有1人，这意味着 \(\mathrm{Pr}(D=1)\approx0.00025\)。将数字代入，我们得到：
- en: \[ \mathrm{Pr}(D=1 \mid +) = \frac{0.99 \cdot 0.00025}{0.99 \cdot 0.00025 +
    0.01 \cdot (.99975)} \approx 0.02 \]
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mathrm{Pr}(D=1 \mid +) = \frac{0.99 \cdot 0.00025}{0.99 \cdot 0.00025 +
    0.01 \cdot (.99975)} \approx 0.02 \]
- en: According to the above, despite the test having 0.99 accuracy, the probability
    of having the disease given a positive test is only 0.02\. This might seem counter-intuitive
    to some, but it is because we must factor in the very rare probability that a
    randomly chosen person has the disease. To illustrate this, we run a Monte Carlo
    simulation.
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 根据上述内容，尽管测试的准确率为0.99，但在测试结果为阳性时，患病概率仅为0.02。这可能会让一些人感到反直觉，但这是因为我们必须考虑随机选择的人患病的非常罕见的概率。为了说明这一点，我们运行了一个蒙特卡洛模拟。
- en: We start by randomly selecting 100,000 people from a population in which the
    disease in question has a 1 in 4,000 prevalence.
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 我们首先从患病率约为1/4000的人群中随机选择100,000人。
- en: '[PRE0]'
  id: totrans-23
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: '*Note that, as expected, there are very few people with the disease and many
    people without the disease,'
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: '*正如预期的那样，患病人数很少，而未患病人数很多，'
- en: '[PRE1]'
  id: totrans-25
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: '*This makes it more probable that we will see some false positives given that
    the test is not perfect. Now, each person gets the test, which is correct 99%
    of the time:'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: '*这使得在测试不完美的情况下，我们更有可能看到一些假阳性。现在，每个人都会接受测试，测试正确率为99%：'
- en: '[PRE2]'
  id: totrans-27
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: '*Since the number of healthy individuals is much larger than the number of
    individuals with the disease, even a low false positive rate results in more healthy
    individuals testing positive than actual cases.'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: '*由于健康个体的人数远多于患病个体的人数，即使低误报率也会导致比实际病例更多的健康个体测试呈阳性。'
- en: '[PRE3]'
  id: totrans-29
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: '*From this table, we see that the proportion of positive tests that have the
    disease is 23 out of 988\. We can run this over and over again to see that, in
    fact, the probability converges to about 0.02.****'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: '*从这张表中，我们可以看到有疾病的阳性测试比例是988个中的23个。我们可以反复运行这个程序，以看到实际上，概率收敛到大约0.02。****'
- en: '***11.2 Priors and posteriors***'
  id: totrans-31
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '***11.2 先验和后验***'
- en: '***In the previous chapter, we computed an estimate and margin of error for
    the difference in popular votes between Hillary Clinton and Donald Trump. We denoted
    the parameter, the difference in popular votes, with \(\theta\). The estimate
    was between 2 and 4 percent, and the confidence interval did not include 0\. A
    forecaster would use this to predict Hillary Clinton would win the popular vote.
    But to make a probabilistic statement about winning the election, we need to use
    a Bayesian approach.'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: '***在前一章中，我们计算了希拉里·克林顿和唐纳德·特朗普之间普选票差异的估计值和误差范围。我们用 \(\theta\) 表示参数，即普选票差异。估计值在2%到4%之间，置信区间不包括0。预报员会使用这个结果预测希拉里·克林顿将赢得普选票。但为了对选举胜利做出概率性陈述，我们需要使用贝叶斯方法。'
- en: 'We start the Bayesian approach by quantifying our knowledge *before* seeing
    any data. This is done using a probability distribution referred to as a *prior*.
    For our example, we could write:'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 我们在看到任何数据之前，通过量化我们的知识来开始贝叶斯方法。这是通过使用称为**先验**的概率分布来完成的。对于我们的例子，我们可以写成：
- en: \[ \theta \sim N(\theta_0, \tau) \]
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \theta \sim N(\theta_0, \tau) \]
- en: We can think of \(\theta_0\) as our best guess for the popular vote difference
    had we not seen any polling data, and we can think of \(\tau\) as quantifying
    how certain we feel about this guess. Generally, if we have *expert knowledge*
    related to \(\theta\), we can try to quantify it with the prior distribution.
    In the case of election polls, experts use *fundamentals*, which include, for
    example, the state of the economy, to develop prior distributions.
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以将 \(\theta_0\) 视为我们没有看到任何调查数据时对普选票差异的最佳猜测，我们可以将 \(\tau\) 视为量化我们对这个猜测的确定性。一般来说，如果我们有与
    \(\theta\) 相关的*专业知识*，我们可以尝试使用先验分布来量化它。在选举调查的情况下，专家使用*基本面*，例如经济状况，来开发先验分布。
- en: 'The data is used to update our initial guess or *prior belief*. This can be
    done mathematically if we define the distribution for the observed data for any
    given \(\theta\). In our particular example, we would write down a model for the
    average of our polls. If we fixed \(\theta\), this model is the same we used in
    the previous chapter:'
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 数据被用来更新我们的初始猜测或*先验信念*。如果我们为任何给定的 \(\theta\) 定义观察数据的分布，这可以数学上进行。在我们的特定例子中，我们会写下我们调查平均的模型。如果我们固定
    \(\theta\)，这个模型与我们在上一章中使用的是相同的：
- en: \[ \bar{Y} \mid \theta \sim N(\theta, \sigma/\sqrt{N}) \]
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \bar{Y} \mid \theta \sim N(\theta, \sigma/\sqrt{N}) \]
- en: As before, \(\sigma\) describes randomness due to sampling and the pollster
    effects. In the Bayesian contexts, this is referred to as the sampling distribution.
    Note that we write the conditional \(\bar{Y} \mid \theta\) because \(\theta\)
    is now considered a random variable.
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: 如前所述，\(\sigma\) 描述了由于抽样和调查员效应而产生的随机性。在贝叶斯框架中，这被称为抽样分布。注意，我们写 \(\bar{Y} \mid
    \theta\) 是因为 \(\theta\) 现在被视为一个随机变量。
- en: 'We do not show the derivations here, but we can now use calculus and a version
    of Bayes’ Theorem to derive the conditional distribution of \(\theta\) given the
    observed data, referred to as the posterior distribution. Specifically, we can
    show that \(\theta \mid \bar{Y}\) follows a normal distribution with expected
    value:'
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: 我们在这里不展示推导过程，但现在我们可以使用微积分和贝叶斯定理的一个版本来推导给定观察数据的 \(\theta\) 的条件分布，这被称为后验分布。具体来说，我们可以证明
    \(\theta \mid \bar{Y}\) 服从期望值为：
- en: \[ \mathrm{E}[\theta \mid \bar{Y}] = B \theta_0 + (1-B) \,\bar{Y} \mbox{ with
    } B = \frac{\sigma^2/N}{\sigma^2/N+\tau^2} \]
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mathrm{E}[\theta \mid \bar{Y}] = B \theta_0 + (1-B) \,\bar{Y} \mbox{ with
    } B = \frac{\sigma^2/N}{\sigma^2/N+\tau^2} \]
- en: 'and standard error :'
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: 以及标准误差：
- en: \[ \mathrm{SE}[\mu \mid \bar{Y}] = \sqrt{\frac{1}{N/\sigma^2+1/\tau^2}}. \]
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mathrm{SE}[\mu \mid \bar{Y}] = \sqrt{\frac{1}{N/\sigma^2+1/\tau^2}}. \]
- en: Note that the expected value is a weighted average of our prior guess \(\theta_0\)
    and the observed data \(\bar{Y}\). The weight depends on how certain we are about
    our prior belief, quantified by \(\tau^2\), and the variance \(\sigma^2/N\) of
    the summary of our observed data.
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，期望值是我们先验猜测 \(\theta_0\) 和观察数据 \(\bar{Y}\) 的加权平均。权重取决于我们对先验信念的确定性，这由 \(\tau^2\)
    来量化，以及我们观察数据汇总的方差 \(\sigma^2/N\)。
- en: 'This weighted average is sometimes referred to as *shrinking* because it *shrinks*
    estimates towards a prior value. To see this note that we can rewrite the weighted
    average as:'
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 这种加权平均有时被称为*收缩*，因为它会将估计值向先验值收缩。为了理解这一点，请注意我们可以将加权平均重写为：
- en: \[ B \theta_0 + (1-B) \bar{Y}= \theta_0 + (1-B)(\bar{Y}-\theta_0)\\ \] The closer
    \(B\) is to 1, the more we *shrink* our estimate toward \(\theta_0\).
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: \[ B \theta_0 + (1-B) \bar{Y}= \theta_0 + (1-B)(\bar{Y}-\theta_0)\\ \] 随着 \(B\)
    越接近 1，我们越会将我们的估计值向 \(\theta_0\) 收敛。
- en: These formulas are useful way quantifying how we *update our beliefs*.***
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: 这些公式是量化我们如何更新信念的有用方法。***
- en: '***11.3 Credible intervals***'
  id: totrans-47
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '***11.3 信任区间***'
- en: '***We can also report intervals with high probability of occurring given our
    model. Specifically, for any probability value \(\alpha\) we can use the posterior
    distribution to construct intervals centered at our posterior mean and with \(\alpha\)
    chance of occurring. These are called *credible intervals*.'
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: '***我们还可以报告给定我们的模型具有高发生概率的区间。具体来说，对于任何概率值 \(\alpha\)，我们可以使用后验分布来构建以我们的后验均值为中心，具有
    \(\alpha\) 发生概率的区间。这些被称为*信任区间*。'
- en: 'As an example, we compute a posterior distribution and construct a credible
    interval for the popular vote difference, after defining a prior distribution
    with mean 0% and standard error 5%. This prior distribution can be interpreted
    as follows: before seeing polling data, we don’t think any candidate has the advantage,
    and a difference of up to 10% either way is possible.'
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，我们计算一个后验分布，并在定义了均值为0%和标准误差为5%的先验分布后，为流行票差构建一个可信区间。这个先验分布可以这样解释：在看到投票数据之前，我们不相信任何候选人具有优势，并且任何方向的10%的差异都是可能的。
- en: '[PRE4]'
  id: totrans-50
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: '*We can then compute the posterior distribution by applying the equations above
    to the `one_poll_per_pollster` data defined in [Chapter 10](models.html):'
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: '*然后我们可以通过将上述方程应用于第10章中定义的`one_poll_per_pollster`数据来计算后验分布：'
- en: '[PRE5]'
  id: totrans-52
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: '*Furthermore, we can now make the probabilistic statement that we could not
    make with the frequentists approach. Specifically, \(\mathrm{Pr}(\mu>0 \mid \bar{X})\)
    can be computed as follows:'
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: '*此外，我们现在可以做出频率主义者方法无法做出的概率性陈述。具体来说，\(\mathrm{Pr}(\mu>0 \mid \bar{X})\)可以按照以下方式计算：'
- en: '[PRE6]'
  id: totrans-54
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: '*According to the calculation above, we would be almost 100% certain that Clinton
    will win the popular vote, an estimate that feels overly confident. Moreover,
    it does not align with FiveThirtyEight’s reported probability of 81.4%. What accounts
    for this difference? Our current model does not yet capture all sources of uncertainty.
    We will revisit this issue and address the missing variability in [Chapter 12](hierarchical-models.html).******'
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: '*根据上述计算，我们几乎可以100%确定克林顿将赢得普选票，这个估计感觉过于自信。此外，它并不符合FiveThirtyEight报道的81.4%的概率。是什么导致了这种差异？我们当前模型尚未捕捉到所有的不确定性来源。我们将在第12章[章节链接](hierarchical-models.html)中重新审视这个问题，并解决缺失的变异性。******'
- en: '***11.4 Exercises***'
  id: totrans-56
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: '***11.4 练习***'
- en: '***1\. In 1999, in England, Sally Clark[¹](#fn1) was found guilty of the murder
    of two of her sons. Both infants were found dead in the morning, one in 1996 and
    another in 1998\. In both cases, she claimed the cause of death was sudden infant
    death syndrome (SIDS). No evidence of physical harm was found on the two infants,
    so the main piece of evidence against her was the testimony of Professor Sir Roy
    Meadow, who testified that the chances of two infants dying of SIDS was 1 in 73
    million. He arrived at this figure by finding that the rate of SIDS was 1 in 8,500,
    and then calculating that the chance of two SIDS cases was 8,500 \(\times\) 8,500
    \(\approx\) 73 million. Which of the following do you agree with?'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: '***1. 在1999年，在英国，萨莉·克拉克[¹](#fn1)被判定犯有谋杀她两个儿子的罪行。两个婴儿都在早上被发现死亡，一个是在1996年，另一个是在1998年。在两种情况下，她都声称死亡原因是婴儿猝死综合症（SIDS）。在两个婴儿身上都没有发现身体伤害的证据，因此对她不利的证据主要是罗伊·梅多爵士教授的证词，他作证说两个婴儿死于SIDS的概率是1/7300万。他是通过发现SIDS的比率是1/8500，然后计算出两个SIDS病例的概率是8500
    \(\times\) 8500 \(\approx\) 7300万。以下哪个是你同意的？'
- en: 'Sir Meadow assumed that the probability of the second son being affected by
    SIDS was independent of the first son being affected, thereby ignoring possible
    genetic causes. If genetics plays a role then: \(\mathrm{Pr}(\mbox{second case
    of SIDS} \mid \mbox{first case of SIDS}) > \mathrm{Pr}(\mbox{first case of SIDS})\).'
  id: totrans-58
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 梅多爵士假设第二个儿子受到SIDS影响的可能性与第一个儿子受到影响的可能性是独立的，因此忽略了可能的遗传原因。如果遗传起作用，那么：\(\mathrm{Pr}(\mbox{second
    case of SIDS} \mid \mbox{first case of SIDS}) > \mathrm{Pr}(\mbox{first case of
    SIDS})\)。
- en: 'Nothing. The multiplication rule always applies in this way: \(\mathrm{Pr}(A
    \mbox{ and } B) =\mathrm{Pr}(A)\mathrm{Pr}(B)\)'
  id: totrans-59
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 没有东西。乘法法则总是以这种方式适用：\(\mathrm{Pr}(A \mbox{ and } B) =\mathrm{Pr}(A)\mathrm{Pr}(B)\)
- en: Sir Meadow is an expert and we should trust his calculations.
  id: totrans-60
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 梅多爵士是一位专家，我们应该相信他的计算。
- en: Numbers don’t lie.
  id: totrans-61
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 数字不会说谎。
- en: 2\. Let’s assume that there is, in fact, a genetic component to SIDS and the
    probability of \(\mathrm{Pr}(\mbox{second case of SIDS} \mid \mbox{first case
    of SIDS}) = 1/100\), is much higher than 1 in 8,500\. What is the probability
    of both of her sons dying of SIDS?
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: 2. 假设确实存在婴儿猝死综合症（SIDS）的遗传因素，且在第一个SIDS病例发生后，第二个SIDS病例发生的概率 \(\mathrm{Pr}(\mbox{second
    case of SIDS} \mid \mbox{first case of SIDS}) = 1/100\)，这个概率远高于1/8,500。那么，她两个儿子都死于SIDS的概率是多少？
- en: 3\. Many press reports stated that the expert claimed the probability of Sally
    Clark being innocent was 1 in 73 million. Perhaps the jury and judge also interpreted
    the testimony this way. This probability can be written as the probability of
    *a mother is a son-murdering psychopath* given that *two of her children are found
    dead with no evidence of physical harm*. According to Bayes’ rule, what is this?
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: 3. 许多新闻报道称，专家声称莎莉·克拉克无辜的概率是7300万分之一。也许陪审团和法官也是这样解读证词的。这个概率可以写成在“两个孩子被发现死亡，没有身体伤害的证据”的条件下，“母亲是谋杀儿子的心理变态者”的概率。根据贝叶斯规则，这是什么？
- en: '4\. Assume that the chance of a son-murdering psychopath finding a way to kill
    her children, without leaving evidence of physical harm, is:'
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: 4. 假设一个谋杀儿子的心理变态母亲找到一种方法杀害她的孩子，而不留下身体伤害的证据的概率是：
- en: \[ \mathrm{Pr}(A \mid B) = 0.50 \]
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
  zh: \[ \mathrm{Pr}(A \mid B) = 0.50 \]
- en: with A = two of her children are found dead with no evidence of physical harm,
    and B = a mother is a son-murdering psychopath = 0.50\. Assume that the rate of
    son-murdering psychopath mothers is 1 in 1,000,000\. According to Bayes’ Theorem,
    what is the probability of \(\mathrm{Pr}(B \mid A)\) ?
  id: totrans-66
  prefs: []
  type: TYPE_NORMAL
  zh: 假设A = 发现她的两个孩子死亡，没有身体伤害的证据，和B = 母亲是谋杀儿子的心理变态者 = 0.50。假设谋杀儿子的心理变态母亲的比率是每百万分之一。根据贝叶斯定理，\(\mathrm{Pr}(B
    \mid A)\) 的概率是多少？
- en: 5\. After Sally Clark was found guilty, the Royal Statistical Society issued
    a statement saying that there was “no statistical basis” for the expert’s claim.
    They expressed concern at the “misuse of statistics in the courts”. Eventually,
    Sally Clark was acquitted in June 2003\. What did the expert miss?
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
  zh: 5. 在莎莉·克拉克被判有罪后，皇家统计学会发表声明称，专家的“没有统计依据”。他们表示对“法庭中统计学的误用”表示担忧。最终，莎莉·克拉克在2003年6月被宣判无罪。专家错过了什么？
- en: He made an arithmetic error.
  id: totrans-68
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 他犯了一个算术错误。
- en: He made two mistakes. First, he misused the multiplication rule and did not
    take into account how rare it is for a mother to murder her children. After using
    Bayes’ rule, we found a probability closer to 0.5 than 1 in 73 million.
  id: totrans-69
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 他犯了两个错误。首先，他误用了乘法规则，没有考虑到母亲谋杀孩子的罕见性。在使用贝叶斯规则后，我们发现概率更接近于7300万分之一，而不是0.5。
- en: He mixed up the numerator and denominator of Bayes’ rule.
  id: totrans-70
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 他混淆了贝叶斯规则的分子和分母。
- en: He did not use R.
  id: totrans-71
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 他没有使用R。
- en: 6\. Florida is one of the most closely watched states in U.S. elections because
    it has many electoral votes, giving it a large influence on the final result.
    Before 2016, Florida was a swing state where both Republicans and Democrats won
    implying it could affect a close elections.
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: 6. 佛罗里达是美国选举中最受关注的几个州之一，因为它拥有许多选举人票，对最终结果有重大影响。在2016年之前，佛罗里达是一个摇摆州，共和党和民主党都曾获胜，这意味着它可能影响一场紧绷的选举。
- en: 'Create the following table with the polls taken during the last two weeks:'
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: 创建以下表格，包含过去两周内进行的投票：
- en: '[PRE7]'
  id: totrans-74
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: '*Take the average spread of these polls. The CLT tells us this average is approximately
    normal. Calculate an average and provide an estimate of the standard error. Save
    your results in an object called `results`.'
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: '*取这些投票的平均差值。中心极限定理告诉我们这个平均值大约是正态分布的。计算平均值并提供标准误的估计。将结果保存在名为 `results` 的对象中。'
- en: 7\. Now assume a Bayesian model that sets the prior distribution for Florida’s
    election night spread \(\theta\) to follow a normal distribution with expected
    value \(\theta_0\) and standard deviation \(\tau\). What are the interpretations
    of \(\theta\) and \(\tau\)?
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: 7. 现在假设一个贝叶斯模型，将佛罗里达选举夜分布的先验分布 \(\theta\) 设定为服从期望值为 \(\theta_0\) 和标准差 \(\tau\)
    的正态分布。\(\theta\) 和 \(\tau\) 的解释是什么？
- en: \(\theta_0\) and \(\tau\) are arbitrary numbers that let us make probability
    statements about \(\theta\).
  id: totrans-77
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: \(\theta_0\) 和 \(\tau\) 是任意数字，让我们可以对 \(\theta\) 进行概率陈述。
- en: \(\theta_0\) and \(\tau\) summarize what we would predict for Florida before
    seeing any polls. Based on past elections, we would set \(\theta\) close to 0,
    because both Republicans and Democrats have won, and \(\tau\) at about \(0.02\),
    because these elections tend to be close.
  id: totrans-78
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: \(\theta_0\) 和 \(\tau\) 总结了我们希望在看到任何投票之前对佛罗里达的预测。根据过去的选举，我们会将 \(\theta\) 设置得接近于0，因为共和党和民主党都曾获胜，而
    \(\tau\) 大约是 \(0.02\)，因为这些选举往往很接近。
- en: \(\theta_0\) and \(\tau\) summarize what we want to be true. We therefore set
    \(\theta_0\) at \(0.10\) and \(\tau\) at \(0.01\).
  id: totrans-79
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: \(\theta_0\) 和 \(\tau\) 总结了我们想要成为真实的。因此，我们将 \(\theta_0\) 设置为 \(0.10\)，将 \(\tau\)
    设置为 \(0.01\)。
- en: The choice of prior has no effect on Bayesian analysis.
  id: totrans-80
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 先验的选择对贝叶斯分析没有影响。
- en: 8\. The CLT tells us that our estimate of the spread \(\hat{\theta}\) has normal
    distribution with expected value \(\theta\) and standard deviation \(\sigma\)
    calculated in exercise 6\. Use the formulas we provided for the posterior distribution
    to calculate the expected value of the posterior distribution if we set \(\theta_0
    = 0\) and \(\tau = 0.01\).
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
  zh: 8. CLT告诉我们，我们对扩散 \(\hat{\theta}\) 的估计具有期望值为 \(\theta\) 和标准差 \(\sigma\) 的正态分布，这些值是在第6个练习中计算的。使用我们提供的后验分布公式，如果我们将
    \(\theta_0 = 0\) 和 \(\tau = 0.01\)，来计算后验分布的期望值。
- en: 9\. Now compute the standard deviation of the posterior distribution.
  id: totrans-82
  prefs: []
  type: TYPE_NORMAL
  zh: 9. 现在计算后验分布的标准差。
- en: 10\. Using the fact that the posterior distribution is normal, create an interval
    that has a 95% probability of occurring centered at the posterior expected value.
    Note that we call these credible intervals.
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
  zh: 10. 利用后验分布是正态分布的事实，创建一个以后验期望值为中心，发生概率为95%的区间。请注意，我们把这些区间称为可信区间。
- en: 11\. According to this analysis, what was the probability that Trump wins Florida?
  id: totrans-84
  prefs: []
  type: TYPE_NORMAL
  zh: 11. 根据这一分析，特朗普赢得佛罗里达州的可能性是多少？
- en: 12\. Now use `sapply` function to change the prior variance from `seq(0.005,
    0.05, len = 100)` and observe how the probability changes by making a plot.****
  id: totrans-85
  prefs: []
  type: TYPE_NORMAL
  zh: 12. 现在请使用 `sapply` 函数将先验方差从 `seq(0.005, 0.05, len = 100)` 改变，并通过绘制图表来观察概率如何变化。****
- en: '* * *'
  id: totrans-86
  prefs: []
  type: TYPE_NORMAL
  zh: '* * *'
- en: '***1.  https://en.wikipedia.org/wiki/Sally_Clark[↩︎](#fnref1)****'
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
