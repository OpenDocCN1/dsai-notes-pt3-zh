- en: Chapter 7 Introduction to data visualization
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 第7章 数据可视化简介
- en: 原文：[https://rafalab.dfci.harvard.edu/dsbook/introduction-to-data-visualization.html](https://rafalab.dfci.harvard.edu/dsbook/introduction-to-data-visualization.html)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://rafalab.dfci.harvard.edu/dsbook/introduction-to-data-visualization.html](https://rafalab.dfci.harvard.edu/dsbook/introduction-to-data-visualization.html)
- en: 'Looking at the numbers and character strings that define a dataset is rarely
    useful. To convince yourself, print and stare at the US murders data table:'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 看着定义数据集的数字和字符字符串通常很少有用。为了说服自己，打印并盯着美国谋杀数据表看看：
- en: '[PRE0]'
  id: totrans-3
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: 'What do you learn from staring at this table? How quickly can you determine
    which states have the largest populations? Which states have the smallest? How
    large is a typical state? Is there a relationship between population size and
    total murders? How do murder rates vary across regions of the country? For most
    human brains, it is quite difficult to extract this information just by looking
    at the numbers. In contrast, the answer to all the questions above are readily
    available from examining this plot:'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 你从盯着这张表格中学到了什么？你有多快就能确定哪个州人口最多？哪个州人口最少？一个典型的州有多大？人口规模和总谋杀量之间有关系吗？国家各地区的谋杀率如何变化？对于大多数人类大脑来说，仅通过查看数字很难提取这些信息。相比之下，上述所有问题的答案都可以通过检查这个图表轻松获得：
- en: '![](../Images/b0093caaef10aac12c08e46a4483ee98.png)'
  id: totrans-5
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/b0093caaef10aac12c08e46a4483ee98.png)'
- en: We are reminded of the saying “a picture is worth a thousand words”. Data visualization
    provides a powerful way to communicate a data-driven finding. In some cases, the
    visualization is so convincing that no follow-up analysis is required.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 我们想起了那句“一图胜千言”。数据可视化提供了一种强大的方式来传达数据驱动的发现。在某些情况下，可视化如此令人信服，以至于不需要进一步的分析。
- en: The growing availability of informative datasets and software tools has led
    to increased reliance on data visualizations across many industries, academia,
    and government. A salient example is news organizations, which are increasingly
    embracing *data journalism* and including effective *infographics* as part of
    their reporting.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 信息丰富型数据集和软件工具的日益可用，导致许多行业、学术界和政府越来越多地依赖数据可视化。一个显著的例子是新闻机构，它们越来越多地采用*数据新闻学*，并将有效的*信息图表*作为其报道的一部分。
- en: A particularly effective example is a Wall Street Journal article[^(16)](#fn16)
    showing data related to the impact of vaccines on battling infectious diseases.
    One of the graphs shows measles cases by US state through the years with a vertical
    line demonstrating when the vaccine was introduced.
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 一个特别有效的例子是《华尔街日报》的一篇文章[^(16)](#fn16)，展示了疫苗对抗传染病影响的相关数据。其中一张图表显示了多年来按美国各州划分的麻疹病例，并用垂直线表示疫苗引入的时间。
- en: '[PRE1]'
  id: totrans-9
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: '![](../Images/9a90c3766868395c17669b1c37e9f432.png)'
  id: totrans-10
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/9a90c3766868395c17669b1c37e9f432.png)'
- en: 'Another striking example comes from a New York Times chart[^(17)](#fn17), which
    summarizes scores from the NYC Regents Exams. As described in the article[^(18)](#fn18),
    these scores are collected for several reasons, including to determine if a student
    graduates from high school. In New York City you need a 65 to pass. The distribution
    of the test scores forces us to notice something somewhat problematic:'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 另一个引人注目的例子来自《纽约时报》的图表[^(17)](#fn17)，总结了纽约市大学入学考试的成绩。正如文章[^(18)](#fn18)中描述的，这些成绩收集的原因包括确定学生是否从高中毕业。在纽约市，你需要65分才能及格。考试成绩的分布迫使我们注意到一些问题：
- en: '![](../Images/b10b8a71ef10810d19f27ce65117d2d3.png)'
  id: totrans-12
  prefs: []
  type: TYPE_IMG
  zh: '![图片](../Images/b10b8a71ef10810d19f27ce65117d2d3.png)'
- en: The most common test score is the minimum passing grade, with very few scores
    just below the threshold. This unexpected result is consistent with students close
    to passing having their scores bumped up.
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 最常见的考试成绩是最低及格分数，很少有分数仅略低于及格线。这个意外的结果与即将及格的学生分数被提高是一致的。
- en: This is an example of how data visualization can lead to discoveries which would
    otherwise be missed if we simply subjected the data to a battery of data analysis
    tools or procedures. Data visualization is the strongest tool of what we call
    *exploratory data analysis* (EDA). John W. Tukey[^(19)](#fn19), considered the
    father of EDA, once said,
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 这就是数据可视化如何导致发现，如果我们仅仅将数据提交给一系列数据分析工具或程序，这些发现可能会被遗漏。数据可视化是我们所说的*探索性数据分析*（EDA）中最强大的工具。约翰·W·图基[^(19)](#fn19)，被认为是EDA之父，曾说过，
- en: “The greatest value of a picture is when it forces us to notice what we never
    expected to see.”
  id: totrans-15
  prefs:
  - PREF_BQ
  - PREF_BQ
  type: TYPE_NORMAL
  zh: “图片的最大价值在于它迫使我们注意到我们从未预料到看到的东西。”
- en: Many widely used data analysis tools were initiated by discoveries made via
    EDA. EDA is perhaps the most important part of data analysis, yet it is one that
    is often overlooked.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 许多广泛使用的数据分析工具都是通过EDA（探索性数据分析）的发现而启动的。EDA可能是数据分析中最重要的部分，但它往往被忽视。
- en: Data visualization is also now pervasive in philanthropic and educational organizations.
    In the talks New Insights on Poverty[^(20)](#fn20) and The Best Stats You’ve Ever
    Seen[^(21)](#fn21), Hans Rosling forces us to notice the unexpected with a series
    of plots related to world health and economics. In his videos, he uses animated
    graphs to show us how the world is changing and how old narratives are no longer
    true.
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 数据可视化现在也普遍应用于慈善和教育组织。在《贫困的新视角[^(20)](#fn20)》和《你见过的最佳统计数据[^(21)](#fn21)》的演讲中，汉斯·罗斯林通过一系列与全球健康和经济相关的图表，让我们注意到意外之处。在他的视频中，他使用动画图表向我们展示世界是如何变化的，以及旧叙事是如何不再真实的。
- en: '![](../Images/6e9a3fa48c2df6bd2389d5f420500b33.png)'
  id: totrans-18
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/6e9a3fa48c2df6bd2389d5f420500b33.png)'
- en: It is also important to note that mistakes, biases, systematic errors and other
    unexpected problems often lead to data that should be handled with care. Failure
    to discover these problems can give rise to flawed analyses and false discoveries.
    As an example, consider that measurement devices sometimes fail and that most
    data analysis procedures are not designed to detect these. Yet these data analysis
    procedures will still give you an answer. The fact that it can be difficult or
    impossible to notice an error just from the reported results makes data visualization
    particularly important.
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 还需要注意的是，错误、偏差、系统性错误和其他意外问题往往会导致需要谨慎处理的数据。未能发现这些问题可能导致分析有缺陷和错误发现。例如，考虑测量设备有时会失败，而且大多数数据分析程序都没有设计来检测这些。然而，这些数据分析程序仍然会给出答案。仅仅从报告的结果中难以或无法察觉错误的事实使得数据可视化尤为重要。
- en: 'In this part of the book, we will learn the basics of data visualization and
    exploratory data analysis by using three motivating examples. We will use the
    **ggplot2** package to code. To learn the very basics, we will start with a somewhat
    artificial example: heights reported by students. Then we will cover the two examples
    mentioned above: 1) world health and economics and 2) infectious disease trends
    in the United States.'
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 在本书的这一部分，我们将通过三个具有启发性的例子来学习数据可视化和探索性数据分析的基础。我们将使用**ggplot2**包进行编码。为了学习最基本的内容，我们将从一个相对人为的例子开始：学生报告的身高。然后我们将涵盖上述两个例子：1）世界健康和经济以及2）美国传染病趋势。
- en: 'Of course, there is much more to data visualization than what we cover here.
    The following are references for those who wish to learn more:'
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 当然，数据可视化远不止我们在这里所涵盖的内容。以下是为那些希望了解更多信息的人提供的参考：
- en: ER Tufte (1983) The visual display of quantitative information. Graphics Press.
  id: totrans-22
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: ER Tufte (1983) 《定量信息的视觉展示》。Graphics Press。
- en: ER Tufte (1990) Envisioning information. Graphics Press.
  id: totrans-23
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: ER Tufte (1990) 《信息可视化》。Graphics Press。
- en: ER Tufte (1997) Visual explanations. Graphics Press.
  id: totrans-24
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: ER Tufte (1997) 《视觉解释》。Graphics Press。
- en: WS Cleveland (1993) Visualizing data. Hobart Press.
  id: totrans-25
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: WS Cleveland (1993) 《数据可视化》。Hobart Press。
- en: WS Cleveland (1994) The elements of graphing data. CRC Press.
  id: totrans-26
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: WS Cleveland (1994) 《数据图表元素》。CRC Press。
- en: 'A Gelman, C Pasarica, R Dodhia (2002) Let’s practice what we preach: Turning
    tables into graphs. The American Statistician 56:121-130.'
  id: totrans-27
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: A Gelman, C Pasarica, R Dodhia (2002) 《让我们实践我们所宣扬的：将表格转换为图表》。《美国统计学家》56:121-130。
- en: NB Robbins (2004) Creating more effective graphs. Wiley.
  id: totrans-28
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: NB Robbins (2004) 《创建更有效的图表》。Wiley。
- en: 'A Cairo (2013) The functional art: An introduction to information graphics
    and visualization. New Riders.'
  id: totrans-29
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: A Cairo (2013) 《功能艺术：信息图形和可视化的介绍》。New Riders。
- en: 'N Yau (2013) Data points: Visualization that means something. Wiley.'
  id: totrans-30
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: N Yau (2013) 《数据点：有意义的可视化》。Wiley。
- en: 'We also do not cover interactive graphics, a topic that is too advanced for
    this book. Some useful resources for those interested in learning more can be
    found below:'
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: 我们也没有涵盖交互式图形，这是一个对于本书来说过于高级的话题。以下是一些对那些有兴趣了解更多信息的人有用的资源：
