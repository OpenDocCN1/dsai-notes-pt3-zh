- en: '[Recommended Reading](../prob/reading-prob.html)'
  id: totrans-3
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[推荐阅读](../prob/reading-prob.html)'
- en: '**Fisher, R. A. (1935). *The Design of Experiments.* Edinburgh: Oliver & Boyd.**'
  id: totrans-4
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**费舍尔，R. A.（1935）. 《实验设计》. 爱丁堡：Oliver & Boyd**。'
- en: A foundational text that introduced the principles of randomization and experimental
    control, forming the basis of modern statistical design.
  id: totrans-5
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 一本介绍随机化和实验控制原则的基础性文本，构成了现代统计设计的基石。
- en: '**Montgomery, D. C. (2017). *Design and Analysis of Experiments* (9th ed.).
    Wiley.**'
  id: totrans-6
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**蒙哥马利，D. C.（2017）. 《实验设计与分析》（第9版）. Wiley**。'
- en: A comprehensive and accessible modern treatment of experimental design, emphasizing
    applications and interpretation.
  id: totrans-7
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 对实验设计的一个全面且易于理解的现代处理，强调应用和解释。
- en: '**David Freedman, Robert Pisani & Roger Purves**, *Statistics*.'
  id: totrans-8
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**大卫·弗里德曼，罗伯特·皮萨尼和罗杰·珀维斯**，《统计学》。'
- en: This book emphasizes clear reasoning, real examples, and conceptual insight
    rather than formula memorization.
  id: totrans-9
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 本书强调清晰的推理、真实案例和概念洞察，而不是公式记忆。
- en: '**A First Course in Probability** by Sheldon Ross - a widely used undergraduate
    text that builds a solid foundation through clear explanations and a broad range
    of exercises.'
  id: totrans-10
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**《概率论入门**》舍洛德·罗斯著 - 一本广泛使用的本科教材，通过清晰的解释和广泛的应用练习建立了坚实的基础。'
- en: '**Introduction to Probability** by Joseph K. Blitzstein and Jessica Hwang -
    an engaging, example-driven introduction that emphasizes problem solving and intuition.'
  id: totrans-11
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**《概率论导论**》约瑟夫·K. 布利茨斯坦和杰西卡·黄著 - 一本引人入胜、以案例驱动的入门书籍，强调问题解决和直觉。'
- en: '**An Introduction to Probability Theory and Its Applications, Volume 1** by
    William Feller - a rigorous classic that provides a deeper and more formal treatment
    of the subject.'
  id: totrans-12
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**《概率论及其应用（第一卷）**》威廉·费勒著 - 一部严谨的经典著作，对主题进行了更深层次和更正式的处理。'
