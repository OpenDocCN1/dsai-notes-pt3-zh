- en: '[PRE0]'
  id: totrans-3
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: '![](../Images/74ae805add63801b594ce6f8ffff4ce5.png)'
  id: totrans-4
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/74ae805add63801b594ce6f8ffff4ce5.png)'
- en: “*Correlation does not necessarily imply causation*.” You’ve surely heard this
    statement many times by now. In this section, we’ll understand the relationship
    between association, correlation, and causation. We’ll look at a few different
    problems that arise when thinking about these concepts.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: “*相关性不一定意味着因果关系*。” 你现在肯定已经听过很多次这句话了。在本节中，我们将理解关联、相关性和因果关系之间的关系。我们将探讨思考这些概念时可能出现的几个不同问题。
- en: We’ll start by looking at three mistakes that one can make when thinking about
    association, correlation, and causation. Then, we’ll review a few different ways
    of measuring association, which we’ll use in our later discussion of causality.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将首先探讨在思考关联、相关性和因果关系时可能犯的三个错误。然后，我们将回顾几种不同的衡量关联的方法，这些方法将在我们后续关于因果关系的讨论中使用。
- en: Prediction vs Causation[¶](#prediction-vs-causation "Link to this Section")
  id: totrans-7
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 预测 vs 因果关系[¶](#prediction-vs-causation "链接至此章节")
- en: 'In many applications, we may be interested in predicting a certain quantity
    from another quantity. We’ve already seen examples of this: GLMs help us predict
    one variable given many others. But it’s important to keep in mind the distinction
    between prediction and causation. Here’s an example that highlights the difference.'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 在许多应用中，我们可能对根据一个量预测另一个量感兴趣。我们已经见过这样的例子：广义线性模型（GLMs）帮助我们在给定许多其他变量的情况下预测一个变量。但重要的是要记住预测和因果关系之间的区别。下面这个例子就突出了这种差异。
- en: 'Suppose we’re interested in using recorded audio data from a soccer match TV
    broadcast to predict how many people were applauding at any given time. Intuitively,
    this seems like a case where we can make a pretty good prediction: louder audio
    should be predictive of more people applauding. However, even though our prediction
    ability may be excellent, this does not imply a causal relationship at all: in
    fact, the data we observe (audio volume) is caused by the thing that we’re trying
    to predict (people applauding).'
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 假设我们有兴趣使用足球比赛电视转播的录音数据来预测在任何给定时间有多少人在鼓掌。直观上看，这似乎是一个我们可以做出相当不错预测的情况：更大的音频音量应该预示着更多人在鼓掌。然而，尽管我们的预测能力可能非常出色，但这完全不能暗示存在因果关系：事实上，我们观察到的数据（音频音量）是由我们试图预测的事物（人们鼓掌）引起的。
- en: In many cases, our goal may be predictive power, in which case the reverse causality
    here is fine. However, in cases where we’re trying to infer causality, high predictive
    power alone is not enough.
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 在许多情况下，我们的目标可能是预测能力，在这种情况下，这里的反向因果关系是可以接受的。然而，在我们试图推断因果关系的情况下，仅凭高预测能力是不够的。
- en: Mistaking correlation (and association) for causation[¶](#mistaking-correlation-and-association-for-causation
    "Link to this Section")
  id: totrans-11
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 将相关性（与关联性）误认为因果关系[¶](#mistaking-correlation-and-association-for-causation "Link
    to this Section")
- en: 'It’s often easier to fall for the trap of conflating association and causation
    than you might think. For example, consider the following story:'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 陷入混淆关联性与因果关系的陷阱，往往比你想象的要容易。例如，考虑以下故事：
- en: 'A Martian arrives on Earth, and after a year of study announces the discovery
    of a correlation between using an umbrella and getting wet: people who use umbrellas
    have a higher probability of getting wet (even if it’s just their pants) than
    people who don’t use an umbrella. The Martian infers that using an umbrella causes
    people to get wet.'
  id: totrans-13
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 一个火星人来到地球，经过一年的研究后宣布发现了一个相关性：使用雨伞与淋湿之间存在关联——使用雨伞的人比不使用雨伞的人淋湿（即使只是裤子湿了）的概率更高。火星人推断，使用雨伞会导致人们被淋湿。
- en: 'The correlation that the Martian observes is real, but the real causal story
    is a little more complex than this: we use umbrellas when it rains, and we get
    wet when it rains. While it’s easy to point to this example and laugh at how silly
    the Martian is, the reality is that we hear (and make) inferences like this all
    the time.'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 火星人观察到的相关性是真实存在的，但真实的因果关系比这稍微复杂一些：下雨时我们会使用雨伞，而下雨时我们也会被淋湿。虽然很容易指着这个例子嘲笑火星人有多愚蠢，但现实情况是，我们经常听到（甚至自己也会做出）类似的推断。
- en: Confounding variables[¶](#confounding-variables "Link to this Section")
  id: totrans-15
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 混杂变量[¶](#confounding-variables "Link to this Section")
- en: A key problem that comes up when reasoning about causality is the existence
    of **confounding** variables.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 在因果关系推理中出现的一个关键问题是**混杂**变量的存在。
- en: Sunburns and ice cream sales[¶](#sunburns-and-ice-cream-sales "Link to this
    Section")
  id: totrans-17
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 晒伤与冰淇淋销量[¶](#sunburns-and-ice-cream-sales "Link to this Section")
- en: 'As an example, let’s suppose we collect daily data on sunburns and ice cream
    sales for an entire year. We find a strong positive association in the data: days
    with higher ice cream sales have much higher sunburn rates. Clearly, sunburn doesn’t
    cause increased ice cream sales, and increased ice cream sales don’t cause sunburns,
    either. This example fails to take into account the confounding effect of the
    weather: hot, sunny weather causes people to buy more ice cream, and also causes
    more sunburns. We can illustrate this using a directed graph, similar to the ones
    we used in Bayesian graphical models:'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 举个例子，假设我们收集了全年关于晒伤和冰淇淋销量的每日数据。我们发现数据中存在强烈的正相关关系：冰淇淋销量较高的日子，晒伤率也显著更高。显然，晒伤并不会导致冰淇淋销量增加，冰淇淋销量增加也不会导致晒伤。这个例子忽略了天气的混杂效应：炎热晴朗的天气会导致人们购买更多冰淇淋，同时也会导致更多晒伤。我们可以使用有向图来说明这一点，类似于我们在贝叶斯图模型中使用的那种：
- en: '![](../Images/6c9e142abed652b0afa5f326920bbf92.png)'
  id: totrans-19
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/6c9e142abed652b0afa5f326920bbf92.png)'
- en: Here, the edges indicate *causal* relationships (we’ll formalize this idea in
    the next section). For example, this graph claims that sun causes a change in
    sunburn rates. Like the example with the Martian, the existence of a confounding
    variable (sunny weather) is clear in this example.
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 在这里，边表示*因果*关系（我们将在下一节正式阐述这个概念）。例如，此图声称太阳会导致晒伤率的变化。就像火星人的例子一样，这个例子中混杂变量（晴朗天气）的存在是显而易见的。
- en: Cameras and social media likes[¶](#cameras-and-social-media-likes "Link to this
    Section")
  id: totrans-21
  prefs:
  - PREF_H4
  type: TYPE_NORMAL
  zh: 相机与社交媒体点赞数[¶](#cameras-and-social-media-likes "Link to this Section")
- en: 'Let’s look at an example with a more complex relationship. Suppose we want
    to know whether using a high-end DSLR camera causes increased likes on Instagram
    posts. If we collect data and find a strong positive association between DSLR
    cost and number of likes, does this let us conclude a causal relationship? In
    this case, the answer is a more nebulous “maybe”. There are other confounding
    factors here: for example, high-profile, well-financed accounts that already have
    a lot of followers are more likely to use high-end cameras than amateur accounts.
    In this case, the causal graph might look more like this:'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们看一个关系更复杂的例子。假设我们想知道使用高端数码单反相机是否会导致Instagram帖子的点赞数增加。如果我们收集数据并发现相机价格与点赞数之间存在强烈的正相关，这是否能让我们得出存在因果关系的结论？在这种情况下，答案是一个更模糊的“可能”。这里存在其他混杂因素：例如，已经拥有大量粉丝、资金雄厚的高知名度账户比业余账户更可能使用高端相机。在这种情况下，因果图可能看起来更像这样：
- en: '![](../Images/a604d5a22e3cdac0812b6de14019597c.png)'
  id: totrans-23
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/a604d5a22e3cdac0812b6de14019597c.png)'
- en: Without further information about the account’s size and budget, it’s hard to
    determine a causal relationship.
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: 在没有关于账户规模和预算的进一步信息的情况下，很难确定因果关系。
- en: Spurious correlations[¶](#spurious-correlations "Link to this Section")
  id: totrans-25
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 虚假相关性[¶](#spurious-correlations "Link to this Section")
- en: 'Sometimes, regardless of whether or not we’re trying to draw conclusions about
    causality, the correlations we observe might be *spurious*: that is, they could
    occur just by chance, or by a series of confounds that may negate any conclusions
    we would want to draw. One example from [Tyler Vigen’s Spurious Correlations website](https://www.tylervigen.com/spurious-correlations)
    is shown below:'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 有时，无论我们是否试图得出关于因果关系的结论，我们观察到的相关性可能是*虚假的*：也就是说，它们可能只是偶然发生，或者由一系列可能否定我们想要得出的任何结论的混杂因素导致。[泰勒·维根的虚假相关性网站](https://www.tylervigen.com/spurious-correlations)上的一个示例如下：
- en: '![](../Images/ac2868c6105764852d4815d4f9eaf995.png)'
  id: totrans-27
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/ac2868c6105764852d4815d4f9eaf995.png)'
- en: 'We can draw a directed graph for these two variables: in this case, there are
    no edges between them because there’s no causal relationship either way, and no
    confounding variable:'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以为这两个变量绘制一个有向图：在这种情况下，它们之间没有边，因为两者之间没有因果关系，也没有混杂变量：
- en: '![](../Images/d781fd47f72f6cbf5089fbd8ad37daf5.png)'
  id: totrans-29
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/d781fd47f72f6cbf5089fbd8ad37daf5.png)'
- en: The Marshmallow Experiment[¶](#the-marshmallow-experiment "Link to this Section")
  id: totrans-30
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 棉花糖实验[¶](#the-marshmallow-experiment "Link to this Section")
- en: 'Another example is the famous so-called “[marshmallow study](https://en.wikipedia.org/wiki/Stanford_marshmallow_experiment)”.
    In this study, researchers presented children with a choice: either they could
    have one marshmallow immediately, or, if they waited 15 minutes, they could have
    two marshmallows. They followed the students for 30 years, and found that students
    who waited for the extra payout achieved greater success in life (as measured
    by the researchers). Although the original researchers cautioned people to avoid
    direct causal interpretations, the most common and widespread interpretation was
    causal: that children’s ability to delay gratification (i.e., to wait 15 minutes
    for a double marshmallow payout) caused them to succeed throughout their lives.
    Schools implemented coaching programs to help students build self-control and
    resist the urge to eat the first marshmallow.'
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: 另一个例子是著名的“[棉花糖实验](https://en.wikipedia.org/wiki/Stanford_marshmallow_experiment)”。在这项研究中，研究人员给孩子们一个选择：要么立即得到一颗棉花糖，要么等待15分钟后得到两颗棉花糖。他们对这些学生进行了长达30年的跟踪，发现那些愿意等待额外奖励的学生在生活中取得了更大的成功（根据研究人员的衡量标准）。尽管最初的研究人员告诫人们避免直接进行因果关系的解读，但最常见和最广泛的解释却是因果性的：即孩子延迟满足的能力（即为了获得双倍棉花糖奖励而等待15分钟）导致了他们一生的成功。学校因此实施了辅导项目，以帮助学生建立自控力，抵抗吃掉第一颗棉花糖的冲动。
- en: 'However, followup studies have shown a much more [complex and nuanced story](https://anderson-review.ucla.edu/new-study-disavows-marshmallow-tests-predictive-powers/):
    while many follow-up studies have shown an association, the predictive effect
    of resisting a marshmallow seems to diminish or disappear when controlling for
    factors such as socioeconomic background or other measures of self-control. Many
    scientists have argued that **rather than self-control, what the study really
    measures is behavior in response to middle-class or upper-class upbringings**:
    in other words, responding to environments without shortages.'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，后续研究揭示了一个[更为复杂和微妙的故事](https://anderson-review.ucla.edu/new-study-disavows-marshmallow-tests-predictive-powers/)：虽然许多后续研究显示了关联性，但在控制了社会经济背景或其他自控力衡量指标等因素后，抵抗棉花糖诱惑的预测效应似乎会减弱或消失。许多科学家认为，**这项研究真正衡量的并非自控力，而是对中产阶级或上层阶级成长环境的反应行为**：换句话说，是对资源不匮乏环境的反应。
- en: Stories like this one illustrate both the importance and the difficulty of determining
    causality from observational studies. If we could somehow determine that teaching
    small children self-control is guaranteed to have a large impact on their eventual
    life outcomes, then this seems like a worthwhile policy goal. This is even more
    true if the effect is true regardless of socioeconomic background. However, the
    numerous confounding variables and unclear direction of causality highlight the
    need for methods that can determine causality in such environments, outside of
    a randomized controlled trial.
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 像这样的故事说明了从观察性研究中确定因果关系的重要性和困难性。如果我们能以某种方式确定，教导幼儿自我控制必定会对其最终的生活结果产生重大影响，那么这似乎是一个值得追求的政策目标。如果这种影响不受社会经济背景影响，那就更是如此。然而，众多的混杂变量和模糊的因果关系方向凸显了需要能在随机对照试验之外的环境中确定因果关系的方法。
- en: Simpson’s Paradox[¶](#simpsons-paradox "Link to this Section")
  id: totrans-34
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 辛普森悖论[¶](#simpsons-paradox "Link to this Section")
- en: 'One counterintuitive problem that can come up with confounding variables is
    **Simpson’s Paradox**. Let’s start with a hypothetical example: suppose a group
    of restaurant critics spends two years sampling dishes from two popular restaurants,
    A and B. They rate every dish that they order with either a 👎 (didn’t like) or
    a 👍 (liked). They summarize the data in the following table:'
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: 混杂变量可能导致的一个反直觉问题是**辛普森悖论**。让我们从一个假设的例子开始：假设一组餐厅评论家用两年时间品尝了两家热门餐厅A和B的菜肴。他们对自己点的每道菜都给出👎（不喜欢）或👍（喜欢）的评分。他们在下表中总结了数据：
- en: '[PRE1]'
  id: totrans-36
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: '[PRE2]'
  id: totrans-37
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: Loading...
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: Just looking at this data, it seems like they like restaurant B’s food much
    better (80% success rate compared to 60% for restaurant A).
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: 仅看这些数据，似乎他们更喜欢餐厅B的食物（80%的成功率，而餐厅A为60%）。
- en: But now, let’s suppose we learn that they collected their data from 2019-2020,
    and that the critics were much harsher in 2020 than in 2019, perhaps due to pandemic-induced
    gloom. Furthermore, we learn that Restaurant A specializes in take-out and delivery,
    which was the safest and most common way to order food in 2020.
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 但现在，假设我们了解到他们的数据收集于2019年至2020年，并且评论家在2020年比2019年苛刻得多，这可能是由于疫情引发的阴郁情绪。此外，我们得知餐厅A专营外卖和送餐服务，这是2020年最安全、最常见的订餐方式。
- en: 'Motivated by this additional context, let’s break down the data by year:'
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: 基于这个额外背景，让我们按年份细分数据：
- en: '[PRE3]'
  id: totrans-42
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: '[PRE4]'
  id: totrans-43
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: Loading...
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 加载中...
- en: 'Looking at this data, Restaurant A now looks better in both years! This is
    known as **Simpson’s Paradox**: Restaurant B looks better in the aggregate data,
    but Restaurant A looks better when we look at each year separately. How can we
    resolve this conundrum?'
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: 观察这些数据，餐厅A现在在两年中都显得更优！这被称为**辛普森悖论**：从汇总数据看餐厅B更好，但当我们分别查看每年数据时，餐厅A看起来更好。我们该如何解决这个难题？
- en: 'Let’s take a moment to look at the numbers:'
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们花点时间看看这些数字：
- en: In 2019 (first two columns), Restaurant A had a 100% (20/20) success rate with
    the critics, while Restaurant B had a 87.5% (70/80) success rate.
  id: totrans-47
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在2019年（前两列），餐厅A在评论家中的成功率为100%（20/20），而餐厅B的成功率为87.5%（70/80）。
- en: In 2020 (last two columns), Restaurant A had a 55.6% (100/180) success rate,
    while restaurant B had a 50% (10/20) success rate.
  id: totrans-48
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在2020年（最后两列），餐厅A的成功率为55.6%（100/180），而餐厅B的成功率为50%（10/20）。
- en: Why does this happen? It’s because of the confounding effect of the year (i.e.,
    the pandemic). Both restaurant’s ratings were hurt a lot by the critics’ harsh
    pandemic scores, but since Restaurant A saw a lot more orders in 2020, its overall
    numbers were hurt more.
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: 为什么会发生这种情况？这是因为年份（即疫情）的混杂效应。两家餐厅的评分都因评论家在疫情期间的苛刻评分而大幅受损，但由于餐厅A在2020年接到了更多订单，其整体数据受到的影响更大。
- en: 'Before continuing, let’s frame this question in the language of causal inference,
    so that we can use the intuition we’ve built up around confounding variables.
    Our question can be slightly rewritten as: does the critics’ choice of restaurant
    (A vs B) affect whether they like the food (and therefore give it a 👍 rating)?
    In this setting, our treatment is the choice of restaurant: A or B. Our outcome
    is whether or not they liked a dish (i.e., whether they gave it a 👍 rating). The
    confounder is when they ordered the dish. Why is this a confounder? Because it
    has a causal effect on both treatment and outcome. Ordering dishes in 2020 caused
    the critics to choose a takeout-friendly option more often (B). Ordering dishes
    in 2020 also caused the critics to give positive reviews (👍) less often.'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: 在继续之前，让我们用因果推断的语言来框定这个问题，以便利用我们围绕混杂变量建立的直觉。我们的问题可以稍作改写为：评论者对餐厅的选择（A 还是 B）是否会影响他们是否喜欢食物（从而给出
    👍 评分）？在此设定中，我们的处理是餐厅的选择：A 或 B。我们的结果是他们是否喜欢一道菜（即，是否给出 👍 评分）。混杂变量是他们点菜的时间。为什么这是一个混杂变量？因为它对处理和结果都有因果影响。在
    2020 年点菜导致评论者更频繁地选择适合外卖的选项（B）。在 2020 年点菜也导致评论者给出正面评价（👍）的频率降低。
- en: '[PRE5]'
  id: totrans-51
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: 'We can also represent this information in a directed graph, as we did earlier:'
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: 我们也可以像之前那样，用有向图来表示这个信息：
- en: '![](../Images/93daa3d30be5b96f9eac1198bf00d47b.png)'
  id: totrans-53
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/93daa3d30be5b96f9eac1198bf00d47b.png)'
- en: 'Note that we’ve used “year” as a confounder here, but that’s a little imprecise:
    it isn’t really the year that causes the change in the other two variables, but
    rather the pandemic.'
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
  zh: 请注意，我们在这里使用了“年份”作为混杂变量，但这有点不精确：真正导致其他两个变量变化的并非年份本身，而是疫情。
- en: 'The pandemic (as measured in this case by the year) affected the data in two
    ways:'
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: 疫情（在本例中以年份衡量）通过两种方式影响了数据：
- en: In 2020, the critics rated a lot more dishes from restaurant A.
  id: totrans-56
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 在 2020 年，评论者对餐厅 A 的菜品评分更多。
- en: In 2020, the critics were much harsher.
  id: totrans-57
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 在 2020 年，评论者要苛刻得多。
- en: When looking at the data separated by year, we can see that they preferred restaurant
    A in both years. But, because of the two factors above, when aggregating the data,
    restaurant A looks worse.
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 当查看按年份分开的数据时，我们可以看到他们在两个年份都更喜欢餐厅 A。但是，由于上述两个因素，在汇总数据时，餐厅 A 看起来更差。
- en: 'Note that despite the name, this isn’t really a paradox: this happens entirely
    because of the confounding factor.'
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: 请注意，尽管名称如此，这并非真正的悖论：这完全是由于混杂因素造成的。
- en: (Optional) Visualizing Simpson’s Paradox with Baker-Kramer Plots[¶](#id-optional-visualizing-simpsons-paradox-with-baker-kramer-plots
    "Link to this Section")
  id: totrans-60
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: （可选）使用 Baker-Kramer 图可视化辛普森悖论[¶](#id-optional-visualizing-simpsons-paradox-with-baker-kramer-plots
    "链接到此部分")
- en: 'We can visualize the percentages in the bullet points above on a graph. Let
    the <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x-axis
    represent the percent of dishes ordered in 2020, during the pandemic (confounding
    variable). Let the <semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y-axis
    represent the proportion of dishes liked (outcome). We’ll draw one line for each
    restaurant: the different lines show us the effect of the treatment.'
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以将上面要点中的百分比可视化在图表上。让 <semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics>x
    轴代表疫情期间（混杂变量）2020 年点菜的百分比。让 <semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics>y
    轴代表喜欢的菜品比例（结果）。我们将为每个餐厅画一条线：不同的线向我们展示了处理的效果。
- en: 'For the data broken down by year, each table shows us data where the proportion
    ordered in 2020 is always 0 (for the 2019 data) or 1 (for the 2020 data). This
    corresponds to the four marked points (two blue circles and two orange squares):'
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: 对于按年份细分的数据，每个表格向我们展示的数据中，2020 年点菜的比例始终为 0（对于 2019 年数据）或 1（对于 2020 年数据）。这对应于四个标记点（两个蓝色圆圈和两个橙色方块）：
- en: <details class="myst-dropdown rounded-md my-5 shadow dark:shadow-2xl dark:shadow-neutral-900
    overflow-hidden bg-gray-50 dark:bg-stone-800"><summary class="myst-dropdown-header
    m-0 text-lg font-medium py-1 min-h-[2em] pl-3 cursor-pointer hover:shadow-[inset_0_0_0px_30px_#00000003]
    dark:hover:shadow-[inset_0_0_0px_30px_#FFFFFF03] bg-gray-100 dark:bg-slate-900">Source</summary>
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: <details class="myst-dropdown rounded-md my-5 shadow dark:shadow-2xl dark:shadow-neutral-900
    overflow-hidden bg-gray-50 dark:bg-stone-800"><summary class="myst-dropdown-header
    m-0 text-lg font-medium py-1 min-h-[2em] pl-3 cursor-pointer hover:shadow-[inset_0_0_0px_30px_#00000003]
    dark:hover:shadow-[inset_0_0_0px_30px_#FFFFFF03] bg-gray-100 dark:bg-slate-900">来源</summary>
- en: '[PRE6]</details> ![<Figure size 300x300 with 1 Axes>](../Images/a33ce6680e4c00a9b3f3364ce1c8d022.png)'
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: '[PRE6]</details> ![<Figure size 300x300 with 1 Axes>](../Images/a33ce6680e4c00a9b3f3364ce1c8d022.png)'
- en: 'This plot shows that the critics prefer Restaurant A (blue line) over Restaurant
    B (orange line). But when we looked at the aggregate data in the first table above,
    we were comparing restaurant A’s dishes, which were mostly from 2020, to restaurant
    B’s dishes, which were mostly from 2019\. This is shown with the large circle/square:'
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
  zh: 该图表显示，评论家们更偏爱餐厅A（蓝线）而非餐厅B（橙线）。但当我们查看上方第一个表格中的汇总数据时，我们实际上是在将餐厅A（其菜品大多来自2020年）与餐厅B（其菜品大多来自2019年）进行比较。这一点通过大圆圈/方块显示出来：
- en: <details class="myst-dropdown rounded-md my-5 shadow dark:shadow-2xl dark:shadow-neutral-900
    overflow-hidden bg-gray-50 dark:bg-stone-800"><summary class="myst-dropdown-header
    m-0 text-lg font-medium py-1 min-h-[2em] pl-3 cursor-pointer hover:shadow-[inset_0_0_0px_30px_#00000003]
    dark:hover:shadow-[inset_0_0_0px_30px_#FFFFFF03] bg-gray-100 dark:bg-slate-900">Source</summary>
  id: totrans-66
  prefs: []
  type: TYPE_NORMAL
  zh: <details class="myst-dropdown rounded-md my-5 shadow dark:shadow-2xl dark:shadow-neutral-900
    overflow-hidden bg-gray-50 dark:bg-stone-800"><summary class="myst-dropdown-header
    m-0 text-lg font-medium py-1 min-h-[2em] pl-3 cursor-pointer hover:shadow-[inset_0_0_0px_30px_#00000003]
    dark:hover:shadow-[inset_0_0_0px_30px_#FFFFFF03] bg-gray-100 dark:bg-slate-900">源代码</summary>
- en: '[PRE7]</details> ![<Figure size 300x300 with 1 Axes>](../Images/0d338de59aa614b382e5b975ed60cbf1.png)'
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
  zh: '[PRE7]</details> ![<Figure size 300x300 with 1 Axes>](../Images/0d338de59aa614b382e5b975ed60cbf1.png)'
- en: 'This plot is called a Baker-Kramer (or B-K) plot: it highlights that even though
    Restaurant A is better than Restaurant B, the confounding effect of the year makes
    Restaurant A look much worse.'
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
  zh: 该图表被称为贝克-克雷默图：它突显了尽管餐厅A优于餐厅B，但年份的混杂效应使得餐厅A看起来差得多。
- en: Berkson’s Paradox and Colliders[¶](#berksons-paradox-and-colliders "Link to
    this Section")
  id: totrans-69
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 伯克森悖论与碰撞因子[¶](#berksons-paradox-and-colliders "Link to this Section")
- en: 'Suppose that a baker decides to put out some of his best loaves of bread on
    display in the front window, to help attract customers. For every batch of bread
    he bakes, he rates the bread in that batch on flavor and appearance (from 1-10).
    There isn’t any correlation between flavor and appearance, so the scores look
    like this:'
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
  zh: 假设一位面包师决定将他最好的几条面包陈列在橱窗里，以帮助吸引顾客。对于他烤制的每一批面包，他都会对该批次面包的风味和外观进行评分（从1到10）。风味和外观之间没有任何相关性，因此评分看起来像这样：
- en: <details class="myst-dropdown rounded-md my-5 shadow dark:shadow-2xl dark:shadow-neutral-900
    overflow-hidden bg-gray-50 dark:bg-stone-800"><summary class="myst-dropdown-header
    m-0 text-lg font-medium py-1 min-h-[2em] pl-3 cursor-pointer hover:shadow-[inset_0_0_0px_30px_#00000003]
    dark:hover:shadow-[inset_0_0_0px_30px_#FFFFFF03] bg-gray-100 dark:bg-slate-900">Source</summary>
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: <details class="myst-dropdown rounded-md my-5 shadow dark:shadow-2xl dark:shadow-neutral-900
    overflow-hidden bg-gray-50 dark:bg-stone-800"><summary class="myst-dropdown-header
    m-0 text-lg font-medium py-1 min-h-[2em] pl-3 cursor-pointer hover:shadow-[inset_0_0_0px_30px_#00000003]
    dark:hover:shadow-[inset_0_0_0px_30px_#FFFFFF03] bg-gray-100 dark:bg-slate-900">源代码</summary>
- en: '[PRE8]</details> ![<Figure size 300x300 with 1 Axes>](../Images/fe691ff6bd903f506fdeda9c0f06caed.png)'
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: '[PRE8]</details> ![<Figure size 300x300 with 1 Axes>](../Images/fe691ff6bd903f506fdeda9c0f06caed.png)'
- en: 'He then decides to add up the flavor and appearance scores: for any batch with
    a combined score greater than 10, he’ll display a loaf from that batch in the
    front window.'
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: 随后，他决定将风味和外观的评分相加：对于任何总分超过10的批次，他都会在橱窗中展示该批次的一条面包。
- en: <details class="myst-dropdown rounded-md my-5 shadow dark:shadow-2xl dark:shadow-neutral-900
    overflow-hidden bg-gray-50 dark:bg-stone-800"><summary class="myst-dropdown-header
    m-0 text-lg font-medium py-1 min-h-[2em] pl-3 cursor-pointer hover:shadow-[inset_0_0_0px_30px_#00000003]
    dark:hover:shadow-[inset_0_0_0px_30px_#FFFFFF03] bg-gray-100 dark:bg-slate-900">Source</summary>
  id: totrans-74
  prefs: []
  type: TYPE_NORMAL
  zh: <details class="myst-dropdown rounded-md my-5 shadow dark:shadow-2xl dark:shadow-neutral-900
    overflow-hidden bg-gray-50 dark:bg-stone-800"><summary class="myst-dropdown-header
    m-0 text-lg font-medium py-1 min-h-[2em] pl-3 cursor-pointer hover:shadow-[inset_0_0_0px_30px_#00000003]
    dark:hover:shadow-[inset_0_0_0px_30px_#FFFFFF03] bg-gray-100 dark:bg-slate-900">源代码</summary>
- en: '[PRE9]</details> ![<Figure size 300x300 with 1 Axes>](../Images/ae4dea2e7611a28464f60f46f7c2c9af.png)'
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: '[PRE9]</details> ![<Figure size 300x300 with 1 Axes>](../Images/ae4dea2e7611a28464f60f46f7c2c9af.png)'
- en: 'At the end of the day, he gives the loaves from the display case (shown in
    blue above) to his friends to eat. His friends notice that there’s a negative
    correlation between appearance and flavor: the loaves that look nicer tend to
    taste worse. When they bring this issue up with the baker, he shows them the first
    graph, and tells them that there isn’t any correlation.'
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: 每天打烊时，他会把展示柜（如上图蓝色部分所示）里的面包送给朋友们吃。他的朋友们注意到外观和风味之间存在负相关：看起来更漂亮的面包往往味道更差。当他们向面包师提出这个问题时，面包师给他们看了第一张图，并告诉他们两者之间没有任何相关性。
- en: Who’s right?
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: 谁是对的？
- en: 'There are some similarities to the earlier example with Simpson’s Paradox:
    we have two variables (flavor/appearance) whose relationship changes when a third
    variable (display) is introduced. But there’s a very important difference here:
    the direction of causality. If we draw a causal graph for these variables, it
    would look like this:'
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: 这与之前辛普森悖论的例子有一些相似之处：我们有两个变量（风味/外观），当引入第三个变量（展示）时，它们之间的关系发生了变化。但这里有一个非常重要的区别：因果关系的方向。如果我们为这些变量绘制因果图，它看起来会是这样：
- en: '![](../Images/87ed3862a25f9f6a7e8df265dcd4c7e3.png)'
  id: totrans-79
  prefs: []
  type: TYPE_IMG
  zh: '![](../Images/87ed3862a25f9f6a7e8df265dcd4c7e3.png)'
- en: 'Because the direction of causality is different, display isn’t a confounder
    here: we instead call it a **collider**.'
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
  zh: 由于因果关系的方向不同，展示柜在这里不是一个混杂因素：我们反而称其为**碰撞因子**。
- en: If we include colliders such as this one in our analyses, we’re likely to draw
    incorrect conclusions. Here, the association observed by the baker’s friends does
    not reflect any causal relationship between flavor and appearance, but instead
    only is caused by how the baker chooses which loaves go into the display case.
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们在分析中包含此类碰撞因子，就很可能得出错误的结论。在这里，面包师朋友们观察到的关联并不反映风味和外观之间的任何因果关系，而仅仅是由面包师如何选择哪些面包放入展示柜所导致的。
- en: '[PRE10]'
  id: totrans-82
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: More Examples[¶](#more-examples "Link to this Section")
  id: totrans-83
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 更多示例[¶](#more-examples "链接至此章节")
- en: 'Berkeley graduate admissions: The [Patterns, Predictions, and Actions](https://mlstory.org/causal.html#the-limitations-of-observation)
    book has an excellent discussion of this well-known case of Simpson’s Paradox.'
  id: totrans-84
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 伯克利研究生录取案例：《[模式、预测与行动](https://mlstory.org/causal.html#the-limitations-of-observation)》一书对这个著名的辛普森悖论案例有精彩的讨论。
- en: Simpson’s Paradox also shows up in sports (e.g., [basketball](http://www.math.kent.edu/~darci/simpson/bballexamples.html)
    and [tennis](https://metro.co.uk/2014/01/17/roger-federer-is-rubbish-at-tennis-because-he-tries-too-hard-4264338/)),
    [physics](https://doi.org/10.1063/1.4977784), [COVID-19 mortality rates](http://causality.cs.ucla.edu/blog/index.php/2020/07/06/race-covid-mortality-and-simpsons-paradox-by-dana-mackenzie/),
    and much more.
  id: totrans-85
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 辛普森悖论也出现在体育领域（例如，[篮球](http://www.math.kent.edu/~darci/simpson/bballexamples.html)和[网球](https://metro.co.uk/2014/01/17/roger-federer-is-rubbish-at-tennis-because-he-tries-too-hard-4264338/)）、[物理学](https://doi.org/10.1063/1.4977784)、[COVID-19死亡率](http://causality.cs.ucla.edu/blog/index.php/2020/07/06/race-covid-mortality-and-simpsons-paradox-by-dana-mackenzie/)等许多方面。
- en: 'Continuous data: *coming soon*'
  id: totrans-86
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 连续数据：*即将推出*
- en: References
  id: totrans-87
  prefs: []
  type: TYPE_NORMAL
  zh: 参考文献
- en: Selvitella, A. (2017). The Simpson’s paradox in quantum mechanics. *Journal
    of Mathematical Physics*, *58*(3). [10.1063/1.4977784](https://doi.org/10.1063/1.4977784)
  id: totrans-88
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: Selvitella, A. (2017). 量子力学中的辛普森悖论。《数学物理杂志》，*58*(3)。[10.1063/1.4977784](https://doi.org/10.1063/1.4977784)
